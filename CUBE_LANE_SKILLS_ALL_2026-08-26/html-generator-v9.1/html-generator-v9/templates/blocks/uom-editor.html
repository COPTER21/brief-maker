<!-- BLOCK: uom-editor — compound widget อัตราแปลง (#77/#79) ลอกแล้ว bind
     Progressive: ยังไม่เลือกหน่วยฐาน → แสดงเฉพาะ prompt (ห้าม render แถวสมการ placeholder)
     เลือกแล้ว → แถวสมการ + example callout · role chips มีสี semantic ไม่ใช่ outline เทา -->
<div class="uom-editor">
  <!-- state A: ยังไม่เลือกฐาน -->
  <div class="uom-empty" style="padding:16px;border:1px dashed var(--c-line);border-radius:10px;
       color:var(--c-mute-2);font-size:12px;display:flex;align-items:center;gap:8px">
    <i data-lucide="scale"></i> เลือกหน่วยฐานก่อน แล้วจึงเพิ่มหน่วยใหญ่ (แพ็ค/ลัง)
  </div>
  <!-- state B: มีข้อมูล (ตัวอย่าง bind แล้ว) -->
  <div class="conv-row" style="display:flex;align-items:center;gap:8px;padding:10px 12px;
       border:1px solid var(--c-line-2);border-radius:10px">
    <span class="mono">1</span>
    <select class="select" style="width:150px"><option>BOX · กล่อง</option></select>
    <span class="mono">=</span>
    <input class="input" style="width:90px;text-align:right" value="12">
    <span style="font-size:12px;color:var(--c-mute)">ชิ้น (หน่วยฐาน)</span>
    <span style="margin-left:auto;display:flex;gap:6px">
      <span class="pill" style="background:#E6F0FF;color:#1A5FCC">ซื้อ</span>
      <span class="pill" style="background:var(--pass-bg);color:var(--pass-tx)">ขาย</span>
      <span class="pill" style="background:var(--warn-bg);color:#B8690B">เก็บสต๊อก</span>
      <button class="btn-icon" aria-label="ลบ"><i data-lucide="trash-2"></i></button>
    </span>
  </div>
  <button class="btn btn-ghost btn-sm"><i data-lucide="plus"></i> เพิ่มหน่วยใหญ่ (เช่น แพ็ค / ลัง)</button>
  <!-- example callout: ตัวเลขจริงจาก mock (#77) -->
  <div class="note" style="background:var(--c-bg-off);border:1px solid var(--c-line-2);
       border-radius:10px;padding:10px 12px;font-size:12px;color:var(--c-mute)">
    ตัวอย่าง — ถ้ามี <b>144 ชิ้น</b> ในคลัง ระบบมองเป็น <b>12 BOX</b> · ขาย 1 BOX = ตัดสต๊อก 12 ชิ้นอัตโนมัติ
  </div>
</div>
