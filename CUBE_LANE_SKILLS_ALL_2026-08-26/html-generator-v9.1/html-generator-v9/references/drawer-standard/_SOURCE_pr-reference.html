      if (!r) { c.innerHTML = '<div style="padding: 24px;">ไม่พบข้อมูล</div>'; return; }
      const selectedBr = mockBudgets.find(b => b.br_no === r.br_no);

      c.innerHTML = `
        <div style="padding: 18px 24px 12px; border-bottom: 1px solid var(--c-border-soft); flex-shrink: 0;">
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;">
            <div>
              <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--c-text-mute); margin-bottom: 4px;">ใบขอซื้อ (Purchase Requisition)</div>
              <div style="display: flex; align-items: center; gap: 10px;">
                <h2 style="font-size: 20px; font-weight: 700; color: var(--c-primary);" class="tbl-mono">${r.pr_no}</h2>
                ${renderPill(r.status)}
              </div>
              <div style="font-size: 13px; margin-top: 4px; color: var(--c-text-mute);">${r.requester} · ${r.dept}</div>
            </div>
            <div style="display: flex; align-items: center; gap: 6px;">
              ${r.status === 'draft' ? `
                <button onclick="confirmCancel('${r.id}')" class="btn btn-link" style="color: var(--c-danger); font-weight: 600;">ยกเลิก</button>
                <button onclick="showToast('เปิดหน้าแก้ไข (mock)', 'info')" class="btn btn-secondary">
                  <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                  <span>แก้ไข</span>
                </button>
                <button onclick="approveAction('${r.id}','submit')" class="btn btn-primary">
                  <i data-lucide="send" class="w-3.5 h-3.5"></i>
                  <span>ส่งอนุมัติ</span>
                </button>
                <div style="width: 1px; height: 22px; background: var(--c-border); margin: 0 4px;"></div>
              ` : ''}
              ${r.status === 'pending' ? `
                <button onclick="approveAction('${r.id}','reject')" class="btn btn-link" style="color: var(--c-danger); font-weight: 600;">ปฏิเสธ</button>
                <button onclick="approveAction('${r.id}','return')" class="btn btn-secondary">ส่งคืนแก้ไข</button>
                <button onclick="approveAction('${r.id}','approve')" class="btn btn-success">
                  <i data-lucide="check" class="w-3.5 h-3.5"></i>
                  <span>อนุมัติ</span>
                </button>
                <div style="width: 1px; height: 22px; background: var(--c-border); margin: 0 4px;"></div>
              ` : ''}
              ${r.status === 'approved' && r.ordered_pct < 100 ? `
                <button onclick="showToast('สร้าง CP จาก PR (mock)', 'success')" class="btn btn-primary">
                  <i data-lucide="scale" class="w-3.5 h-3.5"></i>
                  <span>สร้าง CP</span>
                </button>
                <div style="width: 1px; height: 22px; background: var(--c-border); margin: 0 4px;"></div>
              ` : ''}
              <button class="top-icon-btn" title="พิมพ์"><i data-lucide="printer" class="w-4 h-4"></i></button>
              <button class="top-icon-btn" title="ดาวน์โหลด PDF"><i data-lucide="download" class="w-4 h-4"></i></button>
              <button onclick="closeViewDrawer()" class="top-icon-btn"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
          </div>

          <div class="tabs" style="margin-top: 14px; margin-bottom: 0;">
            ${tabBtn('detail', 'รายละเอียด', 'file-text')}
            ${tabBtn('pdf', 'PDF Preview', 'file')}
            ${tabBtn('signatures', 'ลายเซ็น', 'pen-tool')}
          </div>
        </div>

        <div style="flex: 1; overflow-y: auto; padding: 20px 24px;">
          ${viewState.tab === 'detail' ? renderDetailTab(r, selectedBr) : ''}
          ${viewState.tab === 'pdf' ? renderPdfTab(r, selectedBr) : ''}
          ${viewState.tab === 'signatures' ? renderSignaturesTab(r) : ''}

        <div style="padding: 12px 24px; border-top: 1px solid var(--c-border-soft); background: var(--c-off-white); flex-shrink: 0; display: flex; align-items: center;">
          <div style="font-size: 11px; color: var(--c-text-soft);">แก้ไขล่าสุด ${formatThaiDate(r.updated_at)} 14:35</div>
        </div>
      `;
      renderIcons();
    }

    function tabBtn(key, label, icon) {

                    ${s.signed ? `<span class="pill approved">ลงนามแล้ว</span>` : `<span class="pill pending">รอลงนาม</span>`}
                  </div>
                  <div style="font-weight: 600; color: var(--c-navy);">${s.name}</div>
                  <div style="font-size: 13px; color: var(--c-text-mute);">${s.position}</div>
                  ${s.date ? `<div style="font-size: 11px; margin-top: 4px; color: var(--c-text-soft);">ลงนามเมื่อ ${s.date}</div>` : ''}
                </div>
                ${!s.signed ? `<button class="btn btn-primary sm" style="align-self: center;"><i data-lucide="pen-tool" class="w-3.5 h-3.5"></i><span>ลงนาม</span></button>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function approveAction(id, kind) {
      const r = state.records.find(x => x.id === id);
      if (!r) return;
      if (kind === 'submit') { r.status = 'pending'; showToast(`ส่ง ${r.pr_no} เพื่ออนุมัติแล้ว`, 'success'); }
      if (kind === 'approve') { r.status = 'approved'; showToast(`อนุมัติ ${r.pr_no} เรียบร้อย`, 'success'); }
      if (kind === 'reject')  { r.status = 'rejected'; showToast(`ปฏิเสธ ${r.pr_no}`, 'error'); }
      if (kind === 'return')  { r.status = 'draft';    showToast(`ส่งคืน ${r.pr_no} เพื่อแก้ไข`, 'info'); }
      r.updated_at = new Date().toISOString().slice(0,10);
      if (getRoute().name === 'view') renderViewDrawer();
      else renderTableOnly();
    }

    // ============================================================
    //  CANCEL/DELETE MODAL
    // ============================================================
    function confirmCancel(id) {
      const r = state.records.find(x => x.id === id);
      if (!r) return;
      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.innerHTML = `
        <div class="backdrop" onclick="this.parentElement.remove();"></div>
        <div class="card" style="position: relative; max-width: 480px; width: 100%; box-shadow: var(--sh-xl);">
          <div style="padding: 18px; border-bottom: 1px solid var(--c-border-soft); display: flex; align-items: flex-start; gap: 12px;">
            <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--c-danger-08); display: grid; place-items: center; flex-shrink: 0;">
              <i data-lucide="alert-triangle" class="w-5 h-5" style="color: var(--c-danger);"></i>
            </div>
            <div>
              <h3 style="font-size: 14px; font-weight: 700; color: var(--c-navy);">ลบใบขอซื้อ ${r.pr_no}?</h3>
              <p style="font-size: 13px; margin-top: 4px; color: var(--c-text-mute);">การลบจะไม่สามารถย้อนกลับได้ กรุณาระบุเหตุผลด้านล่าง</p>
            </div>
          </div>
          <div style="padding: 18px;">
            <label style="display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--c-navy);">เหตุผลในการลบ <span style="color: var(--c-danger);">*</span></label>
            <textarea id="cancelReason" rows="3" placeholder="ระบุเหตุผล..." class="input" style="height: auto; padding: 10px 12px; resize: vertical;"></textarea>
          </div>
          <div style="padding: 12px 18px; background: var(--c-off-white); border-top: 1px solid var(--c-border-soft); display: flex; align-items: center; justify-content: flex-end; gap: 8px; border-radius: 0 0 var(--r-lg) var(--r-lg);">
            <button onclick="this.closest('.modal-overlay').remove();" class="btn btn-ghost">ปิด</button>
            <button onclick="(function(){
              const reason=document.getElementById('cancelReason').value.trim();
              if(!reason){ showToast('กรุณาระบุเหตุผล','warning'); return; }
              const rec=state.records.find(x=>x.id==='${id}');
              rec.status='cancelled'; rec.updated_at=new Date().toISOString().slice(0,10);
              showToast('ลบ ' + rec.pr_no + ' เรียบร้อย','success');
              document.querySelectorAll('.modal-overlay').forEach(n=>n.remove());
              if(getRoute().name==='view') closeViewDrawer(); else renderTableOnly();
            })()" class="btn btn-danger">
              <i data-lucide="trash" class="w-4 h-4"></i>
              <span>ยืนยันลบ</span>
            </button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      renderIcons();
    }

    // ============================================================
    //  SHARED HELPERS
    // ============================================================
    function closeAllOverlays() { document.getElementById('overlay-root').innerHTML = ''; }

    function renderPill(status) {
      const labels = { draft: 'ฉบับร่าง', pending: 'รออนุมัติ', approved: 'อนุมัติแล้ว', rejected: 'ปฏิเสธ', cancelled: 'ยกเลิก' };
      const cls = ['draft','pending','approved','rejected','cancelled'].includes(status) ? status : 'draft';
      return `<span class="pill ${cls}">${labels[status] || status}</span>`;
    }

    function formatMoney(n) {
      const x = Number(n) || 0;
      return x.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatThaiDate(d) {
      if (!d) return '';
      const [y, m, day] = d.split('-').map(Number);
      const buddhist = (y + 543);
      return `${day}/${m}/${buddhist}`;
    }

    function showToast(message, type = 'success') {
      const colors = { success: 'var(--c-teal)', error: 'var(--c-danger)', warning: 'var(--c-warning)', info: 'var(--c-primary)' };
      const icons = { success: 'check-circle-2', error: 'x-circle', warning: 'alert-triangle', info: 'info' };
      const t = document.createElement('div');
      t.className = 'animate-slide-in';
      t.style.cssText = `background: ${colors[type]}; color: white; padding: 10px 14px; border-radius: var(--r); box-shadow: var(--sh-lg); display: flex; align-items: center; gap: 10px; min-width: 280px; font-size: 13px;`;
      t.innerHTML = `<i data-lucide="${icons[type]}" class="w-4 h-4"></i><span>${message}</span>`;
      document.getElementById('toast-root').appendChild(t);
      renderIcons();
      setTimeout(() => { t.style.transition = 'opacity 200ms'; t.style.opacity = '0'; setTimeout(() => t.remove(), 200); }, 2800);
    }
  </script>
</body>
</html>
