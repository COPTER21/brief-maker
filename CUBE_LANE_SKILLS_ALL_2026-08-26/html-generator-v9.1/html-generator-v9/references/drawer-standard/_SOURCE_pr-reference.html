<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ใบขอซื้อ (PR) — Procurement</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js" defer></script>
  <style>
    /* ============================================================
       CUBE NATIVE Admin CI v2 — Design Tokens
       ============================================================ */
    :root {
      --c-navy:        #111111;
      --c-navy-d:      #06122A;
      --c-primary:     #FF3B30;
      --c-primary-h:   #0a4ed1;
      --c-teal:        #FF9A1F;
      --c-slate:       #73757B;
      --c-off-white:   #FAF8F5;
      --c-white:       #FFFFFF;
      --c-border:      #E9E5E0;
      --c-border-soft: #EEF2F7;
      --c-text:        #111111;
      --c-text-mute:   #73757B;
      --c-text-soft:   #9A9CA2;
      --c-warning:     #F59E0B;
      --c-danger:      #EF4444;
      --c-purple:      #7C3AED;
      --c-primary-08:  rgba(255,59,48, 0.08);
      --c-primary-12:  rgba(255,59,48, 0.12);
      --c-primary-18:  rgba(255,59,48, 0.18);
      --c-teal-08:     rgba(255,154,31, 0.08);
      --c-warning-08:  rgba(245, 158, 11, 0.10);
      --c-danger-08:   rgba(239, 68, 68, 0.10);
      --r-sm: 6px;
      --r:    10px;
      --r-lg: 14px;
      --sh-sm: 0 1px 2px rgba(17,17,17, 0.04), 0 1px 3px rgba(17,17,17, 0.06);
      --sh-md: 0 4px 8px rgba(17,17,17, 0.04), 0 2px 4px rgba(17,17,17, 0.06);
      --sh-lg: 0 10px 30px rgba(17,17,17, 0.08), 0 4px 10px rgba(17,17,17, 0.04);
      --sh-xl: 0 24px 60px rgba(17,17,17, 0.10), 0 8px 24px rgba(17,17,17, 0.06);
      --sw: 224px;
      --hh: 52px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Satoshi', 'Noto Sans Thai', -apple-system, sans-serif;
      font-size: 13px;
      line-height: 1.55;
      background: var(--c-off-white);
      color: var(--c-text);
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4, .display { font-family: 'Satoshi', 'Noto Sans Thai', sans-serif; letter-spacing: -0.015em; font-weight: 700; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }
    input, select, textarea { font-family: inherit; }
    .num { font-variant-numeric: tabular-nums; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--c-border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--c-text-soft); }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

    /* ============================================================
       SHELL — Sidebar (224px flat) + Main + Topbar (52px white)
       ============================================================ */
    .shell { display: grid; grid-template-columns: var(--sw) 1fr; min-height: 100vh; }

    .sb {
      background: var(--c-navy-d);
      color: white;
      height: 100vh;
      position: sticky; top: 0;
      display: flex; flex-direction: column;
      border-right: 1px solid rgba(255,255,255,0.05);
      overflow: hidden;
    }
    .sb-logo {
      padding: 16px 18px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .sb-logo-mark {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--c-primary), var(--c-teal));
      border-radius: var(--r-sm);
      display: grid; place-items: center;
      flex-shrink: 0;
      color: white;
    }
    .sb-logo-text { line-height: 1.2; min-width: 0; }
    .sb-logo-title { font-size: 13px; font-weight: 700; color: white; }
    .sb-logo-sub {
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 1px;
    }

    .sb-menu { flex: 1; overflow-y: auto; padding: 10px 0; }
    .sb-menu::-webkit-scrollbar { width: 4px; }
    .sb-menu::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }

    .sb-section { padding: 6px 0; }
    .sb-section-label {
      padding: 6px 18px 4px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
    }

    .sb-item {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 18px;
      color: rgba(255,255,255,0.72);
      font-size: 13px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.12s;
      text-decoration: none;
    }
    .sb-item:hover { background: rgba(255,255,255,0.05); color: white; }
    .sb-item.active {
      background: var(--c-primary-18);
      border-left-color: var(--c-primary);
      color: white;
      font-weight: 600;
    }
    .sb-icon { flex-shrink: 0; opacity: 0.8; display: grid; place-items: center; }
    .sb-item.active .sb-icon { opacity: 1; color: var(--c-primary); }

    .sb-badge {
      margin-left: auto;
      background: var(--c-danger);
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 999px;
      line-height: 1.4;
    }
    .sb-badge.muted { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.7); }

    .sb-foot {
      padding: 12px 18px;
      border-top: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
      font-size: 10px;
      color: rgba(255,255,255,0.4);
    }
    .sb-foot div + div { margin-top: 2px; }

    /* MAIN */
    .main { display: flex; flex-direction: column; min-width: 0; background: var(--c-off-white); }

    /* TOPBAR — White */
    .top {
      height: var(--hh);
      background: var(--c-white);
      border-bottom: 1px solid var(--c-border-soft);
      padding: 0 22px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px;
      position: sticky; top: 0; z-index: 50;
    }
    .top-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .top-bc { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--c-text); }
    .bc-root { color: var(--c-text-mute); cursor: pointer; transition: color 120ms; }
    .bc-root:hover { color: var(--c-primary); }
    .bc-sep { color: var(--c-text-soft); margin: 0 2px; }
    .bc-leaf { font-weight: 600; }

    .top-right { display: flex; align-items: center; gap: 12px; }
    .top-user {
      display: flex; align-items: center; gap: 10px;
      padding: 4px 4px 4px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 120ms;
    }
    .top-user:hover { background: var(--c-off-white); }
    .top-user-info {
      display: flex; flex-direction: column;
      align-items: flex-end;
      line-height: 1.2;
    }
    .top-user-name { font-size: 12.5px; font-weight: 600; color: var(--c-navy); }
    .top-user-role { font-size: 10.5px; color: var(--c-text-mute); margin-top: 2px; }
    .top-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--c-primary), var(--c-teal));
      color: white;
      font-size: 12px; font-weight: 700;
      display: grid; place-items: center;
      flex-shrink: 0;
      box-shadow: 0 1px 3px rgba(255,59,48,0.25);
    }

    /* Icon button (used in drawer headers — printer/download/close) */
    .top-icon-btn {
      width: 32px; height: 32px;
      background: var(--c-off-white);
      border: 1px solid var(--c-border);
      border-radius: var(--r);
      cursor: pointer;
      display: grid; place-items: center;
      color: var(--c-text-mute);
      position: relative;
      transition: all 120ms;
    }
    .top-icon-btn:hover { color: var(--c-text); border-color: var(--c-text-soft); background: var(--c-white); }

    /* PAGE */
    .page { flex: 1; padding: 22px 24px 40px; overflow-y: auto; }

    /* PAGE HEAD */
    .ph {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-bottom: 18px;
      gap: 16px; flex-wrap: wrap;
    }
    .ph-left { min-width: 0; }
    .ph-title { font-size: 22px; font-weight: 700; color: var(--c-navy); line-height: 1.2; }
    .ph-sub { font-size: 13px; color: var(--c-text-mute); margin-top: 4px; }
    .ph-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    /* ============================================================
       BUTTON SYSTEM
       ============================================================ */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px;
      padding: 0 14px;
      height: 34px;
      border-radius: var(--r);
      font-size: 12.5px;
      font-weight: 600;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      background: transparent;
      color: var(--c-text);
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
    }
    .btn:focus-visible { outline: 2px solid var(--c-primary); outline-offset: 2px; }
    .btn:disabled { cursor: not-allowed; opacity: 0.6; }
    .btn.lg { height: 38px; padding: 0 18px; font-size: 13px; }
    .btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
    .btn-primary    { background: var(--c-primary); color: white; border-color: var(--c-primary); }
    .btn-primary:hover:not(:disabled) { background: var(--c-primary-h); border-color: var(--c-primary-h); }
    .btn-secondary  { background: var(--c-white); color: var(--c-navy); border-color: var(--c-border); }
    .btn-secondary:hover:not(:disabled) { border-color: var(--c-text-soft); }
    .btn-ghost      { background: transparent; color: var(--c-text-mute); }
    .btn-ghost:hover:not(:disabled) { background: var(--c-off-white); color: var(--c-text); }
    .btn-success    { background: var(--c-teal); color: white; border-color: var(--c-teal); }
    .btn-success:hover:not(:disabled) { background: #00876F; border-color: #00876F; }
    .btn-danger     { background: var(--c-danger); color: white; border-color: var(--c-danger); }
    .btn-danger:hover:not(:disabled) { background: #E62E24; }
    .btn-link       { background: transparent; color: var(--c-primary); padding: 0; height: auto; font-weight: 600; }
    .btn-link:hover { text-decoration: underline; }

    /* ============================================================
       PILL / BADGE
       ============================================================ */
    .pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.02em; line-height: 1.6;
      white-space: nowrap;
    }
    .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .pill.draft     { background: rgba(100,116,139,0.12); color: var(--c-slate); }
    .pill.pending   { background: var(--c-warning-08);    color: #B8690B; }
    .pill.approved  { background: var(--c-teal-08);       color: var(--c-teal); }
    .pill.rejected  { background: var(--c-danger-08);     color: var(--c-danger); }
    .pill.cancelled { background: rgba(100,116,139,0.12); color: var(--c-slate); }

    /* ============================================================
       CARD
       ============================================================ */
    .card {
      background: var(--c-white);
      border: 1px solid var(--c-border);
      border-radius: var(--r-lg);
      overflow: hidden;
    }
    .card-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--c-border-soft);
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .card-title { font-size: 14px; font-weight: 700; color: var(--c-navy); }
    .card-body { padding: 16px 18px; }
    .card-body.flush { padding: 0; }

    /* ============================================================
       INPUT / SELECT
       ============================================================ */
    .input, .select {
      height: 34px;
      background: var(--c-white);
      border: 1px solid var(--c-border);
      border-radius: var(--r);
      padding: 0 12px;
      font-size: 13px;
      color: var(--c-text);
      transition: all 0.15s;
      width: 100%;
    }
    .input::placeholder { color: var(--c-text-soft); }
    .input:focus, .select:focus {
      outline: none;
      border-color: var(--c-primary);
      box-shadow: 0 0 0 3px var(--c-primary-12);
    }
    label.required::after { content: ' *'; color: var(--c-danger); }

    /* ============================================================
       TABS
       ============================================================ */
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--c-border); margin-bottom: 16px; }
    .tab {
      background: transparent; border: none;
      border-bottom: 2px solid transparent;
      padding: 8px 14px;
      font-size: 13px; font-weight: 500; color: var(--c-text-mute);
      cursor: pointer; margin-bottom: -1px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .tab:hover { color: var(--c-text); }
    .tab.on { color: var(--c-primary); border-bottom-color: var(--c-primary); font-weight: 600; }

    /* ============================================================
       TABLE
       ============================================================ */
    .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tbl th {
      text-align: left; padding: 10px 14px;
      font-size: 10.5px; font-weight: 700;
      color: var(--c-text-mute);
      background: var(--c-off-white);
      border-bottom: 1px solid var(--c-border);
      text-transform: uppercase; letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .tbl td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--c-border-soft);
      color: var(--c-text);
      vertical-align: middle;
    }
    .tbl tbody tr { transition: background 0.1s; cursor: pointer; }
    .tbl tbody tr:hover { background: var(--c-off-white); }
    .tbl tbody tr:last-child td { border-bottom: none; }
    .tbl-name { font-weight: 600; color: var(--c-navy); }
    .tbl-meta { font-size: 11px; color: var(--c-text-mute); margin-top: 1px; }
    .tbl-mono { font-family: ui-monospace, monospace; font-size: 12px; }
    .tbl-num { font-variant-numeric: tabular-nums; text-align: right; }
    .tbl-th-sortable { cursor: pointer; user-select: none; }
    .tbl-th-sortable:hover { color: var(--c-text); }

    /* Progress bar */
    .progress-bar {
      width: 64px; height: 6px;
      background: var(--c-border-soft);
      border-radius: 999px;
      overflow: hidden;
      display: inline-block;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--c-teal);
      border-radius: 999px;
      transition: width 200ms;
    }
    .progress-bar-fill.pending { background: var(--c-warning); }
    .progress-bar-fill.zero { background: var(--c-border); }

    /* ============================================================
       STEPPER
       ============================================================ */
    .stepper { display: flex; align-items: flex-start; gap: 0; width: 100%; }
    .stepper-item {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      position: relative; min-width: 0;
    }
    .stepper-circle {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600;
      background: var(--c-white); color: var(--c-text-soft);
      border: 2px solid var(--c-border);
      transition: all 200ms; z-index: 2;
    }
    .stepper-item.active .stepper-circle {
      background: var(--c-primary); color: white; border-color: var(--c-primary);
      box-shadow: 0 0 0 4px var(--c-primary-12);
    }
    .stepper-item.done .stepper-circle {
      background: var(--c-primary); color: white; border-color: var(--c-primary);
    }
    .stepper-label {
      margin-top: 8px; font-size: 12px; font-weight: 500;
      color: var(--c-text-soft); text-align: center; line-height: 1.3;
      transition: color 200ms;
    }
    .stepper-item.active .stepper-label { color: var(--c-navy); font-weight: 600; }
    .stepper-item.done .stepper-label { color: var(--c-text-mute); }
    .stepper-item:not(:last-child)::after {
      content: ''; position: absolute;
      top: 15px; left: 50%; right: -50%; height: 2px;
      background: var(--c-border); z-index: 1;
    }
    .stepper-item.done:not(:last-child)::after { background: var(--c-primary); }

    /* ============================================================
       DRAWER + MODAL — Self-contained CSS (don't depend on Tailwind utilities)
       ============================================================ */
    .overlay-wrap { position: fixed; inset: 0; z-index: 50; }
    .backdrop { position: absolute; inset: 0; background-color: rgba(0,0,0,0.45); cursor: pointer; }
    .drawer-panel {
      position: absolute; right: 0; top: 0;
      height: 100%; width: 100%;
      max-width: 920px;
      background: white;
      box-shadow: var(--sh-xl);
      display: flex; flex-direction: column;
    }
    .drawer-panel.standard { max-width: 680px; }
    .modal-overlay {
      position: fixed; inset: 0; z-index: 60;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .hidden { display: none !important; }

    .drawer-enter { transform: translateX(100%); }
    .drawer-active { transform: translateX(0); transition: transform 250ms ease-out; }

    @keyframes slide-in { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .animate-slide-in { animation: slide-in 200ms ease-out; }

    /* Slide-down animation for expandable line panel (Pattern E) */
    @keyframes line-expand-slide {
      from {
        opacity: 0;
        transform: translateY(-8px);
        max-height: 0;
      }
      to {
        opacity: 1;
        transform: translateY(0);
        max-height: 600px;
      }
    }
    @keyframes line-collapse-slide {
      from {
        opacity: 1;
        transform: translateY(0);
        max-height: 600px;
      }
      to {
        opacity: 0;
        transform: translateY(-8px);
        max-height: 0;
      }
    }
    .line-expand-panel {
      animation: line-expand-slide 220ms cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: top;
      overflow: hidden;
    }
    .line-collapse-panel {
      animation: line-collapse-slide 200ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
      transform-origin: top;
      overflow: hidden;
    }

    /* ============================================================
       UPLOAD ZONE
       ============================================================ */
    .upload-zone {
      border: 2px dashed var(--c-border);
      border-radius: var(--r-lg);
      padding: 32px 16px;
      text-align: center;
      background: #FAFBFD;
      cursor: pointer;
      transition: all 150ms;
    }
    .upload-zone:hover { border-color: var(--c-primary); background: var(--c-primary-08); }
    .upload-zone.has-files { padding: 16px; }

    /* ============================================================
       FORM GRID
       ============================================================ */
    .form-grp {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 14px 18px;
    }
    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-field label {
      font-size: 12.5px; font-weight: 500; color: var(--c-navy);
      display: flex; align-items: center; gap: 4px;
    }
    .form-field-help {
      font-size: 11px; color: var(--c-text-soft);
      display: flex; align-items: center; gap: 4px;
    }

    /* Toggle */
    .toggle {
      position: relative; display: inline-block;
      width: 36px; height: 20px;
      flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--c-border);
      border-radius: 20px;
      transition: 200ms;
    }
    .toggle-slider::before {
      position: absolute; content: '';
      height: 14px; width: 14px;
      left: 3px; bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 200ms;
    }
    .toggle input:checked + .toggle-slider { background-color: var(--c-primary); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(16px); }

    /* Section divider for wizard step 2 */
    .section-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px;
      background: var(--c-off-white);
      border: 1px solid var(--c-border);
      border-radius: var(--r);
      margin-bottom: 10px;
    }
    .section-label { font-size: 13px; font-weight: 500; color: var(--c-navy); display: flex; align-items: center; gap: 8px; }

    mark { background: #FFF1DD; color: var(--c-navy); border-radius: 2px; padding: 0 2px; }
  </style>
</head>
<body>
  <!-- ============================================================
       APP SHELL
       ============================================================ -->
  <div class="shell">
    <!-- SIDEBAR -->
    <aside class="sb">
      <div class="sb-logo">
        <div class="sb-logo-mark">
          <i data-lucide="box" class="w-4 h-4"></i>
        </div>
        <div class="sb-logo-text">
          <div class="sb-logo-title">CUBE ERP</div>
          <div class="sb-logo-sub">2BSimple</div>
        </div>
      </div>

      <nav class="sb-menu">
        <div class="sb-section">
          <a class="sb-item" href="#/home">
            <span class="sb-icon"><i data-lucide="home" class="w-4 h-4"></i></span>
            หน้าหลัก
          </a>
          <a class="sb-item" href="#/inbox">
            <span class="sb-icon"><i data-lucide="inbox" class="w-4 h-4"></i></span>

    // ============================================================
    //  ROUTER
    // ============================================================
    function getRoute() {
      const h = location.hash.slice(2);
      if (!h) return { name: 'list' };
      const parts = h.split('/');
      if (parts[0] === 'list') return { name: 'list' };
      if (parts[0] === 'create') return { name: 'create' };
      if (parts[0] === 'view' && parts[1]) return { name: 'view', id: parts[1] };
      return { name: 'list' };
    }
    function navigate(path) { location.hash = '#/' + path; }
    window.addEventListener('hashchange', render);

    // ============================================================
    //  SAFE LUCIDE WRAPPER + RESILIENT BOOT
    // ============================================================
    function renderIcons() {
      if (typeof lucide !== 'undefined' && lucide.createIcons) {
        try { lucide.createIcons(); } catch (e) { /* ignore */ }
      } else {
        setTimeout(renderIcons, 50);
      }
    }
    function boot() {
      if (window.__prBooted) return;
      window.__prBooted = true;
      try {
        seedRecords();
        render();
      } catch (e) {
        document.getElementById('page-content').innerHTML =
          '<div style="padding:32px;color:#EF4444;">Boot error: ' + (e.message || e) + '</div>';
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else { boot(); }
    setTimeout(boot, 1500);

    // ============================================================
    //  RENDER ENTRY
    // ============================================================
    function render() {
      const route = getRoute();
      document.getElementById('page-content').innerHTML = renderListPage();
      closeAllOverlays();
      if (route.name === 'create') {
        openCreateDrawer();
      } else if (route.name === 'view') {
        openViewDrawer(route.id);
      }
      requestAnimationFrame(renderIcons);
    }

    function getFilteredRecords() {
      let res = [...state.records];
      if (state.filters.search) {
        const q = state.filters.search.toLowerCase();
        res = res.filter(r =>
          r.pr_no.toLowerCase().includes(q) ||
          r.requester.toLowerCase().includes(q) ||
          r.dept.toLowerCase().includes(q) ||
          (r.br_no || '').toLowerCase().includes(q)
        );
      }
      if (state.filters.status !== 'all') res = res.filter(r => r.status === state.filters.status);
      if (state.filters.type !== 'all') res = res.filter(r => r.type === state.filters.type);
      if (state.filters.budget !== 'all') {
        if (state.filters.budget === 'yes') res = res.filter(r => r.br_no);
        if (state.filters.budget === 'no') res = res.filter(r => !r.br_no);
      }
      const { key, dir } = state.sort;
      res.sort((a, b) => {
        const av = a[key], bv = b[key];
        if (av < bv) return dir === 'asc' ? -1 : 1;
        if (av > bv) return dir === 'asc' ? 1 : -1;
        return 0;
      });
      return res;
    }
    function getPaginatedRecords() {
      const filtered = getFilteredRecords();
      const start = (state.pagination.page - 1) * state.pagination.pageSize;
      return { items: filtered.slice(start, start + state.pagination.pageSize), total: filtered.length };
    }
    function getPageInfo() {
      const filtered = getFilteredRecords();
      if (filtered.length === 0) return '0 รายการ';
      const start = (state.pagination.page - 1) * state.pagination.pageSize + 1;
      const end = Math.min(start + state.pagination.pageSize - 1, filtered.length);
      return `${start} – ${end} จาก ${filtered.length} รายการ`;
    }

    function createBlankLine() {
      return {
        id: 'L' + Date.now() + Math.random().toString(36).slice(2, 5),
        item_code: '',

        qty: 1,
        unit: '-',
        unit_price: 0,

        note: '',

    // Migrate legacy lines (vat_enabled/net_enabled) to vat_mode
    function migrateLine(l) {
      if (l.vat_mode) return l;  // already migrated
      let mode = 'none';
      if (l.vat_enabled && l.net_enabled) mode = 'included';
      else if (l.vat_enabled) mode = 'add';
      l.vat_mode = mode;
      return l;
    }

    // Calculate VAT for a line based on vat_mode
    // Returns { vatAmount, lineTotal }
    //   none      → no VAT, line = subtotal after discount
    //   add       → VAT added on top, line = subtotal × (1 + vat%)
    //   included  → VAT included in price, line = subtotal; VAT base = subtotal / (1 + vat%)
    function calcLineVat(l) {
      migrateLine(l);
      const subtotal = l.qty * l.unit_price;
      const discount = subtotal * (l.discount_pct / 100);
      const netAmount = subtotal - discount;
      let vatAmount = 0;
      let lineTotal = netAmount;
      if (l.vat_mode === 'add') {
        vatAmount = netAmount * (l.vat_pct / 100);
        lineTotal = netAmount + vatAmount;
      } else if (l.vat_mode === 'included') {
        vatAmount = netAmount * (l.vat_pct / 100) / (1 + l.vat_pct / 100);
        lineTotal = netAmount;  // line total stays same; VAT is back-calculated
      }
      return { netAmount, vatAmount, lineTotal };
    }

          <div style="position: relative;" id="ucpCombobox">
            <i data-lucide="search" class="w-4 h-4" style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--c-text-soft);"></i>
            <input type="text" id="ucpSearchInput" autocomplete="off"
              value="${selectedUcp ? selectedUcp.ucp_no : ucpSearchState.query}"
              placeholder="ค้นหาใบเปลี่ยนหน่วย..."
              oninput="onUcpSearchInput(event)"
              onfocus="onUcpSearchFocus()"
              onkeydown="onUcpSearchKey(event)"
              class="input" style="padding-left: 36px; padding-right: 36px;">
            ${selectedUcp ? `
              <button onclick="clearUcpSelection()" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); background: transparent; border: none; padding: 4px; cursor: pointer; color: var(--c-text-soft);" title="ล้างการเลือก">

          <label>วัตถุประสงค์</label>

            class="input" style="height: auto; padding: 10px 12px; resize: vertical;">${d.purpose}</textarea>
        </div>
        <div class="form-field">
          <label>หมายเหตุ</label>
          <textarea rows="2" oninput="createWizard.data.notes=this.value" placeholder="หมายเหตุเพิ่มเติม (ถ้ามี)"
            class="input" style="height: auto; padding: 10px 12px; resize: vertical;">${d.notes}</textarea>
        </div>

    function renderBrSuggestions() {
      const q = (brSearchState.query || '').toLowerCase().trim();
      const filtered = mockBudgets.filter(b => !q || b.br_no.toLowerCase().includes(q) || b.name.toLowerCase().includes(q) || b.code.toLowerCase().includes(q));
      if (filtered.length === 0) return `<div style="padding: 24px 16px; text-align: center; font-size: 13px; color: var(--c-text-mute);">ไม่พบงบประมาณที่ตรงกับ "<strong>${q}</strong>"</div>`;
      return filtered.map((b, i) => {
        const active = i === brSearchState.highlight;
        const hl = (text) => q ? text.replace(new RegExp(`(${escapeReg(q)})`, 'gi'), '<mark>$1</mark>') : text;
        return `
          <button type="button" onmousedown="event.preventDefault()" onclick="selectBr('${b.br_no}')"
            style="width: 100%; text-align: left; padding: 10px 14px; background: ${active ? 'var(--c-primary-08)' : 'transparent'}; border: none; cursor: pointer; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--c-border-soft);">
            <div style="width: 32px; height: 32px; border-radius: var(--r-sm); background: var(--c-primary-08); display: grid; place-items: center; flex-shrink: 0;">
              <i data-lucide="wallet" class="w-4 h-4" style="color: var(--c-primary);"></i>
            </div>
            <div style="flex: 1; min-width: 0;">
              <div class="tbl-mono" style="font-weight: 600; color: var(--c-primary);">${hl(b.br_no)}</div>
              <div style="font-size: 11.5px; color: var(--c-text-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${hl(b.name)}</div>
            </div>
            <div style="text-align: right; flex-shrink: 0;">
              <div class="num" style="font-size: 13px; font-weight: 700; color: var(--c-navy);">฿${formatMoney(b.remaining)}</div>
              <div style="font-size: 10px; color: var(--c-text-soft);">คงเหลือ</div>
            </div>
          </button>
        `;
      }).join('');
    }

    function renderUcpSuggestions() {
      const q = (ucpSearchState.query || '').toLowerCase().trim();
      const filtered = mockUCPs.filter(u => !q || u.ucp_no.toLowerCase().includes(q) || u.desc.toLowerCase().includes(q));
      if (filtered.length === 0) return `<div style="padding: 24px 16px; text-align: center; font-size: 13px; color: var(--c-text-mute);">ไม่พบใบเปลี่ยนหน่วยที่ตรงกับ "<strong>${q}</strong>"</div>`;
      return filtered.map((u, i) => {
        const active = i === ucpSearchState.highlight;
        const hl = (text) => q ? text.replace(new RegExp(`(${escapeReg(q)})`, 'gi'), '<mark>$1</mark>') : text;
        return `
          <button type="button" onmousedown="event.preventDefault()" onclick="selectUcp('${u.ucp_no}')"
            style="width: 100%; text-align: left; padding: 10px 14px; background: ${active ? 'var(--c-primary-08)' : 'transparent'}; border: none; cursor: pointer; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--c-border-soft);">
            <div style="width: 32px; height: 32px; border-radius: var(--r-sm); background: rgba(124,58,237,0.08); display: grid; place-items: center; flex-shrink: 0;">
              <i data-lucide="shuffle" class="w-4 h-4" style="color: var(--c-purple);"></i>
            </div>
            <div style="flex: 1; min-width: 0;">
              <div class="tbl-mono" style="font-weight: 600; color: var(--c-purple);">${hl(u.ucp_no)}</div>
              <div style="font-size: 11.5px; color: var(--c-text-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${hl(u.desc)}</div>
            </div>
          </button>
        `;
      }).join('');
    }

    function escapeReg(s) { return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

    function onBrSearchInput(e) {
      brSearchState.query = e.target.value;
      brSearchState.open = true; brSearchState.highlight = 0;
      if (createWizard.data.br_no) createWizard.data.br_no = null;
      const list = document.getElementById('brSuggestList');
      if (list) { list.classList.remove('hidden'); list.innerHTML = renderBrSuggestions(); renderIcons(); }
    }
    function onBrSearchFocus() {
      brSearchState.open = true;
      const list = document.getElementById('brSuggestList');
      if (list) { list.classList.remove('hidden'); list.innerHTML = renderBrSuggestions(); renderIcons(); }
    }
    function onBrSearchKey(e) {
      const list = document.getElementById('brSuggestList');
      if (!list) return;
      const filtered = mockBudgets.filter(b => {
        const q = (brSearchState.query || '').toLowerCase().trim();
        return !q || b.br_no.toLowerCase().includes(q) || b.name.toLowerCase().includes(q);
      });
      if (e.key === 'ArrowDown') { e.preventDefault(); brSearchState.highlight = Math.min(filtered.length - 1, brSearchState.highlight + 1); list.innerHTML = renderBrSuggestions(); renderIcons(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); brSearchState.highlight = Math.max(0, brSearchState.highlight - 1); list.innerHTML = renderBrSuggestions(); renderIcons(); }
      else if (e.key === 'Enter') { e.preventDefault(); if (filtered[brSearchState.highlight]) selectBr(filtered[brSearchState.highlight].br_no); }
      else if (e.key === 'Escape') { brSearchState.open = false; list.classList.add('hidden'); }
    }
    function selectBr(br_no) {
      createWizard.data.br_no = br_no;
      brSearchState.open = false; brSearchState.query = '';
      renderCreateDrawer();
    }
    function clearBrSelection() {
      createWizard.data.br_no = null; brSearchState.query = ''; brSearchState.open = true;
      renderCreateDrawer();
      setTimeout(() => document.getElementById('brSearchInput')?.focus(), 0);
    }

    function onUcpSearchInput(e) {
      ucpSearchState.query = e.target.value;
      ucpSearchState.open = true; ucpSearchState.highlight = 0;
      if (createWizard.data.ucp_no) createWizard.data.ucp_no = null;
      const list = document.getElementById('ucpSuggestList');
      if (list) { list.classList.remove('hidden'); list.innerHTML = renderUcpSuggestions(); renderIcons(); }
    }
    function onUcpSearchFocus() {
      ucpSearchState.open = true;
      const list = document.getElementById('ucpSuggestList');
      if (list) { list.classList.remove('hidden'); list.innerHTML = renderUcpSuggestions(); renderIcons(); }
    }
    function onUcpSearchKey(e) {
      const list = document.getElementById('ucpSuggestList');
      if (!list) return;
      const filtered = mockUCPs.filter(u => {
        const q = (ucpSearchState.query || '').toLowerCase().trim();
        return !q || u.ucp_no.toLowerCase().includes(q) || u.desc.toLowerCase().includes(q);
      });
      if (e.key === 'ArrowDown') { e.preventDefault(); ucpSearchState.highlight = Math.min(filtered.length - 1, ucpSearchState.highlight + 1); list.innerHTML = renderUcpSuggestions(); renderIcons(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); ucpSearchState.highlight = Math.max(0, ucpSearchState.highlight - 1); list.innerHTML = renderUcpSuggestions(); renderIcons(); }
      else if (e.key === 'Enter') { e.preventDefault(); if (filtered[ucpSearchState.highlight]) selectUcp(filtered[ucpSearchState.highlight].ucp_no); }
      else if (e.key === 'Escape') { ucpSearchState.open = false; list.classList.add('hidden'); }
    }
    function selectUcp(ucp_no) {
      createWizard.data.ucp_no = ucp_no;
      ucpSearchState.open = false; ucpSearchState.query = '';
      renderCreateDrawer();
    }
    function clearUcpSelection() {
      createWizard.data.ucp_no = null; ucpSearchState.query = ''; ucpSearchState.open = true;
      renderCreateDrawer();
      setTimeout(() => document.getElementById('ucpSearchInput')?.focus(), 0);
    }

    document.addEventListener('mousedown', (e) => {
      const br = document.getElementById('brCombobox');
      if (br && !br.contains(e.target)) {
        brSearchState.open = false;
        document.getElementById('brSuggestList')?.classList.add('hidden');
      }
      const ucp = document.getElementById('ucpCombobox');
      if (ucp && !ucp.contains(e.target)) {
        ucpSearchState.open = false;
        document.getElementById('ucpSuggestList')?.classList.add('hidden');
      }
    });

    //  Step 2 — Item Lines

                  <input type="number" min="0" max="100" step="0.01" value="${d.wht_pct}"

                    class="input num" style="height: 28px; width: 76px; font-size: 12px; text-align: right; padding: 0 8px;">
                  <span style="font-size: 12px; color: var(--c-text-mute);">%</span>
                </div>

          ` : ''}

        <!-- End-bill discount (ส่วนลดท้ายบิล) -->

          <div style="padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; ${d.endbill_discount_enabled ? 'border-bottom: 1px solid var(--c-border-soft);' : ''}">

                      style="padding: 4px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; font-weight: 500;
                             background: ${d.endbill_discount_mode === 'amount' ? 'var(--c-primary)' : 'transparent'};
                             color: ${d.endbill_discount_mode === 'amount' ? 'white' : 'var(--c-text-mute)'};">
                      จำนวนเงิน (฿)
                    </button>
                    <button onclick="createWizard.data.endbill_discount_mode='percent'; renderCreateDrawer();"
                      style="padding: 4px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 12px; font-weight: 500;
                             background: ${d.endbill_discount_mode === 'percent' ? 'var(--c-primary)' : 'transparent'};
                             color: ${d.endbill_discount_mode === 'percent' ? 'white' : 'var(--c-text-mute)'};">
                      เปอร์เซ็นต์ (%)
                    </button>
                  </div>
                </div>
                <!-- Value input -->
                <div style="flex: 1; min-width: 200px;">
                  <div style="font-size: 11.5px; font-weight: 500; color: var(--c-text-mute); margin-bottom: 6px;">${d.endbill_discount_mode === 'amount' ? 'จำนวนเงินที่ลด' : 'อัตราส่วนลด'}</div>
                  <div style="position: relative;">
                    <input type="number" min="0" step="0.01" value="${d.endbill_discount_value}"
                      oninput="createWizard.data.endbill_discount_value=parseFloat(this.value)||0; updateLineSummaryOnly();"
                      class="input num" style="text-align: right; padding-right: 36px;">
                    <span style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--c-text-mute); pointer-events: none;">${d.endbill_discount_mode === 'amount' ? '฿' : '%'}</span>
                  </div>
                </div>
              </div>
            </div>
          ` : ''}
        </div>

        <!-- Summary (live updated) -->
        <div id="line-summary-wrap">
          ${renderLineSummary()}
        </div>
      `;
    }

    function renderLineRow(l, idx) {
      migrateLine(l);
      const itemMatch = mockItems.find(i => i.code === l.item_code);
      const itemName = itemMatch ? itemMatch.name : (l.item_name || '');
      const { vatAmount, lineTotal: lineTotalDisplay } = calcLineVat(l);
      const isExpanded = createWizard.expandedLineId === l.id;

      // ภาษี column — single mutually-exclusive badge based on vat_mode
      //   'none'     → "ไม่คิด"   (gray)
      //   'add'      → "VAT 7%"  (purple — price excludes VAT, will be added)
      //   'included' → "NET 7%"  (primary blue — price includes VAT, calculated backwards)
      let taxBadge;
      if (l.vat_mode === 'none') {
        taxBadge = `<span style="display: inline-flex; align-items: center; gap: 3px; font-size: 11px; padding: 3px 8px; border-radius: 999px; background: rgba(100,116,139,0.10); color: var(--c-text-mute); font-weight: 600; line-height: 1.4; white-space: nowrap;"><span style="width: 4px; height: 4px; border-radius: 50%; background: var(--c-text-mute);"></span>ไม่คิด</span>`;
      } else if (l.vat_mode === 'included') {
        taxBadge = `<span style="display: inline-flex; align-items: center; gap: 3px; font-size: 11px; padding: 3px 8px; border-radius: 999px; background: rgba(255,59,48,0.10); color: var(--c-primary); font-weight: 600; line-height: 1.4; white-space: nowrap;" title="ราคา/หน่วย รวม VAT แล้ว — VAT คำนวณย้อน"><span style="width: 4px; height: 4px; border-radius: 50%; background: var(--c-primary);"></span>NET ${l.vat_pct}%</span>`;
      } else {
        taxBadge = `<span style="display: inline-flex; align-items: center; gap: 3px; font-size: 11px; padding: 3px 8px; border-radius: 999px; background: rgba(124,58,237,0.10); color: var(--c-purple); font-weight: 600; line-height: 1.4; white-space: nowrap;" title="VAT ${l.vat_pct}% (จะคำนวณเพิ่มจากราคา)"><span style="width: 4px; height: 4px; border-radius: 50%; background: var(--c-purple);"></span>VAT ${l.vat_pct}%</span>`;
      }

      // Note indicator — small icon-only badge under item name (note is text, not toggleable)
      const noteIndicator = l.note
        ? `<span title="${l.note.replace(/"/g, '&quot;')}" style="display: inline-flex; align-items: center; gap: 3px; font-size: 10px; padding: 1px 6px; border-radius: 999px; background: rgba(245,158,11,0.10); color: var(--c-warning); font-weight: 600; line-height: 1.4; cursor: help; margin-top: 4px;"><i data-lucide="message-square" style="width:10px;height:10px;"></i>หมายเหตุ</span>`
        : '';

      return `
        <!-- Compact main row -->
        <tr style="background: ${isExpanded ? 'var(--c-primary-08)' : 'transparent'}; cursor: default;">
          <td style="text-align: center; color: var(--c-text-mute); padding-left: 8px; vertical-align: middle;">${idx + 1}</td>
          <td style="padding-right: 12px;">
            <div style="position: relative;" class="item-combo" data-line-id="${l.id}">
              <input type="text" id="item-input-${l.id}" autocomplete="off"
                value="${itemName ? l.item_code + (itemName ? ' — ' + itemName : '') : l.item_code}"
                placeholder="ค้นหารหัสหรือชื่อสินค้า..."
                oninput="onItemInput(event, '${l.id}')"
                onfocus="onItemFocus('${l.id}')"
                class="input" style="height: 32px; font-size: 12.5px; padding: 0 10px;">
            </div>
            ${noteIndicator ? `<div>${noteIndicator}</div>` : ''}
          </td>
          <td style="text-align: right; vertical-align: middle;">
            <input type="number" min="1" step="1" value="${l.qty}"
              oninput="updateLine('${l.id}','qty',this.value)"
              class="input num" style="height: 30px; font-size: 12.5px; text-align: right; padding: 0 8px;">
          </td>
          <td style="vertical-align: middle; font-size: 12px; color: var(--c-text-mute);">${l.unit || '-'}</td>
          <td style="vertical-align: middle;">
            <input type="number" min="0" step="0.01" value="${l.unit_price || ''}"
              oninput="updateLine('${l.id}','unit_price',this.value)"
              class="input num" style="height: 30px; font-size: 12.5px; text-align: right; padding: 0 8px;">
          </td>
          <td style="vertical-align: middle;">
            <div style="position: relative;">
              <input type="number" min="0" max="100" step="0.01" value="${l.discount_pct || 0}"
                oninput="updateLine('${l.id}','discount_pct',this.value)"
                class="input num" style="height: 30px; font-size: 12.5px; text-align: right; padding: 0 22px 0 8px;">
              <span style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 11px; color: var(--c-text-soft); pointer-events: none;">%</span>
            </div>
          </td>
          <td style="text-align: center; vertical-align: middle;">${taxBadge}</td>
          <td style="text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--c-navy); font-size: 13px; vertical-align: middle;">
            ฿${formatMoney(lineTotalDisplay)}
          </td>
          <td style="text-align: center; padding-right: 8px; vertical-align: middle;">
            <div style="display: inline-flex; gap: 2px;">
              <button onclick="toggleLineExpand('${l.id}')" class="btn btn-ghost sm" style="padding: 0 6px; ${isExpanded ? 'background: var(--c-primary); color: white;' : ''}" title="${isExpanded ? 'ปิดตัวเลือกขั้นสูง' : 'เปิดตัวเลือกขั้นสูง (Net / VAT / หมายเหตุ)'}">
                <i data-lucide="${isExpanded ? 'chevron-up' : 'chevron-down'}" class="w-3.5 h-3.5"></i>
              </button>
              <button onclick="removeLine('${l.id}')" class="btn btn-ghost sm" style="padding: 0 6px; color: var(--c-danger);" title="ลบรายการ">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </td>
        </tr>
        ${isExpanded ? `
        <!-- Expanded advanced row -->
        <tr class="line-expand-panel-anchor" data-line-id="${l.id}" style="background: var(--c-primary-08);">
          <td colspan="9" style="padding: 0 16px 14px 16px; border-bottom: 1px solid var(--c-primary-12);">
            <div class="line-expand-panel-inner ${createWizard._justOpenedLineId === l.id ? 'line-expand-panel' : ''}" style="background: white; border: 1px solid var(--c-primary-12); border-radius: var(--r); padding: 14px;">
              <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 10px; font-size: 11.5px; color: var(--c-primary); font-weight: 600;">
                <i data-lucide="settings-2" class="w-3.5 h-3.5"></i>
                <span>ตัวเลือกขั้นสูง — รายการ #${idx + 1}</span>
              </div>
              <div style="display: grid; grid-template-columns: 1fr; gap: 12px;">
                <!-- 3-mode VAT picker — lean radio cards (single row, no description) -->
                <div>
                  <label style="display: block; font-size: 11.5px; font-weight: 500; color: var(--c-navy); margin-bottom: 6px;">
                    การคิด VAT
                    <span style="color: var(--c-text-mute); font-weight: 400; font-size: 11px;">— เลือกได้แค่ 1 แบบเท่านั้น</span>
                  </label>
                  <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
                    <!-- Mode 1: none -->
                    <button onclick="updateLine('${l.id}','vat_mode','none')"
                      title="สินค้ายกเว้น / ไม่มีภาษี"
                      style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: var(--r); cursor: pointer; text-align: left;
                             border: ${l.vat_mode === 'none' ? '2px solid var(--c-text-mute)' : '1px solid var(--c-border)'};
                             background: ${l.vat_mode === 'none' ? 'rgba(100,116,139,0.08)' : 'white'};
                             transition: all 150ms ease-out;">
                      <span style="flex-shrink: 0; width: 16px; height: 16px; border-radius: 50%; border: 2px solid ${l.vat_mode === 'none' ? 'var(--c-text-mute)' : 'var(--c-border)'}; display: grid; place-items: center;">
                        ${l.vat_mode === 'none' ? '<span style="width: 8px; height: 8px; border-radius: 50%; background: var(--c-text-mute);"></span>' : ''}
                      </span>
                      <span style="font-size: 13px; font-weight: 600; color: var(--c-navy);">ไม่คิด VAT</span>
                    </button>

                    <!-- Mode 2: add -->
                    <button onclick="updateLine('${l.id}','vat_mode','add')"
                      title="ราคายังไม่รวม VAT — ระบบจะคิด VAT บวกเพิ่ม"
                      style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: var(--r); cursor: pointer; text-align: left;
                             border: ${l.vat_mode === 'add' ? '2px solid var(--c-purple)' : '1px solid var(--c-border)'};
                             background: ${l.vat_mode === 'add' ? 'rgba(124,58,237,0.06)' : 'white'};
                             transition: all 150ms ease-out;">
                      <span style="flex-shrink: 0; width: 16px; height: 16px; border-radius: 50%; border: 2px solid ${l.vat_mode === 'add' ? 'var(--c-purple)' : 'var(--c-border)'}; display: grid; place-items: center;">
                        ${l.vat_mode === 'add' ? '<span style="width: 8px; height: 8px; border-radius: 50%; background: var(--c-purple);"></span>' : ''}
                      </span>
                      <span style="font-size: 13px; font-weight: 600; color: var(--c-navy);">VAT (ปกติ)</span>
                    </button>

                    <!-- Mode 3: included -->
                    <button onclick="updateLine('${l.id}','vat_mode','included')"
                      title="ราคารวม VAT แล้ว — ระบบจะคำนวณ VAT ย้อนกลับ"
                      style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: var(--r); cursor: pointer; text-align: left;
                             border: ${l.vat_mode === 'included' ? '2px solid var(--c-primary)' : '1px solid var(--c-border)'};
                             background: ${l.vat_mode === 'included' ? 'var(--c-primary-08)' : 'white'};
                             transition: all 150ms ease-out;">
                      <span style="flex-shrink: 0; width: 16px; height: 16px; border-radius: 50%; border: 2px solid ${l.vat_mode === 'included' ? 'var(--c-primary)' : 'var(--c-border)'}; display: grid; place-items: center;">
                        ${l.vat_mode === 'included' ? '<span style="width: 8px; height: 8px; border-radius: 50%; background: var(--c-primary);"></span>' : ''}
                      </span>
                      <span style="font-size: 13px; font-weight: 600; color: var(--c-navy);">NET (รวม VAT)</span>
                    </button>
                  </div>
                </div>

                <!-- VAT % rate + computed amount (only when vat_mode != 'none') -->
                ${l.vat_mode !== 'none' ? `
                  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div>
                      <label style="display: block; font-size: 11.5px; font-weight: 500; color: var(--c-navy); margin-bottom: 4px;">อัตรา VAT (%)</label>
                      <div style="display: flex; gap: 6px;">
                        ${[0, 7, 10].map(p => `
                          <button onclick="updateLine('${l.id}','vat_pct',${p})"
                            class="btn ${l.vat_pct === p ? 'btn-primary' : 'btn-secondary'} sm">${p}%</button>
                        `).join('')}
                        <input type="number" min="0" max="100" step="0.01" value="${l.vat_pct}"
                          oninput="updateLine('${l.id}','vat_pct',this.value)"
                          class="input num" style="height: 28px; flex: 1; font-size: 12px; text-align: right; padding: 0 8px;">
                      </div>
                    </div>
                    <div>
                      <label style="display: block; font-size: 11.5px; font-weight: 500; color: var(--c-navy); margin-bottom: 4px;">
                        จำนวน VAT (คำนวณ)
                        ${l.vat_mode === 'included' ? '<span style="color: var(--c-text-soft); font-weight: 400;">— จากราคารวม</span>' : ''}
                      </label>
                      <div class="input num" style="background: var(--c-off-white); display: flex; align-items: center; justify-content: flex-end; height: 30px; font-weight: 600; color: var(--c-purple);">
                        ฿${formatMoney(vatAmount)}
                      </div>
                    </div>
                  </div>
                ` : ''}

                <!-- Note (full width) -->
                <div>
                  <label style="display: block; font-size: 11.5px; font-weight: 500; color: var(--c-navy); margin-bottom: 4px;">หมายเหตุรายการ</label>
                  <input type="text" value="${l.note || ''}"
                    oninput="updateLine('${l.id}','note',this.value)"
                    placeholder="เช่น สี, ขนาด, สเปคเพิ่มเติม"
                    class="input" style="height: 32px; font-size: 12.5px;">
                </div>
              </div>
              <div style="display: flex; justify-content: flex-end; margin-top: 10px;">
                <button onclick="toggleLineExpand('${l.id}')" class="btn btn-ghost sm">
                  <i data-lucide="chevron-up" class="w-3.5 h-3.5"></i>
                  <span>ปิดตัวเลือกขั้นสูง</span>
                </button>
              </div>
            </div>
          </td>
        </tr>
        ` : ''}
      `;
    }

    function toggleLineExpand(lineId) {
      const wasOpen = createWizard.expandedLineId === lineId;

      if (wasOpen) {
        // Collapse: find the existing panel, apply collapse animation, then remove after animation
        const existingPanel = document.querySelector(`.line-expand-panel-anchor[data-line-id="${lineId}"] .line-expand-panel-inner`);
        if (existingPanel) {
          existingPanel.classList.add('line-collapse-panel');
          setTimeout(() => {
            createWizard.expandedLineId = null;
            createWizard._justOpenedLineId = null;
            renderCreateDrawer();
          }, 200);
          return;
        }
        // Fallback if panel not found
        createWizard.expandedLineId = null;
        createWizard._justOpenedLineId = null;
        renderCreateDrawer();
      } else {
        // Open: if another line was open, collapse it first (instantly), then open this one with animation
        createWizard.expandedLineId = lineId;
        createWizard._justOpenedLineId = lineId;
        renderCreateDrawer();
        createWizard._justOpenedLineId = null;
      }
    }

    // Lightweight summary updater — only re-renders the summary card (avoids losing focus)
    function updateLineSummaryOnly() {
      const wrap = document.getElementById('line-summary-wrap');
      if (wrap) wrap.innerHTML = renderLineSummary();
    }

    function renderLineSummary() {
      const lines = createWizard.data.lines;
      const wht = createWizard.data.wht_enabled;
      const whtPct = createWizard.data.wht_pct || 0;
      const endbillEnabled = createWizard.data.endbill_discount_enabled;
      const endbillMode = createWizard.data.endbill_discount_mode;
      const endbillValue = createWizard.data.endbill_discount_value || 0;

      let priceBeforeVat = 0;
      let totalVat = 0;
      lines.forEach(l => {
        migrateLine(l);
        const { netAmount, vatAmount } = calcLineVat(l);
        // priceBeforeVat = revenue net of VAT
        //   'none'     → no VAT, base = netAmount
        //   'add'      → price excludes VAT, base = netAmount
        //   'included' → price includes VAT, base = netAmount - vatAmount
        if (l.vat_mode === 'included') {
          priceBeforeVat += netAmount - vatAmount;
        } else {
          priceBeforeVat += netAmount;
        }
        totalVat += vatAmount;
      });

      const subtotalAfterVat = priceBeforeVat + totalVat;
      const whtAmount = wht ? priceBeforeVat * (whtPct / 100) : 0;
      let endbillAmount = 0;
      if (endbillEnabled) {
        if (endbillMode === 'amount') endbillAmount = endbillValue;
        else endbillAmount = subtotalAfterVat * (endbillValue / 100);
      }
      const grandTotal = subtotalAfterVat - whtAmount - endbillAmount;

      return `
        <div class="card">
          <div class="card-head" style="padding: 12px 18px;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <i data-lucide="calculator" class="w-4 h-4" style="color: var(--c-primary);"></i>
              <div class="card-title">สรุปยอด (${lines.length} รายการ)</div>
            </div>
            <span class="pill" style="background: rgba(124,58,237,0.10); color: var(--c-purple); padding: 1px 7px; font-size: 10px; letter-spacing: 0.04em;">BY_LINE</span>
          </div>
          <div class="card-body" style="padding: 12px 18px;">
            <table style="width: 100%; font-size: 13px;">
              <tbody>
                <tr><td style="padding: 4px 0;">ราคาก่อน VAT</td><td style="text-align: right; font-variant-numeric: tabular-nums; padding: 4px 0; font-weight: 600;">฿${formatMoney(priceBeforeVat)}</td></tr>
                <tr><td style="padding: 4px 0; color: var(--c-purple);">ภาษีมูลค่าเพิ่ม (VAT)</td><td style="text-align: right; font-variant-numeric: tabular-nums; padding: 4px 0; color: var(--c-purple);">+฿${formatMoney(totalVat)}</td></tr>
                <tr style="border-top: 1px solid var(--c-border-soft);"><td style="padding: 6px 0;">ยอดรวมหลัง VAT</td><td style="text-align: right; font-variant-numeric: tabular-nums; padding: 6px 0; font-weight: 600;">฿${formatMoney(subtotalAfterVat)}</td></tr>
                ${wht ? `<tr><td style="padding: 4px 0; color: var(--c-warning);">หัก ภาษี ณ ที่จ่าย ${whtPct}%</td><td style="text-align: right; font-variant-numeric: tabular-nums; padding: 4px 0; color: var(--c-warning);">-฿${formatMoney(whtAmount)}</td></tr>` : ''}
                ${endbillEnabled ? `<tr><td style="padding: 4px 0; color: var(--c-text-mute);">ส่วนลดท้ายบิล${endbillMode === 'percent' ? ' (' + endbillValue + '%)' : ''}</td><td style="text-align: right; font-variant-numeric: tabular-nums; padding: 4px 0; color: var(--c-text-mute);">-฿${formatMoney(endbillAmount)}</td></tr>` : ''}
                <tr style="border-top: 2px solid var(--c-border);"><td style="padding: 8px 0 0; font-weight: 700; font-size: 14px;">ยอดสุทธิทั้งหมด</td><td style="text-align: right; font-variant-numeric: tabular-nums; padding: 8px 0 0; font-weight: 700; font-size: 16px; color: var(--c-primary);">฿${formatMoney(grandTotal)}</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function addLine() {
      createWizard.data.lines.push(createBlankLine());
      renderCreateDrawer();
    }
    function removeLine(id) {
      const idx = createWizard.data.lines.findIndex(l => l.id === id);
      if (idx >= 0) createWizard.data.lines.splice(idx, 1);
      if (createWizard.data.lines.length === 0) createWizard.data.lines.push(createBlankLine());
      renderCreateDrawer();
    }
    function updateLine(id, field, val) {
      const line = createWizard.data.lines.find(l => l.id === id);
      if (!line) return;
      // Save focus
      const focused = document.activeElement;
      const focusInfo = focused && focused.tagName === 'INPUT' ? {
        oninput: focused.getAttribute('oninput'),
        selStart: focused.selectionStart,
      } : null;

      if (field === 'qty' || field === 'unit_price' || field === 'discount_pct' || field === 'vat_pct') {
        line[field] = parseFloat(val) || 0;
      } else if (field === 'vat_mode') {
        // Mutually exclusive: 'none' | 'add' | 'included'
        line.vat_mode = val;
        // Cleanup legacy fields if present
        delete line.net_enabled;
        delete line.vat_enabled;
      } else {
        line[field] = val;
      }
      renderCreateDrawer();

      // Restore focus
      if (focusInfo) {
        const inputs = document.querySelectorAll('input');
        for (const inp of inputs) {
          if (inp.getAttribute('oninput') === focusInfo.oninput) {
            inp.focus();
            try { inp.setSelectionRange(focusInfo.selStart, focusInfo.selStart); } catch(e) {}
            break;
          }
        }
      }
    }

    function onItemInput(e, lineId) {
      const val = e.target.value;
      const line = createWizard.data.lines.find(l => l.id === lineId);
      if (!line) return;
      line.item_code = val;
      // Auto-fill if exact match
      const match = mockItems.find(i => i.code === val);
      if (match) {
        line.item_name = match.name;
        line.unit = match.uom;
      } else {
        line.item_name = '';
        line.unit = '-';
      }
      // Show suggestions popover (lightweight — just on focus)
      showItemSuggestions(lineId, val);
    }
    function onItemFocus(lineId) {
      const line = createWizard.data.lines.find(l => l.id === lineId);
      showItemSuggestions(lineId, line?.item_code || '');
    }
    function showItemSuggestions(lineId, query) {
      // Simple click-to-fill popover — built fresh per call
      document.querySelectorAll('.item-suggest-popover').forEach(n => n.remove());
      const input = document.getElementById(`item-input-${lineId}`);
      if (!input) return;
      const q = (query || '').toLowerCase().trim();
      const filtered = mockItems.filter(i => !q || i.code.toLowerCase().includes(q) || i.name.toLowerCase().includes(q)).slice(0, 6);
      if (filtered.length === 0) return;
      const rect = input.getBoundingClientRect();
      const pop = document.createElement('div');
      pop.className = 'item-suggest-popover';
      pop.style.cssText = `position: fixed; left: ${rect.left}px; top: ${rect.bottom + 2}px; min-width: 320px; background: white; border: 1px solid var(--c-border); border-radius: var(--r); box-shadow: var(--sh-lg); z-index: 70; max-height: 240px; overflow-y: auto;`;
      pop.innerHTML = filtered.map(i => `
        <button type="button" onmousedown="event.preventDefault()" onclick="pickItem('${lineId}','${i.code}')"
          style="width: 100%; text-align: left; padding: 8px 12px; background: transparent; border: none; cursor: pointer; border-bottom: 1px solid var(--c-border-soft); display: flex; align-items: center; gap: 10px;">

    function pickItem(lineId, code) {
      const item = mockItems.find(i => i.code === code);

      if (item && line) {
        line.item_code = item.code;
        line.item_name = item.name;
        line.unit = item.uom;
      }
      document.querySelectorAll('.item-suggest-popover').forEach(n => n.remove());

                  <div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
                    <div style="width: 32px; height: 32px; border-radius: var(--r-sm); background: var(--c-primary-08); display: grid; place-items: center; flex-shrink: 0;">
                      <i data-lucide="file" class="w-4 h-4" style="color: var(--c-primary);"></i>

    function mockUpload() {
      const samples = [
        { name: 'quotation_vendor1.pdf', size: '124 KB' },
        { name: 'spec-sheet.pdf', size: '512 KB' },
        { name: 'approval-memo.docx', size: '32 KB' },
        { name: 'comparison_summary.xlsx', size: '88 KB' },
      ];
      const next = samples[createWizard.data.attachments.length % samples.length];
      createWizard.data.attachments.push(next);
      renderCreateDrawer();
    }
    function removeAttachment(i) {
      createWizard.data.attachments.splice(i, 1);
      renderCreateDrawer();
    }

    // -----------------------------------------------------------
    //  Step 4 — Review
    // -----------------------------------------------------------
    function renderStep4() {
      const d = createWizard.data;
      const lines = d.lines;
      let priceBeforeVat = 0;
      let totalVat = 0;
      lines.forEach(l => {
        migrateLine(l);
        const { netAmount, vatAmount } = calcLineVat(l);
        if (l.vat_mode === 'included') priceBeforeVat += netAmount - vatAmount;
        else priceBeforeVat += netAmount;
        totalVat += vatAmount;
      });
      const subtotalAfterVat = priceBeforeVat + totalVat;
      const whtAmount = d.wht_enabled ? priceBeforeVat * ((d.wht_pct || 0) / 100) : 0;
      let endbillAmount = 0;
      if (d.endbill_discount_enabled) {
        if (d.endbill_discount_mode === 'amount') endbillAmount = d.endbill_discount_value || 0;
        else endbillAmount = subtotalAfterVat * ((d.endbill_discount_value || 0) / 100);
      }
      const grandTotal = subtotalAfterVat - whtAmount - endbillAmount;
      const dept = mockDepts.find(x => x.name === d.dept);
      const selectedBr = mockBudgets.find(b => b.br_no === d.br_no);

      return `
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
          <i data-lucide="check-circle-2" class="w-4 h-4" style="color: var(--c-text-mute);"></i>
          <div style="font-size: 13px; font-weight: 600; color: var(--c-navy);">ตรวจสอบข้อมูลก่อนบันทึก</div>
        </div>
        <div style="font-size: 11.5px; margin-bottom: 18px; margin-left: 24px; color: var(--c-danger); display: flex; align-items: center; gap: 4px;">
          <i data-lucide="alert-circle" class="w-3 h-3"></i>
          ตรวจสอบข้อมูลก่อนบันทึก
        </div>

        <!-- General Info Card -->
        <div class="card" style="margin-bottom: 14px;">
          <div class="card-head"><div class="card-title">ข้อมูลคำร้องขอซื้อ</div></div>
          <div class="card-body">
            <dl style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; font-size: 13px;">
              <div><dt style="color: var(--c-text-mute); font-size: 11.5px;">ปีงบประมาณ</dt><dd style="font-weight: 600;">${parseInt(d.pr_date.slice(0,4)) + 543}</dd></div>
              <div><dt style="color: var(--c-text-mute); font-size: 11.5px;">ประเภท</dt><dd style="font-weight: 600;">สินค้า</dd></div>
              <div><dt style="color: var(--c-text-mute); font-size: 11.5px;">วันที่ขอ</dt><dd style="font-weight: 600;">${formatThaiDate(d.pr_date)}</dd></div>
              <div><dt style="color: var(--c-text-mute); font-size: 11.5px;">วันที่ต้องการ</dt><dd style="font-weight: 600;">${d.need_date ? formatThaiDate(d.need_date) : '—'}</dd></div>
              <div><dt style="color: var(--c-text-mute); font-size: 11.5px;">ผู้ขอ</dt><dd style="font-weight: 600;">${d.requester}</dd></div>
              <div><dt style="color: var(--c-text-mute); font-size: 11.5px;">แผนก</dt><dd style="font-weight: 600;">${d.dept}</dd></div>
              ${d.br_no ? `<div style="grid-column: 1/3;"><dt style="color: var(--c-text-mute); font-size: 11.5px;">งบประมาณ</dt><dd style="font-weight: 600;"><span class="tbl-mono" style="color: var(--c-primary);">${d.br_no}</span> · ${selectedBr?.name || ''}</dd></div>` : ''}
              ${d.ucp_no ? `<div style="grid-column: 1/3;"><dt style="color: var(--c-text-mute); font-size: 11.5px;">ใบเปลี่ยนหน่วย</dt><dd style="font-weight: 600;"><span class="tbl-mono" style="color: var(--c-purple);">${d.ucp_no}</span></dd></div>` : ''}
              ${d.purpose ? `<div style="grid-column: 1/3;"><dt style="color: var(--c-text-mute); font-size: 11.5px;">วัตถุประสงค์</dt><dd>${d.purpose}</dd></div>` : ''}
            </dl>
          </div>
        </div>

        <!-- Lines Card -->
        <div class="card" style="margin-bottom: 14px;">
          <div class="card-head"><div class="card-title">รายการสินค้า (${lines.length} รายการ)</div></div>
          <div class="card-body" style="padding: 0;">
            ${lines.map((l, i) => {
              migrateLine(l);
              const { lineTotal: lineTotalDisplay } = calcLineVat(l);
              const taxLabel = l.vat_mode === 'none' ? 'ไม่คิด VAT' : (l.vat_mode === 'included' ? `NET ${l.vat_pct}%` : `VAT ${l.vat_pct}%`);
              return `
                <div style="padding: 12px 18px; ${i < lines.length - 1 ? 'border-bottom: 1px solid var(--c-border-soft);' : ''} display: flex; align-items: center; justify-content: space-between; gap: 12px;">
                  <div style="min-width: 0;">
                    <div style="font-weight: 600;">${i + 1}. ${l.item_name || '(ยังไม่ได้เลือกสินค้า)'}</div>
                    <div style="font-size: 11.5px; color: var(--c-text-mute); margin-top: 2px;">(${l.qty} ${l.unit} × ฿${formatMoney(l.unit_price)})${l.discount_pct ? ` · ส่วนลด ${l.discount_pct}%` : ''} · ${taxLabel}</div>
                  </div>
                  <div class="num" style="font-size: 14px; font-weight: 600; flex-shrink: 0;">฿${formatMoney(lineTotalDisplay)}</div>
                </div>
              `;
            }).join('')}
            <div style="padding: 10px 18px; border-top: 2px solid var(--c-border); background: var(--c-off-white);">
              <table style="width: 100%; font-size: 12.5px;">
                <tbody>
                  <tr><td style="padding: 3px 0;">ราคาก่อน VAT</td><td style="text-align: right; font-variant-numeric: tabular-nums; font-weight: 600;">฿${formatMoney(priceBeforeVat)}</td></tr>
                  <tr><td style="padding: 3px 0; color: var(--c-purple);">ภาษีมูลค่าเพิ่ม (VAT)</td><td style="text-align: right; font-variant-numeric: tabular-nums; color: var(--c-purple);">+฿${formatMoney(totalVat)}</td></tr>
                  <tr style="border-top: 1px solid var(--c-border-soft);"><td style="padding: 6px 0;">ยอดรวมหลัง VAT</td><td style="text-align: right; font-variant-numeric: tabular-nums; padding: 6px 0; font-weight: 600;">฿${formatMoney(subtotalAfterVat)}</td></tr>
                  ${d.wht_enabled ? `<tr><td style="padding: 3px 0; color: var(--c-warning);">หัก ภาษี ณ ที่จ่าย ${d.wht_pct}%</td><td style="text-align: right; font-variant-numeric: tabular-nums; color: var(--c-warning);">-฿${formatMoney(whtAmount)}</td></tr>` : ''}
                  ${d.endbill_discount_enabled ? `<tr><td style="padding: 3px 0; color: var(--c-text-mute);">ส่วนลดท้ายบิล${d.endbill_discount_mode === 'percent' ? ' (' + d.endbill_discount_value + '%)' : ''}</td><td style="text-align: right; font-variant-numeric: tabular-nums; color: var(--c-text-mute);">-฿${formatMoney(endbillAmount)}</td></tr>` : ''}
                  <tr style="border-top: 1px solid var(--c-border);"><td style="padding: 6px 0 0; font-weight: 700; font-size: 14px;">ยอดสุทธิทั้งหมด</td><td style="text-align: right; font-variant-numeric: tabular-nums; padding: 6px 0 0; font-weight: 700; font-size: 16px; color: var(--c-primary);">฿${formatMoney(grandTotal)}</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        ${d.attachments.length > 0 ? `
          <div class="card">
            <div class="card-head"><div class="card-title">เอกสารแนบ (${d.attachments.length} ไฟล์)</div></div>
            <div class="card-body" style="padding: 0;">
              ${d.attachments.map((f, i) => `
                <div style="padding: 10px 18px; ${i < d.attachments.length - 1 ? 'border-bottom: 1px solid var(--c-border-soft);' : ''} display: flex; align-items: center; gap: 10px; font-size: 13px;">
                  <i data-lucide="paperclip" class="w-4 h-4" style="color: var(--c-text-mute);"></i>
                  <span style="flex: 1;">${f.name}</span>
                  <span style="color: var(--c-text-soft); font-size: 11.5px;">${f.size}</span>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}
      `;
    }

    // Wizard nav
    function wizardNext() {
      const s = createWizard.step;
      if (s === 1) {
        if (!createWizard.data.pr_date) return showToast('กรุณาระบุวันที่ขอซื้อ', 'warning');
        if (!createWizard.data.need_date) return showToast('กรุณาระบุวันที่ต้องการสินค้า', 'warning');
      }
      if (s === 2) {
        const validLines = createWizard.data.lines.filter(l => l.item_code && l.qty > 0 && l.unit_price > 0);
        if (validLines.length === 0) return showToast('กรุณาเพิ่มรายการสินค้าอย่างน้อย 1 รายการ', 'warning');
      }
      createWizard.step++;
      renderCreateDrawer();
    }
    function wizardBack() {
      createWizard.step = Math.max(1, createWizard.step - 1);
      renderCreateDrawer();
    }
    function saveDraft() {
      const next = createNewRecord('draft');
      state.records.unshift(next);
      showToast(`บันทึกแบบร่าง ${next.pr_no} เรียบร้อย`, 'success');
      closeCreateDrawer();
    }
    function submitForApproval() {
      const next = createNewRecord('pending');
      state.records.unshift(next);
      showToast(`ส่ง ${next.pr_no} เพื่อขออนุมัติแล้ว`, 'success');
      closeCreateDrawer();
    }
    function createNewRecord(status) {
      const d = createWizard.data;
      const today = new Date();
      const buddhistShort = (today.getFullYear() + 543).toString().slice(-2);
      const seq = String(state.records.length + 1).padStart(5, '0');
      let priceBeforeVat = 0, totalVat = 0;
      d.lines.forEach(l => {
        migrateLine(l);
        const { netAmount, vatAmount } = calcLineVat(l);
        if (l.vat_mode === 'included') priceBeforeVat += netAmount - vatAmount;
        else priceBeforeVat += netAmount;
        totalVat += vatAmount;
      });
      const subtotalAfterVat = priceBeforeVat + totalVat;
      const whtAmount = d.wht_enabled ? priceBeforeVat * ((d.wht_pct || 0) / 100) : 0;
      let endbillAmount = 0;
      if (d.endbill_discount_enabled) {
        if (d.endbill_discount_mode === 'amount') endbillAmount = d.endbill_discount_value || 0;
        else endbillAmount = subtotalAfterVat * ((d.endbill_discount_value || 0) / 100);
      }
      const grandTotal = subtotalAfterVat - whtAmount - endbillAmount;
      return {
        id: 'new-' + Date.now(),
        pr_no: `PR-${buddhistShort}${String(today.getMonth() + 1).padStart(2, '0')}-${seq}`,
        pr_date: d.pr_date,
        need_date: d.need_date,
        requester: d.requester,
        dept: d.dept,
        type: 'สินค้า',
        br_no: d.br_no,
        br_code: d.br_no ? mockBudgets.find(b => b.br_no === d.br_no)?.code : null,
        ucp_no: d.ucp_no,
        status,
        order_status: 'NONE',
        ordered_pct: 0,
        grand_total: grandTotal,
        updated_at: today.toISOString().slice(0, 10),
      };
    }

    // ============================================================
    //  VIEW DRAWER
    // ============================================================
    const viewState = { tab: 'detail', recordId: null };

    function openViewDrawer(id) {
      viewState.tab = 'detail';
      viewState.recordId = id;
      const overlay = document.getElementById('overlay-root');
      overlay.innerHTML = `
        <div class="overlay-wrap">
          <div class="backdrop" onclick="closeViewDrawer()"></div>
          <div id="view-drawer" class="drawer-panel drawer-enter">
            <div id="view-drawer-content" style="display: flex; flex-direction: column; height: 100%;"></div>
          </div>
        </div>
      `;
      const drawer = document.getElementById('view-drawer');
      requestAnimationFrame(() => drawer.classList.add('drawer-active'));
      renderViewDrawer();
    }
    function closeViewDrawer() {
      const drawer = document.getElementById('view-drawer');
      if (drawer) { drawer.classList.remove('drawer-active'); drawer.classList.add('drawer-enter'); }
      setTimeout(() => {
        document.getElementById('overlay-root').innerHTML = '';
        if (getRoute().name === 'view') navigate('list');
      }, 200);
    }
    function renderViewDrawer() {
      const r = state.records.find(x => x.id === viewState.recordId);
