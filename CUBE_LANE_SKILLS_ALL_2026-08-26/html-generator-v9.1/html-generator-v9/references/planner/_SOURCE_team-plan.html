<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operation Process — แผนงานของทีม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">
<style>
/* ===== BASE-KIT (CUBE Warm Light) ===== */
:root{
  --c-navy:#111111; --c-navy-2:#111111; --c-primary:#FF3B30; --c-primary-hover:#E62E24;
  --c-teal:#FF9A1F; --c-teal-light:#FFB763;
  --c-ink:#111111; --c-mute:#54565C; --c-mute-2:#73757B; --c-mute-3:#9A9CA2;
  --c-line:#DEDAD4; --c-line-2:#E9E5E0; --c-line-3:#F1EEEA; --c-bg-off:#FAF8F5;
  --c-success:#1F9D55; --c-warning:#E8870F; --c-danger:#E62E24;
  --sidebar-w:232px; --shell-h:56px;
  --fs-h1:20px; --fs-h2:16px; --fs-h3:14px; --fs-body:13px; --fs-sub:12.5px;
  --fs-meta:12px; --fs-cap:11px; --fs-kpi:26px;
  --sp-xs:4px; --sp-sm:8px; --sp-md:12px; --sp-lg:20px; --sp-xl:28px;
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px; --r-full:999px;
  --z-content:1; --z-sticky:10; --z-shell:20; --z-dropdown:30; --z-backdrop:50;
  --z-drawer:51; --z-modal:60; --z-toast:80;
}
*{box-sizing:border-box;} html,body{margin:0;padding:0;} html{scrollbar-gutter:stable;}
/* Iron Rule #49 — Minimal Scrollbar */
*{scrollbar-width:thin;scrollbar-color:rgba(17,17,17,.16) transparent;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-corner{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(17,17,17,.14);border-radius:99px;}
::-webkit-scrollbar-thumb:hover{background:rgba(17,17,17,.26);}
.sidebar{scrollbar-color:rgba(255,255,255,.28) transparent;}
.sidebar ::-webkit-scrollbar-thumb,.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.28);}
.sidebar ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.42);}
body{font-family:'Satoshi','Noto Sans Thai',system-ui,sans-serif;background:var(--c-bg-off);color:var(--c-ink);font-size:13px;line-height:1.5;-webkit-font-smoothing:antialiased;min-width:768px;}
a{text-decoration:none;color:inherit;} button{font-family:inherit;cursor:pointer;} [data-lucide]{flex-shrink:0;}
input[type="number"]::-webkit-inner-spin-button,input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
input[type="number"]{-moz-appearance:textfield;}

/* ===== SIDEBAR ===== */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);background:#111111;color:#E9E5E0;z-index:var(--z-shell);display:flex;align-items:stretch;flex-direction:column;border-right:1px solid rgba(255,255,255,0.06);}
.sb-brand{padding:16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;}
.sb-logo{width:34px;height:34px;background:linear-gradient(135deg,#FF3B30,#FF9A1F);border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#FFFFFF;flex-shrink:0;box-shadow:0 4px 12px rgba(255,59,48,0.25);}
.sb-name{font-weight:700;font-size:14px;color:#FFFFFF;letter-spacing:-0.01em;line-height:1.2;}
.sb-sub{font-size:11px;color:#9A9CA2;letter-spacing:0.06em;font-weight:600;text-transform:uppercase;margin-top:2px;}
.sb-nav{flex:1;padding:12px 8px;overflow-y:auto;}
.sb-module{margin-bottom:4px;}
.sb-module-header{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:6px;background:transparent;border:0;color:#9A9CA2;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;transition:all 120ms;text-align:left;}
.sb-module-header:hover{background:rgba(255,255,255,0.04);color:#DEDAD4;}
.sb-module-header .mod-icon{flex-shrink:0;opacity:0.7;}
.sb-module-header .mod-label{flex:1;}
.sb-module-header .mod-chevron{flex-shrink:0;transition:transform 200ms;opacity:0.7;}
.sb-module[data-expanded="false"] .mod-chevron{transform:rotate(-90deg);}
.sb-module[data-expanded="false"] .sb-features{display:none;}
.sb-features{padding:2px 0 6px 0;}
.sb-item{display:flex;align-items:center;gap:10px;padding:8px 12px 6px 16px;border-radius:6px;color:#DEDAD4;font-size:13px;font-weight:500;cursor:pointer;transition:all 120ms;margin-bottom:1px;position:relative;user-select:none;}
.sb-item:hover{background:rgba(255,255,255,0.05);color:#FFFFFF;}
.sb-item.is-active{background:rgba(255,255,255,0.08);color:#FFFFFF;font-weight:600;}
.sb-item.is-active::before{content:'';position:absolute;left:-10px;top:6px;bottom:6px;width:3px;background:var(--c-primary);border-radius:0 2px 2px 0;}
.sb-item [data-lucide]{width:16px;height:16px;opacity:0.85;}
.sb-item.is-active [data-lucide]{opacity:1;color:var(--c-primary);}
.sb-badge{margin-left:auto;font-size:11px;font-weight:600;background:rgba(255,255,255,0.10);color:#9A9CA2;padding:2px 8px;border-radius:999px;}
.sb-item.is-active .sb-badge{background:rgba(255,255,255,0.18);color:#FFFFFF;}
.sb-item.is-disabled{opacity:0.4;cursor:not-allowed;}
.sb-item.is-disabled:hover{background:transparent;color:#DEDAD4;}
.sb-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:8px;font-size:12px;color:#9A9CA2;}
.pulse-dot{width:8px;height:8px;background:var(--c-teal);border-radius:50%;box-shadow:0 0 0 3px rgba(255,154,31,0.20);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.6;}}

/* ===== MAIN + SHELL BAR ===== */
.main{margin-left:var(--sidebar-w);min-height:100vh;background:var(--c-bg-off);}
.shell-bar{position:sticky;top:0;background:#FFFFFF;border-bottom:1px solid var(--c-line-2);height:var(--shell-h);display:flex;align-items:center;padding:0 24px;z-index:var(--z-sticky);gap:12px;}
.shell-right{display:flex;align-items:center;gap:6px;margin-left:auto;}
.shell-rel{position:relative;display:flex;align-items:center;}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--c-mute);}
.breadcrumb a{cursor:pointer;transition:color 120ms;}
.breadcrumb a:hover{color:var(--c-primary);}
.breadcrumb .sep{color:var(--c-mute-3);}
.breadcrumb-current{color:var(--c-ink);font-weight:500;}
.icon-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:0;color:var(--c-mute);border-radius:6px;position:relative;transition:all 120ms;}
.icon-btn:hover{background:var(--c-line-3);color:var(--c-ink);}
.icon-btn [data-lucide]{width:16px;height:16px;}
.notif-dot{position:absolute;top:6px;right:8px;width:8px;height:8px;background:var(--c-danger);border-radius:50%;border:2px solid #FFFFFF;}
.user-chip{display:flex;align-items:center;gap:10px;padding:4px 8px 4px 12px;border-radius:8px;cursor:pointer;transition:background 120ms;}
.user-chip:hover{background:var(--c-line-3);}
.user-text{line-height:1.2;text-align:right;}
.user-name{font-size:12.5px;font-weight:500;color:var(--c-ink);white-space:nowrap;}
.user-role{font-size:11px;color:var(--c-mute-2);white-space:nowrap;margin-top:1px;}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--c-primary),var(--c-teal));color:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;}
.user-menu{position:absolute;top:44px;right:0;background:#FFFFFF;border:1px solid var(--c-line-2);border-radius:10px;box-shadow:0 12px 32px rgba(17,17,17,0.12);width:240px;z-index:var(--z-dropdown);padding:6px;display:none;}
.user-menu.is-open{display:block;}
.user-menu-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;font-size:13px;color:var(--c-ink);cursor:pointer;transition:background 120ms;}
.user-menu-item:hover{background:var(--c-bg-off);}
.user-menu-item [data-lucide]{width:16px;height:16px;color:var(--c-mute-2);}
.user-menu-item.is-danger{color:var(--c-danger);}
.user-menu-item.is-danger [data-lucide]{color:var(--c-danger);}
.user-menu-divider{height:1px;background:var(--c-line-2);margin:4px 0;}
.content{padding:24px;}

/* ===== PAGE HEADER ===== */
.ph{margin-bottom:20px;display:flex;align-items:flex-start;flex-wrap:wrap;justify-content:space-between;gap:16px;}
.ph-main{flex:1 1 auto;min-width:280px;}
.ph-title-row{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;}
.ph-title{font-family:'Noto Sans Thai',sans-serif;font-size:20px;font-weight:700;color:var(--c-navy);margin:0;letter-spacing:-0.01em;}
.ph-count{font-size:12.5px;font-weight:600;color:var(--c-mute-2);background:var(--c-line-3);padding:2px 10px;border-radius:999px;}
.ph-sub{font-size:13px;color:var(--c-mute);margin:0;}
.ph-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}

/* ===== BUTTONS ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:2px 16px 0;border-radius:8px;font-size:13px;font-weight:500;border:1px solid transparent;background:transparent;white-space:nowrap;transition:all 120ms;user-select:none;}
.btn [data-lucide]{width:16px;height:16px;flex-shrink:0;}
.btn:disabled,.btn.is-disabled{opacity:.55;cursor:not-allowed;pointer-events:none;}
.btn-eq{min-width:104px;}
.btn-primary{background:var(--c-primary);color:#FFFFFF;}
.btn-primary:hover{background:var(--c-primary-hover);box-shadow:0 2px 8px rgba(255,59,48,0.30);}
.btn-secondary{background:#FFFFFF;border-color:var(--c-line);color:var(--c-ink);}
.btn-secondary:hover{background:var(--c-line-3);border-color:var(--c-mute-2);}
.btn-ghost{color:var(--c-mute);}
.btn-ghost:hover{background:var(--c-line-3);color:var(--c-ink);}
.btn-danger{background:#FFFFFF;border-color:var(--c-line);color:var(--c-danger);}
.btn-danger:hover{background:#FFE9E7;border-color:var(--c-danger);}
.btn-sm{height:30px;padding:2px 12px 0;font-size:12px;}
.btn-sm [data-lucide]{width:14px;height:14px;}
@keyframes spin{to{transform:rotate(360deg);}}
.spin{animation:spin 0.8s linear infinite;}

/* ===== STATS ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px;}
.stat{background:#FFFFFF;border:1px solid var(--c-line-2);border-radius:10px;padding:16px;transition:all 150ms;text-align:left;font-family:inherit;width:100%;display:block;cursor:pointer;}
.stat:hover{border-color:var(--c-line);box-shadow:0 2px 8px rgba(17,17,17,0.05);}
.stat.is-on{border-color:var(--c-primary);box-shadow:0 0 0 3px rgba(255,59,48,.08);}
.stat-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--c-mute);}
.stat-label [data-lucide]{width:14px;height:14px;color:var(--c-primary);}
.stat-value{font-family:'Noto Sans Thai',sans-serif;font-size:26px;font-weight:700;color:var(--c-navy);margin-top:4px;letter-spacing:-0.01em;}
.stat-meta{font-size:12px;color:var(--c-mute-2);margin-top:4px;display:flex;align-items:center;gap:4px;}
.stat-meta [data-lucide]{width:12px;height:12px;}
.stat-meta.is-warn{color:var(--c-warning);} .stat-meta.is-ok{color:var(--c-success);}

/* ===== CARD / FILTER / TABLE ===== */
.card{background:#FFFFFF;border:1px solid var(--c-line-2);border-radius:10px;overflow:hidden;}
.card + .card{margin-top:20px;}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--c-line-2);flex-wrap:wrap;}
.card-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--c-ink);margin:0;}
.card-title [data-lucide]{width:16px;height:16px;color:var(--c-primary);}
.card-sub{font-size:12px;color:var(--c-mute-2);font-weight:400;}
.filter-bar{padding:12px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--c-line-2);background:#FFFFFF;flex-wrap:wrap;}
.input,.select{height:36px;padding:0 12px;border:1px solid var(--c-line);border-radius:8px;font-size:13px;background:#FFFFFF;color:var(--c-ink);font-family:inherit;transition:all 120ms;width:100%;}
.input:focus,.select:focus{outline:none;border-color:var(--c-primary);box-shadow:0 0 0 3px rgba(255,59,48,0.10);}
.input:disabled,.input[readonly]{background:var(--c-line-3);color:var(--c-mute-2);cursor:not-allowed;border-color:var(--c-line-2);}
.select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2373757B' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:32px;appearance:none;width:auto;min-width:150px;}
.input-search{position:relative;flex:1;max-width:320px;display:flex;align-items:center;}
.input-search input{padding-left:36px;}
.input-search .lead-icon{position:absolute;left:12px;width:16px;height:16px;color:var(--c-mute-2);pointer-events:none;}
.spacer{flex:1;}
.table-scroll{overflow-x:auto;}
.table{width:100%;border-collapse:collapse;font-size:12.5px;}
.table thead{background:var(--c-bg-off);}
.table th{padding:10px 12px;text-align:left;font-weight:600;color:var(--c-mute);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--c-line-2);white-space:nowrap;}
.table th.is-sortable{cursor:pointer;user-select:none;}
.table th.is-sortable:hover{color:var(--c-ink);background:var(--c-line-3);}
.table th.is-sorted{color:var(--c-primary);}
.table td{padding:8px 12px 6px;border-bottom:1px solid var(--c-line-2);color:var(--c-ink);vertical-align:middle;}
.table tbody tr{transition:background 120ms;}
.table tbody tr:hover{background:var(--c-bg-off);}
.table tbody tr:last-child td{border-bottom:0;}
.table tbody tr.is-clickable{cursor:pointer;}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
th.col-num,td.col-num{text-align:right;}
.cell-truncate{max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;}
.row-actions{display:inline-flex;align-items:center;gap:2px;}
.ra-btn{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:0;color:var(--c-mute-2);border-radius:6px;transition:all 120ms;}
.ra-btn:hover{background:var(--c-line-3);color:var(--c-primary);}
.ra-btn.is-danger:hover{background:#FFE9E7;color:var(--c-danger);}
.ra-btn [data-lucide]{width:16px;height:16px;}
.table-footer{padding:12px 20px;background:var(--c-bg-off);border-top:1px solid var(--c-line-2);display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--c-mute);flex-wrap:wrap;gap:10px;}
.pagination{display:inline-flex;align-items:center;gap:4px;}
.pg-btn{min-width:30px;height:30px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;background:#FFFFFF;border:1px solid var(--c-line-2);border-radius:6px;color:var(--c-mute);font-size:12.5px;font-weight:500;transition:all 120ms;}
.pg-btn:hover:not(:disabled){border-color:var(--c-line);background:var(--c-bg-off);}
.pg-btn.is-active{background:var(--c-primary);border-color:var(--c-primary);color:#FFFFFF;}
.pg-btn:disabled{opacity:0.4;cursor:not-allowed;}
.pg-btn [data-lucide]{width:14px;height:14px;}

/* ===== PILLS / TAGS ===== */
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px 3px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;}
.pill [data-lucide]{width:12px;height:12px;}
.pill-info{background:#E6F0FF;color:#1A5FCC;}
.pill-success{background:#E4F4EB;color:#157A41;}
.pill-warning{background:#FFF1DD;color:#B8690B;}
.pill-danger{background:#FFE9E7;color:#E62E24;}
.pill-muted{background:var(--c-line-3);color:var(--c-mute-2);}
.type-tag{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 8px 1px;border-radius:4px;white-space:nowrap;}
.type-Normal{background:var(--c-line-3);color:var(--c-mute);}
.type-Review{background:#FFF1DD;color:#B8690B;}
.type-Approve{background:#FFE9E7;color:#E62E24;}
.kind-badge{display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;padding:1px 6px 0;border-radius:4px;flex-shrink:0;}
.kind-CL{background:#E6F0FF;color:#1A5FCC;}
.kind-SOP{background:#E4F4EB;color:#157A41;}
.mini-av{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--c-primary),var(--c-teal));color:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;}
.seg-control{display:inline-flex;align-items:center;background:var(--c-line-3);border-radius:8px;padding:2px;gap:2px;}
.seg-item{padding:6px 12px 4px;border-radius:6px;border:none;background:transparent;font-size:12px;font-weight:500;color:var(--c-mute-2);font-family:inherit;white-space:nowrap;}
.seg-item.is-active{background:#FFFFFF;color:var(--c-ink);font-weight:600;box-shadow:0 1px 3px rgba(17,17,17,0.08);}

/* ===== EMPTY / TOAST ===== */
.empty{padding:56px 24px;text-align:center;color:var(--c-mute);}
.empty-icon{width:56px;height:56px;margin:0 auto 16px;border-radius:50%;background:var(--c-line-3);color:var(--c-mute-2);display:inline-flex;align-items:center;justify-content:center;}
.empty-icon [data-lucide]{width:24px;height:24px;}
.empty-title{font-size:16px;font-weight:600;color:var(--c-ink);margin-bottom:4px;font-family:'Noto Sans Thai',sans-serif;}
.empty-desc{font-size:13px;color:var(--c-mute);max-width:340px;margin:0 auto;}
.empty .btn{margin-top:16px;}
.toast{position:fixed;bottom:24px;right:24px;background:var(--c-navy);color:#FFFFFF;padding:12px 20px;border-radius:10px;font-size:13px;font-weight:500;z-index:var(--z-toast);display:flex;align-items:center;gap:10px;box-shadow:0 12px 32px rgba(17,17,17,0.30);transform:translateY(100px);opacity:0;transition:all 250ms cubic-bezier(0.4,0,0.2,1);max-width:380px;}
.toast.is-visible{transform:translateY(0);opacity:1;}
.toast.is-success{background:var(--c-success);}
.toast.is-info{background:var(--c-primary);}
.toast.is-warning{background:var(--c-warning);}
.toast.is-error{background:var(--c-danger);}
.toast [data-lucide]{width:16px;height:16px;}

/* ===== DRAWER / MODAL ===== */
.drawer-backdrop{position:fixed;inset:0;background:rgba(17,17,17,0.40);z-index:var(--z-backdrop);opacity:0;pointer-events:none;transition:opacity 220ms;}
.drawer-backdrop.is-open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:920px;max-width:96vw;background:#FFFFFF;z-index:var(--z-drawer);transform:translateX(100%);transition:transform 280ms cubic-bezier(0.4,0,0.2,1);display:flex;align-items:stretch;flex-direction:column;box-shadow:-16px 0 40px rgba(17,17,17,0.18);}
.drawer.is-open{transform:translateX(0);}
.drawer.standard{width:680px;}
.drawer-header{display:flex;align-items:center;gap:16px;padding:16px 24px;border-bottom:1px solid var(--c-line-2);flex-shrink:0;}
.drawer-avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--c-primary),var(--c-teal));color:#FFFFFF;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.drawer-avatar [data-lucide]{width:20px;height:20px;}
.drawer-id{flex:1;min-width:0;}
.drawer-title{font-family:'Noto Sans Thai',sans-serif;font-size:16px;font-weight:600;color:var(--c-navy);margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.drawer-subtitle{font-size:12px;color:var(--c-mute);margin-top:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.drawer-header-actions{display:flex;align-items:center;gap:6px;}
.drawer-header-divider{width:1px;height:24px;background:var(--c-line-2);margin:0 4px;flex-shrink:0;}

}
function restoreRenderState(sn){
  if(!sn)return;

    var mb=document.querySelector('.modal-body'); if(mb&&sn.modalScroll>0)mb.scrollTop=sn.modalScroll;

  });
}

  TEAM.forEach(function(uid){

    if(m.loadPct>100) over++;

function weekKeys(startKey){
  var out=[], d=dOf(startKey);
  for(var i=0;i<7;i++){
    out.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
    d.setDate(d.getDate()+1);
  }
  return out;
}

function poolGroupsOf(src){
  var g={};
  poolItems().forEach(function(r){
    if(src==='op'&&r.kind==='TK') return;
    if(src==='tk'&&r.kind!=='TK') return;
    g[r.kind==='TK'?r.raw.module:r.dept]=1;
  });
  return Object.keys(g);
}
var PRIO_RANK={P0:0,P1:1,P2:2,P3:3};
function filteredPool(){
  var q=(ui.poolQ||'').toLowerCase().trim();
  var list=poolItems().filter(function(r){
    if(ui.poolSrc==='op'&&r.kind==='TK') return false;
    if(ui.poolSrc==='tk'&&r.kind!=='TK') return false;
    if(ui.poolGroup!=='all'){
      var g=(r.kind==='TK')?r.raw.module:r.dept;
      if(g!==ui.poolGroup) return false;
    }
    if(ui.poolDue!=='all'){
      var dk=dueKey({due:r.due});
      if(ui.poolDue==='none'){ if(dk) return false; }
      else {
        if(!dk) return false;
        var dd=dayDiff(dk);
        if(ui.poolDue==='overdue'&&dd>=0) return false;
        if(ui.poolDue==='today'&&dd!==0) return false;
        if(ui.poolDue==='3d'&&(dd<0||dd>3)) return false;
        if(ui.poolDue==='week'&&(dd<0||dd>7)) return false;
      }
    }
    if(!q) return true;
    return (r.name+' '+r.code+' '+r.group).toLowerCase().indexOf(q)>=0;
  });
  var s=ui.poolSort;
  list.sort(function(a,b){
    if(s==='sla') return a.sla-b.sla;
    if(s==='prio'){
      var pa=a.priority?PRIO_RANK[a.priority]:1.5, pb=b.priority?PRIO_RANK[b.priority]:1.5;
      return pa-pb;
    }
    if(s==='name') return a.name.localeCompare(b.name,'th');
    var da=dueKey({due:a.due})||'9999', db=dueKey({due:b.due})||'9999';
    return da<db?-1:(da>db?1:0);
  });
  return list;
}
function nextFreeStart(key){
  var arr=sortedItems(key);
  if(!arr.length) return CFG.work_start;
  return Math.min(itemEnd(arr[arr.length-1]), 1380); // ไม่ให้เริ่มเลย 23:00
}
// เพิ่มงานเข้าแผนทันที 1 คลิก — ต่อท้ายเวลาล่าสุด ระยะเวลาตั้งต้น = SLA
function addOne(refId){

  var p=planOf(ui.day), dur=r.sla, st=nextFreeStart(ui.day);
  PLAN_SEQ++;

function markDirty(){ /* แผนบันทึกทันทีทุกครั้ง — ไม่มีสถานะร่าง/ยืนยันแล้ว */ }

// ===== Drag & Drop =====
function restackFrom(list,startMin){
  var cur=startMin, over=0;
  list.forEach(function(it){
    if(isLockedItem(it)){          // งานที่ปิดแล้ว = เวลาที่เกิดขึ้นจริง ห้ามขยับ
      cur=Math.max(cur,itemEnd(it));
      return;
    }
    if(cur+it.dur>1440){ it.start=Math.min(cur,1380); it.overflow=true; over++; }
    else { it.start=cur; it.overflow=false; }
    cur=it.start+it.dur;
  });
  return over;
}
function guardLocked(itemId){
  var f=itemById(itemId);
  if(f&&isLockedItem(f.it)){
    showToast('งานนี้ปิดแล้ว จึงแก้ไขหรือเอาออกจากแผนไม่ได้','warning',4000);
    return true;
  }
  return false;
}
function clearDropMarks(){

}
var EMPTY_IMG=null;
function emptyDragImage(){
  if(!EMPTY_IMG){
    EMPTY_IMG=new Image();
    EMPTY_IMG.src='data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
  }
  return EMPTY_IMG;
}
var _fx=0, _fy=0, _fraf=0;
function paintFloat(){
  _fraf=0;
  if(!ui.floatEl) return;
  ui.floatEl.style.transform='translate3d('+_fx+'px,'+_fy+'px,0) rotate(-2deg) scale(1.03)';
}
function queueFloat(){ if(!_fraf) _fraf=requestAnimationFrame(paintFloat); }
function startFloat(e,node){
  if(!node) return;
  endFloat();
  var r=node.getBoundingClientRect();
  var g=node.cloneNode(true);
  g.classList.add('drag-float');
  g.style.width=r.width+'px';
  document.body.appendChild(g);
  ui.floatEl=g; ui.floatDX=e.clientX-r.left; ui.floatDY=e.clientY-r.top;
  _fx=r.left; _fy=r.top; paintFloat();
  if(e.dataTransfer&&typeof e.dataTransfer.setDragImage==='function'){
    e.dataTransfer.setDragImage(emptyDragImage(),0,0);
  }
}
function moveFloat(e){
  if(!ui.floatEl) return;
  if(e.preventDefault) e.preventDefault();
  if(e.clientX===0&&e.clientY===0) return;
  _fx=e.clientX-ui.floatDX; _fy=e.clientY-ui.floatDY;
  queueFloat();
}
function endFloat(){
  if(_fraf){ cancelAnimationFrame(_fraf); _fraf=0; }
  if(ui.floatEl&&ui.floatEl.parentNode) ui.floatEl.parentNode.removeChild(ui.floatEl);
  ui.floatEl=null;
}
document.addEventListener('dragover',moveFloat,true);
document.addEventListener('drop',endFloat,true);
document.addEventListener('dragend',endFloat,true);

  var t=e.target, tag=t&&t.tagName?t.tagName.toLowerCase():'';

  ui.drag={type:'item',id:itemId};
  if(e.dataTransfer){ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',itemId); }
  var row=t.closest?t.closest('.plan-row'):null;

function dropOnRow(e,targetId){
  e.preventDefault(); e.stopPropagation();
  var d=ui.drag; endFloat(); clearDropMarks(); ui.drag=null;
  if(!d) return;
  var list=sortedItems(ui.day), startMin=list.length?list[0].start:CFG.work_start;
  var ti=-1; list.forEach(function(x,i){ if(x.id===targetId) ti=i; });
  if(ti<0) return;
  if(d.type==='pool'){
    var r=refOf(d.id); if(!r) return;
    PLAN_SEQ++;
    var nw={ id:'pi-'+PLAN_SEQ, taskId:d.id, start:0, dur:r.sla, actual:null, note:'' };
    planOf(ui.day).items.push(nw);
    list.splice(ti,0,nw);
    showToast('วาง “'+r.name+'” ไว้ลำดับที่ '+(ti+1),'success');
  } else {
    var di=-1; list.forEach(function(x,i){ if(x.id===d.id) di=i; });
    if(di<0||di===ti) return;
    var moved=list.splice(di,1)[0];
    var pos=(di<ti)?ti-1:ti;
    list.splice(pos,0,moved);
    showToast('สลับลำดับเป็นที่ '+(pos+1),'info');
  }
  restackFrom(list,startMin);
  markDirty(); render();
}
function dropOnList(e){
  e.preventDefault();
  var d=ui.drag; endFloat(); clearDropMarks(); ui.drag=null;
  if(!d) return;
  if(d.type==='pool'){ addOne(d.id); return; }
  var list=sortedItems(ui.day), startMin=list.length?list[0].start:CFG.work_start;
  var di=-1; list.forEach(function(x,i){ if(x.id===d.id) di=i; });
  if(di<0||di===list.length-1) { render(); return; }
  var moved=list.splice(di,1)[0];
  list.push(moved);

  logAct('REORDER',ui.day,null,'ย้ายไปท้ายแผน');
  showToast('ย้ายไปท้ายแผนแล้ว','info');

// ===== ENG-RT-05 · auto-fill: จัดงานลงวันให้อัตโนมัติจนเต็มโควตา =====
// เกณฑ์เรียงลำดับ (อธิบายได้ ไม่ใช่กล่องดำ): 1) ความเร่งด่วนตามกำหนดส่ง 2) ระดับความเร่งด่วนของตั๋ว 3) SLA สั้นก่อน
function aiUrgencyRank(r){
  var dk=dueKey({due:r.due});
  if(!dk) return 6;                       // ไม่มีกำหนดส่ง = ท้ายสุด
  var dd=dayDiff(dk);
  if(dd<0) return 0;                      // เลยกำหนดแล้ว
  if(dd===0) return 1;                    // ครบกำหนดวันนี้
  if(dd===1) return 2;
  if(dd<=3) return 3;
  if(dd<=7) return 4;
  return 5;
}
function aiPrioRank(r){ return r.priority?(PRIO_RANK[r.priority]||2):2; }
function aiRankedPool(){
  return poolItems().slice().sort(function(a,b){
    var ua=aiUrgencyRank(a), ub=aiUrgencyRank(b); if(ua!==ub) return ua-ub;
    var pa=aiPrioRank(a), pb=aiPrioRank(b); if(pa!==pb) return pa-pb;
    return a.sla-b.sla;
  });
}
function aiPlanDay(){
  var key=ui.day, tt=planTotals(key), cap=CFG.capacity_min_per_day;
  var room=cap-tt.plan;
  if(room<CFG.slot_step){
    showToast('วันนี้เต็มโควตาแล้ว ('+fmtDur(tt.plan)+' / '+fmtDur(cap)+') — ย้ายงานบางส่วนไปวันอื่นก่อน','warning',4500);
    return;
  }
  var ranked=aiRankedPool();
  if(!ranked.length){ showToast('ไม่มีงานรอจัดในคลังแล้ว','warning'); return; }
  var btn=document.getElementById('btnAiPlan');
  if(btn){
    btn.disabled=true;
    btn.innerHTML='<i data-lucide="loader-2" class="w-3.5 h-3.5 spin"></i><span>กำลังจัดงาน…</span>';
    renderIcons();
  }
  setTimeout(function(){
    var p=planOf(key), start=nextFreeStart(key), left=room, picked=[], skippedUrgent=0;
    ranked.forEach(function(r){
      if(r.sla<=left){ picked.push(r); left-=r.sla; }
      else if(aiUrgencyRank(r)<=1){ skippedUrgent++; }
    });
    if(!picked.length){
      showToast('เหลือโควตา '+fmtDur(room)+' ซึ่งไม่พอสำหรับงานที่รออยู่ — ลองปรับเวลางานเดิมก่อน','warning',4500);
      render(); return;
    }
    var added=[];
    picked.forEach(function(r){
      PLAN_SEQ++;
      var nw={ id:'pi-'+PLAN_SEQ, taskId:r.id, start:start, dur:r.sla, actual:null, note:'' };
      p.items.push(nw); added.push(nw);
    });
    restackFrom(added,start);
    markDirty();
    logAct('AI_FILL',key,null,'ระบบเลือกให้ '+picked.length+' งาน · รวม '+fmtDur(planTotals(key).plan));
    var usedNow=planTotals(key).plan;
    var msg='จัดให้ '+picked.length+' งาน · รวม '+fmtDur(usedNow)+' / '+fmtDur(cap);
    if(left>=CFG.slot_step) msg+=' · เหลือโควตา '+fmtDur(left);
    if(skippedUrgent) showToast(msg+' — ยังมีงานเร่งด่วน '+skippedUrgent+' รายการที่ใส่ไม่พอโควตา','warning',5000);
    else showToast(msg,'success',4500);
    render();
  },700);
}

function setSumQ(v){ ui.sumQ=v; ui.sumPage=1; render(); }
function setSumRange(v){ ui.sumRange=v; ui.sumPage=1; render(); }
function resetSum(){ ui.sumQ=''; ui.sumRange='all'; ui.sumPage=1; render(); }
function sortSum(key){
  if(ui.sumSort.key===key) ui.sumSort.dir=-ui.sumSort.dir; else ui.sumSort={key:key,dir:1};
  render();
}
function sumPageGo(p){ if(p<1)return; ui.sumPage=p; render(); }
function summaryRows(){
  var q=(ui.sumQ||'').toLowerCase().trim();
  var rows=Object.keys(plansAll()).map(function(k){
    var tt=planTotals(k);
    return {key:k,count:tt.count,plan:tt.plan,sla:tt.sla,done:tt.done,
      pct:tt.pct,acc:dayAccuracy(k),risk:unplannedDueOn(k).length,
      names:planOf(k).items.map(function(it){ var t=itemTask(it); return t?t.name:''; }).join(' ')};
  }).filter(function(r){ return r.count>0; });
  rows=rows.filter(function(r){
    var dd=dayDiff(r.key);
    if(ui.sumRange==='past'&&dd>0) return false;
    if(ui.sumRange==='future'&&dd<0) return false;
    if(ui.sumRange==='7d'&&(dd<0||dd>7)) return false;
    if(ui.sumRange==='month'&&monthKey(r.key)!==monthKey(TODAY_KEY)) return false;
    if(!q) return true;
    return (fmtThai(r.key)+' '+r.key+' '+r.names).toLowerCase().indexOf(q)>=0;
  });
  var s=ui.sumSort;
  rows.sort(function(a,b){
    var x,y;
    if(s.key==='count'){ x=a.count; y=b.count; }
    else if(s.key==='plan'){ x=a.plan; y=b.plan; }
    else { x=a.key; y=b.key; }
    if(x<y) return -1*s.dir; if(x>y) return 1*s.dir; return 0;
  });
  return rows;
}

  }

  document.getElementById('drawerBackdrop').classList.remove('is-open');
  document.getElementById('drawer').classList.remove('is-open');

}
function setTab(t){ ui.drawer.tab=t; render(); }
function editSet(field,v){ ui.edit[field]=v; }
function saveEdit(){
  var f=itemById(ui.drawer.itemId); if(!f){ closeDrawer(); return; }
  var m=parseClock(ui.edit.start);
  if(m==null){ showToast('กรุณากรอกเวลาเริ่มให้ถูกต้อง','warning'); return; }
  var dur=(parseInt(ui.edit.durH,10)||0)*60+(parseInt(ui.edit.durM,10)||0);
  if(dur<CFG.slot_step){ showToast('ระยะเวลาต่ำสุด '+CFG.slot_step+' นาที','warning'); return; }
  var btn=document.getElementById('btnSaveEdit');
  if(btn){
    btn.disabled=true;
    btn.innerHTML='<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>';
    renderIcons();
  }
  var newKey=ui.edit.date||f.key;
  setTimeout(function(){
    var it=f.it, oldStart=it.start, oldDur=it.dur;
    it.start=m; it.dur=dur; it.note=ui.edit.note||'';
    if(oldStart!==m||oldDur!==dur) logAct('RETIME',f.key,it.taskId,'แก้เป็น '+fmtClock(m)+' · '+fmtDur(dur));
    if(newKey!==f.key){
      logAct('MOVE_DATE',f.key,it.taskId,'ย้ายไปวันที่ '+fmtThai(newKey));
      plansAll()[f.key].items=plansAll()[f.key].items.filter(function(x){ return x.id!==it.id; });
      planOf(newKey).items.push(it);
      ui.day=newKey;
    }
    closeDrawer();
    if(newKey!==f.key){
      showToast('ย้ายไปแผนวันที่ '+fmtThai(newKey)+' แล้ว','success',3500);
      // route ถือวันที่อยู่ ถ้าไม่พาไปวันใหม่ งานจะดูเหมือนหายไปเฉย ๆ
      if(getRoute().indexOf('/day/')>0){ navigate('team/'+ui.member+'/day/'+newKey); return; }
    } else {
      showToast('บันทึกการแก้ไขแล้ว','success');
    }
    render();
  },600);
}

}
function teamRows(){
  var key=ui.day, q=(ui.teamQ||'').toLowerCase().trim();
  var rows=TEAM.map(function(uid){ return memberSummary(uid,key); })
    .filter(function(r){
      if(!q) return true;

      return (u.name+' '+u.role).toLowerCase().indexOf(q)>=0;
    });
  var s=ui.teamSort;
  rows.sort(function(a,b){
    if(s==='name') return USERS[a.uid].name.localeCompare(USERS[b.uid].name,'th');

    if(s==='risk') return (b.dueUnplanned-a.dueUnplanned)||(b.loadPct-a.loadPct);
    return b.loadPct-a.loadPct;
  });
  return rows;
}

function itemLogEntries(it,key){
  return ACTIVITY.filter(function(a){ return a.refId===it.taskId || (a.refId===null && a.planDate===key); })
                 .slice().reverse();
}
function itemLog(it,key){
  var ref=refOf(it.taskId), sla=itemSla(it), p=planOf(key), out=[];
  out.push({icon:'plus',text:'เพิ่มงานลงแผนวันที่ '+fmtThai(key),meta:USERS[ME_()].name});
  if(it.dur!==sla) out.push({icon:'timer',text:'ปรับระยะเวลาเป็น '+fmtDur(it.dur)+' (SLA '+fmtDur(sla)+')',meta:USERS[ME_()].name});
  if(it.note) out.push({icon:'message-square',text:'บันทึกหมายเหตุ',meta:USERS[ME_()].name});
  if(p.status==='confirmed') out.push({icon:'check',text:'ยืนยันแผนประจำวัน',meta:p.confirmedAt||''});
  if(it.actual) out.push({icon:'flag',text:'บันทึกเวลาที่ใช้จริง '+fmtDur(it.actual),meta:USERS[ME_()].name});
  return out;
}

function breadcrumbHTML(route){
  var c=['<a>Operation Process</a>'];
  if(route==='team'){ c.push('<span class="breadcrumb-current">แผนงานของทีม</span>'); }
  else {
    c.push('<a onclick="goTeam()">แผนงานของทีม</a>');
    var nm=USERS[ME_()]?USERS[ME_()].name:'';
    if(/^team\/\w+$/.test(route)){ c.push('<span class="breadcrumb-current">'+nm+'</span>'); }
    else {
      c.push('<a onclick="goMember()">'+nm+'</a>');
      c.push('<span class="breadcrumb-current">'+(route.indexOf('/build')>0?'จัดแผนงาน':'แผนวันที่ '+fmtThai(ui.day))+'</span>');
    }
  }
  return c.join('<i data-lucide="chevron-right" class="w-3 h-3 sep"></i>');
}
function applyGeom(){
  document.querySelectorAll('[data-gl]').forEach(function(el){
    el.style.left=el.getAttribute('data-gl')+'%';
    el.style.width=el.getAttribute('data-gw')+'%';
  });
  document.querySelectorAll('[data-cw]').forEach(function(el){ el.style.width=el.getAttribute('data-cw')+'%'; });
  var now=document.querySelector('[data-now]');
  if(now){
    var track=document.querySelector('.gt-track');
    if(track){
      var m=+now.getAttribute('data-now');
      var pct=Math.max(0,Math.min(1,(m-GT_START)/GT_SPAN));
      now.style.left=(track.offsetLeft+track.offsetWidth*pct)+'px';
    }
  }
}
function render(){
  var snap=preserveRenderState();
  var route=getRoute();
  var m=route.match(/^team\/(\w+)\/day\/(\d{4}-\d{2}-\d{2})$/);
  var mb=route.match(/^team\/(\w+)\/build$/);
  var mm=route.match(/^team\/(\w+)$/);
  if(m){ ui.member=m[1]; ui.day=m[2]; }
  else if(mb){ ui.member=mb[1]; }
  else if(mm){ ui.member=mm[1]; }
  if(route!=='team' && (!ui.member || TEAM.indexOf(ui.member)<0)){ location.hash='#/team'; return; }
  document.getElementById('breadcrumb').innerHTML=breadcrumbHTML(route);
  var html;
  if(mb) html=pageBuild();
  else if(m) html=pageDay();
  else if(mm) html=pageMember();
  else html=pageTeam();
  document.getElementById('page-content').innerHTML=html;
  var badge=document.getElementById('navPlanCount');
  if(badge) badge.textContent=TEAM.length;
  renderDrawer();
  renderModal();
  renderIcons();
