<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>คำสั่งขาย (Sales Order) · CUBE 4.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,600,700&display=swap" rel="stylesheet">
  <style>
    /* self-contained utility shim (replaces Tailwind CDN — icon sizing + inline) */
    .w-3{width:.75rem}.h-3{height:.75rem}
    .w-3\.5{width:.875rem}.h-3\.5{height:.875rem}
    .w-4{width:1rem}.h-4{height:1rem}
    .w-5{width:1.25rem}.h-5{height:1.25rem}
    .w-6{width:1.5rem}.h-6{height:1.5rem}
    .w-10{width:2.5rem}.h-10{height:2.5rem}
    .inline{display:inline-block}
    svg{vertical-align:middle}
    button:focus { outline: none; }
    button:focus-visible { outline: 2px solid var(--c-primary, #0B5CFF); outline-offset: 1px; }
    .btn-link, .btn-link:focus, .btn-link:focus-visible { outline: none !important; box-shadow: none !important; }
    .hint { position: relative; display: inline-flex; align-items: center; cursor: help; }
    .hint::after { content: attr(data-tip); position: absolute; left: 0; top: 150%; white-space: pre-line; width: 290px; background: var(--c-navy, #0B1D3A); color: #fff; font-size: 11px; font-weight: 400; line-height: 1.6; padding: 9px 11px; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,0.18); opacity: 0; visibility: hidden; transform: translateY(-2px); transition: opacity 120ms, transform 120ms; z-index: 60; pointer-events: none; }
    .hint:hover::after { opacity: 1; visibility: visible; transform: translateY(0); }
    .line-tbl th, .line-tbl td { padding-left: 6px; padding-right: 6px; }
    .line-tbl th:first-child, .line-tbl td:first-child { padding-left: 6px; }
  </style>

  <style>
    /* ============================================================
       CUBE NATIVE Admin CI v2 — Design Tokens
       ============================================================ */
    :root {
      --c-navy:        #111111;
      --c-navy-d:      #111111;
      --c-primary:     #FF3B30;
      --c-primary-h:   #E62E24;
      --c-teal:        #1F9D55;
      --c-slate:       #73757B;
      --c-off-white:   #FAF8F5;
      --c-white:       #FFFFFF;
      --c-border:      #DEDAD4;
      --c-border-soft: #EFEBE6;
      --c-text:        #111111;
      --c-text-mute:   #73757B;
      --c-text-soft:   #9A9CA2;
      --c-warning:     #E8870F;
      --c-danger:      #E62E24;
      --c-purple:      #FF9A1F;
      --c-primary-08:  rgba(255, 59, 48, 0.08);
      --c-primary-12:  rgba(255, 59, 48, 0.12);
      --c-primary-18:  rgba(255, 59, 48, 0.18);
      --c-teal-08:     rgba(31, 157, 85, 0.10);
      --c-warning-08:  rgba(232, 135, 15, 0.12);
      --c-danger-08:   rgba(230, 46, 36, 0.10);
      --r-sm: 6px;
      --r:    10px;
      --r-lg: 14px;
      --sh-sm: 0 1px 2px rgba(17, 17, 17, 0.04), 0 1px 3px rgba(17, 17, 17, 0.06);
      --sh-md: 0 4px 8px rgba(17, 17, 17, 0.04), 0 2px 4px rgba(17, 17, 17, 0.06);
      --sh-lg: 0 10px 30px rgba(17, 17, 17, 0.08), 0 4px 10px rgba(17, 17, 17, 0.04);
      --sh-xl: 0 24px 60px rgba(17, 17, 17, 0.10), 0 8px 24px rgba(17, 17, 17, 0.06);
      --sw: 224px;
      --hh: 52px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans Thai', 'Satoshi', -apple-system, sans-serif;
      font-size: 13px;
      line-height: 1.55;
      background: var(--c-off-white);
      color: var(--c-text);
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4, .display { font-family: 'Noto Sans Thai', 'Satoshi', sans-serif; letter-spacing: -0.015em; font-weight: 700; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }
    input, select, textarea { font-family: inherit; }
    .num { font-variant-numeric: tabular-nums; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    html { scrollbar-gutter: stable; scrollbar-width: thin; }
    ::-webkit-scrollbar-thumb { background: var(--c-border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--c-text-soft); }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

    /* ============================================================
       SHELL — Sidebar (224px flat) + Main + Topbar (52px white)
       ============================================================ */
    .shell { display: grid; grid-template-columns: var(--sw) 1fr; min-height: 100vh; }

    .sb {
      background: var(--c-navy-d);
      color: white;
      height: 100vh;
      position: sticky; top: 0;
      display: flex; flex-direction: column;
      border-right: 1px solid rgba(255,255,255,0.05);
      overflow: hidden;
    }
    .sb-logo {
      padding: 16px 18px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .sb-logo-mark {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--c-primary), #FF9A1F);
      border-radius: var(--r-sm);
      display: grid; place-items: center;
      flex-shrink: 0;
      color: white;
    }
    .sb-logo-text { line-height: 1.2; min-width: 0; }
    .sb-logo-title { font-size: 13px; font-weight: 700; color: white; }
    .sb-logo-sub {
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 1px;
    }

    .sb-menu { flex: 1; overflow-y: auto; padding: 10px 0; }
    .sb-menu::-webkit-scrollbar { width: 4px; }
    .sb-menu::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }

    .sb-grp { padding: 6px 0; }
    .sb-grp-label {
      padding: 6px 18px 4px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
    }

    .sb-item {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 18px;
      color: rgba(255,255,255,0.72);
      font-size: 13px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.12s;
      text-decoration: none;
    }
    .sb-item:hover { background: rgba(255,255,255,0.05); color: white; }
    .sb-item.active {
      background: var(--c-primary-18);
      border-left-color: var(--c-primary);
      color: white;
      font-weight: 600;
    }
    .sb-icon { flex-shrink: 0; opacity: 0.8; display: grid; place-items: center; }
    .sb-item.active .sb-icon { opacity: 1; color: var(--c-primary); }

    .sb-badge {
      margin-left: auto;
      background: var(--c-danger);
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 999px;
      line-height: 1.4;
    }
    .sb-badge.muted { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.7); }

    .sb-foot {
      padding: 12px 18px;
      border-top: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
      font-size: 10px;
      color: rgba(255,255,255,0.4);
    }
    .sb-foot div + div { margin-top: 2px; }

    /* MAIN */
    .main { display: flex; flex-direction: column; min-width: 0; background: var(--c-off-white); }

    /* TOPBAR — White */
    .top {
      height: var(--hh);
      background: var(--c-white);
      border-bottom: 1px solid var(--c-border-soft);
      padding: 0 22px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px;
      position: sticky; top: 0; z-index: 50;
    }
    .top-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .top-bc { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--c-text); }
    .bc-root { color: var(--c-text-mute); cursor: pointer; transition: color 120ms; }
    .bc-root:hover { color: var(--c-primary); }
    .bc-sep { color: var(--c-text-soft); margin: 0 2px; }
    .bc-leaf { font-weight: 600; }

    .top-right { display: flex; align-items: center; gap: 12px; }
    .top-user {
      display: flex; align-items: center; gap: 9px;
      padding: 4px 11px 4px 4px;
      border-radius: 8px;
      border: 0; background: transparent;
      cursor: pointer;
      transition: background 120ms;
    }
    .top-user:hover { background: var(--c-off-white); }
    .top-user:focus, .top-user:focus-visible { outline: none; }
    .top-user-info {
      display: flex; flex-direction: column;
      align-items: flex-end;
      line-height: 1.2;
    }
    .top-user-name { font-size: 12.5px; font-weight: 600; color: var(--c-navy); }
    .top-user-role { font-size: 10.5px; color: var(--c-text-mute); margin-top: 2px; }
    .top-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--c-primary), var(--c-teal));
      color: white;
      font-size: 12px; font-weight: 600;
      display: grid; place-items: center;
      flex-shrink: 0;
    }

    /* Icon button (used in drawer headers — printer/download/close) */
    .top-icon-btn {
      width: 32px; height: 32px;
      background: var(--c-off-white);
      border: 1px solid var(--c-border);
      border-radius: var(--r);
      cursor: pointer;
      display: grid; place-items: center;
      color: var(--c-text-mute);
      position: relative;
      transition: all 120ms;
    }
    .top-icon-btn:hover { color: var(--c-text); border-color: var(--c-text-soft); background: var(--c-white); }

    /* PAGE */
    .page { flex: 1; padding: 22px 24px 40px; overflow-y: auto; }

    /* PAGE HEAD */
    .ph {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-bottom: 18px;
      gap: 16px; flex-wrap: wrap;
    }
    .ph-left { min-width: 0; }
    .ph-title { font-size: 22px; font-weight: 700; color: var(--c-navy); line-height: 1.2; }
    .ph-sub { font-size: 13px; color: var(--c-text-mute); margin-top: 4px; }
    .ph-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    /* ============================================================
       BUTTON SYSTEM
       ============================================================ */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px;
      padding: 0 14px;
      height: 34px;
      border-radius: var(--r);
      font-size: 12.5px;
      font-weight: 600;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      background: transparent;
      color: var(--c-text);
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
    }
    .btn:focus-visible { outline: 2px solid var(--c-primary); outline-offset: 2px; }
    .btn:disabled { cursor: not-allowed; opacity: 0.6; }
    .btn.lg { height: 38px; padding: 0 18px; font-size: 13px; }
    .btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
    .btn-primary    { background: var(--c-primary); color: white; border-color: var(--c-primary); }
    .btn-primary:hover:not(:disabled) { background: var(--c-primary-h); border-color: var(--c-primary-h); }
    .btn-secondary  { background: var(--c-white); color: var(--c-navy); border-color: var(--c-border); }
    .btn-secondary:hover:not(:disabled) { border-color: var(--c-text-soft); }
    .btn-ghost      { background: transparent; color: var(--c-text-mute); }
    .btn-ghost:hover:not(:disabled) { background: var(--c-off-white); color: var(--c-text); }
    .btn-success    { background: var(--c-teal); color: white; border-color: var(--c-teal); }
    .btn-success:hover:not(:disabled) { background: #00876F; border-color: #00876F; }
    .btn-danger     { background: var(--c-danger); color: white; border-color: var(--c-danger); }
    .btn-danger:hover:not(:disabled) { background: #C9271E; }
    .btn-link       { background: transparent; border: 0; color: var(--c-primary); padding: 0; height: auto; font-weight: 600; }
    .btn-link:hover { text-decoration: underline; }

    /* ============================================================
       PILL / BADGE
       ============================================================ */
    .pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.02em; line-height: 1.6;
      white-space: nowrap;
    }
    .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .pill.draft     { background: rgba(115,117,123,0.12); color: var(--c-slate); }
    .pill.pending   { background: var(--c-warning-08);    color: #8A5200; }
    .pill.approved  { background: var(--c-teal-08);       color: var(--c-teal); }
    .pill.sent      { background: rgba(255,154,31,0.10);  color: var(--c-purple); }
    .pill.rejected  { background: var(--c-danger-08);     color: var(--c-danger); }
    .pill.cancelled { background: rgba(115,117,123,0.12); color: var(--c-slate); }

    /* ============================================================
       CARD
       ============================================================ */
    .card {
      background: var(--c-white);
      border: 1px solid var(--c-border);
      border-radius: var(--r-lg);
      overflow: hidden;
    }
    .card-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--c-border-soft);
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .card-title { font-size: 14px; font-weight: 700; color: var(--c-navy); }
    .card-body { padding: 16px 18px; }
    .card-body.flush { padding: 0; }

    /* ============================================================
       INPUT / SELECT
       ============================================================ */
    .input, .select {
      height: 34px;
      background: var(--c-white);
      border: 1px solid var(--c-border);
      border-radius: var(--r);
      padding: 0 12px;
      font-size: 13px;
      color: var(--c-text);
      transition: all 0.15s;
      width: 100%;
    }
    .input::placeholder { color: var(--c-text-soft); }
    .input:focus, .select:focus {
      outline: none;
      border-color: var(--c-primary);
      box-shadow: 0 0 0 3px var(--c-primary-12);
    }
    label.required::after { content: ' *'; color: var(--c-danger); }

    /* ============================================================
       FORM GRID + FIELD (used in wizard + view drawer)
       ============================================================ */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
    .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    .lbl { font-size: 12px; font-weight: 500; color: var(--c-navy); display: block; }

    /* Read-only field display (in view drawer summary) */
    .field-readonly { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .lbl-readonly { font-size: 11px; color: var(--c-text-mute); font-weight: 500; }
    .val-readonly { font-size: 13px; color: var(--c-navy); font-weight: 500; line-height: 1.35; word-break: break-word; }

    /* Combobox dropdown */
    .suggest-list {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: white; border: 1px solid var(--c-border); border-radius: var(--r);
      box-shadow: var(--sh-md);
      max-height: 320px; overflow-y: auto; z-index: 60;
    }
    .suggest-list.hidden { display: none; }
    .combo-option { padding: 8px 14px; cursor: pointer; border-bottom: 1px solid var(--c-border-soft); transition: background 100ms; }
    .combo-option:last-child { border-bottom: none; }
    .combo-option:hover { background: var(--c-primary-04); }
    .combo-option .opt-primary { font-size: 13px; font-weight: 600; color: var(--c-navy); }
    .combo-option .opt-secondary { font-size: 11.5px; color: var(--c-text-mute); }
    .combo-option mark { background: rgba(255,59,48,0.15); color: var(--c-primary); padding: 0; font-weight: 700; }

    /* ============================================================
       TABS
       ============================================================ */
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--c-border); margin-bottom: 16px; }
    .tab {
      background: transparent; border: none;
      border-bottom: 2px solid transparent;
      padding: 8px 14px;
      font-size: 13px; font-weight: 500; color: var(--c-text-mute);
      cursor: pointer; margin-bottom: -1px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .tab:hover { color: var(--c-text); }
    .tab.on { color: var(--c-primary); border-bottom-color: var(--c-primary); font-weight: 600; }

    /* ============================================================
       TABLE
       ============================================================ */
    .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tbl th {
      text-align: left; padding: 10px 14px;
      font-size: 10.5px; font-weight: 700;
      color: var(--c-text-mute);
      background: var(--c-off-white);
      border-bottom: 1px solid var(--c-border);
      text-transform: uppercase; letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .tbl td {
      padding: 7px 12px;
      border-bottom: 1px solid var(--c-border-soft);
      color: var(--c-text);
      vertical-align: middle;
    }
    .tbl tbody tr { transition: background 0.1s; cursor: pointer; }
    .tbl tbody tr:hover { background: var(--c-off-white); }
    .tbl tbody tr:last-child td { border-bottom: none; }
    .tbl-name { font-weight: 600; color: var(--c-navy); }
    .tbl-meta { font-size: 11px; color: var(--c-text-mute); margin-top: 1px; }
    .tbl-mono { font-family: ui-monospace, monospace; font-size: 12px; }
    .tbl-num { font-variant-numeric: tabular-nums; text-align: right; }
    .tbl-th-sortable { cursor: pointer; user-select: none; }
    .tbl-th-sortable:hover { color: var(--c-text); }

    /* Progress bar */
    .progress-bar {
      width: 64px; height: 6px;
      background: var(--c-border-soft);
      border-radius: 999px;
      overflow: hidden;
      display: inline-block;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--c-teal);
      border-radius: 999px;
      transition: width 200ms;
    }
    .progress-bar-fill.pending { background: var(--c-warning); }
    .progress-bar-fill.zero { background: var(--c-border); }

    /* ============================================================
       STEPPER
       ============================================================ */
    .stepper { display: flex; align-items: flex-start; gap: 0; width: 100%; }
    .stepper-item {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      position: relative; min-width: 0;
    }
    .stepper-circle {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600;
      background: var(--c-white); color: var(--c-text-soft);
      border: 2px solid var(--c-border);
      transition: all 200ms; z-index: 2;
    }
    .stepper-item.active .stepper-circle {
      background: var(--c-primary); color: white; border-color: var(--c-primary);
      box-shadow: 0 0 0 4px var(--c-primary-12);
    }
    .stepper-item.done .stepper-circle {
      background: var(--c-primary); color: white; border-color: var(--c-primary);
    }
    .stepper-label {
      margin-top: 8px; font-size: 12px; font-weight: 500;
      color: var(--c-text-soft); text-align: center; line-height: 1.3;
      transition: color 200ms;
    }
    .stepper-item.active .stepper-label { color: var(--c-navy); font-weight: 600; }
    .stepper-item.done .stepper-label { color: var(--c-text-mute); }
    .stepper-item:not(:last-child)::after {
      content: ''; position: absolute;
      top: 15px; left: 50%; right: -50%; height: 2px;
      background: var(--c-border); z-index: 1;
    }
    .stepper-item.done:not(:last-child)::after { background: var(--c-primary); }

    /* ============================================================
       DRAWER + MODAL — Self-contained CSS (don't depend on Tailwind utilities)
       ============================================================ */
    .overlay-wrap { position: fixed; inset: 0; z-index: 50; }
    .backdrop { position: absolute; inset: 0; background-color: rgba(0,0,0,0.45); cursor: pointer; }
    .drawer-panel {
      position: absolute; right: 0; top: 0;
      height: 100%; width: 100%;
      max-width: 920px;
      background: white;
      box-shadow: var(--sh-xl);
      display: flex; flex-direction: column;
    }
    .drawer-panel.standard { max-width: 680px; }
    .modal-overlay {
      position: fixed; inset: 0; z-index: 60;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .hidden { display: none !important; }

    .drawer-enter { transform: translateX(100%); }
    .drawer-active { transform: translateX(0); transition: transform 250ms ease-out; }

    @keyframes slide-in { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .animate-slide-in { animation: slide-in 200ms ease-out; }

    /* Slide-down animation for expandable line panel (Pattern E) */
    @keyframes line-expand-slide {
      from {
        opacity: 0;
        transform: translateY(-8px);
        max-height: 0;
      }
      to {
        opacity: 1;
        transform: translateY(0);
        max-height: 600px;
      }
    }
    @keyframes line-collapse-slide {
      from {
        opacity: 1;
        transform: translateY(0);
        max-height: 600px;
      }
      to {
        opacity: 0;
        transform: translateY(-8px);
        max-height: 0;
      }
    }
    .line-expand-panel {
      animation: line-expand-slide 220ms cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: top;
      overflow: hidden;
    }
    .line-collapse-panel {
      animation: line-collapse-slide 200ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
      transform-origin: top;
      overflow: hidden;
    }

    /* ============================================================
       UPLOAD ZONE
       ============================================================ */
    .upload-zone {
      border: 2px dashed var(--c-border);
      border-radius: var(--r-lg);
      padding: 32px 16px;
      text-align: center;
      background: #FDFBF8;
      cursor: pointer;
      transition: all 150ms;
    }
    .upload-zone:hover { border-color: var(--c-primary); background: var(--c-primary-08); }
    .upload-zone.has-files { padding: 16px; }

    /* ============================================================
       FORM GRID
       ============================================================ */
    .form-grp {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 14px 18px;
    }
    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-field label {
      font-size: 12.5px; font-weight: 500; color: var(--c-navy);
      display: flex; align-items: center; gap: 4px;
    }
    .form-field-help {
      font-size: 11px; color: var(--c-text-soft);
      display: flex; align-items: center; gap: 4px;
    }

    /* Toggle */
    .toggle {
      position: relative; display: inline-block;
      width: 36px; height: 20px;
      flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--c-border);
      border-radius: 20px;
      transition: 200ms;
    }
    .toggle-slider::before {
      position: absolute; content: '';
      height: 14px; width: 14px;
      left: 3px; bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 200ms;
    }
    .toggle input:checked + .toggle-slider { background-color: var(--c-primary); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(16px); }

    /* Section divider for wizard step 2 */
    .section-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px;
      background: var(--c-off-white);
      border: 1px solid var(--c-border);
      border-radius: var(--r);
      margin-bottom: 10px;
    }
    .section-label { font-size: 13px; font-weight: 500; color: var(--c-navy); display: flex; align-items: center; gap: 8px; }

    mark { background: #FFF1DC; color: var(--c-navy); border-radius: 2px; padding: 0 2px; }
  
    /* ===== SO additions (PO idiom) ===== */
    .drawer-panel.wide { max-width: 1290px; }
    .emp-chip{display:inline-flex;align-items:center;gap:8px;min-width:0;}
    .emp-av{width:28px;height:28px;border-radius:50%;background:var(--c-navy);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex-shrink:0;}
    .emp-chip.is-empty .emp-av{background:var(--c-off-white);color:var(--c-text-soft);border:1px dashed var(--c-border);}
    .emp-t{display:flex;flex-direction:column;line-height:1.25;min-width:0;}
    .emp-r{font-size:10.5px;color:var(--c-text-mute);font-weight:600;white-space:nowrap;}
    .emp-n{font-size:12.8px;font-weight:600;color:var(--c-navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .emp-chip.sm .emp-av{width:22px;height:22px;font-size:9.5px;} .emp-chip.sm .emp-n{font-size:12px;}
    .slot-row{display:grid;grid-template-columns:34px 200px 1fr;gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--c-border);border-radius:var(--r);background:#fff;}
    .slot-row+.slot-row{margin-top:10px;} .slot-row.is-err{border-color:var(--c-danger);}
    .slot-no{width:26px;height:26px;border-radius:50%;background:var(--c-navy);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;margin-top:2px;}
    .slot-role{font-size:12px;font-weight:700;color:var(--c-navy);padding-top:6px;}
    .hard-warn{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;margin-bottom:10px;border-radius:var(--r);background:rgba(230,46,36,0.08);border:1px solid rgba(230,46,36,0.25);font-size:12px;color:var(--c-danger);line-height:1.5;}
    .note{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:var(--r);background:var(--c-off-white);border:1px solid var(--c-border-soft);font-size:12.5px;color:var(--c-text);line-height:1.55;}
    .note.warn{background:var(--c-warning-08);border-color:rgba(232,135,15,.35);} .note.danger{background:var(--c-danger-08);border-color:rgba(230,46,36,.35);color:var(--c-danger);} .note.ok{background:var(--c-teal-08);border-color:rgba(31,157,85,.35);}
    .combo-pop{position:fixed;background:#fff;border:1px solid var(--c-border);border-radius:var(--r);box-shadow:var(--sh-lg);z-index:90;max-height:280px;overflow-y:auto;}
    .combo-pop button{width:100%;text-align:left;padding:8px 12px;background:transparent;border:0;cursor:pointer;border-bottom:1px solid var(--c-border-soft);display:flex;align-items:center;gap:10px;font-family:inherit;}
    .combo-pop button:hover,.combo-pop button.hi{background:var(--c-primary-08);}
    .combo-pop button:last-child{border-bottom:0;}
    .tl{display:flex;flex-direction:column;gap:0;}
    .tl-i{position:relative;padding:0 0 16px 22px;} .tl-i::before{content:'';position:absolute;left:5px;top:6px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--c-border);} .tl-i::after{content:'';position:absolute;left:9px;top:18px;bottom:0;width:1px;background:var(--c-border-soft);} .tl-i:last-child::after{display:none;}
    .tl-i.ok::before{background:var(--c-teal);border-color:var(--c-teal);} .tl-i.warn::before{background:var(--c-warning);border-color:var(--c-warning);} .tl-i.bad::before{background:var(--c-danger);border-color:var(--c-danger);}

      ${s.priceOverride ? `<div class="note warn" style="margin-top: 14px;"><i data-lucide="alert-triangle" class="w-4 h-4"></i><div><strong>มีการแก้ราคาด้วยมือ</strong> — ${s.overrideNote} · ผู้อนุมัติจะเห็นบรรทัดที่แก้</div></div>` : ''}<div class="note" style="margin-top: 12px;"><i data-lucide="info" class="w-4 h-4"></i><div>เมื่ออนุมัติครบ → ยืนยันคำสั่งขาย · นับเป็น SO เปิดอยู่ในเครดิต ⑧ · ส่ง Warehouse (ถ้าเชื่อม) · แจ้งผู้ส่งผ่าน ENG-NOTIFY (doa_result)</div></div></div>
    <div style="padding: 12px 18px; background: var(--c-off-white); border-top: 1px solid var(--c-border-soft); display: flex; align-items: center; justify-content: flex-end; gap: 8px; border-radius: 0 0 var(--r-lg) var(--r-lg);"><button onclick="closeModal()" class="btn btn-ghost">ยกเลิก</button><button onclick="confirmSubmit()" class="btn btn-primary"><i data-lucide="send" class="w-4 h-4"></i><span>ส่งอนุมัติ</span></button></div>`; renderIcons(); }
function confirmSubmit() { const s = findSO(modalState.id); const sl = modalState.slots; if (sl.some(st => !st.assignee)) { modalState.err = true; renderSubmitModal(); return showToast('เลือกผู้อนุมัติให้ครบทุกขั้น', 'warning'); } const res = resolveDoa(s); s.status = 'pending_approval'; s.approval_status = 'pending_approval'; s.submittedBy = ME.name; s.submittedAt = nowIso(); s.doa_entry_ref = res.doa_entry_ref; s.approval_chain = res.steps.map((st, i) => ({ roles: st.roles, assignee: sl[i].assignee, status: 'pending', by: null, at: null })); s.approver_role = s.approval_chain[0].roles[0]; s.approved_by = null; s.approved_at = null; pushAudit(s, 'ส่งอนุมัติ · ' + s.approval_chain.map((st, i) => (i + 1) + ') ' + st.assignee + ' (' + (ROLE_LABEL[st.roles[0]] || st.roles[0]) + ')').join(' → '), res.why.join(' · ')); closeModal(); showToast(`ส่ง ${s.code} เพื่ออนุมัติแล้ว — My Approval ของ ${s.approval_chain[0].assignee}`, 'success'); if (getRoute().name === 'view') renderViewDrawer(); else render(); }
function openApproveModal(id) { const s = findSO(id); const cur = currentStep(s); const last = chainOf(s).filter(st => st.status === 'pending').length <= 1; const t = totals(s); const cc = creditCheck(s); closeModal(); modalShell(`<div class="card" style="position: relative; max-width: 640px; width: 100%; box-shadow: var(--sh-xl);"><div style="padding: 18px; border-bottom: 1px solid var(--c-border-soft); display: flex; align-items: flex-start; gap: 12px;"><div style="width: 40px; height: 40px; border-radius: 50%; background: var(--c-teal-08); display: grid; place-items: center; flex-shrink: 0;"><i data-lucide="check" class="w-5 h-5" style="color: var(--c-teal);"></i></div><div><h3 style="font-size: 14px; font-weight: 700; color: var(--c-navy);">อนุมัติ ${s.code} — ขั้น ${chainOf(s).indexOf(cur) + 1}/${chainOf(s).length}</h3><p style="font-size: 13px; margin-top: 4px; color: var(--c-text-mute);">${custName(s.customer)} · ยอดสุทธิ <strong>฿${formatMoney(t.grand)}</strong> · ${s.lines.filter(l => !l.is_free).length} รายการ · ส่ง ${formatThaiDate(s.deliveryDate)} · ${(PT_BY[s.paymentTerm] || {}).name || ''}${cc && !cc.isCash ? ` · เครดิตคงเหลือหลังใบนี้ <span style="color:${cc.over ? 'var(--c-danger)' : 'var(--c-teal)'};font-weight:600;">฿${formatMoney(cc.avail - cc.grand)}</span>` : ''}</p></div></div>
    <div style="padding: 18px;">${s.priceOverride ? `<div class="note warn" style="margin-bottom: 12px;"><i data-lucide="alert-triangle" class="w-4 h-4"></i><div><strong>แก้ราคาด้วยมือ:</strong> ${s.lines.filter(l => l.override).map(l => l.item_name + ' → ' + formatMoney(l.unit_price)).join(', ')} · เหตุผล: ${s.overrideNote}</div></div>` : ''}<div style="display: flex; gap: 18px; flex-wrap: wrap; margin-bottom: 14px;">${chainOf(s).map(st => `<div style="opacity: ${st === cur ? 1 : .55};">${empChip(st.by || st.assignee, st.roles[0], true)}</div>`).join('')}</div><label style="display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--c-navy);">หมายเหตุ (ไม่บังคับ)</label><input id="md-note" class="input" placeholder="เช่น อนุมัติตามสัญญาลงนาม…"><div class="note ok" style="margin-top: 12px;"><i data-lucide="check-circle-2" class="w-4 h-4"></i><div>${last ? 'ขั้นสุดท้าย — ยืนยันคำสั่งขาย · ส่ง Warehouse จัดของ · นับเครดิต · แจ้งผู้ส่ง (doa_result)' : 'ยังมีขั้นถัดไป — ส่งต่อผ่าน My Approval'}</div></div></div>
    <div style="padding: 12px 18px; background: var(--c-off-white); border-top: 1px solid var(--c-border-soft); display: flex; align-items: center; justify-content: flex-end; gap: 8px; border-radius: 0 0 var(--r-lg) var(--r-lg);"><button onclick="closeModal()" class="btn btn-ghost">ยกเลิก</button><button onclick="confirmApprove('${id}')" class="btn btn-success"><i data-lucide="check" class="w-4 h-4"></i><span>อนุมัติ</span></button></div></div>`); }
function confirmApprove(id) { const s = findSO(id); const cur = currentStep(s); if (!canActStep(s)) return showToast('ไม่ใช่ผู้มีสิทธิ์ในขั้นปัจจุบัน', 'warning'); const note = (document.getElementById('md-note') || {}).value || ''; cur.status = 'approved'; cur.by = ME.name; cur.at = nowIso(); cur.note = note; const idx = chainOf(s).indexOf(cur); const next = currentStep(s);
  if (next) { s.approver_role = next.roles[0]; pushAudit(s, `อนุมัติขั้น ${idx + 1}/${chainOf(s).length} · ${ME.name} (${ROLE_LABEL[cur.roles[0]] || cur.roles[0]})`, note); showToast(`อนุมัติขั้น ${idx + 1} แล้ว — ส่งต่อ ${next.assignee}`, 'success'); } else { s.status = 'confirmed'; s.approval_status = 'approved'; s.approved_by = ME.name; s.approved_at = nowIso(); s.approver_role = null; s.confirmedBy = ME.name; s.confirmedAt = nowIso(); const c = CUST_BY[s.customer]; if (c) c.openSO += creditExposure(s); const rs = reserveSO(s); const back = rs.filter(x => x.back > 0); pushAudit(s, `อนุมัติขั้น ${idx + 1}/${chainOf(s).length} · ${ME.name} (${ROLE_LABEL[cur.roles[0]] || cur.roles[0]}) — ครบสาย ยืนยันคำสั่งขาย · จองสต๊อก ${rs.length} รายการ${back.length ? ' (backorder ' + back.length + ')' : ''}${CFG.linkage.delivery && s.deliveryMethod !== 'pickup' ? ' · ส่ง Warehouse ออก DN' : ''}${s.taRef ? ' · นับเข้ายอดผูกพัน ' + s.taRef : ''}`, note); showToast(`อนุมัติครบสาย — ยืนยัน · จองสต๊อก ${rs.length} รายการ${back.length ? ' · backorder ' + back.length : ''} · นับเครดิต · ENG-NOTIFY so.confirmed`, 'success'); }
  closeModal(); if (getRoute().name === 'view') renderViewDrawer(); else render(); }
function reasonModal(title, icon, iconColor, iconBg, desc, extraFields, submitLabel, submitCls, onOk) { closeModal(); modalShell(`<div class="card" style="position: relative; max-width: 520px; width: 100%; box-shadow: var(--sh-xl);"><div style="padding: 18px; border-bottom: 1px solid var(--c-border-soft); display: flex; align-items: flex-start; gap: 12px;"><div style="width: 40px; height: 40px; border-radius: 50%; background: ${iconBg}; display: grid; place-items: center; flex-shrink: 0;"><i data-lucide="${icon}" class="w-5 h-5" style="color: ${iconColor};"></i></div><div><h3 style="font-size: 14px; font-weight: 700; color: var(--c-navy);">${title}</h3><p style="font-size: 13px; margin-top: 4px; color: var(--c-text-mute);">${desc}</p></div></div><div style="padding: 18px;">${extraFields || ''}<label style="display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--c-navy);">เหตุผล <span style="color: var(--c-danger);">*</span></label><textarea id="md-reason" rows="3" placeholder="ระบุเหตุผล..." class="input" style="height: auto; padding: 10px 12px; resize: vertical;"></textarea></div><div style="padding: 12px 18px; background: var(--c-off-white); border-top: 1px solid var(--c-border-soft); display: flex; align-items: center; justify-content: flex-end; gap: 8px; border-radius: 0 0 var(--r-lg) var(--r-lg);"><button onclick="closeModal()" class="btn btn-ghost">ปิด</button><button id="md-ok" class="btn ${submitCls}"><i data-lucide="${icon}" class="w-4 h-4"></i><span>${submitLabel}</span></button></div></div>`); document.getElementById('md-ok').onclick = () => { const r = (document.getElementById('md-reason').value || '').trim(); if (!r) return showToast('กรุณาระบุเหตุผล', 'warning'); onOk(r); }; }
function openRejectModal(id) { const s = findSO(id); reasonModal(`ไม่อนุมัติ ${s.code} — ตีกลับเป็นร่าง`, 'undo-2', 'var(--c-danger)', 'var(--c-danger-08)', 'เอกสารจะกลับเป็นฉบับร่างให้ผู้ส่งแก้ไขแล้วส่งใหม่ · ประวัติเก็บ append-only', '', 'ไม่อนุมัติ', 'btn-danger', r => { const cur = currentStep(s); if (!canActStep(s)) return showToast('ไม่ใช่ผู้มีสิทธิ์ในขั้นปัจจุบัน', 'warning'); cur.status = 'rejected'; cur.by = ME.name; cur.at = nowIso(); cur.note = r; s.approval_history = (s.approval_history || []).concat([{ submittedBy: s.submittedBy, submittedAt: s.submittedAt, chain: s.approval_chain, result: 'rejected' }]); s.status = 'draft'; s.approval_status = 'draft'; s.approved_by = null; s.approver_role = null; s.approval_chain = null; pushAudit(s, 'ไม่อนุมัติ · ' + ME.name + ' — ตีกลับเป็นร่าง', r); closeModal(); showToast(`ตีกลับ ${s.code} เพื่อแก้ไข`, 'info'); renderViewDrawer(); }); }
function openCancelModal(id) { const s = findSO(id); const st = sStatus(s); const hasDN = s.docs.dn.length > 0; if (hasDN) return showToast('มีการจัดส่งแล้ว — ยกเลิกไม่ได้ ให้ทำ Sales Return (RMA) / ใบลดหนี้', 'warning'); reasonModal(`ยกเลิกคำสั่งขาย ${s.code}?`, 'x-circle', 'var(--c-danger)', 'var(--c-danger-08)', 'การยกเลิกจะไม่สามารถย้อนกลับได้ · เครดิตที่กันไว้ปล่อยคืน · ถ้าส่ง Warehouse แล้วจะแจ้งยกเลิกการจัด', `<label style="display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--c-navy);">ประเภทเหตุผล</label><select id="md-rsel" class="select" style="margin-bottom: 12px;">${REASONS.cancel.map(x => `<option>${x}</option>`).join('')}</select>`, 'ยืนยันยกเลิก', 'btn-danger', r => { const rs = (document.getElementById('md-rsel') || {}).value || ''; chainOf(s).forEach(x => { if (x.status === 'pending') x.status = 'cancelled'; }); const wasOpen = ['confirmed', 'in_progress', 'on_hold'].includes(st); s.status = 'cancelled'; s.approval_status = 'cancelled'; s.hold = null; s.cancel = { by: ME.name, at: nowIso(), reason: rs, note: r }; if (wasOpen) { const c = CUST_BY[s.customer]; if (c) c.openSO = Math.max(0, c.openSO - creditExposure(s)); releaseSO(s); } pushAudit(s, 'ยกเลิกคำสั่งขาย' + (wasOpen ? ' · ปล่อยสต๊อกที่จอง · ปล่อยเครดิต' : ''), rs + ' — ' + r); closeModal(); showToast(`ยกเลิก ${s.code} เรียบร้อย${wasOpen ? ' · ปล่อยเครดิต · แจ้ง Warehouse' : ''}`, 'success'); if (getRoute().name === 'view') renderViewDrawer(); else renderTableOnly(); }); }
function openHoldModal(id) { const s = findSO(id); reasonModal(`พักคำสั่งขาย ${s.code} (hold)`, 'pause', 'var(--c-warning)', 'var(--c-warning-08)', 'Warehouse หยุดจัดส่งจนกว่าจะปลดพัก · เครดิตยังกันไว้', `<label style="display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--c-navy);">ประเภทเหตุผล</label><select id="md-rsel" class="select" style="margin-bottom: 12px;">${REASONS.hold.map(x => `<option>${x}</option>`).join('')}</select>`, 'พัก', 'btn-primary', r => { const rs = (document.getElementById('md-rsel') || {}).value || ''; s.status = 'on_hold'; s.hold = { by: ME.name, at: nowIso(), reason: rs, note: r }; pushAudit(s, 'พักคำสั่งขาย (hold)', rs + ' — ' + r); closeModal(); showToast(`พัก ${s.code} แล้ว · แจ้ง Warehouse หยุดจัด`, 'success'); renderViewDrawer(); }); }
function openManualModal(id, k) { const s = findSO(id); const lab = { delivery: 'จัดส่ง', invoice: 'วางบิล', payment: 'ชำระเงิน' }[k]; const L = { delivery: DLV, invoice: INVL, payment: PAY }[k]; reasonModal(`อัพเดตสถานะ${lab} (module ไม่เชื่อม)`, 'sliders-vertical', 'var(--c-primary)', 'var(--c-primary-08)', `${s.code} — Sales Configuration ตั้งไม่เชื่อม ${k} · บันทึกสถานะด้วยมือ (audit)`, `<label style="display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--c-navy);">สถานะ</label><select id="md-lsel" class="select" style="margin-bottom: 12px;">${['none', 'partial', 'done'].map(v => `<option value="${v}" ${effLink(s, k) === v ? 'selected' : ''}>${L[v]}</option>`).join('')}</select>`, 'บันทึก', 'btn-primary', r => { const v = (document.getElementById('md-lsel') || {}).value || 'none'; s.manual[k] = v; pushAudit(s, `อัพเดตสถานะ${lab}ด้วยมือ → ${L[v]}`, r); closeModal(); showToast('บันทึกสถานะแล้ว', 'success'); viewState.tab = 'fin'; renderViewDrawer(); }); }

// ---- Finance รับชำระ (mock · Payment Method master) ----
function openReceiptModal(id, rowNo) { const s = findSO(id); const p = paymentPlan(s); const row = p.rows.find(r => r.no === rowNo) || p.rows[0]; const remain = row ? Math.max(0, row.amount - row.paid) : p.total - p.paidTotal; closeModal(); modalShell(`<div class="card" style="position: relative; max-width: 560px; width: 100%; box-shadow: var(--sh-xl);"><div style="padding: 18px; border-bottom: 1px solid var(--c-border-soft); display: flex; align-items: flex-start; gap: 12px;"><div style="width: 40px; height: 40px; border-radius: 50%; background: var(--c-teal-08); display: grid; place-items: center; flex-shrink: 0;"><i data-lucide="wallet" class="w-5 h-5" style="color: var(--c-teal);"></i></div><div><h3 style="font-size: 14px; font-weight: 700; color: var(--c-navy);">บันทึกรับชำระ ${s.code}${row ? ' — งวด ' + row.no + ' · ' + row.label : ''}</h3><p style="font-size: 13px; margin-top: 4px; color: var(--c-text-mute);">Finance ออกใบสำคัญรับ (RV) · วิธีชำระจาก Payment Method master · คงค้างงวดนี้ ฿${formatMoney(remain)}</p></div></div>
    <div style="padding: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px;"><div><label style="display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--c-navy);">วิธีชำระ</label><select id="rv-pm" class="select" onchange="document.getElementById('rv-fee').textContent = (PAY_METHODS.find(m=>m.code===this.value)||{}).fee_pct ? 'ค่าธรรมเนียม ' + PAY_METHODS.find(m=>m.code===this.value).fee_pct + '% · เข้าบัญชี T+' + PAY_METHODS.find(m=>m.code===this.value).settle_days : 'ไม่มีค่าธรรมเนียม · เข้าบัญชี T+' + (PAY_METHODS.find(m=>m.code===this.value)||{}).settle_days">${PAY_METHODS.map(m => `<option value="${m.code}">${m.name}</option>`).join('')}</select><div id="rv-fee" style="font-size:11px;color:var(--c-text-mute);margin-top:4px;">ไม่มีค่าธรรมเนียม · เข้าบัญชี T+0</div></div><div><label style="display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--c-navy);">จำนวนเงิน (฿)</label><input id="rv-amt" type="number" min="0" step="0.01" class="input num" style="text-align:right;" value="${remain.toFixed(2)}"></div><div><label style="display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--c-navy);">วันที่รับ</label><input id="rv-date" type="date" class="input" value="${TODAY_ISO}"></div><div><label style="display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--c-navy);">อ้างอิง</label><input id="rv-ref" class="input" placeholder="เลขที่โอน / เช็ค / slip"></div></div>
    <div style="padding: 12px 18px; background: var(--c-off-white); border-top: 1px solid var(--c-border-soft); display: flex; align-items: center; justify-content: flex-end; gap: 8px; border-radius: 0 0 var(--r-lg) var(--r-lg);"><button onclick="closeModal()" class="btn btn-ghost">ยกเลิก</button><button onclick="confirmReceipt('${id}')" class="btn btn-success"><i data-lucide="check" class="w-4 h-4"></i><span>บันทึกรับชำระ (RV)</span></button></div></div>`); }
function confirmReceipt(id) { const s = findSO(id); const amt = parseFloat(document.getElementById('rv-amt').value) || 0; if (amt <= 0) return showToast('ระบุจำนวนเงิน', 'warning'); const pm = PAY_METHODS.find(m => m.code === document.getElementById('rv-pm').value) || PAY_METHODS[0]; const date = document.getElementById('rv-date').value || TODAY_ISO; const ref = document.getElementById('rv-ref').value || ''; const n = 'RV-2026-' + String(210 + (s.docs.rv || []).length + Math.floor(Math.random() * 60)).padStart(4, '0'); s.docs.rv = s.docs.rv || []; s.docs.rv.push({ no: n, date, amount: amt, method: pm.name, fee: Math.round(amt * pm.fee_pct) / 100, ref }); const p = paymentPlan(s); s.linkage.payment = p.paidTotal >= p.total - 0.005 ? 'done' : 'partial'; if (s.linkage.payment === 'done') s.docs.inv.forEach(i => i.status = 'ชำระแล้ว'); const c = CUST_BY[s.customer]; if (c && ['confirmed', 'in_progress', 'delivered', 'invoiced'].includes(sStatus(s))) c.ar = Math.max(0, c.ar - amt); pushAudit(s, `Finance รับชำระ ${n} ฿${formatMoney(amt)} · ${pm.name}${pm.fee_pct ? ' (ค่าธรรมเนียม ' + pm.fee_pct + '%)' : ''}${ref ? ' · ' + ref : ''}`, 'ระบบ linkage · GL: เงินสด/ธนาคาร Dr · ลูกหนี้ Cr'); closeModal(); showToast(`บันทึก ${n} แล้ว · ${s.linkage.payment === 'done' ? 'ชำระครบ' : 'ชำระบางส่วน'}`, 'success'); viewState.tab = 'fin'; renderViewDrawer(); }

  </script>
</body>
