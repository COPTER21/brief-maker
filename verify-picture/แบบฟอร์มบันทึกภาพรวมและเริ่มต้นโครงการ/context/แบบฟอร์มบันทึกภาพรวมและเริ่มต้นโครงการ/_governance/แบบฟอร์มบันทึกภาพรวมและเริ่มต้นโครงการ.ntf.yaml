feature_id: F-TMP-001
name: แบบฟอร์มบันทึกภาพรวมและเริ่มต้นโครงการ
code: PJI
events:
- id: pji_cancelled
  trigger: pending_approval → cancelled
  recipients:
  - current_step_approver
  template: '**{doc_no}** ถูกยกเลิกโดย {actor} — {reason}'
  channel: in-app
  optional: true
  why: ยกเลิกระหว่างรออนุมัติ — ผู้อนุมัติขั้นปัจจุบันต้องรู้ว่าไม่ต้องพิจารณาแล้ว
    (DOA engine ไม่ยิงกรณีนี้)
  frd_ref: 03_LOGIC F-TMP-001-FN-07, F-TMP-001-FN-09
- id: pji_owner_assigned
  trigger: pending_approval → approved (ขั้นสุดท้าย)
  recipients:
  - project.owner
  - plan[].owner
  template: คุณได้รับมอบหมายในโครงการ **{doc_no}** {project_name} — {role_in_project}
  channel: in-app+email
  optional: false
  why: อนุมัติเริ่มโครงการแล้ว ผู้รับผิดชอบหลัก/ผู้รับผิดชอบกิจกรรมต้องรู้ว่าได้รับมอบหมาย
    (ไม่ใช่ผู้ขอจึงไม่ได้ doa_result)
  frd_ref: 03_LOGIC F-TMP-001-FN-05, F-TMP-001-FN-09
excluded:
- doa_escalate
- doa_pending
- doa_result
note: ตัด pji_over_limit_approved (ไม่มีวงเงิน/เกณฑ์ตัวเลข) · เพิ่ม pji_owner_assigned
