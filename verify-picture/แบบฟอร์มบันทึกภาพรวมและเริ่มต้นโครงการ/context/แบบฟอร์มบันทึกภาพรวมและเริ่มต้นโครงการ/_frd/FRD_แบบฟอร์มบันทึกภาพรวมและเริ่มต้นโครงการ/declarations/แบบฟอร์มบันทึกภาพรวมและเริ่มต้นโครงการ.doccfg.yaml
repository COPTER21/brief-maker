feature_id: F-TMP-001
doc_types:
- code: PJI
  name_th: แบบฟอร์มบันทึกภาพรวมและเริ่มต้นโครงการ
  module: BDM
  feature_id: F-TMP-001
  numbering:
    preset: '{PREFIX}-{YYYY}-{run:4}'
    reset: yearly
    scope: global
    no_gap: false
    issue_on: first_save
    frd_ref: 03_LOGIC F-TMP-001-FN-03
  snapshot:
    sent_external: false
    approved_final: true
  snapshot_points:
  - event: approved_final
    frd_ref: 03_LOGIC F-TMP-001-FN-05
  print_config:
    form_code: FM-BDM-01
    revision: 'Rev.00 : 01/07/2569'
    paper: A4-portrait
    min_rows: 6
    dense_when_rows_over: 14
    header_source: organization_snapshot_at_numbering
    sign_boxes:
    - box: requester
      label: ผู้จัดทำ
      show_date: true
    - box: doa_step:*
      label: from_doa_step
      show_decision: true
      show_date: true
    decision_words:
      default:
        approve: อนุมัติ
        reject: ไม่อนุมัติ
      by_role:
        role-line-manager:
          approve: ตรวจสอบแล้ว
          reject: ส่งกลับแก้ไข
        role-gm:
          approve: อนุมัติ / รับทราบ
          reject: ไม่อนุมัติ
    sign_layout:
      source: approval_chain snapshot (ผู้ขอ + จำนวนขั้นตามที่ตั้งใน DOA)
      max_per_row: 4
      split: even
      dense_when_steps_over: 4
      keep_together: true
      render: ตาราง 'การตรวจทาน / อนุมัติ' 1 แถวต่อช่อง (บทบาท | ชื่อ | ตำแหน่ง |
        ลายเซ็น | วันที่) ตามกระดาษ — วนจาก sign_rows[].signs[]
    ref: print/print_config.json
