  const s = S.dw.step, edit = S.dw.editId ? findR(S.dw.editId) : null, last = s === STEPS.length;
  const body = s === 1 ? wizMain() : s === 2 ? wizAttach() : wizReview();
  return `<div class="dw-head"><div class="dw-head-row"><div>
        <div class="dw-eyebrow"><i data-lucide="${edit ? 'pencil' : 'file-plus'}" class="w-3.5 h-3.5"></i> ${edit ? 'แก้ไขเอกสาร' : 'สร้างเอกสารใหม่'}</div>
        <h2 class="dw-title">${edit ? edit.code : DOC_NAME + ' (Job Description)'}</h2></div>
        <button class="top-icon-btn" title="ปิด" onclick="closeDrawer()"><i data-lucide="x" class="w-5 h-5"></i></button></div>${stepper()}</div>
    <div class="drawer-body ${s === 1 ? 'is-soft' : ''}">${body}</div>
    <div class="dw-footer"><div>${s > 1 ? '<button class="btn btn-secondary" onclick="wizBack()"><i data-lucide="arrow-left" class="w-4 h-4"></i><span>ย้อนกลับ</span></button>' : ''}</div>
      <div class="dw-footer-right"><button class="btn btn-ghost" onclick="closeDrawer()">ยกเลิก</button>
        ${last ? `<button class="btn btn-secondary" id="btnDraft" onclick="saveDraft()" ${S.busy ? 'disabled' : ''}><i data-lucide="save" class="w-4 h-4"></i><span>บันทึกแบบร่าง</span></button>
          <button class="btn btn-primary" id="btnSaveSubmit" onclick="saveAndSubmit()" ${S.busy ? 'disabled' : ''}>${S.busy ? '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>' : '<i data-lucide="send" class="w-4 h-4"></i><span>บันทึกและส่งอนุมัติ</span>'}</button>`
          : '<button class="btn btn-primary" id="btnNext" onclick="wizNext()"><span>ถัดไป</span><i data-lucide="arrow-right" class="w-4 h-4"></i></button>'}
      </div></div>`;
}

/* ---------- wizard actions ---------- */
function goStep(n){ S.dw.step = n; render(); }
function clearErr(k){ if (S.dw.err) delete S.dw.err[k]; }
const setTxt = (id, t) => { const el = document.getElementById(id); if (el) el.textContent = t; };
function setPos(id){ const f = wf(), p = posOf(id); f.posId = id || ''; f.reportsTo = posOf(p.rep).th; if (!f.sups.some(x => x.pos.trim())) f.sups = [{ pos:posOf(p.rep).th, count:p.rep ? '1' : '' }]; clearErr('posId'); clearErr('sec1'); dirty(); render(); }
function setF1(k, v){ const f = wf(); f[k] = v; clearErr(k); dirty(); const el = document.querySelector(`[name="${k}"]`); if (el && el.closest('.field')) el.closest('.field').classList.remove('is-invalid'); }
function setRep(v){ setF1('reportsTo', v); setTxt('sumRep', v || '—'); const w = document.getElementById('repWarn'); if (w){ w.innerHTML = repMismatch(wf()) ? repWarnHTML() : ''; renderIcons(); } }
/* soft update — ไม่ rebuild ทั้ง drawer ตอนพิมพ์ (focus/scroll ไม่หลุด) */
function setText(k, v){ setF1(k, v); setTxt('sumSec', filledSec(wf()) + '/' + reqSecN); const c = document.querySelector('#sec-' + k); if (c && v.trim()) c.classList.remove('is-bad'); }
function setRow(g, i, k, v){ const f = wf(); f[g][i][k] = k === 'count' ? String(v).replace(/[^0-9]/g, '') : v; if (k === 'count'){ const el = document.querySelector(`[name="${g}-count-${i}"]`); if (el && el.value !== f[g][i][k]) el.value = f[g][i][k]; }
  dirty(); if (S.dw.err){ delete S.dw.err[g + '-' + i]; delete S.dw.err[g]; }
  setTxt('sumSub', subSummary(f)); setTxt('cSub', subSummary(f));
  const w = document.getElementById('repWarn'); if (w && g === 'sups' && i === 0){ w.innerHTML = repMismatch(f) ? repWarnHTML() : ''; renderIcons(); } }
function addRow(g){ const f = wf(); f[g].push({ pos:'', count:'' }); clearErr(g); dirty(); render(); requestAnimationFrame(() => { const el = document.querySelector(`[name="${g}-pos-${f[g].length - 1}"]`); if (el) el.focus(); }); }
function removeRow(g, i){ const f = wf(); if (g === 'sups' && f[g].length === 1) return; f[g].splice(i, 1); if (S.dw.err) Object.keys(S.dw.err).filter(k => k.indexOf(g + '-') === 0).forEach(k => delete S.dw.err[k]); dirty(); render(); }
function setAck(id){ wf().ackEmp = id || ''; dirty(); }
/* กฎบล็อก (DEC-04 · DEC-13/14/15) — เตือนไม่บล็อก: หัวหน้าแถวแรกไม่ตรงรายงานต่อ */
function rowErr(x, needOne){
  const pos = (x.pos || '').trim(), cnt = String(x.count || '').trim();
  if (!pos && !cnt) return needOne ? { pos:1, msg:'กรุณาระบุตำแหน่งหัวหน้าอย่างน้อย 1 แถว' } : null;
  if (!pos) return { pos:1, msg:'กรอกจำนวนแล้วต้องระบุตำแหน่ง' };
  if (!isInt(cnt)) return { count:1, msg:'จำนวน (คน) ต้องเป็นจำนวนเต็มตั้งแต่ 1' };
  return null;
}
function validateMain(){
  const f = wf(), err = {};
  if (!f.posId) err.posId = 1;
  else {
    if (!f.nameEn.trim()) err.nameEn = 1;
    if (!f.reportsTo.trim()) err.reportsTo = 1;
    SECTIONS.forEach(s => { if (s.req && !(f[s.k] || '').trim()) err[s.k] = 1; });
    if (!f.sups.some(x => (x.pos || '').trim())) err.sups = 'ต้องมีผู้บังคับบัญชาโดยตรงอย่างน้อย 1 แถว';
    f.sups.forEach((x, i) => { const e = rowErr(x, i === 0 && !err.sups ? false : false); if (e) err['sups-' + i] = e; });
    f.subs.forEach((x, i) => { const e = rowErr(x, false); if (e) err['subs-' + i] = e; });
    if (Object.keys(err).some(k => /^(sups|subs)-/.test(k))) err.rows = 1;
  }
  if (err.posId || err.nameEn || err.reportsTo) err.sec1 = 1;
  const ok = !Object.keys(err).length; S.dw.err = ok ? null : err; return ok;
}
function firstErrSec(){ const e = S.dw.err || {}; if (e.sec1) return 'sec1'; const s = SECTIONS.find(x => e[x.k]); if (s) return 'sec-' + s.k; return (e.sups || e.rows) ? 'sec-org' : null; }
function failMain(){ S.dw.step = 1; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); const id = firstErrSec(); requestAnimationFrame(() => { const el = id && document.getElementById(id); if (el) el.scrollIntoView({ block:'start', behavior:'smooth' }); }); }
function wizNext(){ if (S.dw.step === 1 && !validateMain()){ failMain(); return; } S.dw.step += 1; render(); }
function wizBack(){ S.dw.step = Math.max(1, S.dw.step - 1); render(); }
function pickFiles(inp){ const f = wf(); gateFiles(Array.from(inp.files || [])).forEach(x => f.files.push({ name:x.name, size:fmtSize(x.size) })); inp.value = ''; dirty(); render(); }
function removeFile(i){ wf().files.splice(i, 1); dirty(); render(); }
/* บันทึก = ENG-DOC-NUM.next('JD') ออกเลขครั้งแรก (DEC-11) · snapshot ตำแหน่ง/แผนก/ฝ่ายลงเอกสาร (ไม่แก้ Position master — DEC-01) */
function persist(){
  const f = wf(), me = ME(), p = posOf(f.posId), t = nowIso();
  let r = S.dw.editId ? findR(S.dw.editId) : null;
  const data = JSON.parse(JSON.stringify(f)); delete data.files;
  data.sups = data.sups.filter(x => (x.pos || '').trim() || String(x.count || '').trim()); data.subs = data.subs.filter(x => (x.pos || '').trim() || String(x.count || '').trim());
  if (!data.sups.length) data.sups = [{ pos:'', count:'' }];
  if (!r){
    SEQ += 1;
    r = { id:'R' + SEQ, code:DOC.prefix + '-2569-' + String(SEQ).padStart(4, '0'), status:'draft', posId:f.posId, by:S.me, reqDate:TODAY,
      chain:resolveDoa(S.me), doa_entry_ref:MOCK_DOA_RESOLVED.doa_entry_ref, ackAt:null, supersededBy:null, attachments:[], audit:[{ act:'สร้างเอกสาร', by:me.name, at:t, note:'', tone:'' }], createdBy:me.name, createdAt:t };
    RECS.unshift(r);
  } else r.audit.push({ act:'แก้ไขร่าง', by:me.name, at:t, tone:'' });
  Object.assign(r, { posId:f.posId, snap:{ th:p.th, dept:p.dept, div:p.div }, f:data, attachments:f.files.slice(), updatedBy:me.name, updatedAt:t });
  return r;
}
function saveDraft(){ if (S.busy) return; if (!wf().posId){ validateMain(); failMain(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const r = persist(); S.busy = false; closeDrawer(true); setTimeout(() => showToast('บันทึกร่างแล้ว · ' + r.code, 'info'), 300); }, 500); }
function saveAndSubmit(){ if (S.busy) return; if (!validateMain()){ failMain(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const r = persist(); S.busy = false; closeDrawer(true); setTimeout(() => openSubmit(r.id), 300); }, 500); }

/* =====================================================================
   MODALS — ส่งอนุมัติ (slot ต่อขั้น DOA) · อนุมัติ · ไม่อนุมัติ · ยกเลิก · รับทราบ · ระบุผู้ดำรงตำแหน่ง · ทิ้งข้อมูล
   ===================================================================== */
function modalShell(icon, tone, title, sub, body, foot){
  return `<div class="modal-header"><div class="modal-header-icon ${tone}"><i data-lucide="${icon}" class="w-4 h-4"></i></div><div><h3 class="modal-title">${title}</h3><p class="modal-subtitle">${sub}</p></div></div>
    ${body ? `<div class="modal-body">${body}</div>` : ''}<div class="modal-footer">${foot}</div>`;
}
const busyLabel = (icon, label) => S.busy ? '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>' : `<i data-lucide="${icon}" class="w-4 h-4"></i><span>${label}</span>`;
function presetChips(list, cur){ return `<div class="chip-row">${list.map(p => `<button type="button" class="chip ${cur === p ? 'is-on' : ''}" onclick="setReasonPreset(this.dataset.v)" data-v="${esc(p)}">${esc(p)}</button>`).join('')}</div>`; }
function submitIncomplete(r){ const f = r.f; return !f.nameEn.trim() || !f.reportsTo.trim() || SECTIONS.some(s => s.req && !(f[s.k] || '').trim()) || !f.sups.some(x => (x.pos || '').trim()) || f.sups.concat(f.subs).some(x => rowErr(x, false)); }
function renderModal(){
  const m = S.md; if (!m) return '';
  const r = m.id ? findR(m.id) : null;
  if (m.kind === 'submit'){
    const steps = resolveDoa(r.by), inc = submitIncomplete(r), live = liveOf(r.posId, r.id);
    return modalShell('send', 'is-primary', 'ส่งอนุมัติใบกำหนดหน้าที่งาน?', `${r.code} · ${esc(r.snap.th)}`,
      (inc ? `<div class="alert-row is-danger"><i data-lucide="alert-circle" class="w-4 h-4"></i><div>ข้อมูลยังไม่ครบ — แก้ไขร่างให้ครบก่อนส่ง</div></div>` : '')
      + steps.map((c, i) => `<div class="slot-row"><span class="slot-no num">${c.step}</span><span class="slot-role">${c.role}</span><div class="field ${m.err && !m.slots[i] ? 'is-invalid' : ''}" id="fSlot${i}">${searchSelectHTML('slot' + i, { placeholder:'เลือกผู้อนุมัติ' })}<div class="field-error">กรุณาเลือกผู้อนุมัติ</div>${i === 0 ? '<div class="slot-help">ค่าเริ่มต้นจากสายอนุมัติ (DOA กลาง)</div>' : ''}</div></div>`).join('')
      + (live ? `<div class="alert-row mt-3"><i data-lucide="history" class="w-4 h-4"></i><div>อนุมัติแล้ว ${live.code} (ฉบับใช้งานของตำแหน่งนี้) จะถูกแทนที่</div></div>` : ''),
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="btnSubmit" onclick="confirmSubmit()" ${S.busy || inc ? 'disabled' : ''}>${busyLabel('send', 'ส่งอนุมัติ')}</button>`);
  }
  if (m.kind === 'approve'){
    const c = curStep(r), last = r.chain.filter(x => x.status === 'waiting').length === 0, live = liveOf(r.posId, r.id);
    return modalShell('check-circle-2', 'is-success', 'อนุมัติใบกำหนดหน้าที่งานนี้?', `${r.code} · ${esc(r.snap.th)} · ขั้น ${c ? c.step : ''}`,
      `<div class="field"><label class="field-label">ความเห็น</label><textarea class="input" name="apNote" rows="2" placeholder="ไม่บังคับ" oninput="S.md.note=this.value">${esc(m.note || '')}</textarea></div>`
      + (last && live ? `<div class="alert-row mt-3"><i data-lucide="history" class="w-4 h-4"></i><div>${live.code} จะถูกแทนที่ด้วยฉบับนี้</div></div>` : ''),
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-success" id="btnApprove" onclick="confirmApprove()" ${S.busy ? 'disabled' : ''}>${busyLabel('check', 'อนุมัติ')}</button>`);
  }
  if (m.kind === 'ack'){
    return modalShell('check-check', 'is-success', 'รับทราบใบกำหนดหน้าที่งาน?', `${r.code} · ${esc(r.snap.th)}`,
      `<div class="step-hint">ยืนยันว่าอ่านหน้าที่ ความรับผิดชอบ และ KPI แล้ว</div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-success" id="btnAck" onclick="confirmAck()" ${S.busy ? 'disabled' : ''}>${busyLabel('check-check', 'รับทราบ')}</button>`);
  }
  if (m.kind === 'assignAck'){
    return modalShell('user-check', 'is-primary', r.f.ackEmp ? 'เปลี่ยนผู้ดำรงตำแหน่ง' : 'ระบุผู้ดำรงตำแหน่ง', `${r.code} · ${esc(r.snap.th)}`,
      `<div class="field ${m.err ? 'is-invalid' : ''}" id="fAssign"><label class="field-label">พนักงานที่ดำรงตำแหน่ง<span class="req">*</span></label>${searchSelectHTML('mack', { placeholder:'เลือกพนักงาน' })}<div class="field-error">กรุณาเลือกพนักงาน</div></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="btnAssign" onclick="confirmAssignAck()" ${S.busy ? 'disabled' : ''}>${busyLabel('send', 'บันทึกและแจ้งเตือน')}</button>`);
  }
  if (m.kind === 'reject' || m.kind === 'cancel'){
    const rej = m.kind === 'reject';
    return modalShell('x-circle', 'is-danger', rej ? 'ไม่อนุมัติใบกำหนดหน้าที่งาน?' : 'ยกเลิกเอกสาร?', `${r.code} · ${esc(r.snap.th)}${rej ? ' · กลับเป็นร่างเลขเดิมให้ผู้จัดทำแก้ไข' : r.status === 'pending' ? ' · รออนุมัติอยู่ — ผู้อนุมัติจะได้รับแจ้ง' : ''}`,
      `${presetChips(rej ? REJECT_PRESETS : CANCEL_PRESETS, m.preset)}
       <div class="field ${m.err ? 'is-invalid' : ''}" id="fReason"><label class="field-label">เหตุผล<span class="req">*</span></label><textarea class="input" name="reason" rows="3" placeholder="${rej ? 'แจ้งผู้จัดทำว่าต้องแก้อะไร' : 'เหตุผลที่ยกเลิก'}" oninput="S.md.reason=this.value; if(this.value.trim()) document.getElementById('fReason').classList.remove('is-invalid')">${esc(m.reason || '')}</textarea><div class="field-error">กรุณาระบุเหตุผล</div></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">${rej ? 'ยกเลิก' : 'ไม่ยกเลิก'}</button><button class="btn btn-danger" id="btnReason" onclick="confirmReason()" ${S.busy ? 'disabled' : ''}>${busyLabel('x-circle', rej ? 'ไม่อนุมัติ' : 'ยกเลิกเอกสาร')}</button>`);
  }
  if (m.kind === 'discard'){
    return modalShell('alert-triangle', 'is-warning', 'ทิ้งข้อมูลที่กรอกไว้?', 'ข้อมูลในแบบฟอร์มนี้ยังไม่ได้บันทึก', '',
      `<button class="btn btn-ghost" onclick="closeModal()">กลับไปกรอกต่อ</button><button class="btn btn-danger" id="btnDiscard" onclick="closeModal(); closeDrawer(true)">ทิ้งข้อมูล</button>`);
  }
  return '';
}
function openModalCfg(cfg){ S.md = cfg; state.modal.open = true; render(); requestAnimationFrame(() => document.getElementById('modalBackdrop').classList.add('is-open')); }
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('is-open'); state.modal.open = false; setTimeout(() => { if (!state.modal.open) S.md = null; }, 200); }
function modalBackdropClick(){ if (S.md && (S.md.reason || S.md.note)) return; closeModal(); }
function setReasonPreset(v){ S.md.preset = v; S.md.reason = v + (S.md.reason && S.md.reason.indexOf(v) !== 0 ? ' — ' + S.md.reason : ''); S.md.err = false; render(); }
function openSubmit(id){ const r = findR(id); if (!r || r.status !== 'draft') return; openModalCfg({ kind:'submit', id, slots:resolveDoa(r.by).map(c => c.assignee) }); }
function openApprove(id){ openModalCfg({ kind:'approve', id, note:'' }); }
function openReject(id){ openModalCfg({ kind:'reject', id, reason:'' }); }
function openCancel(id){ closeRowMenu(); openModalCfg({ kind:'cancel', id, reason:'' }); }
function openAck(id){ closeRowMenu(); const r = findR(id); if (!r || !canAck(r)) return; openModalCfg({ kind:'ack', id }); }
function openAssignAck(id){ const r = findR(id); if (!r || !canAssignAck(r)) return; openModalCfg({ kind:'assignAck', id, emp:r.f.ackEmp || null }); }
function pushAudit(r, act, note, tone){ const me = ME(), t = nowIso(); r.audit.push({ act, by:me.name, at:t, note:note || '', tone:tone || '' }); r.updatedBy = me.name; r.updatedAt = t; }
/* ENG-NOTIFY (NTF_BRIEF_F-TMP-004): jd_cancelled · jd_ack_requested · jd_acknowledged · jd_superseded · DOA engine เป็นเจ้าของ doa_pending/doa_result */
function confirmSubmit(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (m.slots.some(x => !x)){ m.err = true; render(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    r.chain = resolveDoa(r.by).map((c, i) => Object.assign(c, { assignee:m.slots[i], status:i === 0 ? 'pending' : 'waiting' }));   /* BR-DOA-02 resolve ตอนส่งแล้ว freeze */
    r.status = r.chain.length ? 'pending' : 'approved'; r.submittedAt = nowIso();
    pushAudit(r, 'ส่งอนุมัติ', r.chain.length ? 'ถึง ' + empOf(m.slots[0]).name : '');
    S.busy = false; closeModal(); render(); setTimeout(() => showToast('ส่งอนุมัติแล้ว · ' + r.code, 'success'), 220); }, 600);
}
function supersedeOld(r){
  RECS.filter(x => x !== r && x.posId === r.posId && LIVE.includes(x.status)).forEach(x => {   /* DEC-04 ตำแหน่งเดียวมีฉบับใช้งานฉบับเดียว · ENG-NOTIFY jd_superseded */
    x.status = 'superseded'; x.supersededBy = r.code; x.audit.push({ act:'ถูกแทนที่', by:'ระบบ', at:nowIso(), note:'แทนที่ด้วย ' + r.code, tone:'' }); x.updatedBy = 'ระบบ'; x.updatedAt = nowIso(); });
}
function confirmApprove(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    const c = curStep(r); c.status = 'approved'; c.at = nowIso(); c.note = (m.note || '').trim();
    const next = r.chain.find(x => x.status === 'waiting'); if (next) next.status = 'pending';
    r.status = next ? 'pending' : 'approved'; pushAudit(r, 'อนุมัติ (ขั้น ' + c.step + ')', c.note, 'ok');
    if (!next){ r.approvedAt = c.at; supersedeOld(r); }   /* ENG-NOTIFY jd_ack_requested → ผู้ดำรงตำแหน่ง (ถ้าระบุ) */
    S.busy = false; closeModal(); render(); setTimeout(() => showToast('อนุมัติแล้ว · ' + r.code, 'success'), 220); }, 600);
}
function confirmAck(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    r.ackAt = nowIso(); r.status = 'acknowledged'; pushAudit(r, 'ผู้ดำรงตำแหน่งรับทราบ', '', 'ok');   /* ENG-NOTIFY jd_acknowledged */
    S.busy = false; closeModal(); render(); setTimeout(() => showToast('รับทราบแล้ว · ' + r.code, 'success'), 220); }, 600);
}
function confirmAssignAck(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (!m.emp){ m.err = true; render(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    r.f.ackEmp = m.emp; pushAudit(r, 'ระบุผู้ดำรงตำแหน่ง', empOf(m.emp).name);   /* ENG-NOTIFY jd_ack_requested */
