feature_id: F-TMP-004
doc_types:
- code: JD
  name_th: ใบกำหนดหน้าที่งานประจำตำแหน่ง (JD)
  module: HR
  feature_id: F-TMP-004
  numbering:
    preset: '{PREFIX}-{YYYY}-{run:4}'
    reset: yearly
    scope: global
    no_gap: false
    issue_on: first_save
    frd_ref: 03_LOGIC F-TMP-004-FN-03
  snapshot:
    sent_external: false
    approved_final: true
  snapshot_points:
  - event: approved_final
    frd_ref: 03_LOGIC F-TMP-004-FN-05
  print_config:
    form_code: FM-HRM-32
    revision: 'Rev. 00 : 01/07/2569'
    paper: A4-portrait
    min_rows: 3
    dense_when_rows_over: 6
    header_source: organization_snapshot_at_numbering
    sign_boxes:
    - box: requester
      label: ผู้จัดทำ (Prepared By)
      show_date: true
    - box: doa_step:*
      label: from_doa_step
      show_decision: true
      show_date: true
    - box: acknowledger
      label: ผู้ดำรงตำแหน่ง (Acknowledged By)
      show_date: true
      position: last
      note: ไม่ใช่ขั้น DOA — ผู้ดำรงตำแหน่งกดรับทราบหลังอนุมัติ (DEC-04/DEC-16) ·
        ว่างได้
    decision_words:
      default:
        approve: อนุมัติ
        reject: ไม่อนุมัติ
      by_role: {}
    sign_layout:
      source: approval_chain snapshot (ผู้จัดทำ + จำนวนขั้นตามที่ตั้งใน DOA) + ผู้ดำรงตำแหน่งท้ายสุด
      max_per_row: 4
      split: even
      dense_when_steps_over: 4
      keep_together: true
    ref: print/print_config.json
