<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>เทียบราคาผู้ขาย — CUBE 4.0 Purchase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">
<style>
:root{
  --c-navy:#111111; --c-navy-2:#111111; --c-primary:#FF3B30; --c-primary-hover:#E62E24;
  --c-teal:#FF9A1F; --c-teal-light:#FFB763; --c-ink:#111111; --c-mute:#54565C;
  --c-mute-2:#73757B; --c-mute-3:#9A9CA2; --c-line:#DEDAD4; --c-line-2:#E9E5E0;
  --c-line-3:#F1EEEA; --c-bg-off:#FAF8F5; --c-success:#1F9D55; --c-warning:#E8870F; --c-danger:#E62E24;
  --sidebar-w:232px; --shell-h:52px;
  --fs-h1:22px; --fs-h2:17px; --fs-h3:15px; --fs-body:14px;
  --fs-sub:13px; --fs-meta:12px; --fs-cap:11px; --fs-kpi:28px;
  --sp-xs:4px; --sp-sm:8px; --sp-md:12px; --sp-lg:20px; --sp-xl:28px;
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px; --r-full:999px;
  --c-primary-08:rgba(255,59,48,.08); --c-primary-12:rgba(255,59,48,.14); --c-teal-08:rgba(255,154,31,.10);
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:rgba(17,17,17,.16) transparent}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(17,17,17,.14);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:rgba(17,17,17,.26)}
.sidebar{scrollbar-color:rgba(255,255,255,.28) transparent}
.sidebar ::-webkit-scrollbar-thumb,.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.28)}
.sidebar ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.42)}
html,body{margin:0;padding:0}
body{font-family:'Satoshi','Noto Sans Thai',system-ui,-apple-system,sans-serif;font-size:var(--fs-body);
  line-height:1.5;background:var(--c-bg-off);color:var(--c-ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,dl,dd,dt{margin:0}
button{font-family:inherit}
.tabular,.num,.tbl-mono{font-variant-numeric:tabular-nums}

/* ── sidebar ─────────────────────────────── */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);background:#111;z-index:20;
  border-right:1px solid rgba(255,255,255,.06);overflow-y:auto;display:flex;flex-direction:column}
.sb-brand{display:flex;align-items:center;gap:10px;padding:0 16px;height:var(--shell-h);flex:0 0 auto;
  border-bottom:1px solid rgba(255,255,255,.06)}
.sb-logo{width:26px;height:26px;border-radius:var(--r-sm);background:linear-gradient(135deg,var(--c-primary),var(--c-teal));
  display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px}
.sb-name{color:#fff;font-weight:700;font-size:var(--fs-sub);letter-spacing:.02em}
.sb-group{padding:14px 12px 4px;color:rgba(255,255,255,.38);font-size:var(--fs-cap);font-weight:700;
  letter-spacing:.08em;text-transform:uppercase}
.sb-item{display:flex;align-items:center;gap:10px;margin:1px 8px;padding:8px 10px;border-radius:var(--r-md);
  color:rgba(255,255,255,.62);font-size:var(--fs-sub);cursor:pointer;text-decoration:none;position:relative}
.sb-item:hover{color:#fff;background:rgba(255,255,255,.05)}
.sb-item.active{color:#fff;background:rgba(255,255,255,.08)}
.sb-item.active::before{content:"";position:absolute;left:-8px;top:6px;bottom:6px;width:3px;
  border-radius:0 3px 3px 0;background:var(--c-primary)}
.sb-item.active .lu{color:var(--c-primary)}
.sb-item .lu{width:16px;height:16px;flex:0 0 auto}

/* ── shell bar ───────────────────────────── */
.shell{margin-left:var(--sidebar-w)}
.shell-bar{position:sticky;top:0;z-index:19;height:var(--shell-h);background:#fff;
  border-bottom:1px solid var(--c-line-2);display:flex;align-items:center;gap:12px;padding:0 22px}
.crumb{display:flex;align-items:center;gap:6px;font-size:var(--fs-sub);color:var(--c-mute-2)}
.crumb b{color:var(--c-ink);font-weight:600}
.shell-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.icon-btn{width:32px;height:32px;border-radius:var(--r-sm);border:1px solid var(--c-line-2);background:#fff;
  display:grid;place-items:center;cursor:pointer;color:var(--c-mute)}
.icon-btn:hover{background:var(--c-line-3);color:var(--c-ink)}
.avatar{width:28px;height:28px;border-radius:var(--r-full);background:var(--c-line-3);color:var(--c-mute);
  display:grid;place-items:center;font-size:var(--fs-meta);font-weight:700;flex:0 0 auto;overflow:hidden}
.avatar.p{background:var(--c-primary-08);color:var(--c-primary)}
.content{padding:22px}

/* ── page header ─────────────────────────── */
.ph{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px}
.ph h1{font-size:var(--fs-h1);font-weight:700;color:var(--c-navy);letter-spacing:-.01em}
.ph h1 span{font-size:var(--fs-sub);font-weight:500;color:var(--c-mute-3)}
.ph-sub{font-size:var(--fs-sub);color:var(--c-mute);margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ph-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:var(--r-full);
  background:var(--c-line-3);color:var(--c-mute-2);font-size:var(--fs-cap);font-weight:600}

/* ── buttons ─────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;
  border-radius:var(--r-md);border:1px solid transparent;font-size:var(--fs-sub);font-weight:600;
  cursor:pointer;background:#fff;color:var(--c-ink);white-space:nowrap}
.btn .lu{width:16px;height:16px}
.btn.sm{height:30px;padding:0 10px;font-size:var(--fs-meta)}
.btn.sm .lu{width:14px;height:14px}
.btn-primary{background:var(--c-primary);color:#fff}
.btn-primary:hover{background:var(--c-primary-hover);box-shadow:0 2px 8px rgba(255,59,48,.30)}
.btn-primary:disabled{background:var(--c-mute-3);cursor:not-allowed;box-shadow:none}
.btn-secondary{border-color:var(--c-line);background:#fff;color:var(--c-ink)}
.btn-secondary:hover{background:var(--c-line-3)}
.btn-ghost{background:transparent;color:var(--c-mute)}
.btn-ghost:hover{background:var(--c-line-3);color:var(--c-ink)}
.btn-success{background:var(--c-success);color:#fff}
.btn-success:hover{filter:brightness(.94)}
.btn-link{background:transparent;border:0;color:var(--c-mute);padding:0 8px}
.btn-link.danger{color:var(--c-danger)}
.btn-link:hover{text-decoration:underline}
.top-icon-btn{width:32px;height:32px;border-radius:var(--r-sm);border:1px solid var(--c-line-2);background:#fff;
  display:grid;place-items:center;cursor:pointer;color:var(--c-mute);flex:0 0 auto}
.top-icon-btn:hover{background:var(--c-line-3);color:var(--c-ink)}
.top-icon-btn .lu{width:15px;height:15px}
.divider-v{width:1px;height:22px;background:var(--c-line-2);margin:0 4px}

/* ── card / form ─────────────────────────── */
.card{background:#fff;border:1px solid var(--c-line-2);border-radius:var(--r-lg);overflow:hidden}
.card+.card{margin-top:14px}
.card-head{display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--c-line-2);
  font-size:var(--fs-h3);font-weight:600}
.card-head .lu{width:16px;height:16px;color:var(--c-mute-2)}
.card-head .hint{margin-left:auto;font-size:var(--fs-cap);color:var(--c-mute-3);font-weight:500}
.card-body{padding:12px 18px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.lbl{font-size:var(--fs-meta);font-weight:600;color:var(--c-mute-2)}
.lbl .req{color:var(--c-primary)}
.input,.select,textarea.input{width:100%;height:36px;border:1px solid var(--c-line);border-radius:var(--r-md);
  padding:0 10px;font-size:var(--fs-sub);font-family:inherit;background:#fff;color:var(--c-ink);outline:none}
textarea.input{height:auto;padding:8px 10px;resize:vertical;line-height:1.5}
.input:focus,.select:focus{border-color:var(--c-primary);box-shadow:0 0 0 3px var(--c-primary-08)}
.input.err,.select.err{border-color:var(--c-danger);background:#FFF7F6}
.input:disabled{background:var(--c-line-3);color:var(--c-mute-3);cursor:not-allowed}
.field-help{font-size:var(--fs-cap);color:var(--c-mute-3)}
.field-help.err{color:var(--c-danger)}
.num{text-align:right}
</style>
<style>
/* ── table ───────────────────────────────── */
.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-sub)}
.tbl th{text-align:left;font-size:var(--fs-cap);font-weight:700;color:var(--c-mute-2);text-transform:uppercase;
  letter-spacing:.05em;padding:10px 12px;border-bottom:1px solid var(--c-line-2);background:#fff;white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--c-line-3);vertical-align:middle}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--c-line-3)}
.tbl-mono{font-variant-numeric:tabular-nums;font-weight:600;color:var(--c-primary)}
.tbl .r{text-align:right}
.tbl .c{text-align:center}
.sortable{cursor:pointer;user-select:none}
.sortable .lu{width:12px;height:12px;vertical-align:-1px;opacity:.5}
.tbl-foot{display:flex;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid var(--c-line-2);
  font-size:var(--fs-meta);color:var(--c-mute-2)}
.tbl-foot .right{margin-left:auto;display:flex;align-items:center;gap:4px}
.pg{min-width:28px;height:28px;border-radius:var(--r-sm);border:1px solid var(--c-line-2);background:#fff;
  font-size:var(--fs-meta);cursor:pointer;color:var(--c-mute)}
.pg.on{background:var(--c-primary);border-color:var(--c-primary);color:#fff;font-weight:700}

/* ── pills ───────────────────────────────── */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:var(--r-full);
  font-size:var(--fs-cap);font-weight:600;white-space:nowrap}
.pill .dot{width:5px;height:5px;border-radius:var(--r-full);background:currentColor}
.pill.info{background:#E6F0FF;color:#1A5FCC}
.pill.ok{background:#E4F4EB;color:#157A41}
.pill.warn{background:#FFF1DD;color:#B8690B}
.pill.mute{background:#F1EEEA;color:#73757B}
.pill.bad{background:#FFE9E7;color:#E62E24}
.pill.teal{background:var(--c-teal-08);color:#B8690B}
.sign-prog{display:flex;align-items:center;gap:7px;font-size:var(--fs-cap);color:var(--c-mute-2);font-weight:600}
.sign-bar{width:46px;height:4px;border-radius:var(--r-full);background:var(--c-line-2);overflow:hidden}
.sign-bar i{display:block;height:100%;background:var(--c-success)}
.emp-chip{display:inline-flex;align-items:center;gap:7px}
.emp-chip .meta{display:flex;flex-direction:column;line-height:1.25}
.emp-chip .nm{font-size:var(--fs-sub);font-weight:600;color:var(--c-ink)}
.emp-chip .po{font-size:var(--fs-cap);color:var(--c-mute-3)}

/* ── empty / loading / error ─────────────── */
.state{display:flex;flex-direction:column;align-items:center;gap:10px;padding:56px 20px;text-align:center}
.state .circle{width:56px;height:56px;border-radius:var(--r-full);display:grid;place-items:center;background:var(--c-line-3);color:var(--c-mute-3)}
.state .circle .lu{width:26px;height:26px}
.state h3{font-size:var(--fs-h3);font-weight:600}
.state p{font-size:var(--fs-sub);color:var(--c-mute-2);max-width:380px}
.state.err .circle{background:#FFE9E7;color:var(--c-danger)}
.skel{height:14px;border-radius:var(--r-xs);background:linear-gradient(90deg,var(--c-line-3),var(--c-line-2),var(--c-line-3));
  background-size:200% 100%;animation:sk 1.2s ease infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── drawer ──────────────────────────────── */
.backdrop{position:fixed;inset:0;background:rgba(17,17,17,.40);z-index:50;opacity:0;transition:opacity 220ms}
.backdrop.on{opacity:1}
.drawer-panel{position:fixed;top:0;right:0;bottom:0;width:920px;max-width:96vw;background:#fff;z-index:51;
  box-shadow:-16px 0 40px rgba(17,17,17,.18);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform 280ms cubic-bezier(.4,0,.2,1)}
.drawer-panel.on{transform:translateX(0)}
.drawer-panel.wide{width:1290px}
.dw-head{padding:18px 24px 12px;border-bottom:1px solid var(--c-line-2);flex:0 0 auto}
.dw-head.create{padding:18px 24px 16px}
.eyebrow{display:flex;align-items:center;gap:6px;font-size:var(--fs-cap);font-weight:700;color:var(--c-mute-3);
  text-transform:uppercase;letter-spacing:.08em}
.eyebrow .lu{width:13px;height:13px}
.dw-title{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.dw-title h2{font-size:20px;font-weight:700}
.dw-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.dw-sum{font-size:var(--fs-sub);color:var(--c-mute-2);margin-top:6px}
.dw-body{flex:1;overflow-y:auto;padding:20px 24px}
.dw-body.create{padding:22px 24px}
.dw-foot{padding:14px 24px;border-top:1px solid var(--c-line-2);background:var(--c-bg-off);display:flex;
  align-items:center;gap:8px;flex:0 0 auto}
.dw-foot .right{margin-left:auto;display:flex;gap:8px}
.dw-foot-note{padding:12px 24px;border-top:1px solid var(--c-line-2);background:var(--c-bg-off);
  font-size:var(--fs-cap);color:var(--c-mute-3);display:flex;align-items:center;gap:8px;flex:0 0 auto}

</style>
<style>
/* ── shared components (note-box · toggle · modal · toast · timeline · kv) ── */
/* ── B2 v2 line editor ───────────────────── */
.line-tbl{font-size:12.5px}
.line-tbl th,.line-tbl td{padding-left:6px;padding-right:6px}
.line-tbl td{padding-top:6px;padding-bottom:6px;vertical-align:middle}
.line-tbl .input,.line-tbl .select{height:30px;font-size:12.5px;padding:0 8px}
.line-tbl tbody tr{cursor:default}
.line-tbl tbody tr:hover{background:transparent}
.line-tbl tr.expanded{background:var(--c-primary-08)}
.free-row{background:var(--c-teal-08)}
.item-combo{position:relative}
.item-combo .input{height:32px;padding:0 10px}
.combo-pop{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:70;background:#fff;
  border:1px solid var(--c-line-2);border-radius:var(--r-md);box-shadow:0 12px 32px rgba(17,17,17,.12);
  max-height:230px;overflow-y:auto;padding:4px}
.combo-pop.up{top:auto;bottom:calc(100% + 4px)}
.combo-opt{padding:7px 9px;border-radius:var(--r-sm);cursor:pointer;font-size:12.5px;display:flex;gap:8px;align-items:center}
.combo-opt:hover,.combo-opt.hi{background:var(--c-primary-08)}
.combo-opt mark{background:#FFF1DD;color:inherit;padding:0}
.combo-opt .sub{margin-left:auto;font-size:var(--fs-cap);color:var(--c-mute-3)}
.combo-empty{padding:10px;font-size:var(--fs-meta);color:var(--c-mute-3);text-align:center}
.line-expand-panel-anchor{background:var(--c-primary-08)}
.line-expand-panel-anchor>td{padding:0 16px 10px 44px !important}
.line-expand-panel-inner{background:#fff;border:1px solid var(--c-primary-12);border-radius:var(--r-md);
  padding:10px 12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12px;
  animation:line-expand-slide 220ms ease}
.line-collapse-panel .line-expand-panel-inner{animation:line-collapse-slide 200ms ease forwards}
@keyframes line-expand-slide{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes line-collapse-slide{to{opacity:0;transform:translateY(-4px)}}
.seg{display:inline-flex;background:var(--c-bg-off);border:1px solid var(--c-line-2);border-radius:var(--r-md);padding:2px}
.seg button{border:0;background:transparent;border-radius:var(--r-sm);padding:4px 9px;font-size:11.5px;
  font-weight:600;color:var(--c-mute-2);cursor:pointer}
.seg button.on{background:var(--c-primary);color:#fff}
.divider-s{width:1px;height:22px;background:var(--c-line-2)}
.hard-warn{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--c-warning);
  background:#FFF9EF;border-radius:var(--r-md);padding:10px 12px;font-size:var(--fs-meta);color:#8A5A08;margin-bottom:12px}
.hard-warn .lu{width:16px;height:16px;flex:0 0 auto;color:var(--c-warning)}
.note-box{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--c-line-2);
  background:var(--c-bg-off);border-radius:var(--r-md);padding:10px 12px;font-size:var(--fs-meta);color:var(--c-mute);margin-bottom:12px}
.note-box.warn{border-color:var(--c-warning);background:#FFF9EF;color:#8A5A08}
.note-box.danger{border-color:var(--c-danger);background:#FFF6F5;color:var(--c-danger)}
.note-box .lu{width:16px;height:16px;flex:0 0 auto}
.section-row{display:flex;align-items:center;gap:10px;padding:12px 18px}
.section-row .tt{font-size:var(--fs-sub);font-weight:600}
.section-row .lu{width:16px;height:16px;color:var(--c-mute-2)}
.toggle{margin-left:auto;width:38px;height:21px;border-radius:var(--r-full);background:var(--c-line-2);
  position:relative;cursor:pointer;border:0;flex:0 0 auto}
.toggle .toggle-slider{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:var(--r-full);
  background:#fff;transition:left 160ms;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--c-success)}
.toggle.on .toggle-slider{left:19px}
.sum-tbl{width:100%;font-size:13px;border-collapse:collapse}
.sum-tbl td{padding:4px 0}
.sum-tbl td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.sum-tbl tr.sep td{border-top:1px solid var(--c-line-2);padding-top:8px}
.sum-tbl tr.grand td{border-top:2px solid var(--c-line);padding-top:9px;font-size:14px;font-weight:700}
.sum-tbl tr.grand td:last-child{font-size:16px;font-weight:700;color:var(--c-primary)}
.vat-c{color:#7C4DBE}

/* ── upload ──────────────────────────────── */
.upload-zone{border:1.5px dashed var(--c-line);border-radius:var(--r-lg);padding:26px;text-align:center;background:var(--c-bg-off)}
.upload-zone .lu{width:32px;height:32px;color:var(--c-mute-3)}
.file-card{display:flex;align-items:center;gap:10px;border:1px solid var(--c-line-2);border-radius:var(--r-md);
  padding:9px 12px;background:#fff;font-size:var(--fs-sub)}
.file-card+.file-card{margin-top:8px}
.file-card .lu{width:16px;height:16px;color:var(--c-mute-2)}
.file-card .sz{margin-left:auto;font-size:var(--fs-cap);color:var(--c-mute-3)}

/* ── view drawer parts ───────────────────── */
.tabs{display:flex;gap:2px;margin-top:14px;border-bottom:1px solid var(--c-line-2);overflow-x:auto}
.tab{display:inline-flex;align-items:center;gap:6px;padding:9px 12px;font-size:var(--fs-sub);font-weight:600;
  color:var(--c-mute-2);border:0;background:transparent;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tab .lu{width:15px;height:15px}
.tab:hover{color:var(--c-ink)}
.tab.on{color:var(--c-primary);border-bottom-color:var(--c-primary)}
.sec{margin-bottom:16px}
.sec-h{display:flex;align-items:center;gap:7px;font-size:var(--fs-meta);font-weight:700;color:var(--c-mute-2);
  text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.sec-h .lu{width:14px;height:14px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.kv.c3{grid-template-columns:repeat(3,1fr)}
.kv.c4{grid-template-columns:repeat(4,1fr)}
.kv dt{font-size:var(--fs-cap);color:var(--c-mute-3);font-weight:600;margin-bottom:2px}
.kv dd{font-size:var(--fs-sub);color:var(--c-ink);font-weight:500}

<script>

function qline(no,price,disc,vat,avail,remark){ return {pr_line_no:no,unit_price:price,discount_pct:disc||0,

let ROUNDS=[

   {quote_id:'Q3',vendor_id:'V-0055',vendor_quote_no:'NT-0912',quote_date:'2026-09-09',valid_until:'2026-09-09',
    payment_term:'เครดิต 30 วัน',lead_time_days:3,warranty:'เปลี่ยนสินค้าชำรุดภายใน 14 วัน',note:'',

const roundsOfPr=pr=>ROUNDS.filter(r=>r.pr_id===pr);

/* ── คำนวณ ───────────────────────────────────────────────────────── */
function lineTotal(pr,q,ln){
  const prl=pr.lines.find(l=>l.no===ln.pr_line_no); if(!prl||!ln.available) return {net:0,vat:0,total:0};
  const gross=prl.qty*(Number(ln.unit_price)||0);
  const net=gross*(1-(Number(ln.discount_pct)||0)/100);
  const p=(Number(ln.vat_pct)||0)/100;
  let vat=0,total=net;
  if(ln.vat_mode==='add'){ vat=net*p; total=net+vat; }
  else if(ln.vat_mode==='included'){ vat=net*p/(1+p); total=net; }
  return {net:net,vat:vat,total:total};
}
function quoteTotals(pr,q){
  let net=0,vat=0,total=0,missing=0;
  pr.lines.forEach(l=>{ const ln=q.lines.find(x=>x.pr_line_no===l.no);
    if(!ln||!ln.available){ missing++; return; }
    const c=lineTotal(pr,q,ln); net+=c.net; vat+=c.vat; total+=c.total; });
  return {net:net,vat:vat,total:total,missing:missing,complete:missing===0};
}
function unitOf(pr,q,no){ const ln=q.lines.find(x=>x.pr_line_no===no);
  return (ln&&ln.available)?Number(ln.unit_price)||0:null; }
function bestUnit(pr,r,no){ const vals=r.quotes.map(q=>unitOf(pr,q,no)).filter(v=>v!=null&&v>0);
  return vals.length?Math.min.apply(null,vals):null; }
function bestTotal(pr,r){ const vals=r.quotes.filter(q=>quoteTotals(pr,q).complete).map(q=>quoteTotals(pr,q).total);
  return vals.length?Math.min.apply(null,vals):null; }
function isExpired(q){ return q.valid_until && q.valid_until < TODAY; }
function pushHist(r,event,note){ (r.history=r.history||[]).push({event:event,actor:CUR_USER,at:nowISO(),note:note||''}); }

/* ── คิวงาน ──────────────────────────────────────────────────────── */
const QUEUE={q:'',status:'',dept:'',loading:false,error:false};
function queueRows(){
  const rows=[];
  PRS.forEach(pr=>{
    const rs=roundsOfPr(pr.pr_id).filter(r=>r.status!=='cancelled');
    const latest=rs.length?rs[rs.length-1]:null;
    rows.push({pr:pr,round:latest});
  });
  return rows.filter(x=>{
    const q=QUEUE.q.trim().toLowerCase();
    if(q&&![x.pr.pr_no,x.pr.dept,x.pr.lines.map(l=>l.name).join(' ')].join(' ').toLowerCase().includes(q)) return false;
    if(QUEUE.status){ const st=x.round?x.round.status:'none'; if(st!==QUEUE.status) return false; }
    if(QUEUE.dept&&x.pr.dept!==QUEUE.dept) return false;
    return true;
  });
}
function renderQueue(){
  const rows=queueRows();
  const depts=Array.from(new Set(PRS.map(p=>p.dept)));
  const opt=(v,t,cur)=>'<option value="'+esc(v)+'"'+(cur===v?' selected':'')+'>'+esc(t)+'</option>';
  let body;
  if(QUEUE.error){
    body='<div class="state err" style="padding:34px 14px"><div class="circle"><i data-lucide="wifi-off" class="lu"></i></div>'+
      '<h3>โหลดคิวงานไม่สำเร็จ</h3><p>ไม่สามารถติดต่อระบบได้ในขณะนี้</p>'+
      '<button class="btn btn-secondary sm" onclick="retryQueue()"><i data-lucide="refresh-cw" class="lu"></i>ลองใหม่</button></div>';
  } else if(QUEUE.loading){
    body=Array.from({length:4}).map(()=>'<div style="padding:12px"><div class="skel" style="width:70%"></div>'+
      '<div class="skel" style="width:45%;margin-top:8px"></div></div>').join('');
  } else if(!rows.length){
    const filtering=QUEUE.q||QUEUE.status||QUEUE.dept;
    body='<div class="state" style="padding:34px 14px"><div class="circle"><i data-lucide="'+(filtering?'search-x':'inbox')+'" class="lu"></i></div>'+
      '<h3>'+(filtering?'ไม่พบงานที่ตรงกับเงื่อนไข':'ไม่มีงานรอเทียบราคา')+'</h3>'+
      '<p>'+(filtering?'ลองล้างตัวกรองแล้วดูอีกครั้ง':'ใบขอซื้อที่อนุมัติแล้วจะเข้าคิวที่นี่โดยอัตโนมัติ')+'</p>'+
      (filtering?'<button class="btn btn-secondary sm" onclick="resetQueue()">ล้างตัวกรอง</button>':'')+'</div>';
  } else {
    body=rows.map(x=>{
      const r=x.round, age=daysBetween(x.pr.approvedAt,TODAY);
      const nq=r?r.quotes.length:0;
      return '<div class="q-item'+(r&&r.round_id===SEL?' on':'')+'" onclick="selectRow(\''+x.pr.pr_id+'\')">'+
       '<div class="q-top"><span class="q-no">'+esc(x.pr.pr_no)+'</span>'+(r?rPill(r.status):'<span class="pill warn"><span class="dot"></span>ยังไม่เปิดรอบ</span>')+'</div>'+
       '<div class="q-meta"><span>'+esc(x.pr.dept)+'</span><span><b>'+x.pr.lines.length+'</b> รายการ</span>'+
         '<span>ต้องการใช้ '+fmtDate(x.pr.requiredDate)+'</span></div>'+
       '<div class="q-foot">'+(r?'<span class="chip"><i data-lucide="file-check" class="lu" style="width:11px;height:11px"></i>'+nq+' ใบเสนอราคา</span>':'')+
         '<span class="age'+(age>5?' hot':'')+'">อนุมัติมาแล้ว '+age+' วัน</span></div>'+
      '</div>';
    }).join('');
  }
  return '<div class="queue"><div class="queue-head">'+
    '<div class="queue-title"><i data-lucide="list-checks" class="lu"></i>คิวงานเทียบราคา'+
      '<span class="chip" style="margin-left:auto">'+rows.length+'</span></div>'+
    '<input class="input" style="margin-top:9px;height:32px;font-size:var(--fs-meta)" placeholder="ค้นหาเลขที่ / หน่วยงาน / รายการ" value="'+esc(QUEUE.q)+'" oninput="QUEUE.q=this.value;renderKeep(this)">'+
    '<div style="display:flex;gap:6px;margin-top:7px">'+
      '<select class="select" style="height:30px;font-size:var(--fs-cap)" onchange="QUEUE.status=this.value;render()">'+
        opt('','ทุกสถานะ',QUEUE.status)+opt('none','ยังไม่เปิดรอบ',QUEUE.status)+
        Object.keys(R_STATUS).filter(k=>k!=='cancelled').map(k=>opt(k,R_STATUS[k].t,QUEUE.status)).join('')+'</select>'+
      '<select class="select" style="height:30px;font-size:var(--fs-cap)" onchange="QUEUE.dept=this.value;render()">'+
        opt('','ทุกหน่วยงาน',QUEUE.dept)+depts.map(d=>opt(d,d,QUEUE.dept)).join('')+'</select>'+
      '<button class="btn btn-ghost sm" onclick="resetQueue()" title="รีเซ็ต"><i data-lucide="rotate-ccw" class="lu"></i></button>'+
    '</div></div><div class="queue-body">'+body+'</div></div>';
}
function renderKeep(el){ const p=el.selectionStart; render();
  const n=document.querySelector('.queue-head .input'); if(n){n.focus();n.setSelectionRange(p,p);} }
function resetQueue(){ QUEUE.q='';QUEUE.status='';QUEUE.dept=''; render(); }
function retryQueue(){ QUEUE.error=false;QUEUE.loading=true;render();
  setTimeout(()=>{QUEUE.loading=false;render();toast('โหลดคิวงานสำเร็จ');},700); }
function simulateQueueError(){ QUEUE.error=true; render(); }
function selectRow(pr_id){
  const rs=roundsOfPr(pr_id).filter(r=>r.status!=='cancelled');
  if(rs.length){ SEL=rs[rs.length-1].round_id; render(); }
  else openRoundConfirm(pr_id);
}

     '<th class="vend" style="min-width:110px"><span class="vn">ราคาซื้อครั้งก่อน</span><span style="font-weight:500;color:var(--c-mute-3)">อ้างอิง</span></th>'+

         const ln=q.lines.find(x=>x.pr_line_no===l.no); const c=lineTotal(pr,q,ln);
         const isB=best!=null&&Math.abs(u-best)<0.005;
         return '<td class="val'+(isB?' best':'')+'">'+money(u)+
           '<div style="font-size:var(--fs-cap);font-weight:500;opacity:.8">฿'+money(c.total)+'</div></td>'; }).join('')+
       '<td class="val" style="color:var(--c-mute-3)">'+(l.lastBuy!=null?money(l.lastBuy):'—')+'</td></tr>';
   }).join('')+
   '</tbody><tfoot>'+
   '<tr class="grand"><td>ยอดสุทธิรวม</td>'+
     r.quotes.map(q=>{ const t=quoteTotals(pr,q);
       const isB=bt!=null&&t.complete&&Math.abs(t.total-bt)<0.005;
       return '<td class="val'+(isB?' best':'')+'">฿'+money(t.total)+
         (t.complete?'':'<div style="font-size:var(--fs-cap);font-weight:500;color:var(--c-mute-3)">ไม่ครบทุกรายการ</div>')+'</td>'; }).join('')+
     '<td class="val" style="color:var(--c-mute-3)">—</td></tr>'+
   '<tr><td>ส่วนต่างจากราคาต่ำสุด</td>'+
     r.quotes.map(q=>{ const t=quoteTotals(pr,q);
       if(!t.complete||bt==null) return '<td class="val" style="color:var(--c-mute-3)">—</td>';
       const d=t.total-bt, pct=bt?d/bt*100:0;
       return '<td class="val"><span class="delta'+(d<0.005?' zero':'')+'">'+(d<0.005?'ต่ำสุด':'+'+money(d)+' ('+pct.toFixed(1)+'%)')+'</span></td>'; }).join('')+
     '<td class="val" style="color:var(--c-mute-3)">—</td></tr>'+
   '<tr><td>เงื่อนไขชำระเงิน</td>'+r.quotes.map(q=>'<td class="val">'+esc(q.payment_term||'—')+'</td>').join('')+'<td class="val">—</td></tr>'+
   '<tr><td>ระยะเวลาส่งมอบ</td>'+r.quotes.map(q=>{ const isB=q.lead_time_days===bestLead;
      return '<td class="val'+(isB?' best':'')+'">'+(q.lead_time_days!=null?q.lead_time_days+' วัน':'—')+'</td>'; }).join('')+'<td class="val">—</td></tr>'+
   '<tr><td>การรับประกัน / เงื่อนไขอื่น</td>'+r.quotes.map(q=>'<td class="val" style="font-weight:500">'+esc(q.warranty||'—')+'</td>').join('')+'<td class="val">—</td></tr>'+
   '<tr><td>อายุใบเสนอราคา</td>'+r.quotes.map(q=>'<td class="val" style="font-weight:500;color:'+(isExpired(q)?'var(--c-danger)':'var(--c-mute)')+'">'+
      (isExpired(q)?'หมดอายุ '+fmtDate(q.valid_until):'ถึง '+fmtDate(q.valid_until))+'</td>').join('')+'<td class="val">—</td></tr>'+
   '</tfoot></table></div></div>'+
   '<div style="display:flex;margin-top:12px"><button class="btn btn-primary" style="margin-left:auto" onclick="setTab(\'award\')">'+
     'ไปที่ผลการเลือก<i data-lucide="arrow-right" class="lu"></i></button></div>';
}

<script>
/* ── แท็บผลการเลือก ─────────────────────────────────────────────── */
let AWARD=null;   /* {mode, whole_vendor, lines:{no:vendor}, reason} */
function initAward(pr,r){
  if(AWARD&&AWARD.round_id===r.round_id) return AWARD;
  const bt=bestTotal(pr,r);
  let whole='';
  r.quotes.forEach(q=>{ const t=quoteTotals(pr,q); if(t.complete&&bt!=null&&Math.abs(t.total-bt)<0.005&&!whole) whole=q.vendor_id; });
  const lines={};
  pr.lines.forEach(l=>{ const b=bestUnit(pr,r,l.no);
    const q=r.quotes.find(qq=>{ const u=unitOf(pr,qq,l.no); return u!=null&&b!=null&&Math.abs(u-b)<0.005; });
    lines[l.no]=q?q.vendor_id:''; });
  AWARD={round_id:r.round_id,mode:r.award_mode||'whole',whole_vendor:whole,lines:lines,reason:r.award_reason||''};
  return AWARD;
}
function awardCalc(pr,r,a){
  const bt=bestTotal(pr,r);
  let total=0, ok=true, perVendor={}, allLowest=true;
  if(a.mode==='whole'){
    const q=r.quotes.find(x=>x.vendor_id===a.whole_vendor);
    if(!q){ ok=false; }
    else { const t=quoteTotals(pr,q); total=t.total; perVendor[q.vendor_id]=t.total;
      if(!t.complete) allLowest=false;
      if(bt==null||Math.abs(t.total-bt)>0.005) allLowest=false; }
  } else {
    pr.lines.forEach(l=>{
      const v=a.lines[l.no]; if(!v){ ok=false; return; }
      const q=r.quotes.find(x=>x.vendor_id===v); const ln=q&&q.lines.find(x=>x.pr_line_no===l.no);
      if(!q||!ln||!ln.available){ ok=false; return; }
      const c=lineTotal(pr,q,ln); total+=c.total; perVendor[v]=(perVendor[v]||0)+c.total;
      const b=bestUnit(pr,r,l.no); if(b==null||Math.abs(Number(ln.unit_price)-b)>0.005) allLowest=false;
    });
  }
  const single=r.quotes.length===1;
  return {total:total,ok:ok,perVendor:perVendor,isLowest:allLowest&&!single,needReason:(!allLowest)||single,lowest:bt,single:single};
}
function renderAwardTab(pr,r){
  if(!r.quotes.length) return '<div class="state"><div class="circle"><i data-lucide="award" class="lu"></i></div>'+
    '<h3>ยังตัดสินไม่ได้</h3><p>ต้องมีใบเสนอราคาอย่างน้อย 1 รายก่อนจึงจะเลือกผู้ชนะได้</p>'+
    '<button class="btn btn-secondary" onclick="setTab(\'quotes\')">ไปที่ใบเสนอราคา</button></div>';
  if(r.status==='awarded') return renderAwarded(pr,r);
  const a=initAward(pr,r), c=awardCalc(pr,r,a);
  const opt=(v,t,cur)=>'<option value="'+esc(v)+'"'+(cur===v?' selected':'')+'>'+esc(t)+'</option>';
  let picker;
  if(a.mode==='whole'){
    picker='<div class="aw-row" style="grid-template-columns:1fr 320px"><div><b style="font-size:var(--fs-sub)">ผู้ขายที่ชนะทั้งใบ</b>'+
      '<div style="font-size:var(--fs-cap);color:var(--c-mute-3)">เลือกได้เฉพาะรายที่เสนอครบทุกรายการ</div></div>'+
      '<select class="select" onchange="AWARD.whole_vendor=this.value;render()">'+opt('','— เลือกผู้ขาย —',a.whole_vendor)+
      r.quotes.map(q=>{ const t=quoteTotals(pr,q);
        return '<option value="'+esc(q.vendor_id)+'"'+(a.whole_vendor===q.vendor_id?' selected':'')+(t.complete?'':' disabled')+'>'+
          esc(vName(q.vendor_id))+' — ฿'+money(t.total)+(t.complete?'':' (ไม่ครบทุกรายการ)')+'</option>'; }).join('')+'</select></div>';
  } else {
    picker=pr.lines.map(l=>{
      const b=bestUnit(pr,r,l.no), v=a.lines[l.no];
      const q=r.quotes.find(x=>x.vendor_id===v); const ln=q&&q.lines.find(x=>x.pr_line_no===l.no);
      const cc=(q&&ln&&ln.available)?lineTotal(pr,q,ln):null;
      const lowest=ln&&b!=null&&Math.abs(Number(ln.unit_price)-b)<0.005;
      return '<div class="aw-row"><div><b style="font-size:var(--fs-sub)">'+esc(l.name)+'</b>'+
        '<div style="font-size:var(--fs-cap);color:var(--c-mute-3)">'+l.qty+' '+esc(l.uom)+' · ราคาต่ำสุด '+(b!=null?money(b):'—')+'/หน่วย</div></div>'+
        '<select class="select" onchange="AWARD.lines['+l.no+']=this.value;render()">'+opt('','— เลือกผู้ขาย —',v)+
          r.quotes.filter(q2=>unitOf(pr,q2,l.no)!=null).map(q2=>'<option value="'+esc(q2.vendor_id)+'"'+(v===q2.vendor_id?' selected':'')+'>'+
            esc(vName(q2.vendor_id))+' — '+money(unitOf(pr,q2,l.no))+'/หน่วย</option>').join('')+'</select>'+
        '<div style="text-align:right">'+(cc?'<b class="tabular">฿'+money(cc.total)+'</b>'+(lowest?'<div><span class="pill ok" style="font-size:10px">ต่ำสุด</span></div>':'<div><span class="pill warn" style="font-size:10px">ไม่ใช่ต่ำสุด</span></div>'):'<span style="color:var(--c-mute-3)">—</span>')+'</div></div>';
    }).join('');
  }
  const diff=c.lowest!=null?c.total-c.lowest:0;
  return '<div class="card"><div class="card-head"><i data-lucide="award" class="lu"></i>ผลการเลือกผู้ชนะ'+
     '<span class="hint">รอบนี้ยังแก้ได้ — ยืนยันแล้วจะล็อกทันที</span></div><div class="card-body">'+
   '<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">'+
     '<span style="font-size:var(--fs-meta);font-weight:600;color:var(--c-mute-2)">รูปแบบการเลือก</span>'+
     '<span class="mode-seg">'+
       '<button class="'+(a.mode==='whole'?'on':'')+'" onclick="AWARD.mode=\'whole\';render()">ทั้งใบ (ผู้ขายรายเดียว)</button>'+
       '<button class="'+(a.mode==='split'?'on':'')+'" onclick="AWARD.mode=\'split\';render()">แยกรายรายการ</button>'+
     '</span></div>'+
   picker+
   '<div class="aw-sum" style="margin-top:16px">'+
     '<div class="aw-card"><div class="k">ยอดที่จะออกใบสั่งซื้อ</div><div class="v">฿'+money(c.total)+'</div></div>'+
     '<div class="aw-card"><div class="k">ราคาต่ำสุดที่เป็นไปได้</div><div class="v" style="color:var(--c-ink)">'+(c.lowest!=null?'฿'+money(c.lowest):'—')+'</div></div>'+
     '<div class="aw-card"><div class="k">ส่วนต่าง</div><div class="v" style="color:'+(diff>0.005?'var(--c-danger)':'var(--c-success)')+'">'+
       (c.lowest==null?'—':(diff>0.005?'+฿'+money(diff):'ต่ำสุด'))+'</div></div>'+
     '<div class="aw-card"><div class="k">จำนวนผู้ขายที่ชนะ</div><div class="v" style="color:var(--c-ink)">'+Object.keys(c.perVendor).length+'</div></div>'+
   '</div>'+
   (Object.keys(c.perVendor).length?'<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">'+
     Object.keys(c.perVendor).map(v=>'<span class="pill teal">'+esc(vName(v))+' · ฿'+money(c.perVendor[v])+'</span>').join('')+'</div>':'')+
   (c.needReason?'<div class="note-box warn" style="margin-top:14px"><i data-lucide="triangle-alert" class="lu"></i><div>'+
      '<b>ต้องระบุเหตุผล</b><br>'+(c.single?'มีผู้เสนอราคาเพียงรายเดียว':'ผลที่เลือกไม่ใช่ราคาต่ำสุด — ส่วนต่าง ฿'+money(diff))+
      ' จึงต้องอธิบายเหตุผลให้ตรวจสอบย้อนหลังได้</div></div>':'')+
   '<div class="field" style="margin-top:14px"><label class="lbl">เหตุผลการเลือก'+(c.needReason?' <span class="req">*</span>':' (ถ้ามี)')+'</label>'+
     '<textarea class="input" rows="2" placeholder="เช่น ส่งมอบเร็วกว่า 6 วัน · มีประกันเปลี่ยนสินค้า 14 วัน · เคยส่งงานตรงเวลาต่อเนื่อง" oninput="AWARD.reason=this.value">'+esc(a.reason)+'</textarea>'+
     '<div class="preset-chips">'+['ส่งมอบเร็วกว่า','เงื่อนไขชำระเงินดีกว่า','มีการรับประกันครอบคลุมกว่า','คุณภาพ/สเปกตรงกว่า','มีผู้เสนอราคารายเดียว']
       .map(p=>'<button onclick="AWARD.reason=\''+p+'\';render()">'+p+'</button>').join('')+'</div></div>'+
   '</div><div class="dw-foot" style="border-radius:0 0 var(--r-lg) var(--r-lg)">'+
     '<span style="font-size:var(--fs-cap);color:var(--c-mute-3)">ยืนยันแล้วรอบนี้จะถูกล็อก — ต้องการเปลี่ยนต้องเปิดรอบใหม่</span>'+
     '<div class="right"><button class="btn btn-primary" '+(c.ok&&(!c.needReason||String(a.reason||'').trim().length>=3)?'':'disabled')+
       ' onclick="confirmAward()"><i data-lucide="check-circle-2" class="lu"></i>ยืนยันผลการเลือก</button></div></div></div>';
}
function renderAwarded(pr,r){
  const per={}; let total=0;
  r.awards.forEach(w=>{ total+=w.line_total; per[w.winner_vendor_id]=(per[w.winner_vendor_id]||0)+w.line_total; });
  return '<div class="locked" style="margin-bottom:14px"><i data-lucide="lock" class="lu" style="width:16px;height:16px"></i>'+
     'รอบนี้ตัดสินแล้วเมื่อ '+fmtDT(r.awarded_at)+' — ข้อมูลถูกล็อก แก้ไม่ได้</div>'+
   '<div class="card"><div class="card-head"><i data-lucide="award" class="lu"></i>ผู้ชนะ ('+(r.award_mode==='whole'?'ทั้งใบ':'แยกรายรายการ')+')</div>'+
   '<div class="card-body"><div class="aw-sum" style="margin-bottom:14px">'+
     '<div class="aw-card"><div class="k">ยอดที่จะออกใบสั่งซื้อ</div><div class="v">฿'+money(total)+'</div></div>'+
     '<div class="aw-card"><div class="k">ผู้ขายที่ชนะ</div><div class="v" style="color:var(--c-ink)">'+Object.keys(per).length+'</div></div>'+
     '<div class="aw-card"><div class="k">เป็นราคาต่ำสุดหรือไม่</div><div class="v" style="font-size:15px;color:'+(r.awards.every(w=>w.is_lowest)?'var(--c-success)':'var(--c-warning)')+'">'+
       (r.awards.every(w=>w.is_lowest)?'ใช่':'ไม่ใช่ — มีเหตุผลกำกับ')+'</div></div>'+
   '</div>'+
   '<table class="tbl" style="font-size:12.5px"><thead><tr><th style="width:26px" class="c">#</th><th>รายการ</th>'+
     '<th>ผู้ขายที่ชนะ</th><th style="width:100px" class="r">ราคา/หน่วย</th><th style="width:88px" class="r">ส่งมอบ</th>'+
     '<th style="width:74px" class="c">ต่ำสุด</th><th style="width:110px" class="r">รวม</th></tr></thead><tbody>'+
     r.awards.map(w=>{ const l=pr.lines.find(x=>x.no===w.pr_line_no);
       return '<tr style="cursor:default"><td class="c" style="color:var(--c-mute-3)">'+w.pr_line_no+'</td>'+
       '<td>'+esc(l?l.name:'—')+'</td><td>'+esc(vName(w.winner_vendor_id))+'</td>'+
       '<td class="r tabular">'+money(w.winner_unit_price)+'</td><td class="r">'+w.lead_time_days+' วัน</td>'+
       '<td class="c">'+(w.is_lowest?'<span class="pill ok">ใช่</span>':'<span class="pill warn">ไม่</span>')+'</td>'+
       '<td class="r tabular" style="font-weight:600">฿'+money(w.line_total)+'</td></tr>'; }).join('')+
   '</tbody></table>'+
   (r.award_reason?'<div class="note-box" style="margin-top:12px"><i data-lucide="message-square" class="lu"></i><div><b>เหตุผลการเลือก</b><br>'+esc(r.award_reason)+'</div></div>':'')+
   '<div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">'+
     Object.keys(per).map(v=>'<button class="btn btn-secondary sm" onclick="toast(\'ใบสั่งซื้อ (W3) — อยู่นอกขอบเขตรอบนี้\',\'bad\')">'+
       '<i data-lucide="shopping-cart" class="lu"></i>ออกใบสั่งซื้อให้ '+esc(vName(v))+' (฿'+money(per[v])+')</button>').join('')+
   '</div><div style="font-size:var(--fs-cap);color:var(--c-mute-3);margin-top:6px">ปุ่มออกใบสั่งซื้อเป็นจุดเชื่อมไปยังฟีเจอร์ปลายทาง — ยังไม่เปิดใช้งานในรอบนี้</div>'+
   '</div></div>';
}
function renderHistory(r){
  const TX={open:['เปิดรอบเทียบราคา',''],quote_add:['บันทึกใบเสนอราคา',''],quote_edit:['แก้ไขใบเสนอราคา',''],
    quote_del:['ลบใบเสนอราคา','warn'],mode:['เปลี่ยนรูปแบบการเลือก',''],award:['ยืนยันผลการเลือก','ok'],

    (r.history||[]).slice().reverse().map(h=>{ const m=TX[h.event]||[h.event,''];
      return '<div class="tl-i '+m[1]+'"><div class="t">'+esc(m[0])+'</div>'+
        '<div style="margin-top:6px">'+empChip(h.actor)+'</div>'+
        '<div class="m">'+fmtDT(h.at)+'</div>'+(h.note?'<div class="n">'+esc(h.note)+'</div>':'')+'</div>'; }).join('')+
  '</div></div></div>';
}

<script>
/* ── main render ─────────────────────────────────────────────────── */
function setTab(t){ TAB=t; render(); }
function renderMain(){
  const r=roundById(SEL);
  if(!r) return '<div class="card"><div class="state"><div class="circle"><i data-lucide="mouse-pointer-click" class="lu"></i></div>'+
    '<h3>เลือกงานจากคิวทางซ้าย</h3><p>เลือกใบขอซื้อที่อนุมัติแล้วเพื่อเปิดรอบเทียบราคา หรือดูรอบที่ทำค้างไว้</p></div></div>';
  const pr=prById(r.pr_id);
  const prCancelled=false; /* hook: ใบขอซื้อถูกยกเลิกหลังเปิดรอบ (SC-15) — mock flag */
  const locked=r.status==='awarded'||r.status==='cancelled';
  const tabs=[['quotes','ใบเสนอราคา','file-text',r.quotes.length],['matrix','ตารางเทียบ','scale',null],['award','ผลการเลือก','award',null]];
  const bodies={quotes:renderQuotesTab,matrix:renderMatrixTab,award:renderAwardTab};

  } else {
    actions='<button class="btn btn-secondary" onclick="confirmReopen()"><i data-lucide="rotate-ccw" class="lu"></i>เปิดรอบใหม่</button>';
  }

      rPill(r.status)+'<span class="chip">รอบที่ '+r.round_seq+'</span>'+
      (prev?'<span class="chip">ต่อจากรอบ '+prev.round_seq+'</span>':'')+

  '</div>'+bodies[TAB](pr,r)+renderHistory(r);
}
function render(){
  $('#page').innerHTML='<div class="ph"><div><h1>เทียบราคาผู้ขาย <span>(Vendor Price Comparison)</span></h1>'+
    '<div class="ph-sub">หยิบใบขอซื้อที่อนุมัติแล้ว → เทียบราคา เงื่อนไข และระยะส่งมอบจากผู้ขายหลายราย → เลือกผู้ชนะพร้อมเหตุผล → ส่งต่อออกใบสั่งซื้อ'+
    '<span class="chip"><i data-lucide="scale" class="lu" style="width:12px;height:12px"></i>คอนโซลปฏิบัติงาน — ไม่ใช่เอกสารธุรกรรม</span></div></div>'+
    '<div class="ph-right"><button class="btn btn-ghost" onclick="simulateQueueError()" title="สาธิตสถานะโหลดผิดพลาด"><i data-lucide="triangle-alert" class="lu"></i></button></div></div>'+
    '<div class="console">'+renderQueue()+'<div>'+renderMain()+'</div></div>';
  $('#modal-root').innerHTML=renderQuoteModal()+renderReasonModal()+renderModal();
  renderIcons();
}

/* ── modals (Pattern D) ──────────────────────────────────────────── */
let modalState=null;
function openModal(cfg){ modalState=cfg; render(); }
function closeModal(){ modalState=null; render(); }
function renderModal(){ if(!modalState) return ''; const m=modalState; window.__ok=m.onOk;
  return '<div class="mbd" onclick="if(event.target===this)closeModal()"><div class="modal">'+
   '<div class="modal-h"><div class="ic '+(m.tone||'p')+'"><i data-lucide="'+m.icon+'" class="lu"></i></div>'+
   '<div><h3>'+esc(m.title)+'</h3><p>'+esc(m.desc)+'</p></div></div>'+
   '<div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>'+
   '<button class="btn btn-primary" '+(m.okTone==='danger'?'style="background:var(--c-danger)"':'')+' onclick="__ok()">'+esc(m.ok)+'</button></div></div></div>'; }

function openRoundConfirm(pr_id){ const pr=prById(pr_id);
  openModal({icon:'play',tone:'p',title:'เปิดรอบเทียบราคา?',
    desc:'จะเปิดรอบเทียบราคาสำหรับใบขอซื้อ '+pr.pr_no+' ('+pr.lines.length+' รายการ) เพื่อเริ่มบันทึกใบเสนอราคาจากผู้ขาย',
    ok:'เปิดรอบ',onOk:function(){
      const id='R-'+Date.now();
      ROUNDS.push({round_id:id,pr_id:pr_id,round_seq:1,prev_round_id:null,status:'open',award_mode:'whole',
        opened_by:CUR_USER,opened_at:nowISO(),awarded_by:null,awarded_at:null,award_reason:'',awards:[],quotes:[],
        history:[{event:'open',actor:CUR_USER,at:nowISO(),note:'เปิดรอบเทียบราคาจาก '+pr.pr_no}]});
      SEL=id; TAB='quotes'; AWARD=null; closeModal(); toast('เปิดรอบเทียบราคาแล้ว'); }});
}
function confirmReopen(){
  const r=roundById(SEL),pr=prById(r.pr_id);
  openModal({icon:'rotate-ccw',tone:'p',title:'เปิดรอบเทียบราคาใหม่?',
    desc:'รอบเดิมจะยังอ่านได้และตรวจย้อนหลังได้ · รอบใหม่จะคัดลอกใบเสนอราคาเดิมมาเป็นค่าตั้งต้นให้แก้ต่อ',
    ok:'เปิดรอบใหม่',onOk:function(){
      const id='R-'+Date.now();
      ROUNDS.push({round_id:id,pr_id:r.pr_id,round_seq:r.round_seq+1,prev_round_id:r.round_id,status:'comparing',
        award_mode:'whole',opened_by:CUR_USER,opened_at:nowISO(),awarded_by:null,awarded_at:null,award_reason:'',awards:[],
        quotes:JSON.parse(JSON.stringify(r.quotes)),
        history:[{event:'reopen',actor:CUR_USER,at:nowISO(),note:'เปิดรอบที่ '+(r.round_seq+1)+' ต่อจากรอบที่ '+r.round_seq}]});
      SEL=id; TAB='quotes'; AWARD=null; closeModal(); toast('เปิดรอบที่ '+(r.round_seq+1)+' แล้ว'); }});
}
function confirmDeleteQuote(qid){
  const r=roundById(SEL); const q=r.quotes.find(x=>x.quote_id===qid);
  openModal({icon:'trash-2',tone:'d',title:'ลบใบเสนอราคานี้?',
    desc:'ใบเสนอราคาของ '+vName(q.vendor_id)+' จะถูกลบออกจากรอบนี้ การกระทำนี้ย้อนกลับไม่ได้ (การลบจะถูกบันทึกในประวัติ)',
    ok:'ลบ',okTone:'danger',onOk:function(){
      r.quotes=r.quotes.filter(x=>x.quote_id!==qid);
      pushHist(r,'quote_del','ลบใบเสนอราคา '+vName(q.vendor_id));
      if(!r.quotes.length) r.status='open';
      AWARD=null; closeModal(); toast('ลบใบเสนอราคาแล้ว'); }});
}
function confirmAward(){
  const r=roundById(SEL),pr=prById(r.pr_id),a=AWARD,c=awardCalc(pr,r,a);
  openModal({icon:'check-circle-2',tone:'s',title:'ยืนยันผลการเลือก?',
    desc:'ยอด ฿'+money(c.total)+' จาก '+Object.keys(c.perVendor).length+' ผู้ขาย — ยืนยันแล้วรอบนี้จะถูกล็อกทันที แก้ไม่ได้ ต้องการเปลี่ยนต้องเปิดรอบใหม่',
    ok:'ยืนยันผล',onOk:function(){ doAward(); }});
}
function doAward(){
  const r=roundById(SEL),pr=prById(r.pr_id),a=AWARD,c=awardCalc(pr,r,a);
  r.awards=[];
  pr.lines.forEach(l=>{
    const v=a.mode==='whole'?a.whole_vendor:a.lines[l.no];
    const q=r.quotes.find(x=>x.vendor_id===v); const ln=q&&q.lines.find(x=>x.pr_line_no===l.no);
    if(!q||!ln||!ln.available) return;
    const b=bestUnit(pr,r,l.no); const cc=lineTotal(pr,q,ln);
    r.awards.push({pr_line_no:l.no,winner_vendor_id:v,winner_unit_price:Number(ln.unit_price),
      lead_time_days:q.lead_time_days,is_lowest:b!=null&&Math.abs(Number(ln.unit_price)-b)<0.005,
      line_total:cc.total,reason:c.needReason?a.reason:''});
  });
  r.award_mode=a.mode; r.award_reason=a.reason; r.status='awarded';
  r.awarded_by=CUR_USER; r.awarded_at=nowISO();
  pushHist(r,'award','ตัดสินผู้ชนะ '+(a.mode==='whole'?'ทั้งใบ':'แยกรายรายการ')+' · ยอด ฿'+money(c.total)+(c.needReason?' · เหตุผล: '+a.reason:''));
  /* ENG-CSQ: master.changed → DC (terminal decision · ไม่ใช่การอนุมัติ) — ดู 5_DECLARATIONS/CSQ_BRIEF_F-PUR-COMPARE.md */
  AWARD=null; closeModal(); render(); toast('ยืนยันผลการเลือกแล้ว — รอบนี้ถูกล็อก');
}
/* reason modal (ยกเลิกรอบ) */
let reasonState=null;
function openReason(kind){ reasonState={kind:kind,text:''}; render(); }
function closeReason(){ reasonState=null; render(); }
function renderReasonModal(){ if(!reasonState) return '';
  const ok=String(reasonState.text||'').trim().length>=3;
  return '<div class="mbd" onclick="if(event.target===this)closeReason()"><div class="modal">'+
   '<div class="modal-h"><div class="ic d"><i data-lucide="ban" class="lu"></i></div><div><h3>ยกเลิกรอบเทียบราคา</h3>'+
     '<p>การยกเลิกย้อนกลับไม่ได้ — ใบขอซื้อจะกลับเข้าคิวให้เปิดรอบใหม่ และเหตุผลจะถูกบันทึกถาวรในประวัติ</p></div></div>'+
   '<div class="modal-b"><div class="field"><label class="lbl">เหตุผล <span class="req">*</span></label>'+
     '<textarea class="input" rows="3" placeholder="อย่างน้อย 3 ตัวอักษร" oninput="reasonState.text=this.value;render();focusReason()">'+esc(reasonState.text)+'</textarea>'+
     '<div class="preset-chips">'+['ใบขอซื้อถูกยกเลิก','ราคาที่ได้ยังไม่เหมาะสม ขอเทียบใหม่','ผู้ขายถอนข้อเสนอ','เปลี่ยนสเปกสินค้า']
       .map(p=>'<button onclick="reasonState.text=\''+p+'\';render()">'+p+'</button>').join('')+'</div></div></div>'+
   '<div class="modal-f"><button class="btn btn-ghost" onclick="closeReason()">ยกเลิก</button>'+
     '<button class="btn btn-primary" style="background:var(--c-danger)" '+(ok?'':'disabled')+' onclick="doCancelRound()">ยืนยันยกเลิกรอบ</button></div></div></div>'; }
function focusReason(){ const t=document.querySelector('.modal-b textarea'); if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length);} }
function doCancelRound(){ const r=roundById(SEL);
  r.status='cancelled'; r.cancel_reason=reasonState.text;
  pushHist(r,'cancel',reasonState.text);
  /* ENG-CSQ: doc.cancelled → EC (avoided) */
  reasonState=null; render(); toast('ยกเลิกรอบเทียบราคาแล้ว'); }
</script>
<script>
/* ── quote form modal (เพิ่ม/แก้ใบเสนอราคา) ─────────────────────── */
function openQuoteForm(qid){
  const r=roundById(SEL),pr=prById(r.pr_id);
  if(qid){ const q=r.quotes.find(x=>x.quote_id===qid); editQuote={mode:'edit',data:JSON.parse(JSON.stringify(q))}; }
  else {
    editQuote={mode:'add',data:{quote_id:'Q'+Date.now(),vendor_id:'',vendor_quote_no:'',quote_date:TODAY,
      valid_until:'',payment_term:'',lead_time_days:7,warranty:'',note:'',attachments:[],
      lines:pr.lines.map(l=>({pr_line_no:l.no,unit_price:0,discount_pct:0,vat_mode:'add',vat_pct:7,available:true,remark:''}))}};
  }
  render();
}
function closeQuoteForm(){ editQuote=null; render(); }
function qf(k,v){ editQuote.data[k]=v; renderQuoteKeep(); }
function qfl(no,k,v){ const ln=editQuote.data.lines.find(x=>x.pr_line_no===no); if(ln){ ln[k]=v; renderQuoteKeep(); } }
function renderQuoteKeep(){
  const a=document.activeElement; const id=a&&a.getAttribute?a.getAttribute('data-f'):null; const pos=a&&a.selectionStart;
  render();
  if(id){ const n=document.querySelector('[data-f="'+id+'"]'); if(n){ n.focus(); try{ if(pos!=null&&n.type!=='number'&&n.type!=='date') n.setSelectionRange(pos,pos); }catch(e){} } }
}
function renderQuoteModal(){
  if(!editQuote) return '';
  const r=roundById(SEL),pr=prById(r.pr_id),d=editQuote.data;
  const used=r.quotes.filter(q=>q.quote_id!==d.quote_id).map(q=>q.vendor_id);
  const opt=(v,t,cur)=>'<option value="'+esc(v)+'"'+(cur===v?' selected':'')+'>'+esc(t)+'</option>';
  const errV=!d.vendor_id, errP=!d.lines.some(l=>l.available&&(Number(l.unit_price)||0)>0);
  let t=0; d.lines.forEach(l=>{ if(l.available) t+=lineTotal(pr,{lines:d.lines},l).total; });
  return '<div class="mbd" onclick="if(event.target===this)closeQuoteForm()"><div class="modal" style="width:940px">'+
   '<div class="modal-h"><div class="ic p"><i data-lucide="'+(editQuote.mode==='edit'?'pencil':'file-plus')+'" class="lu"></i></div>'+
     '<div><h3>'+(editQuote.mode==='edit'?'แก้ไขใบเสนอราคา':'บันทึกใบเสนอราคาจากผู้ขาย')+'</h3>'+
     '<p>กรอกราคาและเงื่อนไขที่ได้รับจากผู้ขาย เพื่อนำไปเทียบกับรายอื่นในรอบนี้</p></div></div>'+
   '<div class="modal-b"><div class="form-grid" style="margin-bottom:14px">'+
     '<div class="field"><label class="lbl">ผู้ขาย <span class="req">*</span></label>'+
       '<select class="select'+(errV?' err':'')+'" data-f="v" onchange="qf(\'vendor_id\',this.value)">'+opt('','— เลือกผู้ขาย —',d.vendor_id)+
       VENDORS.filter(v=>used.indexOf(v.code)<0).map(v=>opt(v.code,v.code+' — '+v.name,d.vendor_id)).join('')+'</select>'+
       '<span class="field-help">อ้างอิงแบบอ่อนจากทะเบียนผู้ขาย · ผู้ขายที่บันทึกไปแล้วในรอบนี้จะไม่แสดง</span></div>'+
     '<div class="field"><label class="lbl">เลขที่ใบเสนอราคาของผู้ขาย</label>'+
       '<input class="input" data-f="qn" value="'+esc(d.vendor_quote_no)+'" oninput="qf(\'vendor_quote_no\',this.value)" placeholder="เช่น QT-OM-2609"></div>'+
     '<div class="field"><label class="lbl">วันที่ในใบเสนอราคา</label>'+
       '<input type="date" class="input" data-f="qd" value="'+esc(d.quote_date)+'" onchange="qf(\'quote_date\',this.value)"></div>'+
     '<div class="field"><label class="lbl">ใช้ได้ถึงวันที่</label>'+
       '<input type="date" class="input" data-f="vu" value="'+esc(d.valid_until||'')+'" onchange="qf(\'valid_until\',this.value)">'+
       (d.valid_until&&d.valid_until<TODAY?'<span class="field-help err">วันที่นี้ผ่านมาแล้ว — ใบเสนอราคาจะถูกทำเครื่องหมายว่าหมดอายุ</span>':'')+'</div>'+
     '<div class="field"><label class="lbl">เงื่อนไขชำระเงิน</label>'+
       '<input class="input" data-f="pt" value="'+esc(d.payment_term)+'" oninput="qf(\'payment_term\',this.value)" placeholder="เช่น เครดิต 30 วัน"></div>'+
     '<div class="field"><label class="lbl">ระยะเวลาส่งมอบ (วัน)</label>'+
       '<input type="number" min="0" class="input num" data-f="lt" value="'+(d.lead_time_days==null?'':d.lead_time_days)+'" oninput="qf(\'lead_time_days\',+this.value)"></div>'+
     '<div class="field full"><label class="lbl">การรับประกัน / เงื่อนไขอื่น</label>'+
       '<input class="input" data-f="wr" value="'+esc(d.warranty)+'" oninput="qf(\'warranty\',this.value)" placeholder="เช่น เปลี่ยนสินค้าชำรุดภายใน 14 วัน"></div>'+
     '<div class="field full"><label class="lbl">หมายเหตุ</label>'+
       '<input class="input" data-f="nt" value="'+esc(d.note)+'" oninput="qf(\'note\',this.value)"></div>'+
   '</div>'+
   '<div class="sec-h"><i data-lucide="list" class="lu"></i>ราคาต่อรายการ</div>'+
   (errP?'<div class="note-box danger"><i data-lucide="alert-circle" class="lu"></i><div>ต้องมีอย่างน้อย 1 รายการที่ผู้ขายเสนอราคามากกว่า 0</div></div>':'')+
   '<div style="overflow-x:auto"><table class="tbl" style="font-size:12.5px;min-width:640px"><thead><tr><th style="width:26px" class="c">#</th><th>รายการ</th>'+
     '<th style="width:62px" class="r">จำนวน</th><th style="width:58px">หน่วย</th>'+
     '<th style="width:100px" class="r">ราคา/หน่วย</th><th style="width:74px" class="r">ส่วนลด %</th>'+
     '<th style="width:96px" class="c">ภาษี</th><th style="width:74px" class="c">เสนอ</th>'+
     '<th style="width:104px" class="r">รวม</th></tr></thead><tbody>'+
     pr.lines.map(l=>{ const ln=d.lines.find(x=>x.pr_line_no===l.no); const c=ln.available?lineTotal(pr,{lines:d.lines},ln):{total:0};
       return '<tr style="cursor:default'+(ln.available?'':';opacity:.55')+'">'+
       '<td class="c" style="color:var(--c-mute-3)">'+l.no+'</td>'+
       '<td>'+esc(l.name)+'<div style="font-size:var(--fs-cap);color:var(--c-mute-3)">ราคาประมาณจากใบขอซื้อ '+money(l.est)+'</div></td>'+
       '<td class="r">'+l.qty+'</td><td>'+esc(l.uom)+'</td>'+
       '<td class="r"><input type="number" min="0" step="0.01" class="input num" data-f="p'+l.no+'" style="height:30px;font-size:12.5px" '+(ln.available?'':'disabled')+' value="'+(ln.unit_price)+'" oninput="qfl('+l.no+',\'unit_price\',+this.value)"></td>'+
       '<td class="r"><input type="number" min="0" max="100" step="0.01" class="input num" data-f="d'+l.no+'" style="height:30px;font-size:12.5px" '+(ln.available?'':'disabled')+' value="'+(ln.discount_pct)+'" oninput="qfl('+l.no+',\'discount_pct\',+this.value)"></td>'+
       '<td class="c"><select class="select" style="height:30px;font-size:12px" '+(ln.available?'':'disabled')+' onchange="qfl('+l.no+',\'vat_mode\',this.value)">'+
         opt('none','ไม่คิด',ln.vat_mode)+opt('add','บวก 7%',ln.vat_mode)+opt('included','รวมแล้ว',ln.vat_mode)+'</select></td>'+
       '<td class="c"><button class="toggle'+(ln.available?' on':'')+'" style="margin:0 auto" onclick="qfl('+l.no+',\'available\','+(!ln.available)+')"><span class="toggle-slider"></span></button></td>'+
       '<td class="r tabular" style="font-weight:600">'+(ln.available?'฿'+money(c.total):'<span class="pill mute">ไม่เสนอ</span>')+'</td></tr>'; }).join('')+
   '</tbody></table></div>'+
   '<div style="display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;background:var(--c-bg-off);border-radius:var(--r-md)">'+
     '<i data-lucide="paperclip" class="lu" style="width:15px;height:15px;color:var(--c-mute-2)"></i>'+
     '<span style="font-size:var(--fs-meta)">เอกสารแนบ '+(d.attachments||[]).length+' ไฟล์</span>'+
     '<button class="btn btn-ghost sm" onclick="addQuoteFile()"><i data-lucide="plus" class="lu"></i>แนบไฟล์</button>'+
     '<b style="margin-left:auto;font-size:15px;color:var(--c-primary)" class="tabular">ยอดสุทธิ ฿'+money(t)+'</b></div>'+
   '</div>'+
   '<div class="modal-f"><button class="btn btn-ghost" onclick="closeQuoteForm()">ยกเลิก</button>'+
     '<button class="btn btn-primary" '+(!errV&&!errP?'':'disabled')+' onclick="saveQuote()"><i data-lucide="save" class="lu"></i>บันทึกใบเสนอราคา</button></div>'+
  '</div></div>';
}
let qfi=0;
function addQuoteFile(){ const f=[['ใบเสนอราคา_ผู้ขาย.pdf','312 KB'],['เงื่อนไขการรับประกัน.pdf','88 KB']][qfi++%2];
  (editQuote.data.attachments=editQuote.data.attachments||[]).push({name:f[0],size:f[1]}); render(); toast('แนบไฟล์แล้ว'); }
function saveQuote(){
  const r=roundById(SEL),d=editQuote.data;
  const i=r.quotes.findIndex(q=>q.quote_id===d.quote_id);
  if(i>=0){ r.quotes[i]=d; pushHist(r,'quote_edit','แก้ไขใบเสนอราคา '+vName(d.vendor_id)); }
  else { r.quotes.push(d); pushHist(r,'quote_add','บันทึกใบเสนอราคา '+vName(d.vendor_id)); }
  if(r.status==='open') r.status='comparing';
  editQuote=null; AWARD=null; render(); toast('บันทึกใบเสนอราคาแล้ว');
}

/* Esc chain: quote form → reason modal → confirm modal */
document.addEventListener('keydown',e=>{ if(e.key!=='Escape') return;
  if(editQuote){ closeQuoteForm(); return; }
  if(reasonState){ closeReason(); return; }
  if(modalState){ closeModal(); return; } });

document.addEventListener('DOMContentLoaded',render);
if(document.readyState!=='loading') render();
</script>
