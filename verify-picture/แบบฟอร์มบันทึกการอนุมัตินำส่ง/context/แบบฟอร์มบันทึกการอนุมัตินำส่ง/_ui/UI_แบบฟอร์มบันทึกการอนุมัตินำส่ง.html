/* DEC-08: ยกเลิกได้ — เจ้าของ + admin role · สถานะร่าง / รออนุมัติ · เหตุผลบังคับ */
const canCancel = r => (r.status === 'draft' || r.status === 'pending') && (isOwner(r) || isAdmin());
function tabBtn(key, label, icon, count){ return `<button class="drawer-tab ${S.dw.tab === key ? 'is-active' : ''}" onclick="setTab('${key}')"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i> ${label}${count != null ? `<span class="dt-count num">${count}</span>` : ''}</button>`; }
function kv(label, val){ return `<div class="lbl">${label}</div><div class="val">${val}</div>`; }
const SEC = (icon, title, body, extra) => `<div class="drawer-section"><div class="drawer-section-title"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i>${title}${extra || ''}</div>${body}</div>`;
const dash = v => v ? esc(v) : '<span class="cell-mute">—</span>';
function reqFields(x){ return `<div class="drawer-fields">${kv('ชื่อโครงการ / ธุรกรรม', dash(x.project))}${kv('เรื่องที่ขออนุมัติ', dash(x.subject))}${kv('เอกสารประกอบ', dash(x.docs))}${kv('ระดับอำนาจอนุมัติ', lvPill(x.level))}${kv('ข้อเสนอของฝ่ายบริหารการลงทุน', dash(x.proposal))}${kv('เงื่อนไขการอนุมัติ', dash(x.conds))}</div>`; }
/* ผลการพิจารณา — 1 แถวต่อขั้นใน approval_chain (ระบบเติมจากการกดพิจารณา · ผู้จัดทำแก้ไม่ได้ — DEC-13) */
function reviewTable(chain, draft){
  return `<div class="table-wrap rs-view"><table class="table"><thead><tr><th>ลำดับ</th><th>ผู้พิจารณา / ผู้อนุมัติ</th><th>ตำแหน่ง</th><th>ผลการพิจารณา</th><th>เงื่อนไข / ข้อสั่งการ</th><th>วันที่</th><th>หลักฐาน / ลายเซ็น</th></tr></thead><tbody>
    ${chain.map(c => { const done = c.status === 'approved', p = empOf(c.assignee);
      return `<tr><td class="nw num">${c.step}</td><td>${esc(c.role)}</td><td>${done ? esc(p.pos) : '<span class="cell-mute">—</span>'}</td><td class="nw">${done ? decPill(c.decision) : c.status === 'pending' ? pill({ x:['รอพิจารณา', 'pill-warning'] }, 'x') : c.status === 'skipped' ? pill({ x:['ข้าม', 'pill-muted'] }, 'x') : `<span class="cell-mute">${draft ? 'ยังไม่ส่ง' : 'รอขั้นก่อนหน้า'}</span>`}</td>
        <td>${dash(c.note)}</td><td class="nw">${done ? fmtD(c.at) : '<span class="cell-mute">—</span>'}</td><td>${done ? empChip(c.assignee, 'พิจารณาในระบบ') : '<span class="cell-mute">—</span>'}</td></tr>`; }).join('')}
    </tbody></table></div>`;
}
function fileRow(x){ return `<div class="file-row"><div class="file-ic"><i data-lucide="file" class="w-4 h-4"></i></div><div class="file-name">${esc(x.name)}</div><span class="file-size">${x.size}</span></div>`; }
function viewBanner(r){
  if (r.status === 'cancelled'){ const a = r.audit.filter(x => x.act === 'ยกเลิกเอกสาร').pop(); return `<div class="alert-row is-danger"><i data-lucide="x-circle" class="w-4 h-4"></i><div>ยกเลิกแล้ว — ${esc(a ? a.note : '')}</div></div>`; }
  if (r.status === 'pending') return `<div class="alert-row"><i data-lucide="hourglass" class="w-4 h-4"></i><div>รอ ${esc(empOf(curStep(r).assignee).name)} พิจารณา (ขั้น ${curStep(r).step} · ${esc(curStep(r).role)})${canAct(r) ? ' — คุณเป็นผู้พิจารณาบันทึกนี้' : ''}</div></div>`;
  if (r.status === 'draft' && r.returnNote) return `<div class="alert-row is-danger"><i data-lucide="corner-up-left" class="w-4 h-4"></i><div>ถูกส่งกลับ (${DECS[r.returnDec] ? DECS[r.returnDec][0] : 'ให้แก้ไข'}) — ${esc(r.returnNote)} · แก้แล้วส่งใหม่ได้ด้วยเลขเดิม</div></div>`;
  if (r.status === 'draft') return `<div class="alert-row"><i data-lucide="pencil" class="w-4 h-4"></i><div>ยังเป็นร่าง — ส่งอนุมัติเมื่อข้อมูลครบ</div></div>`;
  if (r.status === 'approved' && condCount(r)) return `<div class="alert-row"><i data-lucide="alert-triangle" class="w-4 h-4"></i><div>อนุมัติแบบมีเงื่อนไข ${condCount(r)} ข้อ — ต้องดำเนินการตามเงื่อนไขก่อนนำส่ง</div></div>`;
  return '';
}
function renderDetailTab(r){
  const conds = r.chain.filter(c => c.decision === 'approve_cond');
  return viewBanner(r)
    + SEC('info', 'ข้อมูลเอกสาร', `<div class="drawer-fields">${kv('เลขที่เอกสาร', `<span class="code-strong">${r.code}</span>`)}${kv('สถานะเอกสาร', docPill(r.status))}${kv('ผู้จัดทำ', empChip(r.emp, r.pos))}${kv('แบบฟอร์ม', DOC.form + ' · ' + DOC.rev)}${kv('ใช้ในขั้นตอน', 'ขั้นตอนที่ 6: การอนุมัติก่อนนำส่งหรือก่อนดำเนินการ')}</div>`)
    + SEC('file-text', 'รายละเอียดการขออนุมัติ', reqFields(r))
    + SEC('list-checks', `ผลการพิจารณา (${r.chain.length} ขั้น)`, reviewTable(r.chain, r.status === 'draft'), `<span class="sec-meta num">พิจารณาแล้ว ${signN(r)[0]}/${r.chain.length}</span>`)
    + (conds.length ? SEC('alert-triangle', 'เงื่อนไขจากผู้อนุมัติ', `<div class="drawer-fields">${conds.map(c => kv('ขั้น ' + c.step + ' · ' + esc(c.role), esc(c.note))).join('')}</div>`) : '')
    + SEC('paperclip', `เอกสารแนบ (${r.attachments.length} ไฟล์ · Document Center)`, r.attachments.length ? r.attachments.map(fileRow).join('') : '<div class="tl-body">ไม่มีเอกสารแนบ</div>')
    + SEC('database', 'ข้อมูลระบบ', `<div class="drawer-fields">${kv('สร้างโดย', esc(r.createdBy) + ' · ' + fmtDateTime(r.createdAt))}${kv('แก้ไขล่าสุด', esc(r.updatedBy) + ' · ' + fmtDateTime(r.updatedAt))}</div>`);
}

rgin:0 auto 24px; padding:var(--page-margin);\n    background:#fff; box-shadow:0 4px 24px rgba(11,29,58,.18);\n  }\n}\n@media print{\n  .doc-page{ width:auto; min-height:var(--content-h); padding:0; box-shadow:none; }\n}\n\n/* ============================================================\n   1. HEADER — thin rule, lighter type\n   ============================================================ */\n.doc-head{\n  display:flex; justify-content:space-between; align-items:flex-start;\n  gap:12mm; padding-top:1.5mm; padding-bottom:6px; border-bottom:1.5px solid var(--c-navy);\n}\n.doc-head__brand{ display:flex; gap:9px; align-items:flex-start; }\n.doc-logo{ width:46px; height:46px; flex:0 0 auto; border-radius:7px; object-fit:contain; }\n.doc-logo--ph{\n  display:flex; align-items:center; justify-content:center;\n  background:linear-gradient(135deg,var(--c-navy),var(--c-teal));\n  color:#fff; font-weight:700; font-size:15pt; letter-spacing:.03em;\n}\n.doc-org__name{ font-size:11.5pt; font-weight:700; color:var(--c-navy); line-height:1.5; }\n.doc-org__line{ font-size:7.8pt; color:var(--c-mute); line-height:1.35; }\n.doc-org__tax{ font-size:7.8pt; color:var(--c-mute-2); margin-top:1px; }\n\n.doc-head__title{ text-align:right; flex:0 0 auto; min-width:54mm; }\n.doc-title{ font-size:15pt; font-weight:700; color:var(--c-navy); line-height:1.45; }\n.doc-title__en{ font-size:7.5pt; font-weight:500; color:var(--c-mute-2); letter-spacing:.08em; text-transform:uppercase; }\n.doc-copy{ display:inline-block; margin-top:3px; padding:0 8px; border:1px solid var(--c-line);\n  border-radius:999px; font-size:7pt; font-weight:500; color:var(--c-mute); }\n\n/* ============================================================\n   2. META STRIP\n   ============================================================ */\n.doc-meta{ display:flex; flex-wrap:wrap; gap:0 22px; margin-top:7px; font-size:8.3pt; }\n.doc-meta__item{ display:flex; gap:5px; padding:1px 0; }\n.doc-meta__k{ color:var(--c-mute-2); }\n.doc-meta__v{ color:var(--c-ink); font-weight:600; }\n\n/* ============================================================\n   3. PARTY BLOCKS — light, no heavy fill\n   ============================================================ */\n.parties{ display:flex; gap:5mm; margin-top:9px; }\n.party{ flex:1; border:1px solid var(--c-line-2); border-radius:6px; padding:6px 9px; }\n.party__label{ font-size:7.2pt; font-weight:600; color:var(--c-primary);\n  text-transform:uppercase; letter-spacing:.06em; margin-bottom:2px; }\n.party__name{ font-size:9.3pt; font-weight:700; color:var(--c-ink); }\n.party__line{ font-size:8pt; color:var(--c-mute); line-height:1.35; }\n\n/* ============================================================\n   4. LINE-ITEM TABLE — minimal thin header, hairline rows, single-line\n   ============================================================ */\n.items{ width:100%; border-collapse:collapse; margin-top:10px; font-size:8.4pt; }\n.items thead th{\n  background:var(--c-navy); color:#fff; font-weight:600; font-size:7.6pt;\n  letter-spacing:.03em; text-align:left; padding:6px 8px;\n}\n.items thead th:first-child{ border-top-left-radius:5px; border-bottom-left-radius:5px; }\n.items thead th:last-child{ border-top-right-radius:5px; border-bottom-right-radius:5px; }\n.items tbody td{\n  padding:5px 8px; border-bottom:1px solid var(--c-line-2);\n  vertical-align:top; color:var(--c-ink); line-height:1.4;\n}\n.items .num{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }\n.items .ctr{ text-align:center; white-space:nowrap; }\n.items .col-no{ width:8mm; text-align:center; color:var(--c-mute-2); }\n.items .col-qty{ width:16mm; } .items .col-unit{ width:14mm; }\n.items .col-price{ width:23mm; } .items .col-amt{ width:25mm; }\n/* secondary detail kept INLINE so a row stays one line */\n.items td .sub{ color:var(--c-mute-2); font-size:7.4pt; }\n.items td .sub::before{ content:\"·\"; margin:0 5px; color:var(--c-mute-3); }\n.items tr{ break-inside:avoid; }\n.items thead{ display:table-header-group; }\n\n/* ============================================================\n   5. TOTALS — rules instead of heavy fill\n   ============================================================ */\n.foot-grid{ display:flex; gap:5mm; margin-top:8px; align-items:flex-start; }\n.foot-left{ flex:1; }\n.totals{ flex:0 0 60mm; }\n.totals__row{ display:flex; justify-content:space-between; gap:10px; padding:2.5px 8px; font-size:8.6pt; }\n.totals__row .k{ color:var(--c-mute); }\n.totals__row .v{ font-weight:600; font-variant-numeric:tabular-nums; }\n.totals__row--rule{ border-top:1px solid var(--c-line-2); }\n.totals__grand{\n  margin-top:4px; padding:6px 10px; border-radius:6px; background:var(--c-navy);\n  display:flex; justify-content:space-between; align-items:baseline;\n}\n.totals__grand .k{ font-size:8.8pt; font-weight:600; color:#fff; }\n.totals__grand .v{ font-size:11.5pt; font-weight:700; color:#fff; font-variant-numeric:tabular-nums; }\n/* amount-in-words — full width, larger, clear */\n.baht-text{ margin-top:7px; padding:6px 11px; border:1px dashed var(--c-line);\n  border-radius:6px; display:flex; justify-content:space-between; align-items:baseline; gap:12px; }\n.baht-text__k{ font-size:8pt; color:var(--c-mute-2); white-space:nowrap; }\n.baht-text b{ font-size:9.6pt; color:var(--c-navy); font-weight:700; text-align:right; }\n\n/* ============================================================\n   6. NOTES / TERMS\n   ============================================================ */\n.notes{ border:1px solid var(--c-line-2); border-radius:6px; padding:6px 9px;\n  font-size:8pt; color:var(--c-mute); }\n.notes__title{ font-size:7.2pt; font-weight:600; color:var(--c-mute-2);\n  text-transform:uppercase; letter-spacing:.05em; margin-bottom:3px; }\n.notes ol,.notes ul{ margin-left:15px; }\n.notes li{ margin:1px 0; }\n\n/* ============================================================\n   7. SIGNATURE BLOCK — sits inside .doc-bottom (above footer)\n   ============================================================ */\n.signs{ display:flex; gap:5mm; margin-top:14px; break-inside:avoid; }\n.sign{ flex:1; text-align:center; }\n.sign__line{ height:30px; border-bottom:1px solid var(--c-mute-3); margin:0 5mm; }\n.sign__paren{ font-size:8pt; color:var(--c-mute-2); margin-top:4px; }\n.sign__role{ font-size:8.4pt; font-weight:600; color:var(--c-ink); margin-top:1px; }\n.sign__name{ font-size:7.8pt; color:var(--c-mute); }\n.sign__date{ font-size:7.6pt; color:var(--c-mute-2); margin-top:1px; }\n\n/* ============================================================\n   8. OFFICIAL THAI LETTER / MEMO (ระเบียบงานสารบรรณ) — logo-left head\n   ============================================================ */\n.letter{ margin-top:8px; font-size:10pt; line-height:1.6; color:var(--c-ink); }\n\n/* ที่ (เลขหนังสือ) ซ้าย + ส่วนราชการ/ที่อยู่ ขวา */\n.letter__refrow{ display:flex; justify-content:space-between; align-items:flex-start; gap:14mm; margin-top:6px; }\n.letter__ref{ font-size:10pt; }\n.letter__agency{ text-align:right; font-size:9.2pt; color:var(--c-mute); line-height:1.4; }\n\n/* วันที่ — จัดกึ่งกลาง ไม่มีคำว่า \"วันที่\" นำ (ตามแบบราชการ) */\n.letter__date{ text-align:center; margin:10px 0 12px; font-size:10pt; }\n\n/* ฟิลด์หัวเรื่อง เรื่อง/เรียน/อ้างถึง/สิ่งที่ส่งมาด้วย — hanging indent */\n.letter__field{ display:flex; gap:10px; margin:3px 0; }\n.letter__field .lbl{ flex:0 0 auto; }\n.letter__field .val{ flex:1; text-align:justify; }\n.letter__field .val b,.letter__subject{ font-weight:700; }\n\n/* เนื้อหา — ย่อหน้าเยื้องบรรทัดแรก, จัดเต็มแนว */\n.letter__body{ margin-top:6px; }\n.letter__body p,.letter p{ margin:7px 0; text-indent:3.5em; text-align:justify; }\n\n/* คำลงท้าย + ลายเซ็น — กล่องชิดขวา */\n.letter__close{ margin-top:16px; margin-left:auto; width:72mm; text-align:center; }\n.letter__close .sp{ height:42px; }\n.letter__close .nm{ font-weight:600; }\n.letter__close .pos{ color:var(--c-mute); }\n\n/* เจ้าของเรื่อง (ส่วนราชการเจ้าของเรื่อง) — ล่างซ้าย ตัวเล็ก */\n.letter__owner{ font-size:8.6pt; color:var(--c-ink); line-height:1.45; }\n\n/* ============================================================\n   9. PAGE FOOTER — pinned bottom via .doc-bottom\n   ============================================================ */\n.doc-footer{ margin-top:8px; padding-top:5px; border-top:1px solid var(--c-line-2);\n  display:flex; justify-content:space-between; font-size:7.4pt; color:var(--c-mute-2); }\n\n/* ============================================================\n   UTILITIES\n   ============================================================ */\n.muted{ color:var(--c-mute); }\n.right{ text-align:right; } .center{ text-align:center; } .nowrap{ white-space:nowrap; }\n.mt-0{ margin-top:0 } .mt-8{ margin-top:8px } .mt-12{ margin-top:12px } .mt-16{ margin-top:16px }\n.tag{ display:inline-block; padding:0 7px; border-radius:999px; font-size:7.4pt; font-weight:600; }\n.tag--info{ background:#DBEAFE; color:#1E40AF; }\n.tag--ok{ background:#D1FAE5; color:#065F46; }\n.tag--warn{ background:#FEF3C7; color:#92400E; }\n.tag--danger{ background:#FEE2E2; color:#DC2626; }\n\n/* ============================================================\n   FORM REPLICA (mode=replica) — ขึ้น \"แบบฟอร์มของลูกค้า\" เป็นเอกสารระบบ\n   ใช้คู่ base.css (ใส่ให้อัตโนมัติเมื่อ build_html.py --mode replica)\n   ทุกค่าเป็น style token ปรับต่อลูกค้าได้ผ่าน --profile (profiles/*.json)\n   ห้ามเขียนค่าตายตัวใน body — ปรับที่ profile เท่านั้น\n   ============================================================ */\n:root{\n  --form-fs:9.6pt; --form-lh:1.6;\n  --form-ink:#111111; --form-mute:#6B6B6B; --form-dot:#9A9CA2;\n  --form-title-fs:14pt; --form-title-gap:16px;\n  --form-logo-h:15mm; --form-logo-maxw:70mm; --form-logo-align:center;\n  --form-row-gap:8px; --form-row-gap-dense:5px;\n  --form-indent:12mm; --form-para-gap:24px; --form-para-gap-dense:14px;\n  --form-fill-pad:6px; --form-fill-s:15mm; --form-fill-m:30mm; --form-fill-l:60mm;\n  --form-date-w:52mm; --form-num-w:6mm; --form-cb-fs:12pt;\n  --form-grid-line:#111111; --form-grid-head-bg:#E6E6E6; --form-grid-pad:4px; --form-grid-row-h:6.2mm; --form-grid-row-h-dense:5mm; --form-grid-gap:0px;\n}\n.form{ font-size:var(--form-fs); line-height:var(--form-lh); color:var(--form-ink); }\n.form-brand{ display:flex; justify-content:var(--form-logo-align); }\n.form-logo{ height:var(--form-logo-h); width:auto; max-width:var(--form-logo-maxw); object-fit:contain; }\n.form-title{ text-align:center; font-size:var(--form-title-fs); font-weight:700; line-height:1.45; margin-top:var(--form-title-gap); }\n.form-date{ display:flex; justify-content:flex-end; margin-top:var(--form-title-gap); }\n.form-date .fill{ flex:0 0 var(--form-date-w); }\n.form-row{ display:flex; align-items:baseline; gap:6px; margin-top:var(--form-row-gap); }\n.form-row--indent{ padding-left:var(--form-indent); margin-top:calc(var(--form-row-gap) * 3); }\n.form-row .fill{ flex:1 1 0; }\n.form-row .fill--s{ flex:0 0 var(--form-fill-s); } .form-row .fill--m{ flex:0 0 var(--form-fill-m); } .form-row .fill--l{ flex:0 0 var(--form-fill-l); }\n.fill{ display:inline-block; min-height:1.45em; padding:0 var(--form-fill-pad); border-bottom:1px dotted var(--form-dot); font-weight:500; color:var(--form-ink); text-align:center; }\n.fill--left{ text-align:left; }\n.fill--s, .fill--m{ white-space:nowrap; }\n.fill .sub{ font-size:7.6pt; font-weight:400; color:var(--form-mute); }\n.form-num{ flex:0 0 var(--form-num-w); }\n.form-p{ margin-top:var(--form-para-gap); padding-left:var(--form-indent); }\n.form-check{ display:flex; align-items:baseline; gap:6px; margin-top:calc(var(--form-row-gap) * 2); }\n.form-check__lbl{ flex:0 0 auto; white-space:nowrap; }\n.form-check__opts{ flex:1; }\n.form-check__opt{ display:flex; align-items:baseline; gap:6px; margin-bottom:5px; }\n.form-check--inline .form-check__opts{ display:flex; flex-wrap:wrap; gap:4px 18px; }\n.cb{ font-size:var(--form-cb-fs); line-height:1; }\n.form-check .fill--s{ min-width:10mm; } .form-check .fill--m{ min-width:22mm; }\n.form-box{ margin-top:var(--form-row-gap); padding:6px 8px; border:1px solid var(--form-dot); min-height:18mm; }\n.form-section{ margin-top:var(--form-para-gap); font-weight:700; }\n/* รายการซ้ำยาว (> min_rows) → ระยะกระชับให้จบหน้าเดียวได้นานที่สุด (data.layout.dense) */\n.form.form--dense .form-row{ margin-top:var(--form-row-gap-dense); }\n.form.form--dense .form-row--indent{ margin-top:calc(var(--form-row-gap-dense) * 3); }\n.form.form--dense .form-check{ margin-top:calc(var(--form-row-gap-dense) * 2); }\n.form.form--dense .form-p{ margin-top:var(--form-para-gap-dense); }\n\n/* R9 · ตารางกรอบ (grid form) — ฟอร์มที่กระดาษเป็นตารางเส้นทึบ (เช่น FM-FIN-02) · v2.1 */\n.form-grid{ width:100%; border-collapse:collapse; table-layout:fixed; margin-top:var(--form-grid-gap); }\n.form-grid + .form-grid{ border-top:0; }\n.form-grid td, .form-grid th{ border:1px solid var(--form-grid-line); padding:2px var(--form-grid-pad); height:var(--form-grid-row-h); vertical-align:middle; text-align:left; font-weight:400; overflow:hidden; }\n.form-grid th{ background:var(--form-grid-head-bg); font-weight:700; text-align:center; }\n.form-grid .g-b{ font-weight:700; } .form-grid .g-r{ text-align:right; } .form-grid .g-c{ text-align:center; }\n.form-grid .g-v{ font-weight:500; } .form-grid .g-num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:500; }\n.form-grid .g-25{ width:25%; } .form-grid .g-50{ width:50%; } .form-grid .g-75{ width:75%; }\n.form-grid .g-tall{ height:calc(var(--form-grid-row-h) * 1.5); }\n.form-grid .g-u{ text-decoration:underline; font-weight:700; }\n.form.form--dense .form-grid td{ height:var(--form-grid-row-h-dense); }\n.form-note{ margin-top:var(--form-row-gap); } .form-note .b{ font-weight:700; }\n.form-grid--signs td{ text-align:center; vertical-align:top; }\n.form-grid td.g-blank{ border-top:0; border-left:0; }\n.form-grid tr.g-hrow td{ height:calc(var(--form-grid-row-h) * 1.4); }\n\n/* B6 rows · ช่องลงชื่อ dynamic ตาม DOA (v2.1) — data ส่ง sign_rows[].signs[] แถวละ ≤4 (sign_rows.py / tplSignRows)\n   ห่อด้วย .signs-block ทุกครั้ง = ทั้งก้อนไม่ถูกตัดข้ามหน้า · .doc-bottom.is-dense เมื่อขั้น DOA > 4 */\n.form-grid--signs + .form-grid--signs{ margin-top:0; border-top:0; }\n.form-grid--signs + .form-grid--signs td{ border-top:0; }\n.doc-bottom.is-dense .sign__line{ height:16px; }\n.doc-bottom.is-dense .form-grid--signs td{ padding-top:1px; padding-bottom:1px; }\n.doc-bottom.is-dense .sign__date, .doc-bottom.is-dense .sign__name{ font-size:7.2pt; }\n.signs-block{ break-inside:avoid; page-break-inside:avoid; }\n.signs-block .signs + .signs{ margin-top:4mm; }\n.doc-bottom.is-dense .signs-block .signs + .signs{ margin-top:2mm; }\n\n/* ===== R10 · เอกสารเกิน 1 หน้า (v2.2) — ออกแบบเป็น 2 หน้าแทนการบีบ ===== */\n.page-break{ break-before:page; page-break-before:always; }          /* ขึ้นหน้าใหม่ตรงจุดที่ตั้งใจ (ก่อนส่วนที่ 2 / ก่อนบล็อกลงชื่อ) */\n.keep-together{ break-inside:avoid; page-break-inside:avoid; }       /* กล่อง/ตารางย่อยไม่ถูกตัดกลาง */\n.form-grid thead, .items thead{ display:table-header-group; }        /* หัวตารางซ้ำทุกหน้า */\n.form-grid tr, .items tr{ break-inside:avoid; page-break-inside:avoid; }\n.cont-note{ text-align:right; font-size:7.5pt; color:var(--form-ink,#333); margin-top:2mm; }   /* \"มีต่อหน้าถัดไป\" ท้ายหน้า 1 */\n.page-no{ text-align:right; font-size:7.5pt; }                        /* \"หน้า 1/2\" ใน footer ทุกหน้า */\n\n/* profile: profile.json */\n:root{--form-fs:8.5pt; --form-title-fs:14pt; --form-logo-h:11mm; --form-title-gap:2px; --form-grid-gap:4px;}\n";
const CO_LOGO = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='80'><rect width='300' height='80' fill='%23fff'/><text x='150' y='52' font-size='34' text-anchor='middle' font-family='sans-serif' fill='%23888'>COMPANY LOGO</text></svg>";

function tplEsc(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#x27;'); }
function tplGet(stack, path){
  for (let i = stack.length - 1; i >= 0; i--){ let cur = stack[i], ok = true;
    for (const k of path.split('.')){ if (cur && typeof cur === 'object' && !Array.isArray(cur) && k in cur) cur = cur[k]; else { ok = false; break; } }
    if (ok) return cur; }

function tplRender(t, stack){
  t = t.replace(/{{([#^])([\w.]+)}}([\s\S]*?){{\/\2}}/g, (m, kind, key, inner) => { const v = tplGet(stack, key), has = Array.isArray(v) ? v.length > 0 : !!v;

    if (Array.isArray(v)) return v.map(x => tplRender(inner, stack.concat([x]))).join('');
    return has ? tplRender(inner, stack.concat(typeof v === 'object' ? [v] : [])) : ''; });
  t = t.replace(/{{{([\w.]+)}}}/g, (m, k) => { const v = tplGet(stack, k); return v == null ? '' : String(v); });

/* =====================================================================
   CREATE / EDIT WIZARD (Q2 surface 2 · 3 ขั้นล็อก) — ช่อง = FORM_SPEC 1:1 (DEC-06)
   ผลการพิจารณา = ระบบเติมจากสายอนุมัติ (ผู้จัดทำไม่กรอก) · พิมพ์ = soft update ไม่ rebuild · ไม่มีทำซ้ำ (DEC-11)
   ===================================================================== */
const STEPS = ['รายละเอียดการขออนุมัติ', 'เอกสารแนบ', 'ตรวจสอบและยืนยัน'];
function blankForm(){ return { project:'', subject:'', docs:'', level:'', proposal:'', conds:'', files:[] }; }
const REQ_KEYS = ['project', 'subject', 'docs', 'level', 'proposal'];
function startWizard(editId, fromRoute){
  closeRowMenu();
  if (!editId && !DOC.active) { showToast('แบบเอกสารนี้ยังไม่เปิดใช้งาน', 'warning'); return; }
  let f = blankForm();
  if (editId){
    const r = findR(editId);
    if (!r || r.status !== 'draft' || !isOwner(r)) { showToast('แก้ไขได้เฉพาะร่างของตัวเอง', 'warning'); return; }
    f = Object.assign(blankForm(), { project:r.project, subject:r.subject, docs:r.docs, level:r.level, proposal:r.proposal, conds:r.conds, files:r.attachments.slice() });
  }
  if (S.dw && S.dw.kind === 'view'){ S.dw = null; }   /* U15 — เปิดจาก view = ปิด view ก่อน ไม่ซ้อน */
  showDrawer({ kind:'wiz', step:1, editId:editId || null, dirty:false, form:f, err:null, ui:{} }, fromRoute);
  if (!fromRoute) go(editId ? ROOT + '/edit/' + editId : ROOT + '/create');
}
function wf(){ return S.dw.form; }
function dirty(){ S.dw.dirty = true; }
function stepper(){
  const s = S.dw.step;
  return `<div class="d-stepper">${STEPS.map((l, i) => { const n = i + 1, cls = n === s ? 'active' : n < s ? 'done' : '';
    return `<div class="stepper-item ${cls}" ${n < s ? `onclick="goStep(${n})"` : ''}><div class="stepper-circle step-dot">${n < s ? '<i data-lucide="check" class="w-4 h-4"></i>' : n}</div><div class="stepper-label">${l}</div></div>`; }).join('')}</div>`;
}
const STEPH = (icon, title, hint) => `<div class="step-h"><i data-lucide="${icon}" class="w-4 h-4"></i><span>${title}</span></div>${hint ? `<div class="step-hint">${hint}</div>` : ''}`;
const errOf = k => S.dw.err && S.dw.err[k];
const fieldTop = (k, label, req, ctrl, errMsg, help) => `<div class="field ${errOf(k) ? 'is-invalid' : ''}" id="f-${k}"><label class="field-label">${label}${req ? '<span class="req">*</span>' : ''}</label>${ctrl}<div class="field-error">${errMsg}</div>${help ? `<div class="field-help">${help}</div>` : ''}</div>`;
const txtTop = (k, v, ph) => `<input class="input" name="${k}" value="${esc(v)}" placeholder="${ph}" oninput="setTop('${k}', this.value)">`;
const taTop = (k, v, ph, rows) => `<textarea class="input" name="${k}" rows="${rows || 2}" placeholder="${ph}" oninput="setTop('${k}', this.value)">${esc(v)}</textarea>`;
/* ระดับอำนาจอนุมัติ ≤3 ค่า → track-card มีคำอธิบายในตัว (Rule #107) · เปลี่ยนระดับ = จำนวนขั้นเปลี่ยน (DEC-14) */
function levelCards(f){
  return `<div class="track-grid">${Object.keys(LEVEL).map(k => `<button type="button" class="track-card ${f.level === k ? 'is-on' : ''}" onclick="setTop('level', '${k}', true)"><span class="tc-ic"><i data-lucide="${k === 'md' ? 'landmark' : 'user-check'}" class="w-4 h-4"></i></span><span class="tc-main"><span class="tc-t">${LEVEL[k][0]}</span><span class="tc-d">${stepsFor(k).length} ขั้นพิจารณา</span></span><span class="tc-radio"></span></button>`).join('')}</div>`;
}
/* สรุปด้านขวา — อัปเดตสด (ผู้จัดทำ / สายอนุมัติ ดึงจากระบบ ไม่ต้องกรอก) */
function sumCard(f){
  const me = ME(), chain = f.level ? resolveDoa(S.me, f.level) : [];

    <div class="wz-sum-row"><div class="wz-sum-k">ระดับอำนาจอนุมัติ</div><div class="wz-sum-v" id="sumLv">${f.level ? LEVEL[f.level][0] : '—'}</div></div>
    <div class="wz-sum-row"><div class="wz-sum-k">สายอนุมัติ</div><div class="wz-sum-v num">${chain.length ? chain.length + ' ขั้น · ' + chain.map(c => esc(c.role)).join(' → ') : 'เลือกระดับอำนาจอนุมัติก่อน'}</div></div>
    <div class="wz-sum-total"><span>ขั้นพิจารณา</span><b class="num" id="sumSteps">${chain.length || '—'}</b></div>
    <div class="wz-sum-foot"><i data-lucide="link-2" class="w-3 h-3"></i>ผู้จัดทำและผู้พิจารณาดึงจากระบบ · ผลการพิจารณาบันทึกตอนกดพิจารณา</div></aside>`;
}
/* ตารางผลการพิจารณาในขั้นกรอก = ดูอย่างเดียว (ป้ายขั้นจาก DOA ตามระดับ) */
function chainPreview(f){
  if (!f.level) return `<div class="table-wrap"><table class="table"><thead><tr><th>ผู้พิจารณา / ผู้อนุมัติ</th></tr></thead><tbody><tr><td>${emptyStateHTML({ icon:'inbox', title:'ไม่มีข้อมูล', desc:'เลือกระดับอำนาจอนุมัติเพื่อดูขั้นพิจารณา' })}</td></tr></tbody></table></div>`;
  return reviewTable(resolveDoa(S.me, f.level), true);
}

  const f = wf();
  return `<div class="wz-split"><div class="wz-main">
      ${STEPH('stamp', 'รายละเอียดการขออนุมัติ', 'ใช้เป็นหลักฐานการตรวจทานและอนุมัติก่อนส่งเอกสารหรือดำเนินการสำคัญตามตารางอำนาจอนุมัติ')}
      <div class="wz-card"><div class="wz-card-h"><span class="wz-no">1</span><span>ขออนุมัติเรื่องอะไร</span></div>
        <div class="rs-grid">
          <div class="rs-wide">${fieldTop('project', 'ชื่อโครงการ / ธุรกรรม', 1, txtTop('project', f.project, 'ชื่อโครงการ / ธุรกรรม'), 'กรุณากรอกชื่อโครงการ / ธุรกรรม')}</div>
          <div class="rs-wide">${fieldTop('subject', 'เรื่องที่ขออนุมัติ', 1, taTop('subject', f.subject, 'สิ่งที่ขออนุมัติก่อนนำส่งหรือก่อนดำเนินการ'), 'กรุณากรอกเรื่องที่ขออนุมัติ')}</div>
          <div class="rs-wide">${fieldTop('docs', 'เอกสารประกอบ', 1, taTop('docs', f.docs, 'รายการเอกสารประกอบ (แนบไฟล์ได้ในขั้นถัดไป)'), 'กรุณาระบุเอกสารประกอบ')}</div>
        </div></div>
      <div class="wz-card"><div class="wz-card-h"><span class="wz-no">2</span><span>ระดับอำนาจอนุมัติ</span></div>
        ${fieldTop('level', 'ระดับอำนาจอนุมัติ', 1, levelCards(f), 'กรุณาเลือกระดับอำนาจอนุมัติ', 'ตามตารางอำนาจอนุมัติ — กำหนดจำนวนขั้นพิจารณา')}</div>
      <div class="wz-card"><div class="wz-card-h"><span class="wz-no">3</span><span>ข้อเสนอและเงื่อนไข</span></div>
        <div class="rs-grid">
          <div class="rs-wide">${fieldTop('proposal', 'ข้อเสนอของฝ่ายบริหารการลงทุน', 1, taTop('proposal', f.proposal, 'ข้อเสนอให้ผู้อนุมัติพิจารณา', 3), 'กรุณากรอกข้อเสนอของฝ่ายบริหารการลงทุน')}</div>
          <div class="rs-wide">${fieldTop('conds', 'เงื่อนไขการอนุมัติ', 0, taTop('conds', f.conds, 'ถ้ามี'), '')}</div>
        </div></div>
      <div class="wz-card"><div class="wz-card-h"><span class="wz-no">4</span><span>ผลการพิจารณา</span><span class="sec-meta num" id="chMeta">${f.level ? stepsFor(f.level).length + ' ขั้น' : ''}</span></div>
        ${chainPreview(f)}
        <div class="field-help">ผู้พิจารณาบันทึกผลเองตอนกดพิจารณา — ผู้จัดทำไม่ต้องกรอก</div></div>
    </div>${sumCard(f)}</div>`;
}
function wizAttach(){
  const f = wf();
  return STEPH('paperclip', 'แนบเอกสารประกอบ (ถ้ามี)', 'เช่น หนังสือนำส่ง ร่างสัญญา หรือเอกสารที่จะนำส่ง')
    + `<div class="upload-zone" onclick="document.getElementById('ivmFile').click()"><div class="uz-ic"><i data-lucide="upload-cloud" class="w-5 h-5"></i></div>
        <div class="uz-t">${f.files.length ? 'แนบไฟล์เพิ่ม' : 'คลิกเพื่อแนบไฟล์ (เลือกได้หลายไฟล์)'}</div><div class="uz-d">PDF, Word, Excel หรือรูปภาพ ไม่เกิน 20 MB ต่อไฟล์</div></div>
      <input type="file" id="ivmFile" multiple hidden accept="${FILE_ACCEPT}" onchange="pickFiles(this)">
      ${f.files.map((x, i) => `<div class="file-row"><div class="file-ic"><i data-lucide="file" class="w-4 h-4"></i></div><div class="file-name">${esc(x.name)}</div><span class="file-size">${x.size}</span><button class="ra-btn is-danger" title="ลบไฟล์" onclick="removeFile(${i})"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>`).join('')}`;
}
function wizReview(){
  const f = wf(), me = ME(), chain = resolveDoa(S.me, f.level);
  return STEPH('check-circle-2', 'ตรวจสอบและยืนยัน', 'ส่งแล้วแก้ไขไม่ได้ — ถ้าถูกส่งกลับ (ให้แก้ไข / ไม่อนุมัติ) จะกลับเป็นร่างเลขเดิมให้แก้แล้วส่งใหม่')
    + `<div class="review-card"><div class="review-title"><i data-lucide="file-text" class="w-4 h-4"></i>รายละเอียดการขออนุมัติ</div>${reqFields(f)}
        <div class="drawer-fields">${kv('ผู้จัดทำ', empChip(me.id))}${kv('สายอนุมัติ', chain.length + ' ขั้น · ' + chain.map(c => esc(c.role)).join(' → '))}</div></div>
      <div class="review-card"><div class="review-title"><i data-lucide="list-checks" class="w-4 h-4"></i>ผลการพิจารณา<span class="dt-count num">${chain.length}</span></div>${reviewTable(chain, true)}</div>
      <div class="review-card"><div class="review-title"><i data-lucide="paperclip" class="w-4 h-4"></i>เอกสารแนบ<span class="dt-count num">${f.files.length}</span></div>${f.files.length ? f.files.map(fileRow).join('') : '<div class="tl-body">ไม่มีเอกสารแนบ</div>'}</div>`;
}
function renderWizard(){
  const s = S.dw.step, edit = S.dw.editId ? findR(S.dw.editId) : null, last = s === STEPS.length;
  const body = s === 1 ? wizMain() : s === 2 ? wizAttach() : wizReview();
  return `<div class="dw-head"><div class="dw-head-row"><div>
        <div class="dw-eyebrow"><i data-lucide="${edit ? 'pencil' : 'file-plus'}" class="w-3.5 h-3.5"></i> ${edit ? 'แก้ไขเอกสาร' : 'สร้างเอกสารใหม่'}</div>
        <h2 class="dw-title">${edit ? 'แก้ไขแบบฟอร์ม ' + edit.code : DOC_NAME}</h2></div>
        <button class="top-icon-btn" title="ปิด" onclick="closeDrawer()"><i data-lucide="x" class="w-5 h-5"></i></button></div>${stepper()}</div>
    <div class="drawer-body ${s === 1 ? 'is-soft' : ''}">${body}</div>
    <div class="dw-footer"><div>${s > 1 ? '<button class="btn btn-secondary" onclick="wizBack()"><i data-lucide="arrow-left" class="w-4 h-4"></i><span>ย้อนกลับ</span></button>' : ''}</div>
      <div class="dw-footer-right"><button class="btn btn-ghost" onclick="closeDrawer()">ยกเลิก</button>
        ${last ? `<button class="btn btn-secondary" id="btnDraft" onclick="saveDraft()" ${S.busy ? 'disabled' : ''}><i data-lucide="save" class="w-4 h-4"></i><span>บันทึกแบบร่าง</span></button>
          <button class="btn btn-primary" id="btnSaveSubmit" onclick="saveAndSubmit()" ${S.busy ? 'disabled' : ''}>${S.busy ? '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>' : '<i data-lucide="send" class="w-4 h-4"></i><span>บันทึกและส่งอนุมัติ</span>'}</button>`
          : '<button class="btn btn-primary" id="btnNext" onclick="wizNext()"><span>ถัดไป</span><i data-lucide="arrow-right" class="w-4 h-4"></i></button>'}
      </div></div>`;
}

/* ---------- wizard actions (พิมพ์ = soft update ไม่ rebuild — focus ไม่หลุด) ---------- */
function goStep(n){ S.dw.step = n; render(); }
function clearErr(k){ if (S.dw.err) delete S.dw.err[k]; const el = document.querySelector('[id="f-' + k + '"]'); if (el) el.classList.remove('is-invalid'); }
function softSum(){ const f = wf(), p = document.getElementById('sumProj'); if (p) p.textContent = f.project || '—'; }
/* ช่องข้อความ = soft update · ระดับอำนาจอนุมัติ = render ใหม่ (สายอนุมัติเปลี่ยน) */
function setTop(k, v, rerender){ const f = wf(); f[k] = v; dirty(); if (String(v).trim()) clearErr(k);
  if (rerender) { render(); return; } softSum(); }
/* ตรวจตามมติ DEC-04 / DEC-14 — ช่องบังคับตามกระดาษ · ระดับอำนาจอนุมัติต้องเลือก */
function validateMain(){
  const f = wf(), err = {};
  REQ_KEYS.forEach(k => { if (!String(f[k] || '').trim()) err[k] = 1; });
  if (f.level && !LEVEL[f.level]) err.level = 1;
  const ok = !Object.keys(err).length;
  S.dw.err = ok ? null : err; return ok;
}
function wizNext(){
  if (S.dw.step === 1 && !validateMain()){ render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.dw.step += 1; render();
}
function wizBack(){ S.dw.step = Math.max(1, S.dw.step - 1); render(); }
function pickFiles(inp){ const f = wf(); gateFiles(Array.from(inp.files || [])).forEach(x => f.files.push({ name:x.name, size:fmtSize(x.size) })); inp.value = ''; dirty(); render(); }
function removeFile(i){ wf().files.splice(i, 1); dirty(); render(); }
/* บันทึกครั้งแรก = ENG-DOC-NUM.next('IVMH') ออกเลขที่ (DEC-10) · ผู้จัดทำ snapshot ตำแหน่ง/ฝ่าย ณ วันที่บันทึก */
function persist(){
  const f = wf(), me = ME(), t = nowIso();
  let r = S.dw.editId ? findR(S.dw.editId) : null;
  if (!r){
    SEQ += 1;
    r = { id:'R' + SEQ, code:DOC.prefix + '-2569-' + String(SEQ).padStart(4, '0'), status:'draft', emp:S.me, pos:me.pos, dept:me.dept, reqDate:TODAY, returnNote:'', returnDec:'',
      doa_entry_ref:MOCK_DOA_RESOLVED.doa_entry_ref, attachments:[], audit:[{ act:'สร้างเอกสาร', by:me.name, at:t, tone:'' }], createdBy:me.name, createdAt:t };
    RECS.unshift(r);
  } else r.audit.push({ act:'แก้ไขร่าง', by:me.name, at:t, tone:'' });
  Object.assign(r, { project:f.project.trim(), subject:f.subject.trim(), docs:f.docs.trim(), level:f.level, proposal:f.proposal.trim(), conds:f.conds.trim(),
    chain:resolveDoa(S.me, f.level), attachments:f.files.slice(), updatedBy:me.name, updatedAt:t });
  return r;
}
function saveDraft(){ if (S.busy) return; if (!validateMain()){ S.dw.step = 1; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const r = persist(); S.busy = false; closeDrawer(true); setTimeout(() => showToast('บันทึกร่างแล้ว · ' + r.code, 'info'), 300); }, 500); }
function saveAndSubmit(){ if (S.busy) return; if (!validateMain()){ S.dw.step = 1; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const r = persist(); S.busy = false; closeDrawer(true); setTimeout(() => openSubmit(r.id), 300); }, 500); }

/* =====================================================================
   MODALS — ส่งอนุมัติ (DOA slot ต่อขั้น) · พิจารณา (อนุมัติ / อนุมัติแบบมีเงื่อนไข / รับทราบ) · ส่งกลับ (ให้แก้ไข / ไม่อนุมัติ) · ยกเลิก · ทิ้งการแก้ไข
   ===================================================================== */
function modalShell(icon, tone, title, sub, body, foot){
  return `<div class="modal-header"><div class="modal-header-icon ${tone}"><i data-lucide="${icon}" class="w-4 h-4"></i></div><div><h3 class="modal-title">${title}</h3><p class="modal-subtitle">${sub}</p></div></div>
    ${body ? `<div class="modal-body">${body}</div>` : ''}<div class="modal-footer">${foot}</div>`;
}

function presetChips(list, cur){ return `<div class="chip-row">${list.map(p => `<button type="button" class="chip ${cur === p ? 'is-on' : ''}" onclick="setReasonPreset(this.dataset.v)" data-v="${esc(p)}">${esc(p)}</button>`).join('')}</div>`; }

function pushAudit(r, act, note, tone){ const me = ME(), t = nowIso(); r.audit.push({ act, by:me.name, at:t, note:note || '', tone:tone || '' }); r.updatedBy = me.name; r.updatedAt = t; }
/* ENG-NOTIFY (NTF_BRIEF_F-TMP-010): ivmh_conditional_approved → ผู้จัดทำ + admin role (อนุมัติครบ และมีขั้น อนุมัติแบบมีเงื่อนไข) · ivmh_cancelled → ผู้พิจารณาขั้นปัจจุบัน · DOA engine เป็นเจ้าของ doa_pending/doa_result */
function confirmSubmit(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (m.slots.some(x => !x)){ m.err = true; render(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    r.chain = resolveDoa(r.emp, r.level).map((c, i) => Object.assign(c, { assignee:m.slots[i], status:i === 0 ? 'pending' : 'waiting' }));   /* BR-DOA-02 resolve ตอนส่งแล้ว freeze */
    r.status = 'pending'; r.submittedAt = nowIso(); r.returnNote = ''; r.returnDec = ''; pushAudit(r, 'ส่งอนุมัติ', 'ถึง ' + empOf(m.slots[0]).name);
    S.busy = false; closeModal(); render(); setTimeout(() => showToast('ส่งอนุมัติแล้ว · ' + r.code, 'success'), 220); }, 600);
}
/* พิจารณาผ่าน: อนุมัติ / อนุมัติแบบมีเงื่อนไข (ต้องมีเงื่อนไข — DEC-15) / รับทราบ (ขั้นกลาง — DEC-16) · เรียงขั้น (DEC-17) · อนุมัติครบไม่เปลี่ยนค่าในระบบ ไม่ส่งต่อ (DEC-01/02) */
function confirmApprove(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (passOptions(r).indexOf(m.dec) < 0){ m.dec = 'approve'; render(); return; }
  if (NOTE_DECS.indexOf(m.dec) >= 0 && !(m.note || '').trim()){ m.err = true; render(); return; }
  const fin = isLastStep(r);
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    const c = curStep(r); c.status = 'approved'; c.decision = m.dec; c.at = nowIso(); c.note = (m.note || '').trim();
    const next = r.chain.find(x => x.status === 'waiting'); if (next) next.status = 'pending';   /* sequential */
    r.status = next ? 'pending' : 'approved'; pushAudit(r, DECS[m.dec][0] + ' (ขั้น ' + c.step + ')', c.note || (fin ? 'อนุมัติครบ' + (condCount(r) ? ' · แจ้งเงื่อนไขก่อนนำส่ง' : '') : ''), 'ok');
    S.busy = false; closeModal(); render(); setTimeout(() => showToast('บันทึกผล ' + DECS[m.dec][0] + ' · ' + r.code, 'success'), 220); }, 600);
}
/* ส่งกลับ (ให้แก้ไข / ไม่อนุมัติ) = กลับเป็นร่างเลขเดิม (DEC-08 · BR-DOA-03 on_reject back_to_draft) · ยกเลิก = ร่าง/รออนุมัติ เท่านั้น */
function confirmReason(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (!(m.reason || '').trim()){ m.err = true; render(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    const why = m.reason.trim();
    if (m.kind === 'reject'){ const c = curStep(r); pushAudit(r, DECS[m.dec][0] + ' (ขั้น ' + c.step + ')', why, 'bad');
      r.status = 'draft'; r.returnNote = why; r.returnDec = m.dec; r.submittedAt = null; r.chain = resolveDoa(r.emp, r.level); }
    else { r.status = 'cancelled'; const c = curStep(r); if (c) c.status = 'skipped'; r.chain.filter(x => x.status === 'waiting').forEach(x => { x.status = 'skipped'; }); pushAudit(r, 'ยกเลิกเอกสาร', why, 'bad'); }
    S.busy = false; closeModal(); render(); setTimeout(() => showToast(m.kind === 'reject' ? 'ส่งกลับเป็นร่างแล้ว · ' + r.code : 'ยกเลิกเอกสารแล้ว · ' + r.code, m.kind === 'reject' ? 'warning' : 'info'), 220); }, 600);
}

/* ---------- ไฟล์แนบ (file_policy เดียวกับ Document Center) ---------- */
const FILE_ACCEPT = '.pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg', FILE_RE = /\.(pdf|docx?|xlsx?|png|jpe?g)$/i, FILE_MAX_MB = 20;
const fmtSize = b => b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
function gateFiles(list){
  const ok = [], bad = [];
  list.forEach(x => { if (!FILE_RE.test(x.name)) bad.push([x.name, 'ชนิดไฟล์ไม่รองรับ']); else if (x.size > FILE_MAX_MB * 1048576) bad.push([x.name, `ไฟล์ใหญ่เกินกำหนด (สูงสุด ${FILE_MAX_MB} MB)`]); else ok.push(x); });
  if (bad.length) showToast(bad.length === 1 ? `${bad[0][0]} — ${bad[0][1]}` : `แนบไม่ได้ ${bad.length} ไฟล์ — ชนิดไฟล์ไม่รองรับหรือใหญ่เกิน ${FILE_MAX_MB} MB`, 'error');
  if (ok.length && S.sim === 'upload_fail'){ S.sim = null; showToast('แนบไฟล์ไม่สำเร็จ กรุณาลองใหม่อีกครั้ง', 'error'); return []; }
  return ok;
}
/* prototype hook: S.sim = 'stale' | 'denied' | 'error' | 'upload_fail' → จำลองผลตอบกลับ API ครั้งถัดไป (ระบบจริง = 409 / 403 / 500) */
function commitRejected(){
  const k = S.sim; if (!k || k === 'upload_fail') return false;
  S.sim = null; S.busy = false; render();
  showToast(k === 'stale' ? 'ข้อมูลถูกแก้โดยผู้อื่น กรุณารีเฟรชแล้วลองใหม่' : k === 'denied' ? 'คุณไม่มีสิทธิ์ทำรายการนี้' : 'ทำรายการไม่สำเร็จ กรุณาลองใหม่อีกครั้ง', k === 'denied' ? 'warning' : 'error');
  return true;
}
