# unattended — AI-DEFAULT ทุกหมวด รอลูกค้ายืนยัน
# G1 ผลต่อระบบ — บันทึกการอนุมัติก่อนนำส่ง/ก่อนดำเนินการ ไม่เปลี่ยนค่าในระบบ ไม่ส่งต่อ · ชื่อโครงการ/ธุรกรรมกรอกเอง (FM-IVM-01 ยังไม่ลิงก์ในระบบ) · การนำส่งจริงทำนอกเอกสารนี้
config_changes: []
post_to: []

# G2 สายอนุมัติ — dynamic · ค่าเริ่ม 3 ขั้นตามแถวผลการพิจารณาบนกระดาษ (ผู้จัดการฝ่ายบริหารการลงทุน → รองกรรมการผู้จัดการ → กรรมการผู้จัดการ / ผู้มีอำนาจ) · ระดับอำนาจอนุมัติ = รองกรรมการผู้จัดการ → 2 ขั้น · กรรมการผู้จัดการ / ผู้มีอำนาจ → 3 ขั้น (ส่งระดับให้ DOA กลาง resolve · TODO: DOA engine) · ไม่มีวงเงินบนกระดาษ
doa: { required: true, mode: dynamic, default_steps: ["role-line-manager", "role-gm", "role-gm"], step_labels: ["ผู้จัดการฝ่ายบริหารการลงทุน", "รองกรรมการผู้จัดการ", "กรรมการผู้จัดการ / ผู้มีอำนาจ"], amount: none, resolve_by: "approval.authority_level" }

# G3 กติกา — ไม่มีค่าคงที่/สูตรบนกระดาษ · ตัวเลือกจาก data validation D22:D24 · ข้อมูลขัดกันชัดเจนบล็อก · ที่เหลือเตือน
calc:
  constants_from_config: true
  auto_compute: true
  over_limit: warn
  rules:
    - "ระดับอำนาจอนุมัติ เลือกจากรายการ: รองกรรมการผู้จัดการ (2 ขั้น) · กรรมการผู้จัดการ / ผู้มีอำนาจ (3 ขั้น) — กำหนดจำนวนขั้นพิจารณา (บล็อกถ้าไม่เลือก)"
    - "ตารางผลการพิจารณา ระบบเติมจากการกดพิจารณาของแต่ละขั้น (ลำดับ · ผู้พิจารณา / ผู้อนุมัติ · ตำแหน่ง · วันที่ · หลักฐาน / ลายเซ็น) — ผู้จัดทำแก้ไม่ได้"
    - "พิจารณาตามลำดับขั้น · ขั้นถัดไปเปิดเมื่อขั้นก่อน อนุมัติ / อนุมัติแบบมีเงื่อนไข / รับทราบ"
    - "ผลการพิจารณา อนุมัติแบบมีเงื่อนไข / ให้แก้ไข / ไม่อนุมัติ → ต้องกรอกเงื่อนไข / ข้อสั่งการ (บล็อก)"
    - "รับทราบ เลือกได้เฉพาะขั้นกลาง (ไม่ใช่ขั้น 1 ผู้ตรวจสอบ และไม่ใช่ขั้นสุดท้ายที่ต้องตัดสิน) (บล็อก)"
    - "ทุกขั้นผ่าน และมีขั้นใด อนุมัติแบบมีเงื่อนไข → สถานะ อนุมัติแล้ว + ป้าย มีเงื่อนไข · รวมเงื่อนไขทุกขั้นแสดงในหน้ารายละเอียด"
    - "บล็อกลงชื่อ การตรวจทาน / อนุมัติ ใช้ข้อมูล DOA ชุดเดียวกับตารางผลการพิจารณา (ไม่กรอกซ้ำ)"

# G4 รายการซ้ำ — ตารางผลการพิจารณา = 1 แถวต่อขั้น DOA (ไม่จำกัดตาม DOA กลาง) · PDF ขั้นต่ำเท่ากระดาษ 3 แถว
repeat: { max_rows: null }

# G5 ช่องตามกระดาษ — 1:1 ไม่เพิ่มช่อง
fidelity: { one_to_one: true, add_fields: [], merge_split: [] }

# G6 ลายเซ็น — แถวล่าง 1 ช่องต่อขั้น DOA + ผู้จัดทำ · ข้อความ "พิจารณาในระบบ" ไม่ใช้ภาพ
signature: { layout: row-bottom, per_doa_step: true, handwriting_image: false }

# G7 ให้แก้ไข / ไม่อนุมัติ / ยกเลิก — กลับเป็นร่างเลขเดิม · ยกเลิกได้ เจ้าของ + admin role · ร่าง/รออนุมัติ · เหตุผลบังคับ
reject_cancel: { on_reject: draft, cancel_by: [owner, admin_role], cancel_states: [draft, pending], reason_required: true }

# G8 การมองเห็น — เจ้าของ · ผู้อนุมัติหลังส่ง · admin role ฝ่ายบริหารการลงทุนเห็นทั้งหมด
visibility: { owner: true, approver: after_submit, admin_role: all }

# G9 เลขที่ — เอกสารภายใน ออกตอนบันทึกครั้งแรก · รหัส IVMH (IVM + H = ฟอร์มลำดับ 08 · FM-IVM-08)
numbering: { issue_on: first_save, code: IVMH }

# G10 ของเสริม
extras: { attachments: true, copy: false, export_csv: true, announce: false }

extend: {}
fit: {}
