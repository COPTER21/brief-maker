<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTV คืนผู้ขาย · CUBE NATIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">
<style>
/* ===== BASE-KIT v6.4 — DO NOT EDIT (Rule #69) — page CSS ต่อท้ายหลัง END marker ===== */
:root {
  --c-navy: #111111;
  --c-navy-2: #111111;
  --c-primary: #FF3B30;
  --c-primary-hover: #E62E24;
  --c-teal: #FF9A1F;
  --c-teal-light: #FFB763;
  --c-ink: #111111;
  --c-mute: #54565C;
  --c-mute-2: #73757B;
  --c-mute-3: #9A9CA2;
  --c-line: #DEDAD4;
  --c-line-2: #E9E5E0;
  --c-line-3: #F1EEEA;
  --c-bg-off: #FAF8F5;
  --c-success: #1F9D55;
  --c-warning: #E8870F;
  --c-danger: #E62E24;
  --sidebar-w: 232px;
  --shell-h: 52px;
  --fs-h1: 22px; --fs-h2: 17px; --fs-h3: 15px; --fs-body: 14px;
  --fs-sub: 13px; --fs-meta: 12px; --fs-cap: 11px; --fs-kpi: 28px;
  --sp-xs: 4px; --sp-sm: 8px; --sp-md: 12px; --sp-lg: 20px; --sp-xl: 28px;
  --r-xs: 4px; --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-full: 999px;
  /* z-scale (Rule #59) */
  --z-sticky: 19; --z-shell: 20; --z-dropdown: 65; --z-backdrop: 50; --z-drawer: 51; --z-modal: 61; --z-toast: 70;
  /* archetype aliases (Pattern Q / B2 v2 CSS ใช้ชื่อชุดนี้ — map เข้าค่า Warm Light เดียวกัน) */
  --c-white: #FFFFFF;
  --c-text: #111111;
  --c-text-mute: #54565C;
  --c-text-soft: #9A9CA2;
  --c-slate: #73757B;
  --c-purple: #FF9A1F;
  --c-border: #DEDAD4;
  --c-border-soft: #E9E5E0;
  --c-off-white: #FAF8F5;
  --c-primary-08: rgba(255,59,48,0.08);
  --c-primary-12: rgba(255,59,48,0.12);
  --c-teal-08: rgba(31,157,85,0.10);
  --c-warning-08: rgba(232,135,15,0.10);
  --c-danger-08: rgba(230,46,36,0.08);
  --r: 8px;
  --sh-md: 0 2px 8px rgba(17,17,17,0.05);
  --sh-lg: 0 12px 32px rgba(17,17,17,0.12);
  --sh-xl: -16px 0 40px rgba(17,17,17,0.18);
}
* { box-sizing: border-box; }
html, body { margin:0; padding:0; }
html { scrollbar-gutter: stable; }
* { scrollbar-width: thin; scrollbar-color: rgba(17,17,17,.16) transparent; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(17,17,17,.14); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: rgba(17,17,17,.26); }
.sidebar, .slide { scrollbar-color: rgba(255,255,255,.28) transparent; }
.sidebar ::-webkit-scrollbar-thumb, .slide ::-webkit-scrollbar-thumb,
.sidebar::-webkit-scrollbar-thumb, .slide::-webkit-scrollbar-thumb { background: rgba(255,255,255,.28); }
.sidebar ::-webkit-scrollbar-thumb:hover, .slide ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.42); }
body {
  font-family: 'Satoshi', 'Noto Sans Thai', system-ui, sans-serif;
  background: var(--c-bg-off);
  color: var(--c-ink);
  font-size:14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-width: 768px;
}
a { text-decoration: none; color: inherit; }
button { font-family: inherit; cursor: pointer; }
[data-lucide] { flex-shrink: 0; }
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin:0; }
input[type="number"] { -moz-appearance: textfield; }

/* ============== SIDEBAR ============== */
.sidebar { position: fixed; inset: 0 auto 0 0; width: var(--sidebar-w); background: #111111; color: #E9E5E0;
  z-index:var(--z-shell); display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,0.06); }
.sb-brand { padding:18px; display: flex; align-items: center; gap:12px; border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; }
.sb-logo { width: 34px; height: 34px; background: linear-gradient(135deg, #FF3B30, #FF9A1F); border-radius: 9px;
  display: inline-flex; align-items: center; justify-content: center; color: #fff; flex-shrink: 0; box-shadow: 0 4px 12px rgba(255,59,48,0.3); }
.sb-name { font-weight: 700; font-size:14px; color: #fff; letter-spacing: -0.01em; line-height: 1.2; }
.sb-sub { font-size:11px; color: #9A9CA2; letter-spacing: 0.06em; font-weight: 600; text-transform: uppercase; margin-top:2px; }
.sb-nav { flex: 1; padding:12px 8px; overflow-y: auto; }
.sb-module { margin-bottom:4px; }
.sb-module-header { display: flex; align-items: center; gap:8px; width: 100%; padding:8px 10px; border-radius: 6px;
  background: transparent; border: 0; color: #9A9CA2; font-family: inherit; font-size:11px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: all 120ms; text-align: left; }
.sb-module-header:hover { background: rgba(255,255,255,0.04); color: #DEDAD4; }
.sb-module-header .mod-icon { flex-shrink: 0; opacity: 0.7; }
.sb-module-header .mod-label { flex: 1; }
.sb-module-header .mod-chevron { flex-shrink: 0; transition: transform 200ms; opacity: 0.7; }
.sb-module[data-expanded="false"] .mod-chevron { transform: rotate(-90deg); }
.sb-module[data-expanded="false"] .sb-features { display: none; }
.sb-features { padding:2px 0 6px 0; }
.sb-item { display: flex; align-items: center; gap:10px; padding:8px 12px 8px 16px; border-radius: 6px; color: #DEDAD4;
  font-size:13px; font-weight: 500; cursor: pointer; transition: all 120ms; margin-bottom:1px; position: relative; user-select: none; }
.sb-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.sb-item.is-active { background: #FF3B30; color: #fff; font-weight: 600; }
.sb-item.is-active::before { content: ''; position: absolute; left: -10px; top: 7px; bottom: 7px; width: 3px; background: #fff; border-radius: 0 2px 2px 0; }
.sb-item [data-lucide] { width: 16px; height: 16px; opacity: 0.85; }
.sb-item.is-active [data-lucide] { opacity: 1; }
.sb-badge { margin-left:auto; font-size:11px; font-weight: 600; background: rgba(255,255,255,0.10); color: #9A9CA2; padding:2px 8px; border-radius: 999px; }
.sb-item.is-active .sb-badge { background: rgba(255,255,255,0.18); color: #fff; }
.sb-item.is-disabled { opacity: 0.4; cursor: not-allowed; }
.sb-item.is-disabled:hover { background: transparent; color: #DEDAD4; }
.sb-footer { padding:12px 16px; border-top: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; gap:8px; font-size:12px; color: #9A9CA2; }
.pulse-dot { width: 7px; height: 7px; background: var(--c-teal); border-radius: 50%; box-shadow: 0 0 0 3px rgba(255,154,31,0.20); animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

/* ============== MAIN / SHELL ============== */
.main { margin-left:var(--sidebar-w); min-height: 100vh; background: var(--c-bg-off); }
.shell-bar { position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--c-line-2); height: var(--shell-h);
  display: flex; align-items: center; padding:0 24px; z-index:var(--z-sticky); gap:12px; }
.breadcrumb { display: flex; align-items: center; gap:8px; font-size:13px; color: var(--c-mute); }
.breadcrumb a { cursor: pointer; transition: color 120ms; }
.breadcrumb a:hover { color: var(--c-primary); }
.breadcrumb .sep { color: var(--c-mute-3); font-size:11px; }
.breadcrumb-current { color: var(--c-ink); font-weight: 500; }
.icon-btn { width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; background: transparent;
  border: 0; color: var(--c-mute); border-radius: 7px; position: relative; transition: all 120ms; }
.icon-btn:hover { background: var(--c-line-3); color: var(--c-ink); }
.icon-btn [data-lucide] { width: 17px; height: 17px; }
.notif-dot { position: absolute; top: 7px; right: 8px; width: 7px; height: 7px; background: var(--c-danger); border-radius: 50%; border: 2px solid #fff; }
.user-chip { display: flex; align-items: center; gap:10px; padding:6px 10px 6px 12px; border-radius: 8px; cursor: pointer; transition: background 120ms; }
.user-chip:hover { background: var(--c-line-3); }
.user-text { line-height: 1.2; text-align: right; }
.user-name { font-size:12.5px; font-weight: 500; color: var(--c-ink); white-space: nowrap; }
.user-role { font-size:11px; color: var(--c-mute-2); white-space: nowrap; margin-top:1px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, var(--c-primary), var(--c-teal));
  color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size:12px; font-weight: 600; flex-shrink: 0; }
.user-menu { position: absolute; top: calc(var(--shell-h) - 4px); right: 22px; background: #fff; border: 1px solid var(--c-line-2);
  border-radius: 10px; box-shadow: 0 12px 32px rgba(17,17,17,0.12); width: 240px; z-index:var(--z-dropdown); padding:6px; display: none; }
.user-menu.is-open { display: block; }
.user-menu-item { display: flex; align-items: center; gap:10px; padding:8px 12px; border-radius: 6px; font-size:13px; color: var(--c-ink); cursor: pointer; transition: background 120ms; }
.user-menu-item:hover { background: var(--c-bg-off); }
.user-menu-item [data-lucide] { width: 15px; height: 15px; color: var(--c-mute-2); }
.user-menu-divider { height: 1px; background: var(--c-line-2); margin:6px 0; }
.content { padding:24px; }
.nav-toggle { display:none; }
@media (max-width: 1180px){
  .content { padding:16px; }
  .drawer { width: min(920px, 100vw); }
  .drawer-panel { max-width: min(920px, 100vw); }
  .drawer-panel.wide { max-width: min(1290px, 100vw); }
  .main { margin-left: 0; }
  .sidebar { transform: translateX(-100%); transition: transform .18s ease; }
  .sidebar.open { transform: translateX(0); box-shadow: 0 8px 32px rgba(0,0,0,.24); }
  .nav-toggle { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border:none;
    background:transparent; border-radius:8px; color:var(--c-ink); }
  .nav-toggle:hover { background: rgba(17,17,17,.06); }
}
/* list full-height (Rule #96) */
.page-fill { display:flex; flex-direction:column; min-height: calc(100dvh - var(--shell-h) - 48px); }
@media (max-width:1180px){ .page-fill { min-height: calc(100dvh - var(--shell-h) - 32px); } }
.page-fill > .list-card { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
.table-wrap { flex:1 1 auto; min-height:0; overflow:auto; scrollbar-gutter: stable; }
.table-wrap thead th { position:sticky; top:0; background:var(--c-bg-off); z-index:3; box-shadow: inset 0 -1px 0 var(--c-line-2); }
.table-foot { flex:0 0 auto; }
.menu-fixed { position:fixed !important; z-index:var(--z-dropdown); background:#fff; border:1px solid var(--c-line);
  border-radius:10px; box-shadow:0 12px 32px rgba(17,17,17,.14); overflow-y:auto; }

/* ============== PAGE HEADER ============== */
.ph { margin-bottom:18px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap:16px; }
.ph > div:first-child { flex: 1 1 auto; min-width: 280px; }
.ph-title-row { display: flex; align-items: baseline; gap:10px; margin-bottom:6px; }
.ph-title { font-family: 'Noto Sans Thai', sans-serif; font-size:20px; font-weight: 700; color: var(--c-navy); margin:0; letter-spacing: -0.01em; }
.ph-count { font-size:12.5px; font-weight: 600; color: var(--c-mute-2); background: var(--c-line-3); padding:3px 10px; border-radius: 999px; }
.ph-sub { font-size:13px; color: var(--c-mute); margin:0; }
.ph-actions { display: flex;align-items:center; gap:8px; flex-shrink: 0; }

/* ============== BUTTONS ============== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap:6px; height: 36px; padding:2px 16px 0;
  border-radius: 8px; font-size:13px; font-weight: 500; border: 1px solid transparent; background: transparent;
  white-space: nowrap; transition: all 120ms; user-select: none; cursor: pointer; }
.btn [data-lucide] { width: 15px; height: 15px; flex-shrink: 0; }
.btn:disabled, .btn.is-disabled { opacity: .55; cursor: not-allowed; pointer-events: none; }
.btn-eq { min-width: 104px; }
.btn-primary { background: var(--c-primary); color: #fff; }
.btn-primary:hover { background: var(--c-primary-hover); box-shadow: 0 2px 8px rgba(255,59,48,0.30); }
.btn-secondary { background: #fff; border-color: var(--c-line); color: var(--c-ink); }
.btn-secondary:hover { background: var(--c-line-3); border-color: var(--c-mute-2); }
.btn-ghost { color: var(--c-mute); }
.btn-ghost:hover { background: var(--c-line-3); color: var(--c-ink); }
.btn-danger { background: #fff; border-color: var(--c-line); color: var(--c-danger); }
.btn-danger:hover { background: #FFE9E7; border-color: var(--c-danger); }
.btn-success { background: var(--c-success); color:#fff; border-color: var(--c-success); }
.btn-success:hover { background: var(--c-success); filter: brightness(0.92); }
.btn-link { background: transparent; border: 0; padding:0 4px; height: auto; color: var(--c-primary); font-weight: 500; }
.btn-link:hover { text-decoration: underline; }
.btn-sm, .btn.sm { height: 30px; padding:2px 12px 0; font-size:12px; }
.btn-sm [data-lucide], .btn.sm [data-lucide] { width: 14px; height: 14px; }

/* ============== STATS ============== */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap:12px; margin-bottom:18px; }
.stat { background: #fff; border: 1px solid var(--c-line-2); border-radius: 10px; padding:16px 16px; transition: all 150ms; }
.stat:hover { border-color: var(--c-line); box-shadow: 0 2px 8px rgba(17,17,17,0.05); }
.stat-label { display: flex; align-items: center; gap:6px; font-size:12px; font-weight: 500; color: var(--c-mute); }
.stat-label [data-lucide] { width: 13px; height: 13px; color: var(--c-primary); }
.stat-value { font-family: 'Noto Sans Thai', sans-serif; font-size:26px; font-weight: 700; color: var(--c-navy); margin-top:6px; letter-spacing: -0.01em; }
.stat-meta { font-size:12px; color: var(--c-mute-2); margin-top:6px; display: flex; align-items: center; gap:4px; }
.stat-meta [data-lucide] { width: 12px; height: 12px; }

/* ============== CARD / FILTER / INPUT ============== */
.card { background: #fff; border: 1px solid var(--c-line-2); border-radius: 10px; overflow: hidden; }
.card-head { padding:12px 16px; border-bottom: 1px solid var(--c-line-2); display:flex; align-items:center; justify-content:space-between; gap:10px; }
.card-title { font-size:13px; font-weight:600; color: var(--c-navy); }
.card-body { padding:14px 16px; }
.filter-bar { padding:16px 18px; display: flex; gap:10px; align-items: center; border-bottom: 1px solid var(--c-line-2); background: #fff; flex-wrap: wrap; }
.input, .select { height: 36px; padding:0 12px; border: 1px solid var(--c-line); border-radius: 8px; font-size:13px; background: #fff;
  color: var(--c-ink); font-family: inherit; transition: all 120ms; width: 100%; }
.input:focus, .select:focus { outline: none; border-color: var(--c-primary); box-shadow: 0 0 0 3px rgba(255,59,48,0.10); }
.input:disabled, .input[readonly], textarea[readonly] { background: var(--c-line-3); color: var(--c-mute-2); cursor: not-allowed; border-color: var(--c-line-2); }
.select { background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2373757B' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat; background-position: right 10px center; padding-right:32px; appearance: none; }
.input-search { position: relative; flex: 1; max-width: 320px; }
.input-search input { padding-left:36px; }
.input-search .lead-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--c-mute-2); pointer-events: none; }
textarea.input { height: auto; padding:10px 12px; line-height:1.55; resize: vertical; }

/* ============== TABLE ============== */
.table-scroll { overflow-x: auto; }
.table, .tbl { width: 100%; border-collapse: collapse; font-size:13px; }
.table thead, .tbl thead { background: var(--c-bg-off); }
.table th, .tbl th { padding:12px 14px; text-align: left; font-weight: 600; color: var(--c-mute); font-size:12px; text-transform: uppercase;
  letter-spacing: 0.05em; border-bottom: 1px solid var(--c-line-2); white-space: nowrap; }
.table th.is-sortable, .tbl th.is-sortable { cursor: pointer; user-select: none; }
.table th.is-sortable:hover { color: var(--c-ink); background: var(--c-line-3); }
.table th .sort-arrow { display: inline-block; margin-left:4px; opacity: 0.4; }
.table th.is-sorted .sort-arrow { opacity: 1; color: var(--c-primary); }
.table td, .tbl td { padding:13px 14px 11px; border-bottom: 1px solid var(--c-line-2); color: var(--c-ink); vertical-align: middle; }
.table tbody tr, .tbl tbody tr { transition: background 120ms; }
.table tbody tr:hover, .tbl tbody tr:hover { background: var(--c-bg-off); }
.table tbody tr:last-child td { border-bottom: 0; }
.table tbody tr.is-clickable, .tbl tbody tr.is-clickable { cursor: pointer; }
.cell-truncate { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.num, .tbl-num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
th.col-num, td.col-num, .tbl-num { text-align: right; }
.tbl-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: -0.01em; }
.tbl-meta { font-size:11px; color: var(--c-mute-2); margin-top:2px; }

/* ============== PILLS ============== */
.pill { display: inline-flex; align-items: center; gap:5px; padding:4px 10px 3px; border-radius: 999px; font-size:12px; font-weight: 600; white-space: nowrap; line-height:1.5; }
.pill [data-lucide] { width: 11px; height: 11px; }
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill-info    { background: #E6F0FF; color: #1A5FCC; }
.pill-success { background: #E4F4EB; color: #157A41; }
.pill-warning { background: #FFF1DD; color: #B8690B; }
.pill-danger  { background: #FFE9E7; color: #E62E24; }
.pill-muted   { background: var(--c-line-3); color: var(--c-mute-2); }
.pill-accent  { background: rgba(255,154,31,0.14); color: #A25C00; }
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 0.8s linear infinite; }
.form-section { margin-top:var(--sp-xl); }
.form-section:first-child { margin-top:0; }
.form-section-title { font-size: var(--fs-cap); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--c-mute);
  padding-bottom:var(--sp-sm); border-bottom: 1px solid var(--c-line-2); margin-bottom:var(--sp-md); }
.seg-control { display:inline-flex; background: var(--c-line-3); border-radius: var(--r-md); padding:2px; gap:2px; }
.seg-item { padding:6px 12px 3px; border-radius: var(--r-sm); border: none; background: transparent; font-size: var(--fs-meta);
  font-weight: 500; color: var(--c-mute-2); cursor: pointer; font-family: inherit; white-space: nowrap; }
.seg-item.is-active { background: #fff; color: var(--c-ink); font-weight: 600; box-shadow: 0 1px 3px rgba(17,17,17,0.08); }
.row-actions { display: inline-flex; gap:2px; }
.ra-btn { width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; background: transparent;
  border: 0; color: var(--c-mute-2); border-radius: 6px; transition: all 120ms; }
.ra-btn:hover { background: var(--c-line-3); color: var(--c-primary); }
.ra-btn [data-lucide] { width: 15px; height: 15px; }
.table-footer { padding:12px 18px; background: var(--c-bg-off); border-top: 1px solid var(--c-line-2); display: flex;
  justify-content: space-between; align-items: center; font-size:12.5px; color: var(--c-mute); flex-wrap: wrap; gap:10px; }
.pagination { display: inline-flex; gap:4px; align-items: center; }
.pg-btn { min-width: 30px; height: 30px; padding:0 8px; display: inline-flex; align-items: center; justify-content: center; background: #fff;
  border: 1px solid var(--c-line-2); border-radius: 6px; color: var(--c-mute); font-size:12.5px; font-weight: 500; cursor: pointer; transition: all 120ms; }
.pg-btn:hover { border-color: var(--c-line); background: var(--c-bg-off); }
.pg-btn.is-active { background: var(--c-primary); border-color: var(--c-primary); color: #fff; }
.pg-btn.is-disabled { opacity: 0.4; cursor: not-allowed; }

}

function locName(code) { var l = LOC_BY[code]; return l ? l.code + ' · ' + l.name : (code || '—'); }
function reasonName(code) { var r = REASON_BY[code]; return r ? r.name : (code || '—'); }
function mainReasonName(code) { var r = MAIN_REASONS.filter(function(x){ return x.code === code; })[0]; return r ? r.name : (code || '—'); }

/* ยอดคืนสะสม — เขียนโดย RTV เท่านั้น (นับเฉพาะใบที่ของออกจริงแล้ว: ส่งคืนแล้ว/ปิดใบ) */
function returnedQty(grnCode, ln, exceptId) {
  var n = 0;
  RTVS.forEach(function(r){
    if (r.grn !== grnCode) return;
    if (exceptId && r.id === exceptId) return;
    if (r.status !== 'returned' && r.status !== 'closed') return;
    r.lines.forEach(function(l){ if (l.grn_line === ln) n += (+l.qty || 0); });
  });
  return n;
}
/* ฐานคืนได้ (PREBRIEF §3.3) — QC ไม่ผ่าน = จำนวนที่ไม่ผ่าน · รับเกิน = จำนวนที่เกิน · อื่น ๆ = ของที่เข้าคลังปกติ */
function baseQty(grnCode, ln, reasonCode) {
  var g = GRN_BY[grnCode]; if (!g) return 0;
  var gl = g.lines.filter(function(x){ return x.ln === ln; })[0]; if (!gl) return 0;
  if (gl.movedOut) return 0;
  if (reasonCode === 'over') return gl.over || 0;
  if (gl.qcFail > 0) return gl.qcFail;
  return Math.max(0, gl.recv - gl.qcFail);
}
function returnableQty(grnCode, ln, reasonCode, exceptId) {
  return Math.max(0, baseQty(grnCode, ln, reasonCode) - returnedQty(grnCode, ln, exceptId));
}
function grnLine(grnCode, ln) {
  var g = GRN_BY[grnCode]; if (!g) return null;
  return g.lines.filter(function(x){ return x.ln === ln; })[0] || null;
}
function grnReturnable(g) {
  if (g.status !== 'posted') return 0;
  var n = 0;
  g.lines.forEach(function(gl){
    var rc = gl.over > 0 ? 'over' : (gl.qcFail > 0 ? 'damaged' : 'offspec');
    n += returnableQty(g.code, gl.ln, rc);
  });
  return n;
}
function grnBlockReason(g) {
  if (g.status === 'draft') return 'ใบรับของยังเป็นร่าง — ยังไม่มีของเข้าคลัง';
  if (g.status === 'reversed') return 'ใบรับของถูกกลับรายการแล้ว';
  if (grnReturnable(g) <= 0) return 'คืนครบแล้ว — ไม่มีของคงเหลือให้คืน';
  return '';
}
/* GRN ที่ถูก RTV ไปแล้ว = กลับรายการไม่ได้ (GRN BR-16 · RTV BR-20) */
function grnLockedByRtv(grnCode) {
  return RTVS.some(function(r){ return r.grn === grnCode && (r.status === 'returned' || r.status === 'closed'); });
}

/* ============================================================
   LINE ENGINE (B2 v2 — locked · ห้ามคำนวณที่อื่น)
   ============================================================ */
function createBlankLine() {
  return { id: 'L' + Date.now() + Math.random().toString(36).slice(2, 5), grn_line: 0, item_code: '', item_name: '',
    uom: '-', qty: 0, unit_price: 0, discount_pct: 0, vat_mode: 'add', vat_pct: CFG.vatPct, reason: '', srcLoc: '', note: '' };
}
function migrateLine(l) {
  if (l.vat_mode == null) { l.vat_mode = l.net_enabled ? 'included' : (l.vat_enabled === false ? 'none' : 'add'); }
  if (l.vat_pct == null) l.vat_pct = CFG.vatPct;
  return l;
}
function calcLineVat(l) {
  migrateLine(l);
  var subtotal = (+l.qty || 0) * (+l.unit_price || 0);
  var discount = (l.discount_mode || 'percent') === 'amount' ? Math.min(subtotal, +l.discount_amt || 0) : subtotal * ((+l.discount_pct || 0) / 100);
  var netAmount = subtotal - discount;
  var vatAmount = 0; var lineTotal = netAmount;
  if (l.vat_mode === 'add') { vatAmount = netAmount * (l.vat_pct / 100); lineTotal = netAmount + vatAmount; }
  else if (l.vat_mode === 'included') { vatAmount = netAmount * (l.vat_pct / 100) / (1 + l.vat_pct / 100); lineTotal = netAmount; }
  return { netAmount: netAmount, vatAmount: vatAmount, lineTotal: lineTotal };
}
function totals(doc) {
  var before = 0, vat = 0;
  (doc.lines || []).forEach(function(l){
    migrateLine(l);
    var v = calcLineVat(l);
    before += l.vat_mode === 'included' ? v.netAmount - v.vatAmount : v.netAmount;
    vat += v.vatAmount;
  });
  var after = before + vat;
  var eb = doc.endbill || { enabled:false, mode:'percent', value:0 };
  var ebAmt = 0;
  if (eb.enabled) ebAmt = doc.endbill.mode === 'amount' ? (+eb.value || 0) : after * ((+eb.value || 0) / 100);
  return { before: before, vat: vat, after: after, ebAmt: ebAmt, coupon: 0, grand: Math.max(0, after - ebAmt), n: (doc.lines || []).length };
}
function taxBadgeV(l) {
  migrateLine(l);
  if (l.vat_mode === 'none') return '<span class="pill pill-muted" style="font-size:11px;"><span class="dot"></span>ไม่คิด</span>';
  if (l.vat_mode === 'included') return '<span class="pill pill-danger" style="font-size:11px;" title="ราคารวม VAT · คำนวณย้อน"><span class="dot"></span>NET ' + l.vat_pct + '%</span>';
  return '<span class="pill pill-accent" style="font-size:11px;"><span class="dot"></span>VAT ' + l.vat_pct + '%</span>';
}
function linesTableView(doc) {
  var t = totals(doc); var eb = doc.endbill || {};

    var v = calcLineVat(l);

      + '<td class="tbl-mono" style="font-size:11.5px;">' + locName(l.srcLoc) + '</td>'

  }).join('');
  return '<div class="card"><div class="table-scroll"><table class="tbl">'
    + '<thead><tr><th style="width:32px;text-align:center;">#</th><th style="min-width:200px;">สินค้า</th>'
    + '<th style="width:140px;">เหตุผลคืน</th><th style="width:150px;">ตัดออกจาก</th>'

    + '<th style="width:100px;text-align:right;">ราคา/หน่วย</th><th style="width:90px;text-align:center;">ภาษี</th>'

    + '<tr style="background:var(--c-off-white);border-top:2px solid var(--c-border);"><td colspan="8" style="text-align:right;font-size:12px;">ยอดรวมก่อนภาษี:</td><td class="tbl-num" style="font-weight:600;">' + fmtMoney(t.before) + '</td></tr>'

    + (eb.enabled ? '<tr style="background:var(--c-off-white);"><td colspan="8" style="text-align:right;font-size:12px;color:var(--c-text-mute);">ปรับลดท้ายใบ:</td><td class="tbl-num" style="font-weight:600;">-' + fmtMoney(t.ebAmt) + '</td></tr>' : '')
    + '<tr style="background:var(--c-off-white);border-top:1px solid var(--c-border);"><td colspan="8" style="text-align:right;font-size:13px;font-weight:700;">มูลค่าที่คืนรวม:</td><td class="tbl-num" style="font-weight:700;color:var(--c-primary);font-size:14px;">' + fmtMoney(t.grand) + '</td></tr>'
    + '</tfoot></table></div></div>';
}
/* ลายเซ็น n/N (Rule #98 — คอลัมน์ลายเซ็นใน list) */
function renderSignProgress(r) {
  var steps = (r.doa && r.doa.steps) || [];
  if (!steps.length) return '<span style="color:var(--c-text-soft);font-size:12px;">—</span>';
  var done = steps.filter(function(s){ return s.status === 'approved'; }).length;
  var pct = Math.round(done / steps.length * 100);
  var cls = done === steps.length ? '' : ' class="pending"';
  return '<span class="tbl-mono" style="font-size:11.5px;color:var(--c-text-mute);">' + done + '/' + steps.length + '</span>'
    + ' <span class="pgl sm"><div' + cls + ' style="width:' + pct + '%"></div></span>';
}
function currentSlot(r) {
  var steps = (r.doa && r.doa.steps) || [];
  for (var i = 0; i < steps.length; i++) { if (steps[i].status !== 'approved') return steps[i]; }
  return null;
}
function pushAudit(r, act, note) {
  var now = new Date();
  var iso = now.getFullYear() + '-' + ('0'+(now.getMonth()+1)).slice(-2) + '-' + ('0'+now.getDate()).slice(-2)
    + 'T' + ('0'+now.getHours()).slice(-2) + ':' + ('0'+now.getMinutes()).slice(-2);
  r.audit.push({ act: act, by: state.me, at: iso, note: note || '' });
  r.updatedBy = state.me; r.updatedAt = iso;
}

function getRoute() {

  if (!h) return { name:'list' };
  var p = h.split('/');
  if (p[0] === 'view') return { name:'view', id:p[1] };
  if (p[0] === 'edit') return { name:'edit', id:p[1] };

/* ============================================================
   LIST PAGE (Pattern A + Pattern Q spec)
   ============================================================ */
function rtvFiltered() {
  var f = state.filters;
  var q = (f.q || '').toLowerCase().trim();
  return RTVS.filter(function(r){
    if (!f.archived && (r.status === 'cancelled' || r.status === 'reversed')) return false;
    if (f.status !== 'all' && r.status !== f.status) return false;
    if (f.vendor !== 'all' && r.vendor !== f.vendor) return false;
    if (f.reason !== 'all' && r.mainReason !== f.reason) return false;
    if (q) {
      var hay = [r.code, r.grn, r.po, vendorName(r.vendor), r.rma, r.note].join(' ').toLowerCase();
      if (hay.indexOf(q) < 0) return false;
    }
    return true;
  }).sort(function(a, b){
    var c = state.sort.col, d = state.sort.dir === 'asc' ? 1 : -1;
    var av = c === 'amount' ? totals(a).grand : (a[c] || '');
    var bv = c === 'amount' ? totals(b).grand : (b[c] || '');
    if (av < bv) return -1 * d; if (av > bv) return 1 * d; return 0;
  });
}
function kpis() {
  var monthDocs = RTVS.filter(function(r){ return (r.docDate || '').indexOf('2026-09') === 0 && r.status !== 'cancelled'; });
  var value = RTVS.filter(function(r){ return r.status === 'returned' || r.status === 'closed'; })
    .reduce(function(s, r){ return s + totals(r).grand; }, 0);
  var pending = RTVS.filter(function(r){ return r.status === 'pending'; }).length;
  var waitCredit = RTVS.filter(function(r){ return r.status === 'returned'; }).reduce(function(s, r){ return s + totals(r).grand; }, 0);
  var quarantine = 0;
  GRNS.forEach(function(g){ if (g.status === 'posted') quarantine += grnReturnable(g); });
  return { month: monthDocs.length, value: value, pending: pending, waitCredit: waitCredit, quarantine: quarantine };
}
function sortBy(col) {
  if (state.sort.col === col) state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc';
  else { state.sort.col = col; state.sort.dir = 'asc'; }
  renderTableOnly();
}

/* ============================================================
   MASTER COMBOBOX (Rule #94/#102 — search dropdown ทุก field ที่อ้าง master)
   contract: state {query, open, highlight} · input/focus/key/select/clear · portal ลอย (#95)
   ============================================================ */
var comboState = {};
function comboCfg(key) {
  if (key.indexOf('slot-') === 0 || key === 'w-requester') return { kind:'person' };
  if (key.indexOf('line-loc-') === 0 || key === 'rev-loc') return { kind:'location' };
  if (key === 'w-wh') return { kind:'warehouse' };
  if (key === 'w-cc') return { kind:'cost' };
  return { kind:'person' };
}
function comboOptions(key, q) {
  var kind = comboCfg(key).kind;
  q = (q || '').toLowerCase().trim();
  var arr = [];
  if (kind === 'person') {
    var suggest = [];
    if (key.indexOf('slot-') === 0) {
      var idx = parseInt(key.split('-')[1], 10);
      var chain = submitDraft.chain || [];
      if (chain[idx]) suggest = roleSuggest(chain[idx].role);
    }
    arr = PEOPLE.slice().sort(function(a, b){ return (suggest.indexOf(b.id) - suggest.indexOf(a.id)); })
      .map(function(p){ return { value:p.id, l1:p.name, l2:p.pos + ' · ' + p.dept, ini:p.ini, kind:'person' }; });
  } else if (kind === 'location') {
    arr = LOCATIONS.map(function(l){ return { value:l.code, l1:l.name, l2:l.code + ' · ' + (l.kind === 'quarantine' ? 'พื้นที่กักกัน' : 'พื้นที่จัดเก็บปกติ'), icon:'map-pin', kind:'loc' }; });
  } else if (kind === 'warehouse') {
    arr = WAREHOUSES.map(function(w){ return { value:w.code, l1:w.name, l2:w.code, icon:'warehouse', kind:'loc' }; });
  } else {
    arr = COST_CENTERS.map(function(c){ return { value:c.code, l1:c.name, l2:c.code, icon:'building', kind:'loc' }; });
  }
  if (!q) return arr;
  return arr.filter(function(o){ return (o.l1 + ' ' + o.l2 + ' ' + o.value).toLowerCase().indexOf(q) >= 0; });
}
function comboLabel(key, value) {
  if (!value) return '';
  var o = comboOptions(key, '').filter(function(x){ return x.value === value; })[0];
  return o ? o.l1 : value;
}
function comboHTML(key, value, placeholder) {
  var st = comboState[key] || (comboState[key] = { query:'', open:false, highlight:0 });
  var label = comboLabel(key, value);
  return '<div style="position:relative;" id="cb-' + key + '">'
    + '<i data-lucide="search" class="w-4 h-4" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--c-text-soft);"></i>'
    + '<input type="text" class="input" id="cb-in-' + key + '" autocomplete="off" value="' + esc(label) + '" placeholder="' + esc(placeholder) + '"'
    + ' style="padding-left:36px;padding-right:36px;"'
    + ' oninput="comboInput(\'' + key + '\', this.value)" onfocus="comboFocus(\'' + key + '\')" onkeydown="comboKey(\'' + key + '\', event)">'
    + (value
        ? '<button type="button" title="ล้างการเลือก" onclick="comboClear(\'' + key + '\')" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:none;padding:4px;cursor:pointer;color:var(--c-text-soft);"><i data-lucide="x" class="w-4 h-4"></i></button>'
        : '<i data-lucide="chevron-down" class="w-4 h-4" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--c-text-soft);pointer-events:none;"></i>')
    + '</div>';
}
function comboClosePop() { var p = document.getElementById('combo-pop'); if (p) p.remove(); Object.keys(comboState).forEach(function(k){ comboState[k].open = false; }); }
function comboFocus(key) { comboState[key].query = ''; comboOpenPop(key); }
function comboInput(key, v) { comboState[key].query = v; comboState[key].highlight = 0; comboOpenPop(key); }
function comboOpenPop(key) {
  comboClosePop();
  var st = comboState[key] = comboState[key] || { query:'', open:false, highlight:0 };
  st.open = true;
  var input = document.getElementById('cb-in-' + key); if (!input) return;
  var pop = document.createElement('div');
  pop.className = 'combo-pop'; pop.id = 'combo-pop'; pop.setAttribute('data-combo-key', key);
  document.getElementById('overlay-root').appendChild(pop);
  var r = input.getBoundingClientRect();
  var up = window.innerHeight - r.bottom < 300;
  pop.style.left = r.left + 'px';
  pop.style.width = Math.max(300, r.width) + 'px';
  if (up) { pop.style.bottom = (window.innerHeight - r.top + 4) + 'px'; } else { pop.style.top = (r.bottom + 4) + 'px'; }
  comboPaint(key);
  setTimeout(function(){ document.addEventListener('mousedown', comboOutside); }, 0);
}
function comboOutside(e) {
  var pop = document.getElementById('combo-pop');
  if (!pop) { document.removeEventListener('mousedown', comboOutside); return; }
  var key = pop.getAttribute('data-combo-key');
  var wrap = document.getElementById('cb-' + key);
  if (pop.contains(e.target) || (wrap && wrap.contains(e.target))) return;
  comboClosePop(); document.removeEventListener('mousedown', comboOutside);
}
function comboPaint(key) {
  var pop = document.getElementById('combo-pop'); if (!pop) return;
  var st = comboState[key];
  var list = comboOptions(key, st.query);
  if (!list.length) { pop.innerHTML = '<div class="suggest-empty">ไม่พบรายการที่ตรงกับคำค้น</div>'; return; }
  pop.innerHTML = list.map(function(o, i){
    var left = o.kind === 'person'
      ? '<span class="emp-av" style="width:26px;height:26px;font-size:10.5px;">' + o.ini + '</span>'
      : '<i data-lucide="' + (o.icon || 'circle') + '" class="w-3.5 h-3.5" style="color:var(--c-text-soft);"></i>';
    return '<button type="button" class="' + (i === st.highlight ? 'hi' : '') + '" onmousedown="event.preventDefault()" onclick="comboPick(\'' + key + '\', \'' + o.value + '\')">'
      + left
      + '<span style="flex:1;min-width:0;"><span style="display:block;font-size:12.5px;font-weight:600;color:var(--c-navy);">' + hl(o.l1, st.query) + '</span>'
      + '<span style="display:block;font-size:11px;color:var(--c-text-mute);">' + hl(o.l2, st.query) + '</span></span></button>';
  }).join('');
  renderIcons();
}
function hl(text, q) {
  q = (q || '').trim(); if (!q) return esc(text);
  var t = esc(text); var i = t.toLowerCase().indexOf(q.toLowerCase());
  if (i < 0) return t;
  return t.slice(0, i) + '<mark style="background:rgba(255,59,48,0.16);padding:0 1px;border-radius:2px;">' + t.slice(i, i + q.length) + '</mark>' + t.slice(i + q.length);
}
function comboKey(key, e) {
  var st = comboState[key]; if (!st || !st.open) return;
  var list = comboOptions(key, st.query);
  if (e.key === 'ArrowDown') { e.preventDefault(); st.highlight = Math.min(list.length - 1, st.highlight + 1); comboPaint(key); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); st.highlight = Math.max(0, st.highlight - 1); comboPaint(key); }
  else if (e.key === 'Enter') { e.preventDefault(); if (list[st.highlight]) comboPick(key, list[st.highlight].value); }
  else if (e.key === 'Escape') { e.stopPropagation(); comboClosePop(); }
}
function comboPick(key, value) {
  comboClosePop();
  if (key === 'w-requester') { createWizard.data.requester = value; renderCreateDrawer(); return; }
  if (key === 'w-wh') { createWizard.data.wh = value; renderCreateDrawer(); return; }
  if (key === 'w-cc') { createWizard.data.cc = value; renderCreateDrawer(); return; }
  if (key.indexOf('line-loc-') === 0) {
    var id = key.slice('line-loc-'.length);
    var l = createWizard.data.lines.filter(function(x){ return x.id === id; })[0];
    if (l) l.srcLoc = value;
    renderCreateDrawer(); return;
  }
  if (key.indexOf('slot-') === 0) {
    var idx = parseInt(key.split('-')[1], 10);
    submitDraft.chain[idx].person = value;
    renderSubmitModalBody(); return;
  }
  if (key === 'rev-loc') { reverseDraft.loc = value; renderModalBody(); return; }
}
function comboClear(key) {
  if (key === 'w-requester') createWizard.data.requester = '';
  else if (key === 'w-wh') { createWizard.data.wh = ''; createWizard.data.cc = ''; }
  else if (key === 'w-cc') createWizard.data.cc = '';
  else if (key.indexOf('line-loc-') === 0) {
    var id = key.slice('line-loc-'.length);
    var l = createWizard.data.lines.filter(function(x){ return x.id === id; })[0]; if (l) l.srcLoc = '';
  } else if (key.indexOf('slot-') === 0) { submitDraft.chain[parseInt(key.split('-')[1], 10)].person = ''; renderSubmitModalBody(); return; }
  else if (key === 'rev-loc') { reverseDraft.loc = ''; renderModalBody(); return; }
  comboState[key] = { query:'', open:false, highlight:0 };
  renderCreateDrawer();
  setTimeout(function(){ var el = document.getElementById('cb-in-' + key); if (el) { el.focus(); comboOpenPop(key); } }, 30);
}

/* ============================================================
   CREATE / EDIT WIZARD (Pattern Q — 5 steps ล็อกลำดับ)

var createWizard = { step:1, data:null, editId:null, expandedLineId:null, _blocked:false };

function blankData() {

    shipper:'', vehicle:'', receiver:'', returnAddr:'', note:'', lines:[], endbill:{ enabled:false, mode:'percent', value:0, src:'' }, attachments:[] };
}
function openCreateDrawer(editId, from) {

  if (editId) {

    createWizard.data = JSON.parse(JSON.stringify({ grn:r.grn, po:r.po, vendor:r.vendor, mainReason:r.mainReason, rma:r.rma, wh:r.wh, cc:r.cc,

function pickGrn(code, silent) {
  var g = GRN_BY[code];
  if (!g) return;
  var block = grnBlockReason(g);
  if (block) { showToast(code + ' — ' + block, 'warning'); return; }
  var d = createWizard.data;
  d.grn = code; d.po = g.po; d.vendor = g.vendor; d.wh = g.wh;
  d.mainReason = d.mainReason || (g.lines.some(function(x){ return x.qcFail > 0; }) ? 'qc' : 'over');
  var v = VENDOR_BY[g.vendor]; d.returnAddr = v ? v.addr : '';
  d.lines = g.lines.map(function(gl){
    var rc = gl.over > 0 ? 'over' : (gl.qcFail > 0 ? (gl.qcReason || 'damaged') : 'offspec');
    var avail = returnableQty(code, gl.ln, rc, createWizard.editId);
    return { id:'L-' + code + '-' + gl.ln, grn_line:gl.ln, item_code:gl.item, item_name:gl.name, uom:gl.uom,
      qty: gl.movedOut ? 0 : avail, unit_price:gl.price, discount_pct:gl.disc, vat_mode:gl.vat, vat_pct:CFG.vatPct,
      reason:rc, srcLoc: rc === 'over' ? gl.loc : gl.qLoc, note:'' };
  });
  if (!silent) { showToast('ดึงรายการจาก ' + code + ' แล้ว ' + d.lines.length + ' บรรทัด', 'success'); renderCreateDrawer(); }
}
function lineAvail(l) { return returnableQty(createWizard.data.grn, l.grn_line, l.reason, createWizard.editId); }
function lineBlocked(l) {
  var gl = grnLine(createWizard.data.grn, l.grn_line);
  if (gl && gl.movedOut) return 'ของถูกใช้ต่อแล้ว — ' + (gl.movedRef || 'ย้ายออกจาก location เดิม');
  if ((+l.qty || 0) > lineAvail(l)) return 'เกินยอดคืนได้ (สูงสุด ' + fmtNumber(lineAvail(l)) + ' ' + l.uom + ')';
  if ((+l.qty || 0) < 0) return 'จำนวนคืนติดลบไม่ได้';
  if ((+l.qty || 0) > 0 && !l.reason) return 'ต้องระบุเหตุผลคืน';
  if ((+l.qty || 0) > 0 && l.reason === 'other' && !(l.note || '').trim()) return 'เลือก “อื่น ๆ” ต้องพิมพ์คำอธิบาย';

}
function wizardBlockers() {

function applyMainReason() {

function updateLine(id, field, val) {
  var line = createWizard.data.lines.filter(function(l){ return l.id === id; })[0]; if (!line) return;
  var focused = document.activeElement;
  var focusInfo = focused && focused.tagName === 'INPUT' ? { oninput: focused.getAttribute('oninput'), selStart: focused.selectionStart } : null;
  if (field === 'qty') { var n = parseFloat(String(val).replace(/[^0-9.\-]/g, '')); line.qty = isNaN(n) ? 0 : n; }
  else if (field === 'vat_mode') { line.vat_mode = val; }
  else if (field === 'reason') {
    line.reason = val;
    var gl = grnLine(createWizard.data.grn, line.grn_line);
    if (gl) line.srcLoc = (val === 'over') ? gl.loc : (gl.qcFail > 0 ? gl.qLoc : gl.loc);
  }
  else line[field] = val;
  renderCreateDrawer();
  if (focusInfo) {
    var inputs = document.querySelectorAll('input');
    for (var i = 0; i < inputs.length; i++) {
      if (inputs[i].getAttribute('oninput') === focusInfo.oninput) {
        inputs[i].focus();
        try { inputs[i].setSelectionRange(focusInfo.selStart, focusInfo.selStart); } catch (e) {}
        break;
      }
    }
  }
}

function commitWizard(status, doa) {
  var d = createWizard.data;
  var lines = d.lines.filter(function(l){ return (+l.qty || 0) > 0; }).map(function(l){ return JSON.parse(JSON.stringify(l)); });
  var r = createWizard.editId ? findRtv(createWizard.editId) : null;
  var isNew = !r;
  if (isNew) {
    r = { id:'RTV-NEW-' + Date.now(), code:'', status:'draft', audit:[], createdBy:state.me, createdAt:TODAY_ISO + 'T09:00',
      creditDoc:'', creditAmount:0, creditDate:'', cancelReason:'', reverseReason:'', reverseLoc:'', doa:null };
    RTVS.unshift(r);
  }
  r.grn = d.grn; r.po = d.po; r.vendor = d.vendor; r.mainReason = d.mainReason; r.rma = d.rma; r.wh = d.wh; r.cc = d.cc;
  r.docDate = d.docDate; r.returnDate = d.returnDate; r.requester = d.requester; r.shipper = d.shipper; r.vehicle = d.vehicle;
  r.receiver = d.receiver; r.returnAddr = d.returnAddr; r.note = d.note; r.lines = lines; r.endbill = d.endbill; r.attachments = d.attachments;
  if (isNew) pushAudit(r, 'สร้างร่าง', 'ดึงบรรทัดจาก ' + d.grn);
  else pushAudit(r, 'แก้ไขร่าง', 'ปรับจำนวน/เหตุผลคืน');
  if (status === 'pending') {
    if (!r.code) r.code = nextDocNo();
    r.status = 'pending'; r.doa = doa;
    pushAudit(r, 'ส่งอนุมัติ', 'ออกเลข ' + r.code + ' · มูลค่า ' + fmtMoney(totals(r).grand) + ' · สาย ' + doa.steps.length + ' ขั้น');
  }
  return r;
}

function doCancel(id) {
  var r = findRtv(id);
  if (!(modalDraft.note || '').trim()) { showToast('กรุณาระบุเหตุผลที่ยกเลิก', 'warning'); return; }
  r.status = 'cancelled'; r.cancelReason = modalDraft.note;
  pushAudit(r, 'ยกเลิกใบ', modalDraft.note + ' (ของยังไม่ออกจากคลัง)');
  closeModal(); render(); showToast('ยกเลิกใบคืนแล้ว — ของกลับไปนับเป็นของที่คืนได้ตามเดิม', 'info');
}
var shipDraft = { date:'', shipper:'', vehicle:'', receiver:'' };
function doShip(id) {
  var r = findRtv(id);
  if (!shipDraft.date) { showToast('กรุณาระบุวันที่ส่งคืนจริง', 'warning'); return; }
  if (!(shipDraft.shipper || '').trim()) { showToast('กรุณาระบุผู้ส่งของคืน', 'warning'); return; }
  var btn = document.getElementById('btn-do-ship');
  btn.disabled = true; btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>'; renderIcons();
  setTimeout(function(){
    /* FWD-WIRE: ENG-NOTIFY rtv_returned · FWD-WIRE: ENG-CSQ emit rtv_returned (EC) + rtv_credit_expected (FC) */
    r.status = 'returned'; r.returnDate = shipDraft.date; r.shipper = shipDraft.shipper; r.vehicle = shipDraft.vehicle; r.receiver = shipDraft.receiver;
    var moves = r.lines.map(function(l){ return l.item_code + ' ' + fmtNumber(l.qty) + ' ' + l.uom + ' ออกจาก ' + l.srcLoc; }).join(' · ');
    pushAudit(r, 'บันทึกส่งคืน', 'ตัดสต๊อกออกจริง (append-only): ' + moves);
    closeModal(); render();
    showToast('บันทึกส่งคืนแล้ว — ตัดสต๊อกออกจาก location ต้นทาง และล็อก ' + r.grn + ' ไม่ให้กลับรายการ', 'success');
  }, 600);
}
var creditDraft = { doc:'', date:'', amount:0 };
function doCredit(id) {
  var r = findRtv(id);
  if (!(creditDraft.doc || '').trim()) { showToast('ต้องระบุเลขที่เอกสารเครดิตของผู้ขายก่อนปิดใบ', 'warning'); return; }
  /* FWD-WIRE: ENG-NOTIFY rtv_credited · FWD-WIRE: ENG-CSQ emit rtv_credited (FC) · การลงบัญชีจริงอยู่ที่ W5 */
  r.status = 'closed'; r.creditDoc = creditDraft.doc; r.creditDate = creditDraft.date || TODAY_ISO;
  r.creditAmount = +creditDraft.amount || totals(r).grand;
  pushAudit(r, 'บันทึกเครดิต · ปิดใบ', r.creditDoc + ' · ' + fmtMoney(r.creditAmount) + ' บาท (ยังไม่ post JE — รอ W5)');
  closeModal(); render(); showToast('ปิดใบแล้ว — บันทึกเครดิตจากผู้ขาย (ยังไม่ลงบัญชีจริง)', 'success');
}
var reverseDraft = { loc:'', note:'' };
function doReverse(id) {
  var r = findRtv(id);
  if (!(modalDraft.note || '').trim()) { showToast('กรุณาระบุเหตุผลที่กลับรายการ', 'warning'); return; }
  if (!reverseDraft.loc) { showToast('กรุณาระบุ location ที่รับของกลับเข้า', 'warning'); return; }
  /* FWD-WIRE: ENG-NOTIFY rtv_reversed · FWD-WIRE: ENG-CSQ emit rtv_reversed (EC/FC · avoided) */
  r.status = 'reversed'; r.reverseReason = modalDraft.note; r.reverseLoc = reverseDraft.loc;
  pushAudit(r, 'กลับรายการ', modalDraft.note + ' · movement ตรงข้ามรับของกลับเข้า ' + reverseDraft.loc + ' (ของเดิมไม่ถูกลบ)');
  closeModal(); render(); showToast('กลับรายการแล้ว — ของกลับเข้า ' + reverseDraft.loc + ' และยอดคืนสะสมที่ ' + r.grn + ' ถูกหักคืน', 'info');
}

/* ---- modal shell ---- */
var modalDraft = { note:'' };
function openModal(type, id) {
  state.modal = { type: type, id: id };
  modalDraft = { note: '' };
  if (type === 'ship') {
    var r0 = findRtv(id);
    shipDraft = { date: TODAY_ISO, shipper: r0.shipper || '', vehicle: r0.vehicle || '', receiver: r0.receiver || '' };
  }
  if (type === 'credit') { var r1 = findRtv(id); creditDraft = { doc:'', date: TODAY_ISO, amount: totals(r1).grand }; }
  if (type === 'reverse') { var r2 = findRtv(id); reverseDraft = { loc: (r2.lines[0] || {}).srcLoc || '', note:'' }; }
  renderModal();
  requestAnimationFrame(function(){ var b = document.getElementById('modal-backdrop'); if (b) b.classList.add('is-open'); });
}
function closeModal() {
  comboClosePop();
  var b = document.getElementById('modal-backdrop'); if (b) b.classList.remove('is-open');
  setTimeout(function(){ state.modal = null; var m = document.getElementById('modal-root'); if (m) m.innerHTML = ''; }, 200);
}
function renderModal() {
  var m = document.getElementById('modal-root'); if (!m) return;
  var t = state.modal ? state.modal.type : null;
  if (!t) { m.innerHTML = ''; return; }
  var id = state.modal.id;
  var cfg = modalConfig(t, id);
  m.innerHTML = '<div class="modal-backdrop" id="modal-backdrop" onclick="closeModal()">'
    + '<div class="modal' + (cfg.lg ? ' is-lg' : '') + '" onclick="event.stopPropagation()">'
    +   '<div class="modal-header"><div class="modal-header-icon' + (cfg.tone ? ' is-' + cfg.tone : '') + '"><i data-lucide="' + cfg.icon + '" class="w-4 h-4"></i></div>'
    +     '<div style="flex:1;"><h3 class="modal-title">' + cfg.title + '</h3><p class="modal-subtitle">' + cfg.sub + '</p></div>'
    +     '<button class="top-icon-btn" type="button" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button></div>'
    +   '<div class="modal-body" id="modal-body"></div>'
    +   '<div class="modal-footer">' + cfg.footer + '</div>'
    + '</div></div>';
  renderModalBody();
  requestAnimationFrame(function(){ var b = document.getElementById('modal-backdrop'); if (b) b.classList.add('is-open'); });
  renderIcons();
}
function modalConfig(t, id) {
  var r = id ? findRtv(id) : null;
  if (t === 'submit') return { icon:'send', title:'ส่งอนุมัติใบคืนสินค้า', sub:'เลือกผู้อนุมัติคนจริงต่อขั้นตามทะเบียน DOA', lg:true,
    footer:'<button class="btn btn-ghost" type="button" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" type="button" id="btn-do-submit" onclick="doSubmit()"><i data-lucide="send" class="w-4 h-4"></i><span>ส่งอนุมัติ</span></button>' };
  if (t === 'approve') return { icon:'check-circle-2', title:'อนุมัติใบคืนสินค้า ' + r.code, sub:'ยืนยันว่าตรวจของและเหตุผลคืนแล้ว', tone:'',
    footer:'<button class="btn btn-ghost" type="button" onclick="closeModal()">ยกเลิก</button><button class="btn btn-success" type="button" onclick="doApprove(\'' + id + '\')"><i data-lucide="check" class="w-4 h-4"></i><span>อนุมัติ</span></button>' };
  if (t === 'sendback') return { icon:'corner-up-left', title:'ส่งกลับแก้ ' + r.code, sub:'ระบุสิ่งที่ต้องแก้ — ใบจะกลับไปเป็นร่างโดยใช้เลขเดิม', tone:'warning',
    footer:'<button class="btn btn-ghost" type="button" onclick="closeModal()">ยกเลิก</button><button class="btn btn-secondary" type="button" onclick="doSendback(\'' + id + '\')"><i data-lucide="corner-up-left" class="w-4 h-4"></i><span>ส่งกลับแก้</span></button>' };
  if (t === 'reject') return { icon:'x-circle', title:'ไม่อนุมัติ ' + r.code, sub:'ใบจะถูกยกเลิกถาวร — ของยังอยู่ที่เดิม', tone:'danger',
    footer:'<button class="btn btn-ghost" type="button" onclick="closeModal()">ยกเลิก</button><button class="btn btn-danger" type="button" onclick="doReject(\'' + id + '\')"><i data-lucide="x-circle" class="w-4 h-4"></i><span>ไม่อนุมัติ</span></button>' };
  if (t === 'cancel') return { icon:'x-circle', title:'ยกเลิกใบคืนสินค้า ' + (r.code || '(ร่าง)'), sub:'ยกเลิกได้เฉพาะก่อนของออกจากคลัง', tone:'danger',
    footer:'<button class="btn btn-ghost" type="button" onclick="closeModal()">ยกเลิก</button><button class="btn btn-danger" type="button" onclick="doCancel(\'' + id + '\')"><i data-lucide="x-circle" class="w-4 h-4"></i><span>ยืนยันยกเลิกใบ</span></button>' };
  if (t === 'ship') return { icon:'truck', title:'บันทึกส่งคืน ' + r.code, sub:'ของออกจากคลังจริง — สต๊อกจะถูกตัดทันทีและแก้ไม่ได้', lg:true,
    footer:'<button class="btn btn-ghost" type="button" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" type="button" id="btn-do-ship" onclick="doShip(\'' + id + '\')"><i data-lucide="truck" class="w-4 h-4"></i><span>บันทึกส่งคืน</span></button>' };
  if (t === 'credit') return { icon:'receipt', title:'บันทึกเครดิต · ปิดใบ ' + r.code, sub:'บันทึกเลขเอกสารเครดิตจากผู้ขาย (ยังไม่ลงบัญชีจริง)', lg:true,
    footer:'<button class="btn btn-ghost" type="button" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" type="button" onclick="doCredit(\'' + id + '\')"><i data-lucide="check" class="w-4 h-4"></i><span>บันทึกและปิดใบ</span></button>' };
  if (t === 'reverse') return { icon:'undo-2', title:'กลับรายการ ' + r.code, sub:'ของกลับเข้าคลัง — สร้าง movement ตรงข้าม ไม่ลบของเดิม', tone:'danger', lg:true,
    footer:'<button class="btn btn-ghost" type="button" onclick="closeModal()">ยกเลิก</button><button class="btn btn-danger" type="button" onclick="doReverse(\'' + id + '\')"><i data-lucide="undo-2" class="w-4 h-4"></i><span>ยืนยันกลับรายการ</span></button>' };
  return { icon:'info', title:'', sub:'', footer:'<button class="btn btn-secondary" type="button" onclick="closeModal()">ปิด</button>' };
}

      ['จำนวนไม่ตรงกับที่ตกลงกับผู้ขาย','เหตุผลคืนยังไม่ชัด — แนบรูปเพิ่ม','location ต้นทางไม่ถูกต้อง']);

    +   '<table style="margin-top:8px;border:0;"><tr><td style="border:0;vertical-align:top;">'
    +     '<div style="font-weight:700;">หมายเหตุ</div><div style="color:#444;">' + esc(r.note || '—') + '</div>'
    +     '<div style="margin-top:6px;color:#444;">มูลค่าตามใบนี้เป็นมูลค่าสินค้าที่ส่งคืน — การรับเครดิต/ใบลดหนี้ให้เป็นไปตามเอกสารของผู้ขาย</div>'
    +   '</td><td style="border:0;width:250px;">'
    +     '<table><tr><td>ยอดรวมก่อนภาษี</td><td class="r">' + fmtMoney(t.before) + '</td></tr>'
    +     '<tr><td>ภาษีมูลค่าเพิ่ม ' + CFG.vatPct + '%</td><td class="r">' + fmtMoney(t.vat) + '</td></tr>'
    +     '<tr><td style="font-weight:700;">มูลค่าที่คืนรวม</td><td class="r" style="font-weight:700;">' + fmtMoney(t.grand) + '</td></tr></table>'
    +   '</td></tr></table>'
    +   '<table style="margin-top:26px;border:0;"><tr>'
    +     pdfSign('ผู้จัดทำ / ผู้ขอคืน', PEOPLE_BY[r.requester] ? PEOPLE_BY[r.requester].name : '', r.docDate)
    +     pdfSign('ผู้อนุมัติ', approver && PEOPLE_BY[approver.person] ? PEOPLE_BY[approver.person].name : '', approver ? approver.at : '')
    +     pdfSign('ผู้รับฝั่งผู้ขาย', r.receiver || '', r.returnDate)
    +   '</tr></table>'
    +   '<div style="margin-top:18px;border-top:1px solid #d1d5db;padding-top:6px;color:#666;display:flex;justify-content:space-between;">'
    +     '<span>' + (r.code || 'ร่าง') + ' · ' + vendorName(r.vendor) + '</span><span>พิมพ์เมื่อ ' + fmtDate(TODAY_ISO) + ' · หน้า 1/1</span></div>'
    + '</div></div>';
}
function pdfSign(role, name, date) {
  return '<td style="border:0;text-align:center;padding:0 8px;">'
    + '<div style="height:44px;"></div><div style="border-top:1px dotted #666;padding-top:4px;">' + esc(name || '(ลงชื่อ)') + '</div>'
    + '<div style="color:#666;">' + role + '</div>'
    + '<div style="color:#666;">' + (date ? 'วันที่ ' + fmtDate(date) : 'วันที่ ____/____/______') + '</div></td>';
}
function renderSignTab(r) {
  var steps = (r.doa && r.doa.steps) || [];
  var done = steps.filter(function(s){ return s.status === 'approved'; }).length;
  var cur = currentSlot(r);
  var canAct = r.status === 'pending' && cur;
  return SECWRAP(SEC('pen-tool', 'สายอนุมัติ (DOA)')
      + '<div class="kv">'
      + '<div class="kv-i"><div class="kv-l">ทะเบียน DOA</div><div class="kv-v"><span class="kbd">' + (r.doa ? r.doa.entry : '—') + '</span></div></div>'
      + '<div class="kv-i"><div class="kv-l">สถานะ</div><div>' + docPill(r.status) + ' <span style="font-size:11.5px;color:var(--c-text-mute);">ขั้น ' + done + '/' + (steps.length || 0) + '</span></div></div>'
      + '<div class="kv-i"><div class="kv-l">ผู้ส่งอนุมัติ</div><div>' + empChip(r.requester, true) + '</div></div>'
      + '<div class="kv-i"><div class="kv-l">ฐานวงเงินที่ใช้ resolve</div><div class="kv-v">฿' + fmtMoney(totals(r).grand) + '</div></div>'
      + '</div>'
      + '<div style="margin-top:10px;">' + renderSignProgress(r) + '</div>'
      + (steps.length ? '' : '<div class="note" style="margin-top:10px;"><i data-lucide="info" class="w-4 h-4"></i><div>ยังไม่ส่งอนุมัติ — สายอนุมัติจะถูก resolve ตามมูลค่าที่คืนตอนกดส่ง</div></div>'))
    + (steps.length ? SECWRAP(SEC('list-checks', 'ลำดับการอนุมัติ')
      + '<div class="tl">'
      + '<div class="tl-i ok"><div class="tl-t">ส่งอนุมัติ</div><div class="tl-s">' + (PEOPLE_BY[r.requester] ? PEOPLE_BY[r.requester].name : '—') + ' · ' + fmtDateTime(r.createdAt) + '</div></div>'
      + steps.map(function(s, i){
          var tone = s.status === 'approved' ? 'ok' : (s.status === 'rejected' ? 'bad' : (s.status === 'sendback' ? 'warn' : ''));
          var label = s.status === 'approved' ? 'อนุมัติแล้ว' : (s.status === 'rejected' ? 'ไม่อนุมัติ' : (s.status === 'sendback' ? 'ส่งกลับแก้' : 'รออนุมัติ'));
          return '<div class="tl-i ' + tone + '"><div class="tl-t">ขั้นที่ ' + s.slot + ' · ' + s.role + ' — ' + label + '</div>'
            + '<div class="tl-s" style="margin-top:4px;">' + empChip(s.person, true) + '</div>'
            + (s.at ? '<div class="tl-s">' + fmtDateTime(s.at) + '</div>' : '')
            + (s.note ? '<div class="tl-q">' + esc(s.note) + '</div>' : '')
            + (canAct && cur === s ? '<div style="display:flex;gap:6px;margin-top:8px;">'
                + '<button class="btn btn-sm btn-danger" type="button" onclick="openModal(\'reject\',\'' + r.id + '\')"><i data-lucide="x-circle" class="w-3.5 h-3.5"></i><span>ไม่อนุมัติ</span></button>'
                + '<button class="btn btn-sm btn-secondary" type="button" onclick="openModal(\'sendback\',\'' + r.id + '\')"><i data-lucide="corner-up-left" class="w-3.5 h-3.5"></i><span>ส่งกลับแก้</span></button>'
                + '<button class="btn btn-sm btn-success" type="button" onclick="openModal(\'approve\',\'' + r.id + '\')"><i data-lucide="check" class="w-3.5 h-3.5"></i><span>อนุมัติ</span></button></div>' : '')
            + '</div>';
        }).join('')
      + '<div class="tl-i ' + (r.status === 'returned' || r.status === 'closed' ? 'ok' : '') + '"><div class="tl-t">ผลลัพธ์</div>'
      + '<div class="tl-s">' + (r.status === 'returned' ? 'อนุมัติครบ · ส่งคืนแล้ว ' + fmtDate(r.returnDate)
          : (r.status === 'closed' ? 'ปิดใบแล้ว · ได้รับเครดิต ' + esc(r.creditDoc)
          : (r.status === 'cancelled' ? 'จบที่การยกเลิก/ไม่อนุมัติ' : 'ยังไม่สิ้นสุด'))) + '</div></div>'
      + '</div>') : '')
    + SECWRAP(SEC('users', 'ผู้เกี่ยวข้องหน้างาน (ไม่ใช่สายอนุมัติ)')
      + '<div class="kv">'
      + '<div class="kv-i"><div class="kv-l">ผู้ขอคืน / ผู้จัดทำ</div><div>' + empChip(r.requester, true) + '</div></div>'
      + kvItem('ผู้ส่งของคืน', r.shipper || '—')
      + kvItem('ผู้รับฝั่งผู้ขาย', r.receiver || '—')
      + '</div>');
}

/* ============================================================
   RENDER + ROUTER + BOOT
   ============================================================ */
function render() {
  var snap = preserveRenderState();
  var r = getRoute();
  document.getElementById('page').innerHTML = renderPage();
  var sb = document.getElementById('sb-count'); if (sb) sb.textContent = RTVS.filter(function(x){ return ['draft','pending','approved','returned'].indexOf(x.status) >= 0; }).length;
  var host = document.getElementById('drawer-host');
  var bd = document.getElementById('drawer-backdrop');
  if (r.name === 'create' || r.name === 'edit') {
    if (!document.getElementById('create-drawer')) {
      if (!createWizard.data || (r.name === 'edit' && createWizard.editId !== r.id)) openCreateDrawer(r.name === 'edit' ? r.id : null, r.from);
      host.innerHTML = '<div class="drawer-panel wide" id="create-drawer"><div id="create-drawer-content" style="display:flex;flex-direction:column;height:100%;"></div></div>';
      host.classList.add('is-open');
      requestAnimationFrame(function(){ bd.classList.add('is-open'); document.getElementById('create-drawer').classList.add('drawer-active'); });
    }
    renderCreateDrawer();
  } else if (r.name === 'view') {
    if (!findRtv(r.id)) { navigate('list'); return; }
    if (!document.getElementById('view-drawer')) {
      host.innerHTML = '<div class="drawer-panel" id="view-drawer"><div id="view-drawer-content" style="display:flex;flex-direction:column;height:100%;"></div></div>';
      host.classList.add('is-open');
      requestAnimationFrame(function(){ bd.classList.add('is-open'); document.getElementById('view-drawer').classList.add('drawer-active'); });
    }
    renderViewDrawer();
  } else {
    host.innerHTML = ''; host.classList.remove('is-open'); bd.classList.remove('is-open');
    createWizard.data = null; createWizard.editId = null;
  }
  renderIcons();
  restoreRenderState(snap);
}
function closeTopOverlay() {
  if (state.modal) { closeModal(); return; }
  var r = getRoute();
  if (r.name === 'view') closeViewDrawer();
  else if (r.name === 'create' || r.name === 'edit') closeCreateDrawer();
}
window.addEventListener('keydown', function(e){
  if (e.key !== 'Escape') return;
  if (document.getElementById('combo-pop')) { comboClosePop(); return; }
  if (document.getElementById('row-menu')) { closeRowMenu(); return; }
  closeTopOverlay();
});
window.addEventListener('hashchange', function(){ state.tab = state.tab || 'detail'; render(); });
document.addEventListener('click', function(e){
  var um = document.getElementById('user-menu');
  if (um && um.classList.contains('is-open') && !um.contains(e.target) && !e.target.closest('.user-chip')) um.classList.remove('is-open');
});
var domReady = false, lucideReady = false;
function bootIfReady() { if (domReady && lucideReady) { render(); renderIcons(); } }
if (document.readyState === 'loading') { window.addEventListener('DOMContentLoaded', function(){ domReady = true; bootIfReady(); }); }
else { domReady = true; }
window.addEventListener('lucide:ready', function(){ lucideReady = true; bootIfReady(); });
if (window.lucide && typeof window.lucide.createIcons === 'function') lucideReady = true;
bootIfReady();
setTimeout(function(){ if (!lucideReady) { lucideReady = true; bootIfReady(); } }, 5000);
</script>
