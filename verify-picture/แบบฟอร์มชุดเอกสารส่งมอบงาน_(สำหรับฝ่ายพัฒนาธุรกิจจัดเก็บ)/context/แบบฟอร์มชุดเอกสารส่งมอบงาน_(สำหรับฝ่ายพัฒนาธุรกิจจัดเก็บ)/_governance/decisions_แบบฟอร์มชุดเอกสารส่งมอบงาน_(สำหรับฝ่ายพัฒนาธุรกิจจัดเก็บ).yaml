# unattended — AI-DEFAULT ทุกหมวด รอลูกค้ายืนยัน
# J007 · FM-BDM-07 แบบฟอร์มชุดเอกสารส่งมอบงาน (สำหรับฝ่ายพัฒนาธุรกิจจัดเก็บ) · REQ-TMP-007 · F-TMP-007

# G1 ผลต่อระบบ — ไม่เปลี่ยนค่า ไม่ส่งต่อ (ชุดเอกสารส่งมอบเก็บที่ฝ่ายพัฒนาธุรกิจ · เอกสารในชุดผู้ใช้กรอกชื่อ/รหัส/ลิงก์เอง · ไม่สร้างเอกสารฝั่งฝ่ายบริหารการลงทุนอัตโนมัติ)
config_changes: []
post_to: []

# G2 สายอนุมัติ — dynamic · ค่าเริ่ม 2 ขั้นตามช่องลงชื่อบนกระดาษ (ผู้ตรวจสอบ → ผู้อนุมัติ/รับทราบ) · ไม่มีวงเงิน
#   ผู้ตรวจสอบ = ผู้จัดการฝ่ายพัฒนาธุรกิจ → role-line-manager
#   ผู้อนุมัติ / รับทราบ = ฝ่ายบริหารการลงทุนเป็นผู้รับมอบ → role-mgr-bu (ไม่มี role ฝ่ายบริหารการลงทุนใน contract — แจ้งในรายงาน)
doa: { required: true, mode: dynamic, default_steps: ["role-line-manager", "role-mgr-bu"], amount: none }

# G3 ค่าคงที่ / กฎ
calc:
  constants_from_config: true
  auto_compute: true
  over_limit: warn
  rules:
    - "สถานะข้อมูล (สมบูรณ์ / มีข้อจำกัด / รอข้อมูลเพิ่มเติม) อ่านจาก HandoverPackageConfig.data_statuses"
    - "สถานะเอกสาร (ครบถ้วน / มีข้อจำกัด / ขาดเอกสาร / ไม่เกี่ยวข้อง) อ่านจาก HandoverPackageConfig.doc_statuses"
    - "ไม่นำ data validation ค้าง 1–5 ที่ C13:C18 มาใช้"
    - "สถานะข้อมูล = สมบูรณ์ ขณะมีรายการเอกสารสถานะ ขาดเอกสาร/มีข้อจำกัด = เตือน ไม่บล็อก"
    - "สถานะข้อมูล = มีข้อจำกัด หรือมีรายการสถานะ มีข้อจำกัด → ต้องกรอก ข้อจำกัดของข้อมูล"
    - "วันที่เอกสาร หลัง วันที่ส่งมอบ = เตือน ไม่บล็อก"
    - "ส่งพิจารณาได้เมื่อมีรายการเอกสารอย่างน้อย 1 รายการที่กรอกชื่อเอกสารและสถานะ"

# G4 รายการซ้ำ — ไม่จำกัด · PDF ขั้นต่ำเท่ากระดาษ (รายการเอกสาร 12 แถว)
repeat: { max_rows: null }

# G5 ช่องตามกระดาษ — 1:1 ไม่เพิ่มช่อง
fidelity: { one_to_one: true, add_fields: [], merge_split: [] }

# G6 ลายเซ็น — แถวล่าง 1 ช่องต่อขั้น DOA · ข้อความ "พิจารณาในระบบ" ไม่ใช้ภาพ
signature: { layout: row-bottom, per_doa_step: true, handwriting_image: false }

# G7 ไม่อนุมัติ → กลับเป็นร่างเลขเดิม · ยกเลิกได้ เจ้าของ + admin role ในสถานะ ร่าง/รออนุมัติ · เหตุผลบังคับ
reject_cancel: { on_reject: back_to_draft, cancel_by: [owner, admin_role], cancel_states: [draft, pending], reason_required: true }

# G8 การมองเห็น — เจ้าของ · ผู้อนุมัติหลังส่ง · admin role ฝ่ายพัฒนาธุรกิจเห็นทั้งหมด
visibility: { owner: true, approver: after_submit, admin_role: all }

# G9 เลขที่ — ออกตอนบันทึกครั้งแรก (เอกสารภายใน) · รหัส HOB (Handover — BD) · HOI สงวนให้ FM-BDM-08
numbering: { issue_on: first_save, code: "HOB" }

# G10 ของเสริม — แนบ ✓ CSV ✓ ทำซ้ำ ✗ ประกาศ ✗
extras: { attachments: true, copy: false, export_csv: true, announce: false }

extend: {}
fit: {}
