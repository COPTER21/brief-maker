# doa-declaration v1.2 — สร้างจาก DECISIONS.lock.json · คำตัดสินเพิ่มเอง (AI-DEFAULT — กระดาษไม่มีคำตัดสิน)
feature_id: F-TMP-007
name: แบบฟอร์มชุดเอกสารส่งมอบงาน (สำหรับฝ่ายพัฒนาธุรกิจจัดเก็บ)
module: bdm
platform: core
doa_type: hob
approval_scope: document_sign
approval_required: true
mode: dynamic
amount: none
dept_mode: merged
on_reject: back_to_draft
cancel_by:
- owner
- admin_role
cancel_states:
- draft
- pending
actions:
- id: submit_hob
  label: ส่งอนุมัติแบบฟอร์มชุดเอกสารส่งมอบงาน (สำหรับฝ่ายพัฒนาธุรกิจจัดเก็บ)
  from_state: draft
matrix:
- amount_from: 0
  amount_to: null
  departments: merged
  chainMode: sequential
  steps:
  - roles:
    - role-line-manager
    label: ผู้ตรวจสอบ
    decision:
      approve: ตรวจสอบแล้ว
      reject: ไม่ผ่านการตรวจสอบ
  - roles:
    - role-mgr-bu
    label: ผู้อนุมัติ / รับทราบ
    decision:
      approve: รับมอบ / รับทราบ
      reject: ไม่รับมอบ
defaults_unconfirmed: true
wire_status: pending
source_decisions:
- DEC-03
- DEC-07
- DEC-08
- DEC-09
- DEC-15
role_notes:
  role-line-manager: บนกระดาษ = ผู้จัดการฝ่ายพัฒนาธุรกิจ (ผู้บังคับบัญชาตรงของผู้จัดทำ)
  role-mgr-bu: บนกระดาษ = ฝ่ายบริหารการลงทุนเป็นผู้รับมอบ — ไม่มี role ฝ่ายบริหารการลงทุนใน
    DOA master → ใช้ role-mgr-bu (หัวหน้าหน่วยธุรกิจ) ชั่วคราว รอลูกค้า/DOA กลางยืนยัน
    · ค่าเริ่มผู้พิจารณา = ผู้รับมอบที่เลือกในเอกสาร (DEC-15)
