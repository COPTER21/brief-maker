/* บันทึก = ENG-DOC-NUM.next('ACL') ออกเลขครั้งแรก (DEC-10) · ผู้ขอ/ตำแหน่ง/ฝ่าย snapshot ลงเอกสาร */
function persist(){
  const f = wf(), me = ME(), t = nowIso();
  let r = S.dw.editId ? findR(S.dw.editId) : null;
  if (!r){
    SEQ += 1;
    r = { id:'R' + SEQ, code:DOC.prefix + '-2569-' + String(SEQ).padStart(4, '0'), status:'draft', emp:S.me, pos:me.pos, dept:me.dept, docDate:TODAY, returned:null,
      chain:resolveDoa(S.me), doa_entry_ref:MOCK_DOA_RESOLVED.doa_entry_ref, attachments:[], audit:[{ act:'สร้างเอกสาร', by:me.name, at:t, tone:'' }], createdBy:me.name, createdAt:t };
    RECS.unshift(r);
  } else r.audit.push({ act:'แก้ไขร่าง', by:me.name, at:t, tone:'' });
  Object.assign(r, { advRef:f.advRef.trim(), advAmt:f.advAmt, lines:f.lines.map(l => Object.assign({}, l)), attachments:f.files.slice(), updatedBy:me.name, updatedAt:t });
  return r;
}
function saveDraft(){ if (S.busy) return; if (!validateMain()){ S.dw.step = 1; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const r = persist(); S.busy = false; closeDrawer(true); setTimeout(() => showToast('บันทึกร่างแล้ว · ' + r.code, 'info'), 300); }, 500); }
function saveAndSubmit(){ if (S.busy) return; if (!validateMain()){ S.dw.step = 1; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const r = persist(); S.busy = false; closeDrawer(true); setTimeout(() => openSubmit(r.id), 300); }, 500); }

/* =====================================================================
   MODALS — ส่งอนุมัติ (DOA slot ต่อขั้น) · อนุมัติ/รับเคลียร์ · ไม่อนุมัติ/ส่งกลับแก้ไข · ยกเลิก · ทิ้งข้อมูล
   ===================================================================== */
function modalShell(icon, tone, title, sub, body, foot){
  return `<div class="modal-header"><div class="modal-header-icon ${tone}"><i data-lucide="${icon}" class="w-4 h-4"></i></div><div><h3 class="modal-title">${title}</h3><p class="modal-subtitle">${sub}</p></div></div>
    ${body ? `<div class="modal-body">${body}</div>` : ''}<div class="modal-footer">${foot}</div>`;
}
const busyLabel = (icon, label) => S.busy ? '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>' : `<i data-lucide="${icon}" class="w-4 h-4"></i><span>${label}</span>`;
function presetChips(list, cur){ return `<div class="chip-row">${list.map(p => `<button type="button" class="chip ${cur === p ? 'is-on' : ''}" onclick="setReasonPreset(this.dataset.v)" data-v="${esc(p)}">${esc(p)}</button>`).join('')}</div>`; }
function renderModal(){
  const m = S.md; if (!m) return '';
  const r = m.id ? findR(m.id) : null;
  if ((m.kind === 'approve' || m.kind === 'reject') && !(r && curStep(r))) return '';   /* ปิดแล้ว (ระหว่าง fade) — สายถูกรีเซ็ต/จบแล้ว */
  if (m.kind === 'submit'){
    return modalShell('send', 'is-primary', 'ส่งเคลียร์เงินทดรองจ่าย?', `${r.code} · ใบเบิก ${esc(r.advRef)} · ใช้จริง ${fmtMoney(totalExp(r))}`,
      `${resolveDoa(r.emp).map((c, i) => `<div class="slot-row"><span class="slot-no num">${c.step}</span><span class="slot-role">${c.role}</span><div class="field ${m.err && !m.slots[i] ? 'is-invalid' : ''}" id="fSlot${i}">${searchSelectHTML('slot' + i, { placeholder:'เลือกผู้พิจารณา' })}<div class="field-error">กรุณาเลือกผู้พิจารณา</div>${i === 0 ? '<div class="slot-help">ค่าเริ่มต้นจากสายอนุมัติและผังองค์กร</div>' : ''}</div></div>`).join('')}
       <div class="drawer-fields mt-3">${kv('เหลือส่งคืน', money(refundOf(r)) + ' บาท')}${kv('เอกสารแนบ', r.attachments.length + ' ไฟล์')}</div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="btnSubmit" onclick="confirmSubmit()" ${S.busy ? 'disabled' : ''}>${busyLabel('send', 'ส่งอนุมัติ')}</button>`);
  }
  if (m.kind === 'approve'){
    const c = curStep(r);
    return modalShell('check-circle-2', 'is-success', `${c.words[0]}ใบเคลียร์นี้?`, `${r.code} · ${esc(empOf(r.emp).name)} · ขั้น ${c.step} ${c.role}`,
      `${clearBlock(r)}
       <div class="field mt-3"><label class="field-label">ความเห็น</label><textarea class="input" name="apNote" rows="2" placeholder="ไม่บังคับ" oninput="S.md.note=this.value">${esc(m.note || '')}</textarea></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-success" id="btnApprove" onclick="confirmApprove()" ${S.busy ? 'disabled' : ''}>${busyLabel('check', c.words[0])}</button>`);
  }
  if (m.kind === 'reject' || m.kind === 'cancel'){
    const rej = m.kind === 'reject', w = rej ? curStep(r).words[1] : 'ยกเลิกเอกสาร';
    return modalShell('x-circle', 'is-danger', rej ? w + '?' : 'ยกเลิกเอกสาร?', `${r.code} · ${esc(empOf(r.emp).name)}${rej ? ' · ใบจะกลับเป็นร่างให้ผู้ขอแก้แล้วส่งใหม่ (เลขเดิม)' : ''}`,
      `${presetChips(rej ? REJECT_PRESETS : CANCEL_PRESETS, m.preset)}
       <div class="field ${m.err ? 'is-invalid' : ''}" id="fReason"><label class="field-label">เหตุผล<span class="req">*</span></label><textarea class="input" name="reason" rows="3" placeholder="${rej ? 'แจ้งผู้ขอว่าต้องแก้อะไร' : 'เหตุผลที่ยกเลิก'}" oninput="S.md.reason=this.value; if(this.value.trim()) document.getElementById('fReason').classList.remove('is-invalid')">${esc(m.reason || '')}</textarea><div class="field-error">กรุณาระบุเหตุผล</div></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">${rej ? 'ยกเลิก' : 'ไม่ยกเลิก'}</button><button class="btn btn-danger" id="btnReason" onclick="confirmReason()" ${S.busy ? 'disabled' : ''}>${busyLabel('x-circle', w)}</button>`);
  }
  if (m.kind === 'discard'){
    return modalShell('alert-triangle', 'is-warning', 'ทิ้งข้อมูลที่กรอกไว้?', 'ข้อมูลในแบบฟอร์มนี้ยังไม่ได้บันทึก', '',
      `<button class="btn btn-ghost" onclick="closeModal()">กลับไปกรอกต่อ</button><button class="btn btn-danger" id="btnDiscard" onclick="closeModal(); closeDrawer(true)">ทิ้งข้อมูล</button>`);
  }
  return '';
}
function openModalCfg(cfg){ S.md = cfg; state.modal.open = true; render(); requestAnimationFrame(() => document.getElementById('modalBackdrop').classList.add('is-open')); }
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('is-open'); state.modal.open = false; setTimeout(() => { if (!state.modal.open) S.md = null; }, 200); }
function modalBackdropClick(){ if (S.md && (S.md.reason || S.md.note)) return; closeModal(); }
function setReasonPreset(v){ S.md.preset = v; S.md.reason = v + (S.md.reason && S.md.reason.indexOf(v) !== 0 ? ' — ' + S.md.reason : ''); S.md.err = false; render(); }
function openSubmit(id){ const r = findR(id); if (!r || r.status !== 'draft') return; openModalCfg({ kind:'submit', id, slots:resolveDoa(r.emp).map(c => c.assignee) }); }
function openApprove(id){ const r = findR(id), c = r && curStep(r);
  /* DEC-04 เหลือคืน > 0 ต้องมีสลิปก่อนการเงินรับเคลียร์ (ขั้น role-finance-officer) */
  if (c && c.role_id === 'role-finance-officer' && refundOf(r) > 0 && !r.attachments.some(y => /สลิป|slip|โอน/i.test(y.name))){ showToast('ยังไม่มีสลิปโอนเงินคืน — ส่งกลับแก้ไขให้ผู้ขอแนบสลิป', 'warning'); return; }
  openModalCfg({ kind:'approve', id, note:'' }); }
function openReject(id){ openModalCfg({ kind:'reject', id, reason:'' }); }
function openCancel(id){ closeRowMenu(); openModalCfg({ kind:'cancel', id, reason:'' }); }
function pushAudit(r, act, note, tone){ const me = ME(), t = nowIso(); r.audit.push({ act, by:me.name, at:t, note:note || '', tone:tone || '' }); r.updatedBy = me.name; r.updatedAt = t; }
/* ENG-NOTIFY (NTF_BRIEF_F-FIN-ACL): acl_cancelled · acl_overspent_approved · acl_refund_due — DOA engine เป็นเจ้าของ doa_pending/doa_result */
function confirmSubmit(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (m.slots.some(x => !x)){ m.err = true; render(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    r.chain = resolveDoa(r.emp).map((c, i) => Object.assign(c, { assignee:m.slots[i], status:i === 0 ? 'pending' : 'waiting' }));   /* BR-DOA-02 resolve ตอนส่งแล้ว freeze */
    r.status = 'pending'; r.submittedAt = nowIso(); r.returned = null; pushAudit(r, 'ส่งอนุมัติ', 'ถึง ' + empOf(m.slots[0]).name);
    S.busy = false; closeModal(); render(); setTimeout(() => showToast('ส่งอนุมัติแล้ว · ' + r.code, 'success'), 220); }, 600);
}
function confirmApprove(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    const c = curStep(r); c.status = 'approved'; c.at = nowIso(); c.note = (m.note || '').trim();
    const next = r.chain.find(x => x.status === 'waiting'); if (next) next.status = 'pending';   /* sequential — ครบทุกขั้นจึงเคลียร์แล้ว */
    r.status = next ? 'pending' : 'approved'; if (!next) r.approvedAt = c.at; pushAudit(r, c.words[0] + ' (ขั้น ' + c.step + ')', c.note, 'ok');
    S.busy = false; closeModal(); render(); setTimeout(() => showToast((next ? c.words[0] + 'แล้ว · ' : 'เคลียร์เรียบร้อย · ') + r.code, 'success'), 220); }, 600);
}
/* DEC-08 ไม่อนุมัติ/ส่งกลับแก้ไข = กลับเป็นร่าง เลขเดิม (สายเดิมเก็บใน audit · resolve ใหม่ตอนส่งครั้งถัดไป) */
function confirmReason(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (!(m.reason || '').trim()){ m.err = true; render(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    const why = m.reason.trim();
    if (m.kind === 'reject'){ const c = curStep(r); r.returned = { by:S.me, at:nowIso(), why, step:c.role }; pushAudit(r, c.words[1] + ' — ส่งกลับเป็นร่าง (ขั้น ' + c.step + ')', why, 'bad'); r.status = 'draft'; r.chain = resolveDoa(r.emp); }
    else { r.status = 'cancelled'; const c = curStep(r); if (c) c.status = 'skipped'; pushAudit(r, 'ยกเลิกเอกสาร', why, 'bad'); }
    const rej = m.kind === 'reject'; S.busy = false; closeModal(); if (rej && !canSee(r) && S.dw) closeDrawer(true); render();
    setTimeout(() => showToast(rej ? 'ส่งกลับเป็นร่างแล้ว · ' + r.code : 'ยกเลิกเอกสารแล้ว · ' + r.code, rej ? 'warning' : 'info'), 220); }, 600);
}

function showDrawer(cfg, fromRoute){

function closeDrawer(force, fromRoute){
