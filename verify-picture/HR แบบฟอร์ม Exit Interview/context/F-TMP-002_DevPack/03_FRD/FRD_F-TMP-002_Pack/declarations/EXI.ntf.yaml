feature_id: F-TMP-002
name: แบบสอบถามบุคลากรที่พ้นจากงาน (Exit Interview)
code: EXI
events:
- id: exi_submitted
  trigger: draft → submitted (ผู้ให้ข้อมูลหรือ HR กดส่งแบบสอบถาม)
  recipients:
  - role-mgr-hr
  template: แบบสอบถามพ้นจากงาน **{doc_no}** ส่งแล้ว — รอ HR รับทราบ
