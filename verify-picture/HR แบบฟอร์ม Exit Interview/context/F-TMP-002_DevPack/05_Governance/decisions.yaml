# unattended — AI-DEFAULT ทุกหมวด รอลูกค้ายืนยัน
# G1 ผลต่อระบบ — แบบสอบถามไม่เปลี่ยนค่าในระบบ ไม่ส่งต่อ (การพ้นสภาพพนักงานทำใน HR·Offboard แยก)
config_changes: []
post_to: []
# G2 — กระดาษไม่มีช่องลงชื่อผู้อนุมัติ (มีแค่ผู้ให้ข้อมูล) → ไม่มีสายอนุมัติ · ส่งแล้ว HR รับทราบ/ปิดใบ
doa: { required: false, mode: dynamic, default_steps: [], amount: none }
calc:
  constants_from_config: true
  auto_compute: true
  over_limit: warn
  rules:
    - "อายุตัว = ปีเต็มจาก Employee.birth_date ถึงวันที่ลาออก/วันสิ้นสุดสัญญา · ไม่มี birth_date → กรอกเอง"
    - "อายุงาน ปี/เดือน = จากวันที่เริ่มปฏิบัติงาน ถึงวันที่ลาออก/วันสิ้นสุดสัญญา · ปรับได้"
    - "ลักษณะพ้นจากงานเลือกได้ 1 อย่าง · ข้อ 5 บังคับเมื่อไม่จ้างต่อ(ครบสัญญาจ้าง) ว่างเมื่อลาออก (บล็อก)"
    - "ส่วนที่ 2 ตอบครบ 26 ข้อ ข้อละ 1 ระดับ ก่อนส่ง (บล็อก)"
    - "ส่วนที่ 3 เลือกอย่างน้อย 1 ปัจจัย · หมายเลขลำดับไม่ซ้ำ เรียง 1..N (บล็อก) · อื่นๆ ต้องระบุ"
    - "HR สร้างใบแทนผู้พ้นจากงานได้ (กรณีสัมภาษณ์/ไม่มีสิทธิ์เข้าระบบแล้ว)"
repeat: { max_rows: null }
fidelity: { one_to_one: true, add_fields: [], merge_split: [] }
signature: { layout: row-bottom, per_doa_step: true, handwriting_image: false }
reject_cancel: { on_reject: draft, cancel_by: [owner, admin_role], cancel_states: [draft, submitted], reason_required: true }
# G8 — มีความเห็นต่อผู้บังคับบัญชา (ข้อ 18–23) → ผู้บังคับบัญชาไม่เห็น · HR เห็นทั้งหมด
visibility: { owner: true, approver: none, admin_role: all, line_manager: none, admin_role_id: role-mgr-hr }
numbering: { issue_on: first_save, code: "EXI" }
extras: { attachments: true, copy: false, export_csv: true, announce: false }
