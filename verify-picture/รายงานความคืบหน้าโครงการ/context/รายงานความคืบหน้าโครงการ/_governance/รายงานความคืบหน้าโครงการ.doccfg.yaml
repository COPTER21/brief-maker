# doccfg-declaration v2.1 — init จาก DECISIONS.lock + print_config · แก้ได้ก่อน brief
feature_id: F-TMP-005
doc_types:
- code: PPR
  name_th: รายงานความคืบหน้าโครงการ
  module: BUDGET
  feature_id: F-TMP-005
  numbering:
    preset: '{PREFIX}-{YYYY}-{run:4}'
    reset: yearly
    scope: global
    no_gap: false
    issue_on: first_save
    frd_ref: 03_LOGIC F-TMP-005-FN-03
  snapshot:
    sent_external: false
    approved_final: true
  snapshot_points:
  - event: approved_final
    frd_ref: 03_LOGIC F-TMP-005-FN-05
  print_config:
    form_code: FM-PDM-02
    revision: 'Rev.00 : 01/07/2569'
    paper: A4-portrait
    min_rows:
      performance: 9
      kpis: 8
      issues: 11
      next_plan: 10
      decisions_needed: 11
    dense_when_rows_over:
      performance: 9
      kpis: 8
      issues: 11
      next_plan: 10
      decisions_needed: 11
    header_source: organization_snapshot_at_numbering
    sign_boxes:
    - box: requester
      label: ผู้จัดทำรายงาน (Prepared by)
      show_date: true
    - box: submitter
      label: ผู้จัดการโครงการ (Project Manager)
      source: project.manager (ผู้ส่งรายงาน)
      show_date: true
    - box: doa_step:*
      label: from_doa_step
      show_decision: true
      show_date: true
    decision_words:
      default:
        approve: อนุมัติ
        reject: ไม่อนุมัติ
      by_role:
        role-line-manager:
          approve: ตรวจสอบแล้ว
          reject: ไม่ผ่านการตรวจสอบ
        role-gm:
          approve: อนุมัติ
          reject: ไม่อนุมัติ
    sign_layout:
      source: ผู้จัดทำ + ผู้จัดการโครงการ (ผู้ส่ง) + approval_chain snapshot (จำนวนขั้นตามที่ตั้งใน
        DOA)
      render: B6 เส้นประ + (ชื่อ) + บทบาท + วันที่ ตามกระดาษ · แถวละ ≤4
      max_per_row: 4
      split: even
      dense_when_steps_over: 4
      keep_together: true
    ref: print/print_config.json
