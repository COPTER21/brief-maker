# unattended — AI-DEFAULT ทุกหมวด รอลูกค้ายืนยัน
# J005 FM-PDM-02 รายงานความคืบหน้าโครงการ · ตอบตาม 4_knowledge/governance/unattended-policy.md · สอดคล้อง J004 (F-TMP-004 แผนโครงการ · PJP)

# G1 ผลต่อระบบ — ไม่เปลี่ยนค่าในระบบ ไม่ส่งต่อ · อ่านแผนโครงการ (PJP) ที่อนุมัติแล้วเพื่อเติมค่าเริ่มเท่านั้น ไม่เขียนกลับ (ไม่อัปเดตสถานะกิจกรรมใน PJP อัตโนมัติ)
config_changes: []
post_to: []

# G2 สายอนุมัติ — dynamic · กระดาษมีช่องลงชื่อ 4 จุด: ผู้จัดทำ · ผู้จัดการโครงการ · ผู้ตรวจสอบ · ผู้อนุมัติ
#   ผู้จัดการโครงการ = ผู้ส่งรายงาน (ไม่ใช่ขั้น DOA เพราะเป็นคนเฉพาะโครงการ ไม่มี role ใน DOA master) → ช่องลงชื่อ "ส่งในระบบ"
#   DOA ค่าเริ่ม 2 ขั้น: ผู้ตรวจสอบ = ผู้บังคับบัญชาตรงของผู้จัดการโครงการ (role-line-manager) → ผู้อนุมัติ = ผู้จัดการทั่วไป (role-gm) — ตรงกับ J004 · ไม่มีวงเงิน
doa: { required: true, mode: dynamic, default_steps: ["role-line-manager", "role-gm"], amount: none }

# G3 ไม่มีสูตร/ค่าคงที่บนกระดาษ — ตรวจตรรกะ: ขัดแย้ง = บล็อก · เกินเกณฑ์/ไม่ครบเชิงแนะนำ = เตือน
calc:
  constants_from_config: true
  auto_compute: true
  over_limit: warn
  rules:
    - "รหัสโครงการ เลือกได้เฉพาะแผนโครงการ (PJP) สถานะอนุมัติแล้ว · ชื่อโครงการ/ผู้จัดการโครงการ ดึงจากแผน (แก้ไม่ได้)"
    - "เลือกโครงการแล้ว เติมค่าเริ่ม: กิจกรรม (จาก PJP actions[]) · ระยะเวลาแผน (วันที่เริ่ม–สิ้นสุด) · งบแผน (รวมงบที่อนุมัติ) · KPI (จาก PJP goals[].kpi) — ผู้ใช้แก้/เพิ่ม/ลบแถวได้"
    - "รอบการรายงาน ถึง ≥ ตั้งแต่ (บล็อก) · วันที่รายงานก่อนวันสิ้นรอบ = เตือน · รอบทับกับรายงานอื่นของโครงการเดียวกันที่ไม่ถูกยกเลิก = เตือน"
    - "% สำเร็จ 0–100 (บล็อก) · งบประมาณ ≥ 0 (บล็อก) · ผลจริงงบเกินแผน = เตือน"
    - "สถานะ ล่าช้า หรือมีปัญหา → ต้องมีปัญหา/อุปสรรค ≥ 1 แถว (บล็อก) และควรมีประเด็นที่ต้องการการตัดสินใจ ≥ 1 แถว (เตือน) · มีความเสี่ยง → ควรมีปัญหา/ความเสี่ยง ≥ 1 แถว (เตือน)"
    - "ส่งได้เมื่อ เลือกสถานะโครงการ · กรอกคำอธิบาย · ผลการดำเนินงาน ≥ 1 แถว · กำหนดแล้วเสร็จไม่ก่อนวันที่รายงาน = เตือน"
    - "ส่งอนุมัติได้เฉพาะ ผู้จัดการโครงการของโครงการนั้น (ผู้จัดทำที่ไม่ใช่ PM บันทึกร่างแล้วให้ PM ส่ง) — PM ส่ง = ลงชื่อช่องผู้จัดการโครงการ"

# G4 รายการซ้ำ — ไม่จำกัด · PDF ขั้นต่ำเท่ากระดาษ (ผลงาน 9 · KPI 8 · ปัญหา 11 · แผนรอบถัดไป 10 · ประเด็นตัดสินใจ 11)
repeat: { max_rows: null }

# G5 1:1 ไม่เพิ่มช่อง · คอลัมน์ 'ผู้รับผิดชอบ / กำหนดแล้วเสร็จ' เก็บ 2 ค่าแสดงรวมช่องเดียว · คงถ้อยคำคำอธิบาย ☐ ตามต้นฉบับ
fidelity: { one_to_one: true, add_fields: [], merge_split: ["owner_due: เก็บ owner + due_date แสดงรวม 1 คอลัมน์"] }

# G6 บล็อกลงชื่อท้ายใบ: ผู้จัดทำ · ผู้จัดการโครงการ (ผู้ส่ง) · 1 ช่องต่อขั้น DOA · ข้อความ "ส่งในระบบ / พิจารณาในระบบ" ไม่ใช้ภาพ
signature: { layout: row-bottom, per_doa_step: true, handwriting_image: false }

# G7 ไม่อนุมัติ/ไม่ผ่านการตรวจสอบ → กลับร่างเลขเดิม · ยกเลิกได้ เจ้าของ + admin role · ร่าง/รออนุมัติ · เหตุผลบังคับ
reject_cancel: { on_reject: back_to_draft, cancel_by: [owner, admin_role], cancel_states: [draft, pending], reason_required: true }

# G8 เจ้าของ(ผู้จัดทำ) + ผู้จัดการโครงการของโครงการนั้น · ผู้อนุมัติหลังส่ง · admin role ฝ่ายพัฒนาโครงการ เห็นทั้งหมด
visibility: { owner: true, project_manager: own_projects, approver: after_submit, admin_role: all }

# G9 ออกเลขตอนบันทึกครั้งแรก · รหัส PPR (Project Progress Report) — ไม่ใช้ PDM (รหัสฝ่ายใช้ร่วม FM-PDM-01/02) · ไม่ชน ACL/RPR/ALN/ACR/PJP
numbering: { issue_on: first_save, code: PPR }

# G10
extras: { attachments: true, copy: false, export_csv: true, announce: false }

extend: {}
fit: {}
