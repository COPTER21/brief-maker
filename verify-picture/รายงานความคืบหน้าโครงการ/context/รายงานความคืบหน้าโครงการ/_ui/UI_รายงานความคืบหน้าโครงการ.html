ng:24px 0; }\n  .doc-page{\n    width:var(--page-w); min-height:var(--page-h);\n    margin:0 auto 24px; padding:var(--page-margin);\n    background:#fff; box-shadow:0 4px 24px rgba(11,29,58,.18);\n  }\n}\n@media print{\n  .doc-page{ width:auto; min-height:var(--content-h); padding:0; box-shadow:none; }\n}\n\n/* ============================================================\n   1. HEADER — thin rule, lighter type\n   ============================================================ */\n.doc-head{\n  display:flex; justify-content:space-between; align-items:flex-start;\n  gap:12mm; padding-top:1.5mm; padding-bottom:6px; border-bottom:1.5px solid var(--c-navy);\n}\n.doc-head__brand{ display:flex; gap:9px; align-items:flex-start; }\n.doc-logo{ width:46px; height:46px; flex:0 0 auto; border-radius:7px; object-fit:contain; }\n.doc-logo--ph{\n  display:flex; align-items:center; justify-content:center;\n  background:linear-gradient(135deg,var(--c-navy),var(--c-teal));\n  color:#fff; font-weight:700; font-size:15pt; letter-spacing:.03em;\n}\n.doc-org__name{ font-size:11.5pt; font-weight:700; color:var(--c-navy); line-height:1.5; }\n.doc-org__line{ font-size:7.8pt; color:var(--c-mute); line-height:1.35; }\n.doc-org__tax{ font-size:7.8pt; color:var(--c-mute-2); margin-top:1px; }\n\n.doc-head__title{ text-align:right; flex:0 0 auto; min-width:54mm; }\n.doc-title{ font-size:15pt; font-weight:700; color:var(--c-navy); line-height:1.45; }\n.doc-title__en{ font-size:7.5pt; font-weight:500; color:var(--c-mute-2); letter-spacing:.08em; text-transform:uppercase; }\n.doc-copy{ display:inline-block; margin-top:3px; padding:0 8px; border:1px solid var(--c-line);\n  border-radius:999px; font-size:7pt; font-weight:500; color:var(--c-mute); }\n\n/* ============================================================\n   2. META STRIP\n   ============================================================ */\n.doc-meta{ display:flex; flex-wrap:wrap; gap:0 22px; margin-top:7px; font-size:8.3pt; }\n.doc-meta__item{ display:flex; gap:5px; padding:1px 0; }\n.doc-meta__k{ color:var(--c-mute-2); }\n.doc-meta__v{ color:var(--c-ink); font-weight:600; }\n\n/* ============================================================\n   3. PARTY BLOCKS — light, no heavy fill\n   ============================================================ */\n.parties{ display:flex; gap:5mm; margin-top:9px; }\n.party{ flex:1; border:1px solid var(--c-line-2); border-radius:6px; padding:6px 9px; }\n.party__label{ font-size:7.2pt; font-weight:600; color:var(--c-primary);\n  text-transform:uppercase; letter-spacing:.06em; margin-bottom:2px; }\n.party__name{ font-size:9.3pt; font-weight:700; color:var(--c-ink); }\n.party__line{ font-size:8pt; color:var(--c-mute); line-height:1.35; }\n\n/* ============================================================\n   4. LINE-ITEM TABLE — minimal thin header, hairline rows, single-line\n   ============================================================ */\n.items{ width:100%; border-collapse:collapse; margin-top:10px; font-size:8.4pt; }\n.items thead th{\n  background:var(--c-navy); color:#fff; font-weight:600; font-size:7.6pt;\n  letter-spacing:.03em; text-align:left; padding:6px 8px;\n}\n.items thead th:first-child{ border-top-left-radius:5px; border-bottom-left-radius:5px; }\n.items thead th:last-child{ border-top-right-radius:5px; border-bottom-right-radius:5px; }\n.items tbody td{\n  padding:5px 8px; border-bottom:1px solid var(--c-line-2);\n  vertical-align:top; color:var(--c-ink); line-height:1.4;\n}\n.items .num{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }\n.items .ctr{ text-align:center; white-space:nowrap; }\n.items .col-no{ width:8mm; text-align:center; color:var(--c-mute-2); }\n.items .col-qty{ width:16mm; } .items .col-unit{ width:14mm; }\n.items .col-price{ width:23mm; } .items .col-amt{ width:25mm; }\n/* secondary detail kept INLINE so a row stays one line */\n.items td .sub{ color:var(--c-mute-2); font-size:7.4pt; }\n.items td .sub::before{ content:\"·\"; margin:0 5px; color:var(--c-mute-3); }\n.items tr{ break-inside:avoid; }\n.items thead{ display:table-header-group; }\n\n/* ============================================================\n   5. TOTALS — rules instead of heavy fill\n   ============================================================ */\n.foot-grid{ display:flex; gap:5mm; margin-top:8px; align-items:flex-start; }\n.foot-left{ flex:1; }\n.totals{ flex:0 0 60mm; }\n.totals__row{ display:flex; justify-content:space-between; gap:10px; padding:2.5px 8px; font-size:8.6pt; }\n.totals__row .k{ color:var(--c-mute); }\n.totals__row .v{ font-weight:600; font-variant-numeric:tabular-nums; }\n.totals__row--rule{ border-top:1px solid var(--c-line-2); }\n.totals__grand{\n  margin-top:4px; padding:6px 10px; border-radius:6px; background:var(--c-navy);\n  display:flex; justify-content:space-between; align-items:baseline;\n}\n.totals__grand .k{ font-size:8.8pt; font-weight:600; color:#fff; }\n.totals__grand .v{ font-size:11.5pt; font-weight:700; color:#fff; font-variant-numeric:tabular-nums; }\n/* amount-in-words — full width, larger, clear */\n.baht-text{ margin-top:7px; padding:6px 11px; border:1px dashed var(--c-line);\n  border-radius:6px; display:flex; justify-content:space-between; align-items:baseline; gap:12px; }\n.baht-text__k{ font-size:8pt; color:var(--c-mute-2); white-space:nowrap; }\n.baht-text b{ font-size:9.6pt; color:var(--c-navy); font-weight:700; text-align:right; }\n\n/* ============================================================\n   6. NOTES / TERMS\n   ============================================================ */\n.notes{ border:1px solid var(--c-line-2); border-radius:6px; padding:6px 9px;\n  font-size:8pt; color:var(--c-mute); }\n.notes__title{ font-size:7.2pt; font-weight:600; color:var(--c-mute-2);\n  text-transform:uppercase; letter-spacing:.05em; margin-bottom:3px; }\n.notes ol,.notes ul{ margin-left:15px; }\n.notes li{ margin:1px 0; }\n\n/* ============================================================\n   7. SIGNATURE BLOCK — sits inside .doc-bottom (above footer)\n   ============================================================ */\n.signs{ display:flex; gap:5mm; margin-top:14px; break-inside:avoid; }\n.sign{ flex:1; text-align:center; }\n.sign__line{ height:30px; border-bottom:1px solid var(--c-mute-3); margin:0 5mm; }\n.sign__paren{ font-size:8pt; color:var(--c-mute-2); margin-top:4px; }\n.sign__role{ font-size:8.4pt; font-weight:600; color:var(--c-ink); margin-top:1px; }\n.sign__name{ font-size:7.8pt; color:var(--c-mute); }\n.sign__date{ font-size:7.6pt; color:var(--c-mute-2); margin-top:1px; }\n\n/* ============================================================\n   8. OFFICIAL THAI LETTER / MEMO (ระเบียบงานสารบรรณ) — logo-left head\n   ============================================================ */\n.letter{ margin-top:8px; font-size:10pt; line-height:1.6; color:var(--c-ink); }\n\n/* ที่ (เลขหนังสือ) ซ้าย + ส่วนราชการ/ที่อยู่ ขวา */\n.letter__refrow{ display:flex; justify-content:space-between; align-items:flex-start; gap:14mm; margin-top:6px; }\n.letter__ref{ font-size:10pt; }\n.letter__agency{ text-align:right; font-size:9.2pt; color:var(--c-mute); line-height:1.4; }\n\n/* วันที่ — จัดกึ่งกลาง ไม่มีคำว่า \"วันที่\" นำ (ตามแบบราชการ) */\n.letter__date{ text-align:center; margin:10px 0 12px; font-size:10pt; }\n\n/* ฟิลด์หัวเรื่อง เรื่อง/เรียน/อ้างถึง/สิ่งที่ส่งมาด้วย — hanging indent */\n.letter__field{ display:flex; gap:10px; margin:3px 0; }\n.letter__field .lbl{ flex:0 0 auto; }\n.letter__field .val{ flex:1; text-align:justify; }\n.letter__field .val b,.letter__subject{ font-weight:700; }\n\n/* เนื้อหา — ย่อหน้าเยื้องบรรทัดแรก, จัดเต็มแนว */\n.letter__body{ margin-top:6px; }\n.letter__body p,.letter p{ margin:7px 0; text-indent:3.5em; text-align:justify; }\n\n/* คำลงท้าย + ลายเซ็น — กล่องชิดขวา */\n.letter__close{ margin-top:16px; margin-left:auto; width:72mm; text-align:center; }\n.letter__close .sp{ height:42px; }\n.letter__close .nm{ font-weight:600; }\n.letter__close .pos{ color:var(--c-mute); }\n\n/* เจ้าของเรื่อง (ส่วนราชการเจ้าของเรื่อง) — ล่างซ้าย ตัวเล็ก */\n.letter__owner{ font-size:8.6pt; color:var(--c-ink); line-height:1.45; }\n\n/* ============================================================\n   9. PAGE FOOTER — pinned bottom via .doc-bottom\n   ============================================================ */\n.doc-footer{ margin-top:8px; padding-top:5px; border-top:1px solid var(--c-line-2);\n  display:flex; justify-content:space-between; font-size:7.4pt; color:var(--c-mute-2); }\n\n/* ============================================================\n   UTILITIES\n   ============================================================ */\n.muted{ color:var(--c-mute); }\n.right{ text-align:right; } .center{ text-align:center; } .nowrap{ white-space:nowrap; }\n.mt-0{ margin-top:0 } .mt-8{ margin-top:8px } .mt-12{ margin-top:12px } .mt-16{ margin-top:16px }\n.tag{ display:inline-block; padding:0 7px; border-radius:999px; font-size:7.4pt; font-weight:600; }\n.tag--info{ background:#DBEAFE; color:#1E40AF; }\n.tag--ok{ background:#D1FAE5; color:#065F46; }\n.tag--warn{ background:#FEF3C7; color:#92400E; }\n.tag--danger{ background:#FEE2E2; color:#DC2626; }\n\n/* ============================================================\n   FORM REPLICA (mode=replica) — ขึ้น \"แบบฟอร์มของลูกค้า\" เป็นเอกสารระบบ\n   ใช้คู่ base.css (ใส่ให้อัตโนมัติเมื่อ build_html.py --mode replica)\n   ทุกค่าเป็น style token ปรับต่อลูกค้าได้ผ่าน --profile (profiles/*.json)\n   ห้ามเขียนค่าตายตัวใน body — ปรับที่ profile เท่านั้น\n   ============================================================ */\n:root{\n  --form-fs:9.6pt; --form-lh:1.6;\n  --form-ink:#111111; --form-mute:#6B6B6B; --form-dot:#9A9CA2;\n  --form-title-fs:14pt; --form-title-gap:16px;\n  --form-logo-h:15mm; --form-logo-maxw:70mm; --form-logo-align:center;\n  --form-row-gap:8px; --form-row-gap-dense:5px;\n  --form-indent:12mm; --form-para-gap:24px; --form-para-gap-dense:14px;\n  --form-fill-pad:6px; --form-fill-s:15mm; --form-fill-m:30mm; --form-fill-l:60mm;\n  --form-date-w:52mm; --form-num-w:6mm; --form-cb-fs:12pt;\n  --form-grid-line:#111111; --form-grid-head-bg:#E6E6E6; --form-grid-pad:4px; --form-grid-row-h:6.2mm; --form-grid-row-h-dense:5mm; --form-grid-gap:0px;\n}\n.form{ font-size:var(--form-fs); line-height:var(--form-lh); color:var(--form-ink); }\n.form-brand{ display:flex; justify-content:var(--form-logo-align); }\n.form-logo{ height:var(--form-logo-h); width:auto; max-width:var(--form-logo-maxw); object-fit:contain; }\n.form-title{ text-align:center; font-size:var(--form-title-fs); font-weight:700; line-height:1.45; margin-top:var(--form-title-gap); }\n.form-date{ display:flex; justify-content:flex-end; margin-top:var(--form-title-gap); }\n.form-date .fill{ flex:0 0 var(--form-date-w); }\n.form-row{ display:flex; align-items:baseline; gap:6px; margin-top:var(--form-row-gap); }\n.form-row--indent{ padding-left:var(--form-indent); margin-top:calc(var(--form-row-gap) * 3); }\n.form-row .fill{ flex:1 1 0; }\n.form-row .fill--s{ flex:0 0 var(--form-fill-s); } .form-row .fill--m{ flex:0 0 var(--form-fill-m); } .form-row .fill--l{ flex:0 0 var(--form-fill-l); }\n.fill{ display:inline-block; min-height:1.45em; padding:0 var(--form-fill-pad); border-bottom:1px dotted var(--form-dot); font-weight:500; color:var(--form-ink); text-align:center; }\n.fill--left{ text-align:left; }\n.fill--s, .fill--m{ white-space:nowrap; }\n.fill .sub{ font-size:7.6pt; font-weight:400; color:var(--form-mute); }\n.form-num{ flex:0 0 var(--form-num-w); }\n.form-p{ margin-top:var(--form-para-gap); padding-left:var(--form-indent); }\n.form-check{ display:flex; align-items:baseline; gap:6px; margin-top:calc(var(--form-row-gap) * 2); }\n.form-check__lbl{ flex:0 0 auto; white-space:nowrap; }\n.form-check__opts{ flex:1; }\n.form-check__opt{ display:flex; align-items:baseline; gap:6px; margin-bottom:5px; }\n.form-check--inline .form-check__opts{ display:flex; flex-wrap:wrap; gap:4px 18px; }\n.cb{ font-size:var(--form-cb-fs); line-height:1; }\n.form-check .fill--s{ min-width:10mm; } .form-check .fill--m{ min-width:22mm; }\n.form-box{ margin-top:var(--form-row-gap); padding:6px 8px; border:1px solid var(--form-dot); min-height:18mm; }\n.form-section{ margin-top:var(--form-para-gap); font-weight:700; }\n/* รายการซ้ำยาว (> min_rows) → ระยะกระชับให้จบหน้าเดียวได้นานที่สุด (data.layout.dense) */\n.form.form--dense .form-row{ margin-top:var(--form-row-gap-dense); }\n.form.form--dense .form-row--indent{ margin-top:calc(var(--form-row-gap-dense) * 3); }\n.form.form--dense .form-check{ margin-top:calc(var(--form-row-gap-dense) * 2); }\n.form.form--dense .form-p{ margin-top:var(--form-para-gap-dense); }\n\n/* R9 · ตารางกรอบ (grid form) — ฟอร์มที่กระดาษเป็นตารางเส้นทึบ (เช่น FM-FIN-02) · v2.1 */\n.form-grid{ width:100%; border-collapse:collapse; table-layout:fixed; margin-top:var(--form-grid-gap); }\n.form-grid + .form-grid{ border-top:0; }\n.form-grid td, .form-grid th{ border:1px solid var(--form-grid-line); padding:2px var(--form-grid-pad); height:var(--form-grid-row-h); vertical-align:middle; text-align:left; font-weight:400; overflow:hidden; }\n.form-grid th{ background:var(--form-grid-head-bg); font-weight:700; text-align:center; }\n.form-grid .g-b{ font-weight:700; } .form-grid .g-r{ text-align:right; } .form-grid .g-c{ text-align:center; }\n.form-grid .g-v{ font-weight:500; } .form-grid .g-num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:500; }\n.form-grid .g-25{ width:25%; } .form-grid .g-50{ width:50%; } .form-grid .g-75{ width:75%; }\n.form-grid .g-tall{ height:calc(var(--form-grid-row-h) * 1.5); }\n.form-grid .g-u{ text-decoration:underline; font-weight:700; }\n.form.form--dense .form-grid td{ height:var(--form-grid-row-h-dense); }\n.form-note{ margin-top:var(--form-row-gap); } .form-note .b{ font-weight:700; }\n.form-grid--signs td{ text-align:center; vertical-align:top; }\n.form-grid td.g-blank{ border-top:0; border-left:0; }\n.form-grid tr.g-hrow td{ height:calc(var(--form-grid-row-h) * 1.4); }\n\n/* B6 rows · ช่องลงชื่อ dynamic ตาม DOA (v2.1) — data ส่ง sign_rows[].signs[] แถวละ ≤4 (sign_rows.py / tplSignRows)\n   ห่อด้วย .signs-block ทุกครั้ง = ทั้งก้อนไม่ถูกตัดข้ามหน้า · .doc-bottom.is-dense เมื่อขั้น DOA > 4 */\n.form-grid--signs + .form-grid--signs{ margin-top:0; border-top:0; }\n.form-grid--signs + .form-grid--signs td{ border-top:0; }\n.doc-bottom.is-dense .sign__line{ height:16px; }\n.doc-bottom.is-dense .form-grid--signs td{ padding-top:1px; padding-bottom:1px; }\n.doc-bottom.is-dense .sign__date, .doc-bottom.is-dense .sign__name{ font-size:7.2pt; }\n.signs-block{ break-inside:avoid; page-break-inside:avoid; }\n.signs-block .signs + .signs{ margin-top:4mm; }\n.doc-bottom.is-dense .signs-block .signs + .signs{ margin-top:2mm; }\n\n/* ===== R10 · เอกสารเกิน 1 หน้า (v2.2) — ออกแบบเป็น 2 หน้าแทนการบีบ ===== */\n.page-break{ break-before:page; page-break-before:always; }          /* ขึ้นหน้าใหม่ตรงจุดที่ตั้งใจ (ก่อนส่วนที่ 2 / ก่อนบล็อกลงชื่อ) */\n.keep-together{ break-inside:avoid; page-break-inside:avoid; }       /* กล่อง/ตารางย่อยไม่ถูกตัดกลาง */\n.form-grid thead, .items thead{ display:table-header-group; }        /* หัวตารางซ้ำทุกหน้า */\n.form-grid tr, .items tr{ break-inside:avoid; page-break-inside:avoid; }\n.cont-note{ text-align:right; font-size:7.5pt; color:var(--form-ink,#333); margin-top:2mm; }   /* \"มีต่อหน้าถัดไป\" ท้ายหน้า 1 */\n.page-no{ text-align:right; font-size:7.5pt; }                        /* \"หน้า 1/2\" ใน footer ทุกหน้า */\n\n:root{--form-fs:8.6pt; --form-lh:1.3; --form-title-fs:12pt; --form-title-gap:2px; --form-logo-h:8mm; --form-logo-align:center; --form-grid-row-h:4.8mm; --form-grid-row-h-dense:4.3mm; --form-grid-head-bg:#F2F2F2; --form-grid-gap:0px; --form-para-gap:5px; --form-para-gap-dense:3px; --form-row-gap:3px; --form-row-gap-dense:2px; --form-cb-fs:10pt;}\n";

/* ---------- wizard actions (soft update = ไม่ rebuild · focus ไม่หลุด) ---------- */

function softSum(){

function setFv(k, v, rerender){

  if (k === 'from' && v && f.to && f.to < v) f.to = v;   /* วันสิ้นรอบไม่ก่อนวันเริ่มรอบ */

function setRow(g, i, k, v, soft){
  const x = wf()[g][i]; if (!x) return;
  x[k] = v; dirty();
  const e = S.dw.err && S.dw.err.rows && S.dw.err.rows[g] && S.dw.err.rows[g][i]; if (e) delete e[k];
  if (soft){ const el = document.querySelector(`[name="${g}-${k}-${i}"]`); if (el && v !== '') el.classList.remove('is-bad'); softSum(); return; }

function removeRow(g, i){ const f = wf(); if (f[g].length <= GRP[g].min) return; f[g].splice(i, 1); if (S.dw.err){ S.dw.err.rows = {}; S.dw.err.msg = {}; } dirty(); render(); }
/* FORM_SPEC required + G3: ช่องบังคับ · รอบ ถึง ≥ ตั้งแต่ · % 0–100 · งบ ≥ 0 · ผลงาน ≥ 1 · ล่าช้าฯ ต้องมีปัญหา ≥ 1 (บล็อก) · ที่เหลือเตือนในหน้าตรวจสอบ */
function validateMain(){
  const f = wf(), err = { f:{}, rows:{}, msg:{}, grp:{} };
  Object.keys(REQ_F).forEach(k => { if (!String(f[k] == null ? '' : f[k]).trim()) err.f[k] = 1; });
  if (f.from && f.to && f.to < f.from) err.f.to = 1;
  ['budPlan', 'budActual'].forEach(k => { if (f[k] !== '' && !(Number(f[k]) >= 0)) err.f[k] = 1; });
  Object.keys(GRP).forEach(g => {
    const G0 = GRP[g], live = f[g].filter(x => !isBlankRow(g, x));
    if (live.length < G0.min) err.grp[g] = `ต้องมี${G0.label} อย่างน้อย ${G0.min} รายการ`;
    f[g].forEach((x, i) => {
      if (isBlankRow(g, x)) return;
      const bad = {}, miss = G0.req.filter(k => x[k] === '' || x[k] == null);
      miss.forEach(k => { bad[k] = 1; });
      let msg = miss.length ? 'กรอกให้ครบทุกช่องในแถวนี้' : '';
      if (g === 'perf' && x.pct !== '' && !(Number(x.pct) >= 0 && Number(x.pct) <= 100)){ bad.pct = 1; msg = msg || '% สำเร็จต้องอยู่ระหว่าง 0–100'; }
      if (Object.keys(bad).length){ (err.rows[g] = err.rows[g] || {})[i] = bad; (err.msg[g] = err.msg[g] || {})[i] = msg; }
    });
  });
  if (f.overall === 'delayed' && !f.issues.some(x => !isBlankRow('issues', x))) err.grp.issues = 'สถานะ ล่าช้า หรือมีปัญหา ต้องระบุปัญหา อุปสรรค และความเสี่ยงอย่างน้อย 1 รายการ';
  const ok = !Object.keys(err.f).length && !Object.keys(err.rows).length && !Object.keys(err.grp).length;
  S.dw.err = ok ? null : err; return ok;
}

    schedPlan:f.schedPlan.trim(), schedActual:f.schedActual.trim(), schedStatus:f.schedStatus.trim(), budPlan:Number(f.budPlan) || 0, budActual:Number(f.budActual) || 0, budStatus:f.budStatus.trim(),

/* ENG-NOTIFY ppr_draft_for_pm — ผู้จัดทำที่ไม่ใช่ PM แจ้งผู้จัดการโครงการให้ตรวจและส่ง */
function notifyPm(id){
  const r = findR(id); if (!r || r.status !== 'draft') return;

}

function modalShell(icon, tone, title, sub, body, foot){
  return `<div class="modal-header"><div class="modal-header-icon ${tone}"><i data-lucide="${icon}" class="w-4 h-4"></i></div><div><h3 class="modal-title">${title}</h3><p class="modal-subtitle">${sub}</p></div></div>
    ${body ? `<div class="modal-body">${body}</div>` : ''}<div class="modal-footer">${foot}</div>`;
}
const busyLabel = (icon, label) => S.busy ? '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>' : `<i data-lucide="${icon}" class="w-4 h-4"></i><span>${label}</span>`;
function presetChips(list, cur){ return `<div class="chip-row">${list.map(p => `<button type="button" class="chip ${cur === p ? 'is-on' : ''}" onclick="setReasonPreset(this.dataset.v)" data-v="${esc(p)}">${esc(p)}</button>`).join('')}</div>`; }

    return modalShell('send', 'is-primary', 'ส่งอนุมัติ?', `${r.code} · ${esc(projOf(r.project).code)} · รอบ ${periodText(r)} · ในฐานะผู้จัดการโครงการ`,
      `${resolveDoa(pmOf(r)).map((c, i) => `<div class="slot-row"><span class="slot-no num">${c.step}</span><span class="slot-role">${esc(c.role)}</span><div class="field ${m.err && !m.slots[i] ? 'is-invalid' : ''}" id="fSlot${i}">${searchSelectHTML('slot' + i, { placeholder:'เลือกผู้พิจารณา' })}<div class="field-error">กรุณาเลือกผู้พิจารณา</div>${i === 0 ? '<div class="slot-help">ค่าเริ่มต้นจาก DOA และผังองค์กรของผู้จัดการโครงการ</div>' : ''}</div></div>`).join('')}
       <div class="drawer-fields mt-3">${kv('สถานะโครงการ', ovPill(r.overall))}${kv('ผลการดำเนินงาน', r.perf.length + ' กิจกรรม · เฉลี่ย ' + (avgPct(r) == null ? '—' : avgPct(r) + '%'))}</div>
       ${r.overall === 'delayed' ? '<div class="alert-row is-warning mt-3"><i data-lucide="bell-ring" class="w-4 h-4"></i><div>สถานะ ล่าช้า หรือมีปัญหา — ระบบแจ้งผู้จัดการทั่วไปทันทีเมื่อส่ง</div></div>' : ''}
       ${w.length ? `<div class="alert-row is-warning mt-3"><i data-lucide="alert-triangle" class="w-4 h-4"></i><div>${w.map(esc).join(' · ')}</div></div>` : ''}`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="btnSubmit" onclick="confirmSubmit()" ${S.busy ? 'disabled' : ''}>${busyLabel('send', 'ส่งอนุมัติ')}</button>`);
  }
  if (m.kind === 'approve'){
    const c = curStep(r), w = wordsOf((c || r.chain[0] || {}).role_id);
    return modalShell('check-circle-2', 'is-success', `${w[0]}รายงานนี้?`, `${r.code} · ${esc(projOf(r.project).name)} · ขั้น ${c ? c.step : ''} ${esc(c ? c.role : '')}`,
      `<div class="drawer-fields">${kv('สถานะโครงการ', ovPill(r.overall))}${kv('รอบการรายงาน', periodText(r))}${kv('ประเด็นที่ต้องการการตัดสินใจ', r.decs.length + ' เรื่อง')}${kv('ปัญหา / ความเสี่ยง', r.issues.length + ' รายการ')}</div>
       <div class="field mt-3"><label class="field-label">ความเห็น / ข้อสั่งการ</label><textarea class="input" name="apNote" rows="2" placeholder="ไม่บังคับ เช่น ผลการตัดสินใจต่อประเด็นที่เสนอ" oninput="S.md.note=this.value">${esc(m.note || '')}</textarea></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-success" id="btnApprove" onclick="confirmApprove()" ${S.busy ? 'disabled' : ''}>${busyLabel('check', w[0])}</button>`);
  }
  if (m.kind === 'reject' || m.kind === 'cancel'){
    const rej = m.kind === 'reject', w = rej ? wordsOf((curStep(r) || r.chain[0] || {}).role_id) : null;
    return modalShell('x-circle', 'is-danger', rej ? `${w[1]}?` : 'ยกเลิกเอกสาร?', `${r.code} · ${esc(projOf(r.project).name)}${rej ? ' · เอกสารจะกลับเป็นร่างให้แก้แล้วส่งใหม่' : ''}`,
      `${presetChips(rej ? REJECT_PRESETS : CANCEL_PRESETS, m.preset)}
       <div class="field ${m.err ? 'is-invalid' : ''}" id="fReason"><label class="field-label">เหตุผล<span class="req">*</span></label><textarea class="input" name="reason" rows="3" placeholder="${rej ? 'แจ้งผู้จัดทำว่าเพราะอะไร' : 'เหตุผลที่ยกเลิก'}" oninput="S.md.reason=this.value; if(this.value.trim()) document.getElementById('fReason').classList.remove('is-invalid')">${esc(m.reason || '')}</textarea><div class="field-error">กรุณาระบุเหตุผล</div></div>`,

  }
  if (m.kind === 'discard'){
    return modalShell('alert-triangle', 'is-warning', 'ทิ้งข้อมูลที่กรอกไว้?', 'ข้อมูลในแบบฟอร์มนี้ยังไม่ได้บันทึก', '',
      `<button class="btn btn-ghost" onclick="closeModal()">กลับไปกรอกต่อ</button><button class="btn btn-danger" id="btnDiscard" onclick="closeModal(); closeDrawer(true)">ทิ้งข้อมูล</button>`);

}

function openSubmit(id){ const r = findR(id); if (!r || r.status !== 'draft') return; if (!canSubmit(r)) { showToast('ส่งอนุมัติได้เฉพาะผู้จัดการโครงการ', 'warning'); return; } openModalCfg({ kind:'submit', id, slots:resolveDoa(pmOf(r)).map(c => c.assignee) }); }

function pushAudit(r, act, note, tone){ const me = ME(), t = nowIso(); r.audit.push({ act, by:me.name, at:t, note:note || '', tone:tone || '' }); r.updatedBy = me.name; r.updatedAt = t; }
/* ENG-NOTIFY (NTF_BRIEF_F-TMP-005): ppr_cancelled · ppr_draft_for_pm · ppr_urgent_decision — DOA engine เป็นเจ้าของ doa_pending/doa_result */
function confirmSubmit(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (m.slots.some(x => !x)){ m.err = true; render(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    r.chain = resolveDoa(pmOf(r)).map((c, i) => Object.assign(c, { assignee:m.slots[i], status:i === 0 ? 'pending' : 'waiting' }));   /* BR-DOA-02 resolve ตอนส่งแล้ว freeze */
    r.status = 'pending'; r.submittedAt = nowIso(); r.submittedBy = S.me; pushAudit(r, 'ส่งอนุมัติ', 'ถึง ' + empOf(m.slots[0]).name);
    const urgent = r.overall === 'delayed';   /* ppr_urgent_decision */
    S.busy = false; closeModal(); render(); setTimeout(() => showToast('ส่งอนุมัติแล้ว · ' + r.code + (urgent ? ' · แจ้งผู้จัดการทั่วไปเรื่องต้องการการตัดสินใจเร่งด่วนแล้ว' : ''), 'success'), 220); }, 600);
}
/* อนุมัติครบ: ไม่เปลี่ยนค่าในระบบ ไม่ส่งต่อ ไม่เขียนกลับแผนโครงการ (G1) */
function confirmApprove(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  const c = curStep(r);
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    const w = wordsOf(c.role_id); c.status = 'approved'; c.at = nowIso(); c.note = (m.note || '').trim();
    const next = r.chain.find(x => x.status === 'waiting'); if (next) next.status = 'pending';   /* sequential */
    r.status = next ? 'pending' : 'approved'; pushAudit(r, w[0] + ' (ขั้น ' + c.step + ')', c.note, 'ok');
    S.busy = false; closeModal(); render(); setTimeout(() => showToast((next ? 'บันทึกผลขั้น ' + c.step : 'อนุมัติรายงานแล้ว') + ' · ' + r.code, 'success'), 220); }, 600);
}
/* G7: ไม่อนุมัติ = กลับเป็นร่างเลขเดิม (สายอนุมัติ resolve ใหม่ตอนส่งครั้งถัดไป) · ยกเลิก = ปิดใบ */
function confirmReason(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (!(m.reason || '').trim()){ m.err = true; render(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    const why = m.reason.trim();
    if (m.kind === 'reject'){ const me = ME(), w = wordsOf(curStep(r).role_id); r.lastReject = { by:me.name, at:nowIso(), reason:why }; r.status = 'draft'; r.submittedAt = null; r.submittedBy = null; r.chain = resolveDoa(pmOf(r)); pushAudit(r, w[1] + ' · กลับเป็นร่าง', why, 'bad'); }
    else { r.status = 'cancelled'; const c = curStep(r); if (c) c.status = 'skipped'; pushAudit(r, 'ยกเลิกเอกสาร', why, 'bad'); }   /* ENG-NOTIFY ppr_cancelled */
    S.busy = false; closeModal();
    if (m.kind === 'reject' && S.dw && !canSee(r)) closeDrawer(true);
    render(); setTimeout(() => showToast(m.kind === 'reject' ? 'ส่งกลับเป็นร่างแล้ว · ' + r.code : 'ยกเลิกเอกสารแล้ว · ' + r.code, m.kind === 'reject' ? 'warning' : 'info'), 220); }, 600);
}

  if (!S.booted){ S.booted = true; applyRoute(); }
  document.getElementById('page-content').innerHTML = renderPage();
  const dwEl = document.getElementById('drawer');
  if (S.dw){ const open = dwEl.classList.contains('is-open'); dwEl.className = S.dw.kind === 'wiz' ? 'drawer drawer-panel wide' : 'drawer drawer-panel'; dwEl.classList.toggle('is-open', open); dwEl.innerHTML = S.dw.kind === 'wiz' ? renderWizard() : renderViewDrawer(); }
  if (S.md){ const mEl = document.getElementById('modal'); mEl.className = 'modal' + (['submit', 'approve'].includes(S.md.kind) ? ' is-lg' : ''); mEl.innerHTML = renderModal(); }
  updateShell(); initSelects(); renderIcons(); restoreRenderState(snap);
}

  if (S.dw && S.dw.kind === 'wiz' && S.dw.step === 1){
    const f = wf();

/* G10 ส่งออก CSV — 1 แถวต่อกิจกรรมในผลการดำเนินงาน พร้อมหัวรายงาน */
function exportCSV(){
  const rows = listRows(), head = ['เลขที่', 'รหัสโครงการ', 'ชื่อโครงการ', 'ผู้จัดการโครงการ', 'รอบตั้งแต่', 'รอบถึง', 'วันที่รายงาน', 'สถานะโครงการ', 'งบแผน', 'งบผลจริง', 'สถานะเอกสาร', 'ลำดับ', 'กิจกรรม', 'แผนงาน', 'ผลงานจริง', '% สำเร็จ'];
  const out = []; rows.forEach(r => { const p = projOf(r.project); (r.perf.length ? r.perf : [{}]).forEach((a, i) => out.push([r.code, p.code, p.name, empOf(p.pm).name, r.from, r.to, r.reportDate, r.overall ? OVERALL[r.overall][0] : '', r.budPlan, r.budActual, DOC_ST[r.status][0], a.activity ? i + 1 : '', a.activity || '', a.plan || '', a.actual || '', a.pct || ''])); });
  const csv = '\ufeff' + [head].concat(out).map(a => a.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(',')).join('\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv;charset=utf-8' })); a.download = 'project-progress-reports.csv'; a.click();
  showToast('ส่งออก ' + rows.length + ' เอกสาร', 'success');
}

/* ---------- ไฟล์แนบ (file_policy เดียวกับ Document Center · G10) ---------- */
const FILE_ACCEPT = '.pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg', FILE_RE = /\.(pdf|docx?|xlsx?|png|jpe?g)$/i, FILE_MAX_MB = 20;
const fmtSize = b => b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
function gateFiles(list){
