# unattended — AI-DEFAULT ทุกหมวด รอลูกค้ายืนยัน
# G1 ผลต่อระบบ — บันทึกคำถาม/คำตอบ/ประเด็นคงค้าง ไม่เปลี่ยนค่าในระบบ ไม่ส่งต่อ · ชื่อโครงการกรอกเอง (FM-IVM-01 ยังไม่ลิงก์) · ยกระดับ = ใส่เลขอ้างอิงบันทึกยกระดับ (FM-IVM-09) ในหมายเหตุเอง
config_changes: []
post_to: []

# G2 สายอนุมัติ — dynamic · 2 ขั้นตามช่องลงชื่อบนกระดาษ (ผู้ตรวจสอบ → ผู้อนุมัติ/รับทราบ) · ไม่มีวงเงินบนกระดาษ
doa: { required: true, mode: dynamic, default_steps: ["role-line-manager", "role-gm"], step_labels: ["ผู้ตรวจสอบ", "ผู้อนุมัติ / รับทราบ"], amount: none }

# G3 กติกาตรวจ — ไม่มีสูตร/ค่าคงที่บนกระดาษ · เลขที่คำถาม/รหัสรายการรันอัตโนมัติ · เลยกำหนดเตือนไม่บล็อก
calc:
  constants_from_config: true
  auto_compute: true
  over_limit: warn
  rules:
    - "เลขที่คำถาม (Q-001…) และรหัสรายการ (OI-001…) ระบบรันต่อใบอัตโนมัติ เรียงตามลำดับแถว"
    - "สถานะคำถาม ตอบแล้ว หรือ ปิด → ต้องกรอกคำตอบ (บล็อก)"
    - "กำหนดตอบต้องไม่ก่อนวันที่ถาม · กำหนดเสร็จต้องไม่ก่อนวันที่เปิด (บล็อก)"
    - "ต้องยกระดับ = ใช่ → ต้องกรอกหมายเหตุ (เหตุผล/เลขที่บันทึกยกระดับ) (บล็อก)"
    - "เลยกำหนดตอบ/กำหนดเสร็จ และสถานะยังไม่ปิด → แสดงเตือน ไม่บล็อก"
    - "ต้องมีคำถามอย่างน้อย 1 แถว หรือประเด็นคงค้างอย่างน้อย 1 แถวก่อนส่ง (บล็อกตอนส่ง)"

# G4 รายการซ้ำ — ไม่จำกัด · PDF ขั้นต่ำเท่ากระดาษ (คำถาม 14 · ประเด็นคงค้าง 14)
repeat: { max_rows: null }

# G5 ช่องตามกระดาษ — 1:1 ยกเว้นช่องระบุโครงการ (กระดาษไม่มี · anomaly)
fidelity: { one_to_one: true, add_fields: ["ชื่อโครงการ / ธุรกรรม (F01 · กระดาษไม่มีช่องระบุโครงการ)"], merge_split: [] }

# G6 ลายเซ็น — แถวล่าง 1 ช่องต่อขั้น DOA + ผู้จัดทำ · ข้อความ "พิจารณาในระบบ" ไม่ใช้ภาพ
signature: { layout: row-bottom, per_doa_step: true, handwriting_image: false }

# G7 ไม่อนุมัติ / ยกเลิก — กลับเป็นร่างเลขเดิม · ยกเลิกได้ เจ้าของ + admin role · ร่าง/รออนุมัติ · เหตุผลบังคับ
reject_cancel: { on_reject: draft, cancel_by: [owner, admin_role], cancel_states: [draft, pending], reason_required: true }

# G8 การมองเห็น — เจ้าของ · ผู้อนุมัติหลังส่ง · admin role ฝ่ายบริหารการลงทุนเห็นทั้งหมด
visibility: { owner: true, approver: after_submit, admin_role: all }

# G9 เลขที่ — เอกสารภายใน ออกตอนบันทึกครั้งแรก · รหัส IVMC (IVM + C = ฟอร์มลำดับ 03 · FM-IVM-03)
numbering: { issue_on: first_save, code: IVMC }

# G10 ของเสริม
extras: { attachments: true, copy: false, export_csv: true, announce: false }

extend: {}
fit: {}
