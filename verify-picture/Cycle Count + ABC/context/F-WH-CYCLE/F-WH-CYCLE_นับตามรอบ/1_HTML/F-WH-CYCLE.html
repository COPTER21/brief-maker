const CFG={"code": "F-WH-CYCLE", "english": "Cycle Count + ABC", "thai": "นับตามรอบ", "tabs": ["จัดชั้น ABC", "แผนนับและงานนับ", "ตรวจทานและประวัติ"], "cols": ["รอบนับ", "สินค้า", "คลาส", "ผู้รับผิดชอบ", "สถานะ"], "fields": [["plan", "รอบนับ", "text"], ["item", "สินค้า", "text"], ["class", "คลาส", "abc"], ["owner", "ผู้รับผิดชอบ", "text"], ["status", "สถานะ", "status"]], "seed": [["CC-2609-001", "ITEM-101 · ข้าวหอม", "A", "ปรียา", "รอนับ"], ["CC-2609-002", "ITEM-102 · นม UHT", "B", "อนันต์", "รอตรวจ"]], "rules": ["ABC มูลค่า×ความถี่: A70% B20% C10%; รอบ A เดือน B ไตรมาส C ครึ่งปี ปรับ config/effective date ได้", "ผู้ตรวจนับไม่เห็น expected qty/value/variance ก่อนส่ง [ASSUMED OQ-ST-02]", "ผู้ตรวจทานเห็นผลต่างและขอ recount ได้", "ผลต่างส่ง Stock Adjustment W3-LITE soft-link mock; ไม่แก้ยอดเอง", "ส่งผลซ้ำใช้ idempotency และประวัติ append-only"], "scenarios": ["จัดชั้น ABC และสร้างแผน", "ผู้ตรวจนับเห็นเฉพาะช่องนับ", "ส่งผลนับ 0 ได้", "ผู้ตรวจทานเห็นผลต่าง", "ส่งผลต่างเข้า mock Stock Adjustment", "ป้องกันส่งซ้ำ"]};
const state={rows:CFG.seed.map((r,i)=>({id:i+1,values:[...r]})),history:[],active:'records',sort:0,asc:true,selected:null,mode:'view',lastKey:'',role:'operator',settings:{}};

function renderTableOnly(){let q=document.getElementById('search').value.toLowerCase().trim();let typ=document.getElementById('typeFilter').value;let sts=document.getElementById('statusFilter').value;let rows=state.rows.filter(r=>(!q||r.values.join(' ').toLowerCase().includes(q))&&(typ==='ทุกประเภท'||r.values[0].includes(typ))&&(sts==='ทุกสถานะ'||String(r.values.at(-1))===sts));rows.sort((a,b)=>String(a.values[state.sort]).localeCompare(String(b.values[state.sort]),'th',{numeric:true})*(state.asc?1:-1));document.getElementById('thead').innerHTML='<tr>'+CFG.cols.map((v,i)=>`<th onclick="setSort(${i})">${esc(v)} ${state.sort===i?(state.asc?'↑':'↓'):''}</th>`).join('')+'</tr>';document.getElementById('tbody').innerHTML=rows.map(r=>'<tr onclick="openView('+r.id+')">'+r.values.map((v,i)=>`<td>${i===CFG.cols.length-1&&CFG.code!=='F-ACC-VAL'?`<span class="pill ${String(v).includes('รอ')?'pending':''}">${esc(v)}</span>`:esc(v)}</td>`).join('')+'</tr>').join('');document.getElementById('empty').hidden=rows.length>0;document.getElementById('tableFoot').textContent=`แสดง ${rows.length} จาก ${state.rows.length} รายการ`;renderIcons()}

function fieldHtml(f,i,v){let type=f[2],name=f[1],id='f'+i;if(type==='status')return `<div class="field"><label for="${id}">${esc(name)}</label><input class="input" id="${id}" value="${esc(v)}" readonly></div>`;if(type==='abc'||type==='basis'||type==='context'){let opts=type==='abc'?['A','B','C']:type==='basis'?['มูลค่า','น้ำหนัก','ปริมาณ']:['รับของ','เก็บเข้า','ย้าย','นับ'];return `<div class="field"><label for="${id}">${esc(name)}</label><select class="select" id="${id}">${opts.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select><div class="error" id="e${i}"></div></div>`}return `<div class="field"><label for="${id}">${esc(name)}</label><input class="input" id="${id}" type="${type}" value="${esc(v)}"><div class="error" id="e${i}"></div></div>`}
function showDrawer(title,body,footer,mode){state.mode=mode;document.getElementById('drawerTitle').textContent=title;document.getElementById('drawerBody').innerHTML=body;document.getElementById('drawerFooter').innerHTML=footer;document.getElementById('backdrop').classList.add('open');document.getElementById('drawer').classList.add('open');setTimeout(()=>document.querySelector('#drawer .input:not([readonly])')?.focus(),30)}

function exportRows(){let csv=[CFG.cols.join(','),...state.rows.map(r=>r.values.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));a.download=CFG.code+'.csv';a.click();URL.revokeObjectURL(a.href);toast('ส่งออกแล้ว')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('drawer').classList.contains('open'))closeDrawer()});document.addEventListener('click',e=>{/* global overlay close owner */});const cyItems=[{code:'ITEM-101',name:'ข้าวหอม',value:40,frequency:4,warehouse:'WH-01'},{code:'ITEM-102',name:'นม UHT',value:30,frequency:3,warehouse:'WH-01'},{code:'ITEM-103',name:'อะไหล่',value:20,frequency:2,warehouse:'WH-01'},{code:'ITEM-104',name:'บรรจุภัณฑ์',value:10,frequency:1,warehouse:'WH-01'}];

const cyItemStock={
 'ITEM-101':{lotRef:'LOT-001',locationRef:'A-01',expectedBase:100,uomRef:'EA',factor:1},
 'ITEM-102':{lotRef:'LOT-002',locationRef:'A-02',expectedBase:24,uomRef:'box',factor:12},
 'ITEM-103':{lotRef:'LOT-003',locationRef:'B-01',expectedBase:8,uomRef:'EA',factor:1},
 'ITEM-104':{lotRef:'LOT-004',locationRef:'B-02',expectedBase:12,uomRef:'EA',factor:1}};
let cyAsOf='2026-09-14';
let cyPolicies=[structuredClone(cyPolicy)],cyEvents=[],cyAdjustments=[],cyRole='counter',cyActor='PERSON-COUNT-01';
const cySessions=[{id:'CC-001',itemRef:'ITEM-101',lotRef:'LOT-001',locationRef:'A-01',warehouseRef:'WH-01',uomRef:'EA',factor:1,expectedBase:100,dueDate:'2026-09-30',assignedCounterRef:'PERSON-COUNT-01',policySnapshot:structuredClone(cyPolicy),status:'assigned',version:1,attempts:[],reviewReason:null,adjustmentRef:null,onHandSnapshot:100},{id:'CC-002',itemRef:'ITEM-102',lotRef:'LOT-002',locationRef:'A-02',warehouseRef:'WH-01',uomRef:'box',factor:12,expectedBase:24,dueDate:'2026-09-30',assignedCounterRef:'PERSON-COUNT-01',policySnapshot:structuredClone(cyPolicy),status:'assigned',version:1,attempts:[],reviewReason:null,adjustmentRef:null,onHandSnapshot:24}];
function cyPolicyValid(p){if(!['value','value_times_frequency'].includes(p.basis))return 'เลือกฐาน ABC ให้ถูกต้อง';if(![p.a,p.b,p.c].every(x=>Number.isFinite(x)&&x>=0)||p.a+p.b+p.c!==100)return 'สัดส่วน A/B/C ต้องรวม 100';if(!/^\d{4}-\d{2}-\d{2}$/.test(p.effectiveDate))return 'วันที่เริ่มใช้ไม่ถูกต้อง';let d=new Date(p.effectiveDate+'T00:00:00Z');if(Number.isNaN(d.getTime())||d.toISOString().slice(0,10)!==p.effectiveDate)return 'วันที่เริ่มใช้ไม่ถูกต้อง';if(!Number.isInteger(p.windowDays)||p.windowDays<1||!['A','B','C'].every(c=>Number.isInteger(p.cadence?.[c])&&p.cadence[c]>0))return 'ช่วงเวลาและรอบนับต้องมากกว่า 0';return ''}
function cyPolicyFor(asOf){return [...cyPolicies].filter(p=>p.effectiveDate<=asOf).sort((a,b)=>b.effectiveDate.localeCompare(a.effectiveDate)||b.version-a.version)[0]||null}
function cyClassify(items=cyItems,p=cyPolicyFor(cyAsOf)){if(!p)return {ok:false,error:'ไม่พบเกณฑ์ ABC ที่มีผล'};let error=cyPolicyValid(p);if(error)return {ok:false,error};if(items.some(x=>!Number.isFinite(x.value)||x.value<0||!Number.isFinite(x.frequency)||x.frequency<0))return {ok:false,error:'มูลค่าหรือความถี่ไม่ถูกต้อง'};let a=items.map(x=>({...x,score:p.basis==='value'?x.value:x.value*x.frequency})).sort((x,y)=>y.score-x.score||x.code.localeCompare(y.code));let total=a.reduce((n,x)=>n+x.score,0),before=0;for(let x of a){x.beforePct=total?before/total*100:0;x.sharePct=total?x.score/total*100:0;x.class=total===0?'C':x.beforePct<p.a?'A':x.beforePct<p.a+p.b?'B':'C';before+=x.score}return {ok:true,total,rows:a,shares:{A:a.filter(x=>x.class==='A').reduce((n,x)=>n+x.sharePct,0),B:a.filter(x=>x.class==='B').reduce((n,x)=>n+x.sharePct,0),C:a.filter(x=>x.class==='C').reduce((n,x)=>n+x.sharePct,0)}}}
function cySavePolicy(p){let error=cyPolicyValid(p);if(error)return {ok:false,error};let next={...structuredClone(p),id:'ABC-'+String(cyPolicies.length+1).padStart(2,'0'),version:cyPolicies.length+1};cyPolicy=next;cyPolicies.push(structuredClone(next));cyEvents.unshift({type:'policy.saved',ref:next.id,at:new Date().toISOString()});return {ok:true,policy:next}}
function cyDue(lastDate,months){let d=new Date(lastDate+'T00:00:00Z');if(Number.isNaN(d.getTime())||!Number.isInteger(months)||months<1)return null;let y=d.getUTCFullYear(),m=d.getUTCMonth()+months,day=d.getUTCDate();let last=new Date(Date.UTC(y,m+1,0)).getUTCDate();return new Date(Date.UTC(y,m,Math.min(day,last))).toISOString().slice(0,10)}
function cyCounterProjection(s){return {id:s.id,itemRef:s.itemRef,lotRef:s.lotRef,locationRef:s.locationRef,uomRef:s.uomRef,dueDate:s.dueDate,status:s.status,ownCurrentCount:s.status==='counting'?s.currentCount??null:null}};
function cyReviewerProjection(s){let a=s.attempts.at(-1);return {...cyCounterProjection(s),expectedBase:s.expectedBase,countedBase:a?.countedBase??null,delta:a?a.countedBase-s.expectedBase:null,attemptId:a?.id??null,reviewReason:s.reviewReason}}
function cyCreatePlan(itemRef,warehouseRef,assignedCounterRef,lastAcceptedDate,key,asOf=cyAsOf){let policy=cyPolicyFor(asOf);if(!policy)return {ok:false,error:'ไม่พบเกณฑ์ ABC ที่มีผล'};let item=cyItems.find(x=>x.code===itemRef&&x.warehouse===warehouseRef);if(!item)return {ok:false,error:'ไม่พบสินค้า/คลัง'};if(!assignedCounterRef)return {ok:false,error:'เลือกผู้ตรวจนับ'};let old=cySessions.find(x=>x.createKey===key);if(old)return {ok:true,replay:true,session:old};let cls=cyClassify(cyItems,policy).rows.find(x=>x.code===itemRef).class,due=cyDue(lastAcceptedDate,policy.cadence[cls]);if(!due)return {ok:false,error:'วันที่ตรวจรับล่าสุดไม่ถูกต้อง'};let snap=cyItemStock[itemRef];if(!snap)return {ok:false,error:'ไม่พบยอดคาดหมายจาก Inventory'};let s={id:'CC-'+String(cySessions.length+1).padStart(3,'0'),itemRef,lotRef:snap.lotRef,locationRef:snap.locationRef,warehouseRef,uomRef:snap.uomRef,factor:snap.factor,expectedBase:snap.expectedBase,dueDate:due,assignedCounterRef,policySnapshot:structuredClone(policy),classSnapshot:cls,status:'assigned',version:1,attempts:[],reviewReason:null,adjustmentRef:null,onHandSnapshot:snap.expectedBase,createKey:key};cySessions.push(s);cyEvents.unshift({type:'plan.created',ref:s.id,at:new Date().toISOString()});return {ok:true,session:s}}
function cySubmit(id,counted,key,actor=cyActor,expectedVersion){let s=cySessions.find(x=>x.id===id);if(!s)return {ok:false,error:'ไม่พบแผนนับ'};let old=s.attempts.find(x=>x.key===key);if(old)return {ok:true,replay:true,attempt:old};if(actor!==s.assignedCounterRef)return {ok:false,error:'ไม่ใช่ผู้ตรวจนับที่ได้รับมอบหมาย'};if(expectedVersion!==undefined&&expectedVersion!==s.version)return {ok:false,error:'ข้อมูลเปลี่ยนแล้ว'};if(!['assigned','recount_requested'].includes(s.status))return {ok:false,error:'สถานะงานนับไม่ถูกต้อง'};if(counted===''||counted===null||!Number.isFinite(Number(counted))||Number(counted)<0)return {ok:false,error:'กรอกจำนวนที่นับได้'};let count=Number(counted),factor=s.factor;if(!Number.isFinite(factor)||factor<=0)return {ok:false,error:'ไม่พบหน่วยนับ snapshot'};let a={id:s.id+'-A'+(s.attempts.length+1),key,counted,countedBase:count*factor,factorSnapshot:factor,uomRef:s.uomRef,at:new Date().toISOString()};s.attempts.push(a);s.status='submitted';s.version++;cyEvents.unshift({type:'count.submitted',ref:s.id,attemptId:a.id,at:a.at});return {ok:true,attempt:a}}
function cyReview(id,decision,reason,key,attemptId,expectedVersion){let s=cySessions.find(x=>x.id===id);if(!s)return {ok:false,error:'ไม่พบแผนนับ'};if(s.reviewKey===key)return {ok:true,replay:true,session:s};if(s.status!=='submitted'||!s.attempts.length)return {ok:false,error:'ยังไม่มีผลนับที่ส่งแล้ว'};if(expectedVersion!==undefined&&expectedVersion!==s.version)return {ok:false,error:'ข้อมูลเปลี่ยนแล้ว'};let latest=s.attempts.at(-1);if(attemptId!==latest.id)return {ok:false,error:'ผลนับรุ่นเก่าใช้ตรวจทานไม่ได้'};if(!['accept','recount'].includes(decision))return {ok:false,error:'เลือกผลตรวจทาน'};if(decision==='accept'&&!reason?.trim())return {ok:false,error:'ระบุเหตุผลการรับรอง'};s.reviewKey=key;s.reviewReason=reason?.trim()||null;s.status=decision==='accept'?'reviewed':'recount_requested';s.version++;cyEvents.unshift({type:decision==='accept'?'count.reviewed':'count.recount_requested',ref:s.id,attemptId:latest.id,at:new Date().toISOString()});return {ok:true,session:s,delta:latest.countedBase-s.expectedBase}}
function cyDispatchAdjustment(id,key){let s=cySessions.find(x=>x.id===id);if(!s)return {ok:false,error:'ไม่พบแผนนับ'};if(s.adjustmentKey===key)return {ok:true,replay:true,ref:s.adjustmentRef};if(s.status!=='reviewed')return {ok:false,error:'ต้องตรวจทานก่อนส่งผลต่าง'};let a=s.attempts.at(-1),delta=a.countedBase-s.expectedBase;if(delta===0)return {ok:false,error:'ผลต่างเป็นศูนย์ ไม่ต้องส่งปรับยอด'};if(s.adjustmentRef)return {ok:false,error:'ส่งผลต่างแล้ว'};let payload={sourceSessionId:s.id,attemptId:a.id,policySnapshotId:s.policySnapshot.id,itemRef:s.itemRef,lotRef:s.lotRef,locationRef:s.locationRef,warehouseRef:s.warehouseRef,uomRef:'EA',expectedBase:s.expectedBase,countedBase:a.countedBase,delta,reviewerRef:'PERSON-REVIEW-01',reason:s.reviewReason,idempotencyKey:key};s.adjustmentKey=key;s.adjustmentRef='SA-MOCK-'+String(cyAdjustments.length+1).padStart(3,'0');s.status='adjustment_requested';cyAdjustments.push({ref:s.adjustmentRef,payload});cyEvents.unshift({type:'stockadj.mock_ack',ref:s.id,at:new Date().toISOString()});return {ok:true,ref:s.adjustmentRef,payload}}
function cySetRole(role){cyRole=role;render()}
function cyRows(){if(state.active==='records'){let result=cyClassify();CFG.cols=['สินค้า','มูลค่า','ความถี่','คะแนนที่ใช้','สัดส่วนจริง','คลาส','สถานะ'];return result.rows.map((x,i)=>({id:i+1,values:[x.code+' · '+x.name,x.value,x.frequency,x.score,x.sharePct.toFixed(1)+'%',x.class,'จัดชั้นแล้ว']}))}if(state.active==='history'){CFG.cols=['งานนับ','สินค้า','ล็อต / ตำแหน่ง','กำหนด','ผู้ตรวจนับ','คลาส','สถานะ'];return cySessions.map((s,i)=>({id:i+1,values:[s.id,s.itemRef,(s.lotRef||'—')+' / '+(s.locationRef||'—'),s.dueDate,s.assignedCounterRef,s.classSnapshot||cyClassify().rows.find(x=>x.code===s.itemRef)?.class||'C',s.status==='assigned'?'รอนับ':s.status==='submitted'?'รอตรวจ':s.status==='recount_requested'?'นับใหม่':s.status==='reviewed'?'ตรวจแล้ว':'ส่งผลต่างแล้ว']}))}CFG.cols=['งานนับ','สินค้า','ผลนับล่าสุด','ผลต่าง','เหตุการณ์','เวลา','สถานะ'];return cySessions.filter(s=>s.attempts.length).map((s,i)=>{let a=s.attempts.at(-1),rev=cyRole==='reviewer',event=cyEvents.find(e=>e.ref===s.id);return {id:i+1,values:[s.id,s.itemRef,rev?a.countedBase:'—',rev?a.countedBase-s.expectedBase:'—',event?.type||'—',event?.at?.slice(0,16)||'—',s.status==='submitted'?'รอตรวจ':s.status==='recount_requested'?'นับใหม่':s.status==='reviewed'?'ตรวจแล้ว':'ส่งผลต่างแล้ว']}})}
function cyStats(){let abc=cyClassify().rows,vals=[cySessions.length,cySessions.filter(s=>s.status==='assigned'||s.status==='recount_requested').length,cySessions.filter(s=>s.status==='submitted').length,cySessions.filter(s=>s.status==='reviewed'||s.status==='adjustment_requested').length],labs=['แผนทั้งหมด','รอนับ','รอตรวจ','ตรวจแล้ว'];document.getElementById('stats').innerHTML=vals.map((v,i)=>`<div class="stat" onclick="location.hash='#/${i===2||i===3?'settings':'history'}'"><div class="lbl">${labs[i]}</div><div class="num">${v}</div></div>`).join('')}
function render(){tabs();state.rows=cyRows();cyStats();document.getElementById('mainPanel').hidden=false;document.getElementById('secondaryPanel').hidden=true;let role=`<div data-demo="persona-switch" class="cy-role"><span class="cy-demo">DEMO</span><label>มุมมองทดสอบ</label><select class="select" onchange="cySetRole(this.value)"><option value="counter" ${cyRole==='counter'?'selected':''}>ผู้ตรวจนับ</option><option value="reviewer" ${cyRole==='reviewer'?'selected':''}>ผู้ตรวจทาน</option></select></div>`;document.querySelector('.ph-actions').innerHTML=role+'<button class="btn" onclick="exportRows()">ส่งออก</button>'+(state.active==='records'?'<button class="btn btn-primary" onclick="cyOpenPolicy()">แก้เกณฑ์ ABC</button>':state.active==='history'?'<button class="btn btn-primary" onclick="cyOpenPlan()">สร้างแผนนับ</button>':'');fillFilters();renderTableOnly();renderIcons()}
function openView(id){let ix=id-1;if(state.active==='records'){let x=cyClassify().rows[ix];showDrawer('จัดชั้น '+x.code,`<div class="kv"><div><label>มูลค่า</label><strong>${x.value}</strong></div><div><label>ความถี่</label><strong>${x.frequency}</strong></div><div><label>ฐาน / คะแนน</label><strong>${cyPolicy.basis} / ${x.score}</strong></div><div><label>สัดส่วนจริง / คลาส</label><strong>${x.sharePct.toFixed(1)}% / ${x.class}</strong></div></div>`,'<button class="btn btn-ghost" onclick="closeDrawer()">ปิด</button>','view');return}let s=state.active==='history'?cySessions[ix]:cySessions.filter(x=>x.attempts.length)[ix];if(!s)return;cySelected=s.id;let projection=cyRole==='reviewer'?cyReviewerProjection(s):cyCounterProjection(s);let body=`<div class="kv"><div><label>สินค้า / ล็อต / ตำแหน่ง</label><strong>${s.itemRef} / ${s.lotRef||'—'} / ${s.locationRef||'—'}</strong></div><div><label>งาน / สถานะ</label><strong>${s.id} / ${projection.status}</strong></div><div><label>กำหนด / หน่วย</label><strong>${s.dueDate} / ${s.uomRef}</strong></div>${cyRole==='reviewer'&&s.attempts.length?`<div><label>คาดหมาย / นับได้ / ผลต่าง</label><strong>${s.expectedBase} / ${projection.countedBase} / ${projection.delta}</strong></div>`:''}</div><div class="error" id="cyError"></div>`;let buttons='<button class="btn btn-ghost" onclick="closeDrawer()">ปิด</button><span class="spacer"></span>';if(cyRole==='counter'&&['assigned','recount_requested'].includes(s.status))buttons+='<button class="btn btn-primary" onclick="cyOpenCount()">บันทึกผลนับ</button>';if(cyRole==='reviewer'&&s.status==='submitted')buttons+='<button class="btn btn-primary" onclick="cyOpenReview()">ตรวจทาน</button>';if(cyRole==='reviewer'&&s.status==='reviewed'&&s.attempts.at(-1).countedBase!==s.expectedBase)buttons+='<button class="btn btn-primary" onclick="cySendAdjustment()">ส่งผลต่าง (mock)</button>';showDrawer('งานนับ '+s.id,body,buttons,'view')}
let cySelected=null;
function cyOpenPolicy(){let p=cyPolicy;showDrawer('เกณฑ์ ABC',`<div class="fieldgrid"><div class="field"><label>ฐานคำนวณ</label><select class="select" id="cyBasis"><option value="value" ${p.basis==='value'?'selected':''}>มูลค่า</option><option value="value_times_frequency" ${p.basis==='value_times_frequency'?'selected':''}>มูลค่า × ความถี่</option></select></div><div class="field"><label>วันที่เริ่มใช้</label><input class="input" id="cyDate" type="date" value="${p.effectiveDate}"></div><div class="field"><label>A (%)</label><input class="input" id="cyA" type="number" value="${p.a}"></div><div class="field"><label>B (%)</label><input class="input" id="cyB" type="number" value="${p.b}"></div><div class="field"><label>C (%)</label><input class="input" id="cyC" type="number" value="${p.c}"></div><div class="field"><label>ช่วงความถี่ (วัน)</label><input class="input" id="cyWindow" type="number" value="${p.windowDays}"></div><div class="field"><label>รอบ A (เดือน)</label><input class="input" id="cyCadA" type="number" value="${p.cadence.A}"></div><div class="field"><label>รอบ B (เดือน)</label><input class="input" id="cyCadB" type="number" value="${p.cadence.B}"></div><div class="field"><label>รอบ C (เดือน)</label><input class="input" id="cyCadC" type="number" value="${p.cadence.C}"></div></div><div class="error" id="cyError"></div>`,'<button class="btn btn-ghost" onclick="closeDrawer()">ยกเลิก</button><span class="spacer"></span><button class="btn btn-primary" onclick="cySavePolicyForm()">บันทึกเกณฑ์</button>','edit')}
function cySavePolicyForm(){if(['cyA','cyB','cyC','cyWindow','cyCadA','cyCadB','cyCadC'].some(id=>document.getElementById(id).value==='')){document.getElementById('cyError').textContent='กรอกเกณฑ์และรอบนับให้ครบ';return}let p={basis:document.getElementById('cyBasis').value,effectiveDate:document.getElementById('cyDate').value,a:Number(document.getElementById('cyA').value),b:Number(document.getElementById('cyB').value),c:Number(document.getElementById('cyC').value),windowDays:Number(document.getElementById('cyWindow').value),cadence:{A:Number(document.getElementById('cyCadA').value),B:Number(document.getElementById('cyCadB').value),C:Number(document.getElementById('cyCadC').value)}};let r=cySavePolicy(p);if(!r.ok){document.getElementById('cyError').textContent=r.error;return}closeDrawer();render();toast('บันทึกเกณฑ์ ABC แล้ว')}
function cyOpenPlan(){let choices=cyItems.map(x=>`<option value="${x.code}">${x.code} · ${x.name}</option>`).join('');showDrawer('สร้างแผนนับ',`<div class="fieldgrid"><div class="field"><label>สินค้า</label><input class="input" id="cyItemSearch" oninput="cyFilterItems()" onfocus="cyFilterItems()" placeholder="ค้นหาสินค้า"><input id="cyItem" type="hidden"><div class="cy-item-menu" id="cyItemMenu" hidden>${cyItems.map(x=>`<button type=\"button\" class=\"cy-item-option\" onclick=\"cyChooseItem('${x.code}')\"><strong>${x.code} · ${x.name}</strong><small>Warehouse ${x.warehouse}</small></button>`).join('')}</div></div><div class="field"><label>คลัง</label><select class="select" id="cyWarehouse"><option>WH-01</option></select></div><div class="field"><label>ผู้ตรวจนับ</label><select class="select" id="cyCounter"><option value="PERSON-COUNT-01">ปรียา · ผู้ตรวจนับ</option><option value="PERSON-COUNT-02">อนันต์ · ผู้ตรวจนับ</option></select></div><div class="field"><label>วันที่ตรวจรับล่าสุด</label><input class="input" type="date" id="cyLast" value="2026-01-31"></div><div class="field"><label>วันที่สร้างแผน</label><input class="input" type="date" id="cyPlanDate" value="2026-09-14"></div></div><div class="error" id="cyError"></div>`,'<button class="btn btn-ghost" onclick="closeDrawer()">ยกเลิก</button><span class="spacer"></span><button class="btn btn-primary" onclick="cySavePlanForm()">สร้างแผน</button>','create')}
function cyFilterItems(){let q=document.getElementById('cyItemSearch').value.toLowerCase(),menu=document.getElementById('cyItemMenu');menu.hidden=false;menu.querySelectorAll('.cy-item-option').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(q))}

function cyOpenCount(){let s=cySessions.find(x=>x.id===cySelected);showDrawer('บันทึกผลนับ '+s.id,`<div class="kv"><div><label>สินค้า / ล็อต / ตำแหน่ง</label><strong>${s.itemRef} / ${s.lotRef||'—'} / ${s.locationRef||'—'}</strong></div><div><label>หน่วยนับ</label><strong>${s.uomRef}</strong></div></div><div class="field"><label>จำนวนที่นับได้</label><input class="input" id="cyCount" type="number" min="0"></div><div class="error" id="cyError"></div>`,'<button class="btn btn-ghost" onclick="closeDrawer()">ยกเลิก</button><span class="spacer"></span><button class="btn btn-primary" onclick="cySubmitForm()">ส่งผลนับ</button>','edit')}
function cySubmitForm(){let s=cySessions.find(x=>x.id===cySelected),r=cySubmit(s.id,document.getElementById('cyCount').value,'COUNT-'+Date.now(),cyActor,s.version);if(!r.ok){document.getElementById('cyError').textContent=r.error;return}closeDrawer();render();toast('ส่งผลนับรอตรวจแล้ว')}
function cyOpenReview(){let s=cySessions.find(x=>x.id===cySelected),p=cyReviewerProjection(s);showDrawer('ตรวจทาน '+s.id,`<div class="kv"><div><label>คาดหมาย (ฐาน)</label><strong>${p.expectedBase}</strong></div><div><label>นับได้ (ฐาน)</label><strong>${p.countedBase}</strong></div><div><label>ผลต่าง</label><strong>${p.delta}</strong></div><div><label>ผลนับรุ่น</label><strong>${p.attemptId}</strong></div></div><div class="field"><label>เหตุผลรับรอง</label><input class="input" id="cyReason"></div><div class="error" id="cyError"></div>`,'<button class="btn btn-ghost" onclick="closeDrawer()">ยกเลิก</button><span class="spacer"></span><button class="btn" onclick="cyReviewForm(\'recount\')">ขอนับใหม่</button><button class="btn btn-primary" onclick="cyReviewForm(\'accept\')">รับรองผล</button>','edit')}
