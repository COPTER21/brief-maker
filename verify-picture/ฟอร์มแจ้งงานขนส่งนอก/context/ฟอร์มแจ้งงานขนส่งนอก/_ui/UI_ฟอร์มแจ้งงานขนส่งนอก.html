/* soft update — ไม่ rebuild ระหว่างพิมพ์ (focus ไม่หลุด) */
function setLine(i, k, v){
  const f = wf(); f.lines[i][k] = v; dirty();
  const inp = document.querySelector(`#ln-${i} [name="${{ origin:'origin', destination:'destination', po_no:'po', qty:'qty' }[k] + i}"]`); if (inp) inp.classList.remove('is-bad');
  softSum();
}
function setLineDate(i, iso){ const f = wf(); f.lines[i].delivery_date = iso; dirty(); if (S.dw.err && S.dw.err.lines && S.dw.err.lines[i]) delete S.dw.err.lines[i].delivery_date; render(); }
function pickRound(iso){ wf().round = iso; dirty(); if (S.dw.err) delete S.dw.err.round; render(); }
function pickCarrier(id){ wf().carrier = id; dirty(); if (S.dw.err) delete S.dw.err.carrier; render(); }
function addLine(){
  const f = wf(), prev = f.lines[f.lines.length - 1];
  f.lines.push(Object.assign(blankLine(), prev ? { origin:prev.origin, delivery_date:prev.delivery_date } : {})); dirty(); render();
  const n = f.lines.length - 1; requestAnimationFrame(() => { const el = document.querySelector(`[name="destination${n}"]`); if (el) el.focus(); });
}
function removeLine(i){ const f = wf(); f.lines.splice(i, 1); if (!f.lines.length) f.lines.push(blankLine()); if (S.dw.err) delete S.dw.err.lines; dirty(); render(); }
function trimLines(){ const f = wf(), before = f.lines.length; f.lines = f.lines.filter(l => !isEmptyLine(l)); if (!f.lines.length) f.lines.push(blankLine()); dirty(); render(); showToast('ล้างแถวว่าง ' + Math.max(0, before - f.lines.length) + ' แถว', 'info'); }
function validateHead(){
  const f = wf(), err = {};
  if (!f.carrier) err.carrier = 1; if (!f.round) err.round = 1;
  const ok = !Object.keys(err).length; S.dw.err = ok ? null : err; return ok;
}
function validateLines(){
  const f = wf(), le = {}; let bad = 0;
  f.lines.forEach((l, i) => { const e = lineErrors(l); if (e){ le[i] = e; bad++; } });
  const noLine = !usedLines(f.lines).length;
  if (bad || noLine){ S.dw.err = Object.assign(S.dw.err || {}, { lines:le, noLine }); return false; }
  return true;
}
function wizNext(){
  if (S.dw.step === 1){
    const okH = validateHead(), okL = validateLines();
    if (!okH){ render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
    if (!okL && Object.keys(S.dw.err.lines).length){ render(); showToast('กรอกรายการให้ครบ 5 ช่อง หรือลบแถวที่ไม่ใช้', 'warning'); return; }
    S.dw.err = null;   /* ไม่มีรายการ = ไปต่อได้ (บันทึกร่างได้) · ส่งแจ้งงานตรวจอีกครั้ง */
  }
  S.dw.step += 1; render();
}
function wizBack(){ S.dw.step = Math.max(1, S.dw.step - 1); render(); }
function pickFiles(inp){ const f = wf(); gateFiles(Array.from(inp.files || [])).forEach(x => f.files.push({ name:x.name, size:fmtSize(x.size) })); inp.value = ''; dirty(); render(); }
function removeFile(i){ wf().files.splice(i, 1); dirty(); render(); }
/* บันทึกครั้งแรก = ENG-DOC-NUM.next('OTN') ออกเลขที่ (DEC-09) · ชื่อผู้ขนส่ง snapshot ลงเอกสาร */
function persist(){
  const f = wf(), me = ME(), t = nowIso(), c = carrierOf(f.carrier);
  let r = S.dw.editId ? findR(S.dw.editId) : null;
  if (!r){
    SEQ += 1;
    r = { id:'R' + SEQ, code:DOC.prefix + '-2569-' + String(SEQ).padStart(4, '0'), status:'draft', emp:S.me, dept:me.dept, submittedAt:null,
      chain:resolveDoa(S.me), doa_entry_ref:MOCK_DOA_RESOLVED.doa_entry_ref, approver_role:'', approved_by:'', approval_chain:[],
      attachments:[], audit:[{ act:'สร้างเอกสาร', by:me.name, at:t, tone:'' }], createdBy:me.name, createdAt:t };
    RECS.unshift(r);
  } else r.audit.push({ act:'แก้ไขร่าง', by:me.name, at:t, tone:'' });
  Object.assign(r, { carrier:f.carrier, carrierName:c ? c.name : '', round_date:f.round,
    lines:f.lines.filter(l => !isEmptyLine(l)).map(l => ({ origin:l.origin.trim(), destination:l.destination.trim(), po_no:l.po_no.trim(), qty:l.qty === '' ? '' : Number(l.qty), delivery_date:l.delivery_date })),
    attachments:f.files.slice(), updatedBy:me.name, updatedAt:t });
  return r;
}
function saveDraft(){ if (S.busy) return; if (!validateHead()){ S.dw.step = 1; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const r = persist(); S.busy = false; closeDrawer(true); setTimeout(() => showToast('บันทึกร่างแล้ว · ' + r.code, 'info'), 300); }, 500); }
function saveAndSubmit(){ if (S.busy) return;
  const okH = validateHead(), okL = validateLines();
  if (!okH || !okL){ S.dw.step = 1; render(); showToast(!okH ? 'กรุณากรอกข้อมูลให้ครบถ้วน' : S.dw.err.noLine && !Object.keys(S.dw.err.lines).length ? 'ต้องมีรายการงานขนส่งอย่างน้อย 1 รายการ' : 'กรอกรายการให้ครบ 5 ช่อง หรือลบแถวที่ไม่ใช้', 'warning'); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const r = persist(); S.busy = false; closeDrawer(true); setTimeout(() => openSubmit(r.id), 300); }, 500); }

/* =====================================================================
   MODALS — ส่งแจ้งงาน (DOA slot · 0 ขั้น) · ยกเลิก · ทิ้งการแก้ไข

function modalShell(icon, tone, title, sub, body, foot){

const busyLabel = (icon, label) => S.busy ? '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>' : `<i data-lucide="${icon}" class="w-4 h-4"></i><span>${label}</span>`;
function presetChips(list, cur){ return `<div class="chip-row">${list.map(p => `<button type="button" class="chip ${cur === p ? 'is-on' : ''}" onclick="setReasonPreset(this.dataset.v)" data-v="${esc(p)}">${esc(p)}</button>`).join('')}</div>`; }
function renderModal(){
  const m = S.md; if (!m) return '';

      `${steps.map((c, i) => `<div class="slot-row"><span class="slot-no num">${c.step}</span><span class="slot-role">${esc(c.role)}</span><div class="field ${m.err && !m.slots[i] ? 'is-invalid' : ''}" id="fSlot${i}">${searchSelectHTML('slot' + i, { placeholder:'เลือกผู้พิจารณา' })}<div class="field-error">กรุณาเลือกผู้พิจารณา</div></div></div>`).join('')}
       ${steps.length ? '' : '<div class="alert-row"><i data-lucide="info" class="w-4 h-4"></i><div>เอกสารนี้ไม่มีขั้นอนุมัติ — ส่งแล้วมีผลทันทีและแก้ไขไม่ได้</div></div>'}
       <div class="drawer-fields mt-3">${kv('รายการ', lineCount(r) + ' รายการ')}${kv('จำนวนรวม', fmtQty(qtySum(r)))}${early ? kv('นัดส่งก่อนรอบวันที่', early + ' รายการ — แจ้งผู้จัดการฝ่ายขาย') : ''}</div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="btnSubmit" onclick="confirmSubmit()" ${S.busy ? 'disabled' : ''}>${busyLabel('send', 'ส่งแจ้งงาน')}</button>`);
  }
  if (m.kind === 'cancel'){
    return modalShell('x-circle', 'is-danger', 'ยกเลิกเอกสาร?', `${r.code} · ${esc(r.carrierName)}${r.status === 'submitted' ? ' · ส่งแจ้งงานแล้ว — แจ้งผู้ขนส่งเองด้วยว่ายกเลิก' : ''}`,
      `${presetChips(CANCEL_PRESETS, m.preset)}
       <div class="field ${m.err ? 'is-invalid' : ''}" id="fReason"><label class="field-label">เหตุผล<span class="req">*</span></label><textarea class="input" name="reason" rows="3" placeholder="เหตุผลที่ยกเลิก" oninput="S.md.reason=this.value; if(this.value.trim()) document.getElementById('fReason').classList.remove('is-invalid')">${esc(m.reason || '')}</textarea><div class="field-error">กรุณาระบุเหตุผล</div></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ไม่ยกเลิก</button><button class="btn btn-danger" id="btnReason" onclick="confirmReason()" ${S.busy ? 'disabled' : ''}>${busyLabel('x-circle', 'ยกเลิกเอกสาร')}</button>`);
  }
  if (m.kind === 'discard'){
    return modalShell('alert-triangle', 'is-warning', 'ทิ้งข้อมูลที่กรอกไว้?', 'ข้อมูลในแบบฟอร์มนี้ยังไม่ได้บันทึก', '',
      `<button class="btn btn-ghost" onclick="closeModal()">กลับไปกรอกต่อ</button><button class="btn btn-danger" id="btnDiscard" onclick="closeModal(); closeDrawer(true)">ทิ้งข้อมูล</button>`);

}
function openModalCfg(cfg){ S.md = cfg; state.modal.open = true; render(); requestAnimationFrame(() => document.getElementById('modalBackdrop').classList.add('is-open')); }

/* U25: ปิดด้วย mousedown ที่ backdrop เท่านั้น · มีเหตุผลค้างอยู่ = ไม่ปิด */
function modalBackdropDown(e){ if (e.target !== e.currentTarget) return; if (S.md && S.md.reason) return; closeModal(); }
