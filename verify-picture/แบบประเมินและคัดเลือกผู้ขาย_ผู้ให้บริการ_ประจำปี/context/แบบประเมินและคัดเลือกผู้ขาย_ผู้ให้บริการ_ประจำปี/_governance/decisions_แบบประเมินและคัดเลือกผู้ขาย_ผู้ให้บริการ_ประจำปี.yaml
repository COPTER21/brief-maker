# unattended — AI-DEFAULT ทุกหมวด รอลูกค้ายืนยัน
# G1 ผลต่อระบบ — ใบประเมินผู้ขายประจำปี ไม่เปลี่ยนค่าในระบบ ไม่ส่งต่อ (Supplier/Vendor master ยังไม่มีในระบบ → ผู้ใช้กรอกชื่อ/รหัสผู้ขายเอง · ผล Pass/Fail ยังไม่ไปอัปเดตสถานะผู้ขาย)
config_changes: []
post_to: []

# G2 สายอนุมัติ — กระดาษมีช่องพิจารณา 2 จุด: ผู้จัดทำ (แผนกจัดซื้อ) เห็นด้วย/ไม่เห็นด้วย → อนุมัติ (ผู้จัดการแผนกจัดซื้อ) อนุมัติ/ไม่อนุมัติ
# role-pur-officer ไม่อยู่ใน DOA master (แจ้งใน report) · role-mgr-pur มีใน master · ผลไม่ผ่าน (<6) ให้ DOA กลางเพิ่มขั้นผู้บริหาร (role-gm) ตามหมายเหตุบนกระดาษ — TODO: DOA engine (เงื่อนไขตามผลประเมิน ไม่ hardcode)
doa: { required: true, mode: dynamic, default_steps: ["role-pur-officer", "role-mgr-pur"], amount: none }

# G3 สูตร/ค่าคงที่ — หัวข้อ/คะแนนเต็ม/เกณฑ์ผ่าน/รายการมาตรฐาน อ่านจาก config · คำนวณอัตโนมัติ
calc:
  constants_from_config: true
  auto_compute: true
  over_limit: block
  rules:
    - "คะแนนที่ได้ของแต่ละหัวข้อต้องอยู่ระหว่าง 0 ถึงคะแนนเต็มของหัวข้อ (คอลัมน์ คะแนนเฉลี่ย 3/4/2/1) ทศนิยมไม่เกิน 1 ตำแหน่ง — เกิน = บล็อก (ขัดแย้งทางตรรกะ)"
    - "ต้องกรอกคะแนนครบทุกหัวข้อก่อนส่ง (บล็อก)"
    - "คะแนนรวม = ผลรวมคะแนนที่ได้ · สรุปผลการประเมินระบบติ๊กให้: คะแนนรวม < เกณฑ์ผ่าน (6) = ไม่ผ่าน (Fail,Non qualified) · ≥ 6 = ผ่าน (Pass) — ผู้ใช้แก้ผลเองไม่ได้"
    - "ผลไม่ผ่าน → เตือนว่าผู้จัดการฝ่ายจัดซื้อและผู้บริหารต้องพิจารณาคัดเลือก · สายอนุมัติเพิ่มขั้นผู้บริหารตามเงื่อนไขที่ DOA กลาง (TODO: DOA engine)"
    - "ต้องเลือกประเภท สินค้า และ/หรือ บริการ อย่างน้อย 1 · เลือกแล้วต้องกรอกรายละเอียดของประเภทนั้น (บล็อก)"
    - "ติ๊กมาตรฐาน อื่นๆ ต้องกรอกชื่อมาตรฐาน (บล็อก)"
    - "ยกเว้นจากข้อความ ผู้ใช้ปรับได้: คะแนนรวมและสรุปผลการประเมินเป็นค่าคำนวณล้วน ผู้ใช้ปรับเองไม่ได้ (ปรับได้เฉพาะคะแนนที่ได้รายหัวข้อ)"
    - "1 ใบ = ผู้ขาย 1 ราย ต่อ 1 รอบประเมินประจำปี · ผู้ขายรหัสเดียวกันมีใบที่ยังไม่ปิดในปีเดียวกันอยู่แล้ว → เตือน ไม่บล็อก"

# G4 รายการซ้ำ — หัวข้อประเมินมาจาก config ผู้ใช้ไม่เพิ่ม/ลบแถวเอง · PDF แสดงครบ 4 หัวข้อตามกระดาษ
repeat: { max_rows: null }

# G5 ช่องตามกระดาษ 1:1 · คงคำ "คะแนนเฉลี่ย" ตามกระดาษ · แก้คำสะกดผิดชัดเจน
fidelity: { one_to_one: true, add_fields: [], merge_split: [], spelling_fix: ["Pratice → Practice", "เครื่อหมาย → เครื่องหมาย", "มาตราฐาน → มาตรฐาน", "อุสาหกรรม → อุตสาหกรรม", "Quatation → Quotation"] }

# G6 ลายเซ็น — แถวล่าง 1 ช่องต่อขั้น DOA (ผู้ประเมิน = ผู้ส่ง) · ข้อความพิจารณาในระบบ ไม่ใช้ภาพ · คำตัดสินผูก role (เห็นด้วย/ไม่เห็นด้วย ของผู้จัดทำ · อนุมัติ/ไม่อนุมัติ ของผู้จัดการ)
signature: { layout: row-bottom, per_doa_step: true, handwriting_image: false }

# G7 ไม่อนุมัติ/ไม่เห็นด้วย → กลับเป็นร่างเลขเดิม · ยกเลิกได้ เจ้าของ + admin · ร่าง/รออนุมัติ · เหตุผลบังคับ
reject_cancel: { on_reject: draft, cancel_by: [owner, admin_role], cancel_states: [draft, pending], reason_required: true }

# G8 การมองเห็น — admin = ผู้จัดการฝ่ายจัดซื้อ (role-mgr-pur)
visibility: { owner: true, approver: after_submit, admin_role: all, admin_role_id: role-mgr-pur }

# G9 เลขที่ — ออกตอนบันทึกครั้งแรก · รหัส VEV (Vendor EValuation)
numbering: { issue_on: first_save, code: VEV }

# G10 ของเสริม
extras: { attachments: true, copy: false, export_csv: true, announce: false }

extend: {}
fit: {}
