# doccfg-declaration v2.1 — init จาก DECISIONS.lock + print_config · แก้ได้ก่อน brief
feature_id: F-TMP-004
doc_types:
- code: VEV
  name_th: แบบประเมินและคัดเลือกผู้ขาย/ผู้ให้บริการ ประจำปี
  module: PUR
  feature_id: F-TMP-004
  numbering:
    preset: '{PREFIX}-{YYYY}-{run:4}'
    reset: yearly
    scope: global
    no_gap: false
    issue_on: first_save
    frd_ref: 03_LOGIC F-TMP-004-FN-03
  snapshot:
    sent_external: false
    approved_final: true
  snapshot_points:
  - event: approved_final
    frd_ref: 03_LOGIC F-TMP-004-FN-06
  print_config:
    form_code: FM-PUR-01
    revision: 'REV.00 : 01/07/2569'
    paper: A4-portrait
    min_rows:
      criteria: 4
    dense_when_rows_over: 6
    header_source: organization_snapshot_at_numbering
    sign_boxes:
    - box: requester
      label: ผู้ประเมิน (Evaluated by)
      show_date: true
    - box: doa_step:*
      label: from_doa_step
      show_decision: true
      show_date: true
    decision_words:
      default:
        approve: อนุมัติ (Approve)
        reject: ไม่อนุมัติ ( Not Approve)
      by_role:
        role-pur-officer:
          approve: เห็นด้วย (Agree / Acknowledge)
          reject: ไม่เห็นด้วย (Not Agree)
        role-mgr-pur:
          approve: อนุมัติ (Approve)
          reject: ไม่อนุมัติ ( Not Approve)
        role-gm:
          approve: อนุมัติ (Approve)
          reject: ไม่อนุมัติ ( Not Approve)
    sign_layout:
      source: approval_chain snapshot (ผู้ประเมิน + จำนวนขั้นตามที่ตั้งใน DOA · ผลไม่ผ่าน
        = DOA กลางเพิ่มขั้นผู้บริหาร)
      max_per_row: 4
      split: even
      dense_when_steps_over: 4
      keep_together: true
    ref: print/print_config.json
