# doccfg-declaration v2.1 — init จาก DECISIONS.lock + print_config · แก้ได้ก่อน brief
feature_id: F-TMP-002
doc_types:
- code: FLI
  name_th: แบบฟอร์มตรวจเช็ครถฟอร์คลิฟท์ประจำวัน
  module: WHS
  feature_id: F-TMP-002
  numbering:
    preset: '{PREFIX}-{YYYY}-{run:4}'
    reset: yearly
    scope: global
    no_gap: false
    issue_on: first_save
    frd_ref: 03_LOGIC F-TMP-002-FN-03
  snapshot:
    sent_external: false
    approved_final: true
  snapshot_points:
  - event: approved_final
    frd_ref: 03_LOGIC F-TMP-002-FN-06
  print_config:
    form_code: FM-WHS-04
    revision: 'Rev.00 : 01/07/2569'
    paper: A4-portrait
    min_rows:
      gen_items: 15
      fuel_items: 8
      elec_items: 6
    dense_when_rows_over: 15
    header_source: organization_snapshot_at_numbering
    sign_boxes:
    - box: requester
      label: ผู้ตรวจสอบ
      show_date: true
    - box: doa_step:*
      label: from_doa_step
      show_decision: true
      show_date: true
    decision_words:
      default:
        approve: อนุมัติ
        reject: ไม่อนุมัติ
      by_role:
        role-supervisor:
          approve: ตรวจสอบแล้ว
          reject: ส่งกลับแก้ไข
    sign_layout:
      source: approval_chain snapshot (ผู้ขอ + จำนวนขั้นตามที่ตั้งใน DOA)
      max_per_row: 4
      split: even
      dense_when_steps_over: 4
      keep_together: true
    ref: print/print_config.json
