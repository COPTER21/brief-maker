# unattended — AI-DEFAULT ทุกหมวด รอลูกค้ายืนยัน
# G1 ผลต่อระบบ — ใบเปิดเผยผลประโยชน์ทับซ้อนประจำปี เป็นใบรับรอง/บันทึกเท่านั้น ไม่เปลี่ยนค่าในระบบ ไม่ส่งต่อระบบอื่น (ทะเบียนผลประโยชน์ทับซ้อน/Vendor master ยังไม่มีในระบบ · ผล "มี" ไม่ไปบล็อกผู้ขายอัตโนมัติ)
config_changes: []
post_to: []

# G2 สายอนุมัติ — กระดาษมีช่องลงนามผู้พิจารณา 1 ช่อง (กรอบ "ข้อคิดเห็นของผู้บังคับบัญชา") ไม่มี ☐ คำตัดสิน → dynamic 1 ขั้น = ผู้บังคับบัญชาตรง (role-line-manager · relative role) ให้ข้อคิดเห็น + รับทราบ
# คำ "ฝ่ายกฎหมาย" ใต้ช่องลงชื่อขัดกับหัวกรอบ → ไม่เพิ่มขั้นเอง (1:1 กับช่องบนกระดาษ) · ถ้าลูกค้ายืนยันว่าฝ่ายกฎหมายต้องลงนาม → เพิ่มขั้น role-compliance ที่ DOA กลาง (dynamic) ไม่แก้ feature — OQ · TODO: DOA engine
doa: { required: true, mode: dynamic, default_steps: ["role-line-manager"], amount: none }

# G3 ค่าคงที่ — ปีรอบการเปิดเผยและถ้อยคำรับรองอ่านจาก config (CoiDisclosureConfig) ไม่ hardcode 2569 · ไม่มีสูตร
calc:
  constants_from_config: true
  auto_compute: true
  over_limit: warn
  rules:
    - "ปีรอบการเปิดเผย (ประจำปี) = ค่าตัวแปรรอบปี จาก CoiDisclosureConfig.current_year (ค่าเริ่ม = ปี พ.ศ. ปัจจุบัน) · ห้าม hardcode 2569 · ผู้ใช้แก้ปีเองไม่ได้"
    - "ถ้อยคำรับรอง 2 ย่อหน้าอ่านจาก CoiDisclosureConfig.statement_text และ snapshot ลงใบตอนส่ง (ใบเก่าแสดงถ้อยคำตอนส่ง)"
    - "ต้องเลือก ไม่มี หรือ มี อย่างใดอย่างหนึ่งเท่านั้นก่อนส่ง (บล็อก)"
    - "เลือก มี → รายละเอียดบังคับ อย่างน้อย 10 ตัวอักษร (บล็อก) · เลือก ไม่มี → ล้างรายละเอียด"
    - "ต้องติ๊กยืนยันว่าข้อมูลเป็นความจริงตามถ้อยคำรับรองก่อนส่ง (บล็อก)"
    - "ชื่อ คำนำหน้า และตำแหน่งดึงจากข้อมูลพนักงานของผู้ส่ง (snapshot ตอนส่ง) ผู้ใช้แก้เองไม่ได้"
    - "1 คน มีใบที่มีผลได้ 1 ใบต่อปี · ส่งใบใหม่ในปีเดียวกัน (แจ้งเปลี่ยนแปลงระหว่างปี) → เตือน ไม่บล็อก · ใบใหม่อ้างใบเดิม เมื่อรับทราบแล้วใบเดิมแสดง ถูกแทนที่"
    - "ข้อคิดเห็นของผู้บังคับบัญชากรอกได้เฉพาะผู้พิจารณาตอนพิจารณา · ส่งกลับแก้ไขต้องมีเหตุผล"

# G4 ไม่มีแถวซ้ำ
repeat: { max_rows: null }

# G5 ช่องตามกระดาษ 1:1 ไม่เพิ่มช่อง (รายละเอียดเป็นข้อความอิสระตามกระดาษ · โครงรายการแยกช่องเสนอใน OQ) · ไม่มีคำสะกดผิดชัดเจน
fidelity: { one_to_one: true, add_fields: [], merge_split: [], spelling_fix: [] }

# G6 ลายเซ็น — ผู้เปิดเผย ลงชื่อ/วันที่ กลางหน้า (ส่งในระบบ) · ผู้บังคับบัญชา ช่องในกรอบ 1 ช่องต่อขั้น DOA · ข้อความพิจารณาในระบบ ไม่ใช้ภาพ · คำตัดสินผูก role: รับทราบ / ส่งกลับแก้ไข
signature: { layout: row-bottom, per_doa_step: true, handwriting_image: false }

# G7 ส่งกลับแก้ไข → กลับเป็นร่างเลขเดิม · ยกเลิกได้ เจ้าของ + admin · ร่าง/รอพิจารณา · เหตุผลบังคับ
reject_cancel: { on_reject: draft, cancel_by: [owner, admin_role], cancel_states: [draft, pending], reason_required: true }

# G8 การมองเห็น — ข้อมูลลับ (Data Classification: Confidential · ความสัมพันธ์ครอบครัว/ธุรกิจ): เจ้าของ · ผู้พิจารณาหลังส่ง · admin = ฝ่ายกำกับดูแล/กฎหมาย (role-compliance) เห็นทั้งหมด · ผู้จัดการฝ่ายจัดซื้อไม่เห็นทั้งหมดโดยตำแหน่ง (เห็นเฉพาะใบที่ตนเป็นผู้พิจารณา) · รายการรวม/CSV ของ admin ไม่ส่งออกช่องรายละเอียด
visibility: { owner: true, approver: after_submit, admin_role: all, admin_role_id: role-compliance }

# G9 เลขที่ — ออกตอนบันทึกครั้งแรก · รหัส COI (Conflict Of Interest)
numbering: { issue_on: first_save, code: COI }

# G10 ของเสริม — แนบไฟล์ ✓ (หลักฐานประกอบเมื่อ มี) · CSV ✓ (ไม่มีช่องรายละเอียด) · ทำซ้ำ ✗ · ประกาศ ✗
extras: { attachments: true, copy: false, export_csv: true, announce: false }

extend: {}
fit: {}
