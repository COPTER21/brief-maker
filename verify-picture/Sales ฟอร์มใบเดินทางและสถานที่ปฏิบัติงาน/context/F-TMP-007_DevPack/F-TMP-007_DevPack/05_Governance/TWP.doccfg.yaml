# doccfg-declaration v2.1 — init จาก DECISIONS.lock + print_config · แก้ได้ก่อน brief
feature_id: F-TMP-007
doc_types:
- code: TWP
  name_th: ใบเดินทางและสถานที่ปฎิบัติงาน  สำหรับ General Trade
  module: SALES
  feature_id: F-TMP-007
  numbering:
    preset: '{PREFIX}-{YYYY}-{run:4}'
    reset: yearly
    scope: global
    no_gap: false
    issue_on: first_save
    frd_ref: 03_LOGIC FN-06
  snapshot:
    sent_external: false
    approved_final: true
  snapshot_points:
  - event: approved_final
    frd_ref: 03_LOGIC FN-13
  print_config:
    form_code: FM-SAL-13
    revision: 'Rev.00: 01/07/2569'
    paper: A4-portrait
    min_rows: 27
    dense_when_rows_over: 27
    header_source: organization_snapshot_at_numbering
    sign_boxes:
    - box: requester
      label: ผู้จัดทำ
      show_date: true
    - box: doa_step:*
      label: from_doa_step
      show_decision: true
      show_date: true
    decision_words:
      default:
        approve: อนุมัติ
        reject: ไม่อนุมัติ
    sign_layout:
      source: approval_chain snapshot (ผู้ขอ + จำนวนขั้นตามที่ตั้งใน DOA)
      max_per_row: 4
      split: even
      dense_when_steps_over: 4
      keep_together: true
    ref: print/print_config.json
