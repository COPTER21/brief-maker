div></div><div class="tabs" id="tabs"></div><div class="stats" id="stats"></div><div class="panel page-fill" id="mainPanel"><div class="toolbar" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">

const CFG={"code": "F-WH-QHOLD", "english": "Quality Hold", "thai": "กักคุณภาพ", "tabs": ["รายการกัก", "รออนุมัติ", "ประวัติ"], "cols": ["รายการกัก", "สินค้า", "ล็อต / ตำแหน่ง", "จำนวน", "สถานะ"], "fields": [["hold", "รายการกัก", "text"], ["item", "สินค้า", "text"], ["lot", "ล็อต / ตำแหน่ง", "text"], ["qty", "จำนวน", "number"], ["status", "สถานะ", "status"]], "seed": [["QH-2609-001", "ITEM-102 · นม UHT", "LOT-2609-012 / A-03", "24", "กักอยู่"], ["QH-2609-002", "ITEM-103 · อะไหล่", "B-11", "3", "รออนุมัติ"]], "rules": ["GRN QC และปัญหาภายหลังเป็นแหล่งเข้าแบบ mock contract", "hold/release ต้องผ่าน DOA real-person slot picker", "hold ยังอยู่ on-hand แต่ตัดจาก ATP และห้ามขาย/ย้าย", "อนุมัติ/reject/release บันทึก movement/audit append-only", "ปล่อยบางส่วนห้ามเกินจำนวนกัก; ป้องกันส่งซ้ำ"], "scenarios": ["สร้างกักจาก QC mock", "เลือกคนอนุมัติ DOA", "อนุมัติหรือปฏิเสธ", "ปล่อยบางส่วน", "ป้องกัน release เกิน", "ยืนยัน ATP ไม่รวม hold"]};
const state={rows:CFG.seed.map((r,i)=>({id:i+1,values:[...r]})),history:[],active:'records',sort:0,asc:true,selected:null,mode:'view',lastKey:'',role:'operator',settings:{}};

function fillFilters(){let t=document.getElementById('typeFilter'),s=document.getElementById('statusFilter');let tv=t.value,sv=s.value;t.innerHTML='<option>ทุกประเภท</option>'+[...new Set(state.rows.map(r=>String(r.values[0])))].map(v=>`<option>${esc(v)}</option>`).join('');s.innerHTML='<option>ทุกสถานะ</option>'+[...new Set(state.rows.map(r=>String(r.values.at(-1))))].map(v=>`<option>${esc(v)}</option>`).join('');t.value=[...t.options].some(o=>o.value===tv)?tv:'ทุกประเภท';s.value=[...s.options].some(o=>o.value===sv)?sv:'ทุกสถานะ'}
function renderTableOnly(){let q=document.getElementById('search').value.toLowerCase().trim();let typ=document.getElementById('typeFilter').value;let sts=document.getElementById('statusFilter').value;let rows=state.rows.filter(r=>(!q||r.values.join(' ').toLowerCase().includes(q))&&(typ==='ทุกประเภท'||r.values[0].includes(typ))&&(sts==='ทุกสถานะ'||String(r.values.at(-1))===sts));rows.sort((a,b)=>String(a.values[state.sort]).localeCompare(String(b.values[state.sort]),'th',{numeric:true})*(state.asc?1:-1));document.getElementById('thead').innerHTML='<tr>'+CFG.cols.map((v,i)=>`<th onclick="setSort(${i})">${esc(v)} ${state.sort===i?(state.asc?'↑':'↓'):''}</th>`).join('')+'</tr>';document.getElementById('tbody').innerHTML=rows.map(r=>'<tr onclick="openView('+r.id+')">'+r.values.map((v,i)=>`<td>${i===CFG.cols.length-1&&CFG.code!=='F-ACC-VAL'?`<span class="pill ${String(v).includes('รอ')?'pending':''}">${esc(v)}</span>`:esc(v)}</td>`).join('')+'</tr>').join('');document.getElementById('empty').hidden=rows.length>0;document.getElementById('tableFoot').textContent=`แสดง ${rows.length} จาก ${state.rows.length} รายการ`;renderIcons()}

function fieldHtml(f,i,v){let type=f[2],name=f[1],id='f'+i;if(type==='status')return `<div class="field"><label for="${id}">${esc(name)}</label><input class="input" id="${id}" value="${esc(v)}" readonly></div>`;if(type==='abc'||type==='basis'||type==='context'){let opts=type==='abc'?['A','B','C']:type==='basis'?['มูลค่า','น้ำหนัก','ปริมาณ']:['รับของ','เก็บเข้า','ย้าย','นับ'];return `<div class="field"><label for="${id}">${esc(name)}</label><select class="select" id="${id}">${opts.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select><div class="error" id="e${i}"></div></div>`}return `<div class="field"><label for="${id}">${esc(name)}</label><input class="input" id="${id}" type="${type}" value="${esc(v)}"><div class="error" id="e${i}"></div></div>`}
function showDrawer(title,body,footer,mode){state.mode=mode;document.getElementById('drawerTitle').textContent=title;document.getElementById('drawerBody').innerHTML=body;document.getElementById('drawerFooter').innerHTML=footer;document.getElementById('backdrop').classList.add('open');document.getElementById('drawer').classList.add('open');setTimeout(()=>document.querySelector('#drawer .input:not([readonly])')?.focus(),30)}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('backdrop').classList.remove('open');state.selected=null}
function exportRows(){let csv=[CFG.cols.join(','),...state.rows.map(r=>r.values.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(','))].join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));a.download=CFG.code+'.csv';a.click();URL.revokeObjectURL(a.href);toast('ส่งออกแล้ว')}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('drawer').classList.contains('open'))closeDrawer()});document.addEventListener('click',e=>{/* global overlay close owner */});/* F-WH-QHOLD domain overlay: stock-read slice projection and mock DOA events only. */
const qhPeople=[
 {ref:'PERSON-01',name:'ศิริพร ใจดี',position:'เจ้าหน้าที่ตรวจคุณภาพ',department:'คุณภาพ',initial:'ศ'},

];

 {ref:'DOA-QH-HOLD-01',kind:'hold',warehouse:'WH-01',slots:[{id:'SLOT-QC',label:'ผู้ตรวจคุณภาพ',eligible:['PERSON-01','PERSON-02']},{id:'SLOT-WH',label:'ผู้รับรองคลัง',eligible:['PERSON-03','PERSON-04']}]},
 {ref:'DOA-QH-RELEASE-01',kind:'release',warehouse:'WH-01',slots:[{id:'SLOT-QC',label:'ผู้ตรวจคุณภาพ',eligible:['PERSON-01','PERSON-02']},{id:'SLOT-WH',label:'ผู้รับรองคลัง',eligible:['PERSON-03','PERSON-04']}]},
 {ref:'DOA-QH-HOLD-02',kind:'hold',warehouse:'WH-02',slots:[{id:'SLOT-QC',label:'ผู้ตรวจคุณภาพ',eligible:['PERSON-01','PERSON-02']},{id:'SLOT-WH',label:'ผู้รับรองคลัง',eligible:['PERSON-03','PERSON-04']}]},
 {ref:'DOA-QH-RELEASE-02',kind:'release',warehouse:'WH-02',slots:[{id:'SLOT-QC',label:'ผู้ตรวจคุณภาพ',eligible:['PERSON-01','PERSON-02']},{id:'SLOT-WH',label:'ผู้รับรองคลัง',eligible:['PERSON-03','PERSON-04']}]}
];
const qhSlices=Array.from({length:18},(_,i)=>({id:'SL-'+String(i+1).padStart(3,'0'),itemRef:'ITEM-'+String(101+i),warehouseRef:i%3===0?'WH-01':'WH-02',locationRef:'LOC-'+String(i+1).padStart(2,'0'),lotRef:'LOT-'+String(2609001+i),onHand:i===0?100:50+i,reservedSales:i===0?10:2,activeHeld:0,pendingHeld:0,version:1,uom:'EA',precision:0}));
const qhRequests=[];const qhEvents=[];const qhMovements=[{id:'MOV-001',sliceId:'SL-001',kind:'receipt',qty:100,sourceRef:'GRN-MOCK-001'}];
let qhDisplay=[],qhSelected=null,qhForm={kind:'hold',sliceId:null,key:null,selectedSlots:{}};
function qhSlice(id){return qhSlices.find(s=>s.id===id)||null}
function qhEffectiveBlocked(s){return s.activeHeld+s.pendingHeld}
function qhATP(s){return Math.max(0,s.onHand-s.reservedSales-qhEffectiveBlocked(s))}
function qhPendingRelease(s){return qhRequests.filter(r=>r.sliceId===s.id&&r.kind==='release'&&r.status==='requested').reduce((n,r)=>n+r.qty,0)}
function qhReleasable(s){return Math.max(0,s.activeHeld-qhPendingRelease(s))}
function qhHoldable(s){return Math.max(0,s.onHand-s.reservedSales-s.activeHeld-s.pendingHeld)}
function qhPolicyFor(kind,s,qty){return qhPolicyCatalog.find(p=>p.kind===kind&&p.warehouse===s.warehouseRef)||null}
function qhValidSlots(policy,selection){if(!policy)return 'ไม่พบนโยบายผู้อนุมัติ';for(const slot of policy.slots){let ref=selection?.[slot.id];if(!ref)return 'เลือกคนให้ครบทุกช่องอนุมัติ';if(!slot.eligible.includes(ref)||!qhPeople.some(p=>p.ref===ref))return 'คนที่เลือกไม่อยู่ในรายชื่อที่กำหนด'}return ''}
function qhRequest(kind,sliceId,qty,origin,sourceRef,reason,selectedSlots,key,expectedSliceVersion){let s=qhSlice(sliceId);if(!s)return {ok:false,code:'SLICE_NOT_FOUND',error:'ไม่พบสินค้าหรือตำแหน่งที่เลือก'};let old=qhRequests.find(r=>r.key===key);if(old){if(old.kind!==kind||old.sliceId!==sliceId||old.qty!==qty||old.origin!==origin||old.sourceRef!==(sourceRef||null)||old.reason!==reason?.trim())return {ok:false,code:'IDEMPOTENCY_CONFLICT',error:'คำขอซ้ำมีข้อมูลต่างจากเดิม'};return {ok:true,replay:true,request:old}}if(expectedSliceVersion!==s.version)return {ok:false,code:'STALE_SLICE',error:'ข้อมูลเปลี่ยนแล้ว กรุณาตรวจอีกครั้ง'};if(!Number.isFinite(qty)||qty<=0||Math.round(qty*Math.pow(10,s.precision))!==qty*Math.pow(10,s.precision))return {ok:false,code:'INVALID_QTY',error:'จำนวนต้องมากกว่า 0 และตรงหน่วยนับ'};if(kind==='hold'&&qty>qhHoldable(s))return {ok:false,code:'OVER_HOLD',error:'จำนวนกักเกินยอดที่กักได้'};if(kind==='release'&&qty>qhReleasable(s))return {ok:false,code:'OVER_RELEASE',error:'จำนวนปล่อยเกินยอดที่ปล่อยได้'};if(!['grn_qc','later_issue'].includes(origin))return {ok:false,code:'ORIGIN_REQUIRED',error:'เลือกที่มาของการกัก'};if(origin==='grn_qc'&&!sourceRef)return {ok:false,code:'SOURCE_REQUIRED',error:'ระบุอ้างอิง GRN QC'};if(!reason?.trim())return {ok:false,code:'REASON_REQUIRED',error:'ระบุเหตุผล'};let policy=qhPolicyFor(kind,s,qty),slotError=qhValidSlots(policy,selectedSlots);if(slotError)return {ok:false,code:'DOA_SLOTS_INVALID',error:slotError};let slotSnapshots=policy.slots.map(slot=>({slotId:slot.id,personRefSnapshot:selectedSlots[slot.id],person:qhPeople.find(p=>p.ref===selectedSlots[slot.id])}));let r={id:'QH-'+String(qhRequests.length+1).padStart(3,'0'),key,kind,sliceId,qty,origin,sourceRef:sourceRef||null,reason:reason.trim(),selectedSlots:slotSnapshots,policyRef:policy.ref,status:'requested',version:1,createdAt:new Date().toISOString()};qhRequests.push(r);if(kind==='hold')s.pendingHeld+=qty;s.version++;qhEvents.unshift({id:'QE-'+String(qhEvents.length+1).padStart(3,'0'),requestId:r.id,type:kind+'.requested',qty,at:r.createdAt,actorRef:'PERSON-DEMO-MAKER',sourceEventId:key,sliceId,sourceRef:r.sourceRef});return {ok:true,request:r,replay:false}}
function qhDecide(requestId,decision,sourceEventId,expectedRequestVersion,actorRef='PERSON-DEMO-DOA'){let old=qhEvents.find(e=>e.sourceEventId===sourceEventId&&e.type.endsWith('.'+decision));if(old){if(old.requestId!==requestId)return {ok:false,code:'IDEMPOTENCY_CONFLICT'};return {ok:true,replay:true,request:qhRequests.find(r=>r.id===old.requestId)}}let r=qhRequests.find(x=>x.id===requestId);if(!r)return {ok:false,code:'REQUEST_NOT_FOUND'};if(r.status!=='requested')return {ok:false,code:'ALREADY_DECIDED'};if(expectedRequestVersion!==r.version)return {ok:false,code:'STALE_REQUEST'};if(!['approved','rejected'].includes(decision))return {ok:false,code:'BAD_DECISION'};let s=qhSlice(r.sliceId);if(r.kind==='hold'){s.pendingHeld-=r.qty;if(decision==='approved')s.activeHeld+=r.qty}else if(decision==='approved'){if(r.qty>s.activeHeld)return {ok:false,code:'OVER_RELEASE'};s.activeHeld-=r.qty}r.status=decision;r.version++;s.version++;qhEvents.unshift({id:'QE-'+String(qhEvents.length+1).padStart(3,'0'),requestId:r.id,type:r.kind+'.'+decision,qty:r.qty,at:new Date().toISOString(),actorRef,sourceEventId,sliceId:r.sliceId,sourceRef:r.sourceRef});return {ok:true,replay:false,request:r}}
function qhCanOutbound(sliceId,qty){let s=qhSlice(sliceId);if(!s||!Number.isFinite(qty)||qty<=0)return {ok:false,available:s?qhATP(s):0};return {ok:qty<=qhATP(s),available:qhATP(s)}}
function qhRows(){if(state.active==='records'){CFG.cols=['สินค้า','คลัง','ล็อต / ตำแหน่ง','On-hand','กักมีผล','รอกัก','ATP','สถานะ'];qhDisplay=qhSlices;return qhSlices.map((s,i)=>({id:i+1,values:[s.itemRef,s.warehouseRef,s.lotRef+' / '+s.locationRef,s.onHand,s.activeHeld,s.pendingHeld,qhATP(s),s.pendingHeld>0?'รออนุมัติ':s.activeHeld>0?'กักอยู่':'พร้อมใช้']}))}if(state.active==='history'){CFG.cols=['คำขอ','ประเภท','สินค้า / ล็อต','จำนวน','ผู้เลือก','เวลา','สถานะ'];qhDisplay=qhRequests.filter(r=>r.status==='requested').slice().reverse();return qhDisplay.map((r,i)=>({id:i+1,values:[r.id,r.kind==='hold'?'กัก':'ปล่อย',qhSlice(r.sliceId).itemRef+' / '+qhSlice(r.sliceId).lotRef,r.qty,r.selectedSlots.map(x=>x.person?.name).join(', '),r.createdAt.slice(0,16),'รออนุมัติ']}))}CFG.cols=['เหตุการณ์','คำขอ','สินค้า / ล็อต','จำนวน','อ้างอิง','เวลา','สถานะ'];qhDisplay=[...qhEvents];return qhDisplay.map((e,i)=>({id:i+1,values:[e.type,e.requestId,qhSlice(e.sliceId).itemRef+' / '+qhSlice(e.sliceId).lotRef,e.qty,e.sourceRef||'—',e.at.slice(0,16),'บันทึกแล้ว']}))}
function qhStats(){let vals=[qhSlices.length,qhSlices.reduce((n,s)=>n+s.activeHeld,0),qhSlices.reduce((n,s)=>n+s.pendingHeld,0),qhSlices.reduce((n,s)=>n+qhATP(s),0)],labs=['ตำแหน่งสินค้า','กักมีผล','รอกัก','ATP พร้อมใช้'];document.getElementById('stats').innerHTML=vals.map((v,i)=>`<div class="stat" onclick="location.hash='#/${i===0?'records':i===2?'history':'records'}'"><div class="lbl">${labs[i]}</div><div class="num">${v}</div></div>`).join('')}
function render(){tabs();state.rows=qhRows();qhStats();document.getElementById('mainPanel').hidden=false;document.getElementById('secondaryPanel').hidden=true;document.querySelector('.ph-actions').innerHTML=state.active==='records'?'<button class="btn" onclick="exportRows()">ส่งออก</button><button class="btn btn-primary" onclick="qhOpenForm(\'hold\')">เพิ่มการกัก</button>':state.active==='history'?'<button class="btn" onclick="exportRows()">ส่งออก</button>':'<button class="btn" onclick="exportRows()">ส่งออก</button>';fillFilters();renderTableOnly();renderIcons()}
function qhSlicePicker(selected){return `<div class="field"><label>สินค้า / คลัง / ล็อต / ตำแหน่ง</label><input class="input" id="qhSliceInput" value="${selected?esc(selected):''}" oninput="qhFilterSlice()" onfocus="qhFilterSlice()"><div class="qh-slice-menu" id="qhSliceMenu" hidden>${qhSlices.map(s=>`<button type="button" class="qh-option" onclick="qhChooseSlice('${s.id}')"><span class="qh-avatar">${s.itemRef.slice(-2)}</span><span><strong>${s.itemRef} · ${s.lotRef}</strong><small>${s.warehouseRef} / ${s.locationRef} · ATP ${qhATP(s)}</small></span></button>`).join('')}</div></div>`}
function qhFilterSlice(){let input=document.getElementById('qhSliceInput'),menu=document.getElementById('qhSliceMenu');if(!menu)return;let selected=qhSlice(qhForm.sliceId),label=selected?selected.itemRef+' · '+selected.lotRef+' / '+selected.locationRef:'';if(selected&&input.value!==label){qhForm.sliceId=null;qhForm.expectedSliceVersion=null;qhForm.selectedSlots={};document.getElementById('qhSliceStats').innerHTML='';document.getElementById('qhSlots').innerHTML=''}menu.hidden=false;let q=input.value.toLowerCase();menu.querySelectorAll('.qh-option').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(q))}
function qhChooseSlice(id){let s=qhSlice(id);qhForm.sliceId=id;document.getElementById('qhSliceInput').value=s.itemRef+' · '+s.lotRef+' / '+s.locationRef;qhForm.expectedSliceVersion=s.version;document.getElementById('qhSliceMenu').hidden=true;document.getElementById('qhSliceStats').innerHTML=`<div class="qh-kv"><div class="cell"><label>On-hand / จองขาย</label><strong>${s.onHand} / ${s.reservedSales}</strong></div><div class="cell"><label>กักมีผล / รอกัก</label><strong>${s.activeHeld} / ${s.pendingHeld}</strong></div><div class="cell"><label>ATP / กักได้</label><strong>${qhATP(s)} / ${qhHoldable(s)}</strong></div><div class="cell"><label>ปล่อยได้</label><strong>${qhReleasable(s)}</strong></div></div>`;qhRefreshSlots()}
function qhPersonPicker(slot){let p=qhPeople.filter(x=>slot.eligible.includes(x.ref)),chosen=qhForm.selectedSlots[slot.id],person=qhPeople.find(x=>x.ref===chosen);return `<div class="qh-slot" data-slot="${slot.id}"><div class="qh-slot-head"><strong>${esc(slot.label)}</strong><span class="qh-demo">DEMO</span></div><div class="field"><label>เลือกคนอนุมัติ</label><input class="input" id="qhPerson-${slot.id}" value="${person?esc(person.name+' · '+person.position):''}" oninput="qhFilterPerson('${slot.id}')" onfocus="qhFilterPerson('${slot.id}')"><div class="qh-person-menu" id="qhPersonMenu-${slot.id}" hidden>${p.map(x=>`<button type="button" class="qh-option" onclick="qhChoosePerson('${slot.id}','${x.ref}')"><span class="qh-avatar">${x.initial}</span><span><strong>${esc(x.name)}</strong><small>${esc(x.position)} · ${esc(x.department)}</small></span></button>`).join('')}</div></div></div>`}
function qhFilterPerson(slotId){let input=document.getElementById('qhPerson-'+slotId),menu=document.getElementById('qhPersonMenu-'+slotId);if(!menu)return;let chosen=qhPeople.find(p=>p.ref===qhForm.selectedSlots[slotId]);if(chosen&&input.value!==chosen.name+' · '+chosen.position)delete qhForm.selectedSlots[slotId];menu.hidden=false;let q=input.value.toLowerCase();menu.querySelectorAll('.qh-option').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(q))}
function qhChoosePerson(slotId,ref){let p=qhPeople.find(x=>x.ref===ref);qhForm.selectedSlots[slotId]=ref;document.getElementById('qhPerson-'+slotId).value=p.name+' · '+p.position;document.getElementById('qhPersonMenu-'+slotId).hidden=true}
function qhRefreshSlots(){let s=qhSlice(qhForm.sliceId),el=document.getElementById('qhSlots');if(!s||!el)return;let q=Number(document.getElementById('qhQty')?.value)||1,policy=qhPolicyFor(qhForm.kind,s,q);qhForm.policyRef=policy?.ref;qhForm.selectedSlots={};el.innerHTML=policy?`<div class="qh-slot-head"><strong>ผู้อนุมัติที่ต้องเลือก</strong><span class="qh-demo">DEMO</span></div><div class="fieldgrid">${policy.slots.map(qhPersonPicker).join('')}</div>`:'<div class="error">ไม่พบนโยบายผู้อนุมัติ</div>'}
function qhOpenForm(kind,sliceId=null){let s=sliceId?qhSlice(sliceId):null;qhForm={kind,sliceId:s?.id||null,key:'QH-FORM-'+Date.now()+'-'+Math.random().toString(36).slice(2),selectedSlots:{},expectedSliceVersion:s?.version||null};let body=`<div class="fieldgrid">${qhSlicePicker(s?.id||'')}<div class="field"><label>จำนวน (${s?.uom||'EA'})</label><input class="input" id="qhQty" type="number" min="1" step="1" oninput="qhRefreshSlots()"></div><div class="field"><label>ที่มา</label><select class="select" id="qhOrigin"><option value="later_issue">พบปัญหาภายหลัง</option><option value="grn_qc">ตรวจรับ GRN QC</option></select></div><div class="field"><label>อ้างอิงต้นทาง</label><input class="input" id="qhSource" placeholder="เลขอ้างอิงต้นทาง (ถ้ามี)"></div><div class="field"><label>เหตุผล</label><input class="input" id="qhReason"></div></div><div id="qhSliceStats"></div><div id="qhSlots" data-demo="doa-policy"></div><div class="error" id="qhError"></div>`;showDrawer(kind==='hold'?'เพิ่มการกัก':'ขอปล่อยกัก',body,'<button class="btn btn-ghost" onclick="closeDrawer()">ยกเลิก</button><span class="spacer"></span><button class="btn btn-primary" id="saveBtn" onclick="qhSubmitForm()">ส่งคำขอ</button>','edit');if(s)qhChooseSlice(s.id)}
function qhSubmitForm(){let s=qhSlice(qhForm.sliceId),el=document.getElementById('qhError');if(!s){el.textContent='เลือกสินค้า / ล็อตจากรายการ';return}let qtyInput=document.getElementById('qhQty'),qty=qtyInput.value===''?NaN:Number(qtyInput.value);let r=qhRequest(qhForm.kind,s.id,qty,document.getElementById('qhOrigin').value,document.getElementById('qhSource').value.trim(),document.getElementById('qhReason').value,qhForm.selectedSlots,qhForm.key,qhForm.expectedSliceVersion??s.version);if(!r.ok){el.textContent=r.error||r.code;return}closeDrawer();render();toast(r.replay?'รายการนี้ส่งแล้ว':'ส่งคำขอรออนุมัติแล้ว')}
function qhShowSlice(s){qhSelected=s;showDrawer('สินค้า '+s.itemRef+' · '+s.lotRef,`<div class="qh-kv"><div class="cell"><label>คลัง / ตำแหน่ง</label><strong>${s.warehouseRef} / ${s.locationRef}</strong></div><div class="cell"><label>On-hand / จองขาย</label><strong>${s.onHand} / ${s.reservedSales}</strong></div><div class="cell"><label>กักมีผล / รอกัก</label><strong>${s.activeHeld} / ${s.pendingHeld}</strong></div><div class="cell"><label>ATP พร้อมใช้</label><strong>${qhATP(s)}</strong></div><div class="cell"><label>กักได้ / ปล่อยได้</label><strong>${qhHoldable(s)} / ${qhReleasable(s)}</strong></div></div><div class="field"><label>ตรวจจำนวนขาย/ย้ายที่ใช้ได้</label><input class="input" id="qhOutboundQty" type="number" min="1"><button class="btn" onclick="qhCheckOutbound()">ตรวจจำนวน</button><div id="qhOutboundResult"></div></div>`,'<button class="btn btn-ghost" onclick="closeDrawer()">ปิด</button><span class="spacer"></span><button class="btn" onclick="qhOpenForm(\'hold\',\''+s.id+'\')">ขอกัก</button><button class="btn btn-primary" onclick="qhOpenForm(\'release\',\''+s.id+'\')">ขอปล่อยกัก</button>','view')}
function qhCheckOutbound(){let qty=Number(document.getElementById('qhOutboundQty').value),r=qhCanOutbound(qhSelected.id,qty);document.getElementById('qhOutboundResult').textContent=`${r.ok?'จำนวนนี้พร้อมใช้':'จำนวนนี้ใช้ไม่ได้'} · พร้อมใช้ ${r.available} · ยังไม่มีการขายหรือย้ายจริง`}
function qhShowRequest(r){qhSelected=r;let s=qhSlice(r.sliceId),names=r.selectedSlots.map(x=>`${esc(x.person.name)} · ${esc(x.person.position)}`).join('<br>');showDrawer('คำขอ '+r.id,`<div class="qh-kv"><div class="cell"><label>ประเภท / สถานะ</label><strong>${r.kind==='hold'?'กัก':'ปล่อย'} / รออนุมัติ</strong></div><div class="cell"><label>สินค้า / ล็อต</label><strong>${s.itemRef} / ${s.lotRef}</strong></div><div class="cell"><label>จำนวน</label><strong>${r.qty}</strong></div><div class="cell"><label>กักมีผล / รอกัก / ATP</label><strong>${s.activeHeld} / ${s.pendingHeld} / ${qhATP(s)}</strong></div><div class="cell"><label>ผู้อนุมัติที่เลือก</label><strong>${names}</strong></div><div class="cell"><label>อ้างอิง</label><strong>${esc(r.sourceRef||'—')}</strong></div></div><div class="error" id="qhDecisionError"></div>`,`<button class="btn btn-ghost" onclick="closeDrawer()">ปิด</button><span class="spacer"></span><div class="qh-decision-actions" data-demo="doa-decision"><span class="qh-demo">DEMO</span><button class="btn" onclick="qhSimDecision('rejected')">จำลองไม่อนุมัติ</button><button class="btn btn-primary" onclick="qhSimDecision('approved')">จำลองอนุมัติ</button></div>`,'view')}
function qhSimDecision(decision){let r=qhSelected,key='DOA-DEMO-'+r.id+'-'+decision,answer=qhDecide(r.id,decision,key,r.version);if(!answer.ok){document.getElementById('qhDecisionError').textContent=answer.code;return}closeDrawer();render();toast(decision==='approved'?'บันทึกผลอนุมัติจำลองแล้ว':'บันทึกผลไม่อนุมัติจำลองแล้ว')}
function qhShowEvent(e){let s=qhSlice(e.sliceId);showDrawer('เหตุการณ์ '+e.id,`<div class="qh-kv"><div class="cell"><label>คำขอ / ประเภท</label><strong>${e.requestId} / ${e.type}</strong></div><div class="cell"><label>สินค้า / ล็อต</label><strong>${s.itemRef} / ${s.lotRef}</strong></div><div class="cell"><label>จำนวน</label><strong>${e.qty}</strong></div><div class="cell"><label>ผู้ทำ / เวลา</label><strong>${esc(e.actorRef)} / ${esc(e.at)}</strong></div><div class="cell"><label>แหล่งอ้างอิง</label><strong>${esc(e.sourceRef||'—')}</strong></div></div>`,'<button class="btn btn-ghost" onclick="closeDrawer()">ปิด</button>','view')}
function openCreate(){qhOpenForm('hold')}
function openView(id){let x=qhDisplay[id-1];if(!x)return;if(state.active==='records')qhShowSlice(x);else if(state.active==='history')qhShowRequest(x);else qhShowEvent(x)}
