/* ===== MODALS — บันทึกผลตรวจ (แถวใหม่ / แก้ไขแถววันเดียวกัน) · ยกเลิกใบตรวจ · ทิ้งข้อมูล ===== */
function modalShell(icon, tone, title, sub, body, foot){
  return `<div class="modal-header"><div class="modal-header-icon ${tone}"><i data-lucide="${icon}" class="w-4 h-4"></i></div><div><h3 class="modal-title">${title}</h3><p class="modal-subtitle">${sub}</p></div></div>
    ${body ? `<div class="modal-body">${body}</div>` : ''}<div class="modal-footer">${foot}</div>`;
}
const busyLabel = (icon, label) => S.busy ? '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>' : `<i data-lucide="${icon}" class="w-4 h-4"></i><span>${label}</span>`;
function presetChips(list, cur){ return `<div class="chip-row">${list.map(p => `<button type="button" class="chip ${cur === p ? 'is-on' : ''}" onclick="setReasonPreset(this.dataset.v)" data-v="${esc(p)}">${esc(p)}</button>`).join('')}</div>`; }
function renderModal(){
  const m = S.md; if (!m) return '';
  const r = m.id ? findR(m.id) : null;
  if (m.kind === 'check'){
    const err = m.err || {}, bad = ITEMS.some(([k]) => m.marks[k] === 'abnormal');
    return modalShell('clipboard-check', 'is-primary', m.cid ? 'แก้ไขผลตรวจ' : 'บันทึกผลตรวจ', `${r.code} · ${esc(locOf(r.loc).name)}`,
      `<div class="field ${err.date ? 'is-invalid' : ''}" id="fCkDate"><label class="field-label">วันที่<span class="req">*</span></label>${bedateHTML('mdate', m.date, { max:TODAY, today:TODAY, onPick:'pickDate' })}<div class="field-error">${err.date === 'dup' ? 'วันที่นี้บันทึกผลตรวจแล้ว' : 'วันที่ตรวจห้ามเป็นวันในอนาคต'}</div></div>
       ${marksBlock('md', m.marks, err.marks)}
       ${err.marks ? '<div class="trip-err"><i data-lucide="alert-circle" class="w-3.5 h-3.5"></i>เลือกผลให้ครบทั้ง 4 หัวข้อ</div>' : ''}
       <div class="drawer-fields mt-3">${kv('ผู้ตรวจ', empChip(S.me))}${kv('ผล', bad ? resPill('bad') + ' <span class="cell-mute">จะแจ้งผู้จัดการคลังสินค้า</span>' : ITEMS.every(([k]) => m.marks[k]) ? resPill('ok') : '<span class="cell-mute">—</span>')}</div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="btnCheck" onclick="confirmCheck()" ${S.busy ? 'disabled' : ''}>${busyLabel('save', 'บันทึกผลตรวจ')}</button>`);
  }
  if (m.kind === 'cancel'){
    return modalShell('x-circle', 'is-danger', 'ยกเลิกใบตรวจ?', `${r.code} · ${esc(locOf(r.loc).name)} · ยกเลิกแล้วบันทึกผลตรวจต่อไม่ได้`,
      `${presetChips(CANCEL_PRESETS, m.preset)}
       <div class="field ${m.err ? 'is-invalid' : ''}" id="fReason"><label class="field-label">เหตุผล<span class="req">*</span></label><textarea class="input" name="reason" rows="3" placeholder="เหตุผลที่ยกเลิก" oninput="S.md.reason=this.value; if(this.value.trim()) document.getElementById('fReason').classList.remove('is-invalid')">${esc(m.reason || '')}</textarea><div class="field-error">กรุณาระบุเหตุผล</div></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ไม่ยกเลิก</button><button class="btn btn-danger" id="btnReason" onclick="confirmCancel()" ${S.busy ? 'disabled' : ''}>${busyLabel('x-circle', 'ยกเลิกใบตรวจ')}</button>`);
  }
  if (m.kind === 'discard'){
    return modalShell('alert-triangle', 'is-warning', 'ทิ้งข้อมูลที่กรอกไว้?', 'ข้อมูลในแบบฟอร์มนี้ยังไม่ได้บันทึก', '',
      `<button class="btn btn-ghost" onclick="closeModal()">กลับไปกรอกต่อ</button><button class="btn btn-danger" id="btnDiscard" onclick="closeModal(); closeDrawer(true)">ทิ้งข้อมูล</button>`);
  }
  return '';
}
function openModalCfg(cfg){ S.md = cfg; state.modal.open = true; render(); requestAnimationFrame(() => document.getElementById('modalBackdrop').classList.add('is-open')); }
function closeModal(){ if (typeof bdClose === 'function') bdClose(true); document.getElementById('modalBackdrop').classList.remove('is-open'); state.modal.open = false; setTimeout(() => { if (!state.modal.open) S.md = null; }, 200); }
/* U25 · Rule #122 — backdrop ปิดด้วย mousedown ที่ backdrop เท่านั้น (ลากจากข้างในไปปล่อยนอก = ไม่ปิด) */
function modalBackdropDown(ev){ if (ev.target !== ev.currentTarget) return; if (S.md && (S.md.reason || S.md.kind === 'check')) return; closeModal(); }
function drawerBackdropDown(ev){ if (ev.target !== ev.currentTarget) return; closeDrawer(); }
function setReasonPreset(v){ S.md.preset = v; S.md.reason = v + (S.md.reason && S.md.reason.indexOf(v) !== 0 ? ' — ' + S.md.reason : ''); S.md.err = false; render(); }
function openCheck(id, cid){
  closeRowMenu(); const r = findR(id); if (!r || !canRecord(r)) { showToast('บันทึกผลตรวจได้เฉพาะใบที่ใช้งาน', 'warning'); return; }
  const c = cid ? r.checks.find(x => x.id === cid) : null;
  if (cid && (!c || !canEditCheck(r, c))) { showToast('แก้ไขได้เฉพาะแถวที่คุณบันทึกวันนี้', 'warning'); return; }
  openModalCfg({ kind:'check', id, cid:cid || null, date:c ? c.date : TODAY, marks:c ? { gauge:c.gauge, seal_pin:c.seal_pin, hose:c.hose, body:c.body } : blankMarks(), err:null });
}
function openCancel(id){ closeRowMenu(); openModalCfg({ kind:'cancel', id, reason:'' }); }
function pushAudit(r, act, note, tone){ const me = ME(), t = nowIso(); r.audit.push({ act, by:me.name, at:t, note:note || '', tone:tone || '' }); r.updatedBy = me.name; r.updatedAt = t; }
function confirmCheck(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  const err = {}; if (!m.date || m.date > TODAY) err.date = 1; else if (r.checks.some(x => x.date === m.date && x.id !== m.cid)) err.date = 'dup';
  const mk = {}; ITEMS.forEach(([k]) => { if (!m.marks[k]) mk[k] = 1; }); if (Object.keys(mk).length) err.marks = mk;
  if (Object.keys(err).length){ m.err = err; render(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    let c;
    if (m.cid){ c = r.checks.find(x => x.id === m.cid); Object.assign(c, { date:m.date }, m.marks); pushAudit(r, 'แก้ไขผลตรวจ', ckNote(c), isBad(c) ? 'bad' : 'ok'); }
    else { c = Object.assign({ id:'C' + Math.random().toString(36).slice(2, 8), date:m.date, by:S.me, at:nowIso() }, m.marks); r.checks.push(c); pushAudit(r, 'บันทึกผลตรวจ', ckNote(c), isBad(c) ? 'bad' : 'ok'); }
    S.busy = false; closeModal(); render();
    setTimeout(() => { showToast('บันทึกผลตรวจแล้ว · ' + r.code, 'success'); if (isBad(c)) setTimeout(() => notifyAbnormal(r, c), 900); }, 220); }, 500);
}
function confirmCancel(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (!(m.reason || '').trim()){ m.err = true; render(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    r.status = 'cancelled'; pushAudit(r, 'ยกเลิกใบตรวจ', m.reason.trim(), 'bad');   /* ntf fec_cancelled → role-mgr-wh */
    S.busy = false; closeModal(); render(); setTimeout(() => showToast('ยกเลิกใบตรวจแล้ว · ' + r.code, 'info'), 220); }, 500);
}

/* ===== RENDER + DRAWER ===== */
function render(){
