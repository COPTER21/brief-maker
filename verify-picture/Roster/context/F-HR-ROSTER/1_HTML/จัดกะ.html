}

// ============================================
// TOAST
// ============================================
function showToast(message, variant = 'info', durationMs = 2800) {
  const el = document.getElementById('toast');
  const iconMap = { success: 'check-circle-2', info: 'info', warning: 'alert-triangle', error: 'x-circle' };
  el.className = 'toast is-' + variant;
  el.innerHTML = `<i data-lucide="${iconMap[variant] || 'info'}" class="w-4 h-4"></i><span>${message}</span>`;
  renderIcons();
  requestAnimationFrame(() => el.classList.add('is-visible'));
  setTimeout(() => el.classList.remove('is-visible'), durationMs);
}

// ============================================
// ESC key handler (close drawer/modal)
// ============================================
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state.modal.open) closeModal();
    else if (state.drawer.open) closeDrawer();
  }
});

// ============================================
// RENDER (placeholder — replace per feature)
// ============================================
function render() {
  // Specific feature should override this function.
  //
  // ⚠️ Iron Rule #29 — Render Preservation:
  // If your render() does innerHTML rebuild (typical pattern), wrap with
  // withRenderPreservation() OR use preserveRenderState()/restoreRenderState()
  // to keep scroll position + focus across re-renders.
  //
  // Example:
  //   function render() {
  //     const snap = preserveRenderState();
  //     document.getElementById('page-content').innerHTML = renderPage();
  //     drawer.innerHTML = state.drawer.open ? renderDrawer() : '';
  //     renderIcons();
  //     restoreRenderState(snap);
  //   }
  //
  // After every DOM update, call renderIcons() — safe wrapper ที่ทน race เมื่อ Lucide ยังไม่ load.
  renderIcons();
}

// ============================================
// INIT
// ============================================
// Helper: safe icon render — กัน race ก่อน lucide load เสร็จ
function renderIcons() {
  if (window.lucide && typeof window.lucide.createIcons === 'function') {
    window.lucide.createIcons();
  }
}

// ============================================
// SEARCH-SELECT (Iron Rule #34) — generic searchable dropdown
// ------------------------------------------------
// ใช้แทน <select> เมื่อ options เยอะ (>8) หรือเป็น lookup จาก master อื่น.
// list = position:absolute overlay → ไม่ดันเนื้อหา. แก้เฉพาะ list ตอนพิมพ์ →
// ไม่ rebuild ทั้งหน้า (ไม่ชน Rule #29). decoupled — เรียก onSelect callback ไม่ผูก render().
//
// วิธีใช้ 2 ขั้น:
//   1) ใส่ markup:  ${searchSelectHTML('country', { placeholder: 'เลือกประเทศ' })}
//   2) หลัง markup อยู่ใน DOM แล้ว (เช่นท้าย render()):
//        initSearchSelect('country', {
//          options: countries.map(c => ({ value:c.code, label:c.name, sub:c.code, icon:'flag', right:'' })),
//          value: state.form.country,
//          onSelect: (val, opt) => { state.form.country = val; }
//        });
// option fields: { value, label, sub?, icon?, right? }
// ============================================
window.__ss = window.__ss || {};
function ssGet(key){ return window.__ss[key]; }
function ssEscapeReg(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function searchSelectHTML(key, opt){
  opt = opt || {};
  var ph = opt.placeholder || 'ค้นหา...';
  return ''
    + '<div class="search-select" id="ss-' + key + '">'
    +   '<i data-lucide="search" class="ss-lead w-4 h-4"></i>'
    +   '<input type="text" class="input ss-input" id="ss-input-' + key + '" autocomplete="off" placeholder="' + ph + '"'
    +     ' oninput="ssOnInput(\'' + key + '\', this.value)" onfocus="ssOpen(\'' + key + '\')" onkeydown="ssOnKey(\'' + key + '\', event)">'
    +   '<button type="button" class="ss-clear hidden" id="ss-clear-' + key + '" tabindex="-1" onclick="ssClear(\'' + key + '\')"><i data-lucide="x" class="w-4 h-4"></i></button>'
    +   '<i data-lucide="chevron-down" class="ss-caret" id="ss-caret-' + key + '"></i>'
    +   '<div class="ss-list hidden" id="ss-list-' + key + '"></div>'
    + '</div>';
}
function initSearchSelect(key, cfg){
  cfg = cfg || {};
  window.__ss[key] = {
    options: cfg.options || [], value: (cfg.value != null ? cfg.value : null),
    onSelect: cfg.onSelect || function(){}, emptyText: cfg.emptyText || 'ไม่พบรายการ',
    query: '', open: false, hi: 0
  };
  ssSetText(key); ssSyncChrome(key); renderIcons();
}
function ssFiltered(key){
  var s = ssGet(key); if(!s) return [];
  var q = (s.query || '').toLowerCase().trim();
  if(!q) return s.options;
  return s.options.filter(function(o){
    return String(o.label).toLowerCase().includes(q)
      || String(o.value).toLowerCase().includes(q)
      || String(o.sub || '').toLowerCase().includes(q);
  });
}
function ssSyncChrome(key){
  var s = ssGet(key); if(!s) return;
  var sel = s.options.find(function(o){ return o.value === s.value; });
  var c = document.getElementById('ss-clear-' + key); if(c) c.classList.toggle('hidden', !sel);
  var k = document.getElementById('ss-caret-' + key); if(k) k.classList.toggle('hidden', !!sel);
}
function ssSetText(key){
  var s = ssGet(key); if(!s) return;
  var input = document.getElementById('ss-input-' + key); if(!input) return;
  var sel = s.options.find(function(o){ return o.value === s.value; });
  input.value = s.open ? s.query : (sel ? sel.label : '');
}
function ssRenderList(key){
  var s = ssGet(key); if(!s) return;
  var list = document.getElementById('ss-list-' + key); if(!list) return;
  var items = ssFiltered(key);
  if(items.length === 0){
    list.innerHTML = '<div class="ss-empty">' + s.emptyText + '</div>';
  } else {
    var q = (s.query || '').toLowerCase().trim();
    var hl = function(t){ return q ? String(t).replace(new RegExp('(' + ssEscapeReg(q) + ')', 'gi'), '<mark>$1</mark>') : String(t); };
    list.innerHTML = items.map(function(o, i){
      return '<button type="button" class="ss-opt ' + (i === s.hi ? 'is-active' : '') + '" onmousedown="event.preventDefault()" onclick="ssPick(\'' + key + '\', ' + i + ')">'
        + (o.icon ? '<i data-lucide="' + o.icon + '" class="ss-opt-ic w-4 h-4"></i>' : '')
        + '<span class="ss-opt-main"><span class="ss-opt-label">' + hl(o.label) + '</span>'
        + (o.sub ? '<span class="ss-opt-sub">' + hl(o.sub) + '</span>' : '') + '</span>'
        + (o.right ? '<span class="ss-opt-right">' + o.right + '</span>' : '')
        + '</button>';
    }).join('');
  }
  list.classList.toggle('hidden', !s.open);
  renderIcons();
}
function ssOpen(key){ var s = ssGet(key); if(!s) return; s.open = true; s.query = ''; s.hi = 0; ssSetText(key); ssSyncChrome(key); ssRenderList(key); }
function ssOnInput(key, val){ var s = ssGet(key); if(!s) return; s.query = val; s.open = true; s.hi = 0; s.value = null; ssSyncChrome(key); ssRenderList(key); }
function ssPick(key, i){ var s = ssGet(key); if(!s) return; var o = ssFiltered(key)[i]; if(!o) return; s.value = o.value; s.query = ''; s.open = false; ssSetText(key); ssSyncChrome(key); ssRenderList(key); s.onSelect(o.value, o); }
function ssClear(key){ var s = ssGet(key); if(!s) return; s.value = null; s.query = ''; s.open = true; ssSetText(key); ssSyncChrome(key); ssRenderList(key); var inp = document.getElementById('ss-input-' + key); if(inp) inp.focus(); s.onSelect(null, null); }
function ssOnKey(key, e){
  var s = ssGet(key); if(!s) return; var items = ssFiltered(key);
  if(e.key === 'ArrowDown'){ e.preventDefault(); s.open = true; s.hi = Math.min(items.length - 1, s.hi + 1); ssRenderList(key); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); s.hi = Math.max(0, s.hi - 1); ssRenderList(key); }
  else if(e.key === 'Enter'){ e.preventDefault(); if(items[s.hi]) ssPick(key, s.hi); }
  else if(e.key === 'Escape'){ s.open = false; ssSetText(key); ssSyncChrome(key); ssRenderList(key); }
}
document.addEventListener('click', function(e){
  Object.keys(window.__ss || {}).forEach(function(key){
    var wrap = document.getElementById('ss-' + key); var s = ssGet(key);
    if(wrap && s && s.open && !wrap.contains(e.target)){ s.open = false; ssSetText(key); ssSyncChrome(key); ssRenderList(key); }
  });
});

// ============================================
// FORMAT HELPERS (Iron Rule #43) — Thai locale, consistent ทุก feature
// ใช้ตัวเหล่านี้เสมอ ห้าม format ตัวเลข/วันที่เองรายจุด
// ============================================
function fmtNumber(n, dp){ if(n==null||n==='')return '—'; var x=Number(n); if(isNaN(x))return String(n);
  return x.toLocaleString('th-TH', {minimumFractionDigits: dp||0, maximumFractionDigits: dp!=null?dp:2}); }
function fmtMoney(n, dp){ if(n==null||n==='')return '—'; var x=Number(n); if(isNaN(x))return String(n);
  return '฿' + x.toLocaleString('th-TH', {minimumFractionDigits: dp!=null?dp:2, maximumFractionDigits: dp!=null?dp:2}); }
function fmtDate(iso, buddhist){ if(!iso)return '—'; var d=new Date(iso); if(isNaN(d))return String(iso);
  var s=d.toLocaleDateString('th-TH', {year:'numeric', month:'short', day:'numeric'});
  return buddhist===false ? d.toLocaleDateString('en-GB',{year:'numeric',month:'short',day:'numeric'}) : s; }
function fmtDateTime(iso){ if(!iso)return '—'; var d=new Date(iso); if(isNaN(d))return String(iso);
  return d.toLocaleString('th-TH', {year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }

// ============================================
// INLINE VALIDATION (Iron Rule #43) — validate ตอน blur, ไม่ใช่รอ submit อย่างเดียว
// markup: <div class="field"><input class="input" onblur="validateField(this, v => v.trim()? '' : 'จำเป็นต้องกรอก')">
//          <div class="field-error"></div></div>
// validator คืน '' = ผ่าน / ข้อความ = error
// ============================================
function validateField(el, validator){
  var field = el.closest('.field'); if(!field) return true;
  var msg = '';
  try { msg = validator ? validator(el.value, el) : ''; } catch(e){ msg=''; }
  var errEl = field.querySelector('.field-error');
  if(msg){ field.classList.add('is-invalid'); if(errEl) errEl.textContent = msg; return false; }
  field.classList.remove('is-invalid'); return true;
}
function clearFieldError(el){ var f=el.closest('.field'); if(f) f.classList.remove('is-invalid'); }

// ============================================
// EMPTY STATE (Iron Rule #39) — list/section ว่าง ต้องมี icon + title + desc + (action)
// ============================================
function emptyStateHTML(cfg){
  cfg = cfg || {};
  var act = cfg.actionLabel ? '<button class="btn btn-primary" onclick="' + (cfg.onAction||'') + '">' +
    (cfg.actionIcon ? '<i data-lucide="' + cfg.actionIcon + '" class="w-4 h-4"></i>' : '') +
    '<span>' + cfg.actionLabel + '</span></button>' : '';
  return '<div class="empty">'
    + '<div class="empty-icon"><i data-lucide="' + (cfg.icon||'inbox') + '"></i></div>'
    + '<div class="empty-title">' + (cfg.title||'ยังไม่มีข้อมูล') + '</div>'
    + '<div class="empty-desc">' + (cfg.desc||'') + '</div>'
    + act + '</div>';
}

// ============================================
// RENDER PRESERVATION (Iron Rule #29)
// ------------------------------------------------
// ทุกครั้งที่ render() ทำ innerHTML = ... full DOM rebuild
// scroll position + focus + cursor selection จะหาย —
// user รู้สึก "เด้งกลับบน" ทุกครั้งที่ toggle/click.
//
// withRenderPreservation(renderFn) wraps a render function
// to save state before innerHTML rebuild, then restore after.
//
// Preserves:
//   - scrollTop ของ .drawer-body
//   - scrollTop ของ .modal-body
//   - window.scrollY (page-level scroll)
//   - document.activeElement focus + selection range (input/textarea ที่กำลังพิมพ์)
//
// Usage:
//   const render = withRenderPreservation(function actualRender() {
//     content.innerHTML = ...
//   });
//
// หรือเรียกตรง ๆ ใน render() ที่มีอยู่แล้ว:
//   function render() {
//     const snapshot = preserveRenderState();
//     // ... innerHTML rebuilds ...
//     restoreRenderState(snapshot);
//   }
// ============================================
function preserveRenderState() {
  const drawerBody = document.querySelector('.drawer-body');
  const modalBody = document.querySelector('.modal-body');
  const activeEl = document.activeElement;
  const isInput = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA');
  return {
    drawerScroll: drawerBody ? drawerBody.scrollTop : 0,
    modalScroll: modalBody ? modalBody.scrollTop : 0,
    pageScroll: window.scrollY,
    focusKey: isInput ? {
      placeholder: activeEl.placeholder || '',
      type: activeEl.type || '',
      name: activeEl.name || '',
      selStart: activeEl.selectionStart,
      selEnd: activeEl.selectionEnd,
    } : null,
  };
}
function restoreRenderState(snap) {
  if (!snap) return;
  requestAnimationFrame(function() {
    const dBody = document.querySelector('.drawer-body');
    if (dBody && snap.drawerScroll > 0) dBody.scrollTop = snap.drawerScroll;
    const mBody = document.querySelector('.modal-body');
    if (mBody && snap.modalScroll > 0) mBody.scrollTop = snap.modalScroll;
    if (snap.pageScroll > 0) window.scrollTo(0, snap.pageScroll);

    if (snap.focusKey) {
      const candidates = document.querySelectorAll('input, textarea');
      for (let i = 0; i < candidates.length; i++) {
        const c = candidates[i];
        if ((c.placeholder || '') === snap.focusKey.placeholder
            && (c.type || '') === snap.focusKey.type
            && (c.name || '') === snap.focusKey.name) {
          c.focus();
          if (snap.focusKey.selStart != null && typeof c.setSelectionRange === 'function') {
            try { c.setSelectionRange(snap.focusKey.selStart, snap.focusKey.selEnd); } catch(e) {}
          }
          break;
        }
      }
    }
  });
}
function withRenderPreservation(renderFn) {
  return function preservedRender() {
    const snap = preserveRenderState();
    const result = renderFn.apply(this, arguments);
    restoreRenderState(snap);
    return result;
  };
}

window.addEventListener('hashchange', function () { render(); });  // v6.1 late-binding — ให้ชี้ render() ตัวที่ feature override (ผูกตรง ๆ จะ capture placeholder เดิม)

// รอ DOM + Lucide ทั้งคู่ก่อน first render
// (Lucide loader จะ dispatch 'lucide:ready' เมื่อ load สำเร็จ

window.addEventListener('lucide:ready', function() { lucideReady = true; bootIfReady(); });

setTimeout(function() {

    console.warn('[Lucide] Timeout — rendering without icons');
    lucideReady = true;
    bootIfReady();
  }

function portalMenu(trigger, menu){
  let host = document.getElementById('overlay-root');
  if(!host){ host = document.createElement('div'); host.id='overlay-root'; document.body.appendChild(host); }
  if(menu.parentElement !== host) host.appendChild(menu);
  menu.classList.add('menu-fixed');
  const r = trigger.getBoundingClientRect();
  const below = window.innerHeight - r.bottom - 12, above = r.top - 12;
  const h = Math.min(menu.scrollHeight || 320, 320);
  menu.style.left = r.left + 'px';
  menu.style.width = r.width + 'px';
  if(below < h && above > below){ menu.style.top='auto'; menu.style.bottom=(window.innerHeight-r.top+4)+'px';
    menu.style.maxHeight = Math.min(h, above)+'px'; }
  else { menu.style.bottom='auto'; menu.style.top=(r.bottom+4)+'px';
    menu.style.maxHeight = Math.min(h, Math.max(below,120))+'px'; }
  menu._trigger = trigger;
  const reposition = ()=>{ if(menu.classList.contains('open')) portalMenu(trigger, menu); };
  if(!menu._portalBound){ menu._portalBound = true;
    window.addEventListener('scroll', reposition, true);
    window.addEventListener('resize', reposition); }
}
function positionMenu(trigger,menu){const r=trigger.getBoundingClientRect();
  const below=window.innerHeight-r.bottom-12, above=r.top-12, h=Math.min(menu.scrollHeight,320);

function openOverlay(menu,trigger){document.querySelectorAll('[data-overlay].open').forEach(m=>{if(m!==menu)closeOverlay(m);});
  menu.classList.add('open');menu._trigger=trigger;if(trigger)positionMenu(trigger,menu);}
function closeOverlay(menu){menu.classList.remove('open');if(menu._trigger)menu._trigger.focus();}
document.addEventListener('click',e=>{document.querySelectorAll('[data-overlay].open').forEach(m=>{
  if(!m.contains(e.target)&&!(m._trigger&&m._trigger.contains(e.target)))closeOverlay(m);});});
/* ===== END BASE-KIT UTILS ===== */

<script>
/* ============================================================
   roster-conflict-engine — ตัวตรวจข้อขัดแย้งของตาราง (engine candidate)
   ทั้งการแก้ด้วยมือและการสลับกะเรียกตัวเดียวกัน — ห้าม re-implement ที่อื่น (BR-22)
   ค่ากฎหมายทุกตัวอ่านจาก SHIFT_RULE เท่านั้น · ไม่มีค่าให้อ่าน = ไม่ตรวจกฎนั้น (BR-11)
   ============================================================ */

/* ---- วันที่ ---- */
function beYear(y) { return (+y) + 543; }
function dTH(d) { if (!d) return '—'; const p = d.split('-'); return (+p[2]) + ' ' + TH_MON[+p[1] - 1] + ' ' + beYear(p[0]); }
function dTHs(d) { if (!d) return '—'; const p = d.split('-'); return (+p[2]) + ' ' + TH_MON[+p[1] - 1]; }
function monthTH(m) { const p = m.split('-'); return TH_MON_FULL[+p[1] - 1] + ' ' + beYear(p[0]); }
function monthTHs(m) { const p = m.split('-'); return TH_MON[+p[1] - 1] + ' ' + beYear(p[0]); }
function addMonth(m, k) { const p = m.split('-'); let y = +p[0], mo = +p[1] + k; while (mo > 12) { mo -= 12; y++; } while (mo < 1) { mo += 12; y--; } return y + '-' + String(mo).padStart(2, '0'); }
function mins(t) { const p = String(t).split(':'); return (+p[0]) * 60 + (+p[1]); }
function dnum(d) { const p = d.split('-'); return Math.floor(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 86400000); }
function nH(x) { return (Math.round(x * 100) / 100).toFixed(2); }
function monthDates(m) { const n = daysInMonth(m), p = m.split('-'), out = []; for (let d = 1; d <= n; d++) out.push(dstr(+p[0], +p[1], d)); return out; }
function holOf(d) { return HOLIDAYS[d] || null; }

/* ---- สภาพการทำงาน = เวอร์ชันที่เผยแพร่แล้ว + การแก้ที่ยังไม่ได้เผยแพร่ ---- */
function pendOf(emp, d) { for (let i = 0; i < PEND.length; i++) if (PEND[i].emp === emp && PEND[i].d === d) return PEND[i]; return null; }
function workCell(emp, d) { const p = pendOf(emp, d); if (p) return p.to.map(function (c) { return sc(c, ((cellOf(emp, d)[0] || {}).note) || ''); }); return cellOf(emp, d); }
function workCells(month) {
  const out = {};
  ROSTER_MEMBERS.forEach(function (emp) {
    out[emp] = {};
    monthDates(month).forEach(function (d) { const a = workCell(emp, d); if (a && a.length) out[emp][d] = a; });
  });
  return out;
}

/* ---- ช่วงเวลาจริงบนเส้นเวลา (กะข้ามคืนผูกกับวันเข้ากะ — LD-01) ---- */
function ivalsOf(codes, d) {
  const base = dnum(d) * 1440, out = [];
  (codes || []).forEach(function (x) {
    const s = shiftOf(x.c || x); if (!s) return;
    let a = base + mins(s.s), b = base + mins(s.e);
    if (s.ov || b <= a) b += 1440;
    out.push({ d: d, s: s, a: a, b: b });
  });
  return out;
}

/* ---- ตัวตรวจ ---- */
function engineRun(month, cells) {
  const res = { list: [], byCell: {}, skipped: [], weeks: {} };
  function push(o) {
    res.list.push(o);
    o.cells.forEach(function (cc) { const k = cc.emp + '|' + cc.d; (res.byCell[k] = res.byCell[k] || []).push(o); });
  }
  const dates = monthDates(month);
  ROSTER_MEMBERS.forEach(function (emp) {
    const own = cells[emp] || {};
    const all = [];
    dates.forEach(function (d) { ivalsOf(own[d], d).forEach(function (iv) { all.push(iv); }); });
    all.sort(function (x, y) { return x.a - y.a || x.b - y.b; });

    /* 1) ทับช่วงเวลากัน — ในวันเดียวกันหรือคาบเกี่ยวข้ามคืน (ระดับห้าม)
          สิ่งที่ห้ามคือ "ช่วงเวลาทับกัน" ไม่ใช่ "มีสองกะในวันเดียว" (BR-07 · BR-31) */
    for (let i = 0; i < all.length - 1; i++) {
      const A = all[i], B = all[i + 1];
      if (B.a < A.b) {
        const same = A.d === B.d;
        push({
          emp: emp, d: B.d, lv: 'block', k: same ? 'overlap' : 'overnight_overlap',
          t: same ? 'สองกะทับช่วงเวลากันในวันเดียว' : 'กะข้ามคืนคาบเกี่ยวกะของวันถัดไป',
          m: A.s.n + ' ' + A.s.s + '–' + A.s.e + ' (' + dTHs(A.d) + ') ทับกับ ' + B.s.n + ' ' + B.s.s + '–' + B.s.e + ' (' + dTHs(B.d) + ')',
          cells: [{ emp: emp, d: A.d }, { emp: emp, d: B.d }]
        });
      } else if (SHIFT_RULE.min_rest_hours.v != null && (B.a - A.b) < SHIFT_RULE.min_rest_hours.v * 60) {
        push({
          emp: emp, d: B.d, lv: 'block', k: 'insufficient_rest', t: 'ช่วงพักระหว่างกะต่ำกว่าเกณฑ์',
          m: 'พักได้ ' + nH((B.a - A.b) / 60) + ' ชม.', cells: [{ emp: emp, d: A.d }, { emp: emp, d: B.d }]
        });
      }
    }

    /* 2) ลงกะทับวันลาที่อนุมัติแล้ว (ระดับห้าม) · วันหยุดตามปฏิทิน (ระดับเตือน) */
    dates.forEach(function (d) {
      if (!own[d] || !own[d].length) return;
      const lv = leaveOf(emp, d);
      if (lv) push({ emp: emp, d: d, lv: 'block', k: 'on_leave', t: 'ลงกะทับวันลาที่อนุมัติแล้ว', m: 'ใบลา ' + lv.no + ' · ' + lv.t, ref: lv, cells: [{ emp: emp, d: d }] });
      const h = holOf(d);
      if (h) push({ emp: emp, d: d, lv: 'warn', k: 'public_holiday', t: 'ลงกะในวันหยุดตามปฏิทิน', m: h.n + ' — ทำงานได้แต่ต้องเห็น', cells: [{ emp: emp, d: d }] });
      const e = empOf(emp);
      if (e.out && d > e.out) push({ emp: emp, d: d, lv: 'block', k: 'after_exit', t: 'ลงกะหลังวันสุดท้ายของพนักงาน', m: 'วันสุดท้าย ' + dTH(e.out), cells: [{ emp: emp, d: d }] });
    });

    /* 3) ชั่วโมงสะสมรายสัปดาห์ (ชั่วโมงตามแผน ไม่ใช่ชั่วโมงจริง) */
    const wk = {};
    dates.forEach(function (d) {
      const key = weekKey(d);
      wk[key] = wk[key] || { h: 0, days: 0 };
      const a = own[d] || [];
      if (a.length) { wk[key].days++; a.forEach(function (x) { const s = shiftOf(x.c || x); if (s) wk[key].h += s.h; }); }
    });
    res.weeks[emp] = wk;
    if (SHIFT_RULE.max_hours_week.v != null) {
      Object.keys(wk).forEach(function (key) {
        if (wk[key].h > SHIFT_RULE.max_hours_week.v) push({ emp: emp, d: key, lv: 'warn', k: 'over_weekly_hours', t: 'ชั่วโมงสะสมของสัปดาห์เกินเพดาน', m: nH(wk[key].h) + ' ชม.', cells: [] });
      });
    }
    /* 4) วันทำงานติดกัน */
    if (SHIFT_RULE.max_consecutive_days.v != null) {
      let run = 0, startD = null;
      dates.forEach(function (d) {
        if ((own[d] || []).length) { if (!run) startD = d; run++; if (run > SHIFT_RULE.max_consecutive_days.v) push({ emp: emp, d: d, lv: 'warn', k: 'over_consecutive_days', t: 'วันทำงานติดกันเกินเกณฑ์', m: 'ตั้งแต่ ' + dTHs(startD), cells: [{ emp: emp, d: d }] }); }
        else run = 0;
      });
    }
  });
  /* 5) กฎที่ยังไม่มีค่าให้อ่าน — ไม่ตรวจ และไม่เดาตัวเลข */
  ['min_rest_hours', 'max_hours_week', 'max_consecutive_days', 'freeze_days'].forEach(function (k) {
    if (SHIFT_RULE[k].v == null) res.skipped.push({ k: k, n: SHIFT_RULE[k].n, lv: SHIFT_RULE[k].lv, fn: SHIFT_RULE[k].fn });
  });
  res.list.sort(function (a, b) { return (a.lv === b.lv ? 0 : a.lv === 'block' ? -1 : 1) || 0; });
  return res;
}
function weekKey(d) { const n = dnum(d); const mon = n - ((n + 3) % 7); return 'W' + mon; }
function weekLabel(key) { const mon = +key.slice(1); const a = new Date(mon * 86400000), b = new Date((mon + 6) * 86400000); const f = function (x) { return x.getUTCDate() + ' ' + TH_MON[x.getUTCMonth()]; }; return f(a) + ' – ' + f(b); }

let ENG = null;
function engine() { return ENG; }
function runEngine() { ENG = engineRun(state.month, workCells(state.month)); return ENG; }
function cellConf(emp, d) { return (ENG && ENG.byCell[emp + '|' + d]) || []; }
function cellLevel(emp, d) { const c = cellConf(emp, d); for (let i = 0; i < c.length; i++) if (c[i].lv === 'block') return 'block'; return c.length ? 'warn' : ''; }
function blockCount() { return ENG ? ENG.list.filter(function (c) { return c.lv === 'block'; }).length : 0; }
function warnList() { return ENG ? ENG.list.filter(function (c) { return c.lv === 'warn'; }) : []; }

/* ---- สรุปของตาราง (ข้อเท็จจริงของตาราง — ไม่ใช่ตัวชี้วัดว่าคนพอ/ไม่พอ) ---- */
function plannedHours(emp, month) {
  let h = 0; monthDates(month).forEach(function (d) { workCell(emp, d).forEach(function (x) { const s = shiftOf(x.c); if (s) h += s.h; }); }); return h;
}
function shiftDays(emp, month) { let n = 0; monthDates(month).forEach(function (d) { if (workCell(emp, d).length) n++; }); return n; }
function gridStats(month) {
  const ds = monthDates(month); let filled = 0, empty = 0;
  visibleMembers().forEach(function (emp) { ds.forEach(function (d) { if (workCell(emp, d).length) filled++; else empty++; }); });
  return { filled: filled, empty: empty, block: blockCount(), warn: warnList().length, ack: ROSTER_MEMBERS.filter(function (e) { return (ACK[e] || {}).st !== 'ack'; }).length };
}

/* ---- ตรวจก่อนเผยแพร่ : วันที่ปลายทางบริโภคไปแล้ว → ปฏิเสธเฉพาะวันนั้น ---- */
function publishPlan(month) {
  const ok = [], rejected = [];
  PEND.filter(function (p) { return p.d.slice(0, 7) === month; }).forEach(function (p) {
    if (dayEditable(p.d)) ok.push(p); else rejected.push(Object.assign({}, p, { why2: dayLockReason(p.d) }));
  });
  const days = {}; rejected.forEach(function (r) { (days[r.d] = days[r.d] || []).push(r); });
  return { ok: ok, rejected: rejected, rejectedDays: Object.keys(days).sort(), byDay: days };
}
function changedEmployees(list) { const s = {}; list.forEach(function (p) { s[p.emp] = true; }); return Object.keys(s); }

/* ---- ตรวจผลของการสลับกะด้วยตัวตรวจชุดเดียวกับการแก้ด้วยมือ (BR-22) ---- */
function swapPreviewCells(sw) {
  const month = sw.rd.slice(0, 7);
  const base = workCells(month);
  const cp = JSON.parse(JSON.stringify(base));
  const rqOld = (cp[sw.rq] && cp[sw.rq][sw.rd]) || [];
  const cpOld = (cp[sw.cp] && cp[sw.cp][sw.cd]) || [];
  cp[sw.rq] = cp[sw.rq] || {}; cp[sw.cp] = cp[sw.cp] || {};
  delete cp[sw.rq][sw.rd]; delete cp[sw.cp][sw.cd];
  cp[sw.cp][sw.rd] = (cp[sw.cp][sw.rd] || []).concat(rqOld);
  cp[sw.rq][sw.cd] = (cp[sw.rq][sw.cd] || []).concat(cpOld);
  return { month: month, before: base, after: cp };
}
function validateSwap(sw) {
  const pv = swapPreviewCells(sw);
  const b = engineRun(pv.month, pv.before), a = engineRun(pv.month, pv.after);
  const key = function (c) { return c.emp + '|' + c.d + '|' + c.k; };
  const had = {}; b.list.forEach(function (c) { had[key(c)] = true; });
  const two = [sw.rq, sw.cp];
  const fresh = a.list.filter(function (c) { return !had[key(c)] && two.indexOf(c.emp) >= 0; });
  return {
    block: fresh.filter(function (c) { return c.lv === 'block'; }),
    warn: fresh.filter(function (c) { return c.lv === 'warn'; }),
    skipped: a.skipped
  };
}
function swapBlocked(sw) { return validateSwap(sw).block.length > 0; }

/* ---- ผู้ยืนยัน = หัวหน้าสายบังคับบัญชาของผู้ขอ จาก Policy Center (ไม่ใช่สายอนุมัติ · ไม่ hardcode ชื่อ) ---- */
function confirmerOf(sw) { return empOf(sw.rq).sup; }
function canConfirmSwap(sw) { return P().emp === confirmerOf(sw); }

/* ---- read model ที่เผยแพร่ (คืนเฉพาะเวอร์ชัน published ปัจจุบัน · ไม่มีกะ = คืนค่าว่าง) ---- */
function resolveShiftForDay(emp, d) {
  const m = d.slice(0, 7), v = verOf(m);
  if (!state.link.attendance) return { linked: false, shift: null, rv: null };
  if (!v || v.st !== 'published') return { linked: true, shift: null, rv: null };
  const a = cellOf(emp, d);
  if (!a.length) return { linked: true, shift: null, rv: v.id };
  const s = shiftOf(a[0].c);
  return { linked: true, rv: v.id, spv: a[0].spv, shift: { shift_code: s.c, shift_name: s.n, start_time: s.s, end_time: s.e, is_overnight: s.ov, break_from: s.bf, break_to: s.bt, work_days: s.wd } };

<script>

<script>

function guardCell(emp, d) {
  if (!canPlan()) { showToast('บทบาทนี้แก้ตารางไม่ได้', 'warning'); return false; }
  if (!dayEditable(d)) { showToast(dTH(d) + ' — ' + dayLockReason(d) + ' จึงแก้กะของวันนี้ไม่ได้', 'warning'); return false; }
  const e = empOf(emp);
  if (e.out && d > e.out) { showToast(e.n + ' มีวันสุดท้าย ' + dTH(e.out) + ' — ลงกะหลังวันนั้นไม่ได้', 'warning'); return false; }
  return true;
}
function setPend(emp, d, codes) {
  const before = cellOf(emp, d).map(function (x) { return x.c; });
  const idx = PEND.findIndex(function (p) { return p.emp === emp && p.d === d; });
  if (JSON.stringify(before) === JSON.stringify(codes)) { if (idx >= 0) PEND.splice(idx, 1); }
  else if (idx >= 0) PEND[idx].to = codes.slice();
  else PEND.push({ emp: emp, d: d, from: before, to: codes.slice(), why: '' });
}
function applyShift(emp, d, code) {
  if (!guardCell(emp, d)) return;
  const cur = workCell(emp, d).map(function (x) { return x.c; });
  let next;
  if (code === '_') next = [];
  else if (cur.indexOf(code) >= 0) next = cur.slice();
  else if (cur.length === 1 && shiftOf(cur[0]) && shiftOf(code)) next = [code];
  else next = [code];
  setPend(emp, d, next);
  pushAudit('edit', 'เปลี่ยนกะในช่อง', empOf(emp).n + ' · ' + dTH(d) + ' · จาก ' + (cur.length ? cur.join('+') : 'ไม่มีกะ') + ' เป็น ' + (next.length ? next.join('+') : 'ไม่มีกะ'));
  runEngine(); render();
  showToast(empOf(emp).n + ' · ' + dTH(d) + ' → ' + (next.length ? cellText(next) : 'ไม่มีกะ'), 'success');
}
function addSplit(emp, d, code) {
  if (!guardCell(emp, d)) return;
  const cur = workCell(emp, d).map(function (x) { return x.c; });
  if (cur.indexOf(code) >= 0) { showToast('ช่องนี้มีกะนี้อยู่แล้ว', 'warning'); return; }
  setPend(emp, d, cur.concat([code]));
  pushAudit('edit', 'เพิ่มกะแยกช่วงในวันเดียว', empOf(emp).n + ' · ' + dTH(d) + ' · ' + cur.concat([code]).join(' + '));
  runEngine(); render();
  showToast('เพิ่มกะแยกช่วงแล้ว — ช่วงว่างระหว่างสองกะยังถูกวัดเป็นช่วงพักและนับเข้าชั่วโมงสัปดาห์', 'success');
}

    paintRange(state.paint.a, { emp: emp, d: d });

function paintRange(a, b) {
  const mem = visibleMembers(), ds = monthDates(state.month);

  const r1 = Math.min(i1, i2), r2 = Math.max(i1, i2), c1 = Math.min(j1, j2), c2 = Math.max(j1, j2);
  let n = 0, skip = 0;
  for (let i = r1; i <= r2; i++) for (let j = c1; j <= c2; j++) {
    const emp = mem[i], d = ds[j];
    if (!dayEditable(d)) { skip++; continue; }
    const e = empOf(emp); if (e.out && d > e.out) { skip++; continue; }
    setPend(emp, d, state.tool === '_' ? [] : [state.tool]); n++;

function setCellNote(v) { state.dw.form.note = v; }
function saveCellNote() {

  (CELLS[f.emp][f.d] || []).forEach(function (x, i) { if (i === 0) x.note = note; });
  pushAudit('note', 'ฝากหมายเหตุไว้กับช่อง', empOf(f.emp).n + ' · ' + dTH(f.d) + ' · ' + (note || '(ล้างหมายเหตุ)'));
  render(); showToast('บันทึกหมายเหตุแล้ว — หมายเหตุแสดงบนตารางที่เผยแพร่และเข้าประวัติ', 'success');

function doAck(kind, msg) {

function pubCalendar(plan) {

function doPublish() {

}
function setGen(k, v) { state.dw.form[k] = v; render(); }
function doGenerate() {
  const f = state.dw.form;
  if (f.kind === 'copy') {
    const src = f.from;
    if (!monthDates(src).some(function (d) { return ROSTER_MEMBERS.some(function (e) { return cellOf(e, d).length; }); })) {
      showToast('เดือนต้นทางยังไม่มีตาราง — เลือกเดือนอื่นหรือกางจากแพทเทิร์นกะแทน', 'warning'); return;
    }
  }
  if (!CFG_VER.shift_pattern) { showToast('resolve แพทเทิร์นกะจาก ตั้งค่า HR ไม่สำเร็จ — กางตารางไม่ได้', 'error'); return; }
  monthDates(state.month).forEach(function (d) { ROSTER_MEMBERS.forEach(function (e) { putCell(e, d, []); }); });
  if (f.kind === 'copy') {
    const src = f.from, n = Math.min(daysInMonth(src), daysInMonth(state.month));
    const p = state.month.split('-');
    for (let i = 1; i <= n; i++) {
      const sd = dstr(+src.split('-')[0], +src.split('-')[1], i), td = dstr(+p[0], +p[1], i);
      ROSTER_MEMBERS.forEach(function (e) {
        const em = empOf(e); if (em.out && td > em.out) return;
        const a = cellOf(e, sd); if (a.length) putCell(e, td, a.map(function (x) { return sc(x.c); }));
      });
    }
  } else {
    const seq = f.seq.split(',').map(function (x) { return x.trim(); }).filter(function (x) { return shiftOf(x); });
    seedMonth(state.month, { cycle: f.kind === 'rotate' ? Math.max(1, +f.cycle) : 1, seq: seq.length ? seq : ROT });
  }
  const nv = 'RV-' + String(RVER.length + 1).padStart(4, '0');
  RVER.push({ id: nv, m: state.month, v: 1, st: 'draft', by: P().emp, at: nowStr(), note: '', sup: null, supBy: null });
  pushAudit('gen', 'กางตาราง ' + monthTH(state.month) + (f.kind === 'copy' ? ' โดยคัดลอกจาก ' + monthTH(f.from) : f.kind === 'rotate' ? ' แบบกะหมุนตามรอบ ' + f.seq + ' ทุก ' + f.cycle + ' สัปดาห์' : ' จากแพทเทิร์นกะ'),
    'ค่านโยบายถูก resolve ใหม่ตามวันของเดือนปลายทาง · เวอร์ชัน ' + CFG_VER.shift_pattern + ' · ' + CFG_VER.holiday + ' · ' + CFG_VER.period);
  closeDrawer(); runEngine(); render();
  showToast('ได้ตารางร่างของ ' + monthTH(state.month) + ' แล้ว — ตัวตรวจข้อขัดแย้งรันให้ทันที', 'success');
}

    const on = !!state.link[l.k];
    const ro = l.k === 'ess';
    return '<div class="lk-row"><span class="cf-ic" style="background:var(--c-line-3);color:var(--c-mute)"><i data-lucide="' + l.i + '" class="w-4 h-4"></i></span>'
      + '<div class="min0"><div class="cfg-k">' + l.n + '</div><div class="cfg-m">' + l.d + '</div></div>'
      + '<span class="mla rowgap">' + (on ? '<span class="pill pill-success">เชื่อมแล้ว</span>' : '<span class="pill pill-muted">ยังไม่เชื่อม</span>')
      + '<button type="button" class="sw' + (on ? ' on' : '') + (ro ? ' is-ro' : '') + '" ' + (ro ? 'disabled' : 'onclick="toggleLink(\'' + l.k + '\')"') + '><span class="sw-box"></span></button></span></div>';
  }).join('');
  const rm = readModelRows().map(function (x) {
    const s = x.r.shift;
    const outcome = !x.r.linked ? '<span class="pill pill-muted">ยังไม่เชื่อม</span>'
      : s ? '<span class="pill pill-success">ส่งกะจริง</span>' : '<span class="pill pill-archived">คืนค่าว่าง</span>';
    return '<tr><td>' + personCell(x.e) + '</td><td class="tnum">' + x.d + '</td>'
      + '<td>' + (s ? '<span class="cell-main">' + s.shift_code + ' · ' + s.shift_name + '</span>' : '<span class="text-mute-2">null</span>') + '</td>'
      + '<td class="tnum">' + (s ? s.start_time + '–' + s.end_time : '—') + '</td>'
      + '<td>' + (s ? (s.is_overnight ? 'จริง' : 'เท็จ') : '—') + '</td>'
      + '<td class="tnum">' + (s && s.break_from ? s.break_from + '–' + s.break_to : '—') + '</td>'
      + '<td class="tnum">' + (s ? s.work_days.join(',') : '—') + '</td>'
      + '<td class="tnum">' + (x.r.rv || '—') + '</td>'
      + '<td class="tnum">' + (x.r.spv || '—') + '</td>'
      + '<td>' + outcome + '</td></tr>';
  }).join('');
  const wu = WHEREUSED.map(function (w) {
    return '<tr><td>' + w.src + '</td><td>' + w.g + '</td><td>' + (w.v == null ? noVal() : '<span class="tnum">' + w.v + '</span>') + '</td><td>' + w.use + '</td></tr>';
  }).join('');
  const so = SCOPE_OUT.map(function (s, i) {
    return '<tr><td class="tnum">' + (i + 1) + '</td><td><span class="cell-main">' + s.t + '</span></td><td>' + s.w + '</td><td>' + s.o + '</td><td class="tnum">' + s.q + '</td></tr>';
  }).join('');
  return SEC('unplug', 'การเชื่อมโมดูลปลายทาง', 'สวิตช์เปลี่ยนพฤติกรรมจริง ไม่ใช่ป้ายแสดงผล', linkRows)
    + SEC('share-2', 'สิ่งที่ จัดกะ เผยแพร่ให้ปลายทางอ่าน', 'เฉพาะเวอร์ชันที่เผยแพร่แล้วตัวปัจจุบัน',
      '<div class="tbl-x"><table class="table rm-tbl"><thead><tr>'
      + '<th>พนักงาน</th><th>วันของกะ</th><th>กะ</th><th>เวลาเข้า–ออก</th><th>ข้ามวัน</th><th>ช่วงพัก</th><th>วันทำงานในสัปดาห์</th><th>เวอร์ชันตาราง</th><th>เวอร์ชันแพทเทิร์นกะ</th><th>ผลที่ปลายทางได้</th>'
      + '</tr></thead><tbody>' + rm + '</tbody></table></div>'
      + '<div class="rowgap mtop"><span class="cfg-m">ไม่มีกะของ (คน × วัน) นั้น → คืนค่าว่าง เพื่อให้ เวลาเข้างาน ตกไปใช้กะมาตรฐานของตัวเองตามที่มันออกแบบไว้ — ที่นี่ไม่เดากะและไม่ส่งกะมาตรฐานแทน</span></div>'
      + '<div class="rowgap mtop">' + attLink('') + otLink('') + '</div>')
    + SEC('shield-off', 'สิ่งที่ จัดกะ ไม่ทำให้ปลายทาง', '',
      '<div class="cfg-row"><div class="min0"><div class="cfg-k">ไม่มีทางเข้าสำหรับการเขียนกลับ</div><div class="cfg-m">การแก้กะทำที่หน้าจอนี้เท่านั้น — ปลายทางใช้ลิงก์ “จัดการที่ จัดกะ” กลับมาแทน</div></div></div>'
      + '<div class="cfg-row"><div class="min0"><div class="cfg-k">ไม่คำนวณ สาย · ขาด · ชั่วโมงทำงานจริง</div><div class="cfg-m">ชั่วโมงในตารางเป็นชั่วโมงตามแผนเท่านั้น ห้ามใช้แทนชั่วโมงจริงและห้ามคูณเป็นเงิน</div></div>'
      + '<span class="mla"><span class="fl f-mute"><i data-lucide="clock" class="w-3 h-3"></i>ชั่วโมงตามแผน</span></span></div>'
      + '<div class="cfg-row"><div class="min0"><div class="cfg-k">ไม่คิดชั่วโมงโอทีเอง และไม่ตีความตัวคูณเป็นเงิน</div><div class="cfg-m">อ่านใบโอทีเพื่อติดธงว่าวันนั้นมีใบเท่านั้น · ใบที่ถอนแล้วถือว่าไม่มีผล · “ไม่มีใบ” ไม่ได้แปลว่าไม่ได้ทำโอที</div></div></div>'
      + '<div class="cfg-row"><div class="min0"><div class="cfg-k">ไม่คำนวณวันลาเองและไม่เขียนกลับการลา</div><div class="cfg-m">อ่านวันลาที่อนุมัติแล้วเพื่อกันลงกะทับ</div></div></div>')
    + SEC('link-2', 'ค่าที่ จัดกะ ลงทะเบียนว่าใช้จากต้นทาง', WHEREUSED.length + ' รายการ',
      '<div class="tbl-x"><table class="mini-tbl nw-sm"><thead><tr><th>ต้นทาง</th><th>กลุ่มค่า</th><th>เวอร์ชันที่ใช้</th><th>ใช้ทำอะไร</th></tr></thead><tbody>' + wu + '</tbody></table></div>'
      + '<div class="rowgap mtop">' + cfgLink('shift_pattern', 'จัดการที่ ตั้งค่า HR') + '</div>')
    + SEC('list-x', 'ขอบเขตที่ตัดสินแล้วว่าไม่ทำในรอบนี้', SCOPE_OUT.length + ' เรื่อง',
      '<div class="tbl-x"><table class="table scope-tbl"><thead><tr><th>#</th><th>เรื่อง</th><th>ทำไมไม่ทำ</th><th>เจ้าของเรื่อง</th><th>คำถามที่รอเคาะ</th></tr></thead><tbody>' + so + '</tbody></table></div>');
}
</script>
<script>
/* ============================================================
   DRAWER + MODAL
   drawer มี tabs → .drawer-header.has-tabs + .tabs>.tab ของ kit เท่านั้น (#38.2)
   ไม่มีตัวช่วยสร้าง 5 ขั้น · ไม่มี tab เอกสาร PDF · ไม่มี tab ลายเซ็น · ไม่มีเลขที่เอกสาร
   ============================================================ */
/* ตัวสร้างหัว drawer ตัวเดียวของทั้งไฟล์ — มี tabs เมื่อไร ใส่ has-tabs ให้เองเสมอ
   จึงไม่มีทางเกิดกรณี drawer-header ที่มี .tabs แต่ลืม has-tabs (เส้น 2 ชั้น/ลอย · #38.2) */
function dwHead(eyebrow, title, sub, actions, tabs) {
  const tabsBlock = tabs ? '<div class="tabs">' + tabs + '</div>' : '';
  const openRow = tabs ? '<div class="dw-head-row">' : '';
  const closeRow = tabs ? '</div>' : '';
  return '<div class="drawer-header' + (tabs ? ' has-tabs' : '') + '">' + openRow + '<div class="min0">'
    + '<div class="dw-eyebrow">' + eyebrow + '</div>'
    + '<div class="dw-title">' + title + '</div>'
    + (sub ? '<div class="drawer-subtitle">' + sub + '</div>' : '')
    + '</div><div class="drawer-header-actions mla">' + (actions || '')
    + '<span class="drawer-header-divider"></span>'
    + '<button class="icon-btn" onclick="closeDrawer()"><i data-lucide="x" class="w-4 h-4"></i></button></div>'
    + closeRow + tabsBlock + '</div>';
}
function dwHeadTabs(eyebrow, title, sub, actions, tabs) { return dwHead(eyebrow, title, sub, actions, tabs); }
function dwFootClose(meta, right) {
  return '<div class="drawer-footer"><button class="btn btn-ghost" onclick="closeDrawer()">ปิด</button>'
    + '<span class="drawer-footer-meta">' + (meta || '') + '</span>'
    + '<span class="dw-footer-right">' + (right || '') + '</span></div>';
}

/* ---- ช่องในกริด ---- */
function cellBody(f) {
  const emp = f.emp, d = f.d;
  const arr = workCell(emp, d), conf = cellConf(emp, d), lvf = leaveOf(emp, d), ot = otOf(emp, d), h = holOf(d);
  const st = dayStatusOf(d), edit = dayEditable(d) && canPlan();
  const wk = (engine().weeks[emp] || {})[weekKey(d)] || { h: 0, days: 0 };
  const pn = pendOf(emp, d);
  const e = empOf(emp);
  COMBOS.push({ key: 'cell-shift', cfg: { options: shiftOptions(), value: arr.length ? arr[0].c : null, onSelect: function (v) { if (v) applyShift(emp, d, v); } } });
  state.dw.form = state.dw.form || { note: (arr[0] && arr[0].note) || '' };
  const flags = '<div class="rowgap">'
    + (arr.length ? arr.map(function (x) { return '<span class="fl f-ok">' + chipShift(x.c) + shiftText(x.c) + '</span>'; }).join('') : '<span class="fl f-mute">ช่องว่าง — อ่านว่าเป็นวันหยุดของคนนั้น</span>')
    + (h ? '<span class="fl f-warn"><i data-lucide="palmtree" class="w-3 h-3"></i>' + h.n + '</span>' : '')
    + (lvf ? '<span class="fl f-block"><i data-lucide="calendar-off" class="w-3 h-3"></i>วันลาที่อนุมัติแล้ว</span>' : '')
    + (ot ? '<span class="fl f-warn"><i data-lucide="timer" class="w-3 h-3"></i>มีใบโอที ' + ot.no + '</span>' : '')
    + (!edit ? '<span class="fl f-mute"><i data-lucide="lock" class="w-3 h-3"></i>' + (dayLockReason(d) || 'บทบาทนี้แก้ไม่ได้') + '</span>' : '')
    + (pn ? '<span class="fl f-warn"><i data-lucide="git-commit-horizontal" class="w-3 h-3"></i>แก้แล้วรอเผยแพร่ซ้ำ</span>' : '')
    + '</div>';
  const picker = edit
    ? '<div class="field"><label class="field-label">เลือกกะจากแพทเทิร์นกะ</label>'
      + searchSelectHTML('cell-shift', { placeholder: 'ค้นหากะ · เวลาเข้า–ออก' })
      + '<div class="field-help">กะที่ปิดใช้จะไม่อยู่ในรายการนี้ ' + tipI('ตารางเก่าที่อ้างกะที่ปิดใช้ยังแสดงได้ตามปกติ เพียงแต่เลือกใหม่ไม่ได้') + '</div></div>'
      + '<div class="chips">' + activeShifts().map(function (s) {
        return '<button class="chip-btn' + (arr.some(function (x) { return x.c === s.c; }) ? ' is-on' : '') + '" onclick="applyShift(\'' + emp + '\',\'' + d + '\',\'' + s.c + '\')">' + chipShift(s.c) + s.n + '</button>';
      }).join('')
      + '<button class="chip-btn" onclick="applyShift(\'' + emp + '\',\'' + d + '\',\'_\')"><i data-lucide="eraser" class="w-3 h-3"></i>ล้างกะ</button></div>'
      + '<div class="chips mtop"><span class="cfg-m">เพิ่มเป็นกะแยกช่วงในวันเดียว (ต้องไม่ทับเวลากัน):</span>'
      + activeShifts().filter(function (s) { return s.h <= 4; }).map(function (s) {
        return '<button class="chip-btn" onclick="addSplit(\'' + emp + '\',\'' + d + '\',\'' + s.c + '\')"><i data-lucide="plus" class="w-3 h-3"></i>' + s.n + '</button>';
      }).join('') + '</div>'
    : '<div class="hint-inline">' + (dayLockReason(d) ? 'แก้ไม่ได้แล้ว — ' + dayLockReason(d) : 'บทบาทนี้ดูตารางได้อย่างเดียว') + '</div>'
      + (dayLockReason(d) ? '<div class="rowgap mtop">' + attLink(d) + '</div>' : '');
  const cf = conf.length ? conf.map(function (c) {
    return '<div class="cfl lv-' + c.lv + '" style="cursor:default"><span class="cf-ic"><i data-lucide="' + (c.lv === 'block' ? 'octagon-alert' : 'alert-triangle') + '" class="w-4 h-4"></i></span>'
      + '<span class="min0"><span class="cf-t">' + c.t + '</span><span class="cf-m">' + c.m + '</span></span><span class="cf-r">' + lvPill(c.lv) + '</span></div>';
  }).join('') : '<div class="hint-inline">ไม่พบข้อขัดแย้งของช่องนี้</div>';
  return '<div class="scrollpad">'
    + SEC('calendar', 'กะของช่องนี้', dTH(d) + ' · ' + TH_DOW[dowOf(d)], flags + '<div class="mtop">' + picker + '</div>')
    + SEC('shield-alert', 'ข้อขัดแย้งของช่องนี้', conf.length ? conf.length + ' รายการ' : 'ไม่มี', cf
      + '<div class="mtop rowgap"><span class="cfg-m">กฎที่ยังไม่มีค่าให้อ่าน:</span>'
      + engine().skipped.map(function (k) { return '<span class="fl f-mute">' + k.n + '</span>'; }).join('') + cfgLink('shift_rule', 'จัดการที่ ตั้งค่า HR') + '</div>')
    + SEC('sticky-note', 'หมายเหตุของช่อง', 'ไม่บังคับ · ห้ามมีตัวเลขเงิน',
      '<div class="field"><textarea class="input notepad" ' + (edit ? '' : 'disabled') + ' placeholder="เช่น เข้าที่คลัง 2 · รับงานต่อจากกะเช้า" oninput="setCellNote(this.value)">' + ((arr[0] && arr[0].note) || '') + '</textarea>'
      + '<div class="field-help">แสดงบนตารางที่เผยแพร่แล้วและเข้าประวัติ</div></div>')
    + SEC('info', 'ข้อมูลที่ใช้ตัดสินช่องนี้', '', '<div class="kv c3">'
      + KV('พนักงาน', e.n + ' · ' + e.p) + KV('แผนก', e.d)
      + KV('วันสุดท้ายของพนักงาน', e.out ? dTH(e.out) : '—')
      + KV('สถานะวันที่ปลายทาง', st.day === 'confirmed' ? 'ยืนยันแล้ว' : st.day === 'locked' ? 'ล็อกแล้ว' : 'ยังไม่ถูกใช้')
      + KV('งวด', (periodOf(d) || { n: '—' }).n + ' · ' + ((periodOf(d) || {}).st === 'closed' ? 'ปิดแล้ว' : 'เปิดอยู่'))
      + KV('ชั่วโมงตามแผนของสัปดาห์นี้', '<span class="tnum">' + nH(wk.h) + '</span> ชม. · ' + wk.days + ' วัน', 'เป็นชั่วโมงตามแผน ไม่ใช่ชั่วโมงทำงานจริง')
      + KV('เพดานชั่วโมงต่อสัปดาห์', SHIFT_RULE.max_hours_week.v == null ? noVal() : SHIFT_RULE.max_hours_week.v)
      + KV('เวอร์ชันแพทเทิร์นกะ', '<span class="tnum">' + ((arr[0] && arr[0].spv) || CFG_VER.shift_pattern) + '</span>')
      + KV('อ้างอิงจากระบบอื่น', (lvf ? lvLink(lvf.no) : '') + (ot ? otLink(ot.no) : '') + (!lvf && !ot ? '—' : ''))
      + '</div>')
    + '</div>';
}
function dayBody(f) {
  const d = f.d, st = dayStatusOf(d), h = holOf(d);
  const rows = f.rows.map(function (e) {
    const a = workCell(e, d);
    return '<tr><td>' + personCell(e) + '</td><td>' + a.map(function (x) { return chipShift(x.c); }).join(' ') + ' <span class="cell-sub">' + cellText(a) + '</span></td>'
      + '<td>' + (cellLevel(e, d) ? lvPill(cellLevel(e, d)) : '<span class="text-mute-2">—</span>') + '</td>'
      + '<td>' + ((a[0] && a[0].note) ? a[0].note : '—') + '</td>'
      + '<td class="tar"><button class="btn btn-ghost btn-sm" onclick="closeDrawer();jumpTo(\'' + e + '\',\'' + d + '\')">ไปที่ช่อง</button></td></tr>';
  }).join('');
  return '<div class="scrollpad">'
    + SEC('calendar-days', 'สรุปของวัน', dTH(d) + ' · ' + TH_DOW[dowOf(d)] + (h ? ' · ' + h.n : ''), '<div class="kv c3">'
      + KV('สถานะที่เวลาเข้างาน', st.day === 'confirmed' ? 'ยืนยันแล้ว' : st.day === 'locked' ? 'ล็อกแล้ว' : 'ยังไม่ถูกใช้')
      + KV('งวด', (periodOf(d) || { n: '—' }).n + ' · ' + ((periodOf(d) || {}).st === 'closed' ? 'ปิดแล้ว' : 'เปิดอยู่'))
      + KV('เปลี่ยนกะของวันนี้ได้หรือไม่', dayEditable(d) ? 'ได้' : 'ไม่ได้ — ' + dayLockReason(d))
      + '</div><div class="rowgap mtop">' + attLink(d) + '</div>')
    + SEC('users', 'คนที่มีกะในวันนี้', f.rows.length + ' คน', f.rows.length
      ? '<div class="tbl-x"><table class="mini-tbl nw-sm"><thead><tr><th>พนักงาน</th><th>กะ</th><th>ข้อขัดแย้ง</th><th>หมายเหตุ</th><th class="tar">การทำงาน</th></tr></thead><tbody>' + rows + '</tbody></table></div>'
      : emptyStateHTML({ icon: 'calendar-off', title: 'ไม่มีใครมีกะในวันนี้', desc: 'ช่องว่างอ่านว่าเป็นวันหยุดของคนนั้น' }))
    + '</div>';
}
function genBody() {
  const f = state.dw.form;
  return '<div class="scrollpad">'
    + SEC('wand-2', 'วิธีกางตาราง', monthTH(state.month), '<div class="chips">'
      + [['pattern', 'กางจากแพทเทิร์นกะ', 'calendar-range'], ['rotate', 'กางแบบกะหมุนตามรอบ', 'refresh-cw'], ['copy', 'คัดลอกตารางของเดือนก่อน', 'copy']]
        .map(function (x) { return '<button class="chip-btn' + (f.kind === x[0] ? ' is-on' : '') + '" onclick="setGen(\'kind\',\'' + x[0] + '\')"><i data-lucide="' + x[2] + '" class="w-3 h-3"></i>' + x[1] + '</button>'; }).join('')
      + '</div>'
      + (f.kind === 'rotate'
        ? '<div class="grid2 mtop"><div class="field"><label class="field-label">ลำดับกะในรอบ</label>'
          + '<input class="input" value="' + f.seq + '" oninput="state.dw.form.seq=this.value">'
          + '<div class="field-help">ใส่รหัสกะคั่นด้วยจุลภาค เช่น M,A,N</div></div>'
          + '<div class="field"><label class="field-label">ความยาวรอบ</label>'
          + '<select class="select" onchange="setGen(\'cycle\',this.value)">'
          + [1, 2, 3, 4].map(function (n) { return '<option value="' + n + '"' + (+f.cycle === n ? ' selected' : '') + '>' + n + ' สัปดาห์ต่อกะ</option>'; }).join('') + '</select>'
          + '<div class="field-help">จุดตั้งต้นไล่ตามลำดับในตาราง กะจึงกระจายทั่วทีม</div></div></div>'
        : '')
      + (f.kind === 'copy'
        ? '<div class="field mtop"><label class="field-label">เดือนต้นทาง</label>'
          + '<select class="select" onchange="setGen(\'from\',this.value)">'
          + [addMonth(state.month, -1), addMonth(state.month, -2)].map(function (m) { return '<option value="' + m + '"' + (f.from === m ? ' selected' : '') + '>' + monthTH(m) + '</option>'; }).join('') + '</select>'
          + '<div class="field-help">ค่านโยบาย resolve ใหม่ตามวันของเดือนปลายทาง</div></div>'
        : ''))
    + SEC('sliders-horizontal', 'ค่าที่จะใช้กางตาราง', cfgLink('shift_pattern', 'จัดการที่ ตั้งค่า HR'), '<div class="kv c3">'
      + KV('แพทเทิร์นกะ', '<span class="tnum">' + CFG_VER.shift_pattern + '</span> · ' + activeShifts().length + ' กะที่เปิดใช้')
      + KV('ปฏิทินวันหยุด', '<span class="tnum">' + CFG_VER.holiday + '</span>')

function mHead(icon, kind, title, sub) {

    + '<div class="min0"><h3 class="modal-title">' + title + '</h3><p class="modal-subtitle">' + sub + '</p></div></div>';
}
function reasonField(id, label, help) {
  return '<div class="field"><label class="field-label">' + label + ' <span class="text-danger">*</span></label>'
    + '<textarea class="input notepad" id="' + id + '" placeholder="บอกเหตุผลให้อีกฝ่ายเข้าใจ"></textarea>'
    + '<div class="field-help">' + help + '</div></div>';
}
function needReason(id) {
  const el = document.getElementById(id), v = el ? el.value.trim() : '';
  if (!v) { showToast('กรอกเหตุผลก่อน', 'warning'); if (el) el.focus(); return null; }
  return v;
}
