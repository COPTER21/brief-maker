# unattended — AI-DEFAULT ทุกหมวด รอลูกค้ายืนยัน
# G1 ผลต่อระบบ — บันทึกตรวจเช็คอย่างเดียว ไม่เปลี่ยนค่า ไม่ส่งต่อ (ไม่เปิด IT Ticket อัตโนมัติ)
config_changes: []
post_to: []

# G2 — กระดาษไม่มีช่องลงชื่อผู้อนุมัติ (มีแค่ ผู้ตรวจสอบ ต่อแถว) → ไม่มีการอนุมัติ
doa: { required: false, mode: dynamic, default_steps: [], amount: none }

# G3 — เกณฑ์ 18-27°C / 40-55 %RH อ่านจาก config · ไม่มีสูตร · นอกเกณฑ์ = เตือน
calc:
  constants_from_config: true
  auto_compute: false
  over_limit: warn
  rules:
    - "อุณหภูมินอกช่วง 18-27°C หรือ ความชื้นนอกช่วง 40-55 %RH → เตือน (ไฮไลต์แถว) ไม่บล็อก · แนะนำให้กรอกหมายเหตุ"
    - "ทะเบียนคุมเข้าออก = ไม่มี หรือ อุปกรณ์ใด = ไม่ปกติ → เตือน (ไฮไลต์แถว) ไม่บล็อก · แนะนำให้กรอกหมายเหตุ"
    - "วันที่ซ้ำกันในใบเดียวกัน → เตือน ไม่บล็อก"

# G4
repeat: { max_rows: null }

# G5
fidelity: { one_to_one: true, add_fields: [], merge_split: [] }

# G6 — ไม่มีช่องลงชื่อท้ายใบ · ชื่อผู้ตรวจสอบอยู่ในคอลัมน์ต่อแถว (ข้อความจากระบบ ไม่ใช้ภาพ)
signature: { layout: per-row, per_doa_step: false, handwriting_image: false }

# G7 — ไม่มีอนุมัติ · ยกเลิกได้โดยเจ้าของ + admin role · ต้องมีเหตุผล
reject_cancel: { on_reject: draft, cancel_by: [owner, admin_role], cancel_states: [draft, submitted], reason_required: true }

# G8
visibility: { owner: true, approver: none, admin_role: all }

# G9
numbering: { issue_on: first_save, code: "SRC" }

# G10
extras: { attachments: true, copy: false, export_csv: true, announce: false }
