    + กำหนดส่ง
  recipients:
  - lesson_owner
  template: '**{doc_no}** มอบหมายติดตามบทเรียน: {topic} · กำหนดส่ง {due_date}'
  channel: in-app
  optional: true
  why: ตารางบทเรียนมีผู้รับผิดชอบ + กำหนดส่ง = งานติดตามผลหลังปิดงาน ต้องแจ้งผู้ถูกมอบหมาย
  frd_ref: 03_LOGIC F-TMP-003-FN-05, F-TMP-003-FN-09
