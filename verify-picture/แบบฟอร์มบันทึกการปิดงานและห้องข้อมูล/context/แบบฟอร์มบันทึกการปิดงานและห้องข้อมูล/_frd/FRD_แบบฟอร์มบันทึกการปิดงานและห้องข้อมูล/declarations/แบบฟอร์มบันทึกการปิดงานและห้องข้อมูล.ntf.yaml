  optional: false
  why: ผู้รับผิดชอบหลังปิดงานต้องรับช่วงประเด็นคงค้าง/ติดตามผล และผู้รับผิดชอบรายการตรวจสอบต้องรู้ว่าปิดงานแล้ว
    (DOA engine แจ้งเฉพาะผู้ขอ)
