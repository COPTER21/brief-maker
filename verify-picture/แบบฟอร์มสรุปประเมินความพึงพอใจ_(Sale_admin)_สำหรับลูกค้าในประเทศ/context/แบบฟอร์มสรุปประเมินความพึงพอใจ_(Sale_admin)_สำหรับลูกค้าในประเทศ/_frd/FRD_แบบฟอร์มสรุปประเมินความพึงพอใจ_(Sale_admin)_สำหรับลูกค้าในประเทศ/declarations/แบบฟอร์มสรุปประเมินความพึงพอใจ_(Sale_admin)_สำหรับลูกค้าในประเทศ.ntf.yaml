# ntf-declaration v1.2 — FINAL ยืนยันกับ FRD v1.0 (frd_lint N7 PASS)
feature_id: F-TMP-005
name: แบบฟอร์มสรุปประเมินความพึงพอใจ (Sale admin) สำหรับลูกค้าในประเทศ
code: SDS
events:
- id: sds_cancelled
  trigger: pending_approval → cancelled
  recipients:
  - current_step_approver
  template: '**{doc_no}** ถูกยกเลิกโดย {actor} — {reason}'
  channel: in-app
  optional: true
  why: ยกเลิกระหว่างรออนุมัติ — ผู้อนุมัติขั้นปัจจุบันต้องรู้ว่าไม่ต้องพิจารณาแล้ว
    (DOA engine ไม่ยิงกรณีนี้)
  frd_ref: 03_LOGIC F-TMP-005-FN-06, F-TMP-005-FN-08
- id: sds_low_score_approved
  trigger: → approved และมีช่องระดับ น้อย หรือ ควรปรับปรุง อย่างน้อย 1 ช่อง (weight
    ≤ 2 ตาม SalesConfig.sda_scale)
  recipients:
  - owner
  - role-mgr-sales
  template: '**{doc_no}** สรุปความพึงพอใจลูกค้าในประเทศ เดือน {period_month} มี {low_count}
    ช่องที่ได้ระดับต่ำ — ดูลูกค้า {low_customers}'
  channel: in-app
  optional: false
  why: G3 ระดับต่ำ = เตือนไม่บล็อก — ฝ่ายขายต้องรู้หลังผู้บริหารรับทราบ เพื่อวางแผนแก้ไขกับลูกค้า
  frd_ref: 03_LOGIC F-TMP-005-FN-05, F-TMP-005-FN-08
excluded:
- doa_escalate
- doa_pending
- doa_result
