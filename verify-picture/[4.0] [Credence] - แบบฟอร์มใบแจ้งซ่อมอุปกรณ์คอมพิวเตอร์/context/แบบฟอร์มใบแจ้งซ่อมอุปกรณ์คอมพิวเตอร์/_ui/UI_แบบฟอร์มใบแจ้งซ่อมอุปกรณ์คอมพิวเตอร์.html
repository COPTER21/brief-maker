function sortTh(col, label, cls){
  const s = S.list.sort, on = s.col === col;
  return `<th class="is-sortable ${on ? 'is-sorted' : ''} ${cls || ''}" onclick="sortBy('${col}')">${label}<span class="sort-arrow">${on ? (s.dir === 'asc' ? '↑' : '↓') : '↕'}</span></th>`;
}
function pager(total){
  const size = S.list.size, pages = Math.max(1, Math.ceil(total / size)), p = Math.min(S.list.page, pages);
  const from = total ? (p - 1) * size + 1 : 0, to = Math.min(total, p * size);
  let b = `<button class="pg-btn ${p === 1 ? 'is-disabled' : ''}" onclick="goPage(${p - 1})"><i data-lucide="chevron-left" class="w-3 h-3"></i></button>`;
  for (let i = 1; i <= pages; i++) b += `<button class="pg-btn ${i === p ? 'is-active' : ''}" onclick="goPage(${i})">${i}</button>`;
  b += `<button class="pg-btn ${p === pages ? 'is-disabled' : ''}" onclick="goPage(${p + 1})"><i data-lucide="chevron-right" class="w-3 h-3"></i></button>`;
  return `<div class="table-footer table-foot"><span class="pg-size">แสดงต่อหน้า <select class="select pg-sel" name="pgsize" onchange="setSize(this.value)">${[10, 25, 50].map(n => `<option value="${n}" ${n === size ? 'selected' : ''}>${n}</option>`).join('')}</select></span>
    <span class="num pg-info">${from} – ${to} จาก ${total} รายการ</span><div class="pagination">${b}</div></div>`;
}
function segTabs(){
  const base = listBase(), defs = [['all', 'ทั้งหมด', base.length], ['todo', 'งานที่ต้องทำ', base.filter(myTodo).length], ['mine', 'ใบแจ้งซ่อมของฉัน', base.filter(isOwner).length]];

    </tr>`).join('')
    : `<tr><td colspan="9">${filtered ? emptyStateHTML({ icon:'search-x', title:'ไม่พบรายการที่ค้นหา', desc:'ลองปรับคำค้นหรือล้างตัวกรอง', actionLabel:'ล้างตัวกรอง', actionIcon:'rotate-ccw', onAction:'resetFilters()' })
        : emptyStateHTML({ icon:'inbox', title:'ยังไม่มีใบแจ้งซ่อม', desc:'แจ้งซ่อมเมื่ออุปกรณ์คอมพิวเตอร์มีปัญหา', actionLabel:'แจ้งซ่อม', actionIcon:'plus', onAction:'startWizard()' })}</td></tr>`;
  return `<div class="page-fill">
    <div class="ph"><div>
        <div class="ph-title-row"><h1 class="ph-title">${DOC_NAME}</h1></div>
        <p class="ph-sub">แจ้งซ่อม ติดตามผลตรวจเช็ค และรับทราบผลการซ่อม <span class="ph-badge num">${base.length} รายการ</span>${nTodo ? `<span class="ph-badge num">งานที่ต้องทำ ${nTodo}</span>` : ''}${nOpen ? `<span class="ph-badge num">ระหว่างดำเนินการ ${nOpen}</span>` : ''}</p></div>

/* ---------- row menu (⋮ เท่านั้น — U5) ---------- */
function openRowMenu(id, btn){
  closeRowMenu();
  const r = findR(id), items = [['file-text', 'ดูรายละเอียด', `openView('${id}')`], ['printer', 'พิมพ์', `genPdf('${id}', true)`]];
  if (isOwner(r) && r.status === 'draft') items.splice(1, 0, ['pencil', 'แก้ไข', `startWizard('${id}')`]);
  if (canReceive(r)) items.push(['inbox', 'รับแจ้ง', `openReceive('${id}')`]);
  if (canInspect(r)) items.push(['stethoscope', 'บันทึกผลตรวจเช็ค', `openInspect('${id}')`]);
  if (canAct(r)) items.push(['check', 'พิจารณาอนุมัติ', `openView('${id}', 'sign')`]);
  if (canRepair(r)) items.push(['wrench', 'บันทึกผลการซ่อม', `openRepair('${id}')`]);
  if (canAck(r)) items.push(['check-check', 'รับทราบผลการซ่อม', `openAck('${id}')`]);
  if (canCancel(r)) items.push(['x-circle', 'ยกเลิกเอกสาร', `openCancel('${id}')`, 1]);
  const m = document.createElement('div'); m.className = 'row-menu';
  m.innerHTML = items.map(x => `<button type="button" class="rm-item ${x[3] ? 'is-danger' : ''}" onclick="closeRowMenu(); ${x[2]}"><i data-rmic="${x[0]}" class="w-4 h-4"></i><span>${x[1]}</span></button>`).join('');
  document.getElementById('overlay-root').appendChild(m);
  const b = btn.getBoundingClientRect(), h = items.length * 36 + 8, below = window.innerHeight - b.bottom > h + 8;
  m.style.setProperty('--top', (below ? b.bottom + 4 : b.top - h - 4) + 'px'); m.style.setProperty('--left', Math.max(8, b.right - 200) + 'px');
  if (window.lucide && typeof window.lucide.createIcons === 'function'){ window.lucide.createIcons({ nameAttr:'data-rmic' }); m.querySelectorAll('svg[data-rmic]').forEach(x => x.removeAttribute('data-rmic')); }
}
function closeRowMenu(){ const m = document.querySelector('.row-menu'); if (m) m.remove(); }
function rowClick(ev, id){ if (ev.target.closest('.row-actions-cell')) return; openView(id); }
document.addEventListener('click', e => { if (!e.target.closest('.row-menu') && !e.target.closest('.row-actions-cell')) closeRowMenu(); });
window.addEventListener('scroll', closeRowMenu, true);

function tabBtn(key, label, icon, count){ return `<button class="drawer-tab ${S.dw.tab === key ? 'is-active' : ''}" onclick="setTab('${key}')"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i> ${label}${count != null ? `<span class="dt-count num">${count}</span>` : ''}</button>`; }

const SEC = (icon, title, body, extra) => `<div class="drawer-section"><div class="drawer-section-title"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i>${title}${extra || ''}</div>${body}</div>`;

function fileRow(x){ return `<div class="file-row"><div class="file-ic"><i data-lucide="file" class="w-4 h-4"></i></div><div class="file-name">${esc(x.name)}</div><span class="file-size">${x.size}</span></div>`; }
const isClaim = k => CLAIM_KEYS.includes(k);
function claimKv(r){ return isClaim(r.check) ? kv('ระยะเวลา', fmtD(r.claim.from) + ' ถึง ' + fmtD(r.claim.to) + (r.claim.to && r.claim.from && r.claim.to < r.claim.from ? ' <span class="pill pill-warning">วันสิ้นสุดก่อนวันเริ่ม</span>' : '')) + kv('ระบุร้านค้าที่ส่งเคลม', esc(r.claim.vendor) || '—') + kv('วันที่ส่งเคลม', fmtD(r.claim.date)) : ''; }
function viewBanner(r){
  if (r.status === 'inspecting' && r.returned) return `<div class="alert-row is-danger"><i data-lucide="corner-up-left" class="w-4 h-4"></i><div>ไม่อนุมัติ — กลับร่างผลตรวจเช็ค: ${esc(r.returned.note)} <span class="cell-mute">(${esc(r.returned.by)})</span></div></div>`;
  if (r.status === 'cancelled'){ const a = r.audit.filter(x => x.act === 'ยกเลิกเอกสาร').pop(); return `<div class="alert-row is-danger"><i data-lucide="x-circle" class="w-4 h-4"></i><div>ยกเลิกแล้ว — ${esc(a ? a.note : '')}</div></div>`; }
  if (r.status === 'draft') return `<div class="alert-row"><i data-lucide="pencil" class="w-4 h-4"></i><div>ยังเป็นร่าง — ส่งแจ้งซ่อมเมื่อข้อมูลครบ</div></div>`;
  if (r.status === 'reported') return `<div class="alert-row"><i data-lucide="inbox" class="w-4 h-4"></i><div>ส่งแจ้งซ่อมแล้ว — รอฝ่าย IT รับแจ้ง${canReceive(r) ? ' · กด "รับแจ้ง" เพื่อเริ่มตรวจเช็ค' : ''}</div></div>`;
  if (r.status === 'inspecting') return `<div class="alert-row"><i data-lucide="stethoscope" class="w-4 h-4"></i><div>ฝ่าย IT รับแจ้งแล้ว — กำลังตรวจเช็ค${canInspect(r) ? ' · บันทึกผลตรวจเช็คแล้วส่งอนุมัติ' : ''}</div></div>`;

function fitPdf(f){ try { const d = f.contentDocument; f.style.height = Math.max(1123, d.documentElement.scrollHeight) + 'px'; } catch (e) { /* cross-origin host */ } }
function genPdf(id, isPrint){
  const r = findR(id); if (!r) return;

  if (!f){ f = document.createElement('iframe'); f.className = 'pdf-gen'; f.title = 'สร้าง PDF'; document.getElementById('overlay-root').appendChild(f); }

function validateMain(){
  const f = wf(), err = {};
  if (!f.devType) err.devType = 'เลือกประเภทอุปกรณ์';
  if (f.devType === 'other' && !f.devOther.trim()) err.devOther = 'ระบุประเภทอุปกรณ์อื่นๆ';
  if (!f.item.trim()) err.item = 'ระบุรายการ';
  if (!f.problem.trim()) err.problem = 'ระบุอาการเสีย / ปัญหา';
  if (!f.dueDate) err.dueDate = 'เลือกวันที่ต้องการส่งมอบ';
  if (!f.place.trim()) err.place = 'ระบุสถานที่ส่งมอบ';

}
function wizNext(){
