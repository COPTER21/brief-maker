# doccfg-declaration v2.1 — ฉบับจริง (ยืนยันกับ FRD v1.0)
feature_id: F-TMP-004
doc_types:
- code: CRR
  name_th: แบบฟอร์มใบแจ้งซ่อมอุปกรณ์คอมพิวเตอร์
  module: IT
  feature_id: F-TMP-004
  numbering:
    preset: '{PREFIX}-{YYYY}-{run:4}'
    reset: yearly
    scope: global
    no_gap: false
    issue_on: first_save
    frd_ref: 03_LOGIC F-TMP-004-FN-02
  snapshot:
    sent_external: false
    approved_final: true
  snapshot_points:
  - event: approved_final
    frd_ref: 03_LOGIC F-TMP-004-FN-07
  print_config:
    form_code: FM-ITS-06
    revision: 'Rev.00 : 01/07/2569'
    paper: A4-portrait
    min_rows: 2
    dense_when_rows_over: 2
    header_source: organization_snapshot_at_numbering
    sign_boxes:
    - box: reporter
      label: ผู้แจ้งซ่อม
      show_date: true
      section: ส่วนที่ 1
      source: owner · submitted_at
    - box: receiver
      label: ผู้รับแจ้ง
      show_date: true
      section: ส่วนที่ 1
      source: received_by / received_at (เจ้าหน้าที่ IT กด รับแจ้ง) — ไม่ใช่ขั้น DOA
    - box: inspector
      label: ผู้ดำเนินการ
      show_date: true
      section: ส่วนที่ 2
      source: inspected_by / approval_submitted_at (ผู้ส่งอนุมัติ = ผู้ขอของ DOA)
    - box: doa_step:*
      label: from_doa_step
      show_decision: true
      show_date: true
      section: ส่วนที่ 2
    - box: repairer
      label: ผู้ดำเนินการ
      show_date: true
      section: ผลการซ่อม
      source: repaired_by / repaired_at
    - box: acknowledger
      label: ผู้แจ้งซ่อม
      show_date: true
      section: ผลการซ่อม
      source: owner · acknowledged_at (ผู้แจ้งกด รับทราบผล)
    decision_words:
      default:
        approve: อนุมัติ
        reject: ไม่อนุมัติ
      by_role: {}
    sign_layout:
      source: approval_chain snapshot (ผู้ดำเนินการผู้ส่งอนุมัติ + จำนวนขั้นตามที่ตั้งใน
        DOA) วางในส่วนที่ 2 ตามตำแหน่งบนกระดาษ · คู่ลงชื่อส่วนที่ 1 / ผลการซ่อม คงที่
        2 ช่องตามกระดาษ
      max_per_row: 4
      split: even
      dense_when_steps_over: 4
      keep_together: true
    ref: print/print_config.json
