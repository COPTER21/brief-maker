# ntf-declaration v1.2 — ฉบับจริง (ยืนยันกับ FRD)
feature_id: F-TMP-008
name: หนังสือยินยอมในการเก็บรวบรวม ใช้ และเปิดเผยข้อมูลส่วนบุคคล
code: PDC
events:
- id: pdc_consent_recorded
  trigger: 'S: draft → confirmed (เจ้าของข้อมูลยืนยันความยินยอม · ระบบบันทึกวันที่ให้ความยินยอมและฉบับของหนังสือ)'
  recipients:
  - role-mgr-hr
  template: '**{doc_no}** {subject_name} ให้ความยินยอมแล้ว (ฉบับ {form_revision})
    — บันทึกเป็นหลักฐานความยินยอมเรียบร้อย'
  channel: in-app
  optional: true
  why: ผู้ดูแลงานบุคคลต้องรู้ว่าหลักฐานความยินยอมของผู้สมัคร/บุคลากรรายนี้ครบแล้วก่อนเดินกระบวนการต่อ
  frd_ref: 03_LOGIC F-TMP-008-FN-09
- id: pdc_consent_withdrawn
  trigger: 'S: confirmed → withdrawn (เจ้าของข้อมูลถอนความยินยอม · DEC-14)'
  recipients:
  - role-mgr-hr
  - role-compliance
  template: '**{doc_no}** {subject_name} ถอนความยินยอม {withdrawn_scope} เมื่อ {withdrawn_at}
    — ต้องหยุดประมวลผลข้อมูลส่วนที่ถอนทันที'
  channel: in-app+email
  optional: false
  why: การถอนความยินยอมมีผลทางกฎหมายทันที ผู้ดูแลและผู้กำกับดูแลต้องรู้โดยไม่ขึ้นกับการตั้งค่าส่วนตัว
    — ปิดไม่ได้
  frd_ref: 03_LOGIC F-TMP-008-FN-06, F-TMP-008-FN-09
- id: pdc_sensitive_refused
  trigger: ตอนยืนยัน พบข้อ 1-5 (ข้อมูลอ่อนไหว ม.26) ที่เลือก "ไม่ยินยอม" อย่างน้อย
    1 ข้อ (DEC-15)
  recipients:
  - role-mgr-hr
  template: '**{doc_no}** {subject_name} ไม่ยินยอมข้อมูลอ่อนไหว {refused_items} —
    ตรวจสอบผลต่อกระบวนการที่เกี่ยวข้องก่อนดำเนินการต่อ'
  channel: in-app
  optional: true
  why: ข้อที่ไม่ยินยอมกระทบกระบวนการปลายทาง (เช่น ระบบบันทึกเวลาด้วยข้อมูลชีวภาพ)
    ผู้ดูแลต้องเห็นตั้งแต่ต้น
  frd_ref: 03_LOGIC F-TMP-008-FN-09
excluded:
- doa_pending / doa_result / doa_escalate — เอกสารนี้ไม่มีสายอนุมัติ (DEC-03) จึงไม่มี
  event จาก DOA engine
- pdc_over_limit_approved (จาก suggest) — ตัดออก เอกสารไม่มีวงเงินและไม่มีการอนุมัติ
note: ฉบับจริง — frd_ref ครบทุก event (frd_lint.py Section N)
