# unattended — AI-DEFAULT ทุกหมวด รอลูกค้ายืนยัน
# หนังสือยินยอมในการเก็บรวบรวม ใช้ และเปิดเผยข้อมูลส่วนบุคคล (FM-HRM-31) · REQ-TMP-008 · F-TMP-008
# ตอบตาม 4_knowledge/governance/unattended-policy.md (อนุรักษ์นิยม · ERP standard)

# G1 ผลต่อระบบ — เอกสารความยินยอม ไม่เปลี่ยนค่าตั้งต้นใด ๆ ในระบบ และยังไม่ส่งต่อ module อื่นรอบนี้
config_changes: []
post_to: []

# G2 สายอนุมัติ — กระดาษมีช่องลงชื่อ "เจ้าของข้อมูลส่วนบุคคล" จุดเดียว ไม่มีช่องผู้อนุมัติ → ไม่มีสายอนุมัติ
doa: { required: false, mode: none, default_steps: [], amount: none }

# G3 ถ้อยคำคงที่ / กติกาตรวจ
calc:
  constants_from_config: true
  auto_compute: true
  over_limit: warn
  rules:
    - "ข้อ 1-8 ต้องเลือกอย่างใดอย่างหนึ่งทุกข้อ (ยินยอม หรือ ไม่ยินยอม) เว้นว่างไม่ได้ และเลือกพร้อมกันสองช่องไม่ได้"
    - "ถ้อยคำทางกฎหมายทุกย่อหน้าและข้อความวัตถุประสงค์ข้อ 1-8 คัดตรงตัวจากต้นฉบับ ระบบห้ามเรียบเรียงใหม่"
    - "ข้อความวัตถุประสงค์ผูกกับฉบับ (revision) ของหนังสือ — แก้ถ้อยคำต้องออกฉบับใหม่ ใบที่ยืนยันแล้วคงถ้อยคำฉบับเดิม"
    - "ใบที่ยืนยันแล้วแก้ไม่ได้ (immutable) — เปลี่ยนใจใช้คำสั่งถอนความยินยอม ซึ่งบันทึกวันที่ถอนและผู้บันทึกไว้บนใบเดิม"
    - "ชื่อบริษัทผู้ควบคุมข้อมูลและลิงก์นโยบายความเป็นส่วนตัวอ่านจากค่าตั้งองค์กร ห้าม hardcode"

# G4 รายการซ้ำ — ไม่มีรายการซ้ำบนกระดาษ (ตารางความยินยอม 8 ข้อเป็นรายการตายตัวจากฉบับของหนังสือ)
repeat: { max_rows: null }

# G5 ช่องตามกระดาษ — 1:1 ไม่เพิ่มช่อง
fidelity: { one_to_one: true, add_fields: [], merge_split: [] }

# G6 ลายเซ็น — ช่องเดียว เจ้าของข้อมูล · ไม่ใช้ภาพลายมือชื่อ
signature: { layout: row-bottom, per_doa_step: false, handwriting_image: false }

# G7 ยกเลิก — ไม่มีการอนุมัติ จึงไม่มี "ไม่อนุมัติ" · ยกเลิกได้เฉพาะตอนยังเป็นร่าง หลังยืนยันใช้การถอนความยินยอม
reject_cancel: { on_reject: back_to_draft, cancel_by: [owner, admin_role], cancel_states: [draft], reason_required: true }

# G8 การมองเห็น — ข้อมูลอ่อนไหว ม.26 · เจ้าของเห็นของตัวเอง · ผู้ดูแล HR เห็นทั้งหมด
visibility: { owner: true, approver: after_submit, admin_role: all }

# G9 เลขที่ — เอกสารภายใน ออกเลขตอนบันทึกครั้งแรก · รหัส PDC (PDPA Consent) ยังไม่ชนทะเบียน
numbering: { issue_on: first_save, code: "PDC" }

# G10 ของเสริม — แนบไฟล์ ✓ · CSV ✓ · ทำซ้ำ ✗ (ความยินยอมทำซ้ำไม่ได้) · ประกาศ ✗
extras: { attachments: true, copy: false, export_csv: true, announce: false }

extend: {}
fit: {}
