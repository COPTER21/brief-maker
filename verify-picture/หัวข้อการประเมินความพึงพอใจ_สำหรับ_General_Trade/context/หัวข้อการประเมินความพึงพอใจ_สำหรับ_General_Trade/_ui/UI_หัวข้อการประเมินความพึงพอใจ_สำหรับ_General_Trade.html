}

/* ---------- row menu (⋮) — G10 ทำซ้ำ ✗ ---------- */
function openRowMenu(id, btn){
  closeRowMenu();
  const r = findR(id), items = [['eye', 'ดูรายละเอียด', `openView('${id}')`], ['printer', 'พิมพ์', `genPdf('${id}', true)`]];
  if (isOwner(r) && r.status === 'draft') items.splice(1, 0, ['pencil', 'แก้ไข', `startWizard('${id}')`]);
  if (canCancel(r)) items.push(['x-circle', 'ยกเลิกเอกสาร', `openCancel('${id}')`, 1]);
  const m = document.createElement('div'); m.className = 'row-menu';
  m.innerHTML = items.map(x => `<button type="button" class="rm-item ${x[3] ? 'is-danger' : ''}" onclick="closeRowMenu(); ${x[2]}"><i data-rmic="${x[0]}" class="w-4 h-4"></i><span>${x[1]}</span></button>`).join('');
  document.getElementById('overlay-root').appendChild(m);
  const b = btn.getBoundingClientRect(), h = items.length * 36 + 8, below = window.innerHeight - b.bottom > h + 8;
  m.style.setProperty('--top', (below ? b.bottom + 4 : b.top - h - 4) + 'px'); m.style.setProperty('--left', Math.max(8, b.right - 180) + 'px');
  if (window.lucide && typeof window.lucide.createIcons === 'function'){ window.lucide.createIcons({ nameAttr:'data-rmic' }); m.querySelectorAll('svg[data-rmic]').forEach(x => x.removeAttribute('data-rmic')); }
}
function closeRowMenu(){ const m = document.querySelector('.row-menu'); if (m) m.remove(); }
function rowClick(ev, id){ if (ev.target.closest('.row-actions-cell')) return; openView(id); }
document.addEventListener('click', e => { if (!e.target.closest('.row-menu') && !e.target.closest('.row-actions-cell')) closeRowMenu(); });
window.addEventListener('scroll', closeRowMenu, true);

/* =====================================================================
   VIEW DRAWER — รายละเอียด › PDF Preview › ลายเซ็น / อนุมัติ › ประวัติ
   ===================================================================== */
function tabBtn(key, label, icon, count){ return `<button class="drawer-tab ${S.dw.tab === key ? 'is-active' : ''}" onclick="setTab('${key}')"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i> ${label}${count != null ? `<span class="dt-count num">${count}</span>` : ''}</button>`; }
function kv(label, val){ return `<div class="lbl">${label}</div><div class="val">${val}</div>`; }
const SEC = (icon, title, body, extra) => `<div class="drawer-section"><div class="drawer-section-title"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i>${title}${extra || ''}</div>${body}</div>`;
const emptyMini = t => `<div class="empty-mini"><i data-lucide="inbox" class="w-5 h-5"></i><span>${t}</span></div>`;
function scoreTableView(sec, rows){
  const c = secCalc(rows);
  return `<div class="sc-wrap"><table class="sc-tbl"><thead><tr><th class="sc-topic">${esc(sec.col)}</th>${CFG.scale.map(x => `<th class="sc-n">${x.label}</th>`).join('')}<th class="sc-t">รวม</th></tr></thead><tbody>
    ${rows.map((rw, i) => `<tr><td class="sc-topic">${esc(sec.topics[i])}</td>${rw.map(x => `<td class="num">${x === '' ? '<span class="cell-mute">—</span>' : esc(x)}</td>`).join('')}<td class="num">${c.rowTot[i]}</td></tr>`).join('')}
    <tr class="sc-sum"><td class="sc-topic">รวม</td>${c.sums.map(x => `<td class="num">${x}</td>`).join('')}<td class="num">${c.tot}</td></tr></tbody></table>
    <div class="sc-foot"><span>% ด้านนี้ = คะแนนถ่วงน้ำหนัก 5–1 ÷ (5 × ${c.tot} คำตอบ)</span><b class="num">${pctTxt(c.pct)}${c.pct == null ? '' : '%'}</b></div></div>`;
}
function custTable(list, period){
  if (!list.length) return `<div class="table-wrap"><table class="table"><thead><tr><th class="c">#</th><th>โดยมีรายชื่อดังนี้</th><th class="r">จำนวนการสั่งซื้อ</th></tr></thead><tbody><tr><td colspan="3">${emptyMini('ยังไม่มีรายชื่อลูกค้า')}</td></tr></tbody></table></div>`;
  return `<div class="table-wrap"><table class="table"><thead><tr><th class="c">#</th><th>โดยมีรายชื่อดังนี้</th><th class="r">จำนวนการสั่งซื้อ</th></tr></thead><tbody>
    ${list.map((c, i) => { const n = orderCount(c.cid, period); return `<tr><td class="c num">${i + 1}</td><td class="nw">${esc(custOf(c.cid).name)}</td><td class="r num nw">${n}${n < CFG.min_orders ? ' <span class="pill pill-warning">ต่ำกว่าเกณฑ์</span>' : ''}</td></tr>`; }).join('')}</tbody></table></div>`;
}
function csatBox(scores){
  const cs = CFG.sections.map(s => secCalc(scores[s.key])), p = overall(scores);
  return `<div class="csat-box">${CFG.sections.map((s, i) => `<div class="pd-cell"><div class="pd-l">${esc(s.col)}</div><div class="pd-v num">${pctTxt(cs[i].pct)}${cs[i].pct == null ? '' : '%'}</div></div>`).join('')}
    <div class="pd-cell is-total"><div class="pd-l">โดยรวม</div><div class="pd-v num">${pctTxt(p)}${p == null ? '' : '%'}</div></div></div>
    <div class="bands">${levelPill(p)}<span>การแปลผลคะแนน CSAT: ${CFG.bands.map(b => b.range + ' ' + b.text).join(' · ')}</span></div>`;
}
function fileRow(x){ return `<div class="file-row"><div class="file-ic"><i data-lucide="file" class="w-4 h-4"></i></div><div class="file-name">${esc(x.name)}</div><span class="file-size">${x.size}</span></div>`; }
function viewBanner(r){
  if (r.status === 'cancelled'){ const a = r.audit.filter(x => x.act === 'ยกเลิกเอกสาร').pop(); return `<div class="alert-row is-danger"><i data-lucide="x-circle" class="w-4 h-4"></i><div>ยกเลิกแล้ว — ${esc(a ? a.note : '')}</div></div>`; }
  if (r.status === 'pending') return `<div class="alert-row"><i data-lucide="hourglass" class="w-4 h-4"></i><div>รอ ${esc(empOf(curStep(r).assignee).name)} พิจารณา${canAct(r) ? ' — คุณเป็นผู้พิจารณาเอกสารนี้' : ''}</div></div>`;
  if (r.status === 'draft' && r.rejectNote) return `<div class="alert-row is-danger"><i data-lucide="undo-2" class="w-4 h-4"></i><div>ไม่อนุมัติ — กลับเป็นร่าง (เลขเดิม): ${esc(r.rejectNote)}</div></div>`;
  if (r.status === 'draft') return `<div class="alert-row"><i data-lucide="pencil" class="w-4 h-4"></i><div>ยังเป็นร่าง — ส่งอนุมัติเมื่อข้อมูลครบ</div></div>`;
  return '';
}
function renderDetailTab(r){
  return viewBanner(r)
    + SEC('info', 'ข้อมูลเอกสาร', `<div class="drawer-fields">${kv('เลขที่เอกสาร', `<span class="code-strong">${r.code}</span>`)}${kv('ประจำเดือน', monthTh(r.period))}${kv('สถานะเอกสาร', docPill(r.status))}${kv('ผู้จัดทำ', empChip(r.emp, r.pos + ' · ' + r.dept))}</div>`)
    + CFG.sections.map(s => SEC(s.key === 'q' ? 'package-check' : s.key === 'd' ? 'truck' : 'user-check', esc(s.heading), scoreTableView(s, r.scores[s.key]))).join('')
    + SEC('gauge', 'สรุปผลการประเมิน', `<div class="tl-body mb-2">ประเมินจากลูกค้าที่มีการสั่งซื้อจำนวนตั้งแต่ ${CFG.min_orders} ครั้งขึ้นไป / เดือน</div>${csatBox(r.scores)}`)
    + SEC('store', `รายชื่อลูกค้าที่ประเมิน (${r.customers.length})`, custTable(r.customers, r.period))
    + SEC('paperclip', `เอกสารแนบ (${r.attachments.length} ไฟล์ · Document Center)`, r.attachments.length ? r.attachments.map(fileRow).join('') : '<div class="tl-body">ไม่มีเอกสารแนบ</div>')
    + SEC('database', 'ข้อมูลระบบ', `<div class="drawer-fields">${kv('สร้างโดย', esc(r.createdBy) + ' · ' + fmtDateTime(r.createdAt))}${kv('แก้ไขล่าสุด', esc(r.updatedBy) + ' · ' + fmtDateTime(r.updatedAt))}</div>`);
}

const PDF_CSS = "/* ============================================================\n   THAI BUSINESS DOCUMENT — MASTER A4 STYLESHEET  (LEAN v2)\n   CI: CUBE NATIVE (Navy #0B1D3A / Primary #0B5CFF / Teal #00A88E)\n   Font: Sarabun (Thai official document standard)\n   Design rules: lean & light type · thin minimal table header ·\n   single-line dense rows · signatures + footer pinned to page bottom.\n   DO NOT edit per-document. @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap'); injected by build_html.py.\n   ============================================================ */\n\n@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap');\n\n:root{\n  /* ---- CUBE NATIVE CI (verbatim from html-generator-v3) ---- */\n  --c-navy:#0B1D3A; --c-navy-2:#14284A;\n  --c-primary:#0B5CFF; --c-primary-hover:#0847CC;\n  --c-teal:#00A88E; --c-teal-light:#5EEAD4;\n  --c-ink:#0F172A; --c-mute:#475569; --c-mute-2:#64748B; --c-mute-3:#94A3B8;\n  --c-line:#CBD5E1; --c-line-2:#E2E8F0; --c-line-3:#F1F5F9;\n  --c-bg-off:#F8FAFC;\n  --c-success:#10B981; --c-warning:#D97706; --c-danger:#DC2626;\n\n  /* ---- Print geometry (A4) ---- */\n  --page-w:210mm; --page-h:297mm;\n  --page-margin:14mm;\n  --content-h:269mm;        /* 297 - 2*14 (printable height) */\n  --fs-base:9pt;            /* lean body size */\n}\n\n@page{ size:A4 portrait; margin:var(--page-margin); }\n\n*{ box-sizing:border-box; margin:0; padding:0; }\n\nhtml,body{\n  font-family:'Sarabun','Loma',sans-serif;\n  font-size:var(--fs-base);\n  font-weight:400;\n  line-height:1.4;\n  color:var(--c-ink);\n  -webkit-font-smoothing:antialiased;\n  background:#fff;\n}\n\n/* ===== A4 PAGE — flex column so .doc-bottom can pin to bottom ===== */\n.doc-page{ display:flex; flex-direction:column; }\n.doc-content{ flex:0 0 auto; }\n.doc-bottom{ margin-top:auto; }   /* pushes signatures + footer to page bottom */\n\n@media screen{\n  body{ background:#e7ebf0; padding:24px 0; }\n  .doc-page{\n    width:var(--page-w); min-height:var(--page-h);\n    margin:0 auto 24px; padding:var(--page-margin);\n    background:#fff; box-shadow:0 4px 24px rgba(11,29,58,.18);\n  }\n}\n@media print{\n  .doc-page{ width:auto; min-height:var(--content-h); padding:0; box-shadow:none; }\n}\n\n/* ============================================================\n   1. HEADER — thin rule, lighter type\n   ============================================================ */\n.doc-head{\n  display:flex; justify-content:space-between; align-items:flex-start;\n  gap:12mm; padding-top:1.5mm; padding-bottom:6px; border-bottom:1.5px solid var(--c-navy);\n}\n.doc-head__brand{ display:flex; gap:9px; align-items:flex-start; }\n.doc-logo{ width:46px; height:46px; flex:0 0 auto; border-radius:7px; object-fit:contain; }\n.doc-logo--ph{\n  display:flex; align-items:center; justify-content:center;\n  background:linear-gradient(135deg,var(--c-navy),var(--c-teal));\n  color:#fff; font-weight:700; font-size:15pt; letter-spacing:.03em;\n}\n.doc-org__name{ font-size:11.5pt; font-weight:700; color:var(--c-navy); line-height:1.5; }\n.doc-org__line{ font-size:7.8pt; color:var(--c-mute); line-height:1.35; }\n.doc-org__tax{ font-size:7.8pt; color:var(--c-mute-2); margin-top:1px; }\n\n.doc-head__title{ text-align:right; flex:0 0 auto; min-width:54mm; }\n.doc-title{ font-size:15pt; font-weight:700; color:var(--c-navy); line-height:1.45; }\n.doc-title__en{ font-size:7.5pt; font-weight:500; color:var(--c-mute-2); letter-spacing:.08em; text-transform:uppercase; }\n.doc-copy{ display:inline-block; margin-top:3px; padding:0 8px; border:1px solid var(--c-line);\n  border-radius:999px; font-size:7pt; font-weight:500; color:var(--c-mute); }\n\n/* ============================================================\n   2. META STRIP\n   ============================================================ */\n.doc-meta{ display:flex; flex-wrap:wrap; gap:0 22px; margin-top:7px; font-size:8.3pt; }\n.doc-meta__item{ display:flex; gap:5px; padding:1px 0; }\n.doc-meta__k{ color:var(--c-mute-2); }\n.doc-meta__v{ color:var(--c-ink); font-weight:600; }\n\n/* ============================================================\n   3. PARTY BLOCKS — light, no heavy fill\n   ============================================================ */\n.parties{ display:flex; gap:5mm; margin-top:9px; }\n.party{ flex:1; border:1px solid var(--c-line-2); border-radius:6px; padding:6px 9px; }\n.party__label{ font-size:7.2pt; font-weight:600; color:var(--c-primary);\n  text-transform:uppercase; letter-spacing:.06em; margin-bottom:2px; }\n.party__name{ font-size:9.3pt; font-weight:700; color:var(--c-ink); }\n.party__line{ font-size:8pt; color:var(--c-mute); line-height:1.35; }\n\n/* ============================================================\n   4. LINE-ITEM TABLE — minimal thin header, hairline rows, single-line\n   ============================================================ */\n.items{ width:100%; border-collapse:collapse; margin-top:10px; font-size:8.4pt; }\n.items thead th{\n  background:var(--c-navy); color:#fff; font-weight:600; font-size:7.6pt;\n  letter-spacing:.03em; text-align:left; padding:6px 8px;\n}\n.items thead th:first-child{ border-top-left-radius:5px; border-bottom-left-radius:5px; }\n.items thead th:last-child{ border-top-right-radius:5px; border-bottom-right-radius:5px; }\n.items tbody td{\n  padding:5px 8px; border-bottom:1px solid var(--c-line-2);\n  vertical-align:top; color:var(--c-ink); line-height:1.4;\n}\n.items .num{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }\n.items .ctr{ text-align:center; white-space:nowrap; }\n.items .col-no{ width:8mm; text-align:center; color:var(--c-mute-2); }\n.items .col-qty{ width:16mm; } .items .col-unit{ width:14mm; }\n.items .col-price{ width:23mm; } .items .col-amt{ width:25mm; }\n/* secondary detail kept INLINE so a row stays one line */\n.items td .sub{ color:var(--c-mute-2); font-size:7.4pt; }\n.items td .sub::before{ function tplEsc(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#x27;'); }
function tplGet(stack, path){
  for (let i = stack.length - 1; i >= 0; i--){ let cur = stack[i], ok = true;
    for (const k of path.split('.')){ if (cur && typeof cur === 'object' && !Array.isArray(cur) && k in cur) cur = cur[k]; else { ok = false; break; } }
    if (ok) return cur; }

function tplRender(t, stack){
  t = t.replace(/{{([#^])([\w.]+)}}([\s\S]*?){{\/\2}}/g, (m, kind, key, inner) => { const v = tplGet(stack, key), has = Array.isArray(v) ? v.length > 0 : !!v;
    if (kind === '^') return has ? '' : tplRender(inner, stack);
    if (Array.isArray(v)) return v.map(x => tplRender(inner, stack.concat([x]))).join('');
    return has ? tplRender(inner, stack.concat(typeof v === 'object' ? [v] : [])) : ''; });
  t = t.replace(/{{{([\w.]+)}}}/g, (m, k) => { const v = tplGet(stack, k); return v == null ? '' : String(v); });

  return STEPH('check-circle-2', 'ตรวจสอบและยืนยัน', 'ส่งแล้วแก้ไขไม่ได้ — ถ้าไม่อนุมัติ เอกสารจะกลับเป็นร่างเลขเดิมให้แก้แล้วส่งใหม่')
    + (low ? `<div class="alert-row"><i data-lucide="alert-triangle" class="w-4 h-4"></i><div>มีลูกค้า ${low} รายที่สั่งซื้อต่ำกว่า ${CFG.min_orders} ครั้งในเดือนนี้ — ส่งได้ แต่ตรวจอีกครั้ง</div></div>` : '')
    + `<div class="review-card"><div class="review-title"><i data-lucide="file-text" class="w-4 h-4"></i>ข้อมูลเอกสาร</div><div class="drawer-fields">
        ${kv('ผู้จัดทำ', esc(ME().name) + ' · ' + esc(ME().pos))}${kv('หน่วยงาน', esc(ME().dept))}${kv('ประจำเดือน', monthTh(f.period))}${kv('ผู้รับรอง (ค่าเริ่ม)', ap && ap.assignee ? esc(empOf(ap.assignee).name) : '—')}</div></div>

      <div class="review-card"><div class="review-title"><i data-lucide="store" class="w-4 h-4"></i>รายชื่อลูกค้า<span class="dt-count num">${f.customers.filter(c => c.cid).length}</span></div>${custTable(f.customers.filter(c => c.cid), f.period)}</div>
      <div class="review-card"><div class="review-title"><i data-lucide="paperclip" class="w-4 h-4"></i>เอกสารแนบ<span class="dt-count num">${f.files.length}</span></div>${f.files.length ? f.files.map(fileRow).join('') : '<div class="tl-body">ไม่มีเอกสารแนบ</div>'}</div>`;

function renderWizard(){
  const s = S.dw.step, edit = S.dw.editId ? findR(S.dw.editId) : null, last = s === STEPS.length;
  const body = s === 1 ? wizMain() : s === 2 ? wizAttach() : wizReview();
  return `<div class="dw-head"><div class="dw-head-row"><div>
        <div class="dw-eyebrow"><i data-lucide="${edit ? 'pencil' : 'file-plus'}" class="w-3.5 h-3.5"></i> ${edit ? 'แก้ไขเอกสาร' : 'สร้างเอกสารใหม่'}</div>
        <h2 class="dw-title">${edit ? edit.code : 'แบบสรุปความพึงพอใจ General Trade'}</h2></div>
        <button class="top-icon-btn" title="ปิด" onclick="closeDrawer()"><i data-lucide="x" class="w-5 h-5"></i></button></div>${stepper()}</div>
    <div class="drawer-body ${s === 1 ? 'is-soft' : ''}">${body}</div>
    <div class="dw-footer"><div>${s > 1 ? '<button class="btn btn-secondary" onclick="wizBack()"><i data-lucide="arrow-left" class="w-4 h-4"></i><span>ย้อนกลับ</span></button>' : ''}</div>
      <div class="dw-footer-right"><button class="btn btn-ghost" onclick="closeDrawer()">ยกเลิก</button>
        ${last ? `<button class="btn btn-secondary" id="btnDraft" onclick="saveDraft()" ${S.busy ? 'disabled' : ''}><i data-lucide="save" class="w-4 h-4"></i><span>${edit ? 'บันทึกการแก้ไข' : 'บันทึกแบบร่าง'}</span></button>
          <button class="btn btn-primary" id="btnSaveSubmit" onclick="saveAndSubmit()" ${S.busy ? 'disabled' : ''}>${S.busy ? '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>' : '<i data-lucide="send" class="w-4 h-4"></i><span>บันทึกและส่งอนุมัติ</span>'}</button>`
          : '<button class="btn btn-primary" id="btnNext" onclick="wizNext()"><span>ถัดไป</span><i data-lucide="arrow-right" class="w-4 h-4"></i></button>'}

}

/* ---------- wizard actions ---------- */
function goStep(n){ S.dw.step = n; render(); }
/* พิมพ์จำนวน → อัปเดตรวม/%/การ์ดสรุปแบบ soft (ไม่ rebuild — focus ไม่หลุด) */
function setCnt(sk, i, k, el){
  const f = wf(), v = el.value.trim(); f.scores[sk][i][k] = v; dirty();
  const ok = isCnt(v); el.classList.toggle('is-bad', !ok);
  if (ok && S.dw.err && S.dw.err.cells) delete S.dw.err.cells[sk + '-' + i + '-' + k];
  const c = secCalc(f.scores[sk]), set = (id, t) => { const x = document.getElementById(id); if (x) x.textContent = t; };
  set(`rt-${sk}-${i}`, c.rowTot[i]); c.sums.forEach((x, j) => set(`cs-${sk}-${j}`, x)); set(`ct-${sk}`, c.tot);
  set(`sp-${sk}`, pctTxt(c.pct) + (c.pct == null ? '' : '%')); set(`sh-${sk}`, c.tot ? `จาก ${c.tot} คำตอบ · ถ่วงน้ำหนัก 5–1` : 'ยังไม่มีคำตอบในด้านนี้'); set(`sum-${sk}`, pctTxt(c.pct) + (c.pct == null ? '' : '%'));
  const p = overall(f.scores), b = bandOf(p); set('sumTotal', p == null ? '—' : pctTxt(p) + '%'); set('sumLevel', b ? b.text : 'กรอกคะแนนเพื่อดูผลการแปลผล');
  const bx = document.getElementById('sumBox'); if (bx) bx.classList.toggle('is-off', p == null);
}
function setPeriod(v){ const f = wf(); f.period = v; dirty(); if (S.dw.err) delete S.dw.err.period; render(); }
function setCust(i, v){ const f = wf(); f.customers[i].cid = v; dirty(); if (S.dw.err && S.dw.err.cust) delete S.dw.err.cust[i]; if (S.dw.err) delete S.dw.err.noCust; render(); }
function addCust(){ wf().customers.push({ cid:null }); dirty(); render(); requestAnimationFrame(() => { const el = document.querySelector('#ss-cu' + (wf().customers.length - 1) + ' .ss-input'); if (el) el.focus(); }); }
function removeCust(i){ const f = wf(); if (f.customers.length === 1) return; f.customers.splice(i, 1); if (S.dw.err) S.dw.err.cust = {}; dirty(); render(); }
/* ดึงจาก Sale Order: ลูกค้า GT ในหน่วยงานผู้จัดทำที่สั่งซื้อ ≥ เกณฑ์ในเดือนที่เลือก (อ่านอย่างเดียว) */
function pullCustomers(){
  const f = wf(); if (!f.period) return;
  const zone = ME().dept.indexOf('เหนือ') >= 0 ? 'ภาคเหนือ' : 'ภาคกลาง', have = new Set(f.customers.map(c => c.cid).filter(Boolean));
  const add = CUSTOMERS.filter(c => c.zone === zone && orderCount(c.id, f.period) >= CFG.min_orders && !have.has(c.id)).map(c => ({ cid:c.id }));
  f.customers = f.customers.filter(c => c.cid).concat(add); if (!f.customers.length) f.customers = [{ cid:null }];
  if (S.dw.err){ S.dw.err.cust = {}; delete S.dw.err.noCust; }
  dirty(); render(); showToast(add.length ? `เพิ่มลูกค้า ${add.length} ราย` : 'ไม่มีลูกค้าเพิ่ม', 'info');
}
function validateMain(){
  const f = wf(), err = { cells:{}, cust:{} };
  if (!f.period) err.period = 1;
  let any = 0, badCell = 0;
  CFG.sections.forEach(s => f.scores[s.key].forEach((rw, i) => rw.forEach((x, k) => { if (!isCnt(x)) { err.cells[s.key + '-' + i + '-' + k] = 1; badCell++; } else any += toInt(x); })));
  if (badCell) err.cellMsg = 'ใส่เป็นจำนวนเต็ม 0 ขึ้นไป (จำนวนลูกค้า)';
  else if (!any){ err.cellMsg = 'กรอกคะแนนอย่างน้อย 1 ด้าน'; CFG.sections.forEach(s => f.scores[s.key][0].forEach((x, k) => { err.cells[s.key + '-0-' + k] = 1; })); }
  const seen = {};
  f.customers.forEach((c, i) => { if (!c.cid) err.cust[i] = 'เลือกลูกค้า'; else if (seen[c.cid]) err.cust[i] = 'ลูกค้าซ้ำกับแถวที่ ' + seen[c.cid]; else seen[c.cid] = i + 1; });
  if (!f.customers.some(c => c.cid)) err.noCust = 'เลือกลูกค้าที่ประเมินอย่างน้อย 1 ราย';
  const ok = !err.period && !err.cellMsg && !Object.keys(err.cust).length && !err.noCust;
  S.dw.err = ok ? null : err; return ok;
}
function wizNext(){
  if (S.dw.step === 1 && !validateMain()){ render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.dw.step += 1; render();
}
function wizBack(){ S.dw.step = Math.max(1, S.dw.step - 1); render(); }
function pickFiles(inp){ const f = wf(); gateFiles(Array.from(inp.files || [])).forEach(x => f.files.push({ name:x.name, size:fmtSize(x.size) })); inp.value = ''; dirty(); render(); }
function removeFile(i){ wf().files.splice(i, 1); dirty(); render(); }
/* บันทึกครั้งแรก = ENG-DOC-NUM.next() ออกเลขที่ (DEC-13) · ผู้จัดทำ snapshot ตำแหน่ง/หน่วยงาน ณ วันที่บันทึก */
function persist(){
  const f = wf(), me = ME(), t = nowIso();
  let r = S.dw.editId ? findR(S.dw.editId) : null;
  if (!r){
    SEQ += 1;
    r = { id:'R' + SEQ, code:DOC.prefix + '-2569-' + String(SEQ).padStart(4, '0'), status:'draft', emp:S.me, pos:me.pos, dept:me.dept, reqDate:TODAY, rejectNote:'',
      chain:resolveDoa(S.me), doa_entry_ref:MOCK_DOA_RESOLVED.doa_entry_ref, attachments:[], audit:[{ act:'สร้างเอกสาร', by:me.name, at:t, tone:'' }], createdBy:me.name, createdAt:t };
    RECS.unshift(r);
  } else r.audit.push({ act:'แก้ไขร่าง', by:me.name, at:t, tone:'' });
  Object.assign(r, { period:f.period, scores:JSON.parse(JSON.stringify(f.scores)), customers:f.customers.filter(c => c.cid).map(c => ({ cid:c.cid })), attachments:f.files.slice(), updatedBy:me.name, updatedAt:t });
  return r;
}
function saveDraft(){ if (S.busy) return; if (!validateMain()){ S.dw.step = 1; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const r = persist(); S.busy = false; closeDrawer(true); setTimeout(() => showToast('บันทึกร่างแล้ว · ' + r.code, 'info'), 300); }, 500); }
function saveAndSubmit(){ if (S.busy) return; if (!validateMain()){ S.dw.step = 1; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const r = persist(); S.busy = false; closeDrawer(true); setTimeout(() => openSubmit(r.id), 300); }, 500); }

/* =====================================================================
   MODALS — ส่งอนุมัติ (DOA slot ต่อขั้น #108) · อนุมัติ · ไม่อนุมัติ (กลับเป็นร่าง) · ยกเลิก · ทิ้งข้อมูล
   ===================================================================== */
function modalShell(icon, tone, title, sub, body, foot){
  return `<div class="modal-header"><div class="modal-header-icon ${tone}"><i data-lucide="${icon}" class="w-4 h-4"></i></div><div><h3 class="modal-title">${title}</h3><p class="modal-subtitle">${sub}</p></div></div>
    ${body ? `<div class="modal-body">${body}</div>` : ''}<div class="modal-footer">${foot}</div>`;
}
const busyLabel = (icon, label) => S.busy ? '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>' : `<i data-lucide="${icon}" class="w-4 h-4"></i><span>${label}</span>`;
function presetChips(list, cur){ return `<div class="chip-row">${list.map(p => `<button type="button" class="chip ${cur === p ? 'is-on' : ''}" onclick="setReasonPreset(this.dataset.v)" data-v="${esc(p)}">${esc(p)}</button>`).join('')}</div>`; }
function renderModal(){
  const m = S.md; if (!m) return '';
  const r = m.id ? findR(m.id) : null, p = r ? overall(r.scores) : null;
  if (m.kind === 'submit'){
    return modalShell('send', 'is-primary', 'ส่งอนุมัติ?', `${r.code} · ประจำเดือน ${monthTh(r.period)}`,
      `${resolveDoa(r.emp).map((c, i) => `<div class="slot-row"><span class="slot-no num">${c.step}</span><span class="slot-role">${esc(c.role)}</span><div class="field ${m.err && !m.slots[i] ? 'is-invalid' : ''}" id="fSlot${i}">${searchSelectHTML('slot' + i, { placeholder:'เลือกผู้พิจารณา' })}<div class="field-error">กรุณาเลือกผู้พิจารณา</div>${i === 0 ? '<div class="slot-help">ค่าเริ่มต้นจากสายอนุมัติ (DOA) และผังองค์กร</div>' : ''}</div></div>`).join('')}
       <div class="drawer-fields mt-3">${kv('% โดยรวม', pctTxt(p) + (p == null ? '' : '%'))}${kv('ผลการแปลผล', levelPill(p))}</div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="btnSubmit" onclick="confirmSubmit()" ${S.busy ? 'disabled' : ''}>${busyLabel('send', 'ส่งอนุมัติ')}</button>`);
  }
  if (m.kind === 'approve'){
    return modalShell('check-circle-2', 'is-success', 'อนุมัติแบบสรุปนี้?', `${r.code} · ${esc(empOf(r.emp).name)} · ${monthTh(r.period)}`,
      `<div class="drawer-fields">${kv('% โดยรวม', pctTxt(p) + (p == null ? '' : '%'))}${kv('ผลการแปลผล', levelPill(p))}</div>
       <div class="field mt-3"><label class="field-label">ความเห็น</label><textarea class="input" name="apNote" rows="2" placeholder="ไม่บังคับ" oninput="S.md.note=this.value">${esc(m.note || '')}</textarea></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-success" id="btnApprove" onclick="confirmApprove()" ${S.busy ? 'disabled' : ''}>${busyLabel('check', 'อนุมัติ')}</button>`);
  }
  if (m.kind === 'reject' || m.kind === 'cancel'){
    const rej = m.kind === 'reject';
    return modalShell('x-circle', 'is-danger', rej ? 'ไม่อนุมัติแบบสรุปนี้?' : 'ยกเลิกเอกสาร?', `${r.code} · ${esc(empOf(r.emp).name)}${rej ? ' · เอกสารจะกลับเป็นร่าง (เลขเดิม) ให้ผู้จัดทำแก้แล้วส่งใหม่' : ''}`,
      `${presetChips(rej ? REJECT_PRESETS : CANCEL_PRESETS, m.preset)}
       <div class="field ${m.err ? 'is-invalid' : ''}" id="fReason"><label class="field-label">เหตุผล<span class="req">*</span></label><textarea class="input" name="reason" rows="3" placeholder="${rej ? 'แจ้งผู้จัดทำว่าต้องแก้อะไร' : 'เหตุผลที่ยกเลิก'}" oninput="S.md.reason=this.value; if(this.value.trim()) document.getElementById('fReason').classList.remove('is-invalid')">${esc(m.reason || '')}</textarea><div class="field-error">กรุณาระบุเหตุผล</div></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">${rej ? 'ยกเลิก' : 'ไม่ยกเลิก'}</button><button class="btn btn-danger" id="btnReason" onclick="confirmReason()" ${S.busy ? 'disabled' : ''}>${busyLabel('x-circle', rej ? 'ไม่อนุมัติ' : 'ยกเลิกเอกสาร')}</button>`);
  }
  if (m.kind === 'discard'){
    return modalShell('alert-triangle', 'is-warning', 'ทิ้งข้อมูลที่กรอกไว้?', 'ข้อมูลในแบบฟอร์มนี้ยังไม่ได้บันทึก', '',
      `<button class="btn btn-ghost" onclick="closeModal()">กลับไปกรอกต่อ</button><button class="btn btn-danger" id="btnDiscard" onclick="closeModal(); closeDrawer(true)">ทิ้งข้อมูล</button>`);
  }
  return '';
}
function openModalCfg(cfg){ S.md = cfg; state.modal.open = true; render(); requestAnimationFrame(() => document.getElementById('modalBackdrop').classList.add('is-open')); }
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('is-open'); state.modal.open = false; setTimeout(() => { if (!state.modal.open) S.md = null; }, 200); }
/* backdrop ปิดด้วย mousedown ที่ backdrop เท่านั้น (#122) — ลากจากในกล่องไปปล่อยข้างนอกไม่ปิด */
function modalBackdropDown(ev){ if (ev.target !== ev.currentTarget) return; if (S.md && (S.md.reason || S.md.note)) return; closeModal(); }
function setReasonPreset(v){ S.md.preset = v; S.md.reason = v + (S.md.reason && S.md.reason.indexOf(v) !== 0 ? ' — ' + S.md.reason : ''); S.md.err = false; render(); }
function openSubmit(id){ const r = findR(id); if (!r || r.status !== 'draft') return; openModalCfg({ kind:'submit', id, slots:resolveDoa(r.emp).map(c => c.assignee) }); }
function openApprove(id){ openModalCfg({ kind:'approve', id, note:'' }); }
function openReject(id){ openModalCfg({ kind:'reject', id, reason:'' }); }
function openCancel(id){ closeRowMenu(); openModalCfg({ kind:'cancel', id, reason:'' }); }
function pushAudit(r, act, note, tone){ const me = ME(), t = nowIso(); r.audit.push({ act, by:me.name, at:t, note:note || '', tone:tone || '' }); r.updatedBy = me.name; r.updatedAt = t; }
/* ENG-NOTIFY (NTF_BRIEF_F-TMP-002): csm_cancelled · csm_low_csat — DOA engine เป็นเจ้าของ doa_pending/doa_result */
function confirmSubmit(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (m.slots.some(x => !x)){ m.err = true; render(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    r.chain = resolveDoa(r.emp).map((c, i) => Object.assign(c, { assignee:m.slots[i], status:i === 0 ? 'pending' : 'waiting' }));   /* BR-DOA-02 resolve ตอนส่งแล้ว freeze */
    r.status = 'pending'; r.submittedAt = nowIso(); r.rejectNote = ''; pushAudit(r, 'ส่งอนุมัติ', 'ถึง ' + empOf(m.slots[0]).name);
    S.busy = false; closeModal(); render(); setTimeout(() => showToast('ส่งอนุมัติแล้ว · ' + r.code, 'success'), 220); }, 600);
}
/* อนุมัติ: ไม่เปลี่ยนค่าในระบบ ไม่ส่งต่อระบบอื่น (DEC-01/02) · ผลต่ำกว่าช่วงกลาง → ENG-NOTIFY csm_low_csat */
function confirmApprove(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    const c = curStep(r); c.status = 'approved'; c.at = nowIso(); c.note = (m.note || '').trim();
    const next = r.chain.find(x => x.status === 'waiting'); if (next) next.status = 'pending';
    r.status = next ? 'pending' : 'approved'; pushAudit(r, next ? 'อนุมัติ (ขั้น ' + c.step + ')' : 'อนุมัติ', c.note, 'ok');
    const p = overall(r.scores), low = r.status === 'approved' && p != null && r2(p) < CFG.bands[1].min;
    S.busy = false; closeModal(); render(); setTimeout(() => showToast('อนุมัติแล้ว · ' + r.code + (low ? ' · แจ้งฝ่ายขาย: ผลต่ำกว่า ' + CFG.bands[1].min + '%' : ''), 'success'), 220); }, 600);
}
/* ไม่อนุมัติ = กลับเป็นร่างเลขเดิม (DEC-11 · BR-DOA-03) · ยกเลิก = ปิดใบ (เหตุผลบังคับ) */
function confirmReason(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (!(m.reason || '').trim()){ m.err = true; render(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    const why = m.reason.trim();
    if (m.kind === 'reject'){ const c = curStep(r); c.status = 'rejected'; c.at = nowIso(); c.note = why; pushAudit(r, 'ไม่อนุมัติ', why, 'bad');
      r.status = 'draft'; r.rejectNote = why; r.submittedAt = null; r.chain = resolveDoa(r.emp); pushAudit(r, 'กลับเป็นร่าง (เลขเดิม)', '', ''); }
    else { r.status = 'cancelled'; const c = curStep(r); if (c) c.status = 'skipped'; pushAudit(r, 'ยกเลิกเอกสาร', why, 'bad'); }
    S.busy = false; closeModal(); render(); setTimeout(() => showToast(m.kind === 'reject' ? 'ไม่อนุมัติ — กลับเป็นร่าง · ' + r.code : 'ยกเลิกเอกสารแล้ว · ' + r.code, m.kind === 'reject' ? 'warning' : 'info'), 220); }, 600);
}

/* =====================================================================
   RENDER + DRAWER
   ===================================================================== */
function render(){
  const snap = preserveRenderState();
  if (!S.booted){ S.booted = true; applyRoute(); }
