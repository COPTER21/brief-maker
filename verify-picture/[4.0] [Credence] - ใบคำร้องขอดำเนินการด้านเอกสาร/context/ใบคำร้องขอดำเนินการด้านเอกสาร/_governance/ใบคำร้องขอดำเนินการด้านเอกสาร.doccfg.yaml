# doccfg-declaration v2.1 — init จาก DECISIONS.lock + print_config · frd_ref หลัง FRD (frd_lint)
feature_id: F-TMP-007
doc_types:
- code: DAR
  name_th: ใบคำร้องขอดำเนินการด้านเอกสาร
  module: CCC
  feature_id: F-TMP-007
  numbering:
    preset: '{PREFIX}-{YYYY}-{run:4}'
    reset: yearly
    scope: global
    no_gap: false
    issue_on: first_save
    frd_ref: 03_LOGIC F-TMP-007-FN-02
  snapshot:
    sent_external: false
    approved_final: true
  snapshot_points:
  - event: approved_final
    frd_ref: 03_LOGIC F-TMP-007-FN-04
  print_config:
    form_code: FM-CCC-03
    revision: 'Rev.00 : 01/07/2569'
    paper: A4-portrait
    min_rows: 14
    dense_when_rows_over: 18
    header_source: organization_snapshot_at_numbering
    sign_boxes:
    - box: requester
      label: ผู้จัดทำ
      show_date: true
    - box: doa_step:*
      label: from_doa_step
      show_decision: true
      show_date: true
    - box: receipt
      label: ลงนามรับเอกสารควบคุม
      show_date: true
      note: ไม่ใช่ขั้น DOA — ผู้รับเอกสารกดลงนามรับหลังอนุมัติ (ข้อความระบบ)
    decision_words:
      default:
        approve: อนุมัติ
        reject: ไม่อนุมัติ
      by_role: {}
    sign_layout:
      source: approval_chain snapshot (ผู้จัดทำ + จำนวนขั้นตามที่ตั้งใน DOA)
      max_per_row: 4
      split: even
      dense_when_steps_over: 4
      keep_together: true
    ref: print/print_config.json
    pages: 2
