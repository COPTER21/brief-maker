# unattended — AI-DEFAULT ทุกหมวด รอลูกค้ายืนยัน
# J007 · FM-CCC-03 ใบคำร้องขอดำเนินการด้านเอกสาร (DAR) · ตอบตาม 4_knowledge/governance/unattended-policy.md

# G1 ผลต่อระบบ — ฟอร์มไม่ได้เขียนว่าเปลี่ยนค่าในระบบ/ส่งต่อ → ไม่เปลี่ยนค่า ไม่ส่งต่อ (การขึ้นทะเบียน/แก้ไขเอกสารควบคุมจริงทำโดย Document Control นอกระบบนี้ · ระบบเก็บคำขอ + ผลพิจารณา + การแจกจ่าย · Document No. เอกสารที่ขอ ผู้ใช้กรอกเอง)
config_changes: []
post_to: []

# G2 สายอนุมัติ — ช่องพิจารณาบนกระดาษ 4 ช่อง (ผู้ตรวจสอบ · ผู้อนุมัติ · ผู้ควบคุมเอกสาร · ผู้จัดการฝ่ายสำนักเลขานุการบริษัท) → dynamic 4 ขั้น · ผู้ตรวจสอบ = ผู้บังคับบัญชาตรง · ที่เหลือ role ตามหน้าที่บนกระดาษ · ไม่มีวงเงิน · กระดาษระบุ "ตามตารางผู้มีอำนาจอนุมัติด้านเอกสาร" → ตั้งที่ DOA กลาง
doa: { required: true, mode: dynamic, default_steps: ["role-line-manager", "role-mgr-bu", "role-doc-controller", "role-mgr-ocs"], amount: none }

# G3 สูตร / ค่าคงที่ — ไม่มีสูตร/ค่าคงที่บนกระดาษ · กติกาตรวจ
calc:
  constants_from_config: true
  auto_compute: false
  over_limit: warn
  rules:
    - "วัตถุประสงค์ เลือก 1 ข้อ (บล็อก) · ISSUE เลือก 1 ข้อ (บล็อก)"
    - "วัตถุประสงค์ = แก้ไขเอกสาร → ต้องกรอก Revision / ISSUE เดิม และ ใหม่ (บล็อก) · ขึ้นทะเบียนใหม่ / อื่นๆ → ต้องกรอก Revision / ISSUE ใหม่ (บล็อก)"
    - "ที่มา = อื่นๆ → ต้องกรอก รายละเอียด (บล็อก)"
    - "หน่วยงานที่ต้องได้รับการแจกจ่าย เลือกอย่างน้อย 1 (บล็อก) · วิธีรับ เลือกอย่างน้อย 1 (บล็อก)"
    - "วิธีรับ = E-mail → ต้องระบุ E-Mail รูปแบบถูกต้องอย่างน้อย 1 ที่อยู่ (บล็อก)"
    - "วันที่บังคับใช้เอกสาร ก่อนวันที่เขียนใบ DAR → เตือน ไม่บล็อก"
    - "แถวเอกสารที่ต้องจัดทำ/ทบทวน: กรอก Document No. หรือ ชื่อเอกสาร ช่องใดช่องหนึ่ง ต้องกรอกอีกช่อง (บล็อก)"

# G4 รายการซ้ำ — กระดาษ 14 แถว → ไม่จำกัด · PDF ขั้นต่ำ 14 แถว
repeat: { max_rows: null }

# G5 ช่องตามกระดาษ — 1:1 ไม่เพิ่มช่อง · หน่วยงานแจกจ่าย 27 ช่องตามกระดาษ (ชุดซ้ำ V–AA ติดป้าย (2) — OQ ลูกค้า)
fidelity: { one_to_one: true, add_fields: [], merge_split: [] }

# G6 ลายเซ็น — แถวล่าง: ผู้จัดทำ (ผู้ส่ง) + 1 ช่องต่อขั้น DOA · ลงนามรับเอกสารควบคุม = ข้อความระบบเมื่อผู้รับกดรับ · ไม่ใช้ภาพ
signature: { layout: row-bottom, per_doa_step: true, handwriting_image: false }

# G7 ไม่อนุมัติ → กลับเป็นร่างเลขเดิม · ยกเลิกได้ เจ้าของ + admin role · ร่าง/รออนุมัติ · เหตุผลบังคับ
reject_cancel: { on_reject: draft, cancel_by: [owner, admin_role], cancel_states: [draft, pending], reason_required: true }

# G8 การมองเห็น — เจ้าของ · ผู้อนุมัติหลังส่ง · admin role ของหน่วยงานเจ้าของเอกสาร (Document Control Center / CCC) เห็นทั้งหมด
visibility: { owner: true, approver: after_submit, admin_role: all }

# G9 เลขที่ — ออกตอนบันทึกครั้งแรก (เอกสารภายใน) · รหัส DAR พิมพ์บนกระดาษ (DAR.No.) · ไม่ชน registry
numbering: { issue_on: first_save, code: DAR }

# G10 ของเสริม — แนบ ✓ (ร่างเอกสารที่ขอขึ้นทะเบียน/แก้ไข) CSV ✓ ทำซ้ำ ✗ ประกาศ ✗
extras: { attachments: true, copy: false, export_csv: true, announce: false }

extend: {}
fit: {}
