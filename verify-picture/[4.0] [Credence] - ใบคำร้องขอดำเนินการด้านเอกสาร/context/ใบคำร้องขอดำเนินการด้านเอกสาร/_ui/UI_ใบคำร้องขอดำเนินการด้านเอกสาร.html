h></tr></thead>\n    <tbody>{{#related_cont}}<tr><td class=\"g-v\">{{doc_no}}</td><td class=\"g-v\">{{doc_name}}</td></tr>\n    {{/related_cont}}</tbody>\n  </table>{{/has_related_cont}}\n  <table class=\"form-grid\">\n    <colgroup><col class=\"g-25\"><col class=\"g-25\"><col class=\"g-25\"><col class=\"g-25\"></colgroup>\n    <thead><tr><th colspan=\"4\">หน่วยงาน/ตำแหน่ง ที่ต้องได้รับการแจกจ่ายเอกสาร</th></tr></thead>\n    <tbody>{{#dist_rows}}<tr>{{#cells}}<td><span class=\"cb\">{{box}}</span> {{label}}</td>{{/cells}}</tr>\n    {{/dist_rows}}</tbody>\n  </table>\n  <table class=\"form-grid\">\n    <colgroup><col class=\"g-25\"><col class=\"g-25\"><col class=\"g-25\"><col class=\"g-25\"></colgroup>\n    <tr><th>หมายเหตุ</th><td colspan=\"3\" class=\"g-v\">{{distribution.remark}}</td></tr>\n    <tr><th>วิธีการรับเอกสาร</th><td><span class=\"cb\">{{receive.email}}</span> E-mail &nbsp; <span class=\"cb\">{{receive.paper}}</span> Paper</td><th>ระบุ E-Mail</th><td class=\"g-v\">{{distribution.emails}}</td></tr>\n  </table>\n  <table class=\"form-grid form-grid--signs\">\n    <colgroup><col class=\"g-25\"><col class=\"g-75\"></colgroup>\n    <tr><th>ลงนามรับเอกสารควบคุม</th><td><div class=\"sign__line\"></div><div class=\"sign__paren\">({{receipt.name}})</div><div class=\"sign__date\">{{receipt.date}}</div></td></tr>\n  </table>\n  </div>\n</div><div class=\"doc-bottom{{#layout.dense}} is-dense{{/layout.dense}}\">\n  <div class=\"signs-block\">{{#sign_rows}}<table class=\"form-grid form-grid--signs\"><tr>{{#signs}}<td>\n    <div class=\"g-b\">{{role}}</div>\n    <div class=\"sign__name\">{{#decision}}{{approve_box}} {{approve_word}} &nbsp;&nbsp; {{reject_box}} {{reject_word}}{{/decision}}{{^decision}}&nbsp;{{/decision}}</div>\n    <div class=\"sign__line\"></div>\n    <div class=\"sign__paren\">({{name}})</div>\n    <div class=\"sign__name\">ตำแหน่ง {{position}}</div>\n    <div class=\"sign__date\">{{date}}</div>\n  </td>{{/signs}}</tr></table>\n  {{/sign_rows}}<div class=\"form-note\">หมายเหตุ : ผู้ตรวจสอบ และผู้อนุมัติ ให้เป็นไปตาม ตารางผู้มีอำนาจอนุมัติด้านเอกสาร</div></div>\n  <div class=\"doc-footer\"><span>เลขที่ {{doc.no}}{{#doc.is_draft}} · ร่าง{{/doc.is_draft}}{{#doc.is_cancelled}} · ยกเลิก{{/doc.is_cancelled}} · เอกสารนี้จัดทำโดยระบบ CUBE NATIVE</span><span>Doc. No. : {{doc.form_code}} · {{doc.revision}}</span></div>\n  <div class=\"page-no\">เลขที่ {{doc.no}} · หน้า 2/2</div>\n</div></div>\n";
/* print_config.json (F-DOCCFG ค่าเริ่ม) — ระบบจริงอ่านจาก Document Configuration */
const PRINT_CFG = { change_min_rows:8, rows_page1:14, page1_row_budget:22, dist_cols:4, dense_when_rows_over:18, max_per_row:4, dense_when_steps_over:4,
  decision_words:{ default:{ approve:'อนุมัติ', reject:'ไม่อนุมัติ' }, by_role:{} } };
const BLANK_DATE = 'วันที่ ........./........./.........';
const TH_MONTH = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const thFull = iso => { if (!iso) return ''; const d = iso.slice(0, 10).split('-'); return Number(d[2]) + ' ' + TH_MONTH[Number(d[1]) - 1] + ' ' + (Number(d[0]) + 543); };
const tShort = iso => { if (!iso) return ''; const d = iso.slice(0, 10).split('-'); return Number(d[2]) + ' ' + ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][Number(d[1]) - 1] + ' ' + (Number(d[0]) + 543); };
const box = on => on ? '☑' : '☐';
const boxes = (list, picked) => { const o = {}; list.forEach(j => { o[j[0]] = box(picked.includes(j[0])); }); return o; };
/* print data contract (= print/make_data.py · DAR_data-contract.md) — ระบบจริง: backend สร้าง JSON นี้จาก record แล้ว render template เดียวกัน */
function docPrintData(r){
  const e = empOf(r.emp), C = PRINT_CFG, mark = (label, iso) => iso ? `${label} ${tShort(iso)} ${iso.slice(11, 16)} น.` : '';
  const words = id => C.decision_words.by_role[id] || C.decision_words.default;
  const sent = r.status !== 'draft' && r.submittedAt;
  const signs = [{ role:'ผู้จัดทำ', name:e.name, position:r.pos, date:sent ? mark('ส่งในระบบ', r.submittedAt) : BLANK_DATE, decision:null }]
    .concat(r.chain.map(c => { const p = empOf(c.assignee), done = c.status === 'approved' || c.status === 'rejected', w = words(c.role_id);
      return { role:c.role, name:sent && c.assignee ? p.name : '', position:sent && c.assignee ? p.pos : '', date:done ? mark('พิจารณาในระบบ', c.at) : BLANK_DATE,
        decision:{ approve_box:box(c.status === 'approved'), reject_box:box(c.status === 'rejected'), approve_word:w.approve, reject_word:w.reject } }; }));
  /* รายละเอียดการแก้ไข: แตกบรรทัดเดิม/ใหม่ เติมแถวว่างครบ change_min_rows */
  const b = r.before ? r.before.split('\n') : [], a = r.after ? r.after.split('\n') : [], n = Math.max(b.length, a.length, C.change_min_rows), cr = [];
  for (let i = 0; i < n; i++) cr.push({ before:b[i] || '', after:a[i] || '' });
  /* เอกสารเกี่ยวข้อง: หน้า 1 = page1_row_budget − แถวแก้ไข · ส่วนเกินไปตารางต่อหน้า 2 (R10) */
  const cap = Math.max(0, C.page1_row_budget - cr.length), rel = r.related.map(x => ({ doc_no:x.docNo, doc_name:x.docName }));
  const p1 = rel.slice(0, cap), cont = rel.slice(cap); while (p1.length < cap) p1.push({ doc_no:'', doc_name:'' });
  const cells = DIST.map(d => ({ box:box(r.dists.includes(d[0])), label:d[1] })); while (cells.length % C.dist_cols) cells.push({ box:'', label:'' });
  const distRows = []; for (let i = 0; i < cells.length; i += C.dist_cols) distRows.push({ cells:cells.slice(i, i + C.dist_cols) });
  return {
    company:{ name:DOC.company, logo:CO_LOGO },
    doc:{ title:DOC_TITLE_PAPER, no:r.code, is_draft:r.status === 'draft', is_cancelled:r.status === 'cancelled', form_code:DOC.form, revision:DOC.rev },
    dar_date:thFull(r.reqDate),
    requester:{ name:e.name, division:r.div, department:r.dept },
    target:{ doc_no:r.docNo, revision:r.revision, doc_name:r.docName, effective_date:thFull(r.effDate), pl_wi_step:r.plWiStep },
    purpose:boxes(PURPOSE, [r.purpose]), issue:boxes(ISSUE, [r.issue]), origin:boxes(ORIGIN, [r.origin]), origin_detail:r.originDetail,
    change_rows:cr, related_p1:p1, related_cont:cont, has_related_cont:cont.length > 0,
    dist_rows:distRows,
    distribution:{ remark:r.remark, emails:r.recv.includes('email') ? r.emails : '' },
    receive:boxes(RECV, r.recv),
    receipt:r.receipt ? { name:r.receipt.name, date:mark('ลงนามรับในระบบ', r.receipt.at) } : { name:'', date:BLANK_DATE },
    sign_rows:tplSignRows(signs, C.max_per_row),
    layout:{ dense:r.related.length > C.dense_when_rows_over || r.chain.length > C.dense_when_steps_over },
  };
}

/* ---------- wizard actions (soft update ระหว่างพิมพ์ — ไม่ rebuild) ---------- */
function goStep(n){ S.dw.step = n; render(); }
function clearErr(k){ if (S.dw.err) delete S.dw.err[k]; const el = document.getElementById('f-' + k); if (el) el.classList.remove('is-invalid'); }
function setF2(k, v){ wf()[k] = v; dirty(); if (v.trim()) clearErr(k); }
function sumSync(){ const f = wf(), set = (id, t) => { const el = document.getElementById(id); if (el) el.textContent = t; };
  set('sumPurpose', (f.purpose ? lbl(PURPOSE, f.purpose) : '—') + ' · ' + (f.issue ? lbl(ISSUE, f.issue) : '—')); set('sumDist', f.dists.length ? f.dists.length + ' หน่วยงาน' : '—'); }
/* วัตถุประสงค์/ที่มา เปลี่ยนช่องบังคับ → render · ISSUE soft */
function pickOpt(k, v){ wf()[k] = v; dirty(); clearErr(k); if (k === 'issue'){ sumSync(); return; } if (k === 'purpose'){ clearErr('before'); clearErr('after'); } if (k === 'origin') clearErr('originDetail'); render(); }
function toggleDist(k, on){ const f = wf(); f.dists = on ? f.dists.concat([k]) : f.dists.filter(x => x !== k); f.dists.sort(); dirty(); clearErr('dists'); sumSync(); }
function toggleRecv(k, on){ const f = wf(); f.recv = on ? f.recv.concat([k]) : f.recv.filter(x => x !== k); f.recv.sort((a, b) => RECV.findIndex(j => j[0] === a) - RECV.findIndex(j => j[0] === b));
  if (k === 'email' && !on){ f.emails = ''; clearErr('emails'); } dirty(); clearErr('recv'); if (k === 'email') render(); }
function pickEff(iso){ wf().effDate = iso; dirty(); clearErr('effDate'); render(); }
function addRel(){ const f = wf(); f.related.push({ docNo:'', docName:'' }); dirty(); render(); const el = document.querySelector(`[name="relNo${f.related.length - 1}"]`); if (el) el.focus(); }
function delRel(i){ wf().related.splice(i, 1); if (S.dw.err) Object.keys(S.dw.err).filter(k => k.indexOf('rel') === 0).forEach(k => delete S.dw.err[k]); dirty(); render(); }
function setRel(i, k, v){ wf().related[i][k] = v; dirty(); clearErr('rel' + i); }
/* G3 (DEC-04/13/14/15/16): วัตถุประสงค์ · ISSUE เลือก 1 · แก้ไข → เดิม+ใหม่ · ขึ้นทะเบียนใหม่/อื่นๆ → ใหม่ · ที่มาอื่นๆ → รายละเอียด · แจกจ่าย ≥1 · วิธีรับ ≥1 · E-mail ≥1 รูปแบบถูก · แถวเอกสารเกี่ยวข้องครบคู่ · วันบังคับใช้ก่อนวันเขียน = เตือน ไม่บล็อก */
function validateMain(){
  const f = wf(), err = {};
  if (!f.purpose) err.purpose = 'เลือกวัตถุประสงค์ 1 ข้อ';
  if (!f.issue) err.issue = 'เลือก ISSUE 1 ข้อ';

/* ENG-NOTIFY (NTF_BRIEF_F-TMP-007): dar_cancelled · dar_distributed · dar_received — DOA engine เป็นเจ้าของ doa_pending/doa_result */
function confirmSubmit(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (m.slots.some(x => !x)){ m.err = true; render(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    r.chain = resolveDoa(r.emp).map((c, i) => Object.assign(c, { assignee:m.slots[i], status:i === 0 ? 'pending' : 'waiting' }));   /* BR-DOA-02 resolve ตอนส่งแล้ว freeze */
    r.status = 'pending'; r.submittedAt = nowIso(); r.returned = null; pushAudit(r, 'ส่งอนุมัติ', 'ถึง ' + empOf(m.slots[0]).name);
    S.busy = false; closeModal(); render(); setTimeout(() => showToast('ส่งอนุมัติแล้ว · ' + r.code, 'success'), 220); }, 600);
}
/* อนุมัติครบ: ไม่เปลี่ยนค่าในระบบ · ไม่ส่งต่อระบบอื่น (DEC-01/02) — แจ้งหน่วยงานที่แจกจ่าย + อีเมลที่ระบุ (dar_distributed) */
function confirmApprove(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    const c = curStep(r); c.status = 'approved'; c.at = nowIso(); c.note = (m.note || '').trim();
    const next = r.chain.find(x => x.status === 'waiting'); if (next) next.status = 'pending';   /* sequential */
    r.status = next ? 'pending' : 'approved'; pushAudit(r, next ? 'อนุมัติ (ขั้น ' + c.step + ')' : 'อนุมัติ', c.note, 'ok');
    S.busy = false; closeModal(); render(); setTimeout(() => showToast('อนุมัติแล้ว · ' + r.code, 'success'), 220); }, 600);
}
/* ลงนามรับเอกสารควบคุม → สถานะ ลงนามรับแล้ว (dar_received → เจ้าของ + ผู้ควบคุมเอกสาร) */
function confirmReceive(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (!m.emp){ m.err = true; render(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    const rc = empOf(m.emp); r.receipt = { emp:rc.id, name:rc.name, at:nowIso(), by:ME().name }; r.status = 'received'; pushAudit(r, 'ลงนามรับเอกสารควบคุม', 'ผู้รับ ' + rc.name, 'ok');
    S.busy = false; closeModal(); render(); setTimeout(() => showToast('ลงนามรับเอกสารควบคุมแล้ว · ' + r.code, 'success'), 220); }, 600);
}
/* ไม่อนุมัติ = กลับเป็นร่างเลขเดิม (DEC-08 · BR-DOA-03) · ยกเลิก = เหตุผลบังคับ */
function confirmReason(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (!(m.reason || '').trim()){ m.err = true; render(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    const why = m.reason.trim(), me = ME();
    if (m.kind === 'reject'){ r.returned = { note:why, by:me.name, at:nowIso() }; r.status = 'draft'; r.submittedAt = null; r.chain = resolveDoa(r.emp); pushAudit(r, 'ไม่อนุมัติ — กลับเป็นร่าง', why, 'bad'); }
    else { r.status = 'cancelled'; const c = curStep(r); if (c) c.status = 'skipped'; pushAudit(r, 'ยกเลิกเอกสาร', why, 'bad'); }
    S.busy = false; closeModal(); if (m.kind === 'reject' && S.dw && !canSee(r)) closeDrawer(true); render();
    setTimeout(() => showToast(m.kind === 'reject' ? 'ไม่อนุมัติ — ส่งกลับเป็นร่าง · ' + r.code : 'ยกเลิกเอกสารแล้ว · ' + r.code, m.kind === 'reject' ? 'warning' : 'info'), 220); }, 600);
}

const FILE_ACCEPT = '.pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg', FILE_RE = /\.(pdf|docx?|xlsx?|png|jpe?g)$/i, FILE_MAX_MB = 20;

function gateFiles(list){

  if (bad.length) showToast(bad.length === 1 ? `${bad[0][0]} — ${bad[0][1]}` : `แนบไม่ได้ ${bad.length} ไฟล์ — ชนิดไฟล์ไม่รองรับหรือใหญ่เกิน ${FILE_MAX_MB} MB`, 'error');
