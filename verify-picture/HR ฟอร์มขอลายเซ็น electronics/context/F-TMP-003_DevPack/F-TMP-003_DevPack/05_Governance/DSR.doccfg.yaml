# doccfg-declaration v2.1 — init จาก DECISIONS.lock + print_config · แก้ได้ก่อน brief
feature_id: F-TMP-003
doc_types:
- code: DSR
  name_th: คำขอมีและใช้ลายเซ็นดิจิทัล (Digital Signature)
  module: HR
  feature_id: F-TMP-003
  numbering:
    preset: '{PREFIX}-{YYYY}-{run:4}'
    reset: yearly
    scope: global
    no_gap: false
    issue_on: first_save
    frd_ref: '03_LOGIC FN-04'
  snapshot:
    sent_external: false
    approved_final: true
  snapshot_points:
  - event: approved_final
    frd_ref: '03_LOGIC FN-11'
  print_config:
    form_code: FM-HRM-23
    revision: 'Rev. 00 : 01/07/2569'
    paper: A4-portrait
    min_rows: 0
    dense_when_rows_over: 0
    header_source: organization_snapshot_at_numbering
    sign_boxes:
    - box: requester
      label: ผู้ยื่นคำขอ
      show_date: true
    - box: doa_step:*
      label: from_doa_step
      show_decision: true
      show_date: true
    decision_words:
      default:
        approve: อนุมัติ
        reject: ไม่อนุมัติ
      by_role:
        role-mgr-hr:
          approve: ดำเนินการได้
          reject: ไม่สามารถดำเนินการได้
    sign_layout:
      source: approval_chain snapshot (ผู้ขอ + จำนวนขั้นตามที่ตั้งใน DOA)
      max_per_row: 4
      split: even
      dense_when_steps_over: 4
      keep_together: true
    ref: print/print_config.json
