<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เงินเดือน · CUBE NATIVE</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">

<!-- Lucide Icons: loader ที่ท้าย body (ดู section "Lucide loader" ก่อน main <script>) -->
<!-- เหตุผล:
     1) ย้ายมาท้าย body หลีกเลี่ยง race กับ DOMContentLoaded
     2) Multi-CDN fallback (unpkg → jsdelivr → cdnjs)
     3) Pin version (เลิกใช้ @latest ที่ flaky — GitHub issue #2962)
-->

<style>
/* ===== BASE-KIT v6.4 — DO NOT EDIT (Rule #69) — page CSS ต่อท้ายหลัง END marker ===== */
/* ============== CSS VARIABLES (CUBE CI — v2.0 Warm Light rebrand) ============== */
:root {
  --c-navy: #111111;
  --c-navy-2: #111111;
  --c-primary: #FF3B30;
  --c-primary-hover: #E62E24;
  --c-teal: #FF9A1F;
  --c-teal-light: #FFB763;
  --c-ink: #111111;
  --c-mute: #54565C;
  --c-mute-2: #73757B;
  --c-mute-3: #9A9CA2;
  --c-line: #DEDAD4;
  --c-line-2: #E9E5E0;
  --c-line-3: #F1EEEA;
  --c-bg-off: #FAF8F5;
  --c-success: #1F9D55;
  --c-warning: #E8870F;
  --c-danger: #E62E24;
  --sidebar-w: 232px;
  --shell-h: 52px;
  /* v3.13 — Fixed type scale (Iron Rule locked values) */
  --fs-h1: 22px;        /* page title */
  --fs-h2: 17px;        /* section title */
  --fs-h3: 15px;        /* card / drawer title */
  --fs-body: 14px;      /* body default */
  --fs-sub: 13px;       /* secondary body / table cell */
  --fs-meta: 12px;      /* meta / label */
  --fs-cap: 11px;       /* uppercase section caption */
  --fs-kpi: 28px;       /* stat value */
  /* v3.13 — Fixed spacing scale */
  --sp-xs: 4px; --sp-sm: 8px; --sp-md: 12px; --sp-lg: 20px; --sp-xl: 28px;
  /* v3.13 — Fixed radius scale */
  --r-xs: 4px; --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-full: 999px;
}

/* ============== RESET ============== */
* { box-sizing: border-box; }
html, body { margin:0; padding:0; }
/* Rule #35 — Layout Stability: จองพื้นที่ scrollbar ไว้เสมอ → เปิด modal/drawer หรือ
   content โตขึ้นแล้ว scrollbar โผล่/หาย จะไม่ทำให้หน้าจอขยับซ้าย-ขวา (jank) */
html { scrollbar-gutter: stable; }

/* ============== SCROLLBAR (Iron Rule #49 — minimal, ห้าม default) ============== */
/* เส้นบางมาก 5px · track โปร่งใส · พื้นเข้ม (sidebar/panel) = ขาวโปร่ง · พื้นสว่าง = charcoal จาง */
* { scrollbar-width: thin; scrollbar-color: rgba(17,17,17,.16) transparent; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(17,17,17,.14); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: rgba(17,17,17,.26); }
.sidebar, .slide { scrollbar-color: rgba(255,255,255,.28) transparent; }
.sidebar ::-webkit-scrollbar-thumb, .slide ::-webkit-scrollbar-thumb,
.sidebar::-webkit-scrollbar-thumb, .slide::-webkit-scrollbar-thumb { background: rgba(255,255,255,.28); }
.sidebar ::-webkit-scrollbar-thumb:hover, .slide ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.42); }
body {
  font-family: 'Satoshi', 'Noto Sans Thai', system-ui, sans-serif;
  background: var(--c-bg-off);
  color: var(--c-ink);
  font-size:14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  /* v7.1 Rule #97: desktop-base + adaptive — 768-1180 ปรับ layout ผ่าน media query,
     <768 = horizontal scroll (ไม่ guarantee) */
  min-width: 768px;
}
a { text-decoration: none; color: inherit; }
button { font-family: inherit; cursor: pointer; }
[data-lucide] { flex-shrink: 0; }

/* Hide number input spinner globally (Iron Rule #19) */
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin:0; }
input[type="number"] { -moz-appearance: textfield; }

/* ============== SIDEBAR ============== */
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: var(--sidebar-w);
  background: #111111;
  color: #E9E5E0;
  z-index:var(--z-shell);
  display: flex;
  flex-direction: column;
  border-right: 1px solid rgba(255,255,255,0.06);
}
.sb-brand {
  padding:18px;
  display: flex;
  align-items: center;
  gap:12px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  flex-shrink: 0;
}
.sb-logo {
  width: 34px; height: 34px;
  background: linear-gradient(135deg, #FF3B30, #FF9A1F);
  border-radius: 9px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(255,59,48,0.3);
}
.sb-name { font-weight: 700; font-size:14px; color: #fff; letter-spacing: -0.01em; line-height: 1.2; }
.sb-sub { font-size:11px; color: #9A9CA2; letter-spacing: 0.06em; font-weight: 600; text-transform: uppercase; margin-top:2px; }
.sb-nav { flex: 1; padding:12px 8px; overflow-y: auto; }

/* Module = collapsible group (Iron Rule #27).
   Header toggles expand/collapse only — NOT navigable.
   Children = .sb-features (clickable feature items). */
.sb-module { margin-bottom:4px; }
.sb-module-header {
  display: flex; align-items: center; gap:8px;
  width: 100%;
  padding:8px 10px;
  border-radius: 6px;
  background: transparent; border: 0;
  color: #9A9CA2;
  font-family: inherit;
  font-size:11px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
  cursor: pointer; transition: all 120ms;
  text-align: left;
}
.sb-module-header:hover { background: rgba(255,255,255,0.04); color: #DEDAD4; }
.sb-module-header .mod-icon { flex-shrink: 0; opacity: 0.7; }
.sb-module-header .mod-label { flex: 1; }
.sb-module-header .mod-chevron {
  flex-shrink: 0;
  transition: transform 200ms;
  opacity: 0.7;
}
.sb-module[data-expanded="false"] .mod-chevron { transform: rotate(-90deg); }
.sb-module[data-expanded="false"] .sb-features { display: none; }

.sb-features { padding:2px 0 6px 0; }

.sb-item {
  display: flex; align-items: center; gap:10px;
  padding:8px 12px 8px 16px;
  border-radius: 6px;
  color: #DEDAD4;
  font-size:13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 120ms;
  margin-bottom:1px;
  position: relative;
  user-select: none;
}
.sb-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.sb-item.is-active {
  background: #FF3B30;
  color: #fff;
  font-weight: 600;
}
.sb-item.is-active::before {
  content: '';
  position: absolute;
  left: -10px; top: 7px; bottom: 7px;
  width: 3px;
  background: #fff;
  border-radius: 0 2px 2px 0;
}
.sb-item [data-lucide] { width: 16px; height: 16px; opacity: 0.85; }
.sb-item.is-active [data-lucide] { opacity: 1; }
.sb-badge {
  margin-left:auto;
  font-size:11px;
  font-weight: 600;
  background: rgba(255,255,255,0.10);
  color: #9A9CA2;
  padding:2px 8px;
  border-radius: 999px;
}
.sb-item.is-active .sb-badge { background: rgba(255,255,255,0.18); color: #fff; }
.sb-item.is-disabled { opacity: 0.4; cursor: not-allowed; }
.sb-item.is-disabled:hover { background: transparent; color: #DEDAD4; }
.sb-footer {
  padding:12px 16px;
  border-top: 1px solid rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  gap:8px;
  font-size:12px;
  color: #9A9CA2;
}
.pulse-dot {
  width: 7px; height: 7px;
  background: var(--c-teal);
  border-radius: 50%;
  box-shadow: 0 0 0 3px rgba(255,154,31,0.20);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

/* ============== MAIN ============== */
.main {
  margin-left:var(--sidebar-w);
  min-height: 100vh;
  background: var(--c-bg-off);
}

/* ============== SHELL BAR ============== */
.shell-bar {
  position: sticky;
  top: 0;
  background: #fff;
  border-bottom: 1px solid var(--c-line-2);
  height: var(--shell-h);
  display: flex;
  align-items: center;
  padding:0 24px;
  z-index:var(--z-sticky);
  gap:12px;
}
.breadcrumb {
  display: flex;
  align-items: center;
  gap:8px;
  font-size:13px;
  color: var(--c-mute);
}
.breadcrumb a { cursor: pointer; transition: color 120ms; }
.breadcrumb a:hover { color: var(--c-primary); }
.breadcrumb .sep { color: var(--c-mute-3); font-size:11px; }
.breadcrumb-current { color: var(--c-ink); font-weight: 500; }
.icon-btn {
  width: 34px; height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 0;
  color: var(--c-mute);
  border-radius: 7px;
  position: relative;
  transition: all 120ms;
}
.icon-btn:hover { background: var(--c-line-3); color: var(--c-ink); }
.icon-btn [data-lucide] { width: 17px; height: 17px; }
.notif-dot {
  position: absolute;
  top: 7px; right: 8px;
  width: 7px; height: 7px;
  background: var(--c-danger);
  border-radius: 50%;
  border: 2px solid #fff;
}
.user-chip {
  display: flex;
  align-items: center;
  gap:10px;
  padding:6px 10px 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 120ms;
}
.user-chip:hover { background: var(--c-line-3); }
.user-text { line-height: 1.2; text-align: right; }
.user-name { font-size:12.5px; font-weight: 500; color: var(--c-ink); white-space: nowrap; }
.user-role { font-size:11px; color: var(--c-mute-2); white-space: nowrap; margin-top:1px; }
.avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--c-primary), var(--c-teal));
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size:12px;
  font-weight: 600;
  flex-shrink: 0;
}

/* User dropdown menu */
.user-menu {
  position: absolute;
  top: calc(var(--shell-h) - 4px);
  right: 22px;
  background: #fff;
  border: 1px solid var(--c-line-2);
  border-radius: 10px;
  box-shadow: 0 12px 32px rgba(17,17,17,0.12);
  width: 240px;
  z-index:var(--z-dropdown);
  padding:6px;
  display: none;
}
.user-menu.is-open { display: block; }
.user-menu-item {
  display: flex;
  align-items: center;
  gap:10px;
  padding:8px 12px;
  border-radius: 6px;
  font-size:13px;
  color: var(--c-ink);
  cursor: pointer;
  transition: background 120ms;
}
.user-menu-item:hover { background: var(--c-bg-off); }
.user-menu-item [data-lucide] { width: 15px; height: 15px; color: var(--c-mute-2); }
.user-menu-item.is-danger { color: var(--c-danger); }
.user-menu-item.is-danger [data-lucide] { color: var(--c-danger); }
.user-menu-divider { height: 1px; background: var(--c-line-2); margin:6px 0; }

/* ============== CONTENT ============== */
/* Fluid full-width — content stretches to fill viewport (Iron Rule #30).
   Do NOT add max-width here; component-level constraints (modal/toast/wizard
   internal cards) are responsible for their own readability bounds. */
.content {
  padding:24px;
}

/* ============== v7.1 RESPONSIVE — Rule #97 (desktop-base adaptive) ============== */
.nav-toggle { display:none; }
@media (max-width: 1180px){
  .content { padding:16px; }
  .drawer { width: min(920px, 100vw); }
  .drawer.standard { width: min(680px, 100vw); }
  .drawer.wide, .drawer-panel.wide { width: min(1290px, 100vw); }
  /* generic shell: sidebar เป็น off-canvas — Pattern N shell ใช้ icon rail ของตัวเองแทน */
  .main { margin-left: 0; }
  .sidebar { transform: translateX(-100%); transition: transform .18s ease; }
  .sidebar.open { transform: translateX(0); box-shadow: 0 8px 32px rgba(0,0,0,.24); }
  .nav-toggle { display:inline-flex; align-items:center; justify-content:center;
    width:32px; height:32px; border:none; background:transparent; border-radius:8px;
    color:var(--c-ink); }
  .nav-toggle:hover { background: rgba(17,17,17,.06); }
}

/* ============== v7.1 LIST FULL-HEIGHT — Rule #96 ============== */
/* หน้า list หลัก: ตารางยืดเต็มพื้นที่เหลือ ติดขอบล่างเสมอ ทุกขนาดจอ */
.page-fill { display:flex; flex-direction:column;
  min-height: calc(100dvh - var(--shellbar-h, 52px) - 48px); } /* 48 = content padding บน+ล่าง */
@media (max-width:1180px){ .page-fill { min-height: calc(100dvh - var(--shellbar-h, 52px) - 32px); } }
.page-fill > .card-list, .page-fill > .list-card { flex:1 1 auto; min-height:0;
  display:flex; flex-direction:column; }
.table-wrap { flex:1 1 auto; min-height:0; overflow:auto; }
.table-wrap thead th { position:sticky; top:0; background:#fff; z-index:var(--z-sticky); }
.table-foot { flex:0 0 auto; } /* pagination/count ติดล่างของ card เสมอ */

/* ============== v7.1 OVERLAY PORTAL — Rule #95 ============== */
/* เมนูที่ portal ออกจาก scroll container (ใช้คู่ portalMenu util) */
.menu-fixed { position:fixed !important; z-index:var(--z-dropdown);
  background:#fff; border:1px solid var(--c-line, #E7E2DB); border-radius:10px;
  box-shadow:0 12px 32px rgba(17,17,17,.14); overflow-y:auto; }

/* ============== PAGE HEADER ============== */
.ph {
  margin-bottom:18px;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: flex-start;
  gap:16px;
}
.ph > div:first-child { flex: 1 1 auto; min-width: 280px; }
.ph-title-row {
  display: flex;
  align-items: baseline;
  gap:10px;
  margin-bottom:6px;
}
.ph-title {
  font-family: 'Noto Sans Thai', sans-serif;
  font-size:20px;
  font-weight: 700;
  color: var(--c-navy);
  margin:0;
  letter-spacing: -0.01em;
}
.ph-count {
  font-size:12.5px;
  font-weight: 600;
  color: var(--c-mute-2);
  background: var(--c-line-3);
  padding:3px 10px;
  border-radius: 999px;
}
.ph-sub { font-size:13px; color: var(--c-mute); margin:0; }
.ph-actions { display: flex;align-items:center; gap:8px; flex-shrink: 0; }

/* ============== BUTTONS ============== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;   /* Rule #36 — content กึ่งกลางแนวนอน */
  gap:6px;
  height: 36px;
  /* Rule #36 — padding-top 2px = optical centering สำหรับฟอนต์ไทย (Noto Sans Thai):
     baseline ของไทยลอยสูงเมื่อ flex-center เพราะ font เผื่อที่สระล่าง → นัดจ์ลง 2px ให้เข้ากลางจริง.
     ✅ verified ด้วยการ render จริง — ทนทุกเบราว์เซอร์ (ต่างจาก text-box-trim ที่รองรับเฉพาะ Chrome 133+). */
  padding:2px 16px 0;
  border-radius: 8px;
  font-size:13px;
  font-weight: 500;
  /* ⚠️ Rule #36 — ห้ามใส่ line-height:1 / overflow:hidden กับตัวปุ่มที่มีข้อความไทย
     เพราะจะ "ตัดสระบน-วรรณยุกต์-สระล่าง" ทำให้ตัวอักษรเบี้ยว. ปล่อย line-height ตาม body (1.5). */
  border: 1px solid transparent;
  background: transparent;
  white-space: nowrap;       /* label ไม่ตัดบรรทัด → ปุ่มในแถวเดียวสูงเท่ากัน */
  transition: all 120ms;
  user-select: none;
  cursor: pointer;
}
.btn [data-lucide] { width: 15px; height: 15px; flex-shrink: 0; }  /* Rule #36 — icon ไม่ถูกบีบ */
.btn:disabled, .btn.is-disabled { opacity: .55; cursor: not-allowed; pointer-events: none; }
.btn-eq { min-width: 104px; }  /* Rule #36 — ปุ่มคู่ที่ควรสมมาตร → กว้างเท่ากัน */
/* Rule #36 — label ยาวที่ "ต้อง" จำกัดความกว้าง: truncate ที่ span (.lbl) ไม่ใช่ที่ตัวปุ่ม.
   line-height (1.5) สูงพอ → overflow:hidden ตัดเฉพาะแนวนอน (ไม่ตัดสระไทย). ปกติปล่อยปุ่มโตตาม label ดีกว่า. */
.btn-truncate { max-width: 220px; }
.btn-truncate .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn-primary { background: var(--c-primary); color: #fff; }
.btn-primary:hover { background: var(--c-primary-hover); box-shadow: 0 2px 8px rgba(255,59,48,0.30); }
.btn-secondary { background: #fff; border-color: var(--c-line); color: var(--c-ink); }
.btn-secondary:hover { background: var(--c-line-3); border-color: var(--c-mute-2); }
.btn-ghost { color: var(--c-mute); }
.btn-ghost:hover { background: var(--c-line-3); color: var(--c-ink); }
.btn-danger { background: #fff; border-color: var(--c-line); color: var(--c-danger); }
.btn-danger:hover { background: #FFE9E7; border-color: var(--c-danger); }
.btn-link { background: transparent; border: 0; padding:0 4px; height: auto; color: var(--c-primary); font-weight: 500; }
.btn-link:hover { text-decoration: underline; }
.btn-sm { height: 30px; padding:2px 12px 0; font-size:12px; }

/* ============== STATS (KPI Cards) ============== */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap:12px;
  margin-bottom:18px;
}
.stat {
  background: #fff;
  border: 1px solid var(--c-line-2);
  border-radius: 10px;
  padding:16px 16px;
  transition: all 150ms;
}
.stat:hover { border-color: var(--c-line); box-shadow: 0 2px 8px rgba(17,17,17,0.05); }
.stat-label {
  display: flex;
  align-items: center;
  gap:6px;
  font-size:12px;
  font-weight: 500;
  color: var(--c-mute);
}
.stat-label [data-lucide] { width: 13px; height: 13px; color: var(--c-primary); }
.stat-value {
  font-family: 'Noto Sans Thai', sans-serif;
  font-size:26px;
  font-weight: 700;
  color: var(--c-navy);
  margin-top:6px;
  letter-spacing: -0.01em;
}
.stat-meta {
  font-size:12px;
  color: var(--c-mute-2);
  margin-top:6px;
  display: flex;
  align-items: center;
  gap:4px;
}
.stat-meta.is-up { color: var(--c-success); }
.stat-meta.is-down { color: var(--c-danger); }
.stat-meta [data-lucide] { width: 12px; height: 12px; }

/* ============== CARD ============== */
.card {
  background: #fff;
  border: 1px solid var(--c-line-2);
  border-radius: 10px;
  overflow: hidden;
}

/* ============== FILTER BAR ============== */
.filter-bar {
  padding:16px 18px;
  display: flex;
  gap:10px;
  align-items: center;
  border-bottom: 1px solid var(--c-line-2);
  background: #fff;
  flex-wrap: wrap;
}

/* ============== INPUTS ============== */
.input, .select {
  height: 36px;
  padding:0 12px;
  border: 1px solid var(--c-line);
  border-radius: 8px;
  font-size:13px;
  background: #fff;
  color: var(--c-ink);
  font-family: inherit;
  transition: all 120ms;
  width: 100%;
}
.input:focus, .select:focus {
  outline: none;
  border-color: var(--c-primary);
  box-shadow: 0 0 0 3px rgba(255,59,48,0.10);
}
.select {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2364748B' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat;
  background-position: right 10px center;
  padding-right:32px;
  appearance: none;
}
.input-search { position: relative; flex: 1; max-width: 320px; }
.input-search input { padding-left:36px; }
.input-search .lead-icon {
  position: absolute;
  left: 11px; top: 50%;
  transform: translateY(-50%);
  width: 15px; height: 15px;
  color: var(--c-mute-2);
  pointer-events: none;
}

/* ===== SEARCH-SELECT (Iron Rule #34) — searchable dropdown แทน <select> เมื่อ options เยอะ/lookup master =====
   list = position:absolute overlay → ไม่ดันเนื้อหา (สอดคล้อง Rule #35) */
.search-select { position: relative; width: 100%; }
.search-select .ss-input { padding-left:32px; padding-right:32px; }
.search-select .ss-lead {
  position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px;   /* ⬅ ขนาดตายตัว — ไม่พึ่ง .w-4 (กัน Lucide เรนเดอร์ 24px default → placeholder ดูห่าง) */
  color: var(--c-mute-3); pointer-events: none;
}
.search-select .ss-caret {
  position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
  width: 15px; height: 15px; color: var(--c-mute-3); pointer-events: none;
}
.search-select .ss-clear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  display: inline-flex; padding:3px; border: 0; background: transparent;
  color: var(--c-mute-2); cursor: pointer; border-radius: 6px;
}
.search-select .ss-clear:hover { background: var(--c-line-3); color: var(--c-ink); }
.ss-list {
  position: absolute; z-index:var(--z-backdrop); left: 0; right: 0; margin-top:4px;
  max-height: 280px; overflow-y: auto; background: #fff;
  border: 1px solid var(--c-line); border-radius: 8px;
  box-shadow: 0 10px 30px rgba(17,17,17,0.10), 0 4px 10px rgba(17,17,17,0.05);
}
.ss-opt {
  width: 100%; display: flex; align-items: center; gap:10px; padding:10px 12px;
  border: 0; border-bottom: 1px solid var(--c-line-3); background: transparent;
  cursor: pointer; text-align: left; font-family: inherit;
}
.ss-opt:last-child { border-bottom: 0; }
.ss-opt:hover, .ss-opt.is-active { background: rgba(255,59,48,0.06); }
.ss-opt-ic { width: 16px; height: 16px; color: var(--c-primary); flex-shrink: 0; }  /* ขนาดตายตัวเช่นกัน */
.ss-opt-main { flex: 1; min-width: 0; }
.ss-opt-label { display: block; font-size:13px; color: var(--c-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ss-opt-sub { display: block; font-size:12px; color: var(--c-mute-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ss-opt-right { flex-shrink: 0; font-size:12px; color: var(--c-mute); }
.ss-opt mark { background: rgba(255,59,48,0.16); color: inherit; padding:0 1px; border-radius: 2px; }
.ss-empty { padding:20px 16px; text-align: center; font-size:13px; color: var(--c-mute-2); }

/* ============== TABLE ============== */
.table-scroll { overflow-x: auto; }
.table {
  width: 100%;
  border-collapse: collapse;
  font-size:13px;
}
.table thead { background: var(--c-bg-off); }
.table th {
  padding:12px 16px;
  text-align: left;
  font-weight: 600;
  color: var(--c-mute);
  font-size:12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border-bottom: 1px solid var(--c-line-2);
  white-space: nowrap;
}
.table th.col-check { width: 40px; padding-right:0; }
.table th.is-sortable { cursor: pointer; user-select: none; }
.table th.is-sortable:hover { color: var(--c-ink); background: var(--c-line-3); }
.table th .sort-arrow { display: inline-block; margin-left:4px; opacity: 0.4; }
.table th.is-sorted .sort-arrow { opacity: 1; color: var(--c-primary); }
.table td {
  padding:12px 16px 12px;  /* Rule #38 — optical centering ไทย: pad-top มากกว่า bottom 2px */
  border-bottom: 1px solid var(--c-line-2);
  color: var(--c-ink);
  vertical-align: middle;
}
.table tbody tr { transition: background 120ms; }
.table tbody tr:hover { background: var(--c-bg-off); }
.table tbody tr.is-selected { background: rgba(255,59,48,0.04); }
.table tbody tr.is-selected:hover { background: rgba(255,59,48,0.07); }
.table tbody tr:last-child td { border-bottom: 0; }
/* Rule #41 — แถวกดได้ = เปิด view (ไม่มีไอคอนดวงตา). row ที่ clickable ต้องสื่อด้วย cursor */
.table tbody tr.is-clickable { cursor: pointer; }
/* Rule #42 — Long-list UX: sticky header (opt-in .is-sticky) — ตารางยาว scroll หัวค้าง */
.table-scroll.is-sticky { max-height: 560px; overflow-y: auto; scrollbar-gutter: stable; }
.table-scroll.is-sticky thead th {
  position: sticky; top: 0; z-index: 3;
  background: var(--c-bg-off);            /* ⚠️ ต้องทึบที่ตัว th (ไม่ใช่แค่ thead) — ไม่งั้น row เลื่อนทะลุซ้อนหัว */
  box-shadow: inset 0 -1px 0 var(--c-line-2);  /* border-bottom สำหรับ sticky (border ปกติหายตอน sticky) */
}
/* Rule #42 — Thai-safe cell truncation: ตัดเฉพาะแนวนอน (… ) line-height พอ ไม่ตัดสระ. ใส่ title=ค่าเต็มเพื่อ hover ดู */
.cell-truncate { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
/* Rule #43 — ตัวเลข tabular + คอลัมน์ตัวเลขชิดขวา */
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
th.col-num, td.col-num { text-align: right; }
td.col-num .num, td.col-num { font-variant-numeric: tabular-nums; }

/* ============== CHECKBOX ============== */
.cb {
  width: 16px; height: 16px;
  border: 1.5px solid var(--c-line);
  border-radius: 4px;
  background: #fff;
  cursor: pointer;
  display: inline-block;
  position: relative;
  transition: all 120ms;
  flex-shrink: 0;
}
.cb.is-checked, .cb.is-partial {
  background: var(--c-primary);
  border-color: var(--c-primary);
}
.cb.is-checked::after {
  content: '';
  position: absolute;
  left: 4px; top: 1px;
  width: 5px; height: 9px;
  border: solid #fff;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
.cb.is-partial::after {
  content: '';
  position: absolute;
  left: 3px; top: 6px;
  width: 8px; height: 2px;
  background: #fff;
}
.cb:hover { border-color: var(--c-primary); }

/* ============== USER CELL ============== */
.user-cell { display: flex; align-items: center; gap:10px; }
.uc-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--c-primary), var(--c-teal));
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size:12px;
  font-weight: 600;
  flex-shrink: 0;
}
.uc-name { font-weight: 600; color: var(--c-ink); font-size:13px; line-height: 1.3; }
.uc-email { font-size:12px; color: var(--c-mute-2); margin-top:1px; line-height: 1.3; }

/* ============== PILLS ============== */
.pill {
  display: inline-flex;
  align-items: center;
  gap:5px;
  height: 22px;            /* Rule #38.1 — ทุก pill สูงเท่ากันเป๊ะ · ห้ามใช้ padding ตั้งความสูง */
  line-height: 1;
  padding:1px 10px 0;      /* optical centering ไทย (บน 1px) */
  border-radius: 999px;
  font-size:11.5px;
  vertical-align: middle;
  box-sizing: border-box;
  font-weight: 600;
  white-space: nowrap;
}
.pill [data-lucide] { width: 11px; height: 11px; }
.pill-registered { background: #E6F0FF; color: #1A5FCC; }
.pill-active { background: #E6F0FF; color: #1A5FCC; }
.pill-converted { background: #E4F4EB; color: #157A41; }
.pill-suspended { background: #FFF1DD; color: #B8690B; }
.pill-archived { background: var(--c-line-3); color: var(--c-mute-2); }
/* v3.13 — Semantic pill aliases (ใช้ชุดนี้เป็นหลัก — mapping ดู knowledge/microcopy.md) */
.pill-info    { background: #E6F0FF; color: #1A5FCC; }   /* กำลังดำเนินการ/ใช้งาน */
.pill-success { background: #E4F4EB; color: #157A41; }   /* อนุมัติแล้ว/เสร็จสิ้น */
.pill-warning { background: #FFF1DD; color: #B8690B; }   /* รอดำเนินการ/รออนุมัติ */
.pill-danger  { background: #FFE9E7; color: #E62E24; }   /* ปฏิเสธ/ยกเลิก */
.pill-muted   { background: var(--c-line-3); color: var(--c-mute-2); } /* ร่าง/ปิดใช้งาน/เก็บถาวร */

/* v3.13 — Loading spinner (Iron Rule #44) */
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 0.8s linear infinite; }

/* v3.13 — Form Section Grouping (Iron Rule #45) */
.form-section { margin-top:var(--sp-xl); }
.form-section:first-child { margin-top:0; }
.form-section-title {
  font-size: var(--fs-cap); font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--c-mute);
  padding-bottom:var(--sp-sm); border-bottom: 1px solid var(--c-line-2);
  margin-bottom:var(--sp-md);
}

/* v3.13 — Segmented control (ช่วงเวลา dashboard ฯลฯ — Pattern J) */
.seg-control { display:inline-flex; background: var(--c-line-3); border-radius: var(--r-md); padding:2px; gap:2px; }
.seg-item {
  padding:6px 12px 3px; border-radius: var(--r-sm); border: none; background: transparent;
  font-size: var(--fs-meta); font-weight: 500; color: var(--c-mute-2); cursor: pointer;
  font-family: inherit; white-space: nowrap;
}
.seg-item.is-active { background: #fff; color: var(--c-ink); font-weight: 600; box-shadow: 0 1px 3px rgba(17,17,17,0.08); }
.pill-danger { background: #FFE9E7; color: var(--c-danger); }

.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  display: inline-block;
}
.dot.is-active { background: #1A5FCC; box-shadow: 0 0 0 2.5px rgba(37,99,235,0.18); }
.dot.is-converted { background: #157A41; box-shadow: 0 0 0 2.5px rgba(6,95,70,0.20); }
.dot.is-suspended { background: var(--c-warning); }
.dot.is-archived { background: var(--c-mute-3); }

/* Mini-link cell (e.g. tenant link) */
.tenant-link {
  display: inline-flex;
  align-items: center;
  gap:4px;
  color: var(--c-primary);
  font-size:12.5px;
  font-weight: 500;
  cursor: pointer;
}
.tenant-link:hover { text-decoration: underline; }
.tenant-link [data-lucide] { width: 12px; height: 12px; }

/* ============== ROW ACTIONS ============== */
.row-actions { display: inline-flex; gap:2px; }
.ra-btn {
  width: 28px; height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 0;
  color: var(--c-mute-2);
  border-radius: 6px;
  transition: all 120ms;
}
.ra-btn:hover { background: var(--c-line-3); color: var(--c-primary); }
.ra-btn.is-danger:hover { background: #FFE9E7; color: var(--c-danger); }
.ra-btn.is-success:hover { background: rgba(255,154,31,0.12); color: var(--c-teal); }
.ra-btn [data-lucide] { width: 15px; height: 15px; }

/* ============== TABLE FOOTER ============== */
.table-footer {
  padding:12px 18px;
  background: var(--c-bg-off);
  border-top: 1px solid var(--c-line-2);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size:12.5px;
  color: var(--c-mute);
  flex-wrap: wrap;
  gap:10px;
}
.pagination { display: inline-flex; gap:4px; align-items: center; }
.pg-btn {
  min-width: 30px; height: 30px;
  padding:0 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #fff;
  border: 1px solid var(--c-line-2);
  border-radius: 6px;
  color: var(--c-mute);
  font-size:12.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all 120ms;
}
.pg-btn:hover { border-color: var(--c-line); background: var(--c-bg-off); }
.pg-btn.is-active { background: var(--c-primary); border-color: var(--c-primary); color: #fff; }
.pg-btn.is-disabled { opacity: 0.4; cursor: not-allowed; }
.pg-btn [data-lucide] { width: 13px; height: 13px; }

/* ============== BULK BAR ============== */
.bulk-bar {
  background: var(--c-navy);
  color: #fff;
  padding:12px 18px;
  border-radius: 8px 8px 0 0;
  display: flex;
  align-items: center;
  gap:12px;
  border-bottom: 1px solid var(--c-line-2);
  margin:-1px -1px 0;
  font-size:13px;
}
.bulk-bar .btn { height: 30px; padding:2px 12px 0; font-size:12px; }
.bulk-bar .btn-secondary {
  background: rgba(255,255,255,0.10);
  border-color: rgba(255,255,255,0.18);
  color: #fff;
}
.bulk-bar .btn-secondary:hover { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.30); }

/* ============== DRAWER ============== */
/* ---- v6.1 Pattern B drawer chrome (locked to references/drawer-standard/pr.html) ----
   create/edit drawer ให้ใช้ชุดนี้: .dw-head (eyebrow + h2 20px + .top-icon-btn ปิด)
   + .d-stepper (.stepper-item/.stepper-circle 32px — ไม่ใช่ .stepper กลางของ page wizard)
   + .dw-footer (ย้อนกลับ secondary ซ้าย · ยกเลิก ghost + primary ชิดขวา) */
.top-icon-btn { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border:0; background:transparent; border-radius: var(--r-sm); color: var(--c-mute-2); cursor:pointer; transition: all 120ms; flex-shrink:0; }
.top-icon-btn:hover { background: var(--c-line-3); color: var(--c-ink); }
.dw-head { padding:18px 24px 16px; border-bottom: 1px solid var(--c-line-2); flex-shrink: 0; }
.dw-head-row { display: flex; align-items: flex-start; justify-content: space-between; gap:16px; }
.dw-eyebrow { display: flex; align-items: center; gap:6px; font-size:11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--c-mute-2); margin-bottom:4px; font-weight: 600; }
.dw-title { font-size:20px; font-weight: 700; color: var(--c-navy); margin:0; letter-spacing: -0.01em; }
.dw-sub { font-size: var(--fs-meta); color: var(--c-mute-2); margin-top:4px; }
.d-stepper { display: flex; align-items: flex-start; gap:0; width: 100%; margin-top:18px; }
.stepper-item { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; min-width: 0; }
.stepper-circle { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size:13px; font-weight: 600; background: #fff; color: var(--c-mute-3); border: 2px solid var(--c-line); transition: all 200ms; z-index: 2; }
.stepper-item.active .stepper-circle { background: var(--c-primary); color: #fff; border-color: var(--c-primary); box-shadow: 0 0 0 4px rgba(255,59,48,0.12); }
.stepper-item.done .stepper-circle { background: var(--c-primary); color: #fff; border-color: var(--c-primary); }
.stepper-label { margin-top:8px; font-size:12px; font-weight: 500; color: var(--c-mute-3); text-align: center; line-height: 1.3; transition: color 200ms; }
.stepper-item.active .stepper-label { color: var(--c-navy); font-weight: 600; }
.stepper-item.done .stepper-label { color: var(--c-mute); }
.stepper-item:not(:last-child)::after { content: ''; position: absolute; top: 15px; left: 50%; right: -50%; height: 2px; background: var(--c-line-2); z-index: 1; }
.stepper-item.done:not(:last-child)::after { background: var(--c-primary); }
.dw-footer { padding:16px 24px; border-top: 1px solid var(--c-line-2); background: var(--c-bg-off); flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap:8px; }
.dw-footer-right { display: flex; align-items: center; gap:8px; }

.drawer-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(17,17,17,0.40);
  z-index:var(--z-backdrop);
  opacity: 0;
  pointer-events: none;
  transition: opacity 220ms;
}
.drawer-backdrop.is-open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 920px;           /* v2 standard (Iron Rule #11) — wide drawer */
  max-width: 96vw;
  background: #fff;
  z-index:var(--z-drawer);
  transform: translateX(100%);
  transition: transform 280ms cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  box-shadow: -16px 0 40px rgba(17,17,17,0.18);
}
.drawer.is-open { transform: translateX(0); }
.drawer.standard { width: 680px; }   /* simple forms / short view (Iron Rule #11) */

/* ========== STEPPER STANDARD (Iron Rule #47) — ใช้ตัวเดียวทุก wizard ========== */
.stepper { display:flex; align-items:center; gap:var(--sp-sm); }
.step { display:flex; align-items:center; gap:var(--sp-sm); }
.step-dot {
  width:26px; height:26px; border-radius: var(--r-full);
  display:flex; align-items:center; justify-content:center;
  font-size: var(--fs-meta); font-weight:600; padding-top:1px; /* Thai rhythm */
  border:1.5px solid var(--c-line); background:#fff; color: var(--c-mute-2);
}
.step-label { font-size: var(--fs-sub); color: var(--c-mute-2); font-weight:500; white-space:nowrap; }
.step-connector { width:28px; height:1.5px; background: var(--c-line-2); flex:0 0 auto; }
.step.is-current .step-dot { border-color: var(--c-primary); background: var(--c-primary); color:#fff; }
.step.is-current .step-label { color: var(--c-ink); font-weight:600; }
.step.is-done .step-dot { border-color: var(--c-teal); background:#fff; color: var(--c-teal); }
.step.is-done .step-connector, .step.is-current ~ * {}
.step.is-done + .step-connector { background: var(--c-teal); }
/* placement: drawer wizard → .drawer-stepper-band (ใต้ header) / page wizard → .wizard-stepper-band */
.drawer-stepper-band { padding:10px 24px; border-bottom: 1px solid var(--c-line-2); background: var(--c-bg-off); }

.drawer-header {
  display: flex;
  align-items: center;
  gap:16px;
  padding:18px 24px;
  border-bottom: 1px solid var(--c-line-2);
}
/* ---- Rule #38.2 TABS (kit เดียว · ห้ามเขียน .drawer-tab/.seg เองแทน) ---- */
.tabs { display:flex; gap:0; border-bottom:1px solid var(--c-line-2); margin:0 0 var(--sp-lg); flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
.tabs::-webkit-scrollbar { display:none; }
.tab { display:inline-flex; align-items:center; gap:6px; height:40px; padding:0 14px; margin-bottom:-1px; border:0; border-bottom:2px solid transparent; background:transparent; font:inherit; font-size:13px; font-weight:500; color:var(--c-mute); cursor:pointer; white-space:nowrap; flex:0 0 auto; }
.tab [data-lucide] { width:14px; height:14px; }
.tab:hover { color:var(--c-ink); }
.tab.is-active, .tab.on { color:var(--c-primary); border-bottom-color:var(--c-primary); font-weight:600; }
.tab .tab-badge { font-size:10.5px; font-weight:700; background:var(--c-line-2); color:var(--c-mute); border-radius:999px; height:18px; line-height:18px; padding:0 7px; }
.tab.is-active .tab-badge { background:rgba(255,59,48,.12); color:var(--c-primary); }
/* drawer header ที่มี tabs — header เป็น column · tabs bleed เต็มกว้าง · เส้นเดียว (ของ header) · body ไม่มี border-top */
.drawer-header.has-tabs { flex-direction:column; align-items:stretch; gap:0; padding-bottom:0; }
.drawer-header.has-tabs .dw-head-row { display:flex; align-items:flex-start; gap:16px; padding-bottom:14px; }
.drawer-header.has-tabs .tabs { margin:0 -24px -1px; padding:0 24px; border-bottom:0; }
.drawer-header.has-tabs + .drawer-body { border-top:0; }
.dw-eyebrow { font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--c-mute-2); display:flex; align-items:center; gap:6px; margin-bottom:4px; }
.dw-title { font-size:18px; font-weight:700; color:var(--c-ink); line-height:1.25; }
/* page-level tabs ใต้ page header (Rule #104) */
.ph + .tabs, .page-tabs { margin:-4px 0 var(--sp-lg); }
/* ---- Rule #106 info tooltip แทน hint banner ---- */
.tip { position:relative; display:inline-flex; align-items:center; color:var(--c-mute-2); cursor:help; }
.tip [data-lucide] { width:13px; height:13px; }
.tip::after { content:attr(data-tip); position:absolute; left:50%; bottom:calc(100% + 6px); transform:translateX(-50%); background:var(--c-ink); color:#fff; font-size:11.5px; font-weight:400; line-height:1.45; padding:6px 10px; border-radius:6px; white-space:normal; width:max-content; max-width:280px; opacity:0; pointer-events:none; transition:opacity 120ms; z-index:var(--z-tooltip,60); }
.tip:hover::after { opacity:1; }
.drawer-avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--c-primary), var(--c-teal));
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size:14px;
  font-weight: 600;
  flex-shrink: 0;
}
.drawer-title {
  font-family: 'Noto Sans Thai', sans-serif;
  font-size:20px;
  font-weight: 600;
  color: var(--c-navy);
  margin:0;
  letter-spacing: -0.01em;
}
.drawer-subtitle {
  font-size:12px;
  color: var(--c-mute);
  margin-top:4px;
  display: flex;
  align-items: center;
  gap:8px;
  flex-wrap: wrap;
}
.drawer-tabs {
  display: flex;align-items:center;
  padding:0 24px;
  border-bottom: 1px solid var(--c-line-2);
}
.drawer-tab {
  padding:10px 16px;
  font-size:13px;
  font-weight: 500;
  color: var(--c-mute);
  border-bottom: 2px solid transparent;
  transition: all 120ms;
  margin-bottom:-1px;
  cursor: pointer;
  user-select: none;
  background: transparent;
  border-left: 0;
  border-right: 0;
  border-top: 0;
}
.drawer-tab:hover { color: var(--c-ink); }
.drawer-tab.is-active { color: var(--c-primary); border-bottom-color: var(--c-primary); }
.drawer-body { flex: 1; overflow-y: auto; padding:24px; scrollbar-gutter: stable; }
.drawer-section { margin-bottom:24px; }
.drawer-section-title {
  font-size:11px;
  font-weight: 700;
  color: var(--c-mute);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin:0 0 10px;
}
.drawer-fields {
  display: grid;
  grid-template-columns: 130px 1fr;
  gap:10px 16px;
  font-size:13px;
}
.drawer-fields .lbl { color: var(--c-mute); }
.drawer-fields .val { color: var(--c-ink); font-weight: 500; }
.drawer-footer {
  padding:12px 24px;
  border-top: 1px solid var(--c-line-2);
  display: flex;
  gap:8px;
  align-items: center;
  background: var(--c-bg-off);
}
/* Drawer Button Contract (Iron Rule #31) helpers */
.footer-spacer { flex: 1; }
.drawer-footer-meta { font-size:12px; color: var(--c-mute-2); }
.drawer-header-actions { display: flex; gap:6px; align-items: center; }
.drawer-header-divider { width: 1px; height: 22px; background: var(--c-line-2); margin:0 4px; flex-shrink: 0; }

/* ============== TIMELINE ============== */
.timeline { position: relative; padding-left:24px; }
.timeline::before {
  content: '';
  position: absolute;
  left: 8px;
  top: 4px;
  bottom: 4px;
  width: 2px;
  background: var(--c-line-2);
}
.tl-item { position: relative; margin-bottom:16px; }
.tl-item:last-child { margin-bottom:0; }
.tl-dot {
  position: absolute;
  left: -20px;
  top: 3px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid var(--c-primary);
}
.tl-dot.is-success { border-color: var(--c-success); }
.tl-dot.is-warning { border-color: var(--c-warning); }
.tl-title { font-size:13px; font-weight: 600; color: var(--c-ink); }
.tl-meta { font-size:12px; color: var(--c-mute-2); margin-top:2px; }

/* ============== BOOKMARK / RELATED CARDS ============== */
.bm-card {
  display: flex;
  gap:12px;
  padding:12px 12px;
  border: 1px solid var(--c-line-2);
  border-radius: 8px;
  margin-bottom:8px;
  cursor: pointer;
  transition: all 120ms;
  align-items: center;
}
.bm-card:hover { border-color: var(--c-line); }
.bm-icon {
  width: 28px; height: 28px;
  background: rgba(255,59,48,0.10);
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--c-primary);
  flex-shrink: 0;
}
.bm-card [data-lucide] { width: 15px; height: 15px; }

/* ============== NOTES ============== */
.notes-area {
  width: 100%;
  min-height: 130px;
  padding:12px 16px;
  background: #fff;
  border: 1px solid var(--c-line);
  border-radius: 8px;
  resize: vertical;
  font-family: inherit;
  font-size:13px;
  line-height: 1.55;
}
.notes-area:focus { outline: none; border-color: var(--c-primary); box-shadow: 0 0 0 3px rgba(255,59,48,0.10); }

/* ============== EMPTY STATE ============== */
.empty {
  padding:56px 24px;
  text-align: center;
  color: var(--c-mute);
}
.empty-icon {
  width: 52px; height: 52px;
  margin:0 auto 16px;
  border-radius: 50%;
  background: var(--c-line-3);
  color: var(--c-mute-2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.empty-icon [data-lucide] { width: 22px; height: 22px; }
.empty-title {
  font-size:16px;
  font-weight: 600;
  color: var(--c-ink);
  margin-bottom:6px;
  font-family: 'Noto Sans Thai', sans-serif;
}
.empty-desc { font-size:13px; color: var(--c-mute); max-width: 320px; margin:0 auto; }
.empty .btn { margin-top:16px; }  /* Rule #39 — empty state ควรมีปุ่ม action หลัก */

/* ============== MODAL ============== */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(17,17,17,0.50);
  z-index:var(--z-backdrop);
  opacity: 0;
  pointer-events: none;
  transition: opacity 200ms;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-backdrop.is-open { opacity: 1; pointer-events: auto; }
.modal {
  background: #fff;
  border-radius: 12px;
  width: 440px;
  max-width: 92vw;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  transform: scale(0.96);
  transition: transform 200ms cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 24px 64px rgba(17,17,17,0.28);
  overflow: hidden;
}
.modal-backdrop.is-open .modal { transform: scale(1); }
.modal-header {
  padding:18px 24px 12px;
  display: flex;
  align-items: flex-start;
  gap:12px;
}
.modal-header-icon {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: rgba(255,59,48,0.10);
  color: var(--c-primary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.modal-header-icon.is-danger { background: #FFE9E7; color: var(--c-danger); }
.modal-header-icon.is-warning { background: #FFF1DD; color: var(--c-warning); }
.modal-header-icon [data-lucide] { width: 18px; height: 18px; }
.modal-title {
  font-family: 'Noto Sans Thai', sans-serif;
  font-size:16px;
  font-weight: 600;
  color: var(--c-navy);
  margin:0 0 4px;
}
.modal-subtitle { font-size:13px; color: var(--c-mute); margin:0; line-height: 1.5; }
.modal-body {
  padding:6px 24px 18px;
  font-size:13px;
  color: var(--c-ink);
  overflow-y: auto;
  scrollbar-gutter: stable;
}
.modal-footer {
  padding:12px 24px;
  background: var(--c-bg-off);
  border-top: 1px solid var(--c-line-2);
  display: flex;align-items:center;
  justify-content: flex-end;
  gap:8px;
}

/* ============== FIELDS ============== */
.field { margin-bottom:16px; }
.field-label { display: block; font-size:12.5px; font-weight: 500; color: var(--c-mute); margin-bottom:6px; }
.field-label .req { color: var(--c-danger); margin-left:2px; }
.field-input { width: 100%; }
.field-help { font-size:12px; color: var(--c-mute-2); margin-top:4px; }
/* Rule #43 — จองพื้นที่ error ไว้ (visibility แทน display) → error โผล่แล้วฟอร์มไม่กระตุก.
   ถ้า field ไหนไม่ใส่ <div class="field-error"> ก็ไม่จองพื้นที่ (author เลือกเองรายตัว) */
.field-error { font-size:12px; color: var(--c-danger); margin-top:4px; min-height: 15px; visibility: hidden; }
.field.is-invalid .input,
.field.is-invalid .select { border-color: var(--c-danger); }
.field.is-invalid .field-error { visibility: visible; }

/* Responsive form grid (Iron Rule #17) */
.field-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap:12px;
}

/* ============== TOAST ============== */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--c-navy);
  color: #fff;
  padding:12px 18px;
  border-radius: 10px;
  font-size:13px;
  font-weight: 500;
  z-index:var(--z-toast);
  display: flex;
  align-items: center;
  gap:10px;
  box-shadow: 0 12px 32px rgba(17,17,17,0.30);
  transform: translateY(100px);
  opacity: 0;
  transition: all 250ms cubic-bezier(0.4, 0, 0.2, 1);
  max-width: 380px;
}
.toast.is-visible { transform: translateY(0); opacity: 1; }
.toast.is-success { background: var(--c-success); }
.toast.is-info { background: var(--c-primary); }
.toast.is-warning { background: var(--c-warning); }
.toast.is-error { background: var(--c-danger); }
.toast [data-lucide] { width: 17px; height: 17px; }

/* ============== LINE EXPAND ANIMATION (Pattern E) ============== */
.line-expanded {
  animation: lineExpand 220ms cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden;
}
@keyframes lineExpand {
  from { max-height: 0; opacity: 0; transform: translateY(-8px); }
  to { max-height: 600px; opacity: 1; transform: translateY(0); }
}

/* ============== WIZARD LAYOUT (Iron Rule #22) ============== */
.page-content-host.has-wizard { display: flex; flex-direction: column; height: 100%; }
.wizard-shell { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 100%; }
.wizard-stepper-band {
  flex: 0 0 auto; background: white;
  padding:18px 32px;
  border-bottom: 1px solid var(--c-line-2);
}
.wizard-body { flex: 1 1 auto; padding:24px 32px 28px; min-height: 0; background: var(--c-bg-off); }
.wizard-card {
  padding:28px 32px;
  width: 100%;
  max-width: 960px;
  margin:0 auto;
  background: #fff;
  border: 1px solid var(--c-line-2);
  border-radius: 10px;
}
.wizard-footer {
  flex: 0 0 auto;
  position: sticky;
  bottom: 0;
  background: white;
  padding:12px 32px;
  display: flex;align-items:center;
  justify-content: space-between;
  border-top: 1px solid var(--c-line-2);
  box-shadow: 0 -2px 8px rgba(17,17,17,0.04);
  z-index:var(--z-sticky);
}
.stepper-row {
  display: flex;
  align-items: center;
  flex-wrap: nowrap;
  width: 100%;
  max-width: 640px;
  margin:0 auto;
  gap:0;
}
.stepper-row .step-line {
  flex: 1 1 auto;
  min-width: 28px;
  max-width: 80px;
  height: 2px;
  background: var(--c-line-2);
}
.stepper-row .step-line.is-done { background: var(--c-primary); }
.step-dot {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--c-line-2);
  color: var(--c-mute-2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size:12.5px;
  font-weight: 600;
  flex-shrink: 0;
}
.step-dot.is-active { background: var(--c-primary); color: #fff; }
.step-dot.is-done { background: var(--c-primary); color: #fff; }

/* ============== UTILITIES ============== */
.hidden { display: none !important; }  /* v6.1 — search-select/overlay พึ่ง class นี้ (เดิมหายไป ทำให้ ss-list เปิดค้าง + ปุ่ม X โผล่) */

/* Icon utility classes (CSS-defined so no Tailwind dependency for these) */

/* ============================================================
   Lucide SVG sizing fix
   ------------------------------------------------------------
   Lucide replaces <i data-lucide="..."> with <svg class="lucide ...">
   ที่มี width="24" height="24" attributes ติดมาด้วย — attributes
   เหล่านี้ override CSS class .w-N ทำให้ icons เด้งเป็น 24×24
   ดัน pill/button สูงเกินขนาด design.

   วิธีแก้: บังคับ svg.lucide ทุกตัวให้ width/height = 1em แล้ว
   ปรับขนาดผ่าน font-size บน parent. Plus override สำหรับเคสที่
   ใช้ .w-N/.h-N โดยตรงบน <i> (Lucide จะ copy class ไปยัง svg)
   ============================================================ */
svg.lucide {
  width: 1em;
  height: 1em;
  display: inline-block;
  vertical-align: -0.125em;
  flex-shrink: 0;
}
/* เมื่อ .w-N / .h-N ถูก copy ไปบน svg.lucide ให้บังคับ override
   width/height attributes ที่ Lucide ใส่มา (specificity ชนะ attribute) */
svg.lucide.w-2\.5 { width: 10px; }   svg.lucide.h-2\.5 { height: 10px; }
svg.lucide.w-3    { width: 12px; }   svg.lucide.h-3    { height: 12px; }
svg.lucide.w-3\.5 { width: 14px; }   svg.lucide.h-3\.5 { height: 14px; }
svg.lucide.w-4    { width: 16px; }   svg.lucide.h-4    { height: 16px; }
svg.lucide.w-5    { width: 20px; }   svg.lucide.h-5    { height: 20px; }

.note .note-act{margin-left:auto;flex:0 0 auto;}
.mini-tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
.mini-tbl th{text-align:left;font-size:11px;color:var(--c-mute-2);font-weight:600;padding:4px 8px;border-bottom:1px solid var(--c-line-2);white-space:nowrap;}
.mini-tbl td{padding:4px 8px;border-bottom:1px solid var(--c-line-3);vertical-align:middle;color:var(--c-ink);}
.mini-tbl tr:last-child td{border-bottom:0;}
.mini-tbl .input,.mini-tbl .select{height:30px;font-size:12.5px;padding:0 8px;}
.mini-wrap{overflow-x:auto;}
.wu-row{display:flex;align-items:center;gap:12px;padding:8px 4px;border-bottom:1px solid var(--c-line-3);}
.wu-row:last-child{border-bottom:0;}
.wu-nm{font-size:12.5px;font-weight:600;color:var(--c-ink);}
.wu-mt{font-size:11px;color:var(--c-mute-2);margin-top:1px;}
.ro{background:var(--c-line-3);color:var(--c-mute-2);cursor:not-allowed;}
.dt-band{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;background:rgba(255,154,31,.12);color:#B8690B;font-size:12px;font-weight:600;margin-bottom:12px;}
.ver-val{font-family:'Satoshi',sans-serif;font-variant-numeric:tabular-nums;}
.chip-btn{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 12px;border-radius:999px;border:1px solid var(--c-line);background:#fff;font:inherit;font-size:11.5px;font-weight:600;color:var(--c-mute);cursor:pointer;}
.chip-btn.is-on{border-color:var(--c-primary);color:var(--c-primary);background:rgba(255,59,48,.06);}
.tabs.page-tabs{margin:-2px 0 16px;}
.rev-dl{display:grid;grid-template-columns:180px 1fr;gap:8px 16px;font-size:12.5px;}
.rev-dl dt{color:var(--c-mute-2);font-size:11.5px;}
.rev-dl dd{margin:0;color:var(--c-ink);font-weight:600;}
.drawer-body .field{margin-bottom:14px;}
.hint-inline{font-size:11.5px;color:var(--c-mute-2);margin-top:4px;}
.sw{position:relative;display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px;color:var(--c-ink);}
.sw-box{width:34px;height:20px;border-radius:999px;background:var(--c-line);position:relative;transition:background 140ms;flex:0 0 auto;}
.sw-box::after{content:'';position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform 140ms;}
.sw.on .sw-box{background:var(--c-success);}
.sw.on .sw-box::after{transform:translateX(14px);}
.sw.is-ro{opacity:.55;cursor:not-allowed;}
:root{--z-demo:45;}
.bar-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.mla{margin-left:auto;}
.min0{min-width:0;}
.tar{text-align:right;}
.pos-rel{position:relative;}
.ta-auto{height:auto;padding:8px 12px;}
.row-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px;}
.field-error.on{visibility:visible;}
.row-bad{background:#FFE9E7;}
.scrollpad{padding:16px;}
.scrollpad > .sec:last-child{margin-bottom:0;}
.content{padding-bottom:56px;}
.page-fill{min-height:calc(100dvh - 148px);max-height:calc(100dvh - 148px);}
@media (max-width:1180px){ .page-fill{min-height:calc(100dvh - 140px);max-height:calc(100dvh - 140px);} }
.list-card .table-wrap{overflow-x:auto;}
.table td .cell-main,.table td .cell-sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cfg-row{display:flex;align-items:center;gap:12px;padding:8px 4px;border-bottom:1px solid var(--c-line-3);}
.cfg-row:last-child{border-bottom:0;}
.cfg-k{font-size:12.5px;font-weight:600;color:var(--c-ink);}
.cfg-m{font-size:11px;color:var(--c-mute-2);margin-top:1px;}
.lk-row{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--c-line-3);}
.lk-row:last-child{border-bottom:0;}
/* ---- F-HR-PAYROLL เฉพาะหน้านี้ (Q-document + run)
   ไม่ใช้ .pill-info .pill-active .pill-registered (สามตัวนี้เป็นโทนน้ำเงินของ kit)
   สีทั้งหมดอยู่ในชุด CI: Ivory / Charcoal / Red / Orange / Green */
.drawer.wide{width:1180px;}
.dw-sub{font-size:12.5px;color:var(--c-mute-2);margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.dw-acts{display:flex;gap:6px;align-items:center;}
.dw-div{width:1px;height:22px;background:var(--c-line-2);margin:0 4px;flex-shrink:0;}
.drawer-footer .dw-footer-right{margin-left:auto;}
.tbl-mono{font-family:'Satoshi',sans-serif;font-variant-numeric:tabular-nums;font-weight:700;color:var(--c-primary);letter-spacing:.02em;font-size:12.5px;line-height:1.28;}
.tnum{font-variant-numeric:tabular-nums;}
.rt{text-align:right;font-variant-numeric:tabular-nums;}
.mask{font-family:ui-monospace,monospace;letter-spacing:.06em;color:var(--c-mute-2);}
.link-cfg{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:0;font:inherit;font-size:11.5px;font-weight:600;color:var(--c-primary);cursor:pointer;}
.link-cfg [data-lucide]{width:12px;height:12px;}
.tab-badge{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 4px;margin-left:6px;border-radius:999px;background:var(--c-primary);color:#fff;font-size:10.5px;font-weight:700;}
.tip.tip-e::after{left:auto;right:0;transform:none;}
.tip.tip-w::after{left:0;right:auto;transform:none;}
.text-mute-2{color:var(--c-mute-2);}
.sr-v{font-size:11px;color:var(--c-mute-2);font-family:ui-monospace,monospace;}

/* ---- สถานะรอบ 9 ค่า + ชนิดรอบ 4 ค่า + สถานะบรรทัด + สถานะสลิป (คำเดียว 22px · kit .pill) ---- */
.pill-run-draft{background:var(--c-line-3);color:var(--c-mute-2);}
.pill-run-pulled{background:var(--c-line-3);color:var(--c-ink);}
.pill-run-calc{background:rgba(255,154,31,.16);color:#9A5400;}
.pill-run-review{background:rgba(255,154,31,.24);color:#9A5400;}
.pill-run-wait{background:#FFF1DD;color:#B8690B;}
.pill-run-ok{background:#E4F4EB;color:#157A41;}
.pill-run-rej{background:#FFE9E7;color:var(--c-danger);}
.pill-run-closed{background:var(--c-navy);color:#fff;}
.pill-run-void{background:var(--c-line-3);color:#8A3A34;}
.pill-uncomp{background:#FFE9E7;color:#8A3A34;}
.pill-frozen{background:var(--c-line-3);color:var(--c-mute-2);}
.pill-sim{background:rgba(255,154,31,.20);color:#9A5400;}

/* ---- ธง / แถบเล็ก ---- */
.fl{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:6px;font-size:11px;font-weight:600;background:var(--c-line-3);color:var(--c-mute);white-space:nowrap;}
.fl [data-lucide]{width:11px;height:11px;}
.fl.f-warn{background:#FFF1DD;color:#B8690B;}
.fl.f-bad{background:#FFE9E7;color:var(--c-danger);}
.fl.f-ok{background:#E4F4EB;color:#157A41;}
.fl.f-mute{background:var(--c-line-3);color:var(--c-mute-2);}
.flrow{display:inline-flex;flex-wrap:nowrap;gap:4px;max-width:100%;overflow:hidden;align-items:center;}
.flrow.wrap{flex-wrap:wrap;}

/* ---- แถบความคืบหน้าลายเซ็นของรอบ (คนละคอลัมน์กับสถานะเสมอ · #40/#103) ---- */
.pgl{width:46px;height:6px;background:var(--c-line-2);border-radius:999px;overflow:hidden;display:inline-block;vertical-align:middle;}
.pgl i{display:block;height:100%;background:var(--c-success);border-radius:999px;}
.pgl.is-wait i{background:var(--c-warning);}
.signcell{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--c-mute-2);font-variant-numeric:tabular-nums;}

/* ---- การ์ดสรุปในหน้ารอบ ---- */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:12px;}
.rescard{border:1px solid var(--c-line-2);border-radius:10px;padding:12px;background:#fff;}
.rescard.is-hold{border-color:var(--c-warning);background:#FFFCF6;}
.rescard.is-bad{border-color:var(--c-danger);background:#FFF6F5;}
.rescard .rc-t{font-size:12.5px;font-weight:700;color:var(--c-ink);display:flex;align-items:center;gap:8px;}
.rescard .rc-v{font-size:20px;font-weight:700;color:var(--c-ink);margin-top:6px;font-variant-numeric:tabular-nums;}
.rescard .rc-v.is-bad{color:var(--c-danger);font-size:16px;}
.rescard .rc-m{font-size:11px;color:var(--c-mute-2);margin-top:2px;line-height:1.5;}
.rc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 16px;font-size:11.5px;}
.rc-grid .k{color:var(--c-mute-2);}
.rc-grid .v{color:var(--c-ink);font-weight:600;text-align:right;}

/* ---- แถบสถานะรอบบนหัวหน้ารอบ ---- */
.runbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--c-line-2);border-radius:12px;background:#fff;padding:10px 14px;margin-bottom:12px;}
.runbar .rb-main{min-width:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.runbar .rb-no{font-size:16px;font-weight:700;color:var(--c-ink);letter-spacing:.02em;font-variant-numeric:tabular-nums;}
.runbar .rb-meta{font-size:11.5px;color:var(--c-mute-2);}
.runbar .rb-acts{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap;}

/* ---- state machine strip ---- */
.smrail{display:flex;align-items:center;gap:0;flex-wrap:nowrap;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none;}
.smrail::-webkit-scrollbar{display:none;}
.smrail .sm{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;font-size:11px;color:var(--c-mute-2);}
.smrail .sm b{font-weight:600;}
.smrail .sm .sm-d{width:8px;height:8px;border-radius:50%;background:var(--c-line-2);flex:0 0 auto;}
.smrail .sm.is-done .sm-d{background:var(--c-success);}
.smrail .sm.is-cur .sm-d{background:var(--c-primary);box-shadow:0 0 0 3px rgba(255,59,48,.14);}
.smrail .sm.is-cur{color:var(--c-ink);font-weight:700;}
.smrail .sm-ar{width:18px;height:1.5px;background:var(--c-line-2);flex:0 0 auto;margin:0 6px;}

/* ---- ประตูตรวจ / gate ---- */
.gate{display:flex;align-items:flex-start;gap:10px;padding:9px 11px;border:1px solid var(--c-line-2);border-radius:9px;background:#fff;margin-bottom:8px;}
.gate:last-child{margin-bottom:0;}
.gate .g-ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;flex:0 0 auto;background:#E4F4EB;color:#157A41;}
.gate.is-warn .g-ic{background:#FFF1DD;color:#B8690B;}
.gate.is-bad .g-ic{background:#FFE9E7;color:var(--c-danger);}
.gate .g-t{font-size:12.5px;font-weight:600;color:var(--c-ink);}
.gate .g-s{font-size:11.5px;color:var(--c-mute-2);margin-top:2px;line-height:1.5;}
.gate .g-a{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;}
.gate.is-bad{border-color:var(--c-danger);background:#FFF6F5;}
.gate.is-warn{border-color:var(--c-warning);background:#FFFCF6;}
.gate .g-b{margin-left:auto;flex:0 0 auto;}

/* ---- แถวต้นทาง 6 ที่ ---- */
.srcrow{display:grid;grid-template-columns:26px minmax(160px,1.1fr) minmax(140px,1fr) minmax(120px,.8fr) auto;gap:12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--c-line-3);}
.srcrow:last-child{border-bottom:0;}
.srcrow .sr-ic{width:26px;height:26px;border-radius:7px;background:var(--c-line-3);color:var(--c-mute);display:grid;place-items:center;}
.srcrow.is-bad .sr-ic{background:#FFE9E7;color:var(--c-danger);}
.srcrow.is-warn .sr-ic{background:#FFF1DD;color:#B8690B;}
.srcrow .sr-n{font-size:12.5px;font-weight:600;color:var(--c-ink);}
.srcrow .sr-m{font-size:11px;color:var(--c-mute-2);margin-top:1px;}
.srcrow .sr-v{font-size:11px;color:var(--c-mute-2);font-family:ui-monospace,monospace;word-break:break-all;}
.srcrow .sr-a{display:flex;gap:6px;align-items:center;justify-content:flex-end;}

/* ---- ค่าตามกฎหมายที่ยังไม่มีให้อ่าน ---- */
.cfggrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px;}
.cfgbox{border:1px solid var(--c-line-2);border-radius:10px;padding:10px 12px;background:#fff;}
.cfgbox.is-missing{border-color:var(--c-danger);background:#FFF6F5;}
.cfgbox .cb-h{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;color:var(--c-ink);}
.cfgbox .cb-h .cb-r{margin-left:auto;}
.cfgbox .cb-v{font-size:12.5px;font-weight:700;color:var(--c-danger);margin-top:6px;}
.cfgbox .cb-s{font-size:11px;color:var(--c-mute-2);margin-top:3px;line-height:1.55;}
.cfgbox .cb-keys{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px;}
.cfgkey{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:5px;background:var(--c-line-3);color:var(--c-mute-2);font-family:ui-monospace,monospace;font-size:10px;}
.cfgbox.is-missing .cfgkey{background:#FFE9E7;color:#8A3A34;}
.cfgbox .cb-a{margin-top:8px;}

/* ---- กล่องข้อเท็จจริง ---- */
.factgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;}
.fact{border:1px solid var(--c-line-2);border-radius:10px;padding:9px 11px;background:#fff;}
.fact .ft-k{font-size:10.5px;color:var(--c-mute-2);display:flex;align-items:center;gap:5px;}
.fact .ft-v{font-size:13px;font-weight:700;color:var(--c-ink);margin-top:3px;line-height:1.4;}
.fact .ft-s{font-size:10.5px;color:var(--c-mute-2);margin-top:2px;}
.fact.is-bad{border-color:var(--c-danger);background:#FFF6F5;}
.fact.is-bad .ft-v{color:var(--c-danger);}
.fact.is-warn{border-color:var(--c-warning);background:#FFFCF6;}

/* ---- ชุดข้อมูลที่ตรึงไว้ ---- */
.frozen{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;}
.frz{border:1px solid var(--c-line-2);border-radius:8px;padding:8px 10px;background:var(--c-bg-off);}
.frz .fz-k{font-size:10.5px;color:var(--c-mute-2);}
.frz .fz-v{font-size:11.5px;font-weight:700;color:var(--c-ink);margin-top:2px;font-family:ui-monospace,monospace;word-break:break-all;}
.frz .fz-v.is-null{color:var(--c-danger);}

/* ---- สายอนุมัติ · slot picker (มติ 2026-08-17) ---- */
.slot-row{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--c-line-2);border-radius:10px;background:#fff;}
.slot-main{display:grid;grid-template-columns:210px minmax(0,1fr);gap:12px;align-items:start;min-width:0;}
.modal .slot-main{grid-template-columns:minmax(0,1fr);gap:6px;}
.slot-main .tbl-person{max-width:100%;}
.slot-main .emp-mt{max-width:100%;}
.slot-row+.slot-row{margin-top:10px;}
.slot-row.is-err{border-color:var(--c-danger);}
.slot-row.is-key{border-color:var(--c-warning);background:#FFFCF6;}
.slot-no{width:26px;height:26px;border-radius:50%;background:var(--c-navy);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;margin-top:2px;}
.slot-row.is-key .slot-no{background:#B8690B;}
.slot-role{font-size:12px;font-weight:700;color:var(--c-ink);padding-top:6px;}
.slot-role span{display:block;font-weight:500;font-size:11px;color:var(--c-mute-2);margin-top:2px;}
.slot-role .fl{display:inline-flex;width:auto;margin:0 0 0 6px;font-weight:600;font-size:11px;}
.slot-pick{margin-top:8px;}
.chainprev{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;}
.chainprev .cp{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--c-line-2);border-radius:999px;padding:4px 11px;background:#fff;}
.chainprev .cp.is-key{border-color:var(--c-warning);background:#FFFCF6;color:#B8690B;font-weight:700;}
.chainprev .cp-ar{color:var(--c-mute-2);}
.signstep{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 12px;border:1px solid var(--c-line-2);border-radius:10px;background:#fff;margin-bottom:8px;}
.signstep:last-child{margin-bottom:0;}
.signstep.is-cur{border-color:var(--c-warning);background:#FFFCF6;}
.signstep.is-ok{border-color:#BFE3CD;}
.signstep .ss-c{font-size:11.5px;color:var(--c-mute-2);margin-top:5px;line-height:1.5;}

/* ---- timeline ---- */
.tl-dot.is-danger{border-color:var(--c-danger);}
.tl-dot.is-muted{border-color:var(--c-line);}
.tl-q{font-size:12px;color:var(--c-ink);background:var(--c-bg-off);border-left:3px solid var(--c-line-2);padding:6px 10px;border-radius:0 6px 6px 0;margin-top:6px;}
.tl-card{border:1px solid var(--c-line-2);border-radius:10px;padding:10px 12px;background:#fff;}
.tl-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;font-weight:700;color:var(--c-ink);}

/* ---- step header ในตัวช่วยสร้างรอบ ---- */
.step-wrap{padding:2px 0 0;}
.steph{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px;}
.steph .sh-ic{width:30px;height:30px;border-radius:9px;background:rgba(255,59,48,.10);color:var(--c-primary);display:grid;place-items:center;flex:0 0 auto;}
.steph .sh-t{font-size:13px;font-weight:700;color:var(--c-ink);}
.steph .sh-s{font-size:11.5px;color:var(--c-mute-2);margin-top:2px;}
.upload-zone{border:2px dashed var(--c-line);border-radius:12px;padding:22px 16px;text-align:center;background:var(--c-bg-off);cursor:pointer;}
.upload-zone:hover{border-color:var(--c-primary);background:rgba(255,59,48,.04);}
.upload-zone .uz-t{font-size:13px;font-weight:600;color:var(--c-ink);margin-top:8px;}
.upload-zone .uz-s{font-size:11.5px;color:var(--c-mute-2);margin:4px 0 12px;}
.filerow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--c-line-2);border-radius:10px;background:#fff;margin-bottom:8px;}
.filerow .fr-n{font-size:12.5px;font-weight:600;color:var(--c-ink);}
.filerow .fr-m{font-size:11px;color:var(--c-mute-2);margin-top:1px;}

/* ---- ตารางย่อยในหน้ารอบ ---- */
.mini-tbl{width:100%;border-collapse:collapse;}
.mini-tbl th{font-size:11px;font-weight:600;color:var(--c-mute-2);text-align:left;padding:6px 8px;border-bottom:1px solid var(--c-line-2);white-space:nowrap;}
.mini-tbl td{font-size:12px;color:var(--c-ink);padding:7px 8px;border-bottom:1px solid var(--c-line-3);vertical-align:middle;white-space:nowrap;}
.mini-tbl td .cell-main,.mini-tbl td .cell-sub{white-space:nowrap;}
.mini-tbl tr:last-child td{border-bottom:0;}
.mini-tbl .rt{text-align:right;}
.mini-wrap{overflow-x:auto;}
.grp-h{font-size:11px;font-weight:700;color:var(--c-mute-2);letter-spacing:.03em;background:var(--c-bg-off);}

/* ---- ตารางหลัก ---- */
.card.list-card:not(.page-fill) .table-wrap{max-height:none;}
.run-tbl{min-width:1140px;}
.run-tbl td,.run-tbl th{white-space:nowrap;}
.slip-tbl{min-width:1040px;}
.slip-tbl td,.slip-tbl th{white-space:nowrap;}
.queue-tbl{min-width:1040px;}
.queue-tbl td,.queue-tbl th{white-space:nowrap;}
.emp-tbl{min-width:1120px;}
.emp-tbl td,.emp-tbl th{white-space:nowrap;}
.var-tbl{min-width:1080px;}
.var-tbl td,.var-tbl th{white-space:nowrap;}
tr.row-sel td{background:rgba(255,59,48,.05);}
tr.row-sel td:first-child{box-shadow:inset 3px 0 0 var(--c-primary);}
.d-up{color:var(--c-danger);font-weight:700;}

.a4{background:#fff;box-shadow:0 6px 24px rgba(17,17,17,.14);width:100%;max-width:720px;min-height:900px;padding:34px 38px;font-size:11px;color:#111111;margin:0 auto;}
.a4 .a4-head{display:flex;justify-content:space-between;gap:18px;border-bottom:2px solid #111111;padding-bottom:10px;}
.a4 .a4-brand{display:flex;gap:10px;}
.a4 .a4-logo{width:38px;height:38px;border-radius:8px;background:#111111;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:0 0 auto;}

<!-- ============================================================
     Lucide Icons Loader (multi-CDN fallback, pinned version)
     ------------------------------------------------------------
     ทำไมไม่ใช้ <script src="..."> ตรง ๆ:
       - Single CDN = single point of failure (corp proxy/firewall block)
       - @latest = breaking changes โดยไม่บอก (GitHub issue #2962)
       - <script> ใน <head> โดยไม่มี defer ชน DOMContentLoaded
     กลยุทธ์:
       1) Pin version 0.469.0 (stable, ทดสอบแล้ว)
       2) ลอง CDN 3 ตัวเรียงตามความน่าเชื่อถือ: unpkg → jsdelivr → cdnjs
       3) ถ้าทุก CDN fail → log warning + ไม่ block render
            (UI ยังใช้งานได้ แค่ไม่มี icons)
     ============================================================ -->
<script>
(function loadLucide() {
  var version = '0.469.0';
  var cdns = [
    'https://unpkg.com/lucide@' + version + '/dist/umd/lucide.min.js',
    'https://cdn.jsdelivr.net/npm/lucide@' + version + '/dist/umd/lucide.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/lucide/' + version + '/lucide.min.js'
  ];
  var i = 0;
  function tryNext() {
    if (i >= cdns.length) {
      console.warn('[Lucide] All CDNs failed. Icons จะไม่แสดง but UI ยังใช้งานได้');
      window.lucide = window.lucide || { createIcons: function() {} }; // no-op fallback
      window.dispatchEvent(new Event('lucide:ready'));
      return;
    }
    var s = document.createElement('script');
    s.src = cdns[i++];
    s.onload = function() {
      window.dispatchEvent(new Event('lucide:ready'));
    };
    s.onerror = tryNext;
    document.head.appendChild(s);
  }
  tryNext();
})();
</script>

<script>
// ============================================
// STATE
// ============================================
const state = {
  currentRoute: 'home',
  drawer: { open: false, mode: null, recordId: null, step: 1 },
  modal: { open: false, type: null, data: null },
  toast: { visible: false, message: '', variant: 'info' },
  filters: { search: '', status: 'all' },
  pagination: { page: 1, pageSize: 20 },
  sort: { col: null, dir: 'asc' },
  selectedIds: new Set(),
  records: [],
};

// ============================================
// SIDEBAR — Module collapse/expand (Iron Rule #27)
// Module header is non-navigable; click toggles children visibility.
// State persists in DOM (data-expanded) — future: persist per user.
// ============================================
function toggleModule(headerEl) {
  const mod = headerEl.closest('.sb-module');
  if (!mod) return;
  const isExpanded = mod.getAttribute('data-expanded') !== 'false';
  mod.setAttribute('data-expanded', isExpanded ? 'false' : 'true');
}

// ============================================
// ROUTER (Hash-based, refresh-safe)
// ============================================
function getRoute() {
  const hash = location.hash;
  if (!hash || hash === '#' || hash === '#/') return 'home';
  return hash.replace(/^#\//, '');
}
function navigate(route) {
  location.hash = '#/' + route;
}

// ============================================
// DRAWER / MODAL TOGGLES
// ============================================
function openDrawer(mode, recordId) {
  state.drawer = { open: true, mode, recordId, step: 1 };
  render();
  // Trigger CSS animation
  requestAnimationFrame(() => {
    document.getElementById('drawerBackdrop').classList.add('is-open');
    document.getElementById('drawer').classList.add('is-open');
  });
}
function closeDrawer() {
  document.getElementById('drawerBackdrop').classList.remove('is-open');
  document.getElementById('drawer').classList.remove('is-open');
  setTimeout(() => {
    state.drawer = { open: false, mode: null, recordId: null, step: 1 };
  }, 280);
}
function openModal(type, data) {
  state.modal = { open: true, type, data };
  render();
  requestAnimationFrame(() => {
    document.getElementById('modalBackdrop').classList.add('is-open');
  });
}
function closeModal() {
  document.getElementById('modalBackdrop').classList.remove('is-open');
  setTimeout(() => {
    state.modal = { open: false, type: null, data: null };
  }, 200);
}

// ============================================
// TOAST
// ============================================
function showToast(message, variant = 'info', durationMs = 2800) {
  const el = document.getElementById('toast');
  const iconMap = { success: 'check-circle-2', info: 'info', warning: 'alert-triangle', error: 'x-circle' };
  el.className = 'toast is-' + variant;
  el.innerHTML = `<i data-lucide="${iconMap[variant] || 'info'}" class="w-4 h-4"></i><span>${message}</span>`;
  renderIcons();
  requestAnimationFrame(() => el.classList.add('is-visible'));
  setTimeout(() => el.classList.remove('is-visible'), durationMs);
}

// ============================================
// ESC key handler (close drawer/modal)
// ============================================
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state.modal.open) closeModal();
    else if (state.drawer.open) closeDrawer();
  }
});

// ============================================
// RENDER (placeholder — replace per feature)
// ============================================
function render() {
  // Specific feature should override this function.
  //
  // ⚠️ Iron Rule #29 — Render Preservation:
  // If your render() does innerHTML rebuild (typical pattern), wrap with
  // withRenderPreservation() OR use preserveRenderState()/restoreRenderState()
  // to keep scroll position + focus across re-renders.
  //
  // Example:
  //   function render() {
  //     const snap = preserveRenderState();
  //     document.getElementById('page-content').innerHTML = renderPage();
  //     drawer.innerHTML = state.drawer.open ? renderDrawer() : '';
  //     renderIcons();
  //     restoreRenderState(snap);
  //   }
  //
  // After every DOM update, call renderIcons() — safe wrapper ที่ทน race เมื่อ Lucide ยังไม่ load.
  renderIcons();
}

// ============================================
// INIT
// ============================================
// Helper: safe icon render — กัน race ก่อน lucide load เสร็จ
function renderIcons() {
  if (window.lucide && typeof window.lucide.createIcons === 'function') {
    window.lucide.createIcons();
  }
}

// ============================================
// SEARCH-SELECT (Iron Rule #34) — generic searchable dropdown
// ------------------------------------------------
// ใช้แทน <select> เมื่อ options เยอะ (>8) หรือเป็น lookup จาก master อื่น.
// list = position:absolute overlay → ไม่ดันเนื้อหา. แก้เฉพาะ list ตอนพิมพ์ →
// ไม่ rebuild ทั้งหน้า (ไม่ชน Rule #29). decoupled — เรียก onSelect callback ไม่ผูก render().
//
// วิธีใช้ 2 ขั้น:
//   1) ใส่ markup:  ${searchSelectHTML('country', { placeholder: 'เลือกประเทศ' })}
//   2) หลัง markup อยู่ใน DOM แล้ว (เช่นท้าย render()):
//        initSearchSelect('country', {
//          options: countries.map(c => ({ value:c.code, label:c.name, sub:c.code, icon:'flag', right:'' })),
//          value: state.form.country,
//          onSelect: (val, opt) => { state.form.country = val; }
//        });
// option fields: { value, label, sub?, icon?, right? }
// ============================================
window.__ss = window.__ss || {};
function ssGet(key){ return window.__ss[key]; }
function ssEscapeReg(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function searchSelectHTML(key, opt){
  opt = opt || {};
  var ph = opt.placeholder || 'ค้นหา...';
  return ''
    + '<div class="search-select" id="ss-' + key + '">'
    +   '<i data-lucide="search" class="ss-lead w-4 h-4"></i>'
    +   '<input type="text" class="input ss-input" id="ss-input-' + key + '" autocomplete="off" placeholder="' + ph + '"'
