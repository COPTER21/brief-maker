    +   '<button type="button" class="ss-clear hidden" id="ss-clear-' + key + '" tabindex="-1" onclick="ssClear(\'' + key + '\')"><i data-lucide="x" class="w-4 h-4"></i></button>'
    +   '<i data-lucide="chevron-down" class="ss-caret" id="ss-caret-' + key + '"></i>'
    +   '<div class="ss-list hidden" id="ss-list-' + key + '"></div>'
    + '</div>';
}
function initSearchSelect(key, cfg){
  cfg = cfg || {};
  window.__ss[key] = {
    options: cfg.options || [], value: (cfg.value != null ? cfg.value : null),
    onSelect: cfg.onSelect || function(){}, emptyText: cfg.emptyText || 'ไม่พบรายการ',
    query: '', open: false, hi: 0
  };
  ssSetText(key); ssSyncChrome(key); renderIcons();
}
function ssFiltered(key){
  var s = ssGet(key); if(!s) return [];
  var q = (s.query || '').toLowerCase().trim();
  if(!q) return s.options;
  return s.options.filter(function(o){
    return String(o.label).toLowerCase().includes(q)
      || String(o.value).toLowerCase().includes(q)
      || String(o.sub || '').toLowerCase().includes(q);
  });
}
function ssSyncChrome(key){
  var s = ssGet(key); if(!s) return;
  var sel = s.options.find(function(o){ return o.value === s.value; });
  var c = document.getElementById('ss-clear-' + key); if(c) c.classList.toggle('hidden', !sel);
  var k = document.getElementById('ss-caret-' + key); if(k) k.classList.toggle('hidden', !!sel);
}
function ssSetText(key){
  var s = ssGet(key); if(!s) return;
  var input = document.getElementById('ss-input-' + key); if(!input) return;
  var sel = s.options.find(function(o){ return o.value === s.value; });
  input.value = s.open ? s.query : (sel ? sel.label : '');
}
function ssRenderList(key){
  var s = ssGet(key); if(!s) return;
  var list = document.getElementById('ss-list-' + key); if(!list) return;
  var items = ssFiltered(key);
  if(items.length === 0){
    list.innerHTML = '<div class="ss-empty">' + s.emptyText + '</div>';
  } else {
    var q = (s.query || '').toLowerCase().trim();
    var hl = function(t){ return q ? String(t).replace(new RegExp('(' + ssEscapeReg(q) + ')', 'gi'), '<mark>$1</mark>') : String(t); };
    list.innerHTML = items.map(function(o, i){
      return '<button type="button" class="ss-opt ' + (i === s.hi ? 'is-active' : '') + '" onmousedown="event.preventDefault()" onclick="ssPick(\'' + key + '\', ' + i + ')">'
        + (o.icon ? '<i data-lucide="' + o.icon + '" class="ss-opt-ic w-4 h-4"></i>' : '')
        + '<span class="ss-opt-main"><span class="ss-opt-label">' + hl(o.label) + '</span>'
        + (o.sub ? '<span class="ss-opt-sub">' + hl(o.sub) + '</span>' : '') + '</span>'
        + (o.right ? '<span class="ss-opt-right">' + o.right + '</span>' : '')
        + '</button>';
    }).join('');
  }
  list.classList.toggle('hidden', !s.open);
  renderIcons();
}
function ssOpen(key){ var s = ssGet(key); if(!s) return; s.open = true; s.query = ''; s.hi = 0; ssSetText(key); ssSyncChrome(key); ssRenderList(key); }
function ssOnInput(key, val){ var s = ssGet(key); if(!s) return; s.query = val; s.open = true; s.hi = 0; s.value = null; ssSyncChrome(key); ssRenderList(key); }
function ssPick(key, i){ var s = ssGet(key); if(!s) return; var o = ssFiltered(key)[i]; if(!o) return; s.value = o.value; s.query = ''; s.open = false; ssSetText(key); ssSyncChrome(key); ssRenderList(key); s.onSelect(o.value, o); }
function ssClear(key){ var s = ssGet(key); if(!s) return; s.value = null; s.query = ''; s.open = true; ssSetText(key); ssSyncChrome(key); ssRenderList(key); var inp = document.getElementById('ss-input-' + key); if(inp) inp.focus(); s.onSelect(null, null); }
function ssOnKey(key, e){
  var s = ssGet(key); if(!s) return; var items = ssFiltered(key);
  if(e.key === 'ArrowDown'){ e.preventDefault(); s.open = true; s.hi = Math.min(items.length - 1, s.hi + 1); ssRenderList(key); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); s.hi = Math.max(0, s.hi - 1); ssRenderList(key); }
  else if(e.key === 'Enter'){ e.preventDefault(); if(items[s.hi]) ssPick(key, s.hi); }
  else if(e.key === 'Escape'){ s.open = false; ssSetText(key); ssSyncChrome(key); ssRenderList(key); }
}
document.addEventListener('click', function(e){
  Object.keys(window.__ss || {}).forEach(function(key){
    var wrap = document.getElementById('ss-' + key); var s = ssGet(key);
    if(wrap && s && s.open && !wrap.contains(e.target)){ s.open = false; ssSetText(key); ssSyncChrome(key); ssRenderList(key); }
  });
});

// ============================================
// FORMAT HELPERS (Iron Rule #43) — Thai locale, consistent ทุก feature
// ใช้ตัวเหล่านี้เสมอ ห้าม format ตัวเลข/วันที่เองรายจุด
// ============================================
function fmtNumber(n, dp){ if(n==null||n==='')return '—'; var x=Number(n); if(isNaN(x))return String(n);
  return x.toLocaleString('th-TH', {minimumFractionDigits: dp||0, maximumFractionDigits: dp!=null?dp:2}); }
function fmtMoney(n, dp){ if(n==null||n==='')return '—'; var x=Number(n); if(isNaN(x))return String(n);
  return '฿' + x.toLocaleString('th-TH', {minimumFractionDigits: dp!=null?dp:2, maximumFractionDigits: dp!=null?dp:2}); }
function fmtDate(iso, buddhist){ if(!iso)return '—'; var d=new Date(iso); if(isNaN(d))return String(iso);
  var s=d.toLocaleDateString('th-TH', {year:'numeric', month:'short', day:'numeric'});
  return buddhist===false ? d.toLocaleDateString('en-GB',{year:'numeric',month:'short',day:'numeric'}) : s; }
function fmtDateTime(iso){ if(!iso)return '—'; var d=new Date(iso); if(isNaN(d))return String(iso);
  return d.toLocaleString('th-TH', {year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }

// ============================================
// INLINE VALIDATION (Iron Rule #43) — validate ตอน blur, ไม่ใช่รอ submit อย่างเดียว
// markup: <div class="field"><input class="input" onblur="validateField(this, v => v.trim()? '' : 'จำเป็นต้องกรอก')">
//          <div class="field-error"></div></div>
// validator คืน '' = ผ่าน / ข้อความ = error
// ============================================
function validateField(el, validator){
  var field = el.closest('.field'); if(!field) return true;
  var msg = '';
  try { msg = validator ? validator(el.value, el) : ''; } catch(e){ msg=''; }
  var errEl = field.querySelector('.field-error');
  if(msg){ field.classList.add('is-invalid'); if(errEl) errEl.textContent = msg; return false; }
  field.classList.remove('is-invalid'); return true;
}
function clearFieldError(el){ var f=el.closest('.field'); if(f) f.classList.remove('is-invalid'); }

// ============================================
// EMPTY STATE (Iron Rule #39) — list/section ว่าง ต้องมี icon + title + desc + (action)
// ============================================
function emptyStateHTML(cfg){
  cfg = cfg || {};
  var act = cfg.actionLabel ? '<button class="btn btn-primary" onclick="' + (cfg.onAction||'') + '">' +
    (cfg.actionIcon ? '<i data-lucide="' + cfg.actionIcon + '" class="w-4 h-4"></i>' : '') +
    '<span>' + cfg.actionLabel + '</span></button>' : '';
  return '<div class="empty">'
    + '<div class="empty-icon"><i data-lucide="' + (cfg.icon||'inbox') + '"></i></div>'
    + '<div class="empty-title">' + (cfg.title||'ยังไม่มีข้อมูล') + '</div>'
    + '<div class="empty-desc">' + (cfg.desc||'') + '</div>'
    + act + '</div>';
}

// ============================================
// RENDER PRESERVATION (Iron Rule #29)
// ------------------------------------------------
// ทุกครั้งที่ render() ทำ innerHTML = ... full DOM rebuild
// scroll position + focus + cursor selection จะหาย —
// user รู้สึก "เด้งกลับบน" ทุกครั้งที่ toggle/click.
//
// withRenderPreservation(renderFn) wraps a render function
// to save state before innerHTML rebuild, then restore after.
//
// Preserves:
//   - scrollTop ของ .drawer-body
//   - scrollTop ของ .modal-body
//   - window.scrollY (page-level scroll)
//   - document.activeElement focus + selection range (input/textarea ที่กำลังพิมพ์)
//
// Usage:
//   const render = withRenderPreservation(function actualRender() {
//     content.innerHTML = ...
//   });
//
// หรือเรียกตรง ๆ ใน render() ที่มีอยู่แล้ว:
//   function render() {
//     const snapshot = preserveRenderState();
//     // ... innerHTML rebuilds ...
//     restoreRenderState(snapshot);
//   }
// ============================================
function preserveRenderState() {
  const drawerBody = document.querySelector('.drawer-body');
  const modalBody = document.querySelector('.modal-body');
  const activeEl = document.activeElement;
  const isInput = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA');
  return {
    drawerScroll: drawerBody ? drawerBody.scrollTop : 0,
    modalScroll: modalBody ? modalBody.scrollTop : 0,
    pageScroll: window.scrollY,
    focusKey: isInput ? {
      placeholder: activeEl.placeholder || '',
      type: activeEl.type || '',
      name: activeEl.name || '',
      selStart: activeEl.selectionStart,
      selEnd: activeEl.selectionEnd,
    } : null,
  };
}
function restoreRenderState(snap) {
  if (!snap) return;
  requestAnimationFrame(function() {
    const dBody = document.querySelector('.drawer-body');
    if (dBody && snap.drawerScroll > 0) dBody.scrollTop = snap.drawerScroll;
    const mBody = document.querySelector('.modal-body');
    if (mBody && snap.modalScroll > 0) mBody.scrollTop = snap.modalScroll;
    if (snap.pageScroll > 0) window.scrollTo(0, snap.pageScroll);

    if (snap.focusKey) {
      const candidates = document.querySelectorAll('input, textarea');
      for (let i = 0; i < candidates.length; i++) {
        const c = candidates[i];
        if ((c.placeholder || '') === snap.focusKey.placeholder
            && (c.type || '') === snap.focusKey.type
            && (c.name || '') === snap.focusKey.name) {
          c.focus();
          if (snap.focusKey.selStart != null && typeof c.setSelectionRange === 'function') {
            try { c.setSelectionRange(snap.focusKey.selStart, snap.focusKey.selEnd); } catch(e) {}
          }
          break;
        }
      }
    }
  });
}
function withRenderPreservation(renderFn) {
  return function preservedRender() {
    const snap = preserveRenderState();
    const result = renderFn.apply(this, arguments);
    restoreRenderState(snap);
    return result;
  };
}

window.addEventListener('hashchange', function () { render(); });  // v6.1 late-binding — ให้ชี้ render() ตัวที่ feature override (ผูกตรง ๆ จะ capture placeholder เดิม)

// รอ DOM + Lucide ทั้งคู่ก่อน first render
// (Lucide loader จะ dispatch 'lucide:ready' เมื่อ load สำเร็จ
//  หรือเมื่อทุก CDN fail แล้ว fallback เป็น no-op)
var domReady = false;
var lucideReady = false;
function bootIfReady() {
  if (domReady && lucideReady) {
    render();
    renderIcons();
  }
}
if (document.readyState === 'loading') {
  window.addEventListener('DOMContentLoaded', function() { domReady = true; bootIfReady(); });
} else {
  domReady = true;
}
// Listen for ready event AND check ว่า lucide load ไปแล้วหรือยัง
// (script ตัวนี้รันหลัง loader — ถ้า loader sync เสร็จก่อน, event อาจหายไปแล้ว)
window.addEventListener('lucide:ready', function() { lucideReady = true; bootIfReady(); });
if (window.lucide && typeof window.lucide.createIcons === 'function') {
  lucideReady = true;
}
bootIfReady();
// Safety net: ถ้า lucide:ready ไม่มาภายใน 5s ให้ render ไปก่อน (UI ยังใช้งานได้)
setTimeout(function() {
  if (!lucideReady) {
    console.warn('[Lucide] Timeout — rendering without icons');
    lucideReady = true;
    bootIfReady();
  }
}, 5000);

/* #95: เมนูใน scroll container (.table-wrap / drawer body / B2 line grid)
   ต้อง portal ด้วย util นี้ — z-index อย่างเดียวช่วยไม่ได้เพราะโดน ancestor overflow clip */
function portalMenu(trigger, menu){
  let host = document.getElementById('overlay-root');
  if(!host){ host = document.createElement('div'); host.id='overlay-root'; document.body.appendChild(host); }
  if(menu.parentElement !== host) host.appendChild(menu);
  menu.classList.add('menu-fixed');
  const r = trigger.getBoundingClientRect();
  const below = window.innerHeight - r.bottom - 12, above = r.top - 12;
  const h = Math.min(menu.scrollHeight || 320, 320);
  menu.style.left = r.left + 'px';
  menu.style.width = r.width + 'px';
  if(below < h && above > below){ menu.style.top='auto'; menu.style.bottom=(window.innerHeight-r.top+4)+'px';
    menu.style.maxHeight = Math.min(h, above)+'px'; }
  else { menu.style.bottom='auto'; menu.style.top=(r.bottom+4)+'px';
    menu.style.maxHeight = Math.min(h, Math.max(below,120))+'px'; }
  menu._trigger = trigger;
  const reposition = ()=>{ if(menu.classList.contains('open')) portalMenu(trigger, menu); };
  if(!menu._portalBound){ menu._portalBound = true;
    window.addEventListener('scroll', reposition, true);
    window.addEventListener('resize', reposition); }
}
function positionMenu(trigger,menu){const r=trigger.getBoundingClientRect();
  const below=window.innerHeight-r.bottom-12, above=r.top-12, h=Math.min(menu.scrollHeight,320);
  if(below<h && above>below){menu.classList.add('drop-up');menu.style.maxHeight=Math.min(h,above)+'px';}
  else{menu.classList.remove('drop-up');menu.style.maxHeight=Math.min(h,Math.max(below,120))+'px';}}
function openOverlay(menu,trigger){document.querySelectorAll('[data-overlay].open').forEach(m=>{if(m!==menu)closeOverlay(m);});
  menu.classList.add('open');menu._trigger=trigger;if(trigger)positionMenu(trigger,menu);}
function closeOverlay(menu){menu.classList.remove('open');if(menu._trigger)menu._trigger.focus();}
document.addEventListener('click',e=>{document.querySelectorAll('[data-overlay].open').forEach(m=>{
  if(!m.contains(e.target)&&!(m._trigger&&m._trigger.contains(e.target)))closeOverlay(m);});});
/* ===== END BASE-KIT UTILS ===== */
</script>

/* ---- ลิงก์ออกไป feature อื่น — ไม่มีหน้าจอแก้ข้อมูลของเขาในนี้ (#107 · FN-76) ---- */

function openDocCenter() { showToast('สำเนาสลิปเก็บที่ คลังเอกสาร — เปิดดูซ้ำได้เอกสารฉบับเดิมเสมอ', 'info'); }
function openDoa() { showToast('สายอนุมัติตั้งค่าที่ Policy Center › สายอนุมัติ — ที่นี่แสดงเฉพาะสายที่ระบบคืนมา', 'info'); }

/* --- building blocks --- */
function personCell(code, sub) {
  var e = empOf(code);

/* --- pill: สถานะรอบ · ชนิดรอบ · สถานะบรรทัด (คนละคอลัมน์เสมอ · #40/#103) --- */
function runPill(r) { var s = RST[r.st] || RST.draft; return '<span class="pill ' + s.p + '">' + s.n + '</span>'; }
function typePill(r) { return '<span class="pill pill-muted">' + RTY[r.ty] + '</span>'; }
function simPill(r) { return r.sim ? '<span class="pill pill-sim">จำลอง</span>' : ''; }
function linePill(l) {
  if (l.s === 'ok') return '<span class="pill pill-success">คำนวณแล้ว</span>';
  if (l.s === 'frozen') return '<span class="pill pill-frozen">ตรึงแล้ว</span>';
  return '<span class="pill pill-uncomp">ยังคำนวณไม่ได้</span>';
}
function slipPill() { return '<span class="pill pill-success">เผยแพร่แล้ว</span>'; }
function renderSignProgress(r) {
  if (stOrder(r.st) < 5 || r.st === 'void') return '<span class="signcell">—</span>';
  var g = signProgress(r), wait = r.st === 'wait';
  return '<span class="signcell"><span class="pgl' + (wait ? ' is-wait' : '') + '"><i style="width:' + g.pct + '%"></i></span>' + g.ok + '/' + g.tot + '</span>';
}
function runFlags(r, compact) {
  var out = [], st = runStats(r);
  if (r.sim) out.push('<span class="fl f-warn"><i data-lucide="flask-conical" class="w-3 h-3"></i>จำลอง</span>');
  if (st.un > 0 && !isClosed(r)) out.push('<span class="fl f-bad"><i data-lucide="triangle-alert" class="w-3 h-3"></i>คำนวณไม่ได้ ' + int(st.un) + '</span>');
  if (r.ref) out.push('<span class="fl f-mute"><i data-lucide="link" class="w-3 h-3"></i>อ้าง ' + r.ref + '</span>');
  if (r.reversedBy) out.push('<span class="fl f-warn"><i data-lucide="undo-2" class="w-3 h-3"></i>ถูกกลับรายการ</span>');
  if (r.adjustedBy) out.push('<span class="fl f-mute"><i data-lucide="git-branch" class="w-3 h-3"></i>มีรอบปรับปรุง</span>');
  if ((r.pullFail || []).length) out.push('<span class="fl f-bad"><i data-lucide="plug" class="w-3 h-3"></i>ดึงไม่ครบ</span>');
  if (r.ucf) out.push('<span class="fl f-warn"><i data-lucide="triangle-alert" class="w-3 h-3"></i>ต้นทางเปลี่ยน</span>');
  if (r.st === 'wait') out.push('<span class="fl f-warn"><i data-lucide="lock" class="w-3 h-3"></i>ล็อกคำนวณ</span>');
  if (!out.length) return '<span class="flrow"><span class="fl f-mute">—</span></span>';
  if (!compact) return '<span class="flrow wrap">' + out.join('') + '</span>';
  var more = out.length > 2 ? '<span class="fl" title="' + (out.length - 2) + ' ป้ายเพิ่มเติม — เปิดรอบเพื่อดูทั้งหมด">+' + (out.length - 2) + '</span>' : '';
  return '<span class="flrow">' + out.slice(0, 2).join('') + more + '</span>';
}

   ============================================================ */
function curTab() {
  var r = getRoute();
  if (r.indexOf('payroll/run/') === 0) return 'run';
  for (var i = 0; i < TABS.length; i++) if (r === TABS[i].r) return TABS[i].k;
  return 'runs';
}
function goTab(k) { state.pagination.page = 1; state.selRow = null; location.hash = TAB_HASH[k] || TAB_HASH.runs; }
function goRun(id) { var r = runOf(id); if (!r) return; state.runId = r.id; state.rtab = 'ready'; location.hash = '#/payroll/run/' + r.no; }
function goRunTab(k) { state.rtab = k; render(); }
function curRun() {
  var route = getRoute();
  if (route.indexOf('payroll/run/') === 0) {
    var no = decodeURIComponent(route.slice('payroll/run/'.length));
    var r = runOf(no); if (r) { state.runId = r.id; return r; }
  }
  return runOf(state.runId) || RUNS[3];
}
function tabCount(tab) {
  if (tab === 'queue') return ADJQ.filter(function (q) { return q.st === 'open'; }).length + ' รายการรอพิจารณา';
  if (tab === 'slips') return int(mySlips().length) + ' ฉบับ';
  var r = visibleRuns();
  return r.length + ' รอบ · เปิดอยู่ ' + r.filter(isOpenRun).length;
}
function mySlips() {
  var all = allPayslips();
  if (P().scope === 'own') return all.filter(function (s) { return s.emp === P().emp; });
  if (P().scope === 'dept') return all.filter(function (s) { return empOf(s.emp).d === empOf(P().emp).d; });
  return all;
}
function pageHeader(tab) {
  var acts = '';
  if (tab === 'runs' && P().make) acts = '<button class="btn btn-secondary" onclick="doExport()"><i data-lucide="download" class="w-4 h-4"></i>ส่งออก CSV</button>'
    + '<button class="btn btn-primary" onclick="openCreate()"><i data-lucide="plus" class="w-4 h-4"></i>สร้างรอบจ่าย</button>';

      return '<tr onclick="openSlip(\'' + s.no + '\')">'
        + '<td><span class="tbl-mono">' + s.no + '</span></td>'
        + '<td>' + personCell(s.emp) + '</td>'
        + '<td><span class="cell-main">' + esc(periodOf(s.pd).n) + '</span></td>'
        + '<td><span class="tnum">' + s.run + '</span></td>'
        + '<td><span class="cell-main">' + dt(s.at) + '</span></td>'
        + '<td>' + slipPill() + '</td>'
        + '<td class="tar">' + netCell(sm, s.emp) + '</td>'
        + '<td class="tar" onclick="event.stopPropagation()">'
        + '<button class="icon-btn" title="เปิดสลิป" onclick="openSlip(\'' + s.no + '\')"><i data-lucide="file-search" class="w-4 h-4"></i></button>'
        + '<button class="icon-btn" title="ดาวน์โหลดเอกสารฉบับเดิมจากคลังสำเนา" onclick="downloadSlip(\'' + s.no + '\')"><i data-lucide="download" class="w-4 h-4"></i></button>'
        + '</td></tr>';
    }).join('') + '</tbody></table></div>'
    : emptyBlock('ยังไม่มีสลิปที่ตรงกับตัวกรอง', 'สลิปเกิดขึ้นตอนปิดรอบเท่านั้น — ไม่มีตัวช่วยสร้างสลิปทีละใบ');
  var deny = P().scope === 'all' ? SEC('shield-x', 'ทดลองการปฏิเสธการเข้าถึง', 'S-43 · FN-68',
    GATE('is-warn', 'shield-x', 'สลิปเป็นเอกสารแบบได้ทั้งใบหรือไม่ได้เลย',
      'ผู้ที่ไม่มีสิทธิ์จะไม่ได้เอกสารเลย ไม่ใช่ได้เอกสารที่ตัวเลขถูกปิดบัง เพราะเอกสารที่ตัวเลขหายไปคือเอกสารที่ชวนให้เข้าใจผิดว่าได้รับข้อมูลครบแล้ว',
      '<button class="btn btn-secondary btn-sm" onclick="tryDenied()"><i data-lucide="play" class="w-4 h-4"></i>ลองเปิดสลิปของคนอื่นในบทบาทพนักงาน</button>')) : '';
  return '<div class="card list-card">' + fr + body + '<div class="table-foot"><span>' + rows.length + ' รายการ</span>' + pager(rows.length) + '</div></div>' + deny;
}

/* ---- มุมมองพนักงาน (สลิปของตัวเองเท่านั้น) ---- */
function viewEmpHome() {
  var mine = mySlips();

    + '<p class="ph-sub">สลิปเงินเดือนของคุณ พร้อมยอดสะสมรายปี — เปิดดูซ้ำได้เอกสารฉบับเดิมเสมอ</p></div>'
    + '<div class="ph-actions"></div></div>';
  var y = ytdOf(P().emp);
  var cards = '<div class="statgrid">'
    + '<div class="rescard"><div class="rc-t"><i data-lucide="wallet" class="w-4 h-4"></i>เงินได้สะสมปีภาษีนี้</div><div class="rc-v">' + moneyPlain(y.inAmt, P().emp) + '</div><div class="rc-m">จากรอบที่ปิดแล้ว ' + y.runs + ' รอบ · ไม่นับรอบจำลอง</div></div>'
    + '<div class="rescard is-hold"><div class="rc-t"><i data-lucide="triangle-alert" class="w-4 h-4"></i>ภาษีและเงินสมทบสะสม</div><div class="rc-v is-bad">ยังคำนวณไม่ได้</div><div class="rc-m">ค่าตามกฎหมายยังไม่ถูกเผยแพร่ที่ ตั้งค่า HR</div></div>'
    + '<div class="rescard"><div class="rc-t"><i data-lucide="file-text" class="w-4 h-4"></i>สลิปฉบับล่าสุด</div><div class="rc-v" style="font-size:15px">' + (mine[0] ? mine[0].no : '—') + '</div><div class="rc-m">' + (mine[0] ? periodOf(mine[0].pd).n : 'ยังไม่มีสลิป') + '</div></div>'
    + '</div>';
  var body = mine.length ? '<div class="table-wrap"><table class="table"><thead><tr>'
    + '<th style="width:150px">เลขที่สลิป</th><th style="width:180px">งวด</th><th style="width:126px">รอบที่ออก</th>'
    + '<th style="width:130px">วันที่ออก</th><th style="width:104px">สถานะ</th><th style="width:120px">ยอดสุทธิ</th><th style="width:110px">ทำอะไรได้</th></tr></thead><tbody>'
    + mine.map(function (s) {
      var r = runOf(s.run), sm = empSum(r, s.emp);
      return '<tr onclick="openSlip(\'' + s.no + '\')"><td><span class="tbl-mono">' + s.no + '</span></td>'
        + '<td><span class="cell-main">' + esc(periodOf(s.pd).n) + '</span></td>'
        + '<td><span class="tnum">' + s.run + '</span></td>'
        + '<td><span class="cell-main">' + dt(s.at) + '</span></td>'
        + '<td>' + slipPill() + '</td>'
        + '<td class="tar">' + netCell(sm, s.emp) + '</td>'
        + '<td class="tar" onclick="event.stopPropagation()"><button class="icon-btn" title="เปิดสลิป" onclick="openSlip(\'' + s.no + '\')"><i data-lucide="file-search" class="w-4 h-4"></i></button>'
        + '<button class="icon-btn" title="ดาวน์โหลด" onclick="downloadSlip(\'' + s.no + '\')"><i data-lucide="download" class="w-4 h-4"></i></button></td></tr>';
    }).join('') + '</tbody></table></div>'
    : emptyBlock('ยังไม่มีสลิปของคุณ', 'สลิปจะปรากฏหลังรอบจ่ายของงวดถูกปิด');
  return head + cards + '<div class="card list-card">' + body + '<div class="table-foot"><span>' + mine.length + ' รายการ</span></div></div>';
}
</script>
<script>
/* ============================================================
   หน้ารอบจ่าย — แท็บภายในหน้าเดียวกัน (#104) · ปุ่มขึ้นกับสถานะจริงของเครื่องสถานะ (§5)
   ============================================================ */
function smRail(r) {
  if (isVoid(r)) return '<div class="smrail"><span class="sm is-cur"><span class="sm-d"></span><b>ยกเลิก</b></span></div>';
  var cur = r.st === 'rejected' ? 'wait' : r.st;
  var ci = SM_ORDER.indexOf(cur);
  return '<div class="smrail">' + SM_ORDER.map(function (k, i) {
    var cls = i < ci ? ' is-done' : i === ci ? ' is-cur' : '';
    var nm = (r.st === 'rejected' && k === 'wait') ? 'ไม่อนุมัติ' : RST[k].n;
    return (i ? '<span class="sm-ar"></span>' : '') + '<span class="sm' + cls + '"><span class="sm-d"></span><b>' + nm + '</b></span>';
  }).join('') + '</div>';
}
function runActions(r) {
  var b = [], mk = P().make;
  if (isVoid(r)) return '<span class="fl f-mute">รอบนี้ถูกยกเลิกแล้ว เลขที่ยังคงอยู่และไม่ถูกใช้ซ้ำ</span>';
  if (isClosed(r)) {
    b.push('<button class="btn btn-secondary" onclick="openRefuse(\'' + r.id + '\')"><i data-lucide="shield-x" class="w-4 h-4"></i>ลองสั่งแก้รอบที่ปิดแล้ว</button>');
    if (mk) {
      b.push('<button class="btn btn-secondary" onclick="openCreate(\'' + r.no + '\',\'adjust\')"><i data-lucide="git-branch" class="w-4 h-4"></i>สร้างรอบปรับปรุง</button>');
      b.push('<button class="btn btn-primary" onclick="openCreate(\'' + r.no + '\',\'reverse\')"><i data-lucide="undo-2" class="w-4 h-4"></i>สร้างรอบกลับรายการ</button>');
    }
    return b.join('');
  }
  if (r.st === 'draft' && mk) b.push('<button class="btn btn-primary" onclick="doPull(\'' + r.id + '\')"><i data-lucide="download" class="w-4 h-4"></i>ดึงข้อมูลจากต้นทาง</button>');
  if (r.st === 'pulled' && mk) b.push('<button class="btn btn-primary" onclick="doCalc(\'' + r.id + '\')"><i data-lucide="calculator" class="w-4 h-4"></i>คำนวณ</button>');
  if (r.st === 'calc' && mk) b.push('<button class="btn btn-primary" onclick="doReview(\'' + r.id + '\')"><i data-lucide="git-compare" class="w-4 h-4"></i>ส่งเข้าการทบทวน</button>');
  if (r.st === 'review' && mk) {
    var ok = canSubmit(r), bl = submitBlockers(r);
    b.push('<button class="btn btn-primary ' + (ok ? '' : 'is-disabled') + '"' + (ok ? '' : ' disabled') + ' onclick="openSubmit(\'' + r.id + '\')" title="' + (ok ? 'ขอสายอนุมัติจากระบบอนุมัติกลาง' : esc(bl.map(function (x) { return x.t; }).join(' · '))) + '"><i data-lucide="send" class="w-4 h-4"></i>ส่งอนุมัติ</button>');
    if (!ok) b.push('<button class="btn btn-danger" onclick="openBlockers(\'' + r.id + '\')"><i data-lucide="triangle-alert" class="w-4 h-4"></i>ดูรายการที่ต้องเคลียร์ ' + bl.length + '</button>');
  }
  if (r.st === 'wait') {
    if (canActOn(r)) {
      b.push('<button class="btn btn-danger" onclick="openModal(\'reject\',{id:\'' + r.id + '\'})"><i data-lucide="x" class="w-4 h-4"></i>ไม่อนุมัติ</button>');
      b.push('<button class="btn btn-primary" onclick="doApprove(\'' + r.id + '\')"><i data-lucide="check" class="w-4 h-4"></i>อนุมัติขั้นของฉัน</button>');
    } else b.push('<span class="fl f-warn"><i data-lucide="lock" class="w-3 h-3"></i>การคำนวณถูกล็อกระหว่างรออนุมัติ</span>');
  }
  if (r.st === 'approved' && P().close) b.push('<button class="btn btn-primary" onclick="openModal(\'close\',{id:\'' + r.id + '\'})"><i data-lucide="lock" class="w-4 h-4"></i>ปิดรอบ</button>');
  if (r.st === 'rejected' && mk) b.push('<button class="btn btn-primary" onclick="doReopen(\'' + r.id + '\')"><i data-lucide="rotate-ccw" class="w-4 h-4"></i>กลับไปแก้แล้วส่งใหม่</button>');
  if (mk && stOrder(r.st) >= 2 && stOrder(r.st) <= 4 && r.st !== 'wait') b.push('<button class="btn btn-secondary" onclick="openModal(\'repull\',{id:\'' + r.id + '\'})"><i data-lucide="refresh-cw" class="w-4 h-4"></i>ดึงข้อมูลใหม่</button>');
  if (mk && (stOrder(r.st) <= 4 || r.st === 'rejected') && r.st !== 'wait') b.push('<button class="btn btn-danger" onclick="openModal(\'cancel\',{id:\'' + r.id + '\'})"><i data-lucide="ban" class="w-4 h-4"></i>ยกเลิกรอบ</button>');
  return b.join('');
}
function runHeader(r) {
  var pd = periodOf(r.pd);
  var sub = [RTY[r.ty], pd.n, 'วันจ่าย ' + dt(pd.pay), runEmps(r).length + ' คน'];
  if (r.ref) sub.push('อ้างรอบต้นฉบับ ' + r.ref);
  return '<div class="ph"><div>'
    + '<div class="ph-title-row"><button class="btn btn-ghost btn-sm" onclick="goTab(\'runs\')"><i data-lucide="chevron-left" class="w-4 h-4"></i>รอบทั้งหมด</button>'
    + '<h1 class="ph-title">' + esc(r.sim ? 'รอบจำลอง · ' + r.no : r.no) + '</h1>' + runPill(r) + typePill(r) + simPill(r) + '</div>'
    + '<p class="ph-sub">' + esc(sub.join(' · ')) + (r.why ? ' — ' + esc(r.why) : '') + '</p></div>'
    + '<div class="ph-actions">' + runActions(r) + '</div></div>';
}
function runTabsHTML(r) {
  var st = runStats(r);
  return '<div class="tabs page-tabs">' + RTABS.map(function (t) {
    var n = t.k === 'calc' && st.un ? st.un : 0;
    return '<button class="tab ' + (t.k === state.rtab ? 'is-active' : '') + '" onclick="goRunTab(\'' + t.k + '\')">'
      + '<i data-lucide="' + t.i + '" class="w-4 h-4"></i>' + t.n + (n ? '<span class="tab-badge">' + int(n) + '</span>' : '') + '</button>';
  }).join('') + '</div>';
}
function viewRun() {
  var r = curRun();
  var body = { ready: rtReady, calc: rtCalc, variance: rtVariance, sign: rtSign, slips: rtSlips, bank: rtBank, hist: rtHist }[state.rtab] || rtReady;
  return runHeader(r) + runTabsHTML(r) + smRail(r) + body(r);
}

/* ---- แท็บ ความพร้อม ---- */
function rtReady(r) {
  var rd = readiness(r), miss = missingGroups().filter(function (g) { return g.g !== 'bank_file'; });
  var st = runStats(r);
  var top = '';
  if (!isClosed(r) && st.un > 0) {
    top = SEC('shield-alert', 'สถานะการจ่ายของรอบนี้', 'BR-14 … BR-19 · S-22 · S-34',
      GATE('is-bad', 'octagon-alert', 'รอบนี้ยังจ่ายไม่ได้ และจะไม่จ่ายจนกว่าจะมีค่าตามกฎหมายให้อ่าน',
        'ตั้งค่า HR ยังไม่เผยแพร่ค่าตามกฎหมาย ' + miss.length + ' กลุ่ม รวม ' + missingKeyCount() + ' คีย์ — บรรทัดที่ขึ้นกับค่าเหล่านี้จึงมีสถานะ “ยังคำนวณไม่ได้” จำนวนเงินเป็นค่าว่าง ไม่ใช่ 0 และยอดสุทธิของทุกคนยังคำนวณไม่ได้',
        cfgLink("openHrConfig('')", 'จัดการที่ ตั้งค่า HR') + ' ' + '<button class="btn btn-secondary btn-sm" onclick="openBlockers(\'' + r.id + '\')"><i data-lucide="list-checks" class="w-4 h-4"></i>ดูรายการที่ต้องเคลียร์</button>')
      + GATE('is-bad', 'send', 'ส่งอนุมัติไม่ได้ระหว่างที่ยังมีบรรทัดคำนวณไม่ได้',
        'บรรทัดที่คำนวณไม่ได้ ' + int(st.un) + ' บรรทัด ใน ' + int(st.unEmp) + ' คน — นี่คือกลไกที่ทำให้ไม่มีวันจ่ายเงินจากตัวเลขที่เดามา'));
  }
  var pull = '<div>' + rd.map(function (x) {
    var cls = x.state === 'fail' || x.state === 'bad' ? ' is-bad' : x.state === 'warn' ? ' is-warn' : '';
    var badge = x.state === 'fail' ? '<span class="fl f-bad"><i data-lucide="plug" class="w-3 h-3"></i>เรียกไม่สำเร็จ</span>'
      : x.state === 'bad' ? '<span class="fl f-bad"><i data-lucide="triangle-alert" class="w-3 h-3"></i>ไม่มีค่าให้อ่าน</span>'
        : x.state === 'warn' ? '<span class="fl f-warn"><i data-lucide="activity" class="w-3 h-3"></i>ยอดยังเปลี่ยนได้</span>'
          : x.state === 'none' ? '<span class="fl f-mute"><i data-lucide="minus" class="w-3 h-3"></i>ยังไม่ได้ดึง</span>'
            : '<span class="fl f-ok"><i data-lucide="check" class="w-3 h-3"></i>อ่านครบ</span>';
    return '<div class="srcrow' + cls + '"><span class="sr-ic"><i data-lucide="' + x.s.ic + '" class="w-3 h-3"></i></span>'
      + '<div style="min-width:0"><div class="sr-n">' + x.s.n + '</div><div class="sr-m">' + esc(x.s.gives) + '</div></div>'
      + '<div style="min-width:0"><div class="sr-m">' + esc(x.msg) + '</div></div>'
      + '<div class="sr-v">' + (r.pulled ? esc(x.s.ep) : '—') + '</div>'
      + '<div class="sr-a">' + badge
      + (x.state === 'fail' ? '<button class="btn btn-secondary btn-sm" onclick="doRetry(\'' + r.id + '\',\'' + x.k + '\')"><i data-lucide="refresh-cw" class="w-4 h-4"></i>ลองใหม่</button>' : '')
      + '<button class="btn btn-ghost btn-sm" onclick="' + x.s.link + '"><i data-lucide="external-link" class="w-4 h-4"></i>จัดการที่ ' + x.s.n + '</button></div></div>';
  }).join('') + '</div>';

  var cfgBoxes = '<div class="cfggrid">' + CFG.map(function (g) {
    return '<div class="cfgbox' + (g.ok ? '' : ' is-missing') + '">'
      + '<div class="cb-h"><i data-lucide="' + (g.ok ? 'check-circle-2' : 'circle-slash') + '" class="w-4 h-4"></i><span>' + g.n + '</span>'
      + '<span class="cb-r">' + (g.ok ? '<span class="pill pill-success">อ่านได้</span>' : '<span class="pill pill-uncomp">ยังไม่มีค่า</span>') + '</span></div>'
      + '<div class="cb-v" style="' + (g.ok ? 'color:var(--c-ink)' : '') + '">' + (g.ok ? 'รหัสเวอร์ชัน ' + g.v : 'ยังไม่มีค่าให้อ่าน') + '</div>'
      + '<div class="cb-s">' + esc(g.use) + (g.oq ? ' · ประเด็นค้าง ' + g.oq : '') + '</div>'
      + '<div class="cb-keys">' + g.keys.map(function (k) { return '<span class="cfgkey">' + k + '</span>'; }).join('') + '</div>'
      + '<div class="cb-a">' + cfgLink("openHrConfig('" + g.g + "')", 'จัดการที่ ตั้งค่า HR') + '</div></div>';
  }).join('') + '</div>';

  var snap = snapshotOf(r);
  var manifest = '<div class="mini-wrap"><table class="mini-tbl"><thead><tr>'
    + '<th style="width:150px">ต้นทาง</th><th style="width:150px">มุมมองที่เรียก</th><th style="width:240px">พารามิเตอร์ที่ส่งไป</th>'
    + '<th style="width:130px">เวลาที่อ่าน</th><th style="width:80px">จำนวนแถว</th><th style="width:110px">สถานะงวด</th><th style="width:170px">รหัสเวอร์ชันที่ตรึงไว้</th></tr></thead><tbody>'
    + snap.map(function (s) {
      return '<tr><td>' + s.n + '</td><td>' + esc(s.ep) + '</td><td><span class="sr-v">' + esc(s.params) + '</span></td>'
        + '<td>' + esc(s.at) + '</td><td class="rt tnum">' + (s.rows ? int(s.rows) : '—') + '</td>'
        + '<td>' + esc(s.pst) + '</td><td>' + (s.ver ? '<span class="sr-v">' + esc(s.ver) + '</span>' : '<span class="text-mute-2">—</span>') + '</td></tr>';
    }).join('') + '</tbody></table></div>';

  var verBlock = '<div class="frozen">' + CFG.map(function (g) {
    return '<div class="frz"><div class="fz-k">' + g.n + '</div><div class="fz-v' + (g.ok ? '' : ' is-null') + '">' + (g.ok ? g.v : 'null') + '</div></div>';
  }).join('') + '</div>';

  var noRate = runEmps(r).filter(function (c) { return empOf(c).base == null; });
  var excl = excludedOf(r);
  var exc = runEmps(r).filter(function (c) { return (PIN[c] || {}).exc; });
  var lists = '';
  if (noRate.length) lists += GATE('is-bad', 'user-x', 'ต้องแก้ก่อน — ไม่มีอัตราค่าจ้าง ณ วันจ่าย ' + noRate.length + ' คน',
    noRate.map(function (c) { return nameOf(c) + ' (' + c + ')'; }).join(' · ') + ' — ไม่ใช้อัตราของวันใกล้เคียงแทน และรอบส่งอนุมัติไม่ได้จนกว่าจะเคลียร์หรือถอดออกจากขอบเขตพร้อมเหตุผล',
    cfgLink("openSalStruct('อัตราค่าจ้าง')", 'จัดการที่ โครงเงินเดือน'));
  if (exc.length) lists += GATE('is-warn', 'calendar-x', 'ข้อมูลเวลาไม่ครบ ' + exc.length + ' คน',
    exc.map(nameOf).join(' · ') + ' — วันที่เป็นข้อยกเว้นคืนชั่วโมงเป็น 0 ซึ่งแปลว่าข้อมูลไม่ครบ ไม่ใช่ไม่ได้ทำงาน จึงไม่ถูกหักเงินจากค่านั้น',
    cfgLink("openAttend('วันข้อยกเว้น')", 'จัดการที่ เวลาเข้างาน'));
  if (excl.length) lists += GATE('', 'user-minus', 'ถูกคัดออกจากรอบ ' + excl.length + ' คน',

    + joined + gone
    + SEC('building', 'สรุปต้นทุนแรงงานแยกศูนย์ต้นทุน', 'ใช้เป็นฐานของรายการบัญชีของรอบด้วย', ccTbl);
}

/* ---- แท็บ ลายเซ็น/อนุมัติ ---- */
function rtSign(r) {
  var d = resolveDoa(r), ch = chainOf(r), pl = resolvePayload(r);
  var info = '<div class="factgrid">'
    + FACT('ชั้นสายที่เลือกได้', d.an, 'รหัสการอนุมัติ ' + d.aid)
    + FACT('ชนิดรอบ', RTY[r.ty], 'ตัวแปรตัวที่หนึ่งของฟังก์ชันเลือกชั้นสาย')
    + FACT('ธงต่างอย่างมีนัยสำคัญ', hasMaterialVariance(r) === null ? 'ยังตัดสินไม่ได้' : (hasMaterialVariance(r) ? 'ใช่' : 'ไม่ใช่'), 'ตัวแปรตัวที่สอง — ค่าว่างแปลว่าเลือกสายที่ยาวกว่าไว้ก่อน', hasMaterialVariance(r) === null ? 'is-warn' : '')
    + FACT('จำนวนขั้นที่ระบบคืนมา', ch.length + ' ขั้น', 'หน้าจอวาดตามจำนวนขั้นจริง ไม่มีการวาดช่องตายตัว')
    + '</div>';
  var payload = '<div class="frozen">' + Object.keys(pl).map(function (k) {
    return '<div class="frz"><div class="fz-k">' + k + '</div><div class="fz-v">' + esc(String(pl[k] === null ? 'null' : pl[k])) + '</div></div>';
  }).join('') + '</div>';
  var steps = ch.map(function (s) {
    var cls = s.st === 'approved' ? ' is-ok' : s.st === 'pending' ? ' is-cur' : '';
    var pill = s.st === 'approved' ? '<span class="pill pill-success">อนุมัติแล้ว</span>'
      : s.st === 'pending' ? '<span class="pill pill-warning">รอขั้นนี้</span>'
        : s.st === 'rejected' ? '<span class="pill pill-danger">ไม่อนุมัติ</span>'
          : s.st === 'waiting' ? '<span class="pill pill-muted">ยังไม่ถึงคิว</span>' : '<span class="pill pill-muted">ยังไม่ส่ง</span>';
    return '<div class="signstep' + cls + '"><span class="slot-no">' + s.i + '</span>'
      + '<div style="min-width:0"><div class="slot-role">' + s.rn + (s.key ? ' <span class="fl f-warn">ขั้นที่ต้องเห็นตัวเลขจริง</span>' : '') + '<span>' + (s.as ? '' : 'ยังไม่ได้เลือกผู้รับผิดชอบ') + '</span></div>'
      + (s.as ? '<div style="margin-top:6px">' + empChip(s.as) + '</div>' : '')
      + (s.cm ? '<div class="ss-c">ความเห็น: ' + esc(s.cm) + '</div>' : '')
      + '</div><div style="text-align:right">' + pill + '<div class="ss-c">' + (s.at ? dtt(s.at) : '—') + '</div></div></div>';
  }).join('');
  var note = r.st === 'rejected' ? GATE('is-bad', 'x', 'ไม่อนุมัติที่ขั้นที่ 2', esc(r.rejReason) + ' — แก้แล้วส่งใหม่ได้ และการส่งใหม่จะขอสายใหม่ทั้งสาย เลขที่รอบยังคงเดิม') : '';
  var ucf = r.ucf ? GATE('is-warn', 'triangle-alert', 'ข้อมูลต้นทางเปลี่ยนหลังคำนวณ',
    'ตัวเลขของรอบไม่ขยับ เพราะคำนวณจากชุดข้อมูลที่ตรึงไว้ — ผู้อนุมัติเห็นธงนี้ก่อนเซ็น และผู้จัดทำเลือกได้ว่าจะถอนกลับไปดึงใหม่หรือเดินต่อ',
    (P().make ? '<button class="btn btn-secondary btn-sm" onclick="openModal(\'repull\',{id:\'' + r.id + '\'})"><i data-lucide="refresh-cw" class="w-4 h-4"></i>ถอนกลับไปดึงใหม่</button>' : '')) : '';
  var sod = GATE('', 'user-check', 'ผู้จัดทำรอบเซ็นอนุมัติรอบของตัวเองไม่ได้', 'ผู้จัดทำรอบนี้คือ ' + nameOf(r.by) + ' — ตัวเลือกในทุกขั้นจึงไม่มีชื่อผู้จัดทำ');
  return SEC('git-branch', 'ชั้นสายอนุมัติที่ระบบคืนมา', 'ไม่มีสายอนุมัติที่เขียนตายอยู่ในหน้าจอนี้', info)
    + SEC('braces', 'ข้อมูลที่ส่งเข้าไปขอสายอนุมัติ', 'ไม่มีจำนวนเงินและไม่มีช่วงวงเงินอยู่ในชุดนี้', payload)
    + SEC('signature', 'ขั้นการอนุมัติ', signProgress(r).ok + '/' + signProgress(r).tot + ' ขั้น', ucf + note + steps + sod);
}

/* ---- แท็บ สลิป ---- */
function rtSlips(r) {
  var slips = payslipsOf(r), emps = runEmps(r);
  var head = isClosed(r)
    ? GATE('', 'badge-check', 'สลิปออกครบทุกคนตอนปิดรอบในธุรกรรมเดียว', 'เลขที่สลิปออกพร้อมกันทุกใบ เก็บสำเนาถาวร และเปิดดูซ้ำได้เอกสารฉบับเดิมเสมอ')
    : GATE('is-warn', 'file-clock', 'ยังไม่มีเลขที่สลิป', 'เลขที่สลิปออกตอนปิดรอบเท่านั้น — ก่อนหน้านั้นสิ่งที่เห็นคือผลการคำนวณของแต่ละคน ไม่ใช่สลิป และไม่มีตัวช่วยสร้างสลิปทีละใบ');
  var rows = isClosed(r) ? slips.map(function (s) {
    var sm = empSum(r, s.emp);
    return '<tr onclick="openSlip(\'' + s.no + '\')"><td><span class="tbl-mono">' + s.no + '</span></td>'
      + '<td>' + personCell(s.emp) + '</td><td>' + slipPill() + '</td>'
      + '<td class="tar">' + money(sm.inAmt, s.emp) + '</td><td class="tar">' + money(sm.deAmt, s.emp) + '</td>'
      + '<td class="tar">' + netCell(sm, s.emp) + '</td>'
      + '<td class="tar" onclick="event.stopPropagation()"><button class="icon-btn" title="เปิดสลิป" onclick="openSlip(\'' + s.no + '\')"><i data-lucide="file-search" class="w-4 h-4"></i></button>'
      + '<button class="icon-btn" title="ดาวน์โหลดเอกสารฉบับเดิม" onclick="downloadSlip(\'' + s.no + '\')"><i data-lucide="download" class="w-4 h-4"></i></button></td></tr>';
  }).join('') : emps.map(function (c) {
    var sm = empSum(r, c);
    return '<tr onclick="openSlipFor(\'' + r.id + '\',\'' + c + '\')"><td><span class="text-mute-2">ยังไม่ออกเลขที่</span></td>'
      + '<td>' + personCell(c) + '</td><td><span class="pill pill-muted">ยังไม่ออก</span></td>'
      + '<td class="tar">' + money(sm.inAmt, c) + '</td><td class="tar">' + money(sm.deAmt, c) + '</td>'
      + '<td class="tar">' + netCell(sm, c) + '</td>'
      + '<td class="tar" onclick="event.stopPropagation()"><button class="icon-btn" title="ดูผลคำนวณรายคน" onclick="openSlipFor(\'' + r.id + '\',\'' + c + '\')"><i data-lucide="file-search" class="w-4 h-4"></i></button></td></tr>';
  }).join('');
  var n = isClosed(r) ? slips.length : emps.length;
  return SEC('file-text', 'สลิปของรอบนี้', isClosed(r) ? 'ออกแล้ว ' + slips.length + ' ฉบับ' : 'ยังไม่ออก', head)
    + '<div class="card list-card"><div class="table-wrap"><table class="table slip-tbl"><thead><tr>'
    + '<th style="width:150px">เลขที่สลิป</th><th style="width:230px">พนักงาน</th><th style="width:110px">สถานะ</th>'
    + '<th style="width:130px">รวมเงินได้</th><th style="width:130px">รวมเงินหัก</th><th style="width:140px">ยอดสุทธิ</th><th style="width:96px">ทำอะไรได้</th></tr></thead><tbody>'
    + rows + '</tbody></table></div><div class="table-foot"><span>' + n + ' รายการ</span></div></div>';
}

/* ---- แท็บ ไฟล์และบัญชี ---- */
function rtBank(r) {
  var nb = noBankList(r), gl = glLines(r), st = runStats(r);
  var canFile = isClosed(r);
  var bankCard = SEC('landmark', 'ไฟล์โอนธนาคาร', canFile ? 'ออกได้หลังปิดรอบ' : 'ต้องปิดรอบก่อน',
    (canFile ? '' : GATE('is-warn', 'lock', 'ยังออกไฟล์โอนไม่ได้', 'ไฟล์โอนออกได้หลังรอบถูกปิดเท่านั้น'))
    + '<div class="factgrid">'
    + FACT('รูปแบบไฟล์ที่ใช้ได้', BANKS[0].n, BANKS[0].note + ' — ยังไม่มีรูปแบบของธนาคารรายตัวให้อ่าน', 'is-warn')
    + FACT('จำนวนรายการในไฟล์', canFile ? int(runEmps(r).length - nb.length) + ' รายการ' : '—', 'นับเฉพาะคนที่มีเลขบัญชีธนาคาร')
    + FACT('ต้องจ่ายด้วยวิธีอื่น', nb.length + ' คน', nb.length ? nb.map(nameOf).join(' · ') + ' — ไม่มีเลขบัญชีในทะเบียนพนักงาน' : 'ทุกคนมีเลขบัญชี', nb.length ? 'is-warn' : '')
    + FACT('สถานะการส่งไฟล์', (AUDIT['sent-' + r.id] ? 'ส่งไฟล์แล้ว' : 'ยังไม่ได้ส่ง'), 'ต้องมีคนกดยืนยันเอง ไม่มีการยืนยันอัตโนมัติ')
    + '</div>'
    + '<div class="g-a" style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">'
    + '<button class="btn btn-primary ' + (canFile ? '' : 'is-disabled') + '"' + (canFile ? '' : ' disabled') + ' onclick="openModal(\'bank\',{id:\'' + r.id + '\'})"><i data-lucide="file-down" class="w-4 h-4"></i>ออกไฟล์โอนธนาคาร</button>'
    + '<button class="btn btn-secondary ' + (canFile && !AUDIT['sent-' + r.id] ? '' : 'is-disabled') + '"' + (canFile && !AUDIT['sent-' + r.id] ? '' : ' disabled') + ' onclick="markSent(\'' + r.id + '\')"><i data-lucide="check" class="w-4 h-4"></i>ทำเครื่องหมายว่าส่งไฟล์แล้ว</button>'
    + cfgLink('openFinance()', 'ไปที่ การจ่ายเงิน')
    + '</div>');
  var glTbl = '<div class="mini-wrap"><table class="mini-tbl"><thead><tr>'
    + '<th style="width:110px">ด้าน</th><th style="width:300px">รายการ</th><th style="width:170px">ศูนย์ต้นทุน</th>'
    + '<th style="width:170px">รหัสจ่าย</th><th style="width:150px">จำนวนเงิน</th><th style="width:160px">สถานะ</th></tr></thead><tbody>'
    + gl.map(function (x) {
      return '<tr><td>' + x.side + '</td><td>' + esc(x.n) + '</td><td>' + (x.cc === '—' ? '<span class="text-mute-2">ทุกศูนย์</span>' : esc(ccOf(x.cc))) + '</td>'
        + '<td><span class="sr-v">' + esc(x.code) + '</span></td>'
        + '<td class="rt">' + (x.amt == null ? '<span class="text-mute-2">—</span>' : money(x.amt)) + '</td>'
        + '<td>' + (x.s === 'uncomp' ? '<span class="pill pill-uncomp">ยังคำนวณไม่ได้</span>' : x.s === 'part' ? '<span class="pill pill-warning">ไม่ครบด้าน</span>' : '<span class="pill pill-success">ครบ</span>') + '</td></tr>';
    }).join('') + '</tbody></table></div>';
  var glCard = SEC('book-open', 'รายการบัญชีของรอบ', 'ส่งเป็นรหัสจ่ายและศูนย์ต้นทุน ไม่ส่งเลขบัญชี',
    GATE('is-warn', 'unplug', 'ปลายทางบัญชียังไม่มีในระบบ — รายการอยู่สถานะ “รอปลายทาง”',
      'ไม่ลงบัญชีจริงและไม่จำลองหน้าจอบัญชี · การที่ปลายทางยังไม่มีต้องไม่บล็อกการปิดรอบ',
      '<button class="btn btn-secondary btn-sm" onclick="downloadGL(\'' + r.id + '\')"><i data-lucide="download" class="w-4 h-4"></i>ดาวน์โหลดรายการ</button> ' + cfgLink('openGL()', 'ไปที่ บัญชีแยกประเภท'))
    + glTbl
    + (st.un ? GATE('is-bad', 'octagon-alert', 'ชุดรายการยังไม่ครบด้าน', 'ฝั่งเจ้าหนี้ทั้งสี่รายยังคำนวณไม่ได้ เพราะขึ้นกับค่าตามกฎหมายที่ยังไม่ถูกเผยแพร่ — รอบที่มีบรรทัดคำนวณไม่ได้จึงปิดไม่ได้ และไม่มีทางเกิดรายการบัญชีที่ไม่ครบด้าน') : ''));
  var lk = SEC('unplug', 'สถานะการเชื่อมโมดูล', '', '<div class="factgrid">' + LINKAGE.map(function (l) {
    return FACT(l.n, l.on ? 'เปิดอยู่' : 'ปิดอยู่', l.note, l.on ? '' : 'is-warn');
  }).join('') + '</div>');
  return bankCard + glCard + lk;
}

/* ---- แท็บ ประวัติ ---- */
function rtHist(r) {
  var tl = timelineOf(r);
  var items = tl.map(function (x) {
    return '<div class="tl-item"><span class="tl-dot' + (x.t.indexOf('ไม่อนุมัติ') >= 0 || x.t.indexOf('ยกเลิก') >= 0 ? ' is-danger' : x.t === 'ปิดรอบ' ? ' is-success' : '') + '"></span>'
      + '<div class="tl-card"><div class="tl-head">' + esc(x.t) + '<span class="sec-r">' + dtt(x.at) + '</span></div>'
      + '<div class="tl-meta">' + esc(x.by) + '</div>'
      + (x.s ? '<div class="tl-q">' + esc(x.s) + '</div>' : '') + '</div></div>';
  }).join('');
  var rel = '';
  if (r.reversedBy || r.adjustedBy || r.ref) {
    rel = SEC('git-branch', 'ความสัมพันธ์กับรอบอื่น', 'เก็บไว้ที่รอบใหม่ ไม่ได้เขียนค่ากลับลงรอบเดิม', '<div class="factgrid">'
      + (r.ref ? FACT('รอบต้นฉบับที่รอบนี้อ้าง', r.ref, 'บังคับอ้างสำหรับรอบปรับปรุงและรอบกลับรายการ') : '')
      + (r.reversedBy ? FACT('ถูกกลับรายการโดย', r.reversedBy, 'อ่านจากดัชนีความสัมพันธ์ ไม่ใช่จากธงที่เขียนลงรอบนี้') : '')
      + (r.adjustedBy ? FACT('มีรอบปรับปรุงที่อ้างรอบนี้', r.adjustedBy, 'ส่วนต่างเป็นบรรทัดของรอบใหม่ในงวดที่เปิดอยู่') : '')
      + '</div>'
      + ((r.reversedBy || r.adjustedBy) ? '<div style="margin-top:8px"><button class="btn btn-secondary btn-sm" onclick="openRunNo(\'' + (r.reversedBy || r.adjustedBy) + '\')"><i data-lucide="arrow-up-right" class="w-4 h-4"></i>เปิดรอบที่เกี่ยวข้อง</button></div>' : ''));
  }
  var frozenBlock = isClosed(r) ? SEC('fingerprint', 'ชุดข้อมูลที่ถูกตรึงพร้อมค่าตรวจสอบ', 'พิสูจน์ได้ว่าเนื้อหาไม่ถูกแก้',
    '<div class="frozen">' + snapshotOf(r).map(function (s) {
      return '<div class="frz"><div class="fz-k">' + s.n + '</div><div class="fz-v">' + esc(s.hash || '—') + '</div></div>';
    }).join('') + '</div>') : '';
  return SEC('history', 'ไทม์ไลน์ของรอบ', 'บันทึกเพิ่มอย่างเดียว ไม่มีการลบและไม่มีการเขียนทับ', '<div class="timeline">' + items + '</div>') + rel + frozenBlock;
}
</script>
<script>
/* ============================================================
   DRAWERS — สลิปใช้โครงเอกสารมาตรฐาน: รายละเอียด › PDF Preview › ลายเซ็น/อนุมัติ › ประวัติ
   เอกสารแนบเป็น section ในแท็บรายละเอียด ไม่แยกเป็นแท็บของตัวเอง
   drawer header ที่มีแท็บสร้างจาก dwHeader() ตัวเดียว ซึ่งใส่ has-tabs ให้เอง (#38.2)
   ============================================================ */
function amtCell(l, c) {
  if (l.s === 'ok') return money(l.amt, c);
  if (l.s === 'frozen') return '<span class="mask">••••••</span> ' + tipI(FROZEN_TIP, 'e');
  return '<span class="text-mute-2">—</span>';
}
function lineTable(r, c, opt) {
  var ls = runLines(r, c), groups = {}, order = [];
  ls.forEach(function (l) { if (!groups[l.k]) { groups[l.k] = []; order.push(l.k); } groups[l.k].push(l); });
  var rows = order.map(function (k) {
    return '<tr class="grp-h"><td colspan="6">' + esc(k) + '</td></tr>'
      + groups[k].map(function (l) {
        return '<tr><td><span class="cell-main">' + esc(l.n) + '</span><span class="cell-sub">' + (l.man ? 'ปรับด้วยมือ · ' : 'ไล่กลับต้นทาง: ') + esc(l.ref) + '</span></td>'
          + '<td><span class="sr-v">' + esc(l.code) + '</span></td>'
          + '<td class="rt">' + (l.q === '' || l.q == null ? '<span class="text-mute-2">—</span>' : '<span class="tnum">' + l.q + '</span> ' + esc(l.u)) + '</td>'
          + '<td class="rt">' + (l.mult ? '<span class="tnum">×' + l.mult + '</span>' : '<span class="text-mute-2">—</span>') + '</td>'
          + '<td class="rt">' + amtCell(l, c) + '</td>'
          + '<td>' + linePill(l) + (l.why ? ' ' + tipI(l.why, 'e') : '') + '</td></tr>';
      }).join('');
  }).join('');
  return '<div class="mini-wrap"><table class="mini-tbl"><thead><tr>'
    + '<th style="width:280px">รายการ</th><th style="width:110px">รหัสจ่าย</th><th style="width:130px">ปริมาณ</th>'
    + '<th style="width:80px">ตัวคูณ</th><th style="width:130px">จำนวนเงิน</th><th style="width:190px">สถานะบรรทัด</th></tr></thead><tbody>'
    + rows + '</tbody></table></div>';
}

function drawerHTML() {
  var m = state.dw.mode;
  if (m === 'slip') return dwSlip();
  if (m === 'lines') return dwLines();
  if (m === 'blockers') return dwBlockers();
  if (m === 'create') return dwCreate();
  if (m === 'manual') return dwManual();
  if (m === 'denied') return dwDenied();
  return '';
}

/* ---- สลิปเงินเดือน (โครงเอกสารมาตรฐาน 4 แท็บ) ---- */
function dwSlip() {
  var d = state.dw.data, r = runOf(d.run), c = d.emp, s = d.slip;
  var cur = state.dw.tab;
  var tabs = '<div class="tabs">'
    + tabBtn('detail', 'file-text', 'รายละเอียด', cur)
    + tabBtn('pdf', 'file-type-2', 'PDF Preview', cur)
    + tabBtn('sign', 'signature', 'ลายเซ็น / อนุมัติ', cur)

<script>
/* ============================================================
   ตัวช่วยสร้างรอบจ่าย — 4 ขั้น (kit stepper · #47) · ไม่มีตัวช่วยสร้างสลิปทีละใบ (FN-79)

const WSTEPS = ['งวดและชนิดรอบ', 'ขอบเขตของรอบ', 'ตรวจสอบข้อจำกัด', 'ตรวจสอบและยืนยัน'];

      pd: r ? '2026-09' : '', ty: ty || (r ? 'adjust' : 'normal'), ref: refNo || '', scope: (ty === 'reverse' || !refNo) ? 'all' : 'list',
      list: [], sim: false, why: '', busy: false

  if (refNo) showToast('สร้างรอบใหม่ที่อ้างรอบ ' + refNo + ' — รอบต้นฉบับไม่ถูกแก้และไม่ถูกลบ', 'info');
}
function setRunType(v) {

function addScopeEmp(c) { var f = mf(); if (c && f.list.indexOf(c) < 0) f.list.push(c); render(); }

function closedRuns() { return RUNS.filter(function (r) { return r.st === 'closed'; }); }
function createBlockers(f) {
  var out = [];

    if (p.st === 'future') out.push({ t: 'งวดนี้ยังไม่เปิด', s: 'งวดที่ยังไม่ถึงกำหนดเปิดยังสร้างรอบไม่ได้' });

      if (dup) out.push({ t: 'มีรอบปกติของงวดนี้อยู่แล้ว', s: 'รอบ ' + dup.no + ' สถานะ ' + RST[dup.st].n + ' — ถ้าต้องจ่ายเพิ่มให้สร้างรอบนอกรอบแทน', a: "openRunNo('" + dup.no + "')", al: 'เปิดรอบเดิม ' + dup.no });
    }
  }
  if ((f.ty === 'adjust' || f.ty === 'reverse')) {
    if (!f.ref) out.push({ t: 'ยังไม่ได้อ้างรอบต้นฉบับ', s: 'รอบปรับปรุงและรอบกลับรายการบังคับอ้างรอบต้นฉบับที่สถานะปิดรอบแล้วเท่านั้น' });
    else { var rr = runOf(f.ref); if (!rr || rr.st !== 'closed') out.push({ t: 'รอบต้นฉบับต้องเป็นรอบที่ปิดแล้ว', s: 'รอบ ' + f.ref + ' ยังไม่อยู่ในสถานะปิดรอบแล้ว' }); }
  }
  if (f.scope === 'list' && !f.list.length) out.push({ t: 'ยังไม่ได้เลือกรายชื่อ', s: 'ขอบเขตแบบรายชื่อต้องเลือกอย่างน้อยหนึ่งคน' });
  if ((f.ty === 'offcycle' || f.ty === 'adjust' || f.ty === 'reverse') && !f.why.trim()) out.push({ t: 'ยังไม่ได้ระบุเหตุผล', s: 'รอบที่ไม่ใช่รอบปกติต้องระบุเหตุผลเสมอ' });

}

    + '<div class="drawer-body">' + (s === 1 ? cStep1(f) : s === 2 ? cStep2(f) : s === 3 ? cStep3(f) : cStep4(f, bl)) + '</div>'

    + (s < 4 ? '<button class="btn btn-primary" onclick="goStep(' + (s + 1) + ')">ถัดไป<i data-lucide="chevron-right" class="w-4 h-4"></i></button>'
      : '<button class="btn btn-primary ' + (bl.length ? 'is-disabled' : '') + '"' + (bl.length ? ' disabled' : '') + ' onclick="doCreate()">'
      + (f.busy ? '<i data-lucide="loader-2" class="w-4 h-4 spin"></i>กำลังสร้าง…' : '<i data-lucide="check" class="w-4 h-4"></i>สร้างรอบและออกเลขที่') + '</button>')
    + '</div></div>';
  return h;
}
function cStep1(f) {

      + FACT('สถานะงวด', periodOf(f.pd).st === 'open' ? 'เปิดอยู่' : periodOf(f.pd).st === 'closed' ? 'ปิดแล้ว' : 'ยังไม่เปิด', 'การเปิดหรือปิดงวดเป็นอำนาจของ ตั้งค่า HR', periodOf(f.pd).st === 'open' ? '' : 'is-bad')

    + '<div class="dw-sub">' + esc(periodOf(r.pd).n) + ' · บรรทัดที่เพิ่มจะติดป้าย “ปรับด้วยมือ” ถาวรและเห็นแยกในรายงานเทียบรอบก่อน</div></div>'
    + '<div class="dw-acts"><button class="top-icon-btn" onclick="closeDrawer()"><i data-lucide="x" class="w-4 h-4"></i></button></div></div>'
    + '<div class="drawer-body">' + STEPH('plus', 'รายละเอียดรายการ', 'เหตุผลและเอกสารอ้างอิงเป็นช่องบังคับ')
    + '<div class="field"><label class="label">พนักงาน <span class="req">*</span></label>' + searchSelectHTML('memp', { placeholder: 'ค้นชื่อหรือรหัสพนักงานในรอบนี้' }) + '</div>'
    + '<div class="kv"><div class="field"><label class="label">ทิศทาง <span class="req">*</span></label><select class="select" onchange="setMF(\'dir\',this.value)">'
    + '<option value="in"' + (f.dir === 'in' ? ' selected' : '') + '>รายได้</option><option value="de"' + (f.dir === 'de' ? ' selected' : '') + '>รายหัก</option></select></div>'
    + '<div class="field"><label class="label">รหัสจ่าย <span class="req">*</span></label><select class="select" onchange="setMF(\'code\',this.value)">'
    + '<option value="AD-INC"' + (f.code === 'AD-INC' ? ' selected' : '') + '>AD-INC · เงินได้อื่น</option>'
    + '<option value="AD-DED"' + (f.code === 'AD-DED' ? ' selected' : '') + '>AD-DED · เงินหักอื่น</option></select></div></div>'
    + '<div class="field"><label class="label">จำนวนเงิน <span class="req">*</span></label><input class="input" type="number" value="' + esc(f.amt) + '" oninput="state.mf.amt=this.value" placeholder="0.00"></div>'
    + '<div class="field"><label class="label">เหตุผล <span class="req">*</span></label><textarea class="notes-area" rows="2" placeholder="อธิบายเหตุผลที่ต้องปรับด้วยมือ" oninput="state.mf.why=this.value">' + esc(f.why) + '</textarea></div>'
    + '<div class="field"><label class="label">เอกสารอ้างอิง <span class="req">*</span></label><input class="input" type="text" value="' + esc(f.ref) + '" oninput="state.mf.ref=this.value" placeholder="เลขที่บันทึกอนุมัติ"></div>'
    + '</div>'
    + '<div class="drawer-footer"><button class="btn btn-ghost" onclick="closeDrawer()">ยกเลิก</button><span class="footer-spacer"></span>'
    + '<button class="btn btn-primary ' + (ok ? '' : 'is-disabled') + '"' + (ok ? '' : ' disabled') + ' onclick="saveManual()">'
    + (f.busy ? '<i data-lucide="loader-2" class="w-4 h-4 spin"></i>กำลังบันทึก…' : '<i data-lucide="check" class="w-4 h-4"></i>บันทึกรายการ') + '</button></div>';
  return h;
}
</script>
<script>
/* ============================================================
   MODALS (Pattern D) — ส่งอนุมัติ (slot picker) · ไม่อนุมัติ · ยกเลิก · ดึงใหม่ · ปิดรอบ · ไฟล์โอน · ปฏิเสธคำสั่งแก้รอบที่ปิดแล้ว
   ============================================================ */
const REASON_CFG = {
  reject: { ic: 'x-circle', t: 'ไม่อนุมัติรอบจ่าย', btn: 'ยืนยันไม่อนุมัติ', cls: 'btn-danger', ph: 'ระบุเหตุผลที่ไม่อนุมัติ (บังคับ)', req: true, presets: ['ยอดต่างจากรอบก่อนมากผิดปกติและยังไม่มีคำอธิบาย', 'รายการปรับด้วยมือยังไม่มีเอกสารอ้างอิงครบ', 'ขอบเขตของรอบไม่ตรงกับที่ตกลงไว้'] },
  cancel: { ic: 'ban', t: 'ยกเลิกรอบจ่าย', btn: 'ยืนยันยกเลิกรอบ', cls: 'btn-danger', ph: 'ระบุเหตุผลที่ยกเลิก (บังคับ)', req: true, presets: ['สร้างผิดขอบเขตบริษัท', 'สร้างผิดงวด', 'ตัดสินใจรวมเข้ากับรอบปกติแทน'] }
};
function modalHTML() {
  var t = state.modal.type;
  if (t === 'notify') return notifyModal();
  var r = state.modal.data && runOf(state.modal.data.id);
  if (!r) return '';
  if (t === 'submit') return submitModal(r);
  if (t === 'close') return closeModal_(r);
  if (t === 'repull') return repullModal(r);
  if (t === 'bank') return bankModal(r);
  if (t === 'refuse') return refuseModal(r);
  if (REASON_CFG[t]) return reasonModal(t, r);
  return '';
}

/* ---- ส่งอนุมัติ: จำนวนช่อง = จำนวนขั้นที่ระบบคืนมาจริง · ทุกช่องเลือก "คน" (มติ 2026-08-17) ---- */
function submitModal(r) {
  var d = resolveDoa(r), sl = state.modal.data.slots || [], pl = resolvePayload(r);
  d.steps.forEach(function (s, i) {
    COMBOS.push({
      key: 'slot' + i, cfg: {
        options: empOptions(s.cands), value: sl[i] || null,
        onSelect: function (v) { var a = (state.modal.data.slots || []).slice(); a[i] = v; state.modal.data.slots = a; render(); }
      }
    });
  });
  var ready = d.steps.every(function (s, i) { return !!sl[i]; });
  var h = '<div class="modal-header"><div class="modal-header-icon"><i data-lucide="send" class="w-5 h-5"></i></div>'
    + '<div class="min0"><div class="modal-title">ส่งรอบ ' + esc(r.no) + ' เข้าสายอนุมัติ</div>'
    + '<div class="modal-subtitle">' + esc(d.an) + ' · ' + d.steps.length + ' ขั้นที่ระบบคืนมา</div></div></div>';
  h += '<div class="modal-body">'
    + '<div class="chainprev" style="margin-bottom:12px">' + d.steps.map(function (s, i) {
      return (i ? '<span class="cp-ar">›</span>' : '') + '<span class="cp' + (s.key ? ' is-key' : '') + '">' + esc(s.rn) + '</span>';
    }).join('') + '</div>'
    + '<div class="frozen" style="margin-bottom:12px">' + Object.keys(pl).map(function (k) {
      return '<div class="frz"><div class="fz-k">' + k + '</div><div class="fz-v">' + esc(String(pl[k] === null ? 'null' : pl[k])) + '</div></div>';
    }).join('') + '</div>'
    + d.steps.map(function (s, i) {
      return '<div class="slot-row' + (s.key ? ' is-key' : '') + '"><span class="slot-no">' + s.i + '</span><div class="slot-main">'
        + '<div class="slot-role">' + esc(s.rn) + '<span>' + (s.key ? 'ขั้นที่ต้องเห็นตัวเลขจริง' : 'เลือกคนที่รับผิดชอบขั้นนี้') + '</span></div>'
        + '<div class="slot-pick">' + searchSelectHTML('slot' + i, { placeholder: 'ค้นชื่อผู้รับผิดชอบขั้นนี้' })
        + (sl[i] ? '<div style="margin-top:8px">' + empChip(sl[i]) + '</div>' : '') + '</div></div></div>';
    }).join('')
    + '</div>';
  h += '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><div class="footer-spacer"></div>'
    + '<button class="btn btn-primary ' + (ready ? '' : 'is-disabled') + '"' + (ready ? '' : ' disabled') + ' onclick="doSubmit(\'' + r.id + '\')"><i data-lucide="send" class="w-4 h-4"></i>ส่งอนุมัติ</button></div>';
  return h;
}

/* ---- เหตุผลบังคับ ---- */
function reasonModal(t, r) {
  var c = REASON_CFG[t], v = state.modal.data.reason || '';
  var ok = !c.req || v.trim().length > 0;
  return '<div class="modal-header"><div class="modal-header-icon is-danger"><i data-lucide="' + c.ic + '" class="w-5 h-5"></i></div>'
    + '<div class="min0"><div class="modal-title">' + c.t + ' ' + esc(r.no) + '</div>'
    + '<div class="modal-subtitle">' + esc(periodOf(r.pd).n) + ' · ' + RTY[r.ty] + ' · เลขที่รอบจะคงอยู่และไม่ถูกใช้ซ้ำ</div></div></div>'
    + '<div class="modal-body">'
    + '<div class="field"><label class="label">เหตุผล ' + (c.req ? '<span class="req">*</span>' : '') + '</label>'
    + '<textarea class="notes-area" rows="3" placeholder="' + c.ph + '" oninput="state.modal.data.reason=this.value;renderReasonBtn()">' + esc(v) + '</textarea></div>'
    + '<div class="apfiles" style="margin-top:8px">' + c.presets.map(function (p) {
      return '<button class="btn btn-secondary btn-sm" onclick="setReason(' + JSON.stringify(p).replace(/"/g, '&quot;') + ')">' + esc(p) + '</button>';
    }).join('') + '</div></div>'
    + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ปิด</button><div class="footer-spacer"></div>'
    + '<button class="btn ' + c.cls + ' ' + (ok ? '' : 'is-disabled') + '" id="rs-ok"' + (ok ? '' : ' disabled') + ' onclick="doReason(\'' + t + '\',\'' + r.id + '\')"><i data-lucide="' + c.ic + '" class="w-4 h-4"></i>' + c.btn + '</button></div>';
}
function setReason(p) { state.modal.data.reason = p; render(); }
function renderReasonBtn() {
  var b = document.getElementById('rs-ok'); if (!b) return;
  var ok = (state.modal.data.reason || '').trim().length > 0;
  b.disabled = !ok; b.classList.toggle('is-disabled', !ok);
}

/* ---- ปิดรอบ ---- */
function closeModal_(r) {
  var st = runStats(r), slips = runEmps(r).length;
  return '<div class="modal-header"><div class="modal-header-icon"><i data-lucide="lock" class="w-5 h-5"></i></div>'
    + '<div class="min0"><div class="modal-title">ปิดรอบ ' + esc(r.no) + '</div>'
    + '<div class="modal-subtitle">' + esc(periodOf(r.pd).n) + ' · ' + slips + ' คน · การปิดรอบทำครบในธุรกรรมเดียว</div></div></div>'
    + '<div class="modal-body">'
    + GATE('is-warn', 'lock', 'หลังปิดรอบจะไม่มีทางแก้รอบนี้อีกเลย', 'ไม่มีการคำนวณใหม่ ไม่มีการดึงใหม่ ไม่มีการแก้บรรทัด ไม่มีการยกเลิก และไม่มีการลบ — การแก้ทุกชนิดต้องทำเป็นรอบใหม่ที่อ้างรอบนี้')
    + '<div class="rc-grid" style="margin-top:12px">'
    + '<div class="rc-row"><span class="k">ออกเลขที่สลิป</span><span class="v">' + slips + ' ฉบับพร้อมกัน</span></div>'
    + '<div class="rc-row"><span class="k">สร้างและเก็บสำเนาเอกสาร</span><span class="v">' + slips + ' ไฟล์</span></div>'
    + '<div class="rc-row"><span class="k">ตรึงชุดข้อมูลพร้อมค่าตรวจสอบ</span><span class="v">6 ต้นทาง</span></div>'
    + '<div class="rc-row"><span class="k">บรรทัดที่ยังคำนวณไม่ได้</span><span class="v">' + int(st.un) + '</span></div>'
    + '</div></div>'
    + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><div class="footer-spacer"></div>'
    + '<button class="btn btn-primary" onclick="doClose(\'' + r.id + '\')"><i data-lucide="lock" class="w-4 h-4"></i>ปิดรอบและออกเลขสลิป</button></div>';
}
/* ---- ดึงข้อมูลใหม่ ---- */
function repullModal(r) {
  return '<div class="modal-header"><div class="modal-header-icon is-warning"><i data-lucide="refresh-cw" class="w-5 h-5"></i></div>'
    + '<div class="min0"><div class="modal-title">ดึงข้อมูลใหม่สำหรับรอบ ' + esc(r.no) + '</div>'
    + '<div class="modal-subtitle">ชุดข้อมูลเดิมจะยังอยู่ในประวัติและถูกทำเครื่องหมายว่ามีชุดใหม่แทน</div></div></div>'
    + '<div class="modal-body">' + GATE('is-warn', 'triangle-alert', 'ผลการคำนวณเดิมจะถูกล้างทิ้งทั้งหมด', 'รอบจะถอยกลับไปสถานะดึงข้อมูลแล้ว และต้องคำนวณใหม่ก่อนจึงจะเดินต่อได้') + '</div>'
    + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><div class="footer-spacer"></div>'
    + '<button class="btn btn-primary" onclick="doRepull(\'' + r.id + '\')"><i data-lucide="refresh-cw" class="w-4 h-4"></i>ยืนยันดึงใหม่</button></div>';
}
/* ---- ไฟล์โอนธนาคาร ---- */
function bankModal(r) {
  var nb = noBankList(r), n = runEmps(r).length - nb.length;
  return '<div class="modal-header"><div class="modal-header-icon"><i data-lucide="landmark" class="w-5 h-5"></i></div>'
    + '<div class="min0"><div class="modal-title">ออกไฟล์โอนธนาคารของรอบ ' + esc(r.no) + '</div>'
    + '<div class="modal-subtitle">' + n + ' รายการในไฟล์ · ' + nb.length + ' คนต้องจ่ายด้วยวิธีอื่น</div></div></div>'
    + '<div class="modal-body">'
    + '<div class="field"><label class="label">รูปแบบไฟล์ <span class="req">*</span> ' + tipI('รูปแบบของแต่ละธนาคารเป็นค่าที่ ตั้งค่า HR ยังไม่เผยแพร่ จึงเหลือรูปแบบกลางไว้ก่อน') + '</label>'
    + '<select class="select">' + BANKS.map(function (b) { return '<option value="' + b.c + '">' + b.n + '</option>'; }).join('') + '</select></div>'
    + (nb.length ? GATE('is-warn', 'user-x', 'ต้องจ่ายด้วยวิธีอื่น ' + nb.length + ' คน', nb.map(nameOf).join(' · ') + ' — ยังไม่มีเลขบัญชีธนาคารในทะเบียนพนักงาน', cfgLink("openEmpMaster('')", 'จัดการที่ ทะเบียนพนักงาน')) : '')
    + GATE('', 'shield', 'การดาวน์โหลดจะถูกบันทึกเป็นร่องรอยด้านความปลอดภัย', 'ไฟล์นี้มีทั้งเลขบัญชีและจำนวนเงินรายคน และออกนอกขอบเขตที่ระบบคุมได้ทันทีที่ดาวน์โหลด')
    + '</div>'
    + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><div class="footer-spacer"></div>'
    + '<button class="btn btn-primary" onclick="doBank(\'' + r.id + '\')"><i data-lucide="file-down" class="w-4 h-4"></i>ออกไฟล์และดาวน์โหลด</button></div>';
}
/* ---- ปฏิเสธคำสั่งที่ชี้มาที่รอบที่ปิดแล้ว (S-39 · FN-55) ---- */
function refuseModal(r) {
  var cmds = ['คำนวณใหม่', 'ดึงข้อมูลใหม่', 'แก้บรรทัดของรอบ', 'เพิ่มรายการปรับด้วยมือ', 'ยกเลิกรอบ', 'ลบรอบ'];
  return '<div class="modal-header"><div class="modal-header-icon is-danger"><i data-lucide="shield-x" class="w-5 h-5"></i></div>'
    + '<div class="min0"><div class="modal-title">รอบ ' + esc(r.no) + ' ปิดแล้ว แก้ไม่ได้</div>'
    + '<div class="modal-subtitle">ไม่มีเส้นทางออกจากสถานะปิดรอบแล้วในเครื่องสถานะ ไม่ใช่แค่ซ่อนปุ่ม</div></div></div>'
    + '<div class="modal-body">'
    + '<div class="mini-wrap"><table class="mini-tbl"><thead><tr><th style="width:220px">คำสั่งที่ลองสั่ง</th><th style="width:120px">ผล</th><th style="width:300px">ทางที่ถูก</th></tr></thead><tbody>'
    + cmds.map(function (c) {
      return '<tr><td>' + c + '</td><td><span class="pill pill-danger">ปฏิเสธ</span></td>'
        + '<td>' + (c === 'ลบรอบ' ? 'ไม่มีการลบในระบบนี้ — ทุกอย่างเก็บแบบเพิ่มอย่างเดียว' : 'สร้างรอบปรับปรุงหรือรอบกลับรายการที่อ้างรอบนี้') + '</td></tr>';
    }).join('') + '</tbody></table></div>'
    + GATE('is-bad', 'lock', 'ตัวเลขไม่ขยับแม้ต้นทางเปลี่ยน', 'เหตุการณ์จากต้นทางที่มาถึงหลังรอบปิดจะไปอยู่ในคิว “ต้องพิจารณารอบปรับปรุง” ไม่แตะตัวเลขของรอบนี้',
      '<button class="btn btn-secondary btn-sm" onclick="closeModal();goTab(\'queue\')"><i data-lucide="inbox" class="w-4 h-4"></i>เปิดคิวรอบปรับปรุง</button>')
    + '</div>'
    + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ปิด</button><div class="footer-spacer"></div>'
    + (P().make ? '<button class="btn btn-secondary" onclick="closeModal();openCreate(\'' + r.no + '\',\'adjust\')"><i data-lucide="git-branch" class="w-4 h-4"></i>สร้างรอบปรับปรุง</button>'
      + '<button class="btn btn-primary" onclick="closeModal();openCreate(\'' + r.no + '\',\'reverse\')"><i data-lucide="undo-2" class="w-4 h-4"></i>สร้างรอบกลับรายการ</button>' : '')
    + '</div>';
}

/* ---- บันทึกการแจ้งเตือนและร่องรอยผลลัพธ์ ---- */
function notifyModal() {
  var t = state.modal.data.tab || 'ntf';
  var tabs = '<div class="tabs" style="margin:0 0 12px">'
    + '<button class="tab ' + (t === 'ntf' ? 'is-active' : '') + '" onclick="state.modal.data.tab=\'ntf\';render()"><i data-lucide="bell" class="w-4 h-4"></i>การแจ้งเตือน<span class="tab-badge">' + NTF_LOG.length + '</span></button>'
    + '<button class="tab ' + (t === 'csq' ? 'is-active' : '') + '" onclick="state.modal.data.tab=\'csq\';render()"><i data-lucide="activity" class="w-4 h-4"></i>ร่องรอยผลลัพธ์<span class="tab-badge">' + CSQ_LOG.length + '</span></button>'
    + '<button class="tab ' + (t === 'def' ? 'is-active' : '') + '" onclick="state.modal.data.tab=\'def\';render()"><i data-lucide="list" class="w-4 h-4"></i>รายการที่ประกาศไว้</button>'
    + '</div>';
  var body;
  if (t === 'ntf') body = NTF_LOG.length ? NTF_LOG.map(function (x) {
    return '<div class="signstep"><span class="slot-no"><i data-lucide="bell" class="w-3 h-3"></i></span><div style="min-width:0">'
      + '<div class="slot-role">' + esc(x.n) + '<span>' + esc(x.to) + '</span></div><div class="ss-c">' + esc(x.ctx) + '</div></div>'
      + '<div style="text-align:right"><span class="sr-v">' + esc(x.ev) + '</span><div class="ss-c">' + dtt(x.at) + '</div></div></div>';
  }).join('') : '<span class="text-mute-2">ยังไม่มีการแจ้งเตือน</span>';
  else if (t === 'csq') body = CSQ_LOG.length ? CSQ_LOG.map(function (x) {
    return '<div class="signstep"><span class="slot-no"><i data-lucide="activity" class="w-3 h-3"></i></span><div style="min-width:0">'
      + '<div class="slot-role">' + esc(x.ev) + '<span>ท่อ ' + esc(x.pipe) + '</span></div><div class="ss-c">' + esc(x.ctx) + '</div></div>'
      + '<div style="text-align:right"><div class="ss-c">' + dtt(x.at) + '</div></div></div>';
  }).join('') : '<span class="text-mute-2">ยังไม่มีร่องรอย</span>';
