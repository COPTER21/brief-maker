# unattended — AI-DEFAULT ทุกหมวด รอลูกค้ายืนยัน
# J008 · FM-SAL-07 สรุปข้อมูลประเมินความพึงพอใจลูกค้า กลุ่ม MT (รายงานสรุปคะแนนรายช่องทาง ต่อครั้ง)

# G1 ผลต่อระบบ — ไม่เปลี่ยนค่า ไม่ส่งต่อ · คะแนนจากแบบประเมินลูกค้า MT ยังไม่ผูกระบบ → ผู้ใช้กรอกคะแนนเอง
config_changes: []
post_to: []

# G2 สายอนุมัติ — กระดาษไม่มีช่องลงชื่อผู้อนุมัติ (มีแค่ "ผู้สรุปการประเมิณ" Sales Manager) → ไม่มีการอนุมัติ · บันทึกยืนยันสรุป = ปิดรายงาน
doa: { required: false, mode: none, default_steps: [], requester_role: "role-mgr-sales", amount: none }

# G3 สูตร / ค่าคงที่
calc:
  constants_from_config: true
  auto_compute: true
  over_limit: warn
  rules:
    - "คะแนนรายช่องทางต่อหัวข้อเป็นจำนวนเต็ม 1 ถึงคะแนนเต็มของหัวข้อ (5) — นอกช่วง/ทศนิยม/ติดลบ = บล็อก"
    - "ช่องทางที่ไม่ได้ประเมินรอบนี้ = เว้นว่างทั้งคอลัมน์ (ไม่นับในภาพรวม · % แสดง —) · กรอกบางหัวข้อของช่องทาง = บล็อกตอนยืนยันสรุป"
    - "รวมคะแนนต่อช่องทาง = SUM ทุกหัวข้อ (ต้นฉบับไม่มีสูตร D12:R12) · รวมคะแนนเต็ม = SUM คะแนนเต็มทุกหัวข้อ (45)"
    - "% ต่อช่องทาง = รวมคะแนน ÷ รวมคะแนนเต็ม × 100 (ตามสูตรต้นฉบับ =D12/C12) · แสดงทศนิยม 2 ตำแหน่ง · จัดกลุ่มจากค่าที่ยังไม่ปัด"
    - "สถานะ: % ≥ 95 ผ่านมาตรฐาน (เขียว) · 80 ≤ % < 95 ต่ำกว่ามาตรฐาน (เหลือง) · % < 80 ค่อนข้างต่ำกว่ามาตรฐาน (แดง) — เกณฑ์อ่านจาก SalesConfig (mt_csat_standard_pct=95 · mt_csat_low_pct=80) แทนการระบายสีตายตัว"
    - "ภาพรวมโดยสรุป: รายชื่อช่องทางต่อกลุ่มสร้างอัตโนมัติจากสถานะ (แก้ไม่ได้) · ข้อความแนะนำต่อกลุ่มค่าเริ่มจาก config แก้ได้"
    - "หัวข้อประเมิน 9 ข้อ · คะแนนเต็ม · รายชื่อช่องทาง 15 คอลัมน์ อ่านจาก config ณ วันสร้างใบ (snapshot ในใบ) — ผู้ใช้ไม่เพิ่ม/ลบหัวข้อหรือช่องทาง"
    - "ยืนยันสรุปได้เมื่อมีช่องทางที่ประเมินครบทุกหัวข้อ ≥ 1 ช่องทาง และข้อเสนอแนะ ≥ 1 ข้อ"
    - "เอกสารประเมิน วันที่ ต้อง ≤ สรุปข้อมูล วันที่ (ขัดกัน = บล็อก) · ครั้งที่ซ้ำกับใบอื่นที่ยังไม่ยกเลิกในปีเดียวกัน (ปีของ เอกสารประเมิน วันที่) = เตือน"

# G4 รายการซ้ำ — หัวข้อ 9 แถวและช่องทาง 15 คอลัมน์คงที่ตาม config (กระดาษกำหนดชัด) · ข้อเสนอแนะไม่จำกัด PDF ขั้นต่ำ 4 บรรทัด
repeat: { max_rows: null }

# G5 ช่องตามกระดาษ — 1:1 แก้แค่คำสะกด (ประเมิณ→ประเมิน · ลุกค้า→ลูกค้า)
fidelity: { one_to_one: true, add_fields: [], merge_split: [] }

# G6 ลายเซ็น — ไม่มีขั้น DOA · บล็อกผู้สรุปแสดงชื่อ+ตำแหน่ง+ข้อความ "ยืนยันสรุปในระบบ วันที่ เวลา" ไม่ใช้ภาพ
signature: { layout: row-bottom, per_doa_step: false, handwriting_image: false }

# G7 ไม่อนุมัติ / ยกเลิก — ไม่มีอนุมัติ · ยกเลิกได้โดยเจ้าของ + Sales admin สถานะร่าง/สรุปแล้ว ต้องมีเหตุผล · แก้หลังสรุปไม่ได้ (ยกเลิกแล้วทำใบใหม่)
reject_cancel: { on_reject: back_to_draft, cancel_by: [owner, admin_role], cancel_states: [draft, final], reason_required: true }

# G8 การมองเห็น — เจ้าของ · Sales admin เห็นทั้งหมด
visibility: { owner: true, approver: none, admin_role: all, admin_role_name: "ผู้ดูแลเอกสารฝ่ายขาย (Sales admin)" }

# G9 เลขที่ — เอกสารภายใน ออกตอนบันทึกครั้งแรก · รหัส MTS (MT Satisfaction Summary) — CSR ไม่ใช้เพราะซ้ำความหมาย CSR · SES กันไว้ให้ J007
numbering: { issue_on: first_save, code: MTS }

# G10 ของเสริม
extras: { attachments: true, copy: false, export_csv: true, announce: false }

extend: {}
fit: {}
