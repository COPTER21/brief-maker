function go(r){ S.route = r; if (location.href.indexOf('about:') !== 0) { try { navigate(r); } catch (e) { /* host ไม่รองรับ hash */ } } }
function applyRoute(){
  const r = getRoute(); if (r === S.route) return; S.route = r;
  const p = r.split('/'); if (p[0] !== BASE) return;
  if (p[1] === 'view' && findR(p[2]) && canSee(findR(p[2]))) { if (!S.dw || S.dw.id !== p[2]) showDrawer({ kind:'view', id:p[2], tab:'detail' }, true); }
  else if (p[1] === 'create') { if (!S.dw || S.dw.kind !== 'wiz') startWizard(null, true); }
  else if (p[1] === 'edit' && findR(p[2])) { if (!S.dw || S.dw.kind !== 'wiz') startWizard(p[2], true); }
  else if (S.dw) closeDrawer(true, true);
}

/* =====================================================================
   PAGE — list (no-scorecard #115 · 1 cell = 1 บรรทัด · kebab ⋮)
   ===================================================================== */
function sortTh(col, label, cls){
  const s = S.list.sort, on = s.col === col;
  return `<th class="is-sortable ${on ? 'is-sorted' : ''} ${cls || ''}" onclick="sortBy('${col}')">${label}<i data-lucide="${on ? (s.dir === 'asc' ? 'chevron-up' : 'chevron-down') : 'chevrons-up-down'}" class="w-3 h-3 sort-ic"></i></th>`;
}
function pager(total){
  const ps = S.list.ps, pages = Math.max(1, Math.ceil(total / ps)), p = Math.min(S.list.page, pages);
  const from = total ? (p - 1) * ps + 1 : 0, to = Math.min(total, p * ps);
  let b = `<button class="pg-btn ${p === 1 ? 'is-disabled' : ''}" ${p === 1 ? 'disabled' : ''} onclick="goPage(${p - 1})"><i data-lucide="chevron-left" class="w-3 h-3"></i></button>`;
  for (let i = 1; i <= pages; i++) b += `<button class="pg-btn ${i === p ? 'is-active' : ''}" onclick="goPage(${i})">${i}</button>`;
  b += `<button class="pg-btn ${p === pages ? 'is-disabled' : ''}" ${p === pages ? 'disabled' : ''} onclick="goPage(${p + 1})"><i data-lucide="chevron-right" class="w-3 h-3"></i></button>`;
  return `<div class="table-footer table-foot"><label class="pg-size">แสดงต่อหน้า <select name="ps" onchange="setPs(this.value)">${[10, 25, 50].map(n => `<option value="${n}" ${n === ps ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
    <span class="tf-mid num">${from} – ${to} จาก ${total} รายการ</span><div class="pagination">${b}</div></div>`;
}
function renderPage(){
  const mine = RECS.filter(canSee), rows = listRows(), ps = S.list.ps;
  const pages = Math.max(1, Math.ceil(rows.length / ps)); if (S.list.page > pages) S.list.page = pages;
  const pageRows = rows.slice((S.list.page - 1) * ps, S.list.page * ps);
  const nDraft = mine.filter(r => r.status === 'draft').length;
  const filtered = S.list.q || S.list.st !== 'all' || S.list.year;
  const body = pageRows.length ? pageRows.map(r => { const g = groupsOf(r.scores), n = nDone(r.scores); return `<tr class="is-clickable" onclick="rowClick(event, '${r.id}')">
      <td class="nw"><span class="code-strong">${r.code}</span></td>
      <td class="num r nw">${r.round}</td>
      <td class="nw">${fmtDate(r.assessDate)}</td>
      <td class="nw">${esc(empOf(r.emp).name)}</td>
      <td class="num r nw">${n}/${CFG.channels.length}</td>
      <td class="num r nw">${g.pass.length}</td>
      <td class="num r nw">${g.below.length}</td>
      <td class="num r nw">${g.far.length ? `<span class="is-bad-num">${g.far.length}</span>` : '0'}</td>
      <td class="nw">${docPill(r.status)}</td>
      <td class="nw">${renderSignProgress(r)}</td>
      <td class="row-actions-cell"><button class="ra-btn" title="เพิ่มเติม" onclick="openRowMenu('${r.id}', this)"><i data-lucide="more-vertical" class="w-4 h-4"></i></button></td>
    </tr>`; }).join('')
    : `<tr><td colspan="11">${filtered ? emptyStateHTML({ icon:'search-x', title:'ไม่พบรายการที่ค้นหา', desc:'ลองปรับคำค้นหรือรีเซ็ตตัวกรอง', actionLabel:'รีเซ็ต', actionIcon:'x', onAction:'resetFilters()' })
        : emptyStateHTML({ icon:'inbox', title:'ไม่มีข้อมูล', desc:'สร้างสรุปผลประเมินความพึงพอใจลูกค้า MT ครั้งแรก', actionLabel:'สร้างสรุปผล', actionIcon:'plus', onAction:'startWizard()' })}</td></tr>`;
  const chips = `<span class="ph-badge num">${mine.length} รายการ</span>${nDraft ? `<span class="ph-badge num">ร่าง ${nDraft}</span>` : ''}`;
  return `<div class="page-fill">
    <div class="ph"><div>
        <div class="ph-title-row"><h1 class="ph-title">${DOC_NAME}</h1></div>
        <p class="ph-sub">สรุปคะแนนความพึงพอใจรายช่องทาง ${CFG.group} ต่อครั้ง · FM-SAL-07 ${chips}</p></div>
      <div class="ph-actions">
        <button class="btn btn-secondary" onclick="exportCSV()"><i data-lucide="download" class="w-4 h-4"></i><span>ส่งออก CSV</span></button>
        <button class="btn btn-primary" id="btnCreate" onclick="startWizard()" ${DOC.active ? '' : 'disabled'}><i data-lucide="plus" class="w-4 h-4"></i><span>สร้างสรุปผล</span></button>
      </div></div>
    ${DOC.active ? '' : '<div class="alert-row is-danger"><i data-lucide="lock" class="w-4 h-4"></i><div>แบบเอกสารนี้ยังไม่เปิดใช้งาน — สร้างใหม่ไม่ได้</div></div>'}
    <div class="card list-card">
      <div class="filter-bar">
        <div class="input-search"><i data-lucide="search" class="lead-icon w-4 h-4"></i><input class="input" id="fq" name="fq" placeholder="ค้นหาเลขที่ / ผู้สรุป / ครั้งที่" value="${esc(S.list.q)}" oninput="onQ(this.value)"></div>
        <div class="fb-field">${searchSelectHTML('fst', { placeholder:'ทุกสถานะ' })}</div>
        <div class="fb-field">${searchSelectHTML('fyr', { placeholder:'ทุกปี' })}</div>
        <div class="fb-spacer"></div>
        <button class="btn btn-ghost btn-sm" onclick="resetFilters()"><i data-lucide="x" class="w-4 h-4"></i><span>รีเซ็ต</span></button>
      </div>
      <div class="table-wrap"><table class="table"><thead><tr>
        ${sortTh('code', 'เลขที่')}${sortTh('round', 'ครั้งที่', 'r')}${sortTh('assess', 'เอกสารประเมิน วันที่')}${sortTh('emp', 'ผู้สรุป')}<th class="r">ช่องทางที่ประเมิน</th><th class="r">ผ่านมาตรฐาน</th><th class="r">ต่ำกว่ามาตรฐาน</th><th class="r">ต่ำกว่า ${CFG.low}%</th><th>สถานะเอกสาร</th><th>ลายเซ็น</th><th class="th-act"></th>
      </tr></thead><tbody>${body}</tbody></table></div>
      ${pager(rows.length)}
    </div></div>`;
}

/* ---------- row menu (⋮) — G10 ทำซ้ำ ✗ ---------- */
function openRowMenu(id, btn){
  closeRowMenu();
  const r = findR(id), items = [['eye', 'ดูรายละเอียด', `openView('${id}')`], ['printer', 'พิมพ์', `genPdf('${id}', true)`]];
  if (isOwner(r) && r.status === 'draft') items.splice(1, 0, ['pencil', 'แก้ไข', `startWizard('${id}')`]);
  if (canCancel(r)) items.push(['x-circle', 'ยกเลิกเอกสาร', `openCancel('${id}')`, 1]);
  const m = document.createElement('div'); m.className = 'row-menu';
  m.innerHTML = items.map(x => `<button type="button" class="rm-item ${x[3] ? 'is-danger' : ''}" onclick="closeRowMenu(); ${x[2]}"><i data-rmic="${x[0]}" class="w-4 h-4"></i><span>${x[1]}</span></button>`).join('');
  document.getElementById('overlay-root').appendChild(m);
  const b = btn.getBoundingClientRect(), h = items.length * 36 + 8, below = window.innerHeight - b.bottom > h + 8;
  m.style.setProperty('--top', (below ? b.bottom + 4 : b.top - h - 4) + 'px'); m.style.setProperty('--left', Math.max(8, b.right - 180) + 'px');
  if (window.lucide && typeof window.lucide.createIcons === 'function'){ window.lucide.createIcons({ nameAttr:'data-rmic' }); m.querySelectorAll('svg[data-rmic]').forEach(x => x.removeAttribute('data-rmic')); }
}
function closeRowMenu(){ const m = document.querySelector('.row-menu'); if (m) m.remove(); }
function rowClick(ev, id){ if (ev.target.closest('.row-actions-cell')) return; openView(id); }
document.addEventListener('click', e => { if (!e.target.closest('.row-menu') && !e.target.closest('.row-actions-cell')) closeRowMenu(); });
window.addEventListener('scroll', closeRowMenu, true);

/* =====================================================================
   VIEW DRAWER — รายละเอียด › PDF Preview › ลายเซ็น / อนุมัติ › ประวัติ
   ===================================================================== */
function tabBtn(key, label, icon, count){ return `<button class="drawer-tab ${S.dw.tab === key ? 'is-active' : ''}" onclick="setTab('${key}')"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i> ${label}${count != null ? `<span class="dt-count num">${count}</span>` : ''}</button>`; }
function kv(label, val){ return `<div class="lbl">${label}</div><div class="val">${val}</div>`; }
const SEC = (icon, title, body, extra) => `<div class="drawer-section"><div class="drawer-section-title"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i>${title}${extra || ''}</div>${body}</div>`;
const emptyMini = t => `<div class="empty-mini"><i data-lucide="inbox" class="w-5 h-5"></i><span>${t}</span></div>`;
/* ตารางคะแนน 9 หัวข้อ × ช่องทาง (อ่านอย่างเดียว) — แถวรวม · % · ผลเทียบมาตรฐาน */
function matrixView(scores){
  const cs = allCalc(scores);
  return `<div class="mx-wrap"><table class="mx-tbl"><thead><tr><th class="mx-topic">หัวข้อประเมิน</th><th class="mx-max">คะแนน (1-5)</th>${CFG.channels.map(c => `<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>
    ${CFG.criteria.map((c, i) => `<tr><td class="mx-topic">${esc(c.text)}</td><td class="num">${c.max}</td>${scores[i].map(v => `<td class="num">${v === '' ? '<span class="cell-mute">—</span>' : esc(v)}</td>`).join('')}</tr>`).join('')}
    <tr class="mx-sum"><td class="mx-topic">รวม</td><td class="num">${maxTotal()}</td>${cs.map(c => `<td class="num">${c.total == null ? '' : c.total}</td>`).join('')}</tr>
    <tr class="mx-sum"><td class="mx-topic">%</td><td class="num">100%</td>${cs.map(c => `<td class="num ${c.band ? BAND_CLS[c.band] : ''}">${c.pct == null ? '—' : pctTxt(c.pct) + '%'}</td>`).join('')}</tr></tbody></table></div>
    <div class="mx-legend">มาตรฐานที่กำหนด <b class="num">${CFG.std}%</b>${CFG.bands.map(b => `<span class="lg-i"><span class="lg-dot ${BAND_CLS[b.key]}"></span>${b.label}</span>`).join('')}</div>`;
}
function groupsView(r){
  const g = groupsOf(r.scores);
  return CFG.bands.map(b => `<div class="grp ${b.key === 'far' ? 'is-alert' : ''}"><div class="grp-h">${bandPill(b.key)}<span>${esc(groupLabel(b.key))}</span></div>
    <div class="grp-ch">${g[b.key].length ? esc(g[b.key].join(', ')) : '<span class="cell-mute">—</span>'}</div><div class="grp-txt">${esc(r.notes[b.key] || '')}</div></div>`).join('');
}
function recsView(list){
  const xs = list.filter(t => t.trim());
  return xs.length ? `<ol class="rec-ol">${xs.map(t => `<li>${esc(t)}</li>`).join('')}</ol>` : emptyMini('ยังไม่มีข้อเสนอแนะ');
}
function fileRow(x){ return `<div class="file-row"><div class="file-ic"><i data-lucide="file" class="w-4 h-4"></i></div><div class="file-name">${esc(x.name)}</div><span class="file-size">${x.size}</span></div>`; }
function viewBanner(r){
  if (r.status === 'cancelled'){ const a = r.audit.filter(x => x.act === 'ยกเลิกเอกสาร').pop(); return `<div class="alert-row is-danger"><i data-lucide="x-circle" class="w-4 h-4"></i><div>ยกเลิกแล้ว — ${esc(a ? a.note : '')}</div></div>`; }
  if (r.status === 'draft') return `<div class="alert-row"><i data-lucide="pencil" class="w-4 h-4"></i><div>ยังเป็นร่าง — ยืนยันสรุปเมื่อกรอกคะแนนครบ (ยืนยันแล้วแก้ไขไม่ได้)</div></div>`;
  const g = groupsOf(r.scores);
  return g.far.length ? `<div class="alert-row is-danger"><i data-lucide="alert-triangle" class="w-4 h-4"></i><div>มี ${g.far.length} ช่องทางต่ำกว่า ${CFG.low}% — แจ้งหัวหน้าหน่วยธุรกิจแล้ว</div></div>` : '';
}
function renderDetailTab(r){
  return viewBanner(r)
    + SEC('info', 'ข้อมูลเอกสาร', `<div class="drawer-fields">${kv('เลขที่เอกสาร', `<span class="code-strong">${r.code}</span>`)}${kv('ครั้งที่', `<span class="num">${r.round}</span>`)}${kv('สถานะเอกสาร', docPill(r.status))}${kv('ผู้สรุปการประเมิน', empChip(r.emp, r.pos))}${kv('เอกสารประเมิน วันที่', fmtDate(r.assessDate))}${kv('สรุปข้อมูล วันที่', r.summaryDate ? fmtDate(r.summaryDate) : '—')}</div>`)
    + SEC('table-2', `คะแนนรายช่องทาง (${nDone(r.scores)}/${CFG.channels.length} ช่องทาง)`, matrixView(r.scores))
    + SEC('list-checks', 'ภาพรวมโดยสรุป', groupsView(r))
    + SEC('lightbulb', 'ข้อเสนอแนะ', recsView(r.recs))
    + SEC('paperclip', `เอกสารแนบ (${r.attachments.length} ไฟล์ · Document Center)`, r.attachments.length ? r.attachments.map(fileRow).join('') : '<div class="tl-body">ไม่มีเอกสารแนบ</div>')
    + SEC('database', 'ข้อมูลระบบ', `<div class="drawer-fields">${kv('สร้างโดย', esc(r.createdBy) + ' · ' + fmtDateTime(r.createdAt))}${kv('แก้ไขล่าสุด', esc(r.updatedBy) + ' · ' + fmtDateTime(r.updatedAt))}</div>`);
}

ng:24px 0; }\n  .doc-page{\n    width:var(--page-w); min-height:var(--page-h);\n    margin:0 auto 24px; padding:var(--page-margin);\n    background:#fff; box-shadow:0 4px 24px rgba(11,29,58,.18);\n  }\n}\n@media print{\n  .doc-page{ width:auto; min-height:var(--content-h); padding:0; box-shadow:none; }\n}\n\n/* ============================================================\n   1. HEADER — thin rule, lighter type\n   ============================================================ */\n.doc-head{\n  display:flex; justify-content:space-between; align-items:flex-start;\n  gap:12mm; padding-top:1.5mm; padding-bottom:6px; border-bottom:1.5px solid var(--c-navy);\n}\n.doc-head__brand{ display:flex; gap:9px; align-items:flex-start; }\n.doc-logo{ width:46px; height:46px; flex:0 0 auto; border-radius:7px; object-fit:contain; }\n.doc-logo--ph{\n  display:flex; align-items:center; justify-content:center;\n  background:linear-gradient(135deg,var(--c-navy),var(--c-teal));\n  color:#fff; font-weight:700; font-size:15pt; letter-spacing:.03em;\n}\n.doc-org__name{ font-size:11.5pt; font-weight:700; color:var(--c-navy); line-height:1.5; }\n.doc-org__line{ font-size:7.8pt; color:var(--c-mute); line-height:1.35; }\n.doc-org__tax{ font-size:7.8pt; color:var(--c-mute-2); margin-top:1px; }\n\n.doc-head__title{ text-align:right; flex:0 0 auto; min-width:54mm; }\n.doc-title{ font-size:15pt; font-weight:700; color:var(--c-navy); line-height:1.45; }\n.doc-title__en{ font-size:7.5pt; font-weight:500; color:var(--c-mute-2); letter-spacing:.08em; text-transform:uppercase; }\n.doc-copy{ display:inline-block; margin-top:3px; padding:0 8px; border:1px solid var(--c-line);\n  border-radius:999px; font-size:7pt; font-weight:500; color:var(--c-mute); }\n\n/* ============================================================\n   2. META STRIP\n   ============================================================ */\n.doc-meta{ display:flex; flex-wrap:wrap; gap:0 22px; margin-top:7px; font-size:8.3pt; }\n.doc-meta__item{  content:\"·\"; margin:0 5px; color:var(--c-mute-3); }\n.items tr{ break-inside:avoid; }\n.items thead{ display:table-header-group; }\n\n/* ============================================================\n   5. TOTALS — rules instead of heavy fill\n   ============================================================ */\n.foot-grid{ display:flex; gap:5mm; margin-top:8px; align-items:flex-start; }\n.foot-left{ flex:1; }\n.totals{ flex:0 0 60mm; }\n.totals__row{ display:flex; justify-content:space-between; gap:10px; padding:2.5px 8px; font-size:8.6pt; }\n.totals__row .k{ color:var(--c-mute); }\n.totals__row .v{ font-weight:600; font-variant-numeric:tabular-nums; }\n.totals__row--rule{ border-top:1px solid var(--c-line-2); }\n.totals__grand{\n  margin-top:4px; padding:6px 10px; border-radius:6px; background:var(--c-navy);\n  display:flex; justify-content:space-between; align-items:baseline;\n}\n.totals__grand .k{ font-size:8.8pt; font-weight:600; color:#fff; }\n.totals__grand .v{ font-size:11.5pt; font-weight:700; color:#fff; font-variant-numeric:tabular-nums; }\n/* amount-in-words — full width, larger, clear */\n.baht-text{ margin-top:7px; padding:6px 11px; border:1px dashed var(--c-line);\n  border-radius:6px; display:flex; justify-content:space-between; align-items:baseline; gap:12px; }\n.baht-text__k{ font-size:8pt; color:var(--c-mute-2); white-space:nowrap; }\n.baht-text b{ font-size:9.6pt; color:var(--c-navy); font-weight:700; text-align:right; }\n\n/* ============================================================\n   6. NOTES / TERMS\n   ============================================================ */\n.notes{ border:1px solid var(--c-line-2); border-radius:6px; padding:6px 9px;\n  font-size:8pt; color:var(--c-mute); }\n.notes__title{ font-size:7.2pt; font-weight:600; color:var(--c-mute-2);\n  text-transform:uppercase; letter-spacing:.05em; margin-bottom:3px; }\n.notes ol,.notes ul{ margin-left:15px; }\n.notes li{ margin:1px 0; }\n\n/* ============================================================\n   7. SIGNATURE BLOCK — sits inside .doc-bottom (above footer)\n   ============================================================ */\n.signs{ display:flex; gap:5mm; margin-top:14px; break-inside:avoid; }\n.sign{ flex:1; text-align:center; }\n.sign__line{ height:30px; border-bottom:1px solid var(--c-mute-3); margin:0 5mm; }\n.sign__paren{ font-size:8pt; color:var(--c-mute-2); margin-top:4px; }\n.sign__role{ font-size:8.4pt; font-weight:600; color:var(--c-ink); margin-top:1px; }\n.sign__name{ font-size:7.8pt; color:var(--c-mute); }\n.sign__date{ font-size:7.6pt; color:var(--c-mute-2); margin-top:1px; }\n\n/* ============================================================\n   8. OFFICIAL THAI LETTER / MEMO (ระเบียบงานสารบรรณ) — logo-left head\n   ============================================================ */\n.letter{ margin-top:8px; font-size:10pt; line-height:1.6; color:var(--c-ink); }\n\n/* ที่ (เลขหนังสือ) ซ้าย + ส่วนราชการ/ที่อยู่ ขวา */\n.letter__refrow{ display:flex; justify-content:space-between; align-items:flex-start; gap:14mm; margin-top:6px; }\n.letter__ref{ font-size:10pt; }\n.letter__agency{ text-align:right; font-size:9.2pt; color:var(--c-mute); line-height:1.4; }\n\n/* วันที่ — จัดกึ่งกลาง ไม่มีคำว่า \"วันที่\" นำ (ตามแบบราชการ) */\n.letter__date{ text-align:center; margin:10px 0 12px; font-size:10pt; }\n\n/* ฟิลด์หัวเรื่อง เรื่อง/เรียน/อ้างถึง/สิ่งที่ส่งมาด้วย — hanging indent */\n.letter__field{ display:flex; gap:10px; margin:3px 0; }\n.letter__field .lbl{ flex:0 0 auto; }\n.letter__field .val{ flex:1; text-align:justify; }\n.letter__field .val b,.letter__subject{ font-weight:700; }\n\n/* เนื้อหา — ย่อหน้าเยื้องบรรทัดแรก, จัดเต็มแนว */\n.letter__body{ margin-top:6px; }\n.letter__body p,.letter p{ margin:7px 0; text-indent:3.5em; text-align:justify; }\n\n/* คำลงท้าย + ลายเซ็น — กล่องชิดขวา */\n.letter__close{ margin-top:16px; margin-left:auto; width:72mm; text-align:center; }\n.letter__close .sp{ height:42px; }\n.letter__close .nm{ font-weight:600; }\n.letter__close .pos{ color:var(--c-mute); }\n\n/* เจ้าของเรื่อง (ส่วนราชการเจ้าของเรื่อง) — ล่างซ้าย ตัวเล็ก */\n.letter__owner{ font-size:8.6pt; color:var(--c-ink); line-height:1.45; }\n\n/* ============================================================\n   9. PAGE FOOTER — pinned bottom via .doc-bottom\n   ============================================================ */\n.doc-footer{ margin-top:8px; padding-top:5px; border-top:1px solid var(--c-line-2);\n  display:flex; justify-content:space-between; font-size:7.4pt; color:var(--c-mute-2); }\n\n/* ============================================================\n   UTILITIES\n   ============================================================ */\n.muted{ color:var(--c-mute); }\n.right{ text-align:right; } .center{ text-align:center; } .nowrap{ white-space:nowrap; }\n.mt-0{ margin-top:0 } .mt-8{ margin-top:8px } .mt-12{ margin-top:12px } .mt-16{ margin-top:16px }\n.tag{ display:inline-block; padding:0 7px; border-radius:999px; font-size:7.4pt; font-weight:600; }\n.tag--info{ background:#DBEAFE; color:#1E40AF; }\n.tag--ok{ background:#D1FAE5; color:#065F46; }\n.tag--warn{ background:#FEF3C7; color:#92400E; }\n.tag--danger{ background:#FEE2E2; color:#DC2626; }\n\n/* ============================================================\n   FORM REPLICA (mode=replica) — ขึ้น \"แบบฟอร์มของลูกค้า\" เป็นเอกสารระบบ\n   ใช้คู่ base.css (ใส่ให้อัตโนมัติเมื่อ build_html.py --mode replica)\n   ทุกค่าเป็น style token ปรับต่อลูกค้าได้ผ่าน --profile (profiles/*.json)\n   ห้ามเขียนค่าตายตัวใน body — ปรับที่ profile เท่านั้น\n   ============================================================ */\n:root{\n  --form-fs:9.6pt; --form-lh:1.6;\n  --form-ink:#111111; --form-mute:#6B6B6B; --form-dot:#9A9CA2;\n  --form-title-fs:14pt; --form-title-gap:16px;\n  --form-logo-h:15mm; --form-logo-maxw:70mm; --form-logo-align:center;\n  --form-row-gap:8px; --form-row-gap-dense:5px;\n  --form-indent:12mm; --form-para-gap:24px; --form-para-gap-dense:14px;\n  --form-fill-pad:6px; --form-fill-s:15mm; --form-fill-m:30mm; --form-fill-l:60mm;\n  --form-date-w:52mm; --form-num-w:6mm; --form-cb-fs:12pt;\n  --form-grid-line:#111111; --form-grid-head-bg:#E6E6E6; --form-grid-pad:4px; --form-grid-row-h:6.2mm; --form-grid-row-h-dense:5mm; --form-grid-gap:0px;\n}\n.form{ font-size:var(--form-fs); line-height:var(--form-lh); color:var(--form-ink); }\n.form-brand{ display:flex; justify-content:var(--form-logo-align); }\n.form-logo{ height:var(--form-logo-h); width:auto; max-width:var(--form-logo-maxw); object-fit:contain; }\n.form-title{ text-align:center; font-size:var(--form-title-fs); font-weight:700; line-height:1.45; margin-top:var(--form-title-gap); }\n.form-date{ display:flex; justify-content:flex-end; margin-top:var(--form-title-gap); }\n.form-date .fill{ flex:0 0 var(--form-date-w); }\n.form-row{ display:flex; align-items:baseline; gap:6px; margin-top:var(--form-row-gap); }\n.form-row--indent{ padding-left:var(--form-indent); margin-top:calc(var(--form-row-gap) * 3); }\n.form-row .fill{ flex:1 1 0; }\n.form-row .fill--s{ flex:0 0 var(--form-fill-s); } .form-row .fill--m{ flex:0 0 var(--form-fill-m); } .form-row .fill--l{ flex:0 0 var(--form-fill-l); }\n.fill{ display:inline-block; min-height:1.45em; padding:0 var(--form-fill-pad); border-bottom:1px dotted var(--form-dot); font-weight:500; color:var(--form-ink); text-align:center; }\n.fill--left{ text-align:left; }\n.fill--s, .fill--m{ white-space:nowrap; }\n.fill .sub{ font-size:7.6pt; font-weight:400; color:var(--form-mute); }\n.form-num{ flex:0 0 var(--form-num-w); }\n.form-p{ margin-top:var(--form-para-gap); padding-left:var(--form-indent); }\n.form-check{ display:flex; align-items:baseline; gap:6px; margin-top:calc(var(--form-row-gap) * 2); }\n.form-check__lbl{ flex:0 0 auto; white-space:nowrap; }\n.form-check__opts{ flex:1; }\n.form-check__opt{ display:flex; align-items:baseline; gap:6px; margin-bottom:5px; }\n.form-check--inline .form-check__opts{ display:flex; flex-wrap:wrap; gap:4px 18px; }\n.cb{ font-size:var(--form-cb-fs); line-height:1; }\n.form-check .fill--s{ min-width:10mm; } .form-check .fill--m{ min-width:22mm; }\n.form-box{ margin-top:var(--form-row-gap); padding:6px 8px; border:1px solid var(--form-dot); min-height:18mm; }\n.form-section{ margin-top:var(--form-para-gap); font-weight:700; }\n/* รายการซ้ำยาว (> min_rows) → ระยะกระชับให้จบหน้าเดียวได้นานที่สุด (data.layout.dense) */\n.form.form--dense .form-row{ margin-top:var(--form-row-gap-dense); }\n.form.form--dense .form-row--indent{ margin-top:calc(var(--form-row-gap-dense) * 3); }\n.form.form--dense .form-check{ margin-top:calc(var(--form-row-gap-dense) * 2); }\n.form.form--dense .form-p{ margin-top:var(--form-para-gap-dense); }\n\n/* R9 · ตารางกรอบ (grid form) — ฟอร์มที่กระดาษเป็นตารางเส้นทึบ (เช่น FM-FIN-02) · v2.1 */\n.form-grid{ width:100%; border-collapse:collapse; table-layout:fixed; margin-top:var(--form-grid-gap); }\n.form-grid + .form-grid{ border-top:0; }\n.form-grid td, .form-grid th{ border:1px solid var(--form-grid-line); padding:2px var(--form-grid-pad); height:var(--form-grid-row-h); vertical-align:middle; text-align:left; font-weight:400; overflow:hidden; }\n.form-grid th{ background:var(--form-grid-head-bg); font-weight:700; text-align:center; }\n.form-grid .g-b{ font-weight:700; } .form-grid .g-r{ text-align:right; } .form-grid .g-c{ text-align:center; }\n.form-grid .g-v{ font-weight:500; } .form-grid .g-num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:500; }\n.form-grid .g-25{ width:25%; } .form-grid .g-50{ width:50%; } .form-grid .g-75{ width:75%; }\n.form-grid .g-tall{ height:calc(var(--form-grid-row-h) * 1.5); }\n.form-grid .g-u{ text-decoration:underline; font-weight:700; }\n.form.form--dense .form-grid td{ height:var(--form-grid-row-h-dense); }\n.form-note{ margin-top:var(--form-row-gap); } .form-note .b{ font-weight:700; }\n.form-grid--signs td{ text-align:center; vertical-align:top; }\n.form-grid td.g-blank{ border-top:0; border-left:0; }\n.form-grid tr.g-hrow td{ height:calc(var(--form-grid-row-h) * 1.4); }\n\n/* B6 rows · ช่องลงชื่อ dynamic ตาม DOA (v2.1) — data ส่ง sign_rows[].signs[] แถวละ ≤4 (sign_rows.py / tplSignRows)\n   ห่อด้วย .signs-block ทุกครั้ง = ทั้งก้อนไม่ถูกตัดข้ามหน้า · .doc-bottom.is-dense เมื่อขั้น DOA > 4 */\n.form-grid--signs + .form-grid--signs{ margin-top:0; border-top:0; }\n.form-grid--signs + .form-grid--signs td{ border-top:0; }\n.doc-bottom.is-dense .sign__line{ height:16px; }\n.doc-bottom.is-dense .form-grid--signs td{ padding-top:1px; padding-bottom:1px; }\n.doc-bottom.is-dense .sign__date, .doc-bottom.is-dense .sign__name{ font-size:7.2pt; }\n.signs-block{ break-inside:avoid; page-break-inside:avoid; }\n.signs-block .signs + .signs{ margin-top:4mm; }\n.doc-bottom.is-dense .signs-block .signs + .signs{ margin-top:2mm; }\n\n/* ===== R10 · เอกสารเกิน 1 หน้า (v2.2) — ออกแบบเป็น 2 หน้าแทนการบีบ ===== */\n.page-break{ break-before:page; page-break-before:always; }          /* ขึ้นหน้าใหม่ตรงจุดที่ตั้งใจ (ก่อนส่วนที่ 2 / ก่อนบล็อกลงชื่อ) */\n.keep-together{ break-inside:avoid; page-break-inside:avoid; }       /* กล่อง/ตารางย่อยไม่ถูกตัดกลาง */\n.form-grid thead, .items thead{ display:table-header-group; }        /* หัวตารางซ้ำทุกหน้า */\n.form-grid tr, .items tr{ break-inside:avoid; page-break-inside:avoid; }\n.cont-note{ text-align:right; font-size:7.5pt; color:var(--form-ink,#333); margin-top:2mm; }   /* \"มีต่อหน้าถัดไป\" ท้ายหน้า 1 */\n.page-no{ text-align:right; font-size:7.5pt; }                        /* \"หน้า 1/2\" ใน footer ทุกหน้า */\n\n:root{--form-fs:8.5pt; --form-title-fs:14pt; --form-title-gap:4px; --form-para-gap:12px; --form-row-gap:5px; --form-grid-row-h:6mm; --form-grid-row-h-dense:5.2mm; --form-grid-gap:2px;}";

/* tpl_render.js (thai-doc-pdf-generator) — วางตรงตัว: ผลตรงกับ render_doc.py ทุกไบต์ */
function tplEsc(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#x27;'); }
function tplGet(stack, path){
  for (let i = stack.length - 1; i >= 0; i--){ let cur = stack[i], ok = true;
    for (const k of path.split('.')){ if (cur && typeof cur === 'object' && !Array.isArray(cur) && k in cur) cur = cur[k]; else { ok = false; break; } }
    if (ok) return cur; }
  return null;
}
function tplRender(t, stack){
  t = t.replace(/{{([#^])([\w.]+)}}([\s\S]*?){{\/\2}}/g, (m, kind, key, inner) => { const v = tplGet(stack, key), has = Array.isArray(v) ? v.length > 0 : !!v;
    if (kind === '^') return has ? '' : tplRender(inner, stack);
    if (Array.isArray(v)) return v.map(x => tplRender(inner, stack.concat([x]))).join('');
    return has ? tplRender(inner, stack.concat(typeof v === 'object' ? [v] : [])) : ''; });
  t = t.replace(/{{{([\w.]+)}}}/g, (m, k) => { const v = tplGet(stack, k); return v == null ? '' : String(v); });
  return t.replace(/{{([\w.]+)}}/g, (m, k) => { const v = tplGet(stack, k); return v == null ? '' : tplEsc(v); });
}

  return out; }

    const pad = PDF_CH_PER_BLOCK - idx.length, padV = Array.from({ length:pad }, () => ({ v:'' }));
    blocks.push({ channels:idx.map(j => ({ name:CFG.channels[j] })).concat(Array.from({ length:pad }, () => ({ name:'' }))),
      rows:CFG.criteria.map((c, i) => ({ topic:c.text, max:String(c.max), scores:idx.map(j => ({ v:r.scores[i][j] === '' ? '' : String(r.scores[i][j]) })).concat(padV) })),
      max_total:String(maxTotal()),

  const g = groupsOf(r.scores);

  const recs = r.recs.filter(t => t.trim()), rr = recs.map((t, k) => ({ no:(k + 1) + '.', text:t }));
  while (rr.length < PDF_MIN_RECS) rr.push({ no:(rr.length + 1) + '.', text:'' });
  const signs = [{ role:'ผู้สรุปการประเมิน', name:e.name, position:r.pos, date:r.finalizedAt ? `ยืนยันสรุปในระบบ ${tShort(r.finalizedAt)} ${r.finalizedAt.slice(11, 16)} น.` : BLANK_DATE, decision:null }];
  return { doc:{ title:DOC_NAME, no:r.code, is_draft:r.status === 'draft', is_cancelled:r.status === 'cancelled', form_code:DOC.form, revision:DOC.rev },

    summary:{ groups }, recommendations:rr, sign_rows:tplSignRows(signs, SIGN_MAX_PER_ROW),

      <div class="review-card"><div class="review-title"><i data-lucide="table-2" class="w-4 h-4"></i>คะแนนรายช่องทาง<span class="dt-count num">${nDone(f.scores)}</span></div>${matrixView(f.scores)}</div>

/* ---------- wizard actions ---------- */
function goStep(n){ S.dw.step = n; render(); }
function pickAssess(iso){ setF1('assessDate', iso); }
function pickSumm(iso){ setF1('summaryDate', iso); }
function setF1(k, v){ const f = wf(); f[k] = v.trim(); dirty(); if (S.dw.err){ delete S.dw.err[k === 'round' ? 'round' : k === 'assessDate' ? 'assess' : 'summ']; } if (k !== 'round') render(); }
/* พิมพ์คะแนน → อัปเดตรวม/%/สรุปกลุ่มแบบ soft (ไม่ rebuild — focus ไม่หลุด) */
function setScore(i, j, el){
  const f = wf(), v = el.value.trim(); f.scores[i][j] = v; dirty();
  const ok = isScore(v, CFG.criteria[i].max); el.classList.toggle('is-bad', !ok);
  if (ok && S.dw.err && S.dw.err.cells) delete S.dw.err.cells[i + '-' + j];
  const c = chCalc(f.scores, j), t = document.getElementById(`mt-${j}`), p = document.getElementById(`mp-${j}`);
  if (t) t.textContent = c.total == null ? '' : c.total;
  if (p){ p.innerHTML = chFoot(c); p.className = 'num' + (c.band ? ' ' + BAND_CLS[c.band] : ''); }
  const sl = document.getElementById('sumLine'); if (sl) sl.outerHTML = sumLine();
}
function setNote(k, v){ wf().notes[k] = v; dirty(); }
function setRec(i, v){ wf().recs[i] = v; dirty(); if (S.dw.err && v.trim()) delete S.dw.err.recs; }
function addRec(){ wf().recs.push(''); dirty(); render(); requestAnimationFrame(() => { const el = document.querySelector('[name="rec-' + (wf().recs.length - 1) + '"]'); if (el) el.focus(); }); }
function removeRec(i){ const f = wf(); if (f.recs.length === 1) return; f.recs.splice(i, 1); dirty(); render(); }
/* ตรวจขั้น 1 — ใช้ทั้งบันทึกร่าง (strict=false) และยืนยันสรุป (strict=true: ทุกช่องทางที่เริ่มกรอกต้องครบ + มีช่องทางครบ ≥ 1) */
function validateMain(strict){
  const f = wf(), err = { cells:{} };
  if (!/^\d+$/.test(f.round) || Number(f.round) < 1) err.round = f.round ? 'ครั้งที่ต้องเป็นจำนวนเต็มตั้งแต่ 1' : 'กรุณาระบุครั้งที่';
  if (!f.assessDate) err.assess = 'กรุณาเลือกวันที่';
  if (!f.summaryDate) err.summ = 'กรุณาเลือกวันที่';
  else if (f.assessDate && f.summaryDate < f.assessDate) err.summ = 'สรุปข้อมูล วันที่ ต้องไม่ก่อนเอกสารประเมิน วันที่';
  let bad = 0;
  CFG.criteria.forEach((c, i) => f.scores[i].forEach((v, j) => { if (!isScore(v, c.max)){ err.cells[i + '-' + j] = 1; bad++; } }));
  const cs = allCalc(f.scores);
  if (bad) err.cellMsg = 'คะแนนต้องเป็นจำนวนเต็ม 1–5';
  else if (strict && cs.some(c => c.state === 'partial')){ err.cellMsg = 'กรอกคะแนนให้ครบทุกหัวข้อของช่องทางที่ประเมิน (หรือเว้นว่างทั้งคอลัมน์)'; cs.forEach((c, j) => { if (c.state === 'partial') CFG.criteria.forEach((_, i) => { if (f.scores[i][j] === '') err.cells[i + '-' + j] = 1; }); }); }
  else if (strict && !cs.some(c => c.state === 'done')) err.cellMsg = 'กรอกคะแนนครบทุกหัวข้ออย่างน้อย 1 ช่องทาง';
  const ok = !err.round && !err.assess && !err.summ && !err.cellMsg;
  S.dw.err = ok ? null : err; return ok;
}
function validateRecs(){ const f = wf(); if (f.recs.some(t => t.trim())) return true; S.dw.err = { recs:'ใส่ข้อเสนอแนะอย่างน้อย 1 ข้อ' }; return false; }
function wizNext(){
  if (S.dw.step === 1 && !validateMain(false)){ render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.dw.step += 1; render();
}
function wizBack(){ S.dw.step = Math.max(1, S.dw.step - 1); render(); }
function pickFiles(inp){ const f = wf(); gateFiles(Array.from(inp.files || [])).forEach(x => f.files.push({ name:x.name, size:fmtSize(x.size) })); inp.value = ''; dirty(); render(); }
function removeFile(i){ wf().files.splice(i, 1); dirty(); render(); }
/* บันทึกครั้งแรก = ENG-DOC-NUM.next() ออกเลขที่ (DEC-11) · ผู้สรุป snapshot ตำแหน่ง/หน่วยงาน · หัวข้อ/ช่องทาง snapshot จาก SalesConfig */
function persist(){
  const f = wf(), me = ME(), t = nowIso();
  let r = S.dw.editId ? findR(S.dw.editId) : null;
  if (!r){
    SEQ += 1;
    r = { id:'R' + SEQ, code:DOC.prefix + '-2569-' + String(SEQ).padStart(4, '0'), status:'draft', emp:S.me, pos:me.pos, dept:me.dept, doa:Object.assign({}, DOA_FIELDS),
      attachments:[], audit:[{ act:'สร้างเอกสาร', by:me.name, at:t, tone:'' }], createdBy:me.name, createdAt:t, finalizedAt:null };
    RECS.unshift(r);
  } else r.audit.push({ act:'แก้ไขร่าง', by:me.name, at:t, tone:'' });
  Object.assign(r, { round:Number(f.round), assessDate:f.assessDate, summaryDate:f.summaryDate, scores:JSON.parse(JSON.stringify(f.scores)), notes:Object.assign({}, f.notes),
    recs:f.recs.filter(x => x.trim()).length ? f.recs.filter(x => x.trim()) : [''], attachments:f.files.slice(), updatedBy:me.name, updatedAt:t });
  return r;
}
function saveDraft(){ if (S.busy) return; if (!validateMain(false)){ S.dw.step = 1; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const r = persist(); S.busy = false; closeDrawer(true); setTimeout(() => showToast('บันทึกร่างแล้ว · ' + r.code, 'info'), 300); }, 500); }
function saveAndFinalize(){ if (S.busy) return;
  if (!validateMain(true)){ S.dw.step = 1; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  if (!validateRecs()){ S.dw.step = 2; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const r = persist(); S.busy = false; closeDrawer(true); setTimeout(() => openFinalize(r.id), 300); }, 500); }

/* =====================================================================
   MODALS — ยืนยันสรุป (ไม่มีอนุมัติ · DEC-03) · ยกเลิก (เหตุผลบังคับ) · ทิ้งข้อมูล
   ===================================================================== */
function modalShell(icon, tone, title, sub, body, foot){
  return `<div class="modal-header"><div class="modal-header-icon ${tone}"><i data-lucide="${icon}" class="w-4 h-4"></i></div><div><h3 class="modal-title">${title}</h3><p class="modal-subtitle">${sub}</p></div></div>
    ${body ? `<div class="modal-body">${body}</div>` : ''}<div class="modal-footer">${foot}</div>`;
}
const busyLabel = (icon, label) => S.busy ? '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>' : `<i data-lucide="${icon}" class="w-4 h-4"></i><span>${label}</span>`;
function presetChips(list, cur){ return `<div class="chip-row">${list.map(p => `<button type="button" class="chip ${cur === p ? 'is-on' : ''}" onclick="setReasonPreset(this.dataset.v)" data-v="${esc(p)}">${esc(p)}</button>`).join('')}</div>`; }
function renderModal(){
  const m = S.md; if (!m) return '';
  const r = m.id ? findR(m.id) : null;
  if (m.kind === 'finalize'){
    const g = groupsOf(r.scores), cs = allCalc(r.scores), partial = cs.some(c => c.state === 'partial'), none = !cs.some(c => c.state === 'done'), noRec = !r.recs.some(t => t.trim());
    const block = partial ? 'มีช่องทางที่กรอกคะแนนไม่ครบ — แก้ไขร่างก่อน' : none ? 'ยังไม่มีช่องทางที่กรอกคะแนนครบ — แก้ไขร่างก่อน' : noRec ? 'ยังไม่มีข้อเสนอแนะ — แก้ไขร่างก่อน' : '';
    return modalShell('check-circle-2', 'is-primary', 'ยืนยันสรุปผลประเมิน?', `${r.code} · ครั้งที่ ${r.round} · ยืนยันแล้วแก้ไขไม่ได้`,
      `${block ? `<div class="alert-row is-danger"><i data-lucide="alert-circle" class="w-4 h-4"></i><div>${block}</div></div>` : ''}
       <div class="drawer-fields">${kv('ช่องทางที่ประเมิน', `<span class="num">${nDone(r.scores)}/${CFG.channels.length}</span>`)}${kv(BAND('pass').label, `<span class="num">${g.pass.length}</span>`)}${kv(BAND('below').label, `<span class="num">${g.below.length}</span>`)}${kv(BAND('far').label, `<span class="num">${g.far.length}</span>`)}</div>
       <div class="slot-row"><span class="slot-no num">1</span><span class="slot-role">ผู้สรุปการประเมิน</span><div>${empChip(r.emp, r.pos)}<div class="slot-help">ไม่มีขั้นอนุมัติตามแบบฟอร์ม</div></div></div>
       ${resolveDoa().map(c => `<div class="slot-row"><span class="slot-no num">${c.step + 1}</span><span class="slot-role">${esc(c.role)}</span><div class="cell-mute">ผู้พิจารณาจาก DOA กลาง</div></div>`).join('')}
       ${g.far.length ? `<div class="alert-row mt-2"><i data-lucide="bell" class="w-4 h-4"></i><div>จะแจ้งหัวหน้าหน่วยธุรกิจ: ช่องทางต่ำกว่า ${CFG.low}% — ${esc(g.far.join(', '))}</div></div>` : ''}`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="btnFinalize" onclick="confirmFinalize()" ${S.busy || block ? 'disabled' : ''}>${busyLabel('check-circle-2', 'ยืนยันสรุป')}</button>`);
  }
  if (m.kind === 'cancel'){
    return modalShell('x-circle', 'is-danger', 'ยกเลิกเอกสาร?', `${r.code} · ${esc(empOf(r.emp).name)}${r.status === 'final' ? ' · เอกสารสรุปแล้วจะถูกปิด ต้องสร้างใบใหม่แทน' : ''}`,
      `${presetChips(CANCEL_PRESETS, m.preset)}
       <div class="field ${m.err ? 'is-invalid' : ''}" id="fReason"><label class="field-label">เหตุผล<span class="req">*</span></label><textarea class="input" name="reason" rows="3" placeholder="เหตุผลที่ยกเลิก" oninput="S.md.reason=this.value; if(this.value.trim()) document.getElementById('fReason').classList.remove('is-invalid')">${esc(m.reason || '')}</textarea><div class="field-error">กรุณาระบุเหตุผล</div></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ไม่ยกเลิก</button><button class="btn btn-danger" id="btnReason" onclick="confirmReason()" ${S.busy ? 'disabled' : ''}>${busyLabel('x-circle', 'ยกเลิกเอกสาร')}</button>`);
  }
  if (m.kind === 'discard'){
    return modalShell('alert-triangle', 'is-warning', 'ทิ้งข้อมูลที่กรอกไว้?', 'ข้อมูลในแบบฟอร์มนี้ยังไม่ได้บันทึก', '',
      `<button class="btn btn-ghost" onclick="closeModal()">กลับไปกรอกต่อ</button><button class="btn btn-danger" id="btnDiscard" onclick="closeModal(); closeDrawer(true)">ทิ้งข้อมูล</button>`);
  }
  return '';
}
function openModalCfg(cfg){ S.md = cfg; state.modal.open = true; render(); requestAnimationFrame(() => document.getElementById('modalBackdrop').classList.add('is-open')); }
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('is-open'); state.modal.open = false; setTimeout(() => { if (!state.modal.open) S.md = null; }, 200); }
/* backdrop ปิดด้วย mousedown ที่ backdrop เท่านั้น (#122) — ลากจากในกล่องไปปล่อยข้างนอกไม่ปิด */
function modalBackdropDown(ev){ if (ev.target !== ev.currentTarget) return; if (S.md && S.md.reason) return; closeModal(); }
function setReasonPreset(v){ S.md.preset = v; S.md.reason = v + (S.md.reason && S.md.reason.indexOf(v) !== 0 ? ' — ' + S.md.reason : ''); S.md.err = false; render(); }
function openFinalize(id){ const r = findR(id); if (!r || !canAct(r)) return; openModalCfg({ kind:'finalize', id }); }
function openCancel(id){ closeRowMenu(); const r = findR(id); if (!r || !canCancel(r)) return; openModalCfg({ kind:'cancel', id, reason:'' }); }
function pushAudit(r, act, note, tone){ const me = ME(), t = nowIso(); r.audit.push({ act, by:me.name, at:t, note:note || '', tone:tone || '' }); r.updatedBy = me.name; r.updatedAt = t; }
/* ยืนยันสรุป: draft → final · ไม่เปลี่ยนค่าในระบบ ไม่ส่งต่อ (DEC-01/02) · มีช่องทาง < low → ENG-NOTIFY mts_low_channel (NTF_BRIEF_F-TMP-008) */
function confirmFinalize(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    r.status = 'final'; r.finalizedAt = nowIso(); pushAudit(r, 'ยืนยันสรุป', '', 'ok');
    const far = groupsOf(r.scores).far;
    if (far.length) r.audit.push({ act:'แจ้งเตือน: ช่องทางต่ำกว่า ' + CFG.low + '%', by:'ระบบ', at:r.finalizedAt, note:far.join(', '), tone:'bad' });

const FILE_ACCEPT = '.pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg', FILE_RE = /\.(pdf|docx?|xlsx?|png|jpe?g)$/i, FILE_MAX_MB = 20;
