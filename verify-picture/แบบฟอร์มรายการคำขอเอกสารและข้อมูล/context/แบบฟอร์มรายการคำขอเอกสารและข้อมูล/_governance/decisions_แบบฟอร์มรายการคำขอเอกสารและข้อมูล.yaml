# unattended — AI-DEFAULT ทุกหมวด รอลูกค้ายืนยัน
# G1 ผลต่อระบบ — ทะเบียนคำขอเอกสาร/ข้อมูล ไม่เปลี่ยนค่าในระบบ ไม่ส่งต่อ · ไม่ส่งอีเมล/คำขอไปผู้ถูกขอข้อมูลจริง (บันทึกเป็นทะเบียนติดตาม) · ชื่อโครงการกรอกเอง (FM-IVM-01 ยังไม่ลิงก์ในระบบ)
config_changes: []
post_to: []

# G2 สายอนุมัติ — dynamic · 2 ขั้นตามช่องลงชื่อบนกระดาษ (ผู้ตรวจสอบ → ผู้อนุมัติ/รับทราบ) · ไม่มีวงเงินบนกระดาษ
doa: { required: true, mode: dynamic, default_steps: ["role-line-manager", "role-gm"], step_labels: ["ผู้ตรวจสอบ", "ผู้อนุมัติ / รับทราบ"], amount: none }

# G3 ค่าคงที่ / กติกา — รูปแบบรหัสคำขอ DR-nnn + หมายเหตุการใช้งาน อ่านจาก config · ไม่มีสูตร · เกินกำหนดเตือน ข้อมูลขัดกันชัดเจนบล็อก
calc:
  constants_from_config: true
  auto_compute: true
  over_limit: warn
  rules:
    - "รหัสคำขอ DR-nnn ระบบรันให้ต่อใบ (prefix จาก config DocRequestPolicy.code_prefix) · ใบใหม่ตั้งต้น 1 แถว (PDF เติมแถวว่างจนครบ 20)"
    - "หมายเหตุการใช้งาน อ่านจาก config DocRequestPolicy.usage_note · แสดงอ่านอย่างเดียว"
    - "สถานะ ขอแล้ว / ได้รับบางส่วน / ได้รับครบ → ต้องมีวันที่ขอ (บล็อก)"
    - "สถานะ ได้รับครบ → ต้องมีวันที่ได้รับ (บล็อก) · สถานะ ยังไม่ขอ แต่มีวันที่ได้รับ → บล็อก"
    - "กำหนดส่งก่อนวันที่ขอ → บล็อก · วันที่ได้รับก่อนวันที่ขอ → บล็อก"
    - "สถานะ ไม่เกี่ยวข้อง / ยกเลิก → ต้องกรอกหมายเหตุ (เหตุผล) (บล็อก)"
    - "เลยกำหนดส่งแล้วสถานะยังไม่ใช่ ได้รับครบ / ไม่เกี่ยวข้อง / ยกเลิก → ป้ายเกินกำหนด (เตือน ไม่บล็อก)"
    - "ลิงก์เอกสารรับเฉพาะ path / URL · ข้อความมีคำว่า password / รหัสผ่าน → เตือน (ห้ามเก็บรหัสผ่าน)"
    - "ต้องมีรายการคำขออย่างน้อย 1 แถวก่อนส่ง (บล็อกตอนส่ง)"

# G4 รายการซ้ำ — ไม่จำกัด · PDF ขั้นต่ำเท่ากระดาษ (20 แถว)
repeat: { max_rows: null }

# G5 ช่องตามกระดาษ — 1:1 ยกเว้นช่องระบุโครงการ (กระดาษไม่มี · anomaly)
fidelity: { one_to_one: true, add_fields: ["ชื่อโครงการ / ธุรกรรม (F01 · กระดาษไม่มีช่องระบุโครงการ)"], merge_split: [] }

# G6 ลายเซ็น — แถวล่าง 1 ช่องต่อขั้น DOA + ผู้จัดทำ · ข้อความ "พิจารณาในระบบ" ไม่ใช้ภาพ
signature: { layout: row-bottom, per_doa_step: true, handwriting_image: false }

# G7 ไม่อนุมัติ / ยกเลิก — กลับเป็นร่างเลขเดิม · ยกเลิกได้ เจ้าของ + admin role · ร่าง/รออนุมัติ · เหตุผลบังคับ
reject_cancel: { on_reject: draft, cancel_by: [owner, admin_role], cancel_states: [draft, pending], reason_required: true }

# G8 การมองเห็น — เจ้าของ · ผู้อนุมัติหลังส่ง · admin role ฝ่ายบริหารการลงทุนเห็นทั้งหมด
visibility: { owner: true, approver: after_submit, admin_role: all }

# G9 เลขที่ — เอกสารภายใน ออกตอนบันทึกครั้งแรก · รหัส IVME (IVM + E = ฟอร์มลำดับ 05 · FM-IVM-05)
numbering: { issue_on: first_save, code: IVME }

# G10 ของเสริม
extras: { attachments: true, copy: false, export_csv: true, announce: false }

extend: {}
fit: {}
