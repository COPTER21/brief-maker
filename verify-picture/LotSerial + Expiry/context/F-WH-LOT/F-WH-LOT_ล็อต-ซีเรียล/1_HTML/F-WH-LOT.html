<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Lot/Serial + Expiry · CUBE</title><style>@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap');
:root{--bg:#FAF8F5;--ink:#111111;--muted:#73757B;--line:#DEDAD4;--red:#FF3B30;--orange:#FF9A1F;--white:#FFFFFF;--good:#157A41;--z-backdrop:50;--z-drawer:60;--z-toast:70;--z-dropdown:10}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{margin:0;min-height:100%;font-family:Satoshi,'Noto Sans Thai',sans-serif;color:var(--ink);background:var(--bg)}body{min-width:768px;scrollbar-gutter:stable}::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:#DEDAD4;border-radius:10px}*{scrollbar-width:thin}.app{display:flex;min-height:100vh}.sidebar{width:232px;background:var(--ink);color:var(--white);padding:24px 16px;flex-shrink:0}.brand{font-size:20px;font-weight:700;padding:0 12px 24px}.navtitle{color:#9A9CA2;font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:16px 12px 8px}.navlink{display:block;color:#DEDAD4;text-decoration:none;border-radius:8px;padding:10px 12px;font-size:13px}.navlink.active{background:var(--red);color:var(--white)}.shell{min-width:0;flex:1}.topbar{height:56px;background:var(--white);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:12px}.content{padding:28px;min-width:0}.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}.eyebrow{color:var(--muted);font-size:12px}.page-head h1{font-size:26px;margin:4px 0 0}.ph-actions{display:flex;align-items:center;gap:8px}.btn{height:36px;border:1px solid var(--line);background:var(--white);color:var(--ink);border-radius:8px;padding:0 16px;font:600 12px Satoshi,'Noto Sans Thai',sans-serif;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px}.btn:hover{border-color:var(--ink)}.btn-primary{background:var(--red);color:var(--white);border-color:var(--red)}.btn-ghost{background:transparent;border-color:transparent}.btn-sm{height:32px}.tabs{display:flex;align-items:center;gap:24px;border-bottom:1px solid var(--line);margin-top:24px}.tab{font:600 13px Satoshi,'Noto Sans Thai',sans-serif;border:0;background:none;color:var(--muted);border-bottom:2px solid transparent;padding:12px 0;cursor:pointer}.tab.is-active{color:var(--red);border-bottom-color:var(--red)}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:20px 0}.stat{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:16px;cursor:pointer}.stat .num{font-size:20px;font-weight:700;margin-top:6px}.stat .lbl{font-size:12px;color:var(--muted)}.panel{background:var(--white);border:1px solid var(--line);border-radius:10px;overflow:hidden}.toolbar{padding:16px;border-bottom:1px solid var(--line)}.search-box{position:relative}.search-box i{position:absolute;left:10px;top:10px;width:16px;height:16px;color:var(--muted)}.input,.select{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--white);padding:0 12px;font:12px Satoshi,'Noto Sans Thai',sans-serif;color:var(--ink);width:100%;outline:none}.search-box .input{padding-left:36px}.input:focus,.select:focus{border-color:var(--red)}.page-fill{min-height:calc(100vh - 330px);display:flex;flex-direction:column}.table-wrap{overflow:auto;flex:1}.tbl{width:100%;border-collapse:collapse;min-width:740px;font-size:12.5px}.tbl th{position:sticky;top:0;background:var(--white);z-index:1;text-align:left;color:var(--muted);font-size:11px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}.tbl td{padding:8px 12px;border-bottom:1px solid #E9E5E0;height:44px}.tbl tbody tr{cursor:pointer}.tbl tbody tr:hover{background:#FAF8F5}.pill{display:inline-block;padding:3px 8px;border-radius:20px;background:#E4F4EB;color:var(--good);font-size:11px}.pill.pending{background:#FFF1DD;color:#B8690B}.table-foot{padding:10px 16px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.empty{padding:56px;text-align:center;color:var(--muted)}.page-section{padding:20px}.page-section h2{font-size:16px;margin:0 0 16px}.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.kv label{font-size:12px;color:var(--muted);display:block;margin-bottom:6px}.kv strong{font-size:13px}.actions{display:flex;align-items:center;gap:8px;margin-top:20px}.backdrop{position:fixed;inset:0;background:rgba(17,17,17,.38);z-index:var(--z-backdrop);display:none}.backdrop.open{display:block}.drawer{position:fixed;right:0;top:0;bottom:0;width:min(920px,100vw);background:var(--white);z-index:var(--z-drawer);display:none;box-shadow:-10px 0 40px rgba(17,17,17,.12);flex-direction:column}.drawer.open{display:flex}.dw-head{padding:24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start}.dw-head h2{font-size:20px;margin:4px 0}.dw-body{padding:24px;overflow:auto;flex:1}.dw-footer{padding:16px 24px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px}.spacer{flex:1}.fieldgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.field{position:relative}.field label{font-size:12px;font-weight:600;display:block;margin-bottom:6px}.field .input,.field .select{width:100%}.error{color:var(--red);font-size:12px;min-height:18px;margin-top:4px}.toast{position:fixed;right:20px;bottom:20px;z-index:var(--z-toast);background:var(--ink);color:var(--white);padding:12px 16px;border-radius:8px;display:none;font-size:12px}.toast.show{display:block}.muted{color:var(--muted)}.history-row{padding:12px 0;border-bottom:1px solid var(--line)}.demo{color:#B8690B;border:1px solid var(--orange);border-radius:4px;font-size:11px;padding:2px 4px;margin-left:6px}@media(max-width:1024px){.sidebar{width:58px;padding:24px 6px}.sidebar .navtitle,.sidebar .navlink span{display:none}.content{padding:16px}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:767px){body{min-width:320px}.sidebar{display:none}.content{padding:12px}.stats{grid-template-columns:repeat(2,1fr)}.fieldgrid,.kv{grid-template-columns:1fr}.topbar{padding:0 12px}}
.combo-menu{position:absolute;background:#FFFFFF;border:1px solid #DEDAD4;z-index:var(--z-dropdown);max-height:320px;overflow:auto;width:420px}.combo-option{display:flex;align-items:center;gap:8px;padding:8px 12px;width:100%;background:#FFFFFF;border:0;text-align:left;cursor:pointer}.combo-icon{color:#FF9A1F}.combo-option:hover{background:#FAF8F5}</style></head><body><div class="app"><aside class="sidebar"><div class="brand">CUBE</div><div class="navtitle">Warehouse</div><a class="navlink active" href="#/records"><span>Lot/Serial + Expiry</span></a></aside><div class="shell"><div class="topbar"><span>ระบบจัดการคลัง / Lot/Serial + Expiry</span><span>ผู้ใช้งานตัวอย่าง <span class="demo">DEMO</span></span></div><main class="content"><div class="page-head"><div><div class="eyebrow">Warehouse / ข้อมูลหลัก</div><h1>Lot/Serial + Expiry</h1></div><div class="ph-actions"><button class="btn" onclick="exportRows()">ส่งออก</button><button class="btn btn-primary" onclick="openCreate()">สร้างรายการ</button></div></div><div class="tabs" id="tabs"></div><div class="stats" id="stats"></div><div class="panel page-fill" id="mainPanel"><div class="toolbar" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
  <div class="search-box" style="flex:1;min-width:220px;max-width:420px">
    <i data-lucide="search"></i>
    <input class="input" id="search" placeholder="ค้นหาชื่อ / รหัสสินค้า / รหัสเก่า…" oninput="renderTableOnly()">
  </div>
  <select class="select" style="width:200px" id="typeFilter" onchange="renderTableOnly()"><option>ทุกประเภท</option></select>
  <select class="select" style="width:180px" id="statusFilter" onchange="renderTableOnly()"><option>ทุกสถานะ</option></select>
  <button class="btn btn-ghost btn-sm" onclick="clearFilters()">
    <i data-lucide="rotate-ccw"></i> ล้างตัวกรอง</button>
</div>
<div class="table-wrap"><table class="tbl"><thead id="thead"></thead><tbody id="tbody"></tbody></table><div class="empty" id="empty" hidden>ไม่พบรายการที่ตรงกับตัวกรอง</div></div><div class="table-foot" id="tableFoot"></div></div><div class="panel" id="secondaryPanel" hidden></div></main></div></div><div class="backdrop" id="backdrop" onclick="closeDrawer()"></div><section class="drawer" id="drawer" role="dialog" aria-modal="true"><div class="dw-head"><div><div class="eyebrow" id="drawerEyebrow">ข้อมูลหลัก</div><h2 id="drawerTitle">สร้างรายการ</h2></div><button class="btn btn-ghost" onclick="closeDrawer()" aria-label="ปิด">×</button></div><div class="dw-body" id="drawerBody"></div><div class="dw-footer" id="drawerFooter"></div></section><div class="toast" id="toast" role="status"></div><div id="overlay-root"></div><script>
const CFG={"code": "F-WH-LOT", "english": "Lot/Serial + Expiry", "thai": "ล็อต-ซีเรียล", "tabs": ["ล็อตและซีเรียล", "ติดตามการเคลื่อนไหว", "ตั้งค่ารายสินค้า"], "cols": ["รหัสล็อต", "สินค้า", "ซีเรียล", "วันหมดอายุ", "สถานะ"], "fields": [["lot", "รหัสล็อต", "text"], ["item", "สินค้า", "text"], ["serial", "ซีเรียล", "text"], ["expiry", "วันหมดอายุ", "date"], ["status", "สถานะ", "status"]], "seed": [["LOT-2609-011", "ITEM-101 · ข้าวหอม", "SN-101", "2026-12-31", "พร้อมใช้"], ["LOT-2609-012", "ITEM-102 · นม UHT", "SN-102", "2026-10-10", "พร้อมใช้"], ["LOT-2608-003", "ITEM-103 · อะไหล่", "SN-088", "—", "พร้อมใช้"]], "rules": ["เปิด lot/serial/expiry ระดับ item และบังคับวันหมดอายุเฉพาะ item ที่เปิด expiry", "เลือก FEFO สำหรับ item ที่เปิด expiry; item อื่นใช้ FIFO ตามนโยบายต้นทุน", "ซีเรียลต้องไม่ซ้ำใน item เดียวกัน", "movement GRN/Transfer เป็น soft-reference mock; ประวัติ append-only", "แจ้งใกล้หมดอายุผ่าน NC rules ซึ่งกำหนด threshold ภายนอก"], "scenarios": ["สร้างล็อตมี expiry", "ปฏิเสธซีเรียลซ้ำ", "ปฏิเสธวันหมดอายุว่างเมื่อ item บังคับ", "เปิด trace ย้อน GRN และไป Transfer", "FEFO เรียงวันหมดอายุ"]};
const state={rows:CFG.seed.map((r,i)=>({id:i+1,values:[...r]})),history:[],active:'records',sort:0,asc:true,selected:null,mode:'view',lastKey:'',role:'operator',settings:{}};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function route(){let r=(location.hash||'#/records').split('/')[1];state.active=['records','history','settings'].includes(r)?r:'records';render()}
function renderIcons(){if(window.lucide)window.lucide.createIcons()}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function tabs(){let ids=['records','history','settings'];document.getElementById('tabs').innerHTML=ids.map((v,i)=>`<button class="tab ${state.active===v?'is-active':''}" onclick="location.hash='#/${v}'">${esc(CFG.tabs[i])}</button>`).join('')}
function stats(){let n=state.rows.length;let vals=[n,Math.max(n-1,0),state.history.length,CFG.scenarios.length];let labs=['รายการทั้งหมด','พร้อมดำเนินการ','เหตุการณ์ล่าสุด','กรณีที่รองรับ'];document.getElementById('stats').innerHTML=vals.map((v,i)=>`<div class="stat" onclick="statClick(${i})"><div class="lbl">${labs[i]}</div><div class="num">${v}</div></div>`).join('')}
function statClick(i){if(i===2)location.hash='#/history';else if(i===3)location.hash='#/settings';else {location.hash='#/records';document.getElementById('search').value='';renderTableOnly()}}
function render(){tabs();stats();fillFilters();let list=state.active==='records';document.getElementById('mainPanel').hidden=!list;document.getElementById('secondaryPanel').hidden=list;if(list)renderTableOnly();else renderSecondary();renderIcons()}
function fillFilters(){let t=document.getElementById('typeFilter'),s=document.getElementById('statusFilter');let tv=t.value,sv=s.value;t.innerHTML='<option>ทุกประเภท</option>'+[...new Set(state.rows.map(r=>String(r.values[0])))].map(v=>`<option>${esc(v)}</option>`).join('');s.innerHTML='<option>ทุกสถานะ</option>'+[...new Set(state.rows.map(r=>String(r.values.at(-1))))].map(v=>`<option>${esc(v)}</option>`).join('');t.value=[...t.options].some(o=>o.value===tv)?tv:'ทุกประเภท';s.value=[...s.options].some(o=>o.value===sv)?sv:'ทุกสถานะ'}
function renderTableOnly(){let q=document.getElementById('search').value.toLowerCase().trim();let typ=document.getElementById('typeFilter').value;let sts=document.getElementById('statusFilter').value;let rows=state.rows.filter(r=>(!q||r.values.join(' ').toLowerCase().includes(q))&&(typ==='ทุกประเภท'||r.values[0].includes(typ))&&(sts==='ทุกสถานะ'||String(r.values.at(-1))===sts));rows.sort((a,b)=>String(a.values[state.sort]).localeCompare(String(b.values[state.sort]),'th',{numeric:true})*(state.asc?1:-1));document.getElementById('thead').innerHTML='<tr>'+CFG.cols.map((v,i)=>`<th onclick="setSort(${i})">${esc(v)} ${state.sort===i?(state.asc?'↑':'↓'):''}</th>`).join('')+'</tr>';document.getElementById('tbody').innerHTML=rows.map(r=>'<tr onclick="openView('+r.id+')">'+r.values.map((v,i)=>`<td>${i===CFG.cols.length-1&&CFG.code!=='F-ACC-VAL'?`<span class="pill ${String(v).includes('รอ')?'pending':''}">${esc(v)}</span>`:esc(v)}</td>`).join('')+'</tr>').join('');document.getElementById('empty').hidden=rows.length>0;document.getElementById('tableFoot').textContent=`แสดง ${rows.length} จาก ${state.rows.length} รายการ`;renderIcons()}
function setSort(i){state.asc=state.sort===i?!state.asc:true;state.sort=i;renderTableOnly()}
function clearFilters(){document.getElementById('search').value='';document.getElementById('typeFilter').selectedIndex=0;document.getElementById('statusFilter').selectedIndex=0;renderTableOnly()}
function fieldHtml(f,i,v){let type=f[2],name=f[1],id='f'+i;if(type==='status')return `<div class="field"><label for="${id}">${esc(name)}</label><input class="input" id="${id}" value="${esc(v)}" readonly></div>`;if(type==='abc'||type==='basis'||type==='context'){let opts=type==='abc'?['A','B','C']:type==='basis'?['มูลค่า','น้ำหนัก','ปริมาณ']:['รับของ','เก็บเข้า','ย้าย','นับ'];return `<div class="field"><label for="${id}">${esc(name)}</label><select class="select" id="${id}">${opts.map(o=>`<option ${o===v?'selected':''}>${o}</option>`).join('')}</select><div class="error" id="e${i}"></div></div>`}return `<div class="field"><label for="${id}">${esc(name)}</label><input class="input" id="${id}" type="${type}" value="${esc(v)}"><div class="error" id="e${i}"></div></div>`}
function showDrawer(title,body,footer,mode){state.mode=mode;document.getElementById('drawerTitle').textContent=title;document.getElementById('drawerBody').innerHTML=body;document.getElementById('drawerFooter').innerHTML=footer;document.getElementById('backdrop').classList.add('open');document.getElementById('drawer').classList.add('open');setTimeout(()=>document.querySelector('#drawer .input:not([readonly])')?.focus(),30)}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('backdrop').classList.remove('open');state.selected=null}
function openCreate(){let fs=CFG.fields.map((f,i)=>fieldHtml(f,i,''));showDrawer('สร้างรายการ',`<div class="fieldgrid">${fs.join('')}</div>`,`<button class="btn btn-ghost" onclick="closeDrawer()">ยกเลิก</button><span class="spacer"></span><button class="btn btn-primary" id="saveBtn" onclick="saveRecord()">บันทึก</button>`,'create')}
function openView(id){let r=state.rows.find(x=>x.id===id);if(!r)return;state.selected=id;let body=`<div class="kv">${CFG.fields.map((f,i)=>`<div><label>${esc(f[1])}</label><strong>${esc(r.values[i])}</strong></div>`).join('')}</div>`+domainView(r);let actions=`<button class="btn btn-ghost" onclick="closeDrawer()">ปิด</button><span class="spacer"></span><button class="btn" onclick="exportRows()">ส่งออก</button>`;if(CFG.code==='F-WH-QHOLD')actions+=`<button class="btn btn-primary" onclick="domainAction('release')">ขอปล่อยกัก</button>`;if(CFG.code==='F-WH-CYCLE')actions+=`<button class="btn btn-primary" onclick="domainAction('count')">บันทึกผลนับ</button>`;if(CFG.code==='F-ACC-LC')actions+=`<button class="btn btn-primary" onclick="domainAction('allocate')">คำนวณจัดสรร</button>`;showDrawer('รายละเอียด '+esc(r.values[0]),body,actions,'view')}
function domainView(r){let c=CFG.code;if(c==='F-WH-LOT')return `<div class="page-section"><h2>การอ้างอิงการเคลื่อนไหว</h2><div class="kv"><div><label>ต้นทาง</label><strong>GRN-2609-014 · อ้างอิง</strong></div><div><label>ปลายทาง</label><strong>Transfer-2609-009 · อ้างอิง</strong></div></div></div>`;if(c==='F-WH-QHOLD')return `<div class="page-section"><h2>ผลต่อความพร้อมขาย</h2><div class="kv"><div><label>On-hand</label><strong>${esc(r.values[3])}</strong></div><div><label>ATP</label><strong>0</strong></div></div><div class="actions"><button class="btn" onclick="domainAction('approve')">เลือกผู้อนุมัติ</button></div></div>`;if(c==='F-WH-CYCLE')return `<div class="page-section"><h2>ผลการนับ</h2><div class="field"><label>จำนวนที่นับได้</label><input class="input" id="countQty" type="number" min="0"></div></div>`;if(c==='F-ACC-LC')return `<div class="page-section"><h2>ตัวอย่างบรรทัด GRN</h2><div class="kv"><div><label>บรรทัด 1</label><strong>มูลค่า 600 · น้ำหนัก 6 · จำนวน 12</strong></div><div><label>บรรทัด 2</label><strong>มูลค่า 400 · น้ำหนัก 4 · จำนวน 8</strong></div></div><div id="calcResult"></div></div>`;return ''}
function collect(){return CFG.fields.map((f,i)=>document.getElementById('f'+i)?.value.trim()||'')}
function validate(v){let errs=[];CFG.fields.forEach((f,i)=>{if(f[2]!=='status'&&!v[i])errs.push([i,'กรุณากรอกข้อมูล'])});if(CFG.code==='F-WH-LOT'){if(v[2]&&state.rows.some(r=>r.values[1]===v[1]&&r.values[2]===v[2]))errs.push([2,'ซีเรียลนี้ถูกใช้แล้ว']);if(/นม|ข้าว/.test(v[1])&&!v[3])errs.push([3,'สินค้านี้ต้องมีวันหมดอายุ'])}if(CFG.code==='F-WH-ROP'){let a=+v[2],b=+v[3],s=+v[4];if(a<0||b<0||s<0||s>a||a>b)errs.push([4,'ต้องเป็น 0 ≤ safety ≤ min ≤ max'])}if(CFG.code==='F-WH-SCAN'){if(!['8850123450012','8850123450029'].includes(v[0]))errs.push([0,'ไม่พบบาร์โค้ดหรือ mapping ไม่ชัด'])}if(CFG.code==='F-WH-QHOLD'&&+v[3]<=0)errs.push([3,'จำนวนต้องมากกว่า 0']);if(CFG.code==='F-ACC-LC'&&+v[2]<=0)errs.push([2,'ต้นทุนต้องมากกว่า 0']);return errs}
function saveRecord(){let v=collect(),errs=validate(v);document.querySelectorAll('.error').forEach(x=>x.textContent='');if(errs.length){errs.forEach(([i,s])=>{let e=document.getElementById('e'+i);if(e)e.textContent=s});toast('ตรวจสอบข้อมูลที่กรอก');return}let key=v.join('|');if(key===state.lastKey){toast('รายการนี้ส่งแล้ว');return}state.lastKey=key;let btn=document.getElementById('saveBtn');btn.disabled=true;btn.textContent='กำลังบันทึก…';setTimeout(()=>{v[v.length-1]=CFG.code==='F-WH-SCAN'?'รับข้อมูล':CFG.code==='F-WH-QHOLD'?'รออนุมัติ':CFG.code==='F-WH-CYCLE'?'รอนับ':CFG.code==='F-ACC-LC'?'รอตรวจ':v[v.length-1]||'พร้อมใช้';state.rows.unshift({id:Date.now(),values:v});state.history.unshift({at:new Date().toISOString(),action:'สร้างรายการ',ref:v[0]});closeDrawer();render();toast('บันทึกแล้ว')},300)}

ath.round((total-a)*100)/100;document.getElementById('calcResult').innerHTML=`<div class="actions"><strong>จัดสรร ${a.toFixed(2)} + ${b.toFixed(2)} = ${total.toFixed(2)}</strong></div>`;state.history.unshift({at:new Date().toISOString(),action:'คำนวณตัวอย่างจัดสรร',ref:r.values[0]})}
}
