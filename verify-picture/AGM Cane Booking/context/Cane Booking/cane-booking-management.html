<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จัดการจองรอบส่งอ้อย (CBM) · CUBE NATIVE</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">

<style>
/* ============== CSS VARIABLES (CUBE CI — Warm Light) ============== */
:root {
  --c-navy: #111111;
  --c-navy-2: #111111;
  --c-primary: #FF3B30;
  --c-primary-hover: #E62E24;
  --c-teal: #FF9A1F;
  --c-teal-light: #FFB763;
  --c-ink: #111111;
  --c-mute: #54565C;
  --c-mute-2: #73757B;
  --c-mute-3: #9A9CA2;
  --c-line: #DEDAD4;
  --c-line-2: #E9E5E0;
  --c-line-3: #F1EEEA;
  --c-bg-off: #FAF8F5;
  --c-success: #1F9D55;
  --c-warning: #E8870F;
  --c-danger: #E62E24;
  --sidebar-w: 232px;
  --shell-h: 52px;
  --fs-h1: 22px; --fs-h2: 17px; --fs-h3: 15px; --fs-body: 14px;
  --fs-sub: 13px; --fs-meta: 12px; --fs-cap: 11px; --fs-kpi: 28px;
  --sp-xs: 4px; --sp-sm: 8px; --sp-md: 12px; --sp-lg: 20px; --sp-xl: 28px;
  --r-xs: 4px; --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-full: 999px;
}

/* ============== RESET ============== */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { scrollbar-gutter: stable; }

/* ============== SCROLLBAR (Iron Rule #49) ============== */
* { scrollbar-width: thin; scrollbar-color: rgba(17,17,17,.16) transparent; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(17,17,17,.14); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: rgba(17,17,17,.26); }
.sidebar, .slide { scrollbar-color: rgba(255,255,255,.28) transparent; }
.sidebar ::-webkit-scrollbar-thumb, .slide ::-webkit-scrollbar-thumb,
.sidebar::-webkit-scrollbar-thumb, .slide::-webkit-scrollbar-thumb { background: rgba(255,255,255,.28); }
.sidebar ::-webkit-scrollbar-thumb:hover, .slide ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.42); }
body {
  font-family: 'Satoshi', 'Noto Sans Thai', system-ui, sans-serif;
  background: var(--c-bg-off);
  color: #2A2B2F;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-width: 1180px;
}
a { text-decoration: none; color: inherit; }
button { font-family: inherit; cursor: pointer; }
[data-lucide] { flex-shrink: 0; }
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; }

/* ============== SIDEBAR ============== */
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--sidebar-w);
  background: #111111; color: #E9E5E0; z-index: 20;
  display: flex; flex-direction: column;
  border-right: 1px solid rgba(255,255,255,0.06);
}
.sb-brand { padding: 18px; display: flex; align-items: center; gap: 11px; border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; }
.sb-logo {
  width: 34px; height: 34px; background: linear-gradient(135deg, #FF3B30, #FF9A1F);
  border-radius: 9px; display: inline-flex; align-items: center; justify-content: center;
  color: #fff; flex-shrink: 0; box-shadow: 0 4px 12px rgba(255,59,48,0.3);
}
.sb-name { font-weight: 700; font-size: 14px; color: #fff; letter-spacing: -0.01em; line-height: 1.2; }
.sb-sub { font-size: 10px; color: #9A9CA2; letter-spacing: 0.06em; font-weight: 600; text-transform: uppercase; margin-top: 2px; }
.sb-nav { flex: 1; padding: 12px 8px; overflow-y: auto; }
.sb-module { margin-bottom: 4px; }
.sb-module-header {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 8px 10px; border-radius: 6px; background: transparent; border: 0;
  color: #9A9CA2; font-family: inherit; font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: all 120ms; text-align: left;
}
.sb-module-header:hover { background: rgba(255,255,255,0.04); color: #DEDAD4; }
.sb-module-header .mod-icon { flex-shrink: 0; opacity: 0.7; }
.sb-module-header .mod-label { flex: 1; }
.sb-module-header .mod-chevron { flex-shrink: 0; transition: transform 200ms; opacity: 0.7; }
.sb-module[data-expanded="false"] .mod-chevron { transform: rotate(-90deg); }
.sb-module[data-expanded="false"] .sb-features { display: none; }
.sb-features { padding: 2px 0 6px 0; }
.sb-item {
  display: flex; align-items: center; gap: 10px; padding: 7px 12px 7px 14px;
  border-radius: 6px; color: #DEDAD4; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all 120ms; margin-bottom: 1px; position: relative; user-select: none;
}
.sb-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.sb-item.is-active { background: #FF3B30; color: #fff; font-weight: 600; }
.sb-item.is-active::before {
  content: ''; position: absolute; left: -10px; top: 7px; bottom: 7px;
  width: 3px; background: #fff; border-radius: 0 2px 2px 0;
}
.sb-item [data-lucide] { width: 16px; height: 16px; opacity: 0.85; }
.sb-item.is-active [data-lucide] { opacity: 1; }
.sb-item.is-disabled { opacity: 0.4; cursor: not-allowed; }
.sb-item.is-disabled:hover { background: transparent; color: #DEDAD4; }
.sb-footer {
  padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.06);
  display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: #9A9CA2;
}
.pulse-dot { width: 7px; height: 7px; background: var(--c-teal); border-radius: 50%; box-shadow: 0 0 0 3px rgba(255,154,31,0.20); animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

/* ============== MAIN + SHELL BAR ============== */
.main { margin-left: var(--sidebar-w); min-height: 100vh; background: var(--c-bg-off); }
.shell-bar {
  position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--c-line-2);
  height: var(--shell-h); display: flex; align-items: center; padding: 0 22px; z-index: 19; gap: 12px;
}
.breadcrumb { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--c-mute); }
.breadcrumb a { cursor: pointer; transition: color 120ms; }
.breadcrumb a:hover { color: var(--c-primary); }
.breadcrumb .sep { color: var(--c-mute-3); font-size: 10px; }
.breadcrumb-current { color: var(--c-ink); font-weight: 500; }
.icon-btn {
  width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border: 0; color: var(--c-mute); border-radius: 7px; position: relative; transition: all 120ms;
}
.icon-btn:hover { background: var(--c-line-3); color: var(--c-ink); }
.icon-btn [data-lucide] { width: 17px; height: 17px; }
.notif-dot { position: absolute; top: 7px; right: 8px; width: 7px; height: 7px; background: var(--c-danger); border-radius: 50%; border: 2px solid #fff; }
.user-chip { display: flex; align-items: center; gap: 9px; padding: 5px 10px 5px 12px; border-radius: 8px; cursor: pointer; transition: background 120ms; }
.user-chip:hover { background: var(--c-line-3); }
.user-text { line-height: 1.2; text-align: right; }
.user-name { font-size: 12.5px; font-weight: 500; color: var(--c-ink); white-space: nowrap; }
.user-role { font-size: 10.5px; color: var(--c-mute-2); white-space: nowrap; margin-top: 1px; }
.avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: linear-gradient(135deg, var(--c-primary), var(--c-teal));
  color: #fff; display: inline-flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600; flex-shrink: 0;
}
.user-menu {
  position: absolute; top: calc(var(--shell-h) - 4px); right: 22px; background: #fff;
  border: 1px solid var(--c-line-2); border-radius: 10px; box-shadow: 0 12px 32px rgba(17,17,17,0.12);
  width: 240px; z-index: 30; padding: 6px; display: none;
}
.user-menu.is-open { display: block; }
.user-menu-item { display: flex; align-items: center; gap: 10px; padding: 8px 11px; border-radius: 6px; font-size: 13px; color: var(--c-ink); cursor: pointer; transition: background 120ms; }
.user-menu-item:hover { background: var(--c-bg-off); }
.user-menu-item [data-lucide] { width: 15px; height: 15px; color: var(--c-mute-2); }
.user-menu-item.is-danger { color: var(--c-danger); }
.user-menu-item.is-danger [data-lucide] { color: var(--c-danger); }
.user-menu-divider { height: 1px; background: var(--c-line-2); margin: 5px 0; }

/* ============== CONTENT (fluid — Iron Rule #30) ============== */
.content { padding: 22px; }

/* ============== PAGE HEADER ============== */
.ph { margin-bottom: 18px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 14px; }
.ph > div:first-child { flex: 1 1 auto; min-width: 280px; }
.ph-title-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 5px; }
.ph-title { font-family: 'Noto Sans Thai', sans-serif; font-size: 22px; font-weight: 700; color: var(--c-navy); margin: 0; letter-spacing: -0.01em; }
.ph-count { font-size: 12.5px; font-weight: 600; color: var(--c-mute-2); background: var(--c-line-3); padding: 3px 9px; border-radius: 999px; }
.ph-sub { font-size: 13px; color: var(--c-mute); margin: 0; }
.ph-actions { display: flex; gap: 8px; flex-shrink: 0; }

/* ============== BUTTONS (Iron Rule #36 — Thai optical center) ============== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 36px; padding: 2px 14px 0; border-radius: 8px; font-size: 13px; font-weight: 500;
  border: 1px solid transparent; background: transparent; white-space: nowrap;
  transition: all 120ms; user-select: none; cursor: pointer;
}
.btn [data-lucide] { width: 15px; height: 15px; flex-shrink: 0; }
.btn:disabled, .btn.is-disabled { opacity: .55; cursor: not-allowed; pointer-events: none; }
.btn-eq { min-width: 104px; }
.btn-primary { background: var(--c-primary); color: #fff; }
.btn-primary:hover { background: var(--c-primary-hover); box-shadow: 0 2px 8px rgba(255,59,48,0.30); }
.btn-secondary { background: #fff; border-color: var(--c-line); color: var(--c-ink); }
.btn-secondary:hover { background: var(--c-line-3); border-color: var(--c-mute-2); }
.btn-ghost { color: var(--c-mute); }
.btn-ghost:hover { background: var(--c-line-3); color: var(--c-ink); }
.btn-danger { background: #fff; border-color: var(--c-line); color: var(--c-danger); }
.btn-danger:hover { background: #FFE9E7; border-color: var(--c-danger); }
.btn-danger.is-solid { background: var(--c-danger); border-color: var(--c-danger); color: #fff; }
.btn-danger.is-solid:hover { background: #C81E15; }
.btn-link { background: transparent; border: 0; padding: 0 4px; height: auto; color: var(--c-primary); font-weight: 500; }
.btn-link:hover { text-decoration: underline; }
.btn-sm { height: 30px; padding: 2px 11px 0; font-size: 12px; }

/* ============== STATS ============== */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 18px; }
.stat { background: #fff; border: 1px solid var(--c-line-2); border-radius: 10px; padding: 14px 16px; transition: all 150ms; }
.stat:hover { border-color: var(--c-line); box-shadow: 0 2px 8px rgba(17,17,17,0.05); }
.stat-label { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--c-mute); }
.stat-label [data-lucide] { width: 13px; height: 13px; color: var(--c-primary); }
.stat-value { font-family: 'Noto Sans Thai', sans-serif; font-size: 26px; font-weight: 700; color: var(--c-navy); margin-top: 6px; letter-spacing: -0.01em; }
.stat-meta { font-size: 11.5px; color: var(--c-mute-2); margin-top: 5px; display: flex; align-items: center; gap: 4px; }
.stat-meta.is-warn { color: var(--c-warning); }
.stat-meta [data-lucide] { width: 12px; height: 12px; }

/* ============== CARD / FILTER ============== */
.card { background: #fff; border: 1px solid var(--c-line-2); border-radius: 10px; overflow: hidden; }
.filter-bar { padding: 14px 18px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--c-line-2); background: #fff; flex-wrap: wrap; }

/* ============== INPUTS ============== */
.input, .select {
  height: 36px; padding: 0 12px; border: 1px solid var(--c-line); border-radius: 8px;
  font-size: 13px; background: #fff; color: var(--c-ink); font-family: inherit; transition: all 120ms; width: 100%;
}
.input:focus, .select:focus { outline: none; border-color: var(--c-primary); box-shadow: 0 0 0 3px rgba(255,59,48,0.10); }
.input:disabled, .input[readonly] { background: var(--c-line-3); color: var(--c-mute-2); cursor: not-allowed; border-color: var(--c-line-2); }
.select {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2364748B' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat; background-position: right 10px center; padding-right: 32px; appearance: none;
}
.input-search { position: relative; flex: 1; max-width: 340px; }
.input-search input { padding-left: 36px; }
.input-search .lead-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--c-mute-2); pointer-events: none; }

/* ===== SEARCH-SELECT (Iron Rule #34) ===== */
.search-select { position: relative; width: 100%; }
.search-select .ss-input { padding-left: 34px; padding-right: 34px; }
.search-select .ss-lead { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--c-mute-3); pointer-events: none; }
.search-select .ss-caret { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--c-mute-3); pointer-events: none; }
.search-select .ss-clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: inline-flex; padding: 3px; border: 0; background: transparent; color: var(--c-mute-2); cursor: pointer; border-radius: 6px; }
.search-select .ss-clear:hover { background: var(--c-line-3); color: var(--c-ink); }
.search-select.is-disabled .ss-input { background: var(--c-line-3); color: var(--c-mute-2); cursor: not-allowed; }
.ss-list {
  position: absolute; z-index: 70; left: 0; right: 0; margin-top: 4px; max-height: 280px; overflow-y: auto;
  background: #fff; border: 1px solid var(--c-line); border-radius: 8px;
  box-shadow: 0 10px 30px rgba(17,17,17,0.10), 0 4px 10px rgba(17,17,17,0.05);
}
.ss-opt { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 0; border-bottom: 1px solid var(--c-line-3); background: transparent; cursor: pointer; text-align: left; font-family: inherit; }
.ss-opt:last-child { border-bottom: 0; }
.ss-opt:hover, .ss-opt.is-active { background: rgba(255,59,48,0.06); }
.ss-opt-ic { width: 16px; height: 16px; color: var(--c-primary); flex-shrink: 0; }
.ss-opt-main { flex: 1; min-width: 0; }
.ss-opt-label { display: block; font-size: 13px; color: var(--c-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ss-opt-sub { display: block; font-size: 11.5px; color: var(--c-mute-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ss-opt-right { flex-shrink: 0; font-size: 12px; color: var(--c-mute); }
.ss-opt mark { background: rgba(255,59,48,0.16); color: inherit; padding: 0 1px; border-radius: 2px; }
.ss-empty { padding: 20px 14px; text-align: center; font-size: 13px; color: var(--c-mute-2); }

/* ============== TABLE ============== */
.table-scroll { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table thead { background: var(--c-bg-off); }
.table th {
  padding: 11px 14px; text-align: left; font-weight: 600; color: var(--c-mute);
  font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em;
  border-bottom: 1px solid var(--c-line-2); white-space: nowrap;
}
.table th.col-check { width: 40px; padding-right: 0; }
.table td { padding: 13px 14px 11px; border-bottom: 1px solid var(--c-line-2); color: var(--c-ink); vertical-align: middle; }
.table tbody tr { transition: background 120ms; }
.table tbody tr:hover { background: var(--c-bg-off); }
.table tbody tr.is-selected { background: rgba(255,59,48,0.04); }
.table tbody tr.is-selected:hover { background: rgba(255,59,48,0.07); }
.table tbody tr:last-child td { border-bottom: 0; }
.table tbody tr.is-clickable { cursor: pointer; }
.table-scroll.is-sticky { max-height: 560px; overflow-y: auto; scrollbar-gutter: stable; }
.table-scroll.is-sticky thead th { position: sticky; top: 0; z-index: 3; background: var(--c-bg-off); box-shadow: inset 0 -1px 0 var(--c-line-2); }
.cell-truncate { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
th.col-num, td.col-num { text-align: right; }
.mono { font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }

/* ============== CHECKBOX ============== */
.cb {
  width: 16px; height: 16px; border: 1.5px solid var(--c-line); border-radius: 4px; background: #fff;
  cursor: pointer; display: inline-block; position: relative; transition: all 120ms; flex-shrink: 0;
}
.cb.is-checked, .cb.is-partial { background: var(--c-primary); border-color: var(--c-primary); }
.cb.is-checked::after { content: ''; position: absolute; left: 4px; top: 1px; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.cb.is-partial::after { content: ''; position: absolute; left: 3px; top: 6px; width: 8px; height: 2px; background: #fff; }
.cb:hover { border-color: var(--c-primary); }
.cb.is-disabled { opacity: 0.35; cursor: not-allowed; }
.cb.is-disabled:hover { border-color: var(--c-line); }

/* ============== PILLS ============== */
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px 3px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.pill [data-lucide] { width: 11px; height: 11px; }
.pill-info    { background: #E6F0FF; color: #1A5FCC; }
.pill-success { background: #E4F4EB; color: #157A41; }
.pill-warning { background: #FFF1DD; color: #B8690B; }
.pill-danger  { background: #FFE9E7; color: #E62E24; }
.pill-muted   { background: var(--c-line-3); color: var(--c-mute-2); }
.pill-outline { background: #fff; border: 1px solid var(--c-line); color: var(--c-mute); }

@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 0.8s linear infinite; }

/* ============== FORM SECTION (Iron Rule #45) ============== */
.form-section { margin-top: var(--sp-xl); }
.form-section:first-child { margin-top: 0; }
.form-section-title {
  font-size: var(--fs-cap); font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--c-mute);
  padding-bottom: var(--sp-sm); border-bottom: 1px solid var(--c-line-2); margin-bottom: var(--sp-md);
}
.form-grp { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 16px; }

/* ============== ROW ACTIONS ============== */
.row-actions { display: inline-flex; gap: 2px; }
.ra-btn {
  width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border: 0; color: var(--c-mute-2); border-radius: 6px; transition: all 120ms;
}
.ra-btn:hover { background: var(--c-line-3); color: var(--c-primary); }
.ra-btn.is-danger:hover { background: #FFE9E7; color: var(--c-danger); }
.ra-btn [data-lucide] { width: 15px; height: 15px; }

/* ============== TABLE FOOTER / BULK BAR ============== */
.table-footer {
  padding: 12px 18px; background: var(--c-bg-off); border-top: 1px solid var(--c-line-2);
  display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--c-mute); flex-wrap: wrap; gap: 10px;
}
.pagination { display: inline-flex; gap: 4px; align-items: center; }
.pg-btn {
  min-width: 30px; height: 30px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center;
  background: #fff; border: 1px solid var(--c-line-2); border-radius: 6px; color: var(--c-mute);
  font-size: 12.5px; font-weight: 500; cursor: pointer; transition: all 120ms;
}
.pg-btn:hover { border-color: var(--c-line); background: var(--c-bg-off); }
.pg-btn.is-active { background: var(--c-primary); border-color: var(--c-primary); color: #fff; }
.pg-btn.is-disabled { opacity: 0.4; cursor: not-allowed; }
.pg-btn [data-lucide] { width: 13px; height: 13px; }
.bulk-bar {

function seedBooking(seq, qid, stage, o){
  o = o || {};
  var qq = findQuota(qid);
  var t0 = daysAgo(o.age || 12);
  var b = {
    booking_id:'CBM-2568-'+String(seq).padStart(7,'0'), seq:seq,
    quota_id:qid, crop_id:o.crop || null,
    farmer_name:qq.farmer_name, farmer_lastname:qq.lastname, farmer_phone:qq.phone,
    season:o.season || '2568/69', location:o.location || 'factory',
    booking_datetime:o.dt || dtDaysFwd(2), slot:o.slot || '08:00-10:00', lane:o.lane || 'A1',
    vehicle_type:o.vt || 'six_wheels', vehicle_plate:o.plate || '70-1234 กจ', driver:o.driver || 'สมศักดิ์ ขับดี',
    estimated_tons:o.tons != null ? o.tons : 18.50,
    payment_type:o.pay || 'green_bill', debt_deduction_percent:o.debt != null ? o.debt : 0,
    debtor_outstanding:qq.outstanding,
    cutting_method:o.cm || 'person', cutting_summary:o.cs || '',
    // AXIS A / B / C (invariants §1)
    approval_status:'waiting_for_verify', cut_transport_status:null, cut_transport_closed_at:null,
    payment_status:'not_due', dispatch_started_at:null, checkin_at:null, dump_result_confirmed:false,
    reject_reason:null, cancel_reason:null,
    row_version:1, created_at:t0, updated_at:t0, created_by:CURRENT_USER.name,
    history:[{ event:'create', actor:CURRENT_USER.name, at:t0, note:'สร้างการจอง · โควตา '+qid }]
  };
  function adv(ev, actor, note, dot){ var at=daysAgo(Math.max(0,(o.age||12)-b.history.length*1)); b.updated_at=at; b.row_version++; b.history.push({event:ev,actor:actor,at:at,note:note||null,dot:dot||null}); }
  var s = stage;
  if(s==='rejected'){ b.approval_status='rejected'; b.reject_reason=o.reason||'ข้อมูลทะเบียนรถไม่ตรงกับที่แจ้ง กรุณาแก้ไขและส่งใหม่'; adv('reject',CURRENT_USER.name,b.reject_reason,'is-danger'); return b; }
  if(s==='cancelled'){ b.approval_status='cancelled'; b.cancel_reason=o.reason||'เกษตรกรขอยกเลิกรอบส่ง'; adv('cancel',CURRENT_USER.name,b.cancel_reason,'is-warning'); return b; }
  if(s==='waiting') return b;
  b.approval_status='verified'; adv('approve',CURRENT_USER.name,'อนุมัติรอบจอง','is-success');
  if(s==='verified_nocut') return b;
  b.cut_transport_status='awaiting_cut_approval'; adv('cut_send',CURRENT_USER.name,'ส่งขออนุมัติตัด');
  if(s==='cut_approval') return b;
  b.cut_transport_status='awaiting_cutting'; adv('cut_approve','ผจก.แปลงตัด','อนุมัติตัด');
  if(s==='cutting') return b;
  b.cut_transport_status='awaiting_dispatch'; b.cutting_summary=o.cs||'ตัดด้วยแรงงานคน 6 คน · เสร็จตามแผน'; adv('cut_finish','ผจก.แปลงตัด','จบการตัด');
  if(s==='dispatch') return b;
  b.cut_transport_status='dispatching'; b.dispatch_started_at=daysAgo(1); adv('dispatch_start','ผจก.จัดส่ง','เริ่มจัดส่ง');
  if(s==='dispatching') return b;
  b.checkin_at=daysAgo(1); adv('checkin',SYS_ACTOR,'เช็คอินโรงงาน (ระบบ)','is-success');
  if(s==='checkin') return b;
  b.cut_transport_closed_at=daysAgo(0); b.payment_status='awaiting_payment'; b.dump_result_confirmed=true; adv('receiving',SYS_ACTOR,'รับอ้อยเสร็จ — ปิดงานขนส่ง + ตั้งรอทำจ่าย (ระบบ)','is-success');
  if(s==='payment') return b;
  b.payment_status='completed'; adv('payment',SYS_ACTOR,'จ่ายเงินเสร็จ (ระบบ)','is-success');
  return b;
}

// ============================================
// DERIVATION — combinedProgress + per-axis display (invariants §2 · §5)
// ============================================
function combinedProgress(b){
  if(b.approval_status==='rejected') return 'ปฏิเสธ';
  if(b.approval_status==='cancelled') return 'ยกเลิก';
  if(b.approval_status!=='verified') return 'รออนุมัติ';
  if(b.cut_transport_status==null) return 'รอส่งอนุมัติตัด';
  if(b.cut_transport_status==='awaiting_cut_approval') return 'รออนุมัติตัด';
  if(b.cut_transport_status==='awaiting_cutting') return 'รอตัด';
  if(b.cut_transport_status==='awaiting_dispatch') return 'รอจัดส่ง';
  if(b.cut_transport_status==='dispatching' && !b.checkin_at) return 'อยู่ระหว่างจัดส่ง';
  if(b.checkin_at && !b.dump_result_confirmed && b.payment_status==='not_due') return 'รอผลการเท';
  if(b.payment_status==='awaiting_payment') return 'รอทำจ่าย';
  if(b.payment_status==='completed') return 'เสร็จสิ้น';
  return 'รออนุมัติ';
}
// combined chip — color by phase family (approval=warning/success · cut=info · payment=warning/success)
function combinedPill(b){
  var lbl=combinedProgress(b);
  var map={
    'ปฏิเสธ':'pill-danger','ยกเลิก':'pill-muted',
    'รออนุมัติ':'pill-warning','อนุมัติรอบจองแล้ว':'pill-success',
    'รอส่งอนุมัติตัด':'pill-outline','รออนุมัติตัด':'pill-info','รอตัด':'pill-info','รอจัดส่ง':'pill-info','อยู่ระหว่างจัดส่ง':'pill-info',
    'รอผลการเท':'pill-warning','รอทำจ่าย':'pill-warning','เสร็จสิ้น':'pill-success'
  };
  var sys=SYS_STEP[lbl];
  return '<span class="pill '+(map[lbl]||'pill-muted')+'">'+esc(lbl)+(sys?' <i data-lucide="lock" class="w-2.5 h-2.5"></i>':'')+'</span>';
}
// Axis A — approval (verified label = "อนุมัติรอบจองแล้ว" · LOCK-07)
function statusLabel(st){ return ({waiting_for_verify:'รออนุมัติ',verified:'อนุมัติรอบจองแล้ว',rejected:'ปฏิเสธ',cancelled:'ยกเลิก'})[st]||st; }
function displayApproval(b){ var c=({waiting_for_verify:'pill-warning',verified:'pill-success',rejected:'pill-danger',cancelled:'pill-muted'})[b.approval_status]||'pill-muted'; return '<span class="pill '+c+'">'+statusLabel(b.approval_status)+'</span>'; }
// Axis B — cut & transport
function cutLabel(st){ return ({awaiting_cut_approval:'รออนุมัติตัด',awaiting_cutting:'รอตัด',awaiting_dispatch:'รอจัดส่ง',dispatching:'อยู่ระหว่างจัดส่ง'})[st]||st; }
function displayCut(b){
  if(b.approval_status!=='verified') return '<span class="text-mute-2">-</span>';
  if(b.cut_transport_closed_at!=null) return '<span class="pill pill-success">ปิดงานขนส่ง <i data-lucide="lock" class="w-2.5 h-2.5"></i></span>';
  if(b.cut_transport_status==null) return '<span class="pill pill-outline">รอส่งอนุมัติตัด</span>';
  return '<span class="pill pill-info">'+cutLabel(b.cut_transport_status)+'</span>';
}
// Axis C — payment (system badge 🔒 · "-" ก่อนแกน B ปิด)
function displayPayment(b){
  if(b.cut_transport_closed_at==null) return '<span class="text-mute-2">-</span>';
  if(b.payment_status==='awaiting_payment') return '<span class="pill pill-warning">รอทำจ่าย <i data-lucide="lock" class="w-2.5 h-2.5"></i></span>';
  if(b.payment_status==='completed') return '<span class="pill pill-success">เสร็จสิ้น <i data-lucide="lock" class="w-2.5 h-2.5"></i></span>';
  return '<span class="text-mute-2">-</span>';
}
// print gate ranks (BR-07)
function cutRank(b){ if(!b.cut_transport_status)return 0; return ({awaiting_cut_approval:1,awaiting_cutting:2,awaiting_dispatch:3,dispatching:4})[b.cut_transport_status]||0; }
function canPrintCut(b){ return cutRank(b)>=2; }
function canPrintDlv(b){ return cutRank(b)>=3; }
function isTerminal(b){ return b.approval_status==='rejected'||b.approval_status==='cancelled'; }
function isCompleted(b){ return b.payment_status==='completed'; }

function getRoute(){ var h=location.hash; if(!h||h==='#'||h==='#/')return 'bookings'; return h.replace(/^#\//,''); }
function navigate(r){ location.hash='#/'+r; }

// ============================================
// LIST FILTER / PAGE / SORT
// ============================================
function getFiltered(){
  var arr=state.records.slice();
  if(state.filters.season!=='all') arr=arr.filter(b=>b.season===state.filters.season);
  if(state.filters.approval!=='all') arr=arr.filter(b=>b.approval_status===state.filters.approval);
  if(state.filters.cut!=='all'){
    var f=state.filters.cut;
    arr=arr.filter(function(b){
      if(f==='not_started') return b.approval_status!=='verified';            // แสดง "-"
      if(f==='pending_send') return b.approval_status==='verified'&&b.cut_transport_status==null; // รอส่งอนุมัติตัด
      if(f==='closed') return b.cut_transport_closed_at!=null;
      return b.cut_transport_status===f;
    });
  }
  if(state.filters.payment!=='all'){
    var p=state.filters.payment;
    arr=arr.filter(function(b){
      if(p==='not_started') return b.cut_transport_closed_at==null;            // แสดง "-"
      return b.cut_transport_closed_at!=null && b.payment_status===p;
    });
  }
  if(state.filters.search){
    var q=state.filters.search.toLowerCase().trim();
    arr=arr.filter(b=> b.booking_id.toLowerCase().includes(q)||String(b.quota_id).toLowerCase().includes(q)||(b.farmer_name+' '+b.farmer_lastname).toLowerCase().includes(q)||String(b.vehicle_plate).toLowerCase().includes(q) );
  }
  if(state.sort.col){ var col=state.sort.col; arr=arr.slice().sort(function(a,b){ var r; if(col==='updated_at'){ r=new Date(a[col])-new Date(b[col]); } else { r=String(a[col]==null?'':a[col]).localeCompare(String(b[col]==null?'':b[col]),'th'); } return state.sort.dir==='asc'?r:-r; }); }
  return arr;
}
function getPaged(){ var all=getFiltered(); var pg=state.pagination.page,ps=state.pagination.pageSize; var s=(pg-1)*ps; return {records:all.slice(s,s+ps),total:all.length,page:pg,totalPages:Math.max(1,Math.ceil(all.length/ps)),start:all.length===0?0:s+1,end:Math.min(s+ps,all.length)}; }
function sortBy(c){ if(state.sort.col===c)state.sort.dir=state.sort.dir==='asc'?'desc':'asc'; else{state.sort.col=c;state.sort.dir='asc';} render(); }
function toggleSelect(id){ if(state.selectedIds.has(id))state.selectedIds.delete(id); else state.selectedIds.add(id); render(); }
function toggleSelectAll(){ var sel=getPaged().records.filter(b=>b.approval_status==='waiting_for_verify'); var all=sel.length>0&&sel.every(b=>state.selectedIds.has(b.booking_id)); if(all)sel.forEach(b=>state.selectedIds.delete(b.booking_id)); else sel.forEach(b=>state.selectedIds.add(b.booking_id)); render(); }
function goToPage(n){ var tp=getPaged().totalPages; if(n<1||n>tp)return; state.pagination.page=n; render(); }
function resetFilters(){ state.filters={search:'',season:'all',approval:'all',cut:'all',payment:'all'}; state.pagination.page=1; state.selectedIds.clear(); render(); }
var _st=null; function onSearchInput(v){ clearTimeout(_st); _st=setTimeout(function(){ state.filters.search=v; state.pagination.page=1; render(); },300); }
function setFilter(k,v){ state.filters[k]=v; state.pagination.page=1; render(); }

// RENDER PRESERVATION
function preserveState(){ var a=document.activeElement; var isI=a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'); return { pageScroll:window.scrollY, focusKey:isI?{id:a.id||'',placeholder:a.placeholder||'',selStart:a.selectionStart,selEnd:a.selectionEnd}:null }; }
function restoreState(s){ if(!s)return; requestAnimationFrame(function(){ if(s.pageScroll>0)window.scrollTo(0,s.pageScroll); if(s.focusKey){ var c=s.focusKey.id?document.getElementById(s.focusKey.id):null; if(!c){var cs=document.querySelectorAll('input,textarea'); for(var i=0;i<cs.length;i++){ if((cs[i].placeholder||'')===s.focusKey.placeholder){c=cs[i];break;} }} if(c){ c.focus(); if(s.focusKey.selStart!=null&&c.setSelectionRange){ try{c.setSelectionRange(s.focusKey.selStart,s.focusKey.selEnd);}catch(e){} } } } }); }

function emptyStateHTML(cfg){ cfg=cfg||{}; var acts=''; if(cfg.actions){ acts='<div class="empty-actions">'+cfg.actions.map(function(a){ return '<button class="btn '+(a.cls||'btn-primary')+'" onclick="'+a.onAction+'">'+(a.icon?'<i data-lucide="'+a.icon+'" class="w-4 h-4"></i>':'')+'<span>'+a.label+'</span></button>'; }).join('')+'</div>'; } return '<div class="empty"><div class="empty-icon"><i data-lucide="'+(cfg.icon||'inbox')+'" class="w-5 h-5"></i></div><div class="empty-title">'+(cfg.title||'ยังไม่มีข้อมูล')+'</div><div class="empty-desc">'+(cfg.desc||'')+'</div>'+acts+'</div>'; }

    return '<tr class="is-clickable '+(state.selectedIds.has(b.booking_id)?'is-selected':'')+'" onclick="openView(\''+b.booking_id+'\')">'
      +'<td onclick="event.stopPropagation()"><div class="cb '+(state.selectedIds.has(b.booking_id)?'is-checked':'')+(can?'':' is-disabled')+'" '+(can?'onclick="toggleSelect(\''+b.booking_id+'\')"':'title="เลือกได้เฉพาะรายการรออนุมัติ"')+'></div></td>'

      +'<td><div style="font-weight:600;">'+esc(b.farmer_name+' '+b.farmer_lastname)+'</div><div class="mono" style="font-size:11.5px;color:var(--c-mute-2);">'+esc(b.quota_id)+'</div></td>'

      +'<td><div>'+fmtDateTime(b.booking_datetime)+'</div><div style="font-size:11.5px;color:var(--c-mute-2);">เลน '+esc(b.lane)+' · '+esc(b.slot)+'</div></td>'

      +'<td>'+displayApproval(b)+'</td>'
      +'<td>'+displayCut(b)+'</td>'
      +'<td>'+displayPayment(b)+'</td>'
      +'<td>'+combinedPill(b)+'</td>'
      +'<td onclick="event.stopPropagation()"><div style="display:flex;gap:5px;">'+cutBtn+dlvBtn+'</div></td>'
      +'<td onclick="event.stopPropagation()" style="text-align:right;width:56px;"><div class="row-actions">'
      +'<button class="ra-btn" onclick="openView(\''+b.booking_id+'\')" title="ดูรายละเอียด"><i data-lucide="pencil" class="w-4 h-4"></i></button>'
      +'</div></td></tr>';
  }).join('');

function unmountOverlay(){ document.getElementById('overlay-root').innerHTML=''; }
function mountPanel(cid){ document.getElementById('overlay-root').innerHTML='<div class="overlay-wrap"><div class="backdrop" onclick="closeTopDrawer()"></div><div id="drawer-panel" class="drawer-panel drawer-enter"><div id="'+cid+'" style="display:flex;flex-direction:column;height:100%;"></div></div></div>'; var p=document.getElementById('drawer-panel'); requestAnimationFrame(()=>p.classList.add('drawer-active')); }

function stepperHTML(b){
  var cur=STEPS.indexOf(combinedProgress(b)); var terminal=isTerminal(b);
  var html='<div style="display:flex;align-items:flex-start;overflow-x:auto;padding:6px 2px 2px;">';
  STEPS.forEach(function(lbl,i){
    if(i>0){ var lc=(!terminal&&i<=cur)?'var(--c-success)':'var(--c-line-2)'; html+='<div style="flex:1;height:2px;background:'+lc+';margin-top:13px;min-width:10px;"></div>'; }
    var st = terminal ? 'future' : (i<cur?'done':(i===cur?'current':'future'));
    var sys=SYS_STEP[lbl];
    var bg = st==='done'?'var(--c-success)':(st==='current'?'var(--c-primary)':'#fff');
    var bd = st==='future'?'var(--c-line)':(st==='done'?'var(--c-success)':'var(--c-primary)');
    var col = st==='future'?'var(--c-mute-3)':(st==='current'?'var(--c-primary)':'var(--c-ink)');
    var inner;
    if(st==='done') inner='<i data-lucide="check" class="w-3 h-3" style="color:#fff;"></i>';
    else if(sys) inner='<i data-lucide="lock" class="w-3 h-3" style="color:'+(st==='current'?'#fff':'var(--c-mute-3)')+';"></i>';
    else inner='<span style="font-size:10px;font-weight:700;color:'+(st==='current'?'#fff':'var(--c-mute-3)')+';">'+(i+1)+'</span>';
    html+='<div style="display:flex;flex-direction:column;align-items:center;min-width:72px;flex:1;">'
      +'<div style="width:26px;height:26px;border-radius:50%;background:'+bg+';border:2px solid '+bd+';display:flex;align-items:center;justify-content:center;">'+inner+'</div>'
      +'<div style="font-size:10.5px;text-align:center;margin-top:6px;color:'+col+';font-weight:'+(st==='current'?'700':'500')+';line-height:1.3;">'+esc(lbl)+(sys?' <i data-lucide="lock" class="w-2.5 h-2.5"></i>':'')+'</div></div>';
  });
  html+='</div>';
  return html;
}

function detailActions(b){
  var out='';
  if(isCompleted(b)) return '';
  if(isTerminal(b)) return '';
  if(b.approval_status==='waiting_for_verify'){
    out+='<button class="btn btn-sm btn-primary" onclick="approveBooking(\''+b.booking_id+'\')"><i data-lucide="check" class="w-3.5 h-3.5"></i><span>อนุมัติ</span></button>';
    out+='<button class="btn btn-sm btn-danger" onclick="openReasonModal(\'reject\',\''+b.booking_id+'\')"><i data-lucide="x" class="w-3.5 h-3.5"></i><span>ปฏิเสธ</span></button>';
    out+='<button class="btn btn-sm btn-secondary" onclick="openReasonModal(\'cancel\',\''+b.booking_id+'\')"><i data-lucide="ban" class="w-3.5 h-3.5"></i><span>ยกเลิก</span></button>';
  } else if(b.approval_status==='verified'){
    if(b.cut_transport_status==null) out+='<button class="btn btn-sm btn-primary" onclick="sendCutApproval(\''+b.booking_id+'\')"><i data-lucide="send" class="w-3.5 h-3.5"></i><span>ขออนุมัติตัด</span></button>';
    else if(b.cut_transport_status==='awaiting_cut_approval') out+='<button class="btn btn-sm btn-primary" onclick="approveCut(\''+b.booking_id+'\')"><i data-lucide="scissors" class="w-3.5 h-3.5"></i><span>อนุมัติตัด</span></button>';
    else if(b.cut_transport_status==='awaiting_cutting') out+='<button class="btn btn-sm btn-primary" onclick="finishCut(\''+b.booking_id+'\')"><i data-lucide="check-check" class="w-3.5 h-3.5"></i><span>จบการตัด</span></button>';
    else if(b.cut_transport_status==='awaiting_dispatch') out+='<button class="btn btn-sm btn-primary" onclick="startDispatch(\''+b.booking_id+'\')"><i data-lucide="truck" class="w-3.5 h-3.5"></i><span>เริ่มจัดส่ง</span></button>';
    // ย้อนสถานะ (void) — ทุกสถานะก่อน completed
    out+='<button class="btn btn-sm btn-secondary" onclick="openReasonModal(\'void\',\''+b.booking_id+'\')"><i data-lucide="undo-2" class="w-3.5 h-3.5"></i><span>ย้อนสถานะ</span></button>';
  }
  return out;
}

// ============================================
// ACTIONS (manual) — no-skip guards + optimistic version++ + history + toast
// BACKEND: API-A* approve · API-B* cut/dispatch · reverse
// ============================================
function applyAction(b, ev, actor, note, dot){ b.row_version++; b.updated_at=new Date().toISOString(); b.history.push({event:ev,actor:actor||CURRENT_USER.name,at:b.updated_at,note:note||null,dot:dot||null}); render(); if(state.view&&state.view.id===b.booking_id)renderViewDrawer(); }

function approveBooking(id){ var b=findBooking(id); if(!b)return; if(b.approval_status!=='waiting_for_verify'){ showToast('ไม่สามารถข้ามขั้นตอนได้','error'); return; } b.approval_status='verified'; applyAction(b,'approve',CURRENT_USER.name,'อนุมัติรอบจอง','is-success'); showToast('อนุมัติแล้ว','success'); }
function sendCutApproval(id){ var b=findBooking(id); if(!b)return; if(!(b.approval_status==='verified'&&b.cut_transport_status==null)){ showToast('ไม่สามารถข้ามขั้นตอนได้','error'); return; } b.cut_transport_status='awaiting_cut_approval'; applyAction(b,'cut_send',CURRENT_USER.name,'ส่งขออนุมัติตัด'); showToast('ส่งขออนุมัติตัดแล้ว','success'); }
function approveCut(id){ var b=findBooking(id); if(!b)return; if(b.cut_transport_status!=='awaiting_cut_approval'){ showToast('ไม่สามารถข้ามขั้นตอนได้','error'); return; } b.cut_transport_status='awaiting_cutting'; applyAction(b,'cut_approve',CURRENT_USER.name,'อนุมัติตัด'); showToast('ดำเนินการแล้ว','success'); }
function finishCut(id){ var b=findBooking(id); if(!b)return; if(b.cut_transport_status!=='awaiting_cutting'){ showToast('ไม่สามารถข้ามขั้นตอนได้','error'); return; } b.cut_transport_status='awaiting_dispatch'; applyAction(b,'cut_finish',CURRENT_USER.name,'จบการตัด'); showToast('ดำเนินการแล้ว','success'); }
function startDispatch(id){ var b=findBooking(id); if(!b)return; if(b.cut_transport_status!=='awaiting_dispatch'){ showToast('ไม่สามารถข้ามขั้นตอนได้','error'); return; } b.cut_transport_status='dispatching'; b.dispatch_started_at=new Date().toISOString(); applyAction(b,'dispatch_start',CURRENT_USER.name,'เริ่มจัดส่ง'); showToast('เริ่มจัดส่งแล้ว','success'); }

// ---- Reverse (void) — revert 1 step + clear the just-set field (BR-04, reason required) ----
function doReverse(b){
  if(b.payment_status==='awaiting_payment'){ b.cut_transport_closed_at=null; b.payment_status='not_due'; b.dump_result_confirmed=false; return; }
  if(b.checkin_at){ b.checkin_at=null; return; }
  if(b.cut_transport_status==='dispatching'){ b.cut_transport_status='awaiting_dispatch'; b.dispatch_started_at=null; return; }
  if(b.cut_transport_status==='awaiting_dispatch'){ b.cut_transport_status='awaiting_cutting'; return; }
  if(b.cut_transport_status==='awaiting_cutting'){ b.cut_transport_status='awaiting_cut_approval'; return; }
  if(b.cut_transport_status==='awaiting_cut_approval'){ b.cut_transport_status=null; return; }
  if(b.approval_status==='verified'){ b.approval_status='waiting_for_verify'; return; }
}

function simCheckin(id){ var b=findBooking(id); if(!b)return; if(!(b.cut_transport_status==='dispatching'&&!b.checkin_at)){ showToast('สถานะนี้ระบบจะอัปเดตให้อัตโนมัติ เมื่อข้อมูลจากระบบอื่นเสร็จสิ้น','warning'); return; } b.checkin_at=new Date().toISOString(); applyAction(b,'checkin',SYS_ACTOR,'เช็คอินโรงงาน (ระบบ)','is-success'); showToast('รับเหตุการณ์เช็คอินโรงงานแล้ว — รอผลการเท','info'); }
function simReceiving(id){ var b=findBooking(id); if(!b)return; if(!b.checkin_at||b.cut_transport_closed_at!=null){ showToast('สถานะนี้ระบบจะอัปเดตให้อัตโนมัติ เมื่อข้อมูลจากระบบอื่นเสร็จสิ้น','warning'); return; } b.cut_transport_closed_at=new Date().toISOString(); b.payment_status='awaiting_payment'; b.dump_result_confirmed=true; applyAction(b,'receiving',SYS_ACTOR,'รับอ้อยเสร็จ — ปิดงานขนส่ง + ตั้งรอทำจ่าย (ระบบ)','is-success'); showToast('รับอ้อยเสร็จ — ปิดงานขนส่ง + ตั้งรอทำจ่าย','info'); }
function simPayment(id){ var b=findBooking(id); if(!b)return; if(b.payment_status!=='awaiting_payment'){ showToast('สถานะนี้ระบบจะอัปเดตให้อัตโนมัติ เมื่อข้อมูลจากระบบอื่นเสร็จสิ้น','warning'); return; } b.payment_status='completed'; applyAction(b,'payment',SYS_ACTOR,'จ่ายเงินเสร็จ (ระบบ)','is-success'); showToast('จ่ายเงินเสร็จ — การจองเสร็จสิ้น','success'); }

// ============================================
function bulkApprove(){
  var ids=Array.from(state.selectedIds).filter(function(id){ var b=findBooking(id); return b&&b.approval_status==='waiting_for_verify'; });
  if(ids.length===0){ showToast('เลือกได้เฉพาะรายการที่รออนุมัติ','warning'); return; }
  ids.forEach(function(id){ var b=findBooking(id); b.approval_status='verified'; b.row_version++; b.updated_at=new Date().toISOString(); b.history.push({event:'approve',actor:CURRENT_USER.name,at:b.updated_at,note:'อนุมัติรอบจอง (กลุ่ม '+ids.length+' รายการ)',dot:'is-success'}); });
  state.selectedIds.clear(); render(); if(state.view)renderViewDrawer(); showToast('อนุมัติแล้ว '+ids.length+' รายการ','success');
}

  vf('f-datetime',vReq('กรุณาระบุวันเวลา'));
  vf('f-slot',vReq('กรุณาเลือกรอบ'));
  vf('f-lane',vReq('กรุณาเลือกเลน'));
  vf('f-vtype',vReq('กรุณาเลือกประเภทรถ'));
  vf('f-plate',vReq('กรุณาระบุทะเบียนรถ'));
  vf('f-driver',vReq('กรุณาระบุคนขับ'));
  vf('f-tons',function(v){ if(!String(v).trim())return 'กรุณากรอกปริมาณคาดส่ง'; var n=parseFloat(v); if(isNaN(n)||n<=0)return 'กรุณาใส่ค่าที่ถูกต้อง'; return ''; });
  vf('f-ptype',vReq('กรุณาเลือกประเภทบิล'));
  vf('f-debt',function(v){ if(!String(v).trim())return ''; var n=parseFloat(v); if(isNaN(n)||n<0||n>100)return 'หักหนี้ต้องอยู่ระหว่าง 0-100'; return ''; });
  return ok;
}
async function submitForm(){
  var f=state.form; if(!f||f.submitting)return;
  if(!validateFormAll()){ showToast('กรุณากรอกข้อมูลให้ครบถ้วน','warning'); return; }
  f.submitting=true; var btn=document.getElementById('f-submit'); btn.disabled=true; btn.innerHTML='<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>'; renderIcons();
  // BACKEND: API-02 create (validate + save) · idempotency + double-submit guard (BR-03)
  await new Promise(r=>setTimeout(r,600));
  var d=f.data, q=f.quota; var now=new Date().toISOString();
  var mx=0; state.records.forEach(function(b){ if(b.seq>mx)mx=b.seq; }); var seq=mx+1;
  var code='CBM-2568-'+String(seq).padStart(7,'0');
  var nb={ booking_id:code, seq:seq, quota_id:d.quota_id, crop_id:d.crop_id||null,
    farmer_name:q?q.farmer_name:'', farmer_lastname:q?q.lastname:'', farmer_phone:q?q.phone:'',
    season:d.season, location:d.location, booking_datetime:new Date(d.booking_datetime).toISOString(), slot:d.slot, lane:d.lane,
    vehicle_type:d.vehicle_type, vehicle_plate:d.vehicle_plate, driver:d.driver, estimated_tons:parseFloat(d.estimated_tons),
    payment_type:d.payment_type, debt_deduction_percent:parseFloat(d.debt_deduction_percent||'0'), debtor_outstanding:q?q.outstanding:null,
    cutting_method:'person', cutting_summary:'',
    approval_status:'waiting_for_verify', cut_transport_status:null, cut_transport_closed_at:null,
    payment_status:'not_due', dispatch_started_at:null, checkin_at:null, dump_result_confirmed:false,
    reject_reason:null, cancel_reason:null,
    row_version:1, created_at:now, updated_at:now, created_by:CURRENT_USER.name,
    history:[{event:'create',actor:CURRENT_USER.name,at:now,note:'สร้างการจอง · โควตา '+d.quota_id}] };
  state.records.unshift(nb);
  state.form=null; closePanel(); render(); showToast('สร้างการจองสำเร็จ — '+code,'success',4200);
}

// ============================================
// SEARCH-SELECT helper (Iron Rule #34)
// ============================================
window.__ss=window.__ss||{};
function ssGet(k){return window.__ss[k];}
function ssEsc(s){return String(s).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}
function searchSelectHTML(key,opt){ opt=opt||{}; var ph=opt.placeholder||'ค้นหา...'; return '<div class="search-select" id="ss-'+key+'"><i data-lucide="search" class="ss-lead w-4 h-4"></i><input type="text" class="input ss-input" id="ss-input-'+key+'" autocomplete="off" placeholder="'+ph+'" oninput="ssOnInput(\''+key+'\',this.value)" onfocus="ssOpen(\''+key+'\')" onkeydown="ssOnKey(\''+key+'\',event)"><button type="button" class="ss-clear hidden" id="ss-clear-'+key+'" tabindex="-1" onclick="ssClear(\''+key+'\')"><i data-lucide="x" class="w-4 h-4"></i></button><i data-lucide="chevron-down" class="ss-caret w-4 h-4" id="ss-caret-'+key+'"></i><div class="ss-list hidden" id="ss-list-'+key+'"></div></div>'; }
function initSearchSelect(key,cfg){ cfg=cfg||{}; window.__ss[key]={options:cfg.options||[],value:cfg.value!=null?cfg.value:null,onSelect:cfg.onSelect||function(){},emptyText:cfg.emptyText||'ไม่พบรายการ',query:'',open:false,hi:0}; ssSetText(key); ssSyncChrome(key); renderIcons(); }
function ssFiltered(key){ var s=ssGet(key); if(!s)return []; var q=(s.query||'').toLowerCase().trim(); if(!q)return s.options; return s.options.filter(o=>String(o.label).toLowerCase().includes(q)||String(o.value).toLowerCase().includes(q)||String(o.sub||'').toLowerCase().includes(q)); }
function ssSyncChrome(key){ var s=ssGet(key); if(!s)return; var sel=s.options.find(o=>o.value===s.value); var c=document.getElementById('ss-clear-'+key); if(c)c.classList.toggle('hidden',!sel); var k=document.getElementById('ss-caret-'+key); if(k)k.classList.toggle('hidden',!!sel); }
function ssSetText(key){ var s=ssGet(key); if(!s)return; var inp=document.getElementById('ss-input-'+key); if(!inp)return; var sel=s.options.find(o=>o.value===s.value); inp.value=s.open?s.query:(sel?sel.label:''); }
function ssRenderList(key){ var s=ssGet(key); if(!s)return; var list=document.getElementById('ss-list-'+key); if(!list)return; var items=ssFiltered(key); if(items.length===0){ list.innerHTML='<div class="ss-empty">'+s.emptyText+'</div>'; } else { var q=(s.query||'').toLowerCase().trim(); var hl=function(t){return q?String(t).replace(new RegExp('('+ssEsc(q)+')','gi'),'<mark>$1</mark>'):String(t);}; list.innerHTML=items.map(function(o,i){return '<button type="button" class="ss-opt '+(i===s.hi?'is-active':'')+'" onmousedown="event.preventDefault()" onclick="ssPick(\''+key+'\','+i+')">'+(o.icon?'<i data-lucide="'+o.icon+'" class="ss-opt-ic w-4 h-4"></i>':'')+'<span class="ss-opt-main"><span class="ss-opt-label">'+hl(o.label)+'</span>'+(o.sub?'<span class="ss-opt-sub">'+hl(o.sub)+'</span>':'')+'</span>'+(o.right?'<span class="ss-opt-right">'+o.right+'</span>':'')+'</button>';}).join(''); } list.classList.toggle('hidden',!s.open); renderIcons(); }
function ssOpen(key){ var s=ssGet(key); if(!s)return; var inp=document.getElementById('ss-input-'+key); if(inp&&inp.disabled)return; s.open=true; s.query=''; s.hi=0; ssSetText(key); ssSyncChrome(key); ssRenderList(key); }
function ssOnInput(key,val){ var s=ssGet(key); if(!s)return; s.query=val; s.open=true; s.hi=0; s.value=null; ssSyncChrome(key); ssRenderList(key); }
function ssPick(key,i){ var s=ssGet(key); if(!s)return; var o=ssFiltered(key)[i]; if(!o)return; s.value=o.value; s.query=''; s.open=false; ssSetText(key); ssSyncChrome(key); ssRenderList(key); s.onSelect(o.value,o); }
function ssClear(key){ var s=ssGet(key); if(!s)return; s.value=null; s.query=''; s.open=true; ssSetText(key); ssSyncChrome(key); ssRenderList(key); var inp=document.getElementById('ss-input-'+key); if(inp)inp.focus(); s.onSelect(null,null); }
function ssOnKey(key,e){ var s=ssGet(key); if(!s)return; var items=ssFiltered(key); if(e.key==='ArrowDown'){e.preventDefault(); s.open=true; s.hi=Math.min(items.length-1,s.hi+1); ssRenderList(key);} else if(e.key==='ArrowUp'){e.preventDefault(); s.hi=Math.max(0,s.hi-1); ssRenderList(key);} else if(e.key==='Enter'){e.preventDefault(); if(items[s.hi])ssPick(key,s.hi);} else if(e.key==='Escape'){s.open=false; ssSetText(key); ssSyncChrome(key); ssRenderList(key); e.stopPropagation();} }
document.addEventListener('click',function(e){ Object.keys(window.__ss||{}).forEach(function(key){ var w=document.getElementById('ss-'+key); var s=ssGet(key); if(w&&s&&s.open&&!w.contains(e.target)){ s.open=false; ssSetText(key); ssSyncChrome(key); ssRenderList(key); } }); });

// ============================================
// MODAL (reason — reject / cancel / void) OV-03/04
// ============================================
function openModalBox(type,data,isLg){ state.modal={open:true,type:type,data:data||{}}; var box=document.getElementById('modalBox'); box.className='modal'+(isLg?' is-lg':''); renderModal(); requestAnimationFrame(()=>document.getElementById('modalBackdrop').classList.add('is-open')); }
function closeModal(){ if(state.modal.data&&state.modal.data.busy)return; document.getElementById('modalBackdrop').classList.remove('is-open'); setTimeout(()=>state.modal={open:false,type:null,data:null},200); }
function renderModal(){ if(state.modal.type==='reason')renderReasonModal(); }

var REASON_META={
  reject:{ title:'ปฏิเสธการจอง', icon:'x-circle', ic:'is-danger', sub:'ระบุเหตุผลในการปฏิเสธ · จะบันทึกลงประวัติ', btn:'ยืนยันปฏิเสธ', bcls:'btn-danger is-solid' },
  cancel:{ title:'ยกเลิกการจอง', icon:'ban', ic:'is-warning', sub:'ระบุเหตุผลในการยกเลิก · จะบันทึกลงประวัติ', btn:'ยืนยันยกเลิก', bcls:'btn-danger is-solid' },
  void:{ title:'ย้อนสถานะ', icon:'undo-2', ic:'is-warning', sub:'ย้อนสถานะกลับ 1 ขั้น · ต้องระบุเหตุผล', btn:'ยืนยันย้อนสถานะ', bcls:'btn-primary' }
};
function openReasonModal(kind,id){ var b=findBooking(id); if(!b)return; openModalBox('reason',{kind:kind,id:id,reason:'',busy:false}); }
function renderReasonModal(){
  var d=state.modal.data; var b=findBooking(d.id); if(!b)return; var m=REASON_META[d.kind];
  document.getElementById('modalBox').innerHTML=
    '<div class="modal-header"><div class="modal-header-icon '+m.ic+'"><i data-lucide="'+m.icon+'" class="w-5 h-5"></i></div>'
    +'<div style="flex:1;"><h3 class="modal-title">'+m.title+'</h3><p class="modal-subtitle">'+m.sub+'</p></div>'
    +'<button class="icon-btn" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button></div>'
    +'<div class="modal-body">'
    +'<div style="font-size:13px;color:var(--c-mute);margin-bottom:12px;">การจอง <span class="mono" style="color:var(--c-ink);font-weight:600;">'+esc(b.booking_id)+'</span> · '+esc(b.farmer_name+' '+b.farmer_lastname)+(d.kind==='void'?(' · สถานะปัจจุบัน: '+esc(combinedProgress(b))):'')+'</div>'
    +'<div class="field" style="margin-bottom:0;"><label class="field-label">เหตุผล <span class="req">*</span></label><textarea class="input" id="r-reason" placeholder="กรุณาระบุเหตุผล...">'+esc(d.reason||'')+'</textarea><div class="field-error" id="err-reason"></div></div>'
    +'</div>'
    +'<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn '+m.bcls+'" id="r-submit" onclick="submitReason()"><i data-lucide="check" class="w-4 h-4"></i><span>'+m.btn+'</span></button></div>';
  renderIcons();
  var rn=document.getElementById('r-reason'); if(rn)rn.value=d.reason||'';
}
async function submitReason(){
  var d=state.modal.data; if(d.busy)return; var rn=document.getElementById('r-reason'); if(rn)d.reason=rn.value;
  if(!(d.reason||'').trim()){ var er=document.getElementById('err-reason'); if(er){er.textContent='กรุณาระบุเหตุผล'; er.style.visibility='visible';} showToast('กรุณาระบุเหตุผล','warning'); return; }
  d.busy=true; var btn=document.getElementById('r-submit'); btn.disabled=true; btn.innerHTML='<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังดำเนินการ…</span>'; renderIcons();
  await new Promise(r=>setTimeout(r,500));
  var b=findBooking(d.id); var reason=(d.reason||'').trim(); var msg='';
  if(d.kind==='reject'){ b.approval_status='rejected'; b.reject_reason=reason; b.history.push({event:'reject',actor:CURRENT_USER.name,at:new Date().toISOString(),note:reason,dot:'is-danger'}); msg='ปฏิเสธแล้ว'; }
  else if(d.kind==='cancel'){ b.approval_status='cancelled'; b.cancel_reason=reason; b.history.push({event:'cancel',actor:CURRENT_USER.name,at:new Date().toISOString(),note:reason,dot:'is-warning'}); msg='ยกเลิกแล้ว'; }
  else { doReverse(b); b.history.push({event:'reverse',actor:CURRENT_USER.name,at:new Date().toISOString(),note:'ย้อนสถานะ · '+reason,dot:'is-warning'}); msg='ย้อนสถานะแล้ว'; }
  b.row_version++; b.updated_at=new Date().toISOString();
  d.busy=false; closeModal(); render(); if(state.view&&state.view.id===b.booking_id)renderViewDrawer(); showToast(msg,'success');
}

// ESC chain
window.addEventListener('keydown',function(e){ if(e.key!=='Escape')return; if(state.modal.open)closeModal(); else if(state.form)closeForm(); else if(state.view)closeView(); });

// INIT
window.addEventListener('hashchange',function(){ render(); });
var domReady=false,lucideReady=false;
function bootIfReady(){ if(domReady&&lucideReady){ render(); renderIcons(); } }
if(document.readyState==='loading')window.addEventListener('DOMContentLoaded',function(){domReady=true;bootIfReady();}); else domReady=true;
window.addEventListener('lucide:ready',function(){lucideReady=true;bootIfReady();});
if(window.lucide&&typeof window.lucide.createIcons==='function')lucideReady=true;
bootIfReady();
setTimeout(function(){ if(!lucideReady){lucideReady=true;bootIfReady();} },5000);
</script>
