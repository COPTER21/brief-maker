/* ---------- row menu (⋮) ---------- */
function openRowMenu(id, btn){
  closeRowMenu();
  const r = findR(id), items = [['copy', 'ทำซ้ำ', `dupRec('${id}')`], ['printer', 'พิมพ์', `genPdf('${id}', true)`]];
  if (isOwner(r) && r.status === 'draft') items.splice(1, 0, ['pencil', 'แก้ไข', `startWizard('${id}')`]);
  if (canCancel(r)) items.push(['x-circle', 'ยกเลิกเอกสาร', `openCancel('${id}')`, 1]);
  const m = document.createElement('div'); m.className = 'row-menu';
  m.innerHTML = items.map(x => `<button type="button" class="rm-item ${x[3] ? 'is-danger' : ''}" onclick="closeRowMenu(); ${x[2]}"><i data-rmic="${x[0]}" class="w-4 h-4"></i><span>${x[1]}</span></button>`).join('');
  document.getElementById('overlay-root').appendChild(m);
  const b = btn.getBoundingClientRect(), h = items.length * 36 + 8, below = window.innerHeight - b.bottom > h + 8;
  m.style.setProperty('--top', (below ? b.bottom + 4 : b.top - h - 4) + 'px'); m.style.setProperty('--left', Math.max(8, b.right - 180) + 'px');
  /* render เฉพาะไอคอนในเมนู — renderIcons() ทั้งหน้าจะแทน svg ใต้เมาส์ ทำให้คลิกทะลุไปเปิดแถว */
  if (window.lucide && typeof window.lucide.createIcons === 'function'){ window.lucide.createIcons({ nameAttr:'data-rmic' }); m.querySelectorAll('svg[data-rmic]').forEach(x => x.removeAttribute('data-rmic')); }
}
function closeRowMenu(){ const m = document.querySelector('.row-menu'); if (m) m.remove(); }
function rowClick(ev, id){ if (ev.target.closest('.row-actions-cell')) return; openView(id); }
document.addEventListener('click', e => { if (!e.target.closest('.row-menu') && !e.target.closest('.row-actions-cell')) closeRowMenu(); });
window.addEventListener('scroll', closeRowMenu, true);

/* =====================================================================
   VIEW DRAWER (Pattern Q surface 3) — รายละเอียด › PDF Preview › ลายเซ็น / อนุมัติ › ประวัติ
   ===================================================================== */
const canCancel = r => (r.status === 'draft' || r.status === 'pending' || r.status === 'approved') && (isOwner(r) || isHR());
function tabBtn(key, label, icon, count){ return `<button class="drawer-tab ${S.dw.tab === key ? 'is-active' : ''}" onclick="setTab('${key}')"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i> ${label}${count != null ? `<span class="dt-count num">${count}</span>` : ''}</button>`; }
function kv(label, val){ return `<div class="lbl">${label}</div><div class="val">${val}</div>`; }
const SEC = (icon, title, body, extra) => `<div class="drawer-section"><div class="drawer-section-title"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i>${title}${extra || ''}</div>${body}</div>`;
function linesTable(lines){
  return `<div class="table-wrap osw-view-lines"><table class="table"><thead><tr><th class="c">#</th><th>วันที่</th><th>เวลา</th><th>เพื่อ</th><th class="r">วัน</th></tr></thead><tbody>
    ${lines.map((l, i) => `<tr><td class="c num">${i + 1}</td><td class="nw">${lineDateText(l)}</td><td class="nw num">${lineTimeText(l)}</td><td>${esc(l.purpose)}</td><td class="r num">${lineDays(l)}</td></tr>`).join('')}
    </tbody></table></div>`;
}
function perDiemBlock(r){
  if (r.mode !== 'overnight') return `<div class="osw-pd is-off"><i data-lucide="sun" class="w-4 h-4"></i><div><b>ไป-กลับ</b> — ไม่มีค่าเบี้ยเลี้ยง</div></div>`;
  return `<div class="osw-pd"><div class="pd-cell"><div class="pd-l">จำนวนคืนที่ค้าง</div><div class="pd-v num">${r.nights} คืน</div></div>
    <div class="pd-cell"><div class="pd-l">คืนที่ได้เบี้ยเลี้ยง</div><div class="pd-v num">${r.paid} คืน</div></div>
    <div class="pd-cell"><div class="pd-l">อัตราต่อคืน</div><div class="pd-v num">${fmtMoney(r.rate)}</div></div>
    <div class="pd-cell is-total"><div class="pd-l">ค่าเบี้ยเลี้ยงรวม</div><div class="pd-v num">${fmtMoney(perDiem(r))}</div></div></div>`;
}
function fileRow(x){ return `<div class="file-row"><div class="file-ic"><i data-lucide="file" class="w-4 h-4"></i></div><div class="file-name">${esc(x.name)}</div><span class="file-size">${x.size}</span></div>`; }
function viewBanner(r){
  if (r.status === 'rejected') return `<div class="alert-row is-danger"><i data-lucide="x-circle" class="w-4 h-4"></i><div>ไม่อนุญาต — ${esc(r.chain[0].note)}</div></div>`;
  if (r.status === 'cancelled'){ const a = r.audit.filter(x => x.act === 'ยกเลิกเอกสาร').pop(); return `<div class="alert-row is-danger"><i data-lucide="x-circle" class="w-4 h-4"></i><div>ยกเลิกแล้ว — ${esc(a ? a.note : '')}</div></div>`; }
  if (r.status === 'pending') return `<div class="alert-row"><i data-lucide="hourglass" class="w-4 h-4"></i><div>รอ ${esc(empOf(curStep(r).assignee).name)} พิจารณา${canAct(r) ? ' — คุณเป็นผู้พิจารณาคำขอนี้' : ''}</div></div>`;
  if (r.status === 'draft') return `<div class="alert-row"><i data-lucide="pencil" class="w-4 h-4"></i><div>ยังเป็นร่าง — ส่งขออนุญาตเมื่อข้อมูลครบ</div></div>`;
  return '';
}
function renderDetailTab(r){
  const e = empOf(r.emp);
  return viewBanner(r)
    + SEC('info', 'ข้อมูลเอกสาร', `<div class="drawer-fields">${kv('เลขที่เอกสาร', `<span class="code-strong">${r.code}</span>`)}${kv('วันที่ขอ', fmtDate(r.reqDate))}${kv('สถานะเอกสาร', docPill(r.status))}${kv('เรียน', esc(empOf(r.chain[0].assignee).name) + ' · ' + esc(empOf(r.chain[0].assignee).pos))}</div>`)
    + SEC('user', 'ผู้ขอ', `<div class="drawer-fields">${kv('ชื่อ-สกุล', esc(e.name))}${kv('ตำแหน่ง', esc(r.pos))}${kv('ฝ่าย', esc(r.dept))}</div>`)
    + SEC('calendar-range', `รายการวันที่ปฏิบัติงาน (${r.lines.length})`, linesTable(r.lines), `<span class="sec-meta num">รวม ${totalDays(r.lines)} วัน</span>`)
    + SEC('wallet', 'ลักษณะการปฏิบัติงานและเบี้ยเลี้ยง', perDiemBlock(r))
    + SEC('paperclip', `เอกสารแนบ (${r.attachments.length} ไฟล์ · Document Center)`, r.attachments.length ? r.attachments.map(fileRow).join('') : '<div class="tl-body">ไม่มีเอกสารแนบ</div>')
    + SEC('database', 'ข้อมูลระบบ', `<div class="drawer-fields">${kv('สร้างโดย', esc(r.createdBy) + ' · ' + fmtDateTime(r.createdAt))}${kv('แก้ไขล่าสุด', esc(r.updatedBy) + ' · ' + fmtDateTime(r.updatedAt))}</div>`);
}
/* ---------- PDF Preview — ช่องของ thai-doc-pdf-generator (pattern FORM REPLICA = หน้าตาแบบฟอร์มกระดาษของลูกค้า) ----------

const PDF_CSS = "/* ============================================================\n   THAI BUSINESS DOCUMENT — MASTER A4 STYLESHEET  (LEAN v2)\n   CI: CUBE NATIVE (Navy #0B1D3A / Primary #0B5CFF / Teal #00A88E)\n   Font: Sarabun (Thai official document standard)\n   Design rules: lean & light type · thin minimal table header ·\n   single-line dense rows · signatures + footer pinned to page bottom.\n   DO NOT edit per-document. @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap'); injected by build_html.py.\n   ============================================================ */\n\n@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap');\n\n:root{\n  /* ---- CUBE NATIVE CI (verbatim from html-generator-v3) ---- */\n  --c-navy:#0B1D3A; --c-navy-2:#14284A;\n  --c-primary:#0B5CFF; --c-primary-hover:#0847CC;\n  --c-teal:#00A88E; --c-teal-light:#5EEAD4;\n  --c-ink:#0F172A; --c-mute:#475569; --c-mute-2:#64748B; --c-mute-3:#94A3B8;\n  --c-line:#CBD5E1; --c-line-2:#E2E8F0; --c-line-3:#F1F5F9;\n  --c-bg-off:#F8FAFC;\n  --c-success:#10B981; --c-warning:#D97706; --c-danger:#DC2626;\n\n  /* ---- Print geometry (A4) ---- */\n  --page-w:210mm; --page-h:297mm;\n  --page-margin:14mm;\n  --content-h:269mm;        /* 297 - 2*14 (printable height) */\n  --fs-base:9pt;            /* lean body size */\n}\n\n@page{ size:A4 portrait; margin:var(--page-margin); }\n\n*{ box-sizing:border-box; margin:0; padding:0; }\n\nhtml,body{\n  font-family:'Sarabun','Loma',sans-serif;\n  font-size:var(--fs-base);\n  font-weight:400;\n  line-height:1.4;\n  color:var(--c-ink);\n  -webkit-font-smoothing:antialiased;\n  background:#fff;\n}\n\n/* ===== A4 PAGE — flex column so .doc-bottom can pin to bottom ===== */\n.doc-page{ display:flex; flex-direction:column; }\n.doc-content{ flex:0 0 auto; }\n.doc-bottom{ margin-top:auto; }   /* pushes signatures + footer to page bottom */\n\n@media screen{\n  body{ background:#e7ebf0; padding:24px 0; }\n  .doc-page{\n    width:var(--page-w); min-height:var(--page-h);\n    margin:0 auto 24px; padding:var(--page-margin);\n    background:#fff; box-shadow:0 4px 24px rgba(11,29,58,.18);\n  }\n}\n@media print{\n  .doc-page{ width:auto; min-height:var(--content-h); padding:0; box-shadow:none; }\n}\n\n/* ============================================================\n   1. HEADER — thin rule, lighter type\n   ============================================================ */\n.doc-head{\n  display:flex; justify-content:space-between; align-items:flex-start;\n  gap:12mm; padding-top:1.5mm; padding-bottom:6px; border-bottom:1.5px solid var(--c-navy);\n}\n.doc-head__brand{ display:flex; gap:9px; align-items:flex-start; }\n.doc-logo{ width:46px; height:46px; flex:0 0 auto; border-radius:7px; object-fit:contain; }\n.doc-logo--ph{\n  display:flex; align-items:center; justify-content:center;\n  background:linear-gradient(135deg,var(--c-navy),var(--c-teal));\n  color:#fff; font-weight:700; font-size:15pt; letter-spacing:.03em;\n}\n.doc-org__name{ font-size:11.5pt; font-weight:700; color:var(--c-navy); line-height:1.5; }\n.doc-org__line{ font-size:7.8pt; color:var(--c-mute); line-height:1.35; }\n.doc-org__tax{ font-size:7.8pt; color:var(--c-mute-2); margin-top:1px; }\n\n.doc-head__title{ text-align:right; flex:0 0 auto; min-width:54mm; }\n.doc-title{ font-size:15pt; font-weight:700; color:var(--c-navy); line-height:1.45; }\n.doc-title__en{ font-size:7.5pt; font-weight:500; color:var(--c-mute-2); letter-spacing:.08em; text-transform:uppercase; }\n.doc-copy{ display:inline-block; margin-top:3px; padding:0 8px; border:1px solid var(--c-line);\n  border-radius:999px; font-size:7pt; font-weight:500; color:var(--c-mute); }\n\n/* ============================================================\n   2. META STRIP\n   ============================================================ */\n.doc-meta{ display:flex; flex-wrap:wrap; gap:0 22px; margin-top:7px; font-size:8.3pt; }\n.doc-meta__item{ display:flex; gap:5px; padding:1px 0; }\n.doc-meta__k{ color:var(--c-mute-2); }\n.doc-meta__v{ color:var(--c-ink); font-weight:600; }\n\n/* ============================================================\n   3. PARTY BLOCKS — light, no heavy fill\n   ============================================================ */\n.parties{ display:flex; gap:5mm; margin-top:9px; }\n.party{ flex:1; border:1px solid var(--c-line-2); border-radius:6px; padding:6px 9px; }\n.party__label{ font-size:7.2pt; font-weight:600; color:var(--c-primary);\n  text-transform:uppercase; letter-spacing:.06em; margin-bottom:2px; }\n.party__name{ font-size:9.3pt; font-weight:700; color:var(--c-ink); }\n.party__line{ font-size:8pt; color:var(--c-mute); line-height:1.35; }\n\n/* ============================================================\n   4. LINE-ITEM TABLE — minimal thin header, hairline rows, single-line\n   ============================================================ */\n.items{ width:100%; border-collapse:collapse; margin-top:10px; font-size:8.4pt; }\n.items thead th{\n  background:var(--c-navy); color:#fff; font-weight:600; font-size:7.6pt;\n  letter-spacing:.03em; text-align:left; padding:6px 8px;\n}\n.items thead th:first-child{ border-top-left-radius:5px; border-bottom-left-radius:5px; }\n.items thead th:last-child{ border-top-right-radius:5px; border-bottom-right-radius:5px; }\n.items tbody td{\n  padding:5px 8px; border-bottom:1px solid var(--c-line-2);\n  vertical-align:top; color:var(--c-ink); line-height:1.4;\n}\n.items .num{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }\n.items .ctr{ text-align:center; white-space:nowrap; }\n.items .col-no{ width:8mm; text-align:center; color:var(--c-mute-2); }\n.items .col-qty{ width:16mm; } .items .col-unit{ width:14mm; }\n.items .col-price{ width:23mm; } .items .col-amt{ width:25mm; }\n/* secondary detail kept INLINE so a row stays one line */\n.items td .sub{ color:var(--c-mute-2); font-size:7.4pt; }\n.items td .sub::before{ content:\"·\"; margin:0 5px; color:var(--c-mute-3); }\n.items tr{ break-inside:avoid; }\n.items thead{ display:table-header-group; }\n\n/* ============================================================\n   5. TOTALS — rules instead of heavy fill\n   ============================================================ */\n.foot-grid{ display:flex; gap:5mm; margin-top:8px; align-items:flex-start; }\n.foot-left{ flex:1; }\n.totals{ flex:0 0 60mm; }\n.totals__row{ display:flex; justify-content:space-between; gap:10px; padding:2.5px 8px; font-size:8.6pt; }\n.totals__row .k{ color:var(--c-mute); }\n.totals__row .v{ font-weight:600; font-variant-numeric:tabular-nums; }\n.totals__row--rule{ border-top:1px solid var(--c-line-2); }\n.totals__grand{\n  margin-top:4px; padding:6px 10px; border-radius:6px; background:var(--c-navy);\n  display:flex; justify-content:space-between; align-items:baseline;\n}\n.totals__grand .k{ font-size:8.8pt; font-weight:600; color:#fff; }\n.totals__grand .v{ font-size:11.5pt; font-weight:700; color:#fff; font-variant-numeric:tabular-nums; }\n/* amount-in-words — full width, larger, clear */\n.baht-text{ margin-top:7px; padding:6px 11px; border:1px dashed var(--c-line);\n  border-radius:6px; display:flex; justify-content:space-between; align-items:baseline; gap:12px; }\n.baht-text__k{ font-size:8pt; color:var(--c-mute-2); white-space:nowrap; }\n.baht-text b{ font-size:9.6pt; color:var(--c-navy); font-weight:700; text-align:right; }\n\n/* ============================================================\n   6. NOTES / TERMS\n   ============================================================ */\n.notes{ border:1px solid var(--c-line-2); border-radius:6px; padding:6px 9px;\n  font-size:8pt; color:var(--c-mute); }\n.notes__title{ font-size:7.2pt; font-weight:600; color:var(--c-mute-2);\n  text-transform:uppercase; letter-spacing:.05em; margin-bottom:3px; }\n.notes ol,.notes ul{ margin-left:15px; }\n.notes li{ margin:1px 0; }\n\n/* ============================================================\n   7. SIGNATURE BLOCK — sits inside .doc-bottom (above footer)\n   ============================================================ */\n.signs{ display:flex; gap:5mm; margin-top:14px; break-inside:avoid; }\n.sign{ flex:1; text-align:center; }\n.sign__line{ height:30px; border-bottom:1px solid var(--c-mute-3); margin:0 5mm; }\n.sign__paren{ font-size:8pt; color:var(--c-mute-2); margin-top:4px; }\n.sign__role{ font-size:8.4pt; font-weight:600; color:var(--c-ink); margin-top:1px; }\n.sign__name{ font-size:7.8pt; color:var(--c-mute); }\n.sign__date{ font-size:7.6pt; color:var(--c-mute-2); margin-top:1px; }\n\n/* ============================================================\n   8. OFFICIAL THAI LETTER / MEMO (ระเบียบงานสารบรรณ) — logo-left head\n   ============================================================ */\n.letter{ margin-top:8px; font-size:10pt; line-height:1.6; color:var(--c-ink); }\n\n/* ที่ (เลขหนังสือ) ซ้าย + ส่วนราชการ/ที่อยู่ ขวา */\n.letter__refrow{ display:flex; justify-content:space-between; align-items:flex-start; gap:14mm; margin-top:6px; }\n.letter__ref{ font-size:10pt; }\n.letter__agency{ text-align:right; font-size:9.2pt; color:var(--c-mute); line-height:1.4; }\n\n/* วันที่ — จัดกึ่งกลาง ไม่มีคำว่า \"วันที่\" นำ (ตามแบบราชการ) */\n.letter__date{ text-align:center; margin:10px 0 12px; font-size:10pt; }\n\n/* ฟิลด์หัวเรื่อง เรื่อง/เรียน/อ้างถึง/สิ่งที่ส่งมาด้วย — hanging indent */\n.letter__field{ display:flex; gap:10px; margin:3px 0; }\n.letter__field .lbl{ flex:0 0 auto; }\n.letter__field .val{ flex:1; text-align:justify; }\n.letter__field .val b,.letter__subject{ font-weight:700; }\n\n/* เนื้อหา — ย่อหน้าเยื้องบรรทัดแรก, จัดเต็มแนว */\n.letter__body{ margin-top:6px; }\n.letter__body p,.letter p{ margin:7px 0; text-indent:3.5em; text-align:justify; }\n\n/* คำลงท้าย + ลายเซ็น — กล่องชิดขวา */\n.letter__close{ margin-top:16px; margin-left:auto; width:72mm; text-align:center; }\n.letter__close .sp{ height:42px; }\n.letter__close .nm{ font-weight:600; }\n.letter__close .pos{ color:var(--c-mute); }\n\n/* เจ้าของเรื่อง (ส่วนราชการเจ้าของเรื่อง) — ล่างซ้าย ตัวเล็ก */\n.letter__owner{ font-size:8.6pt; color:var(--c-ink); line-height:1.45; }\n\n/* ============================================================\n   9. PAGE FOOTER — pinned bottom via .doc-bottom\n   ============================================================ */\n.doc-footer{ margin-top:8px; padding-top:5px; border-top:1px solid var(--c-line-2);\n  display:flex; justify-content:space-between; font-size:7.4pt; color:var(--c-mute-2); }\n\n/* ============================================================\n   UTILITIES\n   ============================================================ */\n.muted{ color:var(--c-mute); }\n.right{ text-align:right; } .center{ text-align:center; } .nowrap{ white-space:nowrap; }\n.mt-0{ margin-top:0 } .mt-8{ margin-top:8px } .mt-12{ margin-top:12px } .mt-16{ margin-top:16px }\n.tag{ display:inline-block; padding:0 7px; border-radius:999px; font-size:7.4pt; font-weight:600; }\n.tag--info{ background:#DBEAFE; color:#1E40AF; }\n.tag--ok{ background:#D1FAE5; color:#065F46; }\n.tag--warn{ background:#FEF3C7; color:#92400E; }\n.tag--danger{ background:#FEE2E2; color:#DC2626; }\n\n/* ============================================================\n   FORM REPLICA — ขึ้นแบบฟอร์มกระดาษของลูกค้าเป็นเอกสารระบบ (ใช้ได้ทุกแบบฟอร์ม)\n   หัวกลาง + บรรทัดกรอกเส้นประ ตามแบบเดิม · ลายเซ็นใช้ B6 .signs มาตรฐาน (slot จาก DOA) · ใช้ CI var เท่านั้น\n   ============================================================ */\n.form{ font-size:9.6pt; line-height:1.6; color:var(--c-ink); }\n.form-brand{ text-align:center; }\n.form-logo{ height:15mm; width:auto; max-width:70mm; object-fit:contain; }\n.form-title{ text-align:center; font-size:14pt; font-weight:700; line-height:1.45; margin-top:16px; }\n.form-date{ display:flex; justify-content:flex-end; margin-top:16px; }\n.form-date .fill{ flex:0 0 52mm; }\n.form-row{ display:flex; align-items:baseline; gap:6px; margin-top:8px; }\n.form-row--indent{ padding-left:12mm; margin-top:24px; }\n.form-row .fill{ flex:1 1 0; }\n.form-row .fill--s{ flex:0 0 15mm; } .form-row .fill--m{ flex:0 0 30mm; } .form-row .fill--l{ flex:0 0 60mm; }\n.fill{ display:inline-block; min-height:1.45em; padding:0 6px; border-bottom:1px dotted var(--c-mute-3); font-weight:500; color:var(--c-ink); text-align:center; }\n.fill--left{ text-align:left; }\n.fill--s, .fill--m{ white-space:nowrap; }\n.fill .sub{ font-size:7.6pt; font-weight:400; color:var(--c-mute-2); }\n.form-num{ flex:0 0 6mm; }\n.form-p{ margin-top:24px; padding-left:12mm; }\n.form-check{ display:flex; align-items:baseline; gap:6px; margin-top:16px; }\n.form-check__lbl{ flex:0 0 auto; white-space:nowrap; }\n.form-check__opts{ flex:1; }\n.form-check__opt{ display:flex; align-items:baseline; gap:6px; margin-bottom:5px; }\n.cb{ font-size:12pt; line-height:1; }\n.form-check .fill--s{ min-width:10mm; } .form-check .fill--m{ min-width:22mm; }\n.form.form--dense .form-row{ margin-top:5px; }\n.form.form--dense .form-row--indent{ margin-top:16px; }\n.form.form--dense .form-check{ margin-top:10px; }\n.form.form--dense .form-p{ margin-top:14px; }\n";

function tplGet(stack, path){

/* print data contract (OSW_print-spec §2) — ระบบจริง: backend สร้าง JSON นี้จาก record แล้ว render template เดียวกันฝั่ง server */
function oswPdfData(r){
  const e = empOf(r.emp), apE = empOf(r.chain[0].assignee), on = r.mode === 'overnight';
  const mark = (label, iso) => iso ? `${label} ${tShort(iso)} ${iso.slice(11, 16)} น.` : '';
  const lines = r.lines.map((l, i) => ({ no:i + 1, date:lineDateText(l), time_from:l.tFrom, time_to:l.tTo, purpose:l.purpose }));
  for (let i = lines.length; i < PDF_MIN_ROWS; i++) lines.push({ no:i + 1, date:'', time_from:'', time_to:'', purpose:'' });
  return {
    company:{ name:DOC.company, logo:CO_LOGO },
    doc:{ title:DOC_NAME, no:r.code, is_draft:r.status === 'draft', form_code:DOC.form, revision:DOC.rev },
    req_date:thFull(r.reqDate), to_name:'คุณ' + apE.name,
    employee:{ name:e.name, position:r.pos, dept:r.dept },
    lines,
    mode:{ day_box:box(!on), overnight_box:box(on) },
    per_diem:{ nights:on ? String(r.nights) : '', paid_nights:on ? String(r.paid) : '', rate:fmtNumber(r.rate, 0), amount:on ? money2(perDiem(r)) : '' },
    signs:[{ role:'พนักงาน', name:e.name, position:r.pos, date:r.submittedAt && r.status !== 'draft' ? mark('ส่งในระบบ', r.submittedAt) : BLANK_DATE, decision:null }]
      .concat(r.chain.map(c => { const p = empOf(c.assignee), done = c.status === 'approved' || c.status === 'rejected';
        return { role:c.role, name:p.name, position:p.pos, date:done ? mark('พิจารณาในระบบ', c.at) : BLANK_DATE, decision:{ approve_box:box(c.status === 'approved'), reject_box:box(c.status === 'rejected') } }; })),
    layout:{ dense:r.lines.length > PDF_MIN_ROWS },   /* เกิน 5 ช่วง = ระยะบรรทัดกระชับ ให้จบในหน้าเดียวได้นานที่สุด */

}

/* ---------- wizard actions ---------- */
function goStep(n){ S.dw.step = n; render(); }
function setLine(i, k, v, soft){
  const f = wf(), l = f.lines[i]; l[k] = v; dirty();
  if (k === 'dFrom' && v && (!l.dTo || l.dTo < v)) l.dTo = v;   /* ไปวันเดียว = ไม่ต้องกรอกถึงวันที่ */
  if ((k === 'dFrom' || k === 'dTo') && f.mode === 'overnight' && f.nAuto) f.nights = f.paid = maxNights(f.lines);
  if (S.dw.err && S.dw.err.lines && S.dw.err.lines[i]) delete S.dw.err.lines[i][k];
  if (soft){ const el = document.querySelector(`[name="lp-${i}"]`); if (el && v.trim()) el.classList.remove('is-bad'); return; }
  if (S.dw.err && S.dw.err.lineMsg) delete S.dw.err.lineMsg[i];
  render();
}
function addLine(){ const f = wf(), last = f.lines[f.lines.length - 1]; f.lines.push(Object.assign(blankLine(), last ? { tFrom:last.tFrom, tTo:last.tTo, purpose:last.purpose } : {})); dirty(); render();
  requestAnimationFrame(() => { const el = document.querySelector(`[name="ld-f-${f.lines.length - 1}"]`); if (el) el.focus(); }); }
function removeLine(i){ const f = wf(); if (f.lines.length === 1) return; f.lines.splice(i, 1); if (S.dw.err){ S.dw.err.lines = {}; S.dw.err.lineMsg = {}; } if (f.mode === 'overnight' && f.nAuto) f.nights = f.paid = maxNights(f.lines); dirty(); render(); }
function setMode(m){ const f = wf(); f.mode = m; if (m === 'day'){ f.nights = 0; f.paid = 0; f.nAuto = true; } else if (!f.nights || f.nAuto){ f.nights = f.paid = maxNights(f.lines); f.nAuto = true; } dirty(); if (S.dw.err){ delete S.dw.err.nights; delete S.dw.err.paid; } render(); }
function stepNum(k, d){ const f = wf(); setNum(k, Math.max(0, (Number(f[k]) || 0) + d)); const el = document.querySelector(`[name="${k}"]`); if (el) el.value = f[k]; }
function setNum(k, v){
  const f = wf(), n = Math.max(0, Math.floor(Number(v) || 0)), syncPaid = k === 'nights' && f.paid === f.nights;
  f[k] = n; if (syncPaid) f.paid = n; f.nAuto = false; dirty();
  if (S.dw.err){ delete S.dw.err[k]; if (k === 'nights') delete S.dw.err.paid; }
  /* soft update — ไม่ rebuild ระหว่างพิมพ์ */
  const help = document.getElementById('nightsHelp');
  if (help) help.textContent = nightsHint(f);
  const pl = document.querySelector('.pd-line'); if (pl) pl.classList.toggle('is-warn', f.nights > maxNights(f.lines) || f.paid > f.nights);
  if (syncPaid){ const p = document.querySelector('[name="paid"]'); if (p) p.value = f.paid; }
  const set = (id, t) => { const el = document.getElementById(id); if (el) el.textContent = t; };
  set('pdTotal', fmtMoney(perDiem(f))); set('sumTotal', fmtMoney(perDiem(f))); set('pdN', f.nights); set('pdP', f.paid);
  ['fNights', 'fPaid'].forEach(id => { const el = document.getElementById(id); if (el) el.classList.remove('is-invalid'); });

function nightsHint(f){ const mx = maxNights(f.lines); return f.paid > f.nights ? 'คืนที่ได้เบี้ยเลี้ยงต้องไม่เกินคืนที่ค้าง' : f.nights > mx ? `มากกว่าช่วงวันที่ (ค้างได้ ${mx} คืน) — ตรวจอีกครั้ง` : `ช่วงวันที่ค้างได้ ${mx} คืน`; }
function validateMain(){
  const f = wf(), err = { lines:{}, lineMsg:{} };
  const add = (i, keys, msg) => { err.lines[i] = Object.assign(err.lines[i] || {}, keys); if (!err.lineMsg[i]) err.lineMsg[i] = msg; };
  f.lines.forEach((l, i) => {
    const noDate = !l.dFrom || !l.dTo, noWhy = !l.purpose.trim();
    if (noDate || noWhy) add(i, { dFrom:!l.dFrom, dTo:!l.dTo, purpose:noWhy }, noDate && noWhy ? 'เลือกวันที่และบอกว่าไปทำอะไร' : noDate ? 'เลือกวันที่ไป' : 'บอกว่าไปทำอะไร ที่ไหน');
    if (l.dFrom && l.dTo && l.dTo < l.dFrom) add(i, { dTo:1 }, 'วันที่กลับต้องไม่ก่อนวันที่ไป');
    if (!l.tFrom || !l.tTo) add(i, { tFrom:!l.tFrom, tTo:!l.tTo }, 'ใส่เวลาให้ครบ');
    else if (l.dFrom && l.dFrom === l.dTo && l.tTo <= l.tFrom) add(i, { tTo:1 }, 'เวลาสิ้นสุดต้องหลังเวลาเริ่ม');
  });
  f.lines.forEach((a, i) => f.lines.forEach((b, j) => {
    if (j <= i || !a.dFrom || !a.dTo || !b.dFrom || !b.dTo) return;
    if (a.dFrom <= b.dTo && b.dFrom <= a.dTo) add(j, { dFrom:1, dTo:1 }, `วันที่ซ้อนกับช่วงที่ ${i + 1}`);
  }));
  if (f.mode === 'overnight'){ if (!(f.nights >= 1)) err.nights = 1; if (f.paid > f.nights) err.paid = 1; }
  Object.keys(err.lines).forEach(i => { Object.keys(err.lines[i]).forEach(k => { if (!err.lines[i][k]) delete err.lines[i][k]; }); });
  const ok = !Object.keys(err.lineMsg).length && !err.nights && !err.paid;
  S.dw.err = ok ? null : err; return ok;
}

}

function persist(){
  const f = wf(), me = ME(), t = nowIso();
  let r = S.dw.editId ? findR(S.dw.editId) : null;
  if (!r){
    SEQ += 1;
    r = { id:'R' + SEQ, code:DOC.prefix + '-2569-' + String(SEQ).padStart(4, '0'), status:'draft', emp:S.me, pos:me.pos, dept:me.dept, reqDate:TODAY, note:'',
      chain:resolveDoa(S.me), doa_entry_ref:MOCK_DOA_RESOLVED.doa_entry_ref, attachments:[], audit:[{ act:'สร้างเอกสาร', by:me.name, at:t, tone:'' }], createdBy:me.name, createdAt:t };
    RECS.unshift(r);
  } else r.audit.push({ act:'แก้ไขร่าง', by:me.name, at:t, tone:'' });
  Object.assign(r, { mode:f.mode, nights:f.mode === 'overnight' ? f.nights : 0, paid:f.mode === 'overnight' ? f.paid : 0, rate:f.rate, lines:f.lines.map(l => Object.assign({}, l)), attachments:f.files.slice(), copyOf:f.copyOf, updatedBy:me.name, updatedAt:t });
  return r;
}
function saveDraft(){ if (S.busy) return; if (!validateMain()){ S.dw.step = 1; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const r = persist(); S.busy = false; closeDrawer(true); setTimeout(() => showToast('บันทึกร่างแล้ว · ' + r.code, 'info'), 300); }, 500); }
function saveAndSubmit(){ if (S.busy) return; if (!validateMain()){ S.dw.step = 1; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }

       <div class="drawer-fields mt-3">${kv('ลักษณะ', pill(MODE, r.mode))}${kv('เบี้ยเลี้ยง', r.mode === 'overnight' ? fmtMoney(perDiem(r)) : 'ไม่มี')}</div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="btnSubmit" onclick="confirmSubmit()" ${S.busy ? 'disabled' : ''}>${busyLabel('send', 'ส่งขออนุญาต')}</button>`);
  }

    return modalShell('check-circle-2', 'is-success', 'อนุญาตให้ออกปฏิบัติงานนอกสถานที่?', `${r.code} · ${esc(empOf(r.emp).name)} · ${rangeText(r.lines)}`,
      `<div class="drawer-fields">${kv('ลักษณะ', pill(MODE, r.mode))}${kv('เบี้ยเลี้ยง', r.mode === 'overnight' ? fmtMoney(perDiem(r)) : 'ไม่มี')}</div>
       <div class="field mt-3"><label class="field-label">ความเห็น</label><textarea class="input" name="apNote" rows="2" placeholder="ไม่บังคับ" oninput="S.md.note=this.value">${esc(m.note || '')}</textarea></div>`,

      `${presetChips(rej ? REJECT_PRESETS : CANCEL_PRESETS, m.preset)}
       <div class="field ${m.err ? 'is-invalid' : ''}" id="fReason"><label class="field-label">เหตุผล<span class="req">*</span></label><textarea class="input" name="reason" rows="3" placeholder="${rej ? 'แจ้งผู้ขอว่าเพราะอะไร' : 'เหตุผลที่ยกเลิก'}" oninput="S.md.reason=this.value; if(this.value.trim()) document.getElementById('fReason').classList.remove('is-invalid')">${esc(m.reason || '')}</textarea><div class="field-error">กรุณาระบุเหตุผล</div></div>`,

  }
  return '';
}

    r.status = next ? 'pending' : 'approved'; pushAudit(r, next ? 'อนุญาต (ขั้น ' + c.step + ')' : 'อนุญาต', c.note, 'ok');
    S.busy = false; closeModal(); render(); setTimeout(() => showToast('อนุญาตแล้ว · ' + r.code, 'success'), 220); }, 600);
}
function confirmReason(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (!(m.reason || '').trim()){ m.err = true; render(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    const why = m.reason.trim();
    if (m.kind === 'reject'){ const c = curStep(r); c.status = 'rejected'; c.at = nowIso(); c.note = why; r.chain.filter(x => x.status === 'waiting').forEach(x => { x.status = 'skipped'; }); r.status = 'rejected'; pushAudit(r, 'ไม่อนุญาต', why, 'bad'); }
    else { r.status = 'cancelled'; const c = curStep(r); if (c) c.status = 'skipped'; pushAudit(r, 'ยกเลิกเอกสาร', why, 'bad'); }
    S.busy = false; closeModal(); render(); setTimeout(() => showToast(m.kind === 'reject' ? 'ไม่อนุญาตแล้ว · ' + r.code : 'ยกเลิกเอกสารแล้ว · ' + r.code, m.kind === 'reject' ? 'warning' : 'info'), 220); }, 600);
}

/* ---------- ไฟล์แนบ (file_policy เดียวกับ Document Center) ---------- */
const FILE_ACCEPT = '.pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg', FILE_RE = /\.(pdf|docx?|xlsx?|png|jpe?g)$/i, FILE_MAX_MB = 20;
const fmtSize = b => b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
function gateFiles(list){
  const ok = [], bad = [];
  list.forEach(x => { if (!FILE_RE.test(x.name)) bad.push([x.name, 'ชนิดไฟล์ไม่รองรับ']); else if (x.size > FILE_MAX_MB * 1048576) bad.push([x.name, `ไฟล์ใหญ่เกินกำหนด (สูงสุด ${FILE_MAX_MB} MB)`]); else ok.push(x); });
  if (bad.length) showToast(bad.length === 1 ? `${bad[0][0]} — ${bad[0][1]}` : `แนบไม่ได้ ${bad.length} ไฟล์ — ชนิดไฟล์ไม่รองรับหรือใหญ่เกิน ${FILE_MAX_MB} MB`, 'error');
  if (ok.length && S.sim === 'upload_fail'){ S.sim = null; showToast('แนบไฟล์ไม่สำเร็จ กรุณาลองใหม่อีกครั้ง', 'error'); return []; }
  return ok;
}

  return true;
}
