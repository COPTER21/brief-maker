function copyInto(f, src){ Object.assign(f, { copyOf:src.id, ctype:src.ctype, party:src.party, unit:src.unit }); }
function dupRec(id){ closeRowMenu(); if (S.dw) closeDrawer(true, true); setTimeout(() => startWizard(null, id), S.dw ? 300 : 0); }
function wf(){ return S.dw.form; }
function dirty(){ S.dw.dirty = true; }
function stepper(){
  const s = S.dw.step;
  return `<div class="d-stepper">${STEPS.map((l, i) => { const n = i + 1, cls = n === s ? 'active' : n < s ? 'done' : '';
    return `<div class="stepper-item ${cls}" ${n < s ? `onclick="goStep(${n})"` : ''}><div class="stepper-circle step-dot">${n < s ? '<i data-lucide="check" class="w-4 h-4"></i>' : n}</div><div class="stepper-label">${l}</div></div>`; }).join('')}</div>`;
}
const STEPH = (icon, title, hint) => `<div class="step-h"><i data-lucide="${icon}" class="w-4 h-4"></i><span>${title}</span></div>${hint ? `<div class="step-hint">${hint}</div>` : ''}`;
/* สรุปด้านขวา — อัปเดตสด (ผู้รับผิดชอบดึงจากระบบ) */
function sumCard(f){
  const me = ME(), st = resolveDoa(S.me);
  return `<aside class="wz-sum"><div class="wz-sum-h">สรุปคำขอ</div>
    <div class="wz-sum-row"><div class="wz-sum-k">ผู้รับผิดชอบ</div>${empChip(me.id, me.pos + ' · ' + me.dept)}</div>
    <div class="wz-sum-sep"></div>
    <div class="wz-sum-row"><div class="wz-sum-k">ประเภท</div><div class="wz-sum-v">${f.ctype ? CTYPE[f.ctype][0] : '—'}</div></div>
    <div class="wz-sum-row"><div class="wz-sum-k">จุดประสงค์</div><div class="wz-sum-v">${f.purpose ? PURPOSE_SHORT[f.purpose] : '—'}</div></div>
    <div class="wz-sum-row"><div class="wz-sum-k">คู่สัญญา</div><div class="wz-sum-v" id="sumParty">${f.party ? esc(f.party) : '—'}</div></div>
    <div class="wz-sum-row"><div class="wz-sum-k">ระยะสัญญา</div><div class="wz-sum-v">${f.start || f.end ? periodText(f) : '—'}</div><div class="wz-sum-m num">${durText(f.start, f.end)}</div></div>
    <div class="wz-sum-sep"></div>
    <div class="wz-sum-row"><div class="wz-sum-k">สายพิจารณา (${st.length} ขั้น)</div>${st.map(c => `<div class="wz-sum-m">${c.step}. ${c.role}${c.assignee ? ' · ' + esc(empOf(c.assignee).name) : ''}</div>`).join('')}</div>
    <div class="wz-sum-foot"><i data-lucide="link-2" class="w-3 h-3"></i>ผู้รับผิดชอบและสายพิจารณาดึงจากระบบ</div></aside>`;
}
function optCard(group, k, label, on){ return `<button type="button" class="track-card opt-card ${on ? 'is-on' : ''}" onclick="setOpt('${group}', '${k}')"><span class="tc-main"><span class="tc-t">${label}</span></span><span class="tc-radio"></span></button>`; }
function wizMain(){
  const f = wf(), err = S.dw.err || {}, src = f.copyOf ? findR(f.copyOf) : null;
  return `<div class="wz-split"><div class="wz-main">
      ${STEPH('clipboard-list', 'ข้อมูลหลักคำขอ', 'เลือกประเภทและจุดประสงค์ แล้วใส่คู่สัญญาและระยะสัญญา — ผู้รับผิดชอบและวันที่ระบบใส่ให้')}
      ${src ? `<div class="alert-row"><i data-lucide="copy" class="w-4 h-4"></i><div>ทำซ้ำจาก <b class="mono">${src.code}</b> — เลือกจุดประสงค์และวันที่สัญญาใหม่</div></div>` : ''}
      <div class="wz-card ${err.ctype ? 'is-bad' : ''}" id="cType"><div class="wz-card-h"><span class="wz-no">1</span><span>ประเภทของสัญญา</span></div>
        <div class="opt-grid">${Object.keys(CTYPE).map(k => optCard('ctype', k, CTYPE[k][0], f.ctype === k)).join('')}</div>
        ${err.ctype ? '<div class="trip-err"><i data-lucide="alert-circle" class="w-3.5 h-3.5"></i>เลือกประเภทของสัญญา</div>' : ''}</div>
      <div class="wz-card ${err.purpose ? 'is-bad' : ''}" id="cPurpose"><div class="wz-card-h"><span class="wz-no">2</span><span>จุดประสงค์ร้องขอ</span></div>
        <div class="opt-grid is-3">${Object.keys(PURPOSE).map(k => optCard('purpose', k, PURPOSE_SHORT[k], f.purpose === k)).join('')}</div>
        ${err.purpose ? '<div class="trip-err"><i data-lucide="alert-circle" class="w-3.5 h-3.5"></i>เลือกจุดประสงค์ร้องขอ</div>' : ''}
        ${f.purpose === 'amend' ? `<div class="field mt-3 ${err.reason ? 'is-invalid' : ''}" id="fReasonW"><label class="field-label">ระบุสาเหตุ<span class="req">*</span></label><textarea class="input" name="reason" rows="2" placeholder="แก้ไข/เปลี่ยนแปลงเพราะอะไร" oninput="setText('reason', this.value)">${esc(f.reason)}</textarea><div class="field-error">กรุณาระบุสาเหตุ</div></div>` : ''}</div>
      <div class="wz-card"><div class="wz-card-h"><span class="wz-no">3</span><span>คู่สัญญาและระยะสัญญา</span></div>
        <div class="form-grid-2">
          <div class="field span-2 ${err.party ? 'is-invalid' : ''}" id="fParty"><label class="field-label">ชื่อคู่สัญญา<span class="req">*</span></label><input class="input" name="party" value="${esc(f.party)}" placeholder="ชื่อบริษัท/บุคคลคู่สัญญา" oninput="setText('party', this.value)"><div class="field-error">กรุณาระบุชื่อคู่สัญญา</div></div>
          <div class="field ${err.start ? 'is-invalid' : ''}" id="fStart"><label class="field-label">วันที่เริ่มต้นสัญญา<span class="req">*</span></label>${bedateHTML('cStart', f.start, { onPick:'pickStart', placeholder:'เลือกวันที่เริ่มต้น' })}<div class="field-error">เลือกวันที่เริ่มต้น</div></div>
          <div class="field ${err.end ? 'is-invalid' : ''}" id="fEnd"><label class="field-label">วันที่สิ้นสุดสัญญา<span class="req">*</span></label>${bedateHTML('cEnd', f.end, { min:f.start, onPick:'pickEnd', placeholder:'เลือกวันที่สิ้นสุด' })}<div class="field-error">${err.end === 2 ? 'วันที่สิ้นสุดต้องไม่ก่อนวันที่เริ่มต้น' : 'เลือกวันที่สิ้นสุด'}</div></div>
          <div class="field span-2 ${err.unit ? 'is-invalid' : ''}" id="fUnit"><label class="field-label">หน่วยงานเจ้าของสัญญา<span class="req">*</span></label>${searchSelectHTML('wunit', { placeholder:'เลือกหน่วยงาน' })}<div class="field-error">เลือกหน่วยงานเจ้าของสัญญา</div></div>
        </div>
        ${f.start && f.end && f.end >= f.start ? `<div class="pd-line"><div class="pd-text">ระยะสัญญา <b class="num">${durText(f.start, f.end)}</b> · ${periodText(f)}</div></div>` : ''}</div>
    </div>${sumCard(f)}</div>`;
}
function wizAttach(){
  const f = wf();
  return STEPH('paperclip', 'แนบเอกสารประกอบ (ถ้ามี)', 'เช่น ร่างสัญญา สัญญาฉบับลงนาม หรือเอกสารแนบท้าย')
    + `<div class="upload-zone" onclick="document.getElementById('ctrFile').click()"><div class="uz-ic"><i data-lucide="upload-cloud" class="w-5 h-5"></i></div>
        <div class="uz-t">${f.files.length ? 'แนบไฟล์เพิ่ม' : 'คลิกเพื่อแนบไฟล์ (เลือกได้หลายไฟล์)'}</div><div class="uz-d">PDF, Word, Excel หรือรูปภาพ ไม่เกิน 20 MB ต่อไฟล์</div></div>
      <input type="file" id="ctrFile" multiple hidden accept="${FILE_ACCEPT}" onchange="pickFiles(this)">
      ${f.files.map((x, i) => `<div class="file-row"><div class="file-ic"><i data-lucide="file" class="w-4 h-4"></i></div><div class="file-name">${esc(x.name)}</div><span class="file-size">${x.size}</span><button class="ra-btn is-danger" title="ลบไฟล์" onclick="removeFile(${i})"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>`).join('')}`;
}
function wizReview(){
  const f = wf(), me = ME(), st = resolveDoa(S.me);
  return STEPH('check-circle-2', 'ตรวจสอบและยืนยัน', 'ส่งแล้วแก้ไขไม่ได้ — ถ้าถูกส่งกลับจะกลับเป็นร่างเลขที่เดิม')
    + (f.end && f.end < TODAY ? `<div class="alert-row"><i data-lucide="history" class="w-4 h-4"></i><div>สัญญาสิ้นสุดไปแล้ว (${fmtDate(f.end)}) — ตรวจสอบอีกครั้ง</div></div>` : '')
    + `<div class="review-card"><div class="review-title"><i data-lucide="file-text" class="w-4 h-4"></i>ข้อมูลคำขอ</div><div class="drawer-fields">
        ${kv('ผู้รับผิดชอบ', esc(me.name) + ' · ' + esc(me.pos))}${kv('วันที่', fmtDate(TODAY))}${kv('ประเภทของสัญญา', pill(CTYPE, f.ctype))}${kv('จุดประสงค์ร้องขอ', esc(PURPOSE_SHORT[f.purpose]))}${f.purpose === 'amend' ? kv('สาเหตุ', esc(f.reason)) : ''}</div></div>
      <div class="review-card"><div class="review-title"><i data-lucide="handshake" class="w-4 h-4"></i>สัญญา</div><div class="drawer-fields">
        ${kv('ชื่อคู่สัญญา', esc(f.party))}${kv('หน่วยงานเจ้าของสัญญา', esc(f.unit))}${kv('วันที่เริ่มต้นและสิ้นสุดสัญญา', periodText(f))}${kv('ระยะเวลา', durText(f.start, f.end))}</div></div>
      <div class="review-card"><div class="review-title"><i data-lucide="pen-tool" class="w-4 h-4"></i>สายพิจารณา<span class="dt-count num">${st.length}</span></div><div class="drawer-fields">${st.map(c => kv('ขั้น ' + c.step + ' · ' + c.role, c.assignee ? empChip(c.assignee) : '<span class="cell-mute">เลือกตอนส่ง</span>')).join('')}</div></div>
      <div class="review-card"><div class="review-title"><i data-lucide="paperclip" class="w-4 h-4"></i>เอกสารแนบ<span class="dt-count num">${f.files.length}</span></div>${f.files.length ? f.files.map(fileRow).join('') : '<div class="tl-body">ไม่มีเอกสารแนบ</div>'}</div>`;
}
function renderWizard(){
  const s = S.dw.step, edit = S.dw.editId ? findR(S.dw.editId) : null, last = s === STEPS.length;
  const body = s === 1 ? wizMain() : s === 2 ? wizAttach() : wizReview();
  return `<div class="dw-head"><div class="dw-head-row"><div>
        <div class="dw-eyebrow"><i data-lucide="${edit ? 'pencil' : 'file-plus'}" class="w-3.5 h-3.5"></i> ${edit ? 'แก้ไขเอกสาร' : 'สร้างเอกสารใหม่'}</div>
        <h2 class="dw-title">${edit ? edit.code : 'ขอลงทะเบียนควบคุมสัญญา/เอกสารสำคัญ'}</h2></div>
        <button class="top-icon-btn" title="ปิด" onclick="closeDrawer()"><i data-lucide="x" class="w-5 h-5"></i></button></div>${stepper()}</div>
    <div class="drawer-body ${s === 1 ? 'is-soft' : ''}">${body}</div>
    <div class="dw-footer"><div>${s > 1 ? '<button class="btn btn-secondary" onclick="wizBack()"><i data-lucide="arrow-left" class="w-4 h-4"></i><span>ย้อนกลับ</span></button>' : ''}</div>
      <div class="dw-footer-right"><button class="btn btn-ghost" onclick="closeDrawer()">ยกเลิก</button>
        ${last ? `<button class="btn btn-secondary" id="btnDraft" onclick="saveDraft()" ${S.busy ? 'disabled' : ''}><i data-lucide="save" class="w-4 h-4"></i><span>${edit ? 'บันทึกการแก้ไข' : 'บันทึกแบบร่าง'}</span></button>
          <button class="btn btn-primary" id="btnSaveSubmit" onclick="saveAndSubmit()" ${S.busy ? 'disabled' : ''}>${S.busy ? '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>' : '<i data-lucide="send" class="w-4 h-4"></i><span>บันทึกและส่งพิจารณา</span>'}</button>`
          : '<button class="btn btn-primary" id="btnNext" onclick="wizNext()"><span>ถัดไป</span><i data-lucide="arrow-right" class="w-4 h-4"></i></button>'}
      </div></div>`;
}

/* ---------- wizard actions ---------- */
function goStep(n){ S.dw.step = n; render(); }
function setOpt(group, k){ const f = wf(); f[group] = k; if (group === 'purpose' && k !== 'amend') f.reason = ''; dirty(); if (S.dw.err){ delete S.dw.err[group]; if (group === 'purpose') delete S.dw.err.reason; } render(); }
/* soft update ระหว่างพิมพ์ — ไม่ rebuild (focus ไม่หลุด) */
function setText(k, v){ const f = wf(); f[k] = v; dirty();
  if (S.dw.err && v.trim()){ delete S.dw.err[k]; const el = document.getElementById(k === 'party' ? 'fParty' : 'fReasonW'); if (el) el.classList.remove('is-invalid'); }
  if (k === 'party'){ const s = document.getElementById('sumParty'); if (s) s.textContent = v.trim() || '—'; } }
function pickStart(iso){ const f = wf(); f.start = iso; if (f.end && f.end < iso) f.end = ''; dirty(); if (S.dw.err) delete S.dw.err.start; render(); }
function pickEnd(iso){ const f = wf(); f.end = iso; dirty(); if (S.dw.err) delete S.dw.err.end; render(); }
function validateMain(){
  const f = wf(), err = {};
  if (!f.ctype) err.ctype = 1;
  if (!f.purpose) err.purpose = 1;
  if (f.purpose === 'amend' && !f.reason.trim()) err.reason = 1;   /* DEC-04 — แก้ไข/เปลี่ยนแปลง ต้องระบุสาเหตุ */
  if (!f.party.trim()) err.party = 1;
  if (!f.start) err.start = 1;
  if (!f.end) err.end = 1; else if (f.start && f.end < f.start) err.end = 2;   /* DEC-14 — สิ้นสุด ≥ เริ่มต้น */
  if (!f.unit) err.unit = 1;
  const ok = !Object.keys(err).length; S.dw.err = ok ? null : err; return ok;
}
function wizNext(){
  if (S.dw.step === 1 && !validateMain()){ render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.dw.step += 1; render();
}
function wizBack(){ S.dw.step = Math.max(1, S.dw.step - 1); render(); }
function pickFiles(inp){ const f = wf(); gateFiles(Array.from(inp.files || [])).forEach(x => f.files.push({ name:x.name, size:fmtSize(x.size) })); inp.value = ''; dirty(); render(); }
function removeFile(i){ wf().files.splice(i, 1); dirty(); render(); }
/* บันทึกครั้งแรก = ENG-DOC-NUM.next('CTR') ออกเลขที่ (DEC-10) · ข้อมูลผู้รับผิดชอบ snapshot ลงเอกสาร */
function persist(){
  const f = wf(), me = ME(), t = nowIso();
  let r = S.dw.editId ? findR(S.dw.editId) : null;
  if (!r){
    SEQ += 1;
    r = { id:'R' + SEQ, code:DOC.prefix + '-2569-' + String(SEQ).padStart(4, '0'), status:'draft', emp:S.me, pos:me.pos, dept:me.dept, reqDate:TODAY,
      chain:resolveDoa(S.me), doa_entry_ref:MOCK_DOA_RESOLVED.doa_entry_ref, regNo:'', regAt:null, regBy:'', recvDate:'', returned:null, attachments:[],
      audit:[{ act:'สร้างเอกสาร', by:me.name, at:t, tone:'' }], createdBy:me.name, createdAt:t };
    RECS.unshift(r);
  } else r.audit.push({ act:'แก้ไขร่าง', by:me.name, at:t, tone:'' });
  Object.assign(r, { ctype:f.ctype, purpose:f.purpose, reason:f.purpose === 'amend' ? f.reason.trim() : '', party:f.party.trim(), start:f.start, end:f.end, unit:f.unit,
    attachments:f.files.slice(), copyOf:f.copyOf, updatedBy:me.name, updatedAt:t });
  return r;
}
function saveDraft(){ if (S.busy) return; if (!validateMain()){ S.dw.step = 1; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const r = persist(); S.busy = false; closeDrawer(true); setTimeout(() => showToast('บันทึกร่างแล้ว · ' + r.code, 'info'), 300); }, 500); }
function saveAndSubmit(){ if (S.busy) return; if (!validateMain()){ S.dw.step = 1; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const r = persist(); S.busy = false; closeDrawer(true); setTimeout(() => openSubmit(r.id), 300); }, 500); }

/* =====================================================================
   MODALS — ส่งพิจารณา (DOA slot ต่อขั้น) · อนุมัติ/รับทราบ · ไม่อนุมัติ/ส่งกลับ (กลับเป็นร่าง) · ยกเลิก · ลงทะเบียน · รับต้นฉบับ · ทิ้งข้อมูล
   ===================================================================== */
function modalShell(icon, tone, title, sub, body, foot){
  return `<div class="modal-header"><div class="modal-header-icon ${tone}"><i data-lucide="${icon}" class="w-4 h-4"></i></div><div><h3 class="modal-title">${title}</h3><p class="modal-subtitle">${sub}</p></div></div>
    ${body ? `<div class="modal-body">${body}</div>` : ''}<div class="modal-footer">${foot}</div>`;
}
const busyLabel = (icon, label) => S.busy ? '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>' : `<i data-lucide="${icon}" class="w-4 h-4"></i><span>${label}</span>`;
function presetChips(list, cur){ return `<div class="chip-row">${list.map(p => `<button type="button" class="chip ${cur === p ? 'is-on' : ''}" onclick="setReasonPreset(this.dataset.v)" data-v="${esc(p)}">${esc(p)}</button>`).join('')}</div>`; }
const nextRegNo = () => DOC.reg + '-2569-' + String(REG_SEQ + 1).padStart(4, '0');
function renderModal(){
  const m = S.md; if (!m) return '';
  const r = m.id ? findR(m.id) : null;
  if (m.kind === 'submit'){
    return modalShell('send', 'is-primary', 'ส่งพิจารณา?', `${r.code} · ${CTYPE[r.ctype][0]} · ${esc(r.party)}`,
      `${resolveDoa(r.emp).map((c, i) => `<div class="slot-row"><span class="slot-no num">${c.step}</span><span class="slot-role">${c.role}</span><div class="field ${m.err && !m.slots[i] ? 'is-invalid' : ''}" id="fSlot${i}">${searchSelectHTML('slot' + i, { placeholder:'เลือกผู้พิจารณา' })}<div class="field-error">กรุณาเลือกผู้พิจารณา</div>${i === 0 ? '<div class="slot-help">ค่าเริ่มต้นจากสายอนุมัติ (DOA กลาง) และผังองค์กร</div>' : ''}</div></div>`).join('')}`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="btnSubmit" onclick="confirmSubmit()" ${S.busy ? 'disabled' : ''}>${busyLabel('send', 'ส่งพิจารณา')}</button>`);
  }
  if (m.kind === 'approve'){
    const w = wordsOf(curStep(r).role_id);
    return modalShell('check-circle-2', 'is-success', w[0] + 'คำขอนี้?', `${r.code} · ${esc(empOf(r.emp).name)} · ขั้น ${curStep(r).step} ${curStep(r).role}`,
      `<div class="drawer-fields">${kv('ประเภท', pill(CTYPE, r.ctype))}${kv('คู่สัญญา', esc(r.party))}${kv('ระยะสัญญา', periodText(r))}${kv('จุดประสงค์', esc(PURPOSE_SHORT[r.purpose]))}</div>
       <div class="field mt-3"><label class="field-label">ความเห็น</label><textarea class="input" name="apNote" rows="2" placeholder="ไม่บังคับ" oninput="S.md.note=this.value">${esc(m.note || '')}</textarea></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-success" id="btnApprove" onclick="confirmApprove()" ${S.busy ? 'disabled' : ''}>${busyLabel('check', w[0])}</button>`);
  }
  if (m.kind === 'reject' || m.kind === 'cancel'){
    const rej = m.kind === 'reject', w = rej ? wordsOf(curStep(r).role_id) : null;

function confirmSubmit(){

    r.chain = resolveDoa(r.emp).map((c, i) => Object.assign(c, { assignee:m.slots[i], status:i === 0 ? 'pending' : 'waiting' }));   /* BR-DOA-02 resolve ตอนส่งแล้ว freeze */
    r.status = 'pending'; r.submittedAt = nowIso(); r.returned = null; pushAudit(r, 'ส่งพิจารณา', 'ถึง ' + empOf(m.slots[0]).name);
    S.busy = false; closeModal(); render(); setTimeout(() => showToast('ส่งพิจารณาแล้ว · ' + r.code, 'success'), 220); }, 600);
}
/* sequential — ผ่านครบทุกขั้นจึง "รอลงทะเบียน" · ไม่เปลี่ยนค่าในระบบอื่น ไม่ส่งต่อ (DEC-01/02) */
function confirmApprove(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    const c = curStep(r), w = wordsOf(c.role_id); c.status = 'approved'; c.at = nowIso(); c.note = (m.note || '').trim();
    const next = r.chain.find(x => x.status === 'waiting'); if (next) next.status = 'pending';
    r.status = next ? 'pending' : 'approved'; pushAudit(r, w[0] + ' (ขั้น ' + c.step + ')', c.note, 'ok');
    S.busy = false; closeModal(); render(); setTimeout(() => showToast(w[0] + 'แล้ว · ' + r.code, 'success'), 220); }, 600);
}
/* DEC-08: ไม่อนุมัติ/ส่งกลับ = กลับเป็นร่างเลขที่เดิม (BR-DOA-03) · ยกเลิก = จบใบ */
function confirmReason(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (!(m.reason || '').trim()){ m.err = true; render(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    const why = m.reason.trim();
    if (m.kind === 'reject'){ const c = curStep(r), w = wordsOf(c.role_id), me = ME();
      pushAudit(r, w[1] + ' (ขั้น ' + c.step + ') — ส่งกลับเป็นร่าง', why, 'bad');
      r.returned = { by:me.name, at:nowIso(), note:why }; r.status = 'draft'; r.chain = resolveDoa(r.emp); }
    else { r.status = 'cancelled'; const c = curStep(r); if (c) c.status = 'skipped'; pushAudit(r, 'ยกเลิกเอกสาร', why, 'bad'); }
    S.busy = false; closeModal(); if (m.kind === 'reject' && S.dw && !canSee(r)) closeDrawer(true); render();
    setTimeout(() => showToast(m.kind === 'reject' ? 'ส่งกลับเป็นร่างแล้ว · ' + r.code : 'ยกเลิกเอกสารแล้ว · ' + r.code, m.kind === 'reject' ? 'warning' : 'info'), 220); }, 600);
}
/* ลงทะเบียน = ENG-DOC-NUM.next() ของทะเบียนควบคุม (รูปแบบเลข = OQ) */
function confirmRegister(){

    S.busy = false; closeModal(); render(); setTimeout(() => showToast('ลงทะเบียนแล้ว · ' + r.regNo, 'success'), 220); }, 600);
}
function confirmReceive(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (!m.date){ m.err = true; render(); return; }

}

/* ---------- ไฟล์แนบ (file_policy เดียวกับ Document Center) ---------- */
const FILE_ACCEPT = '.pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg', FILE_RE = /\.(pdf|docx?|xlsx?|png|jpe?g)$/i, FILE_MAX_MB = 20;
const fmtSize = b => b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
function gateFiles(list){
  const ok = [], bad = [];
  list.forEach(x => { if (!FILE_RE.test(x.name)) bad.push([x.name, 'ชนิดไฟล์ไม่รองรับ']); else if (x.size > FILE_MAX_MB * 1048576) bad.push([x.name, `ไฟล์ใหญ่เกินกำหนด (สูงสุด ${FILE_MAX_MB} MB)`]); else ok.push(x); });
  if (bad.length) showToast(bad.length === 1 ? `${bad[0][0]} — ${bad[0][1]}` : `แนบไม่ได้ ${bad.length} ไฟล์ — ชนิดไฟล์ไม่รองรับหรือใหญ่เกิน ${FILE_MAX_MB} MB`, 'error');
  if (ok.length && S.sim === 'upload_fail'){ S.sim = null; showToast('แนบไฟล์ไม่สำเร็จ กรุณาลองใหม่อีกครั้ง', 'error'); return []; }
  return ok;
}
/* prototype hook: S.sim = 'stale' | 'denied' | 'error' | 'upload_fail' → จำลองผลตอบกลับ API ครั้งถัดไป (ระบบจริง = 409 / 403 / 500) */

  const k = S.sim; if (!k || k === 'upload_fail') return false;

  showToast(k === 'stale' ? 'ข้อมูลถูกแก้โดยผู้อื่น กรุณารีเฟรชแล้วลองใหม่' : k === 'denied' ? 'คุณไม่มีสิทธิ์ทำรายการนี้' : 'ทำรายการไม่สำเร็จ กรุณาลองใหม่อีกครั้ง', k === 'denied' ? 'warning' : 'error');
  return true;
}
