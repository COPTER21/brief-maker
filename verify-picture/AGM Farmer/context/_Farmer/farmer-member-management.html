<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จัดการสมาชิกเกษตรกร · CUBE NATIVE</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">

<style>
/* ============== CSS VARIABLES (CUBE CI — Warm Light) ============== */
:root {
  --c-navy: #111111;
  --c-navy-2: #111111;
  --c-primary: #FF3B30;
  --c-primary-hover: #E62E24;
  --c-teal: #FF9A1F;
  --c-teal-light: #FFB763;
  --c-ink: #111111;
  --c-mute: #54565C;
  --c-mute-2: #73757B;
  --c-mute-3: #9A9CA2;
  --c-line: #DEDAD4;
  --c-line-2: #E9E5E0;
  --c-line-3: #F1EEEA;
  --c-bg-off: #FAF8F5;
  --c-success: #1F9D55;
  --c-warning: #E8870F;
  --c-danger: #E62E24;
  --sidebar-w: 232px;
  --shell-h: 52px;
  --fs-h1: 22px; --fs-h2: 17px; --fs-h3: 15px; --fs-body: 14px;
  --fs-sub: 13px; --fs-meta: 12px; --fs-cap: 11px; --fs-kpi: 28px;
  --sp-xs: 4px; --sp-sm: 8px; --sp-md: 12px; --sp-lg: 20px; --sp-xl: 28px;
  --r-xs: 4px; --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-full: 999px;
}

/* ============== RESET ============== */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { scrollbar-gutter: stable; }

/* ============== SCROLLBAR (Iron Rule #49) ============== */
* { scrollbar-width: thin; scrollbar-color: rgba(17,17,17,.16) transparent; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(17,17,17,.14); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: rgba(17,17,17,.26); }
.sidebar, .slide { scrollbar-color: rgba(255,255,255,.28) transparent; }
.sidebar ::-webkit-scrollbar-thumb, .slide ::-webkit-scrollbar-thumb,
.sidebar::-webkit-scrollbar-thumb, .slide::-webkit-scrollbar-thumb { background: rgba(255,255,255,.28); }
.sidebar ::-webkit-scrollbar-thumb:hover, .slide ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.42); }
body {
  font-family: 'Satoshi', 'Noto Sans Thai', system-ui, sans-serif;
  background: var(--c-bg-off);
  color: #2A2B2F;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-width: 1180px;
}
a { text-decoration: none; color: inherit; }
button { font-family: inherit; cursor: pointer; }
[data-lucide] { flex-shrink: 0; }
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; }

/* ============== SIDEBAR ============== */
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--sidebar-w);
  background: #111111; color: #E9E5E0; z-index: 20;
  display: flex; flex-direction: column;
  border-right: 1px solid rgba(255,255,255,0.06);
}
.sb-brand { padding: 18px; display: flex; align-items: center; gap: 11px; border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; }
.sb-logo {
  width: 34px; height: 34px; background: linear-gradient(135deg, #FF3B30, #FF9A1F);
  border-radius: 9px; display: inline-flex; align-items: center; justify-content: center;
  color: #fff; flex-shrink: 0; box-shadow: 0 4px 12px rgba(255,59,48,0.3);
}
.sb-name { font-weight: 700; font-size: 14px; color: #fff; letter-spacing: -0.01em; line-height: 1.2; }
.sb-sub { font-size: 10px; color: #9A9CA2; letter-spacing: 0.06em; font-weight: 600; text-transform: uppercase; margin-top: 2px; }
.sb-nav { flex: 1; padding: 12px 8px; overflow-y: auto; }
.sb-module { margin-bottom: 4px; }
.sb-module-header {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 8px 10px; border-radius: 6px; background: transparent; border: 0;
  color: #9A9CA2; font-family: inherit; font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: all 120ms; text-align: left;
}
.sb-module-header:hover { background: rgba(255,255,255,0.04); color: #DEDAD4; }
.sb-module-header .mod-icon { flex-shrink: 0; opacity: 0.7; }
.sb-module-header .mod-label { flex: 1; }
.sb-module-header .mod-chevron { flex-shrink: 0; transition: transform 200ms; opacity: 0.7; }
.sb-module[data-expanded="false"] .mod-chevron { transform: rotate(-90deg); }
.sb-module[data-expanded="false"] .sb-features { display: none; }
.sb-features { padding: 2px 0 6px 0; }
.sb-item {
  display: flex; align-items: center; gap: 10px; padding: 7px 12px 7px 14px;
  border-radius: 6px; color: #DEDAD4; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all 120ms; margin-bottom: 1px; position: relative; user-select: none;
}
.sb-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.sb-item.is-active { background: #FF3B30; color: #fff; font-weight: 600; }
.sb-item.is-active::before {
  content: ''; position: absolute; left: -10px; top: 7px; bottom: 7px;
  width: 3px; background: #fff; border-radius: 0 2px 2px 0;
}
.sb-item [data-lucide] { width: 16px; height: 16px; opacity: 0.85; }
.sb-item.is-active [data-lucide] { opacity: 1; }
.sb-item.is-disabled { opacity: 0.4; cursor: not-allowed; }
.sb-item.is-disabled:hover { background: transparent; color: #DEDAD4; }
.sb-footer {
  padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.06);
  display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: #9A9CA2;
}
.pulse-dot { width: 7px; height: 7px; background: var(--c-teal); border-radius: 50%; box-shadow: 0 0 0 3px rgba(255,154,31,0.20); animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

/* ============== MAIN + SHELL BAR ============== */
.main { margin-left: var(--sidebar-w); min-height: 100vh; background: var(--c-bg-off); }
.shell-bar {
  position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--c-line-2);
  height: var(--shell-h); display: flex; align-items: center; padding: 0 22px; z-index: 19; gap: 12px;
}
.breadcrumb { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--c-mute); }
.breadcrumb a { cursor: pointer; transition: color 120ms; }
.breadcrumb a:hover { color: var(--c-primary); }
.breadcrumb .sep { color: var(--c-mute-3); font-size: 10px; }
.breadcrumb-current { color: var(--c-ink); font-weight: 500; }
.icon-btn {
  width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border: 0; color: var(--c-mute); border-radius: 7px; position: relative; transition: all 120ms;
}
.icon-btn:hover { background: var(--c-line-3); color: var(--c-ink); }
.icon-btn [data-lucide] { width: 17px; height: 17px; }
.notif-dot { position: absolute; top: 7px; right: 8px; width: 7px; height: 7px; background: var(--c-danger); border-radius: 50%; border: 2px solid #fff; }
.user-chip { display: flex; align-items: center; gap: 9px; padding: 5px 10px 5px 12px; border-radius: 8px; cursor: pointer; transition: background 120ms; }
.user-chip:hover { background: var(--c-line-3); }
.user-text { line-height: 1.2; text-align: right; }
.user-name { font-size: 12.5px; font-weight: 500; color: var(--c-ink); white-space: nowrap; }
.user-role { font-size: 10.5px; color: var(--c-mute-2); white-space: nowrap; margin-top: 1px; }
.avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: linear-gradient(135deg, var(--c-primary), var(--c-teal));
  color: #fff; display: inline-flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600; flex-shrink: 0;
}
.user-menu {
  position: absolute; top: calc(var(--shell-h) - 4px); right: 22px; background: #fff;
  border: 1px solid var(--c-line-2); border-radius: 10px; box-shadow: 0 12px 32px rgba(17,17,17,0.12);
  width: 240px; z-index: 30; padding: 6px; display: none;
}
.user-menu.is-open { display: block; }
.user-menu-item { display: flex; align-items: center; gap: 10px; padding: 8px 11px; border-radius: 6px; font-size: 13px; color: var(--c-ink); cursor: pointer; transition: background 120ms; }
.user-menu-item:hover { background: var(--c-bg-off); }
.user-menu-item [data-lucide] { width: 15px; height: 15px; color: var(--c-mute-2); }
.user-menu-item.is-danger { color: var(--c-danger); }
.user-menu-item.is-danger [data-lucide] { color: var(--c-danger); }
.user-menu-divider { height: 1px; background: var(--c-line-2); margin: 5px 0; }

/* ============== CONTENT (fluid — Iron Rule #30) ============== */
.content { padding: 22px; }

/* ============== PAGE HEADER ============== */
.ph { margin-bottom: 18px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 14px; }
.ph > div:first-child { flex: 1 1 auto; min-width: 280px; }
.ph-title-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 5px; }
.ph-title { font-family: 'Noto Sans Thai', sans-serif; font-size: 22px; font-weight: 700; color: var(--c-navy); margin: 0; letter-spacing: -0.01em; }
.ph-count { font-size: 12.5px; font-weight: 600; color: var(--c-mute-2); background: var(--c-line-3); padding: 3px 9px; border-radius: 999px; }
.ph-sub { font-size: 13px; color: var(--c-mute); margin: 0; }
.ph-actions { display: flex; gap: 8px; flex-shrink: 0; }

/* ============== BUTTONS (Iron Rule #36 — Thai optical center) ============== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 36px; padding: 2px 14px 0; border-radius: 8px; font-size: 13px; font-weight: 500;
  border: 1px solid transparent; background: transparent; white-space: nowrap;
  transition: all 120ms; user-select: none; cursor: pointer;
}
.btn [data-lucide] { width: 15px; height: 15px; flex-shrink: 0; }
.btn:disabled, .btn.is-disabled { opacity: .55; cursor: not-allowed; pointer-events: none; }
.btn-eq { min-width: 104px; }
.btn-primary { background: var(--c-primary); color: #fff; }
.btn-primary:hover { background: var(--c-primary-hover); box-shadow: 0 2px 8px rgba(255,59,48,0.30); }
.btn-secondary { background: #fff; border-color: var(--c-line); color: var(--c-ink); }
.btn-secondary:hover { background: var(--c-line-3); border-color: var(--c-mute-2); }
.btn-ghost { color: var(--c-mute); }
.btn-ghost:hover { background: var(--c-line-3); color: var(--c-ink); }
.btn-danger { background: #fff; border-color: var(--c-line); color: var(--c-danger); }
.btn-danger:hover { background: #FFE9E7; border-color: var(--c-danger); }
.btn-danger.is-solid { background: var(--c-danger); border-color: var(--c-danger); color: #fff; }
.btn-danger.is-solid:hover { background: #C81E15; }
.btn-link { background: transparent; border: 0; padding: 0 4px; height: auto; color: var(--c-primary); font-weight: 500; }
.btn-link:hover { text-decoration: underline; }
.btn-sm { height: 30px; padding: 2px 11px 0; font-size: 12px; }

/* ============== STATS ============== */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 18px; }
.stat { background: #fff; border: 1px solid var(--c-line-2); border-radius: 10px; padding: 14px 16px; transition: all 150ms; }
.stat:hover { border-color: var(--c-line); box-shadow: 0 2px 8px rgba(17,17,17,0.05); }
.stat-label { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--c-mute); }
.stat-label [data-lucide] { width: 13px; height: 13px; color: var(--c-primary); }
.stat-value { font-family: 'Noto Sans Thai', sans-serif; font-size: 26px; font-weight: 700; color: var(--c-navy); margin-top: 6px; letter-spacing: -0.01em; }
.stat-meta { font-size: 11.5px; color: var(--c-mute-2); margin-top: 5px; display: flex; align-items: center; gap: 4px; }
.stat-meta.is-warn { color: var(--c-warning); }
.stat-meta [data-lucide] { width: 12px; height: 12px; }

/* ============== CARD / FILTER ============== */
.card { background: #fff; border: 1px solid var(--c-line-2); border-radius: 10px; overflow: hidden; }
.filter-bar { padding: 14px 18px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--c-line-2); background: #fff; flex-wrap: wrap; }

/* ============== INPUTS ============== */
.input, .select {
  height: 36px; padding: 0 12px; border: 1px solid var(--c-line); border-radius: 8px;
  font-size: 13px; background: #fff; color: var(--c-ink); font-family: inherit; transition: all 120ms; width: 100%;
}
.input:focus, .select:focus { outline: none; border-color: var(--c-primary); box-shadow: 0 0 0 3px rgba(255,59,48,0.10); }
.input:disabled, .input[readonly] { background: var(--c-line-3); color: var(--c-mute-2); cursor: not-allowed; border-color: var(--c-line-2); }
.select {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2364748B' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat; background-position: right 10px center; padding-right: 32px; appearance: none;
}
.input-search { position: relative; flex: 1; max-width: 340px; }
.input-search input { padding-left: 36px; }
.input-search .lead-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--c-mute-2); pointer-events: none; }

/* ===== SEARCH-SELECT (Iron Rule #34) ===== */
.search-select { position: relative; width: 100%; }
.search-select .ss-input { padding-left: 34px; padding-right: 34px; }
.search-select .ss-lead { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--c-mute-3); pointer-events: none; }
.search-select .ss-caret { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--c-mute-3); pointer-events: none; }
.search-select .ss-clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: inline-flex; padding: 3px; border: 0; background: transparent; color: var(--c-mute-2); cursor: pointer; border-radius: 6px; }
.search-select .ss-clear:hover { background: var(--c-line-3); color: var(--c-ink); }
.search-select.is-disabled .ss-input { background: var(--c-line-3); color: var(--c-mute-2); cursor: not-allowed; }
.ss-list {
  position: absolute; z-index: 70; left: 0; right: 0; margin-top: 4px; max-height: 280px; overflow-y: auto;
  background: #fff; border: 1px solid var(--c-line); border-radius: 8px;
  box-shadow: 0 10px 30px rgba(17,17,17,0.10), 0 4px 10px rgba(17,17,17,0.05);
}
.ss-opt { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 0; border-bottom: 1px solid var(--c-line-3); background: transparent; cursor: pointer; text-align: left; font-family: inherit; }
.ss-opt:last-child { border-bottom: 0; }
.ss-opt:hover, .ss-opt.is-active { background: rgba(255,59,48,0.06); }
.ss-opt-ic { width: 16px; height: 16px; color: var(--c-primary); flex-shrink: 0; }
.ss-opt-main { flex: 1; min-width: 0; }
.ss-opt-label { display: block; font-size: 13px; color: var(--c-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ss-opt-sub { display: block; font-size: 11.5px; color: var(--c-mute-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ss-opt-right { flex-shrink: 0; font-size: 12px; color: var(--c-mute); }
.ss-opt mark { background: rgba(255,59,48,0.16); color: inherit; padding: 0 1px; border-radius: 2px; }
.ss-empty { padding: 20px 14px; text-align: center; font-size: 13px; color: var(--c-mute-2); }

/* ============== TABLE ============== */
.table-scroll { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table thead { background: var(--c-bg-off); }
.table th {
  padding: 11px 14px; text-align: left; font-weight: 600; color: var(--c-mute);
  font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em;
  border-bottom: 1px solid var(--c-line-2); white-space: nowrap;
}
.table th.col-check { width: 40px; padding-right: 0; }
.table td { padding: 13px 14px 11px; border-bottom: 1px solid var(--c-line-2); color: var(--c-ink); vertical-align: middle; }
.table tbody tr { transition: background 120ms; }
.table tbody tr:hover { background: var(--c-bg-off); }
.table tbody tr.is-selected { background: rgba(255,59,48,0.04); }
.table tbody tr.is-selected:hover { background: rgba(255,59,48,0.07); }
.table tbody tr:last-child td { border-bottom: 0; }
.table tbody tr.is-clickable { cursor: pointer; }
.table-scroll.is-sticky { max-height: 560px; overflow-y: auto; scrollbar-gutter: stable; }
.table-scroll.is-sticky thead th { position: sticky; top: 0; z-index: 3; background: var(--c-bg-off); box-shadow: inset 0 -1px 0 var(--c-line-2); }
.cell-truncate { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
th.col-num, td.col-num { text-align: right; }
.mono { font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }

/* ============== CHECKBOX ============== */
.cb {
  width: 16px; height: 16px; border: 1.5px solid var(--c-line); border-radius: 4px; background: #fff;
  cursor: pointer; display: inline-block; position: relative; transition: all 120ms; flex-shrink: 0;
}
.cb.is-checked, .cb.is-partial { background: var(--c-primary); border-color: var(--c-primary); }
.cb.is-checked::after { content: ''; position: absolute; left: 4px; top: 1px; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.cb.is-partial::after { content: ''; position: absolute; left: 3px; top: 6px; width: 8px; height: 2px; background: #fff; }
.cb:hover { border-color: var(--c-primary); }
.cb.is-disabled { opacity: 0.35; cursor: not-allowed; }
.cb.is-disabled:hover { border-color: var(--c-line); }

/* ============== PILLS ============== */
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px 3px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.pill [data-lucide] { width: 11px; height: 11px; }
.pill-info    { background: #E6F0FF; color: #1A5FCC; }
.pill-success { background: #E4F4EB; color: #157A41; }
.pill-warning { background: #FFF1DD; color: #B8690B; }
.pill-danger  { background: #FFE9E7; color: #E62E24; }
.pill-muted   { background: var(--c-line-3); color: var(--c-mute-2); }
.pill-outline { background: #fff; border: 1px solid var(--c-line); color: var(--c-mute); }

@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 0.8s linear infinite; }

/* ============== FORM SECTION (Iron Rule #45) ============== */
.form-section { margin-top: var(--sp-xl); }
.form-section:first-child { margin-top: 0; }
.form-section-title {
  font-size: var(--fs-cap); font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--c-mute);
  padding-bottom: var(--sp-sm); border-bottom: 1px solid var(--c-line-2); margin-bottom: var(--sp-md);
}
.form-grp { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 16px; }

/* ============== ROW ACTIONS ============== */
.row-actions { display: inline-flex; gap: 2px; }
.ra-btn {
  width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border: 0; color: var(--c-mute-2); border-radius: 6px; transition: all 120ms;
}
.ra-btn:hover { background: var(--c-line-3); color: var(--c-primary); }
.ra-btn.is-danger:hover { background: #FFE9E7; color: var(--c-danger); }
.ra-btn [data-lucide] { width: 15px; height: 15px; }

/* ============== TABLE FOOTER / BULK BAR ============== */
.table-footer {
  padding: 12px 18px; background: var(--c-bg-off); border-top: 1px solid var(--c-line-2);
  display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--c-mute); flex-wrap: wrap; gap: 10px;
}
.pagination { display: inline-flex; gap: 4px; align-items: center; }
.pg-btn {
  min-width: 30px; height: 30px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center;
  background: #fff; border: 1px solid var(--c-line-2); border-radius: 6px; color: var(--c-mute);
  font-size: 12.5px; font-weight: 500; cursor: pointer; transition: all 120ms;
}
.pg-btn:hover { border-color: var(--c-line); background: var(--c-bg-off); }
.pg-btn.is-active { background: var(--c-primary); border-color: var(--c-primary); color: #fff; }
.pg-btn.is-disabled { opacity: 0.4; cursor: not-allowed; }
.pg-btn [data-lucide] { width: 13px; height: 13px; }
.bulk-bar {

<script>
(function loadLucide() {
  var version = '0.469.0';
  var cdns = [
    'https://unpkg.com/lucide@' + version + '/dist/umd/lucide.min.js',
    'https://cdn.jsdelivr.net/npm/lucide@' + version + '/dist/umd/lucide.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/lucide/' + version + '/lucide.min.js'
  ];
  var i = 0;
  function tryNext() {
    if (i >= cdns.length) {
      console.warn('[Lucide] All CDNs failed. Icons จะไม่แสดง but UI ยังใช้งานได้');
      window.lucide = window.lucide || { createIcons: function() {} };
      window.dispatchEvent(new Event('lucide:ready'));
      return;
    }
    var s = document.createElement('script');
    s.src = cdns[i++];
    s.onload = function() { window.dispatchEvent(new Event('lucide:ready')); };
    s.onerror = tryNext;
    document.head.appendChild(s);
  }
  tryNext();
})();
</script>

const SUPERVISOR   = { id: 'u-supervisor-01', name: 'ประวิทย์ ตรวจการ', role: 'R-02' };

function renderIcons() {

function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDate(iso){ if(!iso) return '—'; var d = new Date(iso); if(isNaN(d)) return String(iso);
  return d.toLocaleDateString('th-TH', { year:'numeric', month:'short', day:'numeric' }); }
function fmtDateTime(iso){ if(!iso) return '—'; var d = new Date(iso); if(isNaN(d)) return String(iso);
  return d.toLocaleString('th-TH', { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' }); }
// S02-04 Data Masking — citizen_id บน list แสดง masked เสมอ
function maskCitizen(c){ if(!c || c.length !== 13) return '—'; return c[0] + '-XXXX-XXXX-XX-' + c[12]; }
function fmtCitizenFull(c){ if(!c || c.length !== 13) return c || '—';
  return c[0] + '-' + c.slice(1,5) + '-' + c.slice(5,10) + '-' + c.slice(10,12) + '-' + c[12]; }

// ============================================
// ROUTER (hash, refresh-safe)
// #/members · #/members/FM-000001
// ============================================
function getRoute() {
  var hash = location.hash;
  if (!hash || hash === '#' || hash === '#/') return 'members';
  return hash.replace(/^#\//, '');
}
function navigate(route){ location.hash = '#/' + route; }

// ============================================
// LIST — filter / sort / paginate (Pattern A)
// ============================================
function getFilteredRecords() {
  var arr = state.records.filter(function(m){ return !m.is_deleted; });
  if (state.filters.status !== 'all') arr = arr.filter(function(m){ return m.verify_status === state.filters.status; });
  if (state.filters.search) {
    var q = state.filters.search.toLowerCase().trim();
    arr = arr.filter(function(m){
      return m.first_name.toLowerCase().includes(q) || m.last_name.toLowerCase().includes(q)
        || m.phone.includes(q) || m.citizen_id.includes(q) || m.member_id.toLowerCase().includes(q);
    });
  }
  if (state.sort.col) {
    arr = arr.slice().sort(function(a, b){
      var va = a[state.sort.col] == null ? '' : a[state.sort.col];
      var vb = b[state.sort.col] == null ? '' : b[state.sort.col];
      var cmp = String(va).localeCompare(String(vb), 'th');
      return state.sort.dir === 'asc' ? cmp : -cmp;
    });
  }
  return arr;
}
function getPaginated() {
  var all = getFilteredRecords();
  var page = state.pagination.page, pageSize = state.pagination.pageSize;
  var start = (page - 1) * pageSize;
  return {
    records: all.slice(start, start + pageSize), total: all.length, page: page,
    totalPages: Math.max(1, Math.ceil(all.length / pageSize)),
    start: all.length === 0 ? 0 : start + 1, end: Math.min(start + pageSize, all.length)
  };
}
function sortBy(col) {
  if (state.sort.col === col) state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc';
  else { state.sort.col = col; state.sort.dir = 'asc'; }
  render();
}
function toggleSelect(id) {
  if (state.selectedIds.has(id)) state.selectedIds.delete(id); else state.selectedIds.add(id);
  render();
}
function toggleSelectAll() {
  // EC-06 — เลือกทั้งหมด = เฉพาะแถว Pending (selectable) ในหน้าปัจจุบัน
  var selectable = getPaginated().records.filter(function(m){ return m.verify_status === 'pending_approval'; });
  var allSelected = selectable.length > 0 && selectable.every(function(m){ return state.selectedIds.has(m.id); });
  if (allSelected) selectable.forEach(function(m){ state.selectedIds.delete(m.id); });
  else selectable.forEach(function(m){ state.selectedIds.add(m.id); });
  render();
}
function goToPage(n) {
  var tp = getPaginated().totalPages;
  if (n < 1 || n > tp) return;
  state.pagination.page = n; render();
}
function resetFilters() {
  state.filters = { search: '', status: 'all' };
  state.pagination.page = 1; state.selectedIds.clear(); render();
}
var _searchTimer = null;
function onSearchInput(v) {
  // US-03 — debounce 300ms
  clearTimeout(_searchTimer);
  _searchTimer = setTimeout(function(){
    state.filters.search = v; state.pagination.page = 1; render();
  }, 300);
}

// ============================================
// RENDER PRESERVATION (Iron Rule #29)
// ============================================
function preserveRenderState() {
  var activeEl = document.activeElement;
  var isInput = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA');
  return {
    pageScroll: window.scrollY,
    focusKey: isInput ? { id: activeEl.id || '', placeholder: activeEl.placeholder || '', selStart: activeEl.selectionStart, selEnd: activeEl.selectionEnd } : null
  };
}
function restoreRenderState(snap) {
  if (!snap) return;
  requestAnimationFrame(function(){
    if (snap.pageScroll > 0) window.scrollTo(0, snap.pageScroll);
    if (snap.focusKey) {
      var c = snap.focusKey.id ? document.getElementById(snap.focusKey.id) : null;
      if (!c) {
        var cands = document.querySelectorAll('input, textarea');
        for (var i = 0; i < cands.length; i++) {
          if ((cands[i].placeholder || '') === snap.focusKey.placeholder) { c = cands[i]; break; }
        }
      }
      if (c) {
        c.focus();
        if (snap.focusKey.selStart != null && typeof c.setSelectionRange === 'function') {
          try { c.setSelectionRange(snap.focusKey.selStart, snap.focusKey.selEnd); } catch(e) {}
        }
      }
    }
  });
}

function emptyStateHTML(cfg) {

}

    +   '<th style="text-align:right;">การดำเนินการ</th>'
    + '</tr></thead>'

    + '</table>'
    + emptyBlock
    + '</div>'
    + '<div class="table-footer">'
    +   '<div class="pagination">'
    +     '<button class="pg-btn ' + (pg.page === 1 ? 'is-disabled' : '') + '" onclick="goToPage(' + (pg.page - 1) + ')"><i data-lucide="chevron-left" class="w-3 h-3"></i></button>'
    +     pageNumbers.map(function(n){ return '<button class="pg-btn ' + (n === pg.page ? 'is-active' : '') + '" onclick="goToPage(' + n + ')">' + n + '</button>'; }).join('')
    +     '<button class="pg-btn ' + (pg.page === pg.totalPages ? 'is-disabled' : '') + '" onclick="goToPage(' + (pg.page + 1) + ')"><i data-lucide="chevron-right" class="w-3 h-3"></i></button>'
    +   '</div>'
    +   '<span>' + pg.start + ' – ' + pg.end + ' จาก ' + pg.total + ' รายการ</span>'
    + '</div>'
    + '</div>';

  renderIcons();
  restoreRenderState(snap);

  // route-driven view drawer (refresh-safe #/members/FM-000001)
  if (parts.length > 1 && parts[1]) {
    var m = findMember(parts[1]);
    if (m && !m.is_deleted) {
      if (!state.view || state.view.id !== m.id) { state.view = { id: m.id, tab: 'detail' }; mountViewDrawer(); }
    } else if (!m) { navigate('members'); }
  } else if (state.view) {
    state.view = null; unmountOverlay();
  }
}

// ============================================
// OVERLAY (drawer v2 shell — Patterns B/C)

function unmountOverlay() {
  document.getElementById('overlay-root').innerHTML = '';
}
function mountPanel(contentId, standard) {
  document.getElementById('overlay-root').innerHTML =
    '<div class="overlay-wrap">'
    + '<div class="backdrop" onclick="closeTopDrawer()"></div>'
    + '<div id="drawer-panel" class="drawer-panel ' + (standard ? 'standard ' : '') + 'drawer-enter">'
    +   '<div id="' + contentId + '" style="display:flex; flex-direction:column; height:100%;"></div>'
    + '</div></div>';
  var p = document.getElementById('drawer-panel');
  requestAnimationFrame(function(){ p.classList.add('drawer-active'); });
}
function closePanel(after) {
  var p = document.getElementById('drawer-panel');
  if (p) { p.classList.remove('drawer-active'); p.classList.add('drawer-enter'); }
  setTimeout(function(){ unmountOverlay(); if (after) after(); }, 200);
}
function closeTopDrawer() {
  if (state.form) closeForm();
  else if (state.view) closeView();
}

function blankForm() {
  return { first_name: '', last_name: '', citizen_id: '', phone: '', email: '',
    address_line: '', province: '', district: '', subdistrict: '', postal_code: '' };
}
function openForm(mode, id) {
  var data, member = null;
  if (mode === 'edit') {
    member = findMember(id); if (!member) return;
    // BACKEND: โหลดค่าเดิมผ่าน F-AGM-001-API-03 (legacy FN-AT-AGM-102)
    data = {
      first_name: member.first_name, last_name: member.last_name, citizen_id: member.citizen_id,
      phone: member.phone, email: member.email, address_line: member.address_line,
      province: member.province, district: member.district, subdistrict: member.subdistrict, postal_code: member.postal_code
    };
  } else { data = blankForm(); }
  state.form = { mode: mode, id: member ? member.id : null, data: data, submitting: false,
    wasRejected: !!(member && member.verify_status === 'rejected'),
    expected_updated_at: member ? member.updated_at : null };
  // ถ้า view drawer เปิดอยู่ → แทนที่ overlay (กลับมา view ไม่ได้ใน mock — ปิด view state)
  if (state.view) { state.view = null; if (getRoute() !== 'members') navigate('members'); }
  mountPanel('form-content', false);
  renderFormDrawer();
}
function closeForm() {
  if (state.form && state.form.submitting) return;
  state.form = null;
  closePanel();
}
function fval(id){ var el = document.getElementById(id); return el ? el.value : ''; }

function initAddressSelects() {
  var d = state.form.data;
  initSearchSelect('province', {
    options: ADDRESS.map(function(a){ return { value: a.p, label: a.p, icon: 'map-pin' }; }),
    value: d.province || null,
    onSelect: function(val){
      captureFormInputs();
      if (state.form.data.province !== val) {
        // VR-11 — cascade reset
        state.form.data.province = val || '';
        state.form.data.district = ''; state.form.data.subdistrict = ''; state.form.data.postal_code = '';
        refreshAddressSelects();
      }
    }
  });
  refreshAddressSelects(true);
}
function refreshAddressSelects(initial) {
  var d = state.form.data;
  initSearchSelect('district', {
    options: getDistricts(d.province).map(function(x){ return { value: x.d, label: x.d }; }),
    value: d.district || null,
    emptyText: d.province ? 'ไม่พบอำเภอ' : 'เลือกจังหวัดก่อน',
    onSelect: function(val){
      captureFormInputs();
      if (state.form.data.district !== val) {
        state.form.data.district = val || '';
        state.form.data.subdistrict = ''; state.form.data.postal_code = '';
        refreshAddressSelects();
      }
    }
  });
  initSearchSelect('subdistrict', {
    options: getSubs(d.province, d.district).map(function(x){ return { value: x.s, label: x.s, right: x.z }; }),
    value: d.subdistrict || null,
    emptyText: d.district ? 'ไม่พบตำบล' : 'เลือกอำเภอก่อน',
    onSelect: function(val){
      captureFormInputs();
      state.form.data.subdistrict = val || '';
      state.form.data.postal_code = val ? getPostal(state.form.data.province, state.form.data.district, val) : '';
      var pz = document.getElementById('f-postal_code');
      if (pz) pz.value = state.form.data.postal_code;
    }
  });
  var dEl = document.querySelector('#ss-district .ss-input');
  if (dEl) { dEl.disabled = !d.province; dEl.closest('.search-select').classList.toggle('is-disabled', !d.province); }
  var sEl = document.querySelector('#ss-subdistrict .ss-input');
  if (sEl) { sEl.disabled = !d.district; sEl.closest('.search-select').classList.toggle('is-disabled', !d.district); }
  var pz = document.getElementById('f-postal_code');
  if (pz) pz.value = d.postal_code || '';
}
// Validators (05_RULES §5.4)
function vRequired(msg){ return function(v){ return v.trim() ? '' : msg; }; }
function vCitizen(v){ v = v.replace(/\D/g, ''); if (!v) return 'กรุณากรอกเลขบัตรประชาชน';
  return v.length === 13 ? '' : 'เลขบัตรประชาชนต้องเป็นตัวเลข 13 หลัก'; }
function vPhone(v){ v = v.replace(/\D/g, ''); if (!v) return 'กรุณากรอกเบอร์โทรศัพท์';
  return (v.length >= 9 && v.length <= 12) ? '' : 'เบอร์โทรศัพท์ต้องเป็นตัวเลข 9-12 หลัก'; }
function vEmail(v){ v = v.trim(); if (!v) return 'กรุณากรอกอีเมล'; // authoritative — email required
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? '' : 'รูปแบบอีเมลไม่ถูกต้อง'; }
function validateField(el, validator){

function validateFormAll() {

  // VR-05 — citizen_id unique ต่อ tenant (exclude ตัวเอง)
  if (d.citizen_id.length === 13) {

async function submitForm() {
  var f = state.form; if (!f || f.submitting) return;

  btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>';
  renderIcons();
  // BACKEND: POST/PUT + Idempotency-Key {FN-SEQ-AGM-110|111}:{id}:{user} + expected_updated_at (LOCK-03)
  await new Promise(function(r){ setTimeout(r, 600); });
  var d = f.data, msg = '';
  if (f.mode === 'create') {
    var mid = nextMemberId();
    var now = new Date().toISOString();
    var nm = {
      id: 'm-' + mid, member_id: mid,

      created_at: now, created_by: CURRENT_USER.name, updated_at: now, updated_by: CURRENT_USER.name,
      history: [ { event: 'create', actor: CURRENT_USER.name, at: now, note: null } ]
    };
    state.records.unshift(nm);
    msg = 'สร้างสมาชิกสำเร็จ — ' + mid;
  } else {
    var m = findMember(f.id);
    var resubmitted = m.verify_status === 'rejected'; // LOCK-06
    var oldNote = m.verified_note;
    m.first_name = d.first_name; m.last_name = d.last_name;
    var citizenChanged = m.citizen_id !== d.citizen_id && m.verify_status === 'approved';
    m.citizen_id = d.citizen_id; m.phone = d.phone; m.email = d.email;
    m.address_line = d.address_line; m.province = d.province; m.district = d.district;
    m.subdistrict = d.subdistrict; m.postal_code = d.postal_code;
    m.updated_at = new Date().toISOString(); m.updated_by = CURRENT_USER.name;
    if (resubmitted) {
      m.verify_status = 'pending_approval';
      m.verified_by = null; m.verified_at = null; m.verified_note = null;
      addHistory(m, 'resubmit', CURRENT_USER.name, oldNote ? 'เหตุผลที่ถูกปฏิเสธเดิม: ' + oldNote : null);
      msg = 'บันทึกแล้ว — รายการกลับเข้าคิวรอตรวจสอบ';
    } else {
      addHistory(m, 'edit', CURRENT_USER.name, citizenChanged ? 'แก้ไขเลขบัตรประชาชนหลังอนุมัติ — บันทึกเข้ารายงานความผิดปกติ (Anomaly Report)' : null);
      msg = 'บันทึกการแก้ไขแล้ว';
    }
  }
  state.form = null;
  closePanel();
  render();
  showToast(msg, 'success');

// ============================================
// SEARCH-SELECT (Iron Rule #34 — helper กลาง)
// ============================================
window.__ss = window.__ss || {};
function ssGet(key){ return window.__ss[key]; }
function ssEscapeReg(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function searchSelectHTML(key, opt){
  opt = opt || {};
  var ph = opt.placeholder || 'ค้นหา...';
  return ''
    + '<div class="search-select" id="ss-' + key + '">'
    +   '<i data-lucide="search" class="ss-lead w-4 h-4"></i>'
    +   '<input type="text" class="input ss-input" id="ss-input-' + key + '" autocomplete="off" placeholder="' + ph + '"'
    +     ' oninput="ssOnInput(\'' + key + '\', this.value)" onfocus="ssOpen(\'' + key + '\')" onkeydown="ssOnKey(\'' + key + '\', event)">'
    +   '<button type="button" class="ss-clear hidden" id="ss-clear-' + key + '" tabindex="-1" onclick="ssClear(\'' + key + '\')"><i data-lucide="x" class="w-4 h-4"></i></button>'
    +   '<i data-lucide="chevron-down" class="ss-caret" id="ss-caret-' + key + '"></i>'
    +   '<div class="ss-list hidden" id="ss-list-' + key + '"></div>'
    + '</div>';
}
function initSearchSelect(key, cfg){
  cfg = cfg || {};
  window.__ss[key] = {
    options: cfg.options || [], value: (cfg.value != null ? cfg.value : null),
    onSelect: cfg.onSelect || function(){}, emptyText: cfg.emptyText || 'ไม่พบรายการ',
    query: '', open: false, hi: 0
  };
  ssSetText(key); ssSyncChrome(key); renderIcons();
}
function ssFiltered(key){
  var s = ssGet(key); if(!s) return [];
  var q = (s.query || '').toLowerCase().trim();
  if(!q) return s.options;
  return s.options.filter(function(o){
    return String(o.label).toLowerCase().includes(q)
      || String(o.value).toLowerCase().includes(q)
      || String(o.sub || '').toLowerCase().includes(q);
  });
}
function ssSyncChrome(key){
  var s = ssGet(key); if(!s) return;
  var sel = s.options.find(function(o){ return o.value === s.value; });
  var c = document.getElementById('ss-clear-' + key); if(c) c.classList.toggle('hidden', !sel);
  var k = document.getElementById('ss-caret-' + key); if(k) k.classList.toggle('hidden', !!sel);
}
function ssSetText(key){
  var s = ssGet(key); if(!s) return;
  var input = document.getElementById('ss-input-' + key); if(!input) return;
  var sel = s.options.find(function(o){ return o.value === s.value; });
  input.value = s.open ? s.query : (sel ? sel.label : '');
}
function ssRenderList(key){
  var s = ssGet(key); if(!s) return;
  var list = document.getElementById('ss-list-' + key); if(!list) return;
  var items = ssFiltered(key);
  if(items.length === 0){
    list.innerHTML = '<div class="ss-empty">' + s.emptyText + '</div>';
  } else {
    var q = (s.query || '').toLowerCase().trim();
    var hl = function(t){ return q ? String(t).replace(new RegExp('(' + ssEscapeReg(q) + ')', 'gi'), '<mark>$1</mark>') : String(t); };
    list.innerHTML = items.map(function(o, i){
      return '<button type="button" class="ss-opt ' + (i === s.hi ? 'is-active' : '') + '" onmousedown="event.preventDefault()" onclick="ssPick(\'' + key + '\', ' + i + ')">'
        + (o.icon ? '<i data-lucide="' + o.icon + '" class="ss-opt-ic w-4 h-4"></i>' : '')
        + '<span class="ss-opt-main"><span class="ss-opt-label">' + hl(o.label) + '</span>'
        + (o.sub ? '<span class="ss-opt-sub">' + hl(o.sub) + '</span>' : '') + '</span>'
        + (o.right ? '<span class="ss-opt-right">' + o.right + '</span>' : '')
        + '</button>';
    }).join('');
  }
  list.classList.toggle('hidden', !s.open);
  renderIcons();
}
function ssOpen(key){ var s = ssGet(key); if(!s) return;
  var inp = document.getElementById('ss-input-' + key); if (inp && inp.disabled) return;
  s.open = true; s.query = ''; s.hi = 0; ssSetText(key); ssSyncChrome(key); ssRenderList(key); }
function ssOnInput(key, val){ var s = ssGet(key); if(!s) return; s.query = val; s.open = true; s.hi = 0; s.value = null; ssSyncChrome(key); ssRenderList(key); }
function ssPick(key, i){ var s = ssGet(key); if(!s) return; var o = ssFiltered(key)[i]; if(!o) return; s.value = o.value; s.query = ''; s.open = false; ssSetText(key); ssSyncChrome(key); ssRenderList(key); s.onSelect(o.value, o); }
function ssClear(key){ var s = ssGet(key); if(!s) return; s.value = null; s.query = ''; s.open = true; ssSetText(key); ssSyncChrome(key); ssRenderList(key); var inp = document.getElementById('ss-input-' + key); if(inp) inp.focus(); s.onSelect(null, null); }
function ssOnKey(key, e){
  var s = ssGet(key); if(!s) return; var items = ssFiltered(key);
  if(e.key === 'ArrowDown'){ e.preventDefault(); s.open = true; s.hi = Math.min(items.length - 1, s.hi + 1); ssRenderList(key); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); s.hi = Math.max(0, s.hi - 1); ssRenderList(key); }
  else if(e.key === 'Enter'){ e.preventDefault(); if(items[s.hi]) ssPick(key, s.hi); }
  else if(e.key === 'Escape'){ s.open = false; ssSetText(key); ssSyncChrome(key); ssRenderList(key); e.stopPropagation(); }
}
document.addEventListener('click', function(e){
  Object.keys(window.__ss || {}).forEach(function(key){
    var wrap = document.getElementById('ss-' + key); var s = ssGet(key);
    if(wrap && s && s.open && !wrap.contains(e.target)){ s.open = false; ssSetText(key); ssSyncChrome(key); ssRenderList(key); }
  });
});

async function submitVerify() {
  var d = state.modal.data; if (d.busy) return;
  var noteEl = document.getElementById('verify-note');
  d.note = noteEl ? noteEl.value : d.note;
  // VR-06 / VR-07
  if (!d.result) {
    var e1 = document.getElementById('err-verify-result');
    e1.textContent = 'กรุณาเลือกผลการตรวจสอบ'; e1.style.visibility = 'visible';
    showToast('กรุณาเลือกผลการตรวจสอบ', 'warning'); return;
  }
  if (d.result === 'rejected' && !d.note.trim()) {
    var e2 = document.getElementById('err-verify-note');
    e2.textContent = 'จำเป็นต้องระบุเหตุผลเมื่อปฏิเสธ'; e2.style.visibility = 'visible';
    noteEl.closest('.field').classList.add('is-invalid');
    showToast('จำเป็นต้องระบุเหตุผลเมื่อปฏิเสธ', 'warning'); return;
  }
  d.busy = true;
  var btn = document.getElementById('verify-submit');
  btn.disabled = true;
  btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังดำเนินการ…</span>';
  renderIcons();
  // BACKEND: FN-AT-AGM-103 (single: API-05 / bulk: API-06 per-record) + optimistic lock + SoD check
  await new Promise(function(r){ setTimeout(r, 700); });
  var ok = 0, fail = 0, failMsgs = [];
  d.ids.forEach(function(id){
    var m = findMember(id);
    if (!m || m.is_deleted) { fail++; return; }
    if (m.verify_status !== 'pending_approval') {
      // EC-12 — ถูกตรวจสอบไปแล้ว → ข้าม นับ failed
      fail++; failMsgs.push(m.member_id + ' ถูกตรวจสอบไปแล้ว'); return;
    }
    m.verify_status = d.result;
    m.verified_by = SUPERVISOR.name;
    m.verified_at = new Date().toISOString();
    m.verified_note = d.note.trim() || null;

}

  var m = findMember(d.id);
  if (m) {
    m.is_deleted = true; m.deleted_at = new Date().toISOString(); m.deleted_by = CURRENT_USER.name;
    addHistory(m, 'delete', CURRENT_USER.name, null);
    state.selectedIds.delete(m.id);
  }
  d.busy = false;
  closeModal();
  if (state.view && state.view.id === d.id) closeView();
  render();
  showToast('ลบสมาชิกแล้ว', 'success');
}

          + '<div class="imp-errors">'

          + '</div>';
      } else {
        html += '<div class="note is-info"><i data-lucide="check-circle-2" class="w-4 h-4"></i><span>ทุกแถวผ่านการตรวจสอบ ไม่มีข้อผิดพลาด</span></div>';

        + '<div>· หากไม่ระบุรหัสไปรษณีย์ ระบบจะคำนวณจากตำบลให้ · หากระบุ ต้องตรงกับตำบล</div>'

function downloadTemplate() {
  // BACKEND: API-09 GET /import/template — UTF-8 BOM (Excel ไทยไม่เพี้ยน)
  var content = '﻿' + CSV_COLUMNS.join(',') + '\n'
    + 'สมชาย,ใจดี,1234567890123,0812345678,somchai@example.com,123 หมู่ 5,กาญจนบุรี,ท่าม่วง,วังขนาย,71110\n'
    + 'สมหญิง,รักดี,2345678901234,0823456789,,456 หมู่ 3,กาญจนบุรี,ท่ามะกา,ท่ามะกา,71120\n';
  var blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
  var link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'member-template.csv';
  link.click();
}
function downloadErrorReport() {
  var d = state.modal.data;
  if (!d.errors.length) return;
  var content = '﻿' + 'แถว,ฟิลด์,ข้อผิดพลาด,ข้อมูล\n'
    + d.errors.map(function(e){ return [e.row, e.field, '"' + e.message + '"', '"' + e.data.replace(/"/g, '""') + '"'].join(','); }).join('\n');
  var blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
  var link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'upload-errors.csv';
  link.click();
}
function parseCsv(text) {
  // simple CSV parser — quoted fields + comma in quote
  var rows = [], row = [], cur = '', inQ = false;
  for (var i = 0; i < text.length; i++) {
    var ch = text[i];
    if (inQ) {
      if (ch === '"') { if (text[i+1] === '"') { cur += '"'; i++; } else inQ = false; }
      else cur += ch;
    } else {
      if (ch === '"') inQ = true;
      else if (ch === ',') { row.push(cur); cur = ''; }
      else if (ch === '\n' || ch === '\r') {
        if (ch === '\r' && text[i+1] === '\n') i++;
        row.push(cur); cur = '';
        if (row.length > 1 || row[0] !== '') rows.push(row);
        row = [];
      } else cur += ch;
    }
  }
  if (cur !== '' || row.length) { row.push(cur); if (row.length > 1 || row[0] !== '') rows.push(row); }
  return rows;
}
function onCsvFilePicked(input) {
  var d = state.modal.data;
  var file = input.files && input.files[0];
  if (!file) return;
  // VR-08 — file guard ก่อน request
  if (!/\.csv$/i.test(file.name)) { showToast('กรุณาเลือกไฟล์ CSV เท่านั้น', 'error'); input.value = ''; return; }
  if (file.size > 5 * 1024 * 1024) { showToast('ขนาดไฟล์ต้องไม่เกิน 5MB', 'error'); input.value = ''; return; }
  d.file = file;
  var reader = new FileReader();
  reader.onload = function() {
    var text = String(reader.result || '').replace(/^﻿/, '');
    var rows = parseCsv(text);
    if (rows.length === 0) { showToast('ไฟล์ว่าง ไม่มีข้อมูล', 'error'); return; }
    // EC-10 — header ต้องตรง template เป๊ะ (reject ทั้งไฟล์)
    var header = rows[0].map(function(h){ return h.trim(); });
    var mism = [];
    CSV_COLUMNS.forEach(function(c, i){ if (header[i] !== c) mism.push(c); });
    if (header.length !== CSV_COLUMNS.length || mism.length) {
      d.rows = []; d.errors = []; d.validRows = []; d.phase = 'pick';
      renderImportModal();
      var errEl = document.getElementById('err-csv');
      if (errEl) { errEl.textContent = 'คอลัมน์ไฟล์ไม่ตรงแม่แบบ: ' + (mism.length ? mism.join(', ') : 'จำนวนคอลัมน์ไม่ถูกต้อง (' + header.length + '/10)'); errEl.style.visibility = 'visible'; }
      showToast('ไฟล์ถูกปฏิเสธทั้งไฟล์ — header ไม่ตรงแม่แบบ', 'error');
      return;
    }
    validateCsvRows(rows.slice(1));
    d.phase = 'preview';
    renderImportModal();
  };
  reader.readAsText(file, 'UTF-8');
}
function validateCsvRows(dataRows) {
  var d = state.modal.data;
  d.rows = dataRows; d.errors = []; d.validRows = [];
  var seenInFile = {};
  dataRows.forEach(function(cols, idx){
    var rowNo = idx + 2; // นับรวม header
    var r = {};
    CSV_COLUMNS.forEach(function(c, i){ r[c] = (cols[i] || '').trim(); });
    var dataStr = r.first_name + ' ' + r.last_name;
    function bad(field, msg){ d.errors.push({ row: rowNo, field: field, message: msg, data: dataStr + (r[field] ? ' · ' + field + '=' + r[field] : '') }); }
    var rowOk = true;
    ['first_name','last_name','email','address','province','district','subdistrict'].forEach(function(c){
      if (!r[c]) { bad(c, 'กรุณากรอก' + ({first_name:'ชื่อ',last_name:'นามสกุล',email:'อีเมล',address:'ที่อยู่',province:'จังหวัด',district:'อำเภอ',subdistrict:'ตำบล'})[c]); rowOk = false; }
    });
    r.citizen_id = r.citizen_id.replace(/\D/g, '');
    if (r.citizen_id.length !== 13) { bad('citizen_id', 'เลขบัตรประชาชนต้องเป็นตัวเลข 13 หลัก'); rowOk = false; }
    r.phone = r.phone.replace(/\D/g, '');
    if (r.phone.length < 9 || r.phone.length > 12) { bad('phone', 'เบอร์โทรศัพท์ต้องเป็นตัวเลข 9-12 หลัก'); rowOk = false; }
    if (r.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(r.email)) { bad('email', 'รูปแบบอีเมลไม่ถูกต้อง'); rowOk = false; }
    if (rowOk && r.citizen_id) {
      // EC-11 — ซ้ำภายในไฟล์ (แถวแรกผ่าน แถวถัดไป error)
      if (seenInFile[r.citizen_id]) { bad('citizen_id', 'เลขบัตรประชาชนซ้ำภายในไฟล์ (แถว ' + seenInFile[r.citizen_id] + ')'); rowOk = false; }
      else seenInFile[r.citizen_id] = rowNo;
    }
    if (rowOk && r.citizen_id) {
      // VR-05 — ซ้ำในระบบ
      var dup = state.records.find(function(m){ return !m.is_deleted && m.citizen_id === r.citizen_id; });
      if (dup) { bad('citizen_id', 'เลขบัตรประชาชนซ้ำ — มีในระบบแล้ว (' + dup.member_id + ')'); rowOk = false; }
    }
    if (rowOk) {
      // EC-13 — resolve ที่อยู่กับ M-01 master
      var subs = getSubs(r.province, r.district);
      var found = subs.find(function(s){ return s.s === r.subdistrict; });
      if (!getDistricts(r.province).length) { bad('province', 'ไม่พบจังหวัดในระบบ'); rowOk = false; }
      else if (!getDistricts(r.province).find(function(x){ return x.d === r.district; })) { bad('district', 'ไม่พบอำเภอในจังหวัด' + r.province); rowOk = false; }
      else if (!found) { bad('subdistrict', 'ไม่พบตำบลใน' + r.district); rowOk = false; }
      else {
        // VR-09 — postal auto / ต้อง match
        if (!r.postal_code) r.postal_code = found.z;
        else if (r.postal_code !== found.z) { bad('postal_code', 'รหัสไปรษณีย์ไม่ตรงกับตำบล'); rowOk = false; }
      }
    }
    if (rowOk) d.validRows.push(r);
  });
}
async function applyImport() {
  var d = state.modal.data;
  if (d.busy || d.phase !== 'preview' || d.validRows.length === 0) return;
  d.busy = true;
  var btn = document.getElementById('imp-submit');
  btn.disabled = true;
  btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังนำเข้า…</span>';
  renderIcons();
  // BACKEND: API-08 POST /import (FN-SEQ-AGM-110 batch) — partial success (LOCK-04)
  await new Promise(function(r){ setTimeout(r, 900); });
  var now = new Date().toISOString();
  d.validRows.forEach(function(r){
    var mid = nextMemberId();
    state.records.unshift({
      id: 'm-' + mid, member_id: mid,
      first_name: r.first_name, last_name: r.last_name, citizen_id: r.citizen_id, phone: r.phone, email: r.email,
      address_line: r.address, province: r.province, district: r.district, subdistrict: r.subdistrict, postal_code: r.postal_code,
      verify_status: 'pending_approval', quota_status: 'no_quota',
      verified_by: null, verified_at: null, verified_note: null, is_deleted: false,
      created_at: now, created_by: CURRENT_USER.name + ' (CSV)', updated_at: now, updated_by: CURRENT_USER.name,
      history: [ { event: 'create', actor: CURRENT_USER.name + ' (CSV import)', at: now, note: null } ]
    });
  });
  d.applied = { total: d.rows.length, created: d.validRows.length, failed: d.errors.length };
  d.busy = false; d.phase = 'done';
  renderImportModal();
  showToast('นำเข้าสมาชิก ' + d.applied.created + ' รายการสำเร็จ' + (d.applied.failed ? ' — ข้าม ' + d.applied.failed + ' แถว' : ''), d.applied.failed ? 'warning' : 'success', 4500);
}
