    <div class="stat-value num">${value}</div><div class="stat-meta">${meta}</div></div>`;
}
function sortTh(col, label, cls){
  const s = S.list.sort, on = s.col === col;
  return `<th class="is-sortable ${on ? 'is-sorted' : ''} ${cls || ''}" onclick="sortBy('${col}')">${label}<span class="sort-arrow">${on ? (s.dir === 'asc' ? '↑' : '↓') : '↕'}</span></th>`;
}
function pager(total){
  const pages = Math.max(1, Math.ceil(total / PAGE_SIZE)), p = Math.min(S.list.page, pages);
  const from = total ? (p - 1) * PAGE_SIZE + 1 : 0, to = Math.min(total, p * PAGE_SIZE);
  let b = `<button class="pg-btn ${p === 1 ? 'is-disabled' : ''}" onclick="goPage(${p - 1})"><i data-lucide="chevron-left" class="w-3 h-3"></i></button>`;
  for (let i = 1; i <= pages; i++) b += `<button class="pg-btn ${i === p ? 'is-active' : ''}" onclick="goPage(${i})">${i}</button>`;
  b += `<button class="pg-btn ${p === pages ? 'is-disabled' : ''}" onclick="goPage(${p + 1})"><i data-lucide="chevron-right" class="w-3 h-3"></i></button>`;
  return `<div class="table-footer table-foot"><span class="num">${from} – ${to} จาก ${total}</span><div class="pagination">${b}</div></div>`;
}
function renderPage(){

    </tr>`).join('')
    : `<tr><td colspan="10">${filtered ? emptyStateHTML({ icon:'search-x', title:'ไม่พบรายการที่ค้นหา', desc:'ลองปรับคำค้นหรือล้างตัวกรอง', actionLabel:'ล้างตัวกรอง', actionIcon:'rotate-ccw', onAction:'resetFilters()' })
        : emptyStateHTML({ icon:'clipboard-check', title:'ยังไม่มีแบบฟอร์มสำรวจสมรรถนะ', desc:'บันทึกผลสำรวจสมรรถนะของตนเอง แล้วส่งให้ผู้ประเมินพิจารณา', actionLabel:'สร้างแบบฟอร์ม', actionIcon:'plus', onAction:'startWizard()' })}</td></tr>`;
  return `<div class="page-fill">
    <div class="ph"><div>
        <div class="ph-title-row"><h1 class="ph-title">${DOC_NAME} <span class="ph-en">(Competency Survey Form)</span></h1><span class="ph-count num">${mine.length} รายการ · เปิดอยู่ ${nOpen}</span></div>
        <p class="ph-sub">สำรวจสมรรถนะหลักและสมรรถนะเฉพาะสายงาน แล้วส่งให้ผู้ประเมินพิจารณา</p></div>
      <div class="ph-actions">
        <button class="btn btn-secondary" onclick="exportCSV()"><i data-lucide="download" class="w-4 h-4"></i><span>ส่งออก CSV</span></button>
        <button class="btn btn-primary" id="btnCreate" onclick="startWizard()" ${DOC.active ? '' : 'disabled'}><i data-lucide="plus" class="w-4 h-4"></i><span>สร้างแบบฟอร์ม</span></button>

    ${DOC.active ? '' : '<div class="alert-row is-danger"><i data-lucide="lock" class="w-4 h-4"></i><div>แบบเอกสารนี้ยังไม่เปิดใช้งาน — สร้างแบบฟอร์มใหม่ไม่ได้</div></div>'}
    <div class="stats">

/* ---------- row menu (⋮) — DEC-12: ไม่มีคำสั่งทำซ้ำ ---------- */
function openRowMenu(id, btn){
  closeRowMenu();
  const r = findR(id), items = [['printer', 'พิมพ์', `genPdf('${id}', true)`]];
  if (isOwner(r) && r.status === 'draft') items.unshift(['pencil', 'แก้ไข', `startWizard('${id}')`]);
  if (canCancel(r)) items.push(['x-circle', 'ยกเลิกเอกสาร', `openCancel('${id}')`, 1]);
  const m = document.createElement('div'); m.className = 'row-menu';
  m.innerHTML = items.map(x => `<button type="button" class="rm-item ${x[3] ? 'is-danger' : ''}" onclick="closeRowMenu(); ${x[2]}"><i data-rmic="${x[0]}" class="w-4 h-4"></i><span>${x[1]}</span></button>`).join('');
  document.getElementById('overlay-root').appendChild(m);
  const b = btn.getBoundingClientRect(), h = items.length * 36 + 8, below = window.innerHeight - b.bottom > h + 8;
  m.style.setProperty('--top', (below ? b.bottom + 4 : b.top - h - 4) + 'px'); m.style.setProperty('--left', Math.max(8, b.right - 180) + 'px');
  if (window.lucide && typeof window.lucide.createIcons === 'function'){ window.lucide.createIcons({ nameAttr:'data-rmic' }); m.querySelectorAll('svg[data-rmic]').forEach(x => x.removeAttribute('data-rmic')); }
}
function closeRowMenu(){ const m = document.querySelector('.row-menu'); if (m) m.remove(); }
function rowClick(ev, id){ if (ev.target.closest('.row-actions-cell')) return; openView(id); }
document.addEventListener('click', e => { if (!e.target.closest('.row-menu') && !e.target.closest('.row-actions-cell')) closeRowMenu(); });

/* ---------- PDF Preview — แบบพิมพ์ Replica จาก thai-doc-pdf-generator v2.1 ----------

const TH_MONTH = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];

/* logic-less template renderer (mustache subset · ตรงกับ scripts/render_doc.py ทุกไบต์ — parity_check.py) */
function tplGet(stack, path){
  for (let i = stack.length - 1; i >= 0; i--){ let cur = stack[i], ok = true;
    for (const k of path.split('.')){ if (cur && typeof cur === 'object' && k in cur) cur = cur[k]; else { ok = false; break; } }
    if (ok) return cur; }
  return null;
}
function tplRender(t, stack){
  t = t.replace(/{{([#^])([\w.]+)}}([\s\S]*?){{\/\2}}/g, (m, kind, key, inner) => { const v = tplGet(stack, key), has = Array.isArray(v) ? v.length > 0 : !!v;
    if (kind === '^') return has ? '' : tplRender(inner, stack);
    if (Array.isArray(v)) return v.map(x => tplRender(inner, stack.concat([x]))).join('');
    return has ? tplRender(inner, stack.concat(typeof v === 'object' ? [v] : [])) : ''; });
  t = t.replace(/{{{([\w.]+)}}}/g, (m, k) => { const v = tplGet(stack, k); return v == null ? '' : String(v); });
  return t.replace(/{{([\w.]+)}}/g, (m, k) => { const v = tplGet(stack, k); return v == null ? '' : esc(v); });
}

  r.chain.forEach(c => { const p = empOf(c.assignee), w = wordsFor(c.role_id), done = c.status === 'approved' || c.status === 'rejected';

function renderWizard(){
  const s = S.dw.step, edit = S.dw.editId ? findR(S.dw.editId) : null, last = s === STEPS.length;

  return `<div class="dw-head"><div class="dw-head-row"><div>
        <div class="dw-eyebrow"><i data-lucide="${edit ? 'pencil' : 'file-plus'}" class="w-3.5 h-3.5"></i> ${edit ? 'แก้ไขเอกสาร' : 'สร้างเอกสารใหม่'}</div>
        <h2 class="dw-title">${edit ? 'แก้ไขแบบฟอร์ม ' + edit.code : DOC_NAME}</h2></div>
        <button class="top-icon-btn" title="ปิด" onclick="closeDrawer()"><i data-lucide="x" class="w-5 h-5"></i></button></div>${stepper()}</div>

      <div class="dw-footer-right"><button class="btn btn-ghost" onclick="closeDrawer()">ยกเลิก</button>

          <button class="btn btn-primary" id="btnSaveSubmit" onclick="saveAndSubmit()" ${S.busy ? 'disabled' : ''}>${S.busy ? '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>' : '<i data-lucide="send" class="w-4 h-4"></i><span>บันทึกและส่งอนุมัติ</span>'}</button>`

/* ---------- wizard actions ---------- */
function goStep(n){ S.dw.step = n; render(); }
function setADate(v){ const f = wf(); f.aDate = v; dirty(); if (S.dw.err) delete S.dw.err.aDate; render(); }
function setText(k, v){ const f = wf(); f[k] = v; dirty(); }
function toggleDev(k){ const f = wf(); f.dev[k] = !f.dev[k]; dirty(); render(); }
function setLine(group, i, k, v){
  const f = wf(); f[group][i][k] = v; dirty();
  if (S.dw.err && S.dw.err[group] && S.dw.err[group][i]) delete S.dw.err[group][i][k];
  if (v.trim()){ const el = document.querySelector(`[name="${group}-${k === 'name' ? 'n' : 'd'}-${i}"]`); if (el) el.classList.remove('is-bad'); }
  const c = document.getElementById('sumLines'); if (c) c.textContent = (named(f.core).length + named(f.func).length) + ' รายการ';
}
function setLevel(group, i, n){
  const f = wf(); f[group][i].lv = f[group][i].lv === n ? 0 : n; dirty();
  if (S.dw.err && S.dw.err[group] && S.dw.err[group][i]) delete S.dw.err[group][i].lv;
  render();
}
function addLine(group){ const f = wf(); f[group].push(blankLine()); dirty(); render();
  requestAnimationFrame(() => { const el = document.querySelector(`[name="${group}-n-${f[group].length - 1}"]`); if (el) el.focus(); }); }
function removeLine(group, i){ const f = wf(); if (f[group].length === 1) return; f[group].splice(i, 1);
  if (S.dw.err){ S.dw.err[group] = {}; S.dw.err[group + 'Msg'] = {}; } dirty(); render(); }
function validateMain(){
  const f = wf(), err = { core:{}, coreMsg:{}, func:{}, funcMsg:{} };
  if (!f.aDate) err.aDate = 1;
  const grp = (k, label) => {
    f[k].forEach((x, i) => {
      const has = (x.name || '').trim();
      if (!has && ((x.desc || '').trim() || x.lv)){ err[k][i] = { name:1 }; err[k + 'Msg'][i] = 'ใส่รายการสมรรถนะ หรือลบบรรทัดนี้'; }
      else if (has && !x.lv){ err[k][i] = { lv:1 }; err[k + 'Msg'][i] = 'เลือกระดับประเมิน 1–4 ของรายการนี้'; }
    });
    if (!named(f[k]).length && !Object.keys(err[k + 'Msg']).length){ err[k][0] = { name:1 }; err[k + 'Msg'][0] = 'ใส่' + label + 'อย่างน้อย 1 รายการ'; }
  };
  grp('core', 'สมรรถนะหลัก'); grp('func', 'สมรรถนะเฉพาะสายงาน');
  const ok = !err.aDate && !Object.keys(err.coreMsg).length && !Object.keys(err.funcMsg).length;
  /* soft — เตือนไม่บล็อก: ระบุสิ่งที่ควรพัฒนาแล้วแต่ยังไม่เลือกแนวทาง */
  const soft = ok && (f.gaps || '').trim() && !devList(f.dev).length;
  S.dw.err = (ok && !soft) ? null : err;
  if (ok && soft) showToast('ระบุสมรรถนะที่ควรพัฒนาแล้ว แต่ยังไม่ได้เลือกแนวทางการพัฒนา', 'warning');
  return ok;
}
function wizNext(){
  if (S.dw.step === 1 && !validateMain()){ render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.dw.step += 1; render();
}
function wizBack(){ S.dw.step = Math.max(1, S.dw.step - 1); render(); }
function pickFiles(inp){ const f = wf(); gateFiles(Array.from(inp.files || [])).forEach(x => f.files.push({ name:x.name, size:fmtSize(x.size) })); inp.value = ''; dirty(); render(); }
function removeFile(i){ wf().files.splice(i, 1); dirty(); render(); }
/* บันทึก = ENG-DOC-NUM.next() ออกเลขที่ครั้งแรก (DEC-11) · ข้อมูลผู้รับประเมิน snapshot ลงเอกสาร (ตำแหน่ง/แผนก ณ วันที่ประเมิน) */
function persist(){
  const f = wf(), me = ME(), t = nowIso();
  let r = S.dw.editId ? findR(S.dw.editId) : null;
  if (!r){
    SEQ += 1;
    r = { id:'R' + SEQ, code:DOC.prefix + '-2569-' + String(SEQ).padStart(4, '0'), status:'draft', emp:S.me, empCode:me.code, pos:me.pos, div:me.div, dept:me.dept,
      chain:resolveDoa(S.me), doa_entry_ref:MOCK_DOA_RESOLVED.doa_entry_ref, attachments:[], audit:[{ act:'สร้างเอกสาร', by:me.name, at:t, tone:'' }], createdBy:me.name, createdAt:t };
    RECS.unshift(r);
  } else r.audit.push({ act:'แก้ไขร่าง', by:me.name, at:t, tone:'' });
  Object.assign(r, { aDate:f.aDate,
    core:named(f.core).map(x => Object.assign({}, x)), func:named(f.func).map(x => Object.assign({}, x)),
    strengths:f.strengths, gaps:f.gaps, remark:f.remark, dev:Object.assign({}, f.dev),
    attachments:f.files.slice(), updatedBy:me.name, updatedAt:t });
  return r;
}
function saveDraft(){ if (S.busy) return; if (!validateMain()){ S.dw.step = 1; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const r = persist(); S.busy = false; closeDrawer(true); setTimeout(() => showToast('บันทึกร่างแล้ว · ' + r.code, 'info'), 300); }, 500); }
function saveAndSubmit(){ if (S.busy) return; if (!validateMain()){ S.dw.step = 1; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const r = persist(); S.busy = false; closeDrawer(true); setTimeout(() => openSubmit(r.id), 300); }, 500); }

/* =====================================================================
   MODALS — ส่งอนุมัติ (DOA slot picker) · เห็นชอบ · ส่งกลับแก้ไข · ยกเลิก · ทิ้งการแก้ไข
   ===================================================================== */
function modalShell(icon, tone, title, sub, body, foot){
  return `<div class="modal-header"><div class="modal-header-icon ${tone}"><i data-lucide="${icon}" class="w-4 h-4"></i></div><div><h3 class="modal-title">${title}</h3><p class="modal-subtitle">${sub}</p></div></div>
    ${body ? `<div class="modal-body">${body}</div>` : ''}<div class="modal-footer">${foot}</div>`;
}
const busyLabel = (icon, label) => S.busy ? '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>' : `<i data-lucide="${icon}" class="w-4 h-4"></i><span>${label}</span>`;
function presetChips(list, cur){ return `<div class="chip-row">${list.map(p => `<button type="button" class="chip ${cur === p ? 'is-on' : ''}" onclick="setReasonPreset(this.dataset.v)" data-v="${esc(p)}">${esc(p)}</button>`).join('')}</div>`; }
function renderModal(){
  const m = S.md; if (!m) return '';
  const r = m.id ? findR(m.id) : null;
  if (m.kind === 'submit'){
    return modalShell('send', 'is-primary', 'ส่งแบบฟอร์มสำรวจสมรรถนะให้พิจารณา?', `${r.code} · ประเมิน ${fmtD(r.aDate)} · สมรรถนะ ${nCore(r) + nFunc(r)} รายการ`,
      `${resolveDoa(r.emp).map((c, i) => `<div class="slot-row"><span class="slot-no num">${c.step}</span><span class="slot-role">${esc(c.role)}</span><div class="field ${m.err && !m.slots[i] ? 'is-invalid' : ''}" id="fSlot${i}">${searchSelectHTML('slot' + i, { placeholder:'เลือกผู้พิจารณา' })}<div class="field-error">กรุณาเลือกผู้พิจารณา</div>${i === 0 ? '<div class="slot-help">ค่าเริ่มต้นจากสายอนุมัติที่ตั้งไว้ที่ DOA กลางและผังองค์กร</div>' : ''}</div></div>`).join('')}
       <div class="drawer-fields mt-3">${kv('สมรรถนะหลัก', nCore(r) + ' รายการ')}${kv('สมรรถนะเฉพาะสายงาน', nFunc(r) + ' รายการ')}</div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="btnSubmit" onclick="confirmSubmit()" ${S.busy ? 'disabled' : ''}>${busyLabel('send', 'ส่งอนุมัติ')}</button>`);
  }
  if (m.kind === 'approve'){
    const w = wordsFor(curStep(r) ? curStep(r).role_id : null);
    return modalShell('check-circle-2', 'is-success', `${w.approve}ผลสำรวจสมรรถนะนี้?`, `${r.code} · ${esc(empOf(r.emp).name)} · ประเมิน ${fmtD(r.aDate)}`,
      `<div class="drawer-fields">${kv('สมรรถนะหลัก', nCore(r) + ' รายการ')}${kv('สมรรถนะเฉพาะสายงาน', nFunc(r) + ' รายการ')}${kv('แนวทางการพัฒนา', devPills(r.dev))}</div>
       <div class="field mt-3"><label class="field-label">ความเห็น</label><textarea class="input" name="apNote" rows="2" placeholder="ไม่บังคับ" oninput="S.md.note=this.value">${esc(m.note || '')}</textarea></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-success" id="btnApprove" onclick="confirmApprove()" ${S.busy ? 'disabled' : ''}>${busyLabel('check', w.approve)}</button>`);
  }
  if (m.kind === 'reject' || m.kind === 'cancel'){
    const rej = m.kind === 'reject', w = wordsFor(rej && curStep(r) ? curStep(r).role_id : null);

function confirmReason(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (!(m.reason || '').trim()){ m.err = true; render(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    const why = m.reason.trim();
    if (m.kind === 'reject'){ const c = curStep(r), w = wordsFor(c.role_id);

    S.busy = false; closeModal(); render(); setTimeout(() => showToast(m.kind === 'reject' ? 'ส่งกลับแก้ไขแล้ว · ' + r.code + ' กลับเป็นร่าง' : 'ยกเลิกเอกสารแล้ว · ' + r.code, m.kind === 'reject' ? 'warning' : 'info'), 220); }, 600);
