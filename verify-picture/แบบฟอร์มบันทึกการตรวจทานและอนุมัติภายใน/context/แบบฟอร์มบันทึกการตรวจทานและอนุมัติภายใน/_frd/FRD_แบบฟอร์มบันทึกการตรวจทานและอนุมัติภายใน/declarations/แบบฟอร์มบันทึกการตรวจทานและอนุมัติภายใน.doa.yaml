# doa-declaration v1.2 — สร้างจาก DECISIONS.lock.json · คำตัดสินเพิ่มเอง (AI-DEFAULT — กระดาษไม่มีคำตัดสิน)
feature_id: F-TMP-006
name: แบบฟอร์มบันทึกการตรวจทานและอนุมัติภายใน
module: bdm
platform: core
doa_type: irv
approval_scope: document_sign
approval_required: true
mode: dynamic
amount: none
dept_mode: merged
on_reject: back_to_draft
cancel_by:
- owner
- admin_role
cancel_states:
- draft
- pending
actions:
- id: submit_irv
  label: ส่งอนุมัติแบบฟอร์มบันทึกการตรวจทานและอนุมัติภายใน
  from_state: draft
matrix:
- amount_from: 0
  amount_to: null
  departments: merged
  chainMode: sequential
  steps:
  - roles:
    - role-line-manager
    label: ผู้ตรวจสอบ
    decision:
      approve: ตรวจสอบแล้ว
      reject: ไม่ผ่านการตรวจสอบ
  - roles:
    - role-gm
    label: ผู้อนุมัติ / รับทราบ
    decision:
      approve: อนุมัติ / รับทราบ
      reject: ไม่อนุมัติ
defaults_unconfirmed: true
wire_status: pending
source_decisions:
- DEC-03
- DEC-08
- DEC-09
role_notes:
  role-line-manager: บนกระดาษ = ผู้จัดการฝ่ายพัฒนาธุรกิจ / รองกรรมการผู้จัดการ (ผู้บังคับบัญชาตรงของผู้จัดทำ)
  role-gm: บนกระดาษ = กรรมการผู้จัดการ / ผู้มีอำนาจตามตารางอำนาจอนุมัติ — ไม่มี role
    กรรมการผู้จัดการใน DOA master → ใช้ role-gm ชั่วคราว รอลูกค้า/DOA กลางยืนยัน
