<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>การทำจ่ายเงินอ้อย (Cane Payment) · CUBE NATIVE</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">

<style>
/* ============== CSS VARIABLES (CUBE CI — Warm Light) ============== */
:root {
  --c-navy: #111111;
  --c-navy-2: #111111;
  --c-primary: #FF3B30;
  --c-primary-hover: #E62E24;
  --c-teal: #FF9A1F;
  --c-teal-light: #FFB763;
  --c-ink: #111111;
  --c-mute: #54565C;
  --c-mute-2: #73757B;
  --c-mute-3: #9A9CA2;
  --c-line: #DEDAD4;
  --c-line-2: #E9E5E0;
  --c-line-3: #F1EEEA;
  --c-bg-off: #FAF8F5;
  --c-success: #1F9D55;
  --c-warning: #E8870F;
  --c-danger: #E62E24;
  --sidebar-w: 232px;
  --shell-h: 52px;
  --fs-h1: 22px; --fs-h2: 17px; --fs-h3: 15px; --fs-body: 14px;
  --fs-sub: 13px; --fs-meta: 12px; --fs-cap: 11px; --fs-kpi: 28px;
  --sp-xs: 4px; --sp-sm: 8px; --sp-md: 12px; --sp-lg: 20px; --sp-xl: 28px;
  --r-xs: 4px; --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-full: 999px;
}

/* ============== RESET ============== */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { scrollbar-gutter: stable; }

/* ============== SCROLLBAR (Iron Rule #49) ============== */
* { scrollbar-width: thin; scrollbar-color: rgba(17,17,17,.16) transparent; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(17,17,17,.14); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: rgba(17,17,17,.26); }
.sidebar, .slide { scrollbar-color: rgba(255,255,255,.28) transparent; }
.sidebar ::-webkit-scrollbar-thumb, .slide ::-webkit-scrollbar-thumb,
.sidebar::-webkit-scrollbar-thumb, .slide::-webkit-scrollbar-thumb { background: rgba(255,255,255,.28); }
.sidebar ::-webkit-scrollbar-thumb:hover, .slide ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.42); }
body {
  font-family: 'Satoshi', 'Noto Sans Thai', system-ui, sans-serif;
  background: var(--c-bg-off);
  color: #2A2B2F;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-width: 1180px;
}
a { text-decoration: none; color: inherit; }
button { font-family: inherit; cursor: pointer; }
[data-lucide] { flex-shrink: 0; }
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; }

/* ============== SIDEBAR ============== */
.sidebar {
  position: fixed; inset: 0 auto 0 0; width: var(--sidebar-w);
  background: #111111; color: #E9E5E0; z-index: 20;
  display: flex; flex-direction: column;
  border-right: 1px solid rgba(255,255,255,0.06);
}
.sb-brand { padding: 18px; display: flex; align-items: center; gap: 11px; border-bottom: 1px solid rgba(255,255,255,0.06); flex-shrink: 0; }
.sb-logo {
  width: 34px; height: 34px; background: linear-gradient(135deg, #FF3B30, #FF9A1F);
  border-radius: 9px; display: inline-flex; align-items: center; justify-content: center;
  color: #fff; flex-shrink: 0; box-shadow: 0 4px 12px rgba(255,59,48,0.3);
}
.sb-name { font-weight: 700; font-size: 14px; color: #fff; letter-spacing: -0.01em; line-height: 1.2; }
.sb-sub { font-size: 10px; color: #9A9CA2; letter-spacing: 0.06em; font-weight: 600; text-transform: uppercase; margin-top: 2px; }
.sb-nav { flex: 1; padding: 12px 8px; overflow-y: auto; }
.sb-module { margin-bottom: 4px; }
.sb-module-header {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 8px 10px; border-radius: 6px; background: transparent; border: 0;
  color: #9A9CA2; font-family: inherit; font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; transition: all 120ms; text-align: left;
}
.sb-module-header:hover { background: rgba(255,255,255,0.04); color: #DEDAD4; }
.sb-module-header .mod-icon { flex-shrink: 0; opacity: 0.7; }
.sb-module-header .mod-label { flex: 1; }
.sb-module-header .mod-chevron { flex-shrink: 0; transition: transform 200ms; opacity: 0.7; }
.sb-module[data-expanded="false"] .mod-chevron { transform: rotate(-90deg); }
.sb-module[data-expanded="false"] .sb-features { display: none; }
.sb-features { padding: 2px 0 6px 0; }
.sb-item {
  display: flex; align-items: center; gap: 10px; padding: 7px 12px 7px 14px;
  border-radius: 6px; color: #DEDAD4; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: all 120ms; margin-bottom: 1px; position: relative; user-select: none;
}
.sb-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.sb-item.is-active { background: #FF3B30; color: #fff; font-weight: 600; }
.sb-item.is-active::before {
  content: ''; position: absolute; left: -10px; top: 7px; bottom: 7px;
  width: 3px; background: #fff; border-radius: 0 2px 2px 0;
}
.sb-item [data-lucide] { width: 16px; height: 16px; opacity: 0.85; }
.sb-item.is-active [data-lucide] { opacity: 1; }
.sb-item.is-disabled { opacity: 0.4; cursor: not-allowed; }
.sb-item.is-disabled:hover { background: transparent; color: #DEDAD4; }
.sb-footer {
  padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.06);
  display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: #9A9CA2;
}
.pulse-dot { width: 7px; height: 7px; background: var(--c-teal); border-radius: 50%; box-shadow: 0 0 0 3px rgba(255,154,31,0.20); animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

/* ============== MAIN + SHELL BAR ============== */
.main { margin-left: var(--sidebar-w); min-height: 100vh; background: var(--c-bg-off); }
.shell-bar {
  position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--c-line-2);
  height: var(--shell-h); display: flex; align-items: center; padding: 0 22px; z-index: 19; gap: 12px;
}
.breadcrumb { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--c-mute); }
.breadcrumb a { cursor: pointer; transition: color 120ms; }
.breadcrumb a:hover { color: var(--c-primary); }
.breadcrumb .sep { color: var(--c-mute-3); font-size: 10px; }
.breadcrumb-current { color: var(--c-ink); font-weight: 500; }
.icon-btn {
  width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border: 0; color: var(--c-mute); border-radius: 7px; position: relative; transition: all 120ms;
}
.icon-btn:hover { background: var(--c-line-3); color: var(--c-ink); }
.icon-btn [data-lucide] { width: 17px; height: 17px; }
.notif-dot { position: absolute; top: 7px; right: 8px; width: 7px; height: 7px; background: var(--c-danger); border-radius: 50%; border: 2px solid #fff; }
.user-chip { display: flex; align-items: center; gap: 9px; padding: 5px 10px 5px 12px; border-radius: 8px; cursor: pointer; transition: background 120ms; }
.user-chip:hover { background: var(--c-line-3); }
.user-text { line-height: 1.2; text-align: right; }
.user-name { font-size: 12.5px; font-weight: 500; color: var(--c-ink); white-space: nowrap; }
.user-role { font-size: 10.5px; color: var(--c-mute-2); white-space: nowrap; margin-top: 1px; }
.avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: linear-gradient(135deg, var(--c-primary), var(--c-teal));
  color: #fff; display: inline-flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 600; flex-shrink: 0;
}
.user-menu {
  position: absolute; top: calc(var(--shell-h) - 4px); right: 22px; background: #fff;
  border: 1px solid var(--c-line-2); border-radius: 10px; box-shadow: 0 12px 32px rgba(17,17,17,0.12);
  width: 240px; z-index: 30; padding: 6px; display: none;
}
.user-menu.is-open { display: block; }
.user-menu-item { display: flex; align-items: center; gap: 10px; padding: 8px 11px; border-radius: 6px; font-size: 13px; color: var(--c-ink); cursor: pointer; transition: background 120ms; }
.user-menu-item:hover { background: var(--c-bg-off); }
.user-menu-item [data-lucide] { width: 15px; height: 15px; color: var(--c-mute-2); }
.user-menu-item.is-danger { color: var(--c-danger); }
.user-menu-item.is-danger [data-lucide] { color: var(--c-danger); }
.user-menu-divider { height: 1px; background: var(--c-line-2); margin: 5px 0; }

/* ============== CONTENT (fluid — Iron Rule #30) ============== */
.content { padding: 22px; }

/* ============== PAGE HEADER ============== */
.ph { margin-bottom: 18px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 14px; }
.ph > div:first-child { flex: 1 1 auto; min-width: 280px; }
.ph-title-row { display: flex; align-items: baseline; gap: 10px; margin-bottom: 5px; }
.ph-title { font-family: 'Noto Sans Thai', sans-serif; font-size: 22px; font-weight: 700; color: var(--c-navy); margin: 0; letter-spacing: -0.01em; }
.ph-count { font-size: 12.5px; font-weight: 600; color: var(--c-mute-2); background: var(--c-line-3); padding: 3px 9px; border-radius: 999px; }
.ph-sub { font-size: 13px; color: var(--c-mute); margin: 0; }
.ph-actions { display: flex; gap: 8px; flex-shrink: 0; }

/* ============== BUTTONS (Iron Rule #36 — Thai optical center) ============== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  height: 36px; padding: 2px 14px 0; border-radius: 8px; font-size: 13px; font-weight: 500;
  border: 1px solid transparent; background: transparent; white-space: nowrap;
  transition: all 120ms; user-select: none; cursor: pointer;
}
.btn [data-lucide] { width: 15px; height: 15px; flex-shrink: 0; }
.btn:disabled, .btn.is-disabled { opacity: .55; cursor: not-allowed; pointer-events: none; }
.btn-eq { min-width: 104px; }
.btn-primary { background: var(--c-primary); color: #fff; }
.btn-primary:hover { background: var(--c-primary-hover); box-shadow: 0 2px 8px rgba(255,59,48,0.30); }
.btn-secondary { background: #fff; border-color: var(--c-line); color: var(--c-ink); }
.btn-secondary:hover { background: var(--c-line-3); border-color: var(--c-mute-2); }
.btn-ghost { color: var(--c-mute); }
.btn-ghost:hover { background: var(--c-line-3); color: var(--c-ink); }
.btn-danger { background: #fff; border-color: var(--c-line); color: var(--c-danger); }
.btn-danger:hover { background: #FFE9E7; border-color: var(--c-danger); }
.btn-danger.is-solid { background: var(--c-danger); border-color: var(--c-danger); color: #fff; }
.btn-danger.is-solid:hover { background: #C81E15; }
.btn-link { background: transparent; border: 0; padding: 0 4px; height: auto; color: var(--c-primary); font-weight: 500; }
.btn-link:hover { text-decoration: underline; }
.btn-sm { height: 30px; padding: 2px 11px 0; font-size: 12px; }

/* ============== STATS ============== */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 18px; }
.stat { background: #fff; border: 1px solid var(--c-line-2); border-radius: 10px; padding: 14px 16px; transition: all 150ms; }
.stat:hover { border-color: var(--c-line); box-shadow: 0 2px 8px rgba(17,17,17,0.05); }
.stat-label { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; color: var(--c-mute); }
.stat-label [data-lucide] { width: 13px; height: 13px; color: var(--c-primary); }
.stat-value { font-family: 'Noto Sans Thai', sans-serif; font-size: 26px; font-weight: 700; color: var(--c-navy); margin-top: 6px; letter-spacing: -0.01em; }
.stat-meta { font-size: 11.5px; color: var(--c-mute-2); margin-top: 5px; display: flex; align-items: center; gap: 4px; }
.stat-meta.is-warn { color: var(--c-warning); }
.stat-meta [data-lucide] { width: 12px; height: 12px; }

/* ============== CARD / FILTER ============== */
.card { background: #fff; border: 1px solid var(--c-line-2); border-radius: 10px; overflow: hidden; }
.filter-bar { padding: 14px 18px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid var(--c-line-2); background: #fff; flex-wrap: wrap; }

/* ============== INPUTS ============== */
.input, .select {
  height: 36px; padding: 0 12px; border: 1px solid var(--c-line); border-radius: 8px;
  font-size: 13px; background: #fff; color: var(--c-ink); font-family: inherit; transition: all 120ms; width: 100%;
}
.input:focus, .select:focus { outline: none; border-color: var(--c-primary); box-shadow: 0 0 0 3px rgba(255,59,48,0.10); }
.input:disabled, .input[readonly] { background: var(--c-line-3); color: var(--c-mute-2); cursor: not-allowed; border-color: var(--c-line-2); }
.select {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2364748B' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat; background-position: right 10px center; padding-right: 32px; appearance: none;
}
.input-search { position: relative; flex: 1; max-width: 340px; }
.input-search input { padding-left: 36px; }
.input-search .lead-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--c-mute-2); pointer-events: none; }

/* ===== SEARCH-SELECT (Iron Rule #34) ===== */
.search-select { position: relative; width: 100%; }
.search-select .ss-input { padding-left: 34px; padding-right: 34px; }
.search-select .ss-lead { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--c-mute-3); pointer-events: none; }
.search-select .ss-caret { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--c-mute-3); pointer-events: none; }
.search-select .ss-clear { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); display: inline-flex; padding: 3px; border: 0; background: transparent; color: var(--c-mute-2); cursor: pointer; border-radius: 6px; }
.search-select .ss-clear:hover { background: var(--c-line-3); color: var(--c-ink); }
.search-select.is-disabled .ss-input { background: var(--c-line-3); color: var(--c-mute-2); cursor: not-allowed; }
.ss-list {
  position: absolute; z-index: 70; left: 0; right: 0; margin-top: 4px; max-height: 280px; overflow-y: auto;
  background: #fff; border: 1px solid var(--c-line); border-radius: 8px;
  box-shadow: 0 10px 30px rgba(17,17,17,0.10), 0 4px 10px rgba(17,17,17,0.05);
}
.ss-opt { width: 100%; display: flex; align-items: center; gap: 10px; padding: 9px 12px; border: 0; border-bottom: 1px solid var(--c-line-3); background: transparent; cursor: pointer; text-align: left; font-family: inherit; }
.ss-opt:last-child { border-bottom: 0; }
.ss-opt:hover, .ss-opt.is-active { background: rgba(255,59,48,0.06); }
.ss-opt-ic { width: 16px; height: 16px; color: var(--c-primary); flex-shrink: 0; }
.ss-opt-main { flex: 1; min-width: 0; }
.ss-opt-label { display: block; font-size: 13px; color: var(--c-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ss-opt-sub { display: block; font-size: 11.5px; color: var(--c-mute-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ss-opt-right { flex-shrink: 0; font-size: 12px; color: var(--c-mute); }
.ss-opt mark { background: rgba(255,59,48,0.16); color: inherit; padding: 0 1px; border-radius: 2px; }
.ss-empty { padding: 20px 14px; text-align: center; font-size: 13px; color: var(--c-mute-2); }

/* ============== TABLE ============== */
.table-scroll { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 13px; }
.table thead { background: var(--c-bg-off); }
.table th {
  padding: 11px 14px; text-align: left; font-weight: 600; color: var(--c-mute);
  font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em;
  border-bottom: 1px solid var(--c-line-2); white-space: nowrap;
}
.table th.col-check { width: 40px; padding-right: 0; }
.table td { padding: 13px 14px 11px; border-bottom: 1px solid var(--c-line-2); color: var(--c-ink); vertical-align: middle; }
.table tbody tr { transition: background 120ms; }
.table tbody tr:hover { background: var(--c-bg-off); }
.table tbody tr.is-selected { background: rgba(255,59,48,0.04); }
.table tbody tr.is-selected:hover { background: rgba(255,59,48,0.07); }
.table tbody tr:last-child td { border-bottom: 0; }
.table tbody tr.is-clickable { cursor: pointer; }
.table-scroll.is-sticky { max-height: 560px; overflow-y: auto; scrollbar-gutter: stable; }
.table-scroll.is-sticky thead th { position: sticky; top: 0; z-index: 3; background: var(--c-bg-off); box-shadow: inset 0 -1px 0 var(--c-line-2); }
.cell-truncate { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
th.col-num, td.col-num { text-align: right; }
.mono { font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }

/* ============== CHECKBOX ============== */
.cb {
  width: 16px; height: 16px; border: 1.5px solid var(--c-line); border-radius: 4px; background: #fff;
  cursor: pointer; display: inline-block; position: relative; transition: all 120ms; flex-shrink: 0;
}
.cb.is-checked, .cb.is-partial { background: var(--c-primary); border-color: var(--c-primary); }
.cb.is-checked::after { content: ''; position: absolute; left: 4px; top: 1px; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
.cb.is-partial::after { content: ''; position: absolute; left: 3px; top: 6px; width: 8px; height: 2px; background: #fff; }
.cb:hover { border-color: var(--c-primary); }
.cb.is-disabled { opacity: 0.35; cursor: not-allowed; }
.cb.is-disabled:hover { border-color: var(--c-line); }

/* ============== PILLS ============== */
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px 3px; border-radius: 999px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
.pill [data-lucide] { width: 11px; height: 11px; }
.pill-info    { background: #E6F0FF; color: #1A5FCC; }
.pill-success { background: #E4F4EB; color: #157A41; }
.pill-warning { background: #FFF1DD; color: #B8690B; }
.pill-danger  { background: #FFE9E7; color: #E62E24; }
.pill-muted   { background: var(--c-line-3); color: var(--c-mute-2); }
.pill-outline { background: #fff; border: 1px solid var(--c-line); color: var(--c-mute); }

@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 0.8s linear infinite; }

/* ============== FORM SECTION (Iron Rule #45) ============== */
.form-section { margin-top: var(--sp-xl); }
.form-section:first-child { margin-top: 0; }
.form-section-title {
  font-size: var(--fs-cap); font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--c-mute);
  padding-bottom: var(--sp-sm); border-bottom: 1px solid var(--c-line-2); margin-bottom: var(--sp-md);
}
.form-grp { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px 16px; }

/* ============== ROW ACTIONS ============== */
.row-actions { display: inline-flex; gap: 2px; }
.ra-btn {
  width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center;
  background: transparent; border: 0; color: var(--c-mute-2); border-radius: 6px; transition: all 120ms;
}
.ra-btn:hover { background: var(--c-line-3); color: var(--c-primary); }
.ra-btn.is-danger:hover { background: #FFE9E7; color: var(--c-danger); }
.ra-btn [data-lucide] { width: 15px; height: 15px; }

/* ============== TABLE FOOTER / BULK BAR ============== */
.table-footer {
  padding: 12px 18px; background: var(--c-bg-off); border-top: 1px solid var(--c-line-2);
  display: flex; justify-content: space-between; align-items: center; font-size: 12.5px; color: var(--c-mute); flex-wrap: wrap; gap: 10px;
}
.pagination { display: inline-flex; gap: 4px; align-items: center; }
.pg-btn {
  min-width: 30px; height: 30px; padding: 0 8px; display: inline-flex; align-items: center; justify-content: center;
  background: #fff; border: 1px solid var(--c-line-2); border-radius: 6px; color: var(--c-mute);
  font-size: 12.5px; font-weight: 500; cursor: pointer; transition: all 120ms;
}
.pg-btn:hover { border-color: var(--c-line); background: var(--c-bg-off); }
.pg-btn.is-active { background: var(--c-primary); border-color: var(--c-primary); color: #fff; }
.pg-btn.is-disabled { opacity: 0.4; cursor: not-allowed; }
.pg-btn [data-lucide] { width: 13px; height: 13px; }
.bulk-bar {

  var arr=tabPayments(state.tab);

  if(state.filters.status!=='all') arr=arr.filter(function(i){ return statusMatch(i,state.filters.status); });

    var q=state.filters.search.toLowerCase().trim();

function render(){
  if(state.pay&&state.modal.open&&state.modal.type==='payment'){ /* keep modal */ }
  var snap=preserveState();
  var route=getRoute(); var parts=route.split('/');
  if(parts[0]!=='payments'){ navigate('payments'); return; }
  var seg=parts[1]; var detailId=null;
  if(seg==='completed'){ state.tab='completed'; }
  else if(seg){ detailId=seg; }
  else { state.tab='pending'; }
  renderListPage();
  renderIcons(); restoreState(snap);

  if(detailId){
    var it=findPayment(detailId);
    if(it){ if(!state.view||state.view.id!==it.id){ state.view={id:it.id,tab:'summary'}; mountViewDrawer(); } }
    else { showToast('ไม่พบรายการ','error'); state.view=null; unmountOverlay(); navigate(tabRoute(state.tab)); }
  } else if(state.view){ state.view=null; unmountOverlay(); }
}

// ============================================
// CALCULATION ENGINE (per installment / promotion)
// ============================================
function payCalc(row, kind, method, manual){
  var isPromo=(kind==='promo');
  var netTons=row.net_tons, ccs=row.ccs_value;
  var caneTotal=PRICE_PER_TON*netTons;
  var adjTotal=CANE_ADJUST_PER_TON*netTons;
  var caneAdjusted=caneTotal+adjTotal;
  var billType = kind==='inst1'?row.inst1_bill_type : kind==='inst2'?row.inst2_bill_type : 'GREEN';
  var base = kind==='inst1'?row.inst1_amount : kind==='inst2'?row.inst2_amount : row.promo_amount;
  base=base||0;
  // charges
  var configCharges = isPromo?[]:[{code:'CFG-01',desc:'ค่าน้ำมัน',ctype:'FLAT',amount:200},{code:'CFG-02',desc:'ค่าธรรมเนียม',ctype:'FLAT',amount:100}];
  var configTotal=configCharges.reduce(function(a,c){return a+c.amount;},0);
  var manualTotal=(manual||[]).reduce(function(a,c){return a+c.amount;},0);
  var chargeTotal=configTotal+manualTotal;
  // promotion: skip tax + debt + config (coherent path)
  var taxTotal=isPromo?0:TAX_TOTAL;
  var afterTax=base-taxTotal;
  var beforeDebt=afterTax-chargeTotal;
  var debtActual=isPromo?0:DEBT_ACTUAL;
  var afterDebt=beforeDebt-debtActual;
  var isWhite=(billType==='WHITE');
  var interest=isWhite?INTEREST_AMOUNT:0;
  var afterInterest=afterDebt-interest;
  var branchProvince=isPromo?'เชียงราย':FACTORY_PROVINCE;
  var inProvince=(branchProvince===FACTORY_PROVINCE);
  var feeType=branchProvince?(inProvince?'IN_PROVINCE':'OUT_PROVINCE'):'UNKNOWN';
  var bankFee=method==='TRANSFER'?(feeType==='IN_PROVINCE'?BANK_FEE_IN:BANK_FEE_OUT):0;
  var finalAmt=Math.max(0, afterInterest-bankFee);
  return { isPromo:isPromo, netTons:netTons, ccs:ccs, caneTotal:caneTotal, adjTotal:adjTotal, caneAdjusted:caneAdjusted,
    billType:billType, base:base, configCharges:configCharges, configTotal:configTotal, manualTotal:manualTotal, chargeTotal:chargeTotal,
    taxTotal:taxTotal, afterTax:afterTax, beforeDebt:beforeDebt, debtActual:debtActual, afterDebt:afterDebt,
    isWhite:isWhite, interest:interest, afterInterest:afterInterest, branchProvince:branchProvince, feeType:feeType, bankFee:bankFee, finalAmt:finalAmt };
}

  var c=payCalc(row,kind,method,manual||[]);

  if(!c.isPromo){
    // 2.1
    h+='<div>'+stepHead('ขั้นตอน 2.1','มูลค่าอ้อย')
      +kvRow('ราคาต่อตัน',fmtBaht(PRICE_PER_TON))

      +kvRow('CCS',fmtNum(c.ccs,2))

    h+=stepSep();
    // 2.1.5
    h+='<div>'+stepHead('ขั้นตอน 2.1.5','ปรับตามประเภทอ้อย (v4.1)')
      +kvRow('ประเภทอ้อย',esc(row.cane_type_name)+' ('+esc(row.cane_type_code)+')')

  (manual||[]).forEach(function(m,i){ allCharges.push({code:'MAN-'+String(i+1),desc:m.desc,ctype:m.ctype,amount:m.amount,manual:true,idx:i}); });

    h+='<div style="border:1px solid var(--c-line-2);border-radius:8px;overflow:hidden;margin-bottom:8px;"><table class="table" style="font-size:12px;"><thead><tr><th>รหัส</th><th>รายละเอียด</th><th>ประเภท</th><th class="col-num">จำนวน</th>'+(!readOnly?'<th style="width:44px;"></th>':'')+'</tr></thead><tbody>';
    h+=allCharges.map(function(x){
      return '<tr><td class="mono">'+esc(x.code)+'</td><td>'+esc(x.desc)+'</td><td><span class="pill pill-muted" style="font-size:10.5px;">'+esc(x.ctype)+'</span></td><td class="mono col-num" style="color:var(--c-danger);">'+fmtBaht(x.amount)+'</td>'
        +(!readOnly?('<td style="text-align:center;">'+(x.manual?'<button class="ra-btn is-danger" onclick="removeManualCharge(\''+kind+'\','+x.idx+')"><i data-lucide="trash-2" class="w-4 h-4"></i></button>':'<span class="text-mute-3">-</span>')+'</td>'):'')
        +'</tr>';
    }).join('');
    h+='</tbody></table></div>';
  } else {
    h+='<div class="note is-info" style="margin-bottom:8px;"><i data-lucide="info" class="w-4 h-4"></i><span>ไม่มีรายการหัก'+(c.isPromo?' (โปรโมชันไม่มีค่าใช้จ่ายจากระบบ)':'')+'</span></div>';
  }
  if(!readOnly){
    h+='<div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-bottom:8px;">'
      +'<div style="flex:2;min-width:140px;"><label class="field-label" style="margin-bottom:4px;">รายละเอียด</label><input class="input" id="mc-desc" type="text" placeholder="เช่น ค่าปรับ"></div>'
      +'<div style="flex:1;min-width:100px;"><label class="field-label" style="margin-bottom:4px;">จำนวนเงิน</label><input class="input mono" id="mc-amt" type="number" placeholder="0.00"></div>'
      +'<div style="flex:1;min-width:110px;"><label class="field-label" style="margin-bottom:4px;">ประเภท</label><select class="select" id="mc-type"><option value="FLAT">FLAT</option><option value="PER_TON">PER_TON</option></select></div>'
      +'<button class="btn btn-secondary btn-sm" onclick="addManualCharge(\''+kind+'\')"><i data-lucide="plus" class="w-3.5 h-3.5"></i><span>เพิ่มรายการ</span></button></div>';

  h+=kvRow('รวมรายการหัก',fmtBaht(c.chargeTotal),'var(--c-danger)',true)
    +kvRow('ยอดก่อนหักหนี้',fmtBaht(c.beforeDebt),'#1A5FCC',true)+'</div>';
  h+=stepSep();

  // 2.5 debt
  h+='<div>'+stepHead('ขั้นตอน 2.5','หักหนี้');
  if(c.isPromo){
    h+='<div class="note is-info"><i data-lucide="info" class="w-4 h-4"></i><span>โปรโมชันไม่หักหนี้</span></div>';
  } else {
    h+=kvRow('ยอดหนี้คงเหลือ',fmtBaht(DEBT_BALANCE))
      +kvRow('เป้าหมาย ('+fmtPct(DEBT_PERCENT)+')',fmtBaht(DEBT_TARGET))
      +kvRow('หักจริง',fmtBaht(c.debtActual),'var(--c-danger)',true)
      +kvRow('คงเหลือ',fmtBaht(DEBT_AFTER))
      +kvRow('ยอดหลังหักหนี้',fmtBaht(c.afterDebt),'#1A5FCC',true);
  }
  h+='</div>';
  h+=stepSep();

  // 2.6 interest (white only)
  h+='<div>'+stepHead('ขั้นตอน 2.6','ดอกเบี้ย (บิลขาว)');
  if(c.isWhite){
    h+=kvRow('วันจ่ายปกติ','15/01/2568')
      +kvRow('วันจ่ายจริง','16/12/2567')

    h+='<div class="note is-info"><i data-lucide="info" class="w-4 h-4"></i><span>ไม่คิดดอกเบี้ย</span></div>';
  }
  h+='</div>';
  h+=stepSep();

  // 2.7 bank fee
  h+='<div>'+stepHead('ขั้นตอน 2.7','ค่าธนาคาร');
  if(method==='TRANSFER'){
    h+=kvRow('วิธีจ่าย','โอนธนาคาร (TRANSFER)')
      +kvRow('จังหวัดโรงงาน',esc(FACTORY_PROVINCE))
      +kvRow('จังหวัดสาขาธนาคาร',c.branchProvince?esc(c.branchProvince):'<span style="color:var(--c-warning);">ไม่ระบุ</span>')
      +kvRow('ประเภท',c.feeType==='IN_PROVINCE'?'ในจังหวัด (IN_PROVINCE)':c.feeType==='OUT_PROVINCE'?'ต่างจังหวัด (OUT_PROVINCE)':'ไม่ทราบ (UNKNOWN)')
      +kvRow('ค่าธนาคาร',fmtBaht(c.bankFee),'var(--c-danger)',true);

  }
  h+='</div>';

  // final
  h+='<div style="margin-top:14px;background:#E4F4EB;border:1px solid #CBE9D8;border-radius:8px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;">'
    +'<span style="font-weight:700;color:#157A41;">ยอดสุทธิ</span>'
    +'<span class="mono" style="font-weight:700;font-size:16px;color:#157A41;">'+fmtBaht(c.finalAmt)+'</span></div>';

  h+='</div>';
  return h;
}

      +dvCell('ยอดสุทธิรวม','<span class="mono" style="font-weight:700;color:var(--c-primary);">'+fmtBaht(it.total_amount)+'</span>')
      +'</div></div>';
    body+='<div class="dv-section" style="margin-bottom:0;"><div class="dv-section-title"><i data-lucide="landmark" class="w-4 h-4"></i>บัญชีธนาคาร</div><div class="dv-grid">'

    if(it.inst2_paid) events.push({t:'installment.paid — ยืนยันการจ่ายงวดที่ 2',m:CURRENT_USER.name,dot:'is-success'});

  renderIcons();

function openPayment(id){
  var row=findPayment(id); if(!row)return;
  state.pay={ id:id, payTab:'inst1',
    inst1:{confirmed:!!row.inst1_paid,method:'TRANSFER',cheque:'',notes:'',manual:[]},
    inst2:{confirmed:!!row.inst2_paid,method:'TRANSFER',cheque:'',notes:'',manual:[]},
    promo:{confirmed:!!row.promo_paid,method:'TRANSFER',cheque:'',notes:'',manual:[]} };
  if(row.inst1_paid){ if(row.inst2_bill_type&&!row.inst2_paid)state.pay.payTab='inst2'; else if(row.has_promotion&&!row.promo_paid)state.pay.payTab='promo'; }
  openModalBox('payment',{id:id},900);
}
function setPayTab(t){ if(!state.pay)return; state.pay.payTab=t; renderPaymentModal(); }
function setPayMethod(kind,val){ if(!state.pay)return; state.pay[kind].method=val; renderPaymentModal(); }
function setPayNotes(kind,val){ if(state.pay)state.pay[kind].notes=val; }
function setPayCheque(kind,val){ if(state.pay)state.pay[kind].cheque=val; }
function addManualCharge(kind){
  if(!state.pay)return; var row=findPayment(state.pay.id);
  var d=document.getElementById('mc-desc'), a=document.getElementById('mc-amt'), t=document.getElementById('mc-type');
  var desc=d?String(d.value).trim():''; var per=a?parseFloat(a.value):NaN; var ctype=t?t.value:'FLAT';
  if(!desc){ showToast('กรุณากรอกรายละเอียด','warning'); return; }
  if(isNaN(per)||per<0){ showToast('กรุณากรอกจำนวนเงินให้ถูกต้อง','warning'); return; }
  var amount=ctype==='PER_TON'?per*row.net_tons:per;
  state.pay[kind].manual.push({desc:desc,per:per,ctype:ctype,amount:amount});
  renderPaymentModal();
}
function removeManualCharge(kind,idx){ if(!state.pay)return; state.pay[kind].manual.splice(idx,1); renderPaymentModal(); }
function confirmInstallment(kind){
  if(!state.pay)return; var p=state.pay; var row=findPayment(p.id);
  if(p[kind].method==='CHEQUE'&&String(p[kind].cheque||'').trim()===''){ showToast('กรุณากรอกเลขที่เช็ค','warning'); return; }
  p[kind].confirmed=true;
  var title=payTitle(kind);
  showToast('✓ ยืนยันการจ่าย'+title+'สำเร็จ','success');
  var hasInst2=!!row.inst2_bill_type, hasPromo=row.has_promotion;
  if(kind==='inst1'){ if(hasInst2&&!p.inst2.confirmed)p.payTab='inst2'; else if(hasPromo&&!p.promo.confirmed)p.payTab='promo'; }
  else if(kind==='inst2'){ if(hasPromo&&!p.promo.confirmed)p.payTab='promo'; }
  renderPaymentModal();
}
function finalizeAll(){
  if(!state.pay)return; var row=findPayment(state.pay.id);
  row.status='completed'; row.status_label='เสร็จสิ้น';
  row.inst1_paid=true; if(row.inst2_bill_type)row.inst2_paid=true; if(row.has_promotion)row.promo_paid=true;
  closeModal(); state.pay=null; state.tab='completed'; navigate('payments/completed');
  showToast('✓ ทำจ่ายทั้งหมดสำเร็จ','success',4200,'สถานะเปลี่ยนเป็น เสร็จสิ้น');
}

function methodOption(kind,val,icon,label,sub,checked,disabled){
  var dot='<span style="width:16px;height:16px;border-radius:50%;border:2px solid '+(checked?'var(--c-primary)':'var(--c-line)')+';display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;">'+(checked?'<span style="width:8px;height:8px;border-radius:50%;background:var(--c-primary);"></span>':'')+'</span>';
  return '<label style="display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid '+(checked?'var(--c-primary)':'var(--c-line)')+';border-radius:8px;margin-bottom:8px;cursor:'+(disabled?'not-allowed':'pointer')+';'+(checked?'background:rgba(255,59,48,0.04);':'')+(disabled?'opacity:.7;':'')+'" '+(disabled?'':'onclick="setPayMethod(\''+kind+'\',\''+val+'\')"')+'>'
    +dot
    +'<span style="flex:1;"><span style="font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;"><i data-lucide="'+icon+'" class="w-3.5 h-3.5"></i>'+esc(label)+'</span><span style="font-size:11.5px;color:var(--c-mute-2);display:block;margin-top:2px;">'+sub+'</span></span></label>';
}

function installmentTab(kind,row){
  var p=state.pay; var st=p[kind]; var readOnly=st.confirmed;
  var c=payCalc(row,kind,st.method,st.manual);
  var h='';
  // header
  h+='<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;">'
    +'<h3 style="margin:0;font-size:16px;font-weight:700;">'+payTitle(kind)+'</h3>'
    +(kind==='promo'?'<span class="pill pill-info">โปรโมชัน</span>':billBadge(kind==='inst1'?row.inst1_bill_type:row.inst2_bill_type))+'</div>';
  if(readOnly){ h+='<div class="note is-info" style="margin-bottom:12px;background:#E4F4EB;color:#157A41;"><i data-lucide="check-circle-2" class="w-4 h-4"></i><span>ยืนยันการจ่าย'+payTitle(kind)+'แล้ว</span></div>'; }
  // calc card
  h+=calcCardHtml(row,kind,st.method,st.manual,readOnly);
  // method selector
  h+='<div style="border:1px solid var(--c-line-2);border-radius:10px;padding:16px;margin-top:14px;">'
    +'<div style="font-weight:700;font-size:14px;margin-bottom:12px;">วิธีจ่าย</div>'
    +methodOption(kind,'TRANSFER','banknote','โอนธนาคาร',(st.method==='TRANSFER'?'ระบบจะหักค่าธนาคาร '+esc(fmtBaht(c.bankFee)):'โอนเข้าบัญชีธนาคารของเกษตรกร'),st.method==='TRANSFER',readOnly)
    +methodOption(kind,'CASH','wallet','เงินสด','ไม่มีค่าธนาคาร — แนบหลักฐานได้ (optional)',st.method==='CASH',readOnly)
    +methodOption(kind,'CHEQUE','receipt','เช็ค','กรอกเลขที่เช็ค (บังคับ) แนบรูปเช็คได้ (optional)',st.method==='CHEQUE',readOnly);
  if(st.method==='CHEQUE'){
    h+='<div class="field" style="margin-bottom:0;margin-top:4px;"><label class="field-label">เลขที่เช็ค <span class="req">*</span></label><input class="input mono" id="pay-cheque" type="text" placeholder="CHK-000123" value="'+esc(st.cheque||'')+'" '+(readOnly?'disabled':'oninput="setPayCheque(\''+kind+'\',this.value)"')+'></div>';
  }
  h+='</div>';
  // bank account (transfer only)
  if(st.method==='TRANSFER'){
    h+='<div style="border:1px solid var(--c-line-2);border-radius:10px;padding:16px;margin-top:14px;">'
      +'<div style="font-weight:700;font-size:14px;margin-bottom:12px;">บัญชีธนาคาร</div><div class="dv-grid">'
      +dvCell('ชื่อบัญชี',esc(row.farmer_name))
      +dvCell('ธนาคาร','ธนาคารกรุงเทพ')
      +dvCell('เลขบัญชี','<span class="mono">001-234-5678</span>')
      +dvCell('จังหวัดสาขา',esc(c.branchProvince))
      +'</div></div>';
  }
  // notes
  h+='<div class="field" style="margin-top:14px;margin-bottom:14px;"><label class="field-label">หมายเหตุ (ถ้ามี)</label>'
    +'<textarea class="input" id="pay-notes" placeholder="เช่น จ่ายผ่านตัวแทน, หมายเหตุพิเศษ" '+(readOnly?'disabled':'oninput="setPayNotes(\''+kind+'\',this.value)"')+'>'+esc(st.notes||'')+'</textarea></div>';
  // confirm button
  if(!readOnly){
    h+='<button class="btn btn-primary" style="width:100%;" onclick="confirmInstallment(\''+kind+'\')"><i data-lucide="check" class="w-4 h-4"></i><span>ยืนยันการจ่าย'+payTitle(kind)+'</span></button>';
  }
  return h;
}

function paySimpleTotal(row,kind,st){
  if(!st)return 0;
  var base = kind==='inst1'?row.inst1_amount : kind==='inst2'?row.inst2_amount : row.promo_amount;
  base=base||0;
  var c=payCalc(row,kind,st.method,st.manual);
  return Math.max(0, base - c.bankFee);
}

function renderPaymentModal(){
  var p=state.pay; if(!p){ closeModal(); return; }
  var row=findPayment(p.id); if(!row){ closeModal(); return; }
  var hasInst2=!!row.inst2_bill_type, hasPromo=row.has_promotion;
  var tab=p.payTab;

  function ptab(id,label,disabled,confirmed){
    return '<button class="tab '+(tab===id?'on':'')+(disabled?' is-disabled':'')+'" '+(disabled?'':'onclick="setPayTab(\''+id+'\')"')+'>'
      +esc(label)+(confirmed?' <i data-lucide="check-circle-2" class="w-3.5 h-3.5" style="color:var(--c-success);"></i>':'')
      +(disabled?' <span style="font-size:11px;opacity:.6;">(ไม่มี)</span>':'')+'</button>';
  }
  var tabsHtml='<div class="tabs" style="margin-top:0;margin-bottom:16px;">'
    +ptab('inst1','งวดที่ 1',false,p.inst1.confirmed)
    +ptab('inst2','งวดที่ 2',!hasInst2,p.inst2.confirmed)
    +ptab('promo','โปรโมชั่น',!hasPromo,p.promo.confirmed)+'</div>';

  var content=installmentTab(tab,row);

  var inst1Total=paySimpleTotal(row,'inst1',p.inst1);
  var inst2Total=hasInst2?paySimpleTotal(row,'inst2',p.inst2):0;
  var promoTotal=hasPromo?paySimpleTotal(row,'promo',p.promo):0;
  var grand=inst1Total+inst2Total+promoTotal;
  var allConfirmed=p.inst1.confirmed&&(!hasInst2||p.inst2.confirmed)&&(!hasPromo||p.promo.confirmed);

  function sumRow(label,val,confirmed){ return '<div style="display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:13px;"><span>'+esc(label)+'</span><span style="display:inline-flex;align-items:center;gap:8px;"><span class="mono">'+fmtBaht(val)+'</span>'+(confirmed?'<i data-lucide="check-circle-2" class="w-3.5 h-3.5" style="color:var(--c-success);"></i>':'')+'</span></div>'; }
  var summary='<div style="border:1px solid var(--c-line-2);background:var(--c-bg-off);border-radius:10px;padding:16px;margin-top:6px;">'
    +'<div style="font-weight:700;font-size:14px;margin-bottom:8px;">สรุปยอดรวมทั้งหมด</div>'
    +sumRow('งวดที่ 1',inst1Total,p.inst1.confirmed)
    +(hasInst2?sumRow('งวดที่ 2',inst2Total,p.inst2.confirmed):'')
    +(hasPromo?sumRow('โปรโมชั่น',promoTotal,p.promo.confirmed):'')
    +'<div style="border-top:1px solid var(--c-line-2);margin:8px 0;"></div>'
    +'<div style="display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px;"><span>รวมทั้งหมด</span><span class="mono" style="color:#157A41;">'+fmtBaht(grand)+'</span></div>'
    +(!allConfirmed?'<div class="note is-warn" style="margin-top:12px;"><i data-lucide="alert-circle" class="w-4 h-4"></i><span>กรุณายืนยันการจ่ายทุกงวดก่อนกดยืนยันทั้งหมด</span></div>':'')
    +'<button class="btn btn-primary'+(allConfirmed?'':' is-disabled')+'" style="width:100%;margin-top:12px;"'+(allConfirmed?'':' disabled')+' onclick="finalizeAll()"><i data-lucide="check-check" class="w-4 h-4"></i><span>ยืนยันทำจ่ายทั้งหมด</span></button>'
    +'</div>';

  document.getElementById('modalBox').innerHTML=
    '<div class="modal-header"><div class="modal-header-icon"><i data-lucide="hand-coins" class="w-5 h-5"></i></div>'
    +'<div style="flex:1;"><h3 class="modal-title">ทำจ่ายเงินอ้อย — '+esc(row.farmer_name)+' ('+esc(row.id)+')</h3>'
    +'<p class="modal-subtitle">'+esc(row.scale_ticket_no)+' · '+esc(row.cane_type_name)+' · '+fmtNum(row.net_tons,2)+' ตัน</p></div>'+modalCloseBtn()+'</div>'
    +'<div class="modal-body">'+tabsHtml+content+summary+'</div>';
  renderIcons();
}

// ---- Sync CCS (single) ----
function syncCcsConfirm(id){
  var row=findPayment(id); if(!row)return;
  var ccs=11.2;
  row.ccs_value=ccs; row.status='pending'; row.status_label='รอทำจ่าย';
  var cane=row.net_tons*PRICE_PER_TON;
  if(row.inst2_bill_type){ row.inst1_amount=Math.round(cane*0.5); row.inst2_amount=Math.round(cane*0.5); }
  else { row.inst1_amount=Math.round(cane); }
  if(row.has_promotion) row.promo_amount=Math.round(row.net_tons*PROMO_RATE_PER_TON);
  row.total_amount=(row.inst1_amount||0)+(row.inst2_amount||0)+(row.promo_amount||0);
  closeModal(); render(); showToast('ดึงค่า CCS สำเร็จ (CCS: '+fmtNum(ccs,1)+')','success');
}
function renderSyncCcsModal(){
  var d=state.modal.data; var it=findPayment(d.id);
  if(!it){ closeModal(); return; }
  document.getElementById('modalBox').innerHTML=
    '<div class="modal-header"><div class="modal-header-icon"><i data-lucide="refresh-cw" class="w-5 h-5"></i></div>'
    +'<div style="flex:1;"><h3 class="modal-title">ดึงค่าความหวาน (CCS)</h3><p class="modal-subtitle">'+esc(it.farmer_name)+' · '+esc(it.id)+'</p></div>'+modalCloseBtn()+'</div>'
    +'<div class="modal-body">'
    +'<div class="note is-info" style="margin-bottom:14px;"><i data-lucide="info" class="w-4 h-4"></i><span>ดึงค่า CCS จากระบบภายนอกสำหรับรายการนี้?</span></div>'
    +'<div class="dv-grid" style="grid-template-columns:1fr 1fr;">'
    +dvCell('Scale Ticket','<span class="mono">'+esc(it.scale_ticket_no)+'</span>')
    +dvCell('Unload Date','<span class="mono">'+esc(it.receiving_date)+'</span>')
    +'</div>'
    +'</div>'
    +'<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>'
    +'<button class="btn btn-primary" onclick="syncCcsConfirm(\''+it.id+'\')"><i data-lucide="download-cloud" class="w-4 h-4"></i><span>ดึงค่า CCS (ยืนยัน)</span></button></div>';
  renderIcons();
}

// ---- Sync All ----
function syncAllStart(){
  var waiting=state.payments.filter(function(p){ return p.status==='waiting_ccs'; });
  var success=0, failed=0;
  waiting.forEach(function(row){
    row.ccs_value=11.2; row.status='pending'; row.status_label='รอทำจ่าย';
    var cane=row.net_tons*PRICE_PER_TON;
    if(row.inst2_bill_type){ row.inst1_amount=Math.round(cane*0.5); row.inst2_amount=Math.round(cane*0.5); }
    else { row.inst1_amount=Math.round(cane); }
    if(row.has_promotion) row.promo_amount=Math.round(row.net_tons*PROMO_RATE_PER_TON);
    row.total_amount=(row.inst1_amount||0)+(row.inst2_amount||0)+(row.promo_amount||0);
    success++;
  });
  state.modal.data.done=true; state.modal.data.total=waiting.length; state.modal.data.success=success; state.modal.data.failed=failed;
  renderModal(); renderListPage(); renderIcons();
  showToast('ดึงค่า CCS ทั้งหมดเสร็จสิ้น','success',4200,'สำเร็จ '+success+' รายการ');
}
function renderSyncAllModal(){
  var d=state.modal.data;
  var waitingCount=state.payments.filter(function(p){ return p.status==='waiting_ccs'; }).length;
  var body,footer;
  if(!d.done){
    body='<div class="note is-info" style="margin-bottom:14px;"><i data-lucide="info" class="w-4 h-4"></i><span>พบรายการรอดึงค่าความหวาน <strong>'+waitingCount+'</strong> รายการ — ต้องการดึงค่า CCS ทั้งหมดจากระบบภายนอกหรือไม่?</span></div>';
    footer='<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>'
      +'<button class="btn btn-primary'+(waitingCount===0?' is-disabled':'')+'"'+(waitingCount===0?' disabled':'')+' onclick="syncAllStart()"><i data-lucide="refresh-cw" class="w-4 h-4"></i><span>ยืนยันและเริ่ม</span></button>';
  } else {
    body='<div class="imp-summary"><div class="imp-chip is-total"><div class="v">'+d.total+'</div><div class="l">ทั้งหมด</div></div>'
      +'<div class="imp-chip is-ok"><div class="v">'+d.success+'</div><div class="l">สำเร็จ</div></div>'
      +'<div class="imp-chip is-bad"><div class="v">'+d.failed+'</div><div class="l">ล้มเหลว</div></div></div>'
      +'<div class="note is-info"><i data-lucide="check-circle-2" class="w-4 h-4"></i><span>ทั้งหมด '+d.total+' · สำเร็จ '+d.success+' · ล้มเหลว '+d.failed+'</span></div>';
    footer='<button class="btn btn-primary" onclick="closeModal()">ปิด</button>';
  }
  document.getElementById('modalBox').innerHTML=
    '<div class="modal-header"><div class="modal-header-icon"><i data-lucide="refresh-cw" class="w-5 h-5"></i></div>'
    +'<div style="flex:1;"><h3 class="modal-title">Sync All — ดึงค่าความหวานทั้งหมด</h3><p class="modal-subtitle">ดึงค่า CCS จากระบบภายนอกสำหรับรายการที่รอผล</p></div>'+modalCloseBtn()+'</div>'
    +'<div class="modal-body">'+body+'</div>'
    +'<div class="modal-footer">'+footer+'</div>';
  renderIcons();
}

// ESC chain
window.addEventListener('keydown',function(e){ if(e.key!=='Escape')return; if(state.modal.open)closeModal(); else if(state.view)closeView(); });

// INIT
window.addEventListener('hashchange',function(){ render(); });
var domReady=false,lucideReady=false;
function bootIfReady(){ if(domReady&&lucideReady){ render(); renderIcons(); } }
if(document.readyState==='loading')window.addEventListener('DOMContentLoaded',function(){domReady=true;bootIfReady();}); else domReady=true;
window.addEventListener('lucide:ready',function(){lucideReady=true;bootIfReady();});
if(window.lucide&&typeof window.lucide.createIcons==='function')lucideReady=true;
bootIfReady();
setTimeout(function(){ if(!lucideReady){lucideReady=true;bootIfReady();} },5000);
</script>
</body></html>
