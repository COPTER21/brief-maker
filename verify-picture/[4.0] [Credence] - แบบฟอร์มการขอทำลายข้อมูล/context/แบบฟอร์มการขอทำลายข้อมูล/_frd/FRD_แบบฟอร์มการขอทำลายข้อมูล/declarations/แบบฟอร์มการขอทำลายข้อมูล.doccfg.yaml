# doccfg-declaration v2.1 — ฉบับจริง (ยืนยันกับ FRD v1.0)
feature_id: F-TMP-003
doc_types:
- code: DRITS
  name_th: แบบฟอร์มการขอทำลายข้อมูล
  module: IT
  feature_id: F-TMP-003
  numbering:
    preset: '{PREFIX}-{YYYY}-{run:4}'
    reset: yearly
    scope: global
    no_gap: false
    issue_on: first_save
    frd_ref: 03_LOGIC F-TMP-003-FN-02
  snapshot:
    sent_external: false
    approved_final: true
  snapshot_points:
  - event: approved_final
    frd_ref: 03_LOGIC F-TMP-003-FN-04
  print_config:
    form_code: FM-ITS-02
    revision: 'Rev.00 : 01/07/2569'
    paper: A4-portrait
    min_rows: 3
    dense_when_rows_over: 3
    header_source: organization_snapshot_at_numbering
    sign_boxes:
    - box: requester
      label: ผู้ร้องขอ
      show_date: true
    - box: doa_step:*
      label: from_doa_step
      show_decision: true
      show_date: true
    - box: performer
      label: เจ้าหน้าที่ IT
      show_date: true
      source: performed_by / performed_at (เจ้าหน้าที่ IT กด บันทึกการทำลายแล้ว) —
        ไม่ใช่ขั้น DOA
    decision_words:
      default:
        approve: อนุมัติ
        reject: ไม่อนุมัติ
      by_role: {}
    sign_layout:
      source: approval_chain snapshot (ผู้ร้องขอ + จำนวนขั้นตามที่ตั้งใน DOA) + ช่องเจ้าหน้าที่
        IT ท้ายสุด
      max_per_row: 4
      split: even
      dense_when_steps_over: 4
      keep_together: true
    ref: print/print_config.json
