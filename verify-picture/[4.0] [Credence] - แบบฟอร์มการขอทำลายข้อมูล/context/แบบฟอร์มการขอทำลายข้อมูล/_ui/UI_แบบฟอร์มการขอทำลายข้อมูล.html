function tabBtn(key, label, icon, count){ return `<button class="drawer-tab ${S.dw.tab === key ? 'is-active' : ''}" onclick="setTab('${key}')"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i> ${label}${count != null ? `<span class="dt-count num">${count}</span>` : ''}</button>`; }
function kv(label, val){ return `<div class="lbl">${label}</div><div class="val">${val}</div>`; }
const SEC = (icon, title, body, extra) => `<div class="drawer-section"><div class="drawer-section-title"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i>${title}${extra || ''}</div>${body}</div>`;

function viewBanner(r){

  if (r.status === 'cancelled'){ const a = r.audit.filter(x => x.act === 'ยกเลิกเอกสาร').pop(); return `<div class="alert-row is-danger"><i data-lucide="x-circle" class="w-4 h-4"></i><div>ยกเลิกแล้ว — ${esc(a ? a.note : '')}</div></div>`; }

  if (r.status === 'draft') return `<div class="alert-row"><i data-lucide="pencil" class="w-4 h-4"></i><div>ยังเป็นร่าง — ส่งอนุมัติเมื่อข้อมูลครบ</div></div>`;

ex-wrap:wrap; gap:4px 18px; }\n.cb{ font-size:var(--form-cb-fs); line-height:1; }\n.form-check .fill--s{ min-width:10mm; } .form-check .fill--m{ min-width:22mm; }\n.form-box{ margin-top:var(--form-row-gap); padding:6px 8px; border:1px solid var(--form-dot); min-height:18mm; }\n.form-section{ margin-top:var(--form-para-gap); font-weight:700; }\n/* รายการซ้ำยาว (> min_rows) → ระยะกระชับให้จบหน้าเดียวได้นานที่สุด (data.layout.dense) */\n.form.form--dense .form-row{ margin-top:var(--form-row-gap-dense); }\n.form.form--dense .form-row--indent{ margin-top:calc(var(--form-row-gap-dense) * 3); }\n.form.form--dense .form-check{ margin-top:calc(var(--form-row-gap-dense) * 2); }\n.form.form--dense .form-p{ margin-top:var(--form-para-gap-dense); }\n\n/* R9 · ตารางกรอบ (grid form) — ฟอร์มที่กระดาษเป็นตารางเส้นทึบ (เช่น FM-FIN-02) · v2.1 */\n.form-grid{ width:100%; border-collapse:collapse; table-layout:fixed; margin-top:var(--form-grid-gap); }\n.form-grid + .form-grid{ border-top:0; }\n.form-grid td, .form-grid th{ border:1px solid var(--form-grid-line); padding:2px var(--form-grid-pad); height:var(--form-grid-row-h); vertical-align:middle; text-align:left; font-weight:400; overflow:hidden; }\n.form-grid th{ background:var(--form-grid-head-bg); font-weight:700; text-align:center; }\n.form-grid .g-b{ font-weight:700; } .form-grid .g-r{ text-align:right; } .form-grid .g-c{ text-align:center; }\n.form-grid .g-v{ font-weight:500; } .form-grid .g-num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:500; }\n.form-grid .g-25{ width:25%; } .form-grid .g-50{ width:50%; } .form-grid .g-75{ width:75%; }\n.form-grid .g-tall{ height:calc(var(--form-grid-row-h) * 1.5); }\n.form-grid .g-u{ text-decoration:underline; font-weight:700; }\n.form.form--dense .form-grid td{ height:var(--form-grid-row-h-dense); }\n.form-note{ margin-top:var(--form-row-gap); } .form-note .b{ font-weight:700; }\n.form-grid--signs td{ text-align:center; vertical-align:top; }\n.form-grid td.g-blank{ border-top:0; border-left:0; }\n.form-grid tr.g-hrow td{ height:calc(var(--form-grid-row-h) * 1.4); }\n\n/* B6 rows · ช่องลงชื่อ dynamic ตาม DOA (v2.1) — data ส่ง sign_rows[].signs[] แถวละ ≤4 (sign_rows.py / tplSignRows)\n   ห่อด้วย .signs-block ทุกครั้ง = ทั้งก้อนไม่ถูกตัดข้ามหน้า · .doc-bottom.is-dense เมื่อขั้น DOA > 4 */\n.form-grid--signs + .form-grid--signs{ margin-top:0; border-top:0; }\n.form-grid--signs + .form-grid--signs td{ border-top:0; }\n.doc-bottom.is-dense .sign__line{ height:16px; }\n.doc-bottom.is-dense .form-grid--signs td{ padding-top:1px; padding-bottom:1px; }\n.doc-bottom.is-dense .sign__date, .doc-bottom.is-dense .sign__name{ font-size:7.2pt; }\n.signs-block{ break-inside:avoid; page-break-inside:avoid; }\n.signs-block .signs + .signs{ margin-top:4mm; }\n.doc-bottom.is-dense .signs-block .signs + .signs{ margin-top:2mm; }\n\n/* ===== R10 · เอกสารเกิน 1 หน้า (v2.2) — ออกแบบเป็น 2 หน้าแทนการบีบ ===== */\n.page-break{ break-before:page; page-break-before:always; }          /* ขึ้นหน้าใหม่ตรงจุดที่ตั้งใจ (ก่อนส่วนที่ 2 / ก่อนบล็อกลงชื่อ) */\n.keep-together{ break-inside:avoid; page-break-inside:avoid; }       /* กล่อง/ตารางย่อยไม่ถูกตัดกลาง */\n.form-grid thead, .items thead{ display:table-header-group; }        /* หัวตารางซ้ำทุกหน้า */\n.form-grid tr, .items tr{ break-inside:avoid; page-break-inside:avoid; }\n.cont-note{ text-align:right; font-size:7.5pt; color:var(--form-ink,#333); margin-top:2mm; }   /* \"มีต่อหน้าถัดไป\" ท้ายหน้า 1 */\n.page-no{ text-align:right; font-size:7.5pt; }                        /* \"หน้า 1/2\" ใน footer ทุกหน้า */\n\n:root{--form-fs:9.6pt; --form-title-fs:15pt; --form-logo-h:11mm; --form-title-gap:4px; --form-grid-gap:6px; --form-cb-fs:11pt; --form-grid-head-bg:#BFBFBF;}";

const PRINT_CFG = { text_min_rows:{ detail_lines:3, program_lines:2 }, max_per_row:4, dense_when_steps_over:4, decision_words:{ default:{ approve:'อนุมัติ', reject:'ไม่อนุมัติ' }, by_role:{} } };
const BLANK_DATE = 'วันที่ ........./........./.........';
const TH_MONTH = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const thFull = iso => { if (!iso) return ''; const d = iso.slice(0, 10).split('-'); return Number(d[2]) + ' ' + TH_MONTH[Number(d[1]) - 1] + ' ' + (Number(d[0]) + 543); };
const tShort = iso => { if (!iso) return ''; const d = iso.slice(0, 10).split('-'); return Number(d[2]) + ' ' + ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][Number(d[1]) - 1] + ' ' + (Number(d[0]) + 543); };
const box = on => on ? '☑' : '☐';
function textLines(s, min){ const rows = String(s || '').split('\n').filter(t => t).map(t => ({ text:t })); while (rows.length < min) rows.push({ text:'' }); return rows; }
/* print data contract (= print/make_data.py) — ระบบจริง: backend สร้าง JSON นี้จาก record แล้ว render template เดียวกัน */
function docPrintData(r){
  const e = empOf(r.emp), mark = (label, iso) => iso ? `${label} ${tShort(iso)} ${iso.slice(11, 16)} น.` : '';
  const words = id => PRINT_CFG.decision_words.by_role[id] || PRINT_CFG.decision_words.default;
  const sent = r.status !== 'draft' && r.submittedAt;
  const signs = [{ role:'ผู้ร้องขอ', name:e.name, position:r.pos, date:sent ? mark('ส่งในระบบ', r.submittedAt) : BLANK_DATE, decision:null }]
    .concat(r.chain.map(c => { const p = empOf(c.assignee), done = c.status === 'approved' || c.status === 'rejected', w = words(c.role_id);
      return { role:c.role, name:sent && c.assignee ? p.name : '', position:sent && c.assignee ? p.pos : '', date:done ? mark('พิจารณาในระบบ', c.at) : BLANK_DATE,
        decision:{ approve_box:box(c.status === 'approved'), reject_box:box(c.status === 'rejected'), approve_word:w.approve, reject_word:w.reject } }; }))
    .concat([{ role:'เจ้าหน้าที่ IT', name:r.performedBy ? empOf(r.performedBy).name : '', position:r.performedBy ? empOf(r.performedBy).pos : '', date:r.performedAt ? mark('ทำลายในระบบ', r.performedAt) : BLANK_DATE, decision:null }]);
  const cb = g => { const o = {}; GROUPS[g].forEach(j => { o[j[0]] = box(r[g].includes(j[0])); }); return o; };
  const T = PRINT_CFG.text_min_rows, d = textLines(r.detail, T.detail_lines), p = textLines(r.program, T.program_lines);
  const over = d.length > T.detail_lines || p.length > T.program_lines;
  return {
    company:{ name:DOC.company, logo:CO_LOGO },
    doc:{ title:DOC_NAME, no:r.code, is_draft:r.status === 'draft', form_code:DOC.form, revision:DOC.rev },
    req_date:thFull(r.reqDate), employee:{ name:e.name, position:r.pos },
    detail_lines:d, program_lines:p,
    data_type:cb('dataTypes'), period_from:thFull(r.periodFrom), period_to:thFull(r.periodTo),
    destroy_reason:cb('reasons'), destroy_reason_other:r.reasons.includes('other') ? r.reasonOther : '', destroy_reason_more:'',
    destroy_method:cb('methods'), destroy_method_other:r.methods.includes('other') ? r.methodOther : '', destroy_method_more:'',
    sign_rows:tplSignRows(signs, PRINT_CFG.max_per_row),
    layout:{ dense:over || r.chain.length > PRINT_CFG.dense_when_steps_over },
  };
}
const docPrintBody = r => tplRender(DRITS_TPL, [docPrintData(r)]);
const docPrintDoc = r => `<!doctype html><html lang="th"><head><meta charset="utf-8"><title>${r.code}</title><style>${PDF_CSS}</style></head><body>${docPrintBody(r)}</body></html>`;
function renderPdfTab(r){
  return `<div class="pv-bar"><span class="pv-meta">ตัวอย่าง PDF · A4 · แบบพิมพ์ ${DOC.form} ${DOC.rev} · template ตาม thai-doc</span>
      <div class="pv-actions"><button class="btn btn-ghost btn-sm" onclick="genPdf('${r.id}')"><i data-lucide="download" class="w-4 h-4"></i><span>ดาวน์โหลด PDF</span></button><button class="btn btn-ghost btn-sm" onclick="genPdf('${r.id}', true)"><i data-lucide="printer" class="w-4 h-4"></i><span>พิมพ์</span></button></div></div>
    <div class="a4"><div class="pdf-slot"><iframe class="pdf-frame" title="ตัวอย่าง PDF ${r.code}" onload="fitPdf(this)" srcdoc="${esc(docPrintDoc(r))}"></iframe></div></div>`;
}
function fitPdf(f){ try { const d = f.contentDocument; f.style.height = Math.max(1123, d.documentElement.scrollHeight) + 'px'; } catch (e) { /* cross-origin host */ } }
function genPdf(id, isPrint){
  const r = findR(id); if (!r) return;
  let f = document.querySelector('.pdf-gen');

          <button class="btn btn-primary" id="btnSaveSubmit" onclick="saveAndSubmit()" ${S.busy ? 'disabled' : ''}>${S.busy ? '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>' : '<i data-lucide="send" class="w-4 h-4"></i><span>บันทึกและส่งอนุมัติ</span>'}</button>`

}

/* G3/VALID (DEC-04/15/16/17): บังคับช่องตามกระดาษ · ≥1 ต่อกลุ่ม · อื่นๆ ต้องระบุ · ถึง ≥ จาก (บังคับ) · ถึง หลังวันที่ขอ = เตือน ไม่บล็อก */
function validateMain(){
  const f = wf(), err = {};
  if (!f.detail.trim()) err.detail = 'ระบุรายละเอียดของข้อมูลที่ต้องการทำลาย';
  if (!f.program.trim()) err.program = 'ระบุโปรแกรมที่เก็บข้อมูล';
  if (!f.dataTypes.length) err.dataTypes = 'เลือกประเภทข้อมูลอย่างน้อย 1 ข้อ';
  if (!f.periodFrom) err.periodFrom = 'เลือกวันที่เริ่มต้นของข้อมูล';
  if (!f.periodTo) err.periodTo = 'เลือกวันที่สิ้นสุดของข้อมูล';
  else if (f.periodFrom && f.periodTo < f.periodFrom) err.periodTo = 'วันที่ "ถึง" ต้องไม่ก่อนวันที่ "จาก"';
  if (!f.reasons.length) err.reasons = 'เลือกเหตุผลอย่างน้อย 1 ข้อ';
  if (f.reasons.includes('other') && !f.reasonOther.trim()) err.reasonOther = 'โปรดระบุเหตุผลอื่นๆ';
  if (!f.methods.length) err.methods = 'เลือกวิธีการอย่างน้อย 1 ข้อ';
  if (f.methods.includes('other') && !f.methodOther.trim()) err.methodOther = 'โปรดระบุวิธีการอื่นๆ';
  const ok = !Object.keys(err).length; S.dw.err = ok ? null : err; return ok;
}

}

/* บันทึกครั้งแรก = ENG-DOC-NUM.next() ออกเลข DRITS (DEC-10) · ชื่อ/ตำแหน่ง snapshot ลงเอกสาร ณ วันที่ขอ */
function persist(){
  const f = wf(), me = ME(), t = nowIso();
  let r = S.dw.editId ? findR(S.dw.editId) : null;
  if (!r){
    SEQ += 1;
    r = { id:'R' + SEQ, code:DOC.prefix + '-2569-' + String(SEQ).padStart(4, '0'), status:'draft', emp:S.me, pos:me.pos, dept:me.dept, reqDate:TODAY, returned:null, performedBy:null, performedAt:null, doneNote:'',
      chain:resolveDoa(S.me), doa_entry_ref:MOCK_DOA_RESOLVED.doa_entry_ref, attachments:[], audit:[{ act:'สร้างเอกสาร', by:me.name, at:t, tone:'' }], createdBy:me.name, createdAt:t };
    RECS.unshift(r);
  } else r.audit.push({ act:'แก้ไขร่าง', by:me.name, at:t, tone:'' });
  Object.assign(r, { detail:f.detail.trim(), program:f.program.trim(), dataTypes:f.dataTypes.slice(), periodFrom:f.periodFrom, periodTo:f.periodTo,
    reasons:f.reasons.slice(), reasonOther:f.reasons.includes('other') ? f.reasonOther.trim() : '', methods:f.methods.slice(), methodOther:f.methods.includes('other') ? f.methodOther.trim() : '',
    attachments:f.files.slice(), updatedBy:me.name, updatedAt:t });
  return r;
}
function saveDraft(){ if (S.busy) return; if (!validateMain()){ S.dw.step = 1; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const r = persist(); S.busy = false; closeDrawer(true); setTimeout(() => showToast('บันทึกร่างแล้ว · ' + r.code, 'info'), 300); }, 500); }
function saveAndSubmit(){ if (S.busy) return; if (!validateMain()){ S.dw.step = 1; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }

/* =====================================================================

function presetChips(list, cur){ return `<div class="chip-row">${list.map(p => `<button type="button" class="chip ${cur === p ? 'is-on' : ''}" onclick="setReasonPreset(this.dataset.v)" data-v="${esc(p)}">${esc(p)}</button>`).join('')}</div>`; }
function renderModal(){
  const m = S.md; if (!m) return '';

  if (m.kind === 'submit'){

       <div class="drawer-fields mt-3">${kv('ประเภทข้อมูล', grpPills(r, 'dataTypes'))}${kv('ช่วงเวลาของข้อมูล', fmtD(r.periodFrom) + ' – ' + fmtD(r.periodTo))}</div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="btnSubmit" onclick="confirmSubmit()" ${S.busy ? 'disabled' : ''}>${busyLabel('send', 'ส่งอนุมัติ')}</button>`);
  }
  if (m.kind === 'approve'){
    return modalShell('check-circle-2', 'is-success', 'อนุมัติคำขอนี้?', `${r.code} · ${esc(empOf(r.emp).name)} · ${esc(r.program)}`,
      `<div class="drawer-fields">${kv('ประเภทข้อมูล', grpPills(r, 'dataTypes'))}${kv('ช่วงเวลาของข้อมูล', fmtD(r.periodFrom) + ' – ' + fmtD(r.periodTo))}${kv('วิธีการทำลาย', grpPills(r, 'methods'))}</div>
       <div class="field mt-3"><label class="field-label">ความเห็น</label><textarea class="input" name="apNote" rows="2" placeholder="ไม่บังคับ" oninput="S.md.note=this.value">${esc(m.note || '')}</textarea></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-success" id="btnApprove" onclick="confirmApprove()" ${S.busy ? 'disabled' : ''}>${busyLabel('check', 'อนุมัติ')}</button>`);
  }
  if (m.kind === 'done'){
    return modalShell('check-check', 'is-success', 'บันทึกการทำลายข้อมูลแล้ว?', `${r.code} · ${esc(r.program)} — ลงชื่อในช่อง "เจ้าหน้าที่ IT"`,
      `<div class="field"><label class="field-label">บันทึกการทำลาย</label><textarea class="input" name="doneNote" rows="3" placeholder="ไม่บังคับ — เช่น ลบแล้ว 4,200 ไฟล์ ตรวจซ้ำไม่พบไฟล์ค้าง" oninput="S.md.note=this.value">${esc(m.note || '')}</textarea></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="btnDone" onclick="confirmDone()" ${S.busy ? 'disabled' : ''}>${busyLabel('check-check', 'บันทึกการทำลายแล้ว')}</button>`);
  }
  if (m.kind === 'reject' || m.kind === 'cancel'){
    const rej = m.kind === 'reject';
    return modalShell('x-circle', 'is-danger', rej ? 'ไม่อนุมัติคำขอนี้?' : 'ยกเลิกเอกสาร?', `${r.code} · ${esc(empOf(r.emp).name)}${rej ? ' · เอกสารจะกลับเป็นร่างเลขเดิม ให้ผู้ร้องขอแก้แล้วส่งใหม่' : ''}`,
      `${presetChips(rej ? REJECT_PRESETS : CANCEL_PRESETS, m.preset)}
       <div class="field ${m.err ? 'is-invalid' : ''}" id="fReason"><label class="field-label">เหตุผล<span class="req">*</span></label><textarea class="input" name="reason" rows="3" placeholder="${rej ? 'แจ้งผู้ร้องขอว่าต้องแก้อะไร' : 'เหตุผลที่ยกเลิก'}" oninput="S.md.reason=this.value; if(this.value.trim()) document.getElementById('fReason').classList.remove('is-invalid')">${esc(m.reason || '')}</textarea><div class="field-error">กรุณาระบุเหตุผล</div></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">${rej ? 'ยกเลิก' : 'ไม่ยกเลิก'}</button><button class="btn btn-danger" id="btnReason" onclick="confirmReason()" ${S.busy ? 'disabled' : ''}>${busyLabel('x-circle', rej ? 'ไม่อนุมัติ' : 'ยกเลิกเอกสาร')}</button>`);

  }
  return '';
}
function openModalCfg(cfg){ S.md = cfg; state.modal.open = true; render(); requestAnimationFrame(() => document.getElementById('modalBackdrop').classList.add('is-open')); }
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('is-open'); state.modal.open = false; setTimeout(() => { if (!state.modal.open) S.md = null; }, 200); }
/* backdrop ปิดด้วย mousedown ที่ backdrop เท่านั้น (#122 · U25) · กรอกเหตุผลค้างไว้ = ไม่ปิด */
function modalBackdropDown(ev){ if (ev.target !== ev.currentTarget) return; if (S.md && (S.md.reason || S.md.note)) return; closeModal(); }
function drawerBackdropDown(ev){ if (ev.target !== ev.currentTarget) return; closeDrawer(); }
function setReasonPreset(v){ S.md.preset = v; S.md.reason = v + (S.md.reason && S.md.reason.indexOf(v) !== 0 ? ' — ' + S.md.reason : ''); S.md.err = false; render(); }
function openSubmit(id){ const r = findR(id); if (!r || r.status !== 'draft') return; openModalCfg({ kind:'submit', id, slots:resolveDoa(r.emp).map(c => c.assignee) }); }
function openApprove(id){ openModalCfg({ kind:'approve', id, note:'' }); }
function openReject(id){ openModalCfg({ kind:'reject', id, reason:'' }); }
function openCancel(id){ closeRowMenu(); openModalCfg({ kind:'cancel', id, reason:'' }); }
function openDone(id){ closeRowMenu(); openModalCfg({ kind:'done', id, note:'' }); }
function pushAudit(r, act, note, tone){ const me = ME(), t = nowIso(); r.audit.push({ act, by:me.name, at:t, note:note || '', tone:tone || '' }); r.updatedBy = me.name; r.updatedAt = t; }
/* ENG-NOTIFY (NTF_BRIEF_F-TMP-003): drits_cancelled · drits_ready_for_it · drits_destroyed — DOA engine เป็นเจ้าของ doa_pending/doa_result */
function confirmSubmit(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (m.slots.some(x => !x)){ m.err = true; render(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    r.chain = resolveDoa(r.emp).map((c, i) => Object.assign(c, { assignee:m.slots[i], status:i === 0 ? 'pending' : 'waiting' }));   /* BR-DOA-02 resolve ตอนส่งแล้ว freeze */
    r.status = 'pending'; r.submittedAt = nowIso(); r.returned = null; pushAudit(r, 'ส่งอนุมัติ', 'ถึง ' + empOf(m.slots[0]).name);
    S.busy = false; closeModal(); render(); setTimeout(() => showToast('ส่งอนุมัติแล้ว · ' + r.code, 'success'), 220); }, 600);
}
/* อนุมัติครบ: ไม่เปลี่ยนค่าในระบบ · ไม่ส่งต่อระบบอื่น (DEC-01/02) — เข้าคิวเจ้าหน้าที่ IT (drits_ready_for_it) */
function confirmApprove(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    const c = curStep(r); c.status = 'approved'; c.at = nowIso(); c.note = (m.note || '').trim();
    const next = r.chain.find(x => x.status === 'waiting'); if (next) next.status = 'pending';   /* sequential */
    r.status = next ? 'pending' : 'approved'; pushAudit(r, next ? 'อนุมัติ (ขั้น ' + c.step + ')' : 'อนุมัติ', c.note, 'ok');
    S.busy = false; closeModal(); render(); setTimeout(() => showToast('อนุมัติแล้ว · ' + r.code, 'success'), 220); }, 600);
}
function confirmDone(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    r.status = 'done'; r.performedBy = S.me; r.performedAt = nowIso(); r.doneNote = (m.note || '').trim(); pushAudit(r, 'บันทึกการทำลายแล้ว', r.doneNote, 'ok');   /* drits_destroyed */
    S.busy = false; closeModal(); render(); setTimeout(() => showToast('บันทึกการทำลายแล้ว · ' + r.code, 'success'), 220); }, 600);
}
/* ไม่อนุมัติ = กลับเป็นร่างเลขเดิม (DEC-08 · BR-DOA-03) · ยกเลิก = เหตุผลบังคับ */
function confirmReason(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (!(m.reason || '').trim()){ m.err = true; render(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    const why = m.reason.trim(), me = ME();
    if (m.kind === 'reject'){ r.returned = { note:why, by:me.name, at:nowIso() }; r.status = 'draft'; r.submittedAt = null; r.chain = resolveDoa(r.emp); pushAudit(r, 'ไม่อนุมัติ — กลับเป็นร่าง', why, 'bad'); }
    else { r.status = 'cancelled'; const c = curStep(r); if (c) c.status = 'skipped'; pushAudit(r, 'ยกเลิกเอกสาร', why, 'bad'); }
    S.busy = false; closeModal(); if (m.kind === 'reject' && S.dw && !canSee(r)) closeDrawer(true); render();
    setTimeout(() => showToast(m.kind === 'reject' ? 'ไม่อนุมัติ — ส่งกลับเป็นร่าง · ' + r.code : 'ยกเลิกเอกสารแล้ว · ' + r.code, m.kind === 'reject' ? 'warning' : 'info'), 220); }, 600);
}
