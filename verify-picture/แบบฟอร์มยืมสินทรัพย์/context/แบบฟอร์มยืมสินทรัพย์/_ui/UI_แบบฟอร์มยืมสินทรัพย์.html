/* ---------- wizard actions ---------- */
function goStep(n){ S.dw.step = n; render(); }
function setPurpose(v){ wf().purpose = v; dirty(); if (S.dw.err && v.trim()){ delete S.dw.err.purpose; const el = document.getElementById('fPurpose'); if (el) el.classList.remove('is-invalid'); } }
function setItem(i, k, v, soft){
  const f = wf(), x = f.items[i]; if (!x) return;
  x[k] = k === 'qty' ? Math.max(0, Math.floor(Number(v) || 0)) : v; dirty();
  if (k === 'dFrom' && v && (!x.dTo || x.dTo < v)) x.dTo = v;   /* วันที่ส่งคืนไม่ก่อนวันที่ยืม */
  if (S.dw.err && S.dw.err.items && S.dw.err.items[i]) delete S.dw.err.items[i][k];
  if (soft){ const el = document.querySelector(`[name="iq-${i}"]`); if (k === 'qty' && el && x.qty >= 1) el.classList.remove('is-bad');
    const s = document.getElementById('sumItems'); if (s) s.textContent = f.items.filter(y => y.asset).length + ' รายการ · รวม ' + fmtNumber(qtySum(f.items)) + ' ชิ้น'; return; }
  if (S.dw.err && S.dw.err.itemMsg) delete S.dw.err.itemMsg[i];
  render();
}
function addItem(){ const f = wf(), last = f.items[f.items.length - 1]; f.items.push(Object.assign(blankItem(), last ? { dFrom:last.dFrom, dTo:last.dTo } : {})); dirty(); render();
  requestAnimationFrame(() => { const el = document.querySelector('#ss-input-ia' + (f.items.length - 1)); if (el) el.focus(); }); }
function removeItem(i){ const f = wf(); if (f.items.length === 1) return; f.items.splice(i, 1); if (S.dw.err){ S.dw.err.items = {}; S.dw.err.itemMsg = {}; } dirty(); render(); }
/* DEC-04/12/13 + กติกาฟอร์ม: ทะเบียน · จำนวน ≥ 1 · วันที่ยืม/ส่งคืนครบ · ส่งคืน ≥ ยืม (บล็อก) · ทะเบียนซ้ำในใบ (บล็อก) */
function validateMain(){
  const f = wf(), err = { items:{}, itemMsg:{} };
  const add = (i, keys, msg) => { err.items[i] = Object.assign(err.items[i] || {}, keys); if (!err.itemMsg[i]) err.itemMsg[i] = msg; };
  if (!f.purpose.trim()) err.purpose = 1;
  f.items.forEach((x, i) => {
    const miss = [];
    if (!x.asset) miss.push('ทะเบียนสินทรัพย์'); if (!(x.qty >= 1)) miss.push('จำนวนที่ยืม'); if (!x.dFrom) miss.push('วันที่ยืม'); if (!x.dTo) miss.push('วันที่ส่งคืน');
    if (miss.length) add(i, { asset:!x.asset, qty:!(x.qty >= 1), dFrom:!x.dFrom, dTo:!x.dTo }, 'กรอกให้ครบ: ' + miss.join(' · '));
    if (x.dFrom && x.dTo && x.dTo < x.dFrom) add(i, { dTo:1 }, 'วันที่ส่งคืนต้องไม่ก่อนวันที่ยืม');
  });
  f.items.forEach((a, i) => f.items.forEach((b, j) => { if (j > i && a.asset && a.asset === b.asset) add(j, { asset:1 }, `ทะเบียนสินทรัพย์ซ้ำกับรายการที่ ${i + 1}`); }));
  Object.keys(err.items).forEach(i => Object.keys(err.items[i]).forEach(k => { if (!err.items[i][k]) delete err.items[i][k]; }));
  const ok = !err.purpose && !Object.keys(err.itemMsg).length;
  S.dw.err = ok ? null : err; return ok;
}
function wizNext(){
  if (S.dw.step === 1 && !validateMain()){ render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.dw.step += 1; render();
}
function wizBack(){ S.dw.step = Math.max(1, S.dw.step - 1); render(); }
function pickFiles(inp){ const f = wf(); gateFiles(Array.from(inp.files || [])).forEach(x => f.files.push({ name:x.name, size:fmtSize(x.size) })); inp.value = ''; dirty(); render(); }
function removeFile(i){ wf().files.splice(i, 1); dirty(); render(); }
/* บันทึก = ENG-DOC-NUM.next() ออกเลขที่ (ครั้งแรก · DEC-10) · ข้อมูลผู้ยืม snapshot ลงเอกสาร */
function persist(){
  const f = wf(), me = ME(), t = nowIso();
  let r = S.dw.editId ? findR(S.dw.editId) : null;
  if (!r){
    SEQ += 1;
    r = { id:'R' + SEQ, code:DOC.prefix + '-2569-' + String(SEQ).padStart(4, '0'), status:'draft', emp:S.me, pos:me.pos, dept:me.dept, reqDate:TODAY, lastReject:null, ret:null,
      chain:resolveDoa(S.me), doa_entry_ref:MOCK_DOA_RESOLVED.doa_entry_ref, attachments:[], audit:[{ act:'สร้างเอกสาร', by:me.name, at:t, tone:'' }], createdBy:me.name, createdAt:t };
    RECS.unshift(r);
  } else r.audit.push({ act:'แก้ไขร่าง', by:me.name, at:t, tone:'' });
  Object.assign(r, { purpose:f.purpose.trim(), items:f.items.map(x => Object.assign({}, x, { qtyLent:null })), attachments:f.files.slice(), copyOf:f.copyOf, updatedBy:me.name, updatedAt:t });
  return r;
}
function saveDraft(){ if (S.busy) return; if (!validateMain()){ S.dw.step = 1; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const r = persist(); S.busy = false; closeDrawer(true); setTimeout(() => showToast('บันทึกร่างแล้ว · ' + r.code, 'info'), 300); }, 500); }
function saveAndSubmit(){ if (S.busy) return; if (!validateMain()){ S.dw.step = 1; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const r = persist(); S.busy = false; closeDrawer(true); setTimeout(() => openSubmit(r.id), 300); }, 500); }

/* =====================================================================
   MODALS — ส่งอนุมัติ (DOA slot picker) · ให้ยืม (จำนวนที่ให้ยืม) · ไม่ให้ยืม · ยกเลิก · บันทึกรับคืน · ทิ้งการแก้ไข

function modalShell(icon, tone, title, sub, body, foot){
  return `<div class="modal-header"><div class="modal-header-icon ${tone}"><i data-lucide="${icon}" class="w-4 h-4"></i></div><div><h3 class="modal-title">${title}</h3><p class="modal-subtitle">${sub}</p></div></div>
    ${body ? `<div class="modal-body">${body}</div>` : ''}<div class="modal-footer">${foot}</div>`;
}
const busyLabel = (icon, label) => S.busy ? '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>' : `<i data-lucide="${icon}" class="w-4 h-4"></i><span>${label}</span>`;
function presetChips(list, cur){ return `<div class="chip-row">${list.map(p => `<button type="button" class="chip ${cur === p ? 'is-on' : ''}" onclick="setReasonPreset(this.dataset.v)" data-v="${esc(p)}">${esc(p)}</button>`).join('')}</div>`; }
function lentTable(r, m){
  return `<div class="table-wrap aln-items-view"><table class="table"><thead><tr><th class="c">ลำดับ</th><th>รายการ</th><th>ทะเบียนสินทรัพย์</th><th class="r">จำนวนที่ยืม</th><th class="r">จำนวนที่ให้ยืม</th></tr></thead><tbody>
    ${r.items.map((x, i) => `<tr><td class="c num">${i + 1}</td><td class="nw cell-ellipsis">${esc(assetOf(x.asset).name)}</td><td class="nw mono">${esc(x.asset)}</td><td class="r num">${fmtNumber(x.qty)}</td>
      <td class="r"><input class="input num in-sm ${m.err && m.err[i] ? 'is-bad' : ''}" type="number" min="1" max="${x.qty}" step="1" name="lent-${i}" value="${m.lent[i]}" aria-label="จำนวนที่ให้ยืม" oninput="setLent(${i}, this.value)"></td></tr>`).join('')}
    </tbody></table></div>`;
}
function renderModal(){
  const m = S.md; if (!m) return '';
  const r = m.id ? findR(m.id) : null;
  if (m.kind === 'submit'){
    return modalShell('send', 'is-primary', 'ส่งอนุมัติ?', `${r.code} · ${r.items.length} รายการ · ${rangeText(r.items)}`,
      `${resolveDoa(r.emp).map((c, i) => `<div class="slot-row"><span class="slot-no num">${c.step}</span><span class="slot-role">${esc(c.role)}</span><div class="field ${m.err && !m.slots[i] ? 'is-invalid' : ''}" id="fSlot${i}">${searchSelectHTML('slot' + i, { placeholder:'เลือกผู้พิจารณา' })}<div class="field-error">กรุณาเลือกผู้พิจารณา</div>${i === 0 ? '<div class="slot-help">ค่าเริ่มต้นจากสายอนุมัติ (DOA) และผังองค์กร</div>' : ''}</div></div>`).join('')}
       <div class="drawer-fields mt-3">${kv('เพื่อใช้', esc(r.purpose))}${kv('รวมจำนวนที่ยืม', fmtNumber(qtySum(r.items)))}</div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="btnSubmit" onclick="confirmSubmit()" ${S.busy ? 'disabled' : ''}>${busyLabel('send', 'ส่งอนุมัติ')}</button>`);
  }
  if (m.kind === 'approve'){
    const w = wordsOf((curStep(r) || r.chain[0] || {}).role_id), bad = m.err && Object.keys(m.err).length;
    return modalShell('check-circle-2', 'is-success', `${w[0]}ตามคำขอนี้?`, `${r.code} · ${esc(empOf(r.emp).name)} · ${rangeText(r.items)}`,
      `<div class="step-hint">กรอกจำนวนที่ให้ยืมจริง — ไม่เกินจำนวนที่ยืม และอย่างน้อย 1</div>${lentTable(r, m)}
       ${bad ? '<div class="field-error is-show">จำนวนที่ให้ยืมต้องอยู่ระหว่าง 1 ถึงจำนวนที่ยืม</div>' : ''}
       <div class="field mt-3"><label class="field-label">ความเห็น</label><textarea class="input" name="apNote" rows="2" placeholder="ไม่บังคับ" oninput="S.md.note=this.value">${esc(m.note || '')}</textarea></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-success" id="btnApprove" onclick="confirmApprove()" ${S.busy ? 'disabled' : ''}>${busyLabel('check', w[0])}</button>`);
  }
  if (m.kind === 'return'){
    return modalShell('package-check', 'is-primary', 'บันทึกรับคืน?', `${r.code} · ${esc(empOf(r.emp).name)} · ${r.items.length} รายการ`,
      `<div class="alert-row"><i data-lucide="check-circle-2" class="w-4 h-4"></i><div>ได้รับสินทรัพย์ตามรายการข้างต้นคืนในสภาพที่ใช้งานได้ปกติเรียบร้อย ครบถ้วน</div></div>
       ${itemsTable(r.items)}
       <div class="drawer-fields mt-3">${kv('ผู้ส่งคืน', empChip(r.emp))}${kv('ผู้รับคืน', empChip(S.me))}</div>
       <div class="field mt-3 ${m.err ? 'is-invalid' : ''}" id="fRetDate"><label class="field-label">วันที่รับคืน<span class="req">*</span></label>${bedateHTML('retDate', m.date, { min:r.items.map(x => x.dFrom).sort()[0], max:TODAY, today:TODAY, onPick:'setRetDate' })}<div class="field-error">กรุณาเลือกวันที่รับคืน</div></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="btnReturn" onclick="confirmReturn()" ${S.busy ? 'disabled' : ''}>${busyLabel('package-check', 'บันทึกรับคืน')}</button>`);
  }
  if (m.kind === 'reject' || m.kind === 'cancel'){
    const rej = m.kind === 'reject', w = rej ? wordsOf((curStep(r) || r.chain[0] || {}).role_id) : null;
    return modalShell('x-circle', 'is-danger', rej ? `${w[1]}ตามคำขอนี้?` : 'ยกเลิกเอกสาร?', `${r.code} · ${esc(empOf(r.emp).name)}${rej ? ' · เอกสารจะกลับเป็นร่างให้ผู้ยืมแก้แล้วส่งใหม่' : ''}`,
      `${presetChips(rej ? REJECT_PRESETS : CANCEL_PRESETS, m.preset)}
       <div class="field ${m.err ? 'is-invalid' : ''}" id="fReason"><label class="field-label">เหตุผล<span class="req">*</span></label><textarea class="input" name="reason" rows="3" placeholder="${rej ? 'แจ้งผู้ยืมว่าเพราะอะไร' : 'เหตุผลที่ยกเลิก'}" oninput="S.md.reason=this.value; if(this.value.trim()) document.getElementById('fReason').classList.remove('is-invalid')">${esc(m.reason || '')}</textarea><div class="field-error">กรุณาระบุเหตุผล</div></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">${rej ? 'ยกเลิก' : 'ไม่ยกเลิก'}</button><button class="btn btn-danger" id="btnReason" onclick="confirmReason()" ${S.busy ? 'disabled' : ''}>${busyLabel('x-circle', rej ? w[1] : 'ยกเลิกเอกสาร')}</button>`);
  }
  if (m.kind === 'discard'){
    return modalShell('alert-triangle', 'is-warning', 'ทิ้งข้อมูลที่กรอกไว้?', 'ข้อมูลในแบบฟอร์มนี้ยังไม่ได้บันทึก', '',
      `<button class="btn btn-ghost" onclick="closeModal()">กลับไปกรอกต่อ</button><button class="btn btn-danger" id="btnDiscard" onclick="closeModal(); closeDrawer(true)">ทิ้งข้อมูล</button>`);
  }
  return '';
}
function openModalCfg(cfg){ S.md = cfg; state.modal.open = true; render(); requestAnimationFrame(() => document.getElementById('modalBackdrop').classList.add('is-open')); }

/* U25 — ปิดด้วย mousedown ที่ backdrop เท่านั้น · มีข้อความค้าง = ไม่ปิด */
function modalBackdropClick(){ if (S.md && (S.md.reason || S.md.note)) return; closeModal(); }
