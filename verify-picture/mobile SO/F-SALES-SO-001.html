<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sales Order · Mobile prototype</title><style>:root{color-scheme:light;--page:#fff;--card:#f5f5f5;--input:#ebebeb;--text:#111;--muted:#666;--border:#e5e5e5;--cta:#e0281d;--success:#167446;--successbg:#e7f1e9;--warn:#a86400;--warnbg:#fff0d9;--info:#2563c9;--infobg:#e8f0fc;--danger:#c52620;--dangerbg:#fff0ed}body.dark{color-scheme:dark;--page:#0e0e0f;--card:#171719;--input:#222225;--text:#f8f7f4;--muted:#b3b0a9;--border:#343438;--success:#77d7a0;--successbg:#152b20;--warn:#ffc266;--warnbg:#382818;--info:#8db8ff;--infobg:#17243a;--danger:#ff776d;--dangerbg:#342020}[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:15px/1.5 'Noto Sans Thai',system-ui,sans-serif}main{max-width:440px;margin:auto;padding:20px 20px 120px}header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0}h1{font-size:24px;line-height:34px;margin:4px 0 16px}h2{font-size:18px;line-height:26px}h3{font-size:15px}p{overflow-wrap:anywhere}.eyebrow{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:600}.muted,small{color:var(--muted);font-size:12px}.card{padding:16px;background:var(--card);border:1px solid var(--border);border-radius:12px;margin:8px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.stack{display:grid;gap:8px}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;min-height:44px;padding:10px 16px;border:1px solid var(--border);background:var(--card);border-radius:999px;white-space:normal}button.primary{color:#fff;background:var(--cta);border-color:var(--cta);min-height:48px;font-weight:600;width:100%}button:disabled{cursor:default;opacity:.6}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--cta);outline-offset:3px}input,select,textarea{min-height:48px;width:100%;border:1px solid var(--border);border-radius:12px;background:var(--input);padding:12px}input[type=checkbox]{width:24px;min-height:24px;vertical-align:middle}label{display:block;margin:12px 0;font-size:13px}label span{display:block;margin-bottom:4px}.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;background:var(--infobg);color:var(--info)}.notice{padding:12px;border-radius:12px;background:var(--warnbg);color:var(--warn);margin:12px 0}.error{background:var(--dangerbg);color:var(--danger)}.success{background:var(--successbg);color:var(--success)}footer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,440px);padding:12px 20px 20px;background:var(--page);border-top:1px solid var(--border)}nav{display:flex;gap:8px;flex-wrap:wrap}.money{font-variant-numeric:tabular-nums;font-weight:600}#message:empty{display:none}.source{margin:24px 0 8px;font-size:12px;color:var(--muted)}.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kv span:nth-child(even){text-align:right}.hidden{display:none!important}@media print{header,footer,nav,#lab{display:none}main{max-width:none;padding:0}.card{break-inside:avoid}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}</style><body><main><header><span class="eyebrow">CUBE / SALES</span><button id="theme" aria-pressed="false">Dark mode</button></header><div id="lab" class="card"><label><span>Preview state</span><select id="preview"><option value="normal">Normal</option><option>loading</option><option>empty</option><option>error</option><option>offline</option><option>forbidden</option></select></label><label><span>Fixture actor</span><select id="actor"><option value="sales">Sales officer</option><option value="manager">Sales manager</option><option value="bu">BU Head</option></select></label><button id="reset">Reset sample</button></div><nav><button data-go="list">Orders</button><button data-go="detail">Order detail</button></nav><p id="message" role="status" aria-live="polite"></p><section id="view"></section><p class="source">Local sample data · Actions are simulated. No server order, stock, invoice, payment or accounting entry is created.</p></main><footer id="footer"></footer><script>
'use strict';
const state={screen:'list',preview:'normal',actor:'sales',step:0,round:[],order:{status:'draft',customer:'CUST-DEMO',delivery:'deliver',shipping:'active',billing:true,qty:30,price:100,atp:10,preorder:false,extra:0,extraType:'shipping',note:'',version:1,override:false,overrideReason:''}};
const view=document.querySelector('#view'),footer=document.querySelector('#footer');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'฿'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function total(){return Math.max(0,state.order.qty*state.order.price*1.07-state.order.extra)}
function issues(){const o=state.order,a=[];if(!o.billing)a.push('Billing address is missing. Save draft or select active billing.');if(o.delivery==='deliver'&&o.shipping!=='active')a.push('Select an active shipping address.');if(!o.preorder&&o.qty>o.atp)a.push('Ordinary stock is insufficient. Reduce quantity or choose Pre-order.');if(o.qty<=0)a.push('Quantity must be above zero.');if(o.extra<0||o.extra>o.qty*o.price*1.07)a.push('Extra discount exceeds remaining value or is negative.');if(o.extraType==='other'&&o.extra>0&&!o.note.trim())a.push('Enter a note for the other discount.');if(o.override&&!o.overrideReason.trim())a.push('Enter the price override reason.');return a}
function say(s,kind='notice'){const m=document.querySelector('#message');m.className=kind;m.textContent=s}
function go(s){state.screen=s;state.preview='normal';document.querySelector('#preview').value='normal';say('');render();window.scrollTo(0,0)}
function button(label,action,disabled=false){const b=document.createElement('button');b.textContent=label;b.className='primary';b.disabled=disabled;b.onclick=action;footer.appendChild(b)}
function render(){footer.replaceChildren();const o=state.order;if(state.preview!=='normal'){view.innerHTML='<h1>'+esc(state.screen)+'</h1><div class="notice" role="status">'+({loading:'Loading sample preview…',empty:'No sample records. Create an order or clear filters.',error:'Sample service unavailable. Retry keeps entered data.',offline:'Offline preview. Server actions are disabled; no offline queue.',forbidden:'This actor does not have access to this sample view.'}[state.preview])+'</div>';button(state.preview==='error'?'Retry sample':'Return to sample',()=>{state.preview='normal';document.querySelector('#preview').value='normal';render()},state.preview==='loading');return}
if(state.screen==='list'){view.innerHTML='<p class="eyebrow">P-01 / ORDERS</p><h1>Sales orders</h1><label><span>Search orders</span><input id="search" type="search" placeholder="Number or customer"></label><div id="orders"><article class="card"><div class="row"><b>SO-DEMO-001</b><span class="pill">'+esc(o.status)+'</span></div><p>Sample trading customer</p><div class="row"><span>Delivery / billing / payment: none</span><span class="money">'+money(total())+'</span></div><p class="muted">'+(o.preorder?'Pre-order · Awaiting arrival':'Ordinary goods · ATP '+o.atp)+'</p><button id="open">Open sample order</button></article></div>';document.querySelector('#search').oninput=e=>{const match=('so-demo-001 sample trading customer').includes(e.target.value.toLowerCase());document.querySelector('#orders').hidden=!match;say(match?'':'No matching sample orders. Clear search to recover.')};document.querySelector('#open').onclick=()=>go('detail');button('Create sample draft',()=>{if(o.status!=='draft'){say('Reset sample to create another draft.');return}state.step=0;go('entry')});}
else if(state.screen==='entry'){const titles=['Source','Main details','Lines and adjustments','Attachments','Review'];view.innerHTML='<p class="eyebrow">ENTRY / STEP '+(state.step+1)+' OF 5</p><h1>'+titles[state.step]+'</h1><button id="back">Back</button><div id="step"></div>';document.querySelector('#back').onclick=()=>state.step>0?(state.step--,render()):go('list');const s=document.querySelector('#step');if(state.step===0){s.innerHTML='<div class="card"><h2>New order</h2><p>Sample customer and order-date pricing.</p><p class="muted">Quotation conversion is specified in the brief; this prototype does not simulate source eligibility or repricing engines.</p></div>';}
if(state.step===1){s.innerHTML='<label><span>Customer</span><select id="customer"><option value="CUST-DEMO">Sample trading customer</option><option value="NO-BILLING">Sample without billing</option></select></label><div class="card"><b>Billing address</b><p id="bill"></p></div><label><span>Delivery method</span><select id="delivery"><option value="deliver">Deliver</option><option value="pickup">Pickup · ลูกค้ามารับเอง</option></select></label><label id="ship-wrap"><span>Shipping address</span><select id="ship"><option value="active">Default active warehouse</option><option value="archived">Archived sample warehouse</option><option value="">No selection</option></select></label>';document.querySelector('#customer').value=o.customer;document.querySelector('#delivery').value=o.delivery;document.querySelector('#ship').value=o.shipping;const sync=()=>{document.querySelector('#bill').textContent=o.billing?'Sample headquarters · synthetic address':'No billing address. Draft allowed; submission blocked.';document.querySelector('#ship-wrap').hidden=o.delivery==='pickup'};sync();document.querySelector('#customer').onchange=e=>{o.customer=e.target.value;o.billing=o.customer!=='NO-BILLING';o.shipping='active';document.querySelector('#ship').value='active';sync()};document.querySelector('#delivery').onchange=e=>{o.delivery=e.target.value;o.shipping=o.delivery==='pickup'?null:'active';document.querySelector('#ship').value=o.shipping||'';sync()};document.querySelector('#ship').onchange=e=>o.shipping=e.target.value;}
if(state.step===2){s.innerHTML='<article class="card"><h2>Sample goods</h2><p>System price '+money(o.price)+' · VAT added 7% · ATP '+o.atp+'</p><label><span>Quantity</span><input id="qty" inputmode="decimal" type="number" min="1" value="'+o.qty+'"></label><label><input id="preorder" type="checkbox" '+(o.preorder?'checked':'')+'> Pre-order</label><p class="muted">Pre-order skips immediate ATP/reservation. Full prepayment is advisory in the candidate policy.</p></article><article class="card"><h2>Extra discount</h2><label><span>Type</span><select id="xtype"><option value="shipping">Shipping · ส่วนลดค่าขนส่ง</option><option value="other">Other · ส่วนลดอื่น</option></select></label><label><span>Amount (THB; zero means no row)</span><input id="extra" type="number" min="0" value="'+o.extra+'"></label><label><span>Note (required for other discount)</span><textarea id="note">'+esc(o.note)+'</textarea></label></article><div id="calc" class="card"></div>';document.querySelector('#xtype').value=o.extraType;const calc=()=>document.querySelector('#calc').innerHTML='<div class="row"><span>Net total</span><b class="money">'+money(total())+'</b></div><p class="muted">Fixture arithmetic; after-VAT deduction is an unapproved accounting default.</p>';calc();document.querySelector('#qty').oninput=e=>{o.qty=Number(e.target.value);calc()};document.querySelector('#extra').oninput=e=>{o.extra=Number(e.target.value);calc()};document.querySelector('#preorder').onchange=e=>{o.preorder=e.target.checked;calc()};document.querySelector('#xtype').onchange=e=>o.extraType=e.target.value;document.querySelector('#note').oninput=e=>o.note=e.target.value;}
if(state.step===3)s.innerHTML='<div class="card"><h2>No sample attachments</h2><p>File transfer is not implemented in this prototype. Required multipart contract and failure behavior are specified in the package.</p></div>';
if(state.step===4){const is=issues();s.innerHTML='<div class="card"><h2>Review consequences</h2><p>Submit freezes the approval chain and candidate address snapshot. Final approval commits eligible stock and credit in the real system.</p><p>'+esc(o.delivery)+' · '+(o.preorder?'Pre-order':'Ordinary goods')+' · '+money(total())+'</p><p>Candidate approvers: Manager → BU Head. Submitter is excluded.</p></div>'+(is.length?'<div class="notice error">'+is.map(esc).join('<br>')+'</div>':'<div class="notice success">Sample prerequisites satisfied.</div>')+'<button id="save">Save sample draft</button>';document.querySelector('#save').onclick=()=>{o.version++;say('Draft saved in local sample memory only.');};button('Submit sample for approval',()=>{o.status='pending_approval';state.round=[{actor:'manager',status:'pending'},{actor:'bu',status:'pending'}];go('detail');say('Simulated submission. Choose the current fixture approver to continue.');},is.length>0);return}
button(state.step===3?'Review sample order':'Continue',()=>{if(state.step===2){const lineIssues=issues().filter(s=>!s.includes('address'));if(lineIssues.length){say(lineIssues.join(' '),'notice error');return}}state.step++;say('');render();window.scrollTo(0,0)});}
else if(state.screen==='detail'){view.innerHTML='<p class="eyebrow">P-06 / ORDER DETAIL</p><h1>SO-DEMO-001</h1><span class="pill">'+esc(o.status)+'</span><article class="card"><h2>Sample trading customer</h2><p>'+esc(o.delivery==='pickup'?'Pickup · No shipping address':o.shipping==='active'?'Default active warehouse':'Shipping selection needs attention')+'</p><p class="money">'+money(total())+'</p><p>'+(o.preorder?'Pre-order: reserved 0; outstanding '+o.qty:'Ordinary required '+o.qty)+'</p></article><nav><button id="approval">Approval</button><button id="pdf">PDF preview</button><button id="stock">Stock / Finance</button><button id="edit" '+(o.status!=='draft'?'disabled':'')+'>Edit draft</button></nav><div class="card"><h2>Three independent axes</h2><p>Delivery: none · Invoice: none · Payment: none</p><p class="muted">Downstream document execution is not simulated here; no invoice/payment exists.</p></div>';document.querySelector('#approval').onclick=()=>go('approval');document.querySelector('#pdf').onclick=()=>go('pdf');document.querySelector('#stock').onclick=()=>say('Fixture stock: '+(o.preorder?'Pre-order reserves zero at confirmation; await arrival.':'ordinary ATP '+o.atp)+'. Finance/dispatch remain in owning modules.');document.querySelector('#edit').onclick=()=>{state.step=1;go('entry')};button(o.status==='draft'?'Review sample draft':'Open approval timeline',()=>{if(o.status==='draft'){state.step=4;go('entry')}else go('approval')});}
else if(state.screen==='approval'){const current=state.round.find(s=>s.status==='pending'),can=o.status==='pending_approval'&&current&&state.actor===current.actor;view.innerHTML='<p class="eyebrow">P-07 / APPROVAL</p><h1>Review decision</h1><div class="card"><p>'+esc(o.status)+' · '+money(total())+'</p>'+state.round.map((s,i)=>'<p>Step '+(i+1)+' · '+esc(s.actor)+' · '+esc(s.status)+'</p>').join('')+'</div><div class="notice">Final sample approval simulates confirmation only. No real stock or credit operation occurs.</div><label><span>Rejection reason</span><textarea id="reject-reason"></textarea></label><button id="reject" '+(!can?'disabled':'')+'>Reject sample</button>'+(!can?'<p class="muted">Only the selected current approver can act; the sales submitter cannot self-approve.</p>':'');document.querySelector('#reject').onclick=()=>{const r=document.querySelector('#reject-reason').value.trim();if(!r){say('Enter a rejection reason.','notice error');return}current.status='rejected';o.status='draft';go('detail');say('Simulated rejection; previous round remains in sample timeline.')};button('Approve current sample step',()=>{current.status='approved';if(state.round.every(s=>s.status==='approved'))o.status='confirmed';o.version++;render();say('Simulated approval recorded.');},!can);}
else if(state.screen==='pdf'){view.innerHTML='<p class="eyebrow">P-08 / PRINT CONCEPT</p><h1>ใบสั่งขาย</h1><div class="card"><h2>SO-DEMO-001 · '+esc(o.status)+'</h2><p>Sample trading customer · Synthetic billing headquarters</p><p>Ship: '+esc(o.delivery==='pickup'?'Pickup':o.shipping||'Not selected')+'</p><p>'+o.qty+' × sample goods '+(o.preorder?'· Pre-order':'')+'</p><p>Extra discount '+money(o.extra)+' '+esc(o.note)+'</p><p class="money">Net '+money(total())+'</p><p>Preparer · Manager · BU Head · Customer</p><p class="muted">Print concept only; production A4 pagination, amount in words and signature rendering require server PDF acceptance.</p></div>';button('Print sample concept',()=>window.print());}}
document.querySelector('#theme').onclick=e=>{const dark=document.body.classList.toggle('dark');e.currentTarget.setAttribute('aria-pressed',String(dark));e.currentTarget.textContent=dark?'Light mode':'Dark mode'};document.querySelector('#preview').onchange=e=>{state.preview=e.target.value;say('');render()};document.querySelector('#actor').onchange=e=>{state.actor=e.target.value;render()};document.querySelector('#reset').onclick=()=>location.reload();document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));window.addEventListener('keydown',e=>{if(e.key==='Escape'){say('Top-level sample view retained; no overlay is open.')}});render();
</script></body></html>
