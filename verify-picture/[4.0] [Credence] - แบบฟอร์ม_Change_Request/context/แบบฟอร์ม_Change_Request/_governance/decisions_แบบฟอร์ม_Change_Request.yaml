# unattended — AI-DEFAULT ทุกหมวด รอลูกค้ายืนยัน
# J005 · FM-ITS-07 แบบฟอร์ม Change Request · ตอบตาม 4_knowledge/governance/unattended-policy.md

# G1 ผลต่อระบบ — ฟอร์มไม่ได้เขียนว่าเปลี่ยนค่า/ส่งต่อ → ไม่เปลี่ยนค่า ไม่ส่งต่อ (การเปลี่ยนแปลงจริงทำนอกระบบโดยฝ่าย IT · ระบบเก็บคำขอ + ผลอนุมัติ)
config_changes: []
post_to: []

# G2 สายอนุมัติ — ช่องผู้อนุมัติบนกระดาษ 2 ช่อง (ตรวจสอบโดย · อนุมัติโดย) → dynamic 2 ขั้น ผู้บังคับบัญชาตรง → ผู้จัดการฝ่าย IT (role ตามหน้าที่ — ฟอร์มของฝ่าย IT) · ไม่มีวงเงิน
doa: { required: true, mode: dynamic, default_steps: ["role-line-manager", "role-mgr-it"], amount: none }

# G3 สูตร / ค่าคงที่ — ไม่มีสูตร/ค่าคงที่บนกระดาษ · กติกาตรวจ
calc:
  constants_from_config: true
  auto_compute: true
  over_limit: warn
  rules: ["วันที่ต้องการส่งมอบ ต้องไม่ก่อนวันที่ขอ (เตือน)", "ประเภทของการเปลี่ยนแปลง เลือกอย่างน้อย 1 ข้อ เลือกได้หลายข้อ (บล็อก)", "ติ๊กประเภท อื่นๆ ต้องระบุข้อความ (บล็อก)"]

# G4 รายการซ้ำ — ไม่มีบนกระดาษ
repeat: { max_rows: null }

# G5 ช่องตามกระดาษ — 1:1 · แก้คำสะกด ตําแหน่ง→ตำแหน่ง · ป้าย ผู้ขอซื้อ คงคำ (OQ ลูกค้า)
fidelity: { one_to_one: true, add_fields: [], merge_split: [] }

# G6 ลายเซ็น — แถวล่าง: ผู้ขอซื้อ (ผู้ส่ง) + 1 ช่องต่อขั้น DOA (ตรวจสอบโดย · อนุมัติโดย) · ข้อความ "พิจารณาในระบบ" ไม่ใช้ภาพ
signature: { layout: row-bottom, per_doa_step: true, handwriting_image: false }

# G7 ไม่อนุมัติ → กลับเป็นร่างเลขเดิม · ยกเลิกได้ เจ้าของ + admin role · ร่าง/รออนุมัติ · เหตุผลบังคับ
reject_cancel: { on_reject: draft, cancel_by: [owner, admin_role], cancel_states: [draft, pending], reason_required: true }

# G8 การมองเห็น — เจ้าของ · ผู้อนุมัติหลังส่ง · admin role ของหน่วยงานเจ้าของเอกสาร (ฝ่าย IT) เห็นทั้งหมด
visibility: { owner: true, approver: after_submit, admin_role: all }

# G9 เลขที่ — ออกตอนบันทึกครั้งแรก (เอกสารภายใน) · รหัส ITCR (IT Change Request — CRR/ITRS/SRC/DRITS/ACL ใช้แล้ว)
numbering: { issue_on: first_save, code: ITCR }

# G10 ของเสริม — แนบ ✓ (แผน/เอกสารประกอบ) CSV ✓ ทำซ้ำ ✗ ประกาศ ✗
extras: { attachments: true, copy: false, export_csv: true, announce: false }

extend: {}
fit: {}
