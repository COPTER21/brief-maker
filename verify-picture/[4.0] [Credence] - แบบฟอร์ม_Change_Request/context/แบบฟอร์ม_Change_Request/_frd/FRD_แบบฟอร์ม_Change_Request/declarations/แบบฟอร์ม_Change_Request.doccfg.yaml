# doccfg-declaration v2.1 — init จาก DECISIONS.lock + print_config · แก้ได้ก่อน brief
feature_id: F-TMP-005
doc_types:
- code: ITCR
  name_th: แบบฟอร์ม Change Request
  module: IT
  feature_id: F-TMP-005
  numbering:
    preset: '{PREFIX}-{YYYY}-{run:4}'
    reset: yearly
    scope: global
    no_gap: false
    issue_on: first_save
    frd_ref: 03_LOGIC F-TMP-005-FN-02
  snapshot:
    sent_external: false
    approved_final: true
  snapshot_points:
  - event: approved_final
    frd_ref: 03_LOGIC F-TMP-005-FN-04
  print_config:
    form_code: FM-ITS-07
    revision: 'Rev.00 : 01/07/2569'
    paper: A4-portrait
    min_rows: 1
    dense_when_rows_over: 6
    header_source: organization_snapshot_at_numbering
    sign_boxes:
    - box: requester
      label: ผู้ขอซื้อ
      show_date: true
      note: คำตามกระดาษ (G5) — OQ ลูกค้า
    - box: doa_step:*
      label: from_doa_step
      show_decision: true
      show_date: true
    decision_words:
      default:
        approve: อนุมัติ
        reject: ไม่อนุมัติ
      by_role: {}
    sign_layout:
      source: approval_chain snapshot (ผู้ขอซื้อ + จำนวนขั้นตามที่ตั้งใน DOA)
      max_per_row: 4
      split: even
      dense_when_steps_over: 4
      keep_together: true
    ref: print/print_config.json
