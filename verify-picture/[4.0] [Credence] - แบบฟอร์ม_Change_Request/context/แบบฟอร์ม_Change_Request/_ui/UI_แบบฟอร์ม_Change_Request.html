/* ---------- row menu (⋮ เท่านั้น — U5) ---------- */
function openRowMenu(id, btn){
  closeRowMenu();
  const r = findR(id), items = [['file-text', 'ดูรายละเอียด', `openView('${id}')`], ['printer', 'พิมพ์', `genPdf('${id}', true)`]];
  if (isOwner(r) && r.status === 'draft') items.splice(1, 0, ['pencil', 'แก้ไข', `startWizard('${id}')`]);
  if (canCancel(r)) items.push(['x-circle', 'ยกเลิกเอกสาร', `openCancel('${id}')`, 1]);
  const m = document.createElement('div'); m.className = 'row-menu';
  m.innerHTML = items.map(x => `<button type="button" class="rm-item ${x[3] ? 'is-danger' : ''}" onclick="closeRowMenu(); ${x[2]}"><i data-rmic="${x[0]}" class="w-4 h-4"></i><span>${x[1]}</span></button>`).join('');
  document.getElementById('overlay-root').appendChild(m);
  const b = btn.getBoundingClientRect(), h = items.length * 36 + 8, below = window.innerHeight - b.bottom > h + 8;
  m.style.setProperty('--top', (below ? b.bottom + 4 : b.top - h - 4) + 'px'); m.style.setProperty('--left', Math.max(8, b.right - 200) + 'px');
  /* render เฉพาะไอคอนในเมนู — ไม่ให้ svg ใต้เมาส์ถูกแทนแล้วคลิกทะลุไปเปิดแถว */
  if (window.lucide && typeof window.lucide.createIcons === 'function'){ window.lucide.createIcons({ nameAttr:'data-rmic' }); m.querySelectorAll('svg[data-rmic]').forEach(x => x.removeAttribute('data-rmic')); }
}
function closeRowMenu(){ const m = document.querySelector('.row-menu'); if (m) m.remove(); }
function rowClick(ev, id){ if (ev.target.closest('.row-actions-cell')) return; openView(id); }
document.addEventListener('click', e => { if (!e.target.closest('.row-menu') && !e.target.closest('.row-actions-cell')) closeRowMenu(); });
window.addEventListener('scroll', closeRowMenu, true);

ex-wrap:wrap; gap:4px 18px; }\n.cb{ font-size:var(--form-cb-fs); line-height:1; }\n.form-check .fill--s{ min-width:10mm; } .form-check .fill--m{ min-width:22mm; }\n.form-box{ margin-top:var(--form-row-gap); padding:6px 8px; border:1px solid var(--form-dot); min-height:18mm; }\n.form-section{ margin-top:var(--form-para-gap); font-weight:700; }\n/* รายการซ้ำยาว (> min_rows) → ระยะกระชับให้จบหน้าเดียวได้นานที่สุด (data.layout.dense) */\n.form.form--dense .form-row{ margin-top:var(--form-row-gap-dense); }\n.form.form--dense .form-row--indent{ margin-top:calc(var(--form-row-gap-dense) * 3); }\n.form.form--dense .form-check{ margin-top:calc(var(--form-row-gap-dense) * 2); }\n.form.form--dense .form-p{ margin-top:var(--form-para-gap-dense); }\n\n/* R9 · ตารางกรอบ (grid form) — ฟอร์มที่กระดาษเป็นตารางเส้นทึบ (เช่น FM-FIN-02) · v2.1 */\n.form-grid{ width:100%; border-collapse:collapse; table-layout:fixed; margin-top:var(--form-grid-gap); }\n.form-grid + .form-grid{ border-top:0; }\n.form-grid td, .form-grid th{ border:1px solid var(--form-grid-line); padding:2px var(--form-grid-pad); height:var(--form-grid-row-h); vertical-align:middle; text-align:left; font-weight:400; overflow:hidden; }\n.form-grid th{ background:var(--form-grid-head-bg); font-weight:700; text-align:center; }\n.form-grid .g-b{ font-weight:700; } .form-grid .g-r{ text-align:right; } .form-grid .g-c{ text-align:center; }\n.form-grid .g-v{ font-weight:500; } .form-grid .g-num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:500; }\n.form-grid .g-25{ width:25%; } .form-grid .g-50{ width:50%; } .form-grid .g-75{ width:75%; }\n.form-grid .g-tall{ height:calc(var(--form-grid-row-h) * 1.5); }\n.form-grid .g-u{ text-decoration:underline; font-weight:700; }\n.form.form--dense .form-grid td{ height:var(--form-grid-row-h-dense); }\n.form-note{ margin-top:var(--form-row-gap); } .form-note .b{ font-weight:700; }\n.form-grid--signs td{ text-align:center; vertical-align:top; }\n.form-grid td.g-blank{ border-top:0; border-left:0; }\n.form-grid tr.g-hrow td{ height:calc(var(--form-grid-row-h) * 1.4); }\n\n/* B6 rows · ช่องลงชื่อ dynamic ตาม DOA (v2.1) — data ส่ง sign_rows[].signs[] แถวละ ≤4 (sign_rows.py / tplSignRows)\n   ห่อด้วย .signs-block ทุกครั้ง = ทั้งก้อนไม่ถูกตัดข้ามหน้า · .doc-bottom.is-dense เมื่อขั้น DOA > 4 */\n.form-grid--signs + .form-grid--signs{ margin-top:0; border-top:0; }\n.form-grid--signs + .form-grid--signs td{ border-top:0; }\n.doc-bottom.is-dense .sign__line{ height:16px; }\n.doc-bottom.is-dense .form-grid--signs td{ padding-top:1px; padding-bottom:1px; }\n.doc-bottom.is-dense .sign__date, .doc-bottom.is-dense .sign__name{ font-size:7.2pt; }\n.signs-block{ break-inside:avoid; page-break-inside:avoid; }\n.signs-block .signs + .signs{ margin-top:4mm; }\n.doc-bottom.is-dense .signs-block .signs + .signs{ margin-top:2mm; }\n\n/* ===== R10 · เอกสารเกิน 1 หน้า (v2.2) — ออกแบบเป็น 2 หน้าแทนการบีบ ===== */\n.page-break{ break-before:page; page-break-before:always; }          /* ขึ้นหน้าใหม่ตรงจุดที่ตั้งใจ (ก่อนส่วนที่ 2 / ก่อนบล็อกลงชื่อ) */\n.keep-together{ break-inside:avoid; page-break-inside:avoid; }       /* กล่อง/ตารางย่อยไม่ถูกตัดกลาง */\n.form-grid thead, .items thead{ display:table-header-group; }        /* หัวตารางซ้ำทุกหน้า */\n.form-grid tr, .items tr{ break-inside:avoid; page-break-inside:avoid; }\n.cont-note{ text-align:right; font-size:7.5pt; color:var(--form-ink,#333); margin-top:2mm; }   /* \"มีต่อหน้าถัดไป\" ท้ายหน้า 1 */\n.page-no{ text-align:right; font-size:7.5pt; }                        /* \"หน้า 1/2\" ใน footer ทุกหน้า */\n\n:root{--form-fs:9.6pt; --form-title-fs:15pt; --form-logo-h:11mm; --form-logo-align:flex-start; --form-title-gap:4px; --form-grid-gap:6px; --form-cb-fs:11pt;}";

const PRINT_CFG = { text_min_rows:{ detail_lines:1, objective_lines:1, impact_lines:1, plan_lines:2 }, dense_when_rows_over:6, max_per_row:4, dense_when_steps_over:4, decision_words:{ default:{ approve:'อนุมัติ', reject:'ไม่อนุมัติ' }, by_role:{} } };
const BLANK_DATE = 'วันที่ ........./........./.........';
const TH_MONTH = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const thFull = iso => { if (!iso) return ''; const d = iso.slice(0, 10).split('-'); return Number(d[2]) + ' ' + TH_MONTH[Number(d[1]) - 1] + ' ' + (Number(d[0]) + 543); };
const tShort = iso => { if (!iso) return ''; const d = iso.slice(0, 10).split('-'); return Number(d[2]) + ' ' + ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][Number(d[1]) - 1] + ' ' + (Number(d[0]) + 543); };
const box = on => on ? '☑' : '☐';
function textLines(s, min){ const rows = String(s || '').split('\n').filter(t => t).map(t => ({ text:t })); while (rows.length < min) rows.push({ text:'' }); return rows; }
/* print data contract (= print/make_data.py) — ระบบจริง: backend สร้าง JSON นี้จาก record แล้ว render template เดียวกัน */
function docPrintData(r){
  const e = empOf(r.emp), mark = (label, iso) => iso ? `${label} ${tShort(iso)} ${iso.slice(11, 16)} น.` : '';
  const words = id => PRINT_CFG.decision_words.by_role[id] || PRINT_CFG.decision_words.default;
  const sent = r.status !== 'draft' && r.submittedAt;
  const signs = [{ role:'ผู้ขอซื้อ', name:e.name, position:r.pos, date:sent ? mark('ส่งในระบบ', r.submittedAt) : BLANK_DATE, decision:null }]
    .concat(r.chain.map(c => { const p = empOf(c.assignee), done = c.status === 'approved' || c.status === 'rejected', w = words(c.role_id);
      return { role:c.role, name:sent && c.assignee ? p.name : '', position:sent && c.assignee ? p.pos : '', date:done ? mark('พิจารณาในระบบ', c.at) : BLANK_DATE,
        decision:{ approve_box:box(c.status === 'approved'), reject_box:box(c.status === 'rejected'), approve_word:w.approve, reject_word:w.reject } }; }));
  const ct = {}; CTYPE.forEach(j => { ct[j[0]] = box(r.types.includes(j[0])); });
  const T = PRINT_CFG.text_min_rows, L = { detail_lines:textLines(r.detail, T.detail_lines), objective_lines:textLines(r.objective, T.objective_lines), impact_lines:textLines(r.impact, T.impact_lines), plan_lines:textLines(r.plan, T.plan_lines) };
  const extra = Object.keys(L).reduce((s, k) => s + L[k].length - T[k], 0);
  return {
    company:{ name:DOC.company, logo:CO_LOGO },
    doc:{ title:DOC_EN, no:r.code, is_draft:r.status === 'draft', form_code:DOC.form, revision:DOC.rev },
    req_date:thFull(r.reqDate), employee:{ name:e.name, position:r.pos },

function renderWizard(){

function clearErr(k){ if (S.dw.err) delete S.dw.err[k]; const el = document.getElementById('f-' + k); if (el) el.classList.remove('is-invalid'); }
function setF2(k, v){ const f = wf(); f[k] = v; dirty(); if (v.trim()) clearErr(k);

function toggleType(k, on){ const f = wf(); f.types = on ? f.types.concat([k]) : f.types.filter(x => x !== k); f.types.sort((a, b) => CTYPE.findIndex(j => j[0] === a) - CTYPE.findIndex(j => j[0] === b));

/* G3 (DEC-04/14/15/16): บังคับช่องตามกระดาษ · อื่นๆ ต้องระบุ · ประเภทการเปลี่ยนแปลง ≥1 · วันที่ส่งมอบก่อนวันที่ขอ = เตือน ไม่บล็อก */
function validateMain(){
  const f = wf(), err = {};
  if (!f.subject.trim()) err.subject = 'ระบุเรื่องที่ต้องการ';
  if (!f.types.length) err.types = 'เลือกประเภทของการเปลี่ยนแปลงอย่างน้อย 1 ข้อ';
  if (f.types.includes('other') && !f.other.trim()) err.other = 'ระบุประเภทอื่นๆ';
  if (!f.dueDate) err.dueDate = 'เลือกวันที่ต้องการส่งมอบ';
  if (!f.place.trim()) err.place = 'ระบุสถานที่ส่งมอบ';
  if (!f.detail.trim()) err.detail = 'ระบุรายละเอียดของการเปลี่ยนแปลง';
  if (!f.objective.trim()) err.objective = 'ระบุวัตถุประสงค์ของการเปลี่ยนแปลง';
  if (!f.impact.trim()) err.impact = 'ระบุระบบที่ได้รับผลกระทบและผลกระทบที่อาจเกิดขึ้น';
  if (!f.plan.trim()) err.plan = 'ระบุแผนการดำเนินการ';
  const ok = !Object.keys(err).length; S.dw.err = ok ? null : err; return ok;
}
function wizNext(){
  if (S.dw.step === 1 && !validateMain()){ render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.dw.step += 1; render();
}
function wizBack(){ S.dw.step = Math.max(1, S.dw.step - 1); render(); }
function pickFiles(inp){ const f = wf(); gateFiles(Array.from(inp.files || [])).forEach(x => f.files.push({ name:x.name, size:fmtSize(x.size) })); inp.value = ''; dirty(); render(); }
function removeFile(i){ wf().files.splice(i, 1); dirty(); render(); }
/* บันทึกครั้งแรก = ENG-DOC-NUM.next() ออกเลข ITCR (DEC-10) · ชื่อ/ตำแหน่ง snapshot ลงเอกสาร ณ วันที่ขอ */
function persist(){
  const f = wf(), me = ME(), t = nowIso();
  let r = S.dw.editId ? findR(S.dw.editId) : null;
  if (!r){
    SEQ += 1;
    r = { id:'R' + SEQ, code:DOC.prefix + '-2569-' + String(SEQ).padStart(4, '0'), status:'draft', emp:S.me, pos:me.pos, dept:me.dept, reqDate:TODAY, returned:null,
      chain:resolveDoa(S.me), doa_entry_ref:MOCK_DOA_RESOLVED.doa_entry_ref, attachments:[], audit:[{ act:'สร้างเอกสาร', by:me.name, at:t, tone:'' }], createdBy:me.name, createdAt:t };
    RECS.unshift(r);
  } else r.audit.push({ act:'แก้ไขร่าง', by:me.name, at:t, tone:'' });
  Object.assign(r, { subject:f.subject.trim(), types:f.types.slice(), other:f.types.includes('other') ? f.other.trim() : '', dueDate:f.dueDate, place:f.place.trim(),
    detail:f.detail.trim(), objective:f.objective.trim(), impact:f.impact.trim(), plan:f.plan.trim(), attachments:f.files.slice(), updatedBy:me.name, updatedAt:t });
  return r;
}
function saveDraft(){ if (S.busy) return; if (!validateMain()){ S.dw.step = 1; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const r = persist(); S.busy = false; closeDrawer(true); setTimeout(() => showToast('บันทึกร่างแล้ว · ' + r.code, 'info'), 300); }, 500); }
function saveAndSubmit(){ if (S.busy) return; if (!validateMain()){ S.dw.step = 1; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const r = persist(); S.busy = false; closeDrawer(true); setTimeout(() => openSubmit(r.id), 300); }, 500); }

/* =====================================================================
   MODALS — ส่งอนุมัติ (DOA slot ต่อขั้น #108) · อนุมัติ · ไม่อนุมัติ (กลับร่าง) · ยกเลิก · ทิ้งการแก้ไข
   ===================================================================== */
function modalShell(icon, tone, title, sub, body, foot){
  return `<div class="modal-header"><div class="modal-header-icon ${tone}"><i data-lucide="${icon}" class="w-4 h-4"></i></div><div><h3 class="modal-title">${title}</h3><p class="modal-subtitle">${sub}</p></div></div>
    ${body ? `<div class="modal-body">${body}</div>` : ''}<div class="modal-footer">${foot}</div>`;
}
const busyLabel = (icon, label) => S.busy ? '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>' : `<i data-lucide="${icon}" class="w-4 h-4"></i><span>${label}</span>`;
function presetChips(list, cur){ return `<div class="chip-row">${list.map(p => `<button type="button" class="chip ${cur === p ? 'is-on' : ''}" onclick="setReasonPreset(this.dataset.v)" data-v="${esc(p)}">${esc(p)}</button>`).join('')}</div>`; }
function renderModal(){
  const m = S.md; if (!m) return '';
  const r = m.id ? findR(m.id) : null;
  if (m.kind === 'submit'){
    return modalShell('send', 'is-primary', 'ส่งอนุมัติ?', `${r.code} · ${esc(r.subject)}`,
      `${resolveDoa(r.emp).map((c, i) => `<div class="slot-row"><span class="slot-no num">${c.step}</span><span class="slot-role">${c.role}</span><div class="field ${m.err && !m.slots[i] ? 'is-invalid' : ''}" id="fSlot${i}">${searchSelectHTML('slot' + i, { placeholder:'เลือกผู้พิจารณา' })}<div class="field-error">กรุณาเลือกผู้พิจารณา</div>${i === 0 ? '<div class="slot-help">ค่าเริ่มต้นจากสายอนุมัติและผังองค์กร</div>' : ''}</div></div>`).join('')}
       <div class="drawer-fields mt-3">${kv('ประเภทการเปลี่ยนแปลง', typePills(r))}${kv('วันที่ต้องการส่งมอบ', fmtD(r.dueDate))}</div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="btnSubmit" onclick="confirmSubmit()" ${S.busy ? 'disabled' : ''}>${busyLabel('send', 'ส่งอนุมัติ')}</button>`);
  }
  if (m.kind === 'approve'){
    return modalShell('check-circle-2', 'is-success', 'อนุมัติคำขอนี้?', `${r.code} · ${esc(empOf(r.emp).name)} · ${esc(r.subject)}`,
      `<div class="drawer-fields">${kv('ประเภทการเปลี่ยนแปลง', typePills(r))}${kv('วันที่ต้องการส่งมอบ', fmtD(r.dueDate))}</div>
       <div class="field mt-3"><label class="field-label">ความเห็น</label><textarea class="input" name="apNote" rows="2" placeholder="ไม่บังคับ" oninput="S.md.note=this.value">${esc(m.note || '')}</textarea></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-success" id="btnApprove" onclick="confirmApprove()" ${S.busy ? 'disabled' : ''}>${busyLabel('check', 'อนุมัติ')}</button>`);
  }
  if (m.kind === 'reject' || m.kind === 'cancel'){
    const rej = m.kind === 'reject';
    return modalShell('x-circle', 'is-danger', rej ? 'ไม่อนุมัติคำขอนี้?' : 'ยกเลิกเอกสาร?', `${r.code} · ${esc(empOf(r.emp).name)}${rej ? ' · เอกสารจะกลับเป็นร่างเลขเดิม ให้ผู้ขอแก้แล้วส่งใหม่' : ''}`,
      `${presetChips(rej ? REJECT_PRESETS : CANCEL_PRESETS, m.preset)}
       <div class="field ${m.err ? 'is-invalid' : ''}" id="fReason"><label class="field-label">เหตุผล<span class="req">*</span></label><textarea class="input" name="reason" rows="3" placeholder="${rej ? 'แจ้งผู้ขอว่าต้องแก้อะไร' : 'เหตุผลที่ยกเลิก'}" oninput="S.md.reason=this.value; if(this.value.trim()) document.getElementById('fReason').classList.remove('is-invalid')">${esc(m.reason || '')}</textarea><div class="field-error">กรุณาระบุเหตุผล</div></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">${rej ? 'ยกเลิก' : 'ไม่ยกเลิก'}</button><button class="btn btn-danger" id="btnReason" onclick="confirmReason()" ${S.busy ? 'disabled' : ''}>${busyLabel('x-circle', rej ? 'ไม่อนุมัติ' : 'ยกเลิกเอกสาร')}</button>`);
  }
  if (m.kind === 'discard'){
    return modalShell('alert-triangle', 'is-warning', 'ทิ้งข้อมูลที่กรอกไว้?', 'ข้อมูลในแบบฟอร์มนี้ยังไม่ได้บันทึก', '',
      `<button class="btn btn-ghost" onclick="closeModal()">กลับไปกรอกต่อ</button><button class="btn btn-danger" id="btnDiscard" onclick="closeModal(); closeDrawer(true)">ทิ้งข้อมูล</button>`);
  }
  return '';
}
function openModalCfg(cfg){ S.md = cfg; state.modal.open = true; render(); requestAnimationFrame(() => document.getElementById('modalBackdrop').classList.add('is-open')); }
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('is-open'); state.modal.open = false; setTimeout(() => { if (!state.modal.open) S.md = null; }, 200); }
/* backdrop ปิดด้วย mousedown ที่ backdrop เท่านั้น (#122 · U25) · กรอกเหตุผลค้างไว้ = ไม่ปิด */
function modalBackdropDown(ev){ if (ev.target !== ev.currentTarget) return; if (S.md && (S.md.reason || S.md.note)) return; closeModal(); }
function drawerBackdropDown(ev){ if (ev.target !== ev.currentTarget) return; closeDrawer(); }
function setReasonPreset(v){ S.md.preset = v; S.md.reason = v + (S.md.reason && S.md.reason.indexOf(v) !== 0 ? ' — ' + S.md.reason : ''); S.md.err = false; render(); }
function openSubmit(id){ const r = findR(id); if (!r || r.status !== 'draft') return; openModalCfg({ kind:'submit', id, slots:resolveDoa(r.emp).map(c => c.assignee) }); }
function openApprove(id){ openModalCfg({ kind:'approve', id, note:'' }); }
function openReject(id){ openModalCfg({ kind:'reject', id, reason:'' }); }
function openCancel(id){ closeRowMenu(); openModalCfg({ kind:'cancel', id, reason:'' }); }
function pushAudit(r, act, note, tone){ const me = ME(), t = nowIso(); r.audit.push({ act, by:me.name, at:t, note:note || '', tone:tone || '' }); r.updatedBy = me.name; r.updatedAt = t; }
/* ENG-NOTIFY (NTF_BRIEF_F-TMP-005): itcr_cancelled · itcr_approved_for_it — DOA engine เป็นเจ้าของ doa_pending/doa_result */
function confirmSubmit(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (m.slots.some(x => !x)){ m.err = true; render(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    r.chain = resolveDoa(r.emp).map((c, i) => Object.assign(c, { assignee:m.slots[i], status:i === 0 ? 'pending' : 'waiting' }));   /* BR-DOA-02 resolve ตอนส่งแล้ว freeze */
    r.status = 'pending'; r.submittedAt = nowIso(); r.returned = null; pushAudit(r, 'ส่งอนุมัติ', 'ถึง ' + empOf(m.slots[0]).name);
    S.busy = false; closeModal(); render(); setTimeout(() => showToast('ส่งอนุมัติแล้ว · ' + r.code, 'success'), 220); }, 600);
}
/* อนุมัติครบ: ไม่เปลี่ยนค่าในระบบ · ไม่ส่งต่อระบบอื่น (DEC-01/02) — แจ้งฝ่าย IT (itcr_approved_for_it) */
function confirmApprove(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    const c = curStep(r); c.status = 'approved'; c.at = nowIso(); c.note = (m.note || '').trim();
    const next = r.chain.find(x => x.status === 'waiting'); if (next) next.status = 'pending';   /* sequential */
    r.status = next ? 'pending' : 'approved'; pushAudit(r, next ? 'อนุมัติ (ขั้น ' + c.step + ')' : 'อนุมัติ', c.note, 'ok');
    S.busy = false; closeModal(); render(); setTimeout(() => showToast('อนุมัติแล้ว · ' + r.code, 'success'), 220); }, 600);
}
/* ไม่อนุมัติ = กลับเป็นร่างเลขเดิม (DEC-08 · BR-DOA-03) · ยกเลิก = เหตุผลบังคับ */
function confirmReason(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (!(m.reason || '').trim()){ m.err = true; render(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    const why = m.reason.trim(), me = ME();
    if (m.kind === 'reject'){ r.returned = { note:why, by:me.name, at:nowIso() }; r.status = 'draft'; r.submittedAt = null; r.chain = resolveDoa(r.emp); pushAudit(r, 'ไม่อนุมัติ — กลับเป็นร่าง', why, 'bad'); }
    else { r.status = 'cancelled'; const c = curStep(r); if (c) c.status = 'skipped'; pushAudit(r, 'ยกเลิกเอกสาร', why, 'bad'); }
    S.busy = false; closeModal(); if (m.kind === 'reject' && S.dw && !canSee(r)) closeDrawer(true); render();
    setTimeout(() => showToast(m.kind === 'reject' ? 'ไม่อนุมัติ — ส่งกลับเป็นร่าง · ' + r.code : 'ยกเลิกเอกสารแล้ว · ' + r.code, m.kind === 'reject' ? 'warning' : 'info'), 220); }, 600);
}

   RENDER + DRAWER

function render(){
  const snap = preserveRenderState();
  if (!S.booted){ S.booted = true; applyRoute(); }
  document.getElementById('page-content').innerHTML = renderPage();
  const dwEl = document.getElementById('drawer');
  if (S.dw){ const open = dwEl.classList.contains('is-open'); dwEl.className = S.dw.kind === 'wiz' ? 'drawer drawer-panel wide' : 'drawer drawer-panel'; dwEl.classList.toggle('is-open', open); dwEl.innerHTML = S.dw.kind === 'wiz' ? renderWizard() : renderViewDrawer(); }
  if (S.md){ const mEl = document.getElementById('modal'); mEl.className = 'modal' + (S.md.kind === 'submit' ? ' is-lg' : ''); mEl.innerHTML = renderModal(); }
  updateShell(); initSelects(); renderIcons(); restoreRenderState(snap);
}
function initSelects(){
  if (document.querySelector('#ss-fst')){
    const base = listBase();
    initSearchSelect('fst', { options: Object.keys(DOC_ST).map(k => ({ value:k, label:DOC_ST[k][0], sub:base.filter(r => r.status === k).length + ' รายการ', icon:'circle-dot' })), value:S.list.st === 'all' ? null : S.list.st, onSelect:v => setF('st', v || 'all') });
    initSearchSelect('fjt', { options: CTYPE.map(j => ({ value:j[0], label:j[1], sub:base.filter(r => r.types.includes(j[0])).length + ' รายการ', icon:'tag' })), value:S.list.jt === 'all' ? null : S.list.jt, onSelect:v => setF('jt', v || 'all') });
  }
  if (S.md && S.md.kind === 'submit' && document.querySelector('#ss-slot0')){
    const r = findR(S.md.id), m = S.md;   /* BR-DOA-04 ผู้ขออนุมัติใบตัวเองไม่ได้ */
    m.slots.forEach((v, i) => initSearchSelect('slot' + i, { options: EMP.filter(e => e.id !== r.emp).map(e => ({ value:e.id, label:e.name, sub:e.pos + ' · ' + e.dept, icon:'user' })), value:v,
      onSelect:x => { m.slots[i] = x; const f = document.querySelector('#fSlot' + i); if (f && x) f.classList.remove('is-invalid'); } }));
  }
}
function showDrawer(cfg, fromRoute){
  S.dw = cfg; state.drawer.open = true; render();
  requestAnimationFrame(() => { document.getElementById('drawerBackdrop').classList.add('is-open'); document.getElementById('drawer').classList.add('is-open'); });
  if (!fromRoute && cfg.kind === 'view') go('change-request/view/' + cfg.id);
}
function closeDrawer(force, fromRoute){
  if (!S.dw) return;
  if (!force && S.dw.kind === 'wiz' && S.dw.dirty){ openModalCfg({ kind:'discard' }); return; }
  document.getElementById('drawerBackdrop').classList.remove('is-open'); document.getElementById('drawer').classList.remove('is-open');
