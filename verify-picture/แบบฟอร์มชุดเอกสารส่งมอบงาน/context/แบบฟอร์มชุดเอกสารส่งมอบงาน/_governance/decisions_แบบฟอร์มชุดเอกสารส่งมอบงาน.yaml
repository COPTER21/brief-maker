# unattended — AI-DEFAULT ทุกหมวด รอลูกค้ายืนยัน
# G1 ผลต่อระบบ — บันทึกการรับมอบชุดเอกสาร ไม่เปลี่ยนค่าในระบบ ไม่ส่งต่อ · ชื่อโครงการกรอกเอง (FM-IVM-01/ทะเบียนเอกสาร FM-IVM-05 ยังไม่ลิงก์ในระบบ)
config_changes: []
post_to: []

# G2 สายอนุมัติ — dynamic · 2 ขั้นตามช่องลงชื่อบนกระดาษ (ผู้ตรวจสอบ → ผู้อนุมัติ / รับทราบ = ฝ่ายพัฒนาธุรกิจรับทราบผลการรับมอบ) · ไม่มีวงเงินบนกระดาษ
doa: { required: true, mode: dynamic, default_steps: ["role-line-manager", "role-mgr-bu"], step_labels: ["ผู้ตรวจสอบ", "ผู้อนุมัติ / รับทราบ"], amount: none }

# G3 กติกา — ไม่มีค่าคงที่/สูตรบนกระดาษ · ตัวเลือกจาก data validation · ข้อมูลขัดกันชัดเจนบล็อก · ที่เหลือเตือน
calc:
  constants_from_config: true
  auto_compute: true
  over_limit: warn
  rules:
    - "ลำดับแถวผลการตรวจรับเอกสาร ระบบรันให้ 1, 2, 3 … ต่อใบ"
    - "ได้รับแล้ว = ไม่ได้รับ → ความครบถ้วนตั้งเป็น ไม่ครบถ้วน ให้อัตโนมัติ (เลือก ครบถ้วน ไม่ได้ · บล็อก)"
    - "แถวที่ไม่ใช่ ได้รับ + ครบถ้วน ต้องมีประเด็นที่พบ · ผู้รับผิดชอบแก้ไข · กำหนดส่งเพิ่มเติม (บล็อกตอนส่ง)"
    - "กำหนดส่งเพิ่มเติมต้องไม่ก่อนวันที่รับมอบ (บล็อก)"
    - "ผลการรับมอบ รับมอบครบถ้วน → ทุกแถวต้อง ได้รับ + ครบถ้วน (บล็อก) · รับมอบแบบมีเงื่อนไข → ต้องมีประเด็นค้างจากการรับมอบ + กำหนดการติดตาม (บล็อก) · ยังไม่รับมอบ → ต้องมีหมายเหตุจากฝ่ายบริหารการลงทุน (บล็อก)"
    - "ระบบแนะนำผลการรับมอบจากตาราง (ทุกแถวครบ → รับมอบครบถ้วน · มีแถวไม่ครบ → รับมอบแบบมีเงื่อนไข) เป็นคำเตือน ไม่บล็อก"
    - "ต้องมีรายการเอกสารอย่างน้อย 1 แถวก่อนส่ง (บล็อกตอนส่ง)"

# G4 รายการซ้ำ — ไม่จำกัด · PDF ขั้นต่ำเท่ากระดาษ 12 แถว
repeat: { max_rows: null }

# G5 ช่องตามกระดาษ — 1:1 ไม่เพิ่มช่อง
fidelity: { one_to_one: true, add_fields: [], merge_split: [] }

# G6 ลายเซ็น — แถวล่าง 1 ช่องต่อขั้น DOA + ผู้จัดทำ · ข้อความ "พิจารณาในระบบ" ไม่ใช้ภาพ
signature: { layout: row-bottom, per_doa_step: true, handwriting_image: false }

# G7 ไม่อนุมัติ / ส่งกลับ / ยกเลิก — กลับเป็นร่างเลขเดิม · ยกเลิกได้ เจ้าของ + admin role · ร่าง/รออนุมัติ · เหตุผลบังคับ
reject_cancel: { on_reject: draft, cancel_by: [owner, admin_role], cancel_states: [draft, pending], reason_required: true }

# G8 การมองเห็น — เจ้าของ · ผู้อนุมัติหลังส่ง · admin role ฝ่ายบริหารการลงทุนเห็นทั้งหมด
visibility: { owner: true, approver: after_submit, admin_role: all }

# G9 เลขที่ — เอกสารภายใน ออกตอนบันทึกครั้งแรก · รหัส IVMF (IVM + F = ฟอร์มลำดับ 06 · FM-IVM-06)
numbering: { issue_on: first_save, code: IVMF }

# G10 ของเสริม
extras: { attachments: true, copy: false, export_csv: true, announce: false }

extend: {}
fit: {}
