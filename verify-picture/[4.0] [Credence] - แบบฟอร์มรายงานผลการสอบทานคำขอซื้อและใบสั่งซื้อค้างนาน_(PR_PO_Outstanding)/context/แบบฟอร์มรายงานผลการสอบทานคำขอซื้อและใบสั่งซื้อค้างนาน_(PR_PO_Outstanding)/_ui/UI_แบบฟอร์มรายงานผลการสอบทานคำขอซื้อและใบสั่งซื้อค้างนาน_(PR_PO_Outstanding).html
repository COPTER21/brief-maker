window.addEventListener('scroll', closeRowMenu, true);

/* =====================================================================
   VIEW DRAWER — รายละเอียด › PDF Preview › ลายเซ็น / อนุมัติ › ประวัติ
   ===================================================================== */
function tabBtn(key, label, icon, count){ return `<button class="drawer-tab ${S.dw.tab === key ? 'is-active' : ''}" onclick="setTab('${key}')"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i> ${label}${count != null ? `<span class="dt-count num">${count}</span>` : ''}</button>`; }
function kv(label, val){ return `<div class="lbl">${label}</div><div class="val">${val}</div>`; }
const SEC = (icon, title, body, extra) => `<div class="drawer-section"><div class="drawer-section-title"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i>${title}${extra || ''}</div>${body}</div>`;
/* ตารางรายการ (อ่านอย่างเดียว) — คอลัมน์ตามกระดาษ 1:1 (DEC-06) */
function itemsTable(items){
  const head = '<thead><tr><th class="c">ลำดับ</th><th>เลขที่ PR</th><th>เลขที่ PO</th><th>วันที่สั่งซื้อ</th><th>วันที่รับ สินค้า/บริการ</th><th>ผู้ผลิต ผู้จัดจำหน่าย</th><th>รายละเอียด</th><th class="r">จำนวนสั่งซื้อ</th><th>หน่วย</th><th>ฝ่าย/แผนก ขอซื้อสินค้า/บริการ</th><th>สาเหตุคงค้าง</th><th>สถานะปัจจุบัน</th><th>แนวทางการแก้ไข</th></tr></thead>';
  if (!items.length) return `<div class="table-wrap osw-view-lines"><table class="table">${head}<tbody><tr><td colspan="13">${emptyStateHTML({ icon:'clipboard-list', title:'ไม่มีรายการ', desc:'ยังไม่ได้บันทึก PR/PO ค้างในรายงานนี้' })}</td></tr></tbody></table></div>`;
  const dup = dupNos(items), mute = '<span class="cell-mute">—</span>';
  return `<div class="table-wrap osw-view-lines"><table class="table">${head}<tbody>${items.map((it, i) =>
    `<tr><td class="c num">${i + 1}</td><td class="nw">${it.pr ? `<span class="code-strong">${esc(it.pr)}</span>` : mute}${isDup(dup, it, 'pr') ? ' <span class="pill pill-warning">ซ้ำ</span>' : ''}</td>
      <td class="nw">${it.po ? `<span class="code-strong">${esc(it.po)}</span>` : '<span class="pill pill-muted">ยังไม่ออก PO</span>'}${isDup(dup, it, 'po') ? ' <span class="pill pill-warning">ซ้ำ</span>' : ''}</td>
      <td class="nw">${it.od ? dShort(it.od) : mute}</td><td class="nw">${it.rd ? dShort(it.rd) : mute}</td><td>${it.vendor ? esc(it.vendor) : mute}</td><td>${esc(it.desc)}</td>
      <td class="nw num r">${fmtQty(it.qty)}</td><td class="nw">${esc(it.uom)}</td><td>${esc(it.dept)}</td><td>${esc(it.reason)}</td><td>${esc(it.cur)}</td><td>${esc(it.fix)}</td></tr>`).join('')}</tbody></table></div>`;
}
function fileRow(x){ return `<div class="file-row"><div class="file-ic"><i data-lucide="file" class="w-4 h-4"></i></div><div class="file-name">${esc(x.name)}</div><span class="file-size">${x.size}</span></div>`; }
function viewBanner(r){
  if (r.status === 'returned') return `<div class="alert-row is-danger"><i data-lucide="corner-up-left" class="w-4 h-4"></i><div>ไม่อนุมัติ — ${esc(r.returnNote)}${isOwner(r) ? ' · แก้แล้วส่งอนุมัติใหม่ได้ (เลขที่เดิม)' : ''}</div></div>`;
  if (r.status === 'cancelled'){ const a = r.audit.filter(x => x.act === 'ยกเลิกเอกสาร').pop(); return `<div class="alert-row is-danger"><i data-lucide="x-circle" class="w-4 h-4"></i><div>ยกเลิกแล้ว — ${esc(a ? a.note : '')}</div></div>`; }
  if (r.status === 'pending') return `<div class="alert-row"><i data-lucide="hourglass" class="w-4 h-4"></i><div>รอ ${esc(empOf(curStep(r).assignee).name)} อนุมัติ${canAct(r) ? ' — คุณเป็นผู้มีอำนาจอนุมัติรายงานนี้' : ''}</div></div>`;
  if (r.status === 'draft') return `<div class="alert-row"><i data-lucide="pencil" class="w-4 h-4"></i><div>ยังเป็นร่าง — ตรวจรายการ PR/PO ค้างให้ครบ แล้วส่งอนุมัติ</div></div>`;
  return '';
}
function renderDetailTab(r){
  const e = empOf(r.emp), N = r.items.length, x = nNoPO(r.items), dup = Object.keys(dupNos(r.items)).length;
  return viewBanner(r)
    + (dup ? `<div class="alert-row is-warning"><i data-lucide="alert-triangle" class="w-4 h-4"></i><div>มีเลขที่ PR/PO ซ้ำในรายงานนี้ — ตรวจว่าเป็นคนละรายการ</div></div>` : '')
    + SEC('info', 'ข้อมูลเอกสาร', `<div class="drawer-fields">${kv('เลขที่เอกสาร', `<span class="code-strong">${r.code}</span>`)}${kv('วันที่รายงาน', dFull(r.rdate))}${kv('สถานะเอกสาร', docPill(r.status))}${kv('หน่วยงาน', esc(r.org))}${kv('ผู้มีอำนาจอนุมัติ', r.chain.length ? personInline(r.chain[0].assignee) : '—')}${kv('แบบพิมพ์', DOC.form + ' · ' + DOC.rev)}</div>`)
    + SEC('user', 'ผู้จัดทำรายงาน', `<div class="drawer-fields">${kv('ชื่อ-สกุล', esc(e.name))}${kv('ตำแหน่ง', esc(r.pos))}${kv('สังกัด', esc(r.dept))}</div>`)
    + SEC('clipboard-list', `ข้อมูลคำขอซื้อ/ใบสั่งซื้อค้างนาน (${N})`, itemsTable(r.items), `<span class="sec-meta num">${N} รายการ${x ? ' · ยังไม่ออก PO ' + x : ''}</span>`)
    + SEC('paperclip', `เอกสารแนบ (${r.attachments.length} ไฟล์ · Document Center)`, r.attachments.length ? r.attachments.map(fileRow).join('') : '<div class="tl-body">ไม่มีเอกสารแนบ</div>')
    + SEC('database', 'ข้อมูลระบบ', `<div class="drawer-fields">${kv('สร้างโดย', esc(r.createdBy) + ' · ' + fmtDateTime(r.createdAt))}${kv('แก้ไขล่าสุด', esc(r.updatedBy) + ' · ' + fmtDateTime(r.updatedAt))}</div>`);
}
/* ---------- PDF Preview — แบบพิมพ์ Replica จาก thai-doc-pdf-generator (print/form.tpl.html · PPO_print-spec.md) ----------
   PPO_TPL = form.tpl.html (logic-less) · docPrintData(r) = data contract (PPO_data-contract.md) · PDF_CSS = base.css + replica.css + profile.json
   ระบบจริง: GET /ppo/{id}/pdf render ฝั่ง server จาก template + data เดียวกัน → แทน iframe ใน .pdf-slot */
const PDF_CSS = "\n/* ============================================================\n   THAI BUSINESS DOCUMENT — MASTER A4 STYLESHEET  (LEAN v2)\n   CI: CUBE NATIVE (Navy #0B1D3A / Primary #0B5CFF / Teal #00A88E)\n   Font: Sarabun (Thai official document standard)\n   Design rules: lean & light type · thin minimal table header ·\n   single-line dense rows · signatures + footer pinned to page bottom.\n   DO NOT edit per-document. \n\n\n injected by build_html.py.\n   ============================================================ */\n\n\n\n\n\n\n:root{\n  /* ---- CUBE NATIVE CI (verbatim from html-generator-v3) ---- */\n  --c-navy:#0B1D3A; --c-navy-2:#14284A;\n  --c-primary:#0B5CFF; --c-primary-hover:#0847CC;\n  --c-teal:#00A88E; --c-teal-light:#5EEAD4;\n  --c-ink:#0F172A; --c-mute:#475569; --c-mute-2:#64748B; --c-mute-3:#94A3B8;\n  --c-line:#CBD5E1; --c-line-2:#E2E8F0; --c-line-3:#F1F5F9;\n  --c-bg-off:#F8FAFC;\n  --c-success:#10B981; --c-warning:#D97706; --c-danger:#DC2626;\n\n  /* ---- Print geometry (A4) ---- */\n  --page-w:210mm; --page-h:297mm;\n  --page-margin:14mm;\n  --content-h:269mm;        /* 297 - 2*14 (printable height) */\n  --fs-base:9pt;            /* lean body size */\n}\n\n@page{ size:A4 portrait; margin:var(--page-margin); }\n\n*{ box-sizing:border-box; margin:0; padding:0; }\n\nhtml,body{\n  font-family:'Sarabun','Loma',sans-serif;\n  font-size:var(--fs-base);\n  font-weight:400;\n  line-height:1.4;\n  color:var(--c-ink);\n  -webkit-font-smoothing:antialiased;\n  background:#fff;\n}\n\n/* ===== A4 PAGE — flex column so .doc-bottom can pin to bottom ===== */\n.doc-page{ display:flex; flex-direction:column; }\n.doc-content{ flex:0 0 auto; }\n.doc-bottom{ margin-top:auto; }   /* pushes signatures + footer to page bottom */\n\n@media screen{\n  body{ background:#e7ebf0; padding:24px 0; }\n  .doc-page{\n    width:var(--page-w); min-height:var(--page-h);\n    margin:0 auto 24px; padding:var(--page-margin);\n    background:#fff; box-shadow:0 4px 24px rgba(11,29,58,.18);\n  }\n}\n@media print{\n  .doc-page{ width:auto; min-height:var(--content-h); padding:0; box-shadow:none; }\n}\n\n/* ============================================================\n   1. HEADER — thin rule, lighter type\n   ============================================================ */\n.doc-head{\n  display:flex; justify-content:space-between; align-items:flex-start;\n  gap:12mm; padding-top:1.5mm; padding-bottom:6px; border-bottom:1.5px solid var(--c-navy);\n}\n.doc-head__brand{ display:flex; gap:9px; align-items:flex-start; }\n.doc-logo{ width:46px; height:46px; flex:0 0 auto; border-radius:7px; object-fit:contain; }\n.doc-logo--ph{\n  display:flex; align-items:center; justify-content:center;\n  background:linear-gradient(135deg,var(--c-navy),var(--c-teal));\n  color:#fff; font-weight:700; font-size:15pt; letter-spacing:.03em;\n}\n.doc-org__name{ font-size:11.5pt; font-weight:700; color:var(--c-navy); line-height:1.5; }\n.doc-org__line{ font-size:7.8pt; color:var(--c-mute); line-height:1.35; }\n.doc-org__tax{ font-size:7.8pt; color:var(--c-mute-2); margin-top:1px; }\n\n.doc-head__title{ text-align:right; flex:0 0 auto; min-width:54mm; }\n.doc-title{ font-size:15pt; font-weight:700; color:var(--c-navy); line-height:1.45; }\n.doc-title__en{ font-size:7.5pt; font-weight:500; color:var(--c-mute-2); letter-spacing:.08em; text-transform:uppercase; }\n.doc-copy{ display:inline-block; margin-top:3px; padding:0 8px; border:1px solid var(--c-line);\n  border-radius:999px; font-size:7pt; font-weight:500; color:var(--c-mute); }\n\n/* ============================================================\n   2. META STRIP\n   ============================================================ */\n.doc-meta{ display:flex; flex-wrap:wrap; gap:0 22px; margin-top:7px; font-size:8.3pt; }\n.doc-meta__item{ display:flex; gap:5px; padding:1px 0; }\n.doc-meta__k{ color:var(--c-mute-2); }\n.doc-meta__v{ color:var(--c-ink); font-weight:600; }\n\n/* ============================================================\n   3. PARTY BLOCKS — light, no heavy fill\n   ============================================================ */\n.parties{ display:flex; gap:5mm; margin-top:9px; }\n.party{ flex:1; border:1px solid var(--c-line-2); border-radius:6px; padding:6px 9px; }\n.party__label{ font-size:7.2pt; font-weight:600; color:var(--c-primary);\n  text-transform:uppercase; letter-spacing:.06em; margin-bottom:2px; }\n.party__name{ font-size:9.3pt; font-weight:700; color:var(--c-ink); }\n.party__line{ font-size:8pt; color:var(--c-mute); line-height:1.35; }\n\n/* ============================================================\n   4. LINE-ITEM TABLE — minimal thin header, hairline rows, single-line\n   ============================================================ */\n.items{ width:100%; border-collapse:collapse; margin-top:10px; font-size:8.4pt; }\n.items thead th{\n  background:var(--c-navy); color:#fff; font-weight:600; font-size:7.6pt;\n  letter-spacing:.03em; text-align:left; padding:6px 8px;\n}\n.items thead th:first-child{ border-top-left-radius:5px; border-bottom-left-radius:5px; }\n.items thead th:last-child{ border-top-right-radius:5px; border-bottom-right-radius:5px; }\n.items tbody td{\n  padding:5px 8px; border-bottom:1px solid var(--c-line-2);\n  vertical-align:top; color:var(--c-ink); line-height:1.4;\n}\n.items .num{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }\n.items .ctr{ text-align:center; white-space:nowrap; }\n.items .col-no{ width:8mm; text-align:center; color:var(--c-mute-2); }\n.items .col-qty{ width:16mm; } .items .col-unit{ width:14mm; }\n.items .col-price{ width:23mm; } .items .col-amt{ width:25mm; }\n/* secondary detail kept INLINE so a row stays one line */\n.items td .sub{ color:var(--c-mute-2); font-size:7.4pt; }\n.items td .sub::before{ content:\"·\"; margin:0 5px; color:var(--c-mute-3); }\n.items tr{ break-inside:avoid; }\n.items thead{ display:table-header-group; }\n\n/* ============================================================\n   5. TOTALS — rules instead of heavy fill\n   ============================================================ */\n.foot-grid{ display:flex; gap:5mm; margin-top:8px; align-items:flex-start; }\n.foot-left{ flex:1; }\n.totals{ flex:0 0 60mm; }\n.totals__row{ display:flex; justify-content:space-between; gap:10px; padding:2.5px 8px; font-size:8.6pt; }\n.totals__row .k{ color:var(--c-mute); }\n.totals__row .v{ font-weight:600; font-variant-numeric:tabular-nums; }\n.totals__row--rule{ border-top:1px solid var(--c-line-2); }\n.totals__grand{\n  margin-top:4px; padding:6px 10px; border-radius:6px; background:var(--c-navy);\n  display:flex; justify-content:space-between; align-items:baseline;\n}\n.totals__grand .k{ font-size:8.8pt; font-weight:600; color:#fff; }\n.totals__grand .v{ font-size:11.5pt; font-weight:700; color:#fff; font-variant-numeric:tabular-nums; }\n/* amount-in-words — full width, larger, clear */\n.baht-text{ margin-top:7px; padding:6px 11px; border:1px dashed var(--c-line);\n  border-radius:6px; display:flex; justify-content:space-between; align-items:baseline; gap:12px; }\n.baht-text__k{ font-size:8pt; color:var(--c-mute-2); white-space:nowrap; }\n.baht-text b{ font-size:9.6pt; color:var(--c-navy); font-weight:700; text-align:right; }\n\n/* ============================================================\n   6. NOTES / TERMS\n   ============================================================ */\n.notes{ border:1px solid var(--c-line-2); border-radius:6px; padding:6px 9px;\n  font-size:8pt; color:var(--c-mute); }\n.notes__title{ font-size:7.2pt; font-weight:600; color:var(--c-mute-2);\n  text-transform:uppercase; letter-spacing:.05em; margin-bottom:3px; }\n.notes ol,.notes ul{ margin-left:15px; }\n.notes li{ margin:1px 0; }\n\n/* ============================================================\n   7. SIGNATURE BLOCK — sits inside .doc-bottom (above footer)\n   ============================================================ */\n.signs{ display:flex; gap:5mm; margin-top:14px; break-inside:avoid; }\n.sign{ flex:1; text-align:center; }\n.sign__line{ height:30px; border-bottom:1px solid var(--c-mute-3); margin:0 5mm; }\n.sign__paren{ font-size:8pt; color:var(--c-mute-2); margin-top:4px; }\n.sign__role{ font-size:8.4pt; font-weight:600; color:var(--c-ink); margin-top:1px; }\n.sign__name{ font-size:7.8pt; color:var(--c-mute); }\n.sign__date{ font-size:7.6pt; color:var(--c-mute-2); margin-top:1px; }\n\n/* ============================================================\n   8. OFFICIAL THAI LETTER / MEMO (ระเบียบงานสารบรรณ) — logo-left head\n   ============================================================ */\n.letter{ margin-top:8px; font-size:10pt; line-height:1.6; color:var(--c-ink); }\n\n/* ที่ (เลขหนังสือ) ซ้าย + ส่วนราชการ/ที่อยู่ ขวา */\n.letter__refrow{ display:flex; justify-content:space-between; align-items:flex-start; gap:14mm; margin-top:6px; }\n.letter__ref{ font-size:10pt; }\n.letter__agency{ text-align:right; font-size:9.2pt; color:var(--c-mute); line-height:1.4; }\n\n/* วันที่ — จัดกึ่งกลาง ไม่มีคำว่า \"วันที่\" นำ (ตามแบบราชการ) */\n.letter__date{ text-align:center; margin:10px 0 12px; font-size:10pt; }\n\n/* ฟิลด์หัวเรื่อง เรื่อง/เรียน/อ้างถึง/สิ่งที่ส่งมาด้วย — hanging indent */\n.letter__field{ display:flex; gap:10px; margin:3px 0; }\n.letter__field .lbl{ flex:0 0 auto; }\n.letter__field .val{ flex:1; text-align:justify; }\n.letter__field .val b,.letter__subject{ font-weight:700; }\n\n/* เนื้อหา — ย่อหน้าเยื้องบรรทัดแรก, จัดเต็มแนว */\n.letter__body{ margin-top:6px; }\n.letter__body p,.letter p{ margin:7px 0; text-indent:3.5em; text-align:justify; }\n\n/* คำลงท้าย + ลายเซ็น — กล่องชิดขวา */\n.letter__close{ margin-top:16px; margin-left:auto; width:72mm; text-align:center; }\n.letter__close .sp{ height:42px; }\n.letter__close .nm{ font-weight:600; }\n.letter__close .pos{ color:var(--c-mute); }\n\n/* เจ้าของเรื่อง (ส่วนราชการเจ้าของเรื่อง) — ล่างซ้าย ตัวเล็ก */\n.letter__owner{ font-size:8.6pt; color:var(--c-ink); line-height:1.45; }\n\n/* ============================================================\n   9. PAGE FOOTER — pinned bottom via .doc-bottom\n   ============================================================ */\n.doc-footer{ margin-top:8px; padding-top:5px; border-top:1px solid var(--c-line-2);\n  display:flex; justify-content:space-between; font-size:7.4pt; color:var(--c-mute-2); }\n\n/* ============================================================\n   UTILITIES\n   ============================================================ */\n.muted{ color:var(--c-mute); }\n.right{ text-align:right; } .center{ text-align:center; } .nowrap{ white-space:nowrap; }\n.mt-0{ margin-top:0 } .mt-8{ margin-top:8px } .mt-12{ margin-top:12px } .mt-16{ margin-top:16px }\n.tag{ display:inline-block; padding:0 7px; border-radius:999px; font-size:7.4pt; font-weight:600; }\n.tag--info{ background:#DBEAFE; color:#1E40AF; }\n.tag--ok{ background:#D1FAE5; color:#065F46; }\n.tag--warn{ background:#FEF3C7; color:#92400E; }\n.tag--danger{ background:#FEE2E2; color:#DC2626; }\n\n/* ============================================================\n   FORM REPLICA (mode=replica) — ขึ้น \"แบบฟอร์มของลูกค้า\" เป็นเอกสารระบบ\n   ใช้คู่ base.css (ใส่ให้อัตโนมัติเมื่อ build_html.py --mode replica)\n   ทุกค่าเป็น style token ปรับต่อลูกค้าได้ผ่าน --profile (profiles/*.json)\n   ห้ามเขียนค่าตายตัวใน body — ปรับที่ profile เท่านั้น\n   ============================================================ */\n:root{\n  --form-fs:9.6pt; --form-lh:1.6;\n  --form-ink:#111111; --form-mute:#6B6B6B; --form-dot:#9A9CA2;\n  --form-title-fs:14pt; --form-title-gap:16px;\n  --form-logo-h:15mm; --form-logo-maxw:70mm; --form-logo-align:center;\n  --form-row-gap:8px; --form-row-gap-dense:5px;\n  --form-indent:12mm; --form-para-gap:24px; --form-para-gap-dense:14px;\n  --form-fill-pad:6px; --form-fill-s:15mm; --form-fill-m:30mm; --form-fill-l:60mm;\n  --form-date-w:52mm; --form-num-w:6mm; --form-cb-fs:12pt;\n  --form-grid-line:#111111; --form           : `${s === 1 ? `<button class="btn btn-secondary" id="btnDraft1" onclick="saveDraft()" ${S.busy ? 'disabled' : ''}><i data-lucide="save" class="w-4 h-4"></i><span>บันทึกแบบร่าง</span></button>` : ''}<button class="btn btn-primary" id="btnNext" onclick="wizNext()"><span>ถัดไป</span><i data-lucide="arrow-right" class="w-4 h-4"></i></button>`}

/* ---------- wizard actions ---------- */
function goStep(n){ S.dw.step = n; render(); }
function setHead(k, v){ const f = wf(); if (!v || f[k] === v) return; f[k] = v; dirty(); if (S.dw.err) delete S.dw.err[k]; render(); }
function clearRowErr(i, k){ const e = S.dw.err; if (e && e.rows && e.rows[i]){ delete e.rows[i][k]; if (!Object.keys(e.rows[i]).length) delete e.rows[i]; } }
function setItem(i, k, v){ const it = wf().items[i]; if (!it) return; it[k] = v; dirty(); clearRowErr(i, k); if (k === 'od') clearRowErr(i, 'rd'); render(); }
function setTxt(i, k, v){ const it = wf().items[i]; if (!it) return; it[k] = v; dirty(); clearRowErr(i, k); if (k === 'pr' || k === 'po') { clearRowErr(i, 'pr'); } }
function addItem(){
  const f = wf(), prev = f.items[f.items.length - 1];
  f.items.push(Object.assign(blankItem(), { dept:prev ? prev.dept : '' }));   /* ยกฝ่าย/แผนกจากแถวก่อน */
  dirty(); render();
  const n = f.items.length - 1; setTimeout(() => { const x = document.getElementById('pr' + n); if (x) x.focus(); }, 0);
}
function removeItem(i){ const f = wf(); if (f.items.length < 2) return; f.items.splice(i, 1); dirty(); S.dw.err = null; render(); }
function validateMain(){
  const f = wf(), err = { rows:{} };
  if (f.items.some(it => !isBlankItem(it))) f.items = f.items.filter(it => !isBlankItem(it));   /* แถวว่างทั้งแถว = ตัดทิ้ง */
  if (!f.rdate) err.rdate = 'เลือกวันที่รายงาน'; else if (f.rdate > TODAY) err.rdate = 'วันที่รายงานเป็นวันในอนาคตไม่ได้';
  if (!f.org) err.org = 1;
  if (!f.items.length || f.items.every(isBlankItem)){ if (!f.items.length) f.items.push(blankItem()); err.msg = 'บันทึก PR/PO ค้างอย่างน้อย 1 รายการ'; }
  else f.items.forEach((it, i) => { const e = itemErrors(it, f.rdate); if (Object.keys(e).length) err.rows[i] = e; });
  const nBad = Object.keys(err.rows).length;
  if (nBad && !err.msg) err.msg = 'แถว ' + Object.keys(err.rows).map(i => Number(i) + 1).join(', ') + ' ข้อมูลไม่ครบหรือไม่ถูกต้อง';
  const ok = !err.rdate && !err.org && !err.msg && !nBad;
  S.dw.err = ok ? null : err; return ok;
}
function wizNext(){
  if (S.dw.step === 1 && !validateMain()){ render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.dw.step += 1; render();
}
function wizBack(){ S.dw.step = Math.max(1, S.dw.step - 1); render(); }
function pickFiles(inp){ const f = wf(); gateFiles(Array.from(inp.files || [])).forEach(x => f.files.push({ name:x.name, size:fmtSize(x.size) })); inp.value = ''; dirty(); render(); }
function removeFile(i){ wf().files.splice(i, 1); dirty(); render(); }
/* บันทึก = ENG-DOC-NUM.next('PPO') ออกเลขที่ตอนบันทึกครั้งแรก (DEC-10) · snapshot ตำแหน่ง/หน่วยงาน ณ วันที่บันทึก
   ไม่ปิด/ยกเลิก PR-PO ไม่เปลี่ยนค่าในระบบ (DEC-01/02) */
function persist(){
  const f = wf(), me = ME(), t = nowIso();
  let r = S.dw.editId ? findR(S.dw.editId) : null;
  if (!r){
    SEQ += 1;
    r = { id:'R' + SEQ, code:DOC.prefix + '-2569-' + String(SEQ).padStart(4, '0'), status:'draft', emp:S.me, pos:me.pos, dept:me.dept, reqDate:TODAY, returnNote:'',
      chain:resolveDoa(S.me), doa_entry_ref:MOCK_DOA_RESOLVED.doa_entry_ref, attachments:[], audit:[{ act:'สร้างเอกสาร', by:me.name, at:t, tone:'' }], createdBy:me.name, createdAt:t };
    RECS.unshift(r);
  } else r.audit.push({ act:'แก้ไขข้อมูล', by:me.name, at:t, note:f.items.length + ' รายการ · ยังไม่ออก PO ' + nNoPO(f.items), tone:'' });
  Object.assign(r, { rdate:f.rdate, month:f.rdate.slice(0, 7), org:f.org, items:cloneItems(f.items), attachments:f.files.slice(), updatedBy:me.name, updatedAt:t });
  return { r };
}
function saveDraft(){ if (S.busy) return; if (!validateMain()){ S.dw.step = 1; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const x = persist(); S.busy = false; closeDrawer(true);
    setTimeout(() => showToast('บันทึกร่างแล้ว · ' + x.r.code, 'info'), 300); }, 500); }
function saveAndSubmit(){ if (S.busy) return; if (!validateMain()){ S.dw.step = 1; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const x = persist(); S.busy = false; closeDrawer(true); setTimeout(() => openSubmit(x.r.id), 300); }, 500); }
/* =====================================================================
   MODALS — ส่งอนุมัติ (DOA slot picker) · อนุมัติ · ไม่อนุมัติ · ยกเลิก · ทิ้งข้อมูล
   ===================================================================== */
function modalShell(icon, tone, title, sub, body, foot){
  return `<div class="modal-header"><div class="modal-header-icon ${tone}"><i data-lucide="${icon}" class="w-4 h-4"></i></div><div><h3 class="modal-title">${title}</h3><p class="modal-subtitle">${sub}</p></div></div>
    ${body ? `<div class="modal-body">${body}</div>` : ''}<div class="modal-footer">${foot}</div>`;
}
const busyLabel = (icon, label) => S.busy ? '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>' : `<i data-lucide="${icon}" class="w-4 h-4"></i><span>${label}</span>`;
function presetChips(list, cur){ return `<div class="chip-row">${list.map(p => `<button type="button" class="chip ${cur === p ? 'is-on' : ''}" onclick="setReasonPreset(this.dataset.v)" data-v="${esc(p)}">${esc(p)}</button>`).join('')}</div>`; }
/* คำตัดสินของขั้นปัจจุบัน — หลังตัดสินแล้ว (modal กำลังปิด) ใช้ขั้นล่าสุดที่มีผล */
const stepWords = r => wordsOf((curStep(r) || r.chain.filter(c => c.status !== 'waiting').pop() || r.chain[0] || {}).role_id);
function renderModal(){
  const m = S.md; if (!m) return '';
  const r = m.id ? findR(m.id) : null;
  if (m.kind === 'submit'){
    return modalShell('send', 'is-primary', 'ส่งอนุมัติ?', `${r.code} · วันที่รายงาน ${dShort(r.rdate)} · ${r.items.length} รายการ`,
      `${resolveDoa(r.emp).map((c, i) => `<div class="slot-row"><span class="slot-no num">${c.step}</span><span class="slot-role">${c.role}</span><div class="field ${m.err && !m.slots[i] ? 'is-invalid' : ''}" id="fSlot${i}">${searchSelectHTML('slot' + i, { placeholder:'เลือกผู้พิจารณา' })}<div class="field-error">กรุณาเลือกผู้พิจารณา</div>${i === 0 ? '<div class="slot-help">ค่าเริ่มต้นจากสายอนุมัติและผังองค์กร</div>' : ''}</div></div>`).join('')}
       <div class="drawer-fields mt-3">${kv('รายการ', r.items.length + ' รายการ')}${kv('ยังไม่ออก PO', nNoPO(r.items) + ' รายการ')}</div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="btnSubmit" onclick="confirmSubmit()" ${S.busy ? 'disabled' : ''}>${busyLabel('send', 'ส่งอนุมัติ')}</button>`);
  }
  if (m.kind === 'approve'){
    const w = stepWords(r);
    return modalShell('check-circle-2', 'is-success', 'ยืนยัน' + w[0] + '?', `${r.code} · ${esc(empOf(r.emp).name)} · ${dShort(r.rdate)}`,
      `<div class="drawer-fields">${kv('รายการ', r.items.length + ' รายการ')}${kv('ยังไม่ออก PO', nNoPO(r.items) + ' รายการ')}${kv('หน่วยงาน', esc(r.org))}</div>
       <div class="field mt-3"><label class="field-label">ความเห็น</label><textarea class="input" name="apNote" rows="2" placeholder="ไม่บังคับ" oninput="S.md.note=this.value">${esc(m.note || '')}</textarea></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-success" id="btnApprove" onclick="confirmApprove()" ${S.busy ? 'disabled' : ''}>${busyLabel('check', w[0])}</button>`);
  }
  if (m.kind === 'reject' || m.kind === 'cancel'){
    const rej = m.kind === 'reject', w = rej ? stepWords(r) : null;
    return modalShell(rej ? 'corner-up-left' : 'x-circle', 'is-danger', rej ? w[1] + '?' : 'ยกเลิกเอกสาร?', `${r.code} · ${esc(empOf(r.emp).name)}${rej ? ' · ใบจะกลับเป็นร่าง (เลขที่เดิม) ให้ผู้จัดทำแก้แล้วส่งใหม่' : ''}`,
      `${presetChips(rej ? REJECT_PRESETS : CANCEL_PRESETS, m.preset)}
       <div class="field ${m.err ? 'is-invalid' : ''}" id="fReason"><label class="field-label">เหตุผล<span class="req">*</span></label><textarea class="input" name="reason" rows="3" placeholder="${rej ? 'แจ้งผู้จัดทำว่าต้องแก้อะไร' : 'เหตุผลที่ยกเลิก'}" oninput="S.md.reason=this.value; if(this.value.trim()) document.getElementById('fReason').classList.remove('is-invalid')">${esc(m.reason || '')}</textarea><div class="field-error">กรุณาระบุเหตุผล</div></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">${rej ? 'ยกเลิก' : 'ไม่ยกเลิก'}</button><button class="btn btn-danger" id="btnReason" onclick="confirmReason()" ${S.busy ? 'disabled' : ''}>${busyLabel(rej ? 'corner-up-left' : 'x-circle', rej ? w[1] : 'ยกเลิกเอกสาร')}</button>`);
  }
  if (m.kind === 'discard'){
    return modalShell('alert-triangle', 'is-warning', 'ทิ้งข้อมูลที่กรอกไว้?', 'ข้อมูลที่กรอกในหน้านี้ยังไม่ได้บันทึก', '',
      `<button class="btn btn-ghost" onclick="closeModal()">กลับไปกรอกต่อ</button><button class="btn btn-danger" id="btnDiscard" onclick="closeModal(); closeDrawer(true)">ทิ้งข้อมูล</button>`);
  }
  return '';
}
function openModalCfg(cfg){ S.md = cfg; state.modal.open = true; render(); requestAnimationFrame(() => document.getElementById('modalBackdrop').classList.add('is-open')); }
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('is-open'); state.modal.open = false; setTimeout(() => { if (!state.modal.open) S.md = null; }, 200); }
/* U25 — ปิดเมื่อ mousedown ที่ backdrop เท่านั้น · มีข้อความค้าง = ไม่ปิด */
function modalBackdropClick(){ if (S.md && (S.md.reason || S.md.note)) return; closeModal(); }
function setReasonPreset(v){ S.md.preset = v; S.md.reason = v + (S.md.reason && S.md.reason.indexOf(v) !== 0 ? ' — ' + S.md.reason : ''); S.md.err = false; render(); }
function openSubmit(id){ const r = findR(id); if (!r || !isEditable(r)) return; openModalCfg({ kind:'submit', id, slots:resolveDoa(r.emp).map(c => c.assignee) }); }
function openApprove(id){ openModalCfg({ kind:'approve', id, note:'' }); }
function openReject(id){ openModalCfg({ kind:'reject', id, reason:'' }); }
function openCancel(id){ closeRowMenu(); openModalCfg({ kind:'cancel', id, reason:'' }); }
function pushAudit(r, act, note, tone){ const me = ME(), t = nowIso(); r.audit.push({ act, by:me.name, at:t, note:note || '', tone:tone || '' }); r.updatedBy = me.name; r.updatedAt = t; }
/* DOA engine ยิง doa_pending / doa_result เอง (ไม่ประกาศซ้ำใน NTF) */
function confirmSubmit(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (m.slots.some(x => !x)){ m.err = true; render(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    r.chain = resolveDoa(r.emp).map((c, i) => Object.assign(c, { assignee:m.slots[i], status:i === 0 ? 'pending' : 'waiting' }));   /* BR-DOA-02 resolve ตอนส่งแล้ว freeze */
    r.status = 'pending'; r.returnNote = ''; r.submittedAt = nowIso(); pushAudit(r, 'ส่งอนุมัติ', 'ถึง ' + empOf(m.slots[0]).name);
    S.busy = false; closeModal(); render(); setTimeout(() => showToast('ส่งอนุมัติแล้ว · ' + r.code, 'success'), 220); }, 600);
}
/* อนุมัติ: ไม่เปลี่ยนค่าในระบบ ไม่ปิด/ยกเลิก PR-PO ไม่ส่งต่อระบบอื่น (DEC-01/02) — เก็บในเอกสารอย่างเดียว */
function confirmApprove(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    const c = curStep(r), w = wordsOf(c.role_id); c.status = 'approved'; c.at = nowIso(); c.note = (m.note || '').trim();
    const next = r.chain.find(x => x.status === 'waiting'); if (next) next.status = 'pending';   /* sequential */
    r.status = next ? 'pending' : 'approved'; pushAudit(r, next ? w[0] + ' (ขั้น ' + c.step + ')' : 'อนุมัติ', c.note, 'ok');
