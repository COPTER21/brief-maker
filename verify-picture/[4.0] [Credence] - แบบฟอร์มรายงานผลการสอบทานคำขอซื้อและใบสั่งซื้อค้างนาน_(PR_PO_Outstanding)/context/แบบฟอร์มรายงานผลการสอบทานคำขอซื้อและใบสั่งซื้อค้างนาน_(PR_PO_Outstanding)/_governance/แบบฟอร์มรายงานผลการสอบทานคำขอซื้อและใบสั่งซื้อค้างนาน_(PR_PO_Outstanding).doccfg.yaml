# doccfg-declaration v2.1 — final (frd_ref ครบ) · init จาก DECISIONS.lock + print_config
feature_id: F-TMP-005
doc_types:
- code: PPO
  name_th: แบบฟอร์มรายงานผลการสอบทานคำขอซื้อและใบสั่งซื้อค้างนาน (PR/PO Outstanding)
  module: PUR
  feature_id: F-TMP-005
  numbering:
    preset: '{PREFIX}-{YYYY}-{run:4}'
    reset: yearly
    scope: global
    no_gap: false
    issue_on: first_save
    frd_ref: 03_LOGIC F-TMP-005-FN-03
  snapshot:
    sent_external: false
    approved_final: true
  snapshot_points:
  - event: approved_final
    frd_ref: 03_LOGIC F-TMP-005-FN-06
  print_config:
    form_code: FM-PUR-03
    revision: 'Rev. 02 : 16/6/2026'
    paper: A4-portrait
    min_rows:
      items: 8
    dense_when_rows_over: 12
    header_source: organization_snapshot_at_numbering
    sign_boxes:
    - box: requester
      label: 'ผู้จัดทำ :'
      show_date: true
    - box: doa_step:*
      label: from_doa_step
      show_decision: true
      show_date: true
    decision_words:
      default:
        approve: อนุมัติ
        reject: ไม่อนุมัติ
      by_role:
        role-mgr-pur:
          approve: อนุมัติ
          reject: ไม่อนุมัติ
    sign_layout:
      source: approval_chain snapshot (ผู้จัดทำ + จำนวนขั้นตามที่ตั้งใน DOA)
      max_per_row: 4
      split: even
      dense_when_steps_over: 4
      keep_together: true
    ref: print/print_config.json
