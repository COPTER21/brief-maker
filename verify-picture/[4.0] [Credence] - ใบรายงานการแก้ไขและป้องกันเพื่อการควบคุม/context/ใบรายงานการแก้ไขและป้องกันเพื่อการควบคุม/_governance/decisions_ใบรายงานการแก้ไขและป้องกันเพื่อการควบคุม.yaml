# unattended — AI-DEFAULT ทุกหมวด รอลูกค้ายืนยัน
# J008 · FM-CCC-04 ใบรายงานการแก้ไขและป้องกันเพื่อการควบคุม (CAR) · ตอบตาม 4_knowledge/governance/unattended-policy.md

# G1 ผลต่อระบบ — ฟอร์มไม่ได้เขียนว่าเปลี่ยนค่า/ส่งต่อ → ไม่เปลี่ยนค่า ไม่ส่งต่อ · DOC NAME/DOC NO./เอกสารที่ต้องแก้ไข (ข้อ 8, 10) = ผู้ใช้กรอกเลขอ้างอิงเอง (ไม่เชื่อม DAR/ทะเบียนเอกสาร)
config_changes: []
post_to: []

# G2 สายอนุมัติ — ข้อ 12 "การตรวจสอบมาตรการป้องกัน(อนุมัติ)" มีช่องลงนาม 4 ช่อง → dynamic 4 ขั้น ตามลำดับกระดาษ: GM/AMD/ผู้จัดการฝ่าย (ผู้บังคับบัญชาของหน่วยงาน) → MD → IC → IC Mgr. · ไม่มีวงเงิน
doa: { required: true, mode: dynamic, default_steps: ["role-line-manager", "role-md", "role-ic-officer", "role-ic-mgr"], amount: none }

# G3 สูตร / ค่าคงที่ — 30 นาทีอ่านจาก config · % คำนวณอัตโนมัติ · เกินเกณฑ์ = เตือน · ขัดแย้งทางตรรกะ = บล็อก
calc:
  constants_from_config: true
  auto_compute: true
  over_limit: warn
  rules:
    - "% ต่อแถว = จำนวน ÷ จำนวนทั้งหมด × 100 (ทศนิยม 2) · แถวรวม = ผลรวม · 6.3 คิดแบบเดียวกันจาก 6.3 จำนวน"
    - "Σ จำนวน (ข้อ 3) หรือ Σ 6.3 จำนวน > จำนวนทั้งหมด → เตือน ไม่บล็อก"
    - "บันทึกครั้งแรกช้ากว่า วันเวลาที่พบปัญหา เกิน CarConfig.analysis_start_minutes (ค่าเริ่ม 30 นาที) → เตือน ไม่บล็อก"
    - "วันเวลาที่พบปัญหา อยู่ในอนาคต → บล็อก"
    - "แถวอาการ: ติ๊ก เกิดใหม่ แล้วกรอก เกิดซ้ำครั้งที่ ไม่ได้ · ไม่ติ๊กต้องกรอก เกิดซ้ำครั้งที่ ≥ 1 → บล็อก"
    - "Why-Why: มีแถวทำไมระดับถัดไป แต่ระดับก่อนหน้าไม่มีแถวผลพิสูจน์ จริง → เตือน"
    - "ส่งตรวจสอบ: ต้องมี หัวข้อปัญหา · ดัชนี/เป้าหมาย · จำนวนทั้งหมด · อาการ ≥ 1 แถว · ทำไม 1 ≥ 1 แถว · สาเหตุรากเหง้า (การจัดทำ) ผลพิสูจน์ จริง ≥ 1 แถว · 5.1 ≥ 1 แถว · 7 ≥ 1 แถว → บล็อกถ้าไม่ครบ"
    - "ส่งอนุมัติ: จุดลงนามตรวจสอบ 7 จุด (HOD · IC Mgr · 6.1 MD · 6.1 IC Mgr. · 10 IC Mgr · 11 MD · 11 IC Mgr.) ต้องครบ → บล็อกถ้าไม่ครบ"
    - "กำหนดเสร็จ ก่อน วันที่พบปัญหา → เตือน"
    - "ผู้ลงนามตรวจสอบ/ผู้อนุมัติ ต้องไม่ใช่ผู้จัดทำ (SoD) → บล็อก"

# G4 รายการซ้ำ — ไม่จำกัด · PDF อย่างน้อยเท่ากระดาษ
repeat: { max_rows: null }

# G5 ช่องตามกระดาษ — 1:1 · แก้สะกด '7.;' → '7.:' · คงป้าย 6.1 ซ้ำตามกระดาษ
fidelity: { one_to_one: true, add_fields: [], merge_split: [] }

# G6 ลายเซ็น — ข้อ 12 = 1 ช่องต่อขั้น DOA (ตำแหน่งเดิมบนกระดาษ) · จุดลงนามตรวจสอบ 7 จุด อยู่ตำแหน่งเดิม · ข้อความ "พิจารณาในระบบ/ตรวจสอบในระบบ" + ชื่อ + วันที่ ไม่ใช้ภาพ
signature: { layout: in-place, per_doa_step: true, handwriting_image: false }

# G7 ไม่อนุมัติ → กลับเป็นร่างเลขเดิม (ล้างจุดลงนามตรวจสอบ) · ผู้ตรวจสอบส่งกลับแก้ไขได้ (เหตุผลบังคับ) · ยกเลิกได้ เจ้าของ + admin role · ร่าง/รอตรวจสอบ/รออนุมัติ · เหตุผลบังคับ
reject_cancel: { on_reject: draft, cancel_by: [owner, admin_role], cancel_states: [draft, in_review, pending], reason_required: true }

# G8 การมองเห็น — เจ้าของ · ผู้ลงนามตรวจสอบเห็นหลังส่งตรวจสอบ · ผู้อนุมัติหลังส่งอนุมัติ · admin role ของหน่วยงานเจ้าของเอกสาร (IC — แผนกบริหารองค์กรและกำกับดูแล) เห็นทั้งหมด
visibility: { owner: true, approver: after_submit, admin_role: all }

# G9 เลขที่ — ออกตอนบันทึกครั้งแรก (เอกสารภายใน ไม่ใช่การเงิน) · รหัส CAR จากป้าย "P-CAR No." บนกระดาษ (ไม่ชน registry · ไม่ชน DAR ของ J007)
numbering: { issue_on: first_save, code: CAR }

# G10 ของเสริม — แนบ ✓ (รูป/หลักฐาน) CSV ✓ ทำซ้ำ ✗ ประกาศ ✗
extras: { attachments: true, copy: false, export_csv: true, announce: false }

extend: {}
fit: {}
