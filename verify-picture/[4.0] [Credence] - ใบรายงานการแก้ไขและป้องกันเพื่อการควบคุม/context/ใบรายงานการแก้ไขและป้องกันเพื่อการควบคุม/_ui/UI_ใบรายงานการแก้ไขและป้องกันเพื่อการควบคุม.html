const PDF_CSS = "/* ============================================================\n   THAI BUSINESS DOCUMENT — MASTER A4 STYLESHEET  (LEAN v2)\n   CI: CUBE NATIVE (Navy #0B1D3A / Primary #0B5CFF / Teal #00A88E)\n   Font: Sarabun (Thai official document standard)\n   Design rules: lean & light type · thin minimal table header ·\n   single-line dense rows · signatures + footer pinned to page bottom.\n   DO NOT edit per-document. @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap'); injected by build_html.py.\n   ============================================================ */\n\n@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap');\n\n:root{\n  /* ---- CUBE NATIVE CI (verbatim from html-generator-v3) ---- */\n  --c-navy:#0B1D3A; --c-navy-2:#14284A;\n  --c-primary:#0B5CFF; --c-primary-hover:#0847CC;\n  --c-teal:#00A88E; --c-teal-light:#5EEAD4;\n  --c-ink:#0F172A; --c-mute:#475569; --c-mute-2:#64748B; --c-mute-3:#94A3B8;\n  --c-line:#CBD5E1; --c-line-2:#E2E8F0; --c-line-3:#F1F5F9;\n  --c-bg-off:#F8FAFC;\n  --c-success:#10B981; --c-warning:#D97706; --c-danger:#DC2626;\n\n  /* ---- Print geometry (A4) ---- */\n  --page-w:210mm; --page-h:297mm;\n  --page-margin:14mm;\n  --content-h:269mm;        /* 297 - 2*14 (printable height) */\n  --fs-base:9pt;            /* lean body size */\n}\n\n@page{ size:A4 portrait; margin:var(--page-margin); }\n\n*{ box-sizing:border-box; margin:0; padding:0; }\n\nhtml,body{\n  font-family:'Sarabun','Loma',sans-serif;\n  font-size:var(--fs-base);\n  font-weight:400;\n  line-height:1.4;\n  color:var(--c-ink);\n  -webkit-font-smoothing:antialiased;\n  background:#fff;\n}\n\n/* ===== A4 PAGE — flex column so .doc-bottom can pin to bottom ===== */\n.doc-page{ display:flex; flex-direction:column; }\n.doc-content{ flex:0 0 auto; }\n.doc-bottom{ margin-top:auto; }   /* pushes signatures + footer to page bottom */\n\n@media screen{\n  body{ background:#e7ebf0; padding:24px 0; }\n  .doc-page{\n    width:var(--page-w); min-height:var(--page-h);\n    margin:0 auto 24px; padding:var(--page-margin);\n    background:#fff; box-shadow:0 4px 24px rgba(11,29,58,.18);\n  }\n}\n@media print{\n  .doc-page{ width:auto; min-height:var(--content-h); padding:0; box-shadow:none; }\n}\n\n/* ============================================================\n   1. HEADER — thin rule, lighter type\n   ============================================================ */\n.doc-head{\n  display:flex; justify-content:space-between; align-items:flex-start;\n  gap:12mm; padding-top:1.5mm; padding-bottom:6px; border-bottom:1.5px solid var(--c-navy);\n}\n.doc-head__brand{ display:flex; gap:9px; align-items:flex-start; }\n.doc-logo{ width:46px; height:46px; flex:0 0 auto; border-radius:7px; object-fit:contain; }\n.doc-logo--ph{\n  display:flex; align-items:center; justify-content:center;\n  background:linear-gradient(135deg,var(--c-navy),var(--c-teal));\n  color:#fff; font-weight:700; font-size:15pt; letter-spacing:.03em;\n}\n.doc-org__name{ font-size:11.5pt; font-weight:700; color:var(--c-navy); line-height:1.5; }\n.doc-org__line{ font-size:7.8pt; color:var(--c-mute); line-height:1.35; }\n.doc-org__tax{ font-size:7.8pt; color:var(--c-mute-2); margin-top:1px; }\n\n.doc-head__title{ text-align:right; flex:0 0 auto; min-width:54mm; }\n.doc-title{ font-size:15pt; font-weight:700; color:var(--c-navy); line-height:1.45; }\n.doc-title__en{ font-size:7.5pt; font-weight:500; color:var(--c-mute-2); letter-spacing:.08em; text-transform:uppercase; }\n.doc-copy{ display:inline-block; margin-top:3px; padding:0 8px; border:1px solid var(--c-line);\n  border-radius:999px; font-size:7pt; font-weight:500; color:var(--c-mute); }\n\n/* ============================================================\n   2. META STRIP\n   ============================================================ */\n.doc-meta{ display:flex; flex-wrap:wrap; gap:0 22px; margin-top:7px; font-size:8.3pt; }\n.doc-meta__item{ display:flex; gap:5px; padding:1px 0; }\n.doc-meta__k{ color:var(--c-mute-2); }\n.doc-meta__v{ color:var(--c-ink); font-weight:600; }\n\n/* ============================================================\n   3. PARTY BLOCKS — light, no heavy fill\n   ============================================================ */\n.parties{ display:flex; gap:5mm; margin-top:9px; }\n.party{ flex:1; border:1px solid var(--c-line-2); border-radius:6px; padding:6px 9px; }\n.party__label{ font-size:7.2pt; font-weight:600; color:var(--c-primary);\n  text-transform:uppercase; letter-spacing:.06em; margin-bottom:2px; }\n.party__name{ font-size:9.3pt; font-weight:700; color:var(--c-ink); }\n.party__line{ font-size:8pt; color:var(--c-mute); line-height:1.35; }\n\n/* ============================================================\n   4. LINE-ITEM TABLE — minimal thin header, hairline rows, single-line\n   ============================================================ */\n.items{ width:100%; border-collapse:collapse; margin-top:10px; font-size:8.4pt; }\n.items thead th{\n  background:var(--c-navy); color:#fff; font-weight:600; font-size:7.6pt;\n  letter-spacing:.03em; text-align:left; padding:6px 8px;\n}\n.items thead th:first-child{ border-top-left-radius:5px; border-bottom-left-radius:5px; }\n.items thead th:last-child{ border-top-right-radius:5px; border-bottom-right-radius:5px; }\n.items tbody td{\n  padding:5px 8px; border-bottom:1px solid var(--c-line-2);\n  vertical-align:top; color:var(--c-ink); line-height:1.4;\n}\n.items .num{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }\n.items .ctr{ text-align:center; white-space:nowrap; }\n.items .col-no{ width:8mm; text-align:center; color:var(--c-mute-2); }\n.items .col-qty{ width:16mm; } .items .col-unit{ width:14mm; }\n.items .col-price{ width:23mm; } .items .col-amt{ width:25mm; }\n/* secondary detail kept INLINE so a row stays one line */\n.items td .sub{ color:var(--c-mute-2); font-size:7.4pt; }\n.items td .sub::before{ content:\"·\"; margin:0 5px; color:var(--c-mute-3); }\n.items tr{ break-inside:avoid; }\n.items thead{ display:table-header-group; }\n\n/* ============================================================\n   5. TOTALS — rules instead of heavy fill\n   ============================================================ */\n.foot-grid{ display:flex; gap:5mm; margin-top:8px; align-items:flex-start; }\n.foot-left{ flex:1; }\n.totals{ flex:0 0 60mm; }\n.totals__row{ display:flex; justify-content:space-between; gap:10px; padding:2.5px 8px; font-size:8.6pt; }\n.totals__row .k{ color:var(--c-mute); }\n.totals__row .v{ font-weight:600; font-variant-numeric:tabular-nums; }\n.totals__row--rule{ border-top:1px solid var(--c-line-2); }\n.totals__grand{\n  margin-top:4px; padding:6px 10px; border-radius:6px; background:var(--c-navy);\n  display:flex; justify-content:space-between; align-items:baseline;\n}\n.totals__grand .k{ font-size:8.8pt; font-weight:600; color:#fff; }\n.totals__grand .v{ font-size:11.5pt; font-weight:700; color:#fff; font-variant-numeric:tabular-nums; }\n/* amount-in-words — full width, larger, clear */\n.baht-text{ margin-top:7px; padding:6px 11px; border:1px dashed var(--c-line);\n  border-radius:6px; display:flex; justify-content:space-between; align-items:baseline; gap:12px; }\n.baht-text__k{ font-size:8pt; color:var(--c-mute-2); white-space:nowrap; }\n.baht-text b{ font-size:9.6pt; color:var(--c-navy); font-weight:700; text-align:right; }\n\n/* ============================================================\n   6. NOTES / TERMS\n   ============================================================ */\n.notes{ border:1px solid var(--c-line-2); border-radius:6px; padding:6px 9px;\n  font-size:8pt; color:var(--c-mute); }\n.notes__title{ font-size:7.2pt; font-weight:600; color:var(--c-mute-2);\n  text-transform:uppercase; letter-spacing:.05em; margin-bottom:3px; }\n.notes ol,.notes ul{ margin-left:15px; }\n.notes li{ margin:1px 0; }\n\n/* ============================================================\n   7. SIGNATURE BLOCK — sits inside .doc-bottom (above footer)\n   ============================================================ */\n.signs{ display:flex; gap:5mm; margin-top:14px; break-inside:avoid; }\n.sign{ flex:1; text-align:center; }\n.sign__line{ height:30px; border-bottom:1px solid var(--c-mute-3); margin:0 5mm; }\n.sign__paren{ font-size:8pt; color:var(--c-mute-2); margin-top:4px; }\n.sign__role{ font-size:8.4pt; font-weight:600; color:var(--c-ink); margin-top:1px; }\n.sign__name{ font-size:7.8pt; color:var(--c-mute); }\n.sign__date{ font-size:7.6pt; color:var(--c-mute-2); margin-top:1px; }\n\n/* ============================================================\n   8. OFFICIAL THAI LETTER / MEMO (ระเบียบงานสารบรรณ) — logo-left head\n   ============================================================ */\n.letter{ margin-top:8px; font-size:10pt; line-height:1.6; color:var(--c-ink); }\n\n/* ที่ (เลขหนังสือ) ซ้าย + ส่วนราชการ/ที่อยู่ ขวา */\n.letter__refrow{ display:flex; justify-content:space-between; align-items:flex-start; gap:14mm; margin-top:6px; }\n.letter__ref{ font-size:10pt; }\n.letter__agency{ text-align:right; font-size:9.2pt; color:var(--c-mute); line-height:1.4; }\n\n/* วันที่ — จัดกึ่งกลาง ไม่มีคำว่า \"วันที่\" นำ (ตามแบบราชการ) */\n.letter__date{ text-align:center; margin:10px 0 12px; font-size:10pt; }\n\n/* ฟิลด์หัวเรื่อง เรื่อง/เรียน/อ้างถึง/สิ่งที่ส่งมาด้วย — hanging indent */\n.letter__field{ display:flex; gap:10px; margin:3px 0; }\n.letter__field .lbl{ flex:0 0 auto; }\n.letter__field .val{ flex:1; text-align:justify; }\n.letter__field .val b,.letter__subject{ font-weight:700; }\n\n/* เนื้อหา — ย่อหน้าเยื้องบรรทัดแรก, จัดเต็มแนว */\n.letter__body{ margin-top:6px; }\n.letter__body p,.letter p{ margin:7px 0; text-indent:3.5em; text-align:justify; }\n\n/* คำลงท้าย + ลายเซ็น — กล่องชิดขวา */\n.letter__close{ margin-top:16px; margin-left:auto; width:72mm; text-align:center; }\n.letter__close .sp{ height:42px; }\n.letter__close .nm{ font-weight:600; }\n.letter__close .pos{ color:var(--c-mute); }\n\n/* เจ้าของเรื่อง (ส่วนราชการเจ้าของเรื่อง) — ล่างซ้าย ตัวเล็ก */\n.letter__owner{ font-size:8.6pt; color:var(--c-ink); line-height:1.45; }\n\n/* ============================================================\n   9. PAGE FOOTER — pinned bottom via .doc-bottom\n   ============================================================ */\n.doc-footer{ margin-top:8px; padding-top:5px; border-top:1px solid var(--c-line-2);\n  display:flex; justify-content:space-between; font-size:7.4pt; color:var(--c-mute-2); }\n\n/* ============================================================\n   UTILITIES\n   ============================================================ */\n.muted{ color:var(--c-mute); }\n.right{ text-align:right; } .center{ text-align:center; } .nowrap{ white-space:nowrap; }\n.mt-0{ margin-top:0 } .mt-8{ margin-top:8px } .mt-12{ margin-top:12px } .mt-16{ margin-top:16px }\n.tag{ display:inline-block; padding:0 7px; border-radius:999px; font-size:7.4pt; font-weight:600; }\n.tag--info{ background:#DBEAFE; color:#1E40AF; }\n.tag--ok{ background:#D1FAE5; color:#065F46; }\n.tag--warn{ background:#FEF3C7; color:#92400E; }\n.tag--danger{ background:#FEE2E2; color:#DC2626; }\n\n/* ============================================================\n   FORM REPLICA (mode=replica) — ขึ้น \"แบบฟอร์มของลูกค้า\" เป็นเอกสารระบบ\n   ใช้คู่ base.css (ใส่ให้อัตโนมัติเมื่อ build_html.py --mode replica)\n   ทุกค่าเป็น style token ปรับต่อลูกค้าได้ผ่าน --profile (profiles/*.json)\n   ห้ามเขียนค่าตายตัวใน body — ปรับที่ profile เท่านั้น\n   ============================================================ */\n:root{\n  --form-fs:9.6pt; --form-lh:1.6;\n  --form-ink:#111111; --form-mute:#6B6B6B; --form-dot:#9A9CA2;\n  --form-title-fs:14pt; --form-title-gap:16px;\n  --form-logo-h:15mm; --form-logo-maxw:70mm; --form-logo-align:center;\n  --form-row-gap:8px; --form-row-gap-dense:5px;\n  --form-indent:12mm; --form-para-gap:24px; --form-para-gap-dense:14px;\n  --form-fill-pad:6px; --form-fill-s:15mm; --form-fill-m:30mm; --form-fill-l:60mm;\n  --form-date-w:52mm; --form-num-w:6mm; --form-cb-fs:12pt;\n  --form-grid-line:#111111; --form-grid-head-bg:#E6E6E6; --form-grid-pad:4px; --form-grid-row-h:6.2mm; --form-grid-row-h-dense:5mm; --form-grid-gap:0px;\n}\n.form{ font-size:var(--form-fs); line-height:var(--form-lh); color:var(--form-ink); }\n.form-brand{ display:flex; justify-content:var(--form-logo-align); }\n.form-logo{ height:var(--form-logo-h); width:auto; max-width:var(--form-logo-maxw); object-fit:contain; }\n.form-title{ text-align:center; font-size:var(--form-title-fs); font-weight:700; line-height:1.45; margin-top:var(--form-title-gap); }\n.form-date{ display:flex; justify-content:flex-end; margin-top:var(--form-title-gap); }\n.form-date .fill{ flex:0 0 var(--form-date-w); }\n.form-row{ display:flex; align-items:baseline; gap:6px; margin-top:var(--form-row-gap); }\n.form-row--indent{ padding-left:var(--form-indent); margin-top:calc(var(--form-row-gap) * 3); }\n.form-row .fill{ flex:1 1 0; }\n.form-row .fill--s{ flex:0 0 var(--form-fill-s); } .form-row .fill--m{ flex:0 0 var(--form-fill-m); } .form-row .fill--l{ flex:0 0 var(--form-fill-l); }\n.fill{ display:inline-block; min-height:1.45em; padding:0 var(--form-fill-pad); border-bottom:1px dotted var(--form-dot); font-weight:500; color:var(--form-ink); text-align:center; }\n.fill--left{ text-align:left; }\n.fill--s, .fill--m{ white-space:nowrap; }\n.fill .sub{ font-size:7.6pt; font-weight:400; color:var(--form-mute); }\n.form-num{ flex:0 0 var(--form-num-w); }\n.form-p{ margin-top:var(--form-para-gap); padding-left:var(--form-indent); }\n.form-check{ display:flex; align-items:baseline; gap:6px; margin-top:calc(var(--form-row-gap) * 2); }\n.form-check__lbl{ flex:0 0 auto; white-space:nowrap; }\n.form-check__opts{ flex:1; }\n.form-check__opt{ display:flex; align-items:baseline; gap:6px; margin-bottom:5px; }\n.form-check--inline .form-check__opts{ display:flex; flex-wrap:wrap; gap:4px 18px; }\n.cb{ font-size:var(--form-cb-fs); line-height:1; }\n.form-check .fill--s{ min-width:10mm; } .form-check .fill--m{ min-width:22mm; }\n.form-box{ margin-top:var(--form-row-gap); padding:6px 8px; border:1px solid var(--form-dot); min-height:18mm; }\n.form-section{ margin-top:var(--form-para-gap); font-weight:700; }\n/* รายการซ้ำยาว (> min_rows) → ระยะกระชับให้จบหน้าเดียวได้นานที่สุด (data.layout.dense) */\n.form.form--dense .form-row{ margin-top:var(--form-row-gap-dense); }\n.form.form--dense .form-row--indent{ margin-top:calc(var(--form-row-gap-dense) * 3); }\n.form.form--dense .form-check{ margin-top:calc(var(--form-row-gap-dense) * 2); }\n.form.form--dense .form-p{ margin-top:var(--form-para-gap-dense); }\n\n/* R9 · ตารางกรอบ (grid form) — ฟอร์มที่กระดาษเป็นตารางเส้นทึบ (เช่น FM-FIN-02) · v2.1 */\n.form-grid{ width:100%; border-collapse:collapse; table-layout:fixed; margin-top:var(--form-grid-gap); }\n.form-grid + .form-grid{ border-top:0; }\n.form-grid td, .form-grid th{ border:1px solid var(--form-grid-line); padding:2px var(--form-grid-pad); height:var(--form-grid-row-h); vertical-align:middle; text-align:left; font-weight:400; overflow:hidden; }\n.form-grid th{ background:var(--form-grid-head-bg); font-weight:700; text-align:center; }\n.form-grid .g-b{ font-weight:700; } .form-grid .g-r{ text-align:right; } .form-grid .g-c{ text-align:center; }\n.form-grid .g-v{ font-weight:500; } .form-grid .g-num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:500; }\n.form-grid .g-25{ width:25%; } .form-grid .g-50{ width:50%; } .form-grid .g-75{ width:75%; }\n.form-grid .g-tall{ height:calc(var(--form-grid-row-h) * 1.5); }\n.form-grid .g-u{ text-decoration:underline; font-weight:700; }\n.form.form--dense .form-grid td{ height:var(--form-grid-row-h-dense); }\n.form-note{ margin-top:var(--form-row-gap); } .form-note .b{ font-weight:700; }\n.form-grid--signs td{ text-align:center; vertical-align:top; }\n.form-grid td.g-blank{ border-top:0; border-left:0; }\n.form-grid tr.g-hrow td{ height:calc(var(--form-grid-row-h) * 1.4); }\n\n/* B6 rows · ช่องลงชื่อ dynamic ตาม DOA (v2.1) — data ส่ง sign_rows[].signs[] แถวละ ≤4 (sign_rows.py / tplSignRows)\n   ห่อด้วย .signs-block ทุกครั้ง = ทั้งก้อนไม่ถูกตัดข้ามหน้า · .doc-bottom.is-dense เมื่อขั้น DOA > 4 */\n.form-grid--signs + .form-grid--signs{ margin-top:0; border-top:0; }\n.form-grid--signs + .form-grid--signs td{ border-top:0; }\n.doc-bottom.is-dense .sign__line{ height:16px; }\n.doc-bottom.is-dense .form-grid--signs td{ padding-top:1px; padding-bottom:1px; }\n.doc-bottom.is-dense .sign__date, .doc-bottom.is-dense .sign__name{ font-size:7.2pt; }\n.signs-block{ break-inside:avoid; page-break-inside:avoid; }\n.signs-block .signs + .signs{ margin-top:4mm; }\n.doc-bottom.is-dense .signs-block .signs + .signs{ margin-top:2mm; }\n\n/* ===== R10 · เอกสารเกิน 1 หน้า (v2.2) — ออกแบบเป็น 2 หน้าแทนการบีบ ===== */\n.page-break{ break-before:page; page-break-before:always; }          /* ขึ้นหน้าใหม่ตรงจุดที่ตั้งใจ (ก่อนส่วนที่ 2 / ก่อนบล็อกลงชื่อ) */\n.keep-together{ break-inside:avoid; page-break-inside:avoid; }       /* กล่อง/ตารางย่อยไม่ถูกตัดกลาง */\n.form-grid thead, .items thead{ display:table-header-group; }        /* หัวตารางซ้ำทุกหน้า */\n.form-grid tr, .items tr{ break-inside:avoid; page-break-inside:avoid; }\n.cont-note{ text-align:right; font-size:7.5pt; color:var(--form-ink,#333); margin-top:2mm; }   /* \"มีต่อหน้าถัดไป\" ท้ายหน้า 1 */\n.page-no{ text-align:right; font-size:7.5pt; }                        /* \"หน้า 1/2\" ใน footer ทุกหน้า */\n\n:root{--form-fs:8pt; --form-lh:1.2; --form-title-fs:11pt; --form-logo-h:8mm; --form-logo-maxw:40mm; --form-logo-align:center; --form-title-gap:0px; --form-grid-gap:0px; --form-grid-pad:2px; --form-grid-row-h:4.4mm; --form-grid-row-h-dense:4.4mm; --form-grid-head-bg:#FFFFFF; --form-cb-fs:9pt;}";

/* G3 (DEC-04/34): บังคับช่องตามกระดาษ · วันเวลาพบปัญหาในอนาคต = บล็อก · เกิดใหม่↔เกิดซ้ำครั้งที่ = บล็อก · ตัวเลขต้องเป็นจำนวนเต็ม */
function validateMain(){
  const f = wf(), err = {}, intOk = v => v === '' || /^\d+$/.test(String(v).trim());
  if (!f.finder.trim()) err.finder = 'ระบุผู้พบปัญหา';
  if (!f.foundDate) err.foundDate = 'เลือกวันที่พบปัญหา';
  if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(f.foundTime.trim())) err.foundTime = 'ระบุเวลาเป็น HH:MM';
  else if (f.foundDate && f.foundDate + 'T' + f.foundTime > nowIso()) err.foundTime = 'วันเวลาที่พบปัญหาอยู่ในอนาคต';
  if (!f.problem.trim()) err.problem = 'ระบุหัวข้อปัญหา';
  if (!intOk(f.total)) err.total = 'ระบุเป็นจำนวนเต็ม';
  f.symptoms.forEach((s, i) => { if (!s.text.trim() && !s.qty && !s.rep) return;
    if (!s.text.trim()) err['sym' + i] = 'ระบุอาการของปัญหา';
    else if (!s.isNew && !(Number(s.rep) >= 1)) err['sym' + i] = 'ไม่ได้ติ๊ก "เกิดใหม่" — ระบุเกิดซ้ำครั้งที่ (ตั้งแต่ 1)';
    else if (!intOk(s.qty) || !intOk(s.cqty) || !intOk(s.rep)) err['sym' + i] = 'จำนวนต้องเป็นจำนวนเต็ม'; });
  const ok = !Object.keys(err).length; S.dw.err = ok ? null : err; return ok;
}

function persist(){
  const f = wf(), me = ME(), t = nowIso();
  let r = S.dw.editId ? findR(S.dw.editId) : null, late = 0;
  if (!r){
    SEQ += 1;
    r = { id:'R' + SEQ, code:DOC.prefix + '-2569-' + String(SEQ).padStart(4, '0'), status:'draft', emp:S.me, dept:me.dept, reviewer:null, review:resolveReview(S.me), chain:resolveDoa(S.me),
      doa_entry_ref:MOCK_DOA_RESOLVED.doa_entry_ref, returned:null, submittedAt:null, sentAt:null, lateMin:0, attachments:[], audit:[{ act:'สร้างเอกสาร', by:me.name, at:t, tone:'' }], createdBy:me.name, createdAt:t };
    const mins = Math.round((new Date(t) - new Date(f.foundDate + 'T' + f.foundTime)) / 60000);
    if (mins > CAR_CONFIG.analysis_start_minutes) late = r.lateMin = mins;
    RECS.unshift(r);
  } else r.audit.push({ act:'แก้ไขร่าง', by:me.name, at:t, tone:'' });
  const c = clone(Object.fromEntries(PREP_KEYS.map(k => [k, f[k]])));
  c.symptoms = c.symptoms.filter(s => s.text.trim()); c.attendees = c.attendees.map(x => x.trim()).filter(Boolean); c.docs = c.docs.map(x => x.trim()).filter(Boolean);
  const keep = x => Object.values(x).some(v => v && v !== 'system' && String(v).trim());
  Object.assign(r, c, { causes:Object.assign(r.causes || blankContent().causes, Object.fromEntries(GROUPS_PREP.map(g => [g, f.causes[g].filter(keep)]))),
    act:{ p:f.act.p.filter(keep), r:r.act ? r.act.r : [] }, actDue:{ p:clone(f.actDue.p), r:r.actDue ? r.actDue.r : { due:'', owner:'' } },
    fix:{ p:f.fix.p.filter(keep), r:r.fix ? r.fix.r : [] }, fixDue:{ p:clone(f.fixDue.p), r:r.fixDue ? r.fixDue.r : { due:'', owner:'' } },
    prev:{ p:f.prev.p.filter(keep), r:r.prev ? r.prev.r : [] }, doc3:r.doc3 || [], attachments:f.files.slice(), updatedBy:me.name, updatedAt:t });
  return [r, late];
}

function pushAudit(r, act, note, tone){ const me = ME(), t = nowIso(); r.audit.push({ act, by:me.name, at:t, note:note || '', tone:tone || '' }); r.updatedBy = me.name; r.updatedAt = t; }
/* ENG-NOTIFY (NTF_BRIEF_F-TMP-008): car_submitted_for_review · car_review_returned · car_cancelled — DOA engine เป็นเจ้าของ doa_pending/doa_result */
function confirmSubmit(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (!m.reviewer || m.slots.some(x => !x)){ m.err = true; render(); return; }
  const miss = submitMissing(r); if (miss.length){ showToast('ยังส่งตรวจสอบไม่ได้ — ขาด ' + miss[0], 'warning'); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    r.chain = resolveDoa(r.emp).map((c, i) => Object.assign(c, { assignee:m.slots[i], status:'waiting' }));   /* BR-DOA-02 resolve ตอนส่งแล้ว freeze */
    r.reviewer = m.reviewer; r.review = resolveReview(r.emp); r.status = 'in_review'; r.submittedAt = nowIso(); r.returned = null; pushAudit(r, 'ส่งตรวจสอบ', 'ถึง ' + empOf(m.reviewer).name);
    S.busy = false; closeModal(); render(); setTimeout(() => showToast('ส่งตรวจสอบแล้ว · ' + r.code, 'success'), 220); }, 600);
}
function confirmRvSign(){
  const m = S.md, r = findR(m.id); if (S.busy || !m.keys.length) return;
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    const t = nowIso(); m.keys.forEach(k => { const s = r.review[k]; if (s.assignee === S.me && !s.by){ s.by = S.me; s.at = t; pushAudit(r, 'ลงนามตรวจสอบ · ' + REVIEW_POINTS.find(p => p.key === k).label, '', 'ok'); } });
    S.busy = false; closeModal(); render(); setTimeout(() => showToast(`ลงนามตรวจสอบแล้ว ${m.keys.length} จุด · ${r.code}`, 'success'), 220); }, 500);
}
/* ส่งอนุมัติ: จุดลงนามตรวจสอบต้องครบ 7 จุด (DEC-04 · บล็อก) → ขั้น 1 ของสาย DOA ที่ freeze ไว้ */
function confirmSendApp(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (REVIEW_POINTS.some(p => !r.review[p.key].by)){ showToast('จุดลงนามตรวจสอบยังไม่ครบ', 'warning'); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    r.chain.forEach((c, i) => { c.status = i === 0 ? 'pending' : 'waiting'; }); r.status = 'pending'; r.sentAt = nowIso(); pushAudit(r, 'ส่งอนุมัติ', 'ถึง ' + empOf(r.chain[0].assignee).name);
    S.busy = false; closeModal(); render(); setTimeout(() => showToast('ส่งอนุมัติแล้ว · ' + r.code, 'success'), 220); }, 600);
}
/* อนุมัติครบ: ไม่เปลี่ยนค่าในระบบ · ไม่ส่งต่อระบบอื่น (DEC-01/02) */
function confirmApprove(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    const c = curStep(r); c.status = 'approved'; c.at = nowIso(); c.note = (m.note || '').trim();
    const next = r.chain.find(x => x.status === 'waiting'); if (next) next.status = 'pending';   /* sequential */
    r.status = next ? 'pending' : 'approved'; pushAudit(r, next ? 'อนุมัติ (ขั้น ' + c.step + ')' : 'อนุมัติ', c.note, 'ok');
    S.busy = false; closeModal(); render(); setTimeout(() => showToast('อนุมัติแล้ว · ' + r.code, 'success'), 220); }, 600);
}
/* ไม่อนุมัติ / ตีกลับ = กลับเป็นร่างเลขเดิม + ล้างจุดลงนามตรวจสอบ (DEC-25 · BR-DOA-03) · ยกเลิก = เหตุผลบังคับ */
function confirmReason(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (!(m.reason || '').trim()){ m.err = true; render(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    const why = m.reason.trim(), me = ME();
    if (m.kind === 'reject' || m.kind === 'return'){
      r.returned = { note:why, by:me.name, at:nowIso(), kind:m.kind === 'return' ? 'review' : 'doa' }; r.status = 'draft'; r.submittedAt = null; r.sentAt = null;
      r.chain = resolveDoa(r.emp); r.review = resolveReview(r.emp); r.reviewer = null; pushAudit(r, m.kind === 'return' ? 'ตีกลับเป็นร่าง' : 'ไม่อนุมัติ — กลับเป็นร่าง', why, 'bad'); }
    else { r.status = 'cancelled'; const c = curStep(r); if (c) c.status = 'skipped'; pushAudit(r, 'ยกเลิกเอกสาร', why, 'bad'); }
    S.busy = false; closeModal(); if (m.kind !== 'cancel' && S.dw && !canSee(r)) closeDrawer(true); render();
    setTimeout(() => showToast(m.kind === 'cancel' ? 'ยกเลิกเอกสารแล้ว · ' + r.code : 'ส่งกลับเป็นร่าง · ' + r.code, m.kind === 'cancel' ? 'info' : 'warning'), 220); }, 600);
}
