# unattended — AI-DEFAULT ทุกหมวด รอลูกค้ายืนยัน
# G1 ผลต่อระบบ — บันทึกการจัดชุดและหลักฐานการนำส่งเอกสาร ไม่เปลี่ยนค่าในระบบ ไม่ส่งต่อ · ชื่อโครงการ/ธุรกรรมกรอกเอง (FM-IVM-01 ยังไม่ลิงก์ในระบบ) · ระบบไม่ส่งเอกสารออกเอง (ผู้ใช้ส่งนอกระบบแล้วบันทึกหลักฐาน)
config_changes: []
post_to: []

# G2 สายอนุมัติ — dynamic · 2 ขั้นตามช่องลงชื่อบนกระดาษ (ผู้ตรวจสอบ = ผู้จัดการฝ่ายบริหารการลงทุน → role-line-manager · ผู้อนุมัติ / รับทราบ = รอง กก.ผจก./กก.ผจก. → role-gm) · ไม่มีวงเงินบนกระดาษ
doa: { required: true, mode: dynamic, default_steps: ["role-line-manager", "role-gm"], step_labels: ["ผู้ตรวจสอบ", "ผู้อนุมัติ / รับทราบ"], amount: none }

# G3 กติกา — ไม่มีค่าคงที่/สูตรบนกระดาษ · ตัวเลือกจาก data validation · ข้อมูลขัดกันชัดเจนบล็อก · ที่เหลือเตือน
calc:
  constants_from_config: true
  auto_compute: true
  over_limit: warn
  rules:
    - "ลำดับแถวทั้งสองตาราง ระบบรันให้ 1, 2, 3 … ต่อใบ"
    - "ต้องมีรายการตรวจสอบชุดเอกสารอย่างน้อย 1 แถวก่อนส่ง (บล็อกตอนส่ง)"
    - "แถวสถานะ ขาดเอกสาร หรือ มีข้อจำกัด ต้องมีหมายเหตุ (บล็อกตอนส่ง)"
    - "มีแถวสถานะ ขาดเอกสาร → เตือนก่อนส่ง (ไม่บล็อก)"
    - "ลำดับงาน: อนุมัติชุดเอกสารก่อนนำส่ง → หลังอนุมัติ ผู้จัดทำบันทึกหลักฐานการนำส่งได้โดยไม่ต้องอนุมัติซ้ำ (มีประวัติแก้ไข) → ปิดการนำส่ง"
    - "หลักฐานการนำส่ง: สถานะการรับ รับแล้ว ต้องมีหลักฐาน / ลิงก์ หรือไฟล์แนบ (บล็อก)"
    - "หลักฐานการนำส่ง: ช่องทาง อื่น ๆ หรือสถานะ ส่งไม่สำเร็จ / ยกเลิก ต้องมีหมายเหตุ (บล็อก)"
    - "หลักฐานการนำส่ง: วันที่ / เวลาในอนาคต บล็อก · ก่อนวันที่นำส่ง = เตือน"
    - "ปิดการนำส่งได้เมื่อมีแถวสถานะ รับแล้ว อย่างน้อย 1 แถว และไม่มีแถว รอยืนยัน (บล็อก)"

# G4 รายการซ้ำ — ไม่จำกัด · PDF ขั้นต่ำเท่ากระดาษ (รายการตรวจสอบ 10 แถว · หลักฐาน 15 แถว)
repeat: { max_rows: null }

# G5 ช่องตามกระดาษ — 1:1 ไม่เพิ่มช่อง
fidelity: { one_to_one: true, add_fields: [], merge_split: [] }

# G6 ลายเซ็น — แถวล่าง 1 ช่องต่อขั้น DOA + ผู้จัดทำ · ข้อความ "พิจารณาในระบบ" ไม่ใช้ภาพ
signature: { layout: row-bottom, per_doa_step: true, handwriting_image: false }

# G7 ไม่อนุมัติ / ส่งกลับ / ยกเลิก — กลับเป็นร่างเลขเดิม · ยกเลิกได้ เจ้าของ + admin role · ร่าง/รออนุมัติ · เหตุผลบังคับ
reject_cancel: { on_reject: draft, cancel_by: [owner, admin_role], cancel_states: [draft, pending], reason_required: true }

# G8 การมองเห็น — เจ้าของ · ผู้อนุมัติหลังส่ง · admin role ฝ่ายบริหารการลงทุนเห็นทั้งหมด
visibility: { owner: true, approver: after_submit, admin_role: all }

# G9 เลขที่ — เอกสารภายใน ออกตอนบันทึกครั้งแรก · รหัส IVMG (IVM + G = ฟอร์มลำดับ 07 · FM-IVM-07)
numbering: { issue_on: first_save, code: IVMG }

# G10 ของเสริม
extras: { attachments: true, copy: false, export_csv: true, announce: false }

extend: {}
fit: {}
