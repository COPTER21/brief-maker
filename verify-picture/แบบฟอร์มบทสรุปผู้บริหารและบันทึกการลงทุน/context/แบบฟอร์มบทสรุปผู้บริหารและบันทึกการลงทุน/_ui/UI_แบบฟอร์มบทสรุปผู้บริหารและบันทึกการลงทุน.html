/* ---------- wizard actions (soft update — ไม่ rebuild ระหว่างพิมพ์) ---------- */
function goStep(n){ S.dw.step = n; render(); }
function clearF(k){ if (S.dw.err && S.dw.err.f) delete S.dw.err.f[k]; const el = document.getElementById('fld-' + k); if (el) el.classList.remove('is-invalid'); }
function softSums(){
  const f = wf(), fake = { conds:f.conds.filter(condFilled) }, set = (id, t) => { const el = document.getElementById(id); if (el) el.textContent = t; };
  set('sumAmt', fmtAmt(f.project.amount) ? fmtAmt(f.project.amount) + ' บาท' : '—');
  set('sumMemo', MEMO_TOPICS.filter(t => String(f.memo[t[0]] || '').trim()).length + ' / ' + MEMO_TOPICS.length);
  set('sumCond', fake.conds.length ? 'ค้าง ' + openConds(fake).length + ' / ' + fake.conds.length + ' รายการ' : '—');
}
function setP(k, v){ wf().project[k] = v; dirty(); clearF(k); softSums(); }
function fmtAmtInput(el){ const v = fmtAmt(el.value); if (v){ el.value = v; wf().project.amount = v.replace(/,/g, ''); } }
function setM(k, v){ wf().memo[k] = v; dirty(); clearF('m_' + k); softSums(); }
function setProposer(v){ wf().project.proposer = v; dirty(); clearF('proposer'); }
function clearRow(i, k){ const e = S.dw.err && S.dw.err.rows && S.dw.err.rows[i]; if (e){ delete e[k]; if (!Object.keys(e).length) delete S.dw.err.rows[i]; if (!Object.keys(S.dw.err.rows).length) S.dw.err.rowMsg = ''; } }
function setCd(i, k, v){ wf().conds[i][k] = v; dirty(); clearRow(i, k); const el = document.querySelector(`[name="c${k === 'item' ? 'item' : 'rem'}-${i}"]`); if (el) el.classList.remove('is-bad'); softSums(); }
function setCdSt(i, v){ wf().conds[i].status = v; dirty(); clearRow(i, 'status'); if (isDone(v)){ clearRow(i, 'owner'); clearRow(i, 'due'); } render(); }
function setCdOwner(i, v){ wf().conds[i].owner = v; dirty(); clearRow(i, 'owner'); }
function addCond(){ wf().conds.push(blankCond()); dirty(); render(); requestAnimationFrame(() => { const el = document.querySelector(`[name="citem-${wf().conds.length - 1}"]`); if (el) el.focus(); }); }
function removeCond(i){ wf().conds.splice(i, 1); if (S.dw.err && S.dw.err.rows){ S.dw.err.rows = {}; S.dw.err.rowMsg = ''; } dirty(); render(); }
/* ตรวจตาม FORM_SPEC required + DEC-14 (วงเงินตัวเลข ≥ 0) + DEC-12 (แถวที่กรอกต้องมีรายการ + สถานะ) + DEC-13 (ยังไม่แล้วเสร็จ ต้องมีผู้รับผิดชอบ + กำหนดเสร็จ) */
function validateMain(){
  const f = wf(), p = f.project, err = { f:{}, rows:{} };
  if (!p.name.trim()) err.f.name = 1; if (!p.type.trim()) err.f.type = 1; if (!p.proposer) err.f.proposer = 1;
  const a = amtNum(p.amount); if (a == null || a < 0) err.f.amount = 1;
  MEMO_TOPICS.forEach(t => { if (t[2] && !String(f.memo[t[0]] || '').trim()) err.f['m_' + t[0]] = 1; });
  f.conds.forEach((x, i) => { if (!condFilled(x)) return; const e = {};
    if (!String(x.item || '').trim()) e.item = 1; if (!x.status) e.status = 1;
    if (x.status && !isDone(x.status)){ if (!x.owner) e.owner = 1; if (!x.due) e.due = 1; }
    if (Object.keys(e).length) err.rows[i] = e; });
  if (Object.keys(err.rows).length) err.rowMsg = 'แถวที่กรอกต้องมีรายการเอกสาร / เงื่อนไข และสถานะ · สถานะที่ยังไม่ "แล้วเสร็จ" ต้องมีผู้รับผิดชอบและกำหนดเสร็จ';
  const ok = !Object.keys(err.f).length && !err.rowMsg;
  S.dw.err = ok ? null : err; return ok;
}
function wizNext(){
  if (S.dw.step === 1 && !validateMain()){ render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.dw.step += 1; render();
}
function wizBack(){ S.dw.step = Math.max(1, S.dw.step - 1); render(); }
function pickFiles(inp){ const f = wf(); gateFiles(Array.from(inp.files || [])).forEach(x => f.files.push({ name:x.name, size:fmtSize(x.size) })); inp.value = ''; dirty(); render(); }
function removeFile(i){ wf().files.splice(i, 1); dirty(); render(); }
/* บันทึก = ENG-DOC-NUM.next('IVM') ออกเลขครั้งแรก (DEC-10) · ผู้จัดทำ/ตำแหน่ง/ฝ่าย snapshot ลงเอกสาร */
function persist(){
  const f = wf(), me = ME(), t = nowIso();
  let r = S.dw.editId ? findR(S.dw.editId) : null;
  if (!r){
    SEQ += 1;
    r = { id:'R' + SEQ, code:DOC.prefix + '-2569-' + String(SEQ).padStart(4, '0'), status:'draft', emp:S.me, pos:me.pos, dept:me.dept, docDate:TODAY, returned:null,
      chain:resolveDoa(S.me), doa_entry_ref:MOCK_DOA_RESOLVED.doa_entry_ref, attachments:[], audit:[{ act:'สร้างเอกสาร', by:me.name, at:t, tone:'' }], createdBy:me.name, createdAt:t };
    RECS.unshift(r);
  } else r.audit.push({ act:'แก้ไขร่าง', by:me.name, at:t, tone:'' });
  const tr = v => String(v || '').trim();
  const memo = {}; MEMO_TOPICS.forEach(t => { memo[t[0]] = tr(f.memo[t[0]]); });
  Object.assign(r, { project:{ name:tr(f.project.name), type:tr(f.project.type), proposer:f.project.proposer, amount:String(amtNum(f.project.amount)) }, memo,
    conds:f.conds.filter(condFilled).map(x => ({ item:tr(x.item), owner:x.owner || null, due:x.due || '', status:x.status, remark:tr(x.remark) })),
    attachments:f.files.slice(), updatedBy:me.name, updatedAt:t });
  return r;
}
function saveDraft(){ if (S.busy) return; if (!validateMain()){ S.dw.step = 1; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const r = persist(); S.busy = false; closeDrawer(true); setTimeout(() => showToast('บันทึกร่างแล้ว · ' + r.code, 'info'), 300); }, 500); }
function saveAndSubmit(){ if (S.busy) return; if (!validateMain()){ S.dw.step = 1; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const r = persist(); S.busy = false; closeDrawer(true); setTimeout(() => openSubmit(r.id), 300); }, 500); }

/* สรุปสั้นในหน้าต่างอนุมัติ — ข้อเสนอ · วงเงิน · ผลวิเคราะห์การเงิน · ข้อเสนอแนะ */
function memoBrief(r){ return `<div class="drawer-fields">${kv('ชื่อโครงการ', esc(r.project.name))}${kv('ข้อเสนอ / การตัดสินใจที่ต้องการ', txt(r.memo.decision))}${kv('วงเงินหรือมูลค่าโดยประมาณ', fmtAmt(r.project.amount) ? fmtAmt(r.project.amount) + ' บาท' : '—')}${kv('ผลการวิเคราะห์ทางการเงิน', txt(r.memo.finance))}${kv('ข้อเสนอแนะของฝ่ายพัฒนาธุรกิจ', txt(r.memo.reco))}</div>`; }
function modalShell(icon, tone, title, sub, body, foot){
  return `<div class="modal-header"><div class="modal-header-icon ${tone}"><i data-lucide="${icon}" class="w-4 h-4"></i></div><div><h3 class="modal-title">${title}</h3><p class="modal-subtitle">${sub}</p></div></div>
    ${body ? `<div class="modal-body">${body}</div>` : ''}<div class="modal-footer">${foot}</div>`;
}
const busyLabel = (icon, label) => S.busy ? '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>' : `<i data-lucide="${icon}" class="w-4 h-4"></i><span>${label}</span>`;
function presetChips(list, cur){ return `<div class="chip-row">${list.map(p => `<button type="button" class="chip ${cur === p ? 'is-on' : ''}" onclick="setReasonPreset(this.dataset.v)" data-v="${esc(p)}">${esc(p)}</button>`).join('')}</div>`; }
function renderModal(){
  const m = S.md; if (!m) return '';
  const r = m.id ? findR(m.id) : null;
  if ((m.kind === 'approve' || m.kind === 'reject') && !(r && curStep(r))) return '';   /* ปิดแล้ว (ระหว่าง fade) — สายถูกรีเซ็ต/จบแล้ว */
  if (m.kind === 'submit'){
    return modalShell('send', 'is-primary', 'ส่งบทสรุปผู้บริหารและบันทึกการลงทุน?', `${r.code} · ${esc(r.project.name)} · ${fmtAmt(r.project.amount) || '—'} บาท`,
      `${resolveDoa(r.emp).map((c, i) => `<div class="slot-row"><span class="slot-no num">${c.step}</span><span class="slot-role">${c.role}</span><div class="field ${m.err && !m.slots[i] ? 'is-invalid' : ''}" id="fSlot${i}">${searchSelectHTML('slot' + i, { placeholder:'เลือกผู้พิจารณา' })}<div class="field-error">กรุณาเลือกผู้พิจารณา</div>${i === 0 ? '<div class="slot-help">ค่าเริ่มต้นจากสายอนุมัติและผังองค์กร</div>' : ''}</div></div>`).join('')}
       <div class="drawer-fields mt-3">${kv('เงื่อนไขประกอบ', r.conds.length ? 'ค้าง ' + openConds(r).length + ' / ' + r.conds.length + ' รายการ' : '—')}${kv('เอกสารแนบ', r.attachments.length + ' ไฟล์')}</div>${openWarn(r)}`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="btnSubmit" onclick="confirmSubmit()" ${S.busy ? 'disabled' : ''}>${busyLabel('send', 'ส่งอนุมัติ')}</button>`);
  }
  if (m.kind === 'approve'){
    const c = curStep(r);
    return modalShell('check-circle-2', 'is-success', `ยืนยัน ${c.words[0]}?`, `${r.code} · ${esc(empOf(r.emp).name)} · ขั้น ${c.step} ${c.role}`,
      `${memoBrief(r)}${openWarn(r)}
       <div class="field mt-3"><label class="field-label">ความเห็น</label><textarea class="input" name="apNote" rows="2" placeholder="ไม่บังคับ" oninput="S.md.note=this.value">${esc(m.note || '')}</textarea></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-success" id="btnApprove" onclick="confirmApprove()" ${S.busy ? 'disabled' : ''}>${busyLabel('check', c.words[0])}</button>`);
  }
  if (m.kind === 'reject' || m.kind === 'cancel'){
    const rej = m.kind === 'reject', w = rej ? curStep(r).words[1] : 'ยกเลิกเอกสาร';
    return modalShell('x-circle', 'is-danger', rej ? w + '?' : 'ยกเลิกเอกสาร?', `${r.code} · ${esc(empOf(r.emp).name)}${rej ? ' · ใบจะกลับเป็นร่างให้ผู้จัดทำแก้แล้วส่งใหม่ (เลขเดิม)' : ''}`,
      `${presetChips(rej ? REJECT_PRESETS : CANCEL_PRESETS, m.preset)}
       <div class="field ${m.err ? 'is-invalid' : ''}" id="fReason"><label class="field-label">เหตุผล<span class="req">*</span></label><textarea class="input" name="reason" rows="3" placeholder="${rej ? 'แจ้งผู้จัดทำว่าต้องแก้อะไร' : 'เหตุผลที่ยกเลิก'}" oninput="S.md.reason=this.value; if(this.value.trim()) document.getElementById('fReason').classList.remove('is-invalid')">${esc(m.reason || '')}</textarea><div class="field-error">กรุณาระบุเหตุผล</div></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">${rej ? 'ยกเลิก' : 'ไม่ยกเลิก'}</button><button class="btn btn-danger" id="btnReason" onclick="confirmReason()" ${S.busy ? 'disabled' : ''}>${busyLabel('x-circle', w)}</button>`);
  }
  if (m.kind === 'discard'){
    return modalShell('alert-triangle', 'is-warning', 'ทิ้งข้อมูลที่กรอกไว้?', 'ข้อมูลในแบบฟอร์มนี้ยังไม่ได้บันทึก', '',
      `<button class="btn btn-ghost" onclick="closeModal()">กลับไปกรอกต่อ</button><button class="btn btn-danger" id="btnDiscard" onclick="closeModal(); closeDrawer(true)">ทิ้งข้อมูล</button>`);
  }
  return '';
}
function openModalCfg(cfg){ S.md = cfg; state.modal.open = true; render(); requestAnimationFrame(() => document.getElementById('modalBackdrop').classList.add('is-open')); }
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('is-open'); state.modal.open = false; setTimeout(() => { if (!state.modal.open) S.md = null; }, 200); }
function modalBackdropClick(){ if (S.md && (S.md.reason || S.md.note)) return; closeModal(); }
function setReasonPreset(v){ S.md.preset = v; S.md.reason = v + (S.md.reason && S.md.reason.indexOf(v) !== 0 ? ' — ' + S.md.reason : ''); S.md.err = false; render(); }
function openSubmit(id){ const r = findR(id); if (!r || r.status !== 'draft') return; openModalCfg({ kind:'submit', id, slots:resolveDoa(r.emp).map(c => c.assignee) }); }
function openApprove(id){ const r = findR(id), c = r && curStep(r);
  if (!c) return;
  openModalCfg({ kind:'approve', id, note:'' }); }
function openReject(id){ openModalCfg({ kind:'reject', id, reason:'' }); }
function openCancel(id){ closeRowMenu(); openModalCfg({ kind:'cancel', id, reason:'' }); }
function pushAudit(r, act, note, tone){ const me = ME(), t = nowIso(); r.audit.push({ act, by:me.name, at:t, note:note || '', tone:tone || '' }); r.updatedBy = me.name; r.updatedAt = t; }
/* ENG-NOTIFY (NTF_BRIEF_F-TMP-005): ivm_cancelled · ivm_approved_open_conditions (อนุมัติครบ + มีเงื่อนไขยังไม่ 'แล้วเสร็จ' → แจ้งผู้จัดทำ) — DOA engine เป็นเจ้าของ doa_pending/doa_result */
function confirmSubmit(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (m.slots.some(x => !x)){ m.err = true; render(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    r.chain = resolveDoa(r.emp).map((c, i) => Object.assign(c, { assignee:m.slots[i], status:i === 0 ? 'pending' : 'waiting' }));   /* BR-DOA-02 resolve ตอนส่งแล้ว freeze */
    r.status = 'pending'; r.submittedAt = nowIso(); r.returned = null; pushAudit(r, 'ส่งอนุมัติ', 'ถึง ' + empOf(m.slots[0]).name);
    S.busy = false; closeModal(); render(); setTimeout(() => showToast('ส่งอนุมัติแล้ว · ' + r.code, 'success'), 220); }, 600);
}
function confirmApprove(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    const c = curStep(r); c.status = 'approved'; c.at = nowIso(); c.note = (m.note || '').trim();
    const next = r.chain.find(x => x.status === 'waiting'); if (next) next.status = 'pending';   /* sequential — ครบทุกขั้นจึงอนุมัติแล้ว */
    r.status = next ? 'pending' : 'approved'; if (!next) r.approvedAt = c.at; pushAudit(r, c.words[0] + ' (ขั้น ' + c.step + ')', c.note, 'ok');
    S.busy = false; closeModal(); render(); setTimeout(() => showToast((next ? 'ส่งต่อขั้นถัดไปแล้ว · ' : 'อนุมัติ / รับทราบเรียบร้อย · ') + r.code, 'success'), 220); }, 600);
}
/* DEC-08 ไม่อนุมัติ/ไม่ผ่านการตรวจสอบ = กลับเป็นร่าง เลขเดิม (สายเดิมเก็บใน audit · resolve ใหม่ตอนส่งครั้งถัดไป) */
function confirmReason(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (!(m.reason || '').trim()){ m.err = true; render(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    const why = m.reason.trim();
    if (m.kind === 'reject'){ const c = curStep(r); r.returned = { by:S.me, at:nowIso(), why, step:c.role }; pushAudit(r, c.words[1] + ' — ส่งกลับเป็นร่าง (ขั้น ' + c.step + ')', why, 'bad'); r.status = 'draft'; r.chain = resolveDoa(r.emp); }
    else { r.status = 'cancelled'; const c = curStep(r); if (c) c.status = 'skipped'; pushAudit(r, 'ยกเลิกเอกสาร', why, 'bad'); }
    const rej = m.kind === 'reject'; S.busy = false; closeModal(); if (rej && !canSee(r) && S.dw) closeDrawer(true); render();
    setTimeout(() => showToast(rej ? 'ส่งกลับเป็นร่างแล้ว · ' + r.code : 'ยกเลิกเอกสารแล้ว · ' + r.code, rej ? 'warning' : 'info'), 220); }, 600);
}

/* =====================================================================
   RENDER + DRAWER
   ===================================================================== */
function render(){
  if (window.__bdOpen) bdClose(true);   /* Rule #114 render ใหม่ปิดปฏิทินก่อน */
  const snap = preserveRenderState();
  if (!S.booted){ S.booted = true; applyRoute(); }
  document.getElementById('page-content').innerHTML = renderPage();
  const dwEl = document.getElementById('drawer');
  if (S.dw){ const open = dwEl.classList.contains('is-open'); dwEl.className = S.dw.kind === 'wiz' ? 'drawer drawer-panel wide' : 'drawer drawer-panel'; dwEl.classList.toggle('is-open', open); dwEl.innerHTML = S.dw.kind === 'wiz' ? renderWizard() : renderViewDrawer(); }
  if (S.md){ const mEl = document.getElementById('modal'); mEl.className = 'modal' + (S.md.kind === 'submit' || S.md.kind === 'approve' ? ' is-lg' : ''); mEl.innerHTML = renderModal(); }
  updateShell(); initSelects(); renderIcons(); restoreRenderState(snap);
}
function initSelects(){
  if (document.querySelector('#ss-fst')){
    const mine = RECS.filter(canSee);
    initSearchSelect('fst', { options: Object.keys(DOC_ST).map(k => ({ value:k, label:DOC_ST[k][0], sub:mine.filter(r => r.status === k).length + ' รายการ', icon:'circle-dot' })), value:S.list.st === 'all' ? null : S.list.st, onSelect:v => setF('st', v || 'all') });
    initSearchSelect('fcnd', { options: COND_FILTER.map(s => ({ value:s.key, label:s.label, sub:mine.filter(r => condKey(r) === s.key).length + ' รายการ', icon:'list-checks' })), value:S.list.cnd === 'all' ? null : S.list.cnd, onSelect:v => setF('cnd', v || 'all') });
  }
  if (document.querySelector('#ss-fdept')) initSearchSelect('fdept', { options: DEPTS.map(d => ({ value:d, label:d, sub:EMP.filter(e => e.dept === d).length + ' คน', icon:'building-2' })), value:S.list.dept, onSelect:v => { S.list.dept = v; S.list.page = 1; render(); } });
  if (S.dw && S.dw.kind === 'wiz' && document.querySelector('#ss-pjProposer')){
    initSearchSelect('pjProposer', { options: EMP.map(e => ({ value:e.id, label:e.name, sub:e.pos + ' · ' + e.dept, icon:'user' })), value:wf().project.proposer || null, onSelect:v => setProposer(v) });
    wf().conds.forEach((x, i) => { if (document.querySelector('#ss-cdOwner' + i)) initSearchSelect('cdOwner' + i, { options: EMP.map(e => ({ value:e.id, label:e.name, sub:e.pos + ' · ' + e.dept, icon:'user' })), value:x.owner || null, onSelect:v => setCdOwner(i, v) }); });
  }
  if (S.md && S.md.kind === 'submit' && document.querySelector('#ss-slot0')){
    const r = findR(S.md.id), m = S.md;   /* BR-DOA-04 ผู้ขอพิจารณาใบตัวเองไม่ได้ */
    m.slots.forEach((v, i) => initSearchSelect('slot' + i, { options: EMP.filter(e => e.id !== r.emp).map(e => ({ value:e.id, label:e.name, sub:e.pos + ' · ' + e.dept, icon:'user' })), value:v,
      onSelect:x => { m.slots[i] = x; const f = document.querySelector('#fSlot' + i); if (f && x) f.classList.remove('is-invalid'); } }));
  }
}
function showDrawer(cfg, fromRoute){
  S.dw = cfg; state.drawer.open = true; render();
  requestAnimationFrame(() => { document.getElementById('drawerBackdrop').classList.add('is-open'); document.getElementById('drawer').classList.add('is-open'); });
  if (!fromRoute && cfg.kind === 'view') go(BASE + '/view/' + cfg.id);
}
function closeDrawer(force, fromRoute){
  if (!S.dw) return;
  if (!force && S.dw.kind === 'wiz' && S.dw.dirty){ openModalCfg({ kind:'discard' }); return; }
  document.getElementById('drawerBackdrop').classList.remove('is-open'); document.getElementById('drawer').classList.remove('is-open');
  state.drawer.open = false;
  setTimeout(() => { if (!state.drawer.open){ S.dw = null; document.getElementById('drawer').innerHTML = ''; } }, 280);
  if (!fromRoute) go(BASE);
}
function openView(id, tab){ closeRowMenu(); const r = findR(id); if (!r || !canSee(r)) return; if (S.dw && S.dw.kind === 'view'){ S.dw.id = id; S.dw.tab = tab || 'detail'; go(BASE + '/view/' + id); render(); return; } showDrawer({ kind:'view', id, tab:tab || 'detail' }); }
function setTab(t){ S.dw.tab = t; render(); }

const FILE_ACCEPT = '.pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg', FILE_RE = /\.(pdf|docx?|xlsx?|png|jpe?g)$/i, FILE_MAX_MB = 20;
const fmtSize = b => b >= 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
function gateFiles(list){
  const ok = [], bad = [];
  list.forEach(x => { if (!FILE_RE.test(x.name)) bad.push([x.name, 'ชนิดไฟล์ไม่รองรับ']); else if (x.size > FILE_MAX_MB * 1048576) bad.push([x.name, `ไฟล์ใหญ่เกินกำหนด (สูงสุด ${FILE_MAX_MB} MB)`]); else ok.push(x); });
  if (bad.length) showToast(bad.length === 1 ? `${bad[0][0]} — ${bad[0][1]}` : `แนบไม่ได้ ${bad.length} ไฟล์ — ชนิดไฟล์ไม่รองรับหรือใหญ่เกิน ${FILE_MAX_MB} MB`, 'error');
  if (ok.length && S.sim === 'upload_fail'){ S.sim = null; showToast('แนบไฟล์ไม่สำเร็จ กรุณาลองใหม่อีกครั้ง', 'error'); return []; }

}
