# unattended — AI-DEFAULT ทุกหมวด รอลูกค้ายืนยัน
# G1 ผลต่อระบบ — ทะเบียนห้องข้อมูล/ควบคุมเอกสาร ไม่เปลี่ยนค่าในระบบ ไม่ส่งต่อ · ไม่สร้างสิทธิจริงในไดรฟ์ (บันทึกเป็นทะเบียน) · ชื่อโครงการกรอกเอง (FM-IVM-01 ยังไม่ลิงก์ในระบบ)
config_changes: []
post_to: []

# G2 สายอนุมัติ — dynamic · 2 ขั้นตามช่องลงชื่อบนกระดาษ (ผู้ตรวจสอบ → ผู้อนุมัติ/รับทราบ) · ไม่มีวงเงินบนกระดาษ
doa: { required: true, mode: dynamic, default_steps: ["role-line-manager", "role-gm"], step_labels: ["ผู้ตรวจสอบ", "ผู้อนุมัติ / รับทราบ"], amount: none }

# G3 ค่าคงที่ / กติกา — มาตรฐานชื่อไฟล์ + โฟลเดอร์มาตรฐาน 8 โฟลเดอร์ อ่านจาก config (แสดงอ่านอย่างเดียว) · ไม่มีสูตร · เกินเกณฑ์เตือน ยกเว้นข้อมูลขัดกันชัดเจนบล็อก
calc:
  constants_from_config: true
  auto_compute: true
  over_limit: warn
  rules:
    - "มาตรฐานการตั้งชื่อไฟล์ (โครงสร้าง · รูปแบบวันที่ · รูปแบบฉบับ · สถานะ · ตัวอย่าง) อ่านจาก config FileNamingPolicy · แสดงอ่านอย่างเดียวในเอกสาร"
    - "ใบใหม่ตั้งต้นโครงสร้างโฟลเดอร์ 8 แถว 01–08 จาก config DataRoomPolicy.default_folders · แก้ชื่อ/เพิ่มแถวได้"
    - "รหัสเอกสาร D-nnn · รหัสการเปลี่ยนแปลง CH-nnn · ลำดับสิทธิ · เลขที่โฟลเดอร์ ระบบรันให้ต่อใบ"
    - "ฉบับเอกสารต้องเป็น Vnn (V01, V02 …) หรือ Final (บล็อก) · สถานะ ฉบับสมบูรณ์ แต่ฉบับไม่ใช่ Final → เตือน ไม่บล็อก"
    - "ระบบแสดงชื่อไฟล์ที่ควรเป็นตามมาตรฐานต่อแถวทะเบียนเอกสาร (วันที่ฉบับ_ชื่อเอกสาร_ฉบับ_สถานะ) · สถานะไทย→token: ฉบับทำงาน=Working · รอตรวจทาน/รออนุมัติ=Review · ฉบับสมบูรณ์=Final · ส่งภายนอก=External"
    - "การเปลี่ยนแปลงสถานะ นำไปใช้แล้ว ต้องมีวันที่มีผล (บล็อก) · วันที่มีผลก่อนวันที่ → เตือน ไม่บล็อก"
    - "วันที่ยกเลิกสิทธิต้องไม่ก่อนวันที่ให้สิทธิ (บล็อก) · สถานะสิทธิ หมดอายุ/ยกเลิก ต้องมีวันที่ยกเลิกสิทธิ (บล็อก)"
    - "ต้องมีโฟลเดอร์อย่างน้อย 1 แถว และทะเบียนเอกสารอย่างน้อย 1 แถวก่อนส่ง (บล็อกตอนส่ง) · การเปลี่ยนแปลง/สิทธิ ว่างได้"

# G4 รายการซ้ำ — ไม่จำกัด · PDF ขั้นต่ำเท่ากระดาษ (โฟลเดอร์ 8 · ทะเบียนเอกสาร 5 · การเปลี่ยนแปลง 5 · สิทธิ 5)
repeat: { max_rows: null }

# G5 ช่องตามกระดาษ — 1:1 ยกเว้นช่องระบุโครงการ (กระดาษไม่มี · anomaly)
fidelity: { one_to_one: true, add_fields: ["ชื่อโครงการ / ธุรกรรม (F01 · กระดาษไม่มีช่องระบุโครงการ)"], merge_split: [] }

# G6 ลายเซ็น — แถวล่าง 1 ช่องต่อขั้น DOA + ผู้จัดทำ · ข้อความ "พิจารณาในระบบ" ไม่ใช้ภาพ
signature: { layout: row-bottom, per_doa_step: true, handwriting_image: false }

# G7 ไม่อนุมัติ / ยกเลิก — กลับเป็นร่างเลขเดิม · ยกเลิกได้ เจ้าของ + admin role · ร่าง/รออนุมัติ · เหตุผลบังคับ
reject_cancel: { on_reject: draft, cancel_by: [owner, admin_role], cancel_states: [draft, pending], reason_required: true }

# G8 การมองเห็น — เจ้าของ · ผู้อนุมัติหลังส่ง · admin role ฝ่ายบริหารการลงทุนเห็นทั้งหมด
visibility: { owner: true, approver: after_submit, admin_role: all }

# G9 เลขที่ — เอกสารภายใน ออกตอนบันทึกครั้งแรก · รหัส IVMD (IVM + D = ฟอร์มลำดับ 04 · FM-IVM-04)
numbering: { issue_on: first_save, code: IVMD }

# G10 ของเสริม
extras: { attachments: true, copy: false, export_csv: true, announce: false }

extend: {}
fit: {}
