function portalMenu(trigger, menu){
  let host = document.getElementById('overlay-root');
  if(!host){ host = document.createElement('div'); host.id='overlay-root'; document.body.appendChild(host); }
  if(menu.parentElement !== host) host.appendChild(menu);
  menu.classList.add('menu-fixed');
  const r = trigger.getBoundingClientRect();
  const below = window.innerHeight - r.bottom - 12, above = r.top - 12;
  const h = Math.min(menu.scrollHeight || 320, 320);
  menu.style.left = r.left + 'px';
  menu.style.width = r.width + 'px';
  if(below < h && above > below){ menu.style.top='auto'; menu.style.bottom=(window.innerHeight-r.top+4)+'px';
    menu.style.maxHeight = Math.min(h, above)+'px'; }
  else { menu.style.bottom='auto'; menu.style.top=(r.bottom+4)+'px';
    menu.style.maxHeight = Math.min(h, Math.max(below,120))+'px'; }
  menu._trigger = trigger;
  const reposition = ()=>{ if(menu.classList.contains('open')) portalMenu(trigger, menu); };
  if(!menu._portalBound){ menu._portalBound = true;
    window.addEventListener('scroll', reposition, true);
    window.addEventListener('resize', reposition); }
}
function positionMenu(trigger,menu){const r=trigger.getBoundingClientRect();
  const below=window.innerHeight-r.bottom-12, above=r.top-12, h=Math.min(menu.scrollHeight,320);
  if(below<h && above>below){menu.classList.add('drop-up');menu.style.maxHeight=Math.min(h,above)+'px';}
  else{menu.classList.remove('drop-up');menu.style.maxHeight=Math.min(h,Math.max(below,120))+'px';}}
function openOverlay(menu,trigger){document.querySelectorAll('[data-overlay].open').forEach(m=>{if(m!==menu)closeOverlay(m);});
  menu.classList.add('open');menu._trigger=trigger;if(trigger)positionMenu(trigger,menu);}
function closeOverlay(menu){menu.classList.remove('open');if(menu._trigger)menu._trigger.focus();}
document.addEventListener('click',e=>{document.querySelectorAll('[data-overlay].open').forEach(m=>{
  if(!m.contains(e.target)&&!(m._trigger&&m._trigger.contains(e.target)))closeOverlay(m);});});
/* ===== END BASE-KIT UTILS ===== */
</script>

/* --- building blocks --- */
function personCell(code, sub2) {
  var e = empOf(code);
  return '<span class="tbl-person"><span class="emp-av">' + initials(e.n) + '</span><span class="emp-main">'
    + '<span class="emp-nm">' + esc(e.n) + '</span><span class="emp-mt">' + e.c + ' · ' + esc(sub2 || posOf(e.p)) + '</span></span></span>';
}
function empChip(code) {
  if (!code) return '<span class="text-mute-2">ยังไม่ได้เลือก</span>';
  var e = empOf(code);
  return '<span class="tbl-person"><span class="emp-av">' + initials(e.n) + '</span><span class="emp-main">'
    + '<span class="emp-nm">' + esc(e.n) + '</span><span class="emp-mt">' + esc(posOf(e.p)) + ' · ' + esc(deptOf(e.d)) + '</span></span></span>';
}
function tipI(t, side) { return '<span class="tip' + (side ? ' tip-' + side : '') + '" data-tip="' + esc(t) + '"><i data-lucide="info" class="w-3 h-3"></i></span>'; }
function cfgLink(fn, label) { return '<button type="button" class="link-cfg" onclick="' + fn + '"><i data-lucide="external-link" class="w-3 h-3"></i>' + label + '</button>'; }
function SEC(icon, title, right, body) {
  return '<div class="sec"><div class="sec-h"><i data-lucide="' + icon + '" class="w-4 h-4"></i><span>' + title + '</span>'
    + (right ? '<span class="sec-r">' + right + '</span>' : '') + '</div>' + body + '</div>';
}
function KV(k, v, tip) { return '<div><div class="kv-k">' + k + (tip ? ' ' + tipI(tip) : '') + '</div><div class="kv-v">' + v + '</div></div>'; }
function STEPH(icon, title, hint) {
  return '<div class="steph"><span class="sh-ic"><i data-lucide="' + icon + '" class="w-4 h-4"></i></span><div>'
    + '<div class="sh-t">' + title + '</div>' + (hint ? '<div class="sh-s">' + hint + '</div>' : '') + '</div></div>';
}
function FACT(k, v, s, cls, tip) {
  return '<div class="fact' + (cls ? ' ' + cls : '') + '"><div class="ft-k">' + k + (tip ? tipI(tip) : '') + '</div><div class="ft-v">' + v + '</div>'
    + (s ? '<div class="ft-s">' + s + '</div>' : '') + '</div>';
}
function empOptions(list) {
  return (list || EMP.map(function (e) { return e.c; })).map(function (c) {
    var e = empOf(c), w = ofbResolve(c);
    var tag = (w.ok && w.st === 'left') ? ' · อดีตพนักงาน' : '';
    return { value: e.c, label: e.n, sub: posOf(e.p) + ' · ' + deptOf(e.d) + tag, icon: 'user', right: '<span class="tnum">' + e.c + '</span>' };
  });
}
function optionsOf(arr, icon) {
  return arr.map(function (o) { return { value: o.c, label: o.n, sub: o.en || o.c, icon: icon || 'square-stack', right: '<span class="tnum">' + o.c + '</span>' }; });
}
var COMBOS = [];
function initCombos() { COMBOS.forEach(function (c) { if (document.getElementById('ss-input-' + c.key)) initSearchSelect(c.key, c.cfg); }); }

/* --- สถานะ + ความคืบหน้าลายเซ็น (คนละคอลัมน์กันเสมอ · #40/#103) --- */
function docPill(st) { var s = ST[st] || ST.draft; return '<span class="pill ' + s.p + '">' + s.n + '</span>'; }
function typePill(d) { return '<span class="pill pill-muted">' + typeOf(d.type) + '</span>'; }
function langPill(d) { return '<span class="pill pill-muted">' + (d.lang === 'th' ? 'ไทย' : 'อังกฤษ') + '</span>'; }
function renderSignProgress(d) {
  if (d.st === 'draft') return '<span class="signcell">—</span>';
  var g = signProgress(d), wait = d.st === 'pending';
  return '<span class="signcell"><span class="pgl' + (wait ? ' is-wait' : '') + '"><i style="width:' + g.pct + '%"></i></span>' + g.ok + '/' + g.tot + '</span>';
}
function salFlag(d) {
  return hasSalaryFigure(d)
    ? '<span class="fl f-warn"><i data-lucide="lock" class="w-3 h-3"></i>มีตัวเลขเงินเดือน</span>'
    : '<span class="fl f-mute"><i data-lucide="minus" class="w-3 h-3"></i>ไม่มีตัวเลขเงินเดือน</span>';
}
function docFlags(d, compact) {
  var out = [], w = ofbResolve(d.emp);
  if (d.sup) out.push('<span class="fl f-warn"><i data-lucide="replace" class="w-3 h-3"></i>แทนที่ ' + d.sup + '</span>');
  if (d.byd) out.push('<span class="fl f-mute"><i data-lucide="replace-all" class="w-3 h-3"></i>ถูกแทนที่ด้วย ' + d.byd + '</span>');
  if (d.ucf) out.push('<span class="fl f-warn"><i data-lucide="triangle-alert" class="w-3 h-3"></i>ต้นทางเปลี่ยน</span>');
  if (d.ob) out.push('<span class="fl f-mute"><i data-lucide="user-round-cog" class="w-3 h-3"></i>ยื่นแทน</span>');
  if (d.cs) out.push('<span class="fl f-ok"><i data-lucide="shield-check" class="w-3 h-3"></i>มีร่องรอยยินยอม</span>');
  if (w.ok && w.st === 'left') out.push('<span class="fl f-mute"><i data-lucide="user-round-x" class="w-3 h-3"></i>อดีตพนักงาน</span>');
  if (d.dupOf) out.push('<span class="fl f-warn"><i data-lucide="copy" class="w-3 h-3"></i>ขอซ้ำ</span>');
  if (d.copies > 1) out.push('<span class="fl f-mute"><i data-lucide="layers" class="w-3 h-3"></i>' + d.copies + ' ชุด</span>');
  if (d.st === 'approved' && days(d.app.slice(0, 10), TODAY) > 3) out.push('<span class="fl f-bad"><i data-lucide="clock-alert" class="w-3 h-3"></i>ค้างออก</span>');
  if (!out.length) return '<span class="flrow"><span class="fl f-mute">—</span></span>';
  if (!compact) return '<span class="flrow wrap">' + out.join('') + '</span>';
  var more = out.length > 2 ? '<span class="fl" title="' + (out.length - 2) + ' ป้ายเพิ่มเติม — เปิดใบเพื่อดูทั้งหมด">+' + (out.length - 2) + '</span>' : '';
  return '<span class="flrow">' + out.slice(0, 2).join('') + more + '</span>';
}
function overdue(d) { return d.st === 'approved' && d.app && days(d.app.slice(0, 10), TODAY) > 3; }

/* ============================================================
   RENDER
   ============================================================ */
function tabRows(tab) {
  if (tab === 'inbox') return myInbox();
  if (tab === 'register') return visibleCerts().filter(isIssued);
  if (tab === 'mine') return myCerts();
  return visibleCerts();
}
function tabCount(tab) {
  var r = tabRows(tab);
  if (tab === 'register') return r.length + ' ฉบับที่ออกแล้ว';
  if (tab === 'inbox') return r.length + ' ใบที่รอคุณตัดสิน';
  if (tab === 'mine') return r.length + ' รายการของคุณ';
  return r.length + ' รายการ · เปิดอยู่ ' + r.filter(isOpen).length;
}
function pageHeader(tab) {
  var mk = P().create
    ? '<button class="btn btn-secondary" onclick="doExport()"><i data-lucide="download" class="w-4 h-4"></i>ส่งออก CSV</button>'
      + '<button class="btn btn-primary" onclick="openCreate()"><i data-lucide="plus" class="w-4 h-4"></i>ขอหนังสือรับรอง</button>'
    : '<button class="btn btn-secondary" onclick="doExport()"><i data-lucide="download" class="w-4 h-4"></i>ส่งออก CSV</button>';
  var acts = { list: mk, inbox: '', register: '<button class="btn btn-secondary" onclick="doExport()"><i data-lucide="download" class="w-4 h-4"></i>ส่งออก CSV</button>', mine: mk };
  return '<div class="ph"><div><div class="ph-title-row"><h1 class="ph-title">หนังสือรับรอง</h1>'
    + '<span class="ph-count">' + tabCount(tab) + '</span></div>'
    + '<p class="ph-sub">คำขอหนังสือรับรองการทำงาน รับรองเงินเดือน และใบผ่านงาน — ผ่านสายอนุมัติที่ระบบคืนมา ตรึงข้อเท็จจริง ณ วันที่ออก แล้วออกเป็นเอกสารเลขที่เดียวที่พนักงานถือไปยื่นข้างนอก</p></div>'
    + '<div class="ph-actions">' + (acts[tab] || '') + '</div></div>';
}
function tabsHTML(tab) {
  var nIn = myInbox().length;
  var nMine = myCerts().length;
  return '<div class="tabs page-tabs">' + TABS.map(function (t) {
    var n = t.k === 'inbox' ? nIn : t.k === 'mine' ? nMine : 0;
    return '<button class="tab ' + (t.k === tab ? 'is-active' : '') + '" onclick="goTab(\'' + t.k + '\')">'
      + '<i data-lucide="' + t.i + '" class="w-4 h-4"></i>' + t.n + (n ? '<span class="tab-badge">' + n + '</span>' : '') + '</button>';
  }).join('') + '</div>';
}
function curTab() { var r = getRoute(); for (var i = 0; i < TABS.length; i++) if (r === TABS[i].r) return TABS[i].k; return 'list'; }
function goTab(k) { state.pagination.page = 1; state.selRow = null; location.hash = TAB_HASH[k] || TAB_HASH.list; }

function render() {
  var snap = preserveRenderState();
  var tab = curTab();
  state.tabKey = tab;
  COMBOS = [];
  var body = tab === 'inbox' ? viewInbox() : tab === 'register' ? viewRegister() : tab === 'mine' ? viewMine() : viewList();
  document.getElementById('page-content').innerHTML = pageHeader(tab) + tabsHTML(tab) + body;
  var dw = document.getElementById('drawer');
  var wide = !!(state.dw && state.dw.mode !== 'view');
  dw.className = 'drawer' + (wide ? ' wide' : '') + (dw.classList.contains('is-open') ? ' is-open' : '');
  dw.innerHTML = state.drawer.open && state.dw ? drawerHTML() : '';
  var mb = document.querySelector('#modalBackdrop .modal');
  mb.innerHTML = state.modal.open ? modalHTML() : '';
  renderIcons();
  initCombos();
  restoreRenderState(snap);
}
/* override ของ kit — กันเคส "ปิดแล้วเปิดใหม่ทันที" ที่ timer ปิดของตัวเก่ามาล้าง state ของตัวใหม่ */
var DW_SEQ = 0, MD_SEQ = 0;
function closeDrawer() {
  DW_SEQ++;
  var my = DW_SEQ;
  document.getElementById('drawerBackdrop').classList.remove('is-open');
  document.getElementById('drawer').classList.remove('is-open');
  setTimeout(function () {
    if (my !== DW_SEQ) return;
    state.drawer = { open: false, mode: null, recordId: null, step: 1 };
    state.dw = null; state.mf = null;
    render();
  }, 280);
}
function openModal(type, data) {
  MD_SEQ++;
  state.modal = { open: true, type: type, data: data };
  render();
  requestAnimationFrame(function () { document.getElementById('modalBackdrop').classList.add('is-open'); });
}
function closeModal() {
  MD_SEQ++;
  var my = MD_SEQ;
  document.getElementById('modalBackdrop').classList.remove('is-open');
  setTimeout(function () {
    if (my !== MD_SEQ) return;
    state.modal = { open: false, type: null, data: null };
    render();
  }, 200);
}
function openDW(mode, data, opt) {
  DW_SEQ++;
  opt = opt || {};
  state.drawer = { open: true, mode: mode, recordId: (data && data.id) || null, step: opt.step || 1 };
  state.dw = { mode: mode, data: data, tab: opt.tab || 'detail', err: {}, busy: false };
  render();
  requestAnimationFrame(function () {
    document.getElementById('drawerBackdrop').classList.add('is-open');
    document.getElementById('drawer').classList.add('is-open');
  });
}
function dwTab(t) { state.dw.tab = t; render(); }
function tabBtn(k, ic, n, cur) { return '<button class="tab ' + (cur === k ? 'is-active' : '') + '" onclick="dwTab(\'' + k + '\')"><i data-lucide="' + ic + '" class="w-4 h-4"></i>' + n + '</button>'; }
function setF(k, v) { state.f[k] = v; state.pagination.page = 1; state.selRow = null; render(); }
function resetF() { state.f = { q: '', ty: 'all', st: 'all', lg: 'all', from: '', to: '' }; state.pagination.page = 1; render(); showToast('ล้างตัวกรองแล้ว', 'info'); }
function goPage(n) { state.pagination.page = n; render(); }
function pager(total) {
  var ps = state.pagination.pageSize, pg = state.pagination.page, np = Math.max(1, Math.ceil(total / ps));
  if (np <= 1) return '';
  var out = '<div class="pagination">';
  out += '<button class="pg-btn ' + (pg === 1 ? 'is-disabled' : '') + '" ' + (pg === 1 ? 'disabled' : '') + ' onclick="goPage(' + (pg - 1) + ')"><i data-lucide="chevron-left" class="w-3 h-3"></i></button>';
  var from = Math.max(1, pg - 2), to = Math.min(np, from + 4);
  for (var i = from; i <= to; i++) out += '<button class="pg-btn ' + (i === pg ? 'is-active' : '') + '" onclick="goPage(' + i + ')">' + i + '</button>';
  out += '<button class="pg-btn ' + (pg === np ? 'is-disabled' : '') + '" ' + (pg === np ? 'disabled' : '') + ' onclick="goPage(' + (pg + 1) + ')"><i data-lucide="chevron-right" class="w-3 h-3"></i></button>';
  return out + '</div>';
}
/* empty state อยู่นอก <table> — ไม่สร้างแถวสูงผิดสเกลในตาราง (#40.1) */
function emptyBlock(title, desc) {
  return '<div class="scrollpad">' + emptyStateHTML({ icon: 'search-x', title: title, desc: desc }) + '</div>';
}
function doExport() {
  showToast('ส่งออกรายการ ' + filteredCerts().length + ' รายการเป็น CSV แล้ว — ไฟล์ที่ได้ไม่มีตัวเลขค่าจ้างไม่ว่าผู้ส่งออกจะเป็นใคร', 'success');
}
function openNotifyLog() { openModal('notify', {}); }
</script>
<script>
/* ============================================================
   LANDING — 4 tab ในหน้าเดียว (#104) · ตาราง lean แถว ≤52px · filter แถวเดียว (#40.1 · #103)
   ============================================================ */
function filteredCerts() {
  var f = state.f, q = (f.q || '').trim().toLowerCase();
  return visibleCerts().filter(function (d) {
    if (f.ty !== 'all' && d.type !== f.ty) return false;
    if (f.st !== 'all' && d.st !== f.st) return false;
    if (f.lg !== 'all' && d.lang !== f.lg) return false;
    if (f.from && (!d.iss || d.iss < f.from)) return false;
    if (f.to && (!d.iss || d.iss > f.to)) return false;
    if (!q) return true;
    var e = empOf(d.emp);
    return [d.no, d.vcode, e.n, e.en, e.c, d.rcp].some(function (x) { return String(x || '').toLowerCase().indexOf(q) >= 0; });
  }).sort(function (a, b) { return (b.sub || '') < (a.sub || '') ? -1 : 1; });
}
function filterRow(withDate) {
  var f = state.f;
  return '<div class="filter-row">'
    + '<div class="input-search"><i data-lucide="search" class="w-4 h-4"></i>'
    + '<input class="input" type="text" placeholder="ค้นเลขที่เอกสาร · รหัสตรวจสอบ · ชื่อ/รหัสพนักงาน · ปลายทาง" value="' + esc(f.q) + '" oninput="setF(\'q\',this.value)"></div>'
    + '<span class="fr-lb">ประเภท</span><select class="select" onchange="setF(\'ty\',this.value)">'
    + '<option value="all"' + (f.ty === 'all' ? ' selected' : '') + '>ทั้งหมด</option>'
    + CERT_TYPE.map(function (t) { return '<option value="' + t.c + '"' + (f.ty === t.c ? ' selected' : '') + '>' + t.n + '</option>'; }).join('') + '</select>'
    + '<span class="fr-lb">ภาษา</span><select class="select" onchange="setF(\'lg\',this.value)">'
    + '<option value="all"' + (f.lg === 'all' ? ' selected' : '') + '>ทั้งหมด</option>'
    + '<option value="th"' + (f.lg === 'th' ? ' selected' : '') + '>ไทย</option>'
    + '<option value="en"' + (f.lg === 'en' ? ' selected' : '') + '>อังกฤษ</option></select>'
    + '<span class="fr-lb">สถานะ</span><select class="select" onchange="setF(\'st\',this.value)">'
    + '<option value="all"' + (f.st === 'all' ? ' selected' : '') + '>ทั้งหมด</option>'
    + Object.keys(ST).map(function (k) { return '<option value="' + k + '"' + (f.st === k ? ' selected' : '') + '>' + ST[k].full + '</option>'; }).join('') + '</select>'
    + (withDate ? '<span class="fr-lb">ออกระหว่าง</span><input class="input dt" type="date" value="' + esc(f.from) + '" onchange="setF(\'from\',this.value)">'
      + '<span class="fr-lb">ถึง</span><input class="input dt" type="date" value="' + esc(f.to) + '" onchange="setF(\'to\',this.value)">' : '')
    + '<button class="btn btn-ghost mla" onclick="resetF()"><i data-lucide="rotate-ccw" class="w-4 h-4"></i>ล้างตัวกรอง</button>'
    + '</div>';
}
function statCard(label, value, meta, key, on) {
  return '<div class="stat' + (key ? ' is-click' : '') + (on ? ' is-on' : '') + '"' + (key ? ' onclick="' + key + '"' : '') + '>'
    + '<div class="stat-label">' + label + '</div><div class="stat-value">' + value + '</div>'
    + (meta ? '<div class="stat-meta">' + meta + '</div>' : '') + '</div>';
}

/* ---- tab 1 · คำขอทั้งหมด ---- */
function viewList() {
  var all = visibleCerts(), rows = filteredCerts();
  var ps = state.pagination.pageSize, pg = state.pagination.page;
  var page = rows.slice((pg - 1) * ps, pg * ps);
  var stats = '<div class="stats">'
    + statCard('รออนุมัติ', all.filter(function (d) { return d.st === 'pending'; }).length, 'ใบที่ยังไม่ครบสาย', 'setF(\'st\',\'pending\')', state.f.st === 'pending')
    + statCard('รอออกหนังสือ', all.filter(function (d) { return d.st === 'approved'; }).length, 'อนุมัติแล้ว ยังไม่ได้กดออก', 'setF(\'st\',\'approved\')', state.f.st === 'approved')
    + statCard('ค้างเกินกำหนด', all.filter(overdue).length, 'อนุมัติแล้วค้างเกิน 3 วันทำการ', '', false)
    + statCard('ออกแล้วในเดือนนี้', all.filter(function (d) { return d.iss && d.iss >= '2026-08-01'; }).length, 'นับตามวันที่ออกจริง', '', false)
    + '</div>';
  var body = page.length ? '<div class="table-wrap"><table class="table list-tbl"><thead><tr>'
    + '<th style="width:126px">เลขที่เอกสาร</th><th style="width:204px">พนักงาน</th><th style="width:104px">ประเภท</th><th style="width:62px">ภาษา</th>'
    + '<th style="width:196px">ยื่นต่อ</th><th style="width:94px">สถานะ</th><th style="width:80px">ลายเซ็น</th><th style="width:186px">ป้ายกำกับ</th>'
    + '<th style="width:90px">ทำอะไรได้</th></tr></thead><tbody>'

<script>
/* ============================================================
   WIZARD ขอหนังสือรับรอง — drawer 5 ขั้น (Pattern Q · #100 · #47)

   ============================================================ */
const WSTEPS = ['ผู้ขอและประเภท', 'รายละเอียดคำขอ', 'ข้อมูลที่จะปรากฏบนหนังสือ', 'ผู้อนุมัติ', 'ตรวจสอบและยืนยัน'];
function renderStepperItem(i, name) {

  var click = i < s ? ' onclick="goStep(' + i + ')" style="cursor:pointer"' : '';
  return '<div class="stepper-item ' + cls + '"' + click + '>'
    + '<div class="stepper-circle">' + (i < s ? '<i data-lucide="check" class="w-4 h-4"></i>' : i) + '</div>'
    + '<div class="stepper-label">' + name + '</div></div>';
}
function stepperHTML() {
  return '<div class="stepper">' + WSTEPS.map(function (n, i) { return renderStepperItem(i + 1, n); }).join('') + '</div>';
}
function mf() { return state.mf; }
function openCreate(opt) {

  state.mf = {
    mode: 'create', id: null, emp: opt.emp || (P().scope === 'own' ? P().emp : ''), type: opt.type || 'employment',
    lang: opt.lang || 'th', pp: opt.pp || '', ppn: '', rcp: opt.rcp || '', copies: 1, dl: 'DL-SELF', need: '',
    hist: false, tpl: 'TPL-CERT-TH', cs: false, csn: '', files: [], slots: [], dupAck: false, dupr: '',
    sup: opt.sup || '', rel: opt.rel || '', busy: false
  };
  openDW('create', null, { step: 1 });
  if (opt.rel) showToast('คัดลอกข้อมูลจากใบ ' + opt.rel + ' มาเป็นคำขอใหม่ — ใบใหม่จะได้เลขที่ของตัวเอง', 'info');
  if (opt.sup) showToast('ออกใหม่แทนฉบับ ' + opt.sup + ' — ใบใหม่เดินสายอนุมัติใหม่ทั้งสาย', 'info');
}
function openEdit(id) {

    copies: d.copies, dl: d.dl, need: d.need, hist: d.hist, tpl: d.tpl, cs: !!d.cs, csn: d.csn || '',

  };

}
function goStep(n) { state.drawer.step = n; render(); }
function setMF(k, v) { state.mf[k] = v; render(); }
function setType(v) { var f = mf(); f.type = v; f.slots = []; if (v !== 'salary') { f.cs = false; f.csn = ''; } render(); }
function setLang(v) { var f = mf(); f.lang = v; f.tpl = v === 'th' ? 'TPL-CERT-TH' : 'TPL-CERT-EN'; render(); }

function onBehalf(f) { return !!f.emp && f.emp !== P().emp; }
function needConsent(f) { return onBehalf(f) && draftDocSal(f); }
function draftDocSal(f) { for (var i = 0; i < CERT_TYPE.length; i++) if (CERT_TYPE[i].c === f.type) return !!CERT_TYPE[i].sal; return false; }
function draftDoc() {
  var f = mf() || { id: null, emp: '', type: 'employment', lang: 'th', pp: '', ppn: '', rcp: '', copies: 1, dl: 'DL-SELF', need: '', hist: false, tpl: 'TPL-CERT-TH', files: [], sup: '' };
  return {
    id: f.id || '__draft', no: f.id ? (certOf(f.id) || {}).no : null, emp: f.emp, type: f.type, lang: f.lang,
    pp: f.pp, ppn: f.ppn, rcp: f.rcp, copies: f.copies, dl: f.dl, need: f.need, hist: f.hist, tpl: f.tpl,
    by: P().emp, ob: onBehalf(f), cs: f.cs, csn: f.csn, st: 'draft', iss: null, att: f.files, sup: f.sup, vcode: null

}
/* ใบเดิมที่ยังรออนุมัติของ ประเภท+ภาษา เดียวกัน (S-06 · FN-12) */
function dupPending(f) {

}

function drawerHTML() { if (!state.dw) return ''; return state.dw.mode === 'view' ? viewDrawerHTML() : createDrawerHTML(); }
function createDrawerHTML() {
  if (!state.mf) return '';

  h += '<div class="drawer-stepper-band">' + stepperHTML() + '</div>';

  h += '<div class="drawer-footer">'
    + (s > 1 ? '<button class="btn btn-secondary" onclick="wizardBack()"><i data-lucide="chevron-left" class="w-4 h-4"></i>ย้อนกลับ</button>' : '')
    + '<div class="footer-spacer"></div><div class="dw-footer-right row-wrap">'

      : '<button class="btn btn-secondary" onclick="saveDraft()"><i data-lucide="save" class="w-4 h-4"></i>บันทึกแบบร่าง</button>'

}
/* ด่านที่ต้องผ่านตั้งแต่ตอนยื่น (ไม่ใช่ด่านตอนออกหนังสือ) */
function reqBad(d) {

function salCell(d, fx, canSee) {

/* ข้อความรับรองตายตัวตามสถานะการเป็นพนักงาน — ห้ามให้คนพิมพ์เอง (BR-16 · print-spec §4) */
function stateSentence(fx, lang) {
  if (!fx.est) return lang === 'th' ? 'ไม่พบรอบการเป็นพนักงาน' : 'No employment window found';
  if (lang === 'en') {
    if (fx.est === 'active') return 'remains employed by the Company as at the date of this certificate';
    if (fx.est === 'leaving') return 'is scheduled to complete employment on ' + dEN(fx.lwd);
    if (fx.est === 'left') return 'was employed by the Company from ' + dEN(fx.sd) + ' to ' + dEN(fx.lwd);
    return 'has not yet commenced employment';
  }
  if (fx.est === 'active') return 'ปัจจุบันยังคงปฏิบัติงานอยู่กับบริษัทฯ';
  if (fx.est === 'leaving') return 'ปฏิบัติงานอยู่ และมีกำหนดสิ้นสุดการปฏิบัติงานในวันที่ ' + dTH(fx.lwd);
  if (fx.est === 'left') return 'เคยปฏิบัติงานกับบริษัทฯ ระหว่างวันที่ ' + dTH(fx.sd) + ' ถึงวันที่ ' + dTH(fx.lwd);
  return 'ยังไม่ถึงวันเริ่มงาน';
}

/* ---------- STEP 4 · ผู้อนุมัติ (slot picker · จำนวน slot = ที่ระบบคืนมาจริง) ---------- */

      + '<div class="min0">' + searchSelectHTML(key, { placeholder: 'เลือกผู้อนุมัติ' })
      + (s.holders.length ? '' : '<div class="hint-inline">ไม่มีผู้มีคุณสมบัติอื่นนอกจากผู้ยื่นเอง — ผู้ขอเป็นผู้อนุมัติของตัวเองไม่ได้</div>')
      + '</div></div></div>';
  }).join(''));
  if (r.steps.some(function (s) { return !s.holders.length; })) {
    h += '<div class="note note-danger"><i data-lucide="octagon-x" class="w-4 h-4"></i><div class="min0">'
      + '<b>สายที่ได้มามีแต่ตัวผู้ยื่นเอง</b><div>ผู้ขอเป็นผู้อนุมัติของตัวเองไม่ได้ — ให้ทะเบียนสายอนุมัติชี้ไปยังผู้บังคับบัญชาเหนือขึ้นไปก่อน</div>'
      + '<div class="note-act">' + cfgLink('openDoa()', 'ตรวจที่ Policy Center › สายอนุมัติ') + '</div></div></div>';
  }
  return h + '</div>';
}

    + '<dt>จุดประสงค์ · ปลายทาง</dt><dd>' + esc(ppOf(f.pp) || '—') + (f.ppn ? ' · ' + esc(f.ppn) : '') + ' → ' + esc(f.rcp || '—') + '</dd>'

    + (f.files || []).map(function (x, i) {

        + '<button class="icon-btn mla" onclick="rmFile(' + i + ')"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>';

function addFile() {
  var f = mf(), n = (f.files || []).length + 1;
  f.files.push({ n: 'เอกสารแนบ-' + n + '.pdf', s: (120 + n * 17) + ' KB', by: P().emp, at: TODAY });
  render(); showToast('แนบไฟล์แล้ว', 'success');
}
function rmFile(i) { mf().files.splice(i, 1); render(); showToast('นำไฟล์ออกจากคำขอแล้ว', 'info'); }
function saveDraft() {
  var f = mf();
  if (!f.emp) { showToast('กรุณาเลือกพนักงานก่อน', 'error'); return; }
  if (f.mode === 'edit') {
    var d = certOf(f.id);
    ['emp', 'type', 'lang', 'pp', 'ppn', 'rcp', 'copies', 'dl', 'need', 'hist', 'tpl'].forEach(function (k) { d[k] = f[k]; });
    d.att = f.files.slice();
    pushAudit(d.id, 'save', 'บันทึกร่าง', P().n, TODAY + ' ' + nowHM(), '');
  } else {
    var id = 'N' + (CERTS.length + 1);
    CERTS.unshift({ id: id, no: null, st: 'draft', emp: f.emp, type: f.type, lang: f.lang, pp: f.pp, ppn: f.ppn, rcp: f.rcp, copies: f.copies, dl: f.dl, need: f.need, by: P().emp, ob: onBehalf(f), hist: f.hist, sub: null, app: null, iss: null, tpl: f.tpl, vcode: null, att: f.files.slice(), cs: f.cs, csn: f.csn, sup: f.sup });

  }

  showToast('บันทึกร่างแล้ว — ร่างยังไม่มีเลขที่เอกสารและแก้หรือลบได้', 'success');
}

<script>
/* ============================================================
   VIEW DRAWER — tabs ล็อกลำดับ: รายละเอียด › PDF › ลายเซ็น/อนุมัติ › ประวัติ (#101)
   เอกสารแนบเป็น section ใน "รายละเอียด" ไม่ใช่ tab แยก
   ============================================================ */
function openView(id, tab) { var d = certOf(id); if (!d) return; state.selRow = id; openDW('view', d, { tab: tab || 'detail' }); }
function openByNo(no) { var d = certByNo(no); if (d) { closeDrawer(); setTimeout(function () { openView(d.id); }, 300); } }
function curCert() { return certOf(state.drawer.recordId); }

function headerActions(d) {
  var a = [];
  if (d.st === 'draft') {
    if (canEdit(d)) a.push('<button class="btn btn-link text-danger" onclick="openModal(\'delDraft\',{id:\'' + d.id + '\'})">ลบร่าง</button>');

  } else if (d.st === 'pending') {
    if (d.by === P().emp || d.emp === P().emp) a.push('<button class="btn btn-link text-danger" onclick="openModal(\'cancel\',{id:\'' + d.id + '\'})">ยกเลิกคำขอ</button>');
    if (canActOn(d)) {
      a.push('<button class="btn btn-secondary text-danger" onclick="openModal(\'reject\',{id:\'' + d.id + '\'})"><i data-lucide="x" class="w-4 h-4"></i>ไม่อนุมัติ</button>');

  } else if (d.st === 'rejected') {

    a.push('<button class="btn btn-secondary" onclick="openModal(\'deliver\',{id:\'' + d.id + '\'})"><i data-lucide="hand-helping" class="w-4 h-4"></i>บันทึกการส่งมอบ</button>');

}

        + (s.note ? '<div class="tl-q">' + esc(s.note) + '</div>' : '')

    }).join('') : '<div class="cell-sub">สายอนุมัติจะถูกอ่านและแช่แข็งเมื่อกดส่งคำขอ</div>');
  h += SEC('pen-tool', 'ช่องลงนามบนหนังสือ', '', '<div class="kv c3">'
    + KV('ชื่อผู้ลงนาม', sg ? esc(nameOf(sg.by)) : '<span class="text-mute-2">ยังไม่มีผู้อนุมัติขั้นสุดท้าย</span>', 'ชื่อใต้ช่องลงนามคือผู้อนุมัติขั้นสุดท้ายที่เซ็นจริง ไม่ใช่ค่าคงที่')

    + '</div>'
    + '<div class="signprev"><div class="sp-box"><div class="sp-ln"></div>'
    + '<div class="sp-nm">' + esc(sg ? nameOf(sg.by) : 'ผู้มีอำนาจลงนาม') + '</div><div>' + esc(sg ? sg.rn : 'ผู้อนุมัติขั้นสุดท้าย') + '</div></div>'
    + '<div class="sp-box"><div class="sp-seal">ที่ว่างสำหรับตราประทับบริษัท</div><div>ตราประทับบริษัท</div></div></div>');
  if (canActOn(d)) {

      '<div class="row-wrap"><button class="btn btn-secondary text-danger" onclick="openModal(\'reject\',{id:\'' + d.id + '\'})"><i data-lucide="x" class="w-4 h-4"></i>ไม่อนุมัติ</button>'
      + '<button class="btn btn-primary" onclick="openModal(\'approve\',{id:\'' + d.id + '\'})"><i data-lucide="check" class="w-4 h-4"></i>อนุมัติ</button></div>'
      + '<div class="hint-inline">' + (hasSalaryFigure(d) ? 'ตัดสินจากประเภทหนังสือได้โดยไม่ต้องเปิดดูตัวเลขค่าจ้าง' : 'คำขอนี้ไม่มีตัวเลขค่าจ้างอยู่เลย') + '</div>');
  }

/* ---------- TAB 4 · ประวัติ (เขียนเพิ่มอย่างเดียว) ---------- */

      + acc.map(function (x) { return '<tr><td><span class="tnum">' + x.seq + '</span></td><td>' + esc(x.surf) + '</td><td>' + esc(x.who) + '</td><td><span class="tnum">' + dtTH(x.at) + '</span></td></tr>'; }).join('')

    + '</tbody></table></div>');
  return h;
}

<script>
/* ============================================================
   MODALS (Pattern D) — ออกหนังสือ · อนุมัติ · ไม่อนุมัติ · ยกเลิก · เพิกถอน · ออกใหม่แทน · ส่งมอบ
   ทุก modal เขียนประวัติแบบเพิ่มอย่างเดียว และแสดง toast หลังปิด (#46)
   ============================================================ */
const REASON_CFG = {
  reject: { ic: 'x-circle', t: 'ไม่อนุมัติคำขอ', btn: 'ยืนยันไม่อนุมัติ', cls: 'btn-danger', ph: 'ระบุเหตุผลที่ไม่อนุมัติ (บังคับ)', req: true, presets: ['จุดประสงค์ปลายทางไม่สอดคล้องกับประเภทหนังสือที่ขอ', 'ชื่อหน่วยงานปลายทางไม่ครบถ้วน', 'ยังไม่ได้รับความยินยอมจากพนักงาน'] },
  cancel: { ic: 'ban', t: 'ยกเลิกคำขอ', btn: 'ยืนยันยกเลิก', cls: 'btn-danger', ph: 'ระบุเหตุผล (ไม่บังคับ)', req: false, presets: ['เลื่อนกำหนดการยื่นเอกสาร', 'ปลายทางไม่ต้องการเอกสารแล้ว', 'ขอเปลี่ยนเป็นประเภทอื่น'] },
  revoke: { ic: 'shield-x', t: 'เพิกถอนหนังสือที่ออกไปแล้ว', btn: 'ยืนยันเพิกถอน', cls: 'btn-danger', ph: 'ระบุเหตุผลที่เพิกถอน (บังคับ)', req: true, presets: ['ออกให้ผิดคน', 'ระบุหน่วยงานปลายทางผิดฉบับ', 'ข้อมูลต้นทางที่ใช้ออกถูกยกเลิกภายหลัง'] },
  delDraft: { ic: 'trash-2', t: 'ลบร่างคำขอ', btn: 'ยืนยันลบร่าง', cls: 'btn-danger', ph: 'ระบุเหตุผล (ไม่บังคับ)', req: false, presets: ['สร้างซ้ำโดยไม่ตั้งใจ', 'ยังไม่ต้องการขอในรอบนี้'] }
};
function modalHTML() {
  var t = state.modal.type;
  if (t === 'notify') return notifyModal();
  var d = state.modal.data && certOf(state.modal.data.id);
  if (!d) return '';
  if (t === 'issue') return issueModal(d);
  if (t === 'approve') return approveModal(d);
  if (t === 'deliver') return deliverModal(d);
  if (t === 'reissue') return reissueModal(d);
  if (REASON_CFG[t]) return reasonModal(t, d);
  return '';
}
function issueModal(d) {
  var canSee = canSeeFull(d), g = gates(d, canSee), bad = g.filter(function (x) { return x.lv === 'bad'; }), fx = buildSnap(d, canSee);
  var h = '<div class="modal-header"><div class="modal-header-icon"><i data-lucide="file-check" class="w-5 h-5"></i></div>'
    + '<div class="min0"><div class="modal-title">ออกหนังสือ ' + esc(d.no) + '</div>'
    + '<div class="modal-subtitle">' + esc(nameOf(d.emp)) + ' · ' + esc(typeOf(d.type)) + ' · ' + esc(rendLabel(d)) + '</div></div></div>';
  h += '<div class="modal-body">'
    + '<div class="note note-warn"><i data-lucide="calendar-check" class="w-4 h-4"></i><span>วันที่ออกคือ <b>' + dTH(TODAY) + '</b> — ข้อเท็จจริงทุกก้อนถูกอ่านและตรึงด้วยวันที่นี้ และจะไม่เปลี่ยนอีกหลังกดออก</span></div>'
    + g.map(gateHTML).join('')
    + '<div class="rc-grid" style="margin-top:12px">'
    + '<div class="rc-row"><span class="k">ตำแหน่งที่จะพิมพ์</span><span class="v">' + esc(posOf(fx.p)) + '</span></div>'
    + '<div class="rc-row"><span class="k">หน่วยงานที่จะพิมพ์</span><span class="v">' + esc(deptOf(fx.d)) + '</span></div>'
    + '<div class="rc-row"><span class="k">วันเริ่มงาน</span><span class="v">' + (fx.sd ? dTH(fx.sd) : '—') + '</span></div>'
    + '<div class="rc-row"><span class="k">อายุงาน</span><span class="v">' + tenureTH(fx.ten) + '</span></div>'
    + '<div class="rc-row"><span class="k">จำนวนชุดที่จะพิมพ์</span><span class="v">' + d.copies + ' ชุด</span></div>'
    + '<div class="rc-row"><span class="k">ช่องทางรับ</span><span class="v">' + esc(dlOf(d.dl)) + '</span></div>'
    + '</div></div>';
  h += '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><div class="footer-spacer"></div>'
    + '<button class="btn btn-primary" ' + (bad.length ? 'disabled' : '') + ' onclick="doIssue(\'' + d.id + '\')"><i data-lucide="file-check" class="w-4 h-4"></i>ออกหนังสือและตรึงข้อมูล</button></div>';
  return h;
}
function approveModal(d) {
  var s = curStep(d), ch = chainOf(d);
  return '<div class="modal-header"><div class="modal-header-icon"><i data-lucide="check-circle" class="w-5 h-5"></i></div>'

    + '<div class="modal-body">'
    + '<div class="rc-grid">'
    + '<div class="rc-row"><span class="k">พนักงาน</span><span class="v">' + esc(nameOf(d.emp)) + '</span></div>'
    + '<div class="rc-row"><span class="k">ประเภท · ภาษา</span><span class="v">' + esc(typeOf(d.type)) + ' · ' + (d.lang === 'th' ? 'ไทย' : 'อังกฤษ') + '</span></div>'
    + '<div class="rc-row"><span class="k">ยื่นต่อ</span><span class="v">' + esc(d.rcp) + '</span></div>'

    + '</div>'
    + '<div class="field" style="margin-top:12px"><label class="field-label">ความเห็น (ไม่บังคับ)</label>'
    + '<textarea class="input ta-auto" rows="2" id="rs-note" placeholder="ความเห็นของผู้อนุมัติ — เก็บไว้ในประวัติ ไม่พิมพ์ลงบนหนังสือ"></textarea></div>'
    + (s.need_restricted ? '<div class="note note-warn"><i data-lucide="lock" class="w-4 h-4"></i><span>ขั้นนี้เป็นชั้นที่ยืนยันว่าข้อมูลค่าจ้างกำลังจะออกนอกองค์กรอย่างมีผู้รับผิดชอบ — ตัดสินได้โดยไม่ต้องเปิดดูตัวเลข</span></div>' : '')

    + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><div class="footer-spacer"></div>'
    + '<button class="btn btn-primary" onclick="doDeliver(\'' + d.id + '\')"><i data-lucide="hand-helping" class="w-4 h-4"></i>บันทึกการส่งมอบ</button></div>';
}
function reissueModal(d) {
  return '<div class="modal-header"><div class="modal-header-icon"><i data-lucide="replace" class="w-5 h-5"></i></div>'
    + '<div class="min0"><div class="modal-title">ออกใหม่แทนฉบับ ' + esc(d.no) + '</div>'
    + '<div class="modal-subtitle">' + esc(nameOf(d.emp)) + ' · ' + esc(typeOf(d.type)) + '</div></div></div>'
    + '<div class="modal-body">'
    + '<div class="note note-warn"><i data-lucide="hash" class="w-4 h-4"></i><span>ฉบับใหม่จะได้ <b>เลขที่ของตัวเอง</b> และอ้างถึง ' + esc(d.no) + ' · ฉบับเดิมเปลี่ยนเป็น “ถูกแทนที่” โดยเนื้อหาและไฟล์เดิมไม่ถูกแก้และไม่ถูกลบ</span></div>'
    + '<div class="field"><label class="field-label">เหตุผลที่ต้องออกใหม่ <span class="text-danger">*</span></label>'
    + '<textarea class="input ta-auto" rows="3" id="rs-note" placeholder="ระบุเหตุผล เช่น ปลายทางขอให้ระบุชื่อสำนักงานใหญ่ให้ครบ"></textarea>'
    + '<div class="chips">' + ['ปลายทางขอให้ระบุชื่อหน่วยงานให้ครบ', 'ข้อมูลต้นทางเปลี่ยนหลังออกหนังสือ', 'พนักงานขอเปลี่ยนจุดประสงค์ปลายทาง'].map(function (p) { return '<button class="chip-btn" onclick="fillReason(\'' + esc(p) + '\')">' + p + '</button>'; }).join('') + '</div></div>'
    + '<div class="rc-grid" style="margin-top:8px">'
    + '<div class="rc-row"><span class="k">สายอนุมัติของฉบับใหม่</span><span class="v">เดินใหม่ทั้งสาย</span></div>'
    + '<div class="rc-row"><span class="k">ไฟล์ฉบับเดิม</span><span class="v">ยังเปิดดูได้</span></div>'
    + '</div></div>'
    + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><div class="footer-spacer"></div>'
    + '<button class="btn btn-primary" onclick="doReissue(\'' + d.id + '\')"><i data-lucide="replace" class="w-4 h-4"></i>สร้างฉบับใหม่แทน</button></div>';
}
function reasonModal(kind, d) {
  var c = REASON_CFG[kind];
  return '<div class="modal-header"><div class="modal-header-icon"><i data-lucide="' + c.ic + '" class="w-5 h-5"></i></div>'
    + '<div class="min0"><div class="modal-title">' + c.t + '</div>'
    + '<div class="modal-subtitle">' + esc(d.no || 'ร่าง') + ' · ' + esc(nameOf(d.emp)) + ' · ' + esc(typeOf(d.type)) + '</div></div></div>'
    + '<div class="modal-body">'
    + (kind === 'reject' || kind === 'cancel' ? '<div class="note note-warn"><i data-lucide="hash" class="w-4 h-4"></i><span>เลขที่ ' + esc(d.no) + ' จะยังคงอยู่และไม่ถูกนำกลับมาใช้ซ้ำ — ขอใหม่ต้องเป็นใบใหม่เลขใหม่</span></div>' : '')
    + (kind === 'revoke' ? '<div class="note note-warn"><i data-lucide="file-lock" class="w-4 h-4"></i><span>ไฟล์ฉบับเดิมจะยังเปิดดูได้และไม่ถูกลบ — การเพิกถอนเปลี่ยนสถานะและบันทึกเหตุผลเท่านั้น</span></div>' : '')
    + (kind === 'delDraft' ? '<div class="note note-warn"><i data-lucide="trash-2" class="w-4 h-4"></i><span>ลบได้เฉพาะร่างที่ยังไม่มีเลขที่เอกสาร — ใบที่ออกเลขแล้วลบไม่ได้ทุกกรณี</span></div>' : '')
    + '<div class="field"><label class="field-label">เหตุผล ' + (c.req ? '<span class="text-danger">*</span>' : '') + '</label>'
    + '<textarea class="input ta-auto" rows="3" id="rs-note" placeholder="' + c.ph + '"></textarea>'
    + '<div class="chips">' + c.presets.map(function (p) { return '<button class="chip-btn" onclick="fillReason(\'' + esc(p) + '\')">' + p + '</button>'; }).join('') + '</div></div>'
    + '</div>'
    + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><div class="footer-spacer"></div>'
    + '<button class="btn ' + c.cls + '" onclick="doReason(\'' + kind + '\',\'' + d.id + '\')"><i data-lucide="' + c.ic + '" class="w-4 h-4"></i>' + c.btn + '</button></div>';
}
function fillReason(t) { var el = document.getElementById('rs-note'); if (el) { el.value = t; el.focus(); } }
function notifyModal() {
  return '<div class="modal-header"><div class="modal-header-icon"><i data-lucide="bell" class="w-5 h-5"></i></div>'
    + '<div class="min0"><div class="modal-title">การแจ้งเตือนและสัญญาณที่ออกจากหนังสือรับรอง</div>'
    + '<div class="modal-subtitle">แจ้งเตือน ' + NOTIFY_LOG.length + ' รายการ · สัญญาณความปลอดภัย ' + CSQ_LOG.length + ' รายการ</div></div></div>'
    + '<div class="modal-body">'
    + '<div class="kv-k" style="margin-bottom:6px">แจ้งเตือนถึงคนในองค์กร</div>'
    + (NOTIFY_LOG.length ? NOTIFY_LOG.slice(0, 14).map(function (n) {
      return '<div class="dsrow"><i data-lucide="bell" class="w-4 h-4"></i><div class="min0"><div class="ds-n">' + esc(n.msg) + '</div>'
        + '<div class="ds-m">' + esc(n.ev) + ' · ถึง ' + esc(n.to) + ' · ' + dtTH(n.at) + '</div></div></div>';
    }).join('') : '<div class="cell-sub">ยังไม่มีการแจ้งเตือน</div>')
    + '<div class="kv-k" style="margin:14px 0 6px">สัญญาณเข้าท่อความปลอดภัยของข้อมูล</div>'
    + (CSQ_LOG.length ? CSQ_LOG.slice(0, 14).map(function (n) {
      return '<div class="dsrow"><i data-lucide="shield" class="w-4 h-4"></i><div class="min0"><div class="ds-n">' + esc(n.ev) + ' · ' + esc(n.no) + '</div>'
        + '<div class="ds-m">' + esc(n.why) + ' · ' + dtTH(n.at) + '</div></div>'
        + '<span class="mla famtag">' + esc(n.pipe) + '</span></div>';
    }).join('') : '<div class="cell-sub">ยังไม่มีสัญญาณ</div>')
    + '</div>'
    + '<div class="modal-footer"><div class="footer-spacer"></div><button class="btn btn-secondary" onclick="closeModal()">ปิด</button></div>';
}
</script>
<script>
/* ============================================================
   ACTIONS — ทุกการกระทำเขียนประวัติแบบเพิ่มอย่างเดียว · ไม่มีการลบใบที่มีเลขที่แล้ว (BR-22)
   ============================================================ */
function doSubmit() {
  var f = mf(), d0 = draftDoc();
  if (submitBlocked(f, d0)) { showToast('ยังส่งไม่ได้ — ตรวจข้อมูลที่ยังไม่ครบในขั้นก่อนหน้า', 'error'); return; }
  f.busy = true; render();
  setTimeout(function () {
    var d;
    if (f.mode === 'edit' && certOf(f.id)) {
      d = certOf(f.id);
      ['emp', 'type', 'lang', 'pp', 'ppn', 'rcp', 'copies', 'dl', 'need', 'hist', 'tpl'].forEach(function (k) { d[k] = f[k]; });
      d.att = f.files.slice();
    } else {
      d = { id: 'N' + (CERTS.length + 1) + '-' + Date.now().toString().slice(-4), no: null, st: 'draft', emp: f.emp, type: f.type, lang: f.lang, pp: f.pp, ppn: f.ppn, rcp: f.rcp, copies: f.copies, dl: f.dl, need: f.need, by: P().emp, ob: onBehalf(f), hist: f.hist, sub: null, app: null, iss: null, tpl: f.tpl, vcode: null, att: f.files.slice(), sup: f.sup || '' };
      CERTS.unshift(d);
      pushAudit(d.id, 'file-plus', 'สร้างคำขอ', P().n, TODAY + ' ' + nowHM(), f.rel ? 'คัดลอกข้อมูลจากใบ ' + f.rel : '');
    }
    d.cs = f.cs; d.csn = f.csn; d.obw = d.ob ? (d.obw || 'ฝ่ายบุคคลยื่นแทนพนักงาน') : '';
    if (f.dupAck) { d.dupOf = dupPending(f) ? dupPending(f).no : ''; d.dupr = f.dupr; }
    /* เลขที่เอกสารออกที่จุดนี้เท่านั้น และเปลี่ยนไม่ได้อีกเลย (BR-01 · BR-02) */
    if (!d.no) d.no = docNumNext();
    d.st = 'pending';
    d.sub = TODAY + ' ' + nowHM();
    freezeChain(d, f.slots);
    pushAudit(d.id, 'send', 'ส่งคำขอ · ได้เลขที่ ' + d.no, P().n, d.sub, 'ชุดกฎสายอนุมัติ ' + d.act + ' · ' + chainOf(d).length + ' ขั้น');
    if (d.cs) pushAudit(d.id, 'shield-check', 'บันทึกร่องรอยความยินยอม', P().n, d.sub, d.csn);
    if (d.dupOf) pushAudit(d.id, 'copy', 'ยืนยันขอใหม่ทั้งที่มีใบเดิมอยู่', P().n, d.sub, 'ใบเดิม ' + d.dupOf + ' — เหตุผล: ' + d.dupr);
    notify('cert_requested', d, 'คำขอหนังสือรับรอง ' + d.no + ' ของ ' + nameOf(d.emp) + ' รอการอนุมัติ', 'ผู้อนุมัติในสาย + ฝ่ายบุคคล');
    f.busy = false;
    closeDrawer();
    setTimeout(function () { showToast('ส่งคำขอแล้ว — ได้เลขที่ ' + d.no + ' ซึ่งจะไม่เปลี่ยนอีกตลอดชีวิตใบ', 'success'); }, 320);
  }, 420);
}
function doApprove(id) {
  var d = certOf(id), s = curStep(d);
  if (!s) { closeModal(); return; }
  var note = (document.getElementById('rs-note') || {}).value || '';
  s.at = TODAY + ' ' + nowHM(); s.by = P().emp; s.note = note;
  pushAudit(d.id, 'check', 'อนุมัติขั้น ' + s.i + ' · ' + s.rn, P().n, s.at, note);
  var done = !curStep(d);
  if (done) {
    d.st = 'approved'; d.app = TODAY + ' ' + nowHM();
    notify('cert_approved', d, 'คำขอ ' + d.no + ' ได้รับอนุมัติแล้ว — อยู่ระหว่างจัดทำหนังสือ', 'ผู้ขอ + ฝ่ายบุคคล');
  }
  closeModal();
  setTimeout(function () { showToast(done ? 'อนุมัติครบสายแล้ว — ยังไม่ใช่หนังสือ ต้องกดออกหนังสือเพื่อตรึงข้อเท็จจริง' : 'อนุมัติขั้นที่ ' + s.i + ' แล้ว — ส่งต่อขั้นถัดไป', 'success'); }, 220);
}
function doReason(kind, id) {
  var d = certOf(id), c = REASON_CFG[kind];
  var note = ((document.getElementById('rs-note') || {}).value || '').trim();
  if (c.req && !note) { showToast('กรุณาระบุเหตุผลก่อน', 'error'); return; }
  if (kind === 'reject') {
    d.st = 'rejected'; d.rjr = note;
    pushAudit(d.id, 'x', 'ไม่อนุมัติ', P().n, TODAY + ' ' + nowHM(), note);
    notify('cert_rejected', d, 'คำขอ ' + d.no + ' ไม่ได้รับอนุมัติ — เหตุผล: ' + note, 'ผู้ขอ');
  } else if (kind === 'cancel') {
    d.st = 'cancelled'; d.cnr = note;
    pushAudit(d.id, 'ban', 'ผู้ขอยกเลิกคำขอ', P().n, TODAY + ' ' + nowHM(), note);
  } else if (kind === 'revoke') {
    d.st = 'revoked'; d.rvr = note; d.rvby = P().emp; d.rvat = TODAY + ' ' + nowHM();
    pushAudit(d.id, 'shield-x', 'เพิกถอนหนังสือ', P().n, d.rvat, note);
    docStore(d, 'revoked');
    notify('cert_revoked', d, 'หนังสือรับรอง ' + d.no + ' ถูกเพิกถอน — เหตุผล: ' + note, 'ผู้ขอ + ฝ่ายบุคคล');
    csq('cert.revoked', d, 'เอกสารที่ประกาศออกไปแล้วถูกยกเลิกความน่าเชื่อถือ');
  } else if (kind === 'delDraft') {
    var i = CERTS.indexOf(d);
    if (d.no) { showToast('ใบที่มีเลขที่เอกสารแล้วลบไม่ได้', 'error'); return; }
    if (i >= 0) CERTS.splice(i, 1);
    closeModal();
    setTimeout(function () { closeDrawer(); showToast('ลบร่างแล้ว — ลบได้เฉพาะร่างที่ยังไม่มีเลขที่เอกสาร', 'success'); }, 210);
    return;
  }
  closeModal();
  setTimeout(function () { showToast(c.t + 'เรียบร้อย — บันทึกไว้ในประวัติแล้ว', kind === 'cancel' ? 'info' : 'success'); }, 220);
}
/* ⭐ T-06 จุดตรึงข้อเท็จจริง — อ่านต้นทางทั้ง 4 ด้วยวันที่ออก แล้วแช่แข็ง (BR-09 · BR-13 · BR-23) */
function doIssue(id) {
  var d = certOf(id), canSee = canSeeFull(d) || P().restricted;
  var bad = gateBad(d, canSee);
  if (bad.length) {
    if (bad.some(function (x) { return x.k === 'masked'; })) csq('cert.issue_blocked_masked', d, 'ผู้ออกไม่มีสิทธิ์เห็นข้อมูลค่าจ้างแต่พยายามออกหนังสือประเภทรับรองเงินเดือน');
    showToast('ออกหนังสือไม่ได้ — ' + bad[0].t, 'error');
    return;
  }
  d.iss = TODAY;
  d.snap = buildSnap(d, true);
  d.vcode = vcodeNext();
  d.tplver = tplOf(d.tpl).ver;
  d.st = 'issued';
  pushAudit(d.id, 'file-check', 'ออกหนังสือ · ตรึงข้อเท็จจริง ณ ' + dTH(d.iss), P().n, TODAY + ' ' + nowHM(), 'รหัสตรวจสอบ ' + d.vcode + ' · แม่แบบ ' + tplOf(d.tpl).ver);
  docStore(d, 'issued');
  notify('cert_issued', d, 'หนังสือรับรอง ' + d.no + ' ออกให้เรียบร้อยแล้ว', 'ผู้ขอ');
  if (d.dl === 'DL-HR') notify('cert_ready_for_pickup', d, 'หนังสือรับรอง ' + d.no + ' พร้อมให้รับที่ฝ่ายบุคคล (' + ORG.place_th + ')', 'ผู้ขอ');
  csq('cert.issued', d, 'ข้อมูลบุคคลออกนอกองค์กร · ปลายทาง ' + d.rcp + (hasSalaryFigure(d) ? ' · มีตัวเลขค่าจ้าง' : ''));
  closeModal();
  setTimeout(function () {
    openView(d.id, 'pdf');
    showToast('ออกหนังสือ ' + d.no + ' แล้ว — เนื้อหาถูกตรึง ณ ' + dTH(d.iss) + ' และไม่เปลี่ยนอีกแม้ต้นทางจะเปลี่ยน', 'success');
  }, 240);
}
function doDeliver(id) {
  var d = certOf(id);
  var ch = (document.getElementById('dl-ch') || {}).value || d.dl;
  d.st = 'delivered';
  accessLog(d, 'ส่งมอบ · ' + dlOf(ch));
  pushAudit(d.id, 'hand-helping', 'ส่งมอบ · ' + dlOf(ch), P().n, TODAY + ' ' + nowHM(), 'ครั้งที่ ' + dlCount(d));
  docStore(d, 'sent_external');
  csq('cert.delivered_external', d, 'เอกสารออกจากมือองค์กร · ช่องทาง ' + dlOf(ch));
  closeModal();
  setTimeout(function () { showToast('บันทึกการส่งมอบแล้ว — ผู้รับคือพนักงานเจ้าของหนังสือเท่านั้น', 'success'); }, 220);
}
function doReissue(id) {
  var old = certOf(id);
  var note = ((document.getElementById('rs-note') || {}).value || '').trim();
  if (!note) { showToast('กรุณาระบุเหตุผลที่ต้องออกใหม่', 'error'); return; }
  closeModal();
  setTimeout(function () {
    old.st = 'superseded';
    pushAudit(old.id, 'replace', 'ถูกแทนที่ (กำลังสร้างฉบับใหม่)', P().n, TODAY + ' ' + nowHM(), note);
    docStore(old, 'superseded');
    openCreate({ emp: old.emp, type: old.type, lang: old.lang, pp: old.pp, rcp: old.rcp, sup: old.no });
    var f = mf(); f.copies = old.copies; f.dl = old.dl; f.hist = old.hist; f.tpl = old.tpl;
    state.drawer.step = 4; render();
  }, 240);
}
function downloadPdf(id) {
  var d = certOf(id) || curCert();
  if (!d) return;
  if (d.st === 'revoked') { showToast('ฉบับนี้ถูกเพิกถอนแล้ว — เปิดดูได้เพื่อการตรวจสอบ แต่ไม่ควรนำไปยื่นต่อ', 'warning'); }
  accessLog(d, 'ดาวน์โหลดไฟล์');
  pushAudit(d.id, 'download', 'ดาวน์โหลดไฟล์', P().n, TODAY + ' ' + nowHM(), 'ครั้งที่ ' + dlCount(d) + ' · หน้าตาไฟล์ ' + rendition(d));
  if (hasSalaryFigure(d)) csq('cert.restricted_viewed', d, 'เปิดไฟล์ที่มีตัวเลขค่าจ้าง · ผู้เปิด ' + P().n);
  csq('cert.delivered_external', d, 'ไฟล์ถูกดาวน์โหลดออกไป · ครั้งที่ ' + dlCount(d));
  if (d.st === 'issued') { d.st = 'delivered'; docStore(d, 'sent_external'); }
  render();
  showToast('ดาวน์โหลด ' + d.no + ' (' + rendLabel(d) + ') — บันทึกร่องรอยการเข้าถึงแล้ว', 'success');
}
function printCopies(id) {
  var d = certOf(id);
  accessLog(d, 'พิมพ์ ' + d.copies + ' ชุด');
  pushAudit(d.id, 'printer', 'พิมพ์หนังสือ ' + d.copies + ' ชุด', P().n, TODAY + ' ' + nowHM(), 'ทุกชุดใช้เลขที่ ' + d.no + ' และเนื้อหาเดียวกัน');
  if (hasSalaryFigure(d)) csq('cert.restricted_viewed', d, 'พิมพ์ไฟล์ที่มีตัวเลขค่าจ้าง · ผู้พิมพ์ ' + P().n);
  render();
  showToast('สั่งพิมพ์ ' + d.copies + ' ชุด — ทุกชุดใช้เลขที่ ' + d.no + ' และเนื้อหาเดียวกัน', 'success');
}
/* จำลองเหตุการณ์จากต้นทางหลังหนังสือออกไปแล้ว — ติดธง ไม่แก้เนื้อหา ไม่เปลี่ยนสถานะ (BR-19 · T-11) */
function simUpstream(id) {
  var d = certOf(id);
  d.ucf = { at: TODAY + ' ' + nowHM(), ev: 'รอบออกงานถูกยกเลิกที่ต้นทาง', what: 'วันสุดท้ายของการปฏิบัติงานถูกยกเลิก — ข้อมูลบนหนังสือฉบับนี้ยังเป็นค่าของวันที่ออก' };
  pushAudit(d.id, 'triangle-alert', 'ข้อมูลต้นทางเปลี่ยนหลังออกหนังสือ', 'ระบบต้นทาง', d.ucf.at, d.ucf.ev + ' — เนื้อหาของหนังสือไม่เปลี่ยน');
  render();
  showToast('ติดธง “ข้อมูลต้นทางเปลี่ยนหลังออกหนังสือ” แล้ว — เนื้อหาและสถานะของหนังสือไม่ถูกแตะ', 'warning');
}
</script>
<script>
