ng:24px 0; }\n  .doc-page{\n    width:var(--page-w); min-height:var(--page-h);\n    margin:0 auto 24px; padding:var(--page-margin);\n    background:#fff; box-shadow:0 4px 24px rgba(11,29,58,.18);\n  }\n}\n@media print{\n  .doc-page{ width:auto; min-height:var(--content-h); padding:0; box-shadow:none; }\n}\n\n/* ============================================================\n   1. HEADER — thin rule, lighter type\n   ============================================================ */\n.doc-head{\n  display:flex; justify-content:space-between; align-items:flex-start;\n  gap:12mm; padding-top:1.5mm; padding-bottom:6px; border-bottom:1.5px solid var(--c-navy);\n}\n.doc-head__brand{ display:flex; gap:9px; align-items:flex-start; }\n.doc-logo{ width:46px; height:46px; flex:0 0 auto; border-radius:7px; object-fit:contain; }\n.doc-logo--ph{\n  display:flex; align-items:center; justify-content:center;\n  background:linear-gradient(135deg,var(--c-navy),var(--c-teal));\n  color:#fff; font-weight:700; font-size:15pt; letter-spacing:.03em;\n}\n.doc-org__name{ font-size:11.5pt; font-weight:700; color:var(--c-navy); line-height:1.5; }\n.doc-org__line{ font-size:7.8pt; color:var(--c-mute); line-height:1.35; }\n.doc-org__tax{ font-size:7.8pt; color:var(--c-mute-2); margin-top:1px; }\n\n.doc-head__title{ text-align:right; flex:0 0 auto; min-width:54mm; }\n.doc-title{ font-size:15pt; font-weight:700; color:var(--c-navy); line-height:1.45; }\n.doc-title__en{ font-size:7.5pt; font-weight:500; color:var(--c-mute-2); letter-spacing:.08em; text-transform:uppercase; }\n.doc-copy{ display:inline-block; margin-top:3px; padding:0 8px; border:1px solid var(--c-line);\n  border-radius:999px; font-size:7pt; font-weight:500; color:var(--c-mute); }\n\n/* ============================================================\n   2. META STRIP\n   ============================================================ */\n.doc-meta{ display:flex; flex-wrap:wrap; gap:0 22px; margin-top:7px; font-size:8.3pt; }\n.doc-meta__item{ display:flex; gap:5px; padding:1px 0; }\n.doc-meta__k{ color:var(--c-mute-2); }\n.doc-meta__v{ color:var(--c-ink); font-weight:600; }\n\n/* ============================================================\n   3. PARTY BLOCKS — light, no heavy fill\n   ============================================================ */\n.parties{ display:flex; gap:5mm; margin-top:9px; }\n.party{ flex:1; border:1px solid var(--c-line-2); border-radius:6px; padding:6px 9px; }\n.party__label{ font-size:7.2pt; font-weight:600; color:var(--c-primary);\n  text-transform:uppercase; letter-spacing:.06em; margin-bottom:2px; }\n.party__name{ font-size:9.3pt; font-weight:700; color:var(--c-ink); }\n.party__line{ font-size:8pt; color:var(--c-mute); line-height:1.35; }\n\n/* ============================================================\n   4. LINE-ITEM TABLE — minimal thin header, hairline rows, single-line\n   ============================================================ */\n.items{ width:100%; border-collapse:collapse; margin-top:10px; font-size:8.4pt; }\n.items thead th{\n  background:var(--c-navy); color:#fff; font-weight:600; font-size:7.6pt;\n  letter-spacing:.03em; text-align:left; padding:6px 8px;\n}\n.items thead th:first-child{ border-top-left-radius:5px; border-bottom-left-radius:5px; }\n.items thead th:last-child{ border-top-right-radius:5px; border-bottom-right-radius:5px; }\n.items tbody td{\n  padding:5px 8px; border-bottom:1px solid var(--c-line-2);\n  vertical-align:top; color:var(--c-ink); line-height:1.4;\n}\n.items .num{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }\n.items .ctr{ text-align:center; white-space:nowrap; }\n.items .col-no{ width:8mm; text-align:center; color:var(--c-mute-2); }\n.items .col-qty{ width:16mm; } .items .col-unit{ width:14mm; }\n.items .col-price{ width:23mm; } .items .col-amt{ width:25mm; }\n/* secondary detail kept INLINE so a row stays one line */\n.items td .sub{ color:var(--c-mute-2); font-size:7.4pt; }\n.items td .sub::before{ content:\"·\"; margin:0 5px; color:var(--c-mute-3); }\n.items tr{ break-inside:avoid; }\n.items thead{ display:table-header-group; }\n\n/* ============================================================\n   5. TOTALS — rules instead of heavy fill\n   ============================================================ */\n.foot-grid{ display:flex; gap:5mm; margin-top:8px; align-items:flex-start; }\n.foot-left{ flex:1; }\n.totals{ flex:0 0 60mm; }\n.totals__row{ display:flex; justify-content:space-between; gap:10px; padding:2.5px 8px; font-size:8.6pt; }\n.totals__row .k{ color:var(--c-mute); }\n.totals__row .v{ font-weight:600; font-variant-numeric:tabular-nums; }\n.totals__row--rule{ border-top:1px solid var(--c-line-2); }\n.totals__grand{\n  margin-top:4px; padding:6px 10px; border-radius:6px; background:var(--c-navy);\n  display:flex; justify-content:space-between; align-items:baseline;\n}\n.totals__grand .k{ font-size:8.8pt; font-weight:600; color:#fff; }\n.totals__grand .v{ font-size:11.5pt; font-weight:700; color:#fff; font-variant-numeric:tabular-nums; }\n/* amount-in-words — full width, larger, clear */\n.baht-text{ margin-top:7px; padding:6px 11px; border:1px dashed var(--c-line);\n  border-radius:6px; display:flex; justify-content:space-between; align-items:baseline; gap:12px; }\n.baht-text__k{ font-size:8pt; color:var(--c-mute-2); white-space:nowrap; }\n.baht-text b{ font-size:9.6pt; color:var(--c-navy); font-weight:700; text-align:right; }\n\n/* ============================================================\n   6. NOTES / TERMS\n   ============================================================ */\n.notes{ border:1px solid var(--c-line-2); border-radius:6px; padding:6px 9px;\n  font-size:8pt; color:var(--c-mute); }\n.notes__title{ font-size:7.2pt; font-weight:600; color:var(--c-mute-2);\n  text-transform:uppercase; letter-spacing:.05em; margin-bottom:3px; }\n.notes ol,.notes ul{ margin-left:15px; }\n.notes li{ margin:1px 0; }\n\n/* ============================================================\n   7. SIGNATURE BLOCK — sits inside .doc-bottom (above footer)\n   ============================================================ */\n.signs{ display:flex; gap:5mm; margin-top:14px; break-inside:avoid; }\n.sign{ flex:1; text-align:center; }\n.sign__line{ height:30px; border-bottom:1px solid var(--c-mute-3); margin:0 5mm; }\n.sign__paren{ font-size:8pt; color:var(--c-mute-2); margin-top:4px; }\n.sign__role{ font-size:8.4pt; font-weight:600; color:var(--c-ink); margin-top:1px; }\n.sign__name{ font-size:7.8pt; color:var(--c-mute); }\n.sign__date{ font-size:7.6pt; color:var(--c-mute-2); margin-top:1px; }\n\n/* ============================================================\n   8. OFFICIAL THAI LETTER / MEMO (ระเบียบงานสารบรรณ) — logo-left head\n   ============================================================ */\n.letter{ margin-top:8px; font-size:10pt; line-height:1.6; color:var(--c-ink); }\n\n/* ที่ (เลขหนังสือ) ซ้าย + ส่วนราชการ/ที่อยู่ ขวา */\n.letter__refrow{ display:flex; justify-content:space-between; align-items:flex-start; gap:14mm; margin-top:6px; }\n.letter__ref{ font-size:10pt; }\n.letter__agency{ text-align:right; font-size:9.2pt; color:var(--c-mute); line-height:1.4; }\n\n/* วันที่ — จัดกึ่งกลาง ไม่มีคำว่า \"วันที่\" นำ (ตามแบบราชการ) */\n.letter__date{ text-align:center; margin:10px 0 12px; font-size:10pt; }\n\n/* ฟิลด์หัวเรื่อง เรื่อง/เรียน/อ้างถึง/สิ่งที่ส่งมาด้วย — hanging indent */\n.letter__field{ display:flex; gap:10px; margin:3px 0; }\n.letter__field .lbl{ flex:0 0 auto; }\n.letter__field .val{ flex:1; text-align:justify; }\n.letter__field .val b,.letter__subject{ font-weight:700; }\n\n/* เนื้อหา — ย่อหน้าเยื้องบรรทัดแรก, จัดเต็มแนว */\n.letter__body{ margin-top:6px; }\n.letter__body p,.letter p{ margin:7px 0; text-indent:3.5em; text-align:justify; }\n\n/* คำลงท้าย + ลายเซ็น — กล่องชิดขวา */\n.letter__close{ margin-top:16px; margin-left:auto; width:72mm; text-align:center; }\n.letter__close .sp{ height:42px; }\n.letter__close .nm{ \n  --form-fill-pad:6px; --form-fill-s:15mm; --form-fill-m:30mm; --form-fill-l:60mm;\n  --form-date-w:52mm; --form-num-w:6mm; --form-cb-fs:12pt;\n}\n.form{ font-size:var(--form-fs); line-height:var(--form-lh); color:var(--form-ink); }\n.form-brand{ display:flex; justify-content:var(--form-logo-align); }\n.form-logo{ height:var(--form-logo-h); width:auto; max-width:var(--form-logo-maxw); object-fit:contain; }\n.form-title{ text-align:center; font-size:var(--form-title-fs); font-weight:700; line-height:1.45; margin-top:var(--form-title-gap); }\n.form-date{ display:flex; justify-content:flex-end; margin-top:var(--form-title-gap); }\n.form-date .fill{ flex:0 0 var(--form-date-w); }\n.form-row{ display:flex; align-items:baseline; gap:6px; margin-top:var(--form-row-gap); }\n.form-row--indent{ padding-left:var(--form-indent); margin-top:calc(var(--form-row-gap) * 3); }\n.form-row .fill{ flex:1 1 0; }\n.form-row .fill--s{ flex:0 0 var(--form-fill-s); } .form-row .fill--m{ flex:0 0 var(--form-fill-m); } .form-row .fill--l{ flex:0 0 var(--form-fill-l); }\n.fill{ display:inline-block; min-height:1.45em; padding:0 var(--form-fill-pad); border-bottom:1px dotted var(--form-dot); font-weight:500; color:var(--form-ink); text-align:center; }\n.fill--left{ text-align:left; }\n.fill--s, .fill--m{ white-space:nowrap; }\n.fill .sub{ font-size:7.6pt; font-weight:400; color:var(--form-mute); }\n.form-num{ flex:0 0 var(--form-num-w); }\n.form-p{ margin-top:var(--form-para-gap); padding-left:var(--form-indent); }\n.form-check{ display:flex; align-items:baseline; gap:6px; margin-top:calc(var(--form-row-gap) * 2); }\n.form-check__lbl{ flex:0 0 auto; white-space:nowrap; }\n.form-check__opts{ flex:1; }\n.form-check__opt{ display:flex; align-items:baseline; gap:6px; margin-bottom:5px; }\n.form-check--inline .form-check__opts{ display:flex; flex-wrap:wrap; gap:4px 18px; }\n.cb{ font-size:var(--form-cb-fs); line-height:1; }\n.form-check .fill--s{ min-width:10mm; } .form-check .fill--m{ min-width:2 /* ---------- logic-less template renderer (mustache subset · คู่กับ scripts/render_doc.py — parity_check.py ยืนยันตรงทุกไบต์) ---------- */
function tplGet(stack, path){
  for (let i = stack.length - 1; i >= 0; i--){ let cur = stack[i], ok = true;
    for (const k of path.split('.')){ if (cur && typeof cur === 'object' && k in cur) cur = cur[k]; else { ok = false; break; } }
    if (ok) return cur; }
  return null;
}
function tplRender(t, stack){
  t = t.replace(/{{([#^])([\w.]+)}}([\s\S]*?){{\/\2}}/g, (m, kind, key, inner) => { const v = tplGet(stack, key), has = Array.isArray(v) ? v.length > 0 : !!v;
    if (kind === '^') return has ? '' : tplRender(inner, stack);
    if (Array.isArray(v)) return v.map(x => tplRender(inner, stack.concat([x]))).join('');
    return has ? tplRender(inner, stack.concat(typeof v === 'object' ? [v] : [])) : ''; });
  t = t.replace(/{{{([\w.]+)}}}/g, (m, k) => { const v = tplGet(stack, k); return v == null ? '' : String(v); });
  return t.replace(/{{([\w.]+)}}/g, (m, k) => { const v = tplGet(stack, k); return v == null ? '' : esc(v); });
}

  for (let i = 0; i < n; i += per) out.push({ signs:signs.slice(i, i + per) });

}

}

}

/* ---------- wizard actions ---------- */
function goStep(n){ S.dw.step = n; render(); }
function setFld(path, v){
  const f = wf(), p = path.split('.');
  if (p.length === 1) f[p[0]] = v; else f[p[0]][p[1]] = v;
  if (S.dw.err && S.dw.err.f) delete S.dw.err.f[path];
  dirty();
  /* อายุเปลี่ยน → ส่วนผู้เยาว์เปิด/ปิดตามเกณฑ์ใน config · ช่องอื่นไม่ re-render เพื่อไม่ให้เสียโฟกัส */
  if (path === 'subject.age') render();
  else { const el = document.querySelector('[data-fld="' + path + '"]'); if (el) el.classList.remove('is-invalid'); syncSum(); }
}
function syncSum(){
  const f = wf(), n = document.getElementById('sumName');
  if (n) n.textContent = f.subject.name || '—';
}
function copyMinorFromSubject(){
  const f = wf();
  f.minor = { name:f.subject.name, age:f.subject.age, cid:f.subject.cid };
  if (S.dw.err && S.dw.err.f){ delete S.dw.err.f['minor.name']; delete S.dw.err.f['minor.age']; delete S.dw.err.f['minor.cid']; }
  dirty(); render();
}
function setAns(no, v){ const f = wf(), a = f.answers.find(x => x.no === no); if (!a) return; a.answer = a.answer === v ? '' : v; dirty();
  if (S.dw.err && S.dw.err.items) delete S.dw.err.items[no]; render(); }
function setAllAns(v){ const f = wf(); f.answers.forEach(a => { a.answer = v; }); dirty(); if (S.dw.err) S.dw.err.items = {}; render(); }
const CID_RE = /^[0-9 -]{10,20}$/;
function validateMain(){
  const f = wf(), items = {}, err = {};
  f.answers.forEach(a => { if (!a.answer) items[a.no] = 1; });
  if (!f.writtenPlace.trim()) err['writtenPlace'] = 'กรุณาระบุสถานที่ที่ทำหนังสือ';
  if (!f.subject.name.trim()) err['subject.name'] = 'กรุณากรอกชื่อผู้ให้ความยินยอม';
  const age = ageNum(f.subject.age);
  if (age == null || age < 1 || age > 120) err['subject.age'] = 'กรุณากรอกอายุเป็นตัวเลข 1–120';
  if (!CID_RE.test(f.subject.cid.trim())) err['subject.cid'] = 'กรุณากรอกเลขบัตรประชาชนให้ถูกต้อง';
  if (!f.booth.location.trim()) err['booth.location'] = 'กรุณาระบุสถานที่ตั้งบูธกิจกรรม';
  if (!f.booth.from) err['booth.from'] = 'กรุณาระบุวันเริ่มกิจกรรม';
  if (!f.booth.to) err['booth.to'] = 'กรุณาระบุวันสิ้นสุดกิจกรรม';
  if (f.booth.from && f.booth.to && f.booth.to < f.booth.from) err['booth.to'] = 'วันสิ้นสุดต้องไม่ก่อนวันเริ่มกิจกรรม';
  if (isMinorAge(f.subject.age)){
    if (!f.guardian.name.trim()) err['guardian.name'] = 'ผู้เยาว์ต้องมีผู้ปกครองรับรอง';
    if (ageNum(f.guardian.age) == null) err['guardian.age'] = 'กรุณากรอกอายุผู้ปกครอง';
    if (!CID_RE.test(f.guardian.cid.trim())) err['guardian.cid'] = 'กรุณากรอกเลขบัตรประชาชนผู้ปกครอง';
    if (!f.minor.name.trim()) err['minor.name'] = 'กรุณากรอกชื่อผู้เยาว์';
    if (ageNum(f.minor.age) == null) err['minor.age'] = 'กรุณากรอกอายุผู้เยาว์';
    if (!CID_RE.test(f.minor.cid.trim())) err['minor.cid'] = 'กรุณากรอกเลขบัตรประชาชนผู้เยาว์';
  }
  const ok = !Object.keys(items).length && !Object.keys(err).length;
  S.dw.err = ok ? null : { items, f:err }; return ok;
}
function wizNext(){
  if (S.dw.step === 1 && !validateMain()){ render(); showToast('กรอกข้อมูลให้ครบและเลือกความยินยอมทุกข้อ', 'warning'); return; }
  S.dw.step += 1; render();
}
function wizBack(){ S.dw.step = Math.max(1, S.dw.step - 1); render(); }
function pickFiles(inp){ const f = wf(); gateFiles(Array.from(inp.files || [])).forEach(x => f.files.push({ name:x.name, size:fmtSize(x.size) })); inp.value = ''; dirty(); render(); }
function removeFile(i){ wf().files.splice(i, 1); dirty(); render(); }
/* บันทึก = ENG-DOC-NUM.next('IMC') ออกเลขที่ครั้งแรก (DEC-09) · ฉบับของหนังสือ snapshot ลงเอกสาร */
function persist(){
  const f = wf(), me = ME(), t = nowIso(), minor = isMinorAge(f.subject.age);
  let r = S.dw.editId ? findR(S.dw.editId) : null;
  if (!r){
    SEQ += 1;
    r = { id:'R' + SEQ, code:DOC.prefix + '-2569-' + String(SEQ).padStart(4, '0'), status:'draft', emp:S.me, pos:me.pos, dept:me.dept, reqDate:TODAY, note:'',
      formRev:DOC.rev, formCode:DOC.form, consentedAt:null, withdraw:null,
      chain:resolveDoa(S.me), doa_entry_ref:MOCK_DOA_RESOLVED.doa_entry_ref, attachments:[], audit:[{ act:'สร้างเอกสาร', by:me.name, at:t, tone:'' }], createdBy:me.name, createdAt:t };
    RECS.unshift(r);
  } else r.audit.push({ act:'แก้ไขร่าง', by:me.name, at:t, tone:'' });
  Object.assign(r, { writtenPlace:f.writtenPlace.trim(), subject:Object.assign({}, f.subject), booth:Object.assign({}, f.booth),
    guardian:minor ? Object.assign({}, f.guardian) : { name:'', age:'', cid:'' },
    minor:minor ? Object.assign({}, f.minor) : { name:'', age:'', cid:'' },
    answers:f.answers.map(a => Object.assign({}, a)), attachments:f.files.slice(), copyOf:f.copyOf, updatedBy:me.name, updatedAt:t });
  return r;
}
function saveDraft(){ if (S.busy) return;
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const r = persist(); S.busy = false; closeDrawer(true); setTimeout(() => showToast('บันทึกร่างแล้ว · ' + r.code, 'info'), 300); }, 500); }
function saveAndSubmit(){ if (S.busy) return; if (!validateMain()){ S.dw.step = 1; render(); showToast('กรอกข้อมูลให้ครบและเลือกความยินยอมทุกข้อ', 'warning'); return; }
  S.busy = true; render();

/* =====================================================================
   MODALS (Pattern D) — ยืนยันความยินยอม (DOA slot picker) · รับหนังสือ · ไม่รับหนังสือ · ถอนความยินยอม · ยกเลิก · ทิ้งการแก้ไข

function modalShell(icon, tone, title, sub, body, foot){
  return `<div class="modal-header"><div class="modal-header-icon ${tone}"><i data-lucide="${icon}" class="w-4 h-4"></i></div><div><h3 class="modal-title">${title}</h3><p class="modal-subtitle">${sub}</p></div></div>
    ${body ? `<div class="modal-body">${body}</div>` : ''}<div class="modal-footer">${foot}</div>`;
}
const busyLabel = (icon, label) => S.busy ? '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>' : `<i data-lucide="${icon}" class="w-4 h-4"></i><span>${label}</span>`;
function presetChips(list, cur){ return `<div class="chip-row">${list.map(p => `<button type="button" class="chip ${cur === p ? 'is-on' : ''}" onclick="setReasonPreset(this.dataset.v)" data-v="${esc(p)}">${esc(p)}</button>`).join('')}</div>`; }
function wdScopeChips(r, scope){
  const items = CONSENT_ITEMS.filter(it => ansOf(r, it.no) === 'consent');
  return `<div class="chip-row">${items.map(it => `<button type="button" class="chip ${scope.indexOf(it.no) >= 0 ? 'is-on' : ''}" title="${esc(it.label)}" onclick="toggleWdItem(${it.no})">ข้อ ${it.no}${it.ext ? ' (นอกองค์กร)' : ''}</button>`).join('')}
    <button type="button" class="chip ${scope.length === items.length && items.length ? 'is-on' : ''}" onclick="toggleWdAll()">ทั้งฉบับ</button></div>`;
}
function renderModal(){
  const m = S.md; if (!m) return '';
  const r = m.id ? findR(m.id) : null;
  if (m.kind === 'submit'){
    const steps = resolveDoa(r.emp);
    return modalShell('camera', 'is-primary', 'ยืนยันความยินยอม?', `${r.code} · ${esc(r.subject.name)} · ยินยอม ${consentText(r)}`,
      `${steps.length ? steps.map((c, i) => `<div class="slot-row"><span class="slot-no num">${c.step}</span><span class="slot-role">${c.role}</span><div class="field ${m.err && !m.slots[i] ? 'is-invalid' : ''}" id="fSlot${i}">${searchSelectHTML('slot' + i, { placeholder:'เลือกผู้พิจารณา' })}<div class="field-error">กรุณาเลือกผู้พิจารณา</div>${i === 0 ? '<div class="slot-help">ค่าเริ่มต้นจากสายอนุมัติที่ตั้งไว้ที่ DOA กลาง</div>' : ''}</div></div>`).join('')
        : `<div class="slot-row"><span class="slot-no num">—</span><span class="slot-role">ไม่มีผู้พิจารณา</span><div class="slot-help">ลงชื่อเฉพาะผู้ให้ความยินยอมและผู้ปกครองตามแบบฟอร์มกระดาษ</div></div>`}
       <div class="drawer-fields mt-3">${kv('ฉบับของหนังสือ', r.formCode + ' · ' + r.formRev)}${kv('วันที่ให้ความยินยอม', fmtDate(TODAY))}${kv('ยินยอม', nConsent(r) + ' ข้อ')}${kv('ถอนความยินยอม', nWithdrawAns(r) + ' ข้อ')}</div>
       ${isMinorRec(r) ? '<div class="field-help is-warn">ผู้เยาว์ — ผู้ปกครองรับรองในหนังสือฉบับนี้</div>' : ''}
       <div class="field-help is-warn">ยืนยันแล้วแก้ไขไม่ได้ · ระบบเก็บสำเนาเป็นหลักฐาน</div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="btnSubmit" onclick="confirmSubmit()" ${S.busy ? 'disabled' : ''}>${busyLabel('camera', 'ยืนยันความยินยอม')}</button>`);
  }
  if (m.kind === 'approve'){
    return modalShell('check-circle-2', 'is-success', 'รับหนังสือยินยอมฉบับนี้?', `${r.code} · ${esc(r.subject.name)} · ยินยอม ${consentText(r)}`,
      `<div class="drawer-fields">${kv('ฉบับของหนังสือ', r.formCode + ' · ' + r.formRev)}${kv('บูธกิจกรรม', esc(boothText(r)))}${kv('ช่วงอายุ', isMinorRec(r) ? 'ผู้เยาว์ · รับรองโดย ' + esc(r.guardian.name) : 'บรรลุนิติภาวะ')}</div>
       <div class="field mt-3"><label class="field-label">ความเห็น</label><textarea class="input" name="apNote" rows="2" placeholder="ไม่บังคับ" oninput="S.md.note=this.value">${esc(m.note || '')}</textarea></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-success" id="btnApprove" onclick="confirmApprove()" ${S.busy ? 'disabled' : ''}>${busyLabel('check', 'รับหนังสือยินยอม')}</button>`);
  }
  if (m.kind === 'withdraw'){
    return modalShell('undo-2', 'is-danger', 'ถอนความยินยอม?', `${r.code} · ${esc(r.subject.name)} · ถอนแล้วต้องหยุดเผยแพร่ภาพส่วนที่ถอนทันที`,
      `<div class="field-label">เลือกข้อที่ถอน</div>${wdScopeChips(r, m.scope)}
       <div class="field-help is-warn">ไม่กระทบการใช้ภาพที่เผยแพร่ไปแล้วโดยชอบ</div>
       ${presetChips(WITHDRAW_PRESETS, m.preset)}
       <div class="field ${m.err === 'reason' ? 'is-invalid' : ''}" id="fReason"><label class="field-label">เหตุผล<span class="req">*</span></label><textarea class="input" name="reason" rows="3" placeholder="บันทึกว่าใครแจ้งถอนและเพราะอะไร" oninput="S.md.reason=this.value; if(this.value.trim()) document.getElementById('fReason').classList.remove('is-invalid')">${esc(m.reason || '')}</textarea><div class="field-error">กรุณาระบุเหตุผล</div></div>
       ${m.err === 'scope' ? '<div class="field-help is-warn">กรุณาเลือกอย่างน้อย 1 ข้อที่ต้องการถอน</div>' : ''}`,
      `<button class="btn btn-ghost" onclick="closeModal()">ไม่ถอน</button><button class="btn btn-danger" id="btnWithdraw" onclick="confirmWithdraw()" ${S.busy ? 'disabled' : ''}>${busyLabel('undo-2', 'ถอนความยินยอม')}</button>`);
  }
  if (m.kind === 'reject' || m.kind === 'cancel'){
    const rej = m.kind === 'reject';
    return modalShell('x-circle', 'is-danger', rej ? 'ไม่รับหนังสือยินยอมฉบับนี้?' : 'ยกเลิกเอกสาร?', `${r.code} · ${esc(r.subject.name)}`,
      `${presetChips(rej ? REJECT_PRESETS : CANCEL_PRESETS, m.preset)}
       <div class="field ${m.err ? 'is-invalid' : ''}" id="fReason"><label class="field-label">เหตุผล<span class="req">*</span></label><textarea class="input" name="reason" rows="3" placeholder="${rej ? 'แจ้งผู้บันทึกว่าเพราะอะไร' : 'เหตุผลที่ยกเลิก'}" oninput="S.md.reason=this.value; if(this.value.trim()) document.getElementById('fReason').classList.remove('is-invalid')">${esc(m.reason || '')}</textarea><div class="field-error">กรุณาระบุเหตุผล</div></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">${rej ? 'ยกเลิก' : 'ไม่ยกเลิก'}</button><button class="btn btn-danger" id="btnReason" onclick="confirmReason()" ${S.busy ? 'disabled' : ''}>${busyLabel('x-circle', rej ? 'ไม่รับหนังสือ' : 'ยกเลิกเอกสาร')}</button>`);
  }
  if (m.kind === 'discard'){
    return modalShell('alert-triangle', 'is-warning', 'ทิ้งข้อมูลที่กรอกไว้?', 'ข้อมูลในแบบฟอร์มนี้ยังไม่ได้บันทึก', '',
      `<button class="btn btn-ghost" onclick="closeModal()">กลับไปกรอกต่อ</button><button class="btn btn-danger" id="btnDiscard" onclick="closeModal(); closeDrawer(true)">ทิ้งข้อมูล</button>`);
  }
  return '';
}
function openModalCfg(cfg){ S.md = cfg; state.modal.open = true; render(); requestAnimationFrame(() => document.getElementById('modalBackdrop').classList.add('is-open')); }
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('is-open'); state.modal.open = false; setTimeout(() => { if (!state.modal.open) S.md = null; }, 200); }
function modalBackdropClick(){ if (S.md && (S.md.reason || S.md.note)) return; closeModal(); }
function setReasonPreset(v){ S.md.preset = v; S.md.reason = v + (S.md.reason && S.md.reason.indexOf(v) !== 0 ? ' — ' + S.md.reason : ''); S.md.err = false; render(); }
function toggleWdItem(no){ const m = S.md, i = m.scope.indexOf(no); if (i >= 0) m.scope.splice(i, 1); else m.scope.push(no); m.scope.sort((a, b) => a - b); m.err = false; render(); }
function toggleWdAll(){ const m = S.md, r = findR(m.id), all = CONSENT_ITEMS.filter(it => ansOf(r, it.no) === 'consent').map(it => it.no);
  m.scope = m.scope.length === all.length ? [] : all; m.err = false; render(); }
function openSubmit(id){ const r = findR(id); if (!r || r.status !== 'draft') return; openModalCfg({ kind:'submit', id, slots:resolveDoa(r.emp).map(c => c.assignee) }); }
function openApprove(id){ openModalCfg({ kind:'approve', id, note:'' }); }
function openReject(id){ openModalCfg({ kind:'reject', id, reason:'' }); }
function openCancel(id){ closeRowMenu(); openModalCfg({ kind:'cancel', id, reason:'' }); }
function openWithdraw(id){ closeRowMenu(); openModalCfg({ kind:'withdraw', id, scope:[], reason:'' }); }
function pushAudit(r, act, note, tone){ const me = ME(), t = nowIso(); r.audit.push({ act, by:me.name, at:t, note:note || '', tone:tone || '' }); r.updatedBy = me.name; r.updatedAt = t; }
/* ENG-NOTIFY (ntf-declaration): imc_consent_recorded · imc_consent_withdrawn · imc_minor_consent_recorded · imc_cancelled — DOA engine เป็นเจ้าของ doa_* */
function confirmSubmit(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (m.slots.some(x => !x)){ m.err = true; render(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    r.chain = resolveDoa(r.emp).map((c, i) => Object.assign(c, { assignee:m.slots[i], status:i === 0 ? 'pending' : 'waiting' }));   /* BR-DOA-02 resolve ตอนส่งแล้ว freeze */
    r.consentedAt = nowIso(); r.submittedAt = r.consentedAt;
    r.status = r.chain.length ? 'pending' : 'confirmed';
    pushAudit(r, 'ยืนยันความยินยอม', 'ฉบับ ' + r.formRev + ' · ยินยอม ' + nConsent(r) + ' ข้อ · ถอนความยินยอม ' + nWithdrawAns(r) + ' ข้อ' + (isMinorRec(r) ? ' · ผู้เยาว์ รับรองโดย ' + r.guardian.name : ''), 'ok');
    S.busy = false; closeModal(); render();
    setTimeout(() => showToast('บันทึกความยินยอมแล้ว · ' + r.code, 'success'), 220); }, 600);
}
function confirmApprove(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    const c = curStep(r); c.status = 'approved'; c.at = nowIso(); c.note = (m.note || '').trim();
    const next = r.chain.find(x => x.status === 'waiting'); if (next) next.status = 'pending';   /* sequential */
