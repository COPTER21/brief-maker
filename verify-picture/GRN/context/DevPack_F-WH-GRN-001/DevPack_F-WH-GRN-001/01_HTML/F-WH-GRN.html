      <button class="btn btn-ghost sm" style="padding:0 6px;" onclick="toggleLineExpand('${l.id}')"><i data-lucide="chevron-up" class="w-3.5 h-3.5"></i></button>
    </div></td></tr>`;
  return main + panel;
}
function toggleLineExpand(lineId) {
  const wasOpen = createWizard.expandedLineId === lineId;
  if (wasOpen) {
    const p = document.querySelector(`.line-expand-panel-anchor[data-line-id="${lineId}"] .line-expand-panel-inner`);
    if (p) { p.classList.add('line-collapse-panel'); setTimeout(() => { createWizard.expandedLineId = null; renderCreateDrawer(); }, 200); return; }
    createWizard.expandedLineId = null; renderCreateDrawer();
  } else { createWizard.expandedLineId = lineId; renderCreateDrawer(); }
}
function updateLine(id, field, val) {
  const line = createWizard.data.lines.find(l => l.id === id); if (!line) return;
  const focused = document.activeElement;
  const focusInfo = focused && focused.tagName === 'INPUT' ? { oninput: focused.getAttribute('oninput'), selStart: focused.selectionStart } : null;
  if (field === 'qty') { line.qty = Math.max(0, parseFloat(val) || 0); if (line.qty_reject > line.qty) line.qty_reject = line.qty; }
  else if (field === 'qty_reject') { line.qty_reject = Math.min(line.qty, Math.max(0, parseFloat(val) || 0)); line.qc = line.qty_reject <= 0 ? 'pass' : (line.qty_reject >= line.qty ? 'fail' : 'partial'); }
  else line[field] = val;
  if (line.qty_reject > 0 && !line.quarantine_loc) line.quarantine_loc = createWizard.data.quarantine || '';
  renderCreateDrawer();
  if (focusInfo) { for (const inp of document.querySelectorAll('input')) { if (inp.getAttribute('oninput') === focusInfo.oninput) { inp.focus(); try { inp.setSelectionRange(focusInfo.selStart, focusInfo.selStart); } catch (e) {} break; } } }
}
function setLineQc(id, mode) {
  const l = createWizard.data.lines.find(x => x.id === id); if (!l) return;
  l.qc = mode;
  if (mode === 'pass') { l.qty_reject = 0; l.reject_reason = ''; }
  else if (mode === 'fail') { l.qty_reject = l.qty; }
  else if (mode === 'partial' && l.qty_reject >= l.qty) { l.qty_reject = 0; }
  if (l.qty_reject > 0 && !l.quarantine_loc) l.quarantine_loc = createWizard.data.quarantine || '';
  renderCreateDrawer();
}
function fillAllOpen() { createWizard.data.lines.forEach(l => { l.qty = lineOpen(l); if (l.qty_reject > l.qty) l.qty_reject = l.qty; }); renderCreateDrawer(); }

function wizardBack() { createWizard.step = Math.max(1, createWizard.step - 1); renderCreateDrawer(); }
function wizardNext() {
  const d = createWizard.data, s = createWizard.step;
  if (s === 1) { if (!d.po) { showToast('เลือกใบสั่งซื้อที่จะรับของก่อน', 'warning'); return; } }
  if (s === 2) {
    let ok = markErr('f-dn', !d.dnNo.trim());
    ok = markErr('f-rdate', !d.receiveDate || d.receiveDate > TODAY_ISO) && ok;
    if (!d.warehouse) { showToast('เลือกคลังปลายทางก่อน', 'warning'); return; }
    if (!d.receiver) { showToast('ระบุผู้รับของ (บุคคลจริง) ก่อน', 'warning'); return; }
    if (!ok) { showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  }
  if (s === 3) {
    if (!d.lines.some(l => (+l.qty || 0) > 0)) { showToast('ต้องมีอย่างน้อย 1 บรรทัดที่รับ > 0', 'warning'); return; }
    if (createWizard._overCap) { showToast('มีบรรทัดที่เกินเพดานรับ หรือรับเกินแล้วยังไม่ระบุหมายเหตุ', 'warning'); return; }
    if (createWizard._qcIncomplete) { showToast('กรอกผลตรวจคุณภาพให้ครบก่อน (จำนวน · เหตุผล · ผู้ตรวจ)', 'warning'); return; }
  }
  createWizard.step = Math.min(5, s + 1); renderCreateDrawer();
}

    dnNo: d.dnNo, dnDate: d.dnDate, receiver: d.receiver, inspector: d.inspector, deliverer: d.deliverer, vehicle: d.vehicle,
    costCenter: d.costCenter, note: d.note, lines: d.lines.map(l => Object.assign({}, l)), attachments: d.attachments.slice(),
    endbill: { enabled: false, mode: 'percent', value: 0, src: '' }, couponAmt: 0 };
}
function saveDraft() {
  const base = collectDraft(), now = new Date().toISOString();
  if (createWizard.editId) {
    const g = findGrn(createWizard.editId);
    Object.assign(g, base, { updatedAt: now, updatedBy: 'ธนกร แสงมณี' });

  } else {
    const g = mkGrn(Object.assign({ id: 'G' + Date.now(), code: '', status: 'draft', createdBy: 'ธนกร แสงมณี', createdAt: now, updatedBy: 'ธนกร แสงมณี', updatedAt: now, audit: [] }, base));

    GRNS.unshift(g);
  }
  closeCreateDrawer();
  setTimeout(() => { render(); showToast('บันทึกร่างแล้ว — สต๊อกยังไม่ขยับ และใบสั่งซื้อยังไม่เปลี่ยน', 'success'); }, 220);
}

/* modal รับเข้าคลัง — ใช้โครง slot-row เดียวกับ archetype แต่เป็น "ผู้รับผิดชอบจริง" ไม่ใช่สายอนุมัติ (feature นี้ไม่มี DOA) */

      <div class="modal-body">

        <div class="note" style="margin-top:12px;"><i data-lucide="info" class="w-4 h-4"></i><div>ใบสั่งซื้อ <span class="tbl-mono">${esc(d.po)}</span> · มูลค่ารับเข้า ฿${formatMoney(t.grand)} · เข้าคลัง ${fmi(d.lines.reduce((s,l)=>s+(l.kind==='service'?0:lineGood(l)),0))} หน่วย${rejQty ? ' · เข้าโซนกักของ ' + fmi(rejQty) + ' หน่วย' : ''}</div></div>
      </div>
      <div class="modal-footer"><button class="btn btn-ghost" onclick="closePostModal()">ยกเลิก</button>
        <button class="btn btn-primary" id="post-confirm" onclick="confirmPost()"><i data-lucide="package-check" class="w-4 h-4"></i><span>รับเข้าคลัง</span></button></div>
    </div></div>`;
  const host = document.createElement('div'); host.id = 'post-modal'; host.innerHTML = html;
  document.body.appendChild(host); renderIcons();
}
function closePostModal() { const m = document.getElementById('post-modal'); if (m) m.remove(); }
function confirmPost() {
  if (createWizard._submitting) return;
  createWizard._submitting = true;
  const btn = document.getElementById('post-confirm');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>'; renderIcons(); }
  setTimeout(() => {
    const base = collectDraft(), now = new Date().toISOString();
    let g;
    if (createWizard.editId) { g = findGrn(createWizard.editId); Object.assign(g, base); }
    else { g = mkGrn(Object.assign({ id: 'G' + Date.now(), code: '', status: 'draft', createdBy: 'ธนกร แสงมณี', createdAt: now, audit: [] }, base)); GRNS.unshift(g); }
    g.code = nextDocNo();            /* FWD-WIRE: ENG-DOC-NUM */
    g.status = 'posted'; g.postedBy = g.receiver; g.postedAt = now; g.updatedAt = now; g.updatedBy = g.receiver;
    applyToPo(g, +1);
    pushAudit(g, 'รับเข้าคลัง (post)', `เข้าคลัง ${fmi(g.lines.reduce((s,l)=>s+(l.kind==='service'?0:lineGood(l)),0))} หน่วย` + (docRejectQty(g) ? ` · เข้าโซนกักของ ${fmi(docRejectQty(g))} หน่วย` : ''));
    /* FWD-WIRE: ENG-NOTIFY emit grn_posted · FWD-WIRE: ENG-CSQ emit grn_posted · FWD-WIRE: JE posting */
    closePostModal(); closeCreateDrawer(); createWizard._submitting = false;
    setTimeout(() => { render(); showToast(`รับเข้าคลังแล้ว — เลขที่ ${g.code}`, 'success'); }, 220);
  }, 500);
}
/* sync ยอดรับสะสมกลับ PO (GRN เป็นผู้เขียนเพียงผู้เดียว) · dir = +1 post · -1 reversal */
function applyToPo(g, dir) {
  const po = PO_BY[g.po]; if (!po) return;
  g.lines.forEach(l => { const pl = po.lines.find(x => x.no === l.po_line_no); if (pl) pl.received = Math.max(0, pl.received + dir * (+l.qty || 0)); });
  const anyReceived = po.lines.some(l => l.received > 0);
  const allClosed = po.lines.length > 0 && po.lines.every(l => l.qty_ordered - l.received <= 0);
  po.status = allClosed ? 'closed' : (anyReceived ? 'partially received' : 'sent');
}

/* modal เหตุผล: กลับรายการ / ทิ้งร่าง */
const reasonState = { id: null, type: null, text: '' };
function openReasonModal(id, type) {
  const g = findGrn(id); if (!g) return;
  reasonState.id = id; reasonState.type = type; reasonState.text = '';
  const isRev = type === 'reverse';
  const presets = isRev ? ['บันทึกผิดใบ', 'จำนวนผิด', 'ผู้ขายเรียกของคืนทันที'] : ['สร้างซ้ำ', 'ยกเลิกการรับรอบนี้'];
  const html = `<div class="overlay-wrap" style="display:grid;place-items:center;">
    <div class="backdrop" onclick="closeReasonModal()"></div>
    <div class="modal" style="position:relative;max-width:520px;width:calc(100% - 40px);">
      <div class="modal-header"><div class="modal-header-icon is-danger"><i data-lucide="${isRev ? 'undo-2' : 'trash-2'}" class="w-5 h-5"></i></div>
        <div><div class="modal-title">${isRev ? 'กลับรายการใบรับของ' : 'ทิ้งฉบับร่าง'}</div>
        <div class="modal-subtitle">${isRev ? 'ความเคลื่อนไหวเดิมจะไม่ถูกลบ — ระบบสร้างรายการตรงข้ามและหักยอดรับคืนที่ใบสั่งซื้อ' : 'ร่างจะถูกเก็บเป็นประวัติ (ไม่มีการลบถาวร)'}</div></div></div>
      <div class="modal-body">
        <div class="note ${isRev ? 'danger' : 'warn'}" style="margin-bottom:12px;"><i data-lucide="alert-triangle" class="w-4 h-4"></i><div>${isRev ? `ใบ <span class="tbl-mono">${esc(g.code)}</span> · ${esc(g.po)} · ทำได้ทั้งใบเท่านั้น (ไม่กลับรายการบางบรรทัด)` : 'ร่างนี้ยังไม่กระทบสต๊อกและใบสั่งซื้อ'}</div></div>
        <div class="field"><label class="lbl">เหตุผล *</label>
          <textarea class="input" rows="3" id="reason-text" oninput="reasonState.text=this.value" placeholder="ระบุเหตุผล"></textarea>
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;">${presets.map(p => `<button class="btn btn-ghost sm" onclick="reasonState.text='${p}';document.getElementById('reason-text').value='${p}';">${p}</button>`).join('')}</div>
        </div>
      </div>
      <div class="modal-footer"><button class="btn btn-ghost" onclick="closeReasonModal()">ยกเลิก</button>
        <button class="btn btn-danger" onclick="confirmReason()"><i data-lucide="${isRev ? 'undo-2' : 'trash-2'}" class="w-4 h-4"></i><span>${isRev ? 'กลับรายการ' : 'ทิ้งร่าง'}</span></button></div>
    </div></div>`;
  const host = document.createElement('div'); host.id = 'reason-modal'; host.innerHTML = html;
  document.body.appendChild(host); renderIcons();
}
function closeReasonModal() { const m = document.getElementById('reason-modal'); if (m) m.remove(); }
function confirmReason() {
  const g = findGrn(reasonState.id); if (!g) return;
  if (!reasonState.text.trim()) { showToast('ต้องระบุเหตุผลก่อน', 'warning'); return; }
  if (reasonState.type === 'reverse') {
    g.status = 'reversed';
    g.reversal = { by: 'สมชาย ทองใบ', at: new Date().toISOString(), reason: reasonState.text.trim() };
    applyToPo(g, -1);
    pushAudit(g, 'กลับรายการ (reversal)', reasonState.text.trim() + ' — สร้างความเคลื่อนไหวตรงข้าม ของเดิมยังอยู่ในประวัติ');
    /* FWD-WIRE: ENG-NOTIFY emit grn_reversed · FWD-WIRE: ENG-CSQ emit grn_reversed (reversal_of) */
    closeReasonModal(); closeViewDrawer();
    setTimeout(() => { render(); showToast(`กลับรายการ ${g.code} แล้ว — ยอดรับที่ ${g.po} ถูกหักคืน`, 'success'); }, 220);
  } else {
    g.status = 'archived'; g.archivedReason = reasonState.text.trim();
    pushAudit(g, 'ทิ้งฉบับร่าง (เก็บเป็นประวัติ)', reasonState.text.trim());
    const i = GRNS.indexOf(g); if (i > -1) GRNS.splice(i, 1);
    closeReasonModal(); closeViewDrawer();
    setTimeout(() => { render(); showToast('ทิ้งร่างแล้ว (เก็บเป็นประวัติ ไม่ได้ลบถาวร)', 'info'); }, 220);
  }
}

/* ===================== VIEW DRAWER (tabs ล็อกลำดับ — Pattern Q) ===================== */
const SEC = (ico, title, extra) => `<div style="font-size:13px;font-weight:700;color:var(--c-navy);margin-bottom:12px;display:flex;align-items:center;gap:8px;"><i data-lucide="${ico}" class="w-4 h-4"></i> ${title}${extra || ''}</div>`;
const KV = (l, v, sub, full) => `<div${full ? ' style="grid-column:1 / -1;"' : ''}><div style="font-size:11px;color:var(--c-text-soft);">${l}</div><div style="font-weight:600;">${v == null || v === '' ? '<span style="color:var(--c-text-soft);font-weight:400;">-</span>' : v}</div>${sub ? `<div style="font-size:11px;color:var(--c-text-mute);margin-top:2px;">${sub}</div>` : ''}</div>`;
const SECWRAP = (inner, first) => `<section${first ? '' : ' style="margin-top:16px;padding-top:16px;border-top:1px solid var(--c-border-soft);"'}>${inner}</section>`;
function pgl(pct) { return pct > 0 ? `<div style="margin-top:6px;"><div class="pgline"><div class="${pct < 100 ? 'pending' : ''}" style="width:${Math.min(100, pct)}%;"></div></div></div>` : ''; }
function tabBtn(key, label, icon) { return `<button onclick="viewState.tab='${key}';renderViewDrawer();" class="tab ${viewState.tab === key ? 'on' : ''}"><i data-lucide="${icon}" class="w-4 h-4"></i>${label}</button>`; }

function openViewDrawer(id) {
  viewState.tab = 'detail'; viewState.recordId = id;
  if (location.hash !== '#/view/' + id) location.hash = '#/view/' + id;   // refresh-safe route
  const overlay = document.getElementById('overlay-root');
  overlay.innerHTML = `<div class="overlay-wrap"><div class="backdrop" onclick="closeViewDrawer()"></div><div id="view-drawer" class="drawer-panel drawer-enter"><div id="view-drawer-content" style="display:flex;flex-direction:column;height:100%;"></div></div></div>`;
  requestAnimationFrame(() => document.getElementById('view-drawer').classList.add('drawer-active'));
  renderViewDrawer();
}
function closeViewDrawer() {
  const d = document.getElementById('view-drawer');
  if (d) { d.classList.remove('drawer-active'); d.classList.add('drawer-enter'); }
  setTimeout(() => { const o = document.getElementById('overlay-root'); if (o) o.innerHTML = ''; if (getRouteObj().name === 'view') navigate('list'); }, 200);

function renderViewDrawer() {

    </div>`;
  renderIcons();

function renderDetailTab(g) {
  /* FWD-WIRE: RTV handoff (แบนเนอร์ของไม่ผ่านตรวจ) · JE posting (W5) (การ์ดสรุปยอดเงิน) */
  const t = totals(g), po = PO_BY[g.po] || {}, rej = docRejectQty(g), late = lateDays(g);

  const recvPct = (po.lines || []).length ? Math.round(100 * (po.lines.reduce((s,l) => s + Math.min(l.received, l.qty_ordered), 0) / po.lines.reduce((s,l) => s + l.qty_ordered, 0))) : 0;

    + (rej > 0 ? `<div class="note warn" style="margin-bottom:12px;"><i data-lucide="shield-alert" class="w-4 h-4"></i><div><strong>มีของไม่ผ่านตรวจ ${fmi(rej)} หน่วย</strong> — เข้าโซนกักของ ${esc((LOC_BY[g.quarantine]||{}).name || g.quarantine)} · ออกจากโซนกักได้ทางเดียวคือคืนผู้ขาย (RTV)</div></div>` : '')
    + (po.shortClosed ? `<div class="note warn" style="margin-bottom:12px;"><i data-lucide="lock" class="w-4 h-4"></i><div><strong>ใบสั่งซื้อต้นทางถูกปิดก่อนรับครบ</strong> — เปิดใบรับใหม่จาก ${esc(g.po)} ไม่ได้</div></div>` : '')
    + (late > 0 ? `<div class="note" style="margin-bottom:12px;"><i data-lucide="clock" class="w-4 h-4"></i><div>ของมาถึงช้ากว่ากำหนดในใบสั่งซื้อ <strong>${late} วัน</strong> — เกณฑ์การเตือนอยู่ที่กติกากลาง (NC rules)</div></div>` : '');
  return `${banners}
    ${SECWRAP(SEC('info', 'ข้อมูลเอกสาร') + `<div class="kv-grid">
      ${KV('เลขที่ใบรับของ', `<span class="tbl-mono">${esc(g.code || '(ยังไม่ออกเลข)')}</span>`, g.code ? 'ออกจากศูนย์ตั้งค่าเอกสาร GRN-YYYY-NNNN' : 'เลขออกตอนรับเข้าคลังเท่านั้น')}
      ${KV('วันที่รับจริง', formatCEDate(g.receiveDate))}
      ${KV('เลขที่ใบส่งของผู้ขาย', esc(g.dnNo))}
      ${KV('วันที่บนใบส่งของ', formatCEDate(g.dnDate))}
    </div>`, true)}

/* ===================== RENDER + ROUTER ===================== */
function render() {
  const snap = preserveRenderState();
  const host = document.getElementById('page-content');
  const r = getRouteObj();
  host.innerHTML = renderListPage();
  renderIcons();
  restoreRenderState(snap);
  if (r.name === 'view' && r.id && !document.getElementById('view-drawer')) openViewDrawer(r.id);
  if (r.name === 'create' && !document.getElementById('create-drawer')) openCreateDrawer();
  if (r.name === 'edit' && r.id && !document.getElementById('create-drawer')) openCreateDrawer(r.id);
}
/* Esc chain: ปิด popup ของ combobox ก่อน แล้วค่อยปิด modal → drawer */
window.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (document.querySelector('.combo-pop')) { document.querySelectorAll('.combo-pop').forEach(n => n.remove()); return; }
  if (document.getElementById('post-modal')) { closePostModal(); return; }
  if (document.getElementById('reason-modal')) { closeReasonModal(); return; }
  if (document.getElementById('create-drawer')) { closeCreateDrawer(); return; }
  if (document.getElementById('view-drawer')) { closeViewDrawer(); return; }
});
