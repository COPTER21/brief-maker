# doccfg-declaration v2.1 — init จาก DECISIONS.lock + print_config · แก้ได้ก่อน brief
feature_id: F-TMP-001
doc_types:
- code: RPR
  name_th: แบบฟอร์มใบแจ้งซ่อมสินทรัพย์
  module: ASM
  feature_id: F-TMP-001
  numbering:
    preset: '{PREFIX}-{YYYY}-{run:4}'
    reset: yearly
    scope: global
    no_gap: false
    issue_on: first_save
    frd_ref: 03_LOGIC F-TMP-001-FN-03
  snapshot:
    sent_external: false
    approved_final: true
  snapshot_points:
  - event: approved_final
    frd_ref: 03_LOGIC F-TMP-001-FN-05
  print_config:
    form_code: FM-ASM-03
    revision: ''
    paper: A4-portrait
    min_rows: 10
    dense_when_rows_over: 10
    header_source: organization_snapshot_at_numbering
    sign_boxes:
    - box: requester
      label: ผู้แจ้งซ่อม
      show_date: true
      also_inline: ลงชื่อ…ผู้แจ้งซ่อม ใต้ตารางรายการ (DEC-13)
    - box: doa_step:*
      label: from_doa_step
      show_decision: true
      show_date: true
    decision_words:
      default:
        approve: อนุมัติ
        reject: ไม่อนุมัติ
      by_role:
        role-line-manager:
          approve: ตรวจสอบแล้ว
          reject: ไม่ผ่านการตรวจสอบ
    sign_layout:
      source: approval_chain snapshot (ผู้แจ้งซ่อม + จำนวนขั้นตามที่ตั้งใน DOA)
      max_per_row: 4
      split: even
      dense_when_steps_over: 4
      keep_together: true
    ref: print/print_config.json
