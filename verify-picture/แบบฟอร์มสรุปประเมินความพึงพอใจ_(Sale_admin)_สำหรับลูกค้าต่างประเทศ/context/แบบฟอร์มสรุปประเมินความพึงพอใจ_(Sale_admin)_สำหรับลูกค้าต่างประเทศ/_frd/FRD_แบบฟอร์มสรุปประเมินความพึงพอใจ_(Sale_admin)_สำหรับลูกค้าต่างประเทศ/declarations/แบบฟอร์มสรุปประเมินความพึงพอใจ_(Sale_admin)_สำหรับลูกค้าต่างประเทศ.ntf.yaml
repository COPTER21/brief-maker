  - owner
  - role-mgr-sales
  template: '**{doc_no}** สรุปความพึงพอใจลูกค้าต่างประเทศ เดือน {period_month} มี {low_count}
    ช่องที่ได้คะแนนต่ำ — ดูลูกค้า {low_customers}'
  channel: in-app
  optional: false
  why: G3 คะแนนต่ำ = เตือนไม่บล็อก — ฝ่ายขายต้องรู้หลังผู้บริหารรับทราบ เพื่อวางแผนแก้ไขกับลูกค้า
  frd_ref: 03_LOGIC F-TMP-007-FN-05, F-TMP-007-FN-08
excluded:
- doa_escalate
- doa_pending
- doa_result
