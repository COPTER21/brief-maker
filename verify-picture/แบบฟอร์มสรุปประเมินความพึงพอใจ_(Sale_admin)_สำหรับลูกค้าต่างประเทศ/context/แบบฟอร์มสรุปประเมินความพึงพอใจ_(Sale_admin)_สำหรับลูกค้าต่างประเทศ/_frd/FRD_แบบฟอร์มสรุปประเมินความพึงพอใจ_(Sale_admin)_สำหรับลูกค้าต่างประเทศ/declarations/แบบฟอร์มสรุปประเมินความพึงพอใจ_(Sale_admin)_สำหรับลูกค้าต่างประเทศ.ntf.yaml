  frd_ref: 03_LOGIC F-TMP-007-FN-06, F-TMP-007-FN-08
- id: ses_low_score_approved
  trigger: → approved และมีช่องคะแนน 1 หรือ 2 อย่างน้อย 1 ช่อง (weight ≤ 2 ตาม SalesConfig.sea_scale)
