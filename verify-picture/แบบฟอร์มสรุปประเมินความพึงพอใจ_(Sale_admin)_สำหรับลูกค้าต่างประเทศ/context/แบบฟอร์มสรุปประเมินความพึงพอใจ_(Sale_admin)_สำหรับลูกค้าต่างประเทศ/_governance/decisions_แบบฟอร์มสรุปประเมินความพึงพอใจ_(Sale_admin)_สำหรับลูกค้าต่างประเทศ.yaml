# unattended — AI-DEFAULT ทุกหมวด รอลูกค้ายืนยัน
# J007 · FM-SAL-23 แบบฟอร์มสรุปประเมินความพึงพอใจ (Sale admin) สำหรับลูกค้าต่างประเทศ (ใบสรุปของ FM-SAL-22 SEA)

# G1 ผลต่อระบบ — ไม่เปลี่ยนค่า ไม่ส่งต่อ · อ่านผลประเมินจากแบบประเมิน SEA (FM-SAL-22) ที่บันทึกผลแล้วแบบอ่านอย่างเดียว
config_changes: []
post_to: []

# G2 สายอนุมัติ — กระดาษมีผู้ลงชื่อ "ผู้รับทราบและอนุมัติ" 1 จุด (Managing Director) · role ใกล้สุดใน master = role-ceo (ไม่มี role "Managing Director")
doa: { required: true, mode: dynamic, default_steps: ["role-ceo"], step_labels: ["ผู้รับทราบและอนุมัติ (Managing Director)"], requester_role: "role-mgr-sales", amount: none }

# G3 สูตร / ค่าคงที่
calc:
  constants_from_config: true
  auto_compute: true
  over_limit: warn
  rules:
    - "หัวข้อประเมิน 10 ข้อใน 3 กลุ่ม (ถ้อยคำไทยตามกระดาษ FM-SAL-23) จับคู่ q1–q10 ของแบบประเมิน SEA · อ่านจาก SalesConfig.sea_topics[] + sea_topic_groups[] — ผู้ใช้ไม่แก้ข้อความหัวข้อ"
    - "ช่องในตาราง = คะแนน 1–5 จากแบบประเมิน SEA ที่ 'บันทึกผลแล้ว' ของลูกค้ารายนั้นในเดือนที่เลือก (อ่านอย่างเดียว) · แสดงเป็นตัวเลข 1–5 (5=Very Satisfied) ตาม SalesConfig.sea_scale[]"
    - "เลือกลูกค้าได้เฉพาะที่มีแบบประเมิน SEA บันทึกผลแล้วในเดือนนั้น · ลูกค้าเดียวกันซ้ำในใบเดียวกัน = บล็อก · ลูกค้ามีแบบประเมินหลายใบในเดือน = ใช้ใบล่าสุด (เตือน)"
    - "ส่งพิจารณาได้เมื่อมีลูกค้าอย่างน้อย 1 คอลัมน์ และกรอก สรุปผลการประเมิน แล้ว · ข้อเสนอแนะไม่บังคับ"
    - "ช่องใดของลูกค้าได้คะแนน 1 หรือ 2 = ไฮไลต์เตือนบนหน้าจอ (ไม่บล็อก ไม่พิมพ์สี)"
    - "แบบประเมิน SEA ถูกยกเลิกหลังดึงเข้าใบสรุป (ใบสรุปยังเป็นร่าง) = เตือนให้เอาคอลัมน์นั้นออก · ใบที่ส่งแล้วเก็บค่าที่ดึงไว้ (snapshot)"

# G4 รายการซ้ำ — คอลัมน์ลูกค้า สูงสุด 8 ต่อใบ (2 ชุดตาราง × 4 คอลัมน์ ตามกระดาษ) · แบบพิมพ์แสดงครบ 8 คอลัมน์ทุกสถานะ (2 หน้าคงที่) · ลูกค้าเกิน 8 ราย = ทำใบสรุปเพิ่ม
repeat: { max_rows: 8 }

# G5 ช่องตามกระดาษ — เพิ่มช่อง ประจำเดือน (ใบสรุปต้องมีงวด · ใช้ดึงแบบประเมิน) · ที่เหลือ 1:1
fidelity: { one_to_one: true, add_fields: ["ประจำเดือน"], merge_split: [] }

# G6 ลายเซ็น — แถวล่าง: ผู้สรุปผลการประเมิน (ผู้ส่ง) + 1 ช่องต่อขั้น DOA · ข้อความ "ส่งในระบบ / พิจารณาในระบบ" ไม่ใช้ภาพ
signature: { layout: row-bottom, per_doa_step: true, handwriting_image: false }

# G7 ไม่อนุมัติ / ยกเลิก
reject_cancel: { on_reject: back_to_draft, cancel_by: [owner, admin_role], cancel_states: [draft, pending], reason_required: true }

# G8 การมองเห็น
visibility: { owner: true, approver: after_submit, admin_role: all, admin_role_name: "ผู้จัดการฝ่ายขาย (role-mgr-sales)" }

# G9 เลขที่ — เอกสารภายใน ออกตอนบันทึกครั้งแรก · รหัส SES (Satisfaction · Export · Summary)
numbering: { issue_on: first_save, code: SES }

# G10 ของเสริม
extras: { attachments: true, copy: false, export_csv: true, announce: false }

extend: {}
fit: {}
