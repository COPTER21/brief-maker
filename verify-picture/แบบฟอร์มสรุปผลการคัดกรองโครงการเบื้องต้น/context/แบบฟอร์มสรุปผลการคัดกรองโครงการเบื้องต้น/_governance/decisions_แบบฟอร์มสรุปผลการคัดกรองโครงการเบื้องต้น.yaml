# unattended — AI-DEFAULT ทุกหมวด รอลูกค้ายืนยัน
# J003 · FM-BDM-03 แบบฟอร์มสรุปผลการคัดกรองโครงการเบื้องต้น · REQ-TMP-003 · F-TMP-003

# G1 ผลต่อระบบ — ไม่เปลี่ยนค่า ไม่ส่งต่อ (ผลคัดกรองเก็บในเอกสารนี้ · ผลไม่ดำเนินการต่อ → ผู้ใช้ทำ FM-BDM-04 เอง)
config_changes: []
post_to: []

# G2 สายอนุมัติ — dynamic · ค่าเริ่ม 2 ขั้นตามช่องลงชื่อบนกระดาษ (ผู้ตรวจสอบ → ผู้อนุมัติ/รับทราบ) · ไม่มีวงเงิน
#   ผู้ตรวจสอบ = ผู้จัดการฝ่ายพัฒนาธุรกิจ → role-line-manager (ผู้บังคับบัญชาตรงของผู้จัดทำ)
#   ผู้อนุมัติ / รับทราบ = รองกรรมการผู้จัดการ / ผู้มีอำนาจตามตารางอำนาจอนุมัติ → role-gm (ไม่มี role รองกรรมการผู้จัดการใน master — แจ้งในรายงาน)
doa: { required: true, mode: dynamic, default_steps: ["role-line-manager", "role-gm"], amount: none }

# G3 สูตร / ค่าคงที่
calc:
  constants_from_config: true
  auto_compute: true
  over_limit: warn
  rules:
    - "เกณฑ์ประเมิน 8 ข้อ + น้ำหนัก (%) อ่านจาก ScreeningCriteria.items และ snapshot ลงเอกสารตอนสร้าง (ผลรวมน้ำหนักต้อง = 100 ตรวจที่ config)"
    - "คะแนน (1-5) เลือกเลขเต็ม 1–5 เท่านั้น (ตัดรายการ ผ่าน/ไม่ผ่าน ที่ทับช่วงคะแนนในต้นฉบับ)"
    - "คะแนนถ่วงน้ำหนัก = น้ำหนัก × คะแนน / 5 (คำนวณอัตโนมัติ · ว่างจนกว่าให้คะแนน)"
    - "คะแนนรวมถ่วงน้ำหนัก = ผลรวมคะแนนถ่วงน้ำหนัก 8 เกณฑ์ (เต็ม 100) · ส่งได้เมื่อให้คะแนนครบ 8 เกณฑ์"
    - "ผลเสนอจากคะแนน: ≥ 80 เสนอให้ดำเนินการต่อ · ≥ 60 ดำเนินการต่อแบบมีเงื่อนไข · < 60 ไม่เสนอให้ดำเนินการต่อ (เกณฑ์จาก ScreeningCriteria.recommend_bands)"
    - "ผลการพิจารณา = ดำเนินการต่อแบบมีเงื่อนไข → เงื่อนไข / ข้อสั่งการ บังคับกรอก"
    - "ผลการพิจารณาไม่ตรงผลเสนอจากคะแนน = เตือน ไม่บล็อก และต้องกรอกเงื่อนไข / ข้อสั่งการ เป็นเหตุผล"

# G4 รายการซ้ำ — เกณฑ์ 8 แถวคงที่จาก config (ไม่ให้เพิ่ม/ลบในเอกสาร) · PDF แสดงครบ 8 แถว
repeat: { max_rows: 8 }

# G5 ช่องตามกระดาษ — 1:1 ไม่เพิ่มช่อง
fidelity: { one_to_one: true, add_fields: [], merge_split: [] }

# G6 ลายเซ็น — แถวล่าง 1 ช่องต่อขั้น DOA · ข้อความ "พิจารณาในระบบ" ไม่ใช้ภาพ
signature: { layout: row-bottom, per_doa_step: true, handwriting_image: false }

# G7 ไม่อนุมัติ → กลับเป็นร่างเลขเดิม · ยกเลิกได้ เจ้าของ + admin role ในสถานะ ร่าง/รออนุมัติ · เหตุผลบังคับ
reject_cancel: { on_reject: back_to_draft, cancel_by: [owner, admin_role], cancel_states: [draft, pending], reason_required: true }

# G8 การมองเห็น — เจ้าของ · ผู้อนุมัติหลังส่ง · admin role ฝ่ายพัฒนาธุรกิจเห็นทั้งหมด
visibility: { owner: true, approver: after_submit, admin_role: all }

# G9 เลขที่ — ออกตอนบันทึกครั้งแรก (เอกสารภายใน) · รหัส SCR (ย่อจาก Screening)
numbering: { issue_on: first_save, code: "SCR" }

# G10 ของเสริม — แนบ ✓ CSV ✓ ทำซ้ำ ✗ ประกาศ ✗
extras: { attachments: true, copy: false, export_csv: true, announce: false }

extend: {}
fit: {}
