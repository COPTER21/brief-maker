function tabBtn(key, label, icon, count){ return `<button class="drawer-tab ${S.dw.tab === key ? 'is-active' : ''}" onclick="setTab('${key}')"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i> ${label}${count != null ? `<span class="dt-count num">${count}</span>` : ''}</button>`; }
function kv(label, val){ return `<div class="lbl">${label}</div><div class="val">${val}</div>`; }
const SEC = (icon, title, body, extra) => `<div class="drawer-section"><div class="drawer-section-title"><i data-lucide="${icon}" class="w-3.5 h-3.5"></i>${title}${extra || ''}</div>${body}</div>`;
const emptySub = t => `<div class="empty-sub"><i data-lucide="inbox" class="w-5 h-5"></i><span>${t}</span></div>`;
function fileRow(x){ return `<div class="file-row"><div class="file-ic"><i data-lucide="file" class="w-4 h-4"></i></div><div class="file-name">${esc(x.name)}</div><span class="file-size">${x.size}</span></div>`; }
/* ผลพิจารณาสุดท้าย (☐ อนุมัติ / ☐ ไม่อนุมัติ ในกรอบเจ้าหน้าที่) + ความเห็นผู้บังคับบัญชา */
function decisionOf(r){
  if (r.status === 'approved') return { k:'approved', note:(r.chain.filter(c => c.note).pop() || {}).note || '' };
  if (r.lastReject && r.status === 'draft') return { k:'rejected', note:r.lastReject.note };
  return { k:'', note:'' };
}
function decisionText(r){ const d = decisionOf(r); return d.k === 'approved' ? pill({ a:['อนุมัติ','pill-success'] }, 'a') : d.k === 'rejected' ? pill({ x:['ไม่อนุมัติ','pill-danger'] }, 'x') : '<span class="cell-mute">ยังไม่พิจารณา</span>'; }
function viewBanner(r){
  if (r.status === 'cancelled'){ const a = r.audit.filter(x => x.act === 'ยกเลิกเอกสาร').pop(); return `<div class="alert-row is-danger"><i data-lucide="x-circle" class="w-4 h-4"></i><div>ยกเลิกแล้ว — ${esc(a ? a.note : '')}</div></div>`; }
  if (r.status === 'pending') return `<div class="alert-row"><i data-lucide="hourglass" class="w-4 h-4"></i><div>รอ ${esc(empOf(curStep(r).assignee).name)} พิจารณา${canAct(r) ? ' — คุณเป็นผู้พิจารณา' : ''}</div></div>`;
  if (r.status === 'draft' && r.lastReject) return `<div class="alert-row is-danger"><i data-lucide="corner-up-left" class="w-4 h-4"></i><div>ไม่อนุมัติ — ${esc(r.lastReject.note)} · แก้ไขแล้วส่งใหม่ได้ (เลขเดิม)</div></div>`;
  if (r.status === 'draft') return `<div class="alert-row"><i data-lucide="pencil" class="w-4 h-4"></i><div>ยังเป็นร่าง — กรอกครบแล้วกดส่งขออนุมัติ</div></div>`;
  return `<div class="alert-row"><i data-lucide="check-circle-2" class="w-4 h-4"></i><div>อนุมัติให้เข้าพื้นที่แล้ว — พิมพ์แบบฟอร์มให้ผู้มาติดต่อลงนามที่จุดรับแขก</div></div>`;
}
function renderDetailTab(r){
  const f = r.f, d = decisionOf(r);
  return viewBanner(r)
    + SEC('info', 'ข้อมูลเอกสาร', `<div class="drawer-fields">${kv('เลขที่เอกสาร', `<span class="code-strong">${r.code}</span>`)}${kv('วันที่', f.visitDate ? fmtDate(f.visitDate) : '—')}${kv('สถานะเอกสาร', docPill(r.status))}${kv('บันทึกโดย', personInline(r.by))}</div>`)
    + SEC('user', 'ข้อมูลบุคคล / บริษัท / หน่วยงาน ผู้มาติดต่อ', `<div class="drawer-fields">
        ${kv('ชื่อ (นาง/นางสาว/นาย)', esc(visitorName(f)) || '—')}${kv('หมายเลขโทรศัพท์', esc(f.vPhone) || '—')}${kv('ชื่อบริษัท / หน่วยงาน', esc(f.vCompany) || '—')}
        ${kv('ติดต่อกับพนักงานใน' + esc(DOC.company), personInline(r.emp))}${kv('วัตถุประสงค์เพื่อ', esc(f.purpose) || '—')}${kv('วันที่ลงนามผู้มาติดต่อ', f.vSignDate ? fmtDate(f.vSignDate) : '—')}</div>`)
    + SEC('building-2', 'สำหรับเจ้าหน้าที่ ' + esc(DOC.company), `<div class="drawer-fields">
        ${kv('ชื่อผู้รับการติดต่อ', personInline(r.emp))}${kv('สังกัดฝ่าย', esc(r.snap.div))}${kv('ชื่อผู้บังคับบัญชาต้นสังกัด', esc(r.snap.mgr) || '—')}
        ${kv('ผลพิจารณา', decisionText(r))}${kv('ผู้บังคับบัญชาพิจารณา', esc(d.note) || '—')}</div>`)
    + SEC('paperclip', `เอกสารแนบ (${r.attachments.length} ไฟล์ · Document Center)`, r.attachments.length ? r.attachments.map(fileRow).join('') : emptySub('ไม่มีเอกสารแนบ'))

}

const PDF_CSS = "@import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap');\n/* ============================================================\n   THAI BUSINESS DOCUMENT — MASTER A4 STYLESHEET  (LEAN v2)\n   CI: CUBE NATIVE (Navy #0B1D3A / Primary #0B5CFF / Teal #00A88E)\n   Font: Sarabun (Thai official document standard)\n   Design rules: lean & light type · thin minimal table header ·\n   single-line dense rows · signatures + footer pinned to page bottom.\n   DO NOT edit per-document.  injected by build_html.py.\n   ============================================================ */\n\n\n\n:root{\n  /* ---- CUBE NATIVE CI (verbatim from html-generator-v3) ---- */\n  --c-navy:#0B1D3A; --c-navy-2:#14284A;\n  --c-primary:#0B5CFF; --c-primary-hover:#0847CC;\n  --c-teal:#00A88E; --c-teal-light:#5EEAD4;\n  --c-ink:#0F172A; --c-mute:#475569; --c-mute-2:#64748B; --c-mute-3:#94A3B8;\n  --c-line:#CBD5E1; --c-line-2:#E2E8F0; --c-line-3:#F1F5F9;\n  --c-bg-off:#F8FAFC;\n  --c-success:#10B981; --c-warning:#D97706; --c-danger:#DC2626;\n\n  /* ---- Print geometry (A4) ---- */\n  --page-w:210mm; --page-h:297mm;\n  --page-margin:14mm;\n  --content-h:269mm;        /* 297 - 2*14 (printable height) */\n  --fs-base:9pt;            /* lean body size */\n}\n\n@page{ size:A4 portrait; margin:var(--page-margin); }\n\n*{ box-sizing:border-box; margin:0; padding:0; }\n\nhtml,body{\n  font-family:'Sarabun','Loma',sans-serif;\n  font-size:var(--fs-base);\n  font-weight:400;\n  line-height:1.4;\n  color:var(--c-ink);\n  -webkit-font-smoothing:antialiased;\n  background:#fff;\n}\n\n/* ===== A4 PAGE — flex column so .doc-bottom can pin to bottom ===== */\n.doc-page{ display:flex; flex-direction:column; }\n.doc-content{ flex:0 0 auto; }\n.doc-bottom{ margin-top:auto; }   /* pushes signatures + footer to page bottom */\n\n@media screen{\n  body{ background:#e7ebf0; padding:24px 0; }\n  .doc-page{\n    width:var(--page-w); min-height:var(--page-h);\n    margin:0 auto 24px; padding:var(--page-margin);\n    background:#fff; box-shadow:0 4px 24px rgba(11,29,58,.18);\n  }\n}\n@media print{\n  .doc-page{ width:auto; min-height:var(--content-h); padding:0; box-shadow:none; }\n}\n\n/* ============================================================\n   1. HEADER — thin rule, lighter type\n   ============================================================ */\n.doc-head{\n  display:flex; justify-content:space-between; align-items:flex-start;\n  gap:12mm; padding-top:1.5mm; padding-bottom:6px; border-bottom:1.5px solid var(--c-navy);\n}\n.doc-head__brand{ display:flex; gap:9px; align-items:flex-start; }\n.doc-logo{ width:46px; height:46px; flex:0 0 auto; border-radius:7px; object-fit:contain; }\n.doc-logo--ph{\n  display:flex; align-items:center; justify-content:center;\n  background:linear-gradient(135deg,var(--c-navy),var(--c-teal));\n  color:#fff; font-weight:700; font-size:15pt; letter-spacing:.03em;\n}\n.doc-org__name{ font-size:11.5pt; font-weight:700; color:var(--c-navy); line-height:1.5; }\n.doc-org__line{ font-size:7.8pt; color:var(--c-mute); line-height:1.35; }\n.doc-org__tax{ font-size:7.8pt; color:var(--c-mute-2); margin-top:1px; }\n\n.doc-head__title{ text-align:right; flex:0 0 auto; min-width:54mm; }\n.doc-title{ font-size:15pt; font-weight:700; color:var(--c-navy); line-height:1.45; }\n.doc-title__en{ font-size:7.5pt; font-weight:500; color:var(--c-mute-2); letter-spacing:.08em; text-transform:uppercase; }\n.doc-copy{ display:inline-block; margin-top:3px; padding:0 8px; border:1px solid var(--c-line);\n  border-radius:999px; font-size:7pt; font-weight:500; color:var(--c-mute); }\n\n/* ============================================================\n   2. META STRIP\n   ============================================================ */\n.doc-meta{ display:flex; flex-wrap:wrap; gap:0 22px; margin-top:7px; font-size:8.3pt; }\n.doc-meta__item{ display:flex; gap:5px; padding:1px 0; }\n.doc-meta__k{ color:var(--c-mute-2); }\n.doc-meta__v{ color:var(--c-ink); font-weight:600; }\n\n/* ============================================================\n   3. PARTY BLOCKS — light, no heavy fill\n   ============================================================ */\n.parties{ display:flex; gap:5mm; margin-top:9px; }\n.party{ flex:1; border:1px solid var(--c-line-2); border-radius:6px; padding:6px 9px; }\n.party__label{ font-size:7.2pt; font-weight:600; color:var(--c-primary);\n  text-transform:uppercase; letter-spacing:.06em; margin-bottom:2px; }\n.party__name{ font-size:9.3pt; font-weight:700; color:var(--c-ink); }\n.party__line{ font-size:8pt; color:var(--c-mute); line-height:1.35; }\n\n/* ============================================================\n   4. LINE-ITEM TABLE — minimal thin header, hairline rows, single-line\n   ============================================================ */\n.items{ width:100%; border-collapse:collapse; margin-top:10px; font-size:8.4pt; }\n.items thead th{\n  background:var(--c-navy); color:#fff; font-weight:600; font-size:7.6pt;\n  letter-spacing:.03em; text-align:left; padding:6px 8px;\n}\n.items thead th:first-child{ border-top-left-radius:5px; border-bottom-left-radius:5px; }\n.items thead th:last-child{ border-top-right-radius:5px; border-bottom-right-radius:5px; }\n.items tbody td{\n  padding:5px 8px; border-bottom:1px solid var(--c-line-2);\n  vertical-align:top; color:var(--c-ink); line-height:1.4;\n}\n.items .num{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }\n.items .ctr{ text-align:center; white-space:nowrap; }\n.items .col-no{ width:8mm; text-align:center; color:var(--c-mute-2); }\n.items .col-qty{ width:16mm; } .items .col-unit{ width:14mm; }\n.items .col-price{ width:23mm; } .items .col-amt{ width:25mm; }\n/* secondary detail kept INLINE so a row stays one line */\n.items td .sub{ color:var(--c-mute-2); font-size:7.4pt; }\n.items td .sub::before{ content:\"·\"; margin:0 5px; color:var(--c-mute-3); }\n.items tr{ break-inside:avoid; }\n.items thead{ display:table-header-group; }\n\n/* ============================================================\n   5. TOTALS — rules instead of heavy fill\n   ============================================================ */\n.foot-grid{ display:flex; gap:5mm; margin-top:8px; align-items:flex-start; }\n.foot-left{ flex:1; }\n.totals{ flex:0 0 60mm; }\n.totals__row{ display:flex; justify-content:space-between; gap:10px; padding:2.5px 8px; font-size:8.6pt; }\n.totals__row .k{ color:var(--c-mute); }\n.totals__row .v{ font-weight:600; font-variant-numeric:tabular-nums; }\n.totals__row--rule{ border-top:1px solid var(--c-line-2); }\n.totals__grand{\n  margin-top:4px; padding:6px 10px; border-radius:6px; background:var(--c-navy);\n  display:flex; justify-content:space-between; align-items:baseline;\n}\n.totals__grand .k{ font-size:8.8pt; font-weight:600; color:#fff; }\n.totals__grand .v{ font-size:11.5pt; font-weight:700; color:#fff; font-variant-numeric:tabular-nums; }\n/* amount-in-words — full width, larger, clear */\n.baht-text{ margin-top:7px; padding:6px 11px; border:1px dashed var(--c-line);\n  border-radius:6px; display:flex; justify-content:space-between; align-items:baseline; gap:12px; }\n.baht-text__k{ font-size:8pt; color:var(--c-mute-2); white-space:nowrap; }\n.baht-text b{ font-size:9.6pt; color:var(--c-navy); font-weight:700; text-align:right; }\n\n/* ============================================================\n   6. NOTES / TERMS\n   ============================================================ */\n.notes{ border:1px solid var(--c-line-2); border-radius:6px; padding:6px 9px;\n  font-size:8pt; color:var(--c-mute); }\n.notes__title{ font-size:7.2pt; font-weight:600; color:var(--c-mute-2);\n  text-transform:uppercase; letter-spacing:.05em; margin-bottom:3px; }\n.notes ol,.notes ul{ margin-left:15px; }\n.notes li{ margin:1px 0; }\n\n/* ============================================================\n   7. SIGNATURE BLOCK — sits inside .doc-bottom (above footer)\n   ============================================================ */\n.signs{ display:flex; gap:5mm; margin-top:14px; break-inside:avoid; }\n.sign{ flex:1; text-align:center; }\n.sign__line{ height:30px; border-bottom:1px solid var(--c-mute-3); margin:0 5mm; }\n.sign__paren{ font-size:8pt; color:var(--c-mute-2); margin-top:4px; }\n.sign__role{ font-size:8.4pt; font-weight:600; color:var(--c-ink); margin-top:1px; }\n.sign__name{ font-size:7.8pt; color:var(--c-mute); }\n.sign__date{ font-size:7.6pt; color:var(--c-mute-2); margin-top:1px; }\n\n/* ============================================================\n   8. OFFICIAL THAI LETTER / MEMO (ระเบียบงานสารบรรณ) — logo-left head\n   ============================================================ */\n.letter{ margin-top:8px; font-size:10pt; line-height:1.6; color:var(--c-ink); }\n\n/* ที่ (เลขหนังสือ) ซ้าย + ส่วนราชการ/ที่อยู่ ขวา */\n.letter__refrow{ display:flex; justify-content:space-between; align-items:flex-start; gap:14mm; margin-top:6px; }\n.letter__ref{ font-size:10pt; }\n.letter__agency{ text-align:right; font-size:9.2pt; color:var(--c-mute); line-height:1.4; }\n\n/* วันที่ — จัดกึ่งกลาง ไม่มีคำว่า \"วันที่\" นำ (ตามแบบราชการ) */\n.letter__date{ text-align:center; margin:10px 0 12px; font-size:10pt; }\n\n/* ฟิลด์หัวเรื่อง เรื่อง/เรียน/อ้างถึง/สิ่งที่ส่งมาด้วย — hanging indent */\n.letter__field{ display:flex; gap:10px; margin:3px 0; }\n.letter__field .lbl{ flex:0 0 auto; }\n.letter__field .val{ flex:1; text-align:justify; }\n.letter__field .val b,.letter__subject{ font-weight:700; }\n\n/* เนื้อหา — ย่อหน้าเยื้องบรรทัดแรก, จัดเต็มแนว */\n.letter__body{ margin-top:6px; }\n.letter__body p,.letter p{ margin:7px 0; text-indent:3.5em; text-align:justify; }\n\n/* คำลงท้าย + ลายเซ็น — กล่องชิดขวา */\n.letter__close{ margin-top:16px; margin-left:auto; width:72mm; text-align:center; }\n.letter__close .sp{ height:42px; }\n.letter__close .nm{ font-weight:600; }\n.letter__close .pos{ color:var(--c-mute); }\n\n/* เจ้าของเรื่อง (ส่วนราชการเจ้าของเรื่อง) — ล่างซ้าย ตัวเล็ก */\n.letter__owner{ font-size:8.6pt; color:var(--c-ink); line-height:1.45; }\n\n/* ============================================================\n   9. PAGE FOOTER — pinned bottom via .doc-bottom\n   ============================================================ */\n.doc-footer{ margin-top:8px; padding-top:5px; border-top:1px solid var(--c-line-2);\n  display:flex; justify-content:space-between; font-size:7.4pt; color:var(--c-mute-2); }\n\n/* ============================================================\n   UTILITIES\n   ============================================================ */\n.muted{ color:var(--c-mute); }\n.right{ text-align:right; } .center{ text-align:center; } .nowrap{ white-space:nowrap; }\n.mt-0{ margin-top:0 } .mt-8{ margin-top:8px } .mt-12{ margin-top:12px } .mt-16{ margin-top:16px }\n.tag{ display:inline-block; padding:0 7px; border-radius:999px; font-size:7.4pt; font-weight:600; }\n.tag--info{ background:#DBEAFE; color:#1E40AF; }\n.tag--ok{ background:#D1FAE5; color:#065F46; }\n.tag--warn{ background:#FEF3C7; color:#92400E; }\n.tag--danger{ background:#FEE2E2; color:#DC2626; }\n\n/* ============================================================\n   FORM REPLICA (mode=replica) — ขึ้น \"แบบฟอร์มของลูกค้า\" เป็นเอกสารระบบ\n   ใช้คู่ base.css (ใส่ให้อัตโนมัติเมื่อ build_html.py --mode replica)\n   ทุกค่าเป็น style token ปรับต่อลูกค้าได้ผ่าน --profile (profiles/*.json)\n   ห้ามเขียนค่าตายตัวใน body — ปรับที่ profile เท่านั้น\n   ============================================================ */\n:root{\n  --form-fs:9.6pt; --form-lh:1.6;\n  --form-ink:#111111; --form-mute:#6B6B6B; --form-dot:#9A9CA2;\n  --form-title-fs:14pt; --form-title-gap:16px;\n  --form-logo-h:15mm; --form-logo-maxw:70mm; --form-logo-align:center;\n  --form-row-gap:8px; --form-row-gap-dense:5px;\n  --form-indent:12mm; --form-para-gap:24px; --form-para-gap-dense:14px;\n  --form-fill-pad:6px; --form-fill-s:15mm; --form-fill-m:30mm; --form-fill-l:60mm;\n  --form-date-w:52mm; --form-num-w:6mm; --form-cb-fs:12pt;\n  --form-grid-line:#111111; --form-grid-head-bg:#E6E6E6; --form-grid-pad:4px; --form-grid-row-h:6.2mm; --form-grid-row-h-dense:5mm; --form-grid-gap:0px;\n}\n.form{ font-size:var(--form-fs); line-height:var(--form-lh); color:var(--form-ink); }\n.form-brand{ display:flex; justify-content:var(--form-logo-align); }\n.form-logo{ height:var(--form-logo-h); width:auto; max-width:var(--form-logo-maxw); object-fit:contain; }\n.form-title{ text-align:center; font-size:var(--form-title-fs); font-weight:700; line-height:1.45; margin-top:var(--form-title-gap); }\n.form-date{ display:flex; justify-content:flex-end; margin-top:var(--form-title-gap); }\n.form-date .fill{ flex:0 0 var(--form-date-w); }\n.form-row{ display:flex; align-items:baseline; gap:6px; margin-top:var(--form-row-gap); }\n.form-row--indent{ padding-left:var(--form-indent); margin-top:calc(var(--form-row-gap) * 3); }\n.form-row .fill{ flex:1 1 0; }\n.form-row .fill--s{ flex:0 0 var(--form-fill-s); } .form-row .fill--m{ flex:0 0 var(--form-fill-m); } .form-row .fill--l{ flex:0 0 var(--form-fill-l); }\n.fill{ display:inline-block; min-height:1.45em; padding:0 var(--form-fill-pad); border-bottom:1px dotted var(--form-dot); font-weight:500; color:var(--form-ink); text-align:center; }\n.fill--left{ text-align:left; }\n.fill--s, .fill--m{ white-space:nowrap; }\n.fill .sub{ font-size:7.6pt; font-weight:400; color:var(--form-mute); }\n.form-num{ flex:0 0 var(--form-num-w); }\n.form-p{ margin-top:var(--form-para-gap); padding-left:var(--form-indent); }\n.form-check{ display:flex; align-items:baseline; gap:6px; margin-top:calc(var(--form-row-gap) * 2); }\n.form-check__lbl{ flex:0 0 auto; white-space:nowrap; }\n.form-check__opts{ flex:1; }\n.form-check__opt{ display:flex; align-items:baseline; gap:6px; margin-bottom:5px; }\n.form-check--inline .form-check__opts{ display:flex; flex-wrap:wrap; gap:4px 18px; }\n.cb{ font-size:var(--form-cb-fs); line-height:1; }\n.form-check .fill--s{ min-width:10mm; } .form-check .fill--m{ min-width:22mm; }\n.form-box{ margin-top:var(--form-row-gap); padding:6px 8px; border:1px solid var(--form-dot); min-height:18mm; }\n.form-section{ margin-top:var(--form-para-gap); font-weight:700; }\n/* รายการซ้ำยาว (> min_rows) → ระยะกระชับให้จบหน้าเดียวได้นานที่สุด (data.layout.dense) */\n.form.form--dense .form-row{ margin-top:var(--form-row-gap-dense); }\n.form.form--dense .form-row--indent{ margin-top:calc(var(--form-row-gap-dense) * 3); }\n.form.form--dense .form-check{ margin-top:calc(var(--form-row-gap-dense) * 2); }\n.form.form--dense .form-p{ margin-top:var(--form-para-gap-dense); }\n\n/* R9 · ตารางกรอบ (grid form) — ฟอร์มที่กระดาษเป็นตารางเส้นทึบ (เช่น FM-FIN-02) · v2.1 */\n.form-grid{ width:100%; border-collapse:collapse; table-layout:fixed; margin-top:var(--form-grid-gap); }\n.form-grid + .form-grid{ border-top:0; }\n.form-grid td, .form-grid th{ border:1px solid var(--form-grid-line); padding:2px var(--form-grid-pad); height:var(--form-grid-row-h); vertical-align:middle; text-align:left; font-weight:400; overflow:hidden; }\n.form-grid th{ background:var(--form-grid-head-bg); font-weight:700; text-align:center; }\n.form-grid .g-b{ font-weight:700; } .form-grid .g-r{ text-align:right; } .form-grid .g-c{ text-align:center; }\n.form-grid .g-v{ font-weight:500; } .form-grid .g-num{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; font-weight:500; }\n.form-grid .g-25{ width:25%; } .form-grid .g-50{ width:50%; } .form-grid .g-75{ width:75%; }\n.form-grid .g-tall{ height:calc(var(--form-grid-row-h) * 1.5); }\n.form-grid .g-u{ text-decoration:underline; font-weight:700; }\n.form.form--dense .form-grid td{ height:var(--form-grid-row-h-dense); }\n.form-note{ margin-top:var(--form-row-gap); } .form-note .b{ font-weight:700; }\n.form-grid--signs td{ text-align:center; vertical-align:top; }\n.form-grid td.g-blank{ border-top:0; border-left:0; }\n.form-grid tr.g-hrow td{ height:calc(var(--form-grid-row-h) * 1.4); }\n\n/* B6 rows · ช่องลงชื่อ dynamic ตาม DOA (v2.1) — data ส่ง sign_rows[].signs[] แถวละ ≤4 (sign_rows.py / tplSignRows)\n   ห่อด้วย .signs-block ทุกครั้ง = ทั้งก้อนไม่ถูกตัดข้ามหน้า · .doc-bottom.is-dense เมื่อขั้น DOA > 4 */\n.form-grid--signs + .form-grid--signs{ margin-top:0; border-top:0; }\n.form-grid--signs + .form-grid--signs td{ border-top:0; }\n.doc-bottom.is-dense .sign__line{ height:16px; }\n.doc-bottom.is-dense .form-grid--signs td{ padding-top:1px; padding-bottom:1px; }\n.doc-bottom.is-dense .sign__date, .doc-bottom.is-dense .sign__name{ font-size:7.2pt; }\n.signs-block{ break-inside:avoid; page-break-inside:avoid; }\n.signs-block .signs + .signs{ margin-top:4mm; }\n.doc-bottom.is-dense .signs-block .signs + .signs{ margin-top:2mm; }\n\n/* profile: credence-fm-hrm-05 */\n:root{--form-fs:10pt; --form-title-fs:14pt; --form-logo-h:14mm; --form-logo-align:center; --form-row-gap:10px; --form-para-gap:18px; --form-date-w:60mm;}";

eft\">{{approval.comment}}</span></div>\n    <div class=\"form-check\"><span class=\"form-check__lbl\">&nbsp;</span><div class=\"form-check__opts\">\n      <div class=\"form-check__opt\"><span class=\"cb\">{{approval.approve_box}}</span> อนุมัติ</div>\n      <div class=\"form-check__opt\"><span class=\"cb\">{{approval.reject_box}}</span> ไม่อนุมัติ</div>\n    </div></div>\n  </td></tr></table>\n</div><div class=\"doc-bottom{{#layout.dense}} is-dense{{/layout.dense}}\">\n  <div class=\"signs-block\">{{#sign_rows}}<table class=\"form-grid form-grid--signs\"><tr>{{#signs}}<td>\n    <div class=\"sign__name\">{{#decision}}{{approve_box}} {{approve_word}} &nbsp;&nbsp; {{reject_box}} {{reject_word}}{{/decision}}{{^decision}}&nbsp;{{/decision}}</div>\n    <div class=\"sign__line\"></div>\n    <div class=\"sign__paren\">({{name}})</div>\n    <div class=\"sign__name\">{{role}}</div>\n    <div class=\"sign__date\">{{date}}</div>\n  </td>{{/signs}}</tr></table>\n  {{/sign_rows}}</div>\n  <div class=\"doc-footer\"><span>เลขที่ {{doc.no}}{{#doc.is_draft}} · ร่าง{{/doc.is_draft}} · เอกสารนี้จัดทำโดยระบบ CUBE NATIVE</span><span>Doc No. {{doc.form_code}} · {{doc.revision}}</span></div>\n</div></div>\n";

const thFull = iso => { if (!iso) return ''; const d = iso.slice(0, 10).split('-'); return Number(d[2]) + ' ' + TH_MONTH[Number(d[1]) - 1] + ' ' + (Number(d[0]) + 543); };

      <div class="field" id="fSign"><label class="field-label">วันที่ (ลงนามผู้มาติดต่อ)</label>${bedateHTML('vSignDate', f.vSignDate, { onPick:'pickSign', placeholder:'ค่าเริ่ม = วันที่เข้าพื้นที่' })}${signWarn(f) ? '<div class="field-warn"><i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i>วันที่ลงนามก่อนวันที่เข้าพื้นที่</div>' : '<div class="slot-help">ผู้มาติดต่อลงนามด้วยมือบนแบบพิมพ์</div>'}</div>

  </div>`;
}
function card2(f){

    ${f.host ? `<div class="drawer-fields sys-fields">${kv('ชื่อผู้รับการติดต่อ (นาง/ นางสาว/ นาย)', esc(h.name))}${kv('สังกัดฝ่าย', esc(h.div))}${kv('ชื่อผู้บังคับบัญชาต้นสังกัด', esc(empOf(h.mgr).name) || '—')}${kv('ผู้บังคับบัญชาพิจารณา', '<span class="cell-mute">กรอกโดยผู้บังคับบัญชาตอนพิจารณา</span>')}</div>`
      : emptySub('เลือกพนักงานที่ติดต่อก่อน — ระบบดึงฝ่ายและผู้บังคับบัญชาให้')}
  </div>`;
}
function wizMain(){

      ${STEPH('clipboard-list', 'ข้อมูลคำขอเข้าพื้นที่', 'กรอกตามแบบฟอร์ม ' + DOC.form + ' — ผู้รับการติดต่อเป็นผู้ส่งขออนุมัติ')}
      ${card1(f)}${card2(f)}
    </div>${sumCard(f)}</div>`;

function wizAttach(){
  const f = wf();
  return STEPH('paperclip', 'แนบเอกสารประกอบ (ถ้ามี)', 'เช่น หนังสือนัดหมาย ใบเสนอราคา หรือรายชื่อผู้ติดตาม')
    + `<div class="upload-zone" onclick="document.getElementById('varFile').click()"><div class="uz-ic"><i data-lucide="upload-cloud" class="w-5 h-5"></i></div>
        <div class="uz-t">${f.files.length ? 'แนบไฟล์เพิ่ม' : 'คลิกเพื่อแนบไฟล์ (เลือกได้หลายไฟล์)'}</div><div class="uz-d">PDF, Word, Excel หรือรูปภาพ ไม่เกิน 20 MB ต่อไฟล์</div></div>
      <input type="file" id="varFile" multiple hidden accept="${FILE_ACCEPT}" onchange="pickFiles(this)">
      ${f.files.map((x, i) => `<div class="file-row"><div class="file-ic"><i data-lucide="file" class="w-4 h-4"></i></div><div class="file-name">${esc(x.name)}</div><span class="file-size">${x.size}</span><button class="ra-btn is-danger" title="ลบไฟล์" onclick="removeFile(${i})"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>`).join('')}`;
}
function wizReview(){
  const f = wf(), h = empOf(f.host);
  return STEPH('check-circle-2', 'ตรวจสอบและยืนยัน', 'ส่งแล้วแก้ไขไม่ได้ — ถ้าไม่อนุมัติ เอกสารกลับเป็นร่างเลขเดิมให้แก้แล้วส่งใหม่')
    + `<div class="review-card"><div class="review-title"><i data-lucide="user" class="w-4 h-4"></i>ข้อมูลผู้มาติดต่อ</div><div class="drawer-fields">
        ${kv('วันที่', f.visitDate ? fmtDate(f.visitDate) : '—')}${kv('ชื่อ (นาง/นางสาว/นาย)', esc(visitorName(f)) || '—')}${kv('หมายเลขโทรศัพท์', esc(f.vPhone) || '—')}${kv('ชื่อบริษัท / หน่วยงาน', esc(f.vCompany) || '—')}
        ${kv('วัตถุประสงค์เพื่อ', esc(f.purpose) || '—')}${kv('วันที่ลงนามผู้มาติดต่อ', f.vSignDate ? fmtDate(f.vSignDate) : '—')}</div></div>
      <div class="review-card"><div class="review-title"><i data-lucide="building-2" class="w-4 h-4"></i>สำหรับเจ้าหน้าที่</div><div class="drawer-fields">
        ${kv('ผู้รับการติดต่อ', f.host ? esc(h.name) : '—')}${kv('สังกัดฝ่าย', f.host ? esc(h.div) : '—')}${kv('ผู้บังคับบัญชาต้นสังกัด', f.host ? esc(empOf(h.mgr).name) : '—')}</div></div>
      <div class="review-card"><div class="review-title"><i data-lucide="paperclip" class="w-4 h-4"></i>เอกสารแนบ<span class="dt-count num">${f.files.length}</span></div>${f.files.length ? f.files.map(fileRow).join('') : emptySub('ไม่มีเอกสารแนบ')}</div>`;
}
function renderWizard(){
  const s = S.dw.step, edit = S.dw.editId ? findR(S.dw.editId) : null, last = s === STEPS.length;
  const body = s === 1 ? wizMain() : s === 2 ? wizAttach() : wizReview();
  return `<div class="dw-head"><div class="dw-head-row"><div>
        <div class="dw-eyebrow"><i data-lucide="${edit ? 'pencil' : 'file-plus'}" class="w-3.5 h-3.5"></i> ${edit ? 'แก้ไขเอกสาร' : 'สร้างเอกสารใหม่'}</div>
        <h2 class="dw-title">${edit ? edit.code : DOC_NAME}</h2></div>
        <button class="top-icon-btn" title="ปิด" onclick="closeDrawer()"><i data-lucide="x" class="w-5 h-5"></i></button></div>${stepper()}</div>
    <div class="drawer-body ${s === 1 ? 'is-soft' : ''}">${body}</div>
    <div class="dw-footer"><div>${s > 1 ? '<button class="btn btn-secondary" onclick="wizBack()"><i data-lucide="arrow-left" class="w-4 h-4"></i><span>ย้อนกลับ</span></button>' : ''}</div>
      <div class="dw-footer-right"><button class="btn btn-ghost" onclick="closeDrawer()">ยกเลิก</button>
        ${last ? `<button class="btn btn-secondary" id="btnDraft" onclick="saveDraft()" ${S.busy ? 'disabled' : ''}><i data-lucide="save" class="w-4 h-4"></i><span>บันทึกแบบร่าง</span></button>
          <button class="btn btn-primary" id="btnSaveSubmit" onclick="saveAndSubmit()" ${S.busy ? 'disabled' : ''}>${S.busy ? '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>' : '<i data-lucide="send" class="w-4 h-4"></i><span>บันทึกและส่งขออนุมัติ</span>'}</button>`
          : '<button class="btn btn-primary" id="btnNext" onclick="wizNext()"><span>ถัดไป</span><i data-lucide="arrow-right" class="w-4 h-4"></i></button>'}
      </div></div>`;
}

/* ---------- wizard actions ---------- */
function goStep(n){ S.dw.step = n; render(); }
function clearErr(k){ if (S.dw.err){ delete S.dw.err[k]; if (!['visitDate', 'vTitle', 'vName', 'vPhone', 'vCompany', 'host', 'purpose'].some(x => S.dw.err[x])) delete S.dw.err.sec1; } }
function setHost(id){ const f = wf(); f.host = id || ''; clearErr('host'); dirty(); render(); }
function pickVisit(iso){ const f = wf(); f.visitDate = iso; if (!f.vSignDate) f.vSignDate = iso; clearErr('visitDate'); dirty(); render(); }
function pickSign(iso){ const f = wf(); f.vSignDate = iso; dirty(); render(); }
function setF1(k, v, rerender){ const f = wf(); f[k] = v; clearErr(k); dirty(); if (rerender) render(); else { const el = document.querySelector(`[name="${k}"]`); if (el && el.closest('.field')) el.closest('.field').classList.remove('is-invalid'); } }
function syncSum(){ const f = wf(), a = document.getElementById('sumVis'), b = document.getElementById('sumCo'); if (a) a.textContent = visitorName(f) || '—'; if (b) b.textContent = f.vCompany || ''; }
const phoneOk = p => /^[0-9\- ]+$/.test(p || '') && (p || '').replace(/\D/g, '').length >= 9 && (p || '').replace(/\D/g, '').length <= 10;
/* กฎบล็อก (DEC-04 · DEC-06) — ช่องบังคับตามกระดาษ · ผู้รับการติดต่อต้องมีผู้บังคับบัญชา (DOA ขั้น 1) */
function validateMain(){
  const f = wf(), err = {};
  if (!f.visitDate) err.visitDate = 1;
  if (!f.vTitle) err.vTitle = 1;
  if (!f.vName.trim()) err.vName = 1;
  if (!phoneOk(f.vPhone)) err.vPhone = 1;
  if (!f.vCompany.trim()) err.vCompany = 1;
  if (!f.host) err.host = 1; else if (!empOf(f.host).mgr) err.host = 'nomgr';
  if (!f.purpose.trim()) err.purpose = 1;
  if (Object.keys(err).length) err.sec1 = 1;
  const ok = !Object.keys(err).length; S.dw.err = ok ? null : err; return ok;
}
function failMain(){ S.dw.step = 1; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); requestAnimationFrame(() => { const el = document.querySelector('#sec1 .field.is-invalid') || document.getElementById('sec1'); if (el) el.scrollIntoView({ block:'center', behavior:'smooth' }); }); }
function wizNext(){ if (S.dw.step === 1 && !validateMain()){ failMain(); return; } S.dw.step += 1; render(); }
function wizBack(){ S.dw.step = Math.max(1, S.dw.step - 1); render(); }
function pickFiles(inp){ const f = wf(); gateFiles(Array.from(inp.files || [])).forEach(x => f.files.push({ name:x.name, size:fmtSize(x.size) })); inp.value = ''; dirty(); render(); }
function removeFile(i){ wf().files.splice(i, 1); dirty(); render(); }
/* บันทึก = ENG-DOC-NUM.next() ออกเลข VAR ครั้งแรก (DEC-10) · snapshot ผู้รับการติดต่อ/ฝ่าย/ผู้บังคับบัญชาลงเอกสาร */
function persist(){
  const f = wf(), me = ME(), h = empOf(f.host), t = nowIso();
  let r = S.dw.editId ? findR(S.dw.editId) : null;
  const data = JSON.parse(JSON.stringify(f)); delete data.files; delete data.host;
  const snap = { name:h.name, pos:h.pos, div:h.div, mgr:empOf(h.mgr).name };
  if (!r){
    SEQ += 1;
    r = { id:'R' + SEQ, code:DOC.prefix + '-2569-' + String(SEQ).padStart(4, '0'), status:'draft', emp:f.host, by:S.me, reqDate:TODAY, snap,
      chain:resolveDoa(f.host), doa_entry_ref:MOCK_DOA_RESOLVED.doa_entry_ref, lastReject:null, attachments:[], audit:[{ act:'สร้างเอกสาร', by:me.name, at:t, note:f.host && f.host !== S.me ? 'บันทึกแทน ' + h.name : '', tone:'' }], createdBy:me.name, createdAt:t };
    RECS.unshift(r);
  } else { r.audit.push({ act:'แก้ไขร่าง', by:me.name, at:t, tone:'' }); r.emp = f.host; r.snap = snap; r.chain = resolveDoa(f.host); }
  Object.assign(r, { f:data, attachments:f.files.slice(), updatedBy:me.name, updatedAt:t });
  return r;
}
function saveDraft(){ if (S.busy) return; const f = wf(); if (!f.visitDate && !f.vName.trim()){ validateMain(); failMain(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const r = persist(); S.busy = false; closeDrawer(true); setTimeout(() => showToast('บันทึกร่างแล้ว · ' + r.code, 'info'), 300); }, 500); }
function saveAndSubmit(){ if (S.busy) return; if (!validateMain()){ failMain(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const r = persist(); S.busy = false; closeDrawer(true); setTimeout(() => openSubmit(r.id), 300); }, 500); }

/* =====================================================================
   MODALS — ส่งขออนุมัติ (slot ต่อขั้น DOA) · อนุมัติ · ไม่อนุมัติ · ยกเลิก · ทิ้งข้อมูล
   ===================================================================== */
function modalShell(icon, tone, title, sub, body, foot){
  return `<div class="modal-header"><div class="modal-header-icon ${tone}"><i data-lucide="${icon}" class="w-4 h-4"></i></div><div><h3 class="modal-title">${title}</h3><p class="modal-subtitle">${sub}</p></div></div>
    ${body ? `<div class="modal-body">${body}</div>` : ''}<div class="modal-footer">${foot}</div>`;
}
const busyLabel = (icon, label) => S.busy ? '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>' : `<i data-lucide="${icon}" class="w-4 h-4"></i><span>${label}</span>`;
function presetChips(list, cur){ return `<div class="chip-row">${list.map(p => `<button type="button" class="chip ${cur === p ? 'is-on' : ''}" onclick="setReasonPreset(this.dataset.v)" data-v="${esc(p)}">${esc(p)}</button>`).join('')}</div>`; }
function submitIncomplete(r){ const f = r.f; return !f.visitDate || !f.vTitle || !f.vName || !phoneOk(f.vPhone) || !f.vCompany || !f.purpose || !empOf(r.emp).mgr; }
function renderModal(){
  const m = S.md; if (!m) return '';
  const r = m.id ? findR(m.id) : null;
  if (m.kind === 'submit'){
    const steps = resolveDoa(r.emp), inc = submitIncomplete(r);
    return modalShell('send', 'is-primary', 'ส่งขออนุมัติเข้าพื้นที่?', `${r.code} · ${esc(visitorName(r.f))} · ${r.f.visitDate ? fmtDate(r.f.visitDate) : '—'}`,
      (inc ? `<div class="alert-row is-danger"><i data-lucide="alert-circle" class="w-4 h-4"></i><div>ข้อมูลยังไม่ครบ — แก้ไขร่างให้ครบก่อนส่ง</div></div>` : '')
      + (steps.length ? steps.map((c, i) => `<div class="slot-row"><span class="slot-no num">${c.step}</span><span class="slot-role">${c.role}</span><div class="field ${m.err && !m.slots[i] ? 'is-invalid' : ''}" id="fSlot${i}">${searchSelectHTML('slot' + i, { placeholder:'เลือกผู้พิจารณา' })}<div class="field-error">กรุณาเลือกผู้พิจารณา</div>${i === 0 ? '<div class="slot-help">ค่าเริ่มต้นจาก DOA กลาง = ผู้บังคับบัญชาต้นสังกัด</div>' : ''}</div></div>`).join('')
        : `<div class="slot-none"><span class="slot-no num">0</span><span class="slot-role">ไม่มีขั้นพิจารณา</span><div class="slot-help">DOA กลางไม่ได้ตั้งขั้น — ส่งแล้วอนุมัติอัตโนมัติ</div></div>`),
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="btnSubmit" onclick="confirmSubmit()" ${S.busy || inc ? 'disabled' : ''}>${busyLabel('send', 'ส่งขออนุมัติ')}</button>`);
  }
  if (m.kind === 'approve'){
    return modalShell('check-circle-2', 'is-success', 'อนุมัติให้เข้าพื้นที่?', `${r.code} · ${esc(visitorName(r.f))} · ${esc(r.f.vCompany)}`,
      `<div class="field"><label class="field-label">ผู้บังคับบัญชาพิจารณา</label><textarea class="input" name="apNote" rows="2" placeholder="ไม่บังคับ เช่น พื้นที่ที่อนุญาต / เงื่อนไข" oninput="S.md.note=this.value">${esc(m.note || '')}</textarea></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-success" id="btnApprove" onclick="confirmApprove()" ${S.busy ? 'disabled' : ''}>${busyLabel('check', 'อนุมัติ')}</button>`);
  }
  if (m.kind === 'reject' || m.kind === 'cancel'){
    const rej = m.kind === 'reject';
    return modalShell('x-circle', 'is-danger', rej ? 'ไม่อนุมัติคำขอนี้?' : 'ยกเลิกเอกสาร?', `${r.code} · ${esc(visitorName(r.f))}${rej ? ' · กลับเป็นร่างเลขเดิม' : r.status === 'pending' ? ' · รอพิจารณาอยู่ — ผู้พิจารณาจะได้รับแจ้ง' : ''}`,
      `${presetChips(rej ? REJECT_PRESETS : CANCEL_PRESETS, m.preset)}
       <div class="field ${m.err ? 'is-invalid' : ''}" id="fReason"><label class="field-label">${rej ? 'ผู้บังคับบัญชาพิจารณา (เหตุผล)' : 'เหตุผล'}<span class="req">*</span></label><textarea class="input" name="reason" rows="3" placeholder="${rej ? 'แจ้งผู้รับการติดต่อว่าทำไมไม่อนุมัติ' : 'เหตุผลที่ยกเลิก'}" oninput="S.md.reason=this.value; if(this.value.trim()) document.getElementById('fReason').classList.remove('is-invalid')">${esc(m.reason || '')}</textarea><div class="field-error">กรุณาระบุเหตุผล</div></div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">${rej ? 'ยกเลิก' : 'ไม่ยกเลิก'}</button><button class="btn btn-danger" id="btnReason" onclick="confirmReason()" ${S.busy ? 'disabled' : ''}>${busyLabel('x-circle', rej ? 'ไม่อนุมัติ' : 'ยกเลิกเอกสาร')}</button>`);
  }
  if (m.kind === 'discard'){
    return modalShell('alert-triangle', 'is-warning', 'ทิ้งข้อมูลที่กรอกไว้?', 'ข้อมูลในแบบฟอร์มนี้ยังไม่ได้บันทึก', '',
      `<button class="btn btn-ghost" onclick="closeModal()">กลับไปกรอกต่อ</button><button class="btn btn-danger" id="btnDiscard" onclick="closeModal(); closeDrawer(true)">ทิ้งข้อมูล</button>`);
  }
  return '';
}
function openModalCfg(cfg){ S.md = cfg; state.modal.open = true; render(); requestAnimationFrame(() => document.getElementById('modalBackdrop').classList.add('is-open')); }
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('is-open'); state.modal.open = false; setTimeout(() => { if (!state.modal.open) S.md = null; }, 200); }
function modalBackdropClick(){ if (S.md && (S.md.reason || S.md.note)) return; closeModal(); }
function setReasonPreset(v){ S.md.preset = v; S.md.reason = v + (S.md.reason && S.md.reason.indexOf(v) !== 0 ? ' — ' + S.md.reason : ''); S.md.err = false; render(); }
function openSubmit(id){ const r = findR(id); if (!r || r.status !== 'draft') return; openModalCfg({ kind:'submit', id, slots:resolveDoa(r.emp).map(c => c.assignee) }); }
function openApprove(id){ openModalCfg({ kind:'approve', id, note:'' }); }
function openReject(id){ openModalCfg({ kind:'reject', id, reason:'' }); }
function openCancel(id){ closeRowMenu(); openModalCfg({ kind:'cancel', id, reason:'' }); }
function pushAudit(r, act, note, tone){ const me = ME(), t = nowIso(); r.audit.push({ act, by:me.name, at:t, note:note || '', tone:tone || '' }); r.updatedBy = me.name; r.updatedAt = t; }
/* ENG-NOTIFY (NTF_BRIEF_F-TMP-003): var_cancelled → ผู้อนุมัติขั้นปัจจุบัน + ผู้สร้าง · DOA engine เป็นเจ้าของ doa_pending/doa_result */
function confirmSubmit(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  if (m.slots.some(x => !x)){ m.err = true; render(); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    r.chain = resolveDoa(r.emp).map((c, i) => Object.assign(c, { assignee:m.slots[i], status:i === 0 ? 'pending' : 'waiting' }));   /* BR-DOA-02 resolve ตอนส่งแล้ว freeze */
    r.status = r.chain.length ? 'pending' : 'approved'; r.submittedAt = nowIso(); r.lastReject = null;
    pushAudit(r, 'ส่งขออนุมัติ', r.chain.length ? 'ถึง ' + empOf(m.slots[0]).name : 'ไม่มีขั้นพิจารณา');
    S.busy = false; closeModal(); render(); setTimeout(() => showToast('ส่งขออนุมัติแล้ว · ' + r.code, 'success'), 220); }, 600);
}
function confirmApprove(){
  const m = S.md, r = findR(m.id); if (S.busy) return;
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return;
    const c = curStep(r); c.status = 'approved'; c.at = nowIso(); c.note = (m.note || '').trim();
    const next = r.chain.find(x => x.status === 'waiting'); if (next) next.status = 'pending';
    r.status = next ? 'pending' : 'approved'; pushAudit(r, 'อนุมัติ (ขั้น ' + c.step + ')', c.note, 'ok');
    S.busy = false; closeModal(); render(); setTimeout(() => showToast('อนุมัติแล้ว · ' + r.code, 'success'), 220); }, 600);
}
