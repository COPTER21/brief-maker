function lineHours(l) { const raw = lineSpan(l) / 60 - (+l.bk || 0); return Math.round(raw * 100) / 100; }
function isOvernight(l) { return hm(l.t) < hm(l.f); }

/* ขอบสัปดาห์ตาม period_rule (เริ่มวันจันทร์) [ASSUMED · OQ-OT-09] */
function weekStartOf(s) { const w = dow(s); const back = (w - OTCFG.weekStart + 7) % 7; return addD(s, -back); }
function weekLabel(ws) { return dTH(ws) + ' – ' + dTH(addD(ws, 6)); }

/* --- HR Configuration · resolve(date, company, group) — อ่านอย่างเดียว ไม่มีหน้าตั้งค่าที่นี่ (BR-05 · #107) --- */
function resolveShift(emp, date) {
  /* [HRCFG-READ] GET /api/v1/hr-config/resolve?date={date}&company_id={COMPANY_ID}&group=shift_pattern */
  if (SHIFT_GAP[emp + '|' + date]) return null;
  return SHIFT_EMP[emp] || SHIFT_DEF;
}
function resolveHoliday(date) {
  /* [HRCFG-READ] group=holiday_calendar — ห้ามฝังปฏิทินวันหยุดในโค้ด (BR-01 · P-8) */
  return HOLIDAY[date] || null;
}
function resolveDayType(emp, date) {
  /* BR-06 — ประเภทวันตัดสินจากปฏิทินวันหยุด + วันทำงานของกะ (อ่านมา ไม่คำนวณเอง) */
  const h = resolveHoliday(date);
  if (h) return { k: h.k, n: h.n, ver: HOLVER };
  const sh = resolveShift(emp, date);
  if (!sh) return null;                                     /* no_shift → บล็อก ห้ามเดา (BR-20) */
  return sh.days.indexOf(dow(date)) >= 0
    ? { k: 'workday', n: DAYTYPE.workday, ver: SHIFTVER }
    : { k: 'weekly_off', n: DAYTYPE.weekly_off, ver: SHIFTVER };
}
function resolveRate(dayKind, date) {
  /* [HRCFG-READ] group=ot_rate — multiplier/payroll_code เป็นค่าที่อ่านมา ไม่ใช่ค่าที่ตั้งในหน้านี้ */
  for (let i = 0; i < OTRATE.length; i++) {
    const r = OTRATE[i];
    if (!r.act && (!r.offAt || date >= r.offAt)) continue;   /* อัตราที่ปิดใช้เลือกใหม่ไม่ได้ (BR-23) */
    if (r.dt.indexOf(dayKind) >= 0) return r;
  }
  return null;
}
function resolveCap(date) {
  /* [HRCFG-READ] group=ot_rate · cap_hours_week — ค่าเพดานอยู่ที่ ตั้งค่า HR เท่านั้น (BR-09 · P-8) */
  return {
    week: OTCFG.capHoursWeek, warnAt: Math.round(OTCFG.capHoursWeek * OTCFG.capWarnRatio * 100) / 100,
    day: OTCFG.capHoursDay, month: OTCFG.capHoursMonth, ver: OTCFG.ver, at: date
  };
}
function periodOf(date) {
  /* [HRCFG-READ] group=period_rule — P-7 งวดปิด = ปฏิเสธทุก transition ที่กระทบผล */
  for (let i = 0; i < PERIOD.length; i++) { if (date >= PERIOD[i].f && date <= PERIOD[i].t) return PERIOD[i]; }
  return { c: date.slice(0, 7), st: 'open', f: '', t: '', closedAt: '', frozenAt: '' };
}
function attOf(emp, date) {
  /* [ATT-READ] GET /api/v1/attendance/resolve — อ่านอย่างเดียว ไม่มีเส้นเขียนกลับ (BR-05 · BR-07) */
  return ATTD[emp + '|' + date] || null;
}
function leaveOf(emp, date) {
  /* [LEAVE-READ] GET /api/v1/leave/resolve — อ่านวันลาที่อนุมัติแล้ว ไม่คำนวณวันลาเอง (BR-19) */
  return LEAVED[emp + '|' + date] || null;
}

/* --- DOA · สายอนุมัติมาจาก engine เท่านั้น · ชั้นเลือกด้วยธง over_cap ไม่ใช่ช่วงชั่วโมงในหน้าจอ (BR-09 · BR-10) --- */
function doaEntryFor(over) { return over ? MOCK_DOA_RESOLVED.over_cap : MOCK_DOA_RESOLVED.within_cap; }
function doaEntryOf(r) { return doaEntryFor(capOf(r).over); }
function resolveDoa(req) {
  /* [DOA-HOOK] GET /doa/resolve?action_id=<เลือกจาก over_cap> — สายที่คืนมาถูก freeze ลง approval_chain ตอนกดส่ง */
  const e = empOf(req.emp);
  const entry = doaEntryFor(capOf(req).over);
  const filer = req.proxyBy || req.emp;
  /* SoD (BR-24) — ผู้ขอ/ผู้ยื่นเซ็นใบนั้นไม่ได้ → engine เลื่อนขึ้นผู้บังคับบัญชาเหนือขึ้นไป */
  let sup = e.sup || 'HR-0002';
  if (sup === req.emp || sup === filer) sup = empOf(sup).sup || 'HR-0002';
  const pick = { 'role-supervisor-direct': sup, 'role-mgr-hr': 'HR-0007', 'role-exec-dept': 'HR-0055' };
  return entry.steps.map(function (s) {
    let as = pick[s.roles[0]] || '';
    if (as === req.emp || as === filer) as = empOf(as).sup || '';
    return { roles: s.roles, roleName: s.roleName, suggest: as };
  });
}

/* --- DOCCFG · เลขที่เอกสารออกจาก engine ณ ตอนส่งอนุมัติเท่านั้น (BR-13) --- */
function nextDocNo() {
  /* [DOCCFG-HOOK] ENG-DOC-NUM.next('OT', company_ctx) — ห้าม format เอง ห้าม +1 เอง */
  return DOCCFG.code + '-' + TODAY.slice(0, 4) + '-' + ('000' + DOCCFG.nextRun).slice(-4);
}

/* ============================================================
   บรรทัดช่วงเวลา (§3.2) — 1 แถว = 1 ช่วงเวลาของ 1 วันเข้ากะ
   ============================================================ */
const OPEN_ST = { draft: 1, pending: 1, approved: 1, confirmed: 1 };
function overlapOther(req, li) {
  /* BR-29 · FN-61 — ทับกับใบ OT ใบอื่นของคนเดียวกันที่ยังไม่ปิด */
  const a1 = hm(li.f), a2 = a1 + lineSpan(li);
  for (let i = 0; i < REQ.length; i++) {
    const r = REQ[i];
    if (r.id === req.id || r.emp !== req.emp || !OPEN_ST[r.st]) continue;
    if (req.st !== 'draft' && r.st === 'draft') continue;   /* ร่างของคนเดียวกันไม่บล็อกใบที่ยื่นไปแล้ว */
    for (let j = 0; j < r.ln.length; j++) {
      const o = r.ln[j];
      if (o.d !== li.d) continue;
      const b1 = hm(o.f), b2 = b1 + lineSpan(o);
      if (a1 < b2 && b1 < a2) return r.no || 'ร่างที่ยังไม่ออกเลข';
    }
  }
  return null;
}
function buildLines(req) {
  return (req.ln || []).map(function (l, i) {
    const dt = resolveDayType(req.emp, l.d);
    const rate = dt ? resolveRate(dt.k, l.d) : null;
    const att = attOf(req.emp, l.d);
    const p = periodOf(l.d);
    const hrs = lineHours(l);
    const out = att && att.st === 'confirmed' ? att.out : null;
    const shift = resolveShift(req.emp, l.d);
    return {
      i: i, d: l.d, f: l.f, t: l.t, bk: +l.bk || 0, nt: l.nt || '', hrs: hrs,
      over: isOvernight(l), bad: lineSpan(l) <= 0 || hrs <= 0,
      dt: dt, rate: rate, shift: shift,
      att: att, outside: out,
      vari: out === null ? null : Math.round((hrs - out) * 100) / 100,
      period: p, lock: p.st === 'closed',
      leave: leaveOf(req.emp, l.d), clash: overlapOther(req, l),
      back: l.d < TODAY, wk: weekStartOf(l.d)
    };
  });
}
function reqHours(req) { return Math.round(buildLines(req).reduce(function (s, l) { return s + (l.bad ? 0 : l.hrs); }, 0) * 100) / 100; }
function reqHoursByWeek(req) {
  const m = {};
  buildLines(req).forEach(function (l) { if (!l.bad) m[l.wk] = Math.round(((m[l.wk] || 0) + l.hrs) * 100) / 100; });
  return m;
}

/* ============================================================
   เพดานรายสัปดาห์ (BR-09) — สะสม = Σ ชั่วโมงที่อนุมัติ/ยืนยันแล้วในสัปดาห์ + ชั่วโมงที่กำลังขอ
   ค่าเพดานมาจาก resolveCap(work_date) เท่านั้น — ไม่มีตัวเลขเพดานเขียนตายในเงื่อนไข
   ============================================================ */
const COUNT_ST = { approved: 1, confirmed: 1 };
function docCountedHours(r) {
  /* ชั่วโมงที่นับเข้าเพดาน = ที่ยืนยันแล้ว > ที่รับรอง > ที่ขอ (3 ตัวเลขอยู่คู่กัน ไม่เขียนทับกัน) */
  if (r.hcf !== null && r.hcf !== undefined) return r.hcf;
  if (r.hap !== null && r.hap !== undefined) return r.hap;
  return reqHours(r);
}
function weekAccrued(emp, ws, exceptId) {
  let sum = 0;
  REQ.forEach(function (r) {
    if (r.emp !== emp || r.id === exceptId || !COUNT_ST[r.st]) return;
    const ls = buildLines(r).filter(function (l) { return !l.bad; });
    const tot = ls.reduce(function (s, l) { return s + l.hrs; }, 0);
    if (!tot) return;
    const ratio = docCountedHours(r) / tot;
    ls.forEach(function (l) { if (l.wk === ws) sum += l.hrs * ratio; });
  });
  return Math.round(sum * 100) / 100;
}
function capOf(req) {
  const byWk = reqHoursByWeek(req);
  const keys = Object.keys(byWk).sort();
  const cap = resolveCap(keys[0] || TODAY);
  const weeks = keys.map(function (ws) {
    const acc = weekAccrued(req.emp, ws, req.id);
    const own = byWk[ws];
    const tot = Math.round((acc + own) * 100) / 100;
    return { ws: ws, acc: acc, own: own, total: tot, cap: cap.week, warnAt: cap.warnAt,
      over: tot > cap.week, warn: tot >= cap.warnAt && tot <= cap.week,
      left: Math.round((cap.week - tot) * 100) / 100, pct: cap.week ? Math.round(tot * 100 / cap.week) : 0 };
  });
  const worst = weeks.filter(function (w) { return w.over; })[0] || weeks.filter(function (w) { return w.warn; })[0] || weeks[0] || null;
  return { ver: cap.ver, capWeek: cap.week, warnAt: cap.warnAt, weeks: weeks, worst: worst,
    over: weeks.some(function (w) { return w.over; }), warn: weeks.some(function (w) { return w.warn; }) };
}
/* ชั่วโมงสะสมรายสัปดาห์ของพนักงาน (ใช้ในแท็บเพดาน) */
function weekRowsOf(emp, ws) {
  const rows = [];
  REQ.forEach(function (r) {
    if (r.emp !== emp) return;
    buildLines(r).forEach(function (l) { if (!l.bad && l.wk === ws) rows.push({ r: r, l: l }); });
  });
  return rows.sort(function (a, b) { return a.l.d < b.l.d ? -1 : 1; });
}

/* ============================================================
   VALIDATE — บล็อก (blocks) กับ เตือน (warns) แยกกันชัด
   ============================================================ */
function checkReq(req) {
  const blocks = [], warns = [];
  const lines = buildLines(req);
  const hours = reqHours(req);
  const cap = capOf(req);

  if (!lines.length) blocks.push({ c: 'NOLINE', m: 'ยังไม่มีบรรทัดช่วงเวลาในใบนี้ — เพิ่มอย่างน้อย 1 บรรทัดก่อน' });

  /* S-07 · BR-20 · FN-07 — ช่วงเวลาไม่ถูกต้อง */
  const badL = lines.filter(function (l) { return l.bad; });
  if (badL.length) blocks.push({ c: 'RANGE', m: 'บรรทัดที่ ' + badL.map(function (l) { return l.i + 1; }).join(' · ') + ' มีช่วงเวลาไม่ถูกต้อง (นับได้ 0 ชั่วโมง หรือหักพักแล้วเหลือ 0 ชั่วโมง) — แก้ก่อนไปต่อ' });

  /* FN-07 — ทับซ้อนกันเองในใบเดียว */
  for (let i = 0; i < lines.length; i++) {
    for (let j = i + 1; j < lines.length; j++) {
      if (lines[i].d !== lines[j].d) continue;
      const a1 = hm(lines[i].f), a2 = a1 + lineSpan(lines[i]), b1 = hm(lines[j].f), b2 = b1 + lineSpan(lines[j]);
      if (a1 < b2 && b1 < a2) { blocks.push({ c: 'SELF', m: 'บรรทัดที่ ' + (i + 1) + ' และ ' + (j + 1) + ' ของวันเดียวกันมีช่วงเวลาทับกันเอง — แยกช่วงให้ไม่ทับก่อน' }); i = lines.length; break; }
    }
  }

  /* BR-20 · FN-09 — หากะไม่ได้ / ตัดสินประเภทวันไม่ได้ */
  const ns = lines.filter(function (l) { return !l.dt; });
  if (ns.length) blocks.push({ c: 'NOSHIFT', m: 'วันที่ ' + dTH(ns[0].d) + ' หากะของพนักงานคนนี้ไม่ได้ จึงตัดสินประเภทวันไม่ได้ — ต้องแก้ที่ต้นทางก่อน ไม่ถือว่าเป็นวันทำงานปกติ', link: 'att' });
  const nr = lines.filter(function (l) { return l.dt && !l.rate; });
  if (nr.length) blocks.push({ c: 'NORATE', m: 'ประเภทวัน “' + (nr[0].dt.n) + '” ของวันที่ ' + dTH(nr[0].d) + ' ยังไม่มีอัตราที่ใช้ได้ ณ วันนั้น', cfg: 'ot_rate' });

  /* BR-15 · P-7 · P-9 · FN-40 — งวดปิด */
  const lk = lines.filter(function (l) { return l.lock; });
  if (lk.length) blocks.push({ c: 'PERIOD', m: 'วันที่ทำ OT ' + lk.length + ' บรรทัดอยู่ในงวด ' + lk[0].period.c + ' ที่ปิดแล้ว — ยื่น อนุมัติ ยืนยัน หรือถอนไม่ได้ ต้องเปิดงวดที่ ตั้งค่า HR ก่อน', cfg: 'period_rule' });

  /* BR-19 · FN-16 — ทับวันลาที่อนุมัติแล้ว */
  const lv = lines.filter(function (l) { return l.leave; });
  if (lv.length) blocks.push({ c: 'LEAVE', m: 'วันที่ ' + dTH(lv[0].d) + ' ตรงกับวันลาที่อนุมัติแล้ว ' + lv[0].leave.no + ' (' + lv[0].leave.ty + ') — ขอ OT วันนี้ไม่ได้', leave: lv[0].leave.no });

  /* BR-29 · FN-61 — ทับใบ OT ใบอื่นของคนเดียวกัน */
  const cl = lines.filter(function (l) { return l.clash; });
  if (cl.length) blocks.push({ c: 'CLASH', m: 'ช่วงเวลาวันที่ ' + dTH(cl[0].d) + ' ทับกับใบ ' + cl[0].clash + ' ที่ยังไม่ปิด', link: cl[0].clash });

  /* BR-16 · FN-19 — ชั่วโมงที่ขอมากกว่าเวลาจริงนอกกะ */
  const vOver = lines.filter(function (l) { return l.vari !== null && l.vari > 0; });
  if (vOver.length && !req.vack) {
    const tot = Math.round(vOver.reduce(function (s, l) { return s + l.vari; }, 0) * 100) / 100;
    blocks.push({ c: 'VARIANCE', m: 'ชั่วโมงที่ขอมากกว่าชั่วโมงนอกกรอบกะที่บันทึกได้ ' + nH(tot) + ' ชม. (' + vOver.length + ' บรรทัด) — แก้ตัวเลข หรือให้ผู้อนุมัติรับทราบส่วนต่างพร้อมเหตุผลก่อน', vari: true });
  }
  const vUnder = lines.filter(function (l) { return l.vari !== null && l.vari < 0; });
  if (vUnder.length) warns.push({ c: 'VARUNDER', m: 'ชั่วโมงที่ขอน้อยกว่าชั่วโมงนอกกรอบกะที่บันทึกได้ — ยื่นได้ตามปกติ ผู้อนุมัติจะเห็นธงนี้' });

  /* BR-08 · FN-23 · FN-24 — ตรวจ day_status ก่อนใช้ตัวเลข */
  const nd = lines.filter(function (l) { return !l.att || l.att.st === 'nodata'; });
  if (nd.length) warns.push({ c: 'NOATT', m: 'วันที่ ' + dTH(nd[0].d) + ' ยังไม่มีข้อมูลเวลาเข้างาน — ยื่นล่วงหน้าได้ แต่ยังยืนยันเวลาจริงไม่ได้ (ห้ามใช้ค่าของวันใกล้เคียง)', link: 'att' });
  const ex = lines.filter(function (l) { return l.att && l.att.st === 'exception'; });
  if (ex.length) blocks.push({ c: 'ATTEXC', m: 'วันที่ ' + dTH(ex[0].d) + ' เวลาเข้างานอยู่สถานะข้อยกเว้น (' + (ex[0].att.note || 'ข้อมูลไม่ครบ') + ') — ยังใช้ตัวเลขของวันนี้ไม่ได้ และไม่ถือว่าทำงาน 0 ชั่วโมง', link: 'att' });

  cap.weeks.forEach(function (w) {
    if (w.over) warns.push({ c: 'OVERCAP', m: 'สัปดาห์ ' + weekLabel(w.ws) + ' สะสมรวม ' + nH(w.total) + ' ชม. เกินเพดาน ' + nH(w.cap) + ' ชม. อยู่ ' + nH(w.total - w.cap) + ' ชม. — ใบนี้ต้องผ่านการอนุมัติเพิ่มอีก 1 ขั้น' });
    else if (w.warn) warns.push({ c: 'CAPWARN', m: 'สัปดาห์ ' + weekLabel(w.ws) + ' สะสมรวม ' + nH(w.total) + ' ชม. จากเพดาน ' + nH(w.cap) + ' ชม. — เหลืออีก ' + nH(w.left) + ' ชม. ยังยื่นได้ตามปกติ' });
  });

  /* FN-63 — ยื่นย้อนหลังเกินกำหนดเวลาปิดรับ (ยื่นได้ แต่ติดธง) */
  const ref = req.sub ? req.sub.at.slice(0, 10) : TODAY;
  const late = lines.filter(function (l) { return diffD(l.d, ref) > OTCFG.retroCutoffDays; });
  if (late.length) warns.push({ c: 'LATE', m: 'ยื่นย้อนหลังเกินกำหนดปิดรับ ' + OTCFG.retroCutoffDays + ' วันของ ตั้งค่า HR — ยื่นได้ แต่ผู้อนุมัติจะเห็นธง “ยื่นเกินกำหนด”' });

  /* BR-28 · FN-44 — หัวหน้ายื่นแทนต้องมีการรับทราบของผู้ทำ OT ก่อนส่ง */
  if (req.proxyBy && req.proxyBy !== req.emp && !req.cns) {
    blocks.push({ c: 'CONSENT', m: 'ใบนี้ยื่นแทน ' + empOf(req.emp).n + ' — ต้องให้ผู้ทำ OT กดรับทราบก่อนจึงส่งอนุมัติได้' });
  }

  /* §3.1 — เหตุผลและงานที่ทำเป็นช่องบังคับ (FN-03) */
  if (!String(req.rs || '').trim()) blocks.push({ c: 'REASON', m: 'ยังไม่ได้กรอกเหตุผลความจำเป็นที่ต้องทำ OT' });
  if (!String(req.wk || '').trim()) blocks.push({ c: 'WORK', m: 'ยังไม่ได้กรอกงานที่ทำในช่วงเวลาที่ขอ' });

  /* BR-22 · FN-43 — ธง "ต้องทวน" */
  if (req.rev && req.rev.on) warns.push({ c: 'REVIEW', m: 'ใบนี้ติดธง “ต้องทวน” — ' + req.rev.note + ' · ต้องมีคนตัดสินว่าจะปรับชั่วโมงที่รับรอง หรือถอนใบ' });

  return { blocks: blocks, warns: warns, lines: lines, hours: hours, cap: cap };
}

/* --- สถานะ/สายอนุมัติ --- */
function signProgress(r) {
  const tot = (r.chain || []).length || doaEntryOf(r).steps.length;
  const ok = (r.chain || []).filter(function (s) { return s.st === 'ok'; }).length;
  return { ok: ok, tot: tot, pct: tot ? Math.round(ok * 100 / tot) : 0 };
}
function curSlot(r) { return (r.chain || []).find(function (x) { return x.st === 'wait'; }) || null; }
function canActOn(r) {
  if (r.st !== 'pending') return false;
  const s = curSlot(r);
  return !!(s && s.as === P().emp);
}
/* FN-21 · FN-22 — ยืนยันเวลาจริงได้เมื่อวันผ่านไปแล้วและเวลาเข้างานของทุกบรรทัดยืนยันแล้ว */
function confirmReady(r) {
  if (r.st !== 'approved') return { ok: false, why: 'ใบต้องอยู่สถานะ “อนุมัติ” ก่อน' };
  const ls = buildLines(r);
  const future = ls.filter(function (l) { return l.d >= TODAY; });
  if (future.length) return { ok: false, why: 'วันที่ทำ OT ' + dTH(future[0].d) + ' ยังไม่ผ่านไป' };
  const bad = ls.filter(function (l) { return !l.att || l.att.st !== 'confirmed'; });
  if (bad.length) return { ok: false, why: 'เวลาเข้างานของวันที่ ' + dTH(bad[0].d) + ' ยังไม่ถูกยืนยัน' };
  if (ls.some(function (l) { return l.lock; })) return { ok: false, why: 'วันที่ทำ OT อยู่ในงวดที่ปิดแล้ว' };
  const vr = ls.filter(function (l) { return l.vari !== null && l.vari > 0; });
  if (vr.length && !r.vack) return { ok: false, why: 'ยังมีส่วนต่างเกินเวลาจริงที่ยังไม่มีผู้รับทราบ' };
  return { ok: true, why: '', hours: Math.round(ls.reduce(function (s, l) { return s + Math.min(l.hrs, l.outside === null ? l.hrs : l.outside); }, 0) * 100) / 100 };
}
function hoursOf(r) {
  return { req: reqHours(r), app: r.hap, cfm: r.hcf };
}
/* read model §3.3 — เผยแพร่เฉพาะใบสถานะ "ยืนยันแล้ว" (BR-17 · FN-45) */
function publishedRows(periodCode) {
  const out = [];
  REQ.forEach(function (r) {
    if (r.st !== 'confirmed') return;
    buildLines(r).forEach(function (l) {
      if (l.bad || (periodCode && l.period.c !== periodCode)) return;
      out.push({ r: r, l: l });
    });
  });
  return out;
}
function periodSummary(periodCode) {
  const m = {};
  publishedRows(periodCode).forEach(function (x) {
    const k = x.r.emp + '|' + (x.l.rate ? x.l.rate.rt : 'none');
    if (!m[k]) m[k] = { emp: x.r.emp, rt: x.l.rate ? x.l.rate.rt : 'none', hrs: 0, docs: {} };
    m[k].hrs = Math.round((m[k].hrs + x.l.hrs) * 100) / 100;
    m[k].docs[x.r.no] = 1;
  });
  return Object.keys(m).map(function (k) { return m[k]; }).sort(function (a, b) { return a.emp < b.emp ? -1 : a.emp > b.emp ? 1 : (a.rt < b.rt ? -1 : 1); });
}

function openDW(mode, data, opt) {

<script>

<script>

  if (!rows.length) tb += emptyRow(9, 'ไม่มีบรรทัด OT ในสัปดาห์นี้', 'เลือกสัปดาห์อื่น หรือสร้างใบขอ OT ใหม่');
  rows.forEach(function (x) {
    tb += '<tr onclick="openView(\'' + x.r.id + '\')" style="cursor:pointer">'

      + '<td class="tar tnum">×' + (x.l.rate ? x.l.rate.mult.toFixed(1) : '—') + '</td>'
      + '<td>' + (x.l.rate ? x.l.rate.pay : '—') + '</td>'
      + '<td class="tar tnum">' + nH(x.l.hrs) + '</td>'
      + '<td>' + docPill(x.r.st) + '</td></tr>';
  });
  tb += '</tbody></table></div>';
  tb += '<div class="dsum"><span>นับเข้าเพดาน</span><b class="tnum">' + nH(acc) + ' ชม.</b><span>รออนุมัติ ' + nH(pend) + ' ชม.</span>'
    + '<span>ปฏิทินวันหยุด <span class="kbd">' + HOLVER + '</span> · กะ <span class="kbd">' + SHIFTVER + '</span></span></div>';
  h += SEC('list', 'บรรทัดที่ประกอบเป็นชั่วโมงของสัปดาห์ (' + rows.length + ')', 'ตัวคูณเป็นค่าอ้างอิงที่แสดงและส่งต่อ ไม่มีการคูณเป็นเงินในหน้านี้', tb);

  /* อัตรา · เพดาน · หน่วยขั้นต่ำ ที่อ่านมาจาก ตั้งค่า HR */
  let rb = '<table class="mini-tbl"><thead><tr><th>ประเภทอัตรา</th><th>ใช้กับประเภทวัน</th><th class="tar">ตัวคูณ</th><th>รหัสจ่าย</th><th>เวอร์ชัน</th><th>สถานะ</th></tr></thead><tbody>';
  OTRATE.forEach(function (r) {
    rb += '<tr><td>' + r.n + '</td><td>' + (r.dt.map(function (k) { return DAYTYPE[k]; }).join(' · ') || '—') + '</td>'
      + '<td class="tar tnum">×' + r.mult.toFixed(1) + '</td><td>' + r.pay + '</td><td><span class="kbd">' + r.ver + '</span></td>'
      + '<td>' + (r.act ? '<span class="pill pill-success">ใช้งาน</span>' : '<span class="pill pill-archived">ปิดใช้</span>') + '</td></tr>';
  });
  rb += '</tbody></table>';
  rb += '<div class="rc-grid" style="margin-top:12px">'
    + '<div class="rc-row"><span class="k">เพดานรายสัปดาห์</span><span class="v">' + nH(cfg.week) + ' ชม.</span></div>'
    + '<div class="rc-row"><span class="k">เกณฑ์เตือนใกล้ถึงเพดาน</span><span class="v">' + Math.round(OTCFG.capWarnRatio * 100) + '% = ' + nH(cfg.warnAt) + ' ชม.</span></div>'
    + '<div class="rc-row"><span class="k">เพดานรายวัน</span><span class="v">' + (cfg.day === null ? 'ยังไม่มีค่าให้อ่าน' : nH(cfg.day)) + '</span></div>'
    + '<div class="rc-row"><span class="k">เพดานรายเดือน</span><span class="v">' + (cfg.month === null ? 'ยังไม่มีค่าให้อ่าน' : nH(cfg.month)) + '</span></div>'
    + '<div class="rc-row"><span class="k">หน่วยขั้นต่ำ / การปัดเศษชั่วโมง</span><span class="v">' + (OTCFG.roundUnitHours === null ? 'ยังไม่มีค่าให้อ่าน' : OTCFG.roundUnitHours) + '</span></div>'
    + '<div class="rc-row"><span class="k">รหัสเหตุผลของการทำ OT</span><span class="v">' + (OTCFG.reasonCodes === null ? 'ยังไม่มีค่าให้อ่าน' : 'มีรายการ') + '</span></div>'
    + '</div>'
    + '<div class="hint-inline" style="margin-top:8px">ช่องที่ขึ้นว่า “ยังไม่มีค่าให้อ่าน” คือค่าที่ต้นทางยังไม่เผยแพร่ — รอบนี้จึงตรวจเฉพาะเพดานรายสัปดาห์ และใช้ชั่วโมงดิบโดยไม่ปัดเศษ '
    + cfgLink('ot_rate', 'จัดการค่าเหล่านี้ที่ ตั้งค่า HR') + '</div>';
  h += SEC('sliders-horizontal', 'อัตรา ตัวคูณ และเพดาน ที่อ่านมาจาก ตั้งค่า HR', 'อ่านอย่างเดียว — ไม่มีช่องแก้ค่าในหน้านี้', rb);

  /* ผลของธง over_cap ต่อชั้นของสายอนุมัติ — สายมาจาก DOA ไม่ใช่ตัวเลขในหน้าจอ */
  const w1 = MOCK_DOA_RESOLVED.within_cap, w2 = MOCK_DOA_RESOLVED.over_cap;
  const chainRow = function (e, extra) {
    return '<div class="chainprev">' + e.steps.map(function (s, i) {
      return (i ? '<span class="cp-ar"><i data-lucide="chevron-right" class="w-3 h-3"></i></span>' : '')
        + '<span class="cp' + (extra && i === e.steps.length - 1 ? ' is-extra' : '') + '"><i data-lucide="user-check" class="w-3 h-3"></i>' + s.roleName + '</span>';
    }).join('') + '<span class="fr-sp"></span><span class="kbd">' + e.doa_entry_ref + '</span></div>';
  };
  h += SEC('git-branch', 'ธงเกินเพดานเปลี่ยนชั้นของสายอนุมัติอย่างไร', '<button class="link-cfg" onclick="openDoa()"><i data-lucide="external-link" class="w-3 h-3"></i>ตั้งค่าที่ Policy Center</button>',
    '<div class="rc-row" style="margin-bottom:6px"><span class="k">อยู่ในเพดาน · ' + w1.action + '</span><span class="v">' + w1.steps.length + ' ขั้น</span></div>' + chainRow(w1, false)
    + '<div class="rc-row" style="margin:14px 0 6px"><span class="k">เกินเพดาน · ' + w2.action + '</span><span class="v">' + w2.steps.length + ' ขั้น</span></div>' + chainRow(w2, true)
    + '<div class="hint-inline" style="margin-top:10px">ชั้นที่เพิ่มมาถูกเลือกด้วยธงเกินเพดานที่คำนวณจากค่าเพดานของ ตั้งค่า HR — ไม่ใช่ช่วงชั่วโมงที่กำหนดไว้ในหน้าจอหรือในตารางของสายอนุมัติ</div>');

  return h + '</div>';
}

<script>
/* ============================================================
   TAB 3 — ยืนยันเวลาจริง (FN-17..FN-24 · FN-43 · FN-45 · FN-51)
   ชั่วโมงนอกกรอบกะเป็นข้อมูลดิบจาก เวลาเข้างาน — ต้องผ่านใบนี้จนถึงสถานะ “ยืนยันแล้ว” ก่อนจึงถูกเผยแพร่ (BR-07 · BR-17)
   ============================================================ */
function setCfm(v) { state.cfm.scope = v; render(); }
function cfmBuckets() {
  const due = [], wait = [], review = [], done = [];
  visibleReq().forEach(function (r) {
    if (r.rev && r.rev.on) { review.push(r); return; }
    if (r.st === 'confirmed') { done.push(r); return; }
    if (r.st !== 'approved') return;
    (confirmReady(r).ok ? due : wait).push(r);
  });
  return { due: due, wait: wait, review: review, done: done };
}
function cfmVarianceOf(r) {
  const ls = buildLines(r);
  const known = ls.filter(function (l) { return l.vari !== null; });
  if (!known.length) return null;
  return Math.round(known.reduce(function (s, l) { return s + l.vari; }, 0) * 100) / 100;
}
function cfmOutsideOf(r) {
  const ls = buildLines(r);
  const known = ls.filter(function (l) { return l.outside !== null; });
  if (!known.length) return null;
  return Math.round(known.reduce(function (s, l) { return s + l.outside; }, 0) * 100) / 100;
}
function attStatePill(r) {
  const ls = buildLines(r);
  if (ls.some(function (l) { return l.att && l.att.st === 'exception'; })) return '<span class="pill pill-warning">ข้อยกเว้น</span>';
  if (ls.some(function (l) { return !l.att || l.att.st === 'nodata'; })) return '<span class="pill pill-muted">ยังไม่มีข้อมูล</span>';
  return '<span class="pill pill-success">ยืนยันแล้ว</span>';
}
function viewConfirm() {
  const b = cfmBuckets();
  const scope = state.cfm.scope;
  const list = b[scope] || b.due;
  const cnt = { due: b.due.length, wait: b.wait.length, review: b.review.length, done: b.done.length };

  let h = '<div class="scrollpad page-fill" style="overflow-y:auto">';
  h += '<div class="filter-row">'
    + '<div class="seg-control">'
    + [['due', 'ถึงกำหนดยืนยัน'], ['wait', 'ยังยืนยันไม่ได้'], ['review', 'ต้องทวน'], ['done', 'ยืนยันแล้ว']].map(function (x) {
      return '<button type="button" class="seg-item ' + (scope === x[0] ? 'is-active' : '') + '" onclick="setCfm(\'' + x[0] + '\')">' + x[1] + ' (' + cnt[x[0]] + ')</button>';
    }).join('') + '</div>'
    + '<span class="fr-lb">เวอร์ชันเวลาเข้างาน</span><span class="kbd">' + ATTVER + '</span>'
    + '<span class="fr-sp"></span>' + attLink('') + '</div>';

  let tb = '<div class="table-wrap"><table class="table conf-tbl">'
    + '<thead><tr><th style="width:110px">เลขที่</th><th style="width:172px">ผู้ขอ</th><th style="width:146px">วันที่ทำ OT</th>'
    + '<th class="tar" style="width:70px">ชม. ที่ขอ</th>'
    + '<th class="tar" style="width:98px">ชม. นอกกรอบกะ</th><th class="tar" style="width:74px">ส่วนต่าง</th>'
    + '<th style="width:104px">เวลาเข้างาน</th><th style="width:170px"></th></tr></thead><tbody>';
  if (!list.length) tb += emptyRow(8, 'ไม่มีใบในกลุ่มนี้', 'เลือกกลุ่มอื่นด้านบน หรือกลับไปที่ทะเบียนใบ OT');
  list.forEach(function (r) {
    const hr = hoursOf(r), out = cfmOutsideOf(r), vr = cfmVarianceOf(r);
    const rdy = confirmReady(r);
    let act = '';
    if (r.rev && r.rev.on) {
      act = '<button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();openModal(\'review\',{id:\'' + r.id + '\'})"><i data-lucide="rotate-ccw" class="w-4 h-4"></i>ทวนใบนี้</button>';
    } else if (r.st === 'approved' && vr !== null && vr > 0 && !r.vack) {
      act = '<button class="btn btn-secondary btn-sm" onclick="event.stopPropagation();openModal(\'vack\',{id:\'' + r.id + '\'})"><i data-lucide="shield-check" class="w-4 h-4"></i>รับทราบส่วนต่าง</button>';
    } else if (r.st === 'approved' && rdy.ok && P().confirm) {
      act = '<button class="btn btn-primary btn-sm" onclick="event.stopPropagation();openModal(\'confirm\',{id:\'' + r.id + '\'})"><i data-lucide="check-check" class="w-4 h-4"></i>ยืนยันเวลาจริง</button>';
    } else if (r.st === 'approved') {
      act = '<span class="hint-inline">' + rdy.why + '</span>';
    } else if (r.st === 'confirmed') {
      act = '<span class="hint-inline">ยืนยันโดย ' + (r.cfm ? empOf(r.cfm.by).n + ' · ' + r.cfm.at : '—') + '</span>';
    }
    tb += '<tr onclick="openView(\'' + r.id + '\')" style="cursor:pointer">'
      + '<td>' + (r.no ? '<span class="tbl-mono">' + r.no + '</span>' : '<span class="cell-sub" style="line-height:1.28">ยังไม่ออกเลข</span>') + '</td>'
      + '<td>' + personCell(r.emp) + '</td>'
      + '<td><span class="cell-main tnum">' + dTHR(reqDateFrom(r), reqDateTo(r)) + '</span><span class="cell-sub">' + r.ln.length + ' บรรทัด</span></td>'
      + '<td class="tar tnum">' + nH(hr.req) + '</td>'
      + '<td class="tar tnum">' + (out === null ? '—' : nH(out)) + '</td>'
      + '<td class="tar tnum">' + (vr === null ? '—' : '<span class="' + (vr > 0 ? 'varpos' : vr < 0 ? 'varneg' : 'varok') + '">' + (vr > 0 ? '+' : '') + nH(vr) + '</span>') + '</td>'
      + '<td>' + attStatePill(r) + '</td>'
      + '<td class="tar">' + act + '</td></tr>';
  });
  tb += '</tbody></table></div>';
  h += SEC('fingerprint', 'ใบที่รอการยืนยันเวลาจริง',
    'ชั่วโมงนอกกรอบกะเป็นข้อมูลดิบจาก เวลาเข้างาน ' + tipI('ชั่วโมงนอกกรอบกะยังไม่ใช่ OT ที่อนุมัติ — ต้องผ่านใบนี้จนถึงสถานะ ยืนยันแล้ว ก่อน จึงจะถูกส่งต่อให้ค่าจ้างอ่าน'), tb);

  /* ใบที่ติดธง "ต้องทวน" — ค่าก่อน/หลัง ต้องมีคนตัดสิน */
  if (b.review.length) {
    let rb = '<table class="mini-tbl"><thead><tr><th>เลขที่</th><th>ผู้ขอ</th><th class="tar">ค่าก่อน</th><th class="tar">ค่าหลัง</th><th>เมื่อ</th><th>สิ่งที่ต้องตัดสิน</th></tr></thead><tbody>';
    b.review.forEach(function (r) {
      const ls = buildLines(r);
      const a = ls.map(function (l) { return l.att && l.att.adj ? l.att.adj : null; }).filter(Boolean)[0];
      rb += '<tr><td><span class="tbl-mono">' + (r.no || 'ร่าง') + '</span></td><td>' + empOf(r.emp).n + '</td>'
        + '<td class="tar tnum">' + (a ? nH(a.before) : '—') + '</td><td class="tar tnum">' + (a ? nH(a.after) : '—') + '</td>'
        + '<td class="tnum">' + (a ? a.at : (r.rev ? r.rev.at : '—')) + '</td>'
        + '<td>ปรับชั่วโมงที่รับรอง หรือถอนใบ — ตัวเลขบนใบเปลี่ยนเองไม่ได้</td></tr>';
    });
    rb += '</tbody></table>';
    h += SEC('rotate-ccw', 'ใบที่ติดธง “ต้องทวน” (' + b.review.length + ')', 'เกิดจากการแก้เวลาเข้างานย้อนหลังของวันที่ใบอ้างอยู่', rb);
  }

  /* สิ่งที่ถูกเผยแพร่ให้ปลายทางอ่าน — เฉพาะใบที่ยืนยันแล้ว */
  const pub = publishedRows('');
  let pb = '<table class="mini-tbl"><thead><tr><th>เลขที่</th><th>พนักงาน</th><th>วันที่</th><th>ประเภทอัตรา</th><th class="tar">ตัวคูณ</th><th>รหัสจ่าย</th><th class="tar">ชั่วโมงที่ยืนยัน</th><th>เวอร์ชันที่ใช้</th></tr></thead><tbody>';
  const pubv = pub.filter(function (x) { return inScope(x.r.emp); });
  if (!pubv.length) pb += '<tr><td colspan="8"><span class="hint-inline">ยังไม่มีใบที่ยืนยันเวลาจริงในขอบเขตที่คุณเห็น</span></td></tr>';
  pubv.forEach(function (x) {
    const share = x.r.hcf !== null && x.r.hcf !== undefined ? x.r.hcf / (reqHours(x.r) || 1) : 1;
    pb += '<tr><td><span class="tbl-mono">' + x.r.no + '</span></td><td>' + empOf(x.r.emp).n + '</td><td class="tnum">' + dTH(x.l.d) + '</td>'
      + '<td>' + (x.l.rate ? x.l.rate.n : '—') + '</td><td class="tar tnum">×' + (x.l.rate ? x.l.rate.mult.toFixed(1) : '—') + '</td>'
      + '<td>' + (x.l.rate ? x.l.rate.pay : '—') + '</td><td class="tar tnum">' + nH(x.l.hrs * share) + '</td>'
      + '<td><span class="kbd">' + (x.r.cfv || OTCFG.ver) + '</span></td></tr>';
  });
  pb += '</tbody></table>';
  h += SEC('share-2', 'สิ่งที่ถูกเผยแพร่ให้ปลายทางอ่าน (' + pubv.length + ' บรรทัด)',
    'ชั่วโมง ประเภทอัตรา ตัวคูณ รหัสจ่าย และรหัสเวอร์ชัน — ไม่มีจำนวนเงิน', pb);

  return h + '</div>';
}
</script>
<script>
/* ============================================================
   TAB 4 — สรุปงวดและการเชื่อมต่อ (FN-45..FN-49 · FN-52..FN-57)
   ตัวเลขทั้งหมดเป็น "ชั่วโมง" กับ "ตัวคูณอ้างอิง" เท่านั้น — ไม่มีตัวเลขเงิน (BR-18 · FN-53)
   ============================================================ */
function setPer(v) { state.per.code = v; render(); }
function toggleLink(k) {
  state.link[k] = !state.link[k];
  const l = LINKAGE.find(function (x) { return x.k === k; });
  showToast((state.link[k] ? 'เปิด' : 'ปิด') + 'การเชื่อมต่อ ' + l.n + ' แล้ว', state.link[k] ? 'success' : 'info');
  render();
}
function viewPeriod() {
  const p = PERIOD.find(function (x) { return x.c === state.per.code; }) || PERIOD[2];
  const sum = periodSummary(p.c).filter(function (x) { return inScope(x.emp); });
  const openDocs = visibleReq().filter(function (r) {
    if (r.st !== 'draft' && r.st !== 'pending' && r.st !== 'approved') return false;
    return buildLines(r).some(function (l) { return l.period.c === p.c; });
  });
  const unconf = Math.round(visibleReq().filter(function (r) { return r.st === 'approved'; })
    .reduce(function (s, r) { return s + buildLines(r).filter(function (l) { return l.period.c === p.c; }).reduce(function (a, l) { return a + l.hrs; }, 0); }, 0) * 100) / 100;
  const totalHrs = Math.round(sum.reduce(function (s, x) { return s + x.hrs; }, 0) * 100) / 100;

  let h = '<div class="scrollpad page-fill" style="overflow-y:auto">';
  h += SEC('calendar-check', 'งวดที่ดู', (p.st === 'closed' ? '<span class="pill pill-archived">ปิดแล้ว</span>' : '<span class="pill pill-success">เปิด</span>'),
    '<div class="row-wrap">'
    + '<span class="fr-lb">งวด</span><select class="select" onchange="setPer(this.value)">'
    + PERIOD.map(function (x) { return '<option value="' + x.c + '"' + (p.c === x.c ? ' selected' : '') + '>' + x.c + '</option>'; }).join('') + '</select>'
    + '<span class="hint-inline">' + dTH(p.f) + ' – ' + dTH(p.t) + (p.closedAt ? ' · ปิดเมื่อ ' + dTH(p.closedAt) + ' · ยอดถูกตรึงเมื่อ ' + p.frozenAt : '') + '</span>'
    + '<span class="fr-sp"></span>' + cfgLink('period_rule', 'เปิด/ปิดงวด ทำที่ ตั้งค่า HR') + '</div>');

  if (p.st === 'closed') {
    h += '<div class="note note-danger"><i data-lucide="lock" class="w-4 h-4"></i><div>งวด ' + p.c + ' ปิดแล้ว — ยื่น อนุมัติ ยืนยันเวลาจริง หรือถอนใบที่มีวันทำ OT ในงวดนี้ไม่ได้ ต้องเปิดงวดที่ ตั้งค่า HR ก่อน · ยอดสรุปด้านล่างถูกตรึงไว้เมื่อ ' + p.frozenAt + '</div>'
      + '<span class="note-act">' + cfgLink('period_rule', 'ไปเปิดงวด') + '</span></div>';

<script>

function wf() { return state.dw.form; }

function setWQuiet(k, v) { wf()[k] = v; }

function goStep(n) { if (n < 1 || n > 5) return; state.drawer.step = n; render(); }
function wizardBack() { goStep(state.drawer.step - 1); }
function wizardNext() {
  const s = state.drawer.step, f = wf(), c = checkReq(f);
  const need = function (code) { return c.blocks.some(function (b) { return b.c === code; }); };
  if (s === 1) {
    if (!f.emp) { showToast('กรุณาเลือกผู้ขอก่อน', 'warning'); return; }
    if (need('CONSENT')) { showToast('ต้องให้ผู้ทำ OT กดรับทราบก่อนจึงไปต่อได้', 'warning'); return; }
  }
  if (s === 2) {
    if (need('RANGE') || need('SELF') || need('NOLINE')) { showToast('กรุณาตรวจบรรทัดช่วงเวลาให้ถูกต้องก่อน', 'warning'); return; }

    if (!f.slots.length) f.slots = resolveDoa(f).map(function (x) { return { roles: x.roles, roleName: x.roleName, as: x.suggest }; });

      + '<td>' + (l.dt ? l.dt.n : '—') + '</td><td>' + (l.rate ? l.rate.n : '—') + '</td>'

  h += SEC('git-branch', 'สายอนุมัติที่ได้จากระบบสายอนุมัติ (' + f.slots.length + ' ขั้น)',
    '<span class="kbd">' + entry.doa_entry_ref + '</span> · ' + (entry.chainMode === 'sequential' ? 'ไล่ทีละขั้น' : 'พร้อมกัน') + ' · ไม่มีวงเงิน', sb);

  h += SEC('paperclip', 'เอกสารแนบ (' + f.files.length + ' ไฟล์ · Document Center)', '',
    f.files.length ? f.files.map(function (x) { return '<div class="filerow"><i data-lucide="file-text" class="w-4 h-4"></i><div class="min0"><div class="fr-n">' + x.n + '</div><div class="fr-m">' + x.sz + '</div></div></div>'; }).join('')
      : '<div class="hint-inline">ไม่มีเอกสารแนบ</div>');
  return h;
}

function wizardHTML() {
  const f = wf(), s = state.drawer.step, c = checkReq(f);
  const edit = state.dw.mode === 'edit';
  const okSlots = s === 5 ? f.slots.every(function (x) { return !!x.as; }) : true;
  const canSend = c.blocks.length === 0 && okSlots;
  let h = '<div class="drawer-header"><div class="min0">'
    + '<div class="dw-eyebrow"><i data-lucide="' + (edit ? 'pencil' : 'file-plus') + '" class="w-3 h-3"></i>' + (edit ? 'แก้ไขเอกสาร' : 'สร้างเอกสารใหม่') + '</div>'
    + '<div class="dw-title">' + (edit ? 'แก้ไขใบขอ OT ' + (f.no || 'ร่าง') : 'สร้างใบขอ OT ใหม่') + '</div></div>'
    + '<div class="dw-acts"><button class="top-icon-btn" onclick="closeDrawer()"><i data-lucide="x" class="w-4 h-4"></i></button></div></div>';
  h += '<div class="drawer-stepper-band">' + stepperHTML() + '</div>';
  h += '<div class="drawer-body"><div class="step-wrap">'
    + (s === 1 ? wStep1() : s === 2 ? wStep2() : s === 3 ? wStep3() : s === 4 ? wStep4() : wStep5())
    + '</div></div>';
  h += '<div class="drawer-footer">'
    + (s > 1 ? '<button class="btn btn-secondary" onclick="wizardBack()"><i data-lucide="chevron-left" class="w-4 h-4"></i>ย้อนกลับ</button>' : '<span></span>')
    + '<div class="dw-footer-right"><button class="btn btn-ghost" onclick="closeDrawer()">ยกเลิก</button>'
    + (s < 5 ? '<button class="btn btn-primary" onclick="wizardNext()">ถัดไป<i data-lucide="chevron-right" class="w-4 h-4"></i></button>'
      : '<button class="btn btn-secondary" onclick="submitDraft()"><i data-lucide="save" class="w-4 h-4"></i>บันทึกแบบร่าง</button>'
      + '<button class="btn btn-primary" ' + (canSend && !state.dw.busy ? '' : 'disabled') + ' onclick="submitForApproval()">'
      + (state.dw.busy ? '<i data-lucide="loader-2" class="w-4 h-4 spin"></i>กำลังส่ง…' : '<i data-lucide="send" class="w-4 h-4"></i>บันทึกและส่งอนุมัติ') + '</button>')
    + '</div></div>';
  return h;
}

<script>
/* ============================================================
   SURFACE 3 — VIEW DRAWER (Pattern Q · tabs ล็อก · #101)
   รายละเอียด › PDF › ลายเซ็น › ประวัติ — เอกสารแนบเป็น section ใน "รายละเอียด" ไม่ใช่ tab แยก
   ============================================================ */
const VTABS = [
  { k: 'detail',  n: 'รายละเอียด', i: 'file-text' },
  { k: 'pdf',     n: 'PDF',        i: 'file' },
  { k: 'sign',    n: 'ลายเซ็น',    i: 'pen-tool' },
  { k: 'history', n: 'ประวัติ',    i: 'history' }
];
function openView(id, tab) {
  const r = REQ.find(function (x) { return x.id === id; });
  if (!r) return;
  state.selRow = id;
  openDW('view', r, { tab: tab || 'detail' });
}
function tabBtn(k) {
  const t = VTABS.find(function (x) { return x.k === k; });
  return '<button class="tab ' + (state.dw.tab === k ? 'is-active' : '') + '" onclick="dwTab(\'' + k + '\')">'
    + '<i data-lucide="' + t.i + '" class="w-4 h-4"></i>' + t.n + '</button>';
}
function reqAudit(r) {
  const out = [];
  const created = r.sub ? r.sub.at : (TODAY + ' 08:00');
  out.push({ t: 'สร้างใบขอ OT' + (r.proxyBy ? ' แทนพนักงาน · ทำแทนโดย ' + empOf(r.proxyBy).n : ''), by: r.proxyBy || r.emp, at: created, kind: 'ok', q: '' });
  if (r.cns) out.push({ t: 'ผู้ทำ OT กดรับทราบก่อนส่งอนุมัติ', by: r.cns.by, at: r.cns.at, kind: 'ok', q: '' });
  if (r.sub) {
    out.push({ t: 'ส่งอนุมัติ' + (r.no ? ' · ออกเลขที่ ' + r.no : ''), by: r.sub.by, at: r.sub.at, kind: 'ok',
      q: 'บันทึกเพดานที่ใช้ตัดสิน ' + nH(r.capSnap || OTCFG.capHoursWeek) + ' ชม./สัปดาห์ และรหัสเวอร์ชันที่ใช้ติดใบ · สายอนุมัติ ' + ((r.chain || []).length) + ' ขั้น' });
  }
  (r.chain || []).forEach(function (s, i) {
    if (s.st === 'ok') out.push({ t: 'ขั้นที่ ' + (i + 1) + ' อนุมัติ', by: s.as, at: s.at, kind: 'ok', q: s.note });
    if (s.st === 'no') out.push({ t: 'ขั้นที่ ' + (i + 1) + ' ไม่อนุมัติ', by: s.as, at: s.at, kind: 'bad', q: s.note });
  });
  if (r.prs) out.push({ t: 'อนุมัติบางส่วน · รับรอง ' + nH(r.hap) + ' ชม. จากที่ขอ ' + nH(reqHours(r)) + ' ชม.', by: (r.chain || []).filter(function (s) { return s.st === 'ok'; }).slice(-1).map(function (s) { return s.as; })[0] || 'HR-0007', at: r.done, kind: 'warn', q: r.prs });
  if (r.vack) out.push({ t: 'รับทราบส่วนต่างเกินเวลาจริง', by: r.vack.by, at: r.vack.at, kind: 'warn', q: r.vack.rs });
  EXTRA_AUDIT.filter(function (x) { return x.ref === r.no; }).forEach(function (x) {
    out.push({ t: x.act, by: x.by, at: x.at, kind: x.kind || 'ok', q: x.note });
  });
  if (r.st === 'rejected') out.push({ t: 'ใบเป็น “ไม่อนุมัติ” · เลขที่เอกสารคงอยู่', by: 'ระบบ', at: r.done, kind: 'bad', q: 'เลขที่ ' + (r.no || '—') + ' ไม่ถูกนำกลับมาใช้ซ้ำ' });
  if (r.cfm) out.push({ t: 'ยืนยันเวลาจริง · ชั่วโมงสุดท้าย ' + nH(r.hcf) + ' ชม.', by: r.cfm.by, at: r.cfm.at, kind: 'ok', q: 'ใบเข้าสถานะ “ยืนยันแล้ว” และเริ่มถูกเผยแพร่ให้ปลายทางอ่าน' });
  if (r.rev && r.rev.on) out.push({ t: 'ติดธง “ต้องทวน”', by: 'ระบบ', at: r.rev.at, kind: 'warn', q: r.rev.note });
  if (r.cx) out.push({ t: 'ผู้ยื่นยกเลิกใบ', by: r.cx.by, at: r.cx.at, kind: 'warn', q: r.cx.rs });
  if (r.wd) {
    out.push({ t: 'ขอถอนใบ', by: r.wd.by, at: r.wd.at, kind: 'warn', q: r.wd.rs });
    out.push({ t: 'อนุมัติการถอน · เกิดรายการกลับ ' + (r.wd.rvNo || ''), by: r.wd.ap, at: r.wd.apAt, kind: 'ok', q: 'ใบเดิม แถวประวัติเดิม และสำเนา PDF เดิมไม่ถูกลบไม่ถูกแก้' });
  }
  (r.extra || []).forEach(function (x) { out.push(x); });
  return out.sort(function (a, b) { return a.at < b.at ? -1 : 1; });
}

    : r.st === 'withdrawn' ? { d: 'is-warning', t: 'ถอนใบแล้ว · เกิดรายการกลับที่ชี้ของเดิม' }

<script>
/* ============================================================
   SURFACE 4 — MODALS + ACTIONS (Pattern D)
   ทุก transition: เขียนแถวประวัติใหม่ → ปิด overlay → แล้วค่อย toast (Rule #46)
   ============================================================ */
state.mf = { rs: '', slots: [], qty: 0, busy: false, act: 'adjust' };
function setM(k, v) { state.mf[k] = v; render(); }
function setMQuiet(k, v) { state.mf[k] = v; }
function mReq() { const d = state.modal.data; return d ? REQ.find(function (x) { return x.id === d.id; }) : null; }
function reqOf(id) { return REQ.find(function (x) { return x.id === id; }); }
function stamp() { return TODAY + ' ' + NOWHM; }
function pushExtra(r, t, by, kind, q) { r.extra = r.extra || []; r.extra.push({ t: t, by: by, at: stamp(), kind: kind, q: q || '' }); }

/* ---------- ส่งอนุมัติ (S-09 · T-2) ---------- */
function openSubmitFromView(id) {
  const r = reqOf(id);
  state.mf.slots = resolveDoa(r).map(function (s) { return { roles: s.roles, roleName: s.roleName, as: s.suggest }; });
  state.mf.rs = '';
  openModal('submit', { id: id });
}
function formToReq(f, r) {
  Object.assign(r, { emp: f.emp, mode: f.mode, ln: f.ln.map(function (l) { return Object.assign({}, l); }),
    rs: f.rs, wk: f.wk, files: f.files, proxyBy: f.proxyBy || null, cns: f.cns || null });
}
function submitDraft() {
  const f = wf();
  let r = f.id ? reqOf(f.id) : null;
  if (r) { formToReq(f, r); pushExtra(r, 'แก้ไขร่าง', P().emp, 'ok', ''); }
  else {
    r = { id: 'ON' + (REQ.length + 1), no: null, emp: f.emp, mode: f.mode, st: 'draft', ln: [], rs: '', wk: '',
      files: [], sub: null, done: '', chain: [], hap: null, hcf: null, capSnap: null, cfv: '', extra: [] };
    formToReq(f, r);
    REQ.unshift(r);
    if (r.proxyBy) pushExtra(r, 'สร้างใบขอ OT แทนพนักงาน · ทำแทนโดย ' + P().n, P().emp, 'ok', '');
  }
  closeDrawer();
  setTimeout(function () { render(); showToast('บันทึกร่างแล้ว — ยังไม่ออกเลขที่ และยังไม่ดึงสายอนุมัติ', 'success'); }, 300);
}
function submitForApproval() {
  const f = wf();
  if (state.dw.busy) return;
  state.dw.busy = true; render();
  setTimeout(function () {
    let r = f.id ? reqOf(f.id) : null;
    const reIssue = !!(r && r.no);
    if (r) formToReq(f, r);
    else {
      r = { id: 'ON' + (REQ.length + 1), no: null, emp: f.emp, mode: f.mode, st: 'draft', ln: [], rs: '', wk: '',
        files: [], sub: null, done: '', chain: [], hap: null, hcf: null, capSnap: null, cfv: '', extra: [] };
      formToReq(f, r);
      REQ.unshift(r);
    }
    /* [DOCCFG-HOOK] ENG-DOC-NUM.next('OT') — เลขออกตอนส่งอนุมัติ · ใบที่แก้แล้วส่งใหม่ใช้เลขเดิม (BR-13) */
    if (!r.no) { r.no = nextDocNo(); DOCCFG.nextRun++; }
    const cap = capOf(r);
    r.capSnap = cap.capWeek;                                   /* snapshot เพดานที่ใช้ตัดสิน (BR-09) */
    r.cfv = OTCFG.ver + ' · ' + HOLVER + ' · ' + SHIFTVER;      /* snapshot รหัสเวอร์ชันทั้งก้อน (BR-03) */
    r.st = 'pending';
    /* [DOA-HOOK] สายที่ resolve มาถูก freeze ลง approval_chain — ชั้นเลือกจากธงเกินเพดาน */
    r.chain = f.slots.map(function (s) { return { as: s.as, st: 'wait', at: '', note: '' }; });
    r.sub = { by: P().emp, at: stamp() };
    if (r.proxyBy) pushExtra(r, 'ส่งอนุมัติแทนพนักงาน · ทำแทนโดย ' + P().n, P().emp, 'ok', '');
    /* [NTF-HOOK] ot_submitted → ผู้ถือ slot ปัจจุบัน · ot_cap_exceeded เมื่อเกินเพดาน (ดู NTF_BRIEF.md) */
    state.dw.busy = false;
    closeDrawer();
    setTimeout(function () {
      render();
      showToast('ส่งอนุมัติแล้ว · เลขที่ ' + r.no + (reIssue ? ' (ใช้เลขเดิม · ดึงสายอนุมัติใหม่ ' + r.chain.length + ' ขั้น)' : ' · สายอนุมัติ ' + r.chain.length + ' ขั้น'), 'success');
    }, 300);
  }, 420);
}
function doSubmitModal() {
  const r = mReq();
  if (state.mf.slots.some(function (s) { return !s.as; })) { showToast('เลือกผู้อนุมัติให้ครบทุกขั้นก่อน', 'warning'); return; }
  const c = checkReq(r);
  if (c.blocks.length) { showToast('ใบนี้ยังติดเงื่อนไข — แก้ที่ปุ่มแก้ไขก่อน', 'warning'); return; }
  const cap = capOf(r);
  r.no = nextDocNo(); DOCCFG.nextRun++;
  r.capSnap = cap.capWeek;
  r.cfv = OTCFG.ver + ' · ' + HOLVER + ' · ' + SHIFTVER;
  r.st = 'pending';
  r.chain = state.mf.slots.map(function (s) { return { as: s.as, st: 'wait', at: '', note: '' }; });
  r.sub = { by: P().emp, at: stamp() };
  /* [NTF-HOOK] ot_submitted */
  closeModal();
  setTimeout(function () { render(); showToast('ส่งอนุมัติแล้ว · เลขที่ ' + r.no + ' · สายอนุมัติ ' + r.chain.length + ' ขั้น', 'success'); }, 250);
}

/* ---------- อนุมัติ / อนุมัติบางส่วน / ไม่อนุมัติ (T-3 · T-4 · T-5) ---------- */
function guardApprove(r) {
  const c = checkReq(r);
  const hard = c.blocks.filter(function (b) { return ['PERIOD', 'LEAVE', 'CLASH', 'VARIANCE', 'ATTEXC', 'NOSHIFT'].indexOf(b.c) >= 0; });
  if (hard.length) { showToast('อนุมัติไม่ได้ — ' + hard[0].m, 'warning'); return false; }
  return true;
}
function finishApprove(r, hours, note) {
  const s = curSlot(r);
  s.st = 'ok'; s.at = stamp(); s.note = note || '';
  const left = curSlot(r);
  if (!left) {
    r.st = 'approved'; r.done = stamp();
    r.hap = hours;
    /* [CSQ-HOOK] ot.approved → FC kind estimated (หน่วยชั่วโมง ไม่มีเงิน) — ดู CSQ_BRIEF.md */
    /* [DOCCFG-HOOK] ENG-DOC-STORE.store(pdf,'OT',id,'approved_final') — เก็บสำเนา ณ เวลาที่อนุมัติครบสาย */
  }
  /* [NTF-HOOK] ot_decided → ผู้ขอ */
  return !left;
}
function doApprove() {
  const r = mReq();
  if (!curSlot(r) || !guardApprove(r)) return;
  const done = finishApprove(r, reqHours(r), state.mf.rs || '');
  const msg = done ? 'อนุมัติครบสายแล้ว · รับรอง ' + nH(r.hap) + ' ชม. · เก็บสำเนาใบ OT แล้ว'
    : 'อนุมัติขั้นที่ ' + signProgress(r).ok + ' แล้ว · ส่งต่อขั้นถัดไป';
  state.mf.rs = '';
  closeModal();
  setTimeout(function () { render(); showToast(msg, 'success'); }, 250);
}
function doPartial() {
  const r = mReq();
  if (!curSlot(r) || !guardApprove(r)) return;
  const q = +state.mf.qty || 0;
  const req = reqHours(r);
  const out = cfmOutsideOf(r);
  if (!String(state.mf.rs || '').trim()) { showToast('ต้องกรอกเหตุผลก่อนอนุมัติบางส่วน', 'warning'); return; }
  if (q <= 0 || q > req) { showToast('ชั่วโมงที่รับรองต้องมากกว่า 0 และไม่เกินที่ขอ ' + nH(req) + ' ชม.', 'warning'); return; }
  if (out !== null && q > out) { showToast('ชั่วโมงที่รับรองต้องไม่เกินชั่วโมงนอกกรอบกะ ' + nH(out) + ' ชม.', 'warning'); return; }
  r.prs = state.mf.rs;
  const done = finishApprove(r, q, 'รับรอง ' + nH(q) + ' ชม. จากที่ขอ ' + nH(req) + ' ชม.');
  /* [CSQ-HOOK] ot.hours_adjusted → EC/FC ปรับปรุงที่ชี้ของเดิม (supersedes) */
  state.mf.rs = ''; state.mf.qty = 0;
  closeModal();
  setTimeout(function () { render(); showToast(done ? 'อนุมัติบางส่วนแล้ว · รับรอง ' + nH(q) + ' ชม. จากที่ขอ ' + nH(req) + ' ชม.' : 'บันทึกการรับรองบางส่วนของขั้นนี้แล้ว', 'success'); }, 250);
}
function doReject() {
  const r = mReq(), s = curSlot(r);
  if (!s) return;
  if (!String(state.mf.rs || '').trim()) { showToast('ต้องกรอกเหตุผลก่อนบันทึกการไม่อนุมัติ', 'warning'); return; }
  s.st = 'no'; s.at = stamp(); s.note = state.mf.rs;
  r.st = 'rejected'; r.done = stamp(); r.rjs = state.mf.rs;
  /* [CSQ-HOOK] ot.rejected → FC kind avoided · [NTF-HOOK] ot_decided → ผู้ขอ */
  state.mf.rs = '';

  setTimeout(function () { render(); showToast('บันทึกการไม่อนุมัติแล้ว · เลขที่เอกสารคงอยู่ ไม่ถูกนำกลับมาใช้ซ้ำ', 'success'); }, 250);
}

/* ---------- รับทราบส่วนต่างเกินเวลาจริง (BR-16 · FN-19) ---------- */
function doVack() {

/* ---------- ยืนยันเวลาจริง (T-8 · S-16 · BR-17) ---------- */
function doConfirm() {
  const r = mReq();

  if (!rdy.ok) { showToast('ยังยืนยันเวลาจริงไม่ได้ — ' + rdy.why, 'warning'); return; }

  /* [NTF-HOOK] ปลายทางเริ่มอ่าน read model ของใบนี้ได้ (BR-17) */
  state.mf.qty = 0;

  setTimeout(function () { render(); showToast('ยืนยันเวลาจริงแล้ว · ชั่วโมงสุดท้าย ' + nH(q) + ' ชม. · เข้าสรุปงวดให้ปลายทางอ่าน', 'success'); }, 250);
}

/* ---------- ทวนใบที่ติดธง "ต้องทวน" (S-23 · BR-22 · FN-43) ---------- */
function doReview() {
  const r = mReq();
  if (!String(state.mf.rs || '').trim()) { showToast('ต้องกรอกเหตุผลของการตัดสิน', 'warning'); return; }
  if (state.mf.act === 'withdraw') {
    r.wd = { by: P().emp, at: stamp(), rs: state.mf.rs, ap: (r.chain[0] || {}).as || 'HR-0044', apAt: stamp(), rvNo: (r.no || '') + '-R1' };

  } else {
    const q = +state.mf.qty || 0;
    if (q <= 0) { showToast('ระบุชั่วโมงที่รับรองใหม่ก่อน', 'warning'); return; }

  }

  closeModal();
  setTimeout(function () { render(); showToast('บันทึกผลการทวนเป็นแถวประวัติใหม่แล้ว — แถวเดิมไม่ถูกแก้', 'success'); }, 250);
}

/* ---------- ยกเลิกเอง (T-6) · ถอน (T-9) · ทิ้งร่าง ---------- */
function doCancel() {
  const r = mReq();
  if (!String(state.mf.rs || '').trim()) { showToast('ต้องกรอกเหตุผลก่อนยกเลิกใบ', 'warning'); return; }
  r.st = 'cancelled'; r.cx = { by: P().emp, at: stamp(), rs: state.mf.rs };
  (r.chain || []).forEach(function (s) { if (s.st === 'wait') s.st = 'closed'; });
  /* [NTF-HOOK] ot_cancelled → ผู้ถือ slot ที่ค้าง */
  state.mf.rs = '';
  closeModal();
  setTimeout(function () { render(); showToast('ยกเลิกใบแล้ว · ปิดงานอนุมัติที่ค้าง · เลขที่เอกสารคงอยู่', 'success'); }, 250);
}
function doWithdraw() {
  const r = mReq();
  if (!String(state.mf.rs || '').trim()) { showToast('ต้องกรอกเหตุผลก่อนขอถอนใบ', 'warning'); return; }
  if (checkReq(r).blocks.some(function (b) { return b.c === 'PERIOD'; })) { showToast('วันที่ทำ OT อยู่ในงวดที่ปิดแล้ว — ถอนไม่ได้', 'warning'); return; }
  r.st = 'withdrawn';
  r.wd = { by: P().emp, at: stamp(), rs: state.mf.rs, ap: (r.chain[0] || {}).as || 'HR-0044', apAt: stamp(), rvNo: (r.no || '') + '-R1' };
  /* [CSQ-HOOK] ot.withdrawn → EC/FC กลับรายการที่ชี้ของเดิม (reversal_of) · [NTF-HOOK] ot_withdrawn */
  state.mf.rs = '';
  closeModal();
  setTimeout(function () { render(); showToast('ถอนใบแล้ว · เกิดรายการกลับ ' + r.wd.rvNo + ' · ใบเดิมและสำเนา PDF เดิมยังอยู่', 'success'); }, 250);
}
const ARCHIVE = [];
function doArchive() {
  const r = mReq();
  r.archived = true;
  const i = REQ.indexOf(r); if (i >= 0) REQ.splice(i, 1);   /* soft archive — ย้ายออกจากทะเบียน ไม่ลบข้อมูลจริง */
  ARCHIVE.push(r);
  closeModal();
  setTimeout(function () { render(); showToast('เก็บร่างเข้าคลังแล้ว — ไม่มีการลบถาวรในระบบนี้', 'success'); }, 250);

      + '<input class="input tnum" type="number" step="0.25" min="0" name="md-cq" value="' + state.mf.qty + '" onchange="setM(\'qty\',+this.value)"></div>'

      + '<div class="modal-body">' + reasonField('เหตุผลที่ขอถอน', WITHDRAW_PRESETS)
      + '<div class="kv" style="margin-top:8px">'
      + KV('ชั่วโมงที่จะถูกกลับรายการ', '<span class="tnum">' + nH(r.hcf !== null && r.hcf !== undefined ? r.hcf : r.hap) + ' ชม.</span>')
      + KV('ผู้อนุมัติการถอน', personCell((r.chain[0] || {}).as || 'HR-0044'))
      + '</div>'
      + '<div class="hint-inline">การถอนต้องผ่านสายอนุมัติอีกครั้ง · เกิดรายการกลับที่ชี้ของเดิม โดยใบเดิม ประวัติเดิม และสำเนา PDF เดิมยังอยู่ครบ</div></div>'
      + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ไม่ใช่ตอนนี้</button>'
      + '<button class="btn btn-danger" onclick="doWithdraw()">ยืนยันขอถอน</button></div>';
  }
  if (ty === 'archive' && r) {
    return mHead('archive', 'ทิ้งร่างใบขอ OT', 'ร่างจะถูกเก็บเข้าคลัง ไม่ถูกลบถาวร', 'is-warning')

      + KV('ผู้ขอ', empOf(r.emp).n) + KV('ช่วงวันที่ทำ OT', dTH(reqDateFrom(r)))

      + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ไม่ใช่ตอนนี้</button>'
      + '<button class="btn btn-danger" onclick="doArchive()">ทิ้งร่าง</button></div>';
  }
  return '';
}
