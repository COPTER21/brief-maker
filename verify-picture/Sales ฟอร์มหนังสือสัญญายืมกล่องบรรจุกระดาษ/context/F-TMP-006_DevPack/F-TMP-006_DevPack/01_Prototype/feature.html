/* ---------- logic-less template renderer (mustache subset · คู่กับ print/render_doc.py) ----------
   {{a.b}} escape · {{{a.b}}} raw · {{#list}}…{{/list}} วน/มีค่า · {{^x}}…{{/x}} ไม่มีค่า */
function tplGet(stack, path){
  for (let i = stack.length - 1; i >= 0; i--){ let cur = stack[i], ok = true;
    for (const k of path.split('.')){ if (cur && typeof cur === 'object' && k in cur) cur = cur[k]; else { ok = false; break; } }
    if (ok) return cur; }
  return null;
}
function tplRender(t, stack){
  t = t.replace(/{{([#^])([\w.]+)}}([\s\S]*?){{\/\2}}/g, (m, kind, key, inner) => { const v = tplGet(stack, key), has = Array.isArray(v) ? v.length > 0 : !!v;
    if (kind === '^') return has ? '' : tplRender(inner, stack);
    if (Array.isArray(v)) return v.map(x => tplRender(inner, stack.concat([x]))).join('');
    return has ? tplRender(inner, stack.concat(typeof v === 'object' ? [v] : [])) : ''; });
  t = t.replace(/{{{([\w.]+)}}}/g, (m, k) => { const v = tplGet(stack, k); return v == null ? '' : String(v); });
  return t.replace(/{{([\w.]+)}}/g, (m, k) => { const v = tplGet(stack, k); return v == null ? '' : esc(v); });
}
/* ช่องลงชื่อ = ผู้รับมอบ (คู่สัญญา) + 1 ช่องต่อขั้นใน DOA · แถวละ ≤4 เฉลี่ยเท่ากัน (ผลต้องเท่ากับ sign_rows.py) */

  const m = maxPerRow || 4, n = signs.length; if (!n) return [];
  const rows = Math.ceil(n / m), per = Math.ceil(n / rows), out = [];
  for (let i = 0; i < n; i += per) out.push({ signs:signs.slice(i, i + per) });
  return out;
}

          : '<button class="btn btn-primary" id="btnNext" onclick="wizNext()"><span>ถัดไป</span><i data-lucide="arrow-right" class="w-4 h-4"></i></button>'}

/* ---------- wizard actions ---------- */
function goStep(n){ S.dw.step = n; render(); }
function setF2(k, v){ wf()[k] = v; dirty(); if (S.dw.err){ if (k === 'custAddr') delete S.dw.err.addr; if (k === 'recvName') delete S.dw.err.recv; } }
function setCust(code){
  const f = wf(), c = custOf(code);
  f.cust = code; f.custAddr = c.addr; if (!(f.recvName || '').trim()){ f.recvName = c.contact; f.recvPos = c.cpos; }
  if (S.dw.err){ delete S.dw.err.cust; delete S.dw.err.addr; delete S.dw.err.recv; }
  dirty(); render();
}
function setDocDate(iso){ wf().reqDate = iso || TODAY; dirty(); render(); }
function setLine(i, v){
  const f = wf(); f.lines[i].detail = v; dirty();
  if (S.dw.err && S.dw.err.lines) delete S.dw.err.lines[i];
  const el = document.querySelector(`[name="ld-${i}"]`); if (el && v.trim()) el.classList.remove('is-bad');
  const n = document.getElementById('loaBox'); if (n) n.textContent = boxCount(f.lines) ? boxCount(f.lines) + ' รายการ' : '';
  const sb = document.getElementById('sumBox'); if (sb) sb.textContent = boxCount(f.lines) ? boxCount(f.lines) + ' รายการ' : 'ยังไม่ใส่';
}
function addLine(){ const f = wf(); f.lines.push(blankLine()); dirty(); render();
  requestAnimationFrame(() => { const el = document.querySelector(`[name="ld-${f.lines.length - 1}"]`); if (el) el.focus(); }); }
function removeLine(i){ const f = wf(); if (f.lines.length === 1) return; f.lines.splice(i, 1); if (S.dw.err){ S.dw.err.lines = {}; S.dw.err.lineMsg = {}; } dirty(); render(); }
function validateMain(){
  const f = wf(), err = { lines:{}, lineMsg:{} };
  if (!f.cust) err.cust = 1;
  if (!(f.custAddr || '').trim()) err.addr = 1;
  if (!(f.recvName || '').trim()) err.recv = 1;
  const empty = f.lines.map((l, i) => [i, (l.detail || '').trim()]).filter(x => !x[1]);
  const allEmpty = empty.length === f.lines.length;
  empty.forEach(x => { err.lines[x[0]] = 1; err.lineMsg[x[0]] = allEmpty ? 'ใส่ชนิด ขนาด และจำนวนกล่อง' : 'บรรทัดนี้ยังว่าง — ใส่ข้อความหรือลบรายการนี้ออก'; });
  const ok = !err.cust && !err.addr && !err.recv && !Object.keys(err.lineMsg).length;
  S.dw.err = ok ? null : err; return ok;
}
function wizNext(){
  if (S.dw.step === 1 && !validateMain()){ render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.dw.step += 1; render();
}
function wizBack(){ S.dw.step = Math.max(1, S.dw.step - 1); render(); }
function pickFiles(inp){ const f = wf(); gateFiles(Array.from(inp.files || [])).forEach(x => f.files.push({ name:x.name, size:fmtSize(x.size) })); inp.value = ''; dirty(); render(); }
function removeFile(i){ wf().files.splice(i, 1); dirty(); render(); }
/* บันทึก = ENG-DOC-NUM.next() ออกเลขที่ (ครั้งแรก · DEC-10) · ค่านโยบายและข้อมูลลูกค้า snapshot ลงเอกสาร */
function persist(){
  const f = wf(), me = ME(), t = nowIso();
  let r = S.dw.editId ? findR(S.dw.editId) : null;
  if (!r){
    SEQ += 1;
    r = { id:'R' + SEQ, code:DOC.prefix + '-2569-' + String(SEQ).padStart(4, '0'), runNo:String(SEQ).padStart(4, '0') + '-2026', status:'draft', emp:S.me, pos:me.pos, dept:me.dept,
      chain:resolveDoa(S.me), doa_entry_ref:MOCK_DOA_RESOLVED.doa_entry_ref, attachments:[], returned:null, submittedAt:null,
      audit:[{ act:'สร้างเอกสาร', by:me.name, at:t, tone:'' }], createdBy:me.name, createdAt:t };
    RECS.unshift(r);
  } else r.audit.push({ act:'แก้ไขร่าง', by:me.name, at:t, tone:'' });
  Object.assign(r, { cust:f.cust, custAddr:f.custAddr, recvName:f.recvName, recvPos:f.recvPos, reqDate:f.reqDate, damage:f.damage,
    pct:POLICY.freeReplacePct, pctText:POLICY.freeReplacePctText,
    lines:f.lines.filter(l => (l.detail || '').trim()).map(l => Object.assign({}, l)), attachments:f.files.slice(), updatedBy:me.name, updatedAt:t });
  return r;
}
function saveDraft(){ if (S.busy) return; if (!validateMain()){ S.dw.step = 1; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const r = persist(); S.busy = false; closeDrawer(true); setTimeout(() => showToast('บันทึกร่างแล้ว · ' + r.code, 'info'), 300); }, 500); }
function saveAndSubmit(){ if (S.busy) return; if (!validateMain()){ S.dw.step = 1; render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  S.busy = true; render();
  setTimeout(() => { if (commitRejected()) return; const r = persist(); S.busy = false; closeDrawer(true); setTimeout(() => openSubmit(r.id), 300); }, 500); }

/* =====================================================================
   MODALS (Pattern D) — ส่งให้ลงนาม (DOA slot picker) · ลงนาม · ไม่ลงนาม · ยกเลิก · ทิ้งการแก้ไข

function modalShell(icon, tone, title, sub, body, foot){

    ${body ? `<div class="modal-body">${body}</div>` : ''}<div class="modal-footer">${foot}</div>`;
}
const busyLabel = (icon, label) => S.busy ? '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>' : `<i data-lucide="${icon}" class="w-4 h-4"></i><span>${label}</span>`;
function presetChips(list, cur){ return `<div class="chip-row">${list.map(p => `<button type="button" class="chip ${cur === p ? 'is-on' : ''}" onclick="setReasonPreset(this.dataset.v)" data-v="${esc(p)}">${esc(p)}</button>`).join('')}</div>`; }
function renderModal(){
  const m = S.md; if (!m) return '';
  const r = m.id ? findR(m.id) : null;
  const w = r && r.chain.length ? wordsFor(r.chain[0].role_id) : DECISION_WORDS.default;
  if (m.kind === 'submit'){
    return modalShell('send', 'is-primary', 'ส่งให้ผู้ส่งมอบลงนาม?', `${r.code} · ${esc(custName(r))} · ${boxCount(r.lines)} รายการกล่อง`,
      `${resolveDoa(r.emp).map((c, i) => `<div class="slot-row"><span class="slot-no num">${c.step}</span><span class="slot-role">${esc(c.role)}</span><div class="field ${m.err && !m.slots[i] ? 'is-invalid' : ''}" id="fSlot${i}">${searchSelectHTML('slot' + i, { placeholder:'เลือกผู้พิจารณา' })}<div class="field-error">กรุณาเลือกผู้พิจารณา</div>${i === 0 ? '<div class="slot-help">ค่าเริ่มต้นจากสายอนุมัติและผังองค์กร</div>' : ''}</div></div>`).join('')}
       <div class="drawer-fields mt-3">${kv('ลูกค้าผู้ยืม', esc(custName(r)))}${kv('ที่อยู่ที่ตั้งกล่อง', esc(r.custAddr))}</div>`,
      `<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="btnSubmit" onclick="confirmSubmit()" ${S.busy ? 'disabled' : ''}>${busyLabel('send', 'ส่งให้ลงนาม')}</button>`);
  }
  if (m.kind === 'approve'){
    return modalShell('check-circle-2', 'is-success', w.approve + 'ในหนังสือสัญญาฉบับนี้?', `${r.code} · ${esc(custName(r))}`,
