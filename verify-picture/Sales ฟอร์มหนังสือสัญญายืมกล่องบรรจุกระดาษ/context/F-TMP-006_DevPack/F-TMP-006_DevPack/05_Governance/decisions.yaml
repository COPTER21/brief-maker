# unattended — AI-DEFAULT ทุกหมวด รอลูกค้ายืนยัน
# ที่มาของค่า: 4_knowledge/governance/unattended-policy.md + FORM_SPEC.check.json (signals)
# เอกสาร: หนังสือสัญญายืม (FM-SAL-14) — หนังสือสัญญา 2 ฝ่าย (ผู้รับมอบ = ลูกค้า · ผู้ส่งมอบ = บริษัท)

# G1 ผลต่อระบบ (ต้องตอบ) — เป็นหนังสือสัญญายืมกล่องบรรจุกระดาษให้ลูกค้าใช้ฟรี
# ไม่แก้ค่าตั้งต้นในระบบ · ไม่ตัดสต๊อก/ไม่ออกใบส่งของ/ไม่ลงบัญชีในรอบนี้ (กล่องยังเป็นทรัพย์สินบริษัท)
config_changes: []
post_to: []

# G2 สายอนุมัติ — กระดาษมีช่องลงชื่อฝั่งบริษัท (ผู้ส่งมอบ) 1 ช่อง → ค่าเริ่ม 1 ขั้น
# ฝั่ง "ผู้รับมอบ" เป็นคู่สัญญาภายนอก (ลูกค้า) ไม่ใช่ขั้น DOA
doa:
  required: true
  mode: dynamic
  default_steps: ["role-mgr-sales"]
  amount: none

# G3 สูตร / ค่าคงที่ — ไม่มีสูตรคำนวณบนกระดาษ · มีค่าคงที่ 2 ตัวในเนื้อสัญญา
calc:
  constants_from_config: true
  auto_compute: true
  over_limit: warn
  rules:
    - "เพดานเปลี่ยนกล่องฟรี \"ร้อยละ 10 ต่อปี\" ในเงื่อนไขข้อ 1 อ่านจาก SalesPolicy.box_free_replace_pct ห้าม hardcode — ค่าเปลี่ยนแล้วเนื้อสัญญาที่พิมพ์ต้องเปลี่ยนตาม"
    - "ชื่อบริษัทผู้ให้ยืมในเนื้อสัญญาและใต้ช่องลงนามผู้ส่งมอบ อ่านจาก Organization.legal_name ห้าม hardcode"
    - "ไม่มีช่องคำนวณ — จำนวนกล่องอยู่ในข้อความบรรทัดรายละเอียด ระบบไม่คิดยอดให้ (ตรงกระดาษ)"

# G4 รายการซ้ำ — กระดาษมีหัวข้อย่อยรายละเอียดกล่อง 1 บรรทัด
repeat: { max_rows: null }

# G5 ช่องตามกระดาษ — 1:1 · ไม่เพิ่มช่อง (เนื้อสัญญาเป็นข้อความคงที่ ห้ามแก้ถ้อยคำ)
fidelity: { one_to_one: true, add_fields: [], merge_split: [] }

# G6 ลายเซ็น — แถวล่าง 1 ช่องต่อขั้น DOA + ช่องคู่สัญญาฝั่งลูกค้า (ผู้รับมอบ) เป็นช่องเซ็นบนกระดาษ ไม่ใช่ขั้นในระบบ
signature: { layout: row-bottom, per_doa_step: true, handwriting_image: false }

# G7 ไม่อนุมัติ / ยกเลิก — unattended-policy: กลับเป็นร่างเลขเดิม
reject_cancel: { on_reject: back_to_draft, cancel_by: [owner, admin_role], cancel_states: [draft, pending], reason_required: true }

# G8 การมองเห็น
visibility: { owner: true, approver: after_submit, admin_role: all }

# G9 เลขที่ — ไม่ใช่เอกสารการเงินที่ต้อง no-gap → ออกตอนบันทึกครั้งแรก
# กระดาษพิมพ์เลข 0001-2026 อยู่แล้ว (running 4 หลัก - ปี) · รหัสย่อจากชื่อเอกสาร "หนังสือสัญญายืม" (Loan Agreement)
numbering: { issue_on: first_save, code: "LOA" }

# G10 ของเสริม — แนบไฟล์ ✓ · CSV ✓ · ทำซ้ำ ✗ · ประกาศ ✗
extras: { attachments: true, copy: false, export_csv: true, announce: false }
