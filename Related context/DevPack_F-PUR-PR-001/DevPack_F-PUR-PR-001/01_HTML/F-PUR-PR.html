<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PR ใบขอซื้อ — CUBE 4.0 Purchase</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">
<style>
:root{
  --c-navy:#111111; --c-navy-2:#111111; --c-primary:#FF3B30; --c-primary-hover:#E62E24;
  --c-teal:#FF9A1F; --c-teal-light:#FFB763; --c-ink:#111111; --c-mute:#54565C;
  --c-mute-2:#73757B; --c-mute-3:#9A9CA2; --c-line:#DEDAD4; --c-line-2:#E9E5E0;
  --c-line-3:#F1EEEA; --c-bg-off:#FAF8F5; --c-success:#1F9D55; --c-warning:#E8870F; --c-danger:#E62E24;
  --sidebar-w:232px; --shell-h:52px;
  --fs-h1:22px; --fs-h2:17px; --fs-h3:15px; --fs-body:14px;
  --fs-sub:13px; --fs-meta:12px; --fs-cap:11px; --fs-kpi:28px;
  --sp-xs:4px; --sp-sm:8px; --sp-md:12px; --sp-lg:20px; --sp-xl:28px;
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px; --r-full:999px;
  --c-primary-08:rgba(255,59,48,.08); --c-primary-12:rgba(255,59,48,.14); --c-teal-08:rgba(255,154,31,.10);
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:rgba(17,17,17,.16) transparent}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(17,17,17,.14);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:rgba(17,17,17,.26)}
.sidebar{scrollbar-color:rgba(255,255,255,.28) transparent}
.sidebar ::-webkit-scrollbar-thumb,.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.28)}
.sidebar ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.42)}
html,body{margin:0;padding:0}
body{font-family:'Satoshi','Noto Sans Thai',system-ui,-apple-system,sans-serif;font-size:var(--fs-body);
  line-height:1.5;background:var(--c-bg-off);color:var(--c-ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,p,dl,dd,dt{margin:0}
button{font-family:inherit}
.tabular,.num,.tbl-mono{font-variant-numeric:tabular-nums}

/* ── sidebar ─────────────────────────────── */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);background:#111;z-index:20;
  border-right:1px solid rgba(255,255,255,.06);overflow-y:auto;display:flex;flex-direction:column}
.sb-brand{display:flex;align-items:center;gap:10px;padding:0 16px;height:var(--shell-h);flex:0 0 auto;
  border-bottom:1px solid rgba(255,255,255,.06)}
.sb-logo{width:26px;height:26px;border-radius:var(--r-sm);background:linear-gradient(135deg,var(--c-primary),var(--c-teal));
  display:grid;place-items:center;color:#fff;font-weight:900;font-size:13px}
.sb-name{color:#fff;font-weight:700;font-size:var(--fs-sub);letter-spacing:.02em}
.sb-group{padding:14px 12px 4px;color:rgba(255,255,255,.38);font-size:var(--fs-cap);font-weight:700;
  letter-spacing:.08em;text-transform:uppercase}
.sb-item{display:flex;align-items:center;gap:10px;margin:1px 8px;padding:8px 10px;border-radius:var(--r-md);
  color:rgba(255,255,255,.62);font-size:var(--fs-sub);cursor:pointer;text-decoration:none;position:relative}
.sb-item:hover{color:#fff;background:rgba(255,255,255,.05)}
.sb-item.active{color:#fff;background:rgba(255,255,255,.08)}
.sb-item.active::before{content:"";position:absolute;left:-8px;top:6px;bottom:6px;width:3px;
  border-radius:0 3px 3px 0;background:var(--c-primary)}
.sb-item.active .lu{color:var(--c-primary)}
.sb-item .lu{width:16px;height:16px;flex:0 0 auto}

/* ── shell bar ───────────────────────────── */
.shell{margin-left:var(--sidebar-w)}
.shell-bar{position:sticky;top:0;z-index:19;height:var(--shell-h);background:#fff;
  border-bottom:1px solid var(--c-line-2);display:flex;align-items:center;gap:12px;padding:0 22px}
.crumb{display:flex;align-items:center;gap:6px;font-size:var(--fs-sub);color:var(--c-mute-2)}
.crumb b{color:var(--c-ink);font-weight:600}
.shell-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.icon-btn{width:32px;height:32px;border-radius:var(--r-sm);border:1px solid var(--c-line-2);background:#fff;
  display:grid;place-items:center;cursor:pointer;color:var(--c-mute)}
.icon-btn:hover{background:var(--c-line-3);color:var(--c-ink)}
.avatar{width:28px;height:28px;border-radius:var(--r-full);background:var(--c-line-3);color:var(--c-mute);
  display:grid;place-items:center;font-size:var(--fs-meta);font-weight:700;flex:0 0 auto;overflow:hidden}
.avatar.p{background:var(--c-primary-08);color:var(--c-primary)}
.content{padding:22px}

/* ── page header ─────────────────────────── */
.ph{display:flex;align-items:flex-start;gap:16px;margin-bottom:16px}
.ph h1{font-size:var(--fs-h1);font-weight:700;color:var(--c-navy);letter-spacing:-.01em}
.ph h1 span{font-size:var(--fs-sub);font-weight:500;color:var(--c-mute-3)}
.ph-sub{font-size:var(--fs-sub);color:var(--c-mute);margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ph-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:var(--r-full);
  background:var(--c-line-3);color:var(--c-mute-2);font-size:var(--fs-cap);font-weight:600}

/* ── buttons ─────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 14px;
  border-radius:var(--r-md);border:1px solid transparent;font-size:var(--fs-sub);font-weight:600;
  cursor:pointer;background:#fff;color:var(--c-ink);white-space:nowrap}
.btn .lu{width:16px;height:16px}
.btn.sm{height:30px;padding:0 10px;font-size:var(--fs-meta)}
.btn.sm .lu{width:14px;height:14px}
.btn-primary{background:var(--c-primary);color:#fff}
.btn-primary:hover{background:var(--c-primary-hover);box-shadow:0 2px 8px rgba(255,59,48,.30)}
.btn-primary:disabled{background:var(--c-mute-3);cursor:not-allowed;box-shadow:none}
.btn-secondary{border-color:var(--c-line);background:#fff;color:var(--c-ink)}
.btn-secondary:hover{background:var(--c-line-3)}
.btn-ghost{background:transparent;color:var(--c-mute)}
.btn-ghost:hover{background:var(--c-line-3);color:var(--c-ink)}
.btn-success{background:var(--c-success);color:#fff}
.btn-success:hover{filter:brightness(.94)}
.btn-link{background:transparent;border:0;color:var(--c-mute);padding:0 8px}
.btn-link.danger{color:var(--c-danger)}
.btn-link:hover{text-decoration:underline}
.top-icon-btn{width:32px;height:32px;border-radius:var(--r-sm);border:1px solid var(--c-line-2);background:#fff;
  display:grid;place-items:center;cursor:pointer;color:var(--c-mute);flex:0 0 auto}
.top-icon-btn:hover{background:var(--c-line-3);color:var(--c-ink)}
.top-icon-btn .lu{width:15px;height:15px}
.divider-v{width:1px;height:22px;background:var(--c-line-2);margin:0 4px}

/* ── card / form ─────────────────────────── */
.card{background:#fff;border:1px solid var(--c-line-2);border-radius:var(--r-lg);overflow:hidden}
.card+.card{margin-top:14px}
.card-head{display:flex;align-items:center;gap:8px;padding:12px 18px;border-bottom:1px solid var(--c-line-2);
  font-size:var(--fs-h3);font-weight:600}
.card-head .lu{width:16px;height:16px;color:var(--c-mute-2)}
.card-head .hint{margin-left:auto;font-size:var(--fs-cap);color:var(--c-mute-3);font-weight:500}
.card-body{padding:12px 18px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.field{display:flex;flex-direction:column;gap:5px}
.field.full{grid-column:1/-1}
.lbl{font-size:var(--fs-meta);font-weight:600;color:var(--c-mute-2)}
.lbl .req{color:var(--c-primary)}
.input,.select,textarea.input{width:100%;height:36px;border:1px solid var(--c-line);border-radius:var(--r-md);
  padding:0 10px;font-size:var(--fs-sub);font-family:inherit;background:#fff;color:var(--c-ink);outline:none}
textarea.input{height:auto;padding:8px 10px;resize:vertical;line-height:1.5}
.input:focus,.select:focus{border-color:var(--c-primary);box-shadow:0 0 0 3px var(--c-primary-08)}
.input.err,.select.err{border-color:var(--c-danger);background:#FFF7F6}
.input:disabled{background:var(--c-line-3);color:var(--c-mute-3);cursor:not-allowed}
.field-help{font-size:var(--fs-cap);color:var(--c-mute-3)}
.field-help.err{color:var(--c-danger)}
.num{text-align:right}
</style>
<style>
/* ── table ───────────────────────────────── */
.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-sub)}
.tbl th{text-align:left;font-size:var(--fs-cap);font-weight:700;color:var(--c-mute-2);text-transform:uppercase;
  letter-spacing:.05em;padding:10px 12px;border-bottom:1px solid var(--c-line-2);background:#fff;white-space:nowrap}
.tbl td{padding:11px 12px;border-bottom:1px solid var(--c-line-3);vertical-align:middle}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover{background:var(--c-line-3)}
.tbl-mono{font-variant-numeric:tabular-nums;font-weight:600;color:var(--c-primary)}
.tbl .r{text-align:right}
.tbl .c{text-align:center}
.sortable{cursor:pointer;user-select:none}
.sortable .lu{width:12px;height:12px;vertical-align:-1px;opacity:.5}
.tbl-foot{display:flex;align-items:center;gap:10px;padding:10px 18px;border-top:1px solid var(--c-line-2);
  font-size:var(--fs-meta);color:var(--c-mute-2)}
.tbl-foot .right{margin-left:auto;display:flex;align-items:center;gap:4px}
.pg{min-width:28px;height:28px;border-radius:var(--r-sm);border:1px solid var(--c-line-2);background:#fff;
  font-size:var(--fs-meta);cursor:pointer;color:var(--c-mute)}
.pg.on{background:var(--c-primary);border-color:var(--c-primary);color:#fff;font-weight:700}

/* ── pills ───────────────────────────────── */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:var(--r-full);
  font-size:var(--fs-cap);font-weight:600;white-space:nowrap}
.pill .dot{width:5px;height:5px;border-radius:var(--r-full);background:currentColor}
.pill.info{background:#E6F0FF;color:#1A5FCC}
.pill.ok{background:#E4F4EB;color:#157A41}
.pill.warn{background:#FFF1DD;color:#B8690B}
.pill.mute{background:#F1EEEA;color:#73757B}
.pill.bad{background:#FFE9E7;color:#E62E24}
.pill.teal{background:var(--c-teal-08);color:#B8690B}
.sign-prog{display:flex;align-items:center;gap:7px;font-size:var(--fs-cap);color:var(--c-mute-2);font-weight:600}
.sign-bar{width:46px;height:4px;border-radius:var(--r-full);background:var(--c-line-2);overflow:hidden}
.sign-bar i{display:block;height:100%;background:var(--c-success)}
.emp-chip{display:inline-flex;align-items:center;gap:7px}
.emp-chip .meta{display:flex;flex-direction:column;line-height:1.25}
.emp-chip .nm{font-size:var(--fs-sub);font-weight:600;color:var(--c-ink)}
.emp-chip .po{font-size:var(--fs-cap);color:var(--c-mute-3)}

/* ── empty / loading / error ─────────────── */
.state{display:flex;flex-direction:column;align-items:center;gap:10px;padding:56px 20px;text-align:center}
.state .circle{width:56px;height:56px;border-radius:var(--r-full);display:grid;place-items:center;background:var(--c-line-3);color:var(--c-mute-3)}
.state .circle .lu{width:26px;height:26px}
.state h3{font-size:var(--fs-h3);font-weight:600}
.state p{font-size:var(--fs-sub);color:var(--c-mute-2);max-width:380px}
.state.err .circle{background:#FFE9E7;color:var(--c-danger)}
.skel{height:14px;border-radius:var(--r-xs);background:linear-gradient(90deg,var(--c-line-3),var(--c-line-2),var(--c-line-3));
  background-size:200% 100%;animation:sk 1.2s ease infinite}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ── drawer ──────────────────────────────── */
.backdrop{position:fixed;inset:0;background:rgba(17,17,17,.40);z-index:50;opacity:0;transition:opacity 220ms}
.backdrop.on{opacity:1}
.drawer-panel{position:fixed;top:0;right:0;bottom:0;width:920px;max-width:96vw;background:#fff;z-index:51;
  box-shadow:-16px 0 40px rgba(17,17,17,.18);display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform 280ms cubic-bezier(.4,0,.2,1)}
.drawer-panel.on{transform:translateX(0)}
.drawer-panel.wide{width:1290px}
.dw-head{padding:18px 24px 12px;border-bottom:1px solid var(--c-line-2);flex:0 0 auto}
.dw-head.create{padding:18px 24px 16px}
.eyebrow{display:flex;align-items:center;gap:6px;font-size:var(--fs-cap);font-weight:700;color:var(--c-mute-3);
  text-transform:uppercase;letter-spacing:.08em}
.eyebrow .lu{width:13px;height:13px}
.dw-title{display:flex;align-items:center;gap:10px;margin-top:6px;flex-wrap:wrap}
.dw-title h2{font-size:20px;font-weight:700}
.dw-actions{margin-left:auto;display:flex;align-items:center;gap:6px}
.dw-sum{font-size:var(--fs-sub);color:var(--c-mute-2);margin-top:6px}
.dw-body{flex:1;overflow-y:auto;padding:20px 24px}
.dw-body.create{padding:22px 24px}
.dw-foot{padding:14px 24px;border-top:1px solid var(--c-line-2);background:var(--c-bg-off);display:flex;
  align-items:center;gap:8px;flex:0 0 auto}
.dw-foot .right{margin-left:auto;display:flex;gap:8px}
.dw-foot-note{padding:12px 24px;border-top:1px solid var(--c-line-2);background:var(--c-bg-off);
  font-size:var(--fs-cap);color:var(--c-mute-3);display:flex;align-items:center;gap:8px;flex:0 0 auto}

/* ── stepper ─────────────────────────────── */
.stepper{display:flex;align-items:center;margin-top:18px;gap:0}
.step-i{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.step-i .no{width:26px;height:26px;border-radius:var(--r-full);display:grid;place-items:center;
  font-size:var(--fs-meta);font-weight:700;background:var(--c-line-3);color:var(--c-mute-3);flex:0 0 auto}
.step-i .tx{font-size:var(--fs-meta);font-weight:600;color:var(--c-mute-3);white-space:nowrap}
.step-i.done .no{background:var(--c-success);color:#fff;cursor:pointer}
.step-i.done .tx{color:var(--c-mute);cursor:pointer}
.step-i.active .no{background:var(--c-primary);color:#fff}
.step-i.active .tx{color:var(--c-ink)}
.step-line{flex:1 1 auto;height:1px;background:var(--c-line-2);margin:0 10px;min-width:12px}

/* ── step header ─────────────────────────── */
.steph{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.steph .ic{width:32px;height:32px;border-radius:var(--r-md);background:var(--c-primary-08);color:var(--c-primary);
  display:grid;place-items:center;flex:0 0 auto}
.steph .ic .lu{width:16px;height:16px}
.steph h3{font-size:var(--fs-h3);font-weight:600}
.steph .hint{font-size:11.5px;color:var(--c-mute-3);margin-top:2px}
.tile-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:1px solid var(--c-line);border-radius:var(--r-lg);padding:16px;cursor:pointer;background:#fff;
  display:flex;gap:12px;align-items:flex-start;text-align:left}
.tile:hover{border-color:var(--c-primary);background:var(--c-primary-08)}
.tile.on{border-color:var(--c-primary);background:var(--c-primary-08);box-shadow:0 0 0 3px var(--c-primary-08)}
.tile .ic{width:34px;height:34px;border-radius:var(--r-md);background:var(--c-line-3);color:var(--c-mute);
  display:grid;place-items:center;flex:0 0 auto}
.tile.on .ic{background:var(--c-primary);color:#fff}
.tile b{font-size:var(--fs-sub);display:block}
.tile span{font-size:var(--fs-cap);color:var(--c-mute-2)}
</style>
<style>
/* ── B2 v2 line editor ───────────────────── */
.line-tbl{font-size:12.5px}
.line-tbl th,.line-tbl td{padding-left:6px;padding-right:6px}
.line-tbl td{padding-top:6px;padding-bottom:6px;vertical-align:middle}
.line-tbl .input,.line-tbl .select{height:30px;font-size:12.5px;padding:0 8px}
.line-tbl tbody tr{cursor:default}
.line-tbl tbody tr:hover{background:transparent}
.line-tbl tr.expanded{background:var(--c-primary-08)}
.free-row{background:var(--c-teal-08)}
.item-combo{position:relative}
.item-combo .input{height:32px;padding:0 10px}
.combo-pop{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:70;background:#fff;
  border:1px solid var(--c-line-2);border-radius:var(--r-md);box-shadow:0 12px 32px rgba(17,17,17,.12);
  max-height:230px;overflow-y:auto;padding:4px}
.combo-pop.up{top:auto;bottom:calc(100% + 4px)}
.combo-opt{padding:7px 9px;border-radius:var(--r-sm);cursor:pointer;font-size:12.5px;display:flex;gap:8px;align-items:center}
.combo-opt:hover,.combo-opt.hi{background:var(--c-primary-08)}
.combo-opt mark{background:#FFF1DD;color:inherit;padding:0}
.combo-opt .sub{margin-left:auto;font-size:var(--fs-cap);color:var(--c-mute-3)}
.combo-empty{padding:10px;font-size:var(--fs-meta);color:var(--c-mute-3);text-align:center}
.line-expand-panel-anchor{background:var(--c-primary-08)}
.line-expand-panel-anchor>td{padding:0 16px 10px 44px !important}
.line-expand-panel-inner{background:#fff;border:1px solid var(--c-primary-12);border-radius:var(--r-md);
  padding:10px 12px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-size:12px;
  animation:line-expand-slide 220ms ease}
.line-collapse-panel .line-expand-panel-inner{animation:line-collapse-slide 200ms ease forwards}
@keyframes line-expand-slide{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
@keyframes line-collapse-slide{to{opacity:0;transform:translateY(-4px)}}
.seg{display:inline-flex;background:var(--c-bg-off);border:1px solid var(--c-line-2);border-radius:var(--r-md);padding:2px}
.seg button{border:0;background:transparent;border-radius:var(--r-sm);padding:4px 9px;font-size:11.5px;
  font-weight:600;color:var(--c-mute-2);cursor:pointer}
.seg button.on{background:var(--c-primary);color:#fff}
.divider-s{width:1px;height:22px;background:var(--c-line-2)}
.hard-warn{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--c-warning);
  background:#FFF9EF;border-radius:var(--r-md);padding:10px 12px;font-size:var(--fs-meta);color:#8A5A08;margin-bottom:12px}
.hard-warn .lu{width:16px;height:16px;flex:0 0 auto;color:var(--c-warning)}
.note-box{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--c-line-2);
  background:var(--c-bg-off);border-radius:var(--r-md);padding:10px 12px;font-size:var(--fs-meta);color:var(--c-mute);margin-bottom:12px}
.note-box.warn{border-color:var(--c-warning);background:#FFF9EF;color:#8A5A08}
.note-box.danger{border-color:var(--c-danger);background:#FFF6F5;color:var(--c-danger)}
.note-box .lu{width:16px;height:16px;flex:0 0 auto}
.section-row{display:flex;align-items:center;gap:10px;padding:12px 18px}
.section-row .tt{font-size:var(--fs-sub);font-weight:600}
.section-row .lu{width:16px;height:16px;color:var(--c-mute-2)}
.toggle{margin-left:auto;width:38px;height:21px;border-radius:var(--r-full);background:var(--c-line-2);
  position:relative;cursor:pointer;border:0;flex:0 0 auto}
.toggle .toggle-slider{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:var(--r-full);
  background:#fff;transition:left 160ms;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--c-success)}
.toggle.on .toggle-slider{left:19px}
.sum-tbl{width:100%;font-size:13px;border-collapse:collapse}
.sum-tbl td{padding:4px 0}
.sum-tbl td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.sum-tbl tr.sep td{border-top:1px solid var(--c-line-2);padding-top:8px}

<script>
/* ── VAT / discount engine — single source of truth ──────────────── */
function migrateLine(l){
  if(l.vat_mode==null){ l.vat_mode = l.net_enabled?'included' : (l.vat_enabled?'add':'none'); }
  if(l.vat_pct==null) l.vat_pct=7;
  if(l.discount_mode==null) l.discount_mode='percent';
  if(l.discount_amt==null) l.discount_amt=0;
  return l;
}
function calcLineVat(l){
  migrateLine(l);
  const gross=(Number(l.qty)||0)*(Number(l.unit_price)||0);
  let disc = l.discount_mode==='amount' ? Math.min(Number(l.discount_amt)||0,gross) : gross*((Number(l.discount_pct)||0)/100);
  const net=Math.max(0,gross-disc);
  const p=(Number(l.vat_pct)||0)/100;
  let vat=0,total=net,before=net;
  if(l.vat_mode==='add'){ vat=net*p; total=net+vat; before=net; }
  else if(l.vat_mode==='included'){ vat=net*p/(1+p); total=net; before=net-vat; }
  return {gross:gross,disc:disc,net:net,before:before,vat:vat,total:total};
}
function totals(doc){
  let before=0,vat=0;
  (doc.lines||[]).forEach(l=>{ if(l.is_free) return; const c=calcLineVat(l); before+=c.before; vat+=c.vat; });
  const after=before+vat;
  const eb=doc.endbill||{enabled:false,mode:'amount',value:0,src:''};
  const ebAmt=!eb.enabled?0:(eb.mode==='percent'?after*((Number(eb.value)||0)/100):Math.min(Number(eb.value)||0,after));
  const wht=doc.wht&&doc.wht.enabled?before*((Number(doc.wht.pct)||0)/100):0;
  const grand=Math.max(0,after-ebAmt);
  return {before:before,vat:vat,after:after,ebAmt:ebAmt,wht:wht,grand:grand,net_pay:Math.max(0,grand-wht)};
}
function createBlankLine(){ return {id:'L'+Date.now()+Math.floor(Math.random()*999),item_code:'',item_name:'',
  qty:1,unit:'-',unit_price:0,discount_pct:0,discount_mode:'percent',discount_amt:0,
  vat_mode:'none',vat_pct:7,note:'',cost_center:'',is_free:false}; }

/* ── seed data (append-only audit) ───────────────────────────────── */
function mkLine(code,qty,unitIdx,over){ const it=MOCK_ITEMS.find(i=>i.code===code); const u=it.units[unitIdx||0];
  const l=createBlankLine(); l.item_code=it.code; l.item_name=it.name; l.qty=qty; l.unit=u.uom;
  l.unit_price=u.price; l.vat_mode=it.vat_group==='VAT7'?'add':'none'; return Object.assign(l,over||{}); }

<script>

<script>

        ' onfocus="openCombo(\''+l.id+'\')" oninput="createWizard.combo.q=this.value;createWizard.combo.hi=0;updateLine()"'+

          units.map(u=>'<option value="'+esc(u.uom)+'"'+(l.unit===u.uom?' selected':'')+'>'+esc(u.uom)+'</option>').join('')+'</select>'

<script>

function lineById(id){ return createWizard.doc.lines.find(l=>l.id===id); }
function addLine(){ createWizard.doc.lines.push(createBlankLine()); render(); }
function removeLine(idx){ const d=createWizard.doc;
  if(d.lines.length<=1){ d.lines=[createBlankLine()]; toast('ต้องมีอย่างน้อย 1 รายการ — ล้างรายการให้แทน','bad'); }
  else d.lines.splice(idx,1);

function setLine(id,k,v){ const l=lineById(id); if(!l) return; l[k]=v; updateLine(); }
function setLineUnit(id,uom){ const l=lineById(id); const it=MOCK_ITEMS.find(x=>x.code===l.item_code);
  l.unit=uom; if(it){ const u=it.units.find(x=>x.uom===uom); if(u) l.unit_price=u.price; } updateLine(); }
function applyItemToLine(id,code){ const l=lineById(id),it=MOCK_ITEMS.find(x=>x.code===code); if(!l||!it) return;
  const u=it.units.find(x=>x.is_default)||it.units[0];
  l.item_code=it.code; l.item_name=it.name; l.unit=u.uom; l.unit_price=u.price;
  l.vat_mode=it.vat_group==='VAT7'?'add':'none'; l.vat_pct=7;
  closeCombo(); render(); }
function useFreeText(id){ const l=lineById(id); const q=createWizard.combo.q.trim();
  if(!q){ toast('พิมพ์ชื่อรายการก่อน','bad'); return; }
  l.item_code=''; l.item_name=q; if(!l.unit||l.unit==='-') l.unit='หน่วย';
  closeCombo(); render(); toast('บันทึกเป็นรายการนอกทะเบียน — ฝ่ายจัดซื้อจะช่วยจับคู่ภายหลัง'); }
function focusCombo(id,caretEnd){
  const el=document.querySelector('.item-combo[data-line-id="'+id+'"] input');
  if(!el) return; el.focus();
  try{ const p2=caretEnd==null?el.value.length:caretEnd; el.setSelectionRange(p2,p2); }catch(e){}
}
function openCombo(id){ const l=lineById(id);
  if(createWizard.combo.lineId===id) return;
  createWizard.combo={lineId:id,q:l.item_code?l.item_code+' — '+l.item_name:(l.item_name||''),hi:0};
  render(); focusCombo(id); }
function scheduleCloseCombo(){ setTimeout(function(){ const a=document.activeElement;
  if(a&&a.closest&&a.closest('.item-combo')) return; closeCombo(); },140); }
function closeCombo(){ if(!createWizard) return; if(createWizard.combo.lineId===null) return;
  createWizard.combo={lineId:null,q:'',hi:0}; render(); }
function comboList(){ const q=createWizard.combo.q.trim().toLowerCase();
  return MOCK_ITEMS.filter(x=>!q||(x.code+' '+x.name).toLowerCase().includes(q)); }
function onItemKey(ev,id){ const c=createWizard.combo,list=comboList();
  if(ev.key==='ArrowDown'){ ev.preventDefault(); c.hi=Math.min(c.hi+1,Math.max(0,list.length-1)); updateLine(); }
  else if(ev.key==='ArrowUp'){ ev.preventDefault(); c.hi=Math.max(0,c.hi-1); updateLine(); }
  else if(ev.key==='Enter'){ ev.preventDefault(); if(list[c.hi]) applyItemToLine(id,list[c.hi].code); else useFreeText(id); }
  else if(ev.key==='Escape'){ ev.preventDefault(); ev.stopPropagation(); closeCombo(); } }
function toggleLineExpand(id){ createWizard.expandedLineId=createWizard.expandedLineId===id?null:id; render(); }
/* updateLine — render ทั้ง drawer แล้วคืน focus + caret ให้ input ที่พิมพ์อยู่ (ล็อกตาม B2) */
function updateLine(){
  const a=document.activeElement; let sel=null,pos=null;
  if(a&&a.tagName==='INPUT'){ pos=a.selectionStart;
    const row=a.closest('tr'); const combo=a.closest('.item-combo');
    sel={lineId:combo?combo.getAttribute('data-line-id'):(row?row.getAttribute('data-line-id'):null),
         idx:row?Array.prototype.indexOf.call(row.parentNode.children,row):-1,
         cell:a.closest('td')?Array.prototype.indexOf.call(a.closest('td').parentNode.children,a.closest('td')):-1,
         combo:!!combo}; }
  render();
  if(sel&&sel.combo&&sel.lineId){ focusCombo(sel.lineId,pos); return; }
  if(sel&&sel.idx>=0){
    const tb=document.querySelector('.line-tbl tbody');
    if(tb&&tb.children[sel.idx]){
      const td=tb.children[sel.idx].children[sel.cell];
      const inp=td?td.querySelector('input'):null;
      if(inp){ inp.focus(); try{ if(pos!=null&&inp.type!=='number') inp.setSelectionRange(pos,pos); }catch(e){} }
    }
  }
}

  const tier=resolveDoa(t.grand);
  const kv=(k,v)=>'<div><dt>'+esc(k)+'</dt><dd>'+v+'</dd></div>';
  return STEPH('check-circle-2','ตรวจสอบและยืนยัน','ตรวจความถูกต้องก่อนบันทึกร่างหรือส่งเข้าสายอนุมัติ — เลขที่เอกสารจะออกให้อัตโนมัติเมื่อส่งอนุมัติ')+
   (!bc.ok?'<div class="hard-warn"><i data-lucide="triangle-alert" class="lu"></i><div><b>งบประมาณคงเหลือไม่พอ (ผลตรวจจำลอง)</b><br>'+
     'ศูนย์ต้นทุน '+esc(bc.budget_code)+' คงเหลือ ฿'+money(bc.remaining)+' · ใบนี้ ฿'+money(t.grand)+' — ระบบยังให้ส่งอนุมัติได้ และจะแสดงคำเตือนนี้ให้ผู้อนุมัติเห็น</div></div>':'')+
   '<div class="card"><div class="card-head"><i data-lucide="info" class="lu"></i>ข้อมูลใบขอซื้อ</div><div class="card-body">'+
     '<dl class="kv">'+
       kv('เลขที่เอกสาร','<span class="tbl-mono">'+(d.code||'ออกอัตโนมัติเมื่อส่งอนุมัติ')+'</span>')+
       kv('ประเภทการขอซื้อ',esc(PR_TYPE[d.pr_type]))+
       kv('วันที่เอกสาร',fmtDate(d.docDate))+
       kv('วันที่ต้องการใช้',fmtDate(d.requiredDate))+
       kv('ผู้ขอซื้อ',empChip(d.requester))+
       kv('หน่วยงาน',esc(d.department||'—'))+
       kv('ศูนย์ต้นทุนหลัก',esc(d.cost_center||'— ไม่ระบุ —'))+
       kv('เอกสารอ้างอิง',esc(d.ref||'—'))+
       '<div style="grid-column:1/-1"><dt>เหตุผลการขอซื้อ</dt><dd>'+esc(d.reason||'—')+'</dd></div>'+
       '<div style="grid-column:1/-1"><dt>ผู้ขายที่แนะนำ</dt><dd>'+
         ((d.vendorSuggest||[]).length?d.vendorSuggest.map(v=>'<span class="pill teal" style="margin-right:5px">'+esc((MOCK_VENDORS.find(x=>x.code===v)||{}).name||v)+'</span>').join(''):'— ไม่ระบุ —')+'</dd></div>'+
     '</dl></div></div>'+
   '<div class="card"><div class="card-head"><i data-lucide="git-branch" class="lu"></i>สายอนุมัติที่ระบบจะใช้'+
     '<span class="hint">อ้างอิงทะเบียน DOA กลาง <span class="kbd">'+esc(tier.doa_entry_ref)+'</span></span></div><div class="card-body">'+
     '<div style="font-size:var(--fs-meta);color:var(--c-mute-2);margin-bottom:8px">ยอดสุทธิ ฿'+money(t.grand)+
       ' → สายอนุมัติ '+tier.steps.length+' ขั้น (แบบเรียงลำดับ) — เลือกผู้อนุมัติรายบุคคลตอนกดส่งอนุมัติ</div>'+
     tier.steps.map((s,i)=>'<div class="slot-row"><div class="sn">'+(i+1)+'</div><div style="font-size:var(--fs-sub);font-weight:600">'+esc(s.label)+'</div>'+
       '<div style="font-size:var(--fs-meta);color:var(--c-mute-3)">เลือกผู้อนุมัติในขั้นตอนถัดไป</div></div>').join('')+
   '</div></div>'+
   '<div class="card"><div class="card-head"><i data-lucide="list" class="lu"></i>รายการที่ขอซื้อ ('+d.lines.length+')</div>'+
     '<div class="card-body" style="padding:0 12px 12px">'+linesTableView(d)+'</div></div>'+
   '<div class="card"><div class="card-head"><i data-lucide="paperclip" class="lu"></i>เอกสารแนบ ('+d.attachments.length+' ไฟล์)</div><div class="card-body">'+
     (d.attachments.length?d.attachments.map(f=>'<div class="file-card"><i data-lucide="file-text" class="lu"></i><span>'+esc(f.name)+'</span><span class="sz">'+esc(f.size)+'</span></div>').join('')
      :'<div style="font-size:var(--fs-sub);color:var(--c-mute-3)">ไม่มีเอกสารแนบ</div>')+'</div></div>';
}
</script>
<script>
/* ── wizard shell + validation ───────────────────────────────────── */
function renderCreateDrawer(){
  const w=createWizard,d=w.doc;
  const bodies=[renderStep1,renderStep2,renderStep3,renderStep4,renderStep5];
  return '<div class="backdrop on" onclick="tryCloseWizard()"></div>'+
  '<div class="drawer-panel wide on" role="dialog" aria-modal="true">'+
    '<div class="dw-head create">'+
      '<div class="eyebrow"><i data-lucide="'+(w.mode==='edit'?'pencil':'file-plus')+'" class="lu"></i>'+(w.mode==='edit'?'แก้ไขเอกสาร':'สร้างเอกสารใหม่')+'</div>'+
      '<div class="dw-title"><h2>'+(w.mode==='edit'?'แก้ไขใบขอซื้อ '+esc(d.code||'(ร่าง)'):'สร้างใบขอซื้อใหม่')+'</h2>'+
        '<div class="dw-actions"><button class="top-icon-btn" onclick="tryCloseWizard()" title="ปิด (Esc)"><i data-lucide="x" class="lu"></i></button></div></div>'+
      '<div class="stepper">'+STEP_NAMES.map((_,i)=>stepItem(i)).join('')+'</div>'+
    '</div>'+
    '<div class="dw-body create">'+bodies[w.step-1]()+'</div>'+
    '<div class="dw-foot">'+
      (w.step>1?'<button class="btn btn-secondary" onclick="wizardBack()"><i data-lucide="arrow-left" class="lu"></i>ย้อนกลับ</button>':'')+
      '<div class="right"><button class="btn btn-ghost" onclick="tryCloseWizard()">ยกเลิก</button>'+
      (w.step<5
        ? '<button class="btn btn-primary" onclick="wizardNext()">ถัดไป<i data-lucide="arrow-right" class="lu"></i></button>'
        : '<button class="btn btn-secondary" onclick="saveDraft()"><i data-lucide="save" class="lu"></i>บันทึกแบบร่าง</button>'+
          '<button class="btn btn-primary" onclick="openSubmitModal()"><i data-lucide="send" class="lu"></i>บันทึกและส่งอนุมัติ</button>')+
      '</div></div>'+
  '</div>';
}
function wizardBack(){ if(createWizard.step>1){ createWizard.step--; render(); } }
function wizardNext(){
  const w=createWizard,d=w.doc;
  if(w.step===1){ if(!w.source){ toast('กรุณาเลือกแหล่งที่มาก่อน','bad'); return; }
    if(w.source==='copy'&&!w.copyFrom){ toast('กรุณาเลือกใบขอซื้อต้นทาง','bad'); return; } }
  if(w.step===2){
    w.errs={};
    let bad=false;
    bad=markErr('department',!d.department)||bad;
    bad=markErr('docDate',!d.docDate)||bad;
    bad=markErr('requiredDate',!d.requiredDate||(d.docDate&&d.requiredDate<d.docDate))||bad;
    bad=markErr('reason',!String(d.reason||'').trim())||bad;
    if(bad){ render(); toast('กรุณากรอกข้อมูลให้ครบถ้วน','bad'); return; }
  }
  if(w.step===3){
    const real=d.lines.filter(l=>!l.is_free);
    const usable=real.filter(l=>(l.item_code||String(l.item_name||'').trim())&&(Number(l.qty)||0)>0&&(Number(l.unit_price)||0)>0);
    if(!usable.length){ toast('ต้องมีอย่างน้อย 1 รายการที่ระบุสินค้า จำนวน และราคาครบ','bad'); return; }
    const blank=real.filter(l=>!(l.item_code||String(l.item_name||'').trim()));
    if(blank.length){ toast('มีแถวว่าง '+blank.length+' แถว — กรุณาระบุรายการหรือลบแถวออก','bad'); return; }
    const seen={},dup=[];
    real.forEach(l=>{ const k=(l.item_code||l.item_name)+'|'+l.unit; if(seen[k]) dup.push(l.item_name); seen[k]=1; });
    if(dup.length){ toast('มีสินค้าและหน่วยซ้ำกัน: '+dup[0]+' — รวมเป็นแถวเดียว','bad'); return; }
  }
  createWizard.step++; render();
}
function tryCloseWizard(){
  const w=createWizard; if(!w) return;
  openModal({icon:'triangle-alert',tone:'d',title:'ปิดหน้าต่างโดยไม่บันทึก?',
    desc:'ข้อมูลที่กรอกไว้ในใบขอซื้อนี้จะหายไปทั้งหมด การกระทำนี้ย้อนกลับไม่ได้',
    ok:'ปิดโดยไม่บันทึก',okTone:'danger',onOk:function(){ closeModal(); createWizard=null; goList(); }});
}
function saveDraft(){
  const w=createWizard,d=w.doc;
  if(w.mode==='edit'){ const i=DOCS.findIndex(x=>x.id===d.id); pushAudit(d,'edit','แก้ไขแบบร่าง'); DOCS[i]=d; }
  else { d.id='pr'+Date.now(); d.status='draft'; d.approval_status='draft'; pushAudit(d,'create','สร้างแบบร่าง');
    d.createdBy=CUR_USER; d.createdAt=nowISO(); DOCS.unshift(d); }
  createWizard=null; goList(); setTimeout(()=>toast('บันทึกแบบร่างแล้ว — เลขที่จะออกเมื่อส่งอนุมัติ'),50);
}

/* ── SUBMIT MODAL — DOA slot picker (คนจริง · locked 2026-08-17) ─── */
let submitState=null;
function openSubmitModal(){
  const d=createWizard.doc,t=totals(d),tier=resolveDoa(t.grand);
  submitState={tier:tier,pick:tier.steps.map(s=>{ const c=SLOT_CANDIDATES[s.roles[0]]||[]; return c[0]||''; })};
  render();
}
function renderSubmitModal(){
  if(!submitState||!createWizard) return '';
  const d=createWizard.doc,t=totals(d),tier=submitState.tier,bc=budgetCheckMock(d.cost_center,t.grand);
  const rows=tier.steps.map((s,i)=>{
    const cands=SLOT_CANDIDATES[s.roles[0]]||[];
    const cur=submitState.pick[i];
    return '<div class="slot-row"><div class="sn">'+(i+1)+'</div>'+
      '<div><div style="font-size:var(--fs-sub);font-weight:600">'+esc(s.label)+'</div>'+
      '<div style="font-size:var(--fs-cap);color:var(--c-mute-3)">เลือกผู้อนุมัติรายบุคคล</div></div>'+
      '<div><select class="select" onchange="submitState.pick['+i+']=this.value;render()">'+
        '<option value="">— เลือกผู้อนุมัติ —</option>'+
        cands.map(id=>{const e=empById(id);return '<option value="'+id+'"'+(cur===id?' selected':'')+'>'+esc(e.name)+' — '+esc(e.position)+'</option>';}).join('')+
      '</select>'+(cur?'<div style="margin-top:6px">'+empChip(cur)+'</div>':'')+'</div></div>';
  }).join('');
  const ready=submitState.pick.every(p=>!!p);
  return '<div class="mbd" onclick="if(event.target===this)closeSubmitModal()"><div class="modal lg">'+
   '<div class="modal-h"><div class="ic p"><i data-lucide="send" class="lu"></i></div><div>'+
     '<h3>ส่งใบขอซื้อเข้าสายอนุมัติ</h3>'+
     '<p>ระบบเลือกสายอนุมัติจากทะเบียน DOA ตามยอดสุทธิของใบนี้ — เลือกผู้อนุมัติรายบุคคลให้ครบทุกขั้น</p></div></div>'+
   '<div class="modal-b">'+
     '<div class="note-box"><i data-lucide="info" class="lu"></i><div>ยอดสุทธิ <b>฿'+money(t.grand)+'</b> · สายอนุมัติ <span class="kbd">'+esc(tier.doa_entry_ref)+'</span> '+tier.steps.length+' ขั้น (เรียงลำดับ)<br>'+
       '<span style="color:var(--c-mute-3)">สายอนุมัติจะถูกบันทึกติดกับใบนี้ตอนส่ง — แก้ทะเบียน DOA ภายหลังไม่กระทบใบที่ส่งไปแล้ว</span></div></div>'+
     (!bc.ok?'<div class="note-box warn"><i data-lucide="triangle-alert" class="lu"></i><div>งบคงเหลือของ '+esc(bc.budget_code)+' ไม่พอ (ผลตรวจจำลอง) — ผู้อนุมัติจะเห็นคำเตือนนี้</div></div>':'')+
     rows+
   '</div>'+
   '<div class="modal-f"><button class="btn btn-ghost" onclick="closeSubmitModal()">ยกเลิก</button>'+
     '<button class="btn btn-primary" '+(ready?'':'disabled')+' onclick="doSubmit()"><i data-lucide="send" class="lu"></i>ส่งอนุมัติ</button></div>'+
   '</div></div>';
}
function closeSubmitModal(){ submitState=null; render(); }
function doSubmit(){
  const w=createWizard,d=w.doc,t=totals(d),tier=submitState.tier;
  d.approval_chain=tier.steps.map((s,i)=>({roles:s.roles,label:s.label,assignee:submitState.pick[i],status:'pending',at:null,note:''}));
  d.doa_entry_ref=tier.doa_entry_ref;
  d.status='pending_approval'; d.approval_status='pending_approval';
  if(!d.code) d.code=nextDocNo();          // ENG-DOC-NUM.next('PR') — ออกเลขตอนส่งอนุมัติเท่านั้น
  d.submittedBy=CUR_USER; d.submittedAt=nowISO();
  if(w.mode==='edit'){ const i=DOCS.findIndex(x=>x.id===d.id); pushAudit(d,'submit','ส่งเข้าสายอนุมัติ '+tier.doa_entry_ref); DOCS[i]=d; }
  else { d.id='pr'+Date.now(); d.createdBy=d.createdBy||CUR_USER; d.createdAt=d.createdAt||nowISO();
    pushAudit(d,'create','สร้างเอกสาร'); pushAudit(d,'submit','ส่งเข้าสายอนุมัติ '+tier.doa_entry_ref); DOCS.unshift(d); }
  const id=d.id; submitState=null; createWizard=null;
  goView(id);
  setTimeout(()=>{ toast('ส่งใบขอซื้อ '+d.code+' เข้าสายอนุมัติแล้ว');
    /* ENG-NOTIFY.emit('pr_submitted', {...}) — ห้ามเลือกช่องทางเอง */ },60);
}
</script>
<script>
/* ═══ SURFACE 3 — VIEW DRAWER (tabs ล็อกลำดับ) ════════════════════ */
const VIEW={open:false,id:null,tab:'detail'};
function openView(id){ VIEW.open=true; VIEW.id=id; if(!['detail','pdf','sign','history'].includes(VIEW.tab)) VIEW.tab='detail'; render(); }
function curDoc(){ return DOCS.find(d=>d.id===VIEW.id); }
function setTab(t){ VIEW.tab=t; render(); }
function canActStep(d){ const ch=d.approval_chain||[]; const i=ch.findIndex(s=>s.status==='pending');
  if(i<0) return -1; return ACT_AS.indexOf(ch[i].assignee)>=0?i:-1; }

function SEC(icon,title,inner){ return '<div class="sec"><div class="sec-h"><i data-lucide="'+icon+'" class="lu"></i>'+esc(title)+'</div>'+inner+'</div>'; }
function KV(pairs,cols){ return '<dl class="kv'+(cols?' c'+cols:'')+'">'+pairs.map(p=>'<div><dt>'+esc(p[0])+'</dt><dd>'+p[1]+'</dd></div>').join('')+'</dl>'; }

function renderDetailTab(d){
  const t=totals(d),bc=budgetCheckMock(d.cost_center,t.grand),s=signCount(d);
  let banners='';
  if(!bc.ok&&d.status!=='cancelled') banners+='<div class="hard-warn"><i data-lucide="triangle-alert" class="lu"></i><div><b>งบประมาณคงเหลือไม่พอ (ผลตรวจจำลอง)</b><br>ศูนย์ต้นทุน '+esc(bc.budget_code)+' คงเหลือ ฿'+money(bc.remaining)+' · ใบนี้ ฿'+money(t.grand)+'</div></div>';
  if(d.status==='rejected'){ const r=(d.approval_chain||[]).find(x=>x.status==='rejected');
    banners+='<div class="note-box danger"><i data-lucide="x-circle" class="lu"></i><div><b>ใบขอซื้อนี้ไม่ได้รับอนุมัติ</b><br>'+esc(r&&r.note?r.note:'—')+' — ทำสำเนาเพื่อแก้ไขแล้วส่งใหม่ได้</div></div>'; }
  if(d.status==='cancelled') banners+='<div class="note-box warn"><i data-lucide="ban" class="lu"></i><div><b>ใบขอซื้อนี้ถูกยกเลิกแล้ว</b><br>'+esc(d.cancelReason||'—')+'</div></div>';
  if(d.status==='pending_approval') banners+='<div class="note-box"><i data-lucide="lock" class="lu"></i><div>อยู่ระหว่างอนุมัติ — แก้ไขไม่ได้ หากต้องแก้ ให้กด “เรียกคืน” เพื่อนำกลับเป็นแบบร่างก่อน</div></div>';

  return banners+
   '<div class="secwrap" style="margin-bottom:16px">'+SEC('info','ข้อมูลเอกสาร',KV([
      ['เลขที่เอกสาร','<span class="tbl-mono">'+esc(d.code||'(ยังไม่ออกเลข)')+'</span>'],
      ['ประเภทการขอซื้อ',esc(PR_TYPE[d.pr_type]||'—')],
      ['วันที่เอกสาร',fmtDate(d.docDate)],
      ['วันที่ต้องการใช้',fmtDate(d.requiredDate)],
      ['ผู้ขอซื้อ',empChip(d.requester)],
      ['หน่วยงาน',esc(d.department||'—')]
   ]))+'</div>'+
   SEC('layers','สถานะ','<div class="kv c3"><div><dt>สถานะเอกสาร</dt><dd>'+docPill(d.status)+'</dd></div>'+
      '<div><dt>ประเภท</dt><dd><span class="pill mute">'+esc(PR_TYPE[d.pr_type])+'</span></dd></div>'+
      '<div><dt>ความคืบหน้าการอนุมัติ</dt><dd>'+(s.N?s.n+' / '+s.N+' ขั้น':'ยังไม่ส่งอนุมัติ')+
        '<div class="pgl"><i style="width:'+(s.N?Math.round(s.n/s.N*100):0)+'%"></i></div></dd></div></div>')+
   SEC('file-text','เอกสารอ้างอิงและเหตุผล',KV([
      ['อ้างอิงภายนอก',esc(d.ref||'—')],['ศูนย์ต้นทุนหลัก',esc(d.cost_center||'— ไม่ระบุ —')],
      ['เหตุผลการขอซื้อ',esc(d.reason||'—')],['หมายเหตุถึงฝ่ายจัดซื้อ',esc(d.note||'—')]
   ]))+
   SEC('user','ผู้ขายที่แนะนำ',(d.vendorSuggest||[]).length
      ? d.vendorSuggest.map(v=>{const x=MOCK_VENDORS.find(y=>y.code===v)||{};
          return '<span class="pill teal" style="margin-right:6px">'+esc(x.name||v)+' · '+esc(x.term||'')+'</span>';}).join('')
      : '<div style="font-size:var(--fs-sub);color:var(--c-mute-3)">ไม่ระบุ — ผู้ขายจริงตัดสินที่ขั้นเทียบราคาผู้ขาย</div>')+
   SEC('list','รายการที่ขอซื้อ ('+d.lines.length+')','<div style="overflow-x:auto">'+linesTableView(d)+'</div>')+
   SEC('paperclip','เอกสารแนบ ('+(d.attachments||[]).length+' ไฟล์ · Document Center)',
      (d.attachments||[]).length?d.attachments.map(f=>'<div class="file-card"><i data-lucide="file-text" class="lu"></i><span>'+esc(f.name)+'</span><span class="sz">'+esc(f.size)+'</span><button class="btn btn-ghost sm" onclick="toast(\'ดาวน์โหลดไฟล์ — ยังไม่เปิดใช้งานในตัวอย่างนี้\')"><i data-lucide="download" class="lu"></i></button></div>').join('')
       :'<div style="font-size:var(--fs-sub);color:var(--c-mute-3)">ไม่มีเอกสารแนบ</div>')+
   SEC('git-branch','การส่งต่อเอกสาร',
      '<div style="display:flex;gap:8px;flex-wrap:wrap">'+

/* จำนวนเงินตัวอักษร (port ของ baht_text) */
function bahtText(n){
  const N=['ศูนย์','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'],P=['','สิบ','ร้อย','พัน','หมื่น','แสน','ล้าน'];
  function conv(s){ let r='',len=s.length;
    for(let i=0;i<len;i++){ const d=+s[i],p=len-i-1;
      if(d===0) continue;
      if(p===0&&d===1&&len>1) r+='เอ็ด';
      else if(p===1&&d===1) r+='สิบ';
      else if(p===1&&d===2) r+='ยี่สิบ';
      else r+=N[d]+P[p];
      if(p===1&&d>2) {}
    } return r; }
  n=Math.round((Number(n)||0)*100)/100;
  const b=Math.floor(n),st=Math.round((n-b)*100);
  let s='';
  if(b===0) s='ศูนย์';
  else { const str=String(b);
    if(str.length>6){ s=conv(str.slice(0,str.length-6))+'ล้าน'+(+str.slice(-6)?conv(str.slice(-6)):''); }
    else s=conv(str); }
  return s+'บาท'+(st?conv(String(st).padStart(2,'0'))+'สตางค์':'ถ้วน');
}

     '<div><h3>'+esc(c.title)+'</h3><p>'+esc(c.desc)+'</p></div></div>'+
   '<div class="modal-b"><div class="field"><label class="lbl">เหตุผล <span class="req">*</span></label>'+
     '<textarea class="input" rows="3" placeholder="อย่างน้อย 3 ตัวอักษร" oninput="reasonState.text=this.value;toggleReasonOk(this)">'+esc(reasonState.text)+'</textarea>'+
     '<div class="preset-chips">'+c.presets.map(p=>'<button onclick="reasonState.text=\''+p+'\';render()">'+esc(p)+'</button>').join('')+'</div></div></div>'+
   '<div class="modal-f"><button class="btn btn-ghost" onclick="closeReason()">ยกเลิก</button>'+
     '<button class="btn btn-primary" id="reason-ok" style="background:var(--c-danger)" '+(ok?'':'disabled')+' onclick="doReason()">'+esc(c.ok)+'</button></div>'+
   '</div></div>';
}
function toggleReasonOk(el){ const b=$('#reason-ok'); if(b) b.disabled=String(el.value||'').trim().length<3; }
function doReason(){
  const {id,kind,text}=reasonState,d=DOCS.find(x=>x.id===id);
  if(kind==='reject'){ const i=canActStep(d); const st=d.approval_chain[i>=0?i:0];
    st.status='rejected'; st.at=nowISO(); st.note=text;
    d.status='rejected'; d.approval_status='rejected'; pushAudit(d,'reject',text);
    /* ENG-NOTIFY.emit('pr_rejected') — บังคับ ปิดไม่ได้ */ }
  else { d.status='cancelled'; d.approval_status='cancelled'; d.cancelReason=text; pushAudit(d,'cancel',text);
    /* ENG-NOTIFY.emit('pr_cancelled') · ENG-CSQ doc.cancelled(EC/avoided) */ }
  reasonState=null;
  if(createWizard){ createWizard=null; }
  render(); toast(kind==='reject'?'บันทึกผลไม่อนุมัติแล้ว':'ยกเลิกใบขอซื้อแล้ว');
}
/* generic confirm modal (Pattern D) */
let modalState=null;
function openModal(cfg){ modalState=cfg; render(); }
function closeModal(){ modalState=null; render(); }
function renderModal(){
  if(!modalState) return ''; const m=modalState;
  window.__modalOk=m.onOk;
  return '<div class="mbd" onclick="if(event.target===this)closeModal()"><div class="modal">'+
   '<div class="modal-h"><div class="ic '+(m.tone||'p')+'"><i data-lucide="'+m.icon+'" class="lu"></i></div>'+
   '<div><h3>'+esc(m.title)+'</h3><p>'+esc(m.desc)+'</p></div></div>'+
   '<div class="modal-f"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>'+
   '<button class="btn btn-primary" '+(m.okTone==='danger'?'style="background:var(--c-danger)"':'')+' onclick="__modalOk()">'+esc(m.ok)+'</button></div>'+
   '</div></div>';
}
</script>
<script>
/* ═══ ROUTER + RENDER ═════════════════════════════════════════════ */
function parseHash(){
  const h=(location.hash||'#/list').replace(/^#/,'');
  const p=h.split('/').filter(Boolean);
  return {view:p[0]||'list',id:p[1]||null};
}
function render(){
  const r=parseHash();
  $('#page').innerHTML=renderList();
  let dr='';
  if(r.view==='create'||r.view==='edit'){ if(createWizard) dr=renderCreateDrawer(); }
  else if(r.view==='view'){ if(VIEW.open&&curDoc()) dr=renderViewDrawer(); }
  $('#drawer-root').innerHTML=dr;
  $('#modal-root').innerHTML=renderSubmitModal()+renderReasonModal()+renderModal();
  renderIcons();
}
function route(){
  const r=parseHash();
  if(r.view==='create'){ if(!createWizard||createWizard.mode!=='create') openCreate(); else render(); }
  else if(r.view==='edit'){ const d=DOCS.find(x=>x.id===r.id);
    if(!d){ goList(); return; }
    if(d.status!=='draft'){ toast('แก้ไขได้เฉพาะแบบร่าง — กด “เรียกคืน” ก่อนหากต้องการแก้','bad'); goView(d.id); return; }
    if(!createWizard||createWizard.doc.id!==r.id) openCreate(r.id); else render(); }
  else if(r.view==='view'){ const d=DOCS.find(x=>x.id===r.id); if(!d){ goList(); return; }
    createWizard=null; openView(r.id); }
  else { createWizard=null; VIEW.open=false; render(); }
}
window.addEventListener('hashchange',route);

/* Esc chain: combo → modal → drawer */
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(createWizard&&createWizard.combo.lineId){ closeCombo(); return; }
  if(submitState){ closeSubmitModal(); return; }
  if(reasonState){ closeReason(); return; }
  if(modalState){ closeModal(); return; }
  if(createWizard){ tryCloseWizard(); return; }
  if(VIEW.open){ closeDrawer(); return; }
});
document.addEventListener('DOMContentLoaded',()=>{ if(!location.hash) location.hash='#/list'; route(); });
if(document.readyState!=='loading'){ if(!location.hash) location.hash='#/list'; route(); }
</script>
</body>
