function statusLabel(s){ return (STATUS_META[s]||{label:s}).label; }
function statusPill(s){
  var m = STATUS_META[s] || { label:s, pill:'pill-muted', icon:'circle' };
  return '<span class="pill '+m.pill+'"><i data-lucide="'+m.icon+'" class="w-3 h-3"></i>'+esc(m.label)+'</span>';
}
function findRec(id){ return RAW.find(function(r){ return r.id===id; }); }
function initials(code){ return (code||'?').replace(/[^A-Za-z0-9]/g,'').slice(0,3).toUpperCase() || '?'; }
function cntStatus(s){ return RAW.filter(function(r){ return r.status===s; }).length; }
function selIds(){ return Object.keys(state.sel).filter(function(k){ return state.sel[k]; }); }

/* ---- filter / sort / paginate ---- */
function getFiltered(){
  var f = state.filters, q = (f.search||'').trim().toLowerCase();
  var a = RAW.filter(function(r){
    if(f.category!=='all' && r.category!==f.category) return false;
    if(f.status!=='all'   && r.status!==f.status)     return false;
    if(q){
      var hay = (r.code+' '+r.name_th+' '+(r.name_en||'')+' '+(r.symbol||'')).toLowerCase();
      if(hay.indexOf(q) < 0) return false;
    }
    return true;
  });
  var c = state.sort.col, d = state.sort.dir==='asc' ? 1 : -1;
  a.sort(function(x,y){
    var vx = x[c], vy = y[c];
    if(c==='used') return (vx-vy)*d;
    if(c==='category'){ vx = catLabel(vx); vy = catLabel(vy); }
    if(c==='status'){ vx = statusLabel(vx); vy = statusLabel(vy); }
    vx = (''+(vx==null?'':vx)).toLowerCase(); vy = (''+(vy==null?'':vy)).toLowerCase();
    return vx<vy ? -d : vx>vy ? d : 0;
  });
  return a;
}
function getPaginated(){
  var all = getFiltered(), p = state.pagination;
  var tp = Math.max(1, Math.ceil(all.length/p.pageSize));
  if(p.page > tp) p.page = tp;
  var s = (p.page-1)*p.pageSize;
  return { rows: all.slice(s, s+p.pageSize), total: all.length, page: p.page, totalPages: tp,
           start: all.length===0 ? 0 : s+1, end: Math.min(s+p.pageSize, all.length) };
}
function hasActiveFilter(){ var f=state.filters; return !!(f.search || f.category!=='all' || f.status!=='all'); }
function applyFilter(k, v){ state.filters[k]=v; state.pagination.page=1; render(); }
function quickFilter(k){
  if(k==='all'){ state.filters.status='all'; state.filters.category='all'; }
  else { state.filters.status = (state.filters.status===k ? 'all' : k); }
  state.pagination.page=1; render();
}
function resetFilters(){
  state.filters = { search:'', category:'all', status:'all' };
  state.pagination.page=1; render(); showToast('ล้างตัวกรองแล้ว','info');
}
function sortBy(c){
  if(state.sort.col===c) state.sort.dir = state.sort.dir==='asc' ? 'desc' : 'asc';
  else { state.sort.col=c; state.sort.dir='asc'; }
  render();
}
function goToPage(n){
  var tp = getPaginated().totalPages;
  if(n<1 || n>tp) return;
  state.pagination.page = n; render();
}

/* ---- เลือกหลายรายการ ---- */
function toggleSel(id, on){ state.sel[id] = !!on; render(); }
function toggleSelPage(on){
  getPaginated().rows.forEach(function(r){ state.sel[r.id] = !!on; });
  render();
}
function clearSel(){ state.sel = {}; render(); }

function onRowClick(e, id){
  if(e && e.target && e.target.closest('[data-noopen]')) return;
  openView(id);
}

/* ---- routing (refresh-safe) — #/uom · /create · /edit/:id · /view/:id ---- */
function parseHash(){
  var p = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  return { base: p[0]||'uom', mode: p[1]||null, id: p[2]||null };
}
function navGo(route){ location.hash = '#/' + route; }
function openCreate(){ state.drawer.tab='overview'; location.hash = '#/uom/create'; }
function openEdit(id){ state.drawer.tab='overview'; location.hash = '#/uom/edit/' + id; }
function openView(id){ state.drawer.tab='overview'; location.hash = '#/uom/view/' + id; }

function autoCode(category){
  var base = String(category||'unit').slice(0,3).toUpperCase();
  var i = 1, c;
  do { c = base + String(i).padStart(2,'0'); i++; }
  while(RAW.some(function(r){ return r.code.toUpperCase()===c; }));
  return c;
}
function setFieldError(fieldId, msgId, msg){
  var f = document.getElementById(fieldId); if(!f) return;
  if(msg){ f.classList.add('is-invalid'); var e = document.getElementById(msgId); if(e) e.textContent = msg; }
  else f.classList.remove('is-invalid');
}
function saveUnit(mode, id){
  if(state.saving) return;                       /* กันกดซ้ำ (Rule #44) */
  var code    = document.getElementById('in-code').value.trim();
  var nameTh  = document.getElementById('in-name-th').value.trim();
  var nameEn  = document.getElementById('in-name-en').value.trim();
  var symbol  = document.getElementById('in-symbol').value.trim();
  var cat     = document.getElementById('in-category').value;
  var status  = document.getElementById('in-status').value;

  var ok = true;
  setFieldError('fld-name','err-name','');
  setFieldError('fld-code','err-code','');
  if(!nameTh){ setFieldError('fld-name','err-name','กรุณากรอกชื่อภาษาไทย'); ok = false; }
  var finalCode = code || autoCode(cat);
  var dup = RAW.some(function(r){ return r.code.toLowerCase()===finalCode.toLowerCase() && r.id!==id; });
  if(dup){ setFieldError('fld-code','err-code','รหัส '+finalCode+' ถูกใช้แล้ว'); ok = false; }
  if(!ok){ showToast('กรุณากรอกข้อมูลให้ครบถ้วน','warning'); return; }

  state.saving = true;
  var btn = document.getElementById('btn-save');
  btn.disabled = true;
  btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>';
  renderIcons();

  setTimeout(function(){
    state.saving = false;
    if(mode==='edit'){
      var r = findRec(id);
      if(r){ Object.assign(r, { code:finalCode, name_th:nameTh, name_en:nameEn,
        symbol: symbol || finalCode.toLowerCase(), category:cat, status:status,
        updated_by: CURRENT_USER.name, updated_at: TODAY }); }
      closeDrawer(); showToast('บันทึกการแก้ไขแล้ว','success');
    } else {
      RAW.unshift(mk({ code:finalCode, name_th:nameTh, name_en:nameEn,
        symbol: symbol || finalCode.toLowerCase(), category:cat, status:status, used:0,
        created_by: CURRENT_USER.name, created_at: TODAY,
        updated_by: CURRENT_USER.name, updated_at: TODAY }));
      state.pagination.page = 1;
      closeDrawer(); showToast('สร้างหน่วยวัดสำเร็จ','success');
    }
  }, 400);
}

      +     '<div class="tl-title">สร้างรายการ</div>'
      +     '<div class="tl-meta">'+esc(r.created_by)+' · '+fmtDate(r.created_at)+'</div></div>'
      + '</div></div>';
  }
  return '<div class="drawer-section"><div class="drawer-section-title">ข้อมูลหน่วยวัด</div>'
    + '<div class="drawer-fields">'
    +   '<span class="lbl">รหัสหน่วย</span><span class="val">'+esc(r.code)+'</span>'
    +   '<span class="lbl">สัญลักษณ์</span><span class="val">'+esc(r.symbol)+'</span>'
    +   '<span class="lbl">ชื่อ (ไทย)</span><span class="val">'+esc(r.name_th)+'</span>'
    +   '<span class="lbl">ชื่อ (อังกฤษ)</span><span class="val">'+esc(r.name_en || '—')+'</span>'

}

              + '>'+statusPill(s)+'</button>'; }).join('')

    +   '</div>'

function switchTab(k){
  state.drawer.tab = k; render();
  requestAnimationFrame(function(){ requestAnimationFrame(function(){
    var b = document.querySelector('.drawer-body'); if(b) b.scrollTop = 0; }); });
}

/* ---- เมนูเปลี่ยนสถานะ — portal ออกไป #overlay-root (Rule #95) ---- */
function toggleStatusMenu(btn){
  var m = document.getElementById('statusMenu'); if(!m) return;
  if(m.classList.contains('open')){ closeOverlay(m); return; }
  openOverlay(m, btn);
  portalMenu(btn, m);
}
function cleanPortals(){
  var host = document.getElementById('overlay-root');
  if(host) host.innerHTML = '';
}
function setStatus(id, s){
  var r = findRec(id); if(!r || r.status===s) return;
  r.status = s; r.updated_by = CURRENT_USER.name; r.updated_at = TODAY;
  render();
  showToast('เปลี่ยนสถานะเป็น '+statusLabel(s)+' แล้ว','success');
}

/* ---- bulk: เปลี่ยนสถานะ / ลบ ---- */
function bulkSetStatus(s){
  var ids = selIds(); if(!ids.length) return;
  var n = 0;
  ids.forEach(function(id){ var r = findRec(id); if(!r || r.status===s) return;
    r.status = s; r.updated_by = CURRENT_USER.name; r.updated_at = TODAY; n++; });
  state.sel = {}; render();
  showToast('เปลี่ยนสถานะ '+n+' หน่วย เป็น '+statusLabel(s)+' แล้ว','success');
}
function openBulkDelete(){
  var ids = selIds(); if(!ids.length) return;
  var skip = ids.filter(function(id){ var r=findRec(id); return r && r.used>0; }).length;
  var del  = ids.length - skip;
  state.modal.type = 'bulkdelete';
  showModal(
    '<div class="modal-header">'
    + '<div class="modal-header-icon is-danger"><i data-lucide="trash-2" class="w-4 h-4"></i></div>'
    + '<div><div class="modal-title">ลบหน่วยวัด '+ids.length+' รายการ?</div>'
    +   '<p class="modal-subtitle">'
    +     (skip ? 'จะลบจริง <strong>'+del+'</strong> รายการ · ข้าม <strong>'+skip+'</strong> รายการที่ถูกสินค้าใช้อยู่'
                : 'การลบไม่สามารถย้อนกลับได้')
    +   '</p></div></div>'
    + '<div class="modal-footer">'
    +   '<button class="btn btn-ghost" type="button" onclick="closeModal()">ยกเลิก</button>'
    +   '<button class="btn btn-danger" type="button" id="btn-del" onclick="confirmBulkDelete()"'+(del?'':' disabled')+'>'
    +     '<i data-lucide="trash-2" class="w-4 h-4"></i><span>ลบ '+del+' รายการ</span></button>'
    + '</div>', false);
}
function confirmBulkDelete(){
  var ids = selIds(), del = [], skip = [];
  ids.forEach(function(id){ var r = findRec(id); if(!r) return; (r.used>0 ? skip : del).push(id); });
  RAW = RAW.filter(function(r){ return del.indexOf(r.id) < 0; });
  state.sel = {}; closeModal();
  if(state.drawer.open && del.indexOf(state.drawer.recordId) >= 0) closeDrawer(); else render();
  showToast('ลบแล้ว '+del.length+' หน่วย' + (skip.length ? ' · ข้าม '+skip.length+' หน่วยที่ถูกสินค้าใช้อยู่' : ''),
    skip.length ? 'warning' : 'success');
}

/* ---- ส่งออก CSV ตามตัวกรองปัจจุบัน ---- */
function csvCell(v){ v = '' + (v==null ? '' : v); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; }
function downloadCSV(name, lines){
  var blob = new Blob(['﻿' + lines.join('\r\n')], { type:'text/csv;charset=utf-8;' });
  var url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function exportCSV(){
  var rows = getFiltered();
  var head = ['รหัสหน่วย','ชื่อ (ไทย)','ชื่อ (อังกฤษ)','สัญลักษณ์','หมวดหน่วยวัด','สถานะ','จำนวนสินค้าที่ใช้'];
  var lines = [head.map(csvCell).join(',')].concat(rows.map(function(r){
    return [r.code, r.name_th, r.name_en||'', r.symbol||'', catLabel(r.category), statusLabel(r.status), r.used].map(csvCell).join(',');
  }));
  downloadCSV('uom-master.csv', lines);
  showToast('ส่งออก '+rows.length+' หน่วยเป็น CSV แล้ว','success');
}

/* ---- นำเข้า CSV (Rule #32) — ตรวจรายแถว แถวผิดข้าม ไม่ล้มทั้งไฟล์ ---- */
var IMPORT_SAMPLE = [
  { code:'TON', name_th:'ตัน',        name_en:'Tonne',     symbol:'ตัน', category:'ชั่งน้ำหนัก', status:'ใช้งาน'    },
  { code:'SET', name_th:'ชุด',        name_en:'Set',       symbol:'ชุด', category:'นับจำนวน',   status:''         },
  { code:'KM',  name_th:'กิโลเมตร',   name_en:'Kilometre', symbol:'กม.', category:'ความยาว',   status:'ไม่ใช้งาน' },
  { code:'PCS', name_th:'ชิ้น (ซ้ำ)', name_en:'Piece',     symbol:'pcs', category:'นับจำนวน',   status:'ใช้งาน'    },
  { code:'BAG', name_th:'ถุง',        name_en:'Bag',       symbol:'ถุง', category:'นับจำนวน',   status:'พร้อมใช้'  }
];
function importError(row){
  if(!row.code || !row.name_th || !row.category) return 'REQUIRED — ข้อมูลบังคับไม่ครบ';
  if(!CAT_BY_TH[row.category])                   return 'BAD_CATEGORY — ไม่มีหมวดนี้';
  if(row.status && !STATUS_BY_TH[row.status])    return 'BAD_STATUS — สถานะไม่ถูกต้อง';
  if(RAW.some(function(r){ return r.code.toLowerCase()===row.code.toLowerCase(); }))
                                                 return 'CODE_DUPLICATE — รหัสซ้ำ';
  return '';
}
function downloadTemplate(){
  downloadCSV('uom-import-template.csv', [
    'code,name_th,name_en,symbol,category,status',
    'TON,ตัน,Tonne,ตัน,ชั่งน้ำหนัก,ใช้งาน',
    'SET,ชุด,Set,ชุด,นับจำนวน,',
    'KM,กิโลเมตร,Kilometre,กม.,ความยาว,ไม่ใช้งาน'
  ]);
  showToast('ดาวน์โหลดไฟล์ตัวอย่างแล้ว','info');
}
function openImport(){ state.imp = { step:'pick', rows:[], ok:0, bad:0 }; state.modal.type='import'; showModal(importHTML(), true); }
function impPick(){
  state.imp.step = 'preview';
  state.imp.rows = IMPORT_SAMPLE.map(function(r){ return Object.assign({}, r, { err: importError(r) }); });
  showModal(importHTML(), true);
}
function impConfirm(){
  var ok = 0;
  state.imp.rows.forEach(function(row){
    if(row.err) return;
    RAW.unshift(mk({ code:row.code, name_th:row.name_th, name_en:row.name_en||'',
      symbol: row.symbol || row.code.toLowerCase(), category: CAT_BY_TH[row.category],
      status: STATUS_BY_TH[row.status] || 'draft', used:0,
      created_by: CURRENT_USER.name, created_at: TODAY,
      updated_by: CURRENT_USER.name, updated_at: TODAY }));
    ok++;
  });
  state.imp.ok  = ok;
  state.imp.bad = state.imp.rows.filter(function(r){ return !!r.err; }).length;
  state.imp.step = 'done';
  state.pagination.page = 1;
  showModal(importHTML(), true);
  render();
  showToast('นำเข้าแล้ว '+ok+' หน่วย' + (state.imp.bad ? ' · ข้าม '+state.imp.bad+' แถว' : ''),
    state.imp.bad ? 'warning' : 'success');
}
function importHTML(){
  var b = state.imp;
  var head = '<div class="modal-header">'
    + '<div class="modal-header-icon"><i data-lucide="upload" class="w-4 h-4"></i></div>'
    + '<div><div class="modal-title">นำเข้าหน่วยวัดจากไฟล์ CSV</div></div>'
    + '<div class="spacer-fill"></div>'
    + '<button class="top-icon-btn" type="button" aria-label="ปิด" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button>'
    + '</div>';

  if(b.step==='pick'){
    /* จอแรก: กล่องเลือกไฟล์ + ปุ่มดาวน์โหลดตัวอย่าง — ไม่มีข้อความอธิบายคอลัมน์ */
    return head
      + '<div class="modal-body"><div class="upload-box" id="pick-box" onclick="impPick()">'
      +   '<i data-lucide="file-spreadsheet" class="w-5 h-5"></i><div class="upload-strong">เลือกไฟล์ CSV</div></div></div>'
      + '<div class="modal-footer">'
      +   '<button class="btn btn-secondary" type="button" onclick="downloadTemplate()"><i data-lucide="file-down" class="w-4 h-4"></i><span>ดาวน์โหลด template ตัวอย่าง</span></button>'
      +   '<div class="spacer-fill"></div>'
      +   '<button class="btn btn-ghost" type="button" onclick="closeModal()">ยกเลิก</button>'
      + '</div>';
  }
  if(b.step==='preview'){
    var okN = b.rows.filter(function(r){ return !r.err; }).length;
    var badN = b.rows.length - okN;
    return head
      + '<div class="modal-body">'
      +   '<div class="imp-sum '+(badN ? 'is-warn' : 'is-ok')+'">ตรวจแล้ว '+b.rows.length+' แถว — นำเข้าได้ <strong>'+okN+'</strong> · ติดปัญหา <strong>'+badN+'</strong></div>'
      +   '<div class="imp-wrap"><table class="imp-table"><thead><tr>'
      +     '<th>รหัส</th><th>ชื่อหน่วยวัด</th><th>หมวด</th><th>สถานะ</th><th>ผลตรวจ</th>'
      +   '</tr></thead><tbody>'
      +   b.rows.map(function(r){
            var st = STATUS_BY_TH[r.status];
            return '<tr><td>'+esc(r.code)+'</td><td>'+esc(r.name_th)+'</td><td>'+esc(r.category)+'</td>'
              + '<td>'+(st ? statusPill(st) : (r.status ? '<span class="err-txt">'+esc(r.status)+'</span>' : statusPill('draft')))+'</td>'
              + '<td>'+(r.err ? '<span class="err-txt">'+esc(r.err)+'</span>' : '<span class="ok-txt">พร้อมนำเข้า</span>')+'</td></tr>';
          }).join('')
      +   '</tbody></table></div>'
      + '</div>'
      + '<div class="modal-footer">'
      +   '<button class="btn btn-ghost" type="button" onclick="closeModal()">ยกเลิก</button>'
      +   '<button class="btn btn-primary" type="button" id="btn-import" onclick="impConfirm()"'+(okN?'':' disabled')+'>'
      +     '<i data-lucide="upload" class="w-4 h-4"></i><span>นำเข้า '+okN+' แถว</span></button>'
      + '</div>';
  }
  return head
    + '<div class="modal-body">'
    +   '<div class="imp-sum '+(b.bad ? 'is-warn' : 'is-ok')+'" id="imp-done">นำเข้าเสร็จ <strong>'+b.ok+'</strong> หน่วย (สถานะตามไฟล์)'+(b.bad ? ' · ข้าม <strong>'+b.bad+'</strong> แถว' : '')+'</div>'
    +   (b.bad ? '<div class="imp-wrap"><table class="imp-table"><thead><tr><th>รหัส</th><th>ชื่อ</th><th>สาเหตุที่ข้าม</th></tr></thead><tbody>'
        + b.rows.filter(function(r){ return !!r.err; }).map(function(r){
            return '<tr><td>'+esc(r.code)+'</td><td>'+esc(r.name_th)+'</td><td><span class="err-txt">'+esc(r.err)+'</span></td></tr>'; }).join('')
        + '</tbody></table></div>' : '')
    + '</div>'
    + '<div class="modal-footer"><button class="btn btn-secondary" type="button" onclick="closeModal()">ปิด</button></div>';
}

/* ---- modal shell ---- */
function showModal(html, wide){
  var box = document.getElementById('modalBox');
  box.className = 'modal' + (wide ? ' is-lg' : '');
  box.innerHTML = html;
  state.modal.open = true;
  document.getElementById('modalBackdrop').classList.add('is-open');
  renderIcons();
  lockScroll(true); trapFocus(box);
}
function closeModal(){
  var mb = document.getElementById('modalBackdrop'), box = document.getElementById('modalBox');
  mb.classList.remove('is-open');
  releaseFocus(box);
  state.modal.open = false; state.modal.type = null;
  lockScroll(!!state.drawer.open);
  setTimeout(function(){ if(!state.modal.open) box.innerHTML = ''; }, 200);
}

/* ---- shell chrome ---- */
function toggleNav(){ document.querySelector('.sidebar').classList.toggle('open'); }
function toggleNotif(){ showToast('ไม่มีการแจ้งเตือนใหม่','info'); }
function toggleUserMenu(){ document.getElementById('userMenu').classList.toggle('is-open'); }
document.addEventListener('click', function(e){
  if(!e.target.closest('.user-chip') && !e.target.closest('.user-menu')){
    var m = document.getElementById('userMenu'); if(m) m.classList.remove('is-open');
  }
});
/* Esc chain: เมนูลอย/เมนูข้าง ปิดก่อน — ลิ้นชักกับหน้าต่างยืนยันเป็นหน้าที่ของ BASE-KIT */
document.addEventListener('keydown', function(e){
  if(e.key!=='Escape') return;
  var handled = false;
  var om = document.querySelector('[data-overlay].open');
  var um = document.getElementById('userMenu');
  if(om){ closeOverlay(om); handled = true; }
  else if(um && um.classList.contains('is-open')){ um.classList.remove('is-open'); handled = true; }
  else { var sb = document.querySelector('.sidebar.open'); if(sb){ sb.classList.remove('open'); handled = true; } }
  if(handled) e.stopPropagation();
}, true);

/* ---- render ---- */
function syncDrawer(){
  var rt = parseHash();
  var want = (rt.mode==='create' || rt.mode==='edit' || rt.mode==='view');
  if(want && rt.mode!=='create' && !findRec(rt.id)) want = false;
  var dw = document.getElementById('drawer'), bd = document.getElementById('drawerBackdrop');
  if(want && !state.drawer.open){
    state.drawer.open = true;
    requestAnimationFrame(function(){
      bd.classList.add('is-open'); dw.classList.add('is-open');
      dw.setAttribute('aria-hidden','false');
      lockScroll(true); trapFocus(dw);
    });
  } else if(!want && state.drawer.open){
    state.drawer.open = false;
    bd.classList.remove('is-open'); dw.classList.remove('is-open');
    dw.setAttribute('aria-hidden','true');
    releaseFocus(dw); lockScroll(!!state.modal.open);
  }
  state.drawer.mode = want ? rt.mode : null;
  state.drawer.recordId = want ? rt.id : null;
}
function drawerHTML(){
  var rt = parseHash();
  if(rt.mode==='create') return formHTML('create', {});
  if(rt.mode==='edit'){ var e = findRec(rt.id); return e ? formHTML('edit', e) : ''; }
  if(rt.mode==='view'){ var v = findRec(rt.id); return v ? viewHTML(v) : ''; }
  return '';
}
function render(){
  var snap = preserveRenderState();
  cleanPortals();
  var sb = document.getElementById('sb-count'); if(sb) sb.textContent = RAW.length;
  document.getElementById('page-content').innerHTML = listHTML();
  document.getElementById('drawer').innerHTML = drawerHTML();
  renderIcons();
  syncDrawer();
  restoreRenderState(snap);
}
