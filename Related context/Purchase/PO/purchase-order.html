<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ใบสั่งซื้อ (PO) — Procurement</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* self-contained utility shim (replaces Tailwind CDN — icon sizing + inline) */
    .w-3{width:.75rem}.h-3{height:.75rem}
    .w-3\.5{width:.875rem}.h-3\.5{height:.875rem}
    .w-4{width:1rem}.h-4{height:1rem}
    .w-5{width:1.25rem}.h-5{height:1.25rem}
    .w-6{width:1.5rem}.h-6{height:1.5rem}
    .w-10{width:2.5rem}.h-10{height:2.5rem}
    .inline{display:inline-block}
    svg{vertical-align:middle}
    button:focus { outline: none; }
    button:focus-visible { outline: 2px solid var(--c-primary, #0B5CFF); outline-offset: 1px; }
    .btn-link, .btn-link:focus, .btn-link:focus-visible { outline: none !important; box-shadow: none !important; }
    .hint { position: relative; display: inline-flex; align-items: center; cursor: help; }
    .hint::after { content: attr(data-tip); position: absolute; left: 0; top: 150%; white-space: pre-line; width: 290px; background: var(--c-navy, #0B1D3A); color: #fff; font-size: 11px; font-weight: 400; line-height: 1.6; padding: 9px 11px; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,0.18); opacity: 0; visibility: hidden; transform: translateY(-2px); transition: opacity 120ms, transform 120ms; z-index: 60; pointer-events: none; }
    .hint:hover::after { opacity: 1; visibility: visible; transform: translateY(0); }
    .line-tbl th, .line-tbl td { padding-left: 6px; padding-right: 6px; }
    .line-tbl th:first-child, .line-tbl td:first-child { padding-left: 6px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js" defer></script>
  <style>
    /* ============================================================
       CUBE NATIVE Admin CI v2 — Design Tokens
       ============================================================ */
    :root {
      --c-navy:        #0B1D3A;
      --c-navy-d:      #06122A;
      --c-primary:     #0B5CFF;
      --c-primary-h:   #0a4ed1;
      --c-teal:        #00A88E;
      --c-slate:       #64748B;
      --c-off-white:   #F6F8FB;
      --c-white:       #FFFFFF;
      --c-border:      #E2E8F0;
      --c-border-soft: #EEF2F7;
      --c-text:        #0B1D3A;
      --c-text-mute:   #64748B;
      --c-text-soft:   #94A3B8;
      --c-warning:     #F59E0B;
      --c-danger:      #EF4444;
      --c-purple:      #7C3AED;
      --c-primary-08:  rgba(11, 92, 255, 0.08);
      --c-primary-12:  rgba(11, 92, 255, 0.12);
      --c-primary-18:  rgba(11, 92, 255, 0.18);
      --c-teal-08:     rgba(0, 168, 142, 0.08);
      --c-warning-08:  rgba(245, 158, 11, 0.10);
      --c-danger-08:   rgba(239, 68, 68, 0.10);
      --r-sm: 6px;
      --r:    10px;
      --r-lg: 14px;
      --sh-sm: 0 1px 2px rgba(11, 29, 58, 0.04), 0 1px 3px rgba(11, 29, 58, 0.06);
      --sh-md: 0 4px 8px rgba(11, 29, 58, 0.04), 0 2px 4px rgba(11, 29, 58, 0.06);
      --sh-lg: 0 10px 30px rgba(11, 29, 58, 0.08), 0 4px 10px rgba(11, 29, 58, 0.04);
      --sh-xl: 0 24px 60px rgba(11, 29, 58, 0.10), 0 8px 24px rgba(11, 29, 58, 0.06);
      --sw: 224px;
      --hh: 52px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Noto Sans Thai', -apple-system, sans-serif;
      font-size: 13px;
      line-height: 1.55;
      background: var(--c-off-white);
      color: var(--c-text);
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4, .display { font-family: 'Inter', 'Noto Sans Thai', sans-serif; letter-spacing: -0.015em; font-weight: 700; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }
    input, select, textarea { font-family: inherit; }
    .num { font-variant-numeric: tabular-nums; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--c-border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--c-text-soft); }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

    /* ============================================================
       SHELL — Sidebar (224px flat) + Main + Topbar (52px white)
       ============================================================ */
    .shell { display: grid; grid-template-columns: var(--sw) 1fr; min-height: 100vh; }

    .sb {
      background: var(--c-navy-d);
      color: white;
      height: 100vh;
      position: sticky; top: 0;
      display: flex; flex-direction: column;
      border-right: 1px solid rgba(255,255,255,0.05);
      overflow: hidden;
    }
    .sb-logo {
      padding: 16px 18px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .sb-logo-mark {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--c-primary), var(--c-teal));
      border-radius: var(--r-sm);
      display: grid; place-items: center;
      flex-shrink: 0;
      color: white;
    }
    .sb-logo-text { line-height: 1.2; min-width: 0; }
    .sb-logo-title { font-size: 13px; font-weight: 700; color: white; }
    .sb-logo-sub {
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 1px;
    }

    .sb-menu { flex: 1; overflow-y: auto; padding: 10px 0; }
    .sb-menu::-webkit-scrollbar { width: 4px; }
    .sb-menu::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }

    .sb-section { padding: 6px 0; }
    .sb-section-label {
      padding: 6px 18px 4px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
    }

    .sb-item {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 18px;
      color: rgba(255,255,255,0.72);
      font-size: 13px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.12s;
      text-decoration: none;
    }
    .sb-item:hover { background: rgba(255,255,255,0.05); color: white; }
    .sb-item.active {
      background: var(--c-primary-18);
      border-left-color: var(--c-primary);
      color: white;
      font-weight: 600;
    }
    .sb-icon { flex-shrink: 0; opacity: 0.8; display: grid; place-items: center; }
    .sb-item.active .sb-icon { opacity: 1; color: var(--c-primary); }

    .sb-badge {
      margin-left: auto;
      background: var(--c-danger);
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 999px;
      line-height: 1.4;
    }
    .sb-badge.muted { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.7); }

    .sb-foot {
      padding: 12px 18px;
      border-top: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
      font-size: 10px;
      color: rgba(255,255,255,0.4);
    }
    .sb-foot div + div { margin-top: 2px; }

    /* MAIN */
    .main { display: flex; flex-direction: column; min-width: 0; background: var(--c-off-white); }

    /* TOPBAR — White */
    .top {
      height: var(--hh);
      background: var(--c-white);
      border-bottom: 1px solid var(--c-border-soft);
      padding: 0 22px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px;
      position: sticky; top: 0; z-index: 50;
    }
    .top-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .top-bc { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--c-text); }
    .bc-root { color: var(--c-text-mute); cursor: pointer; transition: color 120ms; }
    .bc-root:hover { color: var(--c-primary); }
    .bc-sep { color: var(--c-text-soft); margin: 0 2px; }
    .bc-leaf { font-weight: 600; }

    .top-right { display: flex; align-items: center; gap: 12px; }
    .top-user {
      display: flex; align-items: center; gap: 9px;
      padding: 4px 11px 4px 4px;
      border-radius: 8px;
      border: 0; background: transparent;
      cursor: pointer;
      transition: background 120ms;
    }
    .top-user:hover { background: var(--c-off-white); }
    .top-user:focus, .top-user:focus-visible { outline: none; }
    .top-user-info {
      display: flex; flex-direction: column;
      align-items: flex-end;
      line-height: 1.2;
    }
    .top-user-name { font-size: 12.5px; font-weight: 600; color: var(--c-navy); }
    .top-user-role { font-size: 10.5px; color: var(--c-text-mute); margin-top: 2px; }
    .top-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--c-primary), var(--c-teal));
      color: white;
      font-size: 12px; font-weight: 600;
      display: grid; place-items: center;
      flex-shrink: 0;
    }

    /* Icon button (used in drawer headers — printer/download/close) */
    .top-icon-btn {
      width: 32px; height: 32px;
      background: var(--c-off-white);
      border: 1px solid var(--c-border);
      border-radius: var(--r);
      cursor: pointer;
      display: grid; place-items: center;
      color: var(--c-text-mute);
      position: relative;
      transition: all 120ms;
    }
    .top-icon-btn:hover { color: var(--c-text); border-color: var(--c-text-soft); background: var(--c-white); }

    /* PAGE */
    .page { flex: 1; padding: 22px 24px 40px; overflow-y: auto; }

    /* PAGE HEAD */
    .ph {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-bottom: 18px;
      gap: 16px; flex-wrap: wrap;
    }
    .ph-left { min-width: 0; }
    .ph-title { font-size: 22px; font-weight: 700; color: var(--c-navy); line-height: 1.2; }
    .ph-sub { font-size: 13px; color: var(--c-text-mute); margin-top: 4px; }
    .ph-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    /* ============================================================
       BUTTON SYSTEM
       ============================================================ */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px;
      padding: 0 14px;
      height: 34px;
      border-radius: var(--r);
      font-size: 12.5px;
      font-weight: 600;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      background: transparent;
      color: var(--c-text);
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
    }
    .btn:focus-visible { outline: 2px solid var(--c-primary); outline-offset: 2px; }
    .btn:disabled { cursor: not-allowed; opacity: 0.6; }
    .btn.lg { height: 38px; padding: 0 18px; font-size: 13px; }
    .btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
    .btn-primary    { background: var(--c-primary); color: white; border-color: var(--c-primary); }
    .btn-primary:hover:not(:disabled) { background: var(--c-primary-h); border-color: var(--c-primary-h); }
    .btn-secondary  { background: var(--c-white); color: var(--c-navy); border-color: var(--c-border); }
    .btn-secondary:hover:not(:disabled) { border-color: var(--c-text-soft); }
    .btn-ghost      { background: transparent; color: var(--c-text-mute); }
    .btn-ghost:hover:not(:disabled) { background: var(--c-off-white); color: var(--c-text); }
    .btn-success    { background: var(--c-teal); color: white; border-color: var(--c-teal); }
    .btn-success:hover:not(:disabled) { background: #00876F; border-color: #00876F; }
    .btn-danger     { background: var(--c-danger); color: white; border-color: var(--c-danger); }
    .btn-danger:hover:not(:disabled) { background: #dc2626; }
    .btn-link       { background: transparent; border: 0; color: var(--c-primary); padding: 0; height: auto; font-weight: 600; }
    .btn-link:hover { text-decoration: underline; }

    /* ============================================================
       PILL / BADGE
       ============================================================ */
    .pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.02em; line-height: 1.6;
      white-space: nowrap;
    }
    .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .pill.draft     { background: rgba(100,116,139,0.12); color: var(--c-slate); }
    .pill.pending   { background: var(--c-warning-08);    color: #92400e; }
    .pill.approved  { background: var(--c-teal-08);       color: var(--c-teal); }
    .pill.sent      { background: rgba(124,58,237,0.10);  color: var(--c-purple); }
    .pill.rejected  { background: var(--c-danger-08);     color: var(--c-danger); }
    .pill.cancelled { background: rgba(100,116,139,0.12); color: var(--c-slate); }

    /* ============================================================
       CARD
       ============================================================ */
    .card {
      background: var(--c-white);
      border: 1px solid var(--c-border);
      border-radius: var(--r-lg);
      overflow: hidden;
    }
    .card-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--c-border-soft);
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .card-title { font-size: 14px; font-weight: 700; color: var(--c-navy); }
    .card-body { padding: 16px 18px; }
    .card-body.flush { padding: 0; }

    /* ============================================================
       INPUT / SELECT
       ============================================================ */
    .input, .select {
      height: 34px;
      background: var(--c-white);
      border: 1px solid var(--c-border);
      border-radius: var(--r);
      padding: 0 12px;
      font-size: 13px;
      color: var(--c-text);
      transition: all 0.15s;
      width: 100%;
    }
    .input::placeholder { color: var(--c-text-soft); }
    .input:focus, .select:focus {
      outline: none;
      border-color: var(--c-primary);
      box-shadow: 0 0 0 3px var(--c-primary-12);
    }
    label.required::after { content: ' *'; color: var(--c-danger); }

    /* ============================================================
       FORM GRID + FIELD (used in wizard + view drawer)
       ============================================================ */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
    .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    .lbl { font-size: 12px; font-weight: 500; color: var(--c-navy); display: block; }

    /* Read-only field display (in view drawer summary) */
    .field-readonly { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .lbl-readonly { font-size: 11px; color: var(--c-text-mute); font-weight: 500; }
    .val-readonly { font-size: 13px; color: var(--c-navy); font-weight: 500; line-height: 1.35; word-break: break-word; }

    /* Combobox dropdown */
    .suggest-list {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: white; border: 1px solid var(--c-border); border-radius: var(--r);
      box-shadow: var(--sh-md);
      max-height: 320px; overflow-y: auto; z-index: 60;
    }
    .suggest-list.hidden { display: none; }
    .combo-option { padding: 8px 14px; cursor: pointer; border-bottom: 1px solid var(--c-border-soft); transition: background 100ms; }
    .combo-option:last-child { border-bottom: none; }
    .combo-option:hover { background: var(--c-primary-04); }
    .combo-option .opt-primary { font-size: 13px; font-weight: 600; color: var(--c-navy); }
    .combo-option .opt-secondary { font-size: 11.5px; color: var(--c-text-mute); }
    .combo-option mark { background: rgba(11,92,255,0.15); color: var(--c-primary); padding: 0; font-weight: 700; }

    /* ============================================================
       TABS
       ============================================================ */
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--c-border); margin-bottom: 16px; }
    .tab {
      background: transparent; border: none;
      border-bottom: 2px solid transparent;
      padding: 8px 14px;
      font-size: 13px; font-weight: 500; color: var(--c-text-mute);
      cursor: pointer; margin-bottom: -1px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .tab:hover { color: var(--c-text); }
    .tab.on { color: var(--c-primary); border-bottom-color: var(--c-primary); font-weight: 600; }

    /* ============================================================
       TABLE
       ============================================================ */
    .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tbl th {
      text-align: left; padding: 10px 14px;
      font-size: 10.5px; font-weight: 700;
      color: var(--c-text-mute);
      background: var(--c-off-white);
      border-bottom: 1px solid var(--c-border);
      text-transform: uppercase; letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .tbl td {
      padding: 7px 12px;
      border-bottom: 1px solid var(--c-border-soft);
      color: var(--c-text);
      vertical-align: middle;
    }
    .tbl tbody tr { transition: background 0.1s; cursor: pointer; }
    .tbl tbody tr:hover { background: var(--c-off-white); }
    .tbl tbody tr:last-child td { border-bottom: none; }
    .tbl-name { font-weight: 600; color: var(--c-navy); }
    .tbl-meta { font-size: 11px; color: var(--c-text-mute); margin-top: 1px; }
    .tbl-mono { font-family: ui-monospace, monospace; font-size: 12px; }
    .tbl-num { font-variant-numeric: tabular-nums; text-align: right; }
    .tbl-th-sortable { cursor: pointer; user-select: none; }
    .tbl-th-sortable:hover { color: var(--c-text); }

    /* Progress bar */
    .progress-bar {
      width: 64px; height: 6px;
      background: var(--c-border-soft);
      border-radius: 999px;
      overflow: hidden;
      display: inline-block;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--c-teal);
      border-radius: 999px;
      transition: width 200ms;
    }
    .progress-bar-fill.pending { background: var(--c-warning); }
    .progress-bar-fill.zero { background: var(--c-border); }

    /* ============================================================
       STEPPER
       ============================================================ */
    .stepper { display: flex; align-items: flex-start; gap: 0; width: 100%; }
    .stepper-item {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      position: relative; min-width: 0;
    }
    .stepper-circle {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600;
      background: var(--c-white); color: var(--c-text-soft);
      border: 2px solid var(--c-border);
      transition: all 200ms; z-index: 2;
    }
    .stepper-item.active .stepper-circle {
      background: var(--c-primary); color: white; border-color: var(--c-primary);
      box-shadow: 0 0 0 4px var(--c-primary-12);
    }
    .stepper-item.done .stepper-circle {
      background: var(--c-primary); color: white; border-color: var(--c-primary);
    }
    .stepper-label {
      margin-top: 8px; font-size: 12px; font-weight: 500;
      color: var(--c-text-soft); text-align: center; line-height: 1.3;
      transition: color 200ms;
    }
    .stepper-item.active .stepper-label { color: var(--c-navy); font-weight: 600; }
    .stepper-item.done .stepper-label { color: var(--c-text-mute); }
    .stepper-item:not(:last-child)::after {
      content: ''; position: absolute;
      top: 15px; left: 50%; right: -50%; height: 2px;
      background: var(--c-border); z-index: 1;
    }
    .stepper-item.done:not(:last-child)::after { background: var(--c-primary); }

    /* ============================================================
       DRAWER + MODAL — Self-contained CSS (don't depend on Tailwind utilities)
       ============================================================ */
    .overlay-wrap { position: fixed; inset: 0; z-index: 50; }
    .backdrop { position: absolute; inset: 0; background-color: rgba(0,0,0,0.45); cursor: pointer; }
    .drawer-panel {
      position: absolute; right: 0; top: 0;
      height: 100%; width: 100%;
      max-width: 920px;
      background: white;
      box-shadow: var(--sh-xl);
      display: flex; flex-direction: column;
    }
    .drawer-panel.standard { max-width: 680px; }
    .modal-overlay {
      position: fixed; inset: 0; z-index: 60;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .hidden { display: none !important; }

    .drawer-enter { transform: translateX(100%); }
    .drawer-active { transform: translateX(0); transition: transform 250ms ease-out; }

    @keyframes slide-in { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .animate-slide-in { animation: slide-in 200ms ease-out; }

    /* Slide-down animation for expandable line panel (Pattern E) */
    @keyframes line-expand-slide {
      from {
        opacity: 0;
        transform: translateY(-8px);
        max-height: 0;
      }
      to {
        opacity: 1;
        transform: translateY(0);
        max-height: 600px;
      }
    }
    @keyframes line-collapse-slide {
      from {
        opacity: 1;
        transform: translateY(0);
        max-height: 600px;
      }
      to {
        opacity: 0;
        transform: translateY(-8px);
        max-height: 0;
      }
    }
    .line-expand-panel {
      animation: line-expand-slide 220ms cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: top;
      overflow: hidden;
    }
    .line-collapse-panel {
      animation: line-collapse-slide 200ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
      transform-origin: top;
      overflow: hidden;
    }

    /* ============================================================
       UPLOAD ZONE
       ============================================================ */
    .upload-zone {
      border: 2px dashed var(--c-border);
      border-radius: var(--r-lg);
      padding: 32px 16px;
      text-align: center;
      background: #FAFBFD;
      cursor: pointer;
      transition: all 150ms;
    }
    .upload-zone:hover { border-color: var(--c-primary); background: var(--c-primary-08); }
    .upload-zone.has-files { padding: 16px; }

    /* ============================================================
       FORM GRID
       ============================================================ */
    .form-grp {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 14px 18px;
    }
    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-field label {
      font-size: 12.5px; font-weight: 500; color: var(--c-navy);
      display: flex; align-items: center; gap: 4px;
    }
    .form-field-help {
      font-size: 11px; color: var(--c-text-soft);
      display: flex; align-items: center; gap: 4px;
    }

    /* Toggle */
    .toggle {
      position: relative; display: inline-block;
      width: 36px; height: 20px;
      flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--c-border);
      border-radius: 20px;
      transition: 200ms;
    }
    .toggle-slider::before {
      position: absolute; content: '';
      height: 14px; width: 14px;
      left: 3px; bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 200ms;
    }
    .toggle input:checked + .toggle-slider { background-color: var(--c-primary); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(16px); }

    /* Section divider for wizard step 2 */
    .section-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px;
      background: var(--c-off-white);
      border: 1px solid var(--c-border);
      border-radius: var(--r);
      margin-bottom: 10px;
    }
    .section-label { font-size: 13px; font-weight: 500; color: var(--c-navy); display: flex; align-items: center; gap: 8px; }

    mark { background: #FEF3C7; color: var(--c-navy); border-radius: 2px; padding: 0 2px; }

          { vendor_id: 'VND-2025-0010', vendor_name: 'บริษัท สิบทรัพย์ จำกัด',     won: false, line_count: 0, total: 0,       po_status: 'NONE',     po_no: null },

        vendors: [
          { vendor_id: 'VND-2026-0007', vendor_name: 'บริษัท ลักษโนย จำกัด มหาชน', won: true, line_count: 2, total: 12000.00, po_status: 'CREATED', po_no: 'PO-2604-00018' },
          { vendor_id: 'VND-2026-1123', vendor_name: 'บริษัท เกสดี จำกัด',         won: true, line_count: 1, total: 3000.00,  po_status: 'NONE',    po_no: null },
        ]},
    ];

    // ============================================================
    //  Payment Term master (F-PAYMENT-TERM-001) — เฉพาะที่ use_in มี 'po'
    //  7 ประเภท · PO ใช้ได้ 8 records (ตัด EOM30/DEP30/DIRECT-UTIL ที่เป็นของ AP/SO)
    // ============================================================
    const TERM_TYPE = {
      full_prepay:      { label: 'ชำระเต็มก่อนส่ง',     trig: 'after_full' },
      full_postpay:     { label: 'ชำระเต็มหลังรับ',     trig: 'immediate' },
      deposit:          { label: 'มัดจำ + ส่วนเหลือ',   trig: 'after_deposit' },
      installment:      { label: 'แบ่งงวด',             trig: 'immediate' },
      partial_delivery: { label: 'ทยอยส่ง',            trig: 'immediate' },
      credit:           { label: 'เครดิต',             trig: 'immediate' },
    };
    const PAYMENT_TERMS = [
      { code:'NET30',   name:'เครดิต 30 วัน',            type:'credit',           net_days:30, due_basis:'invoice_date', is_default:true },
      { code:'NET60',   name:'เครดิต 60 วัน',            type:'credit',           net_days:60, due_basis:'invoice_date' },
      { code:'2-10N30', name:'เครดิต 30 วัน ลดเร็ว 2%',   type:'credit',           net_days:30, discount_pct:2, discount_days:10, due_basis:'invoice_date' },
      { code:'POSTPAY', name:'ชำระเต็มหลังรับของ',        type:'full_postpay',     net_days:0,  due_basis:'delivery' },
      { code:'PREPAY',  name:'ชำระเต็มก่อนส่ง 100%',       type:'full_prepay',      due_basis:'invoice_date' },
      { code:'DEP50',   name:'มัดจำ 50% ที่เหลือ 30 วัน',  type:'deposit',          deposit_method:'percent', deposit_value:50, net_days:30, remaining_timing:'after_receipt', due_basis:'invoice_date' },
      { code:'INST3',   name:'แบ่ง 3 งวด (40/30/30)',     type:'installment',      installments:[{pct:40,days:0},{pct:30,days:30},{pct:30,days:60}], due_basis:'invoice_date' },
      { code:'PARTIAL', name:'ทยอยส่ง จ่ายตามรับจริง',     type:'partial_delivery', due_basis:'delivery' },
    ];
    const termByCode = c => PAYMENT_TERMS.find(t => t.code === c) || null;
    function addDays(iso, n){ if(!iso) return ''; const d=new Date(iso); d.setDate(d.getDate()+(+n||0)); return d.toISOString().slice(0,10); }
    function endOfMonth(iso){ if(!iso) return ''; const d=new Date(iso); return new Date(d.getFullYear(), d.getMonth()+1, 0).toISOString().slice(0,10); }
    // คำอธิบายเงื่อนไข (human readable)
    function termSummary(t){ if(!t) return '—';
      const basis = t.due_basis==='delivery' ? 'นับจากวันรับของ' : t.due_basis==='eom' ? 'นับจากสิ้นเดือน' : 'นับจากวันที่ใบแจ้งหนี้';
      switch(t.type){
        case 'credit': { let s=`เครดิต ${t.net_days} วัน (${basis})`; if(t.discount_pct) s+=` · ลดเร็ว ${t.discount_pct}% ถ้าจ่ายภายใน ${t.discount_days} วัน`; return s; }
        case 'full_prepay':  return 'ชำระเต็มจำนวน 100% ก่อนส่งของ — คลังเปิดหลังยืนยันการชำระ';
        case 'full_postpay': return t.net_days>0 ? `ส่ง/รับของก่อน · ชำระเต็มภายใน ${t.net_days} วัน (${basis})` : 'ส่ง/รับของก่อน · ชำระเต็มทันทีเมื่อรับของ';
        case 'deposit':      return `มัดจำ ${t.deposit_value}% · ส่วนที่เหลือเครดิต ${t.net_days} วัน (${t.remaining_timing==='after_receipt'?'หลังรับของ':'หลังส่งของ'})`;
        case 'installment':  return `แบ่ง ${t.installments.length} งวด: ${t.installments.map(i=>i.pct+'%').join(' / ')} (รวม 100%)`;
        case 'partial_delivery': return 'ทยอยส่งหลายรอบ · ชำระตามจำนวนที่รับจริงแต่ละรอบ (ไม่มี schedule ตายตัว)';
        default: return t.name||'—';
      }
    }
    // คำนวณ/อธิบายวันครบกำหนดชำระ
    function dueText(code, po_date, delivery_date){ const t=termByCode(code); if(!t) return '—';
      const base = t.due_basis==='delivery' ? (delivery_date||po_date) : t.due_basis==='eom' ? endOfMonth(po_date) : po_date;
      switch(t.type){
        case 'credit':       return formatThaiDate(addDays(base, t.net_days)) + (t.discount_pct?` · ลด ${t.discount_pct}% ภายใน ${formatThaiDate(addDays(base,t.discount_days))}`:'');
        case 'full_postpay': return t.net_days>0 ? formatThaiDate(addDays(base, t.net_days)) : 'ทันทีเมื่อรับของ';
        case 'full_prepay':  return 'ก่อนส่งของ (จ่ายล่วงหน้า)';
        case 'deposit':      return `มัดจำเมื่อสั่งซื้อ · ส่วนที่เหลือ ${formatThaiDate(addDays(delivery_date||po_date, t.net_days))}`;
        case 'installment':  return t.installments.map((i,idx)=>`งวด${idx+1} ${i.pct}% (${i.days?formatThaiDate(addDays(base,i.days)):'เมื่อสร้างเอกสาร'})`).join(' · ');
        case 'partial_delivery': return 'ตามแต่ละรอบส่งมอบ';
        default: return '—';
      }
    }

    // GRN trigger ตาม payment type (Cheat Sheet D02)
    function grnTriggerText(type){
      if (type === 'full_prepay') return 'หลังยืนยันการชำระ (PV) — จ่ายครบก่อนเปิดรับของ';
      if (type === 'deposit')     return 'หลังชำระมัดจำ (PV มัดจำ) — เปิดรับของ';
      return 'ทันทีหลัง PO อนุมัติ';
    }
    // แผนการชำระเงินตาม payment type → [{label, amount|null, when}]
    function paymentPlan(t, total){
      const T = total || 0;
      switch(t.type){
        case 'full_prepay':  return [{ label:'ชำระเต็มจำนวน 100%', amount:T, when:'ก่อนส่งของ' }];
        case 'full_postpay': return [{ label:'ชำระเต็มจำนวน 100%', amount:T, when: t.net_days>0?`ภายใน ${t.net_days} วันหลังรับของ`:'ทันทีเมื่อรับของ' }];
        case 'credit':       return [{ label:`ชำระเต็มจำนวน (เครดิต ${t.net_days} วัน)`, amount:T, when:`ภายใน due date${t.discount_pct?` · ลด ${t.discount_pct}% ถ้าจ่ายใน ${t.discount_days} วัน`:''}` }];
        case 'deposit': { const dep=Math.round(T*t.deposit_value)/100; return [
          { label:`มัดจำ ${t.deposit_value}%`, amount:dep, when:'ตอนสั่งซื้อ' },
          { label:'ส่วนที่เหลือ', amount:Math.round((T-dep)*100)/100, when:`เครดิต ${t.net_days} วัน ${t.remaining_timing==='after_receipt'?'หลังรับของ':'หลังส่งของ'}` } ]; }
        case 'installment':  return t.installments.map((i,idx)=>({ label:`งวดที่ ${idx+1} (${i.pct}%)`, amount:Math.round(T*i.pct)/100, when: i.days?`หลังส่ง ${i.days} วัน`:'เมื่อสร้างเอกสาร' }));
        case 'partial_delivery': return [{ label:'ชำระตามจำนวนที่รับจริง', amount:null, when:'แต่ละรอบส่งมอบ (GRN)' }];
        default: return [{ label:'ชำระเต็มจำนวน', amount:T, when:'-' }];
      }
    }
    // จำนวน "งวด/ส่วน" ที่ถือว่าจ่ายแล้ว ตาม status_payment (mock progress)
    function paidRows(statusPayment, n){ if(statusPayment==='FULL') return n; if(statusPayment==='PARTIAL') return Math.max(1, Math.floor(n/2)); return 0; }
    function renderPaymentPlan(r){
      const code = r.payment_term || (mockVendors.find(v=>v.vendor_id===r.vendor_id)||{}).payment_term || 'NET30';
      const t = termByCode(code); if(!t) return '';
      const plan = paymentPlan(t, r.grand_total);
      const done = paidRows(r.status_payment, plan.length);
      const rows = plan.map((p,i)=>{
        const paid = i < done;
        const badge = p.amount===null
          ? '<span class="pill draft">ตาม GRN</span>'
          : (paid ? '<span class="pill approved">จ่ายแล้ว</span>' : '<span class="pill draft">รอชำระ</span>');
        return `<tr>
          <td style="padding:6px 10px; color:var(--c-text-mute); vertical-align:top;">${i+1}</td>
          <td style="padding:6px 10px;"><div style="font-weight:600; color:var(--c-navy);">${p.label}</div><div style="font-size:10.5px; color:var(--c-text-mute);">${p.when}</div></td>
          <td style="padding:6px 10px; text-align:right; font-variant-numeric:tabular-nums; font-weight:600;">${p.amount===null?'<span style="color:var(--c-text-soft);">ตามจริง</span>':'฿'+formatMoney(p.amount)}</td>
          <td style="padding:6px 10px; text-align:center;">${badge}</td>
        </tr>`;
      }).join('');
      return `
        <div style="font-size: 11px; color: var(--c-text-mute); margin-bottom: 8px;">GRN Trigger: <strong style="color: var(--c-navy);">${grnTriggerText(t.type)}</strong></div>
        <div style="border:1px solid var(--c-border-soft); border-radius: var(--r); overflow:hidden;">
          <table style="width:100%; border-collapse:collapse; font-size:12.5px;">
            <thead><tr style="background:var(--c-off-white); color:var(--c-text-mute); font-size:10.5px;">
              <th style="padding:6px 10px; text-align:left; font-weight:700; width:28px;">#</th>

    // ============================================================
    //  ROUTER
    // ============================================================
    function getRoute() {
      const h = location.hash.slice(2);
      if (!h) return { name: 'list' };
      const parts = h.split('/');
      if (parts[0] === 'list') return { name: 'list' };
      if (parts[0] === 'create') return { name: 'create' };
      if (parts[0] === 'view' && parts[1]) return { name: 'view', id: parts[1] };
      return { name: 'list' };
    }
    function navigate(path) { location.hash = '#/' + path; }
    window.addEventListener('hashchange', render);

    // ============================================================
    //  SAFE LUCIDE WRAPPER + RESILIENT BOOT
    // ============================================================
    function renderIcons() {
      if (typeof lucide !== 'undefined' && lucide.createIcons) {
        try { lucide.createIcons(); } catch (e) { /* ignore */ }
      } else {
        setTimeout(renderIcons, 50);
      }
    }
    function boot() {
      if (window.__prBooted) return;
      window.__prBooted = true;
      try {
        seedRecords();
        render();
      } catch (e) {
        document.getElementById('page-content').innerHTML =
          '<div style="padding:32px;color:#EF4444;">Boot error: ' + (e.message || e) + '</div>';
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else { boot(); }
    setTimeout(boot, 1500);

    // ============================================================
    //  RENDER ENTRY
    // ============================================================
    function render() {
      const route = getRoute();
      document.getElementById('page-content').innerHTML = renderListPage();
      closeAllOverlays();
      if (route.name === 'create') {
        openCreateDrawer();
      } else if (route.name === 'view') {
        openViewDrawer(route.id);
      }
      requestAnimationFrame(renderIcons);
    }

    function getFilteredRecords() {
      let res = [...state.records];
      if (state.filters.search) {
        const q = state.filters.search.toLowerCase();
        res = res.filter(r =>
          r.po_no.toLowerCase().includes(q) ||
          r.vendor_name.toLowerCase().includes(q) ||
          (r.pr_no || '').toLowerCase().includes(q) ||
          (r.cp_no || '').toLowerCase().includes(q) ||
          r.buyer.toLowerCase().includes(q)
        );
      }
      if (state.filters.status !== 'all') res = res.filter(r => r.status_doc === state.filters.status);
      if (state.filters.delivery !== 'all') res = res.filter(r => r.status_delivery === state.filters.delivery);
      if (state.filters.payment !== 'all') res = res.filter(r => r.status_payment === state.filters.payment);
      // Sort
      const { key, dir } = state.sort || { key: 'po_date', dir: 'desc' };
      res.sort((a, b) => {
        let va = a[key], vb = b[key];
        if (typeof va === 'string') va = va.toLowerCase();
        if (typeof vb === 'string') vb = vb.toLowerCase();
        if (va < vb) return dir === 'asc' ? -1 : 1;
        if (va > vb) return dir === 'asc' ? 1 : -1;
        return 0;
      });
      return res;
    }
    function getPaginatedRecords() {
      const filtered = getFilteredRecords();

      return { items: filtered.slice(start, start + state.pagination.pageSize), total: filtered.length };

    function getPageInfo() {
      const filtered = getFilteredRecords();
      if (filtered.length === 0) return '0 รายการ';
      const start = (state.pagination.page - 1) * state.pagination.pageSize + 1;
      const end = Math.min(start + state.pagination.pageSize - 1, filtered.length);
      return `${start} – ${end} จาก ${filtered.length} รายการ`;
    }

    // Migrate legacy lines (vat_enabled/net_enabled) to vat_mode
    function migrateLine(l) {
      if (l.vat_mode) return l;  // already migrated
      let mode = 'none';
      if (l.vat_enabled && l.net_enabled) mode = 'included';
      else if (l.vat_enabled) mode = 'add';
      l.vat_mode = mode;
      return l;
    }

    // Calculate VAT for a line based on vat_mode
    // Returns { vatAmount, lineTotal }
    //   none      → no VAT, line = subtotal after discount
    //   add       → VAT added on top, line = subtotal × (1 + vat%)
    //   included  → VAT included in price, line = subtotal; VAT base = subtotal / (1 + vat%)
    function calcLineVat(l) {
      migrateLine(l);
      const subtotal = l.qty * l.unit_price;
      const discount = (l.discount_mode === 'amount')
        ? Math.min(l.discount_amt || 0, subtotal)
        : subtotal * ((l.discount_pct || 0) / 100);
      const netAmount = subtotal - discount;
      let vatAmount = 0;
      let lineTotal = netAmount;
      if (l.vat_mode === 'add') {
        vatAmount = netAmount * (l.vat_pct / 100);
        lineTotal = netAmount + vatAmount;
      } else if (l.vat_mode === 'included') {
        vatAmount = netAmount * (l.vat_pct / 100) / (1 + l.vat_pct / 100);
        lineTotal = netAmount;  // line total stays same; VAT is back-calculated
      }
      return { netAmount, vatAmount, lineTotal };
    }

            ${pr ? `<div style="font-size: 11.5px; color: var(--c-text-mute); margin-top: 3px;">จาก PR: <span class="tbl-mono" style="color: var(--c-primary); font-weight: 600;">${pr.pr_no}</span> · ${pr.desc} · ${pr.requester} · <strong style="color: var(--c-navy);">฿${formatMoney(pr.total)}</strong></div>` : ''}

        ${d.source_cp_no ? `

          </div>

                      <span style="display: inline-flex; align-items: center; gap: 3px; padding: 3px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: rgba(245,158,11,0.10); color: var(--c-warning); white-space: nowrap;"><span style="width: 4px; height: 4px; border-radius: 50%; background: var(--c-warning);"></span>ยังไม่ทำ</span>

                    ${canSelect ? `
                      <button onclick="selectVendorForPO('${v.vendor_id}')" class="btn ${isSelected ? 'btn-primary' : 'btn-secondary'} sm">

        </div>

        ` : `
        <div style="background: var(--c-off-white); border: 1px dashed var(--c-border); border-radius: var(--r); padding: 24px; text-align: center;">
          <i data-lucide="search" class="w-6 h-6" style="color: var(--c-text-soft); margin-bottom: 6px;"></i>
          <div style="font-size: 12.5px; color: var(--c-text-mute);">ค้นหา PR หรือ Comparison เพื่อเริ่มสร้าง PO</div>
          <div style="font-size: 11px; color: var(--c-text-soft); margin-top: 4px;">ระบบจะแสดงผู้ขายที่ได้รับรางวัลเมื่อเลือกเอกสารอ้างอิง</div>
        </div>
        `}
      `;
    }

    function renderSourceSuggestions() {
      const q = (sourceSearchState.query || '').toLowerCase().trim();
      const prs = mockPRs.filter(p => !q || p.pr_no.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q));
      const cps = mockComparisons.filter(c => !q || c.cp_no.toLowerCase().includes(q) || c.desc.toLowerCase().includes(q) || c.pr_no.toLowerCase().includes(q));
      if (prs.length === 0 && cps.length === 0) return `<div style="padding: 24px 16px; text-align: center; font-size: 13px; color: var(--c-text-mute);">ไม่พบเอกสารที่ตรงกับ "<strong>${q}</strong>"</div>`;
      const hl = (text) => q ? text.replace(new RegExp(`(${escapeReg(q)})`, 'gi'), '<mark>$1</mark>') : text;
      let html = '';
      if (cps.length > 0) {
        html += `<div style="padding: 6px 14px 4px; font-size: 10.5px; font-weight: 700; color: var(--c-purple); letter-spacing: 0.04em; text-transform: uppercase; background: rgba(124,58,237,0.04);">Comparison Reports (${cps.length})</div>`;
        html += cps.map(c => `
          <div onclick="selectSource('CP', '${c.cp_no}')" class="combo-option" style="cursor: pointer;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="display: inline-block; padding: 2px 6px; background: rgba(124,58,237,0.10); color: var(--c-purple); border-radius: 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.05em;">CP</span>
              <div class="opt-primary tbl-mono">${hl(c.cp_no)}</div>
            </div>
            <div class="opt-secondary" style="margin-top: 2px;">จาก PR: <span class="tbl-mono">${hl(c.pr_no)}</span> · ${hl(c.desc)}</div>
          </div>
        `).join('');
      }
      if (prs.length > 0) {
        html += `<div style="padding: 6px 14px 4px; font-size: 10.5px; font-weight: 700; color: var(--c-primary); letter-spacing: 0.04em; text-transform: uppercase; background: var(--c-primary-04);">Purchase Requests (${prs.length})</div>`;
        html += prs.map(p => `
          <div onclick="selectSource('PR', '${p.pr_no}')" class="combo-option" style="cursor: pointer;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <span style="display: inline-block; padding: 2px 6px; background: var(--c-primary-08); color: var(--c-primary); border-radius: 4px; font-size: 10px; font-weight: 700; letter-spacing: 0.05em;">PR</span>
              <div class="opt-primary tbl-mono">${hl(p.pr_no)}</div>
              ${p.has_cp ? `<span style="font-size: 10px; color: var(--c-purple);">มี CP</span>` : `<span style="font-size: 10px; color: var(--c-text-soft);">ไม่มี CP</span>`}
            </div>
            <div class="opt-secondary" style="margin-top: 2px;">${hl(p.desc)} · ${p.requester} · <strong>฿${formatMoney(p.total)}</strong></div>
          </div>
        `).join('');
      }
      return html;
    }

    function onSourceInput(val) {
      sourceSearchState.query = val;
      sourceSearchState.open = true;
      const list = document.getElementById('sourceSuggestList');
      if (list) { list.classList.remove('hidden'); list.innerHTML = renderSourceSuggestions(); renderIcons(); }
    }
    function openSourceList() {
      sourceSearchState.open = true;
      const list = document.getElementById('sourceSuggestList');
      if (list && !createWizard.data.source_pr_no && !createWizard.data.source_cp_no) {
        list.classList.remove('hidden');
        list.innerHTML = renderSourceSuggestions();
        renderIcons();
      }
    }
    function selectSource(type, id) {
      const d = createWizard.data;
      if (type === 'CP') {
        d.source_cp_no = id;
        const cp = mockComparisons.find(c => c.cp_no === id);
        if (cp) d.source_pr_no = cp.pr_no;
        d.source_type = 'CP';
      } else {
        d.source_pr_no = id;
        d.source_cp_no = null;
        d.source_type = 'PR';
      }
      d.selected_vendor_id = null;
      sourceSearchState.open = false;
      sourceSearchState.query = '';
      renderCreateDrawer();
    }
    function clearSource() {
      const d = createWizard.data;
      d.source_pr_no = null;
      d.source_cp_no = null;
      d.source_type = null;
      d.selected_vendor_id = null;
      sourceSearchState.query = '';
      sourceSearchState.open = false;
      renderCreateDrawer();
    }
    function itemUnit(it){ return it.uom || '-'; }
    // สร้างรายการสินค้าใน step 3 จากเอกสารอ้างอิง (CP awarded vendor / PR) ให้แสดงจริง
    function buildLinesFromSource(lineCount, totalAmount) {
      const n = Math.max(1, lineCount || 1);
      const per = Math.round(((totalAmount || 0) / n) * 100) / 100;
      const lines = [];
      for (let i = 0; i < n; i++) {
        const it = mockItems[i % mockItems.length];
        const l = createBlankLine();
        l.item_code = it.code; l.item_name = it.name; l.unit = itemUnit(it);
        l.qty = 1; l.unit_price = per; l.vat_mode = 'add'; l.vat_pct = 7;
        lines.push(l);
      }
      return lines;
    }
    function selectVendorForPO(vendorId) {
      const d = createWizard.data;
      d.selected_vendor_id = vendorId;
      const v = mockVendors.find(x => x.vendor_id === vendorId);
      if (v) { d.payment_term = v.payment_term; d.business_group = v.business_group; }
      // ดึง line_count + total จากเอกสารอ้างอิงแล้วสร้างรายการให้ step 3
      let lineCount = 1, total = 0;
      if (d.source_cp_no) {
        const cp = mockComparisons.find(c => c.cp_no === d.source_cp_no);
        const vr = cp && cp.vendors.find(x => x.vendor_id === vendorId);
        if (vr) { lineCount = vr.line_count || 1; total = vr.total || 0; }
      } else if (d.source_pr_no) {
        const pr = mockPRs.find(p => p.pr_no === d.source_pr_no);
        if (pr) { lineCount = 1; total = pr.total || 0; }
      }
      d.lines = buildLinesFromSource(lineCount, total);
      renderCreateDrawer();
    }

    document.addEventListener('click', (e) => {
      const sc = document.getElementById('sourceCombobox');
      if (sc && !sc.contains(e.target)) {
        sourceSearchState.open = false;
        document.getElementById('sourceSuggestList')?.classList.add('hidden');
      }
      const bc = document.getElementById('buyerCombobox');
      if (bc && !bc.contains(e.target)) {
        buyerSearchState.open = false;
        document.getElementById('buyerSuggestList')?.classList.add('hidden');
      }
      const vc = document.getElementById('vendorCombobox');
      if (vc && !vc.contains(e.target)) {
        vendorSearchState.open = false;
        document.getElementById('vendorSuggestList')?.classList.add('hidden');
      }
    });

    // ---- ผู้จัดซื้อ (Buyer) combobox — icon + ชื่อ + ตำแหน่ง (เก็บแค่ชื่อ) ----
    const mockEmployees = [
      { id: 'E-001', name: 'Tadswan Chanyarakskul', position: 'Business Analyst',    dept: 'พัฒนาธุรกิจ',        initials: 'TC' },
      { id: 'E-002', name: 'Rungtiwa Samanma',      position: 'Software Engineer',   dept: 'Software Developer', initials: 'RS' },
      { id: 'E-003', name: 'Patcharaphon Wong',     position: 'Marketing Lead',      dept: 'Marketing',          initials: 'PW' },
      { id: 'E-004', name: 'Manit Prasert',         position: 'Procurement Officer', dept: 'Procurement',        initials: 'MP' },
      { id: 'E-005', name: 'Wirat Khamfu',          position: 'IT Support',          dept: 'Software Developer', initials: 'WK' },
      { id: 'E-006', name: 'Suchada Inthorn',       position: 'HR Officer',          dept: 'Human Resource',     initials: 'SI' },
    ];
    const buyerSearchState = { query: '', open: false, highlight: 0 };
    function buyerFiltered() { const q=(buyerSearchState.query||'').toLowerCase().trim();
      return mockEmployees.filter(e => !q || e.name.toLowerCase().includes(q) || e.position.toLowerCase().includes(q) || e.dept.toLowerCase().includes(q)); }
    function renderBuyerSuggestions() {
      const q = (buyerSearchState.query || '').toLowerCase().trim();
      const filtered = buyerFiltered();
      if (filtered.length === 0) return `<div style="padding: 24px 16px; text-align: center; font-size: 13px; color: var(--c-text-mute);">ไม่พบผู้จัดซื้อที่ตรงกับ "<strong>${q}</strong>"</div>`;
      return filtered.map((e, i) => {
        const active = i === buyerSearchState.highlight;
        return `
          <button type="button" onmousedown="event.preventDefault()" onclick="selectBuyer('${e.id}')"
            style="width: 100%; text-align: left; padding: 9px 12px; background: ${active ? 'var(--c-primary-08, rgba(11,92,255,0.08))' : 'transparent'}; border: none; cursor: pointer; display: flex; align-items: center; gap: 11px; border-bottom: 1px solid var(--c-border-soft);">
            <div style="width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--c-primary), var(--c-teal)); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 600; flex-shrink: 0;">${e.initials}</div>
            <div style="flex: 1; min-width: 0;">
              <div style="font-size: 13px; font-weight: 600; color: var(--c-navy);">${e.name}</div>
              <div style="font-size: 11.5px; color: var(--c-text-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${e.position} · ${e.dept}</div>
            </div>
          </button>`;
      }).join('');
    }
    function onBuyerInput(e) {
      buyerSearchState.query = e.target.value; buyerSearchState.open = true; buyerSearchState.highlight = 0;
      if (createWizard.data.buyer && !mockEmployees.find(x => x.name === e.target.value)) createWizard.data.buyer = '';
      const list = document.getElementById('buyerSuggestList');
      if (list) { list.classList.remove('hidden'); list.innerHTML = renderBuyerSuggestions(); renderIcons(); }
    }
    function onBuyerFocus() { buyerSearchState.open = true; const l = document.getElementById('buyerSuggestList'); if (l) { l.classList.remove('hidden'); l.innerHTML = renderBuyerSuggestions(); renderIcons(); } }
    function onBuyerKey(e) {
      const list = document.getElementById('buyerSuggestList'); if (!list) return;
      const filtered = buyerFiltered();
      if (e.key === 'ArrowDown') { e.preventDefault(); buyerSearchState.highlight = Math.min(filtered.length - 1, buyerSearchState.highlight + 1); list.innerHTML = renderBuyerSuggestions(); renderIcons(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); buyerSearchState.highlight = Math.max(0, buyerSearchState.highlight - 1); list.innerHTML = renderBuyerSuggestions(); renderIcons(); }
      else if (e.key === 'Enter') { e.preventDefault(); if (filtered[buyerSearchState.highlight]) selectBuyer(filtered[buyerSearchState.highlight].id); }
      else if (e.key === 'Escape') { e.stopPropagation(); buyerSearchState.open = false; list.classList.add('hidden'); }
    }
    function selectBuyer(id) {
      const emp = mockEmployees.find(e => e.id === id);
      if (emp) { createWizard.data.buyer = emp.name; createWizard.data.dept = emp.dept; }
      buyerSearchState.open = false; buyerSearchState.query = '';
      renderCreateDrawer();
    }
    function clearBuyer() { createWizard.data.buyer = ''; buyerSearchState.query = ''; buyerSearchState.open = true; renderCreateDrawer(); setTimeout(() => document.getElementById('buyerSearchInput')?.focus(), 0); }

    // ---- ผู้ขาย (Vendor) combobox — ใช้ตอน PR-only / PO อิสระ (ไม่มี CP กำหนดผู้ชนะ) ----
    const vendorSearchState = { query: '', open: false, highlight: 0 };
    function vendorFiltered(){ const q=(vendorSearchState.query||'').toLowerCase().trim();
      return mockVendors.filter(v => !q || v.name.toLowerCase().includes(q) || v.vendor_id.toLowerCase().includes(q)); }
    function renderVendorSuggestions(){
      const q=(vendorSearchState.query||'').toLowerCase().trim(); const filtered=vendorFiltered();
      if(filtered.length===0) return `<div style="padding: 24px 16px; text-align: center; font-size: 13px; color: var(--c-text-mute);">ไม่พบผู้ขายที่ตรงกับ "<strong>${q}</strong>"</div>`;
      return filtered.map((v,i)=>{ const active=i===vendorSearchState.highlight; const tm=termByCode(v.payment_term);
        return `<button type="button" onmousedown="event.preventDefault()" onclick="selectVendorStep2('${v.vendor_id}')"
          style="width:100%; text-align:left; padding:9px 12px; background:${active?'var(--c-primary-08, rgba(11,92,255,0.08))':'transparent'}; border:none; cursor:pointer; display:flex; align-items:center; gap:11px; border-bottom:1px solid var(--c-border-soft);">
          <div style="width:34px; height:34px; border-radius:8px; background:rgba(11,92,255,0.08); color:var(--c-primary); display:grid; place-items:center; flex-shrink:0;"><i data-lucide="building-2" class="w-4 h-4"></i></div>
          <div style="flex:1; min-width:0;">
            <div style="font-size:13px; font-weight:600; color:var(--c-navy);">${v.name}</div>
            <div style="font-size:11.5px; color:var(--c-text-mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${v.vendor_id} · ${tm?tm.code:v.payment_term}</div>
          </div>
        </button>`; }).join('');
    }
    function onVendorInput(e){ vendorSearchState.query=e.target.value; vendorSearchState.open=true; vendorSearchState.highlight=0;
      if(createWizard.data.selected_vendor_id && !mockVendors.find(x=>`${x.vendor_id} - ${x.name}`===e.target.value)) createWizard.data.selected_vendor_id=null;
      const l=document.getElementById('vendorSuggestList'); if(l){ l.classList.remove('hidden'); l.innerHTML=renderVendorSuggestions(); renderIcons(); } }
    function onVendorFocus(){ vendorSearchState.open=true; const l=document.getElementById('vendorSuggestList'); if(l){ l.classList.remove('hidden'); l.innerHTML=renderVendorSuggestions(); renderIcons(); } }
    function onVendorKey(e){ const list=document.getElementById('vendorSuggestList'); if(!list) return; const filtered=vendorFiltered();
      if(e.key==='ArrowDown'){ e.preventDefault(); vendorSearchState.highlight=Math.min(filtered.length-1, vendorSearchState.highlight+1); list.innerHTML=renderVendorSuggestions(); renderIcons(); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); vendorSearchState.highlight=Math.max(0, vendorSearchState.highlight-1); list.innerHTML=renderVendorSuggestions(); renderIcons(); }
      else if(e.key==='Enter'){ e.preventDefault(); if(filtered[vendorSearchState.highlight]) selectVendorStep2(filtered[vendorSearchState.highlight].vendor_id); }
      else if(e.key==='Escape'){ e.stopPropagation(); vendorSearchState.open=false; list.classList.add('hidden'); } }
    function selectVendorStep2(id){

    function renderLineRow(l, idx) {
      migrateLine(l);
      const itemMatch = mockItems.find(i => i.code === l.item_code);
      const itemName = itemMatch ? itemMatch.name : (l.item_name || '');
      const { vatAmount, lineTotal: lineTotalDisplay } = calcLineVat(l);
      const isExpanded = createWizard.expandedLineId === l.id;

      // ภาษี column — single mutually-exclusive badge based on vat_mode
      //   'none'     → "ไม่คิด"   (gray)
      //   'add'      → "VAT 7%"  (purple — price excludes VAT, will be added)
      //   'included' → "NET 7%"  (primary blue — price includes VAT, calculated backwards)
      let taxBadge;
      if (l.vat_mode === 'none') {
        taxBadge = `<span style="display: inline-flex; align-items: center; gap: 3px; font-size: 11px; padding: 3px 8px; border-radius: 999px; background: rgba(100,116,139,0.10); color: var(--c-text-mute); font-weight: 600; line-height: 1.4; white-space: nowrap;"><span style="width: 4px; height: 4px; border-radius: 50%; background: var(--c-text-mute);"></span>ไม่คิด</span>`;
      } else if (l.vat_mode === 'included') {
        taxBadge = `<span style="display: inline-flex; align-items: center; gap: 3px; font-size: 11px; padding: 3px 8px; border-radius: 999px; background: rgba(11,92,255,0.10); color: var(--c-primary); font-weight: 600; line-height: 1.4; white-space: nowrap;" title="ราคา/หน่วย รวม VAT แล้ว — VAT คำนวณย้อน"><span style="width: 4px; height: 4px; border-radius: 50%; background: var(--c-primary);"></span>NET ${l.vat_pct}%</span>`;
      } else {
        taxBadge = `<span style="display: inline-flex; align-items: center; gap: 3px; font-size: 11px; padding: 3px 8px; border-radius: 999px; background: rgba(124,58,237,0.10); color: var(--c-purple); font-weight: 600; line-height: 1.4; white-space: nowrap;" title="VAT ${l.vat_pct}% (จะคำนวณเพิ่มจากราคา)"><span style="width: 4px; height: 4px; border-radius: 50%; background: var(--c-purple);"></span>VAT ${l.vat_pct}%</span>`;
      }

      const noteIndicator = l.note

        <tr style="background: ${isExpanded ? 'var(--c-primary-08)' : 'transparent'}; cursor: default;">
