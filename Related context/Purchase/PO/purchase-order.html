          <td style="padding-right: 12px;">
            <div style="position: relative;" class="item-combo" data-line-id="${l.id}">
              <input type="text" id="item-input-${l.id}" autocomplete="off"
                value="${itemName || l.item_code || ''}"
                placeholder="ค้นหารหัสหรือชื่อสินค้า..."
                oninput="onItemInput(event, '${l.id}')"
                onfocus="onItemFocus('${l.id}')"
                class="input" style="height: 32px; font-size: 12.5px; padding: 0 10px;">
            </div>
            ${noteIndicator ? `<div>${noteIndicator}</div>` : ''}
          </td>
          <td style="text-align: right; vertical-align: middle;">
            <input type="number" min="1" step="1" value="${l.qty}"
              oninput="updateLine('${l.id}','qty',this.value)"
              class="input num" style="height: 30px; font-size: 12.5px; text-align: right; padding: 0 8px;">
          </td>
          <td style="vertical-align: middle; font-size: 12px; color: var(--c-text-mute);">${l.unit || '-'}</td>
          <td style="vertical-align: middle;">
            <input type="number" min="0" step="0.01" value="${l.unit_price || ''}"
              oninput="updateLine('${l.id}','unit_price',this.value)"
              class="input num" style="height: 30px; font-size: 12.5px; text-align: right; padding: 0 8px;">
          </td>
          <td style="vertical-align: middle;">
            <div style="display: flex; align-items: center; gap: 4px; justify-content: flex-end;">
              <input type="number" min="0" ${(l.discount_mode||'percent')==='percent' ? 'max="100"' : ''} step="0.01"
                value="${(l.discount_mode||'percent')==='amount' ? (l.discount_amt || 0) : (l.discount_pct || 0)}"
                oninput="updateLine('${l.id}','${(l.discount_mode||'percent')==='amount' ? 'discount_amt' : 'discount_pct'}',this.value)"
                class="input num" style="height: 30px; font-size: 12.5px; text-align: right; padding: 0 6px; min-width: 0; width: 100%;">
              <div style="display: inline-flex; border: 1px solid var(--c-border); border-radius: 6px; overflow: hidden; flex-shrink: 0;">
                <button type="button" onclick="updateLine('${l.id}','discount_mode','amount')" title="ส่วนลดเป็นบาท"
                  style="width: 22px; height: 30px; border: 0; cursor: pointer; font-size: 12px; font-weight: 700; background: ${(l.discount_mode||'percent')==='amount' ? 'var(--c-primary)' : 'transparent'}; color: ${(l.discount_mode||'percent')==='amount' ? '#fff' : 'var(--c-text-mute)'};">฿</button>
                <button type="button" onclick="updateLine('${l.id}','discount_mode','percent')" title="ส่วนลดเป็นเปอร์เซ็นต์"
                  style="width: 22px; height: 30px; border: 0; border-left: 1px solid var(--c-border); cursor: pointer; font-size: 12px; font-weight: 700; background: ${(l.discount_mode||'percent')==='percent' ? 'var(--c-primary)' : 'transparent'}; color: ${(l.discount_mode||'percent')==='percent' ? '#fff' : 'var(--c-text-mute)'};">%</button>
              </div>
            </div>
          </td>
          <td style="text-align: center; vertical-align: middle;">${taxBadge}</td>
          <td style="text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--c-navy); font-size: 13px; vertical-align: middle;">
            ฿${formatMoney(lineTotalDisplay)}
          </td>
          <td style="text-align: center; padding-right: 8px; vertical-align: middle;">
            <div style="display: inline-flex; gap: 2px;">
              <button onclick="toggleLineExpand('${l.id}')" class="btn btn-ghost sm" style="padding: 0 6px; ${isExpanded ? 'background: var(--c-primary); color: white;' : ''}" title="${isExpanded ? 'ปิดตัวเลือกขั้นสูง' : 'เปิดตัวเลือกขั้นสูง (Net / VAT / หมายเหตุ)'}">
                <i data-lucide="${isExpanded ? 'chevron-up' : 'chevron-down'}" class="w-3.5 h-3.5"></i>
              </button>
              <button onclick="removeLine('${l.id}')" class="btn btn-ghost sm" style="padding: 0 6px; color: var(--c-danger);" title="ลบรายการ">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </td>
        </tr>
        ${isExpanded ? `
        <!-- Expanded advanced row -->
        <tr class="line-expand-panel-anchor" data-line-id="${l.id}" style="background: var(--c-primary-08);">
          <td colspan="9" style="padding: 0 16px 14px 16px; border-bottom: 1px solid var(--c-primary-12);">
            <div class="line-expand-panel-inner ${createWizard._justOpenedLineId === l.id ? 'line-expand-panel' : ''}" style="background: white; border: 1px solid var(--c-primary-12); border-radius: var(--r); padding: 14px;">
              <div style="display: flex; align-items: center; gap: 6px; margin-bottom: 10px; font-size: 11.5px; color: var(--c-primary); font-weight: 600;">
                <i data-lucide="settings-2" class="w-3.5 h-3.5"></i>
                <span>ตัวเลือกขั้นสูง — รายการ #${idx + 1}</span>
              </div>
              <div style="display: grid; grid-template-columns: 1fr; gap: 12px;">
                <!-- 3-mode VAT picker — lean radio cards (single row, no description) -->
                <div>
                  <label style="display: block; font-size: 11.5px; font-weight: 500; color: var(--c-navy); margin-bottom: 6px;">
                    การคิด VAT
                    <span style="color: var(--c-text-mute); font-weight: 400; font-size: 11px;">— เลือกได้แค่ 1 แบบเท่านั้น</span>
                  </label>
                  <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px;">
                    <!-- Mode 1: none -->
                    <button onclick="updateLine('${l.id}','vat_mode','none')"
                      title="สินค้ายกเว้น / ไม่มีภาษี"
                      style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: var(--r); cursor: pointer; text-align: left;
                             border: ${l.vat_mode === 'none' ? '2px solid var(--c-text-mute)' : '1px solid var(--c-border)'};
                             background: ${l.vat_mode === 'none' ? 'rgba(100,116,139,0.08)' : 'white'};
                             transition: all 150ms ease-out;">
                      <span style="flex-shrink: 0; width: 16px; height: 16px; border-radius: 50%; border: 2px solid ${l.vat_mode === 'none' ? 'var(--c-text-mute)' : 'var(--c-border)'}; display: grid; place-items: center;">
                        ${l.vat_mode === 'none' ? '<span style="width: 8px; height: 8px; border-radius: 50%; background: var(--c-text-mute);"></span>' : ''}
                      </span>
                      <span style="font-size: 13px; font-weight: 600; color: var(--c-navy);">ไม่คิด VAT</span>
                    </button>

                    <!-- Mode 2: add -->
                    <button onclick="updateLine('${l.id}','vat_mode','add')"
                      title="ราคายังไม่รวม VAT — ระบบจะคิด VAT บวกเพิ่ม"
                      style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: var(--r); cursor: pointer; text-align: left;
                             border: ${l.vat_mode === 'add' ? '2px solid var(--c-purple)' : '1px solid var(--c-border)'};
                             background: ${l.vat_mode === 'add' ? 'rgba(124,58,237,0.06)' : 'white'};
                             transition: all 150ms ease-out;">
                      <span style="flex-shrink: 0; width: 16px; height: 16px; border-radius: 50%; border: 2px solid ${l.vat_mode === 'add' ? 'var(--c-purple)' : 'var(--c-border)'}; display: grid; place-items: center;">
                        ${l.vat_mode === 'add' ? '<span style="width: 8px; height: 8px; border-radius: 50%; background: var(--c-purple);"></span>' : ''}
                      </span>
                      <span style="font-size: 13px; font-weight: 600; color: var(--c-navy);">VAT (ปกติ)</span>
                    </button>

                    <!-- Mode 3: included -->
                    <button onclick="updateLine('${l.id}','vat_mode','included')"
                      title="ราคารวม VAT แล้ว — ระบบจะคำนวณ VAT ย้อนกลับ"
                      style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: var(--r); cursor: pointer; text-align: left;
                             border: ${l.vat_mode === 'included' ? '2px solid var(--c-primary)' : '1px solid var(--c-border)'};
                             background: ${l.vat_mode === 'included' ? 'var(--c-primary-08)' : 'white'};
                             transition: all 150ms ease-out;">
                      <span style="flex-shrink: 0; width: 16px; height: 16px; border-radius: 50%; border: 2px solid ${l.vat_mode === 'included' ? 'var(--c-primary)' : 'var(--c-border)'}; display: grid; place-items: center;">
                        ${l.vat_mode === 'included' ? '<span style="width: 8px; height: 8px; border-radius: 50%; background: var(--c-primary);"></span>' : ''}
                      </span>
                      <span style="font-size: 13px; font-weight: 600; color: var(--c-navy);">NET (รวม VAT)</span>
                    </button>
                  </div>
                </div>

                <!-- VAT % rate + computed amount (only when vat_mode != 'none') -->
                ${l.vat_mode !== 'none' ? `
                  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                    <div>
                      <label style="display: block; font-size: 11.5px; font-weight: 500; color: var(--c-navy); margin-bottom: 4px;">อัตรา VAT (%)</label>
                      <div style="display: flex; gap: 6px;">
                        ${[0, 7, 10].map(p => `
                          <button onclick="updateLine('${l.id}','vat_pct',${p})"
                            class="btn ${l.vat_pct === p ? 'btn-primary' : 'btn-secondary'} sm">${p}%</button>
                        `).join('')}
                        <input type="number" min="0" max="100" step="0.01" value="${l.vat_pct}"
                          oninput="updateLine('${l.id}','vat_pct',this.value)"
                          class="input num" style="height: 28px; flex: 1; font-size: 12px; text-align: right; padding: 0 8px;">
                      </div>
                    </div>
                    <div>
                      <label style="display: block; font-size: 11.5px; font-weight: 500; color: var(--c-navy); margin-bottom: 4px;">
                        จำนวน VAT (คำนวณ)
                        ${l.vat_mode === 'included' ? '<span style="color: var(--c-text-soft); font-weight: 400;">— จากราคารวม</span>' : ''}
                      </label>
                      <div class="input num" style="background: var(--c-off-white); display: flex; align-items: center; justify-content: flex-end; height: 30px; font-weight: 600; color: var(--c-purple);">
                        ฿${formatMoney(vatAmount)}
                      </div>
                    </div>
                  </div>
                ` : ''}

                <!-- Note (full width) -->
                <div>
                  <label style="display: block; font-size: 11.5px; font-weight: 500; color: var(--c-navy); margin-bottom: 4px;">หมายเหตุรายการ</label>
                  <input type="text" value="${l.note || ''}"
                    oninput="updateLine('${l.id}','note',this.value)"
                    placeholder="เช่น สี, ขนาด, สเปคเพิ่มเติม"
                    class="input" style="height: 32px; font-size: 12.5px;">
                </div>
              </div>
              <div style="display: flex; justify-content: flex-end; margin-top: 10px;">
                <button onclick="toggleLineExpand('${l.id}')" class="btn btn-ghost sm">
                  <i data-lucide="chevron-up" class="w-3.5 h-3.5"></i>
                  <span>ปิดตัวเลือกขั้นสูง</span>
                </button>
              </div>
            </div>
          </td>
        </tr>
        ` : ''}
      `;
    }

    function toggleLineExpand(lineId) {
      const wasOpen = createWizard.expandedLineId === lineId;

      if (wasOpen) {
        // Collapse: find the existing panel, apply collapse animation, then remove after animation
        const existingPanel = document.querySelector(`.line-expand-panel-anchor[data-line-id="${lineId}"] .line-expand-panel-inner`);
        if (existingPanel) {
          existingPanel.classList.add('line-collapse-panel');
          setTimeout(() => {
            createWizard.expandedLineId = null;
            createWizard._justOpenedLineId = null;
            renderCreateDrawer();
          }, 200);
          return;
        }
        // Fallback if panel not found
        createWizard.expandedLineId = null;
        createWizard._justOpenedLineId = null;
        renderCreateDrawer();
      } else {
        // Open: if another line was open, collapse it first (instantly), then open this one with animation
        createWizard.expandedLineId = lineId;
        createWizard._justOpenedLineId = lineId;
        renderCreateDrawer();
        createWizard._justOpenedLineId = null;
      }
    }

    // Lightweight summary updater — only re-renders the summary card (avoids losing focus)
    function updateLineSummaryOnly() {
      const wrap = document.getElementById('line-summary-wrap');
      if (wrap) wrap.innerHTML = renderLineSummary();
    }

    function renderLineSummary() {
      const lines = createWizard.data.lines;
      const wht = createWizard.data.wht_enabled;
      const whtPct = createWizard.data.wht_pct || 0;
      const endbillEnabled = createWizard.data.endbill_discount_enabled;
      const endbillMode = createWizard.data.endbill_discount_mode;
      const endbillValue = createWizard.data.endbill_discount_value || 0;

      let priceBeforeVat = 0;
      let totalVat = 0;
      lines.forEach(l => {
        migrateLine(l);
        const { netAmount, vatAmount } = calcLineVat(l);
        // priceBeforeVat = revenue net of VAT
        //   'none'     → no VAT, base = netAmount
        //   'add'      → price excludes VAT, base = netAmount
        //   'included' → price includes VAT, base = netAmount - vatAmount
        if (l.vat_mode === 'included') {
          priceBeforeVat += netAmount - vatAmount;
        } else {
          priceBeforeVat += netAmount;
        }
        totalVat += vatAmount;
      });

      const subtotalAfterVat = priceBeforeVat + totalVat;
      const whtAmount = wht ? priceBeforeVat * (whtPct / 100) : 0;
      let endbillAmount = 0;
      if (endbillEnabled) {
        if (endbillMode === 'amount') endbillAmount = endbillValue;
        else endbillAmount = subtotalAfterVat * (endbillValue / 100);
      }
      const grandTotal = subtotalAfterVat - whtAmount - endbillAmount;

      return `
        <div class="card">
          <div class="card-head" style="padding: 12px 18px;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <i data-lucide="calculator" class="w-4 h-4" style="color: var(--c-primary);"></i>
              <div class="card-title">สรุปยอด (${lines.length} รายการ)</div>
            </div>
            <span class="pill" style="background: rgba(124,58,237,0.10); color: var(--c-purple); padding: 1px 7px; font-size: 10px; letter-spacing: 0.04em;">BY_LINE</span>
          </div>
          <div class="card-body" style="padding: 12px 18px;">
            <table style="width: 100%; font-size: 13px;">
              <tbody>
                <tr><td style="padding: 4px 0;">ราคาก่อน VAT</td><td style="text-align: right; font-variant-numeric: tabular-nums; padding: 4px 0; font-weight: 600;">฿${formatMoney(priceBeforeVat)}</td></tr>
                <tr><td style="padding: 4px 0; color: var(--c-purple);">ภาษีมูลค่าเพิ่ม (VAT)</td><td style="text-align: right; font-variant-numeric: tabular-nums; padding: 4px 0; color: var(--c-purple);">+฿${formatMoney(totalVat)}</td></tr>
                <tr style="border-top: 1px solid var(--c-border-soft);"><td style="padding: 6px 0;">ยอดรวมหลัง VAT</td><td style="text-align: right; font-variant-numeric: tabular-nums; padding: 6px 0; font-weight: 600;">฿${formatMoney(subtotalAfterVat)}</td></tr>
                ${wht ? `<tr><td style="padding: 4px 0; color: var(--c-warning);">หัก ภาษี ณ ที่จ่าย ${whtPct}%</td><td style="text-align: right; font-variant-numeric: tabular-nums; padding: 4px 0; color: var(--c-warning);">-฿${formatMoney(whtAmount)}</td></tr>` : ''}
                ${endbillEnabled ? `<tr><td style="padding: 4px 0; color: var(--c-text-mute);">ส่วนลดท้ายบิล${endbillMode === 'percent' ? ' (' + endbillValue + '%)' : ''}</td><td style="text-align: right; font-variant-numeric: tabular-nums; padding: 4px 0; color: var(--c-text-mute);">-฿${formatMoney(endbillAmount)}</td></tr>` : ''}
                <tr style="border-top: 2px solid var(--c-border);"><td style="padding: 8px 0 0; font-weight: 700; font-size: 14px;">ยอดสุทธิทั้งหมด</td><td style="text-align: right; font-variant-numeric: tabular-nums; padding: 8px 0 0; font-weight: 700; font-size: 16px; color: var(--c-primary);">฿${formatMoney(grandTotal)}</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function addLine() {
      createWizard.data.lines.push(createBlankLine());
      renderCreateDrawer();
    }
    function removeLine(id) {
      const idx = createWizard.data.lines.findIndex(l => l.id === id);
      if (idx >= 0) createWizard.data.lines.splice(idx, 1);
      if (createWizard.data.lines.length === 0) createWizard.data.lines.push(createBlankLine());
      renderCreateDrawer();
    }
    function updateLine(id, field, val) {
      const line = createWizard.data.lines.find(l => l.id === id);
      if (!line) return;
      // Save focus
      const focused = document.activeElement;
      const focusInfo = focused && focused.tagName === 'INPUT' ? {
        oninput: focused.getAttribute('oninput'),
        selStart: focused.selectionStart,
      } : null;

      if (field === 'qty' || field === 'unit_price' || field === 'discount_pct' || field === 'discount_amt' || field === 'vat_pct') {
        line[field] = parseFloat(val) || 0;
      } else if (field === 'vat_mode') {
        // Mutually exclusive: 'none' | 'add' | 'included'
        line.vat_mode = val;
        // Cleanup legacy fields if present
        delete line.net_enabled;
        delete line.vat_enabled;
      } else {
        line[field] = val;
      }
      renderCreateDrawer();

      // Restore focus
      if (focusInfo) {
        const inputs = document.querySelectorAll('input');
        for (const inp of inputs) {
          if (inp.getAttribute('oninput') === focusInfo.oninput) {
            inp.focus();
            try { inp.setSelectionRange(focusInfo.selStart, focusInfo.selStart); } catch(e) {}
            break;
          }
        }
      }
    }

    function onItemInput(e, lineId) {
      const val = e.target.value;
      const line = createWizard.data.lines.find(l => l.id === lineId);
      if (!line) return;
      line.item_code = val;
      // Auto-fill if exact match
      const match = mockItems.find(i => i.code === val);
      if (match) {
        line.item_name = match.name;
        line.unit = match.uom;
      } else {
        line.item_name = '';
        line.unit = '-';
      }
      // Show suggestions popover (lightweight — just on focus)
      showItemSuggestions(lineId, val);
    }
    function onItemFocus(lineId) {
      const line = createWizard.data.lines.find(l => l.id === lineId);
      showItemSuggestions(lineId, line?.item_code || '');
    }
    function showItemSuggestions(lineId, query) {
      // Simple click-to-fill popover — built fresh per call
      document.querySelectorAll('.item-suggest-popover').forEach(n => n.remove());
      const input = document.getElementById(`item-input-${lineId}`);
      if (!input) return;
      const q = (query || '').toLowerCase().trim();
      const filtered = mockItems.filter(i => !q || i.code.toLowerCase().includes(q) || i.name.toLowerCase().includes(q)).slice(0, 6);
      if (filtered.length === 0) return;
      const rect = input.getBoundingClientRect();
      const pop = document.createElement('div');
      pop.className = 'item-suggest-popover';
      pop.style.cssText = `position: fixed; left: ${rect.left}px; top: ${rect.bottom + 2}px; min-width: 320px; background: white; border: 1px solid var(--c-border); border-radius: var(--r); box-shadow: var(--sh-lg); z-index: 70; max-height: 240px; overflow-y: auto;`;
      pop.innerHTML = filtered.map(i => `
        <button type="button" onmousedown="event.preventDefault()" onclick="pickItem('${lineId}','${i.code}')"
          style="width: 100%; text-align: left; padding: 8px 12px; background: transparent; border: none; cursor: pointer; border-bottom: 1px solid var(--c-border-soft); display: flex; align-items: center; gap: 10px;">
          <i data-lucide="package" class="w-3.5 h-3.5" style="color: var(--c-text-soft); flex-shrink: 0;"></i>
          <div style="flex: 1; min-width: 0;">
            <div class="tbl-mono" style="font-size: 11.5px; color: var(--c-text-mute);">${i.code}</div>
            <div style="font-size: 12.5px; font-weight: 600; color: var(--c-navy);">${i.name}</div>
          </div>
          <span style="font-size: 10.5px; color: var(--c-text-soft);">${i.uom}</span>
        </button>
      `).join('');
      document.body.appendChild(pop);
      renderIcons();
      const close = (ev) => { if (!pop.contains(ev.target) && ev.target !== input) { pop.remove(); document.removeEventListener('click', close); } };
      setTimeout(() => document.addEventListener('click', close), 0);
    }
    function pickItem(lineId, code) {
      const item = mockItems.find(i => i.code === code);
      const line = createWizard.data.lines.find(l => l.id === lineId);
      if (item && line) {
        line.item_code = item.code;
        line.item_name = item.name;
        line.unit = item.uom;
      }
      document.querySelectorAll('.item-suggest-popover').forEach(n => n.remove());
      renderCreateDrawer();
    }

    // -----------------------------------------------------------
    //  Step 3 — Attachments
    // -----------------------------------------------------------
    function renderStep4() {
      const atts = createWizard.data.attachments;
      return `
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 8px;">
          <i data-lucide="paperclip" class="w-4 h-4" style="color: var(--c-text-mute);"></i>
          <div style="font-size: 13px; font-weight: 600; color: var(--c-navy);">แนบเอกสารประกอบ (ถ้ามี)</div>
        </div>
        <div style="font-size: 11.5px; margin-bottom: 14px; margin-left: 24px; color: var(--c-text-mute);">
          <i data-lucide="upload" class="w-3 h-3 inline"></i> แนบเอกสารประกอบ (ไม่บังคับ)
        </div>

        <div class="upload-zone ${atts.length ? 'has-files' : ''}" onclick="mockUpload()">
          ${atts.length === 0 ? `
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
              <div style="width: 48px; height: 48px; border-radius: 50%; background: var(--c-off-white); display: grid; place-items: center;">
                <i data-lucide="upload" class="w-6 h-6" style="color: var(--c-text-soft);"></i>
              </div>
              <div style="font-size: 13px; color: var(--c-text-mute);">ลากไฟล์มาวางที่นี่ หรือคลิกเพื่อเลือกไฟล์</div>
              <button onclick="event.stopPropagation(); mockUpload();" class="btn btn-secondary sm" style="margin-top: 4px;">เลือกไฟล์</button>
            </div>
          ` : `
            <div style="display: flex; flex-direction: column; gap: 8px;">
              ${atts.map((f, i) => `
                <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; background: white; border: 1px solid var(--c-border); border-radius: var(--r);" onclick="event.stopPropagation()">
                  <div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
                    <div style="width: 32px; height: 32px; border-radius: var(--r-sm); background: var(--c-primary-08); display: grid; place-items: center; flex-shrink: 0;">
                      <i data-lucide="file" class="w-4 h-4" style="color: var(--c-primary);"></i>
                    </div>
                    <div style="min-width: 0;">
                      <div style="font-size: 13px; font-weight: 600; color: var(--c-navy); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${f.name}</div>
                      <div style="font-size: 11px; color: var(--c-text-soft);">${f.size}</div>
                    </div>
                  </div>
                  <button onclick="event.stopPropagation(); removeAttachment(${i});" class="btn btn-ghost sm" style="padding: 0 6px; color: var(--c-danger);" title="ลบ">
                    <i data-lucide="x" class="w-4 h-4"></i>
                  </button>
                </div>
              `).join('')}
              <button onclick="event.stopPropagation(); mockUpload();" class="btn btn-secondary sm" style="margin-top: 6px; align-self: center;">
                <i data-lucide="plus" class="w-3.5 h-3.5"></i><span>แนบไฟล์เพิ่ม</span>
              </button>
            </div>
          `}
        </div>
      `;
    }

    function mockUpload() {
      const samples = [
        { name: 'quotation_vendor1.pdf', size: '124 KB' },
        { name: 'spec-sheet.pdf', size: '512 KB' },
        { name: 'approval-memo.docx', size: '32 KB' },
        { name: 'comparison_summary.xlsx', size: '88 KB' },
      ];
      const next = samples[createWizard.data.attachments.length % samples.length];
      createWizard.data.attachments.push(next);
      renderCreateDrawer();
    }
    function removeAttachment(i) {
      createWizard.data.attachments.splice(i, 1);
      renderCreateDrawer();
    }

    // -----------------------------------------------------------
    //  Step 4 — Review
    // -----------------------------------------------------------
    function renderStep5() {
      const d = createWizard.data;
      const lines = d.lines;
      let priceBeforeVat = 0;
      let totalVat = 0;
      lines.forEach(l => {
        migrateLine(l);
        const { netAmount, vatAmount } = calcLineVat(l);
        if (l.vat_mode === 'included') priceBeforeVat += netAmount - vatAmount;
        else priceBeforeVat += netAmount;
        totalVat += vatAmount;
      });
      const subtotalAfterVat = priceBeforeVat + totalVat;
      const whtAmount = d.wht_enabled ? priceBeforeVat * ((d.wht_pct || 0) / 100) : 0;
      let endbillAmount = 0;
      if (d.endbill_discount_enabled) {
        if (d.endbill_discount_mode === 'amount') endbillAmount = d.endbill_discount_value || 0;
        else endbillAmount = subtotalAfterVat * ((d.endbill_discount_value || 0) / 100);
      }
      const grandTotal = subtotalAfterVat - whtAmount - endbillAmount;
      const vendor = mockVendors.find(v => v.vendor_id === d.selected_vendor_id);
      const pr = mockPRs.find(p => p.pr_no === d.source_pr_no);
      const cp = d.source_cp_no ? mockComparisons.find(c => c.cp_no === d.source_cp_no) : null;

      return `
        <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
          <i data-lucide="check-circle-2" class="w-4 h-4" style="color: var(--c-text-mute);"></i>
          <div style="font-size: 13px; font-weight: 600; color: var(--c-navy);">ตรวจสอบข้อมูลก่อนบันทึก</div>
        </div>
        <div style="font-size: 11.5px; margin-bottom: 18px; margin-left: 24px; color: var(--c-text-mute);">
          <i data-lucide="info" class="w-3 h-3" style="display: inline-block;"></i>
          กรุณาตรวจสอบข้อมูลทั้งหมดก่อนกด "บันทึกและส่งอนุมัติ"
        </div>

        <!-- General Info Card -->
        <div class="card" style="margin-bottom: 14px;">
          <div class="card-head"><div class="card-title">ข้อมูลใบสั่งซื้อ</div></div>
          <div class="card-body">
            <dl style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px 24px; font-size: 13px;">
              <div><dt style="color: var(--c-text-mute); font-size: 11.5px;">วันที่ PO</dt><dd style="font-weight: 600;">${formatThaiDate(d.po_date)}</dd></div>
              <div><dt style="color: var(--c-text-mute); font-size: 11.5px;">วันที่คาดว่าจะได้รับ</dt><dd style="font-weight: 600;">${d.expected_date ? formatThaiDate(d.expected_date) : '—'}</dd></div>
              <div style="grid-column: 1/3;"><dt style="color: var(--c-text-mute); font-size: 11.5px;">ผู้ขาย</dt><dd style="font-weight: 600;">${vendor ? vendor.name : '—'} <span class="tbl-mono" style="font-size: 11px; color: var(--c-text-mute);">(${vendor?.vendor_id || ''})</span></dd></div>
              <div><dt style="color: var(--c-text-mute); font-size: 11.5px;">ผู้จัดซื้อ</dt><dd style="font-weight: 600;">${d.buyer}</dd></div>
              ${pr ? `<div style="grid-column: 1/3;"><dt style="color: var(--c-text-mute); font-size: 11.5px;">PR อ้างอิง</dt><dd style="font-weight: 600;"><span class="tbl-mono" style="color: var(--c-primary);">${pr.pr_no}</span> · ${pr.desc}</dd></div>` : ''}
              ${cp ? `<div style="grid-column: 1/3;"><dt style="color: var(--c-text-mute); font-size: 11.5px;">Comparison Report</dt><dd style="font-weight: 600;"><span class="tbl-mono" style="color: var(--c-purple);">${cp.cp_no}</span></dd></div>` : ''}
              <div><dt style="color: var(--c-text-mute); font-size: 11.5px;">เงื่อนไขชำระเงิน</dt><dd style="font-weight: 600;">${(() => { const t=termByCode(d.payment_term); return t ? `${t.code} · ${t.name}<div style="font-weight:400; font-size:11.5px; color:var(--c-text-mute); margin-top:2px;">${termSummary(t)} · ครบกำหนด: <strong style="color:var(--c-navy);">${dueText(d.payment_term, d.po_date, d.expected_date)}</strong></div>` : (d.payment_term||'—'); })()}</dd></div>
              ${d.notes ? `<div style="grid-column: 1/3;"><dt style="color: var(--c-text-mute); font-size: 11.5px;">หมายเหตุ</dt><dd>${d.notes}</dd></div>` : ''}
            </dl>
          </div>
        </div>

        <!-- Lines Card -->
        <div class="card" style="margin-bottom: 14px;">
          <div class="card-head"><div class="card-title">รายการสินค้า (${lines.length} รายการ)</div></div>
          <div class="card-body" style="padding: 0;">
            ${lines.map((l, i) => {
              migrateLine(l);
              const { lineTotal: lineTotalDisplay } = calcLineVat(l);
              const taxLabel = l.vat_mode === 'none' ? 'ไม่คิด VAT' : (l.vat_mode === 'included' ? `NET ${l.vat_pct}%` : `VAT ${l.vat_pct}%`);
              return `
                <div style="padding: 12px 18px; ${i < lines.length - 1 ? 'border-bottom: 1px solid var(--c-border-soft);' : ''} display: flex; align-items: center; justify-content: space-between; gap: 12px;">
                  <div style="min-width: 0;">
                    <div style="font-weight: 600;">${i + 1}. ${l.item_name || '(ยังไม่ได้เลือกสินค้า)'}</div>
                    <div style="font-size: 11.5px; color: var(--c-text-mute); margin-top: 2px;">(${l.qty} ${l.unit} × ฿${formatMoney(l.unit_price)})${l.discount_pct ? ` · ส่วนลด ${l.discount_pct}%` : ''} · ${taxLabel}</div>
                  </div>
                  <div class="num" style="font-size: 14px; font-weight: 600; flex-shrink: 0;">฿${formatMoney(lineTotalDisplay)}</div>
                </div>
              `;
            }).join('')}
            <div style="padding: 10px 18px; border-top: 2px solid var(--c-border); background: var(--c-off-white);">
              <table style="width: 100%; font-size: 12.5px;">
                <tbody>
                  <tr><td style="padding: 3px 0;">ราคาก่อน VAT</td><td style="text-align: right; font-variant-numeric: tabular-nums; font-weight: 600;">฿${formatMoney(priceBeforeVat)}</td></tr>
                  <tr><td style="padding: 3px 0; color: var(--c-purple);">ภาษีมูลค่าเพิ่ม (VAT)</td><td style="text-align: right; font-variant-numeric: tabular-nums; color: var(--c-purple);">+฿${formatMoney(totalVat)}</td></tr>
                  <tr style="border-top: 1px solid var(--c-border-soft);"><td style="padding: 6px 0;">ยอดรวมหลัง VAT</td><td style="text-align: right; font-variant-numeric: tabular-nums; padding: 6px 0; font-weight: 600;">฿${formatMoney(subtotalAfterVat)}</td></tr>
                  ${d.wht_enabled ? `<tr><td style="padding: 3px 0; color: var(--c-warning);">หัก ภาษี ณ ที่จ่าย ${d.wht_pct}%</td><td style="text-align: right; font-variant-numeric: tabular-nums; color: var(--c-warning);">-฿${formatMoney(whtAmount)}</td></tr>` : ''}
                  ${d.endbill_discount_enabled ? `<tr><td style="padding: 3px 0; color: var(--c-text-mute);">ส่วนลดท้ายบิล${d.endbill_discount_mode === 'percent' ? ' (' + d.endbill_discount_value + '%)' : ''}</td><td style="text-align: right; font-variant-numeric: tabular-nums; color: var(--c-text-mute);">-฿${formatMoney(endbillAmount)}</td></tr>` : ''}
                  <tr style="border-top: 1px solid var(--c-border);"><td style="padding: 6px 0 0; font-weight: 700; font-size: 14px;">ยอดสุทธิทั้งหมด</td><td style="text-align: right; font-variant-numeric: tabular-nums; padding: 6px 0 0; font-weight: 700; font-size: 16px; color: var(--c-primary);">฿${formatMoney(grandTotal)}</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>

        ${d.attachments.length > 0 ? `
          <div class="card">
            <div class="card-head"><div class="card-title">เอกสารแนบ (${d.attachments.length} ไฟล์)</div></div>
            <div class="card-body" style="padding: 0;">
              ${d.attachments.map((f, i) => `
                <div style="padding: 10px 18px; ${i < d.attachments.length - 1 ? 'border-bottom: 1px solid var(--c-border-soft);' : ''} display: flex; align-items: center; gap: 10px; font-size: 13px;">
                  <i data-lucide="paperclip" class="w-4 h-4" style="color: var(--c-text-mute);"></i>
                  <span style="flex: 1;">${f.name}</span>
                  <span style="color: var(--c-text-soft); font-size: 11.5px;">${f.size}</span>
                </div>
              `).join('')}
            </div>
          </div>
        ` : ''}
      `;
    }

    // Wizard nav
    function wizardNext() {
      const s = createWizard.step;
      const d = createWizard.data;
      if (s === 1) {
        // ตารางผู้ชนะมีเฉพาะ CP → ต้องเลือกผู้ชนะ; PR หรือไม่มี source → เลือก vendor ที่ step 2
        if (d.source_cp_no && !d.selected_vendor_id) return showToast('กรุณาเลือกผู้ขายจากตารางผู้ชนะการเสนอราคา', 'warning');
      }
      if (s === 2) {
        // Step 2: PO header
        if (!d.selected_vendor_id) return showToast('กรุณาเลือกผู้ขาย', 'warning');
        if (!d.po_date) return showToast('กรุณาระบุวันที่ PO', 'warning');
        if (!d.expected_date) return showToast('กรุณาระบุวันที่คาดว่าจะได้รับ', 'warning');
      }
      if (s === 3) {
        // Step 3: lines
        const validLines = d.lines.filter(l => l.item_code && l.qty > 0 && l.unit_price > 0);
        if (validLines.length === 0) return showToast('กรุณาเพิ่มรายการสินค้าอย่างน้อย 1 รายการ', 'warning');
      }
      createWizard.step++;
      renderCreateDrawer();
    }
    function wizardBack() {
      createWizard.step = Math.max(1, createWizard.step - 1);
      renderCreateDrawer();
    }
    function saveDraft() {
      const next = createNewRecord('draft');
      state.records.unshift(next);
      showToast(`บันทึกแบบร่าง ${next.po_no} เรียบร้อย`, 'success');
      closeCreateDrawer();
    }
    function submitForApproval() {
      const next = createNewRecord('pending');
      state.records.unshift(next);
      showToast(`ส่ง ${next.po_no} เพื่อขออนุมัติแล้ว`, 'success');
      closeCreateDrawer();
    }
    function createNewRecord(status) {
      const d = createWizard.data;
      const today = new Date();
      const buddhistShort = (today.getFullYear() + 543).toString().slice(-2);
      const seq = String(state.records.length + 1).padStart(5, '0');
      let priceBeforeVat = 0, totalVat = 0;
      d.lines.forEach(l => {
        migrateLine(l);
        const { netAmount, vatAmount } = calcLineVat(l);
        if (l.vat_mode === 'included') priceBeforeVat += netAmount - vatAmount;
        else priceBeforeVat += netAmount;
        totalVat += vatAmount;
      });
      const subtotalAfterVat = priceBeforeVat + totalVat;
      const whtAmount = d.wht_enabled ? priceBeforeVat * ((d.wht_pct || 0) / 100) : 0;
      let endbillAmount = 0;
      if (d.endbill_discount_enabled) {
        if (d.endbill_discount_mode === 'amount') endbillAmount = d.endbill_discount_value || 0;
        else endbillAmount = subtotalAfterVat * ((d.endbill_discount_value || 0) / 100);
      }
      const grandTotal = subtotalAfterVat - whtAmount - endbillAmount;
      const vendor = mockVendors.find(v => v.vendor_id === d.selected_vendor_id);
      return {
        id: 'new-' + Date.now(),
        po_no: `PO-${buddhistShort}${String(today.getMonth() + 1).padStart(2, '0')}-${seq}`,
        po_date: d.po_date,
        need_date: d.expected_date,
        vendor_id: d.selected_vendor_id,
        vendor_name: vendor ? vendor.name : '-',
        buyer: d.buyer,
        dept: d.dept,
        pr_no: d.source_pr_no,
        cp_no: d.source_cp_no,
        payment_term: d.payment_term,
        grand_total: grandTotal,
        status_doc: status,
        status_delivery: 'NONE',
        status_payment: 'NONE',
        revision_no: 1,
        signed: false,
        updated_at: today.toISOString().slice(0, 10) + ' ' + today.toTimeString().slice(0, 5),
      };
    }

    // ============================================================
    //  VIEW DRAWER
    // ============================================================
    const viewState = { tab: 'detail', recordId: null };

    function openViewDrawer(id) {
      viewState.tab = 'detail';
      viewState.recordId = id;
      const overlay = document.getElementById('overlay-root');
      overlay.innerHTML = `
        <div class="overlay-wrap">
          <div class="backdrop" onclick="closeViewDrawer()"></div>
          <div id="view-drawer" class="drawer-panel drawer-enter">
            <div id="view-drawer-content" style="display: flex; flex-direction: column; height: 100%;"></div>
          </div>
        </div>
      `;
      const drawer = document.getElementById('view-drawer');
      requestAnimationFrame(() => drawer.classList.add('drawer-active'));
      renderViewDrawer();
    }
    function closeViewDrawer() {
      const drawer = document.getElementById('view-drawer');
      if (drawer) { drawer.classList.remove('drawer-active'); drawer.classList.add('drawer-enter'); }
      setTimeout(() => {
        document.getElementById('overlay-root').innerHTML = '';
        if (getRoute().name === 'view') navigate('list');
      }, 200);
    }
    function renderViewDrawer() {
      const r = state.records.find(x => x.id === viewState.recordId);
      const c = document.getElementById('view-drawer-content');
      if (!r) { c.innerHTML = '<div style="padding: 24px;">ไม่พบข้อมูล</div>'; return; }
      const vendor = mockVendors.find(v => v.vendor_id === r.vendor_id);
      const pr = mockPRs.find(p => p.pr_no === r.pr_no);
      const cp = r.cp_no ? mockComparisons.find(c => c.cp_no === r.cp_no) : null;

      c.innerHTML = `
        <div style="padding: 18px 24px 12px; border-bottom: 1px solid var(--c-border-soft); flex-shrink: 0;">
          <div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;">
            <div>
              <div style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--c-text-mute); margin-bottom: 4px;">ใบสั่งซื้อ (Purchase Order)</div>
              <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
                <h2 style="font-size: 20px; font-weight: 700; color: var(--c-primary);" class="tbl-mono">${r.po_no}</h2>
                ${renderDocStatus(r.status_doc)}
                ${r.revision_no > 1 ? `<span style="font-size: 11px; padding: 2px 7px; border-radius: 4px; background: rgba(124,58,237,0.10); color: var(--c-purple); font-weight: 600;">Rev ${r.revision_no}</span>` : ''}
              </div>
              <div style="font-size: 13px; margin-top: 4px; color: var(--c-text-mute);">${r.vendor_name} · <span style="color: var(--c-text-soft);">ผู้จัดซื้อ:</span> ${r.buyer}</div>
            </div>
            <div style="display: flex; align-items: center; gap: 6px;">
              ${r.status_doc === 'draft' ? `
                <button onclick="confirmCancel('${r.id}')" class="btn btn-link" style="color: var(--c-danger); font-weight: 600;">ยกเลิก</button>
                <button onclick="showToast('เปิดหน้าแก้ไข (mock)', 'info')" class="btn btn-secondary">
                  <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                  <span>แก้ไข</span>
                </button>
                <button onclick="approveAction('${r.id}','submit')" class="btn btn-primary">
                  <i data-lucide="send" class="w-3.5 h-3.5"></i>
                  <span>ส่งอนุมัติ</span>
                </button>
                <div style="width: 1px; height: 22px; background: var(--c-border); margin: 0 4px;"></div>
              ` : ''}
              ${r.status_doc === 'pending' ? `
                <button onclick="approveAction('${r.id}','reject')" class="btn btn-link" style="color: var(--c-danger); font-weight: 600;">ปฏิเสธ</button>
                <button onclick="approveAction('${r.id}','return')" class="btn btn-secondary">ส่งคืนแก้ไข</button>
                <button onclick="approveAction('${r.id}','approve')" class="btn btn-success">
                  <i data-lucide="check" class="w-3.5 h-3.5"></i>
                  <span>อนุมัติ</span>
                </button>
                <div style="width: 1px; height: 22px; background: var(--c-border); margin: 0 4px;"></div>
              ` : ''}
              ${r.status_doc === 'approved' ? `
                <button onclick="showToast('Change Order (mock)', 'info')" class="btn btn-secondary">
                  <i data-lucide="git-branch" class="w-3.5 h-3.5"></i>
                  <span>Change Order</span>
                </button>
                <button onclick="showToast('ส่ง PO ให้ Vendor (mock)', 'success')" class="btn btn-primary">
                  <i data-lucide="send" class="w-3.5 h-3.5"></i>
                  <span>ส่ง PO ให้ Vendor</span>
                </button>
                <div style="width: 1px; height: 22px; background: var(--c-border); margin: 0 4px;"></div>
              ` : ''}
              ${r.status_doc === 'sent' ? `
                <button onclick="showToast('Change Order (mock)', 'info')" class="btn btn-secondary">
                  <i data-lucide="git-branch" class="w-3.5 h-3.5"></i>
                  <span>Change Order</span>
                </button>
                <button onclick="showToast('ปิด PO (mock)', 'success')" class="btn btn-secondary">
                  <i data-lucide="check-circle" class="w-3.5 h-3.5"></i>
                  <span>ปิด PO</span>
                </button>
                <div style="width: 1px; height: 22px; background: var(--c-border); margin: 0 4px;"></div>
              ` : ''}
              ${r.status_doc === 'rejected' ? `
                <button onclick="showToast('แก้ไข (mock)', 'info')" class="btn btn-secondary">
                  <i data-lucide="pencil" class="w-3.5 h-3.5"></i>
                  <span>แก้ไข</span>
                </button>
                <div style="width: 1px; height: 22px; background: var(--c-border); margin: 0 4px;"></div>
              ` : ''}
              <button class="top-icon-btn" title="พิมพ์"><i data-lucide="printer" class="w-4 h-4"></i></button>
              <button class="top-icon-btn" title="ดาวน์โหลด PDF"><i data-lucide="download" class="w-4 h-4"></i></button>
              <button onclick="closeViewDrawer()" class="top-icon-btn"><i data-lucide="x" class="w-4 h-4"></i></button>
            </div>
          </div>

          <div class="tabs" style="margin-top: 14px; margin-bottom: 0;">
            ${tabBtn('detail', 'รายละเอียด', 'file-text')}
            ${tabBtn('pdf', 'PDF Preview', 'file')}
            ${tabBtn('signatures', 'ลายเซ็น', 'pen-tool')}

                <thead>
                  <tr style="background: #0B1D3A; color: white;">
                    <th style="padding: 6px 8px; text-align: left; font-weight: 600; width: 28px;">#</th>
                    <th style="padding: 6px 8px; text-align: left; font-weight: 600;">รายการ</th>
                    <th style="padding: 6px 8px; text-align: right; font-weight: 600; width: 60px;">จำนวน</th>
                    <th style="padding: 6px 8px; text-align: right; font-weight: 600; width: 80px;">ราคา/หน่วย</th>
                    <th style="padding: 6px 8px; text-align: right; font-weight: 600; width: 90px;">รวม</th>
                  </tr>
                </thead>
                <tbody>
                  <tr style="border-bottom: 1px solid #E5E7EB;">
                    <td style="padding: 8px; vertical-align: top; color: #6B7280;">1</td>
                    <td style="padding: 8px; vertical-align: top;">
                      <div style="font-weight: 600;">${sampleLine.name}</div>
                      <div style="font-size: 9px; font-family: ui-monospace, monospace; color: #6B7280; margin-top: 1px;">${sampleLine.code}</div>
                    </td>
                    <td style="padding: 8px; vertical-align: top; text-align: right;">${qty} ${sampleLine.uom}</td>
                    <td style="padding: 8px; vertical-align: top; text-align: right; font-variant-numeric: tabular-nums;">${formatMoney(unitPrice)}</td>
                    <td style="padding: 8px; vertical-align: top; text-align: right; font-variant-numeric: tabular-nums; font-weight: 700;">${formatMoney(subtotal)}</td>
                  </tr>
                </tbody>
                <tfoot>
                  <tr style="background: #F9FAFB;">
                    <td colspan="4" style="padding: 6px 8px; text-align: right; font-size: 10px;">ยอดรวมก่อน VAT</td>
                    <td style="padding: 6px 8px; text-align: right; font-variant-numeric: tabular-nums;">${formatMoney(subtotal)}</td>
                  </tr>
                  <tr style="background: #F9FAFB;">
                    <td colspan="4" style="padding: 6px 8px; text-align: right; font-size: 10px;">VAT 7%</td>
                    <td style="padding: 6px 8px; text-align: right; font-variant-numeric: tabular-nums;">${formatMoney(vatAmount)}</td>
                  </tr>
                  <tr style="background: #F9FAFB; border-top: 2px solid #0B1D3A;">
                    <td colspan="4" style="padding: 6px 8px; text-align: right; font-weight: 700; font-size: 11px;">ยอดสุทธิทั้งหมด</td>
                    <td style="padding: 6px 8px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; color: #0B5CFF;">${formatMoney(r.grand_total)}</td>
                  </tr>
                </tfoot>
              </table>
            </div>

            <!-- Total summary -->
            <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: linear-gradient(135deg, rgba(11,92,255,0.08), rgba(0,168,142,0.04)); border-left: 3px solid #0B5CFF; border-radius: 3px;">
              <div>
                <div style="font-size: 9.5px; color: #6B7280; text-transform: uppercase; letter-spacing: 0.04em;">ยอดสุทธิทั้งหมด</div>
                <div style="font-size: 10px; margin-top: 2px;">รวมภาษีมูลค่าเพิ่มแล้ว</div>
              </div>
              <div style="text-align: right;">
                <div style="font-size: 18px; font-weight: 700; color: #0B5CFF; font-variant-numeric: tabular-nums; line-height: 1;">฿${formatMoney(r.grand_total)}</div>
              </div>
            </div>

            <!-- Signatures -->
            <div style="margin-top: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding-top: 12px;">
              ${[
                { role: 'ผู้จัดซื้อ', name: r.buyer, date: r.po_date },
                { role: 'ผู้ตรวจสอบ', name: 'Sasiwan Chaimongkol', date: r.status_doc !== 'draft' ? r.updated_at.split(' ')[0] : null },
                { role: 'ผู้อนุมัติ', name: 'Patcharaphon Wong', date: ['approved','sent'].includes(r.status_doc) ? r.updated_at.split(' ')[0] : null },
              ].map(s => `
                <div style="text-align: center;">
                  <div style="border-bottom: 1px solid #111; height: 36px; margin-bottom: 4px; position: relative;">
                    ${s.date ? `<div style="position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); font-family: 'Brush Script MT', cursive; font-size: 14px; color: #1E40AF; opacity: 0.7;">${s.name.split(' ')[0]}</div>` : ''}
                  </div>
                  <div style="font-size: 9.5px; font-weight: 600;">(${s.name})</div>
                  <div style="font-size: 9px; color: #6B7280; margin-top: 2px;">${s.role}</div>
                  <div style="font-size: 9px; color: #6B7280;">${s.date ? 'วันที่ ' + formatThaiDate(s.date) : '..... / ..... / .....'}</div>
                </div>
              `).join('')}
            </div>

            <div style="display: flex; justify-content: space-between; align-items: center; padding-top: 6px; border-top: 1px solid #E5E7EB; font-size: 8.5px; color: #9CA3AF;">
              <span>${r.po_no} · Generated by CUBE ERP</span>
              <span>หน้า 1 / 1</span>
            </div>
          </div>
        </div>
      `;
    }

    function renderSignaturesTab(r) {
      const slots = [
        { role: 'ผู้จัดซื้อ',   name: r.buyer,                position: 'Procurement Officer', signed: true,  date: formatThaiDate(r.po_date) + ' 14:32' },
        { role: 'ผู้ตรวจสอบ', name: 'Sasiwan Chaimongkol',  position: 'Procurement Manager', signed: r.status_doc !== 'draft', date: r.status_doc !== 'draft' ? formatThaiDate(r.updated_at.split(' ')[0] || r.po_date) + ' 15:10' : null },
        { role: 'ผู้อนุมัติ',  name: 'Patcharaphon Wong',    position: 'Department Head',     signed: ['approved','sent'].includes(r.status_doc), date: ['approved','sent'].includes(r.status_doc) ? formatThaiDate(r.updated_at.split(' ')[0] || r.po_date) + ' 16:45' : null },
      ];
      return `
        <div style="display: flex; flex-direction: column; gap: 12px;">
          ${slots.map(s => `
            <div class="card">
              <div class="card-body" style="display: flex; align-items: flex-start; gap: 14px;">
                <div style="width: 40px; height: 40px; border-radius: 50%; background: ${s.signed ? 'var(--c-teal-08)' : 'var(--c-off-white)'}; display: grid; place-items: center; flex-shrink: 0;">
                  <i data-lucide="${s.signed ? 'check' : 'clock'}" class="w-5 h-5" style="color: ${s.signed ? 'var(--c-teal)' : 'var(--c-text-soft)'};"></i>
                </div>
                <div style="flex: 1;">
                  <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 2px;">
                    <span style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--c-text-mute);">${s.role}</span>
                    ${s.signed ? `<span class="pill approved">ลงนามแล้ว</span>` : `<span class="pill pending">รอลงนาม</span>`}
                  </div>
                  <div style="font-weight: 600; color: var(--c-navy);">${s.name}</div>
                  <div style="font-size: 13px; color: var(--c-text-mute);">${s.position}</div>
                  ${s.date ? `<div style="font-size: 11px; margin-top: 4px; color: var(--c-text-soft);">ลงนามเมื่อ ${s.date}</div>` : ''}
                </div>
                ${!s.signed ? `<button class="btn btn-primary sm" style="align-self: center;"><i data-lucide="pen-tool" class="w-3.5 h-3.5"></i><span>ลงนาม</span></button>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function approveAction(id, kind) {
      const r = state.records.find(x => x.id === id);
      if (!r) return;
      if (kind === 'submit')  { r.status_doc = 'pending';  showToast(`ส่ง ${r.po_no} เพื่ออนุมัติแล้ว`, 'success'); }
      if (kind === 'approve') { r.status_doc = 'approved'; showToast(`อนุมัติ ${r.po_no} เรียบร้อย`, 'success'); }
      if (kind === 'reject')  { r.status_doc = 'rejected'; showToast(`ปฏิเสธ ${r.po_no}`, 'error'); }
      if (kind === 'return')  { r.status_doc = 'draft';    showToast(`ส่งคืน ${r.po_no} เพื่อแก้ไข`, 'info'); }
      r.updated_at = new Date().toISOString().slice(0,10) + ' ' + new Date().toTimeString().slice(0, 5);
      if (getRoute().name === 'view') renderViewDrawer();
      else renderTableOnly();
    }

    // ============================================================
    //  CANCEL/DELETE MODAL
    // ============================================================
    function confirmCancel(id) {
      const r = state.records.find(x => x.id === id);
      if (!r) return;
      const modal = document.createElement('div');
      modal.className = 'modal-overlay';
      modal.innerHTML = `
        <div class="backdrop" onclick="this.parentElement.remove();"></div>
        <div class="card" style="position: relative; max-width: 480px; width: 100%; box-shadow: var(--sh-xl);">
          <div style="padding: 18px; border-bottom: 1px solid var(--c-border-soft); display: flex; align-items: flex-start; gap: 12px;">
            <div style="width: 40px; height: 40px; border-radius: 50%; background: var(--c-danger-08); display: grid; place-items: center; flex-shrink: 0;">
              <i data-lucide="alert-triangle" class="w-5 h-5" style="color: var(--c-danger);"></i>
            </div>
            <div>
              <h3 style="font-size: 14px; font-weight: 700; color: var(--c-navy);">ลบใบสั่งซื้อ ${r.po_no}?</h3>
              <p style="font-size: 13px; margin-top: 4px; color: var(--c-text-mute);">การลบจะไม่สามารถย้อนกลับได้ กรุณาระบุเหตุผลด้านล่าง</p>
            </div>
          </div>
          <div style="padding: 18px;">
            <label style="display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--c-navy);">เหตุผลในการลบ <span style="color: var(--c-danger);">*</span></label>
            <textarea id="cancelReason" rows="3" placeholder="ระบุเหตุผล..." class="input" style="height: auto; padding: 10px 12px; resize: vertical;"></textarea>
          </div>
          <div style="padding: 12px 18px; background: var(--c-off-white); border-top: 1px solid var(--c-border-soft); display: flex; align-items: center; justify-content: flex-end; gap: 8px; border-radius: 0 0 var(--r-lg) var(--r-lg);">
            <button onclick="this.closest('.modal-overlay').remove();" class="btn btn-ghost">ปิด</button>
            <button onclick="(function(){
              const reason=document.getElementById('cancelReason').value.trim();
              if(!reason){ showToast('กรุณาระบุเหตุผล','warning'); return; }
              const rec=state.records.find(x=>x.id==='${id}');
              rec.status_doc='cancelled'; rec.updated_at=new Date().toISOString().slice(0,10) + ' ' + new Date().toTimeString().slice(0,5);
              showToast('ลบ ' + rec.po_no + ' เรียบร้อย','success');
              document.querySelectorAll('.modal-overlay').forEach(n=>n.remove());
              if(getRoute().name==='view') closeViewDrawer(); else renderTableOnly();
            })()" class="btn btn-danger">
              <i data-lucide="trash" class="w-4 h-4"></i>
              <span>ยืนยันลบ</span>
            </button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      renderIcons();
    }

    // ============================================================
    //  SHARED HELPERS
    // ============================================================
    function closeAllOverlays() { document.getElementById('overlay-root').innerHTML = ''; }

    function renderPill(status) {
      const labels = { draft: 'ฉบับร่าง', pending: 'รออนุมัติ', approved: 'อนุมัติแล้ว', rejected: 'ปฏิเสธ', cancelled: 'ยกเลิก' };
      const cls = ['draft','pending','approved','rejected','cancelled'].includes(status) ? status : 'draft';
      return `<span class="pill ${cls}">${labels[status] || status}</span>`;
    }

    function formatMoney(n) {
      const x = Number(n) || 0;
      return x.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function formatThaiDate(d) {
      if (!d) return '';
      const [y, m, day] = d.split('-').map(Number);
      const buddhist = (y + 543);
      return `${day}/${m}/${buddhist}`;
    }

    function showToast(message, type = 'success') {
      const colors = { success: 'var(--c-teal)', error: 'var(--c-danger)', warning: 'var(--c-warning)', info: 'var(--c-primary)' };
      const icons = { success: 'check-circle-2', error: 'x-circle', warning: 'alert-triangle', info: 'info' };
      const t = document.createElement('div');
      t.className = 'animate-slide-in';
      t.style.cssText = `background: ${colors[type]}; color: white; padding: 10px 14px; border-radius: var(--r); box-shadow: var(--sh-lg); display: flex; align-items: center; gap: 10px; min-width: 280px; font-size: 13px;`;
      t.innerHTML = `<i data-lucide="${icons[type]}" class="w-4 h-4"></i><span>${message}</span>`;
      document.getElementById('toast-root').appendChild(t);
      renderIcons();
      setTimeout(() => { t.style.transition = 'opacity 200ms'; t.style.opacity = '0'; setTimeout(() => t.remove(), 200); }, 2800);
    }
  </script>
</body>
</html>
