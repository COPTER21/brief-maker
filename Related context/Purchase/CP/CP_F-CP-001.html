        <div style="font-size:11.5px;margin-bottom:16px;${need?'color:var(--c-warning);font-weight:600;':'color:var(--c-teal);font-weight:600;'}">${need?'เลือกอีกอย่างน้อย '+(2-cp.vendors.length)+' ราย':'พร้อมเปรียบเทียบ'}</div>
        ${selBox}
        <div class="v-section-label"><i data-lucide="store" class="w-3.5 h-3.5"></i>เลือกผู้ขาย${full?' <span style="font-weight:400;color:var(--c-text-soft);">— ครบจำนวนแล้ว นำผู้ขายเดิมออกก่อน</span>':''}</div>
        <div class="v-toolbar">
          <div class="v-search"><i data-lucide="search" class="w-4 h-4"></i><input type="text" name="vendor-search" value="${cp.vendorSearch||''}" placeholder="ค้นหาผู้ขาย — รหัส / ชื่อ..." oninput="onVendorSearch(event)"></div>
          <select class="select" style="width:170px;" onchange="setVendorFilter(this.value)">
            <option value="all" ${f==='all'?'selected':''}>เงื่อนไขชำระ: ทั้งหมด</option>
            <option value="cash" ${f==='cash'?'selected':''}>เงินสด</option>
            <option value="credit" ${f==='credit'?'selected':''}>เครดิต</option>
          </select>
        </div>
        ${availGrid}`;
    }
    function onVendorSearch(e){ cp.vendorSearch=e.target.value; renderWizard(); }
    function setVendorFilter(v){ cp.vendorFilter=v; renderWizard(); }
    function toggleVendorCard(vid){
      const i=cp.vendors.indexOf(vid);
      if(i>=0){ cp.vendors.splice(i,1); Object.keys(cp.prices).forEach(k=>delete cp.prices[k][vid]); Object.keys(cp.winners).forEach(k=>{ if(cp.winners[k]===vid) delete cp.winners[k]; }); }
      else { if(cp.vendors.length>=PURCHASE_CONFIG.cp_max_vendors) return showToast('เลือกผู้ขายครบจำนวนสูงสุดแล้ว','warning'); cp.vendors.push(vid); applyPriceList(); }
      renderWizard();
    }
    // ---- step 3 ----
    function stepMatrix(){
      if(cp.lines.length===0) return '<div style="color:var(--c-text-mute);">ยังไม่มีรายการ — กลับไปขั้นที่ 1 เลือก PR</div>';
      if(cp.vendors.length<2) return '<div style="color:var(--c-warning);">ต้องมีผู้ขายอย่างน้อย 2 ราย (ขั้นที่ 2)</div>';
      const vh=cp.vendors.map(vid=>{ const v=vendorById(vid); return `<th class="cmp-vcell"><div>${v.code}</div><div class="vsub">${v.name}</div></th>`; }).join('');
      const rows=cp.lines.map((ln,i)=>{ const k=lineKey(i); const {bv}=bestVendorForLine(i); const pr=cp.prices[k]||{};
        const cells=cp.vendors.map(vid=>{ const val=pr[vid]!=null?pr[vid]:''; const has=!isNaN(parseFloat(pr[vid])); const isWin=cp.winners[k]===vid; const isLow=bv===vid&&has;
          return `<td class="cmp-vcell cmp-cell ${isWin?'is-win':''} ${isLow?'is-low':''}">
            <div class="cmp-cell-in">
              <div class="price-box"><span class="cur">฿</span><input class="cmp-price-inp" name="p-${i}-${vid}" type="number" min="0" step="0.01" value="${val}" placeholder="0.00" oninput="setPrice(${i},'${vid}',this.value)" onchange="onPriceChange()">${isLow?'<span class="lowtag">ต่ำสุด</span>':''}</div>
              <button class="win-btn ${isWin?'active':''}" ${has?'':'disabled'} onclick="setWinner(${i},'${vid}')">
                <i data-lucide="${isWin?'check-circle-2':'circle'}" class="w-3.5 h-3.5"></i><span>${isWin?'ผู้ชนะ':'เลือกผู้ชนะ'}</span></button>
            </div></td>`; }).join('');
        return `<tr><td class="it"><div class="cmp-prod"><div class="cmp-prod-main"><div class="cmp-prod-name">${ln.item_name}</div><div class="cmp-prod-meta"><span class="tbl-mono">${ln.item_code}</span><span class="dot">·</span><span class="tbl-mono" style="color:var(--c-text-soft);">${ln.src}</span></div></div><div class="cmp-qty"><div class="cmp-qty-v">${ln.qty}</div><div class="cmp-qty-u">${ln.unit}</div></div></div></td>${cells}</tr>`; }).join('');
      const totals=cp.vendors.map(vid=>{ let sum=0; cp.lines.forEach((ln,i)=>{ if(cp.winners[lineKey(i)]===vid){ const p=parseFloat((cp.prices[lineKey(i)]||{})[vid]); if(!isNaN(p)) sum+=p*ln.qty; } }); return `<td class="cmp-vcell ${sum>0?'winsum':''}" style="text-align:right;">${sum>0?'฿'+fmtMoney(sum):'—'}</td>`; }).join('');
      const won=cp.lines.filter((_,i)=>cp.winners[lineKey(i)]).length; const done=won===cp.lines.length;
      return `
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;">
          <div class="sec-title" style="margin:0;">ตารางเปรียบเทียบราคา
            <i class="hint-i" data-tip="ราคาตั้งต้นดึงจาก price list ของผู้ขาย (แก้ไขได้) · ช่องที่ price list ไม่มีให้กรอกเอง · ราคาต่ำสุดของแต่ละสินค้าถูกไฮไลต์เขียว (ป้าย ‘ต่ำสุด’) · กดปุ่ม ‘เลือกผู้ชนะ’ ได้ 1 รายต่อสินค้า — ต่างสินค้าเลือกผู้ชนะต่างกันได้">i</i></div>
          <span class="pill" style="margin-left:auto;color:${done?'var(--c-teal)':'var(--c-warning)'};background:${done?'var(--c-teal-08)':'var(--c-warning-08)'};display:inline-flex;align-items:center;gap:5px;"><i data-lucide="${done?'check-circle-2':'alert-circle'}" class="w-3.5 h-3.5"></i>เลือกผู้ชนะแล้ว ${won}/${cp.lines.length}</span>
          <button class="btn btn-ghost sm" onclick="applyPriceList();renderWizard();showToast('เติมราคาจาก price list แล้ว (เฉพาะช่องว่าง)','info');"><i data-lucide="list-plus" class="w-3.5 h-3.5"></i><span>เติมราคา price list</span></button>
          <button class="btn btn-secondary sm" onclick="autoWinners();renderWizard();"><i data-lucide="wand-2" class="w-3.5 h-3.5"></i><span>เลือกอัตโนมัติ (ราคาต่ำสุด)</span></button>
        </div>
        <div class="cmp-wrap"><table class="cmp">
          <thead><tr><th class="it">สินค้า / รายการ</th>${vh}</tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr class="cmp-foot"><td class="it">รวมมูลค่าที่ชนะ (ต่อผู้ขาย)</td>${totals}</tr></tfoot>
        </table></div>`;
    }
    function setPrice(i,vid,val){ const k=lineKey(i); (cp.prices[k]=cp.prices[k]||{})[vid]= val===''?undefined:val; }
    function onPriceChange(){ renderWizard(); }
    function setWinner(i,vid){ const k=lineKey(i); if(cp.winners[k]===vid) delete cp.winners[k]; else cp.winners[k]=vid; renderWizard(); }
    function autoWinners(){ cp.lines.forEach((_,i)=>{ const {bv}=bestVendorForLine(i); if(bv&&!cp.winners[lineKey(i)]) cp.winners[lineKey(i)]=bv; }); }
    // ---- step 4 ----
    function stepSplit(){
      const won=cp.lines.filter((_,i)=>cp.winners[lineKey(i)]).length;
      if(won<cp.lines.length) return `<div style="display:flex;gap:10px;padding:16px 18px;background:var(--c-warning-08);border:1px solid var(--c-warning);border-radius:12px;color:var(--c-warning);font-size:13px;align-items:center;"><i data-lucide="alert-triangle" class="w-5 h-5" style="flex-shrink:0;"></i><div>ยังเลือกผู้ชนะไม่ครบ (${won}/${cp.lines.length} รายการ) — กลับไปขั้นที่ 3 เพื่อเลือกให้ครบก่อนแยกใบสั่งซื้อ</div></div>`;
      const g=poGroups(); const vids=Object.keys(g); let grand=0; const totalItems=cp.lines.length;
      const cards=vids.map((vid,idx)=>{ const v=vendorById(vid); const lines=g[vid]; const sub=lines.reduce((s,l)=>s+l.amount,0); grand+=sub;
        const initials=v.code.replace(/[^0-9]/g,'').slice(-2)||(idx+1);
        return `<div class="po-card">
          <div class="po-card-head">
            <div class="po-av">${initials}</div>
            <div><div class="nm">PO ใบที่ ${idx+1} · ${v.name}</div><div class="sub">${v.code} · ${v.credit} · ${lines.length} รายการ</div></div>
            <span class="po-badge">฿${fmtMoney(sub)}</span>
          </div>
          <table class="po-tbl">
            <thead><tr><th>สินค้า</th><th style="text-align:right;">จำนวน</th><th style="text-align:right;">ราคา/หน่วย</th><th style="text-align:right;">รวม</th><th style="text-align:right;">จาก PR</th></tr></thead>
            <tbody>${lines.map(l=>`<tr><td>${l.item_name} <span style="color:var(--c-text-mute);font-size:11px;">(${l.item_code})</span></td><td style="text-align:right;">${l.qty} ${l.unit}</td><td style="text-align:right;">฿${fmtMoney(l.price)}</td><td style="text-align:right;font-weight:600;">฿${fmtMoney(l.amount)}</td><td style="text-align:right;"><span class="tbl-mono" style="font-size:11px;color:var(--c-text-soft);">${l.src}</span></td></tr>`).join('')}
              <tr class="po-sub"><td colspan="3" style="text-align:right;color:var(--c-text-mute);font-weight:500;">รวมใบนี้</td><td style="text-align:right;color:var(--c-primary);">฿${fmtMoney(sub)}</td><td></td></tr></tbody>
          </table></div>`; }).join('');
      return `
        <div class="sec-title" style="margin-bottom:14px;">สรุปการแตกใบสั่งซื้อ (PO Split)
          <i class="hint-i" data-tip="1 สินค้า = 1 ผู้ชนะ → ระบบจัดกลุ่มรายการตามผู้ขายที่ชนะ → ออก PO แยกตามผู้ขาย (1 ผู้ขาย = 1 ใบ) แต่ละใบอ้างกลับ CP และ PR ต้นทาง เพื่อให้ track ได้ง่าย">i</i></div>
        <div class="po-summary">
          <div class="po-stat"><div class="lbl"><i data-lucide="receipt" class="w-3.5 h-3.5"></i>ใบสั่งซื้อที่จะออก</div><div class="val">${vids.length} <span style="font-size:13px;font-weight:500;color:var(--c-text-mute);">ใบ</span></div></div>
          <div class="po-stat"><div class="lbl"><i data-lucide="package" class="w-3.5 h-3.5"></i>รายการรวม</div><div class="val">${totalItems} <span style="font-size:13px;font-weight:500;color:var(--c-text-mute);">รายการ</span></div></div>
          <div class="po-stat accent"><div class="lbl"><i data-lucide="banknote" class="w-3.5 h-3.5"></i>มูลค่ารวมผู้ชนะ</div><div class="val">฿${fmtMoney(grand)}</div></div>
        </div>
        ${cards}`;
    }
    function saveCp(status){
      if(status==='pending'){ if(cp.lines.length===0) return showToast('ยังไม่มีรายการเปรียบเทียบ','warning');
        if(cp.vendors.length<2) return showToast('ต้องเลือกผู้ขายอย่างน้อย 2 ราย','warning');
        if(!cp.lines.every((_,i)=>cp.winners[lineKey(i)])) return showToast('กรุณาเลือกผู้ชนะให้ครบทุกสินค้า','warning'); }
      const g=poGroups(); const grand=Object.values(g).flat().reduce((s,l)=>s+l.amount,0); const seq=String(state.records.length+1).padStart(5,'0');
      state.records.unshift({ id:String(Date.now()), cp_no:`CP-2606-${seq}`, cp_date:cp.cp_date, pr_refs:[...cp.pr_refs], buyer:cp.buyer, item_count:cp.lines.length, vendor_count:cp.vendors.length, po_count:Object.keys(g).length, status, winner_total:grand });
      showToast(status==='pending'?'ส่งอนุมัติผลเปรียบเทียบแล้ว':'บันทึกร่างแล้ว','success'); closeDrawer();
    }

    // ============================================================
    //  VIEW (Pattern C — tabbed) · footer contract Rule#31.4
    // ============================================================
    let viewTab='detail';
    function openViewDrawer(id){ const r=state.records.find(x=>x.id===id); if(!r){ navigate('list'); return; } viewTab='detail'; renderView(r); }
    function setViewTab(t,id){ viewTab=t; renderView(state.records.find(x=>x.id===id)); }
    function renderView(r){
      const tabs=[['detail','รายละเอียด','file-text'],['posplit','แยก PO','receipt'],['document','PDF Preview','file'],['approve','ลายเซ็น','pen-tool']]
        .map(t=>`<button class="tab ${viewTab===t[0]?'on':''}" onclick="setViewTab('${t[0]}','${r.id}')"><i data-lucide="${t[2]}" class="w-4 h-4"></i>${t[1]}</button>`).join('');
      const body = viewTab==='detail'?viewDetail(r) : viewTab==='posplit'?viewPoSplit(r) : viewTab==='document'?viewDocument(r) : viewApprove(r);
      // footer: ปิด(secondary) ซ้าย → spacer → primary action ขวา (ตาม role)
      let action='';
      if(r.status==='draft') action=`<button class="btn btn-primary" onclick="sendCpToSign('${r.id}')"><i data-lucide="send" class="w-4 h-4"></i><span>ส่งเซ็น (สายอนุมัติ DOA)</span></button>`;
      else if(r.status==='approved') action=`<button class="btn btn-primary" onclick="awardCp('${r.id}')"><i data-lucide="receipt" class="w-4 h-4"></i><span>ออกใบสั่งซื้อ (${r.po_count} ใบ)</span></button>`;
      else if(r.status==='pending') action=`<button class="btn btn-danger" onclick="showToast('ตีกลับ (mock)','info')"><i data-lucide="corner-up-left" class="w-4 h-4"></i><span>ตีกลับ</span></button><button class="btn btn-primary" onclick="approveCp('${r.id}')"><i data-lucide="check" class="w-4 h-4"></i><span>อนุมัติ</span></button>`;
      const footer=`<button class="btn btn-secondary" onclick="closeDrawer()">ปิด</button><div class="footer-spacer" style="flex:1;"></div>${action}`;
      openDrawer(drawerShell(r.cp_no, `เปรียบเทียบราคา · ${formatThaiDate(r.cp_date)}`, '', `<div class="tabs">${tabs}</div>${body}`, footer), true);
    }
    const infoCell=(l,v)=>`<div><div style="font-size:11px;color:var(--c-text-soft);">${l}</div><div style="font-weight:600;font-size:13px;margin-top:2px;">${v}</div></div>`;
    function viewDetail(r){
      return `<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px 24px;margin-bottom:20px;">
          ${infoCell('เลขที่ CP',`<span class="tbl-mono" style="color:var(--c-primary);">${r.cp_no}</span>`)}
          ${infoCell('สถานะ',renderPill(r.status))}
          ${infoCell('วันที่',formatThaiDate(r.cp_date))}
          ${infoCell('ผู้จัดทำ',r.buyer)}
          ${infoCell('อ้างอิง PR', r.pr_refs.length?r.pr_refs.map(x=>`<span class="tbl-mono" style="font-size:12px;">${x}</span>`).join(', '):'—')}
          ${infoCell('จำนวนรายการ',r.item_count+' รายการ')}
          ${infoCell('ผู้ขายที่เทียบ',r.vendor_count+' ราย')}
          ${infoCell('PO ที่จะออก',`<span style="color:var(--c-primary);">${r.po_count} ใบ</span>`)}
          ${infoCell('มูลค่าผู้ชนะรวม',`฿${fmtMoney(r.winner_total)}`)}
        </div>
        <div class="sec-title" style="font-size:12.5px;">ตารางเปรียบเทียบเต็ม
          <i class="hint-i" data-tip="prototype เก็บผลสรุป (ผู้ชนะ + PO split) · ตารางเปรียบเทียบรายผู้ขาย/รายสินค้าแบบเต็มจะแสดงเมื่อผูกข้อมูลจริงในเวอร์ชัน dev — ดูผลการแยก PO ได้ที่แท็บ ‘แยก PO’">i</i></div>`;
    }
    function viewPoSplit(r){
      const splits=r.po_splits||[]; const madeCount=splits.filter(s=>s.po_id).length;
      return `<div class="sec-title" style="margin-bottom:14px;">การแยกใบสั่งซื้อ (PO Split)
          <i class="hint-i" data-tip="1 สินค้า = 1 ผู้ชนะ → จัดกลุ่มตามผู้ขาย → แยกเป็น PO (1 ผู้ขาย = 1 ใบ) · เลขที่ PO ออกโดยระบบใบสั่งซื้อ (PO) เมื่อสั่งสร้างจริง — ใบนี้ track ได้ว่าแต่ละ PO มีกี่รายการและสร้างแล้วหรือยัง">i</i></div>
        <div class="po-summary">
          <div class="po-stat"><div class="lbl"><i data-lucide="receipt" class="w-3.5 h-3.5"></i>จำนวน PO ที่ต้องแยก</div><div class="val">${splits.length} <span style="font-size:13px;font-weight:500;color:var(--c-text-mute);">ใบ</span></div></div>
          <div class="po-stat"><div class="lbl"><i data-lucide="package" class="w-3.5 h-3.5"></i>รายการรวม</div><div class="val">${r.item_count} <span style="font-size:13px;font-weight:500;color:var(--c-text-mute);">รายการ</span></div></div>
          <div class="po-stat accent"><div class="lbl"><i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i>สร้าง PO แล้ว</div><div class="val">${madeCount}<span style="font-size:14px;font-weight:500;color:rgba(255,255,255,.7);">/${splits.length}</span></div></div>
        </div>
        ${splits.length?splits.map((s,i)=>{ const made=!!s.po_id; const lines=s.lines||[]; const sub=lines.reduce((a,l)=>a+l.qty*l.price,0);
          return `<div class="po-card"><div class="po-card-head">
            <div class="po-av" style="${made?'':'background:var(--c-text-soft);'}">${i+1}</div>
            <div style="flex:1;min-width:0;"><div class="nm">PO ใบที่ ${i+1} · ${s.vendor}</div>
              <div class="sub" style="display:flex;align-items:center;gap:6px;"><i data-lucide="package" class="w-3 h-3"></i><b style="color:var(--c-navy);">${lines.length}</b> รายการ · รวม <b style="color:var(--c-primary);">฿${fmtMoney(sub)}</b></div></div>
            ${made
              ? `<span class="po-badge" style="background:var(--c-teal-08);color:var(--c-teal);display:inline-flex;align-items:center;gap:6px;"><i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i>สร้างแล้ว · <span class="tbl-mono">${s.po_id}</span></span>`
              : `<span class="po-badge" style="background:var(--c-warning-08);color:var(--c-warning);display:inline-flex;align-items:center;gap:6px;"><i data-lucide="clock" class="w-3.5 h-3.5"></i>ยังไม่สร้าง</span>`}
          </div>
          <table class="po-tbl">
            <thead><tr><th>สินค้า</th><th style="text-align:right;">จำนวน</th><th style="text-align:right;">ราคา/หน่วย</th><th style="text-align:right;">รวม</th></tr></thead>
            <tbody>${lines.map(l=>`<tr><td>${l.item_name} <span style="color:var(--c-text-mute);font-size:11px;">(${l.item_code})</span></td><td style="text-align:right;font-variant-numeric:tabular-nums;">${l.qty} ${l.unit}</td><td style="text-align:right;font-variant-numeric:tabular-nums;">฿${fmtMoney(l.price)}</td><td style="text-align:right;font-weight:600;font-variant-numeric:tabular-nums;">฿${fmtMoney(l.qty*l.price)}</td></tr>`).join('')}
              <tr class="po-sub"><td colspan="3" style="text-align:right;color:var(--c-text-mute);font-weight:500;">รวมใบนี้</td><td style="text-align:right;color:var(--c-primary);font-weight:700;">฿${fmtMoney(sub)}</td></tr></tbody>
          </table></div>`; }).join('')

        </div>
        <div style="background: #E5E7EB; padding: 12px; border-radius: var(--r);">
          <iframe title="CP PDF preview" src="${src}#view=FitH" style="width: 100%; height: 1000px; border: 0; border-radius: 6px; background: #fff;"></iframe>
        </div>
      `;
    }
    function viewApprove(r){
      // ลำดับลายเซ็นอนุมัติ — เหมือน PR เป๊ะ (slot = ผู้จัดทำ/ผู้ตรวจสอบ/ผู้อนุมัติ; ผู้อนุมัติมาตาม DOA)
      const signedAll = (r.status==='approved'||r.status==='awarded');
      const slots = [
        { role:'ผู้จัดทำ',   name:r.buyer,                position:'Buyer',               signed:true,                  date: formatThaiDate(r.cp_date) + ' 14:32' },
        { role:'ผู้ตรวจสอบ', name:'Sasiwan Chaimongkol',  position:'Procurement Manager', signed: r.status!=='draft',    date: r.status!=='draft' ? formatThaiDate(r.cp_date) + ' 15:10' : null },
        { role:'ผู้อนุมัติ',  name:'Patcharaphon Wong',    position:'Department Head',     signed: signedAll,            date: signedAll ? formatThaiDate(r.cp_date) + ' 16:45' : null },
      ];
      return `
        <div style="display: flex; flex-direction: column; gap: 12px;">
          ${slots.map(s => `
            <div class="card">
              <div class="card-body" style="display: flex; align-items: flex-start; gap: 14px;">
                <div style="width: 40px; height: 40px; border-radius: 50%; background: ${s.signed ? 'var(--c-teal-08)' : 'var(--c-off-white)'}; display: grid; place-items: center; flex-shrink: 0;">
                  <i data-lucide="${s.signed ? 'check' : 'clock'}" class="w-5 h-5" style="color: ${s.signed ? 'var(--c-teal)' : 'var(--c-text-soft)'};"></i>
                </div>
                <div style="flex: 1;">
                  <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 2px;">
                    <span style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--c-text-mute);">${s.role}</span>
                    ${s.signed ? `<span class="pill approved">ลงนามแล้ว</span>` : `<span class="pill pending">รอลงนาม</span>`}
                  </div>
                  <div style="font-weight: 600; color: var(--c-navy);">${s.name}</div>
                  <div style="font-size: 13px; color: var(--c-text-mute);">${s.position}</div>
                  ${s.date ? `<div style="font-size: 11px; margin-top: 4px; color: var(--c-text-soft);">ลงนามเมื่อ ${s.date}</div>` : ''}
                </div>
                ${!s.signed ? `<button class="btn btn-primary sm" style="align-self: center;"><i data-lucide="pen-tool" class="w-3.5 h-3.5"></i><span>ลงนาม</span></button>` : ''}
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }
    function sendCpToSign(id){ const r=state.records.find(x=>x.id===id); if(r){ r.status='pending'; showToast(`ส่ง ${r.cp_no} เข้าสายอนุมัติตาม DOA แล้ว`,'success'); render(); openViewDrawer(id); } }
    function approveCp(id){ const r=state.records.find(x=>x.id===id); if(r){ r.status='approved'; showToast('อนุมัติผลเปรียบเทียบแล้ว','success'); render(); } }
    let poSeq = 10;
    function awardCp(id){ const r=state.records.find(x=>x.id===id); if(!r)return; r.status='awarded';
      (r.po_splits||[]).forEach(s=>{ if(!s.po_id) s.po_id='PO-2605-'+String(poSeq++).padStart(5,'0'); });   // id ออกโดยระบบ PO
      showToast(`ออกใบสั่งซื้อ ${(r.po_splits||[]).length} ใบแล้ว (mock)`,'success'); render(); }
  </script>
</body>
</html>
