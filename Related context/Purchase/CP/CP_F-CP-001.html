<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เปรียบเทียบราคา (CP) — F-CP-001 · P2P</title>
  <!--
    ============================================================
    F-CP-001 — เปรียบเทียบราคา (Comparison / CP) · P2P
    Drafted fresh by html-generator-v3 (v3.10) — Drawer Standard v2 (locked to pr.html)
    Design = PR list-view (Pattern A) + create drawer (Pattern B wizard) + view drawer (Pattern C)
    Feature logic:
      1. Ref PR — เลือกใบขอซื้อ approved + route=cp (po_direct = lock) → ดึง line มาเทียบ
      2. Compare N vendors = Purchase Config.cp_max_vendors
      3. 1 item = 1 ผู้ชนะ (radio/row); ต่าง item ผู้ชนะต่างกันได้
      4. PO Split — group ผู้ชนะตาม vendor → ออก PO หลายใบ (1 vendor = 1 PO) อ้างกลับ CP+PR
      5. DOA submit — สายอนุมัติ placeholder (ไม่ hardcode)
    ============================================================
  -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.460.0/dist/umd/lucide.min.js" defer></script>
  <style>
    /* ============================================================
       CUBE NATIVE Admin CI v2 — Design Tokens
       ============================================================ */
    :root {
      --c-navy:        #0B1D3A;
      --c-navy-d:      #06122A;
      --c-primary:     #0B5CFF;
      --c-primary-h:   #0a4ed1;
      --c-teal:        #00A88E;
      --c-slate:       #64748B;
      --c-off-white:   #F6F8FB;
      --c-white:       #FFFFFF;
      --c-border:      #E2E8F0;
      --c-border-soft: #EEF2F7;
      --c-text:        #0B1D3A;
      --c-text-mute:   #64748B;
      --c-text-soft:   #94A3B8;
      --c-warning:     #F59E0B;
      --c-danger:      #EF4444;
      --c-purple:      #7C3AED;
      --c-primary-08:  rgba(11, 92, 255, 0.08);
      --c-primary-12:  rgba(11, 92, 255, 0.12);
      --c-primary-18:  rgba(11, 92, 255, 0.18);
      --c-teal-08:     rgba(0, 168, 142, 0.08);
      --c-warning-08:  rgba(245, 158, 11, 0.10);
      --c-danger-08:   rgba(239, 68, 68, 0.10);
      --r-sm: 6px;
      --r:    10px;
      --r-lg: 14px;
      --sh-sm: 0 1px 2px rgba(11, 29, 58, 0.04), 0 1px 3px rgba(11, 29, 58, 0.06);
      --sh-md: 0 4px 8px rgba(11, 29, 58, 0.04), 0 2px 4px rgba(11, 29, 58, 0.06);
      --sh-lg: 0 10px 30px rgba(11, 29, 58, 0.08), 0 4px 10px rgba(11, 29, 58, 0.04);
      --sh-xl: 0 24px 60px rgba(11, 29, 58, 0.10), 0 8px 24px rgba(11, 29, 58, 0.06);
      --sw: 232px;
      --hh: 52px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Noto Sans Thai', -apple-system, sans-serif;
      font-size: 13px;
      line-height: 1.55;
      background: var(--c-off-white);
      color: var(--c-text);
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4, .display { font-family: 'Inter', 'Noto Sans Thai', sans-serif; letter-spacing: -0.015em; font-weight: 700; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }
    input, select, textarea { font-family: inherit; }
    .num { font-variant-numeric: tabular-nums; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--c-border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--c-text-soft); }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

    /* ============================================================
       SHELL — Sidebar (224px flat) + Main + Topbar (52px white)
       ============================================================ */
    .shell { display: grid; grid-template-columns: var(--sw) 1fr; min-height: 100vh; }

    .sb {
      background: linear-gradient(180deg, #0B1D3A 0%, #14284A 50%, #0B1D3A 100%);
      color: white;
      height: 100vh;
      position: sticky; top: 0;
      display: flex; flex-direction: column;
      border-right: 1px solid rgba(255,255,255,0.05);
      overflow: hidden;
    }
    .sb-logo {
      padding: 16px 18px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .sb-logo-mark {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--c-primary), var(--c-teal));
      border-radius: var(--r-sm);
      display: grid; place-items: center;
      flex-shrink: 0;
      color: white;
    }
    .sb-logo-text { line-height: 1.2; min-width: 0; }
    .sb-logo-title { font-size: 13px; font-weight: 700; color: white; }
    .sb-logo-sub {
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 1px;
    }

    .sb-menu { flex: 1; overflow-y: auto; padding: 12px 8px; }
    .sb-menu::-webkit-scrollbar { width: 4px; }
    .sb-menu::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }

    /* Module = collapsible group (Iron Rule #27). Header toggles only — never navigates. */
    .sb-module { margin-bottom: 4px; }
    .sb-module-header {
      display: flex; align-items: center; gap: 8px; width: 100%;
      padding: 8px 10px; border-radius: 6px;
      background: transparent; border: 0; color: rgba(255,255,255,0.5);
      font-family: inherit; font-size: 10.5px; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      cursor: pointer; transition: all 120ms; text-align: left;
    }
    .sb-module-header:hover { background: rgba(255,255,255,0.04); color: rgba(255,255,255,0.8); }
    .sb-module-header .mod-icon { flex-shrink: 0; opacity: 0.7; }
    .sb-module-header .mod-label { flex: 1; }
    .sb-module-header .mod-chevron { flex-shrink: 0; transition: transform 200ms; opacity: 0.7; }
    .sb-module[data-expanded="false"] .mod-chevron { transform: rotate(-90deg); }
    .sb-module[data-expanded="false"] .sb-features { display: none; }
    .sb-features { padding: 2px 0 6px 0; }

    .sb-item {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 12px 7px 14px; border-radius: 6px;
      color: rgba(255,255,255,0.78); font-size: 13px; font-weight: 500;
      cursor: pointer; transition: all 120ms; margin-bottom: 1px;
      position: relative; user-select: none; text-decoration: none;
    }
    .sb-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
    .sb-item.is-active { background: var(--c-primary); color: #fff; font-weight: 600; }
    .sb-item.is-active::before {
      content: ''; position: absolute; left: -8px; top: 7px; bottom: 7px;
      width: 3px; background: #fff; border-radius: 0 2px 2px 0;
    }
    .sb-item [data-lucide] { opacity: 0.85; }
    .sb-item.is-active [data-lucide] { opacity: 1; }
    .sb-item.is-disabled { opacity: 0.4; cursor: not-allowed; }
    .sb-item.is-disabled:hover { background: transparent; color: rgba(255,255,255,0.78); }

    .sb-badge {
      margin-left: auto; background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.75);
      font-size: 10px; font-weight: 700; padding: 1px 7px; border-radius: 999px; line-height: 1.4;
    }
    .sb-badge.alert { background: var(--c-danger); color: #fff; }
    .sb-item.is-active .sb-badge { background: rgba(255,255,255,0.20); color: #fff; }

    .sb-foot {
      padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0; display: flex; align-items: center; gap: 8px;
      font-size: 11px; color: rgba(255,255,255,0.45);
    }
    .pulse-dot {
      width: 7px; height: 7px; background: var(--c-teal); border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(0,168,142,0.20); animation: pulse-sb 2s infinite; flex-shrink: 0;
    }
    @keyframes pulse-sb { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }

    /* MAIN */
    .main { display: flex; flex-direction: column; min-width: 0; background: var(--c-off-white); }

    /* TOPBAR — White */
    .top {
      height: var(--hh);
      background: var(--c-white);
      border-bottom: 1px solid var(--c-border-soft);
      padding: 0 22px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px;
      position: sticky; top: 0; z-index: 50;
    }
    .top-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .top-bc { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--c-text); }
    .bc-root { color: var(--c-text-mute); cursor: pointer; transition: color 120ms; }
    .bc-root:hover { color: var(--c-primary); }
    .bc-sep { color: var(--c-text-soft); margin: 0 2px; }
    .bc-leaf { font-weight: 600; }

    .top-right { display: flex; align-items: center; gap: 12px; }
    .top-user {
      display: flex; align-items: center; gap: 10px;
      padding: 4px 4px 4px 12px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 120ms;
    }
    .top-user:hover { background: var(--c-off-white); }
    .top-user-info {
      display: flex; flex-direction: column;
      align-items: flex-end;
      line-height: 1.2;
    }
    .top-user-name { font-size: 12.5px; font-weight: 600; color: var(--c-navy); }
    .top-user-role { font-size: 10.5px; color: var(--c-text-mute); margin-top: 2px; }
    .top-avatar {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--c-primary), var(--c-teal));
      color: white;
      font-size: 12px; font-weight: 700;
      display: grid; place-items: center;
      flex-shrink: 0;
      box-shadow: 0 1px 3px rgba(11,92,255,0.25);
    }

    /* ===== Slim Top Bar (Iron Rule #28) — breadcrumb + notif + user chip ===== */
    .breadcrumb { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--c-text-mute); }
    .breadcrumb a { cursor: pointer; transition: color 120ms; color: var(--c-text-mute); text-decoration: none; }
    .breadcrumb a:hover { color: var(--c-primary); }
    .breadcrumb .sep { color: var(--c-text-soft); }
    .breadcrumb-current { color: var(--c-text); font-weight: 600; }
    .icon-btn {
      width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center;
      background: transparent; border: 0; color: var(--c-text-mute); border-radius: 7px;
      position: relative; transition: all 120ms; cursor: pointer;
    }
    .icon-btn:hover { background: var(--c-off-white); color: var(--c-text); }
    .notif-dot {
      position: absolute; top: 7px; right: 8px; width: 7px; height: 7px;
      background: var(--c-danger); border-radius: 50%; border: 2px solid #fff;
    }
    .user-chip { display: flex; align-items: center; gap: 9px; padding: 5px 10px 5px 12px; border-radius: 8px; cursor: pointer; transition: background 120ms; }
    .user-chip:hover { background: var(--c-off-white); }
    .user-text { line-height: 1.2; text-align: right; }
    .user-name { font-size: 12.5px; font-weight: 600; color: var(--c-navy); white-space: nowrap; }
    .user-role { font-size: 10.5px; color: var(--c-text-mute); white-space: nowrap; margin-top: 1px; }
    .avatar {
      width: 30px; height: 30px; border-radius: 50%;
      background: linear-gradient(135deg, var(--c-primary), var(--c-teal)); color: #fff;
      display: inline-flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; flex-shrink: 0;
    }
    .user-menu {
      position: absolute; top: calc(100% + 6px); right: 0; background: #fff;
      border: 1px solid var(--c-border); border-radius: 10px; box-shadow: var(--sh-lg);
      width: 220px; z-index: 60; padding: 6px; display: none;
    }
    .user-menu.is-open { display: block; }
    .user-menu-item { display: flex; align-items: center; gap: 10px; padding: 8px 11px; border-radius: 6px; font-size: 13px; color: var(--c-text); cursor: pointer; transition: background 120ms; }
    .user-menu-item:hover { background: var(--c-off-white); }
    .user-menu-item [data-lucide] { color: var(--c-text-soft); }
    .user-menu-item.is-danger { color: var(--c-danger); }
    .user-menu-item.is-danger [data-lucide] { color: var(--c-danger); }
    .user-menu-divider { height: 1px; background: var(--c-border-soft); margin: 5px 0; }

    /* Icon button (used in drawer headers — printer/download/close) */
    .top-icon-btn {
      width: 32px; height: 32px;
      background: var(--c-off-white);
      border: 1px solid var(--c-border);
      border-radius: var(--r);
      cursor: pointer;
      display: grid; place-items: center;
      color: var(--c-text-mute);
      position: relative;
      transition: all 120ms;
    }
    .top-icon-btn:hover { color: var(--c-text); border-color: var(--c-text-soft); background: var(--c-white); }

    /* PAGE */
    .page { flex: 1; padding: 22px 24px 40px; overflow-y: auto; }

    /* PAGE HEAD */
    .ph {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-bottom: 18px;
      gap: 16px; flex-wrap: wrap;
    }
    .ph-left { min-width: 0; }
    .ph-title { font-size: 22px; font-weight: 700; color: var(--c-navy); line-height: 1.2; }
    .ph-sub { font-size: 13px; color: var(--c-text-mute); margin-top: 4px; }
    .ph-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    /* ============================================================
       BUTTON SYSTEM
       ============================================================ */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px;
      padding: 0 14px;
      height: 34px;
      border-radius: var(--r);
      font-size: 12.5px;
      font-weight: 600;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      background: transparent;
      color: var(--c-text);
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
    }
    .btn:focus-visible { outline: 2px solid var(--c-primary); outline-offset: 2px; }
    .btn:disabled { cursor: not-allowed; opacity: 0.6; }
    .btn.lg { height: 38px; padding: 0 18px; font-size: 13px; }
    .btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
    .btn-primary    { background: var(--c-primary); color: white; border-color: var(--c-primary); }
    .btn-primary:hover:not(:disabled) { background: var(--c-primary-h); border-color: var(--c-primary-h); }
    .btn-secondary  { background: var(--c-white); color: var(--c-navy); border-color: var(--c-border); }
    .btn-secondary:hover:not(:disabled) { border-color: var(--c-text-soft); }
    .btn-ghost      { background: transparent; color: var(--c-text-mute); }
    .btn-ghost:hover:not(:disabled) { background: var(--c-off-white); color: var(--c-text); }
    .btn-success    { background: var(--c-teal); color: white; border-color: var(--c-teal); }
    .btn-success:hover:not(:disabled) { background: #00876F; border-color: #00876F; }
    .btn-danger     { background: var(--c-danger); color: white; border-color: var(--c-danger); }
    .btn-danger:hover:not(:disabled) { background: #dc2626; }
    .btn-link       { background: transparent; color: var(--c-primary); padding: 0; height: auto; font-weight: 600; }
    .btn-link:hover { text-decoration: underline; }

    /* ============================================================
       PILL / BADGE
       ============================================================ */
    .pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.02em; line-height: 1.6;
      white-space: nowrap;
    }
    .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .pill.draft     { background: rgba(100,116,139,0.12); color: var(--c-slate); }
    .pill.pending   { background: var(--c-warning-08);    color: #92400e; }
    .pill.approved  { background: var(--c-teal-08);       color: var(--c-teal); }
    .pill.rejected  { background: var(--c-danger-08);     color: var(--c-danger); }
    .pill.cancelled { background: rgba(100,116,139,0.12); color: var(--c-slate); }

    /* ============================================================
       CARD
       ============================================================ */
    .card {
      background: var(--c-white);
      border: 1px solid var(--c-border);
      border-radius: var(--r-lg);
      overflow: hidden;
    }
    .card-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--c-border-soft);
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .card-title { font-size: 14px; font-weight: 700; color: var(--c-navy); }
    .card-body { padding: 16px 18px; }
    .card-body.flush { padding: 0; }

    /* ============================================================
       INPUT / SELECT
       ============================================================ */
    .input, .select {
      height: 34px;
      background: var(--c-white);
      border: 1px solid var(--c-border);
      border-radius: var(--r);
      padding: 0 12px;
      font-size: 13px;
      color: var(--c-text);
      transition: all 0.15s;
      width: 100%;
    }
    .input::placeholder { color: var(--c-text-soft); }
    .input:focus, .select:focus {
      outline: none;
      border-color: var(--c-primary);
      box-shadow: 0 0 0 3px var(--c-primary-12);
    }
    label.required::after { content: ' *'; color: var(--c-danger); }

    /* ============================================================
       TABS
       ============================================================ */
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--c-border); margin-bottom: 16px; }
    .tab {
      background: transparent; border: none;
      border-bottom: 2px solid transparent;
      padding: 8px 14px;
      font-size: 13px; font-weight: 500; color: var(--c-text-mute);
      cursor: pointer; margin-bottom: -1px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .tab:hover { color: var(--c-text); }
    .tab.on { color: var(--c-primary); border-bottom-color: var(--c-primary); font-weight: 600; }

    /* ============================================================
       TABLE
       ============================================================ */
    .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tbl th {
      text-align: left; padding: 10px 14px;
      font-size: 10.5px; font-weight: 700;
      color: var(--c-text-mute);
      background: var(--c-off-white);
      border-bottom: 1px solid var(--c-border);
      text-transform: uppercase; letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .tbl td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--c-border-soft);
      color: var(--c-text);
      vertical-align: middle;
    }
    .tbl tbody tr { transition: background 0.1s; cursor: pointer; }
    .tbl tbody tr:hover { background: var(--c-off-white); }
    .tbl tbody tr:last-child td { border-bottom: none; }
    .tbl-name { font-weight: 600; color: var(--c-navy); }
    .tbl-meta { font-size: 11px; color: var(--c-text-mute); margin-top: 1px; }
    .tbl-mono { font-family: ui-monospace, monospace; font-size: 12px; }
    .tbl-num { font-variant-numeric: tabular-nums; text-align: right; }
    .tbl-th-sortable { cursor: pointer; user-select: none; }
    .tbl-th-sortable:hover { color: var(--c-text); }
    /* Compact list rows (single-line, tighter height) */
    .tbl-compact th { padding: 8px 12px; }
    .tbl-compact td { padding: 7px 12px; }

    /* Progress bar */
    .progress-bar {
      width: 64px; height: 6px;
      background: var(--c-border-soft);
      border-radius: 999px;
      overflow: hidden;
      display: inline-block;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--c-teal);
      border-radius: 999px;
      transition: width 200ms;
    }
    .progress-bar-fill.pending { background: var(--c-warning); }
    .progress-bar-fill.zero { background: var(--c-border); }

    /* ============================================================
       STEPPER
       ============================================================ */
    .stepper { display: flex; align-items: flex-start; gap: 0; width: 100%; }
    .stepper-item {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      position: relative; min-width: 0;
    }
    .stepper-circle {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600;
      background: var(--c-white); color: var(--c-text-soft);
      border: 2px solid var(--c-border);
      transition: all 200ms; z-index: 2;
    }
    .stepper-item.active .stepper-circle {
      background: var(--c-primary); color: white; border-color: var(--c-primary);
      box-shadow: 0 0 0 4px var(--c-primary-12);
    }
    .stepper-item.done .stepper-circle {
      background: var(--c-primary); color: white; border-color: var(--c-primary);
    }
    .stepper-label {
      margin-top: 8px; font-size: 12px; font-weight: 500;
      color: var(--c-text-soft); text-align: center; line-height: 1.3;
      transition: color 200ms;
    }
    .stepper-item.active .stepper-label { color: var(--c-navy); font-weight: 600; }
    .stepper-item.done .stepper-label { color: var(--c-text-mute); }
    .stepper-item:not(:last-child)::after {
      content: ''; position: absolute;
      top: 15px; left: 50%; right: -50%; height: 2px;
      background: var(--c-border); z-index: 1;
    }
    .stepper-item.done:not(:last-child)::after { background: var(--c-primary); }

    /* ============================================================
       DRAWER + MODAL — Self-contained CSS (don't depend on Tailwind utilities)
       ============================================================ */
    .overlay-wrap { position: fixed; inset: 0; z-index: 50; }
    .backdrop { position: absolute; inset: 0; background-color: rgba(0,0,0,0.45); cursor: pointer; }
    .drawer-panel {
      position: absolute; right: 0; top: 0;
      height: 100%; width: 100%;
      max-width: 1290px;
      background: white;
      box-shadow: var(--sh-xl);
      display: flex; flex-direction: column;
    }
    .drawer-panel.standard { max-width: 860px; }
    .modal-overlay {
      position: fixed; inset: 0; z-index: 60;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .hidden { display: none !important; }

    .drawer-enter { transform: translateX(100%); }
    .drawer-active { transform: translateX(0); transition: transform 250ms ease-out; }

    @keyframes slide-in { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .animate-slide-in { animation: slide-in 200ms ease-out; }

    /* Slide-down animation for expandable line panel (Pattern E) */
    @keyframes line-expand-slide {
      from {
        opacity: 0;
        transform: translateY(-8px);
        max-height: 0;
      }
      to {
        opacity: 1;
        transform: translateY(0);
        max-height: 600px;
      }
    }
    @keyframes line-collapse-slide {
      from {
        opacity: 1;
        transform: translateY(0);
        max-height: 600px;
      }
      to {
        opacity: 0;
        transform: translateY(-8px);
        max-height: 0;
      }
    }
    .line-expand-panel {
      animation: line-expand-slide 220ms cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: top;
      overflow: hidden;
    }
    .line-collapse-panel {
      animation: line-collapse-slide 200ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
      transform-origin: top;
      overflow: hidden;
    }

    /* ============================================================
       UPLOAD ZONE
       ============================================================ */
    .upload-zone {
      border: 2px dashed var(--c-border);
      border-radius: var(--r-lg);
      padding: 32px 16px;
      text-align: center;
      background: #FAFBFD;
      cursor: pointer;
      transition: all 150ms;
    }
    .upload-zone:hover { border-color: var(--c-primary); background: var(--c-primary-08); }
    .upload-zone.has-files { padding: 16px; }

    /* ============================================================
       FORM GRID
       ============================================================ */
    .form-grp {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 14px 18px;
    }
    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-field label {
      font-size: 12.5px; font-weight: 500; color: var(--c-navy);
      display: flex; align-items: center; gap: 4px;
    }
    .form-field-help {
      font-size: 11px; color: var(--c-text-soft);
      display: flex; align-items: center; gap: 4px;
    }

    /* Toggle */
    .toggle {
      position: relative; display: inline-block;
      width: 36px; height: 20px;
      flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--c-border);
      border-radius: 20px;
      transition: 200ms;
    }
    .toggle-slider::before {
      position: absolute; content: '';
      height: 14px; width: 14px;
      left: 3px; bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 200ms;
    }
    .toggle input:checked + .toggle-slider { background-color: var(--c-primary); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(16px); }

    /* Section divider for wizard step 2 */
    .section-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px;
      background: var(--c-off-white);
      border: 1px solid var(--c-border);
      border-radius: var(--r);
      margin-bottom: 10px;
    }
    .section-label { font-size: 13px; font-weight: 500; color: var(--c-navy); display: flex; align-items: center; gap: 8px; }

    mark { background: #FEF3C7; color: var(--c-navy); border-radius: 2px; padding: 0 2px; }
    /* Hint = hover tooltip on small i icon (Iron Rule #33 — never a standing banner) */
    .hint-i {
      display: inline-grid; place-items: center; width: 15px; height: 15px;
      border-radius: 50%; background: rgba(11,29,58,0.08); color: var(--c-navy);
      font-size: 10px; font-weight: 700; font-style: normal; cursor: help; position: relative; line-height: 1;
    }
    .hint-i::after {
      content: attr(data-tip); position: absolute; left: 0; bottom: calc(100% + 8px);
      background: var(--c-navy); color: #fff; font-size: 11.5px; font-weight: 400; line-height: 1.45;
      padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.12);
      width: max-content; max-width: 300px; white-space: normal; text-align: left;
      box-shadow: 0 8px 24px rgba(0,0,0,0.18); opacity: 0; pointer-events: none; transition: opacity 120ms ease-out; z-index: 90;
    }
    .hint-i:hover::after { opacity: 1; }
    /* Routing badge (CP / PO-direct) */
    .route-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 999px; line-height: 1.4; white-space: nowrap; }
    .route-badge.cp        { background: var(--c-primary-08); color: var(--c-primary); }
    .route-badge.po_direct { background: var(--c-teal-08);    color: var(--c-teal); }
    .route-badge.none      { background: rgba(100,116,139,0.10); color: var(--c-text-mute); }
    /* Utility shim — self-contained replacement for the few Tailwind classes used
       (icon sizing + hidden + inline). Removes the cdn.tailwindcss.com production dependency. */
    .w-3{width:.75rem}.h-3{height:.75rem}
    .w-3\.5{width:.875rem}.h-3\.5{height:.875rem}
    .w-4{width:1rem}.h-4{height:1rem}
    .w-5{width:1.25rem}.h-5{height:1.25rem}
    .w-6{width:1.5rem}.h-6{height:1.5rem}
    .w-10{width:2.5rem}.h-10{height:2.5rem}
    .hidden{display:none !important}
    .inline{display:inline}
    /* ===== CP comparison matrix ===== */
    /* ===== comparison matrix (cell = price + winner button) ===== */
    .cmp-wrap{overflow:auto;border:1px solid var(--c-border);border-radius:16px;background:#fff;max-width:100%;box-shadow:var(--sh-md)}
    table.cmp{border-collapse:separate;border-spacing:0;width:100%;font-size:13px;min-width:760px}
    table.cmp th,table.cmp td{padding:0;border-bottom:1px solid var(--c-border-soft);text-align:right;white-space:nowrap;vertical-align:middle}
    table.cmp thead th{position:sticky;top:0;background:var(--c-navy);color:#fff;font-weight:600;font-size:12px;z-index:3;padding:15px 18px;text-align:center}
    table.cmp thead th .vsub{font-weight:400;font-size:10.5px;opacity:.8;margin-top:3px}
    table.cmp th.it,table.cmp td.it{text-align:left;position:sticky;left:0;background:#fff;z-index:2;min-width:300px;border-right:1px solid var(--c-border);padding:16px 20px}
    table.cmp thead th.it{background:var(--c-navy);z-index:4;text-align:left;font-size:12.5px}
    table.cmp tbody tr:hover td{background:#FBFCFE}
    table.cmp tbody tr:hover td.it{background:#F4F8FF}
    /* left product cell: name+code+pr (left) · qty (big, right) */
    .cmp-prod{display:flex;align-items:center;gap:14px}
    .cmp-prod-main{flex:1;min-width:0}
    .cmp-prod-name{font-weight:600;font-size:13.5px;color:var(--c-text);line-height:1.4}
    .cmp-prod-meta{font-size:11px;color:var(--c-text-mute);margin-top:5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    .cmp-prod-meta .dot{color:var(--c-border)}
    .cmp-qty{flex-shrink:0;text-align:right;min-width:58px;padding-left:12px;border-left:1px solid var(--c-border-soft)}
    .cmp-qty-v{font-size:20px;font-weight:800;color:var(--c-navy);font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-.02em}
    .cmp-qty-u{font-size:10.5px;color:var(--c-text-soft);margin-top:4px;font-weight:500}
    .cmp-vcell{min-width:196px;padding:14px 16px}
    .cmp-cell-in{display:flex;flex-direction:column;gap:10px;align-items:stretch}
    .price-box{position:relative;display:flex;align-items:center}
    .price-box .cur{position:absolute;left:10px;font-size:12px;color:var(--c-text-soft);pointer-events:none}
    .cmp-price-inp{width:100%;text-align:right;border:1.5px solid var(--c-border);border-radius:9px;padding:9px 11px 9px 22px;font-size:13px;font-variant-numeric:tabular-nums;background:#fff;transition:border-color 120ms,box-shadow 120ms}
    .cmp-price-inp:hover{border-color:var(--c-primary-18)}
    .cmp-price-inp:focus{outline:none;border-color:var(--c-primary);box-shadow:0 0 0 3px var(--c-primary-12)}
    .cmp-cell.is-low .cmp-price-inp{border-color:var(--c-teal);background:var(--c-teal-08)}
    .lowtag{position:absolute;top:-8px;right:8px;font-size:9.5px;font-weight:700;color:var(--c-teal);background:#fff;padding:0 5px;border-radius:6px;letter-spacing:.02em}
    .win-btn{display:flex;align-items:center;justify-content:center;gap:5px;width:100%;padding:7px 10px;font-size:12px;font-weight:600;border-radius:9px;border:1.5px solid var(--c-border);background:#fff;color:var(--c-text-mute);cursor:pointer;transition:all 120ms}
    .win-btn:hover:not(:disabled){border-color:var(--c-primary);color:var(--c-primary);background:var(--c-primary-08)}
    .win-btn:disabled{opacity:.45;cursor:not-allowed}
    .win-btn.active{background:var(--c-teal);border-color:var(--c-teal);color:#fff;box-shadow:0 2px 8px var(--c-teal-08)}
    .cmp-cell.is-win{background:linear-gradient(180deg,rgba(0,168,142,.07),rgba(0,168,142,.03))}
    .cmp-foot td{background:var(--c-off-white);font-weight:700;border-top:2px solid var(--c-border);padding:12px 16px;font-variant-numeric:tabular-nums}
    .cmp-foot td.it{background:var(--c-off-white)}
    .cmp-foot .winsum{color:var(--c-teal)}
    /* ===== vendor selectable cards (step 2) ===== */
    .vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:12px}
    .vcard{position:relative;display:flex;gap:12px;align-items:flex-start;padding:14px;border:1.5px solid var(--c-border);border-radius:12px;background:#fff;cursor:pointer;transition:all 130ms}
    .vcard:hover{border-color:var(--c-primary-18);box-shadow:var(--sh-sm);transform:translateY(-1px)}
    .vcard.sel{border-color:var(--c-primary);background:var(--c-primary-08)}
    .vcard.dis{opacity:.5;pointer-events:none;filter:grayscale(.3)}
    .vcard-ic{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--c-off-white);color:var(--c-primary);flex-shrink:0}
    .vcard.sel .vcard-ic{background:var(--c-primary);color:#fff}
    .vcard-name{font-weight:600;font-size:13px;color:var(--c-text);line-height:1.35}
    .vcard-meta{font-size:11.5px;color:var(--c-text-mute);margin-top:3px;display:flex;align-items:center;gap:5px}
    .vcard-check{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--c-primary);color:#fff;opacity:0;transform:scale(.6);transition:all 130ms}
    .vcard.sel .vcard-check{opacity:1;transform:scale(1)}
    /* ===== PR pick list (step 1) ===== */
    .pr-search{position:relative;margin-bottom:12px}
    .pr-search > i, .pr-search > svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--c-text-soft);pointer-events:none}
    .pr-search input{width:100%;padding:10px 12px 10px 36px;border:1.5px solid var(--c-border);border-radius:10px;font-size:13px;background:#fff}
    .pr-search input:focus{outline:none;border-color:var(--c-primary);box-shadow:0 0 0 3px var(--c-primary-12)}
    .ref-card{display:flex;gap:13px;padding:13px 15px;border:1.5px solid var(--c-border);border-radius:12px;cursor:pointer;margin-bottom:9px;align-items:flex-start;transition:all 120ms;background:#fff}
    .ref-card:hover{border-color:var(--c-primary-18);box-shadow:var(--sh-sm)}
    .ref-card.on{border-color:var(--c-primary);background:var(--c-primary-08)}
    .ref-chk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--c-border);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;background:#fff;transition:all 120ms}
    .ref-card.on .ref-chk{background:var(--c-primary);border-color:var(--c-primary);color:#fff}
    .ref-no{font-weight:700;color:var(--c-navy);font-family:'JetBrains Mono','SF Mono',monospace;font-size:12.5px;letter-spacing:-.01em}
    /* compact PR list (step 1 — 2 lines, single select) */
    .pr-row{display:flex;gap:11px;align-items:flex-start;padding:9px 13px;border:1.5px solid var(--c-border);border-radius:10px;margin-bottom:6px;cursor:pointer;transition:all 110ms;background:#fff}
    .pr-row:hover{border-color:var(--c-primary-18);background:#fafbff}
    .pr-row.on{border-color:var(--c-primary);background:var(--c-primary-08)}
    .pr-radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--c-border);flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:2px;transition:all 110ms}
    .pr-row.on .pr-radio{border-color:var(--c-primary)}
    .pr-row.on .pr-radio::after{content:'';width:9px;height:9px;border-radius:50%;background:var(--c-primary)}
    .pr-l1{display:flex;align-items:center;gap:7px;flex-wrap:nowrap;overflow:hidden}
    .pr-l1 .meta{color:var(--c-text-mute);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;display:flex;align-items:center;gap:5px}
    .pr-l2{display:flex;align-items:center;gap:8px;margin-top:4px;font-size:11px;color:var(--c-text-mute);overflow:hidden}
    .pr-l2 .items{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
    .pr-amt{flex-shrink:0;text-align:right;padding-left:14px;border-left:1px solid var(--c-border-soft);margin-left:4px;align-self:center}
    .pr-amt-v{font-size:19px;font-weight:800;color:var(--c-navy);font-family:'JetBrains Mono','SF Mono',monospace;letter-spacing:-.02em;line-height:1.1}
    .pr-row.on .pr-amt-v{color:var(--c-primary)}
    .pr-amt-l{font-size:10px;color:var(--c-text-soft);margin-top:2px;font-weight:500}
    /* selected vendors section (step 2) */
    .v-section-label{font-size:11.5px;font-weight:600;color:var(--c-text-mute);text-transform:none;margin:0 0 9px;display:flex;align-items:center;gap:6px}
    .v-selected-box{background:var(--c-off-white);border:1px solid var(--c-border-soft);border-radius:12px;padding:13px;margin-bottom:18px}
    .v-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:13px;flex-wrap:wrap}
    .v-search{position:relative;flex:1;min-width:200px}
    .v-search > i, .v-search > svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--c-text-soft);pointer-events:none}
    .v-search input{width:100%;padding:9px 11px 9px 34px;border:1.5px solid var(--c-border);border-radius:10px;font-size:12.5px;background:#fff}
    .v-search input:focus{outline:none;border-color:var(--c-primary);box-shadow:0 0 0 3px var(--c-primary-12)}
    /* ===== PO split summary (step 4) ===== */
    .po-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
    .po-stat{border:1px solid var(--c-border);border-radius:12px;padding:14px 16px;background:#fff;box-shadow:var(--sh-sm)}
    .po-stat .lbl{font-size:11.5px;color:var(--c-text-mute);display:flex;align-items:center;gap:6px}
    .po-stat .val{font-size:22px;font-weight:700;color:var(--c-navy);margin-top:6px;font-variant-numeric:tabular-nums}
    .po-stat.accent{background:linear-gradient(135deg,var(--c-navy),var(--c-navy-d));border-color:var(--c-navy)}
    .po-stat.accent .lbl{color:rgba(255,255,255,.75)}
    .po-stat.accent .val{color:#fff}
    .po-card{border:1px solid var(--c-border);border-radius:14px;margin-bottom:14px;background:#fff;overflow:hidden;box-shadow:var(--sh-sm)}
    .po-card-head{display:flex;align-items:center;gap:11px;padding:14px 16px;background:var(--c-off-white);border-bottom:1px solid var(--c-border)}
    .po-av{width:34px;height:34px;border-radius:9px;background:var(--c-primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex-shrink:0}
    .po-card-head .nm{font-weight:700;font-size:13px;color:var(--c-navy)}
    .po-card-head .sub{font-size:11px;color:var(--c-text-mute);margin-top:1px}
    .po-card-head .po-badge{margin-left:auto;font-size:11px;font-weight:600;color:var(--c-primary);background:var(--c-primary-08);padding:4px 11px;border-radius:999px}
    .po-tbl{width:100%;font-size:12.5px;border-collapse:collapse}
    .po-tbl th{color:var(--c-text-mute);font-size:11px;text-align:left;font-weight:500;padding:9px 16px;border-bottom:1px solid var(--c-border-soft)}
    .po-tbl td{padding:9px 16px;border-bottom:1px solid var(--c-border-soft)}
    .po-tbl tr:last-child td{border-bottom:none}
    .po-tbl .po-sub td{background:var(--c-off-white);font-weight:700}
    /* stepper (create wizard — same as PR) */
    .stepper{display:flex;align-items:flex-start;gap:0;width:100%}
    .stepper-item{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;min-width:0}
    .stepper-circle{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;background:var(--c-white);color:var(--c-text-soft);border:2px solid var(--c-border);transition:all 200ms;z-index:2}
    .stepper-item.active .stepper-circle{background:var(--c-primary);color:#fff;border-color:var(--c-primary);box-shadow:0 0 0 4px var(--c-primary-12)}
    .stepper-item.done .stepper-circle{background:var(--c-primary);color:#fff;border-color:var(--c-primary)}
    .stepper-label{margin-top:8px;font-size:12px;font-weight:500;color:var(--c-text-soft);text-align:center;line-height:1.3;transition:color 200ms}
    .stepper-item.active .stepper-label{color:var(--c-navy);font-weight:600}
    .stepper-item.done .stepper-label{color:var(--c-text-mute)}
    .stepper-item:not(:last-child)::after{content:'';position:absolute;top:15px;left:50%;right:-50%;height:2px;background:var(--c-border);z-index:1}
    .stepper-item.done:not(:last-child)::after{background:var(--c-primary)}
    /* step tabs (view drawer only) */
    /* view-drawer tabs — เหมือน PR เป๊ะ */
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--c-border); margin-bottom: 16px; }
    .tab { background: transparent; border: none; border-bottom: 2px solid transparent; padding: 8px 14px; font-size: 13px; font-weight: 500; color: var(--c-text-mute); cursor: pointer; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 6px; }
    .tab:hover { color: var(--c-text); }
    .tab.on { color: var(--c-primary); border-bottom-color: var(--c-primary); font-weight: 600; }
    .sec-title{font-size:13px;font-weight:700;color:var(--c-navy);margin-bottom:8px;display:flex;align-items:center;gap:8px}
  </style>
</head>
<body>
  <div class="shell">
    <aside class="sb">
      <div class="sb-logo">
        <div class="sb-logo-mark"><i data-lucide="box" class="w-4 h-4"></i></div>
        <div class="sb-logo-text"><div class="sb-logo-title">CUBE ERP</div><div class="sb-logo-sub">2BSimple</div></div>
      </div>
      <nav class="sb-menu" id="sb-nav">
        <div class="sb-module" data-module="general" data-expanded="false">
          <button class="sb-module-header" type="button" onclick="toggleModule(this)">
            <i data-lucide="layout-grid" class="mod-icon w-3.5 h-3.5"></i><span class="mod-label">ทั่วไป</span>
            <i data-lucide="chevron-down" class="mod-chevron w-3 h-3"></i></button>
          <div class="sb-features">
            <a class="sb-item" data-feature="home" href="#"><i data-lucide="home" class="w-4 h-4"></i><span>หน้าหลัก</span></a>
            <a class="sb-item" data-feature="tasks" href="#"><i data-lucide="check-square" class="w-4 h-4"></i><span>งานของฉัน</span><span class="sb-badge">12</span></a>
          </div>
        </div>
        <div class="sb-module" data-module="procurement" data-expanded="true">
          <button class="sb-module-header" type="button" onclick="toggleModule(this)">
            <i data-lucide="shopping-cart" class="mod-icon w-3.5 h-3.5"></i><span class="mod-label">การจัดซื้อ</span>
            <i data-lucide="chevron-down" class="mod-chevron w-3 h-3"></i></button>
          <div class="sb-features">

    const CP_PILL = {

      approved:{t:'อนุมัติแล้ว',c:'#047857',bg:'#D1FAE5'}, awarded:{t:'ออก PO แล้ว',c:'#0B5CFF',bg:'#DBEAFE'},

    const state = { records:[], filters:{ search:'', status:'all' }, pagination:{ page:1, pageSize:10 }, sort:{ key:'cp_date', dir:'desc' } };
    function seedRecords(){
      state.records = [
        { id:'1', cp_no:'CP-2605-00003', cp_date:'2026-05-27', pr_refs:['PR-2605-00012'], buyer:'Tadswan Chanyarakskul', item_count:3, vendor_count:3, po_count:2, status:'approved', winner_total:13700.00, po_splits:[{vendor:'บจก. สยามออฟฟิศ ซัพพลาย',po_id:null,lines:[{item_name:'กระดาษ A4 80g',item_code:'PPR-A4',qty:50,unit:'รีม',price:125},{item_name:'ชุดอุปกรณ์สำนักงาน',item_code:'OFS-001',qty:8,unit:'ชุด',price:350}]},{vendor:'บจก. ที.เค. สเตชันเนอรี่',po_id:null,lines:[{item_name:'หมึกพิมพ์ HP 12A',item_code:'INK-12A',qty:10,unit:'ตลับ',price:465}]}] },
        { id:'2', cp_no:'CP-2605-00002', cp_date:'2026-05-25', pr_refs:['PR-2605-00018'], buyer:'Tadswan Chanyarakskul', item_count:2, vendor_count:2, po_count:1, status:'awarded',  winner_total:5170.00, po_splits:[{vendor:'หจก. กรุงเทพ เปเปอร์',po_id:'PO-2605-00007',lines:[{item_name:'ลังกระดาษ เบอร์ S',item_code:'BOX-S',qty:100,unit:'ใบ',price:16},{item_name:'กระดาษ A4 80g',item_code:'PPR-A4',qty:30,unit:'รีม',price:119}]}] },
        { id:'3', cp_no:'CP-2605-00001', cp_date:'2026-05-22', pr_refs:['PR-2605-00018'], buyer:'Tadswan Chanyarakskul', item_count:2, vendor_count:3, po_count:2, status:'pending', winner_total:5450.00, po_splits:[{vendor:'บจก. สยามออฟฟิศ ซัพพลาย',po_id:null,lines:[{item_name:'กระดาษ A4 80g',item_code:'PPR-A4',qty:30,unit:'รีม',price:125}]},{vendor:'บจก. โอ.เอ. เซ็นเตอร์',po_id:null,lines:[{item_name:'ลังกระดาษ เบอร์ S',item_code:'BOX-S',qty:100,unit:'ใบ',price:17}]}] },

      ];
    }

    // ===== router + shell helpers =====
    function getRoute(){ const h=location.hash.slice(2); if(!h) return {name:'list'}; const p=h.split('/');
      if(p[0]==='create') return {name:'create'}; if(p[0]==='view'&&p[1]) return {name:'view',id:p[1]}; return {name:'list'}; }
    function navigate(path){ location.hash='#/'+path; }

    window.addEventListener('hashchange', render);
    function renderIcons(){ if(typeof lucide!=='undefined'&&lucide.createIcons){ try{lucide.createIcons();}catch(e){} } else setTimeout(renderIcons,50); }
    function showToast(message,type='success'){ const colors={success:'var(--c-teal)',error:'var(--c-danger)',warning:'var(--c-warning)',info:'var(--c-primary)'}; const icons={success:'check-circle-2',error:'x-circle',warning:'alert-triangle',info:'info'};
      const t=document.createElement('div'); t.className='animate-slide-in'; t.style.cssText=`background:${colors[type]};color:#fff;padding:10px 14px;border-radius:var(--r);box-shadow:var(--sh-lg);display:flex;align-items:center;gap:10px;min-width:280px;font-size:13px;margin-top:8px;`;
      t.innerHTML=`<i data-lucide="${icons[type]}" class="w-4 h-4"></i><span>${message}</span>`; document.getElementById('toast-root').appendChild(t); renderIcons();
      setTimeout(()=>{ t.style.transition='opacity 200ms'; t.style.opacity='0'; setTimeout(()=>t.remove(),200); },2800); }
    function boot(){ if(window.__cpBooted)return; window.__cpBooted=true; try{ seedRecords(); render(); }catch(e){ document.getElementById('page-content').innerHTML='<div style="padding:32px;color:#EF4444;">Boot error: '+(e.message||e)+'</div>'; } }
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
    setTimeout(boot,1500);
    function render(){ const r=getRoute(); document.getElementById('page-content').innerHTML=renderListPage(); document.getElementById('drawer-root').innerHTML='';
      if(r.name==='create') openCreateDrawer(); else if(r.name==='view') openViewDrawer(r.id); requestAnimationFrame(renderIcons); }

    // ============================================================
    //  LIST (Pattern A — identical structure to PR)
    // ============================================================
    function renderListPage(){
      const totalCount = state.records.length; const f = state.filters;
      return `
        <div class="ph">
          <div class="ph-left">
            <h1 class="ph-title">เปรียบเทียบราคา (CP)</h1>
            <div class="ph-sub">เปรียบเทียบราคาผู้ขายจากใบขอซื้อ แล้วเลือกผู้ชนะรายสินค้า เพื่อแตกใบสั่งซื้อ <span style="margin-left:6px;padding:2px 8px;border-radius:999px;background:var(--c-off-white);font-size:11px;font-weight:600;color:var(--c-text);">${totalCount} รายการ</span></div>
          </div>
          <div class="ph-right">
            <button onclick="exportCSV()" class="btn btn-secondary"><i data-lucide="download" class="w-4 h-4"></i><span>ส่งออก CSV</span></button>
            <button onclick="navigate('create')" class="btn btn-primary"><i data-lucide="plus" class="w-4 h-4"></i><span>สร้างใบเปรียบเทียบราคา</span></button>
          </div>
        </div>
        <div class="card" style="margin-bottom:14px;">
          <div class="card-body" style="padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;">
            <div style="position:relative;flex:1;min-width:240px;max-width:380px;">
              <i data-lucide="search" class="w-4 h-4" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--c-text-soft);"></i>
              <input type="text" id="searchInput" value="${f.search}" placeholder="ค้นหาเลขที่ CP / ผู้จัดทำ / อ้างอิง PR..." oninput="onSearchInput(event)" class="input" style="padding-left:32px;">
            </div>
            <select onchange="state.filters.status=this.value;state.pagination.page=1;renderTableOnly();" class="select" style="width:170px;">
              <option value="all"      ${f.status==='all'?'selected':''}>สถานะทั้งหมด</option>
              <option value="draft"    ${f.status==='draft'?'selected':''}>ร่าง</option>
              <option value="pending"  ${f.status==='pending'?'selected':''}>รออนุมัติ</option>
              <option value="approved" ${f.status==='approved'?'selected':''}>อนุมัติแล้ว</option>
              <option value="awarded"  ${f.status==='awarded'?'selected':''}>ออก PO แล้ว</option>
            </select>
            <button onclick="resetFilters()" class="btn btn-ghost sm"><i data-lucide="x" class="w-3.5 h-3.5"></i><span>รีเซ็ต</span></button>
          </div>
        </div>
        <div class="card">
          <div style="overflow-x:auto;">
            <table class="tbl tbl-compact">
              <thead><tr>
                <th class="tbl-th-sortable" onclick="sortBy('cp_no')">เลขที่ CP <i data-lucide="chevrons-up-down" class="w-3 h-3 inline"></i></th>

                <th>อ้างอิง PR</th>
                <th>ผู้จัดทำ</th>
                <th style="text-align:center;">รายการ</th>

                <th style="text-align:right;" class="tbl-th-sortable" onclick="sortBy('winner_total')">มูลค่าผู้ชนะ <i data-lucide="chevrons-up-down" class="w-3 h-3 inline"></i></th>
                <th style="width:48px;"></th>
              </tr></thead>
              <tbody id="table-body">${renderRows()}</tbody>
            </table>

          <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid var(--c-border-soft);background:var(--c-off-white);">
            <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--c-text-mute);">
              <span>แสดงต่อหน้า</span>
              <select onchange="state.pagination.pageSize=parseInt(this.value);state.pagination.page=1;renderTableOnly();" class="select" style="width:64px;height:28px;padding:0 8px;font-size:12px;">
                <option ${state.pagination.pageSize===10?'selected':''}>10</option>
                <option ${state.pagination.pageSize===25?'selected':''}>25</option>
                <option ${state.pagination.pageSize===50?'selected':''}>50</option>
              </select>
            </div>
            <div id="pagination-info" style="font-size:12px;color:var(--c-text-mute);">${getPageInfo()}</div>
          </div>
        </div>`;
    }
    function renderRows(){
      const { items } = getPaginatedRecords();
      if(items.length===0) return `<tr><td colspan="10" style="padding:48px 16px;text-align:center;">

          <td style="text-align:center;">${r.vendor_count}</td>
          <td style="text-align:center;"><span style="display:inline-flex;align-items:center;gap:4px;font-weight:600;color:var(--c-primary);"><i data-lucide="receipt" class="w-3 h-3"></i>${r.po_count}</span></td>
          <td style="white-space:nowrap;">${renderPill(r.status)}</td>
          <td class="tbl-num" style="white-space:nowrap;">${r.winner_total? '<strong>฿'+formatMoney(r.winner_total)+'</strong>' : '<span style="color:var(--c-text-soft);">—</span>'}</td>

        </tr>`).join('');

    function renderTableOnly(){ document.getElementById('table-body').innerHTML=renderRows(); document.getElementById('pagination-info').textContent=getPageInfo(); renderIcons(); }
    function getFilteredRecords(){ let res=[...state.records]; const f=state.filters;
      if(f.search){ const q=f.search.toLowerCase(); res=res.filter(r=>r.cp_no.toLowerCase().includes(q)||r.buyer.toLowerCase().includes(q)||r.pr_refs.join(' ').toLowerCase().includes(q)); }
      if(f.status!=='all') res=res.filter(r=>r.status===f.status);
      const {key,dir}=state.sort; const mul=dir==='asc'?1:-1;
      res.sort((a,b)=>{ let x=a[key],y=b[key]; if(typeof x==='string'){x=x||'';y=y||'';return x.localeCompare(y)*mul;} return ((x||0)-(y||0))*mul; });
      return res; }
    function getPaginatedRecords(){ const all=getFilteredRecords(); const {page,pageSize}=state.pagination; const s=(page-1)*pageSize; return {items:all.slice(s,s+pageSize),total:all.length}; }
    function getPageInfo(){ const {total}=getPaginatedRecords(); const {page,pageSize}=state.pagination; if(total===0)return '0 รายการ'; const s=(page-1)*pageSize+1,e=Math.min(page*pageSize,total); return `${s}–${e} จาก ${total} รายการ`; }
    function sortBy(key){ if(state.sort.key===key) state.sort.dir=state.sort.dir==='asc'?'desc':'asc'; else {state.sort.key=key;state.sort.dir='asc';} renderTableOnly(); }
    let _searchT=null;
    function onSearchInput(e){ state.filters.search=e.target.value; state.pagination.page=1; clearTimeout(_searchT); _searchT=setTimeout(renderTableOnly,180); }
    function resetFilters(){ state.filters={search:'',status:'all'}; state.pagination.page=1; render(); }
    function exportCSV(){ const rows=[['เลขที่ CP','วันที่','อ้างอิง PR','ผู้จัดทำ','รายการ','ผู้ขายที่เทียบ','PO ที่จะออก','สถานะ','มูลค่าผู้ชนะ']];
      getFilteredRecords().forEach(r=>rows.push([r.cp_no,r.cp_date,r.pr_refs.join(' | '),r.buyer,r.item_count,r.vendor_count,r.po_count,(CP_PILL[r.status]||{}).t||r.status,r.winner_total]));
      const csv='\uFEFF'+rows.map(row=>row.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
      const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8;'})); a.download='comparison_F-CP-001.csv'; a.click(); URL.revokeObjectURL(a.href); showToast('ส่งออก CSV แล้ว','success'); }
    function openRowMenu(id,ev){ ev.stopPropagation(); navigate('view/'+id); }

    // ============================================================
    //  DRAWER MECHANICS (overlay-wrap + backdrop + drawer-panel, slide 250ms)
    // ============================================================
    function openDrawer(innerHtml, wide){
      const panel=document.getElementById('cp-panel');
      if(panel && document.getElementById('cp-drawer')){
        // already open → repaint content in place (no re-animation), preserve scroll + focus (Rule #29)
        const body=document.getElementById('cp-drawer-body');
        const sTop=body?body.scrollTop:0;
        const ae=document.activeElement;
        const fkey=(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'))?{name:ae.name||'',ph:ae.placeholder||'',type:ae.type,ss:ae.selectionStart,se:ae.selectionEnd}:null;
        panel.innerHTML=innerHtml;
        requestAnimationFrame(()=>{
          const nb=document.getElementById('cp-drawer-body'); if(nb&&sTop) nb.scrollTop=sTop;
          if(fkey){ for(const c of panel.querySelectorAll('input,textarea')){ if((fkey.name&&c.name===fkey.name)||(!fkey.name&&c.placeholder===fkey.ph&&c.type===fkey.type)){ c.focus(); try{ if(fkey.ss!=null&&c.setSelectionRange) c.setSelectionRange(fkey.ss,fkey.se); }catch(e){} break; } } }
          renderIcons();
        });
        return;
      }
      // first open → create overlay + panel with slide-in (250ms, once)
      document.getElementById('drawer-root').innerHTML = `<div class="overlay-wrap" id="cp-drawer">
        <div class="backdrop" onclick="closeDrawer()"></div>
        <div class="drawer-panel ${wide?'':'standard'} drawer-enter" id="cp-panel">${innerHtml}</div></div>`;
      requestAnimationFrame(()=>{ const p=document.getElementById('cp-panel'); if(p){ p.classList.remove('drawer-enter'); p.classList.add('drawer-active'); } renderIcons(); });
    }
    function closeDrawer(){ const w=document.getElementById('cp-drawer'); if(!w)return; const p=document.getElementById('cp-panel');
      if(p){ p.style.transition='transform 220ms ease-in'; p.style.transform='translateX(100%)'; }
      setTimeout(()=>{ if(location.hash.slice(2)!=='') location.hash='#/list'; else document.getElementById('drawer-root').innerHTML=''; },200); }
    function drawerShell(title, subtitle, headerActions, bodyHtml, footerHtml){
      return `<div style="display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--c-border);">
          <div style="flex:1;"><div style="font-size:15px;font-weight:700;color:var(--c-navy);">${title}</div>
            ${subtitle?`<div style="font-size:12px;color:var(--c-text-mute);margin-top:2px;">${subtitle}</div>`:''}</div>
          ${headerActions||''}
          <button class="icon-btn" onclick="closeDrawer()" title="ปิด (Esc)"><i data-lucide="x" class="w-4 h-4"></i></button></div>
        <div style="flex:1;overflow:auto;padding:22px;" id="cp-drawer-body">${bodyHtml}</div>
        ${footerHtml?`<div style="display:flex;align-items:center;gap:10px;padding:14px 22px;border-top:1px solid var(--c-border);background:var(--c-off-white);">${footerHtml}</div>`:''}`;

    // ============================================================
    //  CREATE — 4-step wizard (Pattern B · footer contract Rule#31)
    // ============================================================
    let cp=null;
    const freshCp = () => ({ step:1, cp_date:new Date().toISOString().slice(0,10), buyer:'Tadswan Chanyarakskul', pr_refs:[], prSearch:'', vendorSearch:'', vendorFilter:'all', vendors:[], lines:[], prices:{}, winners:{} });
    const lineKey = i => 'L'+i;
    function pullLines(){ const lines=[]; cp.pr_refs.forEach(no=>{ const pr=prByNo(no); if(!pr)return; pr.lines.forEach(ln=>lines.push({src:no,item_code:ln.item_code,item_name:ln.item_name,qty:ln.qty,unit:ln.unit})); }); cp.lines=lines;
      const valid=new Set(lines.map((_,i)=>lineKey(i))); Object.keys(cp.prices).forEach(k=>{ if(!valid.has(k)) delete cp.prices[k]; }); Object.keys(cp.winners).forEach(k=>{ if(!valid.has(k)) delete cp.winners[k]; }); }
    function bestVendorForLine(i){ const k=lineKey(i); const pr=cp.prices[k]||{}; let best=null,bv=null; cp.vendors.forEach(vid=>{ const v=parseFloat(pr[vid]); if(!isNaN(v)&&v>0&&(best===null||v<best)){best=v;bv=vid;} }); return {bv,best}; }
    // ดึงราคา preset จาก vendor price list มาเติมช่องที่ยังว่าง (ไม่ทับค่าที่ผู้ใช้กรอก/แก้เอง)
    function applyPriceList(){ cp.lines.forEach((ln,i)=>{ const k=lineKey(i); cp.prices[k]=cp.prices[k]||{};
      cp.vendors.forEach(vid=>{ const cur=cp.prices[k][vid]; if(cur==null||cur===''){ const p=priceFromList(vid,ln.item_code); if(p!=null) cp.prices[k][vid]=String(p); } }); }); }
    const lineWinnerPrice = i => { const k=lineKey(i); const w=cp.winners[k]; if(!w)return null; const p=parseFloat((cp.prices[k]||{})[w]); return isNaN(p)?null:p; };
    function poGroups(){ const g={}; cp.lines.forEach((ln,i)=>{ const w=cp.winners[lineKey(i)]; const price=lineWinnerPrice(i); if(!w||price===null)return; (g[w]=g[w]||[]).push({...ln,idx:i,price,amount:price*ln.qty}); }); return g; }

    function openCreateDrawer(){ cp=freshCp(); empCb.query=''; empCb.open=false; empCb.highlight=0; renderWizard(); }
    function gotoStep(n){ cp.step=n; renderWizard(); }
    function renderWizard(){
      const stepLabels=['ข้อมูลทั่วไป','ผู้ขายที่เทียบ','เปรียบเทียบราคา','สรุป / แยก PO'];

      const body = cp.step===1?stepGeneral() : cp.step===2?stepVendors() : cp.step===3?stepMatrix() : stepSplit();
      const canSubmit = cp.lines.length>0 && cp.vendors.length>=2 && cp.lines.every((_,i)=>!!cp.winners[lineKey(i)]);
      // footer contract Rule#31.3: step1=ยกเลิก(ghost) / step>1=ย้อนกลับ(secondary) ซ้าย → spacer → บันทึกร่าง(secondary) → primary ขวา
      const leftBtn = cp.step===1
        ? `<button class="btn btn-ghost" onclick="closeDrawer()">ยกเลิก</button>`
        : `<button class="btn btn-secondary" onclick="gotoStep(${cp.step-1})"><i data-lucide="chevron-left" class="w-4 h-4"></i><span>ย้อนกลับ</span></button>`;
      const rightBtn = cp.step<4
        ? `<button class="btn btn-primary" onclick="nextStep()"><span>ถัดไป</span><i data-lucide="chevron-right" class="w-4 h-4"></i></button>`
        : `<button class="btn btn-primary" ${canSubmit?'':'disabled style="opacity:.5;"'} onclick="saveCp('pending')"><i data-lucide="send" class="w-4 h-4"></i><span>ส่งอนุมัติผลเปรียบเทียบ</span></button>`;
      const footer = `${leftBtn}<div class="footer-spacer" style="flex:1;"></div>
        <button class="btn btn-secondary" onclick="saveCp('draft')"><i data-lucide="save" class="w-4 h-4"></i><span>บันทึกร่าง</span></button>${rightBtn}`;
      openDrawer(drawerShell('สร้างใบเปรียบเทียบราคา','เลขที่จะออกเมื่อบันทึก · ขั้นที่ '+cp.step+'/4 — '+stepLabels[cp.step-1], '',
        `<div class="stepper" style="margin-bottom:22px;">${stepper}</div>${body}`, footer), true);
    }
    function nextStep(){
      if(cp.step===1){ if(cp.pr_refs.length===0) return showToast('กรุณาเลือกใบขอซื้ออย่างน้อย 1 ใบ','warning'); pullLines(); }
      if(cp.step===2){ if(cp.vendors.length<2) return showToast('ต้องเลือกผู้ขายอย่างน้อย 2 ราย','warning'); applyPriceList(); }
      if(cp.step===3){ autoWinners(); }
      gotoStep(cp.step+1);
    }
    // ---- step 1 ----
    function stepGeneral(){
      const q=(cp.prSearch||'').toLowerCase().trim();
      let prs=refablePRs();
      if(q) prs=prs.filter(p=> (p.pr_no+' '+p.requester+' '+p.dept+' '+p.branch+' '+p.lines.map(l=>l.item_name).join(' ')).toLowerCase().includes(q));
      const list=prs.map(p=>{ const on=cp.pr_refs.includes(p.pr_no);
        return `<div class="pr-row ${on?'on':''}" onclick="selectPr('${p.pr_no}')">
          <div class="pr-radio"></div>
          <div style="flex:1;min-width:0;">
            <div class="pr-l1"><span class="ref-no">${p.pr_no}</span>
              <span style="font-size:11px;color:var(--c-text-soft);flex-shrink:0;">${formatThaiDate(p.pr_date)}</span>
              <span class="pill" style="color:var(--c-teal);background:var(--c-teal-08);flex-shrink:0;">อนุมัติแล้ว</span>
              <span style="color:var(--c-border);flex-shrink:0;">·</span>
              <span class="meta"><i data-lucide="user" class="w-3 h-3"></i>${p.requester}<span style="color:var(--c-border);">·</span>${p.dept}<span style="color:var(--c-border);">·</span><i data-lucide="map-pin" class="w-3 h-3" style="color:var(--c-teal);"></i>${p.branch}</span></div>
            <div class="pr-l2"><span class="pill" style="background:var(--c-off-white);color:var(--c-text-mute);flex-shrink:0;">${p.lines.length} รายการ</span><span class="items">${p.lines.map(l=>l.item_name).join(', ')}</span></div>
          </div>
          <div class="pr-amt"><div class="pr-amt-v">฿${fmtMoney(p.total)}</div><div class="pr-amt-l">มูลค่ารวม</div></div></div>`; }).join('');
      const sel=cp.pr_refs[0]?prByNo(cp.pr_refs[0]):null; const pulled=sel?sel.lines.length:0; const total=refablePRs().length;
      return `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;">

          <div class="form-field"><label class="required"><i data-lucide="user" class="w-3.5 h-3.5"></i>ผู้จัดทำ</label>
            <div style="position:relative;" id="empCombobox">
              <i data-lucide="search" class="w-4 h-4" style="position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--c-text-soft);"></i>
              <input type="text" id="empSearchInput" autocomplete="off" value="${cp.buyer?cp.buyer:(empCb.query||'')}" placeholder="ค้นหาพนักงาน..." oninput="onEmpInput(event)" onfocus="onEmpFocus()" onkeydown="onEmpKey(event)" class="input" style="padding-left:36px;padding-right:36px;">
              ${cp.buyer?`<button onclick="clearEmp()" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:none;padding:4px;cursor:pointer;color:var(--c-text-soft);" title="ล้างการเลือก"><i data-lucide="x" class="w-4 h-4"></i></button>`:`<i data-lucide="chevron-down" class="w-4 h-4" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--c-text-soft);pointer-events:none;"></i>`}
              <div id="empSuggestList" class="${empCb.open?'':'hidden'}" style="position:absolute;z-index:30;left:0;right:0;margin-top:4px;background:white;border:1px solid var(--c-border);border-radius:var(--r);box-shadow:var(--sh-lg);max-height:280px;overflow-y:auto;">${renderEmpSug()}</div>
            </div></div>
        </div>
        <div class="sec-title" style="margin-bottom:12px;"><i data-lucide="link" class="w-4 h-4" style="color:var(--c-primary);"></i>อ้างอิงใบขอซื้อ (PR)
          ${sel?`<span class="pill" style="color:var(--c-primary);background:var(--c-primary-08);">เลือกแล้ว</span>`:''}
          <i class="hint-i" data-tip="เลือกใบขอซื้อ 1 ใบต่อการเปรียบเทียบ 1 ครั้ง · แสดงเฉพาะใบที่อนุมัติแล้วและ route=cp · ใบที่ออก PO ตรง (po_direct) ถูกล็อกและไม่แสดงที่นี่">i</i></div>

          <i data-lucide="search-x" class="w-7 h-7" style="opacity:.4;display:block;margin:0 auto 8px;"></i>${q?'ไม่พบใบขอซื้อที่ตรงกับ "'+cp.prSearch+'"':'ไม่มีใบขอซื้อที่พร้อมเปรียบเทียบ'}</div>`}
        ${sel?`<div style="margin-top:14px;padding:10px 14px;background:var(--c-teal-08);border-radius:10px;font-size:12.5px;color:var(--c-teal);font-weight:600;display:flex;align-items:center;gap:7px;"><i data-lucide="check-circle-2" class="w-4 h-4"></i>เลือก <span class="tbl-mono">${sel.pr_no}</span> · ดึงมา ${pulled} รายการเพื่อเปรียบเทียบ</div>`
          :`<div style="margin-top:12px;font-size:11.5px;color:var(--c-text-soft);">มีใบขอซื้อพร้อมเปรียบเทียบ ${total} ใบ — เลือก 1 ใบ</div>`}`;

    function onPrSearch(e){ cp.prSearch=e.target.value; renderWizard(); }
    function selectPr(no){ cp.pr_refs = (cp.pr_refs[0]===no) ? [] : [no]; pullLines(); renderWizard(); }
    // ---- ผู้จัดทำ combobox (เหมือน PR) ----
    function empFiltered(){ const q=(empCb.query||'').toLowerCase().trim(); return mockEmployees.filter(e=>!q||e.name.toLowerCase().includes(q)||e.position.toLowerCase().includes(q)||e.dept.toLowerCase().includes(q)); }
    function renderEmpSug(){ const f=empFiltered();
      if(!f.length) return `<div style="padding:24px 16px;text-align:center;font-size:13px;color:var(--c-text-mute);">ไม่พบพนักงานที่ตรงกับ "<strong>${empCb.query}</strong>"</div>`;

      </button>`; }).join(''); }
    function onEmpInput(e){ empCb.query=e.target.value; empCb.open=true; empCb.highlight=0; if(cp.buyer && !mockEmployees.find(x=>x.name===e.target.value)) cp.buyer=''; const l=document.getElementById('empSuggestList'); if(l){ l.classList.remove('hidden'); l.innerHTML=renderEmpSug(); renderIcons(); } }
    function onEmpFocus(){ empCb.open=true; const l=document.getElementById('empSuggestList'); if(l){ l.classList.remove('hidden'); l.innerHTML=renderEmpSug(); renderIcons(); } }
    function onEmpKey(e){ const l=document.getElementById('empSuggestList'); if(!l)return; const f=empFiltered();
      if(e.key==='ArrowDown'){ e.preventDefault(); empCb.highlight=Math.min(f.length-1,empCb.highlight+1); l.innerHTML=renderEmpSug(); renderIcons(); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); empCb.highlight=Math.max(0,empCb.highlight-1); l.innerHTML=renderEmpSug(); renderIcons(); }
      else if(e.key==='Enter'){ e.preventDefault(); if(f[empCb.highlight]) selectEmp(f[empCb.highlight].id); }
      else if(e.key==='Escape'){ e.stopPropagation(); empCb.open=false; l.classList.add('hidden'); } }

    // ---- step 2 ----
    function stepVendors(){
      const max=PURCHASE_CONFIG.cp_max_vendors; const full=cp.vendors.length>=max;
      const card=(v,sel,dis)=>`<div class="vcard ${sel?'sel':''} ${dis?'dis':''}" onclick="toggleVendorCard('${v.id}')">
          <div class="vcard-check"><i data-lucide="${sel?'x':'check'}" class="w-3 h-3"></i></div>
          <div class="vcard-ic"><i data-lucide="store" class="w-5 h-5"></i></div>
          <div style="flex:1;min-width:0;">
            <div class="vcard-name">${v.name}</div>
            <div class="vcard-meta"><span class="tbl-mono" style="color:var(--c-primary);font-weight:600;">${v.code}</span><span style="color:var(--c-border);">·</span><i data-lucide="credit-card" class="w-3 h-3"></i>${v.credit}</div>
          </div></div>`;
      // selected
      const selected=cp.vendors.map(vid=>vendorById(vid));
      const selBox = selected.length?`<div class="v-selected-box">
          <div class="v-section-label"><i data-lucide="check-circle-2" class="w-3.5 h-3.5" style="color:var(--c-primary);"></i>เลือกแล้ว ${selected.length} ราย <span style="font-weight:400;color:var(--c-text-soft);">— แตะเพื่อนำออก</span></div>
          <div class="vgrid">${selected.map(v=>card(v,true,false)).join('')}</div></div>`:'';
      // available (search + filter)
      const q=(cp.vendorSearch||'').toLowerCase().trim(); const f=cp.vendorFilter||'all';
      let avail=mockVendors.filter(v=>!cp.vendors.includes(v.id));
      if(f==='cash') avail=avail.filter(v=>v.credit.includes('เงินสด'));
      else if(f==='credit') avail=avail.filter(v=>v.credit.includes('เครดิต'));
      if(q) avail=avail.filter(v=>(v.code+' '+v.name+' '+v.credit).toLowerCase().includes(q));
      const availGrid = avail.length?`<div class="vgrid">${avail.map(v=>card(v,false,full)).join('')}</div>`
        :`<div style="text-align:center;color:var(--c-text-mute);font-size:12.5px;padding:24px;border:1px dashed var(--c-border);border-radius:12px;"><i data-lucide="search-x" class="w-7 h-7" style="opacity:.4;display:block;margin:0 auto 8px;"></i>${q||f!=='all'?'ไม่พบผู้ขายที่ตรงเงื่อนไข':'เลือกครบทุกผู้ขายแล้ว'}</div>`;
      const need=cp.vendors.length<2;
      return `
        <div class="sec-title" style="margin-bottom:6px;">ผู้ขายที่นำมาเปรียบเทียบ
