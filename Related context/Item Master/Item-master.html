<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ทะเบียนสินค้า · CUBE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">
<style>
:root{--c-navy:#111111;--c-navy-2:#111111;--c-primary:#FF3B30;--c-primary-hover:#E62E24;--c-teal:#FF9A1F;--c-teal-light:#FFB763;--c-ink:#111111;--c-mute:#54565C;--c-mute-2:#73757B;--c-mute-3:#9A9CA2;--c-line:#DEDAD4;--c-line-2:#E9E5E0;--c-line-3:#F1EEEA;--c-bg-off:#FAF8F5;--c-success:#1F9D55;--c-warning:#E8870F;--c-danger:#E62E24;--sidebar-w:232px;--shell-h:52px;--fs-h1:22px;--fs-h2:17px;--fs-h3:15px;--fs-body:14px;--fs-sub:13px;--fs-meta:12px;--fs-cap:11px;--fs-kpi:28px;--sp-xs:4px;--sp-sm:8px;--sp-md:12px;--sp-lg:20px;--sp-xl:28px;--r-xs:4px;--r-sm:6px;--r-md:8px;--r-lg:12px;--r-full:999px;}
*{box-sizing:border-box;}html,body{margin:0;padding:0;}
html{scrollbar-gutter:stable;}
/* Minimal scrollbar (Iron Rule #49) — 5px, track transparent, dark surfaces = white-translucent */
*{scrollbar-width:thin;scrollbar-color:rgba(17,17,17,.16) transparent;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-corner{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(17,17,17,.14);border-radius:99px;}
::-webkit-scrollbar-thumb:hover{background:rgba(17,17,17,.26);}
.sidebar,.slide{scrollbar-color:rgba(255,255,255,.28) transparent;}
.sidebar ::-webkit-scrollbar-thumb,.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.28);}
.sidebar ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.42);}
body{font-family:'Satoshi','Noto Sans Thai',system-ui,sans-serif;background:var(--c-bg-off);color:#2A2B2F;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-width:1180px;}
a{text-decoration:none;color:inherit;}button{font-family:inherit;cursor:pointer;}[data-lucide]{flex-shrink:0;}
input[type="number"]::-webkit-inner-spin-button,input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}input[type="number"]{-moz-appearance:textfield;}
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);background:#111111;color:#E9E5E0;z-index:20;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,0.06);}
.sb-brand{padding:18px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;}
.sb-logo{width:34px;height:34px;background:linear-gradient(135deg,#FF3B30,#FF9A1F);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;box-shadow:0 4px 12px rgba(255,59,48,0.3);}
.sb-name{font-weight:700;font-size:14px;color:#fff;letter-spacing:-0.01em;line-height:1.2;}.sb-sub{font-size:10px;color:#9A9CA2;letter-spacing:0.06em;font-weight:600;text-transform:uppercase;margin-top:2px;}
.sb-nav{flex:1;padding:12px 8px;overflow-y:auto;}.sb-module{margin-bottom:4px;}
.sb-module-header{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:6px;background:transparent;border:0;color:#9A9CA2;font-family:inherit;font-size:10.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;transition:all 120ms;text-align:left;}
.sb-module-header:hover{background:rgba(255,255,255,0.04);color:#DEDAD4;}.sb-module-header .mod-icon{flex-shrink:0;opacity:0.7;}.sb-module-header .mod-label{flex:1;}
.sb-module-header .mod-chevron{flex-shrink:0;transition:transform 200ms;opacity:0.7;}.sb-module[data-expanded="false"] .mod-chevron{transform:rotate(-90deg);}.sb-module[data-expanded="false"] .sb-features{display:none;}
.sb-features{padding:2px 0 6px 0;}
.sb-item{display:flex;align-items:center;gap:10px;padding:7px 12px 7px 14px;border-radius:6px;color:#DEDAD4;font-size:13px;font-weight:500;cursor:pointer;transition:all 120ms;margin-bottom:1px;position:relative;user-select:none;}
.sb-item:hover{background:rgba(255,255,255,0.05);color:#fff;}.sb-item.is-active{background:#FF3B30;color:#fff;font-weight:600;}
.sb-item.is-active::before{content:'';position:absolute;left:-10px;top:7px;bottom:7px;width:3px;background:#fff;border-radius:0 2px 2px 0;}
.sb-item [data-lucide]{width:16px;height:16px;opacity:0.85;}.sb-item.is-active [data-lucide]{opacity:1;}
.sb-item.is-disabled{opacity:0.4;cursor:not-allowed;}.sb-item.is-disabled:hover{background:transparent;color:#DEDAD4;}
.sb-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:8px;font-size:11.5px;color:#9A9CA2;}
.pulse-dot{width:7px;height:7px;background:var(--c-teal);border-radius:50%;box-shadow:0 0 0 3px rgba(255,154,31,0.20);animation:pulse 2s infinite;}@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.6;}}
.main{margin-left:var(--sidebar-w);min-height:100vh;background:var(--c-bg-off);}
.shell-bar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--c-line-2);height:var(--shell-h);display:flex;align-items:center;padding:0 22px;z-index:19;gap:12px;}
.breadcrumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--c-mute);}.breadcrumb a{cursor:pointer;transition:color 120ms;}.breadcrumb a:hover{color:var(--c-primary);}
.breadcrumb .sep{color:var(--c-mute-3);}.breadcrumb-current{color:var(--c-ink);font-weight:500;}
.icon-btn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:0;color:var(--c-mute);border-radius:7px;position:relative;transition:all 120ms;}
.icon-btn:hover{background:var(--c-line-3);color:var(--c-ink);}.icon-btn [data-lucide]{width:17px;height:17px;}
.notif-dot{position:absolute;top:7px;right:8px;width:7px;height:7px;background:var(--c-danger);border-radius:50%;border:2px solid #fff;}
.user-chip{display:flex;align-items:center;gap:9px;padding:5px 10px 5px 12px;border-radius:8px;cursor:pointer;transition:background 120ms;}.user-chip:hover{background:var(--c-line-3);}
.user-text{line-height:1.2;text-align:right;}.user-name{font-size:12.5px;font-weight:500;color:var(--c-ink);white-space:nowrap;}.user-role{font-size:10.5px;color:var(--c-mute-2);white-space:nowrap;margin-top:1px;}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--c-primary),var(--c-teal));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;}
.user-menu{position:absolute;top:calc(var(--shell-h) - 4px);right:22px;background:#fff;border:1px solid var(--c-line-2);border-radius:10px;box-shadow:0 12px 32px rgba(17,17,17,0.12);width:240px;z-index:30;padding:6px;display:none;}.user-menu.is-open{display:block;}
.user-menu-item{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:6px;font-size:13px;color:var(--c-ink);cursor:pointer;transition:background 120ms;}.user-menu-item:hover{background:var(--c-bg-off);}
.user-menu-item [data-lucide]{width:15px;height:15px;color:var(--c-mute-2);}.user-menu-item.is-danger{color:var(--c-danger);}.user-menu-item.is-danger [data-lucide]{color:var(--c-danger);}.user-menu-divider{height:1px;background:var(--c-line-2);margin:5px 0;}
.content{padding:22px;}
.ph{margin-bottom:18px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:14px;}.ph>div:first-child{flex:1 1 auto;min-width:280px;}
.ph-title-row{display:flex;align-items:baseline;gap:10px;margin-bottom:5px;}.ph-title{font-family:'Noto Sans Thai',sans-serif;font-size:22px;font-weight:700;color:var(--c-navy);margin:0;letter-spacing:-0.01em;}
.ph-count{font-size:12.5px;font-weight:600;color:var(--c-mute-2);background:var(--c-line-3);padding:3px 9px;border-radius:999px;}.ph-sub{font-size:13px;color:var(--c-mute);margin:0;}.ph-actions{display:flex;gap:8px;flex-shrink:0;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:2px 14px 0;border-radius:8px;font-size:13px;font-weight:500;border:1px solid transparent;background:transparent;white-space:nowrap;transition:all 120ms;user-select:none;}.btn [data-lucide]{width:15px;height:15px;}
.btn-primary{background:var(--c-primary);color:#fff;}.btn-primary:hover{background:var(--c-primary-hover);box-shadow:0 2px 8px rgba(255,59,48,0.30);}
.btn-secondary{background:#fff;border-color:var(--c-line);color:var(--c-ink);}.btn-secondary:hover{background:var(--c-line-3);border-color:var(--c-mute-2);}
.btn-ghost{color:var(--c-mute);}.btn-ghost:hover{background:var(--c-line-3);color:var(--c-ink);}.btn-danger{background:#fff;border-color:var(--c-line);color:var(--c-danger);}.btn-danger:hover{background:#FFE9E7;border-color:var(--c-danger);}
.btn-sm{height:30px;padding:2px 11px 0;font-size:12px;}
.btn:disabled,.btn.is-disabled{opacity:.55;cursor:not-allowed;pointer-events:none;}
@keyframes spin{to{transform:rotate(360deg);}}.spin{animation:spin .8s linear infinite;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px;}
.stat{background:#fff;border:1px solid var(--c-line-2);border-radius:10px;padding:14px 16px;transition:all 150ms;}.stat:hover{border-color:var(--c-line);box-shadow:0 2px 8px rgba(17,17,17,0.05);}
.stat-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--c-mute);}.stat-label [data-lucide]{width:13px;height:13px;color:var(--c-primary);}
.stat-value{font-family:'Noto Sans Thai',sans-serif;font-size:26px;font-weight:700;color:var(--c-navy);margin-top:6px;letter-spacing:-0.01em;}.stat-meta{font-size:11.5px;color:var(--c-mute-2);margin-top:5px;display:flex;align-items:center;gap:4px;}.stat-meta.is-up{color:var(--c-success);}.stat-meta.is-down{color:var(--c-danger);}.stat-meta [data-lucide]{width:12px;height:12px;}
.card{background:#fff;border:1px solid var(--c-line-2);border-radius:10px;overflow:hidden;}
.filter-bar{padding:14px 18px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--c-line-2);background:#fff;flex-wrap:wrap;}
.input,.select{height:36px;padding:0 12px;border:1px solid var(--c-line);border-radius:8px;font-size:13px;background:#fff;color:var(--c-ink);font-family:inherit;transition:all 120ms;width:100%;}
.input:focus,.select:focus{outline:none;border-color:var(--c-primary);box-shadow:0 0 0 3px rgba(255,59,48,0.10);}
.select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2373757B' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:32px;appearance:none;}
.input-search{position:relative;flex:1;max-width:300px;}.input-search input{padding-left:36px;}.input-search .lead-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--c-mute-2);pointer-events:none;}
.table-scroll{overflow-x:auto;}
.table-scroll.is-sticky{max-height:620px;overflow-y:auto;scrollbar-gutter:stable;}
.table-scroll.is-sticky thead th{position:sticky;top:0;z-index:3;background:var(--c-bg-off);box-shadow:inset 0 -1px 0 var(--c-line-2);}.table{width:100%;border-collapse:collapse;font-size:13px;}.table thead{background:var(--c-bg-off);}
.table th{padding:11px 14px;text-align:left;font-weight:600;color:var(--c-mute);font-size:11.5px;text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--c-line-2);white-space:nowrap;}
.table th.is-sortable{cursor:pointer;user-select:none;}.table th.is-sortable:hover{color:var(--c-ink);background:var(--c-line-3);}.table th .sort-arrow{display:inline-block;margin-left:4px;opacity:0.4;}.table th.is-sorted .sort-arrow{opacity:1;color:var(--c-primary);}
.table td{padding:13px 14px 11px;border-bottom:1px solid var(--c-line-2);color:var(--c-ink);vertical-align:middle;}.table tbody tr{transition:background 120ms;cursor:pointer;}.table tbody tr:hover{background:var(--c-bg-off);}.table tbody tr:last-child td{border-bottom:0;}
.num{text-align:right;font-variant-numeric:tabular-nums;}
.user-cell{display:flex;align-items:center;gap:10px;}.uc-avatar{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--c-primary),var(--c-teal));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;}
.uc-name{font-weight:600;color:var(--c-ink);font-size:13px;line-height:1.3;}
.cell-truncate{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle;}
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px 3px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;}.pill [data-lucide]{width:11px;height:11px;}
.row-actions{display:inline-flex;gap:2px;}.ra-btn{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:0;color:var(--c-mute-2);border-radius:6px;transition:all 120ms;}.ra-btn:hover{background:var(--c-line-3);color:var(--c-primary);}.ra-btn.is-danger:hover{background:#FFE9E7;color:var(--c-danger);}.ra-btn [data-lucide]{width:15px;height:15px;}
.table-footer{padding:12px 18px;background:var(--c-bg-off);border-top:1px solid var(--c-line-2);display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--c-mute);flex-wrap:wrap;gap:10px;}
.pagination{display:inline-flex;gap:4px;align-items:center;}.pg-btn{min-width:30px;height:30px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--c-line-2);border-radius:6px;color:var(--c-mute);font-size:12.5px;font-weight:500;cursor:pointer;transition:all 120ms;}.pg-btn:hover{border-color:var(--c-line);background:var(--c-bg-off);}.pg-btn.is-active{background:var(--c-primary);border-color:var(--c-primary);color:#fff;}.pg-ellipsis{display:inline-flex;align-items:flex-end;padding:0 4px;color:var(--c-mute-3);font-size:12px;user-select:none;}
.pg-btn.is-disabled{opacity:0.4;cursor:not-allowed;}.pg-btn [data-lucide]{width:13px;height:13px;}
.drawer-backdrop{position:fixed;inset:0;background:rgba(17,17,17,0.40);z-index:50;opacity:0;pointer-events:none;transition:opacity 220ms;}.drawer-backdrop.is-open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;right:0;bottom:0;width:920px;max-width:96vw;background:#fff;z-index:51;transform:translateX(100%);transition:transform 280ms cubic-bezier(0.4,0,0.2,1);display:flex;flex-direction:column;box-shadow:-16px 0 40px rgba(17,17,17,0.18);}.drawer.is-open{transform:translateX(0);}.drawer.standard{width:680px;}
.drawer-header{display:flex;align-items:center;gap:14px;padding:18px 22px;border-bottom:1px solid var(--c-line-2);}
.drawer-avatar{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--c-primary),var(--c-teal));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
.drawer-title{font-family:'Noto Sans Thai',sans-serif;font-size:19px;font-weight:600;color:var(--c-navy);margin:0;letter-spacing:-0.01em;}
.drawer-subtitle{font-size:12px;color:var(--c-mute);margin-top:4px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.drawer-tabs{display:flex;padding:0 22px;border-bottom:1px solid var(--c-line-2);}
.drawer-tab{padding:10px 14px;font-size:13px;font-weight:500;color:var(--c-mute);border-bottom:2px solid transparent;transition:all 120ms;margin-bottom:-1px;cursor:pointer;user-select:none;background:transparent;border-left:0;border-right:0;border-top:0;}.drawer-tab:hover{color:var(--c-ink);}.drawer-tab.is-active{color:var(--c-primary);border-bottom-color:var(--c-primary);}
.drawer-body{flex:1;overflow-y:auto;overflow-x:hidden;padding:22px 24px;scrollbar-gutter:stable;}
.drawer-section{margin-bottom:22px;}.drawer-section-title{font-size:11px;font-weight:700;color:var(--c-mute);letter-spacing:0.08em;text-transform:uppercase;margin:0 0 10px;}
.drawer-fields{display:grid;grid-template-columns:150px 1fr 150px 1fr;gap:10px 18px;font-size:13px;align-items:baseline;}.drawer-fields .lbl{color:var(--c-mute);}.drawer-fields .val{color:var(--c-ink);font-weight:500;}
.drawer-footer{padding:13px 22px;border-top:1px solid var(--c-line-2);display:flex;gap:8px;align-items:center;background:var(--c-bg-off);}
/* ===== v6.1 Pattern B drawer chrome (dw-head + d-stepper + dw-footer — locked to pr.html) ===== */
.top-icon-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:0;background:transparent;border-radius:var(--r-sm);color:var(--c-mute-2);cursor:pointer;transition:all 120ms;flex-shrink:0;}
.top-icon-btn:hover{background:var(--c-line-3);color:var(--c-ink);}
.dw-head{padding:18px 24px 16px;border-bottom:1px solid var(--c-line-2);flex-shrink:0;}
.dw-head-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
.dw-eyebrow{display:flex;align-items:center;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--c-mute-2);margin-bottom:4px;font-weight:600;}
.dw-title{font-size:20px;font-weight:700;color:var(--c-navy);margin:0;letter-spacing:-0.01em;}
.dw-sub{font-size:var(--fs-meta);color:var(--c-mute-2);margin-top:4px;}
.d-stepper{display:flex;align-items:flex-start;gap:0;width:100%;margin-top:18px;}
.stepper-item{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;min-width:0;}
.stepper-circle{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;background:#fff;color:var(--c-mute-3);border:2px solid var(--c-line);transition:all 200ms;z-index:2;}
.stepper-item.active .stepper-circle{background:var(--c-primary);color:#fff;border-color:var(--c-primary);box-shadow:0 0 0 4px rgba(255,59,48,0.12);}
.stepper-item.done .stepper-circle{background:var(--c-primary);color:#fff;border-color:var(--c-primary);}
.stepper-label{margin-top:8px;font-size:12px;font-weight:500;color:var(--c-mute-3);text-align:center;line-height:1.3;transition:color 200ms;}
.stepper-item.active .stepper-label{color:var(--c-navy);font-weight:600;}
.stepper-item.done .stepper-label{color:var(--c-mute);}
.stepper-item:not(:last-child)::after{content:'';position:absolute;top:15px;left:50%;right:-50%;height:2px;background:var(--c-line-2);z-index:1;}
.stepper-item.done:not(:last-child)::after{background:var(--c-primary);}
.dw-footer{padding:14px 24px;border-top:1px solid var(--c-line-2);background:var(--c-bg-off);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:8px;}
.dw-footer-right{display:flex;align-items:center;gap:8px;}
.footer-spacer{flex:1;}
.drawer-footer-meta{font-size:12px;color:var(--c-mute-2);}
.drawer-header-actions{display:flex;gap:6px;align-items:center;flex-shrink:0;}
.drawer-header-divider{width:1px;height:22px;background:var(--c-line-2);margin:0 4px;flex-shrink:0;}
.hidden{display:none !important;}
/* semantic pill aliases (microcopy vocabulary) */
.pill-info{background:#E6F0FF;color:#1A5FCC;}.pill-success{background:#E4F4EB;color:#157A41;}
.pill-warning{background:#FFF1DD;color:#B8690B;}.pill-danger{background:#FFE9E7;color:#E62E24;}
.pill-muted{background:var(--c-line-3);color:var(--c-mute-2);}
.field{margin-bottom:14px;}.field-label{display:block;font-size:12.5px;font-weight:500;color:var(--c-mute);margin-bottom:6px;}.field-label .req{color:var(--c-danger);margin-left:2px;}
.field-help{font-size:11.5px;color:var(--c-mute-2);margin-top:4px;}.field-error{font-size:11.5px;color:var(--c-danger);margin-top:4px;}

/* ===================== HELPERS ===================== */
function typeLabel(t){ return TYPEMETA[t] ? (t+' · '+TYPEMETA[t].l) : t; }
function statusLabel(s){ return {draft:'ร่าง',active:'ใช้งาน',obsolete:'เลิกผลิต',discontinued:'ยกเลิก',archived:'จัดเก็บ'}[s]||s; }
function initials(s){ return (s||'?').replace(/[^A-Za-z0-9]/g,'').slice(0,2).toUpperCase(); }
function fmtNum(n){ return (n==null?0:n).toLocaleString('th-TH'); }
function fmtMoney(n){ return (n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDateTime(iso){ if(!iso) return '—'; return new Date(iso).toLocaleString('th-TH',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function coverImg(r){ const im=(r.images||[]).find(x=>x.cover)||(r.images||[])[0]; return im?im.url:null; }

/* ---- Filter / sort / paginate (FN-01 buildProductQuery) ---- */
function getFiltered(){
  let a = RAW.slice();
  const f = state.filters;
  if(f.search){ const q=f.search.toLowerCase(); a=a.filter(r=>(r.code+' '+r.name_th+' '+(r.name_en||'')+' '+(r.gtin||'')+' '+(r.old_code||'')+' '+(r.desc||'')+' '+(r.cat_l1||'')+' '+(r.cat_l2||'')+' '+(r.group||'')).toLowerCase().includes(q)); }
  if(f.type!=='all')   a=a.filter(r=>r.type===f.type);
  if(f.cat!=='all')    a=a.filter(r=>r.cat_l1===f.cat);
  if(f.status!=='all') a=a.filter(r=>r.status===f.status);
  const c=state.sort.col, d=state.sort.dir==='asc'?1:-1;
  a.sort((x,y)=>{ let vx=x[c], vy=y[c]; if(c==='list_price'||c==='standard_cost'){vx=+vx||0;vy=+vy||0;} else {vx=(''+(vx==null?'':vx)).toLowerCase();vy=(''+(vy==null?'':vy)).toLowerCase();} return vx<vy?-d:vx>vy?d:0; });
  return a;
}
function getPaginated(){
  const all=getFiltered(); const {page,pageSize}=state.pagination; const s=(page-1)*pageSize;
  return { records:all.slice(s,s+pageSize), total:all.length, page, totalPages:Math.max(1,Math.ceil(all.length/pageSize)), start:all.length===0?0:s+1, end:Math.min(s+pageSize,all.length) };

function pageWindow(cur,total){   // เลขหน้าแบบย่อ: ต้น 2 · ปัจจุบัน±1 · ท้าย 2 · คั่นด้วย …
  if(total<=7) return Array.from({length:total},(_,i)=>i+1);
  const set=new Set([1,2,cur-1,cur,cur+1,total-1,total]);
  const nums=[...set].filter(n=>n>=1&&n<=total).sort((a,b)=>a-b);
  const out=[]; let prev=0;
  for(const n of nums){ if(n-prev>1) out.push('…'); out.push(n); prev=n; }
  return out;
}

// Single feature route #/products ; drawer/modal expressed via #/products/<mode>/<id>
function navTo(route){ location.hash = '#/'+route; }
function parseHash(){
  const h=location.hash.replace(/^#\/?/,'');
  const parts=h.split('/').filter(Boolean);
  return { base: parts[0]||'products', mode: parts[1]||null, id: parts[2]||null };
}
function syncFromHash(){
  const p=parseHash();
  // close everything then open per hash
  if(p.mode==='create'){ ensureDrawer('create',null); closeModalSilent(); }
  else if(p.mode==='edit' && p.id){ ensureDrawer('edit',p.id); closeModalSilent(); }
  else if(p.mode==='view' && p.id){
    // ถ้า view เดิมเปิดอยู่แล้ว (เช่น ยกเลิก modal กลับมา) — คง tab/สถานะ drawer ไว้ ไม่ reset
    if(!(state.drawer.open && state.drawer.mode==='view' && state.drawer.id===p.id)) ensureDrawer('view',p.id);
    closeModalSilent();
  }
  else if(p.mode==='archive' && p.id){ ensureModal('archive',p.id); }
  else if(p.mode==='obsolete' && p.id){ ensureModal('obsolete',p.id); }
  else if(p.mode==='discontinue' && p.id){ ensureModal('discontinue',p.id); }
  else { if(state.drawer.open) closeDrawerSilent(); if(state.modal.open) closeModalSilent(); }
  render();
  // animate in
  requestAnimationFrame(()=>{
    if(state.drawer.open){ document.getElementById('drawerBackdrop').classList.add('is-open'); document.getElementById('drawer').classList.add('is-open'); }
    if(state.modal.open){ document.getElementById('modalBackdrop').classList.add('is-open'); }
  });
}
function ensureDrawer(mode,id){
  let form=null;
  if(mode==='create') form=mk({});
  else { const r=RAW.find(x=>x.id===id); if(!r){ navTo('products'); return; }
    if(mode==='edit' && !['draft','active','obsolete'].includes(r.status)) mode='view';   // IR: pending/archived แก้ไม่ได้
    form=mk(JSON.parse(JSON.stringify(r))); form.id=r.id; }
  if(mode==='create'||mode==='edit'){ // default behavior flags from type (FN-05)
    const tm=TYPEMETA[form.type]; if(tm){ form.stocked=tm.stocked; form.sellable=tm.sell; form.purchasable=tm.buy; }
  }
  if(mode==='create'){ form.code=genCode(form.type); }   // auto-generate code
  state.drawer={ open:true, mode, id:id||null, tab:'overview', step:1 };
  state.modal={ open:false, type:null, id:null };
  state.form=form;
}
function ensureModal(type,id){
  state.modal={ open:true, type, id };
  // keep view drawer open behind modal if it was open
}

  set('f-ppg','prod_posting_group'); set('f-vpg','vat_prod_group');

  const next=(nums.length?Math.max(...nums):1000)+1;

/* ---- Wizard steps ---- */
function nextStep(){
  captureForm(); const f=state.form; const s=state.drawer.step;
  if(s===1){
    if(!f.code.trim()){ showToast('กรุณากรอกรหัสสินค้า','warning'); return; }
    if(RAW.some(r=>r.code===f.code && r.id!==state.drawer.id)){ showToast('รหัสสินค้าซ้ำ (CODE_DUPLICATE)','error'); return; }   // BR-S01 / EC-01
    if(!f.name_th.trim()){ showToast('กรุณากรอกชื่อสินค้า (ไทย)','warning'); return; }
    if(!f.cat_l1){ showToast('กรุณาเลือกหมวดหมู่หลัก','warning'); return; }
  }
  if(s===2){
    if(!f.uom){ showToast('กรุณาเลือกหน่วยฐาน','warning'); return; }    // BR-S03
    const baseCat=uomCat(f.uom);
    for(const c of (f.conversions||[])){
      if(c.uom===f.uom){ showToast('หน่วยแปลงซ้ำกับหน่วยฐาน ('+c.uom+')','warning'); return; }   // VR-04
      if(uomCat(c.uom)!==baseCat){ showToast('หน่วย '+c.uom+' ('+(CAT_TH[uomCat(c.uom)]||'?')+') คนละหมวดกับหน่วยฐาน '+f.uom+' ('+(CAT_TH[baseCat]||'?')+') — แปลงข้ามหมวดไม่ได้','error'); return; }   // VR-10 category match
      if(!(+c.factor>=1)){ showToast('หน่วย '+c.uom+': จำนวนหน่วยฐานต้อง ≥ 1 (หน่วยฐานต้องเป็นหน่วยเล็กสุดเสมอ)','error'); return; }   // VR-03 factor≥1
    }
  }
  if(s===3){
    const mm=minmaxError(f); if(mm){ showToast(mm,'error'); return; }   // VR-MM
  }
  state.drawer.step=Math.min(4,s+1); render();
}
function prevStep(){ captureForm(); state.drawer.step=Math.max(1,state.drawer.step-1); render(); }

function minmaxError(f){    // VR-MM: min/max stock alert (หน่วยฐาน)
  if(!f.stocked) return null;
  const mn=f.min_stock, mx=f.max_stock;
  if(mn!=null && +mn<0) return 'สต็อกขั้นต่ำต้อง ≥ 0';
  if(mx!=null && +mx<0) return 'สต็อกสูงสุดต้อง ≥ 0';
  if(mn!=null && mx!=null && +mx<+mn) return 'สต็อกสูงสุด (Max) ต้องไม่ต่ำกว่าขั้นต่ำ (Min) — MINMAX_INVALID';
  return null;
}
function validateActivation(f){    // FN-10 validateActivationReady (pre-activate, §5.2)
  const errs=[]; const tm=TYPEMETA[f.type]||{};
  if(!(+f.standard_cost>0) && f.type!=='EX' && f.type!=='NS') errs.push('ต้นทุนมาตรฐาน');
  if(f.sellable && !(+f.list_price>0)) errs.push('ราคาขาย');
  if(f.stocked && !f.prod_posting_group) errs.push('Posting Group'); // resolve GL ใน Finance Posting Setup
  return errs;
}

function submitForm(){    // API-05 POST /products/{id}/activate — validate แล้วเปิดใช้งานตรง [DOA-ENGINE placeholder: ชั้นอนุมัติถอดออก รอเชื่อม Policy Center]
  captureForm(); const f=state.form;

  const isEdit=state.drawer.mode==='edit';

  setTimeout(()=>{

function persist(status){
  const f=state.form; const now=new Date().toISOString();
  const payload={ code:f.code, name_th:f.name_th, name_en:f.name_en, desc:f.desc, type:f.type, cat_l1:f.cat_l1, cat_l2:f.cat_l2, group:f.group, gtin:f.gtin, hs_code:f.hs_code, old_code:f.old_code, uom:f.uom, conversions:f.conversions||[], purchasable:f.purchasable, sellable:f.sellable, stocked:f.stocked, cost_method:f.cost_method, standard_cost:+f.standard_cost||0, purchase_price:+f.purchase_price||0, list_price:+f.list_price||0, currency:f.currency, prod_posting_group:f.prod_posting_group, vat_prod_group:f.vat_prod_group, reorder_point:f.reorder_point, reorder_qty:f.reorder_qty, safety_stock:f.safety_stock, moq:f.moq, min_stock:f.min_stock, max_stock:f.max_stock, images:f.images||[], attachments:f.attachments||[] };
  if(state.drawer.mode==='create'){
    const rec=mk(Object.assign(payload,{ status:(status==='amend'?'draft':status), created_by:CURRENT_USER.id, created_at:now,
      approver_role:null, approved_by:null, approved_at:null,   // [DOA-ENGINE placeholder] Policy Center — ชั้นอนุมัติถอดออกจาก UI รอเชื่อม engine
      audit:[{kind:'create',label:'สร้างรายการ (v1)',by:CURRENT_USER.id,at:now,v:''}] }));
    if(rec.status==='active') rec.audit.push({kind:'status',label:'เปิดใช้งาน',by:CURRENT_USER.id,at:now,v:'success'});
    RAW.unshift(rec);
  } else {   // edit/amend → version+1 (BR-S07, FN-08 amendProduct)
    const r=RAW.find(x=>x.id===state.drawer.id); if(!r) return;
    Object.assign(r, payload);
    r.version+=1; r.modified_at=now;
    r.audit.push({kind:'amend',label:'แก้ไข (v'+r.version+')',by:CURRENT_USER.id,at:now,v:''});
    if(status==='active' && r.status==='draft'){ r.status='active'; r.audit.push({kind:'status',label:'เปิดใช้งาน',by:CURRENT_USER.id,at:now,v:'success'}); }
  }
}
function activateFromView(id){    // API-05 from View header (draft → active) — [DOA-ENGINE placeholder]
  const r=RAW.find(x=>x.id===id); if(!r) return;

  r.status='archived';
  r.audit.push({kind:'status',label:'จัดเก็บ (soft delete)'+(r.has_txn?' — มี transaction อ้างอิง':''),by:CURRENT_USER.id,at:new Date().toISOString(),v:'warning'});
  showToast('จัดเก็บสินค้าแล้ว (soft delete)','success'); closeModalToCtx();
}
function confirmObsolete(){     // FN-07 state machine: active → obsolete (เลิกผลิต — ขายที่เหลือได้ ไม่ซื้อ/ผลิตเพิ่ม)
  const r=RAW.find(x=>x.id===state.modal.id); if(!r) return;
  if(r.status!=='active'){ showToast('เลิกผลิตได้เฉพาะสินค้าสถานะใช้งาน (INVALID_STATE)','warning'); closeModalToCtx(); return; }
  r.status='obsolete'; r.modified_at=new Date().toISOString();
  r.audit.push({kind:'status',label:'เลิกผลิต (obsolete) — ขายสต็อกคงเหลือได้ งดซื้อ/ผลิตเพิ่ม',by:CURRENT_USER.id,at:r.modified_at,v:'warning'});
  showToast('เปลี่ยนสถานะเป็น เลิกผลิต แล้ว','success'); closeModalToCtx();
}
function confirmDiscontinue(){  // FN-07 state machine: obsolete → discontinued (ยกเลิกถาวร — ปิดการขาย)
  const r=RAW.find(x=>x.id===state.modal.id); if(!r) return;
  if(r.status!=='obsolete'){ showToast('ยกเลิกถาวรได้เฉพาะสินค้าสถานะเลิกผลิต (INVALID_STATE)','warning'); closeModalToCtx(); return; }
  r.status='discontinued'; r.modified_at=new Date().toISOString();
  r.audit.push({kind:'status',label:'ยกเลิกถาวร (discontinued) — ปิดการขาย/ซื้อทุกช่องทาง',by:CURRENT_USER.id,at:r.modified_at,v:'warning'});
  showToast('เปลี่ยนสถานะเป็น ยกเลิก แล้ว','success'); closeModalToCtx();
}
function reactivate(id){        // FN-07 state machine: obsolete → active (กลับมาใช้งาน — ตรวจความพร้อมก่อน)
  const r=RAW.find(x=>x.id===id); if(!r) return;
  if(r.status!=='obsolete'){ showToast('กลับมาใช้งานได้เฉพาะสินค้าสถานะเลิกผลิต (INVALID_STATE)','warning'); return; }
  const errs=validateActivation(r);
  if(errs.length){ showToast('ข้อมูลไม่พร้อมใช้งาน: '+errs.join(', ')+' (NOT_READY)','error'); return; }
  r.status='active'; r.modified_at=new Date().toISOString();
  r.audit.push({kind:'status',label:'กลับมาใช้งาน (reactivate)',by:CURRENT_USER.id,at:r.modified_at,v:'success'});
  showToast('สินค้ากลับมาสถานะ ใช้งาน แล้ว','success'); render();
}

    <div class="drawer-section"><h3 class="drawer-section-title">กลุ่มบัญชี (Posting Group)</h3><div class="drawer-fields">

      <div class="lbl">กลุ่มภาษี</div><div class="val">${esc(r.vat_prod_group)||'—'}</div>
    </div><div class="info-box is-info" style="margin-top:8px;">บัญชี GL จริง resolve จาก Finance Posting Setup ตามกลุ่ม</div></div>
    <div class="drawer-section"><h3 class="drawer-section-title">การสั่งซื้อซ้ำ</h3><div class="drawer-fields">
      <div class="lbl">จุดสั่งซื้อซ้ำ</div><div class="val">${r.reorder_point!=null?fmtNum(r.reorder_point):'—'}</div>
      <div class="lbl">ปริมาณสั่งซ้ำ</div><div class="val">${r.reorder_qty!=null?fmtNum(r.reorder_qty):'—'}</div>
      <div class="lbl">สต็อกปลอดภัย</div><div class="val">${r.safety_stock!=null?fmtNum(r.safety_stock):'—'}</div>
      <div class="lbl">MOQ</div><div class="val">${r.moq!=null?fmtNum(r.moq):'—'}</div>
    </div></div>`
    : `<div class="empty"><div class="empty-icon"><i data-lucide="lock" class="w-5 h-5"></i></div><div class="empty-title">ข้อมูลจำกัด (Confidential)</div><div class="empty-desc">ราคา / ต้นทุน / GL เป็นข้อมูล Confidential — เฉพาะ Finance / Product Manager / Director เท่านั้น</div></div>`;
  }
  else if(tab==='media'){
    const imgs=r.images||[]; const atts=r.attachments||[];
    body=`<div class="drawer-section"><h3 class="drawer-section-title">รูปภาพสินค้า</h3>
      ${imgs.length?`<div class="img-gallery">${imgs.map(im=>`<div class="img-cell ${im.cover?'is-cover':''}"><img src="${im.url}" alt="${esc(im.name)}">${im.cover?'<span class="img-cover-tag"><i data-lucide="star" class="w-3 h-3"></i>ปก</span>':''}</div>`).join('')}</div>`:'<div class="info-box is-info">ไม่มีรูปภาพ</div>'}
    </div>
    <div class="drawer-section"><h3 class="drawer-section-title">เอกสารแนบ</h3>
      ${atts.length?`<div class="att-list">${atts.map(a=>`<div class="att-row"><div class="att-ico"><i data-lucide="${a.kind==='xlsx'?'file-spreadsheet':a.kind==='img'?'file-image':'file-text'}" class="w-4 h-4"></i></div><div class="att-info"><div class="att-name">${esc(a.name)}</div><div class="att-meta">${esc(a.size||'')}</div></div><button class="ra-btn" title="ดาวน์โหลด"><i data-lucide="download" class="w-4 h-4"></i></button></div>`).join('')}</div>`:'<div class="info-box is-info">ไม่มีเอกสารแนบ</div>'}
    </div>`;
  }
  else if(tab==='history'){
    body=`<div class="drawer-section"><h3 class="drawer-section-title">ประวัติ & Audit (version ${r.version})</h3>
      <div class="timeline">${r.audit.map(a=>`<div class="tl-item"><div class="tl-dot ${a.v?'is-'+a.v:''}"></div><div class="tl-title">${esc(a.label)}</div><div class="tl-meta">${fmtDateTime(a.at)} · ${esc(a.by)}</div></div>`).join('')}</div>
    </div>`;
  }

  return `<div class="drawer-header">${coverImg(r)?`<img class="drawer-avatar" style="object-fit:cover;" src="${coverImg(r)}" alt="">`:`<div class="drawer-avatar">${initials(r.code)}</div>`}
    <div style="flex:1;min-width:0;"><div style="display:flex;align-items:center;gap:8px;min-width:0;"><h2 class="drawer-title" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(r.name_th)}</h2><span class="pill pill-${r.status}">${statusLabel(r.status)}</span></div>
    <div class="drawer-subtitle"><span>${esc(r.code)}</span><span>·</span><span class="type-pill">${r.type}</span><span>·</span><span>${typeLabel(r.type)}</span></div></div>
    <div class="drawer-header-actions">${actions}${actions?'<span class="drawer-header-divider"></span>':''}<button class="top-icon-btn" onclick="closeDrawer()"><i data-lucide="x" class="w-4 h-4"></i></button></div></div>
  <div class="drawer-tabs">${tabBtn('overview','ภาพรวม')}${tabBtn('uom','หน่วยนับ')}${tabBtn('price','ราคา')}${tabBtn('media','รูปภาพ & เอกสาร')}${tabBtn('history','ประวัติ')}</div>
  <div class="drawer-body">${body}</div>
  <div class="drawer-footer"><div class="drawer-footer-meta">version ${r.version} · สร้าง ${fmtDateTime(r.created_at)}</div><div class="footer-spacer"></div><button class="btn btn-secondary" onclick="closeDrawer()">ปิด</button></div>`;
}

/* ---- CREATE / EDIT (P-02 / P-03 · Pattern B, 3-step drawer wizard) ---- */
function renderForm(){
  const f=state.form; const isEdit=state.drawer.mode==='edit'; const step=state.drawer.step; const tm=TYPEMETA[f.type]||{};
  const steps=['ข้อมูลหลัก','หน่วยนับ','ราคา','รูปภาพ & เอกสาร'];
  const codeLocked = isEdit;                     // IR-01 product_code immutable after create
  const uomLocked  = isEdit && f.has_txn;        // IR-02 base_uom immutable after transaction

  const sel=(arr,val,fmt)=>arr.map(o=>{const v=Array.isArray(o)?o[0]:o;const l=Array.isArray(o)?o[1]:(fmt?fmt(o):o);return `<option value="${v}"${val===v?' selected':''}>${l}</option>`;}).join('');

  let bodyStep='';
  if(step===1){
    bodyStep=`<div class="drawer-section"><h3 class="drawer-section-title">ข้อมูลหลัก</h3>
      <div class="field"><label class="field-label">รหัสสินค้า <span class="req">*</span></label>
        <input class="input" id="f-code" value="${esc(f.code)}" placeholder="สร้างอัตโนมัติ" readonly style="background:var(--c-bg-off);color:var(--c-mute);cursor:not-allowed;">
        ${codeLocked?'<div class="field-help"><span class="locked-row"><i data-lucide="lock" class="w-3.5 h-3.5"></i> รหัสล็อก — แก้ไขไม่ได้หลังสร้าง (IR-01)</span></div>':'<div class="field-help"><span class="locked-row"><i data-lucide="wand-sparkles" class="w-4 h-4"></i> สร้างอัตโนมัติจากประเภท + เลขรัน (เปลี่ยนตามประเภทที่เลือก) — แก้ไขไม่ได้หลังสร้าง</span></div>'}</div>
      <div class="field"><label class="field-label">ชื่อสินค้า (ไทย) <span class="req">*</span></label><input class="input" id="f-name_th" value="${esc(f.name_th)}" placeholder="ชื่อภาษาไทย"></div>
      <div class="field"><label class="field-label">ชื่อสินค้า (อังกฤษ)</label><input class="input" id="f-name_en" value="${esc(f.name_en)}" placeholder="English name"></div>
      <div class="field"><label class="field-label">ประเภท <span class="req">*</span></label>
        <select class="select" id="f-type" onchange="setType(this.value)">${sel(TYPES,f.type,typeLabel)}</select>
        <div class="field-help">ประเภทกำหนดพฤติกรรมอัตโนมัติ — สต็อก ${tm.stocked?'✓':'✗'} · ขาย ${tm.sell?'✓':'✗'} · ซื้อ ${tm.buy?'✓':'✗'}</div></div>
      <div class="field-row">
        <div class="field" style="margin:0;"><label class="field-label">หมวดหมู่หลัก <span class="req">*</span></label><select class="select" id="f-cat_l1">${sel(CATS_L1,f.cat_l1)}</select></div>
        <div class="field" style="margin:0;"><label class="field-label">หมวดหมู่ย่อย</label><select class="select" id="f-cat_l2">${sel(CATS_L2,f.cat_l2)}</select></div>
      </div>
      <div class="field-row" style="margin-top:14px;">
        <div class="field" style="margin:0;"><label class="field-label">กลุ่มสินค้า</label><select class="select" id="f-group">${sel(GROUPS,f.group)}</select></div>
        <div class="field" style="margin:0;"><label class="field-label">GTIN (บาร์โค้ด)</label><input class="input" id="f-gtin" value="${esc(f.gtin)}" placeholder="เช่น 885..."></div>
      </div>
      <div class="field-row" style="margin-top:14px;">
        <div class="field" style="margin:0;"><label class="field-label">HS Code</label><input class="input" id="f-hs" value="${esc(f.hs_code)}" placeholder="พิกัดศุลกากร"></div>
        <div class="field" style="margin:0;"><label class="field-label">รหัสเก่า (ระบบเดิม)</label><input class="input" id="f-oldcode" value="${esc(f.old_code)}" placeholder="รหัสจากระบบเดิมของลูกค้า"><div class="field-help">รหัสที่ลูกค้าเคยใช้ในระบบก่อนหน้า — ไว้อ้างอิง/ค้นหา (ไม่บังคับ ซ้ำได้)</div></div>
      </div>
    </div>

`;
  }
  else if(step===2){
    bodyStep=`<div class="drawer-section"><h3 class="drawer-section-title">หน่วยฐาน & หน่วยแปลง</h3>
      <div class="field"><label class="field-label">หน่วยฐาน — หน่วยเล็กสุดที่นับสต็อก <span class="req">*</span></label>
        <select class="select" id="f-uom" ${uomLocked?'disabled':''} ${uomLocked?'':'onchange="captureForm();render();"'}>${sel(UOMS.map(u=>[u,uomOpt(u)]),f.uom)}</select>
        ${uomLocked?'<div class="field-help"><span class="locked-row"><i data-lucide="lock" class="w-3.5 h-3.5"></i> หน่วยฐานล็อก — มี transaction แล้ว (IR-02)</span></div>':`<div class="field-help">เลือกหน่วยเล็กสุด เช่น ขวด/ชิ้น — ทุกธุรกรรมแปลงกลับเป็นหน่วยนี้เสมอ · นับสต็อกก้อนเดียว มองได้หลายหน่วย · หมวด <strong>${CAT_TH[uomCat(f.uom)]||'—'}</strong> — หน่วยแปลงต้องหมวดเดียวกัน</div>`}</div>
      <label class="field-label" style="margin-top:6px;">หน่วยที่ใหญ่กว่า (ซื้อ/ขายเป็นหน่วยใหญ่ได้)</label>
      <div class="field-help" style="margin:-2px 0 8px;">หน่วยฐานเก็บสต็อกเสมอ · ติ๊ก <strong>เก็บสต็อก</strong> ที่หน่วยใหญ่ ถ้าต้องการให้คลังนับ <strong>แยกหน่วยนั้น</strong> (เช่น ลัง/ขวด นับแยก ต้อง break/pack เปลี่ยนหน่วย) — Inventory 4.0 รองรับ</div>
      ${(f.conversions&&f.conversions.length)?`<div class="conv-rows">
        ${f.conversions.map((c,i)=>`<div class="conv-row ${uomLocked?'is-locked':''}">
          <span class="cr-one">1</span>
          ${uomLocked?`<span class="cr-one">${esc(c.uom)}</span>`:`<select class="select" id="conv-uom-${i}" onchange="captureForm();render();">${sel(UOMS.filter(u=>u!==f.uom && uomCat(u)===uomCat(f.uom)).map(u=>[u,uomOpt(u)]),c.uom)}</select>`}
          <span class="cr-eq">=</span>
          ${uomLocked?`<span class="cr-one">${c.factor}</span>`:`<input class="input cr-factor" type="number" min="1" id="conv-factor-${i}" value="${c.factor}" oninput="captureForm()" onchange="captureForm();render();">`}
          <span class="cr-base">${esc(f.uom)}</span>
          <div class="cr-flags">
            <span class="cr-flag ${c.buy?'is-on':''}" ${uomLocked?'style="opacity:.6;pointer-events:none;"':`onclick="toggleConvFlag(${i},'buy')"`}><i data-lucide="shopping-cart" class="w-4 h-4"></i>ซื้อ</span>
            <span class="cr-flag ${c.sell?'is-on':''}" ${uomLocked?'style="opacity:.6;pointer-events:none;"':`onclick="toggleConvFlag(${i},'sell')"`}><i data-lucide="tag" class="w-4 h-4"></i>ขาย</span>
            <span class="cr-flag is-def ${c.def?'is-on':''}" ${uomLocked?'style="opacity:.6;pointer-events:none;"':`onclick="toggleConvFlag(${i},'def')"`}><i data-lucide="star" class="w-3 h-3"></i>หลัก</span>
            <span class="cr-flag ${c.stock?'is-on':''}" ${uomLocked?'style="opacity:.6;pointer-events:none;"':`onclick="toggleConvFlag(${i},'stock')"`} title="เก็บสต็อกแยกเป็นหน่วยนี้ (Multi-UOM) — Inventory นับ bucket หน่วยนี้แยก"><i data-lucide="package" class="w-3 h-3"></i>เก็บสต็อก</span>
            ${uomLocked?'':`<button class="del-mini" onclick="delConv(${i})"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>`}
          </div>
        </div>`).join('')}
      </div>`:'<div class="info-box is-info">ยังไม่มีหน่วยใหญ่ — ขาย/ซื้อด้วยหน่วยฐานอย่างเดียว</div>'}
      ${uomLocked?'<div class="conv-locked-note"><i data-lucide="lock" class="w-3.5 h-3.5"></i><span>สูตรหน่วยแปลงถูกล็อก — สินค้านี้มี transaction แล้ว แก้ไม่ได้เพื่อกันสต็อก/ต้นทุนย้อนหลังเพี้ยน (IR-02)</span></div>':'<button class="conv-add" onclick="addConv()"><i data-lucide="plus" class="w-3.5 h-3.5"></i> เพิ่มหน่วยใหญ่ (เช่น แพ็ค / ลัง)</button>'}
      ${(f.conversions&&f.conversions.filter(c=>c.uom&&+c.factor>0).length)?`<div class="stock-preview">
        <div class="stock-preview-title"><i data-lucide="calculator" class="w-3 h-3"></i>ตัวอย่าง — ถ้ามี ${fmtNum(STOCK_DEMO)} ${esc(f.uom)} ในคลัง ระบบจะมองเป็น</div>
        <div class="stock-preview-row">
          <span class="stock-preview-chip">${fmtNum(STOCK_DEMO)} <span class="u">${esc(f.uom)}</span></span>
          ${f.conversions.filter(c=>c.uom&&+c.factor>0).map(c=>`<span class="stock-preview-eq">=</span><span class="stock-preview-chip">${(STOCK_DEMO/c.factor).toLocaleString('th-TH',{maximumFractionDigits:2})} <span class="u">${esc(c.uom)}</span></span>`).join('')}
        </div>
        <div class="field-help" style="margin-top:7px;">ของก้อนเดียวกัน มองได้หลายหน่วย · ขาย 1 หน่วยใหญ่ = ตัดสต็อกหน่วยฐานอัตโนมัติ</div>
      </div>`:''}
      <div class="info-box is-info" style="margin-top:10px;">ทั้งหมดนี้คือสินค้า<strong>ตัวเดียวกัน</strong> นับสต็อกก้อนเดียว (best practice — ไม่สร้าง SKU ซ้ำต่อหน่วย) · แยกเป็นคนละ product + BOM เฉพาะกรณีมีการ<strong>แกะ/บรรจุใหม่จริง</strong>เท่านั้น</div>
    </div>
    <div class="drawer-section"><h3 class="drawer-section-title">พฤติกรรม (ตั้งล่วงหน้าจากประเภท — ปรับได้)</h3>
      <div class="toggle-field"><span class="tf-label">นับสต็อก</span><div class="toggle-track ${f.stocked?'is-on':''}" onclick="toggleBehavior('stocked')"><div class="toggle-knob"></div></div></div>
      <div class="toggle-field"><span class="tf-label">ขายได้</span><div class="toggle-track ${f.sellable?'is-on':''}" onclick="toggleBehavior('sellable')"><div class="toggle-knob"></div></div></div>
      <div class="toggle-field"><span class="tf-label">ซื้อได้</span><div class="toggle-track ${f.purchasable?'is-on':''}" onclick="toggleBehavior('purchasable')"><div class="toggle-knob"></div></div></div>
    </div>`;
  }
  else if(step===3){
    const needGL=f.stocked;
    bodyStep=`<div class="drawer-section"><h3 class="drawer-section-title">ต้นทุน (ซื้อ) <span class="conf-tag"><i data-lucide="lock" class="w-3.5 h-3.5"></i>Confidential</span></h3>
      <div class="field"><label class="field-label">วิธีคิดต้นทุน</label><select class="select" id="f-cost_method">${sel(COST_METHODS,f.cost_method)}</select></div>
      <div class="field-row">
        <div class="field" style="margin:0;"><label class="field-label">ต้นทุนมาตรฐาน</label><input class="input" type="number" id="f-cost" value="${f.standard_cost||''}" placeholder="0.00"></div>
        <div class="field" style="margin:0;"><label class="field-label">ราคาซื้อเริ่มต้น</label><input class="input" type="number" id="f-buy" value="${f.purchase_price||''}" placeholder="0.00" ${f.purchasable?'':'disabled'}>${f.purchasable?'<div class="field-help">ราคาตั้งต้นใน PR/PO</div>':'<div class="field-help">ประเภทนี้ซื้อไม่ได้</div>'}</div>
      </div>
    </div>
    <div class="drawer-section"><h3 class="drawer-section-title">ราคาขาย <span class="conf-tag"><i data-lucide="lock" class="w-3.5 h-3.5"></i>Confidential</span></h3>
      <div class="field-row">
        <div class="field" style="margin:0;"><label class="field-label">ราคาขาย</label><input class="input" type="number" id="f-price" value="${f.list_price||''}" placeholder="0.00" ${f.sellable?'':'disabled'}>${f.sellable?'<div class="field-help">ราคาตั้งต้นใน SO/Invoice</div>':'<div class="field-help">ประเภทนี้ขายไม่ได้</div>'}</div>
        <div class="field" style="margin:0;"><label class="field-label">สกุลเงิน</label><select class="select" id="f-currency">${sel(['THB','USD','EUR','CNY'],f.currency)}</select></div>
      </div>
    </div>
    <div class="drawer-section"><h3 class="drawer-section-title">กลุ่มบัญชี (Posting Group)</h3>
      <div class="field-row">
        <div class="field" style="margin:0;"><label class="field-label">กลุ่มบัญชีสินค้า ${needGL?'<span class="req">*</span>':''}</label><select class="select" id="f-ppg" ${needGL?'':'disabled'}><option value="">— เลือก —</option>${PROD_POSTING_GROUPS.map(g=>{const code=g.split(' ')[0];return `<option value="${code}"${f.prod_posting_group===code?' selected':''}>${g}</option>`;}).join('')}</select></div>
        <div class="field" style="margin:0;"><label class="field-label">กลุ่มภาษี</label><select class="select" id="f-vpg"><option value="">— เลือก —</option>${VAT_PROD_GROUPS.map(g=>{const code=g.split(' ')[0];return `<option value="${code}"${f.vat_prod_group===code?' selected':''}>${g}</option>`;}).join('')}</select></div>
      </div>
      <div class="info-box is-info" style="margin-top:10px;">ระบบ resolve เป็นบัญชี GL จริง (สินค้าคงคลัง / COGS / รายได้ / ภาษี) จาก <strong>Finance Posting Setup</strong> ส่วนกลางตามกลุ่มที่เลือก — ไม่ผูกเลขบัญชีที่ตัวสินค้า</div>
    </div>
    <div class="drawer-section"><h3 class="drawer-section-title">การสั่งซื้อซ้ำ</h3>
      <div class="field-row">
        <div class="field" style="margin:0;"><label class="field-label">จุดสั่งซื้อซ้ำ</label><input class="input" type="number" id="f-rp" value="${f.reorder_point??''}" placeholder="0"></div>
        <div class="field" style="margin:0;"><label class="field-label">ปริมาณสั่งซ้ำ</label><input class="input" type="number" id="f-rq" value="${f.reorder_qty??''}" placeholder="0"></div>
      </div>
      <div class="field-row" style="margin-top:14px;">
        <div class="field" style="margin:0;"><label class="field-label">สต็อกปลอดภัย</label><input class="input" type="number" id="f-ss" value="${f.safety_stock??''}" placeholder="0"></div>
        <div class="field" style="margin:0;"><label class="field-label">MOQ</label><input class="input" type="number" id="f-moq" value="${f.moq??''}" placeholder="0"></div>
      </div>
    </div>
    <div class="drawer-section"><h3 class="drawer-section-title">แจ้งเตือนระดับสต็อก (Min / Max)</h3>
      ${f.stocked?`
      <div class="field-row">
        <div class="field" style="margin:0;"><label class="field-label">สต็อกขั้นต่ำ (Min)</label><input class="input" type="number" id="f-minstk" min="0" value="${f.min_stock??''}" placeholder="ไม่กำหนด"><div class="field-help">ต่ำกว่านี้ → แจ้งเตือน "ต่ำกว่าขั้นต่ำ"</div></div>
        <div class="field" style="margin:0;"><label class="field-label">สต็อกสูงสุด (Max)</label><input class="input" type="number" id="f-maxstk" min="0" value="${f.max_stock??''}" placeholder="ไม่กำหนด"><div class="field-help">เกินนี้ → แจ้งเตือน "เกินเพดาน" (over-stock)</div></div>
      </div>
      <div class="info-box is-info" style="margin-top:10px;">หน่วยฐาน <strong>${esc(f.uom)||'—'}</strong> · เว้นว่าง = ไม่เตือนด้านนั้น · Max ต้อง ≥ Min · ใช้คู่กับ <strong>Inventory Monitoring</strong> (เทียบ on-hand รวมทุกคลัง — ระดับรายคลังเป็น OQ)</div>`
      :`<div class="info-box is-info">ประเภทนี้ไม่นับสต็อก — ไม่มีการแจ้งเตือนระดับสต็อก</div>`}
    </div>`;
  }
  else if(step===4){
    const imgs=f.images||[]; const atts=f.attachments||[];
    bodyStep=`<div class="drawer-section"><h3 class="drawer-section-title">รูปภาพสินค้า</h3>
      <div class="field-help" style="margin-bottom:4px;">อัปโหลดได้หลายภาพ · ภาพที่ตั้งเป็น <strong>ปก</strong> จะใช้เป็นรูปโปรไฟล์สินค้า (แสดงในรายการ/เอกสาร)</div>
      <div class="img-gallery">
        ${imgs.map(im=>`<div class="img-cell ${im.cover?'is-cover':''}">
          <img src="${im.url}" alt="${esc(im.name)}">
          ${im.cover?'<span class="img-cover-tag"><i data-lucide="star" class="w-3 h-3"></i>ปก</span>':''}
          <div class="img-actions">
            ${im.cover?'':`<button class="img-act" title="ตั้งเป็นปก" onclick="setCover('${im.id}')"><i data-lucide="star" class="w-3 h-3"></i></button>`}
            <button class="img-act" title="ลบ" onclick="delImage('${im.id}')"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
          </div>
        </div>`).join('')}
        <div class="img-add" onclick="addImage()"><i data-lucide="image-plus" class="w-5 h-5"></i>เพิ่มรูป</div>
      </div>
    </div>
    <div class="drawer-section"><h3 class="drawer-section-title">เอกสารแนบ</h3>
      <div class="field-help" style="margin-bottom:4px;">แนบเอกสารประกอบ เช่น สเปก, ใบรับรอง, datasheet, MSDS</div>
      ${atts.length?`<div class="att-list">
        ${atts.map(a=>`<div class="att-row">
          <div class="att-ico"><i data-lucide="${a.kind==='xlsx'?'file-spreadsheet':a.kind==='img'?'file-image':'file-text'}" class="w-4 h-4"></i></div>
          <div class="att-info"><div class="att-name">${esc(a.name)}</div><div class="att-meta">${esc(a.size||'')}</div></div>
          <button class="del-mini" title="ลบ" onclick="delAtt('${a.id}')"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button>
        </div>`).join('')}
      </div>`:'<div class="info-box is-info">ยังไม่มีเอกสารแนบ</div>'}
      <button class="att-add" onclick="addAtt()"><i data-lucide="paperclip" class="w-3.5 h-3.5"></i> แนบเอกสาร</button>
    </div>`;
  }

  return `<div class="dw-head">
    <div class="dw-head-row">
      <div>
        <div class="dw-eyebrow"><i data-lucide="${isEdit?'pencil':'file-plus'}" class="w-3.5 h-3.5"></i> ${isEdit?'แก้ไขสินค้า':'สร้างสินค้าใหม่'}</div>
        <h2 class="dw-title">${isEdit?'แก้ไข '+esc(f.code):'เพิ่มสินค้าใหม่'}</h2>
        <div class="dw-sub">ขั้นที่ ${step}/4 · ${steps[step-1]}</div>
      </div>
      <button class="top-icon-btn" onclick="closeDrawer()"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div class="d-stepper">
      ${steps.map((label,idx)=>{const n=idx+1;const cls=step>n?'done':(step===n?'active':'');
        return `<div class="stepper-item ${cls}"><div class="stepper-circle">${step>n?'<i data-lucide="check" class="w-3.5 h-3.5"></i>':n}</div><div class="stepper-label">${label}</div></div>`;
      }).join('')}
    </div>
  </div>
  <div class="drawer-body">${bodyStep}</div>
  <div class="dw-footer">
    <div>${step>1?`<button class="btn btn-secondary" onclick="prevStep()"><i data-lucide="chevron-left" class="w-4 h-4"></i><span>ย้อนกลับ</span></button>`:''}</div>
    <div class="dw-footer-right">
      <button class="btn btn-ghost" onclick="closeDrawer()">ยกเลิก</button>
      <button class="btn btn-secondary" onclick="saveDraft()"><i data-lucide="save" class="w-4 h-4"></i><span>บันทึกแบบร่าง</span></button>
      ${step<4?`<button class="btn btn-primary" onclick="nextStep()"><span>ถัดไป</span><i data-lucide="chevron-right" class="w-4 h-4"></i></button>`:`<button class="btn btn-primary" id="btn-submit" onclick="submitForm()"><i data-lucide="send" class="w-4 h-4"></i><span>${(isEdit&&f.status!=='draft')?'บันทึก':'บันทึกและเปิดใช้งาน'}</span></button>`}
    </div>
  </div>`;
}

/* ===================== RENDER: MODAL (P-05 / P-06 · Pattern D) ===================== */
function renderModal(){
  if(!state.modal.open) return '';
  if(state.modal.type==='bulk') return renderBulkModal();
  const r=RAW.find(x=>x.id===state.modal.id); if(!r) return '';

  if(state.modal.type==='obsolete'){
    return `<div class="modal-header"><div class="modal-header-icon is-warning"><i data-lucide="package-minus" class="w-5 h-5"></i></div>
      <div style="flex:1;"><h3 class="modal-title">เลิกผลิตสินค้า</h3><p class="modal-subtitle">เปลี่ยน <strong>${esc(r.code)}</strong> เป็นสถานะ เลิกผลิต</p></div>
      <button class="icon-btn" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button></div>
    <div class="modal-body"><div class="info-box is-warning">ยัง<strong>ขายสต็อกคงเหลือได้</strong> แต่<strong>งดซื้อ/ผลิตเพิ่ม</strong> · กลับมาใช้งานอีกครั้งได้ภายหลัง</div></div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" onclick="confirmObsolete()"><i data-lucide="package-minus" class="w-4 h-4"></i><span>เลิกผลิต</span></button></div>`;
  }
  if(state.modal.type==='discontinue'){
    return `<div class="modal-header"><div class="modal-header-icon is-danger"><i data-lucide="ban" class="w-5 h-5"></i></div>
      <div style="flex:1;"><h3 class="modal-title">ยกเลิกสินค้าถาวร</h3><p class="modal-subtitle">เปลี่ยน <strong>${esc(r.code)}</strong> เป็นสถานะ ยกเลิก</p></div>
      <button class="icon-btn" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button></div>
    <div class="modal-body"><div class="info-box is-warning"><strong>ปิดการขาย/ซื้อทุกช่องทาง</strong> · ประวัติและ transaction เดิมยังอ้างอิงได้ · ขั้นต่อไปทำได้เฉพาะ จัดเก็บ (archive)</div></div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-danger" onclick="confirmDiscontinue()"><i data-lucide="ban" class="w-4 h-4"></i><span>ยกเลิกถาวร</span></button></div>`;
  }
  // archive (P-06)
  return `<div class="modal-header"><div class="modal-header-icon is-danger"><i data-lucide="archive" class="w-5 h-5"></i></div>
    <div style="flex:1;"><h3 class="modal-title">จัดเก็บสินค้า</h3><p class="modal-subtitle">จัดเก็บ <strong>${esc(r.code)}</strong> (soft delete)</p></div>
    <button class="icon-btn" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button></div>
  <div class="modal-body">${r.has_txn
    ?`<div class="info-box is-warning"><strong>มี transaction อ้างอิง:</strong> product_id เป็น match key — ไม่ลบถาวร เปลี่ยนสถานะเป็น <strong>archived</strong> เท่านั้น (BR-002)</div>`
    :`<div class="info-box is-warning">สินค้าจะถูกตั้งเป็น <strong>archived</strong> และเก็บประวัติไว้ (soft delete เท่านั้น — BR-S06)</div>`}</div>
  <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-danger" onclick="confirmArchive()"><i data-lucide="archive" class="w-4 h-4"></i><span>จัดเก็บ</span></button></div>`;
}
function renderBulkModal(){
  const b=state.bulk||{step:'pick',rows:[]};
  const head=`<div class="modal-header"><div class="modal-header-icon"><i data-lucide="upload" class="w-5 h-5"></i></div>
    <div style="flex:1;"><h3 class="modal-title">นำเข้าสินค้าจำนวนมาก</h3><p class="modal-subtitle">Excel / CSV → สร้างเป็นร่างทุกแถว (API-09)</p></div>
    <button class="icon-btn" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button></div>`;
  if(b.step==='pick'){
    return `${head}
  <div class="modal-body">
    <div class="preview-box" style="cursor:pointer;" onclick="bulkPick()"><i data-lucide="file-spreadsheet" class="w-5 h-5" style="color:var(--c-mute);"></i><div><strong>เลือกไฟล์ CSV / Excel</strong><div style="font-size:12px;color:var(--c-mute);">คลิกเพื่อเลือกไฟล์ (ตัวอย่าง 5 แถว) — Dev ต่อ parser + ENG-COSTING</div></div></div>
    <div class="info-box is-info" style="margin-top:12px;">ทุกแถวสร้างเป็นสถานะ <strong>ร่าง</strong> + per-row audit · แถวผิด → รายงาน IMPORT_ERROR รายแถว ไม่ล้มทั้งไฟล์</div>
    <div class="bulk-cols"><div class="bulk-cols-h"><i data-lucide="table-2" class="w-3.5 h-3.5"></i>คอลัมน์ CSV</div>
      <code class="bulk-code">code*, name_th*, name_en, type*, old_code, uom*, cat_l1, list_price, <b>min_stock</b>, <b>max_stock</b> ...</code>
      <div class="bulk-note"><b>min_stock/max_stock</b> = แจ้งเตือนระดับสต็อก (หน่วยฐาน · max≥min · เฉพาะประเภทนับสต็อก)</div>
    </div>
  </div>
  <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ปิด</button></div>`;
  }
  if(b.step==='preview'){
    const okN=b.rows.filter(r=>!r.err).length;
    return `${head}
  <div class="modal-body">
    <div class="info-box ${b.rows.some(r=>r.err)?'is-warning':'is-success'}">ตรวจแล้ว ${b.rows.length} แถว — นำเข้าได้ <strong>${okN}</strong> · ติดปัญหา <strong>${b.rows.length-okN}</strong> (แถวผิดจะถูกข้าม ไม่ล้มทั้งไฟล์)</div>
    <div class="table-scroll" style="margin-top:10px;max-height:300px;"><table class="table"><thead><tr><th>รหัส</th><th>สินค้า</th><th>ประเภท</th><th>หน่วย</th><th class="num">Min</th><th class="num">Max</th><th>ผลตรวจ</th></tr></thead><tbody>
      ${b.rows.map(r=>`<tr><td><span style="font-family:monospace;font-size:12px;font-weight:600;">${esc(r.code)}</span></td><td>${esc(r.name_th)}</td><td><span class="type-pill">${esc(r.type)}</span></td><td>${esc(r.uom)}</td><td class="num">${r.min_stock??'—'}</td><td class="num">${r.max_stock??'—'}</td>
        <td>${r.err?`<span class="pill pill-pending" title="${esc(r.err)}">✗ ${esc(r.err)}</span>`:'<span class="pill pill-active">✓ พร้อมนำเข้า</span>'}</td></tr>`).join('')}
    </tbody></table></div>
  </div>
  <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" ${okN?'':'style="opacity:.5;pointer-events:none;"'} onclick="bulkConfirm()"><i data-lucide="upload" class="w-4 h-4"></i><span>นำเข้า ${okN} แถว</span></button></div>`;
  }
  // done
  return `${head}
  <div class="modal-body">
    <div class="info-box ${b.err?'is-warning':'is-success'}">นำเข้าเสร็จ — สร้างร่าง <strong>${b.ok}</strong> แถว${b.err?` · ข้าม <strong>${b.err}</strong> แถว (IMPORT_ERROR)`:''}</div>
    ${b.err?`<div class="table-scroll" style="margin-top:10px;max-height:220px;"><table class="table"><thead><tr><th>รหัส</th><th>สินค้า</th><th>สาเหตุ</th></tr></thead><tbody>
      ${state.bulk.rows.filter(r=>r.err).map(r=>`<tr><td><span style="font-family:monospace;font-size:12px;font-weight:600;">${esc(r.code)}</span></td><td>${esc(r.name_th)}</td><td><span class="pill pill-pending">${esc(r.err)}</span></td></tr>`).join('')}
    </tbody></table></div>`:''}
    <div class="field-help" style="margin-top:10px;">รายการที่นำเข้าอยู่ในสถานะ <strong>ร่าง</strong> — เปิดดู/แก้ไข/เปิดใช้งานได้จากตารางหลัก</div>
  </div>
  <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">ปิด</button></div>`;
}
/* ===================== TOAST + RENDER + BOOT ===================== */
function showToast(msg,variant='info',ms=2800){
  const el=document.getElementById('toast'); const map={success:'check-circle-2',info:'info',warning:'alert-triangle',error:'x-circle'};
  el.className='toast is-'+variant; el.innerHTML=`<i data-lucide="${map[variant]||'info'}" class="w-4 h-4"></i><span>${esc(msg)}</span>`; renderIcons();
  requestAnimationFrame(()=>el.classList.add('is-visible')); clearTimeout(showToast._t); showToast._t=setTimeout(()=>el.classList.remove('is-visible'),ms);
}
function render(){
  const snap=preserveRenderState();
  document.getElementById('page-content').innerHTML=renderList();
  document.getElementById('drawer').innerHTML=renderDrawer();
  document.getElementById('modalEl').innerHTML=renderModal();
  renderIcons(); restoreRenderState(snap);
}
function renderIcons(){ if(window.lucide&&typeof window.lucide.createIcons==='function') window.lucide.createIcons(); }
function preserveRenderState(){
  const db=document.querySelector('.drawer-body'); const mb=document.querySelector('.modal-body'); const a=document.activeElement;
  const isI=a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA');
  return { ds:db?db.scrollTop:0, ms:mb?mb.scrollTop:0, ps:window.scrollY, fk:isI?{id:a.id||'',ss:a.selectionStart,se:a.selectionEnd}:null };
}
function restoreRenderState(s){
  if(!s) return;
  requestAnimationFrame(()=>{
    const db=document.querySelector('.drawer-body'); if(db&&s.ds>0) db.scrollTop=s.ds;
    const mb=document.querySelector('.modal-body'); if(mb&&s.ms>0) mb.scrollTop=s.ms;
    if(s.ps>0) window.scrollTo(0,s.ps);
    if(s.fk&&s.fk.id){ const c=document.getElementById(s.fk.id); if(c){ c.focus(); if(s.fk.ss!=null&&c.setSelectionRange){try{c.setSelectionRange(s.fk.ss,s.fk.se);}catch(e){}} } }
  });
}
// Esc closes top-most layer (Iron Rule #15)
window.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(state.modal.open) closeModal(); else if(state.drawer.open) closeDrawer(); } });
// close user menu on outside click
window.addEventListener('click',e=>{ const m=document.getElementById('userMenu'); if(m&&m.classList.contains('is-open')&&!e.target.closest('.user-chip')&&!e.target.closest('#userMenu')) m.classList.remove('is-open'); });
// hash routing (refresh-safe SPA)
window.addEventListener('hashchange',syncFromHash);

var domReady=false,lucideReady=false;
function bootIfReady(){ if(domReady&&lucideReady){ if(!location.hash) location.hash='#/products'; syncFromHash(); renderIcons(); } }
if(document.readyState==='loading'){ window.addEventListener('DOMContentLoaded',function(){domReady=true;bootIfReady();}); } else { domReady=true; }
window.addEventListener('lucide:ready',function(){lucideReady=true;bootIfReady();});
if(window.lucide&&typeof window.lucide.createIcons==='function'){ lucideReady=true; }
bootIfReady();
setTimeout(function(){ if(!lucideReady){ lucideReady=true; bootIfReady(); } },5000);
</script>
