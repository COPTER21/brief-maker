/* ---------- rows ต่อ tab ---------- */
function gradeRows(){
  const q = state.filters.search.trim().toLowerCase();
  let rows = GRADES.filter(function(g){
    if(q && (g.code+' '+g.name+' '+g.family).toLowerCase().indexOf(q) < 0) return false;
    if(state.filters.status !== 'all' && gradeStatus(g) !== state.filters.status) return false;
    if(state.filters.scope !== 'all' && g.family !== state.filters.scope) return false;
    if(state.filters.view === 'active' && gradeStatus(g) !== 'active') return false;
    if(state.filters.view === 'scheduled' && !nextBand(g)) return false;
    if(state.filters.view === 'draft' && !draftBand(g)) return false;
    if(state.filters.view === 'inactive' && !g.archived) return false;
    return true;
  });
  const dir = state.sort.dir==='asc' ? 1 : -1, c = state.sort.col;
  rows.sort(function(a,b){
    const ba = bandAt(a, asOfDate()) || {}, bb = bandAt(b, asOfDate()) || {};
    let x, y;
    if(c==='min'){ x=ba.min||0; y=bb.min||0; }
    else if(c==='mid'){ x=ba.mid||0; y=bb.mid||0; }
    else if(c==='max'){ x=ba.max||0; y=bb.max||0; }
    else if(c==='status'){ x=ST[gradeStatus(a)].lb; y=ST[gradeStatus(b)].lb; }
    else if(c==='eff'){ x=ba.eff||''; y=bb.eff||''; }
    else if(c==='used'){ x=usedByGrade(a.code).length; y=usedByGrade(b.code).length; }
    else { x=a.order; y=b.order; }
    return (x>y?1:x<y?-1:0)*dir;
  });
  return rows;
}
function componentRows(){
  const q = state.filters.search.trim().toLowerCase();
  let rows = COMPONENTS.filter(function(c){
    if(q && (c.code+' '+c.name+' '+c.payrollCode).toLowerCase().indexOf(q) < 0) return false;
    if(state.filters.dir !== 'all' && c.dir !== state.filters.dir) return false;
    if(state.filters.status !== 'all' && c.status !== state.filters.status) return false;
    if(state.filters.view === 'earning' && c.dir !== 'รายได้') return false;
    if(state.filters.view === 'deduction' && c.dir !== 'รายหัก') return false;
    if(state.filters.view === 'band' && !c.inBand) return false;
    if(state.filters.view === 'inactive' && c.status !== 'inactive') return false;
    return true;
  });
  const dir = state.sort.dir==='asc' ? 1 : -1, c = state.sort.col;
  rows.sort(function(a,b){
    let x, y;
    if(c==='dir'){ x=a.dir; y=b.dir; }
    else if(c==='calc'){ x=a.calc; y=b.calc; }
    else if(c==='status'){ x=a.status; y=b.status; }
    else if(c==='used'){ x=usedByComponent(a.code).length; y=usedByComponent(b.code).length; }
    else { x=a.code; y=b.code; }
    return (x>y?1:x<y?-1:0)*dir;
  });
  return rows;
}
function rateRows(){
  const q = state.filters.search.trim().toLowerCase();
  let rows = EMPLOYEES.filter(function(e){ return e.id.indexOf('EMP-')===0; }).map(function(e){
    const list = recsOf(e.id).filter(function(r){ return r.state!=='cancelled'; });
    const cur = curRec(e.id);
    const nx = nextRec(e.id);
    const shown = cur || nx || (list.length ? list[list.length-1] : null);
    return { e:e, r:shown, cur:cur, nx:nx, n:recsOf(e.id).length };
  });
  rows = rows.filter(function(x){
    if(q && (x.e.name+' '+x.e.id+' '+x.e.dept+' '+(x.r?x.r.grade:'')).toLowerCase().indexOf(q) < 0) return false;
    if(state.filters.dept !== 'all' && x.e.dept !== state.filters.dept) return false;
    if(state.filters.grade !== 'all' && (!x.r || x.r.grade !== state.filters.grade)) return false;
    if(state.filters.view === 'unassigned' && x.r) return false;
    if(state.filters.view === 'outband' && (!x.r || !outOfBand(x.r))) return false;
    if(state.filters.view === 'scheduled' && !x.nx) return false;
    if(state.filters.view === 'assigned' && !x.r) return false;
    return true;
  });
  const dir = state.sort.dir==='asc' ? 1 : -1, c = state.sort.col;
  rows.sort(function(a,b){
    let x, y;
    if(c==='grade'){ x=(a.r||{}).grade||'ZZ'; y=(b.r||{}).grade||'ZZ'; }
    else if(c==='base'){ x=(a.r||{}).base||0; y=(b.r||{}).base||0; }
    else if(c==='compa'){ x=a.r?(compaRatio(a.r)||0):0; y=b.r?(compaRatio(b.r)||0):0; }
    else if(c==='eff'){ x=(a.r||{}).eff||''; y=(b.r||{}).eff||''; }
    else { x=a.e.name; y=b.e.name; }
    return (x>y?1:x<y?-1:0)*dir;
  });
  return rows;
}
function recurRows(){
  const q = state.filters.search.trim().toLowerCase();
  let rows = RECUR.filter(function(i){
    const c = comp(i.code) || {}, e = emp(i.emp);
    if(q && (e.name+' '+i.code+' '+(c.name||'')).toLowerCase().indexOf(q) < 0) return false;
    if(state.filters.dir !== 'all' && (c.dir||'') !== state.filters.dir) return false;
    if(state.filters.dept !== 'all' && e.dept !== state.filters.dept) return false;
    if(state.filters.view !== 'all' && recurState(i) !== state.filters.view) return false;
    return true;
  });
  const dir = state.sort.dir==='asc' ? 1 : -1, c = state.sort.col;
  rows.sort(function(a,b){
    let x, y;
    if(c==='comp'){ x=a.code; y=b.code; }
    else if(c==='amount'){ x=recurAmount(a)||0; y=recurAmount(b)||0; }
    else if(c==='from'){ x=a.from; y=b.from; }
    else if(c==='status'){ x=recurState(a); y=recurState(b); }
    else { x=emp(a.emp).name; y=emp(b.emp).name; }
    return (x>y?1:x<y?-1:0)*dir;
  });
  return rows;
}
function currentRows(){
  if(state.tab==='grade') return gradeRows();
  if(state.tab==='component') return componentRows();
  if(state.tab==='rate') return rateRows();
  if(state.tab==='recurring') return recurRows();
  return [];
}

    { k:'scheduled', lb:'รอมีผล',        ic:'clock-4',        n:RECUR.filter(function(i){ return recurState(i)==='scheduled'; }).length },
    { k:'ended',     lb:'สิ้นสุดแล้ว',    ic:'flag',           n:RECUR.filter(function(i){ return recurState(i)==='ended'; }).length },
    { k:'cancelled', lb:'ถอนแล้ว',       ic:'ban',            n:RECUR.filter(function(i){ return recurState(i)==='cancelled'; }).length }

}

  return EMPLOYEES.filter(function(e){ return e.id.indexOf('EMP-')===0; }).map(function(e){

function bandBarHTML(r){
  const b = bandOf(r.grade, r.eff > asOfDate() ? r.eff : asOfDate());
  if(!b) return '<span class="cell-main text-mute-2">—</span>';
  const p = rangePen(r), oo = outOfBand(r);
  const clamp = Math.max(0, Math.min(1, p == null ? 0 : p));
  const cls = oo==='low' ? ' is-low' : (oo==='high' ? ' is-out' : '');
  const pct = Math.round((p==null?0:p)*100);
  return '<span class="bandwrap"><span class="bandbar'+cls+'">'
    + '<span class="mid" style="left:50%"></span>'
    + '<span class="pos" style="left:'+(clamp*100).toFixed(1)+'%"></span></span>'
    + '<span class="cr">'+pct+'%</span></span>';
}
function cellGrade(g, k){
  const b = bandAt(g, asOfDate()), nb = nextBand(g), used = usedByGrade(g.code);
  if(k==='name') return '<span class="tbl-item"><span class="ti-ico"><i data-lucide="layers" class="w-3.5 h-3.5"></i></span>'
    + '<span class="ti-main"><span class="ti-name" title="'+esc(g.name)+'">'+esc(g.name)+'</span>'
    + '<span class="ti-code">'+esc(g.code)+' · '+esc(g.family)+'</span></span></span>';
  if(k==='min') return b ? '<span class="cell-main ver-val">'+fmtMoney(b.min,0)+'</span>' : '<span class="cell-main text-mute-2">—</span>';
  if(k==='mid') return b ? '<span class="cell-main ver-val">'+fmtMoney(b.mid,0)+'</span>' : '<span class="cell-main text-mute-2">—</span>';
  if(k==='max') return b ? '<span class="cell-main ver-val">'+fmtMoney(b.max,0)+'</span>' : '<span class="cell-main text-mute-2">—</span>';
  if(k==='status') return pill(gradeStatus(g));
  if(k==='eff') return '<span class="cell-main ver-val">'+(b?be(b.eff):'—')+'</span>'
    + (nb?'<span class="cell-sub">ถัดไป '+be(nb.eff)+'</span>':'');
  if(k==='used') return '<span class="cell-main num">'+used.length+'</span>';
  if(k==='act'){
    const dis = canEdit() ? '' : ' is-disabled';
    let h = '<div class="row-actions">';
    if(!g.archived) h += '<button class="ra-btn'+dis+'" title="สร้างเวอร์ชันใหม่ของกระบอก" onclick="event.stopPropagation();openGradeEdit(\''+g.id+'\')"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>';
    if(nb && !g.archived) h += '<button class="ra-btn'+dis+'" title="ถอนเวอร์ชันที่รอมีผล" onclick="event.stopPropagation();askWithdrawBand(\''+g.id+'\')"><i data-lucide="calendar-x" class="w-3.5 h-3.5"></i></button>';
    if(g.archived) h += '<button class="ra-btn'+dis+'" title="เปิดใช้ระดับกลับ" onclick="event.stopPropagation();askReactivateGrade(\''+g.id+'\')"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i></button>';
    else h += '<button class="ra-btn is-danger'+dis+'" title="ปิดใช้ระดับ" onclick="event.stopPropagation();askDeactivateGrade(\''+g.id+'\')"><i data-lucide="archive" class="w-3.5 h-3.5"></i></button>';
    return h + '</div>';
  }
  return '';
}
function cellComponent(c, k){
  if(k==='name') return '<span class="tbl-item"><span class="ti-ico"><i data-lucide="'+(c.dir==='รายหัก'?'minus-circle':'plus-circle')+'" class="w-3.5 h-3.5"></i></span>'
    + '<span class="ti-main"><span class="ti-name" title="'+esc(c.name)+'">'+esc(c.name)+'</span>'
    + '<span class="ti-code">'+esc(c.code)+'</span></span></span>';
  if(k==='dir') return '<span class="cell-main">'+esc(c.dir)+'</span>';
  if(k==='calc') return '<span class="cell-main">'+esc(c.calc)+'</span>'
    + (c.baseRef?'<span class="cell-sub">'+c.pct+'% ของ '+esc(c.baseRef)+'</span>':'');
  if(k==='pay') return '<span class="cell-main ver-val">'+esc(c.payrollCode)+'</span>';
  if(k==='band') return '<span class="cell-main">'+(c.inBand?'เข้าฐาน':'ไม่เข้าฐาน')+'</span>';
  if(k==='status') return pill(c.status==='inactive'?'inactive':(c.status==='draft'?'draft':'active'));
  if(k==='used') return '<span class="cell-main num">'+usedByComponent(c.code).length+'</span>';
  if(k==='act'){
    const dis = canEdit() ? '' : ' is-disabled';
    let h = '<div class="row-actions">';
    h += '<button class="ra-btn'+dis+'" title="แก้ไของค์ประกอบ" onclick="event.stopPropagation();openCompEdit(\''+c.id+'\')"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>';
    if(c.status==='inactive') h += '<button class="ra-btn'+dis+'" title="เปิดใช้กลับ" onclick="event.stopPropagation();askReactivateComp(\''+c.id+'\')"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i></button>';
    else h += '<button class="ra-btn is-danger'+dis+'" title="ปิดใช้องค์ประกอบ" onclick="event.stopPropagation();askDeactivateComp(\''+c.id+'\')"><i data-lucide="archive" class="w-3.5 h-3.5"></i></button>';
    return h + '</div>';
  }
  return '';
}
function cellRate(x, k){
  const r = x.r;
  if(k==='person') return personCell(x.e.id, r?r.nameSnap:null);
  if(k==='grade') return r ? '<span class="cell-main ver-val">'+esc(r.grade)+' · '+esc((grade(r.grade)||{}).name||'')+'</span>'
                           : '<span class="cell-main text-mute-2">—</span>';
  if(k==='base') return r ? money(r.base, x.e.id) : '<span class="amt">—</span>';
  if(k==='pen') return r ? (seeAmount(x.e.id) ? bandBarHTML(r) : '<span class="cell-main text-mute-2">ปิดบัง</span>') : '<span class="cell-main text-mute-2">—</span>';
  if(k==='compa'){
    if(!r) return '<span class="amt">—</span>';
    if(!seeAmount(x.e.id)) return '<span class="msk">••••</span>';
    const c = compaRatio(r);
    return '<span class="amt">'+(c==null?'—':c.toFixed(2))+'</span>';
  }
  if(k==='status'){
    if(!r) return pill('unassigned');
    return pill(recState(r));
  }
  if(k==='eff') return r ? '<span class="cell-main ver-val">'+be(r.eff)+'</span>'
    : '<span class="cell-main text-mute-2">—</span>';
  if(k==='act'){
    const dis = canEdit() ? '' : ' is-disabled';
    let h = '<div class="row-actions">';
    h += '<button class="ra-btn'+dis+'" title="'+(r?'บันทึกอัตราใหม่':'ผูกอัตราให้พนักงาน')+'" onclick="event.stopPropagation();openRateCreate(\''+x.e.id+'\')"><i data-lucide="'+(r?'pencil':'plus')+'" class="w-3.5 h-3.5"></i></button>';
    if(x.nx) h += '<button class="ra-btn'+dis+'" title="ถอนอัตราที่รอมีผล" onclick="event.stopPropagation();askWithdrawRate(\''+x.nx.id+'\')"><i data-lucide="calendar-x" class="w-3.5 h-3.5"></i></button>';
    if(r && recState(r)==='current') h += '<button class="ra-btn is-danger'+dis+'" title="ปิดช่วงอัตราเมื่อพ้นสภาพ" onclick="event.stopPropagation();askEndRate(\''+r.id+'\')"><i data-lucide="user-minus" class="w-3.5 h-3.5"></i></button>';
    return h + '</div>';
  }
  return '';
}
function cellRecur(i, k){
  const c = comp(i.code) || { name:i.code, dir:'—' };
  if(k==='person') return personCell(i.emp, null);
  if(k==='comp') return '<span class="tbl-item"><span class="ti-ico"><i data-lucide="'+(c.dir==='รายหัก'?'minus-circle':'plus-circle')+'" class="w-3.5 h-3.5"></i></span>'
    + '<span class="ti-main"><span class="ti-name">'+esc(c.name)+'</span><span class="ti-code">'+esc(i.code)+'</span></span></span>';
  if(k==='dir') return '<span class="cell-main">'+esc(c.dir)+'</span>';
  if(k==='amount') return money(recurAmount(i), i.emp) + (i.percent!=null?'<span class="cell-sub">'+i.percent+'% ของเงินเดือนฐาน</span>':'');
  if(k==='range') return '<span class="cell-main ver-val">'+be(i.from)+'</span><span class="cell-sub">ถึง '+(i.to?be(i.to):'ไม่กำหนด')+'</span>';
  if(k==='goal'){
    if(i.goal == null) return '<span class="cell-main text-mute-2">—</span>';
    if(!seeAmount(i.emp)) return '<span class="msk">••••</span>';
    const p = Math.max(0, Math.min(1, i.accrued/i.goal));
    return '<span class="bandwrap"><span class="goal"><i style="right:'+(100-p*100).toFixed(0)+'%"></i></span>'
      + '<span class="cr">'+fmtMoney(i.accrued,0)+' / '+fmtMoney(i.goal,0)+'</span></span>';
  }
  if(k==='status') return pill(recurState(i));
  if(k==='act'){
    const dis = canEdit() ? '' : ' is-disabled';
    let h = '<div class="row-actions">';
    h += '<button class="ra-btn'+dis+'" title="แก้ไขรายการประจำ" onclick="event.stopPropagation();openRecurEdit(\''+i.id+'\')"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>';
    if(recurState(i)==='scheduled' || recurState(i)==='active')
      h += '<button class="ra-btn is-danger'+dis+'" title="ถอนรายการ" onclick="event.stopPropagation();askWithdrawRecur(\''+i.id+'\')"><i data-lucide="ban" class="w-3.5 h-3.5"></i></button>';
    return h + '</div>';
  }
  return '';
}
function cellHTML(row, k){
  if(state.tab==='grade') return cellGrade(row, k);
  if(state.tab==='component') return cellComponent(row, k);
  if(state.tab==='rate') return cellRate(row, k);
  return cellRecur(row, k);
}
function rowClick(row){
  if(state.tab==='grade') return 'openGradeView(\''+row.id+'\')';
  if(state.tab==='component') return 'openCompView(\''+row.id+'\')';
  if(state.tab==='rate') return 'openRateView(\''+row.e.id+'\')';
  return 'openRecurView(\''+row.id+'\')';
}

<script>

  } else {

      [['all','ทุกประเภท'],['รายได้','รายได้'],['รายหัก','รายหัก']]);

function tableHTML(view, cols){
  let h = '<div class="table-wrap"><table class="table"><thead><tr>' + cols.map(function(c){
      const on = state.sort.col === c.k;
      const arrow = c.s ? ' <span class="sort-arrow">'+(on ? (state.sort.dir==='asc'?'↑':'↓') : '↕')+'</span>' : '';
      const tip = c.tip ? '<span class="tip" data-tip="'+esc(c.tip)+'"><i data-lucide="info" class="w-3 h-3"></i></span>' : '';
      const cls = (c.s?'is-sortable ':'') + (on?'is-sorted ':'') + (c.right?'tar':'');
      return '<th class="'+cls.trim()+'"'+(c.s?' onclick="sortBy(\''+c.k+'\')"':'')+'>'+esc(c.lb)+tip+arrow+'</th>';
    }).join('') + '</tr></thead><tbody>';
  if(!view.length){
    h += '<tr><td colspan="'+cols.length+'">' + emptyFor() + '</td></tr>';
  } else {
    h += view.map(function(row){
      const bad = (state.tab==='rate' && row.r && outOfBand(row.r)) ? ' row-bad' : '';
      return '<tr class="is-clickable'+bad+'" onclick="'+rowClick(row)+'">' + cols.map(function(c){

}
function renderPage(){
  let total, body;
  if(state.tab==='usage'){
    total = CONSUMERS.length;
    body = usagePage();
  } else {
    const rows = currentRows();
    total = rows.length;
    const ps = state.pagination.pageSize;
    const maxPage = Math.max(1, Math.ceil(total/ps));
    if(state.pagination.page > maxPage) state.pagination.page = maxPage;
    const pg = state.pagination.page;
    const view = rows.slice((pg-1)*ps, pg*ps);
    const cols = COLS();
    const from = total ? (pg-1)*ps + 1 : 0, to = Math.min(total, pg*ps);
    body = '<div class="card list-card">' + filterRow() + tableHTML(view, cols)
      + '<div class="table-foot"><div class="pagination">'
      + '<button class="pg-btn '+(pg<=1?'is-disabled':'')+'" onclick="goPage('+(pg-1)+')"><i data-lucide="chevron-left" class="w-3 h-3"></i></button>'
      + Array.from({length:maxPage}, function(_,i){ return '<button class="pg-btn '+(pg===i+1?'is-active':'')+'" onclick="goPage('+(i+1)+')">'+(i+1)+'</button>'; }).join('')
      + '<button class="pg-btn '+(pg>=maxPage?'is-disabled':'')+'" onclick="goPage('+(pg+1)+')"><i data-lucide="chevron-right" class="w-3 h-3"></i></button>'
      + '</div><div>แสดง '+from+'–'+to+' จาก '+fmtNumber(total,0)+' รายการ</div></div></div>';
  }
  let h = '<div class="page-fill">' + pageHead(total) + tabsBar();
  if(state.asOf) h += '<div class="dt-band"><i data-lucide="history" class="w-4 h-4"></i>'
    + '<span>กำลังดูค่าที่มีผล ณ '+be(state.asOf)+'</span>'
    + '<button class="btn btn-ghost btn-sm mla" onclick="setAsOf(\'\')"><span>กลับมาวันนี้</span></button></div>';
  if(state.tab !== 'usage') h += statCards();
  h += body + '</div>';
  return h;
}
function toggleLink(code){
  const c = CONSUMERS.find(function(x){ return x.code===code; });
  if(!c) return;
  c.linked = !c.linked;
  render();
  showToast(c.linked ? 'ตั้งสถานะเชื่อมกับ '+c.name+' เองแล้ว' : 'ยกเลิกสถานะเชื่อมกับ '+c.name+' แล้ว', 'success');
}
function refreshCfg(){
  state.cacheAt = new Date().toISOString().slice(0,16);
  render();
  showToast('ล้างค่าที่ดึงไว้และถามค่าจากตั้งค่า HR ใหม่แล้ว · งวดที่ปิดถูกกันวันมีผลทันที', 'success');
}
function registerUsage(){
  if(!canEdit()) return showToast('บทบาทนี้ดูได้อย่างเดียว', 'warning');
  logAudit('ลงทะเบียนการใช้งานค่านโยบาย', 'ตั้งค่า HR · '+HRCFG.items.length+' ค่า');
  render();
  showToast('ลงทะเบียนการใช้งานค่านโยบายกับตั้งค่า HR แล้ว', 'success');
}

<script>
/* ===== VIEW DRAWER (Pattern C · rule 38.2 has-tabs · rule 72 identity header) ===== */
function KV(k, v, tip){
  return '<div><div class="kv-k">'+esc(k)+(tip?'<span class="tip" data-tip="'+esc(tip)+'"><i data-lucide="info" class="w-3 h-3"></i></span>':'')+'</div>'
       + '<div class="kv-v">'+(v==null||v===''?'—':v)+'</div></div>';
}
function SEC(icon, title, body, right){
  return '<div class="sec"><div class="sec-h"><i data-lucide="'+icon+'" class="w-4 h-4"></i><span>'+esc(title)+'</span>'
       + (right?'<span class="sec-r">'+right+'</span>':'') + '</div>'+body+'</div>';
}
function dwTabs(list){
  return '<div class="tabs">' + list.map(function(t){
      return '<button class="tab '+(state.drawer.tab===t.k?'is-active':'')+'" onclick="setDrawerTab(\''+t.k+'\')">'
        + '<i data-lucide="'+t.ic+'" class="w-3.5 h-3.5"></i><span>'+t.lb+'</span>'
        + (t.n!=null?'<span class="tab-badge">'+t.n+'</span>':'') + '</button>';
    }).join('') + '</div>';
}
function setDrawerTab(k){ state.drawer.tab = k; render(); }
function bandFullHTML(b, val){
  if(!b) return '<div class="hint-inline">ยังไม่มีกระบอกที่มีผล ณ วันที่นี้</div>';
  const span = Math.max(1, b.max - b.min);
  const p = val == null ? null : Math.max(0, Math.min(1, (val - b.min)/span));
  const oo = val == null ? null : (val < b.min ? 'low' : (val > b.max ? 'high' : null));
  const cls = oo==='low' ? ' is-low' : (oo==='high' ? ' is-out' : '');
  return '<div class="bandfull'+cls+'">'
    + '<span class="mid" style="left:50%"></span>'
    + (p==null ? '' : '<span class="pos" style="left:'+(p*100).toFixed(1)+'%"></span>')
    + '<span class="l">ขั้นต่ำ '+fmtMoney(b.min,0)+'</span>'
    + '<span class="c">ค่ากลาง '+fmtMoney(b.mid,0)+'</span>'
    + '<span class="r">ขั้นสูง '+fmtMoney(b.max,0)+'</span></div>';
}
function legalRow(amount){
  const lm = legalMin();
  if(lm.status !== 'active' || lm.value == null)
    return KV('ค่าแรงขั้นต่ำตามกฎหมาย', 'ยังไม่ได้ตั้งค่าที่ตั้งค่า HR', 'ค่านี้อ่านจากตั้งค่า HR เท่านั้น ไม่เก็บไว้ที่นี่');
  return KV('ค่าแรงขั้นต่ำตามกฎหมาย', fmtMoney(lm.value,2)+' · เวอร์ชัน '+esc(lm.version)
    + (belowLegal(amount) ? ' <span class="pill pill-danger">ต่ำกว่าขั้นต่ำ</span>' : ''),
    'อ่านจากตั้งค่า HR ตามวันมีผล ไม่มีตัวเลขเก็บไว้ในหน้านี้');
}

      + KV('ยอดสะสม', i.goal==null?'—':(masked?'<span class="msk">••••••</span>':'<span class="amt">'+fmtMoney(i.accrued,2)+'</span>'), 'ยอดสะสมมาจากระบบเงินเดือน รอบนี้เป็นข้อมูลตัวอย่าง')
      + KV('รหัสส่งจ่ายเงิน', '<span class="ver-val">'+esc(c.payrollCode||'—')+'</span>', PAYCODE_TIP)
      + KV('เหตุผล', esc(i.reason))
      + '</div>');
  }
  if(state.drawer.tab==='usage'){
    h += SEC('user','พนักงานที่ผูกรายการนี้',
      '<div class="lk-row">'+personCell(i.emp, null)
      + '<div class="bar-right"><button class="btn btn-ghost btn-sm" onclick="openRateView(\''+i.emp+'\')"><span>ดูอัตราค่าจ้าง</span></button></div></div>');
  }
  h += '</div><div class="drawer-footer"><span class="drawer-footer-meta">บันทึกล่าสุด '+fmtDateTime(i.at)+'</span>'
     + '<span class="footer-spacer"></span><button class="btn btn-secondary" onclick="closeDrawer()"><span>ปิด</span></button></div>';
  return h;
}

<script>
/* ===== CREATE / EDIT DRAWER (Pattern B · wizard 3 steps · rule 47 stepper kit) ===== */
const STEPS = {
  grade:     ['ข้อมูลระดับ','กระบอกเงินเดือน','ตรวจสอบและยืนยัน'],
  component: ['ข้อมูลองค์ประกอบ','วิธีคิดและสะพานจ่ายเงิน','ตรวจสอบและยืนยัน'],
  rate:      ['เลือกพนักงาน','อัตราและวันมีผล','ตรวจสอบและยืนยัน'],
  recurring: ['พนักงานและองค์ประกอบ','จำนวนและช่วงเวลา','ตรวจสอบและยืนยัน']
};
function steps(){ return STEPS[state.drawer.kind] || STEPS.grade; }
function setF(k, val, re){
  const f = state.drawer.form; f[k] = val;
  delete state.drawer.err[k];
  if(re) render();
}
function FLD(cfg){
  const f = state.drawer.form, val = f[cfg.k], err = state.drawer.err[cfg.k];
  const w = cfg.w==='full' ? ' class="field span2"' : ' class="field"';
  const ro = cfg.ro ? ' disabled' : '';
  const on = 'onchange="setF(\''+cfg.k+'\', this.value, '+(cfg.re?'true':'false')+')"';
  const onIn = 'oninput="setF(\''+cfg.k+'\', this.value, false)"';
  let inp = '';
  if(cfg.t==='select'){
    inp = '<select class="select'+(cfg.ro?' ro':'')+'" name="'+cfg.k+'"'+ro+' '+on+'>'
        + (cfg.ph?'<option value="">'+esc(cfg.ph)+'</option>':'')
        + cfg.opts.map(function(o){ return '<option value="'+esc(o)+'"'+(String(val)===String(o)?' selected':'')+'>'+esc(o)+'</option>'; }).join('')
        + '</select>';
  } else if(cfg.t==='textarea'){
    inp = '<textarea class="input ta-auto" name="'+cfg.k+'" rows="2" placeholder="'+esc(cfg.ph||'')+'" '+onIn+'>'+esc(val||'')+'</textarea>';
  } else if(cfg.t==='check'){
    return '<div'+w+'><label class="sw '+(val?'on':'')+(cfg.ro?' is-ro':'')+'" onclick="'+(cfg.ro?'':'setF(\''+cfg.k+'\','+(!val)+',true)')+'">'
      + '<span class="sw-box"></span><span>'+esc(cfg.lb)+'</span>'
      + (cfg.tip?'<span class="tip" data-tip="'+esc(cfg.tip)+'"><i data-lucide="info" class="w-3 h-3"></i></span>':'')
      + '</label>'+(cfg.hint?'<div class="hint-inline">'+esc(cfg.hint)+'</div>':'')+'</div>';
  } else {
    const type = cfg.t==='num' ? 'number' : (cfg.t==='date' ? 'date' : 'text');
    inp = '<input class="input'+(cfg.ro?' ro':'')+'" type="'+type+'" name="'+cfg.k+'" value="'+esc(val==null?'':val)+'" placeholder="'+esc(cfg.ph||'')+'"'+ro+' '+onIn+(cfg.t==='date'?' '+on:'')+'>';
  }
  return '<div'+w+'><label class="field-label">'+esc(cfg.lb)+(cfg.req?'<span class="req">*</span>':'')
    + (cfg.tip?'<span class="tip" data-tip="'+esc(cfg.tip)+'"><i data-lucide="info" class="w-3 h-3"></i></span>':'')+'</label>'
    + inp + (cfg.hint?'<div class="hint-inline">'+esc(cfg.hint)+'</div>':'')
    + (err?'<div class="field-error on">'+esc(err)+'</div>':'') + '</div>';
}
function COMBO(key, lb, req, tip, err){
  return '<div class="field"><label class="field-label">'+esc(lb)+(req?'<span class="req">*</span>':'')
    + (tip?'<span class="tip" data-tip="'+esc(tip)+'"><i data-lucide="info" class="w-3 h-3"></i></span>':'')+'</label>'
    + searchSelectHTML(key, { placeholder:'พิมพ์เพื่อค้นหา' })
    + (err?'<div class="field-error on">'+esc(err)+'</div>':'') + '</div>';
}
function errNote(){
  const ks = Object.keys(state.drawer.err);
  if(!ks.length) return '';
  return '<div class="note note-danger"><i data-lucide="alert-octagon" class="w-4 h-4"></i><div>'
    + ks.map(function(k){ return esc(state.drawer.err[k]); }).join('<br>') + '</div></div>';
}
function stepBand(){
  const s = state.drawer.step, list = steps();
  let h = '<div class="drawer-stepper-band"><div class="stepper-row">';
  list.forEach(function(lb, i){
    const n = i+1;
    if(i) h += '<span class="step-line '+(s>n-1?'is-done':'')+'"></span>';
    h += '<span class="step-dot '+(s===n?'is-active':(s>n?'is-done':''))+'" onclick="gotoStep('+n+')">'+n+'</span>';
  });
  return h + '</div></div>';
}
function cycleOf(code, ref){
  const seen = [code];
  let cur = ref, guard = 0;
  while(cur && guard++ < 12){
    seen.push(cur);
    if(cur === code) return seen;
    const c = comp(cur);
    cur = c ? (state.drawer.form && state.drawer.form.kindCode===cur ? state.drawer.form.baseRef : c.baseRef) : null;
  }
  return null;
}

}

}
function closeDrawer(){
  const b = document.getElementById('drawerBackdrop'), d = document.getElementById('drawer');
  if(b) b.classList.remove('is-open'); if(d) d.classList.remove('is-open');

    state.drawer = { open:false, mode:null, kind:null, recordId:null, step:1, tab:'detail', form:null, err:{}, busy:false };

}

  if(n > state.drawer.step && !validateStep(state.drawer.step)){ render(); showToast('ยังกรอกไม่ครบ ตรวจข้อความสีแดง','error'); return; }
  state.drawer.step = Math.min(steps().length, Math.max(1, n));

<script>
/* ===== STEP CONTENT ===== */
function outBandPreview(){
  const f = state.drawer.form;
  if(!f.grade || !f.base) return null;
  const b = bandOf(f.grade, f.eff || asOfDate());
  if(!b) return null;
  const x = Math.round(Number(f.base) / (Number(f.fte)||1));
  if(x < b.min) return { dir:'low', b:b, x:x };
  if(x > b.max) return { dir:'high', b:b, x:x };
  return null;
}
function stepFields(){
  const f = state.drawer.form, s = state.drawer.step, k = state.drawer.kind;

    if(s===1) return SEC('tag','ชื่อและรหัสของระดับ', '<div class="grid2">'

              + '<button class="btn btn-secondary btn-sm note-act" onclick="openHrConfig(\'legal_minimum\')"><span>ดูค่าที่ตั้งค่า HR</span></button></div>' : ''))
        + SEC('calendar-check','วันมีผลและเหตุผล', '<div class="grid2">'
          + FLD({ k:'eff', lb:'วันมีผล', t:'date', req:true, re:true, hint:'ตั้งย้อนเข้างวดที่ปิดแล้วไม่ได้ · เร็วที่สุด '+be(earliestAllowed()) })

        + FLD({ k:'note', lb:'หมายเหตุ', t:'textarea', w:'full' })
        + '</div>');
    if(s===2) return SEC('calculator','วิธีคิด', '<div class="grid2">'

function applyPct(){
  const f = state.drawer.form;
  const g = GRADES.find(function(x){ return x.id===state.drawer.recordId; });
  const cur = g ? bandAt(g, asOfDate()) : null;
  const p = Number(f.adjPct);
  if(!cur) return showToast('ยังไม่มีเวอร์ชันปัจจุบันให้คัดลอก','warning');
  if(isNaN(p) || p === 0) return showToast('กรอกเปอร์เซ็นต์ที่จะปรับก่อน','warning');
  f.min = Math.round(cur.min*(100+p)/10000)*100;
  f.mid = Math.round(cur.mid*(100+p)/10000)*100;
  f.max = Math.round(cur.max*(100+p)/10000)*100;
  delete state.drawer.err.min; delete state.drawer.err.mid; delete state.drawer.err.max;
  render();
  showToast('คัดลอกค่าเดิมแล้วปรับ '+p+'% · ตรวจตารางเทียบก่อนประกาศได้','success');
}

/* ===== VALIDATION ===== */
function validateStep(s){
  const f = state.drawer.form, k = state.drawer.kind, e = {};
  if(k==='grade'){
    if(s===1){
      if(!String(f.name||'').trim()) e.name = 'กรอกชื่อระดับ';
      if(!String(f.code||'').trim()) e.code = 'กรอกรหัสระดับ';
      else if(!/^[A-Z0-9-]+$/.test(f.code)) e.code = 'รหัสระดับใช้ได้เฉพาะตัวพิมพ์ใหญ่ ตัวเลข และเครื่องหมาย -';
      else if(state.drawer.mode==='create' && GRADES.some(function(g){ return g.code===f.code; })) e.code = 'รหัสระดับนี้มีอยู่แล้ว';
      if(!(Number(f.order) > 0)) e.order = 'ลำดับชั้นต้องมากกว่า 0';
      else if(GRADES.some(function(g){ return g.order===Number(f.order) && g.code!==f.code; })) e.order = 'ลำดับชั้นนี้ซ้ำกับระดับอื่น';
      if(f.scope==='เฉพาะบริษัท' && !f.companyId) e.companyId = 'เลือกบริษัทอย่างน้อย 1 บริษัท';
    }
    if(s===2){
      const mn = Number(f.min), md = Number(f.mid), mx = Number(f.max);
      if(!(mn > 0)) e.min = 'ขั้นต่ำต้องมากกว่า 0';
      if(!(md > 0)) e.mid = 'ค่ากลางต้องมากกว่า 0';
      if(!(mx > 0)) e.max = 'ขั้นสูงต้องมากกว่า 0';
      if(mn && md && mn >= md) e.mid = 'ค่ากลางต้องมากกว่าขั้นต่ำ';
      if(md && mx && md >= mx) e.max = 'ขั้นสูงต้องมากกว่าค่ากลาง';
      if(!f.eff) e.eff = 'เลือกวันมีผล';
      else {
        const cp = closedPeriodOf(f.eff);
        if(cp) e.eff = 'งวด '+cp.no+' ปิดแล้ว ตั้งวันมีผลได้ตั้งแต่ '+be(earliestAllowed());
        else {
          const g = GRADES.find(function(x){ return x.id===state.drawer.recordId; });
          if(g && g.versions.some(function(v){ return v.eff===f.eff && v.state!=='draft' && v.state!=='cancelled'; }))
            e.eff = 'ช่วงวันมีผลทับกับเวอร์ชันเดิมของระดับนี้ที่มีผลวันเดียวกัน';
        }
      }
      if(!String(f.set||'').trim()) e.set = 'กรอกชื่อชุดโครง';
      if(String(f.reason||'').trim().length < 10) e.reason = 'กรอกเหตุผลการเปลี่ยนอย่างน้อย 10 ตัวอักษร';
    }
  }
  if(k==='component'){
    if(s===1){
      if(!String(f.code||'').trim()) e.code = 'กรอกรหัสองค์ประกอบ';
      else if(!/^[A-Z0-9-]+$/.test(f.code)) e.code = 'รหัสใช้ได้เฉพาะตัวพิมพ์ใหญ่ ตัวเลข และเครื่องหมาย -';
      else if(state.drawer.mode==='create' && COMPONENTS.some(function(c){ return c.code===f.code; })) e.code = 'รหัสองค์ประกอบนี้มีอยู่แล้ว';
      if(!String(f.name||'').trim()) e.name = 'กรอกชื่อองค์ประกอบ';
    }
    if(s===2){
      if(f.calc==='% ของ component อื่น'){
        if(!f.baseRef) e.baseRef = 'เลือกองค์ประกอบที่ใช้เป็นฐาน';
        else if(f.baseRef === f.code) e.baseRef = 'อ้างตัวเองไม่ได้';
        else { const cyc = cycleOf(f.code, f.baseRef); if(cyc) e.baseRef = 'การอ้างอิงวนกลับมาที่ตัวเอง: '+cyc.join(' → '); }
        if(!(Number(f.pct) > 0)) e.pct = 'กรอกเปอร์เซ็นต์มากกว่า 0';
      }
      if(!String(f.payrollCode||'').trim()) e.payrollCode = 'กรอกรหัสส่งจ่ายเงิน';
      if(!f.eff) e.eff = 'เลือกวันมีผล';
    }
  }
  if(k==='rate'){
    if(s===1 && !f.emp) e.emp = 'เลือกพนักงาน';
    if(s===2){
      if(!f.grade) e.grade = 'เลือกระดับ';
      else if((grade(f.grade)||{}).archived) e.grade = 'ระดับนี้ปิดใช้แล้ว เลือกระดับอื่น';
      if(!(Number(f.base) > 0)) e.base = 'เงินเดือนฐานต้องมากกว่า 0';
      const fte = Number(f.fte);
      if(!(fte >= 0.01 && fte <= 1)) e.fte = 'สัดส่วนเวลาทำงานต้องอยู่ระหว่าง 0.01 ถึง 1.00';
      if(!f.eff) e.eff = 'เลือกวันมีผล';
      else {
        const cp = closedPeriodOf(f.eff);
        if(cp) e.eff = 'งวด '+cp.no+' ปิดแล้ว ตั้งวันมีผลได้ตั้งแต่ '+be(earliestAllowed());
        else if(recsOf(f.emp).some(function(r){ return r.eff===f.eff && r.state!=='cancelled'; }))
          e.eff = 'พนักงานคนนี้มีอัตราที่มีผลวันเดียวกันอยู่แล้ว ช่วงอัตราซ้อนกันไม่ได้';
      }
      if(!f.reasonCode) e.reasonCode = 'เลือกประเภทการเปลี่ยน';
      if(String(f.reason||'').trim().length < 10) e.reason = 'กรอกเหตุผลอย่างน้อย 10 ตัวอักษร';
      const ob = outBandPreview();
      if(ob && String(f.outReason||'').trim().length < 10) e.outReason = 'อัตราอยู่นอกกระบอก ต้องกรอกเหตุผลอย่างน้อย 10 ตัวอักษร';
      if(belowLegal(Number(f.base)) && String(f.legalReason||'').trim().length < 10)
        e.legalReason = 'ต่ำกว่าค่าแรงขั้นต่ำตามกฎหมาย ต้องกรอกเหตุผลอย่างน้อย 10 ตัวอักษร';
    }
  }
  if(k==='recurring'){
    if(s===1){
      if(!f.emp) e.emp = 'เลือกพนักงาน';
      if(!f.code) e.code = 'เลือกองค์ประกอบค่าจ้าง';
      else if((comp(f.code)||{}).status !== 'active') e.code = 'องค์ประกอบนี้ปิดใช้แล้ว เลือกตัวอื่น';
    }
    if(s===2){
      const c = comp(f.code) || {};
      if(c.calc === '% ของ component อื่น'){ if(!(Number(f.percent) > 0)) e.percent = 'กรอกเปอร์เซ็นต์มากกว่า 0'; }
      else if(!(Number(f.amount) > 0)) e.amount = 'กรอกจำนวนต่องวดมากกว่า 0';
      if(!f.from) e.from = 'เลือกวันเริ่มมีผล';
      else {
        const cp = closedPeriodOf(f.from);
        if(cp) e.from = 'งวด '+cp.no+' ปิดแล้ว ตั้งวันเริ่มมีผลได้ตั้งแต่ '+be(earliestAllowed());
      }
      if(f.to && f.from && f.to < f.from) e.to = 'วันสิ้นสุดต้องไม่น้อยกว่าวันเริ่มมีผล';
      const clash = RECUR.find(function(i){
        if(i.emp!==f.emp || i.code!==f.code || i.id===state.drawer.recordId || i.state==='cancelled') return false;
        const aFrom = f.from, aTo = f.to || '9999-12-31', bFrom = i.from, bTo = i.to || '9999-12-31';
        return aFrom <= bTo && bFrom <= aTo;
      });
      if(clash) e.from = 'ช่วงวันทับกับรายการเดิมของพนักงานคนนี้ ('+be(clash.from)+' – '+(clash.to?be(clash.to):'ไม่กำหนด')+')';
      if(String(f.reason||'').trim().length < 10) e.reason = 'กรอกเหตุผลอย่างน้อย 10 ตัวอักษร';
    }
  }
  state.drawer.err = e;
  return Object.keys(e).length === 0;
}

/* ===== SAVE ===== */
function submitForm(){
  if(state.drawer.busy) return;
  for(let i=1; i<steps().length; i++){
    if(!validateStep(i)){ state.drawer.step = i; render(); showToast('ยังกรอกไม่ครบ ตรวจข้อความสีแดง','error'); return; }
  }
  state.drawer.busy = true; render();
  setTimeout(doSave, 620);
}
function doSave(){
  const f = state.drawer.form, k = state.drawer.kind;
  if(k==='grade'){
    let g = GRADES.find(function(x){ return x.id===state.drawer.recordId; });
    if(!g){
      g = { id:'G'+(GRADES.length+1), code:f.code, name:f.name, order:Number(f.order), family:f.family,
        scope:f.scope==='เฉพาะบริษัท'?'company':'shared', companies:f.companyId?[f.companyId]:[],
        archived:false, currency:'THB', versions:[] };
      GRADES.push(g);
    } else {
      g.name = f.name; g.order = Number(f.order); g.family = f.family;
      g.scope = f.scope==='เฉพาะบริษัท'?'company':'shared'; g.companies = f.companyId?[f.companyId]:[];
      const d = draftBand(g); if(d) g.versions.splice(g.versions.indexOf(d), 1);
    }
    g.versions.push({ v:(lastBand(g)||{v:0}).v+1, set:f.set, eff:f.eff, state:'scheduled',
      min:Number(f.min), mid:Number(f.mid), max:Number(f.max), by:personaEmp(),
      at:new Date().toISOString().slice(0,16), reason:f.reason });
    logAudit('ประกาศเวอร์ชันกระบอก', g.code+' '+g.name+' · มีผล '+be(f.eff));
    finishSave('บันทึกแล้ว เวอร์ชันใหม่จะมีผลวันที่ '+be(f.eff));
    return;
  }
  if(k==='component'){
    let c = COMPONENTS.find(function(x){ return x.id===state.drawer.recordId; });
    const data = { code:f.code, name:f.name, dir:f.dir, calc:f.calc,
      baseRef:f.calc==='% ของ component อื่น'?f.baseRef:null, pct:f.calc==='% ของ component อื่น'?Number(f.pct):null,
      freq:f.freq, inBand:!!f.inBand, payrollCode:f.payrollCode, otBase:!!f.otBase, ssfBase:!!f.ssfBase,
      prorate:!!f.prorate, eff:f.eff, note:f.note, by:personaEmp(), at:new Date().toISOString().slice(0,16) };
    if(c) Object.assign(c, data, { status: c.status==='draft' ? 'active' : c.status });
    else COMPONENTS.push(Object.assign({ id:'K'+(COMPONENTS.length+1), status:'active' }, data));
    logAudit('บันทึกองค์ประกอบค่าจ้าง', f.code+' '+f.name);
    finishSave('บันทึกองค์ประกอบค่าจ้างแล้ว');
    return;
  }
  if(k==='rate'){
    const prev = curRec(f.emp);
    if(prev && f.eff > prev.eff){ prev.effTo = addDays(f.eff, -1); if(f.eff <= TODAY) prev.state = 'history'; }
    SEQ += 1;
    RECORDS.push({ id:'R'+SEQ, emp:f.emp, nameSnap:emp(f.emp).name, grade:f.grade, base:Number(f.base),
      fte:Number(f.fte), currency:'THB', eff:f.eff, effTo:null, state: f.eff > TODAY ? 'scheduled' : 'current',
      reasonCode:f.reasonCode, reason:f.reason, movementNo:f.movementNo||null,
      outReason:f.outReason||null, legalReason:f.legalReason||null,
      by:personaEmp(), at:new Date().toISOString().slice(0,16) });
    logAudit('บันทึกอัตราค่าจ้างรายบุคคล', emp(f.emp).name+' ('+f.emp+')');
    finishSave('บันทึกแล้ว อัตราใหม่จะมีผลวันที่ '+be(f.eff));
    return;
  }
  const c = comp(f.code) || {};
  let it = RECUR.find(function(x){ return x.id===state.drawer.recordId; });
  const data = { emp:f.emp, code:f.code,
    amount: c.calc==='% ของ component อื่น' ? null : Number(f.amount),
    percent: c.calc==='% ของ component อื่น' ? Number(f.percent) : null,
    from:f.from, to:f.to||null, goal:f.goal===''||f.goal==null?null:Number(f.goal),
    reason:f.reason, by:personaEmp(), at:new Date().toISOString().slice(0,16) };
  if(it) Object.assign(it, data);
  else { SEQ += 1; RECUR.push(Object.assign({ id:'I'+SEQ, state:'scheduled', accrued:0 }, data)); }
  logAudit('บันทึกรายการประจำ', emp(f.emp).name+' · '+(c.name||f.code));
  finishSave('บันทึกรายการประจำแล้ว');
}
function finishSave(msg){
  state.drawer.busy = false;
  closeDrawer();
  showToast(msg, 'success');
}
</script>
<script>
/* ===== DIFF DRAWER (เทียบเวอร์ชัน · S-03 · FN-04) ===== */
state.diff = { a:'SS-2026', b:'SS-2027' };
function allSets(){
  const s = {};
  GRADES.forEach(function(g){ g.versions.forEach(function(v){ if(v.set) s[v.set]=1; }); });
  return Object.keys(s).sort();
}
function bandOfSet(g, set){ return g.versions.find(function(v){ return v.set===set; }) || null; }
function openDiff(){
  const sets = allSets();
  if(sets.length < 2) return showToast('ต้องมีอย่างน้อย 2 ชุดโครงจึงเทียบได้','warning');
  state.drawer = { open:true, mode:'view', kind:'diff', recordId:null, step:1, tab:'detail', form:null, err:{}, busy:false };
  openPanel();
}
function setDiff(k, v){ state.diff[k] = v; render(); }
function renderDiffDrawer(){
  const sets = allSets(), a = state.diff.a, b = state.diff.b;
  let rows = 0, sum = 0;
  const body = GRADES.map(function(g){
    const va = bandOfSet(g, a), vb = bandOfSet(g, b);
    if(!va && !vb) return '';
    rows++;
    const d = (va && vb) ? (vb.mid - va.mid) : null;
    if(d != null && va.mid) sum += d/va.mid;
    return '<tr><td>'+esc(g.code)+' · '+esc(g.name)+'</td>'
      + '<td class="ver-val">'+(va?fmtMoney(va.min,0)+' / '+fmtMoney(va.mid,0)+' / '+fmtMoney(va.max,0):'—')+'</td>'
      + '<td class="ver-val">'+(vb?fmtMoney(vb.min,0)+' / '+fmtMoney(vb.mid,0)+' / '+fmtMoney(vb.max,0):'—')+'</td>'
      + '<td class="ver-val">'+(d==null?'—':(d>0?'<span class="dl-up">+'+fmtMoney(d,0)+'</span>':(d<0?'<span class="dl-dn">−'+fmtMoney(-d,0)+'</span>':'0')))+'</td>'
      + '<td class="ver-val">'+(d==null||!va.mid?'—':((d/va.mid*100).toFixed(1)+'%'))+'</td></tr>';
  }).join('');
  let h = '<div class="drawer-header"><div class="dw-head-row"><div class="min0">'
    + '<div class="dw-eyebrow"><i data-lucide="git-compare" class="w-3.5 h-3.5"></i><span>เทียบชุดโครงเงินเดือน</span></div>'
    + '<div class="dw-title">ค่าเดิมเทียบค่าใหม่ ก่อนประกาศ</div>'
    + '<div class="dw-sub">'+esc(a)+' เทียบกับ '+esc(b)+' · '+rows+' ระดับ</div>'
    + '</div><div class="drawer-header-actions">'
    + '<button class="top-icon-btn" onclick="closeDrawer()"><i data-lucide="x" class="w-4 h-4"></i></button>'
    + '</div></div></div>';
  h += '<div class="drawer-body">'
    + SEC('sliders-horizontal','เลือกชุดที่จะเทียบ', '<div class="grid2">'
      + '<div class="field"><label class="field-label">ชุดตั้งต้น</label>'
      + '<select class="select" onchange="setDiff(\'a\',this.value)">'+sets.map(function(s){ return '<option value="'+esc(s)+'"'+(s===a?' selected':'')+'>'+esc(s)+'</option>'; }).join('')+'</select></div>'
      + '<div class="field"><label class="field-label">ชุดที่เทียบ</label>'
      + '<select class="select" onchange="setDiff(\'b\',this.value)">'+sets.map(function(s){ return '<option value="'+esc(s)+'"'+(s===b?' selected':'')+'>'+esc(s)+'</option>'; }).join('')+'</select></div>'
      + '</div>')
    + SEC('table','ค่าเดิม → ค่าใหม่ ต่อระดับ',
      '<div class="mini-wrap"><table class="mini-tbl"><thead><tr><th>ระดับ</th><th>'+esc(a)+' (ต่ำ / กลาง / สูง)</th><th>'+esc(b)+' (ต่ำ / กลาง / สูง)</th><th>ส่วนต่างค่ากลาง</th><th>เปลี่ยนแปลง</th></tr></thead><tbody>'
      + (rows ? body : '<tr><td colspan="5">ไม่มีระดับที่มีทั้งสองชุด</td></tr>')
      + '</tbody></table></div>',
      rows ? ('ค่ากลางเปลี่ยนเฉลี่ย '+(sum/rows*100).toFixed(1)+'%') : '')
    + '<div class="hint-inline"><span>ไม่แตะอัตราของพนักงาน</span></div>'
    + '</div>';
  h += '<div class="drawer-footer"><span class="drawer-footer-meta">อ่านอย่างเดียว</span>'
    + '<span class="footer-spacer"></span><button class="btn btn-secondary" onclick="closeDrawer()"><span>ปิด</span></button></div>';
  return h;
}

/* ===== MODALS (Pattern D · confirm ทุกครั้งที่ปิดใช้/ถอน · ไม่มีลบถาวร) ===== */
function askModal(type, data){
  if(!canEdit()) return showToast('บทบาทนี้ดูได้อย่างเดียว ไม่สามารถแก้ไขโครงเงินเดือนได้','warning');
  state.modal = { open:true, type:type, data:data, reason:'', err:'', busy:false };
  render();
  requestAnimationFrame(function(){ document.getElementById('modalBackdrop').classList.add('is-open'); });
}
function closeModal(){
  const b = document.getElementById('modalBackdrop'); if(b) b.classList.remove('is-open');
  setTimeout(function(){ state.modal = { open:false, type:null, data:null, reason:'', err:'', busy:false }; render(); }, 200);
}
function askWithdrawBand(id){ askModal('withdrawband', { id:id }); }
function askDeactivateGrade(id){ askModal('deactivategrade', { id:id }); }
function askReactivateGrade(id){ askModal('reactivategrade', { id:id }); }
function askDeactivateComp(id){ askModal('deactivatecomp', { id:id }); }
function askReactivateComp(id){ askModal('reactivatecomp', { id:id }); }
function askWithdrawRate(id){ askModal('withdrawrate', { id:id }); }
function askEndRate(id){ askModal('endrate', { id:id }); }
function askWithdrawRecur(id){ askModal('withdrawrecur', { id:id }); }
function mReason(ph, lb){
  return '<div class="field"><label class="field-label">'+esc(lb||'เหตุผล')+'<span class="req">*</span></label>'
    + '<textarea class="input ta-auto" name="mreason" rows="2" placeholder="'+esc(ph)+'" oninput="state.modal.reason=this.value"></textarea>'
    + (state.modal.err?'<div class="field-error on">'+esc(state.modal.err)+'</div>':'')+'</div>';
}
function mHead(icon, cls, title, sub){
  return '<div class="modal-header"><div class="modal-header-icon '+cls+'"><i data-lucide="'+icon+'" class="w-5 h-5"></i></div>'
    + '<div><h3 class="modal-title">'+esc(title)+'</h3><p class="modal-subtitle">'+esc(sub)+'</p></div></div>';
}
function mFoot(cancelLb, btnCls, icon, lb, fn){
  return '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()"><span>'+esc(cancelLb)+'</span></button>'
    + '<button class="btn '+btnCls+' btn-eq" onclick="'+fn+'">'+(icon?'<i data-lucide="'+icon+'" class="w-4 h-4"></i>':'')+'<span>'+esc(lb)+'</span></button></div>';
}
function renderModal(){
  const m = state.modal; if(!m.open) return '';
  if(m.type==='withdrawband'){
    const g = GRADES.find(function(x){ return x.id===m.data.id; }), nb = g?nextBand(g):null;

  }
  if(m.type==='deactivategrade'){
    const g = GRADES.find(function(x){ return x.id===m.data.id; }); if(!g) return '';

          + users.slice(0,4).map(function(id){ return '<div class="wu-row">'+personCell(id,null)+'</div>'; }).join('')
        : '<div class="hint-inline">ยังไม่มีพนักงานอ้างระดับนี้</div>')
      + mReason('เช่น ยุบระดับตามโครงสร้างองค์กรใหม่')+'</div>'

  }
  if(m.type==='reactivategrade'){
    const g = GRADES.find(function(x){ return x.id===m.data.id; }); if(!g) return '';
    return mHead('rotate-ccw','','เปิดใช้ระดับ '+g.code+' กลับ', 'การเปิดใช้กลับต้องสร้างเวอร์ชันใหม่พร้อมวันมีผล เพื่อให้ย้อนดูได้ว่าเปิดกลับตั้งแต่วันไหน')
      + '<div class="modal-body"><div class="hint-inline">กดต่อไปเพื่อกรอกค่ากระบอกและวันมีผลของเวอร์ชันใหม่</div></div>'
      + mFoot('ยกเลิก','btn-primary','chevron-right','ต่อไป','doReactivateGrade()');

      + '<div class="modal-body">'
      + (users.length ? '<div class="note note-warn"><i data-lucide="users" class="w-4 h-4"></i><div>มีพนักงาน '+users.length+' คนที่ใช้องค์ประกอบนี้อยู่</div>'
          + '<button class="btn btn-secondary btn-sm note-act" onclick="closeModal();openCompView(\''+c.id+'\')"><span>ดูรายชื่อ</span></button></div>'
        : '<div class="hint-inline">ยังไม่มีพนักงานใช้องค์ประกอบนี้</div>')
      + mReason('เช่น ยกเลิกการจ่ายตามมติฝ่ายบุคคล')+'</div>'

      + '<div class="modal-body">'+mReason('เช่น กลับมาจ่ายตามมติปีงบประมาณใหม่')+'</div>'

  }
  if(m.type==='withdrawrate'){
    const r = RECORDS.find(function(x){ return x.id===m.data.id; }); if(!r) return '';
    return mHead('calendar-x','is-warning','ถอนอัตราที่รอมีผล', emp(r.emp).name+' · อัตราที่ตั้งไว้ให้มีผล '+be(r.eff)+(r.movementNo?' อ้างคำสั่ง '+r.movementNo:'')+' อัตราปัจจุบันจะไม่เปลี่ยน')
      + '<div class="modal-body">'+mReason('เช่น คำสั่งต้นทางถูกยกเลิก')+'</div>'
      + mFoot('ไม่ถอน','btn-danger','','ถอนอัตรา','doWithdrawRate()');
  }
  if(m.type==='endrate'){
    const r = RECORDS.find(function(x){ return x.id===m.data.id; }); if(!r) return '';
    return mHead('user-minus','is-warning','ปิดช่วงอัตราเมื่อพ้นสภาพ', emp(r.emp).name+' · ประวัติอัตราทั้งหมดยังอยู่ครบ ไม่มีการลบ')
      + '<div class="modal-body">'
      + '<div class="field"><label class="field-label">วันสุดท้ายของการเป็นพนักงาน<span class="req">*</span></label>'
      + '<input class="input" type="date" name="endat" value="'+esc(m.data.endAt||TODAY)+'" onchange="state.modal.data.endAt=this.value"></div>'
      + mReason('เช่น ลาออกตามใบลาออกลงวันที่')+'</div>'
      + mFoot('ยกเลิก','btn-danger','','ปิดช่วงอัตรา','doEndRate()');
  }
  if(m.type==='withdrawrecur'){
    const i = RECUR.find(function(x){ return x.id===m.data.id; }); if(!i) return '';
    return mHead('ban','is-warning','ถอนรายการประจำ', emp(i.emp).name+' · '+((comp(i.code)||{}).name||i.code)+' · รายการเดิมยังอ่านได้ในประวัติ')
      + '<div class="modal-body">'+mReason('เช่น ยกเลิกสัญญาเงินกู้สวัสดิการ')+'</div>'
      + mFoot('ยกเลิก','btn-danger','','ถอนรายการ','doWithdrawRecur()');
  }
  return '';
}
function needReason(){
  if(String(state.modal.reason||'').trim().length < 10){ state.modal.err = 'กรอกเหตุผลอย่างน้อย 10 ตัวอักษร'; render(); return false; }
  return true;
}
function doWithdrawBand(){
  if(!needReason()) return;
  const g = GRADES.find(function(x){ return x.id===state.modal.data.id; }), nb = nextBand(g);
  if(nb){ nb.state = 'cancelled'; nb.reason = state.modal.reason; nb.by = personaEmp(); nb.at = new Date().toISOString().slice(0,16); }
  logAudit('ถอนเวอร์ชันกระบอกที่รอมีผล', g.code+' '+g.name);
  closeModal(); showToast('ถอนเวอร์ชันแล้ว กระบอกที่ใช้อยู่ยังใช้ต่อไป','success');
}
function doDeactivateGrade(){
  if(!needReason()) return;
  const g = GRADES.find(function(x){ return x.id===state.modal.data.id; });
  g.archived = true;
  g.versions.forEach(function(v){ if(v.state==='active'||v.state==='scheduled') v.state = 'inactive'; });
  logAudit('ปิดใช้ระดับ', g.code+' '+g.name);
  closeModal(); showToast('ปิดใช้แล้ว พนักงานที่อ้างระดับนี้ยังแสดงระดับเดิมได้','success');
}
function doReactivateGrade(){
  const g = GRADES.find(function(x){ return x.id===state.modal.data.id; });
  g.archived = false;
  closeModal();
  setTimeout(function(){ openGradeEdit(g.id); }, 220);
  showToast('เปิดใช้กลับ ต้องสร้างเวอร์ชันใหม่พร้อมวันมีผล','info');
}
function doDeactivateComp(){
  if(!needReason()) return;
  const c = COMPONENTS.find(function(x){ return x.id===state.modal.data.id; });
  c.status = 'inactive'; c.note = state.modal.reason; c.at = new Date().toISOString().slice(0,16);
  logAudit('ปิดใช้องค์ประกอบค่าจ้าง', c.code+' '+c.name);
  closeModal(); showToast('ปิดใช้แล้ว รายการเดิมของพนักงานยังอ่านได้','success');
}
function doReactivateComp(){
  if(!needReason()) return;
  const c = COMPONENTS.find(function(x){ return x.id===state.modal.data.id; });
  c.status = 'active'; c.note = state.modal.reason; c.at = new Date().toISOString().slice(0,16);
  logAudit('เปิดใช้องค์ประกอบค่าจ้างกลับ', c.code+' '+c.name);
  closeModal(); showToast('เปิดใช้องค์ประกอบกลับแล้ว','success');
}
function doWithdrawRate(){
  if(!needReason()) return;
  const r = RECORDS.find(function(x){ return x.id===state.modal.data.id; });
  r.state = 'cancelled'; r.reason = state.modal.reason;
  logAudit('ถอนอัตราที่รอมีผล', emp(r.emp).name+' ('+r.emp+')');
  closeModal(); showToast('ถอนแล้ว อัตราปัจจุบันไม่เปลี่ยน','success');
}
function doEndRate(){
  if(!needReason()) return;
  const r = RECORDS.find(function(x){ return x.id===state.modal.data.id; });
  r.effTo = state.modal.data.endAt || TODAY; r.state = 'ended';
  logAudit('ปิดช่วงอัตราเมื่อพ้นสภาพ', emp(r.emp).name+' ('+r.emp+')');
  closeModal(); showToast('ปิดช่วงอัตราแล้ว ประวัติยังอยู่ครบ','success');
}
function doWithdrawRecur(){
  if(!needReason()) return;
  const i = RECUR.find(function(x){ return x.id===state.modal.data.id; });
  i.state = 'cancelled'; i.reason = state.modal.reason;
  logAudit('ถอนรายการประจำ', emp(i.emp).name+' · '+i.code);
  closeModal(); showToast('ถอนรายการแล้ว ประวัติยังอ่านได้','success');
}

/* ===== ROUTER + RENDER ===== */
function routeTab(){
  const m = (location.hash || '').match(/^#\/salary-structure\/([a-z]+)/);
  return (m && TABS.some(function(t){ return t.k===m[1]; })) ? m[1] : 'grade';
}
function renderDrawer(){
  const d = state.drawer;
  if(!d.open) return '';
  if(d.mode !== 'view') return renderEditDrawer();
  if(d.kind==='grade') return renderGradeView(GRADES.find(function(x){ return x.id===d.recordId; }));
  if(d.kind==='component') return renderCompView(COMPONENTS.find(function(x){ return x.id===d.recordId; }));
  if(d.kind==='rate') return renderRateView(d.recordId);
  if(d.kind==='recurring') return renderRecurView(RECUR.find(function(x){ return x.id===d.recordId; }));
  if(d.kind==='diff') return renderDiffDrawer();
  return '';
}
function render(){
  const snap = preserveRenderState();
  state.tab = routeTab();
  const pc = document.getElementById('page-content');
  if(pc) pc.innerHTML = renderPage();
  const dr = document.getElementById('drawer');
  if(dr) dr.innerHTML = renderDrawer();
  const mo = document.querySelector('#modalBackdrop .modal');
  if(mo) mo.innerHTML = renderModal();
  renderIcons();
  initCombos();
  restoreRenderState(snap);
}
window.addEventListener('hashchange', function(){ state.pagination.page = 1; state.filters.view = 'all'; render(); });
</script>
