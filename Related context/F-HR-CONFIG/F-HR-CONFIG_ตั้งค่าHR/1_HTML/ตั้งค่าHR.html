<script>
/* ===== LIST (Pattern A · #70 anatomy · #40.1 geometry) ===== */
const SCOPE_TIP = 'ลำดับการใช้ค่า: ค่าของบริษัทลูกทับค่ากลางเสมอ';
const OUT_TIP = 'ขอบเขตรอบนี้: ไม่มีขั้นอนุมัติ · ไม่คำนวณย้อนหลัง · ไม่มีสูตรเงินเดือน · ไม่มียอดวันลารายคน · ไม่มีตัวสลับบริษัทบนหัวจอ · ไม่ดึงวันหยุดราชการให้ · ไม่แจ้งเตือนพนักงาน · ไม่มีนำเข้า/ส่งออกค่าเป็นชุด · ไม่มีระยะทดลองงาน · ไม่มีความถี่คำนวณจ่าย · ไม่มีการมัดชุดค่าให้กลุ่มพนักงาน';

function baseRows(){
  return (state.tab === 'company') ? RECORDS.slice() : RECORDS.filter(r=>r.group === state.tab);
}
function filteredRows(){
  const q = state.filters.search.trim().toLowerCase();
  let rows = baseRows().filter(function(r){
    if(q && (r.nameTh+' '+r.nameEn+' '+r.code).toLowerCase().indexOf(q) < 0) return false;
    if(state.filters.status !== 'all' && itemStatus(r) !== state.filters.status) return false;
    if(state.filters.company === 'shared' && r.scope !== 'shared') return false;
    if(state.filters.company !== 'all' && state.filters.company !== 'shared'
       && r.companies.indexOf(state.filters.company) < 0) return false;
    return true;
  });
  const c = state.sort.col, dir = state.sort.dir === 'asc' ? 1 : -1;
  rows.sort(function(a,b){
    let x, y;
    if(c === 'status'){ x = ST[itemStatus(a)].lb; y = ST[itemStatus(b)].lb; }
    else if(c === 'eff'){ x = (curVer(a)||{}).eff || ''; y = (curVer(b)||{}).eff || ''; }
    else if(c === 'scope'){ x = scopeText(a); y = scopeText(b); }
    else if(c === 'used'){ x = usedBy(a).length; y = usedBy(b).length; }
    else { x = a.nameTh; y = b.nameTh; }
    return (x > y ? 1 : x < y ? -1 : 0) * dir;
  });
  return rows;
}
function sortBy(col){
  if(state.sort.col === col) state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc';
  else { state.sort.col = col; state.sort.dir = 'asc'; }
  render();
}
function setStatFilter(st){
  state.filters.status = (state.filters.status === st) ? 'all' : st;
  state.pagination.page = 1; render();
}
function resetFilters(){
  state.filters = { search:'', status:'all', company:'all' };
  state.asOf = ''; state.pagination.page = 1; render();
  showToast('ล้างตัวกรองแล้ว', 'info');
}
function setAsOf(val){ state.asOf = val || ''; state.pagination.page = 1; render(); }
function goTab(k){ const t = TABS.find(x=>x.k===k); if(t) location.hash = t.route; }

function statCards(rows){
  const c = { active:0, scheduled:0, draft:0, inactive:0 };
  rows.forEach(function(r){ const s = itemStatus(r); if(c[s] != null) c[s]++; });
  const defs = [
    { k:'active',    lb:'ค่าที่ใช้อยู่',  ic:'check-circle-2' },
    { k:'scheduled', lb:'รอมีผล',        ic:'clock-4' },
    { k:'draft',     lb:'ร่าง',           ic:'file-pen-line' },
    { k:'inactive',  lb:'ปิดใช้',          ic:'archive' }
  ];
  return '<div class="stats">' + defs.map(function(d){
    return '<div class="stat is-click '+(state.filters.status===d.k?'is-on':'')+'" onclick="setStatFilter(\''+d.k+'\')">'
      + '<div class="stat-label"><i data-lucide="'+d.ic+'" class="w-3.5 h-3.5"></i><span>'+d.lb+'</span></div>'
      + '<div class="stat-value">'+fmtNumber(c[d.k],0)+'</div>'
      + '<div class="stat-meta">'+(state.filters.status===d.k?'กำลังกรองอยู่':'กดเพื่อกรอง')+'</div></div>';
  }).join('') + '</div>';
}
function COLS(){
  const base = [
    { k:'name',  lb:'ค่า',            s:true  },
    { k:'value', lb:'ค่าปัจจุบัน',     s:false },
    { k:'scope', lb:'ขอบเขต',         s:true, tip:SCOPE_TIP },
    { k:'status',lb:'สถานะ',          s:true  },
    { k:'eff',   lb:'วันมีผล',         s:true  },
    { k:'next',  lb:'เวอร์ชันถัดไป',   s:false },
    { k:'used',  lb:'ใช้ค่านี้',        s:true, right:true },
    { k:'act',   lb:'',               s:false, right:true }
  ];
  if(state.tab === 'company') base[1] = { k:'group', lb:'กลุ่มค่า', s:false };
  return base;
}
function cellHTML(r, k){
  const cv = curVer(r), nv = nextVer(r), t = grpOf(r.group);
  if(k === 'name') return '<span class="tbl-item"><span class="ti-ico"><i data-lucide="'+t.icon+'" class="w-3.5 h-3.5"></i></span>'
    + '<span class="ti-main"><span class="ti-name" title="'+esc(r.nameTh)+'">'+esc(r.nameTh)+'</span>'
    + '<span class="ti-code">'+esc(r.code)+'</span></span></span>';
  if(k === 'value') return '<span class="cell-main ver-val">'+esc(sumOf(r))+'</span>';
  if(k === 'group') return '<span class="cell-main">'+esc(t.label)+'</span>';
  if(k === 'scope') return '<span class="cell-main">'+esc(scopeText(r))+'</span>';
  if(k === 'status') return pill(itemStatus(r));
  if(k === 'eff') return '<span class="cell-main ver-val">'+(cv ? be(cv.eff) : '—')+'</span>';
  if(k === 'next') return nv ? '<span class="cell-main ver-val">'+be(nv.eff)+'</span>' : '<span class="cell-main text-mute-2">—</span>';
  if(k === 'used') return '<span class="cell-main num">'+usedBy(r).length+'</span>';
  if(k === 'act'){
    const dis = canEdit() ? '' : ' is-disabled';
    let h = '<div class="row-actions">';
    if(!r.archived) h += '<button class="ra-btn'+dis+'" title="แก้ไข (สร้างเวอร์ชันใหม่)" onclick="event.stopPropagation();openEdit(\''+r.id+'\')"><i data-lucide="pencil" class="w-3.5 h-3.5"></i></button>';
    if(nextVer(r) && !r.archived) h += '<button class="ra-btn'+dis+'" title="ยกเลิกเวอร์ชันที่รอมีผล" onclick="event.stopPropagation();askCancelVersion(\''+r.id+'\')"><i data-lucide="calendar-x" class="w-3.5 h-3.5"></i></button>';
    if(r.archived) h += '<button class="ra-btn'+dis+'" title="เปิดใช้กลับ" onclick="event.stopPropagation();askReactivate(\''+r.id+'\')"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i></button>';
    else h += '<button class="ra-btn is-danger'+dis+'" title="ปิดใช้" onclick="event.stopPropagation();askDeactivate(\''+r.id+'\')"><i data-lucide="archive" class="w-3.5 h-3.5"></i></button>';
    return h + '</div>';
  }
  return '';
}
</script>
<script>
function renderPage(){
  const rows = filteredRows();
  const total = rows.length;                    /* #40.1 — header กับ footer ใช้ตัวแปรเดียว */
  const ps = state.pagination.pageSize;
  const maxPage = Math.max(1, Math.ceil(total/ps));
  if(state.pagination.page > maxPage) state.pagination.page = maxPage;
  const pg = state.pagination.page;
  const view = rows.slice((pg-1)*ps, pg*ps);
  const cols = COLS();

  let h = '<div class="page-fill">';
  h += '<div class="ph"><div><div class="ph-title-row">'
     + '<h1 class="ph-title">ตั้งค่า HR</h1>'
     + '<span class="ph-count">'+fmtNumber(total,0)+' รายการ</span>'
     + '<span class="tip" data-tip="'+esc(OUT_TIP)+'"><i data-lucide="info" class="w-3.5 h-3.5"></i></span>'
     + '</div></div>'
     + '<div class="ph-actions">'
     + '<button class="btn btn-primary'+(canEdit()?'':' is-disabled')+'" onclick="openCreate()"><i data-lucide="plus" class="w-4 h-4"></i><span>สร้างค่าใหม่</span></button>'
     + '</div></div>';

  h += '<div class="tabs page-tabs">' + TABS.map(function(t){
        const n = ((t.k==='company') ? RECORDS.length : RECORDS.filter(r=>r.group===t.k).length);
        return '<button class="tab '+(state.tab===t.k?'is-active':'')+'" onclick="goTab(\''+t.k+'\')">'
          + '<i data-lucide="'+t.icon+'" class="w-3.5 h-3.5"></i><span>'+t.label+'</span>'
          + '<span class="tab-badge">'+n+'</span></button>';
      }).join('') + '</div>';

  if(state.asOf) h += '<div class="dt-band"><i data-lucide="history" class="w-4 h-4"></i>'
     + '<span>กำลังดูค่าที่มีผล ณ '+be(state.asOf)+'</span>'
     + '<button class="btn btn-ghost btn-sm" class="mla" onclick="setAsOf(\'\')"><span>กลับมาวันนี้</span></button></div>';

  h += statCards(baseRows());

  h += '<div class="card list-card">';
  h += '<div class="filter-row">'
     + '<div class="input-search"><i data-lucide="search" class="lead-icon w-4 h-4"></i>'
     + '<input class="input" type="text" name="q" placeholder="ค้นหาชื่อค่าหรือรหัส" value="'+esc(state.filters.search)+'" oninput="state.filters.search=this.value;state.pagination.page=1;render();"></div>'
     + '<select class="select" onchange="state.filters.status=this.value;state.pagination.page=1;render();">'
     +   ['all','active','scheduled','draft','superseded','inactive'].map(function(s){
           const lb = s==='all' ? 'ทุกสถานะ' : ST[s].lb;
           return '<option value="'+s+'" '+(state.filters.status===s?'selected':'')+'>'+lb+'</option>';
         }).join('')
     + '</select>'
     + '<select class="select" onchange="state.filters.company=this.value;state.pagination.page=1;render();">'
     +   '<option value="all" '+(state.filters.company==='all'?'selected':'')+'>ทุกขอบเขต</option>'
     +   '<option value="shared" '+(state.filters.company==='shared'?'selected':'')+'>ค่ากลาง</option>'
     +   COMPANIES.map(c=>'<option value="'+c.id+'" '+(state.filters.company===c.id?'selected':'')+'>'+esc(c.name)+'</option>').join('')
     + '</select>'
     + '<span class="fr-lb">มีผล ณ วันที่<span class="tip" data-tip="เลือกวันย้อนหลังเพื่อดูว่าวันนั้นบริษัทใช้ค่าอะไร"><i data-lucide="info" class="w-3 h-3"></i></span></span>'
     + '<input class="input dt" type="date" name="asof" value="'+esc(state.asOf)+'" onchange="setAsOf(this.value)">'
     + '<span class="fr-sp"></span>'
     + '<button class="btn btn-ghost btn-sm" onclick="resetFilters()"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i><span>รีเซ็ต</span></button>'
     + '</div>';

  h += '<div class="table-wrap"><table class="table"><thead><tr>' + cols.map(function(c){
        const on = state.sort.col === c.k;
        const arrow = c.s ? ' <span class="sort-arrow">'+(on ? (state.sort.dir==='asc'?'↑':'↓') : '↕')+'</span>' : '';
        const tip = c.tip ? '<span class="tip" data-tip="'+esc(c.tip)+'"><i data-lucide="info" class="w-3 h-3"></i></span>' : '';
        return '<th class="'+(c.s?'is-sortable ':'')+(on?'is-sorted ':'')+'" '+(c.right?'class="tar"':'')+' '
          + (c.s?'onclick="sortBy(\''+c.k+'\')"':'') + '>'+esc(c.lb)+tip+arrow+'</th>';
      }).join('') + '</tr></thead><tbody>';

  if(!view.length){
    h += '<tr><td colspan="'+cols.length+'">' + emptyStateHTML({
      icon:'search-x', title:'ไม่พบค่าที่ตรงกับตัวกรอง',
      desc:'ลองล้างตัวกรอง หรือสร้างค่าใหม่ในกลุ่ม '+grpOf(state.tab).label,
      actionLabel:'ล้างตัวกรอง', actionIcon:'rotate-ccw', onAction:'resetFilters()'
    }) + '</td></tr>';
  } else {
    h += view.map(function(r){
      return '<tr class="is-clickable" onclick="openView(\''+r.id+'\')">' + cols.map(function(c){
        return '<td '+(c.right?'class="tar"':'')+'>'+cellHTML(r, c.k)+'</td>';
      }).join('') + '</tr>';
    }).join('');
  }
  h += '</tbody></table></div>';

  const from = total ? (pg-1)*ps + 1 : 0, to = Math.min(total, pg*ps);
  h += '<div class="table-foot"><div class="pagination">'
     + '<button class="pg-btn '+(pg<=1?'is-disabled':'')+'" onclick="goPage('+(pg-1)+')"><i data-lucide="chevron-left" class="w-3 h-3"></i></button>'
     + Array.from({length:maxPage}, function(_,i){
         return '<button class="pg-btn '+(pg===i+1?'is-active':'')+'" onclick="goPage('+(i+1)+')">'+(i+1)+'</button>'; }).join('')
     + '<button class="pg-btn '+(pg>=maxPage?'is-disabled':'')+'" onclick="goPage('+(pg+1)+')"><i data-lucide="chevron-right" class="w-3 h-3"></i></button>'
     + '</div><div>แสดง '+from+'–'+to+' จาก '+fmtNumber(total,0)+' รายการ</div></div>';

  h += '</div></div>';
  return h;
}
function goPage(n){
  const total = filteredRows().length, maxPage = Math.max(1, Math.ceil(total/state.pagination.pageSize));
  state.pagination.page = Math.min(maxPage, Math.max(1, n)); render();
}
</script>
<script>
/* ===== VIEW DRAWER (Pattern C · #38.2 has-tabs · #72 identity header) ===== */
function KV(k, v, tip){
  return '<div><div class="kv-k">'+esc(k)+(tip?'<span class="tip" data-tip="'+esc(tip)+'"><i data-lucide="info" class="w-3 h-3"></i></span>':'')+'</div>'
       + '<div class="kv-v">'+(v==null||v===''?'—':v)+'</div></div>';
}
function SEC(icon, title, body, right){
  return '<div class="sec"><div class="sec-h"><i data-lucide="'+icon+'" class="w-4 h-4"></i><span>'+esc(title)+'</span>'
       + (right?'<span class="sec-r">'+right+'</span>':'') + '</div>'+body+'</div>';
}
function isoOf(y, m, d){
  const last = new Date(Date.UTC(y, m+1, 0)).getUTCDate();
  const dt = new Date(Date.UTC(y, m, Math.min(d, last)));
  return dt.getUTCFullYear()+'-'+d2(dt.getUTCMonth()+1)+'-'+d2(dt.getUTCDate());
}
function addDays(iso, k){
  const dt = new Date(iso+'T00:00:00Z'); dt.setUTCDate(dt.getUTCDate()+k);
  return dt.toISOString().slice(0,10);
}
function effTo(r, ver){
  const list = r.versions.filter(x=>x.eff).sort((a,b)=>a.eff<b.eff?-1:1);
  const i = list.findIndex(x=>x.v===ver.v);
  if(i < 0 || i === list.length-1) return '';
  return addDays(list[i+1].eff, -1);
}
function payloadSections(r, cv){
  const p = cv.payload;
  if(r.group === 'leave'){
    let h = SEC('scale','กติกาสิทธิ์และการให้โควตา',
      '<div class="kv c3">'
      + KV('หน่วยนับ', esc(p.unit))
      + KV('จ่ายค่าจ้าง', esc(p.paid === 'จ่ายบางส่วน' ? ('จ่ายบางส่วน '+p.paidPct+'%') : p.paid))
      + KV('โควตาต่อปี', p.unlimited ? 'ไม่จำกัด' : (fmtNumber(p.quota,0)+' '+p.unit))
      + KV('ความถี่การให้สิทธิ์', esc(p.accrual))
      + KV('prorate พนักงานเข้าใหม่', esc(p.prorate))
      + KV('วิธีปัดเศษ', esc(p.rounding))
      + KV('ยกยอดสูงสุด', fmtNumber(p.carry,0)+' '+p.unit)
      + KV('วันหมดอายุยกยอด', esc(p.carryExp), 'ยกยอดที่ยังไม่ใช้จะหมดสิทธิ์ในวันนี้ของปีถัดไป')
      + KV('ลาล่วงหน้าอย่างน้อย', fmtNumber(p.advDays,0)+' วัน')
      + '</div>');
    if((p.milestones||[]).length) h += SEC('trending-up','ขั้นโควตาตามอายุงาน',
      '<div class="mini-wrap"><table class="mini-tbl"><thead><tr><th>อายุงาน (ปี)</th><th>จำนวนวัน</th></tr></thead><tbody>'
      + p.milestones.map(m=>'<tr><td>'+m.from+' – '+(m.to>=99?'ขึ้นไป':m.to)+'</td><td>'+m.days+' '+esc(p.unit)+'</td></tr>').join('')
      + '</tbody></table></div>', p.milestones.length+' ขั้น');
    h += SEC('calculator','กติกาการนับวันลา',
      '<div class="kv c3">'
      + KV('นับวันหยุดในช่วงลา', p.countHoliday ? 'นับ' : 'ไม่นับ')
      + KV('อนุญาตครึ่งวัน', p.halfDay ? 'อนุญาต' : 'ไม่อนุญาต')
      + KV('ลาต่อเนื่องสูงสุด/ครั้ง', p.maxConsec ? (p.maxConsec+' '+p.unit) : 'ไม่จำกัด')
      + KV('ติดลบได้ถึง', fmtNumber(p.negative,0)+' '+p.unit)
      + KV('ต้องแนบเอกสาร', p.needDoc ? 'ต้องแนบ' : 'ไม่ต้องแนบ')
      + KV('เอกสารที่ต้องแนบ', esc(p.docNote))
      + '</div>');
    return h;
  }
  if(r.group === 'ot' && r.sub === 'rate'){
    return SEC('percent','อัตราและฐานคำนวณ',
      '<div class="kv c3">'
      + KV('ประเภทอัตรา', esc(p.rateType))
      + KV('ตัวคูณ', '<span class="ver-val">'+(+p.mult).toFixed(1)+'x</span>', 'ขั้นต่ำตามกฎหมายแรงงาน '+OT_MIN[p.rateType].toFixed(1)+'x')
      + KV('ฐานคำนวณ', esc(p.base))
      + KV('เพดานชั่วโมง', fmtNumber(p.cap,0)+' ชม./สัปดาห์')
      + KV('รหัสอ้างอิงจ่ายเงิน', esc(r.payrollCode), 'ช่องอ้างอิงเท่านั้น การคำนวณเงินอยู่ที่โครงสร้างเงินเดือน')
      + '</div>');
  }
  if(r.group === 'ot' && r.sub === 'shift'){
    return SEC('clock','เวลาทำงานของกะ',
      '<div class="kv c3">'
      + KV('เวลาเข้า', esc(p.shiftIn)) + KV('เวลาออก', esc(p.shiftOut))
      + KV('กะข้ามวัน', p.overnight ? 'ข้ามวัน' : 'ไม่ข้ามวัน')
      + KV('ช่วงพัก', esc(p.breakFrom)+' – '+esc(p.breakTo))
      + KV('ชั่วโมงทำงาน/วัน', '<span class="ver-val">'+shiftHours(p).toFixed(1)+' ชม.</span>')
      + KV('วันทำงานในสัปดาห์', (p.days||[]).join(' · '))
      + '</div>');
  }
  if(r.group === 'holiday'){
    const days = p.days||[];
    return SEC('calendar-days','วันหยุดในชุดปฏิทิน',
      '<div class="mini-wrap"><table class="mini-tbl"><thead><tr><th>วันที่</th><th>ชื่อวันหยุด</th><th>ประเภท</th><th>วันหยุดต้นทาง</th></tr></thead><tbody>'
      + days.map(d=>'<tr><td class="ver-val">'+be(d.date)+'</td><td>'+esc(d.name)+'</td><td>'+esc(d.type)+'</td><td class="ver-val">'+(d.src?be(d.src):'—')+'</td></tr>').join('')
      + '</tbody></table></div>', days.length+' วัน · '+esc(p.location||'ทุกสถานที่'));
  }
  if(r.group === 'period'){
    const per = p.periods||[];
    let h = SEC('calendar-clock','กติการอบตัดเวลาและรอบจ่าย',
      '<div class="kv c3">'
      + KV('ความถี่', esc(p.freq)) + KV('วันตัดเวลา', p.cutDay) + KV('วันจ่าย', p.payDay)
      + KV('ล็อกงวดที่ปิดแล้ว', p.lockClosed ? 'ล็อก' : 'ไม่ล็อก', 'งวดที่ปิดแล้วแก้ค่าที่กระทบงวดนั้นไม่ได้')
      + KV('ความถี่รอบบันทึกเวลา', esc(p.workPeriod))
      + '</div>');
    h += SEC('list-checks','งวดที่สร้างแล้ว',
      (per.length
        ? '<div class="mini-wrap"><table class="mini-tbl"><thead><tr><th>งวด</th><th>ช่วงงวด</th><th>วันจ่าย</th><th>สถานะ</th><th>ผู้ปิดงวด</th><th></th></tr></thead><tbody>'
          + per.map(function(x,i){
              const perPill = (x.status === 'closed') ? '<span class="pill pill-muted">ปิดแล้ว</span>'
                                                     : '<span class="pill pill-success">เปิดอยู่</span>';
            return '<tr><td class="ver-val">'+esc(x.no)+'</td><td class="ver-val">'+be(x.from)+' – '+be(x.to)+'</td><td class="ver-val">'+be(x.pay)+'</td>'
                + '<td>'+perPill+'</td>'
                + '<td>'+(x.by?esc(emp(x.by).name)+' · '+be(x.at):'—')+'</td>'
                + '<td class="tar">'+(x.status==='open'
                    ? '<button class="btn btn-secondary btn-sm'+(canEdit()?'':' is-disabled')+'" onclick="askClosePeriod(\''+r.id+'\','+i+')"><i data-lucide="lock" class="w-3 h-3"></i><span>ปิดงวด</span></button>'
                    : '<button class="btn btn-ghost btn-sm'+(canEdit()?'':' is-disabled')+'" onclick="askReopenPeriod(\''+r.id+'\','+i+')"><i data-lucide="unlock" class="w-3 h-3"></i><span>เปิดกลับ</span></button>')+'</td></tr>';
            }).join('') + '</tbody></table></div>'
        : emptyStateHTML({ icon:'calendar-plus', title:'ยังไม่มีงวดในปีนี้', desc:'สร้างงวดทั้งปีจากกติกาวันตัดเวลาและวันจ่ายที่ตั้งไว้',
            actionLabel:'สร้างงวดทั้งปี', actionIcon:'wand-2', onAction:'genPeriods(\''+r.id+'\')' })),
      (per.length ? '<button class="btn btn-secondary btn-sm'+(canEdit()?'':' is-disabled')+'" onclick="genPeriods(\''+r.id+'\')"><i data-lucide="wand-2" class="w-3 h-3"></i><span>สร้างงวดทั้งปี</span></button>' : ''));
    return h;
  }
  if(r.group === 'appraisal'){
    return SEC('target','ช่วงรอบประเมิน',
      '<div class="kv c3">'
      + KV('ปี', p.year) + KV('ช่วงประเมิน', be(p.from)+' – '+be(p.to))
      + KV('ช่วงเปิดกรอก', be(p.openFrom)+' – '+be(p.openTo))
      + KV('ความถี่', esc(p.freq))
      + '</div>');
  }
  return '';
}

<script>
function renderViewDrawer(r){

    { k:'detail',  lb:'รายละเอียด',      ic:'file-text', n:null },

    + (r.archived

    if(r.archived) h += '<div class="note note-danger"><i data-lucide="archive" class="w-4 h-4"></i>'

function sumOfPayload(r, p){

  if(r.group === 'holiday') return (p.days||[]).length+' วัน';

  return '—';
}

<script>

<script>
function reviewDL(){
  const f = state.drawer.form, p = f.payload;
  let rows = [
    ['ชื่อค่า (ไทย)', f.nameTh], ['รหัสค่า', f.code], ['กลุ่มค่า', f.groupLb],
    ['ขอบเขตบริษัท', f.scopeLb === 'เฉพาะบริษัท' ? f.companies.map(c=>comp(c).name).join(' · ') : 'ค่ากลาง (ทุกบริษัท)'],
    ['ขอบเขตการใช้', f.appliesTo], ['รหัสอ้างอิงจ่ายเงิน', f.payrollCode || '—'],
    ['ผู้รับผิดชอบ', emp(f.owner).name + ' · ' + emp(f.owner).pos]
  ];
  if(f.group === 'leave') rows = rows.concat([
    ['หน่วยนับ', p.unit], ['จ่ายค่าจ้าง', p.paid === 'จ่ายบางส่วน' ? ('จ่ายบางส่วน '+p.paidPct+'%') : p.paid],
    ['โควตาต่อปี', p.unlimited ? 'ไม่จำกัด' : (p.quota+' '+p.unit)],
    ['ขั้นตามอายุงาน', (p.milestones||[]).length ? (p.milestones.map(m=>m.from+'-'+(m.to>=99?'ขึ้นไป':m.to)+' ปี = '+m.days+' '+p.unit).join(' · ')) : 'ไม่ใช้'],
    ['ยกยอดสูงสุด', p.carry+' '+p.unit+(p.carry>0?(' · หมดอายุ '+(p.carryExp||'—')):'')],
    ['prorate / ปัดเศษ', p.prorate+' · '+p.rounding],
    ['กติกาการนับวัน', (p.countHoliday?'นับวันหยุด':'ไม่นับวันหยุด')+' · '+(p.halfDay?'ลาครึ่งวันได้':'ไม่มีครึ่งวัน')],
    ['เอกสารแนบ', p.needDoc ? (p.docNote||'ต้องแนบ') : 'ไม่ต้องแนบ']
  ]);
  if(f.group === 'ot' && f.subLb === 'อัตรา OT') rows = rows.concat([
    ['ประเภทอัตรา', p.rateType], ['ตัวคูณ', (+p.mult).toFixed(1)+'x'],
    ['ฐานคำนวณ', p.base], ['เพดานชั่วโมง', p.cap+' ชม./สัปดาห์']
  ]);
  if(f.group === 'ot' && f.subLb === 'กะมาตรฐาน') rows = rows.concat([
    ['เวลาทำงาน', p.shiftIn+' – '+p.shiftOut+(p.overnight?' (ข้ามวัน)':'')],
    ['ช่วงพัก', (p.breakFrom||'—')+' – '+(p.breakTo||'—')],
    ['ชั่วโมงทำงาน/วัน', shiftHours(p).toFixed(1)+' ชม.'],
    ['วันทำงานในสัปดาห์', (p.days||[]).join(' · ') || '—']
  ]);
  if(f.group === 'holiday') rows = rows.concat([
    ['ปี', p.year], ['สถานที่ / สาขา', p.location || 'ทุกสถานที่'], ['จำนวนวันหยุด', (p.days||[]).length+' วัน']
  ]);
  if(f.group === 'period') rows = rows.concat([
    ['ความถี่', p.freq], ['วันตัดเวลา / วันจ่าย', p.cutDay+' / '+p.payDay],
    ['รอบบันทึกเวลา', p.workPeriod], ['ล็อกงวดที่ปิดแล้ว', p.lockClosed?'ล็อก':'ไม่ล็อก']
  ]);
  if(f.group === 'appraisal') rows = rows.concat([
    ['ปี', p.year], ['ช่วงประเมิน', be(p.from)+' – '+be(p.to)],
    ['ช่วงเปิดกรอก', be(p.openFrom)+' – '+be(p.openTo)], ['ความถี่', p.freq]
  ]);
  rows.push(['วันมีผล', f.eff ? be(f.eff) : 'ยังไม่กำหนด']);
  if(f.isNewVersion) rows.push(['เหตุผลการเปลี่ยน', f.reason || '—']);
  return '<dl class="rev-dl">' + rows.map(r=>'<dt>'+esc(r[0])+'</dt><dd>'+esc(r[1]==null||r[1]===''?'—':r[1])+'</dd>').join('') + '</dl>';
}
function step3(){
  const f = state.drawer.form, lu = lockedUntil();
  let h = '<div class="sec"><div class="sec-h"><i data-lucide="calendar-check" class="w-4 h-4"></i><span>วันที่ค่านี้เริ่มมีผล</span></div><div class="grid2">'
    + FLD({ k:'eff', lb:'วันมีผล', t:'date', req:true, tip:'ทุกค่าต้องมีวันมีผล เพื่อย้อนดูได้ว่าวันนั้นบริษัทใช้กติกาอะไร' })
    + (f.isNewVersion ? FLD({ k:'reason', lb:'เหตุผลการเปลี่ยน', t:'textarea', req:true, ph:'อย่างน้อย 10 ตัวอักษร' }) : '')
    + '</div>'
    + (lu ? '<div class="hint-inline">ตั้งได้เร็วสุด '+be(lu)+'</div>' : '')
    + '</div>';
  h += '<div class="sec"><div class="sec-h"><i data-lucide="list-checks" class="w-4 h-4"></i><span>ตรวจสอบก่อนบันทึก</span></div>' + reviewDL() + '</div>';
  return h;
}
function renderEditDrawer(){
  const f = state.drawer.form, s = state.drawer.step, last = s === STEPS.length;
  const busy = state.drawer.busy;
  let h = '<div class="drawer-header"><div class="dw-head-row"><div class="min0">'
    + '<div class="dw-eyebrow"><i data-lucide="'+grpOf(f.group).icon+'" class="w-3.5 h-3.5"></i><span>'+esc(f.groupLb)+'</span></div>'
    + '<div class="dw-title">'+(f.isNewVersion ? 'สร้างเวอร์ชันใหม่ · '+esc(f.nameTh) : 'สร้างค่าใหม่')+'</div>'
    + '<div class="dw-sub">ขั้นที่ '+s+' จาก '+STEPS.length+' · '+esc(STEPS[s-1])+(f.isNewVersion?(' · เวอร์ชันที่ '+f.verNo):'')+'</div>'
    + '</div><div class="drawer-header-actions">'
    + '<button class="top-icon-btn" onclick="closeDrawer()"><i data-lucide="x" class="w-4 h-4"></i></button>'
    + '</div></div></div>';
  h += stepBand();
  h += '<div class="drawer-body">' + errNote()
     + (s === 3 ? step3() : stepFields())
     + '</div>';
  h += '<div class="drawer-footer">'
     + '<button class="btn btn-ghost" onclick="closeDrawer()"><span>ยกเลิก</span></button>'
     + (s > 1 ? '<button class="btn btn-secondary" onclick="gotoStep('+(s-1)+')"><i data-lucide="chevron-left" class="w-4 h-4"></i><span>ย้อนกลับ</span></button>' : '')
     + '<span class="footer-spacer"></span><div class="dw-footer-right">'
     + '<button class="btn btn-secondary'+(busy?' is-disabled':'')+'" onclick="saveDraft()"><i data-lucide="file-pen-line" class="w-4 h-4"></i><span>บันทึกร่าง</span></button>'
     + (last
        ? '<button class="btn btn-primary'+(busy?' is-disabled':'')+'" onclick="submitVersion()">'
          + (busy ? '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>' : '<i data-lucide="check" class="w-4 h-4"></i><span>บันทึกและตั้งวันมีผล</span>') + '</button>'
        : '<button class="btn btn-primary" onclick="gotoStep('+(s+1)+')"><span>ถัดไป</span><i data-lucide="chevron-right" class="w-4 h-4"></i></button>')
     + '</div></div>';
  return h;
}
</script>
<script>
/* ===== OPEN / VALIDATE / SAVE ===== */
function blankPayload(g, sub){
  if(g === 'leave') return { unit:'วัน', paid:'จ่าย', paidPct:100, quota:6, unlimited:false, accrual:'ต้นปี',
    prorate:'ตามเดือน', rounding:'ครึ่งวันใกล้สุด', carry:0, carryExp:'', needDoc:false, docNote:'',
    advDays:0, maxConsec:0, negative:0, countHoliday:false, halfDay:true, milestones:[] };
  if(g === 'ot' && sub === 'shift') return { shiftIn:'08:00', shiftOut:'17:00', overnight:false, breakFrom:'12:00', breakTo:'13:00', days:['จ','อ','พ','พฤ','ศ'] };
  if(g === 'ot') return { rateType:'OT วันทำงาน', mult:1.5, base:'ค่าจ้างรายชั่วโมง', cap:36 };
  if(g === 'holiday') return { year:2027, location:'', days:[] };
  if(g === 'period') return { freq:'รายเดือน', cutDay:25, payDay:30, lockClosed:true, workPeriod:'ใช้รอบเดียวกับรอบจ่าย', periods:[] };
  if(g === 'appraisal') return { year:2027, from:'2027-01-01', to:'2027-06-30', openFrom:'2027-07-01', openTo:'2027-07-15', freq:'ปีละ 2' };
  return {};
}
function defaultEff(){
  const dt = new Date(TODAY+'T00:00:00Z');
  const iso = isoOf(dt.getUTCFullYear(), dt.getUTCMonth()+1, 1);
  const lu = lockedUntil();
  return (lu && iso < lu) ? lu : iso;
}
function openCreate(){
  if(!canEdit()) return showToast('บทบาท HR Staff ดูได้อย่างเดียว', 'warning');
  const g = (state.tab === 'company') ? 'leave' : state.tab;
  state.drawer = { open:true, mode:'create', recordId:null, step:1, tab:'detail', err:{}, busy:false,
    form: { mode:'create', id:null, group:g, groupLb:grpOf(g).label, subLb:'อัตรา OT', code:'', nameTh:'', nameEn:'',
      scopeLb:'ค่ากลาง (ทุกบริษัท)', companies:[], appliesTo:'ทั้งบริษัท', payrollCode:'', owner:'E-1001',
      note:'', eff:defaultEff(), reason:'', isNewVersion:false, verNo:1, payload: blankPayload(g,'rate') } };
  openPanel();
}
function openEdit(id){
  if(!canEdit()) return showToast('บทบาท HR Staff ดูได้อย่างเดียว', 'warning');
  const r = rec(id); if(!r) return;
  const cv = curVer(r) || lastVer(r);
  state.drawer = { open:true, mode:'edit', recordId:id, step:1, tab:'detail', err:{}, busy:false,
    form: { mode:'edit', id:id, group:r.group, groupLb:grpOf(r.group).label,
      subLb: r.sub === 'shift' ? 'กะมาตรฐาน' : 'อัตรา OT',
      code:r.code, nameTh:r.nameTh, nameEn:r.nameEn,
      scopeLb: r.scope === 'shared' ? 'ค่ากลาง (ทุกบริษัท)' : 'เฉพาะบริษัท',
      companies:r.companies.slice(), appliesTo:r.appliesTo, payrollCode:r.payrollCode, owner:r.owner,
      note:r.note, eff:defaultEff(), reason:'', isNewVersion:true, verNo:(lastVer(r)||{v:0}).v + 1,
      payload: P(cv.payload) } };
  openPanel();
}
function openView(id){
  const r = rec(id); if(!r) return;
  state.drawer = { open:true, mode:'view', recordId:id, step:1, tab:'detail', form:null, err:{}, busy:false };
  openPanel();
}
function openPanel(){
  render();
  requestAnimationFrame(function(){
    document.getElementById('drawerBackdrop').classList.add('is-open');
    document.getElementById('drawer').classList.add('is-open');
  });
}
function closeDrawer(){
  const b = document.getElementById('drawerBackdrop'), d = document.getElementById('drawer');
  if(b) b.classList.remove('is-open'); if(d) d.classList.remove('is-open');
  setTimeout(function(){ state.drawer = { open:false, mode:null, recordId:null, step:1, tab:'detail', form:null, err:{}, busy:false }; render(); }, 280);
}
function gotoStep(n){
  if(n > state.drawer.step && !validateStep(state.drawer.step)){ render(); showToast('ยังกรอกไม่ครบ ตรวจข้อความสีแดง', 'error'); return; }
  state.drawer.step = Math.min(STEPS.length, Math.max(1, n));
  state.drawer.err = {}; render();
}
function validateStep(s){
  const f = state.drawer.form, p = f.payload, e = {};
  if(s === 1){
    if(!String(f.nameTh||'').trim()) e.nameTh = 'กรอกชื่อค่า (ไทย)';
    if(!String(f.code||'').trim()) e.code = 'กรอกรหัสค่า';
    else if(!/^[A-Z0-9-]+$/.test(f.code)) e.code = 'รหัสค่าใช้ได้เฉพาะตัวพิมพ์ใหญ่ ตัวเลข และเครื่องหมาย -';
    else if(RECORDS.some(r=>r.code === f.code && r.id !== f.id && r.group === f.group)) e.code = 'รหัสค่านี้มีอยู่แล้วในกลุ่ม '+f.groupLb;
    if(f.scopeLb === 'เฉพาะบริษัท' && !f.companies.length) e.companies = 'เลือกบริษัทอย่างน้อย 1 บริษัท';
  }
  if(s === 2){
    if(f.group === 'leave'){
      if(!p.unlimited && (p.quota === '' || +p.quota < 0)) e.quota = 'โควตาต้องไม่ติดลบ';
      if(p.paid === 'จ่ายบางส่วน' && (+p.paidPct < 1 || +p.paidPct > 99)) e.paidPct = 'เปอร์เซ็นต์ที่จ่ายต้องอยู่ระหว่าง 1–99';
      if(+p.carry < 0) e.carry = 'ยกยอดต้องไม่ติดลบ';
      if(+p.carry > 0 && !String(p.carryExp||'').trim()) e.carryExp = 'ยกยอดมากกว่า 0 ต้องระบุวันหมดอายุยกยอด';
      if(p.needDoc && !String(p.docNote||'').trim()) e.docNote = 'ระบุเอกสารที่ต้องแนบ';
      const ms = (p.milestones||[]).slice().sort((a,b)=>a.from-b.from);
      for(let i=0;i<ms.length;i++){
        if(+ms[i].to < +ms[i].from) e.milestones = 'ขั้นที่ '+(i+1)+' มีปีสิ้นสุดน้อยกว่าปีเริ่ม';
        if(i && +ms[i].from <= +ms[i-1].to) e.milestones = 'ช่วงอายุงานทับซ้อนกันที่ขั้นที่ '+(i+1);
        else if(i && +ms[i].from > +ms[i-1].to + 1) e.milestones = 'ช่วงอายุงานมีช่องว่างระหว่างขั้นที่ '+i+' กับ '+(i+1);
      }
    }
    if(f.group === 'ot' && f.subLb === 'อัตรา OT'){
      const min = OT_MIN[p.rateType];
      if(p.mult === '' || isNaN(+p.mult)) e.mult = 'กรอกตัวคูณ';
      else if(+p.mult < min) e.mult = 'ตัวคูณต่ำกว่าขั้นต่ำตามกฎหมายแรงงาน — '+p.rateType+' ต้องไม่น้อยกว่า '+min.toFixed(1)+' เท่า';
      if(!(+p.cap > 0)) e.cap = 'เพดานชั่วโมงต้องมากกว่า 0';
    }
    if(f.group === 'ot' && f.subLb === 'กะมาตรฐาน'){
      if(!p.overnight && p.shiftOut <= p.shiftIn) e.shiftOut = 'เวลาออกต้องมากกว่าเวลาเข้า หรือติ๊ก “กะข้ามวัน”';
      if(p.breakFrom && p.breakTo){
        const inShift = p.overnight ? true : (p.breakFrom >= p.shiftIn && p.breakTo <= p.shiftOut);
        if(!inShift) e.breakFrom = 'ช่วงพักต้องอยู่ในช่วงเวลาของกะ';
      }
      if(!(p.days||[]).length) e.days = 'เลือกวันทำงานอย่างน้อย 1 วัน';
    }
    if(f.group === 'holiday'){
      if(!(+p.year > 0)) e.year = 'กรอกปี';
      const seen = {}; let dupMsg = '';
      (p.days||[]).forEach(function(d){
        if(!d.date || !String(d.name||'').trim()) dupMsg = dupMsg || 'กรอกวันที่และชื่อวันหยุดให้ครบทุกแถว';
        else if(seen[d.date]) dupMsg = 'วันที่ '+be(d.date)+' ซ้ำกับ “'+seen[d.date]+'” ในชุดปฏิทินนี้';
        else seen[d.date] = d.name;
        if(d.type === 'วันหยุดชดเชย' && !d.src) dupMsg = dupMsg || 'วันหยุดชดเชยต้องอ้างวันหยุดต้นทาง';
      });
      if(dupMsg) e.days = dupMsg;
      const other = RECORDS.filter(r=>r.group==='holiday' && r.id!==f.id && (r.scope==='shared') === (f.scopeLb!=='เฉพาะบริษัท'));
      other.forEach(function(r){
        const cv2 = lastVer(r); if(!cv2 || cv2.payload.year !== +p.year) return;
        if((cv2.payload.location||'') !== (p.location||'')) return;
        (p.days||[]).forEach(function(d){
          if((cv2.payload.days||[]).some(x=>x.date === d.date))
            e.days = 'วันที่ '+be(d.date)+' มีอยู่แล้วในชุด “'+r.nameTh+'” ของบริษัทและปีเดียวกัน';
        });
      });
    }
    if(f.group === 'period'){
      if(!(+p.cutDay >= 1 && +p.cutDay <= 31)) e.cutDay = 'วันตัดเวลาต้องอยู่ระหว่าง 1–31';
      if(!(+p.payDay >= 1 && +p.payDay <= 31)) e.payDay = 'วันจ่ายต้องอยู่ระหว่าง 1–31';
      if(+p.cutDay > +p.payDay) e.payDay = 'วันตัดเวลาต้องไม่เกินวันจ่ายในงวดเดียวกัน';
    }
    if(f.group === 'appraisal'){
      if(!(p.from && p.to && p.from < p.to)) e.to = 'ช่วงประเมินต้องเริ่มก่อนสิ้นสุด';
      if(!(p.openFrom && p.openTo && p.openFrom <= p.openTo)) e.openTo = 'ช่วงเปิดกรอกต้องเริ่มก่อนสิ้นสุด';
      if(p.openFrom && p.from && p.openFrom < p.from) e.openFrom = 'ช่วงเปิดกรอกต้องอยู่หลังหรือคร่อมช่วงประเมิน';
      RECORDS.filter(r=>r.group==='appraisal' && r.id!==f.id).forEach(function(r){
        const q = lastVer(r); if(!q) return;
        if(+q.payload.year !== +p.year) return;
        if(p.from <= q.payload.to && q.payload.from <= p.to)
          e.from = 'ช่วงวันทับซ้อนกับรอบ “'+r.nameTh+'” ('+be(q.payload.from)+' – '+be(q.payload.to)+')';
      });
    }
  }
  if(s === 3){
    if(!f.eff) e.eff = 'ต้องกรอกวันมีผลก่อนบันทึก (บันทึกร่างไว้ก่อนได้)';
    else {
      const lp = lockedPeriodOf(f.eff);
      if(lp) e.eff = 'ตั้งวันมีผลย้อนเข้างวด '+lp.no+' ที่ปิดแล้วไม่ได้ — วันที่ตั้งได้เร็วที่สุดคือ '+be(lockedUntil());
      const r = f.id ? rec(f.id) : null;
      if(r && r.versions.some(x=>x.eff === f.eff && x.state !== 'draft' && x.state !== 'cancelled'))
        e.eff = 'มีเวอร์ชันที่ใช้วันมีผลนี้อยู่แล้ว — เลือกวันอื่น';
    }
    if(f.isNewVersion && String(f.reason||'').trim().length < 10) e.reason = 'กรอกเหตุผลการเปลี่ยนอย่างน้อย 10 ตัวอักษร';
  }
  state.drawer.err = e;
  return Object.keys(e).length === 0;
}
</script>
<script>
function applyHeader(r, f){
  r.nameTh = f.nameTh; r.nameEn = f.nameEn; r.code = f.code;
  r.scope = (f.scopeLb === 'เฉพาะบริษัท') ? 'company' : 'shared';
  r.companies = (r.scope === 'company') ? f.companies.slice() : [];
  r.appliesTo = f.appliesTo; r.payrollCode = f.payrollCode; r.owner = f.owner; r.note = f.note;
  if(f.group === 'ot') r.sub = (f.subLb === 'กะมาตรฐาน') ? 'shift' : 'rate';
}
function saveDraft(){
  const f = state.drawer.form;
  if(!String(f.nameTh||'').trim()){ state.drawer.err = { nameTh:'กรอกชื่อค่าก่อนบันทึกร่าง' }; state.drawer.step = 1; render(); return; }
  let r = f.id ? rec(f.id) : null;
  if(!r){
    r = mk('R'+Date.now().toString().slice(-5), f.group, f.code || 'NEW-'+Date.now().toString().slice(-4), f.nameTh, f.nameEn, {});
    RECORDS.push(r); f.id = r.id;
  }
  applyHeader(r, f);
  r.versions.push(v((lastVer(r)||{v:0}).v + 1, '', 'draft', normPayload(P(f.payload)), 'E-1001', new Date().toISOString().slice(0,16), ''));
  closeDrawer();
  setTimeout(function(){ showToast('บันทึกร่างแล้ว — ยังไม่มีผลกับ feature ใด', 'success'); }, 300);
}
function submitVersion(){
  if(!validateStep(3)){ render(); showToast('ยังตั้งวันมีผลไม่ได้ ตรวจข้อความสีแดง', 'error'); return; }
  const f = state.drawer.form, p = f.payload;
  const lowQuota = (f.group === 'leave' && f.code.indexOf('VAC') >= 0 && !p.unlimited && +p.quota < LEAVE_MIN_VAC);
  if(lowQuota && !f.quotaAck){ openModal('quota', { quota:+p.quota }); return; }
  state.drawer.busy = true; render();
  setTimeout(function(){
    let r = f.id ? rec(f.id) : null;
    if(!r){
      r = mk('R'+Date.now().toString().slice(-5), f.group, f.code, f.nameTh, f.nameEn, {});
      RECORDS.push(r); f.id = r.id;
    }
    applyHeader(r, f);
    r.versions.filter(x=>x.state === 'draft').forEach(x=>{ x.state = 'cancelled'; });
    const st = (f.eff <= TODAY) ? 'active' : 'scheduled';
    if(st === 'active') r.versions.filter(x=>x.state === 'active').forEach(x=>{ x.state = 'superseded'; });
    r.versions.push(v((lastVer(r)||{v:0}).v + 1, f.eff, st, normPayload(P(p)), 'E-1001', new Date().toISOString().slice(0,16), f.reason));
    r.archived = false;
    state.drawer.busy = false;
    closeDrawer();
    setTimeout(function(){ showToast(st === 'active' ? 'บันทึกแล้ว — มีผลตั้งแต่วันนี้' : ('บันทึกแล้ว — จะมีผล '+be(f.eff)), 'success'); }, 300);
  }, 650);
}
function genPeriods(id){
  if(!canEdit()) return showToast('บทบาท HR Staff ดูได้อย่างเดียว', 'warning');
  const r = rec(id), cv = curVer(r) || lastVer(r); if(!cv) return;
  const p = cv.payload;
  const yr = (new Date((cv.eff||TODAY)+'T00:00:00Z')).getUTCFullYear() + 1;
  const list = [];
  for(let m = 0; m < 12; m++){
    const to = isoOf(yr, m, +p.cutDay);
    const from = addDays(isoOf(yr, m-1, +p.cutDay), 1);
    const pay = isoOf(yr, m, +p.payDay);
    list.push({ no:(yr+543).toString().slice(1)+'-'+d2(m+1), from:from, to:to, pay:pay, status:'open', by:'', at:'' });
  }
  p.periods = list;
  render();
  showToast('สร้างงวดปี '+(yr+543)+' ครบ 12 งวดแล้ว', 'success');
}
function normPayload(p){
  ['quota','paidPct','carry','advDays','maxConsec','negative','mult','cap','year','cutDay','payDay'].forEach(function(k){
    if(p[k] !== undefined && p[k] !== '' && !isNaN(+p[k])) p[k] = +p[k];
  });
  (p.milestones||[]).forEach(function(m){ m.from = +m.from; m.to = +m.to; m.days = +m.days; });
  return p;
}
/* ===== MODALS (Pattern D) ===== */
function askDeactivate(id){ if(!canEdit()) return showToast('บทบาท HR Staff ดูได้อย่างเดียว','warning'); openModal('deactivate', { id:id }); }
function askReactivate(id){ if(!canEdit()) return showToast('บทบาท HR Staff ดูได้อย่างเดียว','warning'); openModal('reactivate', { id:id }); }
function askCancelVersion(id){ if(!canEdit()) return showToast('บทบาท HR Staff ดูได้อย่างเดียว','warning'); openModal('cancelver', { id:id }); }
function askClosePeriod(id, i){ if(!canEdit()) return showToast('บทบาท HR Staff ดูได้อย่างเดียว','warning'); openModal('closeper', { id:id, i:i }); }
function askReopenPeriod(id, i){ if(!canEdit()) return showToast('บทบาท HR Staff ดูได้อย่างเดียว','warning'); openModal('reopenper', { id:id, i:i }); }
function mReason(ph){
  return '<div class="field"><label class="field-label">เหตุผล<span class="req">*</span></label>'
    + '<textarea class="input" name="mreason" rows="2" class="ta-auto" placeholder="'+esc(ph)+'" oninput="state.modal.reason=this.value"></textarea>'
    + (state.modal.err?'<div class="field-error" class="on">'+esc(state.modal.err)+'</div>':'')+'</div>';
}
function renderModal(){
  const m = state.modal; if(!m.open) return '';
  const r = m.data && m.data.id ? rec(m.data.id) : null;
  if(m.type === 'deactivate'){
    const list = usedBy(r);
    return '<div class="modal-header"><div class="modal-header-icon is-warning"><i data-lucide="archive" class="w-5 h-5"></i></div>'
      + '<div><h3 class="modal-title">ปิดใช้ “'+esc(r.nameTh)+'”</h3>'
      + '<p class="modal-subtitle">ค่านี้จะถูกเก็บถาวรแบบปิดใช้ เลือกใหม่ไม่ได้ แต่ข้อมูลเดิมที่อ้างค่านี้ยังเปิดอ่านได้ และไม่มีการลบถาวร</p></div></div>'
      + '<div class="modal-body">'
      + (list.length ? '<div class="note note-warn"><i data-lucide="share-2" class="w-4 h-4"></i><div>มี '+list.length+' feature ที่ใช้ค่านี้อยู่</div></div>'
          + list.map(c=>'<div class="wu-row"><i data-lucide="corner-down-right" class="w-4 h-4 text-mute-2"></i>'
            + '<div><div class="wu-nm">'+esc(c.name)+'</div><div class="wu-mt">'+esc(c.code)+' · แผนพัฒนา '+c.wave+'</div></div>'
            + '<div class="mla">'+(c.ready?'<span class="pill pill-success">พร้อมใช้</span>':'<span class="pill pill-muted">ยังไม่ทำ</span>')+'</div></div>').join('')
          : '<div class="hint-inline">ยังไม่มี feature ใดอ้างค่านี้</div>')
      + mReason('เช่น ไม่มีการใช้สิทธิ์ต่อเนื่อง 3 ปี') + '</div>'
      + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()"><span>ยกเลิก</span></button>'
      + '<button class="btn btn-danger btn-eq" onclick="doDeactivate()"><i data-lucide="archive" class="w-4 h-4"></i><span>ปิดใช้</span></button></div>';
  }
  if(m.type === 'reactivate'){
    return '<div class="modal-header"><div class="modal-header-icon"><i data-lucide="rotate-ccw" class="w-5 h-5"></i></div>'
      + '<div><h3 class="modal-title">เปิดใช้ “'+esc(r.nameTh)+'” กลับ</h3>'
      + '<p class="modal-subtitle">การเปิดใช้กลับต้องสร้างเวอร์ชันใหม่พร้อมวันมีผล เพื่อให้ย้อนดูได้ว่าเปิดกลับตั้งแต่วันไหน</p></div></div>'
      + '<div class="modal-body"><div class="hint-inline">กดต่อไปเพื่อกรอกค่าและวันมีผลของเวอร์ชันใหม่</div></div>'
      + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()"><span>ยกเลิก</span></button>'
      + '<button class="btn btn-primary btn-eq" onclick="doReactivate()"><i data-lucide="chevron-right" class="w-4 h-4"></i><span>ต่อไป</span></button></div>';
  }
  if(m.type === 'cancelver'){
    const nv = nextVer(r);
    return '<div class="modal-header"><div class="modal-header-icon is-warning"><i data-lucide="calendar-x" class="w-5 h-5"></i></div>'
      + '<div><h3 class="modal-title">ยกเลิกเวอร์ชันที่รอมีผล</h3>'
      + '<p class="modal-subtitle">'+esc(r.nameTh)+' · เวอร์ชัน '+(nv?nv.v:'')+' ที่ตั้งไว้ให้มีผล '+(nv?be(nv.eff):'')+' ค่าที่ใช้อยู่ปัจจุบันจะใช้ต่อไป</p></div></div>'
      + '<div class="modal-body">' + mReason('เช่น เลื่อนการบังคับใช้ตามมติที่ประชุม') + '</div>'
      + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()"><span>ไม่ยกเลิก</span></button>'
      + '<button class="btn btn-danger btn-eq" onclick="doCancelVersion()"><span>ยกเลิกเวอร์ชัน</span></button></div>';
  }
  if(m.type === 'closeper' || m.type === 'reopenper'){
    const cv = curVer(r) || lastVer(r), x = cv.payload.periods[m.data.i], closing = (m.type === 'closeper');
    return '<div class="modal-header"><div class="modal-header-icon '+(closing?'':'is-warning')+'"><i data-lucide="'+(closing?'lock':'unlock')+'" class="w-5 h-5"></i></div>'
      + '<div><h3 class="modal-title">'+(closing?'ปิดงวด ':'เปิดงวด ')+esc(x.no)+(closing?'':' กลับ')+'</h3>'
      + '<p class="modal-subtitle">'+be(x.from)+' – '+be(x.to)+' · จ่าย '+be(x.pay)+'</p></div></div>'
      + '<div class="modal-body">'
      + (closing ? '<div class="note note-warn"><i data-lucide="alert-triangle" class="w-4 h-4"></i><div>ปิดแล้วตั้งวันมีผลย้อนเข้างวดนี้ไม่ได้อีก</div></div>' : mReason('เหตุผลที่ต้องเปิดงวดกลับ'))
      + '</div>'
      + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()"><span>ยกเลิก</span></button>'
      + '<button class="btn '+(closing?'btn-primary':'btn-danger')+' btn-eq" onclick="doPeriod('+(closing?'true':'false')+')"><span>'+(closing?'ปิดงวด':'เปิดงวดกลับ')+'</span></button></div>';
  }
  if(m.type === 'quota'){
    return '<div class="modal-header"><div class="modal-header-icon is-warning"><i data-lucide="alert-triangle" class="w-5 h-5"></i></div>'
      + '<div><h3 class="modal-title">โควตาต่ำกว่าขั้นต่ำตามกฎหมาย</h3>'
      + '<p class="modal-subtitle">โควตาลาพักร้อน '+m.data.quota+' วันต่อปี ต่ำกว่าขั้นต่ำ '+LEAVE_MIN_VAC+' วันต่อปี สำหรับพนักงานที่ทำงานครบ 1 ปี ยืนยันเพื่อบันทึกต่อได้</p></div></div>'
      + '<div class="modal-body"><div class="hint-inline">รายการนี้จะถูกบันทึกไว้ในประวัติเวอร์ชันพร้อมผู้ยืนยัน</div></div>'
      + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()"><span>กลับไปแก้</span></button>'
      + '<button class="btn btn-primary btn-eq" onclick="ackQuota()"><span>ยืนยันบันทึก</span></button></div>';
  }
  return '';
}

<script>
function needReason(){
  if(String(state.modal.reason||'').trim().length < 10){ state.modal.err = 'กรอกเหตุผลอย่างน้อย 10 ตัวอักษร'; render(); return false; }
  return true;
}
function doDeactivate(){
  if(!needReason()) return;
  const r = rec(state.modal.data.id);
  r.archived = true;
  r.versions.filter(x=>x.state === 'active' || x.state === 'scheduled').forEach(x=>{ x.state = 'inactive'; });
  const lv = lastVer(r); if(lv){ lv.reason = state.modal.reason; lv.by = 'E-1001'; lv.at = new Date().toISOString().slice(0,16); }
  closeModal(); render();
  showToast('ปิดใช้แล้ว — ข้อมูลเดิมที่อ้างค่านี้ยังอ่านได้', 'success');
}
function doReactivate(){
  const id = state.modal.data.id;
  closeModal();
  setTimeout(function(){ const r = rec(id); r.archived = false; openEdit(id); state.drawer.form.reason = 'เปิดใช้ค่ากลับตามมติฝ่ายบุคคล'; render(); }, 220);
}
function doCancelVersion(){
  if(!needReason()) return;
  const r = rec(state.modal.data.id), nv = nextVer(r);
  if(nv){ nv.state = 'cancelled'; nv.reason = state.modal.reason; nv.by = 'E-1001'; nv.at = new Date().toISOString().slice(0,16); }
  closeModal(); render();
  showToast('ยกเลิกเวอร์ชันที่รอมีผลแล้ว', 'success');
}
function doPeriod(closing){
  if(!closing && !needReason()) return;
  const r = rec(state.modal.data.id), cv = curVer(r) || lastVer(r), x = cv.payload.periods[state.modal.data.i];
  if(closing){ x.status = 'closed'; x.by = 'E-1001'; x.at = TODAY; }
  else { x.status = 'open'; x.by = ''; x.at = ''; }
  closeModal(); render();
  showToast(closing ? ('ปิดงวด '+x.no+' แล้ว') : ('เปิดงวด '+x.no+' กลับแล้ว'), 'success');
}
function ackQuota(){
  state.drawer.form.quotaAck = true;
  closeModal();
  setTimeout(submitVersion, 220);
}
function openModal(type, data){
  state.modal = { open:true, type:type, data:data, reason:'', busy:false, err:'' };
  render();
  requestAnimationFrame(function(){ document.getElementById('modalBackdrop').classList.add('is-open'); });
}
function closeModal(){
  const b = document.getElementById('modalBackdrop'); if(b) b.classList.remove('is-open');
  setTimeout(function(){ state.modal = { open:false, type:null, data:null, reason:'', busy:false, err:'' }; }, 200);
}

/* ===== ROUTER + RENDER ===== */
function routeTab(){
  const m = (location.hash || '').match(/^#\/hr-config\/([a-z]+)/);
  return (m && TABS.some(t=>t.k === m[1])) ? m[1] : 'leave';
}
function initCombos(){
  if(!(state.drawer.open && state.drawer.mode !== 'view' && state.drawer.step === 1)) return;
  const f = state.drawer.form;
  if(document.getElementById('ss-owner')) initSearchSelect('owner', {
    options: empOptions(), value: f.owner,
    onSelect: function(val){ if(val){ f.owner = val; render(); } } });
  if(document.getElementById('ss-company')) initSearchSelect('company', {
    options: companyOptions().filter(o=>f.companies.indexOf(o.value) < 0), value: null,
    emptyText: 'เลือกครบทุกบริษัทแล้ว',
    onSelect: function(val){ if(val && f.companies.indexOf(val) < 0){ f.companies.push(val); delete state.drawer.err.companies; render(); } } });
}
function dropCompany(id){
  const f = state.drawer.form, i = f.companies.indexOf(id);
  if(i >= 0) f.companies.splice(i, 1);
  render();
}
function render(){
  const snap = preserveRenderState();
  state.tab = routeTab();
  const pc = document.getElementById('page-content');
  if(pc) pc.innerHTML = renderPage();
  const dr = document.getElementById('drawer');
  if(dr) dr.innerHTML = state.drawer.open
      ? (state.drawer.mode === 'view' ? renderViewDrawer(rec(state.drawer.recordId)) : renderEditDrawer())
      : '';
  const mo = document.querySelector('#modalBackdrop .modal');
  if(mo) mo.innerHTML = renderModal();
  renderIcons();
  initCombos();
  restoreRenderState(snap);
}
window.addEventListener('hashchange', function(){ state.pagination.page = 1; render(); });
</script>
