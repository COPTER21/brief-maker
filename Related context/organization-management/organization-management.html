<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organization · CUBE NATIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============== CSS VARIABLES (CUBE NATIVE CI) ============== */
:root {
  --c-navy: #0B1D3A;
  --c-navy-2: #14284A;
  --c-primary: #0B5CFF;
  --c-primary-hover: #0847CC;
  --c-teal: #00A88E;
  --c-teal-light: #5EEAD4;
  --c-ink: #0F172A;
  --c-mute: #475569;
  --c-mute-2: #64748B;
  --c-mute-3: #94A3B8;
  --c-line: #CBD5E1;
  --c-line-2: #E2E8F0;
  --c-line-3: #F1F5F9;
  --c-bg-off: #F6F8FB;
  --c-success: #10B981;
  --c-warning: #D97706;
  --c-danger: #DC2626;
  --sidebar-w: 232px;
  --shell-h: 52px;
}

/* ============== RESET ============== */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Noto Sans Thai', 'Inter', system-ui, sans-serif;
  background: var(--c-bg-off);
  color: #1E293B;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  /* Admin tools: force horizontal scroll on narrow widths */
  min-width: 1180px;
}
a { text-decoration: none; color: inherit; }
button { font-family: inherit; cursor: pointer; }
[data-lucide] { flex-shrink: 0; }

/* Hide number input spinner globally (Iron Rule #19) */
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; }

/* ============== SIDEBAR ============== */
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: var(--sidebar-w);
  background: linear-gradient(180deg, #0B1D3A 0%, #14284A 50%, #0B1D3A 100%);
  color: #E2E8F0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  border-right: 1px solid rgba(255,255,255,0.06);
}
.sb-brand {
  padding: 18px;
  display: flex;
  align-items: center;
  gap: 11px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  flex-shrink: 0;
}
.sb-logo {
  width: 34px; height: 34px;
  background: linear-gradient(135deg, #0B5CFF, #00A88E);
  border-radius: 9px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(11,92,255,0.3);
}
.sb-name { font-weight: 700; font-size: 14px; color: #fff; letter-spacing: -0.01em; line-height: 1.2; }
.sb-sub { font-size: 10px; color: #94A3B8; letter-spacing: 0.06em; font-weight: 600; text-transform: uppercase; margin-top: 2px; }
.sb-nav { flex: 1; padding: 12px 8px; overflow-y: auto; }

/* Module = collapsible group (Iron Rule #27).
   Header toggles expand/collapse only — NOT navigable.
   Children = .sb-features (clickable feature items). */
.sb-module { margin-bottom: 4px; }
.sb-module-header {
  display: flex; align-items: center; gap: 8px;
  width: 100%;
  padding: 8px 10px;
  border-radius: 6px;
  background: transparent; border: 0;
  color: #94A3B8;
  font-family: inherit;
  font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
  cursor: pointer; transition: all 120ms;
  text-align: left;
}
.sb-module-header:hover { background: rgba(255,255,255,0.04); color: #CBD5E1; }
.sb-module-header .mod-icon { flex-shrink: 0; opacity: 0.7; }
.sb-module-header .mod-label { flex: 1; }
.sb-module-header .mod-chevron {
  flex-shrink: 0;
  transition: transform 200ms;
  opacity: 0.7;
}
.sb-module[data-expanded="false"] .mod-chevron { transform: rotate(-90deg); }
.sb-module[data-expanded="false"] .sb-features { display: none; }

.sb-features { padding: 2px 0 6px 0; }

.sb-item {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 12px 7px 14px;
  border-radius: 6px;
  color: #CBD5E1;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 120ms;
  margin-bottom: 1px;
  position: relative;
  user-select: none;
}
.sb-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.sb-item.is-active {
  background: #0B5CFF;
  color: #fff;
  font-weight: 600;
}
.sb-item.is-active::before {
  content: '';
  position: absolute;
  left: -10px; top: 7px; bottom: 7px;
  width: 3px;
  background: #fff;
  border-radius: 0 2px 2px 0;
}
.sb-item [data-lucide] { width: 16px; height: 16px; opacity: 0.85; }
.sb-item.is-active [data-lucide] { opacity: 1; }
.sb-badge {
  margin-left: auto;
  font-size: 10.5px;
  font-weight: 600;
  background: rgba(255,255,255,0.10);
  color: #94A3B8;
  padding: 2px 7px;
  border-radius: 999px;
}
.sb-item.is-active .sb-badge { background: rgba(255,255,255,0.18); color: #fff; }
.sb-item.is-disabled { opacity: 0.4; cursor: not-allowed; }
.sb-item.is-disabled:hover { background: transparent; color: #CBD5E1; }
.sb-footer {
  padding: 12px 16px;
  border-top: 1px solid rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11.5px;
  color: #94A3B8;
}
.pulse-dot {
  width: 7px; height: 7px;
  background: var(--c-teal);
  border-radius: 50%;
  box-shadow: 0 0 0 3px rgba(0,168,142,0.20);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

/* ============== MAIN ============== */
.main {
  margin-left: var(--sidebar-w);
  min-height: 100vh;
  background: var(--c-bg-off);
}

/* ============== SHELL BAR ============== */
.shell-bar {
  position: sticky;
  top: 0;
  background: #fff;
  border-bottom: 1px solid var(--c-line-2);
  height: var(--shell-h);
  display: flex;
  align-items: center;
  padding: 0 22px;
  z-index: 19;
  gap: 12px;
}
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  color: var(--c-mute);
}
.breadcrumb a { cursor: pointer; transition: color 120ms; }
.breadcrumb a:hover { color: var(--c-primary); }
.breadcrumb .sep { color: var(--c-mute-3); font-size: 10px; }
.breadcrumb-current { color: var(--c-ink); font-weight: 500; }
.icon-btn {
  width: 34px; height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 0;
  color: var(--c-mute);
  border-radius: 7px;
  position: relative;
  transition: all 120ms;
}
.icon-btn:hover { background: var(--c-line-3); color: var(--c-ink); }
.icon-btn [data-lucide] { width: 17px; height: 17px; }
.notif-dot {
  position: absolute;
  top: 7px; right: 8px;
  width: 7px; height: 7px;
  background: var(--c-danger);
  border-radius: 50%;
  border: 2px solid #fff;
}
.user-chip {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 5px 10px 5px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 120ms;
}
.user-chip:hover { background: var(--c-line-3); }
.user-text { line-height: 1.2; text-align: right; }
.user-name { font-size: 12.5px; font-weight: 500; color: var(--c-ink); white-space: nowrap; }
.user-role { font-size: 10.5px; color: var(--c-mute-2); white-space: nowrap; margin-top: 1px; }
.avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--c-primary), var(--c-teal));
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  flex-shrink: 0;
}

/* User dropdown menu */
.user-menu {
  position: absolute;
  top: calc(var(--shell-h) - 4px);
  right: 22px;
  background: #fff;
  border: 1px solid var(--c-line-2);
  border-radius: 10px;
  box-shadow: 0 12px 32px rgba(11,29,58,0.12);
  width: 240px;
  z-index: 30;
  padding: 6px;
  display: none;
}
.user-menu.is-open { display: block; }
.user-menu-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 11px;
  border-radius: 6px;
  font-size: 13px;
  color: var(--c-ink);
  cursor: pointer;
  transition: background 120ms;
}
.user-menu-item:hover { background: var(--c-bg-off); }
.user-menu-item [data-lucide] { width: 15px; height: 15px; color: var(--c-mute-2); }
.user-menu-item.is-danger { color: var(--c-danger); }
.user-menu-item.is-danger [data-lucide] { color: var(--c-danger); }
.user-menu-divider { height: 1px; background: var(--c-line-2); margin: 5px 0; }

/* ============== CONTENT ============== */
/* Fluid full-width — content stretches to fill viewport (Iron Rule #30).
   Do NOT add max-width here; component-level constraints (modal/toast/wizard
   internal cards) are responsible for their own readability bounds. */
.content {
  padding: 22px;
}

/* ============== PAGE HEADER ============== */
.ph {
  margin-bottom: 18px;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: flex-start;
  gap: 14px;
}
.ph > div:first-child { flex: 1 1 auto; min-width: 280px; }
.ph-title-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 5px;
}
.ph-title {
  font-family: 'Noto Sans Thai', sans-serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--c-navy);
  margin: 0;
  letter-spacing: -0.01em;
}
.ph-count {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--c-mute-2);
  background: var(--c-line-3);
  padding: 3px 9px;
  border-radius: 999px;
}
.ph-sub { font-size: 13px; color: var(--c-mute); margin: 0; }
.ph-actions { display: flex; gap: 8px; flex-shrink: 0; }

/* ============== BUTTONS ============== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 36px;
  padding: 0 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid transparent;
  background: transparent;
  white-space: nowrap;
  transition: all 120ms;
  user-select: none;
}
.btn [data-lucide] { width: 15px; height: 15px; }
.btn-primary { background: var(--c-primary); color: #fff; }
.btn-primary:hover { background: var(--c-primary-hover); box-shadow: 0 2px 8px rgba(11,92,255,0.30); }
.btn-secondary { background: #fff; border-color: var(--c-line); color: var(--c-ink); }
.btn-secondary:hover { background: var(--c-line-3); border-color: var(--c-mute-2); }
.btn-ghost { color: var(--c-mute); }
.btn-ghost:hover { background: var(--c-line-3); color: var(--c-ink); }
.btn-danger { background: #fff; border-color: var(--c-line); color: var(--c-danger); }
.btn-danger:hover { background: #FEE2E2; border-color: var(--c-danger); }
.btn-link { background: transparent; border: 0; padding: 0 4px; height: auto; color: var(--c-primary); font-weight: 500; }
.btn-link:hover { text-decoration: underline; }
.btn-sm { height: 30px; padding: 0 11px; font-size: 12px; }

/* ============== STATS (KPI Cards) ============== */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}
.stat {
  background: #fff;
  border: 1px solid var(--c-line-2);
  border-radius: 10px;
  padding: 14px 16px;
  transition: all 150ms;
}
.stat:hover { border-color: var(--c-line); box-shadow: 0 2px 8px rgba(11,29,58,0.05); }
.stat-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 500;
  color: var(--c-mute);
}
.stat-label [data-lucide] { width: 13px; height: 13px; color: var(--c-primary); }
.stat-value {
  font-family: 'Noto Sans Thai', sans-serif;
  font-size: 26px;
  font-weight: 700;
  color: var(--c-navy);
  margin-top: 6px;
  letter-spacing: -0.01em;
}
.stat-meta {
  font-size: 11.5px;
  color: var(--c-mute-2);
  margin-top: 5px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.stat-meta.is-up { color: var(--c-success); }
.stat-meta.is-down { color: var(--c-danger); }
.stat-meta [data-lucide] { width: 12px; height: 12px; }

/* ============== CARD ============== */
.card {
  background: #fff;
  border: 1px solid var(--c-line-2);
  border-radius: 10px;
  overflow: hidden;
}

/* ============== FILTER BAR ============== */
.filter-bar {
  padding: 14px 18px;
  display: flex;
  gap: 10px;
  align-items: center;
  border-bottom: 1px solid var(--c-line-2);
  background: #fff;
  flex-wrap: wrap;
}

/* ============== INPUTS ============== */
.input, .select {
  height: 36px;
  padding: 0 12px;
  border: 1px solid var(--c-line);
  border-radius: 8px;
  font-size: 13px;
  background: #fff;
  color: var(--c-ink);
  font-family: inherit;
  transition: all 120ms;
  width: 100%;
}
.input:focus, .select:focus {
  outline: none;
  border-color: var(--c-primary);
  box-shadow: 0 0 0 3px rgba(11,92,255,0.10);
}
.select {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2364748B' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat;
  background-position: right 10px center;
  padding-right: 32px;
  appearance: none;
}
.input-search { position: relative; flex: 1; max-width: 320px; }
.input-search input { padding-left: 36px; }
.input-search .lead-icon {
  position: absolute;
  left: 11px; top: 50%;
  transform: translateY(-50%);
  width: 15px; height: 15px;
  color: var(--c-mute-2);
  pointer-events: none;
}

/* ============== TABLE ============== */
.table-scroll { overflow-x: auto; }
.table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.table thead { background: var(--c-bg-off); }
.table th {
  padding: 11px 14px;
  text-align: left;
  font-weight: 600;
  color: var(--c-mute);
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border-bottom: 1px solid var(--c-line-2);
  white-space: nowrap;
}
.table th.col-check { width: 40px; padding-right: 0; }
.table th.is-sortable { cursor: pointer; user-select: none; }
.table th.is-sortable:hover { color: var(--c-ink); background: var(--c-line-3); }
.table th .sort-arrow { display: inline-block; margin-left: 4px; opacity: 0.4; }
.table th.is-sorted .sort-arrow { opacity: 1; color: var(--c-primary); }
.table td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--c-line-2);
  color: var(--c-ink);
  vertical-align: middle;
}
.table tbody tr { transition: background 120ms; }
.table tbody tr:hover { background: var(--c-bg-off); }
.table tbody tr.is-selected { background: rgba(11,92,255,0.04); }
.table tbody tr.is-selected:hover { background: rgba(11,92,255,0.07); }
.table tbody tr:last-child td { border-bottom: 0; }

/* ============== CHECKBOX ============== */
.cb {
  width: 16px; height: 16px;
  border: 1.5px solid var(--c-line);
  border-radius: 4px;
  background: #fff;
  cursor: pointer;
  display: inline-block;
  position: relative;
  transition: all 120ms;
  flex-shrink: 0;
}
.cb.is-checked, .cb.is-partial {
  background: var(--c-primary);
  border-color: var(--c-primary);
}
.cb.is-checked::after {
  content: '';
  position: absolute;
  left: 4px; top: 1px;
  width: 5px; height: 9px;
  border: solid #fff;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
.cb.is-partial::after {
  content: '';
  position: absolute;
  left: 3px; top: 6px;
  width: 8px; height: 2px;
  background: #fff;
}
.cb:hover { border-color: var(--c-primary); }

/* ============== USER CELL ============== */
.user-cell { display: flex; align-items: center; gap: 10px; }
.uc-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--c-primary), var(--c-teal));
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11.5px;
  font-weight: 600;
  flex-shrink: 0;
}
.uc-name { font-weight: 600; color: var(--c-ink); font-size: 13px; line-height: 1.3; }
.uc-email { font-size: 12px; color: var(--c-mute-2); margin-top: 1px; line-height: 1.3; }

/* ============== PILLS ============== */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 600;
  white-space: nowrap;
}
.pill [data-lucide] { width: 11px; height: 11px; }
.pill-registered { background: #DBEAFE; color: #1E40AF; }
.pill-active { background: #DBEAFE; color: #1E40AF; }
.pill-converted { background: #D1FAE5; color: #065F46; }
.pill-suspended { background: #FEF3C7; color: #92400E; }
.pill-archived { background: var(--c-line-3); color: var(--c-mute-2); }
.pill-danger { background: #FEE2E2; color: var(--c-danger); }

.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  display: inline-block;
}
.dot.is-active { background: #2563EB; box-shadow: 0 0 0 2.5px rgba(37,99,235,0.18); }
.dot.is-converted { background: #065F46; box-shadow: 0 0 0 2.5px rgba(6,95,70,0.20); }
.dot.is-suspended { background: var(--c-warning); }
.dot.is-archived { background: var(--c-mute-3); }

/* Mini-link cell (e.g. tenant link) */
.tenant-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--c-primary);
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
}
.tenant-link:hover { text-decoration: underline; }
.tenant-link [data-lucide] { width: 12px; height: 12px; }

/* ============== ROW ACTIONS ============== */
.row-actions { display: inline-flex; gap: 2px; }
.ra-btn {
  width: 28px; height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 0;
  color: var(--c-mute-2);
  border-radius: 6px;
  transition: all 120ms;
}
.ra-btn:hover { background: var(--c-line-3); color: var(--c-primary); }
.ra-btn.is-danger:hover { background: #FEE2E2; color: var(--c-danger); }
.ra-btn.is-success:hover { background: rgba(0,168,142,0.12); color: var(--c-teal); }
.ra-btn [data-lucide] { width: 15px; height: 15px; }

/* ============== TABLE FOOTER ============== */
.table-footer {
  padding: 12px 18px;
  background: var(--c-bg-off);
  border-top: 1px solid var(--c-line-2);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12.5px;
  color: var(--c-mute);
  flex-wrap: wrap;
  gap: 10px;
}
.pagination { display: inline-flex; gap: 4px; align-items: center; }
.pg-btn {
  min-width: 30px; height: 30px;
  padding: 0 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #fff;
  border: 1px solid var(--c-line-2);
  border-radius: 6px;
  color: var(--c-mute);
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all 120ms;
}
.pg-btn:hover { border-color: var(--c-line); background: var(--c-bg-off); }
.pg-btn.is-active { background: var(--c-primary); border-color: var(--c-primary); color: #fff; }
.pg-btn.is-disabled { opacity: 0.4; cursor: not-allowed; }
.pg-btn [data-lucide] { width: 13px; height: 13px; }

/* ============== BULK BAR ============== */
.bulk-bar {
  background: var(--c-navy);
  color: #fff;
  padding: 11px 18px;
  border-radius: 8px 8px 0 0;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--c-line-2);
  margin: -1px -1px 0;
  font-size: 13px;
}
.bulk-bar .btn { height: 30px; padding: 0 11px; font-size: 12px; }
.bulk-bar .btn-secondary {
  background: rgba(255,255,255,0.10);

}
.bulk-bar .btn-secondary:hover { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.30); }

/* ============== DRAWER ============== */
.drawer-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(11,29,58,0.40);
  z-index: 50;
  opacity: 0;
  pointer-events: none;
  transition: opacity 220ms;
}
.drawer-backdrop.is-open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 540px;
  background: #fff;
  z-index: 51;
  transform: translateX(100%);
  transition: transform 280ms cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  box-shadow: -16px 0 40px rgba(11,29,58,0.18);
}
.drawer.is-open { transform: translateX(0); }
.drawer-header {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 18px 22px;
  border-bottom: 1px solid var(--c-line-2);
}
.drawer-avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--c-primary), var(--c-teal));
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 600;
  flex-shrink: 0;
}
.drawer-title {
  font-family: 'Noto Sans Thai', sans-serif;
  font-size: 19px;
  font-weight: 600;
  color: var(--c-navy);
  margin: 0;
  letter-spacing: -0.01em;
}
.drawer-subtitle {
  font-size: 12px;
  color: var(--c-mute);
  margin-top: 4px;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.drawer-tabs {
  display: flex;
  padding: 0 22px;
  border-bottom: 1px solid var(--c-line-2);
}
.drawer-tab {
  padding: 10px 14px;
  font-size: 13px;
  font-weight: 500;
  color: var(--c-mute);
  border-bottom: 2px solid transparent;
  transition: all 120ms;
  margin-bottom: -1px;
  cursor: pointer;
  user-select: none;
  background: transparent;
  border-left: 0;
  border-right: 0;
  border-top: 0;
}
.drawer-tab:hover { color: var(--c-ink); }
.drawer-tab.is-active { color: var(--c-primary); border-bottom-color: var(--c-primary); }
.drawer-body { flex: 1; overflow-y: auto; padding: 22px; }
.drawer-section { margin-bottom: 22px; }
.drawer-section-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--c-mute);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin: 0 0 10px;
}
.drawer-fields {
  display: grid;
  grid-template-columns: 130px 1fr;
  gap: 10px 16px;
  font-size: 13px;
}
.drawer-fields .lbl { color: var(--c-mute); }
.drawer-fields .val { color: var(--c-ink); font-weight: 500; }
.drawer-footer {
  padding: 13px 22px;
  border-top: 1px solid var(--c-line-2);
  display: flex;
  gap: 8px;
  align-items: center;
  background: var(--c-bg-off);
}
/* Drawer Button Contract (Iron Rule #31) helpers */
.footer-spacer { flex: 1; }
.drawer-footer-meta { font-size: 12px; color: var(--c-mute-2); }
.drawer-header-actions { display: flex; gap: 6px; align-items: center; }
.drawer-header-divider { width: 1px; height: 22px; background: var(--c-line-2); margin: 0 4px; flex-shrink: 0; }

/* ============== TIMELINE ============== */
.timeline { position: relative; padding-left: 24px; }
.timeline::before {
  content: '';
  position: absolute;
  left: 8px;
  top: 4px;
  bottom: 4px;
  width: 2px;
  background: var(--c-line-2);
}
.tl-item { position: relative; margin-bottom: 16px; }
.tl-item:last-child { margin-bottom: 0; }
.tl-dot {
  position: absolute;
  left: -20px;
  top: 3px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid var(--c-primary);
}
.tl-dot.is-success { border-color: var(--c-success); }
.tl-dot.is-warning { border-color: var(--c-warning); }
.tl-title { font-size: 13px; font-weight: 600; color: var(--c-ink); }
.tl-meta { font-size: 11.5px; color: var(--c-mute-2); margin-top: 2px; }

/* ============== BOOKMARK / RELATED CARDS ============== */
.bm-card {
  display: flex;
  gap: 12px;
  padding: 11px 12px;
  border: 1px solid var(--c-line-2);
  border-radius: 8px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: all 120ms;
  align-items: center;
}
.bm-card:hover { border-color: var(--c-line); }
.bm-icon {
  width: 28px; height: 28px;
  background: rgba(11,92,255,0.10);
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--c-primary);
  flex-shrink: 0;
}
.bm-card [data-lucide] { width: 15px; height: 15px; }

/* ============== NOTES ============== */
.notes-area {
  width: 100%;
  min-height: 130px;
  padding: 12px 14px;
  background: #fff;
  border: 1px solid var(--c-line);
  border-radius: 8px;
  resize: vertical;
  font-family: inherit;
  font-size: 13px;
  line-height: 1.55;
}
.notes-area:focus { outline: none; border-color: var(--c-primary); box-shadow: 0 0 0 3px rgba(11,92,255,0.10); }

/* ============== EMPTY STATE ============== */
.empty {
  padding: 56px 24px;
  text-align: center;
  color: var(--c-mute);
}
.empty-icon {
  width: 52px; height: 52px;
  margin: 0 auto 14px;
  border-radius: 50%;
  background: var(--c-line-3);
  color: var(--c-mute-2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.empty-icon [data-lucide] { width: 22px; height: 22px; }
.empty-title {
  font-size: 15.5px;
  font-weight: 600;
  color: var(--c-ink);
  margin-bottom: 5px;
  font-family: 'Noto Sans Thai', sans-serif;
}
.empty-desc { font-size: 13px; color: var(--c-mute); max-width: 320px; margin: 0 auto; }

/* ============== MODAL ============== */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(11,29,58,0.50);
  z-index: 60;
  opacity: 0;
  pointer-events: none;
  transition: opacity 200ms;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-backdrop.is-open { opacity: 1; pointer-events: auto; }
.modal {
  background: #fff;
  border-radius: 12px;
  width: 440px;
  max-width: 92vw;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  transform: scale(0.96);
  transition: transform 200ms cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 24px 64px rgba(11,29,58,0.28);
  overflow: hidden;
}
.modal-backdrop.is-open .modal { transform: scale(1); }
.modal-header {
  padding: 18px 22px 12px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.modal-header-icon {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: rgba(11,92,255,0.10);
  color: var(--c-primary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.modal-header-icon.is-danger { background: #FEE2E2; color: var(--c-danger); }
.modal-header-icon.is-warning { background: #FEF3C7; color: var(--c-warning); }
.modal-header-icon [data-lucide] { width: 18px; height: 18px; }
.modal-title {
  font-family: 'Noto Sans Thai', sans-serif;
  font-size: 16px;
  font-weight: 600;
  color: var(--c-navy);
  margin: 0 0 4px;
}
.modal-subtitle { font-size: 13px; color: var(--c-mute); margin: 0; line-height: 1.5; }
.modal-body {
  padding: 6px 22px 18px;
  font-size: 13px;
  color: var(--c-ink);
  overflow-y: auto;
}
.modal-footer {
  padding: 12px 22px;
  background: var(--c-bg-off);
  border-top: 1px solid var(--c-line-2);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}

/* ============== FIELDS ============== */
.field { margin-bottom: 14px; }
.field-label { display: block; font-size: 12.5px; font-weight: 500; color: var(--c-mute); margin-bottom: 6px; }
.field-label .req { color: var(--c-danger); margin-left: 2px; }
.field-input { width: 100%; }
.field-help { font-size: 11.5px; color: var(--c-mute-2); margin-top: 4px; }
.field-error { font-size: 11.5px; color: var(--c-danger); margin-top: 4px; display: none; }
.field.is-invalid .input,
.field.is-invalid .select { border-color: var(--c-danger); }
.field.is-invalid .field-error { display: block; }

/* Responsive form grid (Iron Rule #17) */
.field-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 12px;
}

/* ============== TOAST ============== */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--c-navy);
  color: #fff;
  padding: 13px 18px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  z-index: 80;
  display: flex;
  align-items: center;
  gap: 10px;
  box-shadow: 0 12px 32px rgba(11,29,58,0.30);
  transform: translateY(100px);
  opacity: 0;
  transition: all 250ms cubic-bezier(0.4, 0, 0.2, 1);
  max-width: 380px;
}
.toast.is-visible { transform: translateY(0); opacity: 1; }
.toast.is-success { background: var(--c-success); }
.toast.is-info { background: var(--c-primary); }
.toast.is-warning { background: var(--c-warning); }
.toast.is-error { background: var(--c-danger); }
.toast [data-lucide] { width: 17px; height: 17px; }

/* ============== LINE EXPAND ANIMATION (Pattern E) ============== */
.line-expanded {
  animation: lineExpand 220ms cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden;
}
@keyframes lineExpand {
  from { max-height: 0; opacity: 0; transform: translateY(-8px); }
  to { max-height: 600px; opacity: 1; transform: translateY(0); }
}

/* ============== WIZARD LAYOUT (Iron Rule #22) ============== */
.page-content-host.has-wizard { display: flex; flex-direction: column; height: 100%; }
.wizard-shell { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 100%; }
.wizard-stepper-band {
  flex: 0 0 auto; background: white;
  padding: 18px 32px;
  border-bottom: 1px solid var(--c-line-2);
}

  align-items: center;

  flex-shrink: 0;
}
.step-dot.is-active { background: var(--c-primary); color: #fff; }
.step-dot.is-done { background: var(--c-primary); color: #fff; }

/* Icon utility classes (CSS-defined so no Tailwind dependency for these) */
.w-2\.5 { width: 10px; }   .h-2\.5 { height: 10px; }
.w-3   { width: 12px; }    .h-3   { height: 12px; }
.w-3\.5 { width: 14px; }   .h-3\.5 { height: 14px; }
.w-4   { width: 16px; }    .h-4   { height: 16px; }
.w-5   { width: 20px; }    .h-5   { height: 20px; }

/* ============================================================
   Lucide SVG sizing fix
   ------------------------------------------------------------
   Lucide replaces <i data-lucide="..."> with <svg class="lucide ...">
   ที่มี width="24" height="24" attributes ติดมาด้วย — attributes
   เหล่านี้ override CSS class .w-N ทำให้ icons เด้งเป็น 24×24
   ดัน pill/button สูงเกินขนาด design.

   วิธีแก้: บังคับ svg.lucide ทุกตัวให้ width/height = 1em แล้ว
   ปรับขนาดผ่าน font-size บน parent. Plus override สำหรับเคสที่
   ใช้ .w-N/.h-N โดยตรงบน <i> (Lucide จะ copy class ไปยัง svg)
   ============================================================ */
svg.lucide {
  width: 1em;
  height: 1em;
  display: inline-block;
  vertical-align: -0.125em;
  flex-shrink: 0;
}
/* เมื่อ .w-N / .h-N ถูก copy ไปบน svg.lucide ให้บังคับ override
   width/height attributes ที่ Lucide ใส่มา (specificity ชนะ attribute) */
svg.lucide.w-2\.5 { width: 10px; }   svg.lucide.h-2\.5 { height: 10px; }
svg.lucide.w-3    { width: 12px; }   svg.lucide.h-3    { height: 12px; }
svg.lucide.w-3\.5 { width: 14px; }   svg.lucide.h-3\.5 { height: 14px; }
svg.lucide.w-4    { width: 16px; }   svg.lucide.h-4    { height: 16px; }
svg.lucide.w-5    { width: 20px; }   svg.lucide.h-5    { height: 20px; }

// ---------------- Utils ----------------
function esc(s){ return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function rec(entity,id){ return state[entity].find(r=>r.id===id); }
function deptName(id){ const d=rec('department',id); return d?d.name_th:'—'; }
function branchName(id){ const b=rec('branch',id); return b?b.name_th:'—'; }
function divisionName(id){ const d=rec('division',id); return d?d.name_th:'—'; }
function positionName(id){ const p=rec('position',id); return p?p.name_th:'—'; }
function codeOf(entity,id){ const r=rec(entity,id); return r?r.code:''; }
function idByCode(entity,code){ const r=state[entity].find(x=>x.code===code); return r?r.id:null; }
function tierClass(t){ if(!t)return 'tier-e'; const c=t[0]; return c==='M'?'tier-m':c==='S'?'tier-s':'tier-e'; }
function money(n){ if(n==null||n==='')return null; const v=Number(String(n).replace(/[, ]/g,'')); return isNaN(v)?n:v.toLocaleString('en-US'); }
function childrenOf(entity,pid){ return state[entity].filter(r=>(r.parent_id==null?null:r.parent_id)===pid).sort((a,b)=>(a.seq||0)-(b.seq||0)); }
function descendantsOf(entity,id){ const out=new Set(); (function rec2(p){ childrenOf(entity,p).forEach(c=>{ out.add(c.id); rec2(c.id); }); })(id); return out; }
function deptCountInDivision(id){ return state.department.filter(d=>d.division_id===id).length; }

// ---------------- Render root ----------------
function render(){
  const snap=preserveRenderState();
  syncSidebar();
  document.getElementById('page-content').innerHTML = renderPage();
  document.getElementById('drawer').innerHTML = state.drawer.open ? renderDrawer() : '';
  const mEl=document.querySelector('#modalBackdrop .modal');
  mEl.innerHTML = state.modal.open ? renderModal() : '';
  mEl.classList.toggle('is-lg', state.modal.open && state.modal.type==='import');
  renderIcons();
  restoreRenderState(snap);
}
function syncSidebar(){
  document.querySelectorAll('.sb-item[data-feature]').forEach(el=>{
    if(el.classList.contains('is-disabled')) return;
    el.classList.toggle('is-active', el.getAttribute('data-feature')===state.route);
  });
  const t=TABS.find(t=>t.id===state.route); const bc=document.getElementById('bc-current');
  if(bc&&t){ const d=state.detailId!=null?rec(state.route,state.detailId):null; bc.textContent = d ? (t.label+' · '+d.name_th) : ('Organization · '+t.label); }
}
function renderTabs(){
  return '<div class="org-tabs">'+TABS.map(t=>{
    const cnt = t.id==='company' ? 1 : state[t.id].length;
    return '<button class="org-tab '+(t.id===state.route&&state.detailId==null?'is-active':'')+'" onclick="navigate(\''+t.id+'\')">'+
      '<i data-lucide="'+t.icon+'" class="w-4 h-4"></i><span>'+t.label+'</span><span class="ot-count">'+cnt+'</span></button>';
  }).join('')+'</div>';
}
function pageHeader(titleTh, subTh, hint, actionsHtml, countBadge){
  return '<div class="ph"><div><div class="ph-title-row"><h1 class="ph-title">'+esc(titleTh)+
    '<span class="hint" data-tip="'+esc(hint)+'">i</span></h1>'+
    (countBadge?'<span class="ph-count">'+countBadge+'</span>':'')+'</div>'+
    '<p class="ph-sub">'+esc(subTh)+'</p></div><div class="ph-actions">'+actionsHtml+'</div></div>';
}
function renderPage(){
  if(state.detailId!=null && state.route!=='company') return renderDetail(state.route,state.detailId);
  if(state.route==='company') return renderCompany();
  if(state.route==='branch') return renderBranch();
  if(state.route==='division') return renderDivision();
  return renderHierarchy(state.route);
}

function rowActions(e,id,active){
  return '<div class="row-actions" onclick="event.stopPropagation()">'+
    '<button class="ra-btn" title="แก้ไข" onclick="openDrawer(\''+e+'\',\'edit\','+id+')"><i data-lucide="square-pen" class="w-4 h-4"></i></button>'+
    '<button class="ra-btn '+(active?'':'is-success')+'" title="'+(active?'ปิดใช้งาน':'เปิดใช้งาน')+'" onclick="toggleStatus(\''+e+'\','+id+')"><i data-lucide="'+(active?'toggle-right':'toggle-left')+'" class="w-4 h-4"></i></button>'+
    '<button class="ra-btn is-danger" title="ลบ" onclick="askDelete(\''+e+'\','+id+')"><i data-lucide="trash-2" class="w-4 h-4"></i></button></div>';
}
function nameCell(e,r){ return '<div class="name-link" onclick="openDetail(\''+e+'\','+r.id+')">'+esc(r.name_th)+'</div>'+(r.name_en?'<div class="cell-en">'+esc(r.name_en)+'</div>':''); }
function getList(e){
  const f=state.filters[e]||{q:'',status:'all'}; const q=(f.q||'').toLowerCase();
  return state[e].filter(r=>{
    const hay=[r.code,r.name_th,r.name_en,r.province,r.head].filter(Boolean).join(' ').toLowerCase();
    const okQ=!q||hay.indexOf(q)>=0; const okS=f.status==='all'||(f.status==='active'?r.active:!r.active);
    return okQ&&okS;
  });
}
function filterBar(e,placeholder){
  const f=state.filters[e];
  return '<div class="filter-bar"><div class="input-search"><i data-lucide="search" class="lead-icon w-4 h-4"></i>'+
    '<input class="input" name="q_'+e+'" placeholder="'+esc(placeholder)+'" value="'+esc(f.q)+'" oninput="setFilter(\''+e+'\',\'q\',this.value)"></div>'+
    '<select class="select" style="max-width:170px" onchange="setFilter(\''+e+'\',\'status\',this.value)">'+
    opt('all','ทุกสถานะ',f.status)+opt('active','ใช้งาน',f.status)+opt('inactive','ปิดใช้งาน',f.status)+'</select></div>';
}
function listFooter(e,shown){ return '<div class="table-footer"><span>แสดง '+shown+' จาก '+state[e].length+' รายการ</span>'+
  '<div class="pagination"><button class="pg-btn is-disabled"><i data-lucide="chevron-left" class="w-3.5 h-3.5"></i></button><button class="pg-btn is-active">1</button><button class="pg-btn is-disabled"><i data-lucide="chevron-right" class="w-3.5 h-3.5"></i></button></div></div>'; }
function emptyState(msg){ return '<div class="empty"><div class="empty-icon"><i data-lucide="inbox" class="w-5 h-5"></i></div><div class="empty-title">ไม่พบรายการ</div><div class="empty-desc">'+esc(msg)+'</div></div>'; }
function csvBtns(e){ return '<button class="btn btn-secondary" onclick="openImport(\''+e+'\')"><i data-lucide="upload" class="w-4 h-4"></i><span>นำเข้า CSV</span></button>'+
  '<button class="btn btn-secondary" onclick="exportCsv(\''+e+'\')"><i data-lucide="download" class="w-4 h-4"></i><span>Export CSV</span></button>'; }

function renderHierarchy(e){
  const t=TABS.find(t=>t.id===e); const view=state.view[e];
  const addLabel = e==='department' ? 'เพิ่มแผนก' : 'เพิ่มตำแหน่ง';
  const actions=csvBtns(e)+'<button class="btn btn-primary" onclick="openDrawer(\''+e+'\',\'create\')"><i data-lucide="plus" class="w-4 h-4"></i><span>'+addLabel+'</span></button>';
  const ph=pageHeader(e==='department'?'แผนก':'ตำแหน่งและระดับ',
      e==='department'?'จัดการแผนกของ '+state.company.name_th:'จัดการตำแหน่ง + ระดับตำแหน่ง + สายบังคับบัญชา',
      t.hint, actions, state[e].length+' รายการ');
  const toolbar='<div class="toolbar"><div class="view-switch">'+
      '<button class="vs-btn '+(view==='list'?'is-active':'')+'" onclick="setView(\''+e+'\',\'list\')"><i data-lucide="list" class="w-3.5 h-3.5"></i>รายการ</button>'+
      '<button class="vs-btn '+(view==='chart'?'is-active':'')+'" onclick="setView(\''+e+'\',\'chart\')"><i data-lucide="git-fork" class="w-3.5 h-3.5"></i>ผังองค์กร</button>'+
      '</div></div>';

  return ph+renderTabs()+toolbar+main;
}
function deptDivLabel(r){ return r.division_id ? ('<span class="div-chip"><i data-lucide="layers" class="w-3 h-3"></i>'+esc(divisionName(r.division_id))+'</span>') : '<span style="color:var(--c-mute-3)">— ไม่สังกัด</span>'; }
function posBindLabel(r){
  if(r.dept_id) return esc(deptName(r.dept_id));
  if(r.division_id) return esc(divisionName(r.division_id))+'<span class="bind-tag">สายงาน</span>';
  return '<span style="color:var(--c-mute-3)">—</span>';
}
function renderList(e){
  const list=getList(e).slice().sort((a,b)=>String(a.code).localeCompare(String(b.code)));
  let body;
  if(!list.length){ body=emptyState('ลองปรับตัวกรอง หรือกดปุ่มเพิ่มด้านบน'); }
  else if(e==='department'){
    body='<div class="table-scroll"><table class="table"><thead><tr><th>รหัส</th><th>ชื่อแผนก</th><th>สายงาน</th><th>แผนกแม่</th><th>สาขา</th><th>หัวหน้า</th><th>สถานะ</th><th style="text-align:right">จัดการ</th></tr></thead><tbody>'+
      list.map(r=>trOpen('department',r.id)+'<td class="code-cell">'+esc(r.code)+'</td><td>'+nameCell('department',r)+'</td><td class="muted-cell">'+deptDivLabel(r)+'</td><td class="muted-cell">'+(r.parent_id?esc(deptName(r.parent_id)):'<span style="color:var(--c-mute-3)">—</span>')+'</td><td class="muted-cell">'+esc(branchName(r.branch_id))+'</td><td class="muted-cell">'+esc(r.head||'—')+'</td><td>'+statusPill(r.active)+'</td><td style="text-align:right">'+rowActions('department',r.id,r.active)+'</td></tr>').join('')+
      '</tbody></table></div>';
  } else {
    body='<div class="table-scroll"><table class="table"><thead><tr><th>รหัส</th><th>ชื่อตำแหน่ง</th><th>สายอาชีพ</th><th>ระดับ</th><th>สังกัด</th><th>รายงานต่อ</th><th>สถานะ</th><th style="text-align:right">จัดการ</th></tr></thead><tbody>'+
      list.map(r=>trOpen('position',r.id)+'<td class="code-cell">'+esc(r.code)+'</td><td>'+nameCell('position',r)+'</td><td class="track-tag">'+esc((TRACK_LABEL[r.track]||'').split(' (')[0])+'</td><td><span class="tier-badge '+tierClass(r.tier)+'">'+esc(r.tier)+'</span></td><td class="muted-cell">'+posBindLabel(r)+'</td><td class="muted-cell">'+(r.parent_id?esc(positionName(r.parent_id)):'<span style="color:var(--c-mute-3)">— สูงสุด</span>')+'</td><td>'+statusPill(r.active)+'</td><td style="text-align:right">'+rowActions('position',r.id,r.active)+'</td></tr>').join('')+
      '</tbody></table></div>';
  }
  return '<div class="card">'+filterBar(e, e==='department'?'ค้นหารหัส / ชื่อแผนก...':'ค้นหารหัส / ชื่อตำแหน่ง...')+body+listFooter(e,list.length)+'</div>';
}

function companyNode(){ return '<div class="node node-company"><div class="node-title">'+esc(state.company.name_th)+'</div><div class="node-sub">'+esc(state.company.name_en||state.company.code)+'</div></div>'; }
function divisionNodeBox(div){
  return '<div class="node node-div" onclick="openDetail(\'division\','+div.id+')">'+
    '<div class="node-title">'+esc(div.name_th)+'</div><div class="node-sub">'+esc(div.code)+'</div>'+
    (div.head?'<div class="node-meta"><i data-lucide="user" class="w-3 h-3"></i>'+esc(div.head)+'</div>':'')+'</div>';
}
function nodeBox(e,r){
  if(e==='department'){
    return '<div class="node node-dept" onclick="openDetail(\'department\','+r.id+')">'+
      '<div class="node-title">'+esc(r.name_th)+'</div><div class="node-sub">'+esc(r.code)+'</div>'+
      (r.head&&r.head!=='—'?'<div class="node-meta"><i data-lucide="user" class="w-3 h-3"></i>'+esc(r.head)+'</div>':'')+'</div>';
  }
  const bind = r.dept_id?deptName(r.dept_id):(r.division_id?divisionName(r.division_id):null);
  return '<div class="node node-pos" onclick="openDetail(\'position\','+r.id+')">'+
    '<div class="node-title">'+esc(r.name_th)+'</div>'+
    '<div class="node-badges"><span class="tier-badge '+tierClass(r.tier)+'">'+esc(r.tier)+'</span></div>'+
    (bind?'<div class="node-meta"><i data-lucide="network" class="w-3 h-3"></i>'+esc(bind)+'</div>':'')+'</div>';
}
function chartNode(e,r,vis){
  vis=vis||new Set(); if(vis.has(r.id)) return ''; vis.add(r.id);
  const kids=childrenOf(e,r.id).filter(k=>!vis.has(k.id));
  return '<li>'+nodeBox(e,r)+(kids.length?'<ul>'+kids.map(k=>chartNode(e,k,new Set(vis))).join('')+'</ul>':'')+'</li>';
}
function chartRoots(e){
  const rows=state[e]; const ids=new Set(rows.map(r=>r.id)); const seen=new Set(); const roots=[];
  function mark(r,vis){ if(vis.has(r.id))return; vis.add(r.id); seen.add(r.id); childrenOf(e,r.id).forEach(c=>mark(c,vis)); }
  rows.filter(r=> r.parent_id==null || !ids.has(r.parent_id)).sort((a,b)=>(a.seq||0)-(b.seq||0)).forEach(r=>{ if(!seen.has(r.id)){ roots.push(r); mark(r,new Set()); } });
  rows.slice().sort((a,b)=>a.id-b.id).forEach(r=>{ if(!seen.has(r.id)){ roots.push(r); mark(r,new Set()); } });
  return roots;
}
function renderChart(e){
  const hint='<div class="chart-hint"><i data-lucide="info" class="w-3.5 h-3.5"></i>คลิกการ์ดเพื่อดูรายละเอียด · เลื่อนแนวนอนเพื่อดูทั้งผัง</div>';
  if(e==='department') return '<div class="chart-wrap">'+hint+renderDeptChart()+'</div>';
  const roots=chartRoots('position');
  const inner=roots.map(r=>chartNode('position',r,new Set())).join('');
  const chart='<div class="orgchart"><ul><li>'+companyNode()+(inner?'<ul>'+inner+'</ul>':'')+'</li></ul></div>';
  return '<div class="chart-wrap">'+hint+chart+'</div>';
}
function renderDeptChart(){
  const rows=state.department; const ids=new Set(rows.map(r=>r.id)); const seen=new Set();
  function mark(r,vis){ if(vis.has(r.id))return; vis.add(r.id); seen.add(r.id); childrenOf('department',r.id).forEach(c=>mark(c,vis)); }
  const tops=rows.filter(r=> r.parent_id==null || !ids.has(r.parent_id));
  const validDiv=id=> id!=null && state.division.some(v=>v.id===id);
  const divNodes=state.division.slice().sort((a,b)=>a.id-b.id).map(div=>{
    const dtops=tops.filter(d=> d.division_id===div.id).sort((a,b)=>(a.seq||0)-(b.seq||0));
    dtops.forEach(d=>mark(d,new Set()));
    const inner=dtops.map(d=>chartNode('department',d,new Set())).join('');
    return '<li>'+divisionNodeBox(div)+(inner?'<ul>'+inner+'</ul>':'')+'</li>';
  }).join('');
  const noDiv=tops.filter(d=> !validDiv(d.division_id)).sort((a,b)=>(a.seq||0)-(b.seq||0));
  noDiv.forEach(d=>mark(d,new Set()));
  const noDivNodes=noDiv.map(d=>chartNode('department',d,new Set())).join('');
  const leftover=rows.slice().sort((a,b)=>a.id-b.id).filter(r=>!seen.has(r.id));
  leftover.forEach(d=>mark(d,new Set()));
  const leftoverNodes=leftover.map(d=>chartNode('department',d,new Set())).join('');
  const childrenHtml=divNodes+noDivNodes+leftoverNodes;
  return '<div class="orgchart"><ul><li>'+companyNode()+(childrenHtml?'<ul>'+childrenHtml+'</ul>':'')+'</li></ul></div>';
}

function onCompanyLogoPick(input){
  var f=input.files&&input.files[0]; if(!f) return;

  if(f.size>2*1024*1024){ showToast('ไฟล์ใหญ่เกิน 2MB','warning'); input.value=''; return; }
  var reader=new FileReader();
  reader.onload=function(ev){ state.companyLogoDraft=ev.target.result;
    var pv=document.getElementById('companyLogoPreview'); if(pv){ pv.innerHTML='<img src="'+state.companyLogoDraft+'" alt="logo">'; pv.classList.add('has-img'); }
    var rm=document.getElementById('btnRemoveLogo'); if(rm) rm.style.display='';
  };
  reader.readAsDataURL(f);
}

  var pv=document.getElementById('companyLogoPreview'); if(pv){ pv.innerHTML='<i data-lucide="building"></i>'; pv.classList.remove('has-img'); renderIcons(); }

// CSV EXPORT / IMPORT (Iron Rule #32)
// ============================================================
const CSV_COLS={
  division:['code','name_th','name_en','abbr','branch_code','head','deputy','email','cost_center','description','active'],
  department:['code','name_th','name_en','division_code','parent_code','branch_code','head','cost_center','email','ext','location','headcount','description','active'],
  position:['code','name_th','name_en','job_family','grade','track','tier','dept_code','division_code','reports_to_code','employment_type','headcount','salary_min','salary_max','job_desc','qualification','note','active']
};
function csvCell(v){ v=(v==null?'':String(v)); if(/[",\r\n]/.test(v)) return '"'+v.replace(/"/g,'""')+'"'; return v; }
function exportField(e,r,c){
  if(c==='active') return r.active?'true':'false';
  if(c==='branch_code') return codeOf('branch',r.branch_id);
  if(c==='division_code') return codeOf('division',r.division_id);
  if(c==='parent_code') return codeOf('department',r.parent_id);
  if(c==='dept_code') return codeOf('department',r.dept_id);
  if(c==='reports_to_code') return codeOf('position',r.parent_id);
  return r[c]!=null?r[c]:'';
}
function exportCsv(e){
  let cols, rows;
  if(e==='company'){ cols=Object.keys(state.company).filter(k=>k!=='active'); cols.push('active'); rows=[state.company]; }
  else if(e==='branch'){ cols=['code','name_th','name_en','type','manager','open_date','is_vat_branch','addr_no','addr_road','subdistrict','district','province','zip','phone','fax','email','note','active']; rows=state.branch; }
  else { cols=CSV_COLS[e]; rows=state[e]; }
  const lines=[cols.join(',')];
  rows.forEach(r=>lines.push(cols.map(c=>csvCell(e==='company'||e==='branch'?(c==='active'?(r.active?'true':'false'):(r[c]!=null?r[c]:'')):exportField(e,r,c))).join(',')));
  const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=e+'_export.csv'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
  showToast('Export '+e+' ('+rows.length+' รายการ) แล้ว','success');
}
function downloadTemplate(e){
  const cols=CSV_COLS[e]; const sample={};
  cols.forEach(c=>sample[c]='');
  sample.code=({division:'DIV-NEW',department:'DEP-NEW',position:'POS-NEW'})[e];
  sample.name_th='ตัวอย่าง'; sample.active='true';
  if(e==='position'){ sample.track='specialist'; sample.tier='S1'; }
  const lines=[cols.join(','),cols.map(c=>csvCell(sample[c])).join(',')];
  const blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=e+'_template.csv'; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}
function parseCsv(text){
  text=text.replace(/^\ufeff/,''); const rows=[]; let i=0,field='',row=[],inQ=false;
  while(i<text.length){ const ch=text[i];
    if(inQ){ if(ch==='"'){ if(text[i+1]==='"'){ field+='"'; i+=2; continue; } inQ=false; i++; continue; } field+=ch; i++; continue; }
    if(ch==='"'){ inQ=true; i++; continue; }
    if(ch===','){ row.push(field); field=''; i++; continue; }
    if(ch==='\r'){ i++; continue; }
    if(ch==='\n'){ row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
    field+=ch; i++;
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}
function normBool(v){ v=(v||'').trim().toLowerCase(); if(v==='')return true; return ['true','1','y','yes','ใช้งาน','active'].indexOf(v)>=0; }
function validateImport(e,text,mode){
  const rows=parseCsv(text);
  if(!rows.length) return {error:'ไฟล์ว่างเปล่า'};
  const header=rows[0].map(h=>h.trim()); const idx={}; header.forEach((h,k)=>idx[h]=k);
  const cols=CSV_COLS[e];
  const missing=['code','name_th'].filter(c=>!(c in idx));
  if(missing.length) return {error:'CSV ขาดคอลัมน์จำเป็น: '+missing.join(', ')+' (ดาวน์โหลด Template เพื่อดูรูปแบบ)'};
  const batchCodes=new Set(); for(let r=1;r<rows.length;r++){ const cd=(rows[r][idx['code']]||'').trim(); if(cd) batchCodes.add(cd); }
  const divCodes=new Set(state.division.map(x=>x.code));
  const brCodes=new Set(state.branch.map(x=>x.code));
  const deptCodes=new Set(state.department.map(x=>x.code));
  const posCodes=new Set(state.position.map(x=>x.code));
  const selfExisting=new Set(state[e].map(x=>x.code));
  const out=[]; let ok=0,fail=0;
  for(let r=1;r<rows.length;r++){
    const get=c=> (c in idx)? (rows[r][idx[c]]||'').trim() : '';
    const obj={}; cols.forEach(c=>obj[c]=get(c)); obj.active=normBool(get('active'));
    const errs=[];
    if(!obj.name_th) errs.push('ไม่มีชื่อ (name_th)');
    if(e==='position'){
      if(['management','specialist','operational'].indexOf(obj.track)<0) errs.push('track ไม่ถูกต้อง');
      else if(TIERS[obj.track].indexOf(obj.tier)<0) errs.push('tier "'+obj.tier+'" ไม่อยู่ในสาย '+obj.track);
      if(obj.dept_code && !deptCodes.has(obj.dept_code)) errs.push('ไม่พบแผนก '+obj.dept_code);
      if(obj.division_code && !divCodes.has(obj.division_code)) errs.push('ไม่พบสายงาน '+obj.division_code);
      if(obj.reports_to_code){ const set = mode==='merge'? new Set([...posCodes,...batchCodes]):batchCodes; if(obj.reports_to_code===obj.code) errs.push('รายงานต่อตัวเอง'); else if(!set.has(obj.reports_to_code)) errs.push('ไม่พบตำแหน่งหัวหน้า '+obj.reports_to_code); }
    }
    if(e==='department'){
      if(obj.division_code && !divCodes.has(obj.division_code)) errs.push('ไม่พบสายงาน '+obj.division_code);
      if(obj.branch_code && !brCodes.has(obj.branch_code)) errs.push('ไม่พบสาขา '+obj.branch_code);
      if(obj.parent_code){ const set= mode==='merge'? new Set([...deptCodes,...batchCodes]):batchCodes; if(obj.parent_code===obj.code) errs.push('แผนกแม่เป็นตัวเอง'); else if(!set.has(obj.parent_code)) errs.push('ไม่พบแผนกแม่ '+obj.parent_code); }
    }
    if(e==='division'){ if(obj.branch_code && !brCodes.has(obj.branch_code)) errs.push('ไม่พบสาขา '+obj.branch_code); }
    obj._ok=errs.length===0; obj._errs=errs; obj._row=r+1; obj._isUpdate=selfExisting.has(obj.code);
    if(obj._ok) ok++; else fail++;
    out.push(obj);
  }
  return {rows:out, ok, fail, total:out.length, mode};
}
function applyImport(){
  const d=state.modal.data; const e=d.entity; const res=d.result; if(!res||res.error) return;
  const valid=res.rows.filter(r=>r._ok);
  const hier=(e==='department'||e==='position');
  // assign ids
  let nextId=Math.max(0,...state[e].map(r=>r.id))+1;
  const codeToId={};
  if(d.mode==='replace'){
    valid.forEach(o=>{ codeToId[o.code]=nextId++; });
  } else {
    state[e].forEach(r=>{ codeToId[r.code]=r.id; });
    valid.forEach(o=>{ if(!(o.code in codeToId)) codeToId[o.code]=nextId++; });
  }
  function build(o){
    const rb={ id:codeToId[o.code], code:o.code, name_th:o.name_th, name_en:o.name_en, active:o.active };
    if(e==='division'){ Object.assign(rb,{abbr:o.abbr,branch_id:idByCode('branch',o.branch_code),head:o.head,deputy:o.deputy,email:o.email,cost_center:o.cost_center,description:o.description}); }
    if(e==='department'){ Object.assign(rb,{division_id:idByCode('division',o.division_code),branch_id:idByCode('branch',o.branch_code),head:o.head,cost_center:o.cost_center,email:o.email,ext:o.ext,location:o.location,headcount:o.headcount,description:o.description, parent_id: o.parent_code? (codeToId[o.parent_code]!=null?codeToId[o.parent_code]:idByCode('department',o.parent_code)) : null }); }
    if(e==='position'){ Object.assign(rb,{job_family:o.job_family,grade:o.grade,track:o.track,tier:o.tier,dept_id:idByCode('department',o.dept_code),division_id:idByCode('division',o.division_code),employment_type:o.employment_type,headcount:o.headcount,salary_min:o.salary_min,salary_max:o.salary_max,job_desc:o.job_desc,qualification:o.qualification,note:o.note, parent_id: o.reports_to_code? (codeToId[o.reports_to_code]!=null?codeToId[o.reports_to_code]:idByCode('position',o.reports_to_code)) : null }); }
    return rb;
  }
  if(d.mode==='replace'){
    state[e]=valid.map(build);
  } else {
    valid.forEach(o=>{ const built=build(o); const ex=state[e].find(x=>x.code===o.code); if(ex) Object.assign(ex,built); else state[e].push(built); });
  }
  if(hier){ // reseq siblings
    const groups={}; state[e].forEach(r=>{ const k=r.parent_id==null?'root':r.parent_id; (groups[k]=groups[k]||[]).push(r); });
    Object.keys(groups).forEach(k=>{ groups[k].forEach((r,i)=>{ if(!r.seq) r.seq=i+1; }); });
  }
  state.seq[e]=Math.max(state.seq[e], state[e].length);
  closeModal(); setTimeout(()=>{ render(); showToast((d.mode==='replace'?'แทนที่':'รวม')+'ข้อมูล '+e+' สำเร็จ '+valid.length+' รายการ','success'); },60);
}
function openImport(e){ state.modal={open:true,type:'import',data:{entity:e,mode:'replace',result:null,fileName:null}}; render(); requestAnimationFrame(()=>document.getElementById('modalBackdrop').classList.add('is-open')); }
function setImportMode(m){ state.modal.data.mode=m; if(state.modal.data._text) state.modal.data.result=validateImport(state.modal.data.entity,state.modal.data._text,m); render(); }
function handleCsvFile(input){
  const f=input.files&&input.files[0]; if(!f) return;
  const reader=new FileReader();
  reader.onload=function(ev){ const text=ev.target.result; state.modal.data._text=text; state.modal.data.fileName=f.name; state.modal.data.result=validateImport(state.modal.data.entity,text,state.modal.data.mode); render(); };
  reader.readAsText(f);
}
function renderImportModal(){
  const d=state.modal.data; const e=d.entity; const t=TABS.find(t=>t.id===e); const res=d.result;
  const modeSeg='<div class="seg"><button class="'+(d.mode==='replace'?'is-active':'')+'" onclick="setImportMode(\'replace\')">แทนที่ทั้งหมด (Replace)</button><button class="'+(d.mode==='merge'?'is-active':'')+'" onclick="setImportMode(\'merge\')">รวม/อัปเดต (Merge)</button></div>';
  let resultHtml='';
  if(res){
    if(res.error){ resultHtml='<div class="imp-errs"><b>ไฟล์ไม่ถูกต้อง:</b><div>'+esc(res.error)+'</div></div>'; }
    else {
      const errLines=res.rows.filter(r=>!r._ok).slice(0,30).map(r=>'<div>แถว '+r._row+' ('+esc(r.code||'-')+'): '+esc(r._errs.join(', '))+'</div>').join('');
      const preview=res.rows.slice(0,8).map(r=>'<tr><td>'+(r._ok?'<span class="pill pill-converted">ผ่าน</span>':'<span class="pill pill-danger">ไม่ผ่าน</span>')+'</td><td class="code-cell">'+esc(r.code||'—')+'</td><td>'+esc(r.name_th||'—')+'</td><td class="muted-cell">'+(r._isUpdate?'อัปเดต':'เพิ่มใหม่')+'</td></tr>').join('');
      resultHtml='<div class="imp-summary">'+
        '<div class="imp-stat ok"><div class="v">'+res.ok+'</div><div class="l">ผ่าน (จะนำเข้า)</div></div>'+
        '<div class="imp-stat fail"><div class="v">'+res.fail+'</div><div class="l">ไม่ผ่าน (ข้าม)</div></div>'+
        '<div class="imp-stat"><div class="v">'+res.total+'</div><div class="l">ทั้งหมด</div></div></div>'+
        (errLines?'<div class="imp-errs">'+errLines+(res.fail>30?'<div>… และอีก '+(res.fail-30)+' แถว</div>':'')+'</div>':'')+
        '<div class="imp-label">ตัวอย่าง (8 แถวแรก)</div><div class="preview-scroll"><table class="table"><thead><tr><th>สถานะ</th><th>รหัส</th><th>ชื่อ</th><th>การกระทำ</th></tr></thead><tbody>'+preview+'</tbody></table></div>'+
        (d.mode==='replace'?'<div class="imp-note" style="color:var(--c-warning)"><b>โหมดแทนที่:</b> ข้อมูล '+esc(t.th)+'เดิมทั้งหมด ('+state[e].length+' รายการ) จะถูกแทนที่ด้วยแถวที่ผ่าน '+res.ok+' รายการ</div>':'<div class="imp-note">โหมดรวม: จับคู่ด้วยรหัส — รหัสซ้ำ = อัปเดต, รหัสใหม่ = เพิ่ม</div>');
    }
  }
  const canApply = res && !res.error && res.ok>0;
  return '<div class="modal-header"><div class="modal-header-icon"><i data-lucide="upload" class="w-4 h-4"></i></div>'+
    '<div><h3 class="modal-title">นำเข้า'+esc(t.th)+' จาก CSV</h3><p class="modal-subtitle">อัปโหลดไฟล์ CSV (UTF-8) — ระบบจะตรวจสอบก่อนนำเข้า</p></div></div>'+
    '<div class="modal-body">'+
      '<div class="imp-block"><div class="imp-label">โหมดนำเข้า</div>'+modeSeg+'</div>'+
      '<div class="imp-block"><div class="imp-label">ไฟล์ CSV<button class="btn-link" onclick="downloadTemplate(\''+e+'\')"><i data-lucide="file-down" class="w-3.5 h-3.5"></i> ดาวน์โหลด Template</button></div>'+
        '<div class="imp-drop" onclick="document.getElementById(\'csvFile\').click()"><i data-lucide="upload-cloud" class="w-7 h-7"></i>'+
        '<div class="id-t">'+(d.fileName?esc(d.fileName):'คลิกเพื่อเลือกไฟล์ CSV')+'</div><div class="id-s">'+(d.fileName?'คลิกเพื่อเลือกไฟล์ใหม่':'รองรับไฟล์ .csv ที่ encode แบบ UTF-8')+'</div></div>'+
        '<input type="file" id="csvFile" accept=".csv,text/csv" style="display:none" onchange="handleCsvFile(this)">'+
        '<div class="imp-note">คอลัมน์อ้างอิงใช้ “รหัส” (เช่น division_code, parent_code) — Export CSV ออกมาแก้แล้วนำเข้ากลับได้</div></div>'+
      resultHtml+
    '</div>'+
    '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">ยกเลิก</button>'+
      '<button class="btn btn-primary '+(canApply?'':'is-dim')+'" '+(canApply?'onclick="applyImport()"':'')+'><i data-lucide="check" class="w-4 h-4"></i><span>นำเข้า '+(res&&!res.error?res.ok:0)+' รายการ</span></button></div>';
}

// ============================================================
// BASE HELPERS
// ============================================================
function renderIcons(){ if(window.lucide&&typeof window.lucide.createIcons==='function') window.lucide.createIcons(); }
function toggleModule(h){ const m=h.closest('.sb-module'); if(!m)return; const ex=m.getAttribute('data-expanded')!=='false'; m.setAttribute('data-expanded',ex?'false':'true'); }
function toggleUserMenu(){ document.getElementById('userMenu').classList.toggle('is-open'); }
document.addEventListener('click',e=>{ if(!e.target.closest('.user-chip')&&!e.target.closest('.user-menu')){ var um=document.getElementById('userMenu'); if(um) um.classList.remove('is-open'); } });

function parseHash(){ const h=location.hash.replace(/^#\//,''); if(!h) return {tab:'company',id:null}; const p=h.split('/'); return {tab:p[0], id:p[1]?parseInt(p[1],10):null}; }
function navigate(r){ location.hash='#/'+r; }
function applyRoute(){ const {tab,id}=parseHash(); state.route=TABS.some(t=>t.id===tab)?tab:'company'; state.detailId=(id!=null&&!isNaN(id))?id:null; render(); }

function openDrawer(entity,mode,id,parentId){ state.drawer={open:true,entity,mode,id:(id!=null?id:null),parentId:(parentId!=null?parentId:null)}; if(entity==='company') state.companyLogoDraft=state.company.logo_url||''; render();
  requestAnimationFrame(()=>{ document.getElementById('drawerBackdrop').classList.add('is-open'); document.getElementById('drawer').classList.add('is-open'); }); }
function closeDrawer(){ document.getElementById('drawerBackdrop').classList.remove('is-open'); document.getElementById('drawer').classList.remove('is-open');
  setTimeout(()=>{ state.drawer={open:false,entity:null,mode:null,id:null,parentId:null}; },280); }
function openModal(type,data){ state.modal={open:true,type,data}; render(); requestAnimationFrame(()=>document.getElementById('modalBackdrop').classList.add('is-open')); }
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('is-open'); setTimeout(()=>{ state.modal={open:false,type:null,data:null}; },200); }

function showToast(msg,variant,dur){ variant=variant||'info'; dur=dur||2800; const el=document.getElementById('toast');
  const ic={success:'check-circle-2',info:'info',warning:'alert-triangle',error:'x-circle'};
  el.className='toast is-'+variant; el.innerHTML='<i data-lucide="'+(ic[variant]||'info')+'" class="w-4 h-4"></i><span>'+msg+'</span>'; renderIcons();
  requestAnimationFrame(()=>el.classList.add('is-visible')); setTimeout(()=>el.classList.remove('is-visible'),dur); }

window.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(state.modal.open) closeModal(); else if(state.drawer.open) closeDrawer(); } });

function preserveRenderState(){ const db=document.querySelector('.drawer-body'),mb=document.querySelector('.modal-body'),ae=document.activeElement;
  const isI=ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA');
  return {drawerScroll:db?db.scrollTop:0,modalScroll:mb?mb.scrollTop:0,pageScroll:window.scrollY,focusKey:isI?{id:ae.id,selStart:ae.selectionStart,selEnd:ae.selectionEnd}:null}; }
function restoreRenderState(s){ if(!s)return; requestAnimationFrame(()=>{ const db=document.querySelector('.drawer-body'); if(db&&s.drawerScroll>0)db.scrollTop=s.drawerScroll;
  const mb=document.querySelector('.modal-body'); if(mb&&s.modalScroll>0)mb.scrollTop=s.modalScroll;
  if(s.pageScroll>0)window.scrollTo(0,s.pageScroll);
  if(s.focusKey&&s.focusKey.id){ const el=document.getElementById(s.focusKey.id); if(el){ el.focus(); try{ if(s.focusKey.selStart!=null&&el.setSelectionRange)el.setSelectionRange(s.focusKey.selStart,s.focusKey.selEnd);}catch(err){} } } }); }

window.addEventListener('hashchange',applyRoute);
var domReady=false,lucideReady=false;
function bootIfReady(){ if(domReady&&lucideReady){ applyRoute(); renderIcons(); } }
if(document.readyState==='loading') window.addEventListener('DOMContentLoaded',function(){domReady=true;bootIfReady();}); else domReady=true;
window.addEventListener('lucide:ready',function(){lucideReady=true;bootIfReady();});
if(window.lucide&&typeof window.lucide.createIcons==='function') lucideReady=true;
bootIfReady();
setTimeout(function(){ if(!lucideReady){ lucideReady=true; bootIfReady(); } },5000);

</script>
