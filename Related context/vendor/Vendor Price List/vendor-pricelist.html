function effUnit(p){return exTaxUnit(p)*(1-(Number(p.disc)||0)/100)+(Number(p.freight)||0);}  // landed ex-tax / 1 unit

// ====== STATE ======
const state={drawer:{open:false,mode:null,id:null,tab:'overview',step:1},modal:{open:false,type:null,id:null},
  filters:{search:'',product:'all',vendor:'all',status:'all'},pagination:{page:1,pageSize:20},sort:{col:'vendor',dir:'asc'},form:{},compare:{qty:'1'},batch:{rows:[],vendor:'',from:'2026-06-01'},view:'vendor'};

// ====== HELPERS ======
function rec(id){return RAW.find(x=>x.id===id);}
function statusLabel(s){return {draft:'ร่าง',active:'ใช้งาน',inactive:'ปิดใช้งาน',pending_approval:'รออนุมัติราคา'}[s]||s;}
function statusPill(s){return {draft:'pill-inactive',active:'pill-active',inactive:'pill-blocked',pending_approval:'pill-tier'}[s]||'pill-inactive';}
function ptLabel(p){return {flat:'ราคาเดียว',tier:'ขั้นบันได',contract:'สัญญา',spot:'spot',formula:'สูตร'}[p]||p;}
function ptPill(p){return {flat:'pill-flat',tier:'pill-tier',contract:'pill-contract'}[p]||'pill-flat';}
function fmtMoney(n,c){return (n==null)?'—':Number(n).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2})+' '+(c||'THB');}
const canSeePricing=['procurement_officer','procurement_manager','procurement_director','finance','admin'].includes(ROLE); // price = Confidential (align Product/Vendor Master)
function maskMoney(n,c){return canSeePricing?fmtMoney(n,c):'•••';}
function fmtNum(n){return (n==null)?'—':Number(n).toLocaleString('th-TH',{maximumFractionDigits:2});}
function fmtDate(d){if(!d)return 'ไม่มีกำหนด';return new Date(d).toLocaleDateString('th-TH',{year:'2-digit',month:'short',day:'numeric'});}
function fmtDateTime(iso){if(!iso)return '—';return new Date(iso).toLocaleString('th-TH',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function inValidity(p){const f=new Date(p.from);const u=p.until?new Date(p.until):null;return f<=NOW&&(!u||NOW<=u);}
function activePrices(r){return (r.prices||[]).filter(p=>p.status!=='pending'&&inValidity(p));}
function priceAt(r,qty){const ps=activePrices(r).filter(p=>qty>=p.min&&(p.max==null||qty<=p.max));if(!ps.length)return null;ps.sort((a,b)=>a.price-b.price);return ps[0];}
function currentPrice(r){return priceAt(r,r.moq||1);}
function pctChange(oldP,newP){return oldP?((newP-oldP)/oldP*100):0;}

function getFiltered(){let a=RAW.slice();const f=state.filters;
  if(f.product!=='all')a=a.filter(r=>r.product===f.product);
  if(f.vendor!=='all')a=a.filter(r=>r.vendor===f.vendor);
  if(f.status!=='all')a=a.filter(r=>r.status===f.status);
  if(f.search){const q=f.search.toLowerCase();a=a.filter(r=>(r.code||'').toLowerCase().includes(q)||vName(r.vendor).toLowerCase().includes(q)||pName(r.product).toLowerCase().includes(q));}
  const c=state.sort.col,dir=state.sort.dir==='asc'?1:-1;
  a.sort((x,y)=>{if(c==='price'){const cx=currentPrice(x),cy=currentPrice(y);const px=cx?effUnit(cx):0,py=cy?effUnit(cy):0;return (px-py)*dir;}let vx=c==='vendor'?vName(x.vendor):(c==='product'?pName(x.product):x[c]||'');let vy=c==='vendor'?vName(y.vendor):(c==='product'?pName(y.product):y[c]||'');return String(vx).localeCompare(String(vy),'th')*dir;});
  return a;}
function getPaginated(){const all=getFiltered();const{page,pageSize}=state.pagination;const s=(page-1)*pageSize;return{records:all.slice(s,s+pageSize),total:all.length,page,totalPages:Math.max(1,Math.ceil(all.length/pageSize)),start:all.length===0?0:s+1,end:Math.min(s+pageSize,all.length)};}

// ====== ACTIONS ======
function applyFilter(k,v){state.filters[k]=v;state.pagination.page=1;render();}
function resetFilters(){state.filters={search:'',product:'all',vendor:'all',status:'all'};state.pagination.page=1;render();showToast('รีเซ็ตตัวกรองแล้ว','info');}
function sortBy(c){if(state.sort.col===c)state.sort.dir=state.sort.dir==='asc'?'desc':'asc';else{state.sort.col=c;state.sort.dir='asc';}render();}
function goToPage(n){const{totalPages}=getPaginated();if(n<1||n>totalPages)return;state.pagination.page=n;render();}
function setPageSize(v){state.pagination.pageSize=+v;state.pagination.page=1;render();}
function toggleModule(h){const m=h.closest('.sb-module');if(!m)return;const ex=m.getAttribute('data-expanded')!=='false';m.setAttribute('data-expanded',ex?'false':'true');}
function toggleUserMenu(){document.getElementById('userMenu').classList.toggle('is-open');}
document.addEventListener('click',e=>{if(!e.target.closest('.user-chip')&&!e.target.closest('.user-menu'))document.getElementById('userMenu')?.classList.remove('is-open');});
function toggleNotif(){showToast('มี 1 รายการรออนุมัติราคา · 1 ราคาหมดอายุ','info');}

function openDrawer(mode,id,prefV){
  if(!canManage&&mode!=='view'){showToast('ไม่มีสิทธิ์ดำเนินการ','error');return;}
  let form={};
  if(mode==='create')form={vendor:prefV||'',product:'',code:'',uom:'',currency:prefV?vCurrency(prefV):'THB',priceType:'flat',tiers:[{min:'1',max:'',price:''}],price_per:1,tax:'VAT7',incl:false,disc:0,freight:0,from:'2026-06-01',until:'',_vlock:!!prefV};
  else if(mode==='edit'){const r=rec(id);form={vendor:r.vendor,product:r.product,code:r.code,uom:r.uom,currency:r.currency,priceType:r.priceType};}
  state.drawer={open:true,mode,id,tab:'overview',step:1};state.form=form;render();
  requestAnimationFrame(()=>{document.getElementById('drawerBackdrop').classList.add('is-open');document.getElementById('drawer').classList.add('is-open');});
}
function closeDrawer(){closeCombos();document.getElementById('drawerBackdrop').classList.remove('is-open');document.getElementById('drawer').classList.remove('is-open');setTimeout(()=>{state.drawer={open:false,mode:null,id:null,tab:'overview',step:1};render();},280);}
function setTab(t){state.drawer.tab=t;render();}
function captureForm(){const g=id=>document.getElementById(id);const f=state.form;
  ['code','from','until','moq','mpq','lead'].forEach(k=>{if(g('f-'+k))f[k]=g('f-'+k).value;});
  if(g('f-price-per'))f.price_per=g('f-price-per').value;if(g('f-disc'))f.disc=g('f-disc').value;if(g('f-freight'))f.freight=g('f-freight').value;if(g('f-tax'))f.tax=g('f-tax').value;
  if(g('f-vendor'))f.vendor=g('f-vendor').value;if(g('f-product'))f.product=g('f-product').value;if(g('f-uom'))f.uom=g('f-uom').value;if(g('f-currency'))f.currency=g('f-currency').value;if(g('f-priceType'))f.priceType=g('f-priceType').value;
  if(f.tiers){f.tiers.forEach((t,i)=>{if(g('tier-min-'+i))t.min=g('tier-min-'+i).value;if(g('tier-max-'+i))t.max=g('tier-max-'+i).value;if(g('tier-price-'+i))t.price=g('tier-price-'+i).value;});}}
function setProduct(){captureForm();const p=pById(state.form.product);if(p){const bu=pBuyUoms(p.id);state.form.uom=bu.includes(p.baseUom)?p.baseUom:(bu[0]||'');state.form.tax=pVatGroup(p.id);}render();}
function setVendor(){captureForm();const v=vById(state.form.vendor);if(v)state.form.currency=v.currency;render();}
function setPriceType(){captureForm();const f=state.form;if(f.priceType==='flat')f.tiers=[{min:'1',max:'',price:f.tiers[0]?f.tiers[0].price:''}];render();}
function addTier(){captureForm();state.form.tiers.push({min:'',max:'',price:''});render();}
function removeTier(i){captureForm();if(state.form.tiers.length>1)state.form.tiers.splice(i,1);render();}
function toggleIncl(){captureForm();state.form.incl=!state.form.incl;render();}
function validateTiers(tiers){const ts=tiers.map(t=>({min:parseFloat(t.min),max:t.max===''||t.max==null?null:parseFloat(t.max),price:parseFloat(t.price)}));
  for(const t of ts){if(!(t.price>0))return{ok:false,msg:'ราคาต้องมากกว่า 0'};if(isNaN(t.min))return{ok:false,msg:'ระบุปริมาณขั้นต่ำ'};if(t.max!=null&&!(t.max>t.min))return{ok:false,msg:'ปริมาณสูงสุดต้องมากกว่าขั้นต่ำ'};}
  const sorted=ts.slice().sort((a,b)=>a.min-b.min);
  for(let i=0;i<sorted.length-1;i++){const cur=sorted[i],nx=sorted[i+1];if(cur.max==null||cur.max>=nx.min)return{ok:false,msg:'ช่วงปริมาณ (tier) ซ้อนทับกัน'};}
  return{ok:true,tiers:ts};}
function nextStep(){captureForm();const f=state.form;const s=state.drawer.step;
  if(s===1){if(!f.vendor){showToast('กรุณาเลือกคู่ค้า','warning');return;}if(!f.product){showToast('กรุณาเลือกสินค้า','warning');return;}
    if(RAW.some(r=>r.vendor===f.vendor&&r.product===f.product&&r.id!==state.drawer.id)){showToast('มีรายการคู่ค้า–สินค้านี้แล้ว','error');return;}}
  if(s===2){const v=validateTiers(f.tiers);if(!v.ok){showToast(v.msg,'error');return;}if(!f.from){showToast('กรุณาระบุวันเริ่มราคา','warning');return;}}
  state.drawer.step=Math.min(2,s+1);render();}
function prevStep(){captureForm();state.drawer.step=Math.max(1,state.drawer.step-1);render();}
function saveForm(){captureForm();const f=state.form;
  if(state.drawer.mode==='edit'){const r=rec(state.drawer.id);Object.assign(r,{code:f.code,uom:f.uom,currency:f.currency,version:r.version+1});showToast('บันทึกการแก้ไขแล้ว','success');closeDrawer();return;}
  const v=validateTiers(f.tiers);if(!v.ok){showToast(v.msg,'error');return;}
  if(!f.from){showToast('กรุณาระบุวันเริ่มราคา','warning');return;}
  const prices=v.tiers.map(t=>({min:t.min,max:t.max,price:t.price,price_per:+f.price_per||1,disc:+f.disc||0,freight:+f.freight||0,tax:f.tax||'VAT7',incl:!!f.incl,from:f.from,until:f.until||null,status:'active',priceType:f.priceType}));
  RAW.unshift(mk({id:'VI'+Date.now(),vendor:f.vendor,product:f.product,code:f.code,uom:f.uom,currency:f.currency,priceType:f.priceType,status:'active',createdBy:CURRENT_USER,created:new Date().toISOString(),prices}));
  showToast('สร้างรายการราคาคู่ค้าแล้ว','success');closeDrawer();}

function openModal(type,id){state.modal={open:true,type,id};if(type==='compare')state.compare={qty:'1'};render();requestAnimationFrame(()=>document.getElementById('modalBackdrop').classList.add('is-open'));}
function closeModal(){closeCombos();document.getElementById('modalBackdrop').classList.remove('is-open');setTimeout(()=>{state.modal={open:false,type:null,id:null};render();},200);}
function confirmPriceChange(){const r=rec(state.modal.id);const newP=parseFloat(document.getElementById('pc-price').value);
  if(!(newP>0)){showToast('ราคาต้องมากกว่า 0','error');return;}
  const cur=currentPrice(r);const oldP=cur?cur.price:0;const pct=pctChange(oldP,newP);
  if(GATE_ON&&pct>THRESHOLD){r.status='pending_approval';r.pending={old:oldP,new:newP,pct:Math.round(pct*10)/10,by:CURRENT_USER,reason:document.getElementById('pc-reason')?.value||''};closeModal();showToast('ราคาขึ้น '+pct.toFixed(1)+'% (> '+THRESHOLD+'%) — ส่งอนุมัติ','warning');render();return;}
  applyNewPrice(r,oldP,newP,CURRENT_USER,document.getElementById('pc-reason')?.value||'');closeModal();showToast('ปรับราคาแล้ว ('+(pct>=0?'+':'')+pct.toFixed(1)+'%)','success');}
function applyNewPrice(r,oldP,newP,by,reason){const cur=currentPrice(r);if(cur)cur.price=newP;else if(r.prices[0])r.prices[0].price=newP;r.history.unshift({old:oldP,new:newP,pct:Math.round(pctChange(oldP,newP)*10)/10,by,at:new Date().toISOString(),reason:reason||'-'});r.version++;}
function confirmApprove(){const r=rec(state.modal.id);
  if(!canApprove){showToast('ไม่มีสิทธิ์อนุมัติ','error');return;}
  if(r.pending&&r.pending.by===CURRENT_USER){showToast('ผู้อนุมัติต้องไม่ใช่ผู้สร้างคำขอ (SoD)','error');return;}
  applyNewPrice(r,r.pending.old,r.pending.new,r.pending.by,r.pending.reason);r.status='active';r.pending=null;closeModal();closeDrawer();showToast('อนุมัติการเปลี่ยนราคาแล้ว','success');}
function confirmReject(){const reason=document.getElementById('rej-reason')?.value.trim();if(!reason){showToast('กรุณาระบุเหตุผล','warning');return;}const r=rec(state.modal.id);r.status='active';r.pending=null;closeModal();closeDrawer();showToast('ตีกลับคำขอเปลี่ยนราคาแล้ว','info');}
function setCompareQty(v){state.compare.qty=v;render();}

// ====== RENDER LIST ======
function setView(v){state.view=v;render();}
function goBatchVendor(vid){if(!canManage)return;state.batch.vendor=vid;state.batch.rows=[blankBatchRow(),blankBatchRow(),blankBatchRow()];navigate('vendor-pricelist/batch');}
function rowHtml(r,grouped){const cp=currentPrice(r);return `<tr onclick="openDrawer('view','${r.id}')">
  <td>${grouped?`<div style="padding-left:8px;font-weight:500;">${pName(r.product)} <span style="color:var(--c-mute-2);font-size:11px;">${pCode(r.product)}</span></div>`:`<div class="user-cell"><div class="uc-avatar">${pName(r.product).slice(0,2)}</div><div><div class="uc-name">${pName(r.product)}</div><div class="uc-email">${vCode(r.vendor)} · ${vName(r.vendor)}</div></div></div>`}</td>
  <td style="font-variant-numeric:tabular-nums;">${r.code||'—'}</td>
  <td>${r.uom}</td>
  <td class="num">${cp?`<div style="font-weight:600;">${maskMoney(effUnit(cp),r.currency)}<span style="font-weight:400;color:var(--c-mute-2);font-size:11px;">/${r.uom}</span></div>${(canSeePricing&&hasCond(cp))?`<div style="font-size:10px;color:var(--c-mute-2);">ตั้ง ${fmtNum(cp.price)}${pp(cp)!==1?'/'+fmtNum(pp(cp)):''}${cp.disc?' · -'+cp.disc+'%':''}${cp.freight?' · +ขนส่ง'+fmtNum(cp.freight):''}</div>`:''}`:'<span style="color:var(--c-danger);font-size:12px;">หมดอายุ/ไม่มีราคา</span>'}</td>
  <td><span class="pill ${ptPill(r.priceType)}">${ptLabel(r.priceType)}${r.priceType==='tier'?' ('+r.prices.length+')':''}</span></td>
  <td><span class="pill ${statusPill(r.status)}">${statusLabel(r.status)}</span></td>
  <td onclick="event.stopPropagation()" style="text-align:right;"><div class="row-actions">
    <button class="ra-btn" onclick="openDrawer('view','${r.id}')" title="ดู"><i data-lucide="eye" class="w-4 h-4"></i></button>
    <button class="ra-btn" onclick="openModal('compare','${r.id}')" title="เทียบราคา"><i data-lucide="git-compare" class="w-4 h-4"></i></button>
    ${canManage&&r.status!=='inactive'&&r.status!=='pending_approval'?`<button class="ra-btn" onclick="openDrawer('edit','${r.id}')" title="แก้ไข"><i data-lucide="pencil" class="w-4 h-4"></i></button>`:''}
    ${canApprove&&r.status==='pending_approval'?`<button class="ra-btn is-success" onclick="openModal('approve','${r.id}')" title="อนุมัติราคา"><i data-lucide="check-circle-2" class="w-4 h-4"></i></button>`:''}
  </div></td></tr>`;}
function renderListBody(){return state.view==='vendor'?renderVendorList():renderFlatBody();}
function renderFlatBody(){const pg=getPaginated();const sa=c=>state.sort.col===c?(state.sort.dir==='asc'?'↑':'↓'):'↕';const sc=c=>state.sort.col===c?'is-sorted':'';
  return `<div class="table-scroll"><table class="table"><thead><tr>
    <th class="is-sortable ${sc('product')}" onclick="sortBy('product')">คู่ค้า – สินค้า <span class="sort-arrow">${sa('product')}</span></th>
    <th>รหัส vendor</th><th>หน่วย</th>
    <th class="is-sortable ${sc('price')} num" onclick="sortBy('price')">ราคาปัจจุบัน <span class="sort-arrow">${sa('price')}</span></th>
    <th>ประเภท</th>
    <th class="is-sortable ${sc('status')}" onclick="sortBy('status')">สถานะ <span class="sort-arrow">${sa('status')}</span></th>
    <th style="width:130px;text-align:right;"></th></tr></thead><tbody>
    ${pg.records.length===0?`<tr><td colspan="7"><div class="empty"><div class="empty-icon"><i data-lucide="tags" class="w-5 h-5"></i></div><div class="empty-title">ไม่พบรายการราคา</div><div class="empty-desc">ลองปรับตัวกรองหรือเพิ่มรายการใหม่</div></div></td></tr>`:pg.records.map(r=>rowHtml(r,false)).join('')}
    </tbody></table></div>
    <div class="table-footer"><div><select class="select" style="height:30px;font-size:12.5px;padding:0 28px 0 10px;width:auto;" onchange="setPageSize(this.value)"><option value="10"${state.pagination.pageSize===10?' selected':''}>10 / หน้า</option><option value="20"${state.pagination.pageSize===20?' selected':''}>20 / หน้า</option><option value="50"${state.pagination.pageSize===50?' selected':''}>50 / หน้า</option></select></div>
    <div style="display:flex;align-items:center;gap:16px;"><span>${pg.start} – ${pg.end} จาก ${pg.total} รายการ</span>
    <div class="pagination"><button class="pg-btn ${pg.page===1?'is-disabled':''}" onclick="goToPage(${pg.page-1})"><i data-lucide="chevron-left" class="w-3 h-3"></i></button>
    ${Array.from({length:pg.totalPages},(_,i)=>i+1).map(n=>`<button class="pg-btn ${n===pg.page?'is-active':''}" onclick="goToPage(${n})">${n}</button>`).join('')}
    <button class="pg-btn ${pg.page===pg.totalPages?'is-disabled':''}" onclick="goToPage(${pg.page+1})"><i data-lucide="chevron-right" class="w-3 h-3"></i></button></div></div></div>`;}
function vendorSummaries(){const m={};VENDORS.forEach(v=>{m[v.id]={v,items:[]};});RAW.forEach(r=>{if(!m[r.vendor])m[r.vendor]={v:(vById(r.vendor)||{id:r.vendor,code:r.vendor,name:r.vendor,status:'unknown',currency:'THB',term:'—'}),items:[]};m[r.vendor].items.push(r);});
  return Object.values(m).filter(o=>o.v.status==='active'||o.items.length).sort((a,b)=>((b.v.status==='active')-(a.v.status==='active'))||vName(a.v.id).localeCompare(vName(b.v.id),'th'));}
function renderVendorList(){const list=vendorSummaries();
  return `<div class="table-scroll"><table class="table"><thead><tr>
    <th>คู่ค้า</th><th>สถานะ</th><th>สกุล</th><th>เงื่อนไขชำระ</th><th class="num">จำนวนสินค้า</th><th style="width:70px;text-align:right;"></th></tr></thead><tbody>
    ${list.length===0?`<tr><td colspan="6"><div class="empty"><div class="empty-icon"><i data-lucide="store" class="w-5 h-5"></i></div><div class="empty-title">ยังไม่มีคู่ค้า</div></div></td></tr>`:list.map(o=>{const v=o.v;const act=v.status==='active';const actItems=o.items.filter(x=>x.status==='active').length;return `<tr onclick="navigate('vendor-pricelist/v/${v.id}')">
      <td><div class="user-cell"><div class="uc-avatar"><i data-lucide="store" class="w-4 h-4"></i></div><div><div class="uc-name">${v.name}</div><div class="uc-email">${v.code}</div></div></div></td>
      <td><span class="pill ${act?'pill-active':'pill-blocked'}">${act?'active':(v.status==='blocked'?'ระงับ':(v.status==='blacklisted'?'บัญชีดำ':v.status))}</span></td>
      <td>${v.currency||'—'}</td>
      <td style="font-size:12px;">${v.term||'—'}</td>
      <td class="num">${fmtNum(o.items.length)}${o.items.length>actItems?`<span style="color:var(--c-mute-2);font-size:11px;"> (${actItems} active)</span>`:''}</td>
      <td onclick="event.stopPropagation()" style="text-align:right;"><button class="ra-btn" onclick="navigate('vendor-pricelist/v/${v.id}')" title="ดูรายการสินค้า"><i data-lucide="chevron-right" class="w-4 h-4"></i></button></td>
    </tr>`;}).join('')}
    </tbody></table></div>
    <div class="table-footer"><div style="color:var(--c-mute-2);font-size:12.5px;">${list.length} คู่ค้า · เลือกคู่ค้าเพื่อดู/จัดการรายการสินค้าและราคา</div></div>`;}
function renderVendorDetail(vid){const v=vById(vid);const items=RAW.filter(x=>x.vendor===vid);
  if(!v)return `<div class="ph"><div><h1 class="ph-title">ไม่พบคู่ค้า</h1></div><div class="ph-actions"><button class="btn btn-secondary" onclick="navigate('vendor-pricelist')">กลับ</button></div></div>`;
  const act=v.status==='active';
  return `
  <div class="ph"><div>
    <nav class="breadcrumb" style="margin-bottom:6px;"><a onclick="navigate('vendor-pricelist')">ราคาคู่ค้า</a><i data-lucide="chevron-right" class="w-3 h-3 sep"></i><span class="breadcrumb-current">${v.code}</span></nav>
    <div class="ph-title-row"><h1 class="ph-title">${v.name}</h1><span class="ph-count">${items.length} รายการ</span>${act?'':`<span class="pill pill-blocked">${v.status==='blacklisted'?'บัญชีดำ':'ระงับ'}</span>`}</div>

// ====== TOAST + RENDER + BOOT ======
function showToast(msg,variant='info',ms=2600){const el=document.getElementById('toast');const map={success:'check-circle-2',info:'info',warning:'alert-triangle',error:'x-circle'};el.className='toast is-'+variant;el.innerHTML=`<i data-lucide="${map[variant]||'info'}" class="w-4 h-4"></i><span>${msg}</span>`;renderIcons();requestAnimationFrame(()=>el.classList.add('is-visible'));setTimeout(()=>el.classList.remove('is-visible'),ms);}
// ====== BATCH ENTRY (full page) + CSV ======
function blankBatchRow(){const pv=state.batch&&state.batch.vendor;return{vendor:pv||'',product:'',code:'',uom:'',price:'',price_per:1,disc:0,freight:0,currency:pv?vCurrency(pv):'THB',tax:'VAT7',incl:false,moq:1,mpq:1,lead:7,from:(state.batch&&state.batch.from)||'2026-06-01',until:'',_err:'',_empty:true};}
function isBatchRowEmpty(r){const pv=state.batch&&state.batch.vendor;const vE=!r.vendor||r.vendor===pv;return vE&&!r.product&&!(r.price&&String(r.price).trim())&&!(r.code&&String(r.code).trim());}
function ensureBatch(){if(!state.batch.rows||!state.batch.rows.length)state.batch.rows=[blankBatchRow(),blankBatchRow(),blankBatchRow()];}
function goBatch(){if(!canManage){showToast('ไม่มีสิทธิ์ดำเนินการ','error');return;}ensureBatch();navigate('vendor-pricelist/batch');}
function batchCapture(){const g=id=>document.getElementById(id);state.batch.rows.forEach((r,i)=>{
  [['vendor','b-vendor-'],['product','b-product-'],['code','b-code-'],['uom','b-uom-'],['price','b-price-'],['price_per','b-per-'],['disc','b-disc-'],['freight','b-freight-'],['currency','b-cur-'],['tax','b-tax-'],['moq','b-moq-'],['lead','b-lead-'],['from','b-from-'],['until','b-until-']].forEach(p=>{const el=g(p[1]+i);if(el)r[p[0]]=el.value;});});}
function batchAddRow(){batchCapture();state.batch.rows.push(blankBatchRow());render();}
function batchRemoveRow(i){batchCapture();state.batch.rows.splice(i,1);if(!state.batch.rows.length)state.batch.rows=[blankBatchRow()];render();}
function batchClear(){state.batch.rows=[blankBatchRow(),blankBatchRow(),blankBatchRow()];render();showToast('ล้างตารางแล้ว','info');}
function batchVendor(i){batchCapture();const v=vById(state.batch.rows[i].vendor);if(v)state.batch.rows[i].currency=v.currency;render();}
function batchSetPageVendor(v){batchCapture();state.batch.vendor=v;if(v)state.batch.rows.forEach(r=>{r.vendor=v;r.currency=vCurrency(v);});render();}
function batchProduct(i){batchCapture();const r=state.batch.rows[i];const p=pById(r.product);if(p){const bu=pBuyUoms(p.id);r.uom=bu.includes(p.baseUom)?p.baseUom:(bu[0]||'');r.tax=p.vatGroup||'VAT7';}render();}
function batchRowError(r,idx){
  if(!r.vendor)return'เลือกคู่ค้า';
  if(!vActive(r.vendor))return'คู่ค้าไม่ active';
  if(!r.product)return'เลือกสินค้า';
  const p=pById(r.product);if(!p||!p.purchasable)return'สินค้าซื้อไม่ได้';
  if(r.uom&&!pBuyUoms(r.product).includes(r.uom))return'หน่วยไม่ใช่ buy UOM';
  if(!(parseFloat(r.price)>0))return'ราคาต้อง > 0';
  if(!(Number(r.price_per)>0))return'price-per > 0';
  const d=Number(r.disc);if(d<0||d>100)return'ส่วนลด 0–100%';
  if(Number(r.freight)<0)return'ค่าขนส่ง ≥ 0';
  if(!r.from)return'ระบุวันเริ่ม';
  if(r.until&&r.until<r.from)return'สิ้นสุด < เริ่ม';
  for(let j=0;j<state.batch.rows.length;j++){if(j!==idx){const o=state.batch.rows[j];if(o.vendor&&o.vendor===r.vendor&&o.product===r.product)return'ซ้ำในชุดนี้';}}
  if(RAW.some(x=>x.vendor===r.vendor&&x.product===r.product))return'มีรายการนี้อยู่แล้ว';
  return'';}
function batchEvalLive(){let ok=0,err=0;state.batch.rows.forEach((r,i)=>{if(isBatchRowEmpty(r)){r._empty=true;r._err='';}else{r._empty=false;r._err=batchRowError(r,i);r._err?err++:ok++;}});return{ok,err};}
function batchValidate(){batchCapture();const{ok,err}=batchEvalLive();render();showToast(err?('พบ '+err+' แถวมีปัญหา · ผ่าน '+ok):('ผ่านทั้งหมด '+ok+' แถว ✓'),err?'warning':'success');}
function batchSave(){batchCapture();const{ok,err}=batchEvalLive();render();
  if(err){showToast('ยังบันทึกไม่ได้ — แก้ '+err+' แถวที่มีปัญหา','error');return;}
  if(!ok){showToast('ไม่มีรายการให้บันทึก','warning');return;}
  let n=0;state.batch.rows.forEach(r=>{if(isBatchRowEmpty(r))return;const price=parseFloat(r.price);
    const prices=[{min:1,max:null,price,price_per:+r.price_per||1,disc:+r.disc||0,freight:+r.freight||0,tax:r.tax||'VAT7',incl:!!r.incl,from:r.from,until:r.until||null,status:'active',priceType:'flat'}];
    RAW.unshift(mk({id:'VI'+Date.now()+Math.floor(Math.random()*1000),vendor:r.vendor,product:r.product,code:r.code,uom:r.uom,currency:r.currency,priceType:'flat',moq:+r.moq||1,mpq:+r.mpq||1,lead:+r.lead||0,status:'active',createdBy:CURRENT_USER,created:new Date().toISOString(),prices}));n++;});
  const bv=state.batch.vendor;state.batch.rows=[blankBatchRow(),blankBatchRow(),blankBatchRow()];showToast('บันทึก '+n+' รายการราคาคู่ค้าแล้ว','success');navigate(bv?('vendor-pricelist/v/'+bv):'vendor-pricelist');}
function batchDownloadTemplate(){
  const head='vendor_code,product_code,vendor_item_code,uom,price,price_per,discount_pct,freight,currency,tax_code,moq,lead_days,valid_from,valid_until';
  const ex1='V-TH-MN-00001,RM-1001,STL-SS400-3,KG,25.00,1,3,0.50,THB,VAT7,100,14,2026-06-01,2026-12-31';
  const ex2='V-TH-TR-00003,PM-1001,IT-BOX-L,PCS,12.00,1,0,0,THB,VAT7,50,5,2026-06-01,';
  const csv=[head,ex1,ex2].join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='vendor_pricelist_template.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  showToast('ดาวน์โหลด template CSV แล้ว','info');}
function parseCsv(text){text=String(text).replace(/^\ufeff/,'').replace(/\r\n?/g,'\n');const lines=text.split('\n').filter(l=>l.trim().length);if(!lines.length)return[];
  const cut=l=>{const out=[];let cur='',q=false;for(let i=0;i<l.length;i++){const c=l[i];if(c==='"'){if(q&&l[i+1]==='"'){cur+='"';i++;}else q=!q;}else if(c===','&&!q){out.push(cur);cur='';}else cur+=c;}out.push(cur);return out.map(x=>x.trim());};
  const head=cut(lines[0]).map(h=>h.toLowerCase());const out=[];
  for(let i=1;i<lines.length;i++){const cells=cut(lines[i]);const o={};head.forEach((h,j)=>o[h]=cells[j]!==undefined?cells[j]:'');out.push(o);}return out;}
function batchUploadCsv(input){const file=input.files&&input.files[0];if(!file){return;}const reader=new FileReader();
  reader.onload=e=>{try{state.batch.vendor='';const recs=parseCsv(e.target.result);if(!recs.length){showToast('ไฟล์ว่างหรือรูปแบบไม่ถูกต้อง','error');return;}
    let unmatched=0;const rows=recs.map(o=>{const r=blankBatchRow();
      const v=VENDORS.find(x=>x.code===String(o.vendor_code||'').toUpperCase());if(v&&v.status==='active'){r.vendor=v.id;}else if(o.vendor_code){unmatched++;}
      const p=PRODUCTS.find(x=>x.code===String(o.product_code||'').toUpperCase());if(p&&p.purchasable){r.product=p.id;}else if(o.product_code){unmatched++;}
      r.code=o.vendor_item_code||'';
      r.uom=String(o.uom||'').toUpperCase()||(p?pBaseUom(p.id):'');
      r.price=o.price||'';r.price_per=o.price_per||1;r.disc=o.discount_pct||0;r.freight=o.freight||0;
      r.currency=String(o.currency||(v?v.currency:'THB')).toUpperCase();r.tax=String(o.tax_code||(p?p.vatGroup:'VAT7')).toUpperCase();
      r.moq=o.moq||1;r.lead=o.lead_days||7;r.from=o.valid_from||'2026-06-01';r.until=o.valid_until||'';
      r._empty=isBatchRowEmpty(r);return r;});
    state.batch.rows=rows.length?rows:[blankBatchRow()];batchEvalLive();render();
    showToast('นำเข้า '+rows.length+' แถว'+(unmatched?(' · ไม่พบใน master '+unmatched+' ค่า — ตรวจสอบ'):'')+' แล้วกดบันทึก',unmatched?'warning':'success');
  }catch(err){showToast('อ่าน CSV ไม่สำเร็จ','error');}};
  reader.readAsText(file,'utf-8');input.value='';}
function renderBatch(){ensureBatch();const rows=state.batch.rows;const{ok,err}=batchEvalLive();const locked=!!state.batch.vendor;
  const vOpts=fv=>VENDORS.filter(v=>v.status==='active').map(v=>`<option value="${v.id}"${fv===v.id?' selected':''}>${v.code} · ${v.name}</option>`).join('');
  const pOpts=fv=>PRODUCTS.filter(p=>p.purchasable).map(p=>`<option value="${p.id}"${fv===p.id?' selected':''}>${p.code} · ${p.name}</option>`).join('');
  const uOpts=(prod,fv)=>((prod?pBuyUoms(prod):[]).map(u=>`<option value="${u}"${fv===u?' selected':''}>${u}</option>`).join('')||'<option value=""></option>');
  const cOpts=fv=>CURR.map(c=>`<option value="${c}"${fv===c?' selected':''}>${c}</option>`).join('');
  const tOpts=fv=>TAX_CODES.map(t=>`<option value="${t.code}"${(fv||'VAT7')===t.code?' selected':''}>${t.code}</option>`).join('');
  return `
  <div class="ph"><div><div class="ph-title-row"><h1 class="ph-title">นำเข้ารายการราคาคู่ค้า (Batch)</h1><span class="ph-count">${rows.length} แถว</span></div>
    <p class="ph-sub">กรอกหลายรายการพร้อมกัน หรืออัปโหลด CSV · 1 แถว = 1 ราคา (flat) ต่อคู่ค้า–สินค้า · เพิ่ม tier ภายหลังได้</p></div>
    <div class="ph-actions">
      <button class="btn btn-secondary" onclick="batchDownloadTemplate()"><i data-lucide="download" class="w-4 h-4"></i><span>Template CSV</span></button>
      <button class="btn btn-secondary" onclick="document.getElementById('batchCsv').click()"><i data-lucide="upload" class="w-4 h-4"></i><span>อัปโหลด CSV</span></button>
      <input type="file" id="batchCsv" accept=".csv,text/csv" style="display:none;" onchange="batchUploadCsv(this)">
    </div></div>
  <div class="card" style="padding:0;overflow:hidden;">
    <div style="display:flex;align-items:center;gap:18px;padding:16px 20px;border-bottom:1px solid var(--c-line);flex-wrap:wrap;">
      <div style="display:flex;align-items:center;gap:8px;"><span style="font-size:12.5px;color:var(--c-mute);font-weight:600;white-space:nowrap;">คู่ค้า:</span>
        <div style="min-width:240px;">${comboField('batch-vendor',[{id:'',code:'',name:'— หลายคู่ค้า (อิสระ / CSV) —'}].concat(VENDORS.filter(v=>v.status==='active').map(v=>({id:v.id,code:v.code,name:v.name}))),state.batch.vendor,'ค้นหาคู่ค้า / เว้น = หลายคู่ค้า')}</div>
        ${locked?'<span class="pill pill-active" style="white-space:nowrap;">โหมดตามคู่ค้า</span>':''}</div>
      <div style="display:flex;align-items:center;gap:8px;"><span style="font-size:12.5px;color:var(--c-mute);font-weight:600;white-space:nowrap;">เริ่มใช้ราคา:</span>
        <input class="input" type="date" id="batch-from" value="${state.batch.from||'2026-06-01'}" onchange="batchSetFrom(this.value)" style="max-width:160px;height:34px;"></div>
      <span style="font-size:11.5px;color:var(--c-mute-2);flex:1;min-width:180px;">สกุลเงิน/ภาษี ตั้งให้อัตโนมัติ · ส่วนลด·ค่าขนส่ง·tier ปรับภายหลังรายตัวได้</span></div>
    <div style="display:flex;justify-content:flex-end;padding:14px 20px 4px;"><button class="btn btn-secondary btn-sm" onclick="batchAddRow()"><i data-lucide="plus" class="w-3.5 h-3.5"></i><span>เพิ่มแถว</span></button></div>
    <div class="batch-wrap"><table class="batch-table"><thead><tr>
      <th>#</th>${locked?'':'<th>คู่ค้า *</th>'}<th>สินค้า *</th><th>รหัส vendor</th><th>หน่วย</th><th>ราคา *</th><th style="width:46px;"></th>
    </tr></thead><tbody>
    ${rows.map((r,i)=>`<tr class="${(!r._empty&&r._err)?'is-err':''}">
      <td class="batch-rownum">${i+1}${(!r._empty&&r._err)?`<span title="${(r._err||'').replace(/"/g,'')}" style="color:var(--c-danger);margin-left:5px;cursor:help;font-weight:700;">!</span>`:''}</td>
      ${locked?'':`<td style="min-width:210px;">${comboField('b-vendor-'+i,VENDORS.filter(v=>v.status==='active').map(v=>({id:v.id,code:v.code,name:v.name})),r.vendor,'ค้นหาคู่ค้า...')}</td>`}
      <td style="min-width:240px;">${comboField('b-product-'+i,PRODUCTS.filter(p=>p.purchasable).map(p=>({id:p.id,code:p.code,name:p.name})),r.product,'ค้นหาสินค้า...')}</td>
      <td><input class="input" id="b-code-${i}" value="${r.code||''}" placeholder="SKU" style="min-width:130px;"></td>
      <td><select class="select" id="b-uom-${i}" ${r.product?'':'disabled'} style="min-width:90px;">${uOpts(r.product,r.uom)}</select></td>
      <td><input class="input" type="number" id="b-price-${i}" value="${r.price||''}" placeholder="0.00" style="min-width:110px;"></td>
      <td><button class="ra-btn is-danger" onclick="batchRemoveRow(${i})" title="ลบแถว"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td>
    </tr>`).join('')}
    </tbody></table></div>
    <div class="batch-foot">
      <button class="btn btn-ghost btn-sm" onclick="batchClear()"><i data-lucide="eraser" class="w-3.5 h-3.5"></i><span>ล้างตาราง</span></button>
      <div style="flex:1;font-size:12.5px;color:var(--c-mute-2);">${err?`<span style="color:var(--c-danger);font-weight:600;">${err} แถวมีปัญหา</span> · `:''}พร้อมบันทึก ${ok} แถว</div>
      <button class="btn btn-secondary" onclick="navigate('vendor-pricelist')">ยกเลิก</button>
      <button class="btn btn-primary" onclick="batchSave()"><i data-lucide="save" class="w-4 h-4"></i><span>บันทึกทั้งหมด</span></button>
    </div>
  </div>
  <p style="font-size:11.5px;color:var(--c-mute-2);margin-top:10px;line-height:1.6;"><i data-lucide="info" class="w-3 h-3"></i> UNIQUE(คู่ค้า–สินค้า) · ราคา>0 · เฉพาะคู่ค้า active + สินค้า purchasable · หน่วย = buy UOM ของสินค้า · แถวว่างจะถูกข้าม · ส่วนลด·ค่าขนส่ง·ภาษี·tier ปรับเพิ่มภายหลังรายตัว<br><b>CSV header:</b> vendor_code, product_code, vendor_item_code, uom, price, price_per, discount_pct, freight, currency, tax_code, moq, lead_days, valid_from, valid_until</p>`;
}

function comboField(key,opts,selId,ph){const sel=opts.find(o=>String(o.id)===String(selId));const lbl=sel?(sel.code?(sel.code+' · '+sel.name):sel.name):'';
  return `<div class="combo"><input class="input combo-input" id="${key}-search" autocomplete="off" placeholder="${ph||'พิมพ์ค้นหา...'}" value="${lbl}" oninput="comboFilter('${key}')" onfocus="comboOpen('${key}');this.select();" onclick="comboOpen('${key}')"><input type="hidden" id="${key}" value="${selId||''}"><div class="combo-panel" id="${key}-panel">${opts.map(o=>`<div class="combo-opt" data-text="${((o.code||'')+' '+o.name).toLowerCase()}" onmousedown="comboPick('${key}','${o.id}')">${o.code?o.code+' · '+o.name:o.name}</div>`).join('')}<div class="combo-empty" id="${key}-empty" style="display:none;">ไม่พบรายการ</div></div></div>`;}
function comboOpen(key){const inp=document.getElementById(key+'-search');const p=document.getElementById(key+'-panel');if(!inp||!p)return;closeCombos();if(p.parentElement!==document.body)document.body.appendChild(p);const r=inp.getBoundingClientRect();const w=Math.max(r.width,220);p.style.left=Math.min(r.left,window.innerWidth-w-12)+'px';p.style.top=(r.bottom+4)+'px';p.style.width=w+'px';p.style.display='block';comboFilter(key);}
function comboFilter(key){const s=document.getElementById(key+'-search');if(!s)return;const q=(s.value||'').toLowerCase().trim();const p=document.getElementById(key+'-panel');if(!p)return;let n=0;p.querySelectorAll('.combo-opt').forEach(o=>{const m=(o.getAttribute('data-text')||'').indexOf(q)>=0;o.style.display=m?'block':'none';if(m)n++;});const e=document.getElementById(key+'-empty');if(e)e.style.display=n?'none':'block';}
function closeCombos(){document.querySelectorAll('.combo-panel').forEach(p=>{p.style.display='none';});}
function comboPick(key,id){const h=document.getElementById(key);if(h)h.value=id;closeCombos();
  if(key==='f-product'){state.form.product=id;setProduct();}
  else if(key==='f-vendor'){state.form.vendor=id;setVendor();}
  else if(key==='batch-vendor'){batchSetPageVendor(id);}
  else if(key==='filt-product'){applyFilter('product',id);}
  else if(key==='filt-vendor'){applyFilter('vendor',id);}
  else if(key.indexOf('b-product-')===0){const i=+key.slice(10);if(state.batch.rows[i])state.batch.rows[i].product=id;batchProduct(i);}
  else if(key.indexOf('b-vendor-')===0){const i=+key.slice(9);if(state.batch.rows[i])state.batch.rows[i].vendor=id;batchVendor(i);}}
function batchSetFrom(v){batchCapture();state.batch.from=v;state.batch.rows.forEach(r=>{r.from=v;});render();}
window.addEventListener('scroll',function(){closeCombos();},true);
document.addEventListener('click',function(e){if(!e.target.closest('.combo')){closeCombos();}});
function render(){document.querySelectorAll('body > .combo-panel').forEach(p=>{p.remove();});const snap=preserveRenderState();const __r=getRoute();document.getElementById('page-content').innerHTML=(__r==='vendor-pricelist/batch')?renderBatch():(__r.indexOf('vendor-pricelist/v/')===0?renderVendorDetail(__r.slice(19)):renderList());document.getElementById('drawer').innerHTML=renderDrawer();document.getElementById('modalEl').innerHTML=renderModal();renderIcons();restoreRenderState(snap);}
function renderIcons(){if(window.lucide&&typeof window.lucide.createIcons==='function')window.lucide.createIcons();}
function preserveRenderState(){const db=document.querySelector('.drawer-body');const mb=document.querySelector('.modal-body');const a=document.activeElement;const isI=a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT');return{ds:db?db.scrollTop:0,ms:mb?mb.scrollTop:0,ps:window.scrollY,fk:isI?{id:a.id||'',ss:a.selectionStart,se:a.selectionEnd}:null};}
function restoreRenderState(s){if(!s)return;requestAnimationFrame(()=>{const db=document.querySelector('.drawer-body');if(db&&s.ds>0)db.scrollTop=s.ds;const mb=document.querySelector('.modal-body');if(mb&&s.ms>0)mb.scrollTop=s.ms;if(s.ps>0)window.scrollTo(0,s.ps);if(s.fk&&s.fk.id){const c=document.getElementById(s.fk.id);if(c){c.focus();if(s.fk.ss!=null&&c.setSelectionRange){try{c.setSelectionRange(s.fk.ss,s.fk.se);}catch(e){}}}}});}
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modal.open)closeModal();else if(state.drawer.open)closeDrawer();}});
// ====== HASH ROUTING (single-route SPA — refresh-safe) ======
function getRoute(){const h=location.hash;if(!h||h==='#'||h==='#/')return 'vendor-pricelist';return h.replace(/^#\//,'');}
function navigate(r){location.hash='#/'+r;}
if(!location.hash){try{history.replaceState(null,'','#/vendor-pricelist');}catch(e){location.hash='#/vendor-pricelist';}}
window.addEventListener('hashchange',function(){render();renderIcons();});
var domReady=false,lucideReady=false;function bootIfReady(){if(domReady&&lucideReady){render();renderIcons();}}
if(document.readyState==='loading'){window.addEventListener('DOMContentLoaded',function(){domReady=true;bootIfReady();});}else{domReady=true;}
window.addEventListener('lucide:ready',function(){lucideReady=true;bootIfReady();});
if(window.lucide&&typeof window.lucide.createIcons==='function'){lucideReady=true;}
bootIfReady();setTimeout(function(){if(!lucideReady){lucideReady=true;bootIfReady();}},5000);
</script>
</body>
</html>
