function findB(id){return (state.form.banks||[]).find(b=>b.id===id);}
function findC(id){return (state.form.contacts||[]).find(c=>c.id===id);}
// contacts
function addContact(){const l=state.form.contacts;l.push({id:nid('c_'),role:l.length?'sales':'primary',name:'',email:'',phone:''});render();}
function removeContact(id){const l=state.form.contacts;if(l.length<=1){showToast('ต้องมีผู้ติดต่ออย่างน้อย 1 ราย','warning');return;}state.form.contacts=l.filter(c=>c.id!==id);render();}
function setContact(id,f,v){const c=findC(id);if(!c)return;c[f]=v;if(f==='role')render();}
// addresses
function addAddress(){const l=state.form.addresses;const first=l.length===0;l.push({id:nid('a_'),label:first?'ที่อยู่หลัก':'ที่อยู่ #'+(l.length+1),line:'',province_code:'',district_code:'',subdistrict_code:'',postal:'',is_billing:first,is_primary_shipping:first});render();setTimeout(()=>{const t=document.querySelectorAll('[data-addr-line]');if(t.length)t[t.length-1].focus();},60);}
function removeAddress(id){const l=state.form.addresses;const rm=l.find(a=>a.id===id);state.form.addresses=l.filter(a=>a.id!==id);const left=state.form.addresses;if(rm&&left.length){if(rm.is_primary_shipping&&!left.some(a=>a.is_primary_shipping))left[0].is_primary_shipping=true;if(rm.is_billing&&!left.some(a=>a.is_billing))left[0].is_billing=true;}render();}
function setAddressLabel(id,v){const a=findA(id);if(a)a.label=v;}
function setAddressLine(id,v){const a=findA(id);if(a)a.line=v;}
function setAddrProvince(id,v){const a=findA(id);if(!a)return;a.province_code=v;a.district_code='';a.subdistrict_code='';a.postal='';render();}
function setAddrDistrict(id,v){const a=findA(id);if(!a)return;a.district_code=v;a.subdistrict_code='';a.postal='';render();}
function setAddrSubdistrict(id,v){const a=findA(id);if(!a)return;a.subdistrict_code=v;const sub=v?lookupSubdistrict(v):null;a.postal=sub?sub.postal_code:'';render();}
function setBillingAddress(id){state.form.addresses.forEach(a=>a.is_billing=(a.id===id));render();}
function setPrimaryShipping(id){state.form.addresses.forEach(a=>a.is_primary_shipping=(a.id===id));render();}
// banks
function addBank(){const l=state.form.banks;const first=l.length===0;l.push({id:nid('b_'),bank_code:'',acct:'',name:state.form.name||'',purpose:'standard',is_primary:first});render();}
function removeBank(id){const l=state.form.banks;const rm=l.find(b=>b.id===id);state.form.banks=l.filter(b=>b.id!==id);const left=state.form.banks;if(rm&&left.length&&rm.is_primary&&!left.some(b=>b.is_primary))left[0].is_primary=true;render();}
function setBank(id,f,v){const b=findB(id);if(!b)return;b[f]=(f==='acct')?v.replace(/\D/g,'').slice(0,15):v;}
function setBankCode(id,v){const b=findB(id);if(b){b.bank_code=v;render();}}
function setPrimaryBank(id){state.form.banks.forEach(b=>b.is_primary=(b.id===id));render();}

/* ====== VALIDATION (FN-04 validateVendor + step gates) ====== */
function validateStep(s){const f=state.form;const isOne=f.type==='OT';const id=state.drawer.id;
  if(s===1){
    if(!(f.name||'').trim()){showToast('กรุณากรอกชื่อตามกฎหมาย','warning');return false;}
    if(!isOne){
      if(!(f.tax||'').trim()){showToast('กรุณากรอกเลขประจำตัวผู้เสียภาษี','warning');return false;}
      if(!/^\d{13}$/.test(f.tax)){showToast('INVALID_TAX · เลขภาษีต้องเป็นตัวเลข 13 หลัก','error');return false;}
      if(!f._immutableTax&&RAW.some(r=>r.tax===f.tax&&r.country===f.country&&r.id!==id)){showToast('TAX_DUPLICATE · เลขภาษีซ้ำ — แนะนำ merge','error');return false;}
    }
  }
  if(s===2){
    const okContact=f.contacts.some(c=>(c.name||'').trim()&&(c.email||'').trim());
    if(!okContact){showToast('ต้องมีผู้ติดต่ออย่างน้อย 1 ราย (ชื่อ + อีเมล)','warning');return false;}
    const okAddr=f.addresses.some(a=>(a.line||'').trim()&&a.province_code&&a.subdistrict_code);
    if(!okAddr){showToast('ต้องมีที่อยู่อย่างน้อย 1 รายการ (ที่อยู่ + จังหวัด + ตำบล)','warning');return false;}
  }
  return true;
}
function nextStep(){captureForm();if(!validateStep(state.drawer.step))return;state.drawer.step=Math.min(3,state.drawer.step+1);render();}
function prevStep(){captureForm();state.drawer.step=Math.max(1,state.drawer.step-1);render();}

/* ====== PERSIST (FN-06 createVendor / FN-08 amendVendor) ====== */
function buildPayload(){const f=state.form;return{
  code:state.drawer.mode==='create'?genVendorCode(f.country,f.type):f.code,name:f.name,display:f.display,type:f.type,tax:f.type==='OT'?(f.tax||''):f.tax,vat:f.vat,companyReg:f.companyReg,country:f.country,currency:f.currency,
  term:f.term,wht:+f.wht||0,creditLimit:f.creditLimit===''?'':(+f.creditLimit||0),
  contacts:f.contacts.filter(c=>(c.name||'').trim()).map(c=>({role:c.role,name:c.name,email:c.email,phone:c.phone})),
  addresses:f.addresses.filter(a=>(a.line||'').trim()).map(a=>({label:a.label||'ที่อยู่',line:a.line,province:(lookupProvince(a.province_code)||{}).name_th||'',district:(lookupDistrict(a.district_code)||{}).name_th||'',subdistrict:(lookupSubdistrict(a.subdistrict_code)||{}).name_th||'',postal:a.postal||'',is_billing:!!a.is_billing,is_primary_shipping:!!a.is_primary_shipping})),
  banks:f.banks.filter(b=>(b.acct||'').trim()).map(b=>({bank:(lookupBank(b.bank_code)||{}).name_th||b.bank||'',bank_code:b.bank_code||'',acct:b.acct,name:b.name,purpose:b.purpose||'standard',primary:!!b.is_primary,verified:false})),
  attachments:(f.attachments||[]).map(a=>({id:a.id,name:a.name,size:a.size}))};}
function persist(targetStatus){const f=state.form;const p=buildPayload();
  if(state.drawer.mode==='create'){
    const nv=seedAudit(vendor(Object.assign({id:'V'+Date.now(),kyc:'pending',status:targetStatus,createdBy:U().uid,created:new Date().toISOString()},p)));
    RAW.unshift(nv);
  }else{
    const r=RAW.find(x=>x.id===state.drawer.id);
    Object.assign(r,p);
    if(r.kyc==='passed')r.tax=r.tax; // immutable already guarded in UI
    r.version+=1;
    r.audit.push({t:'แก้ไขข้อมูล (amend) · v'+r.version,by:U().name,at:new Date().toISOString(),v:''});
  }
}
function saveDraft(){captureForm();if(!(state.form.name||'').trim()){showToast('กรุณากรอกชื่อคู่ค้าก่อนบันทึกร่าง','warning');return;}
  persist(state.drawer.mode==='edit'?undefined:'prospect');showToast('บันทึกร่างแล้ว','info');closeDrawer();}
function submitForm(){captureForm();
  if(!validateStep(1))return;if(!validateStep(2))return;
  if(state.drawer.mode==='edit'){persist();showToast('บันทึกการแก้ไขแล้ว (version +1)','success');closeDrawer();return;}
  persist('pending_kyc');showToast('สร้างคู่ค้าแล้ว — ส่งเข้ากระบวนการ KYC','success');closeDrawer();}

/* ====== LIFECYCLE TRANSITIONS ====== */
// submit from view: prospect→pending_kyc ; pending_kyc(+kyc passed)→pending_approval (resolve DOA / ONETIME auto)
function submitFromView(id){const r=RAW.find(x=>x.id===id);if(!canSubmit()){showToast('ไม่มีสิทธิ์ส่ง','error');return;}
  if(r.status==='prospect'){r.status='pending_kyc';r.audit.push({t:'ส่งเข้ากระบวนการ KYC',by:U().name,at:new Date().toISOString(),v:''});render();showToast('ส่งเข้ากระบวนการ KYC','info');return;}
  if(r.status==='pending_kyc'){
    // FN-09 enforceKycGate
    if(r.kyc!=='passed'){showToast('KYC_NOT_PASSED · ต้องผ่าน KYC ก่อนส่งอนุมัติ','error');return;}
    // NOT_READY: ≥1 contact (email+phone) + ≥1 verified bank (paid vendor)
    if(!hasValidContact(r)){showToast('NOT_READY · ต้องมีผู้ติดต่อ (อีเมล+โทร) อย่างน้อย 1 ราย','warning');return;}
    if(paidVendorNeedsBank(r)&&!bankVerified(r)){showToast('NOT_READY · ต้องมีบัญชีธนาคารที่ยืนยันแล้วอย่างน้อย 1 บัญชี','warning');return;}
    const t=tierOf(r);
    if(t.auto){r.status='active';r.approvedBy='ระบบ (auto)';r.approvedAt=new Date().toISOString();r.audit.push({t:'อนุมัติอัตโนมัติ (ครั้งเดียว) → ใช้งาน',by:'ระบบ',at:r.approvedAt,v:'success'});render();showToast('ครั้งเดียว (One-time) — อนุมัติอัตโนมัติ → ใช้งาน','success');return;}
    r.approvalChain=newChain(r);r.status='pending_approval';const fst=currentStep(r);r.audit.push({t:'ส่งอนุมัติ — DOA chain '+(r.approvalChain.length)+' ขั้น',by:U().name,at:new Date().toISOString(),v:''});render();showToast('ส่งอนุมัติ — รอ '+(fst?fst.label:'ผู้อนุมัติ'),'success');return;
  }
}
function verifyBank(id,idx){const r=RAW.find(x=>x.id===id);
  if(!isFinance()){showToast('FORBIDDEN · ยืนยันบัญชีได้เฉพาะฝ่ายการเงิน','error');return;}
  r.banks[idx].verified=true;r.banks[idx].verified_at=new Date().toISOString();
  r.audit.push({t:'ยืนยันบัญชีธนาคาร ('+maskAcct(r.banks[idx].acct)+')',by:U().name,at:new Date().toISOString(),v:'warning'});
  showToast('ยืนยันบัญชีธนาคารแล้ว — PV gate ปลดล็อก','success');render();}
function modalUnblock(r){const ok=canBlock();return `<div class="modal-header"><div class="modal-header-icon" style="background:rgba(0,168,142,0.12);color:var(--c-teal);"><i data-lucide="rotate-ccw" class="w-5 h-5"></i></div>
  <div style="flex:1;"><h3 class="modal-title">ปลดบล็อกคู่ค้า</h3><p class="modal-subtitle">${r.code} · ${r.name}</p></div>
  <button class="icon-btn" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button></div>
  <div class="modal-body">
    <div class="info-box info-blue"><i data-lucide="info" class="w-3.5 h-3.5"></i><div>คู่ค้าจะกลับเป็น <strong>ใช้งาน (active)</strong> และออก PO/PV ได้อีกครั้ง</div></div>
    ${r.block?`<div class="field" style="margin-top:12px;"><label class="field-label">เหตุผลที่ถูกบล็อกเดิม</label><div style="padding:9px 12px;background:var(--c-bg-off);border-radius:8px;font-size:12.5px;color:var(--c-mute);">${esc(r.block)}</div></div>`:''}
    <div class="field" style="margin-top:12px;"><label class="field-label">เหตุผลที่ปลดบล็อก <span class="req">*</span></label><textarea class="input" id="ublk-reason" style="height:74px;padding:8px 12px;resize:vertical;" placeholder="ระบุเหตุผล..."></textarea></div>
  </div>
  <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>
    <button class="btn btn-primary" onclick="confirmUnblock()" ${ok?'':'style="opacity:.45;pointer-events:none;"'}><i data-lucide="rotate-ccw" class="w-4 h-4"></i><span>ปลดบล็อก</span></button></div>`;}
function confirmUnblock(){const r=RAW.find(x=>x.id===state.modal.id);if(!canBlock()){showToast('ไม่มีสิทธิ์','error');return;}
  const reason=(document.getElementById('ublk-reason')?.value||'').trim();if(!reason){showToast('REASON_REQUIRED · กรุณาระบุเหตุผล','warning');return;}
  r.status='active';r.block='';r.audit.push({t:'ปลดบล็อก → ใช้งาน — '+reason,by:U().name,at:new Date().toISOString(),v:'success'});
  closeModal();closeDrawer();showToast('ปลดบล็อกแล้ว → ใช้งาน','success');}

/* ====== MODALS (P-05 approve/reject · P-06 block/blacklist · API-10 KYC) ====== */
function openModal(type,id){state.modal={open:true,type,id};render();requestAnimationFrame(()=>document.getElementById('modalBackdrop').classList.add('is-open'));}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('is-open');setTimeout(()=>{state.modal={open:false,type:null,id:null};render();},200);}

function renderModal(){
  if(!state.modal.open)return '';const r=RAW.find(x=>x.id===state.modal.id);if(!r)return '';const t=tierOf(r);const ty=state.modal.type;
  if(ty==='approve')return modalApprove(r,t);
  if(ty==='reject')return modalReject(r);
  if(ty==='kyc')return modalKyc(r);
  if(ty==='unblock')return modalUnblock(r);
  return modalBlock(r,ty==='blacklist');
}
function modalApprove(r,t){
  const cs=currentStep(r);const c=r.approvalChain||[];const idx=cs?cs.seq:0;const tot=c.length;
  const kycOk=r.kyc==='passed';
  const sodOk=r.createdBy!==U().uid;          // FN-11 approver≠creator
  const roleOk=canApproveCurrent(r);          // role matches current DOA step (or director/admin override)
  const ready=hasValidContact(r)&&(!paidVendorNeedsBank(r)||bankVerified(r));
  const allOk=kycOk&&sodOk&&roleOk&&ready&&!!cs;
  const last=idx>=tot;
  return `<div class="modal-header"><div class="modal-header-icon" style="background:#D1FAE5;color:var(--c-success);"><i data-lucide="check-circle-2" class="w-5 h-5"></i></div>
    <div style="flex:1;"><h3 class="modal-title">อนุมัติคู่ค้า — ขั้น ${idx}/${tot}</h3><p class="modal-subtitle">${r.code} · ${r.name} — ต้องอนุมัติโดย ${cs?cs.label:'—'}</p></div>
    <button class="icon-btn" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button></div>
    <div class="modal-body">
      <div style="margin-bottom:10px;">
        <div class="guard-line"><i data-lucide="${kycOk?'check-circle-2':'x-circle'}" class="w-3.5 h-3.5 ${kycOk?'guard-ok':'guard-bad'}"></i><span>KYC ผ่าน (FN-09)</span></div>
        <div class="guard-line"><i data-lucide="${sodOk?'check-circle-2':'x-circle'}" class="w-3.5 h-3.5 ${sodOk?'guard-ok':'guard-bad'}"></i><span>SoD — ผู้อนุมัติ ≠ ผู้สร้าง (${r.createdBy===U().uid?'คุณเป็นผู้สร้าง':'ผ่าน'})</span></div>
        <div class="guard-line"><i data-lucide="${roleOk?'check-circle-2':'x-circle'}" class="w-3.5 h-3.5 ${roleOk?'guard-ok':'guard-bad'}"></i><span>สิทธิ์ตรงขั้น DOA (ต้อง ${cs?cs.label:'—'})</span></div>
        <div class="guard-line"><i data-lucide="${ready?'check-circle-2':'x-circle'}" class="w-3.5 h-3.5 ${ready?'guard-ok':'guard-bad'}"></i><span>ข้อมูลครบ (ผู้ติดต่อ + บัญชียืนยัน)</span></div>
      </div>
      ${!kycOk?`<div class="info-box info-red"><i data-lucide="shield-alert" class="w-3.5 h-3.5"></i><div><strong>KYC_NOT_PASSED</strong> — ต้องผ่าน KYC ก่อนอนุมัติ</div></div>`:
      !sodOk?`<div class="info-box info-red"><i data-lucide="user-x" class="w-3.5 h-3.5"></i><div><strong>SOD_VIOLATION</strong> — ผู้อนุมัติต้องไม่ใช่ผู้สร้างรายการ</div></div>`:
      !roleOk?`<div class="info-box info-red"><i data-lucide="lock" class="w-3.5 h-3.5"></i><div><strong>WRONG_APPROVER</strong> — ขั้นนี้ต้องอนุมัติโดย ${cs?cs.label:'—'}</div></div>`:
      !ready?`<div class="info-box info-amber"><i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i><div><strong>NOT_READY</strong> — ข้อมูลไม่ครบ (ต้องมีผู้ติดต่อ + บัญชีที่ยืนยันแล้ว)</div></div>`:
      `<div class="info-box info-green"><i data-lucide="check" class="w-3.5 h-3.5"></i><div>${last?'เป็นขั้นสุดท้าย — เมื่ออนุมัติ สถานะจะเป็น <strong>ใช้งาน (active)</strong>':'อนุมัติขั้นนี้แล้วจะส่งต่อไปยังขั้นถัดไป'} + บันทึก audit</div></div>`}
    </div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>
      <button class="btn btn-primary" onclick="confirmApprove()" ${allOk?'':'style="opacity:.45;pointer-events:none;"'}><i data-lucide="check" class="w-4 h-4"></i><span>${last?'อนุมัติ → ใช้งาน':'อนุมัติขั้นนี้'}</span></button></div>`;
}
function confirmApprove(){const r=RAW.find(x=>x.id===state.modal.id);const st=currentStep(r);
  if(r.kyc!=='passed'){showToast('KYC_NOT_PASSED','error');return;}
  if(r.createdBy===U().uid){showToast('SOD_VIOLATION · ผู้อนุมัติต้องไม่ใช่ผู้สร้าง','error');return;}
  if(!st){showToast('ไม่มีขั้นที่รออนุมัติ','warning');return;}
  if(!canApproveCurrent(r)){showToast('WRONG_APPROVER · ขั้นนี้ต้อง '+st.label,'error');return;}
  const now=new Date().toISOString();
  st.status='approved';st.approver=U().name;st.at=now;
  r.audit.push({t:'อนุมัติขั้น '+st.seq+' ('+st.label+')',by:U().name,at:now,v:'success'});
  if(chainDone(r)){r.status='active';r.approvedBy=U().name;r.approvedAt=now;r.audit.push({t:'อนุมัติครบทุกขั้น → ใช้งาน (active)',by:U().name,at:now,v:'success'});closeModal();closeDrawer();showToast('อนุมัติครบทุกขั้น — "'+r.code+'" → ใช้งาน','success');}
  else {const nx=currentStep(r);closeModal();render();showToast('อนุมัติขั้น '+st.seq+' แล้ว — รอ '+(nx?nx.label:'ขั้นต่อไป'),'success');}}
function modalReject(r){return `<div class="modal-header"><div class="modal-header-icon is-warning"><i data-lucide="corner-up-left" class="w-5 h-5"></i></div>
  <div style="flex:1;"><h3 class="modal-title">ตีกลับคู่ค้า</h3><p class="modal-subtitle">ส่ง ${r.code} กลับเป็นร่าง (draft)</p></div>
  <button class="icon-btn" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button></div>
  <div class="modal-body"><div class="field"><label class="field-label">เหตุผล <span class="req">*</span></label><textarea class="input" id="rej-reason" style="height:84px;padding:8px 12px;resize:vertical;" placeholder="ระบุเหตุผลการตีกลับ..."></textarea></div></div>
  <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-danger" onclick="confirmReject()"><i data-lucide="corner-up-left" class="w-4 h-4"></i><span>ตีกลับ</span></button></div>`;}
function confirmReject(){const reason=(document.getElementById('rej-reason')?.value||'').trim();if(!reason){showToast('REASON_REQUIRED · กรุณาระบุเหตุผล','warning');return;}
  const r=RAW.find(x=>x.id===state.modal.id);r.status='pending_kyc';r.approvalChain=[];r.audit.push({t:'ตีกลับ → รอ KYC — '+reason,by:U().name,at:new Date().toISOString(),v:'danger'});
  closeModal();closeDrawer();showToast('ตีกลับคู่ค้าแล้ว → รอ KYC (แก้ไขแล้วส่งใหม่)','info');}
function modalKyc(r){return `<div class="modal-header"><div class="modal-header-icon" style="background:rgba(0,168,142,0.12);color:var(--c-teal);"><i data-lucide="shield-check" class="w-5 h-5"></i></div>
  <div style="flex:1;"><h3 class="modal-title">ตรวจ KYC (Compliance)</h3><p class="modal-subtitle">${r.code} · ${r.name}</p></div>
  <button class="icon-btn" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button></div>
  <div class="modal-body">
    <div class="info-box info-blue" style="margin-bottom:12px;"><i data-lucide="search" class="w-3.5 h-3.5"></i><div>ตรวจเอกสารแนบ (${(r.attachments||[]).length} ไฟล์) + ตรวจรูปแบบเลขภาษี + คัดกรองรายชื่อต้องห้าม (ENG-SANCTIONS · OFAC/UN/EU)</div></div>
    <label class="chk" style="margin-bottom:12px;"><input type="checkbox" id="kyc-sanction"> จำลองผลการคัดกรอง: <strong>พบรายชื่อต้องห้าม (sanctions hit)</strong></label>
    <p style="font-size:12px;color:var(--c-mute);">ผ่าน → kyc_status=passed (ปลด KYC gate) · ไม่ผ่าน → failed · พบ sanctions → auto-block (BR-S06)</p>
  </div>
  <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>
    <button class="btn btn-danger btn-sm" onclick="confirmKyc('failed')"><i data-lucide="x" class="w-4 h-4"></i><span>ไม่ผ่าน</span></button>
    <button class="btn btn-primary" onclick="confirmKyc('passed')"><i data-lucide="check" class="w-4 h-4"></i><span>ผ่าน KYC</span></button></div>`;}
function confirmKyc(result){const r=RAW.find(x=>x.id===state.modal.id);if(!isCompliance()){showToast('FORBIDDEN · KYC ทำได้เฉพาะ Compliance','error');return;}
  const sanction=document.getElementById('kyc-sanction')?.checked;
  if(sanction){r.kyc='failed';r.status='blocked';r.block='พบในรายชื่อต้องห้าม (sanctions hit)';r.kycAt=new Date().toISOString();
    r.audit.push({t:'SANCTIONS_HIT — auto-block',by:U().name,at:r.kycAt,v:'danger'});
    closeModal();closeDrawer();showToast('SANCTIONS_HIT · พบรายชื่อต้องห้าม — บล็อกอัตโนมัติ','error');return;}
  r.kyc=result;r.kycAt=new Date().toISOString();
  r.audit.push({t:'KYC '+(result==='passed'?'ผ่าน':'ไม่ผ่าน')+' — ตรวจเอกสาร + sanctions',by:U().name,at:r.kycAt,v:result==='passed'?'success':'danger'});
  closeModal();render();showToast('บันทึกผล KYC: '+kycLabel(result),result==='passed'?'success':'warning');}
function modalBlock(r,isBL){const ok=isBL?canBlacklist():canBlock();return `<div class="modal-header"><div class="modal-header-icon is-danger"><i data-lucide="${isBL?'shield-x':'ban'}" class="w-5 h-5"></i></div>
  <div style="flex:1;"><h3 class="modal-title">${isBL?'แบล็คลิสต์คู่ค้า':'บล็อกคู่ค้า'}</h3><p class="modal-subtitle">${isBL?'ถาวร (terminal) · ':'ชั่วคราว (ปลดได้) · '}${r.code} · ${r.name}</p></div>
  <button class="icon-btn" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button></div>
  <div class="modal-body">
    ${isBL&&!canBlacklist()?`<div class="info-box info-red"><i data-lucide="lock" class="w-3.5 h-3.5"></i><div><strong>BLACKLIST_REQUIRES_DIRECTOR</strong> — แบล็คลิสต์ต้องทำโดย Procurement Director</div></div>`:
    `<div class="info-box ${isBL?'info-red':'info-amber'}"><i data-lucide="${isBL?'shield-x':'alert-triangle'}" class="w-3.5 h-3.5"></i><div>${isBL?'แบล็คลิสต์เป็นการกระทำถาวร — ไม่สามารถกลับเป็น active ได้ (one-way terminal)':'คู่ค้าจะถูกบล็อกชั่วคราว สามารถปลดบล็อกได้ภายหลัง'}</div></div>`}
    ${r.hasTxn?`<div class="info-box info-blue" style="margin-top:8px;"><i data-lucide="info" class="w-3.5 h-3.5"></i><div>คู่ค้านี้มี transaction อ้างอิง — ใช้ soft-block เท่านั้น (ไม่ลบ vendor_id = match key)</div></div>`:''}
    <div class="field" style="margin-top:12px;"><label class="field-label">เหตุผล <span class="req">*</span></label><textarea class="input" id="blk-reason" style="height:74px;padding:8px 12px;resize:vertical;" placeholder="ระบุเหตุผล..."></textarea></div></div>
  <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>
    <button class="btn btn-danger" onclick="confirmBlock()" ${ok?'':'style="opacity:.45;pointer-events:none;"'}><i data-lucide="${isBL?'shield-x':'ban'}" class="w-4 h-4"></i><span>${isBL?'แบล็คลิสต์':'บล็อก'}</span></button></div>`;}
function confirmBlock(){const r=RAW.find(x=>x.id===state.modal.id);const isBL=state.modal.type==='blacklist';
  if(isBL&&!canBlacklist()){showToast('BLACKLIST_REQUIRES_DIRECTOR','error');return;}
  if(!isBL&&!canBlock()){showToast('ไม่มีสิทธิ์','error');return;}
  const reason=(document.getElementById('blk-reason')?.value||'').trim();if(!reason){showToast('REASON_REQUIRED · กรุณาระบุเหตุผล','warning');return;}
  r.status=isBL?'blacklisted':'blocked';r.block=reason;r.audit.push({t:(isBL?'แบล็คลิสต์ (terminal)':'บล็อก')+' — '+reason,by:U().name,at:new Date().toISOString(),v:'danger'});
  closeModal();closeDrawer();showToast(isBL?'แบล็คลิสต์คู่ค้าแล้ว (terminal)':'บล็อกคู่ค้าแล้ว',isBL?'error':'warning');}

/* ====== TOAST + RENDER + BOOT ====== */
function showToast(msg,variant='info',ms=2800){const el=document.getElementById('toast');const map={success:'check-circle-2',info:'info',warning:'alert-triangle',error:'x-circle'};el.className='toast is-'+variant;el.innerHTML=`<i data-lucide="${map[variant]||'info'}" class="w-4 h-4"></i><span>${msg}</span>`;renderIcons();requestAnimationFrame(()=>el.classList.add('is-visible'));clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('is-visible'),ms);}
function render(){const snap=preserveRenderState();
  document.getElementById('page-content').innerHTML=renderList();
  document.getElementById('drawer').innerHTML=renderDrawer();
  document.getElementById('modalEl').innerHTML=renderModal();
  renderUserChip();
  renderIcons();restoreRenderState(snap);}
function renderIcons(){if(window.lucide&&typeof window.lucide.createIcons==='function')window.lucide.createIcons();}
function preserveRenderState(){const db=document.querySelector('.drawer-body');const mb=document.querySelector('.modal-body');const a=document.activeElement;const isI=a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA');
  return{ds:db?db.scrollTop:0,ms:mb?mb.scrollTop:0,ps:window.scrollY,fk:isI?{grp:a.getAttribute('data-grp'),i:a.getAttribute('data-i'),fld:a.getAttribute('data-fld'),id:a.id||'',ss:a.selectionStart,se:a.selectionEnd}:null};}
function restoreRenderState(s){if(!s)return;requestAnimationFrame(()=>{
  const db=document.querySelector('.drawer-body');if(db&&s.ds>0)db.scrollTop=s.ds;
  const mb=document.querySelector('.modal-body');if(mb&&s.ms>0)mb.scrollTop=s.ms;
  if(s.ps>0)window.scrollTo(0,s.ps);
  if(s.fk){let c=null;
    if(s.fk.grp)c=document.querySelector(`[data-grp="${s.fk.grp}"][data-i="${s.fk.i}"][data-fld="${s.fk.fld}"]`);
    else if(s.fk.id)c=document.getElementById(s.fk.id);
    if(c){c.focus();if(s.fk.ss!=null&&c.setSelectionRange){try{c.setSelectionRange(s.fk.ss,s.fk.se);}catch(e){}}}}
});}
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modal.open)closeModal();else if(state.drawer.open)closeDrawer();}});
var domReady=false,lucideReady=false;function bootIfReady(){if(domReady&&lucideReady){render();renderIcons();}}
if(document.readyState==='loading'){window.addEventListener('DOMContentLoaded',function(){domReady=true;bootIfReady();});}else{domReady=true;}
window.addEventListener('lucide:ready',function(){lucideReady=true;bootIfReady();});
if(window.lucide&&typeof window.lucide.createIcons==='function'){lucideReady=true;}
bootIfReady();setTimeout(function(){if(!lucideReady){lucideReady=true;bootIfReady();}},5000);
</script>
</body>
</html>
