<script>
/* ============================================================
   DRAWER · รอบเข้างาน / รอบออกงาน — tab ภาพรวม
   ไม่มี tab เอกสาร PDF · ไม่มี tab ลายเซ็น · ไม่มีเลขที่เอกสาร (archetype master · OB-17)
   ============================================================ */
function drawerHTML() {
  if (state.dw.mode === 'create') return createDrawerHTML();
  const c = caseOf(state.dw.id);
  if (!c) return '';
  const t = state.dw.tab;
  const on = c.type === 'onboarding';
  const tp = taskProgress(c.id), gp = grantProgress(c.id), rp = revProgress(c.id);
  const tabs = tabBtn('overview', 'ภาพรวม', t === 'overview')
    + tabBtn('tasks', 'งานในชุด', t === 'tasks', tp.all - tp.done)
    + tabBtn('access', 'สิทธิ์และบัญชี', t === 'access', on ? gp.open.length : rp.open.length)
    + tabBtn('assets', 'ทรัพย์สิน', t === 'assets', assetOpen(c).length)
    + tabBtn('history', 'ประวัติ', t === 'history');
  const body = t === 'tasks' ? caseTasks(c) : t === 'access' ? caseAccess(c) : t === 'assets' ? caseAssets(c) : t === 'history' ? caseHistory(c) : caseOverview(c);
  const e = empOf(c.emp);
  return dwHead(
      (on ? 'รอบเข้างาน' : 'รอบออกงาน') + ' · <span class="tnum">' + c.id + '</span>',
      e.n + ' ' + cPill(c.st) + (isOverdue(c) ? ' <span class="pill pill-danger">เพิกถอนค้าง</span>' : ''),
      e.p + ' · ' + e.d + ' · ' + (on ? 'วันเริ่มงาน ' + dTH(c.start) : 'วันทำงานวันสุดท้าย ' + dTH(c.lwd)),
      headerActions(c), tabs)
    + '<div class="drawer-body">' + body + '</div>'
    + dwFootClose('รหัสรอบภายในของระบบ — ไม่ใช่เลขที่เอกสารที่ต้องยื่นให้ใคร', footRight(c));
}
function headerActions(c) {
  let h = '';
  if (c.st === 'cancelled' || c.st === 'closed') return h;
  if (c.type === 'offboarding') {
    if (c.st === 'draft' || c.st === 'rejected') h += '<button class="btn btn-secondary" onclick="openModal(\'dates\',{id:\'' + c.id + '\'})"><i data-lucide="calendar-cog" class="w-4 h-4"></i>แก้วันที่</button>';
    if (c.st === 'draft' || c.st === 'rejected') h += '<button class="btn btn-primary" onclick="openSubmit(\'' + c.id + '\')"><i data-lucide="send" class="w-4 h-4"></i>ส่งอนุมัติ</button>';
    if (canSignNow(c)) h += '<button class="btn btn-secondary" onclick="openModal(\'reject\',{id:\'' + c.id + '\'})"><i data-lucide="x-circle" class="w-4 h-4"></i>ไม่อนุมัติ</button>'
      + '<button class="btn btn-primary" onclick="openModal(\'approve\',{id:\'' + c.id + '\'})"><i data-lucide="check-circle-2" class="w-4 h-4"></i>อนุมัติ</button>';
  } else {
    if (c.st !== 'closed') h += '<button class="btn btn-secondary" onclick="openModal(\'dates\',{id:\'' + c.id + '\'})"><i data-lucide="calendar-cog" class="w-4 h-4"></i>แก้วันเริ่มงาน</button>';
  }
  return h;
}
function footRight(c) {
  if (c.st === 'closed') return '<span class="fl f-ok"><i data-lucide="check" class="w-3 h-3"></i>ปิดรอบเมื่อ ' + dtTH(c.closedAt) + '</span>';
  if (c.st === 'cancelled') return '<span class="fl f-mute"><i data-lucide="archive" class="w-3 h-3"></i>ยกเลิกเมื่อ ' + dtTH(c.cancelledAt) + '</span>';
  let h = '<button class="btn btn-danger" onclick="openModal(\'cancel\',{id:\'' + c.id + '\'})"><i data-lucide="ban" class="w-4 h-4"></i>ยกเลิกรอบ</button>';
  const ready = canClose(c);
  h += '<button class="btn btn-primary' + (ready ? '' : ' is-disabled') + '"' + (ready ? '' : ' disabled') + ' onclick="openModal(\'close\',{id:\'' + c.id + '\'})"><i data-lucide="check-check" class="w-4 h-4"></i>ปิดรอบ</button>';
  return h;
}

/* ---- แถบสถานะของรอบ ---- */
function caseBand(c) {
  const od = isOverdue(c);
  let h = '<div class="rbar' + (od ? ' is-alarm' : '') + '">'
    + '<span class="rb-k">สถานะรอบ</span>' + cPill(c.st)
    + '<span class="rb-sep"></span><span class="rb-k">รหัสรอบภายใน</span><span class="rb-v tnum">' + c.id + '</span>';
  if (c.type === 'onboarding') {
    h += '<span class="rb-sep"></span><span class="rb-k">วันเริ่มงาน</span><span class="rb-v">' + dTH(c.start) + '</span>';
  } else {
    h += '<span class="rb-sep"></span><span class="rb-k">วันทำงานวันสุดท้าย</span><span class="rb-v">' + dTH(c.lwd) + '</span>'
      + '<span class="rb-sep"></span><span class="rb-k">กำหนดเพิกถอนสิทธิ์ ' + tipI('สิ้นวันทำงานวันสุดท้าย หรือเวลาที่อนุมัติครบสายเมื่อมีธงออกทันที') + '</span>'
      + '<span class="rb-v tnum">' + (c.revDue ? dtTH(c.revDue) : '—') + '</span>';
  }
  h += '<span class="rb-sep"></span><span class="rb-k">เวอร์ชันค่าที่ใช้ ' + tipI('ปฏิทินวันหยุดและงวด อ่านจาก ตั้งค่า HR ณ วันของเหตุการณ์ แล้วเก็บไว้กับรอบ') + '</span>'
    + '<span class="rb-v tnum">' + CFG_VER.holiday + ' · ' + CFG_VER.period + ' · ระยะจ้างงาน —</span>'
    + '<span class="fr-sp"></span>' + cfgLink('employment_term');
  if (od) h += '<span class="sev s-' + severityOf(c) + '"><i data-lucide="siren" class="w-3 h-3"></i>' + SEVN[severityOf(c)] + '</span>';
  return h + '</div>';
}

/* ---- สายอนุมัติที่เดินแล้ว — ตำแหน่ง → ชื่อผู้เซ็น → เวลา → สถานะ ---- */
function chainBlock(c) {
  const ch = c.chain || [];
  if (!ch.length) return '<div class="hint-inline">ยังไม่ได้ส่งอนุมัติ ' + tipI('สายอนุมัติจะถูกดึงจากระบบสายอนุมัติตอนกดส่ง แล้วเก็บติดไว้กับรอบ') + '</div>';
  const now = chainStepNow(c);
  return '<div class="chn">' + ch.map(function (s, i) {
    const cls = s.st === 'ok' ? 'is-ok' : s.st === 'no' ? 'is-no' : (i === now ? 'is-now' : '');
    const ic = s.st === 'ok' ? 'check' : s.st === 'no' ? 'x' : String(i+1);
    return '<div class="chn-i"><div class="chn-d ' + cls + '">' + (s.st === 'ok' || s.st === 'no' ? '<i data-lucide="' + ic + '" class="w-3 h-3"></i>' : ic) + '</div>'
      + '<div class="min0"><div class="chn-t">' + s.roleName + '</div>'
      + '<div class="mtop">' + personCell(s.as) + '</div>'
      + '<div class="chn-m">' + (s.st === 'ok' ? 'อนุมัติเมื่อ ' + dtTH(s.at) : s.st === 'no' ? 'ไม่อนุมัติเมื่อ ' + dtTH(s.at) : (i === now ? 'รอลงนาม' : 'ยังไม่ถึงคิว')) + '</div>'
      + (s.note ? '<div class="fl f-block mtop"><i data-lucide="message-square-warning" class="w-3 h-3"></i>' + s.note + '</div>' : '')
      + '</div></div>';
  }).join('') + '</div>'
  + '<div class="hint-inline mtop">มาจากระบบสายอนุมัติ ' + (c.entry || '—') + ' ' + tipI('สายถูกดึงและเก็บติดไว้กับรอบ ณ เวลากดส่ง — แก้สายที่ต้นทางภายหลังไม่กระทบรอบที่ส่งไปแล้ว') + '</div>';
}

/* ---- ภาพรวม ---- */
function caseOverview(c) {
  const on = c.type === 'onboarding';
  const e = empOf(c.emp);
  const tp = taskProgress(c.id), gp = grantProgress(c.id), rp = revProgress(c.id);
  const bl = closeBlockers(c);
  const warns = DOWNSTREAM_WARN[c.id] || [];
  let h = '<div class="scrollpad">' + caseBand(c);

  if (isOverdue(c)) {
    h += '<div class="note note-danger"><i data-lucide="shield-alert" class="w-4 h-4"></i>'
      + '<span><b>พ้นสภาพแล้วแต่ยังเข้าระบบได้</b> — เลยเวลาที่กำหนดมา ' + overdueHours(c) + ' ชั่วโมง และยังมีสิทธิ์ค้าง ' + rp.open.length + ' รายการ '
      + '(' + rp.open.map(function (a) { return kindOf(a.k).n; }).join(' · ') + ') · การแจ้งเตือนเรื่องนี้ผู้รับปิดไม่ได้ และรอบนี้ปิดไม่ได้จนกว่าจะครบ</span>'
      + '<span class="note-act"><button class="btn btn-danger btn-sm" onclick="dwTab(\'access\')"><i data-lucide="arrow-right" class="w-4 h-4"></i>ไปที่ทะเบียนสิทธิ์</button></span></div>';
  }
  if (c.st === 'rejected') {
    const last = (c.chain || [])[(c.chain || []).length - 1] || {};
    h += '<div class="note note-warn"><i data-lucide="undo-2" class="w-4 h-4"></i><span><b>ถูกตีกลับ</b> — ' + (last.note || '') + ' · แก้แล้วส่งใหม่ได้ และสายอนุมัติจะถูกดึงใหม่ทั้งสาย</span>'
      + '<span class="note-act"><button class="btn btn-secondary btn-sm" onclick="openSubmit(\'' + c.id + '\')"><i data-lucide="send" class="w-4 h-4"></i>ส่งอนุมัติใหม่</button></span></div>';
  }

  h += SEC('user-round', 'ข้อมูลรอบ', 'สำเนาชื่อและตำแหน่ง ณ เวลาบันทึก',
      '<div class="kv c3">'
      + KV('พนักงาน', personCell(c.emp))
      + KV('ตำแหน่ง ณ เวลาบันทึก', e.p)
      + KV('แผนก ณ เวลาบันทึก', e.d)
      + KV('หัวหน้าโดยตรง', personCell(e.sup))
      + KV('ผู้สร้างรอบ', personCell(c.by))
      + KV('สร้างเมื่อ', '<span class="tnum">' + dtTH(c.created) + '</span>')
      + (on
        ? KV('วันเริ่มงาน', '<span class="tnum">' + dTH(c.start) + '</span>' + (c.startWas ? ' <span class="fl f-warn"><i data-lucide="history" class="w-3 h-3"></i>เดิม ' + dTH(c.startWas) + '</span>' : ''))
        : KV('วันแจ้ง', '<span class="tnum">' + dTH(c.notice) + '</span>'))
      + (on ? KV('รหัสผู้สมัครจากการสรรหา', (c.cand ? '<span class="tnum">' + c.cand + '</span> ' : '<span class="text-mute-2">ไม่ได้อ้างอิง</span> ') + '<span class="lnk-st is-off"><i data-lucide="unplug" class="w-3 h-3"></i>ยังไม่เชื่อม</span>')
             : KV('วันทำงานวันสุดท้าย', '<span class="tnum">' + dTH(c.lwd) + '</span>'))
      + (on ? KV('ระยะทดลองงาน', noVal() + ' ' + cfgLink('employment_term'), 'ต้นทางยังไม่เผยแพร่ค่านี้ ระบบจึงไม่คำนวณวันครบทดลองงานให้ และไม่มีตัวเลขวันเดาไว้ที่ใด')
             : KV('เหตุผลการออก', mask(reasonOf(c.reason).n)))
      + (on ? KV('แม่แบบชุดงาน', (tplOf(c.tpl) ? tplOf(c.tpl).n : '—') + (tplOf(c.tpl) && tplOf(c.tpl).st === 'inactive' ? ' <span class="pill pill-muted">ปิดใช้แล้ว</span>' : ''))
             : KV('ออกทันที', c.imm ? '<span class="fl f-block"><i data-lucide="zap" class="w-3 h-3"></i>ใช่ — เพิกถอนทันทีที่อนุมัติครบสาย</span>' : 'ไม่ใช่'))
      + (on ? '' : KV('ระยะบอกกล่าวล่วงหน้า', noVal() + ' ' + cfgLink('employment_term'), 'ระบบไม่ตัดสินว่าบอกกล่าวครบตามกฎหมายหรือไม่ เพราะต้นทางยังไม่เผยแพร่ค่านี้'))
      + (on ? '' : KV('กำหนดเพิกถอนสิทธิ์', c.revDue ? '<span class="tnum">' + dtTH(c.revDue) + '</span>' : '<span class="text-mute-2">ตั้งเมื่ออนุมัติครบสาย</span>'))
      + (on ? '' : KV('แม่แบบชุดงานปิดสิทธิ์', tplOf(c.tpl) ? tplOf(c.tpl).n : '—'))
      + '</div>'
      + (c.startChangeReason ? '<div class="fl f-warn mtop"><i data-lucide="info" class="w-3 h-3"></i>เหตุผลที่เลื่อนวันเริ่มงาน: ' + c.startChangeReason + '</div>' : '')
      + (c.cancelReason ? '<div class="fl f-block mtop"><i data-lucide="ban" class="w-3 h-3"></i>เหตุผลที่ยกเลิก: ' + c.cancelReason + '</div>' : ''));

  h += SEC('activity', 'ความคืบหน้าของรอบ', '',
      '<div class="kv c3">'
      + KV('งานในชุด', progBar(tp.done, tp.all, tp.done === tp.all ? '' : 'run') + ' <span class="hint-inline">งานบังคับ ' + tp.mandDone + '/' + tp.mand + '</span>')
      + (on ? KV('สิทธิ์ที่เปิดแล้ว', progBar(gp.done, gp.all, gp.fail ? 'late' : (gp.done === gp.all ? '' : 'run')))
             : KV('สิทธิ์ที่เพิกถอนแล้ว', progBar(rp.done, rp.all, isOverdue(c) ? 'late' : (rp.done === rp.all ? '' : 'run'))))
      + KV(on ? 'ทรัพย์สินที่ส่งมอบแล้ว' : 'ทรัพย์สินที่รับคืนแล้ว', progBar(assetOf(c.id).length - assetOpen(c).length, assetOf(c.id).length, assetOpen(c).length ? 'run' : ''))
      + '</div>');

  if (!on) {
    h += SEC('git-branch', 'สายอนุมัติ', (c.chain && c.chain.length ? c.chain.length + ' ขั้น · ' + (c.entry || '') : 'ยังไม่ส่งอนุมัติ'), chainBlock(c));
    if (c.cancelAppr) {
      h += SEC('undo-2', 'การอนุมัติการยกเลิกรอบ', 'ผ่านคนชุดเดียวกับที่อนุมัติการออก',
        '<div class="chn">' + c.cancelAppr.map(function (s, i) {
          return '<div class="chn-i"><div class="chn-d is-ok"><i data-lucide="check" class="w-3 h-3"></i></div><div class="min0"><div class="chn-t">' + s.roleName + '</div>'
            + '<div class="mtop">' + personCell(s.as) + '</div><div class="chn-m">อนุมัติเมื่อ ' + dtTH(s.at) + '</div></div></div>';
        }).join('') + '</div>');
    }
    if (c.subord > 0 || c.pendApp > 0) {
      h += SEC('users', 'ผู้ใต้บังคับบัญชาและงานอนุมัติที่ค้างของผู้ที่ออก', 'ตรวจก่อนเพิกถอน',
        '<div class="kv c3">'
        + KV('ผู้ใต้บังคับบัญชา', '<span class="tnum">' + c.subord + ' คน</span>')
        + KV('งานอนุมัติที่ยังค้างอยู่', '<span class="tnum">' + c.pendApp + ' รายการ</span>')
        + KV('สถานะงานมอบหมายต่อ', (tasksOf(c.id).filter(function (t) { return t.c === 'TK-OF-90'; })[0] || { st:'todo' }).st === 'done' ? '<span class="pill pill-success">จัดการครบแล้ว</span>' : '<span class="pill pill-warning">ยังไม่ครบ</span>')
        + '</div>'
        + '<div class="wu-row mtop"><div class="min0"><div class="wu-nm">' + subordinatesOf(c.emp).map(function (k) { return empOf(k).n; }).join(' · ') + '</div>'
        + '<div class="wu-mt">ต้องมอบหมายต่อให้เสร็จก่อนปิดรอบ — การมอบฉันทะผู้อนุมัติจริงทำที่ สายอนุมัติ ไม่ทำที่นี่</div></div>'
        + '<span class="mla">' + '<button class="lkout" onclick="openDoa()"><i data-lucide="external-link" class="w-3 h-3"></i>มอบฉันทะที่ สายอนุมัติ</button></span></div>');
    }
  }

  if (on && (c.probResult || c.id === 'ONB-0005' || tasksOf(c.id).some(function (t) { return t.c === 'TK-ON-12'; }))) {
    const pt = tasksOf(c.id).filter(function (t) { return t.c === 'TK-ON-12'; })[0];
    h += SEC('clipboard-check', 'ผลการทบทวนทดลองงาน', 'บันทึกผลได้ที่นี่ · แบบประเมินเต็มรูปแบบเป็นของ feature อื่น',
      '<div class="kv c3">'
      + KV('วันที่ทบทวน', pt && pt.due ? '<span class="tnum">' + dTH(pt.due) + '</span>' : noVal('ผู้ใช้ตั้งวันเอง'))
      + KV('ระยะทดลองงานที่อ่านได้', noVal() + ' ' + cfgLink('employment_term'))
      + KV('ผลการทบทวน', c.probResult ? mask(c.probResult === 'pass' ? 'ผ่าน' : c.probResult === 'fail' ? 'ไม่ผ่าน' : 'ขยายเวลา') : '<span class="text-mute-2">ยังไม่บันทึกผล</span>')
      + '</div>'
      + (c.st !== 'closed' && c.st !== 'cancelled' && canSeeSensitive()
        ? '<div class="rowgap mtop"><button class="chip-btn' + (c.probResult === 'pass' ? ' is-on' : '') + '" onclick="setProb(\'' + c.id + '\',\'pass\')">ผ่าน</button>'
          + '<button class="chip-btn' + (c.probResult === 'fail' ? ' is-on' : '') + '" onclick="setProb(\'' + c.id + '\',\'fail\')">ไม่ผ่าน</button>'
          + '<button class="chip-btn' + (c.probResult === 'extend' ? ' is-on' : '') + '" onclick="setProb(\'' + c.id + '\',\'extend\')">ขยายเวลา</button>'
          + '<span class="hint-inline">ผลนี้ใช้ต่อในรอบออกงาน ' + tipI('ผล “ไม่ผ่าน” เป็นเหตุผลการออกค่าหนึ่งของรอบออกงาน — คำสั่งเปลี่ยนแปลงพนักงานออกที่ feature ของตัวเอง') + '</span></div>'
        : ''));
  }

  if (bl.length) {
    h += SEC('list-x', 'สิ่งที่ยังค้างก่อนปิดรอบ', bl.length + ' เรื่อง',
      bl.map(function (b) {
        return '<div class="wu-row"><div class="min0"><div class="wu-nm">' + b.n + '</div><div class="wu-mt">' + b.d.slice(0,4).join(' · ') + (b.d.length > 4 ? ' และอีก ' + (b.d.length-4) + ' รายการ' : '') + '</div></div>'
          + '<span class="mla"><button class="chip-btn" onclick="dwTab(\'' + (b.k === 'task' || b.k === 'deleg' ? 'tasks' : b.k === 'asset' ? 'assets' : 'access') + '\')">ไปที่รายการ</button></span></div>';
      }).join(''));
  }
  if (warns.length) {
    h += SEC('triangle-alert', 'งานค้างของปลายทางก่อนปิดรอบ', 'อ่านอย่างเดียว · ไม่บล็อกการเพิกถอนสิทธิ์',
      warns.map(function (w) {
        return '<div class="wu-row"><div class="min0"><div class="wu-nm">' + w.n + '</div><div class="wu-mt">' + (w.ref ? w.ref + ' · ' : '') + dTH(w.d) + ' — แก้ข้อมูลได้ที่หน้าต้นทางเท่านั้น</div></div>'
          + '<span class="mla">' + (w.src === 'leave' ? '<button class="lkout" onclick="openLeave(\'' + w.ref + '\')"><i data-lucide="external-link" class="w-3 h-3"></i>ดูใบลา</button>' : '<button class="lkout" onclick="openAttendance(\'' + w.d + '\')"><i data-lucide="external-link" class="w-3 h-3"></i>ดูที่ เวลาเข้างาน</button>') + '</span></div>';
      }).join(''));
  }

  h += SEC('calendar-range', 'ขอบเขตวันที่ที่เผยแพร่ให้ปลายทางอ่าน', 'เป็นสำเนา อ่านอย่างเดียว',
      '<div class="kv c3">'
      + KV('วันเริ่มงานที่เผยแพร่', on && ['running','closed'].indexOf(c.st) >= 0 ? '<span class="tnum">' + dTH(c.start) + '</span>' : '<span class="text-mute-2">ยังไม่เผยแพร่</span>')
      + KV('วันทำงานวันสุดท้ายที่เผยแพร่', !on && ['approved','revoking','revoked','closed'].indexOf(c.st) >= 0 ? '<span class="tnum">' + dTH(c.lwd) + '</span>' : '<span class="text-mute-2">ยังไม่เผยแพร่</span>')
      + KV('เวอร์ชันค่าที่ใช้', '<span class="tnum">' + CFG_VER.holiday + ' · ' + CFG_VER.period + '</span>')
      + '</div>'
      + '<div class="mtop">' + READERS.filter(function (r) { return r.k !== 'welfare'; }).map(function (r) {
          return '<span class="fl ' + (state.link[r.k] ? 'f-ok' : 'f-mute') + '"><i data-lucide="' + r.i + '" class="w-3 h-3"></i>' + r.n + '</span> ';
        }).join('') + '</div>'
      + '<div class="wu-row mtop"><div class="min0"><div class="wu-nm">' + (on ? 'สัญญาณเริ่มมีสิทธิ์ถึงสวัสดิการ' : 'สัญญาณสิ้นสุดสิทธิ์ถึงสวัสดิการ') + '</div>'
      + '<div class="wu-mt">' + ((on ? c.joiner.on : c.leaver.on) ? 'ส่งแล้วเมื่อ ' + dTH(on ? c.joiner.at : c.leaver.at) : 'ยังไม่ส่ง') + ' · สวัสดิการยังไม่มีในระบบ ปรับสถานะการเชื่อมเองได้</div></div>'
      + '<span class="mla rowgap">' + (state.link.welfare ? '<span class="lnk-st is-on"><i data-lucide="plug" class="w-3 h-3"></i>เชื่อมแล้ว</span>' : '<span class="lnk-st is-off"><i data-lucide="unplug" class="w-3 h-3"></i>ยังไม่เชื่อม</span>')
      + '<button class="chip-btn" onclick="toggleLink(\'welfare\')">' + (state.link.welfare ? 'ทำเครื่องหมายว่ายังไม่เชื่อม' : 'ทำเครื่องหมายว่าเชื่อมแล้ว') + '</button></span></div>');

  if (!on && (c.st === 'closed' || c.rehire !== null)) {
    h += SEC('user-round-check', 'ธงสิทธิ์การจ้างกลับ', 'แสดงผลอย่างเดียว ไม่บล็อกการสรรหา',
      '<div class="kv"><div><div class="kv-k">ธง</div><div class="kv-v">' + mask(c.rehire === null ? 'ยังไม่บันทึก' : (c.rehire ? 'จ้างกลับได้' : 'ไม่แนะนำให้จ้างกลับ')) + '</div></div>'
      + '<div><div class="kv-k">เหตุผล</div><div class="kv-v">' + mask(c.rehireNote || '—') + '</div></div></div>');
  }
  return h + '</div>';
}
function setProb(id, v) {
  const c = caseOf(id); if (!c) return;
  c.probResult = v; c.probBy = P().emp; c.probAt = nowStr();
  pushAudit(id, 'prob', 'บันทึกผลการทบทวนทดลองงาน', v === 'pass' ? 'ผ่าน' : v === 'fail' ? 'ไม่ผ่าน' : 'ขยายเวลา');
  render();
  showToast('บันทึกผลการทบทวนทดลองงานแล้ว', 'success');
}
</script>
<script>
/* ============================================================
   DRAWER · tab งานในชุด — แต่ละแถว = 1 งานจริงใน กระบวนการทำงาน (BR-02 · FN-61)
   ไม่มีปฏิทิน ไม่มีแผนภูมิ Gantt ไม่มีกระดานงานของตัวเอง (FN-62)
   ============================================================ */
const TKST = {
  todo:     { n:'รอเริ่ม',   p:'pill-muted' },
  doing:    { n:'กำลังทำ',  p:'pill-warning' },
  done:     { n:'เสร็จ',    p:'pill-success' },
  cancelled:{ n:'ยกเลิก',   p:'pill-archived' }
};
function tkPill(st) { const s = TKST[st] || TKST.todo; return '<span class="pill ' + s.p + '">' + s.n + '</span>'; }

function caseTasks(c) {
  const rows = tasksOf(c.id);
  const tp = taskProgress(c.id);
  const editable = c.st !== 'closed' && c.st !== 'cancelled';
  const body = rows.length ? rows.map(function (t) {
    const late = taskOverdue(t);
    return '<tr class="' + (late ? 'row-late' : '') + '" onclick="openModal(\'task\',{tid:\'' + t.id + '\'})">'
      + '<td><span class="tk-nm">' + t.n + '</span><span class="tk-sub">' + t.c + (t.added ? ' · เพิ่มเฉพาะรอบนี้' : '') + '</span></td>'
      + '<td><span class="grp">' + t.g + '</span></td>'
      + '<td>' + (t.as ? personCell(t.as, empOf(t.as).p) : '<span class="cell-main text-mute-2">ตามตำแหน่ง</span>') + '</td>'
      + '<td><span class="cell-main">' + t.at + '</span></td>'
      + '<td><span class="stk"><span class="cell-main tnum">' + (t.due ? dTH(t.due) : 'ตั้งวันเอง') + '</span>' + (late ? '<span class="cell-sub text-danger">เลยกำหนด ' + Math.abs(daysBetween(t.due, TODAY)) + ' วัน</span>' : '') + '</span></td>'
      + '<td><span class="cell-main">' + (t.m ? 'บังคับ' : 'เสริม') + '</span></td>'
      + '<td>' + tkPill(t.st) + '</td>'
      + '<td><button class="lkout" onclick="event.stopPropagation();openOp(\'' + t.sow + '\')"><i data-lucide="external-link" class="w-3 h-3"></i>' + t.sow + '</button></td>'
      + '</tr>';
  }).join('') : emptyRow(8, 'ยังไม่มีงานในชุด', 'เลือกแม่แบบชุดงานแล้วบันทึกรอบ เพื่อให้ระบบสร้างงานให้');

  let h = '<div class="scrollpad">';
  if (c.type === 'offboarding' && ['draft','pending','rejected'].indexOf(c.st) >= 0) {
    h += '<div class="hint-inline mb-3">ชุดงานปิดสิทธิ์เดินได้เมื่ออนุมัติครบสาย ' + tipI('ก่อนอนุมัติครบสาย ยังไม่มีคำขอเพิกถอนสิทธิ์ใดออกไปยัง สิทธิ์ผู้ใช้งาน และงานยังไม่นับว่าเลยกำหนด') + '</div>';
  }
  h += SEC('list-checks', 'งานในชุดของรอบนี้', progBar(tp.done, tp.all, tp.done === tp.all ? '' : 'run') + ' · งานบังคับ ' + tp.mandDone + '/' + tp.mand,
      '<div class="mini-wrap"><table class="table tbl-min-wide"><thead><tr><th>งาน</th><th>กลุ่ม</th><th>ผู้รับผิดชอบ</th><th>ชนิดการมอบหมาย</th><th>กำหนดเสร็จ</th><th>ความจำเป็น</th><th>สถานะ</th><th>งานจริงในกระบวนการทำงาน</th></tr></thead><tbody>' + body + '</tbody></table></div>'
      + '<div class="rowgap mtop">'
      + (editable ? '<button class="btn btn-secondary btn-sm" onclick="openModal(\'addtask\',{id:\'' + c.id + '\'})"><i data-lucide="plus" class="w-4 h-4"></i>เพิ่มงานเฉพาะรอบนี้</button>' : '')
      + opLink('', 'เปิด งานของฉัน') + tipI('สถานะจริงของงานอยู่ที่ กระบวนการทำงาน — หน้านี้สะท้อนผลเท่านั้น และการเพิ่มหรือปิดงานเฉพาะรอบไม่แก้แม่แบบต้นทาง')
      + '</div>');

  const hand = rows.filter(function (t) { return t.c === 'TK-OF-01'; })[0];
  if (hand) {
    h += SEC('folder-input', 'การส่งมอบความเป็นเจ้าของข้อมูล', hand.st === 'done' ? 'ส่งมอบแล้ว' : 'ต้องเสร็จก่อนปิดรอบ',
      '<div class="kv c3">'
      + KV('ผู้รับมอบข้อมูล', hand.rec ? personCell(hand.rec) : '<span class="text-mute-2">ยังไม่ระบุ</span>')
      + KV('กำหนดเสร็จ', '<span class="tnum">' + dTH(hand.due) + '</span>')
      + KV('สถานะ', tkPill(hand.st))
      + '</div>'
      + '<div class="mini-wrap mtop"><table class="mini-tbl"><thead><tr><th>สิ่งที่ต้องส่งมอบ</th><th>วิธีที่ใช้</th></tr></thead><tbody>'
      + '<tr><td>กล่องจดหมายของผู้ที่ออก</td><td>แปลงเป็นกล่องที่ใช้ร่วมกันของทีม</td></tr>'
      + '<tr><td>อีเมลที่ส่งเข้ามาหลังพ้นสภาพ</td><td>ตั้งส่งต่อถึงหัวหน้าชั่วคราว</td></tr>'
      + '<tr><td>ผู้ติดต่อแทน</td><td>ตั้งข้อความตอบกลับอัตโนมัติชี้ผู้ติดต่อแทน</td></tr>'
      + '<tr><td>ไฟล์และพื้นที่ที่ดูแลอยู่</td><td>โอนความเป็นเจ้าของให้ผู้รับมอบ</td></tr>'
      + '<tr><td>กลุ่มอีเมลและปฏิทินที่ใช้ร่วม</td><td>ถอดออกจากกลุ่มและปฏิทิน</td></tr>'
      + '</tbody></table></div>'
      + '<div class="note note-warn mtop"><i data-lucide="shield-alert" class="w-4 h-4"></i>'
      + '<span>งานนี้ทำให้ปิดรอบไม่ได้ แต่ <b>ไม่เลื่อนเวลาเพิกถอนสิทธิ์</b> — ถ้าต้องเพิกถอนก่อนส่งมอบเสร็จ ให้มอบสิทธิ์ชั่วคราวแก่ผู้รับมอบแทนการรอ</span>'
      + (c.st !== 'closed' && c.st !== 'cancelled' ? '<span class="note-act"><button class="btn btn-secondary btn-sm" onclick="openModal(\'tempaccess\',{id:\'' + c.id + '\'})"><i data-lucide="key-round" class="w-4 h-4"></i>ขอสิทธิ์ชั่วคราวให้ผู้รับมอบ</button></span>' : '')
      + '</div>');
  }

  const dropped = rows.filter(function (t) { return t.st === 'cancelled' && t.dropReason; });
  const added = rows.filter(function (t) { return t.added; });
  if (dropped.length || added.length) {
    h += SEC('git-compare-arrows', 'การปรับงานเฉพาะรอบนี้', 'แม่แบบต้นทางไม่ถูกแก้',
      (added.map(function (t) {
        return '<div class="wu-row"><span class="fl f-ok"><i data-lucide="plus" class="w-3 h-3"></i>เพิ่ม</span><div class="min0"><div class="wu-nm">' + t.n + '</div>'
          + '<div class="wu-mt">' + empOf(t.addBy).n + ' · ' + dtTH(t.addAt) + ' · ' + t.addReason + '</div></div></div>';
      }).join('')) + (dropped.map(function (t) {
        return '<div class="wu-row"><span class="fl f-mute"><i data-lucide="minus" class="w-3 h-3"></i>ปิด</span><div class="min0"><div class="wu-nm">' + t.n + '</div>'
          + '<div class="wu-mt">' + empOf(t.dropBy).n + ' · ' + dtTH(t.dropAt) + ' · ' + t.dropReason + '</div></div></div>';
      }).join('')));
  }
  return h + '</div>';
}
</script>
<script>
/* ============================================================
   ⭐ DRAWER · tab สิทธิ์และบัญชี — ทะเบียนสิทธิ์ของรอบ (แผงสำคัญที่สุดของ feature)
   ปิดรายการได้เฉพาะเมื่อมีผลตอบกลับจากต้นทางพร้อม ผู้ทำ · เวลา · รหัสอ้างอิง (BR-04 · FN-39)
   ไม่มีช่องติ๊ก ไม่มีหน้าจัดการสิทธิ์ ไม่มีชั้นอนุมัติคั่นก่อนการเพิกถอน (FN-70 · DOA_BRIEF §2.1)
   ============================================================ */
function ackCell(a) {
  if (!a.ack) return '<span class="ack-none"><i data-lucide="clock" class="w-3 h-3"></i>ยังไม่มีผลตอบกลับ</span>';
  return '<span class="cell-main">' + empOf(a.ack.by).n + '</span><span class="ack">' + dtTH(a.ack.at) + ' · ' + a.ack.ref + '</span>';
}
function kindCell(a) {
  /* ไม่มีไอคอนกรอบสี่เหลี่ยมหน้าแถว — กันไม่ให้ดูเหมือนช่องติ๊ก เพราะแถวนี้ติ๊กปิดเองไม่ได้ (FN-39) */
  return '<span class="cell-main">' + kindOf(a.k).n + '</span>';
}
function canRevokeNow(c) {
  if (c.type !== 'offboarding') return false;
  if (['approved','revoking','revoked'].indexOf(c.st) < 0) return false;
  return accOf(c.id).some(function (a) { return a.r === 'none'; });
}

function caseAccess(c) {
  const on = c.type === 'onboarding';
  const list = accOf(c.id);
  const gp = grantProgress(c.id), rp = revProgress(c.id);
  const od = isOverdue(c);
  const editable = c.st !== 'closed';
  let h = '<div class="scrollpad">';

  /* ---- แถบสรุปด้านบน ---- */
  if (on) {
    h += '<div class="rev-head' + (gp.fail ? ' is-alarm' : (gp.done === gp.all ? ' is-done' : '')) + '">'
      + '<div><div class="rev-k">คำขอเปิดสิทธิ์</div><div class="rev-big tnum">' + gp.done + '<span class="rev-k"> / ' + gp.all + ' รายการ</span></div></div>'
      + progBar(gp.done, gp.all, gp.fail ? 'late' : (gp.done === gp.all ? '' : 'run'), true)
      + '<span class="rb-sep"></span>'
      + '<div><div class="rev-k">ล้มเหลว</div><div class="rev-v tnum">' + gp.fail + ' รายการ</div></div>'
      + '<div><div class="rev-k">ยังไม่ได้ขอ</div><div class="rev-v tnum">' + list.filter(function (a) { return a.g === 'none'; }).length + ' รายการ</div></div>'
      + '<span class="fr-sp"></span>'
      + (editable && list.some(function (a) { return a.g === 'none'; }) ? '<button class="btn btn-primary" onclick="openModal(\'grantreq\',{id:\'' + c.id + '\'})"><i data-lucide="send" class="w-4 h-4"></i>ส่งคำขอเปิดสิทธิ์</button>' : '')
      + (editable && gp.fail ? '<button class="btn btn-secondary" onclick="retryAll(\'' + c.id + '\',\'grant\')"><i data-lucide="refresh-cw" class="w-4 h-4"></i>ส่งซ้ำที่ล้มเหลว</button>' : '')
      + '</div>';
  } else {
    h += '<div class="rev-head' + (od ? ' is-alarm' : (rp.done === rp.all && rp.all ? ' is-done' : '')) + '">'
      + '<div><div class="rev-k">เพิกถอนสิทธิ์แล้ว</div><div class="rev-big tnum' + (od ? ' is-alarm' : '') + '">' + rp.done + '<span class="rev-k"> / ' + rp.all + ' รายการ</span></div></div>'
      + progBar(rp.done, rp.all, od ? 'late' : (rp.done === rp.all ? '' : 'run'), true)
      + '<span class="rb-sep"></span>'
      + '<div><div class="rev-k">กำหนดมีผล ' + tipI(c.imm ? 'มีธงออกทันที เวลาเพิกถอนจึงเป็นเวลาที่อนุมัติครบสาย ไม่รอวันทำงานวันสุดท้าย' : 'สิ้นวันทำงานวันสุดท้าย') + '</div>'
      + '<div class="rev-v tnum">' + (c.revDue ? dtTH(c.revDue) : 'ตั้งเมื่ออนุมัติครบสาย') + '</div></div>'
      + (od ? '<div><div class="rev-k">เลยกำหนดมาแล้ว</div><div class="rev-v tnum text-danger">' + overdueHours(c) + ' ชั่วโมง</div></div>'
            + '<span class="sev s-' + severityOf(c) + '"><i data-lucide="siren" class="w-3 h-3"></i>' + SEVN[severityOf(c)] + '</span>' : '')
      + '<span class="fr-sp"></span>'
      + (editable && canRevokeNow(c) ? '<button class="btn btn-primary" onclick="openModal(\'revokeall\',{id:\'' + c.id + '\'})"><i data-lucide="shield-x" class="w-4 h-4"></i>เพิกถอนสิทธิ์ทั้งหมด</button>' : '')
      + (editable && rp.fail ? '<button class="btn btn-secondary" onclick="retryAll(\'' + c.id + '\',\'revoke\')"><i data-lucide="refresh-cw" class="w-4 h-4"></i>ส่งซ้ำที่ล้มเหลว</button>' : '')
      + '</div>';
  }

  if (!canSeeSensitive()) {
    h += '<div class="note note-warn"><i data-lucide="eye-off" class="w-4 h-4"></i><span>บทบาทที่ใช้อยู่ไม่มีสิทธิ์เห็นทะเบียนสิทธิ์ — รายการถูกปิดบังทั้งหมด การเปิดดูถูกบันทึกไว้ในประวัติ</span>'
      + '<span class="note-act">' + roleLink('ขอสิทธิ์ที่ สิทธิ์ผู้ใช้งาน') + '</span></div>';
  }
  if (od) {
    h += '<div class="note note-danger"><i data-lucide="shield-alert" class="w-4 h-4"></i>'
      + '<span><b>เหตุการณ์ความปลอดภัย ไม่ใช่งานค้างธรรมดา</b> — ผู้ที่ออกพ้นสภาพแล้วแต่ยังมีสิทธิ์ค้าง ' + rp.open.length + ' รายการ เลยกำหนดมา ' + overdueHours(c) + ' ชั่วโมง '
      + '· การแจ้งเตือนถูกยกระดับถึงฝ่ายบุคคลและผู้ดูแลสิทธิ์แล้ว และผู้รับปิดการแจ้งนี้ไม่ได้ · รอบนี้ปิดไม่ได้จนกว่าจะครบ</span>'
      + '<span class="note-act">' + roleLink('ติดตามที่ สิทธิ์ผู้ใช้งาน') + '</span></div>';
  }

  /* ---- ตารางทะเบียนสิทธิ์ ---- */
  let head, body;
  if (on) {
    head = '<tr><th>ชนิดสิทธิ์</th><th>รายการ</th><th>ที่มา</th><th>สถานะการเปิด</th><th>ผลตอบกลับจากต้นทาง</th><th>ครั้งที่ลอง</th><th>ดำเนินการ</th></tr>';
    body = list.map(function (a) {
      return '<tr class="' + (a.g === 'fail' ? 'row-late' : '') + '">'
        + '<td>' + kindCell(a) + '</td>'
        + '<td title="' + maskPlain(a.l) + '"><span class="cell-main">' + maskPlain(a.l) + '</span><span class="cell-sub tnum">' + maskPlain(a.a) + '</span></td>'
        + '<td title="' + SRC_FULL[a.src] + '"><span class="src-tag">' + SRC[a.src] + '</span></td>'
        + '<td title="' + (a.fr || '') + '"><span class="stk">' + gPill(a.g) + (a.g === 'fail' ? '<span class="cell-sub text-danger">' + a.fr + '</span>' : '') + '</span></td>'
        + '<td title="' + (a.ack ? empOf(a.ack.by).n + ' · ' + dtTH(a.ack.at) + ' · ' + a.ack.ref : 'ยังไม่มีผลตอบกลับ') + '">' + ackCell(a) + '</td>'
        + '<td><span class="cell-main tnum">' + (a.rt || 0) + '</span></td>'
        + '<td>' + (editable && a.g === 'fail' ? '<button class="btn btn-secondary btn-sm" onclick="retryOne(\'' + a.id + '\',\'grant\')">ส่งซ้ำ</button>'
             : a.g === 'done' ? '<span class="fl f-ok">ปิดแล้ว</span>' : '<span class="text-mute-2">รอผลตอบกลับ</span>') + '</td>'
        + '</tr>';
    }).join('');
  } else {
    head = '<tr><th>ชนิดสิทธิ์</th><th>รายการ</th><th>ที่มา</th><th>สถานะการเพิกถอน</th><th>ผลตอบกลับจากต้นทาง</th><th>กำหนดมีผล</th><th>ดำเนินการ</th></tr>';
    body = list.map(function (a) {
      const late = od && a.r !== 'done' && a.r !== 'restored';
      return '<tr class="' + (late || a.r === 'fail' ? 'row-late' : '') + '">'
        + '<td>' + kindCell(a) + '</td>'
        + '<td title="' + maskPlain(a.l) + '"><span class="cell-main">' + maskPlain(a.l) + '</span><span class="cell-sub tnum">' + maskPlain(a.a) + '</span></td>'
        + '<td title="' + SRC_FULL[a.src] + '"><span class="src-tag">' + SRC[a.src] + '</span></td>'
        + '<td title="' + (a.fr || '') + '"><span class="stk">' + rPillA(a.r) + (a.r === 'fail' ? '<span class="cell-sub text-danger">' + a.fr + '</span>' : '') + '</span></td>'
        + '<td title="' + (a.ack ? empOf(a.ack.by).n + ' · ' + dtTH(a.ack.at) + ' · ' + a.ack.ref : 'ยังไม่มีผลตอบกลับ') + '">' + ackCell(a) + '</td>'
        + '<td><span class="stk"><span class="cell-main tnum">' + (c.revDue ? dTH(c.revDue.slice(0,10)) : '—') + '</span><span class="cell-sub' + (late ? ' text-danger' : '') + '">' + (late ? 'เลยกำหนด · ' : '') + (c.revDue ? c.revDue.slice(11,16) + ' น.' : '') + '</span></span></td>'
        + '<td>' + (editable && (a.r === 'fail' || (a.r === 'req' && od)) ? '<button class="btn btn-secondary btn-sm" onclick="retryOne(\'' + a.id + '\',\'revoke\')">ส่งซ้ำ</button>'
             : (a.r === 'done' || a.r === 'restored') ? '<span class="fl f-ok">ปิดแล้ว</span>' : '<span class="text-mute-2">รอผลตอบกลับ</span>') + '</td>'
        + '</tr>';
    }).join('');
  }
  if (!list.length) body = emptyRow(7, 'ยังไม่มีรายการสิทธิ์ในทะเบียน', 'ทะเบียนตั้งต้นมาจากสิทธิ์ที่เปิดในรอบเข้างาน และสิทธิ์ปัจจุบันที่อ่านจาก สิทธิ์ผู้ใช้งาน');

  h += SEC('key-round', on ? 'ทะเบียนสิทธิ์ที่ต้องเปิดให้พนักงานใหม่' : 'ทะเบียนสิทธิ์ที่ต้องเพิกถอน',
      list.length + ' รายการ · ' + KINDS.length + ' ชนิด ' + tipI('รายการปิดได้เฉพาะเมื่อมีผลตอบกลับจากต้นทางพร้อม ผู้ทำ เวลา และรหัสอ้างอิง — ไม่มีช่องให้คนติ๊กปิดเอง และไม่มีชั้นอนุมัติคั่นก่อนการเพิกถอน'),
      '<div class="mini-wrap"><table class="table tbl-fit ' + (on ? 'fit-on' : 'fit-off') + '"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>'
      + '<div class="rowgap mtop">'
      + (editable && !on && c.st !== 'cancelled' ? '<button class="btn btn-secondary btn-sm" onclick="openModal(\'addaccess\',{id:\'' + c.id + '\'})"><i data-lucide="plus" class="w-4 h-4"></i>เพิ่มรายการสิทธิ์ที่พบภายหลัง</button>' : '')
      + roleLink('จัดการที่ สิทธิ์ผู้ใช้งาน')
      + '<span class="hint-inline">ที่นี่ออกได้แค่คำขอ ' + tipI('การเปิดหรือปิดบัญชีและบทบาทจริงทำที่ สิทธิ์ผู้ใช้งาน — ที่นี่รอผลตอบกลับเท่านั้น') + '</span></div>');

  /* ---- คำขอคืนสิทธิ์ (เกิดจากการยกเลิกรอบหลังเพิกถอนไปแล้ว) ---- */
  const rest = list.filter(function (a) { return a.r === 'restore_req' || a.r === 'restored'; });
  if (rest.length) {
    h += SEC('rotate-ccw-square', 'คำขอคืนสิทธิ์', rest.filter(function (a) { return a.r === 'restored'; }).length + '/' + rest.length + ' คืนแล้ว',
      '<div class="mini-wrap"><table class="mini-tbl"><thead><tr><th>รายการ</th><th>เคยเพิกถอนเมื่อ</th><th>อ้างอิงการเพิกถอนเดิม</th><th>สถานะการคืน</th><th>ผลตอบกลับ</th></tr></thead><tbody>'
      + rest.map(function (a) {
        return '<tr><td>' + maskPlain(a.l) + '</td><td class="tnum">' + dtTH(a.revAt || '') + '</td><td class="tnum">' + (a.revRef || '—') + '</td><td>' + rPillA(a.r) + '</td>'
          + '<td>' + (a.ack ? empOf(a.ack.by).n + ' · ' + a.ack.ref : '<span class="text-mute-2">ยังไม่มีผลตอบกลับ</span>') + '</td></tr>';
      }).join('') + '</tbody></table></div>'
      + '<div class="hint-inline mtop">เป็นคำขอใหม่ ไม่ใช่การย้อนสถานะ ' + tipI('คำขอคืนสิทธิ์ชี้กลับไปยังการเพิกถอนเดิม และประวัติการเพิกถอนเดิมยังอยู่ครบ') + '</div>');
  }

  /* ---- สรุปตามชนิดสิทธิ์ — พิสูจน์ว่าทะเบียนครอบครบทุกชนิด ---- */
  h += SEC('layers', 'ชนิดสิทธิ์ที่ทะเบียนนี้ครอบ', KINDS.length + ' ชนิด',
      '<div class="mini-wrap"><table class="mini-tbl"><thead><tr><th>ชนิดสิทธิ์</th><th>ในรอบนี้</th><th>' + (on ? 'เปิดแล้ว' : 'เพิกถอนแล้ว') + '</th></tr></thead><tbody>'
      + KINDS.map(function (k) {
        const it = list.filter(function (a) { return a.k === k.k; });
        const dn = it.filter(function (a) { return on ? a.g === 'done' : (a.r === 'done' || a.r === 'restored'); }).length;
        return '<tr><td>' + k.n + '</td>'
          + '<td class="tnum">' + it.length + ' รายการ</td><td class="tnum">' + (it.length ? dn + '/' + it.length : '—') + '</td></tr>';
      }).join('') + '</tbody></table></div>');
  return h + '</div>';
}
</script>
<script>
/* ============================================================
   DRAWER · tab ทรัพย์สิน + tab ประวัติ
   ทรัพย์สินเป็นรายการระดับรอบ — ทะเบียนทรัพย์สินกลางยังไม่มีในระบบ (S-33 · FN-44)
   ประวัติเป็นแบบเพิ่มอย่างเดียว ไม่มีปุ่มลบถาวรที่ใดเลย (BR-19 · BR-20 · FN-52)
   ============================================================ */
function caseAssets(c) {
  const on = c.type === 'onboarding';
  const list = assetOf(c.id);
  const open = assetOpen(c);
  const editable = c.st !== 'closed' && c.st !== 'cancelled';
  const body = list.length ? list.map(function (a) {
    return '<tr>'
      + '<td><span class="cell-main">' + a.l + '</span><span class="cell-sub">' + a.id + '</span></td>'
      + '<td><span class="cell-main tnum">' + a.q + '</span></td>'
      + '<td>' + aPill(a.st) + '</td>'
      + '<td><span class="cell-main tnum">' + (a.at ? dTH(a.at) : '—') + '</span></td>'
      + '<td>' + (a.by ? personCell(a.by, empOf(a.by).p) : '<span class="cell-main text-mute-2">—</span>') + '</td>'
      + '<td><span class="cell-main">' + (a.note || '—') + '</span></td>'
      + '<td><span class="lnk-st is-off"><i data-lucide="unplug" class="w-3 h-3"></i>ยังไม่เชื่อม</span></td>'
      + '<td>' + (editable ? '<button class="btn btn-secondary btn-sm" onclick="openModal(\'asset\',{aid:\'' + a.id + '\'})"><i data-lucide="pencil" class="w-4 h-4"></i>บันทึก' + (on ? 'ส่งมอบ' : 'การคืน') + '</button>' : '<span class="text-mute-2">—</span>') + '</td>'
      + '</tr>';
  }).join('') : emptyRow(8, 'ยังไม่มีรายการทรัพย์สินของรอบนี้', 'เพิ่มรายการที่ต้องส่งมอบหรือรับคืนได้จากปุ่มด้านล่าง');

  let h = '<div class="scrollpad">';
  h += SEC('package', on ? 'ทรัพย์สินที่ต้องส่งมอบให้พนักงาน' : 'ทรัพย์สินที่ต้องรับคืน',
      progBar(list.length - open.length, list.length, open.length ? 'run' : ''),
      '<div class="mini-wrap"><table class="table tbl-min-wide"><thead><tr><th>รายการ</th><th>จำนวน</th><th>สถานะ</th><th>วันที่</th><th>' + (on ? 'ผู้ส่งมอบ' : 'ผู้รับคืน') + '</th><th>หมายเหตุ</th><th>ทะเบียนกลาง</th><th>การดำเนินการ</th></tr></thead><tbody>' + body + '</tbody></table></div>'
      + '<div class="rowgap mtop">'
      + (editable ? '<button class="btn btn-secondary btn-sm" onclick="openModal(\'addasset\',{id:\'' + c.id + '\'})"><i data-lucide="plus" class="w-4 h-4"></i>เพิ่มรายการทรัพย์สิน</button>' : '')
      + '<button class="lkout" onclick="openAsset()"><i data-lucide="external-link" class="w-3 h-3"></i>ทะเบียนทรัพย์สินกลาง</button>'
      + tipI('รายการเหล่านี้เป็นของรอบนี้เท่านั้น ทะเบียนทรัพย์สินกลางยังไม่มีในระบบ จึงเก็บช่องอ้างอิงไว้ก่อน') + '</div>');
  if (!on && open.length) {
    h += '<div class="note note-warn"><i data-lucide="alert-triangle" class="w-4 h-4"></i>'
      + '<span>ยังรับคืนไม่ครบ ' + open.length + ' รายการ — <b>ปิดรอบไม่ได้</b> แต่ <b>ไม่บล็อกการเพิกถอนสิทธิ์</b> เพราะความปลอดภัยมาก่อนงานเอกสาร</span>'
      + '<span class="note-act"><button class="btn btn-secondary btn-sm" onclick="dwTab(\'access\')"><i data-lucide="arrow-right" class="w-4 h-4"></i>ดูทะเบียนสิทธิ์</button></span></div>';
  }
  return h + '</div>';
}

const AUDK = {
  create:{ i:'plus', c:'' }, edit:{ i:'pencil', c:'' }, submit:{ i:'send', c:'' },
  approve:{ i:'check', c:'is-ok' }, reject:{ i:'x', c:'is-no' }, cancel:{ i:'ban', c:'is-no' },
  revoke:{ i:'shield-x', c:'is-ok' }, restore:{ i:'rotate-ccw', c:'is-now' }, grant:{ i:'key-round', c:'is-ok' },
  alarm:{ i:'siren', c:'is-no' }, state:{ i:'activity', c:'' }, task:{ i:'list-checks', c:'' },
  access:{ i:'key-square', c:'is-now' }, asset:{ i:'package', c:'' }, view:{ i:'eye', c:'' },
  prob:{ i:'clipboard-check', c:'' }, close:{ i:'check-check', c:'is-ok' }, temp:{ i:'key-round', c:'is-now' }
};
function caseHistory(c) {
  const rows = AUDIT.filter(function (a) { return a.case === c.id; }).slice().sort(function (a, b) { return a.at < b.at ? 1 : -1; });
  const body = rows.length ? rows.map(function (a) {
    const k = AUDK[a.k] || { i:'circle', c:'' };
    return '<div class="chn-i"><div class="chn-d ' + k.c + '"><i data-lucide="' + k.i + '" class="w-3 h-3"></i></div>'
      + '<div class="min0"><div class="chn-t">' + a.t + '</div>'
      + '<div class="chn-m">' + (a.by === 'system' ? 'ระบบตามเวลาที่กำหนด' : empOf(a.by).n + ' · ' + empOf(a.by).p) + ' · ' + dtTH(a.at) + '</div>'
      + (a.m ? '<div class="chn-m">' + a.m + '</div>' : '') + '</div></div>';
  }).join('') : '<div class="hint-inline">ยังไม่มีรายการในประวัติของรอบนี้</div>';
  return '<div class="scrollpad">'
    + SEC('scroll-text', 'ประวัติของรอบนี้', rows.length + ' รายการ ' + tipI('บันทึกทุกการสร้าง แก้ไข ส่งอนุมัติ อนุมัติ เพิกถอน คืนสิทธิ์ ยกเลิก และทุกการเปิดดูข้อมูลอ่อนไหว — เพิ่มได้อย่างเดียว แก้และลบไม่ได้'),
        '<div class="chn">' + body + '</div>')
    + SEC('shield-check', 'สิ่งที่ทำกับประวัตินี้ไม่ได้', '',
        '<div class="rev-dl">'
        + '<dt>ลบรอบหรือลบงานถาวร</dt><dd>ไม่มีปุ่มลบถาวรที่ใดในหน้านี้ — มีแต่การยกเลิกผ่านหน้าต่างยืนยันพร้อมเหตุผล</dd>'
        + '<dt>แก้ไขรายการในประวัติ</dt><dd>รายการเพิ่มได้อย่างเดียว การแก้ไขจะกลายเป็นรายการใหม่</dd>'
        + '<dt>ลบข้อมูลบุคคลหลังพ้นสภาพ</dt><dd>ไม่มีที่นี่ — ประวัติยังอ่านได้เสมอ และผู้กำหนดนโยบายเป็นผู้ตัดสินเรื่องระยะเก็บรักษา</dd>'
        + '</div>');
}
</script>
<script>
/* ============================================================
   MODAL + ACTIONS
   ทุกการยกเลิก/ปิดงานผ่านหน้าต่างยืนยันเสมอ และเป็นการเก็บถาวรแบบไม่ลบ (BR-20 · FN-94)
   ไม่มีชั้นอนุมัติคั่นก่อนการเพิกถอน และแผงเพิกถอนไม่มีตัวเลือกผู้อนุมัติ (DOA_BRIEF §2.1)
   ============================================================ */
state.mf = { rs:'', slots:[], busy:false, f:{} };
function setMF(k, v) { state.mf[k] = v; render(); }
function setMQuiet(k, v) { state.mf[k] = v; }
function setMFF(k, v) { state.mf.f[k] = v; render(); }
function mCase() { return caseOf((state.modal.data || {}).id); }
function mHead(icon, title, sub, cls) {
  return '<div class="modal-header"><div class="modal-header-icon ' + (cls || '') + '"><i data-lucide="' + icon + '" class="w-5 h-5"></i></div>'
    + '<div class="min0"><div class="modal-title">' + title + '</div>' + (sub ? '<div class="modal-subtitle">' + sub + '</div>' : '') + '</div></div>';
}
const REASON_PRESET = {
  cancel_on:  ['ผู้สมัครแจ้งสละสิทธิ์และไม่มาเริ่มงาน','ยกเลิกการจ้างก่อนวันเริ่มงาน','เลื่อนการจ้างออกไปไม่มีกำหนด'],
  cancel_off: ['พนักงานถอนการลาออกและตกลงทำงานต่อ','ตกลงย้ายตำแหน่งภายในแทนการออก','ผู้อนุมัติสั่งทบทวนการเลิกจ้าง'],
  reject:     ['ยังไม่ได้ตกลงเรื่องผู้รับมอบงาน','วันทำงานวันสุดท้ายไม่สอดคล้องกับแผนงาน','ข้อมูลในรอบยังไม่ครบ ขอให้แก้แล้วยื่นใหม่'],
  task:       ['ตำแหน่งนี้ไม่เกี่ยวกับงานดังกล่าว','ทำไปแล้วในกระบวนการอื่น','ปรับชุดงานให้ตรงกับหน้างานจริง'],
  access:     ['พบสิทธิ์ที่ไม่อยู่ในทะเบียนตั้งต้น','ได้รับสิทธิ์ชั่วคราวระหว่างทางและยังไม่ถูกถอน','เจ้าของระบบแจ้งเพิ่มภายหลัง']
};
function reasonField(label, presetKey) {
  return '<div class="field' + (state.mf.err ? ' is-invalid' : '') + '"><label class="field-label">' + label + ' <span class="text-danger">*</span></label>'
    + '<textarea class="input ta-auto" rows="2" oninput="setMQuiet(\'rs\',this.value)" placeholder="บังคับกรอก">' + (state.mf.rs || '') + '</textarea>'
    + '<div class="chips">' + (REASON_PRESET[presetKey] || []).map(function (t) {
        return '<button class="chip-btn" onclick="setMF(\'rs\',\'' + t + '\')">' + t + '</button>';
      }).join('') + '</div>'
    + (state.mf.err ? '<div class="field-error on">' + state.mf.err + '</div>' : '') + '</div>';
}
function busyBtn(label, icon, fn, cls) {
  return '<button class="btn ' + (cls || 'btn-primary') + (state.mf.busy ? ' is-disabled' : '') + '"' + (state.mf.busy ? ' disabled' : '')
    + ' onclick="' + fn + '">' + (state.mf.busy ? '<i data-lucide="loader-2" class="w-4 h-4 spin"></i>กำลังดำเนินการ…' : '<i data-lucide="' + icon + '" class="w-4 h-4"></i>' + label) + '</button>';
}
function openModal(type, data) {
  state.modal = { open:true, type:type, data:data || {} };
  state.mf = { rs:'', slots:[], busy:false, err:'', f:{} };
  const c = mCase();
  if (type === 'dates' && c) state.mf.f = { start:c.start || '', notice:c.notice || '', lwd:c.lwd || '' };
  if (type === 'close' && c) state.mf.f = { rehire:c.rehire };
  if (type === 'addtask') state.mf.f = { n:'', g:'HR', as:'', due:'', m:true };
  if (type === 'addaccess') state.mf.f = { k:'token', l:'', a:'' };
  if (type === 'addasset') state.mf.f = { l:'', q:1 };
  if (type === 'tempaccess' && c) state.mf.f = { to:'', until:'' };
  if (type === 'asset') { const a = assetById(data.aid); state.mf.f = { st:a ? a.st : 'wait', note:a ? a.note : '' }; }
  render();
  requestAnimationFrame(function () { document.getElementById('modalBackdrop').classList.add('is-open'); });
}
function assetById(id) { for (let i=0;i<ASSETS.length;i++) if (ASSETS[i].id === id) return ASSETS[i]; return null; }
function accById(id) { for (let i=0;i<ACCESS.length;i++) if (ACCESS[i].id === id) return ACCESS[i]; return null; }

/* ---- ส่งอนุมัติ: resolve สายจาก engine แล้วเลือก "คน" ในตำแหน่ง (มติ 2026-08-17 · FN-24) ---- */
function openSubmit(id) {
  const c = caseOf(id); if (!c) return;
  const e = createErrorsFor(c);
  if (e) { showToast(e, 'warning'); return; }
  openModal('submit', { id:id });
  state.mf.slots = resolveDoa(c, P().emp).map(function (s) { return { roles:s.roles, roleName:s.roleName, as:s.suggest }; });
  render();
}
function createErrorsFor(c) {
  if (!c.reason) return 'ยังไม่ได้เลือกเหตุผลการออก';
  if (!c.notice) return 'ยังไม่ได้ระบุวันแจ้ง';
  if (!c.lwd) return 'ยังไม่ได้ระบุวันทำงานวันสุดท้าย';
  if (inClosedPeriod(c.lwd)) return 'วันทำงานวันสุดท้ายตกในงวดที่ปิดแล้ว — วันที่เร็วที่สุดที่ตั้งได้คือ ' + dTH(FIRST_OPEN_DAY);
  return '';
}

function modalHTML() {
  const ty = state.modal.type;
  const c = mCase();

  if (ty === 'submit' && c) {
    const entry = doaEntryOf(c);
    let sb = '';
    state.mf.slots.forEach(function (s, i) {
      const key = 'md-slot' + i;
      COMBOS.push({ key:key, cfg:{ options:empOptions(EMP_ALL.filter(function (k) { return k !== c.emp; })), value:s.as, placeholder:'เลือกผู้อนุมัติในตำแหน่งนี้', onSelect:function (v) { state.mf.slots[i].as = v || ''; render(); } } });
      sb += '<div class="slot-row ' + (s.as ? '' : 'is-err') + (doaKindOf(c) === 'involuntary' && i === state.mf.slots.length - 1 ? ' is-extra' : '') + '"><span class="slot-no">' + (i+1) + '</span>'
        + '<div class="slot-main"><span class="slot-role">' + s.roleName + '<span>' + s.roles.join(' · ') + (doaKindOf(c) === 'involuntary' && i === state.mf.slots.length - 1 ? ' · ขั้นที่เพิ่มจากประเภทการออก' : '') + '</span></span>'
        + '<div>' + searchSelectHTML(key, { placeholder:'เลือกผู้อนุมัติในตำแหน่งนี้' })
        + (s.as ? '<div class="slot-pick">' + personCell(s.as) + '</div>' : '<div class="slot-pick hint-inline">ยังไม่ได้เลือกคนในตำแหน่งนี้</div>') + '</div></div></div>';
    });
    return mHead('send', 'ส่งอนุมัติรอบออกงาน', empOf(c.emp).n + ' · ' + mask(reasonOf(c.reason).n) + (c.imm ? ' · ออกทันที' : '') + ' · สาย ' + state.mf.slots.length + ' ขั้น')
      + '<div class="modal-body">' + sb
      + '<div class="hint-inline mtop">จำนวนขั้นมาจากระบบสายอนุมัติ ' + entry.doa_entry_ref + ' ' + tipI('สายถูกดึง ณ เวลากดส่งแล้วเก็บติดไว้กับรอบ — ผู้สร้างรอบและผู้ที่จะออกไม่ถูกเสนอเป็นผู้เซ็น') + '</div></div>'
      + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>' + busyBtn('ส่งอนุมัติ', 'send', 'doSubmit()') + '</div>';
  }

  if (ty === 'approve' && c) {
    const i = chainStepNow(c);
    return mHead('check-circle-2', 'อนุมัติรอบออกงาน', empOf(c.emp).n + ' · ขั้นที่ ' + (i+1) + ' จาก ' + c.chain.length)
      + '<div class="modal-body"><div class="kv">'
      + KV('เหตุผลการออก', mask(reasonOf(c.reason).n))
      + KV('วันทำงานวันสุดท้าย', dTH(c.lwd))
      + KV('เวลาเพิกถอนสิทธิ์ที่จะถูกตั้ง', c.imm ? 'ทันทีที่อนุมัติครบสาย' : 'สิ้นวัน ' + dTH(c.lwd))
      + KV('งวดของวันสุดท้าย', (periodOf(c.lwd) || { n:'—', st:'' }).n + ' · ' + ((periodOf(c.lwd) || {}).st === 'closed' ? 'ปิดแล้ว' : 'เปิดอยู่'))
      + '</div>'
      + (inClosedPeriod(c.lwd) ? '<div class="note note-danger mtop"><i data-lucide="octagon-alert" class="w-4 h-4"></i><span>วันทำงานวันสุดท้ายตกในงวดที่ปิดแล้ว — อนุมัติไม่ได้ ต้องแก้วันที่ก่อน</span></div>' : '')
      + '<div class="field mtop"><label class="field-label">หมายเหตุถึงผู้ขอ</label>'
      + '<textarea class="input ta-auto" rows="2" oninput="setMQuiet(\'rs\',this.value)" placeholder="ไม่บังคับ">' + (state.mf.rs || '') + '</textarea></div></div>'
      + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>'
      + (inClosedPeriod(c.lwd) ? '<button class="btn btn-primary is-disabled" disabled><i data-lucide="check" class="w-4 h-4"></i>อนุมัติ</button>' : busyBtn('อนุมัติ', 'check', 'doApprove()')) + '</div>';
  }

  if (ty === 'reject' && c) {
    return mHead('x-circle', 'ไม่อนุมัติรอบออกงาน', empOf(c.emp).n + ' · ' + c.id, 'is-danger')
      + '<div class="modal-body">' + reasonField('เหตุผลที่ไม่อนุมัติ', 'reject')
      + '<div class="hint-inline">กลับเป็นร่าง แก้แล้วส่งใหม่ได้ ' + tipI('การส่งใหม่จะดึงสายอนุมัติใหม่ทั้งสาย และยังไม่มีสิทธิ์ใดถูกแตะ') + '</div></div>'
      + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>' + busyBtn('ไม่อนุมัติ', 'x', 'doReject()', 'btn-danger') + '</div>';
  }

  if (ty === 'cancel' && c) {
    const revoked = accOf(c.id).filter(function (a) { return a.r === 'done'; }).length;
    const openTasks = tasksOf(c.id).filter(function (t) { return t.st !== 'done' && t.st !== 'cancelled'; }).length;
    return mHead('ban', 'ยกเลิกรอบ' + (c.type === 'onboarding' ? 'เข้างาน' : 'ออกงาน'), empOf(c.emp).n + ' · ' + c.id, 'is-danger')
      + '<div class="modal-body">'
      + '<div class="kv">' + KV('งานที่ค้างและจะถูกปิด', '<span class="tnum">' + openTasks + ' งาน</span>')
      + KV(c.type === 'onboarding' ? 'สิทธิ์ที่เปิดไปแล้ว' : 'สิทธิ์ที่เพิกถอนไปแล้ว', '<span class="tnum">' + (c.type === 'onboarding' ? accOf(c.id).filter(function (a) { return a.g === 'done'; }).length : revoked) + ' รายการ</span>') + '</div>'
      + (c.type === 'onboarding' && accOf(c.id).some(function (a) { return a.g === 'done'; })
          ? '<div class="note note-warn mtop"><i data-lucide="shield-x" class="w-4 h-4"></i><span>เปิดบัญชีให้ไปแล้ว — การยกเลิกจะออกคำขอปิดบัญชีและถอนบทบาททันที ไม่ใช่แค่ปิดรอบ</span></div>' : '')
      + (c.type === 'offboarding' && revoked
          ? '<div class="note note-danger mtop"><i data-lucide="rotate-ccw" class="w-4 h-4"></i><span>สิทธิ์ถูกเพิกถอนไปแล้ว ' + revoked + ' รายการ — การยกเลิกจะออก <b>คำขอคืนสิทธิ์ใหม่</b> ที่ชี้กลับไปยังการเพิกถอนเดิม ไม่ใช่การย้อนสถานะ และประวัติเดิมยังอยู่ครบ</span></div>' : '')
      + (c.type === 'offboarding' && c.st !== 'draft'
          ? '<div class="hint-inline mtop">ต้องผ่านผู้อนุมัติชุดเดิม ' + (c.chain || []).length + ' ขั้น ' + tipI('การถอนการตัดสินใจต้องผ่านคนชุดเดียวกับที่อนุมัติการออก') + '</div>' : '')
      + reasonField('เหตุผลที่ยกเลิก', c.type === 'onboarding' ? 'cancel_on' : 'cancel_off') + '</div>'
      + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ไม่ใช่ตอนนี้</button>' + busyBtn('ยกเลิกรอบ', 'ban', 'doCancel()', 'btn-danger') + '</div>';
  }

  if (ty === 'close' && c) {
    const bl = closeBlockers(c);
    const on = c.type === 'onboarding';
    return mHead('check-check', 'ปิดรอบ' + (on ? 'เข้างาน' : 'ออกงาน'), empOf(c.emp).n + ' · ' + c.id)
      + '<div class="modal-body">'
      + (bl.length || isOverdue(c)
        ? '<div class="note note-danger"><i data-lucide="octagon-alert" class="w-4 h-4"></i><span>ปิดรอบไม่ได้ — ยังมีรายการค้างอยู่</span></div>'
          + '<div class="mtop">'
          + (isOverdue(c) ? '<div class="wu-row"><div class="min0"><div class="wu-nm">ติดธงเพิกถอนค้าง</div><div class="wu-mt">เลยกำหนดมา ' + overdueHours(c) + ' ชั่วโมง</div></div></div>' : '')
          + bl.map(function (b) { return '<div class="wu-row"><div class="min0"><div class="wu-nm">' + b.n + '</div><div class="wu-mt">' + b.d.slice(0,3).join(' · ') + '</div></div></div>'; }).join('')
          + '</div>'
        : '<div class="kv">' + KV('งานบังคับ', 'ครบแล้ว') + KV(on ? 'สิทธิ์ที่เปิด' : 'สิทธิ์ที่เพิกถอน', 'ครบทุกรายการ') + '</div>'
          + (!on ? '<div class="field mtop"><label class="field-label">ธงสิทธิ์การจ้างกลับ ' + tipI('แสดงผลอย่างเดียว ไม่บล็อกการสรรหา — การบังคับใช้เป็นของ feature สรรหา') + '</label>'
              + '<div class="chips"><button class="chip-btn' + (state.mf.f.rehire === true ? ' is-on' : '') + '" onclick="setMFF(\'rehire\',true)">จ้างกลับได้</button>'
              + '<button class="chip-btn' + (state.mf.f.rehire === false ? ' is-on' : '') + '" onclick="setMFF(\'rehire\',false)">ไม่แนะนำให้จ้างกลับ</button></div></div>'
              + '<div class="field"><label class="field-label">เหตุผลของธง</label><textarea class="input ta-auto" rows="2" oninput="setMQuiet(\'rs\',this.value)" placeholder="ไม่บังคับ">' + (state.mf.rs || '') + '</textarea></div>' : ''))
      + '</div>'
      + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>'
      + (bl.length || isOverdue(c) ? '<button class="btn btn-primary is-disabled" disabled><i data-lucide="check-check" class="w-4 h-4"></i>ปิดรอบ</button>' : busyBtn('ปิดรอบ', 'check-check', 'doClose()')) + '</div>';
  }

  if (ty === 'dates' && c) {
    const on = c.type === 'onboarding';
    const nv = on ? state.mf.f.start : state.mf.f.lwd;
    const bad = nv && inClosedPeriod(nv);
    const affected = tasksOf(c.id).filter(function (t) { return t.st !== 'done' && t.st !== 'cancelled'; }).length;
    return mHead('calendar-cog', on ? 'แก้วันเริ่มงาน' : 'แก้วันที่ของรอบออกงาน', empOf(c.emp).n + ' · ' + c.id)
      + '<div class="modal-body">'
      + (on
        ? '<div class="field' + (bad ? ' is-invalid' : '') + '"><label class="field-label">วันเริ่มงานใหม่</label><input class="input" type="date" value="' + state.mf.f.start + '" onchange="setMFF(\'start\',this.value)">'
          + (bad ? '<div class="field-error on">ตกในงวดที่ปิดแล้ว — วันที่เร็วที่สุดที่ตั้งได้คือ ' + dTH(FIRST_OPEN_DAY) + '</div>' : '') + '</div>'
        : '<div class="field"><label class="field-label">วันแจ้งใหม่</label><input class="input" type="date" value="' + state.mf.f.notice + '" onchange="setMFF(\'notice\',this.value)"></div>'
          + '<div class="field' + (bad ? ' is-invalid' : '') + '"><label class="field-label">วันทำงานวันสุดท้ายใหม่</label><input class="input" type="date" value="' + state.mf.f.lwd + '" onchange="setMFF(\'lwd\',this.value)">'
          + (bad ? '<div class="field-error on">ตกในงวดที่ปิดแล้ว — วันที่เร็วที่สุดที่ตั้งได้คือ ' + dTH(FIRST_OPEN_DAY) + '</div>' : '') + '</div>')
      + reasonField('เหตุผลที่แก้วันที่', 'task')
      + '<div class="hint-inline">คำนวณกำหนดเสร็จใหม่ ' + affected + ' งาน ' + tipI('งานที่เสร็จแล้วไม่ถูกแตะ' + (!on ? ' · เวลาเพิกถอนสิทธิ์จะถูกตั้งใหม่ตามวันทำงานวันสุดท้ายใหม่' : '')) + '</div></div>'
      + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>'
      + (bad ? '<button class="btn btn-primary is-disabled" disabled><i data-lucide="save" class="w-4 h-4"></i>บันทึก</button>' : busyBtn('บันทึกและคำนวณใหม่', 'save', 'doDates()')) + '</div>';
  }

  if (ty === 'task') {
    const t = taskById((state.modal.data || {}).tid);
    if (!t) return '';
    const cc = caseOf(t.case);
    const editable = cc.st !== 'closed' && cc.st !== 'cancelled';
    COMBOS.push({ key:'md-rec', cfg:{ options:empOptions(), value:t.rec, placeholder:'เลือกผู้รับมอบ', onSelect:function (v) { t.rec = v || ''; render(); } } });
    return mHead('list-checks', t.n, t.c + ' · ' + t.g + ' · ' + (t.m ? 'งานบังคับ' : 'งานเสริม'))
      + '<div class="modal-body"><div class="kv">'
      + KV('ผู้รับผิดชอบ', t.as ? empOf(t.as).n : 'ตามตำแหน่ง')
      + KV('ชนิดการมอบหมาย', t.at)
      + KV('กำหนดเสร็จ', t.due ? dTH(t.due) : 'ผู้ใช้ตั้งวันเอง')
      + KV('สถานะ', tkPill(t.st))
      + '</div>'
      + (t.c === 'TK-OF-01' ? '<div class="field mtop"><label class="field-label">ผู้รับมอบข้อมูล</label>' + searchSelectHTML('md-rec', { placeholder:'เลือกผู้รับมอบ' }) + '</div>' : '')
      + '<div class="field mtop"><label class="field-label">หลักฐานที่แนบไว้</label><div class="rowgap">' + (t.ev ? docLink(t.ev) : '<span class="text-mute-2">ยังไม่มีไฟล์แนบ</span>')
      + (editable ? '<button class="chip-btn" onclick="doAttach(\'' + t.id + '\')"><i data-lucide="paperclip" class="w-3 h-3"></i>แนบไฟล์ผ่าน คลังเอกสาร</button>' : '') + '</div></div>'
      + '<div class="rowgap mtop">' + opLink(t.sow, 'เปิดงานจริง ' + t.sow) + '</div>'
      + (editable && t.st !== 'done' ? '<div class="field mtop"><label class="field-label">ปิดงานนี้ออกจากรอบ (นอกแม่แบบ)</label>' + reasonField('เหตุผลที่ปิดงาน', 'task') + '</div>' : '')
      + '</div>'
      + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ปิด</button>'
      + (editable && t.st !== 'done' ? '<button class="btn btn-danger" onclick="doTaskDrop(\'' + t.id + '\')"><i data-lucide="minus-circle" class="w-4 h-4"></i>ปิดงานพร้อมเหตุผล</button>' : '')
      + (editable && t.st !== 'done' ? busyBtn('บันทึกว่าเสร็จ', 'check', 'doTaskDone(\'' + t.id + '\')') : '') + '</div>';
  }

  if (ty === 'addtask' && c) {
    COMBOS.push({ key:'md-as', cfg:{ options:empOptions(), value:state.mf.f.as, placeholder:'เลือกผู้รับผิดชอบ', onSelect:function (v) { state.mf.f.as = v || ''; render(); } } });
    return mHead('plus', 'เพิ่มงานเฉพาะรอบนี้', c.id + ' · แม่แบบต้นทางจะไม่ถูกแก้')
      + '<div class="modal-body">'
      + '<div class="field"><label class="field-label">ชื่องาน <span class="text-danger">*</span></label><input class="input" value="' + state.mf.f.n + '" placeholder="กริยา + สิ่งที่ทำ เช่น อบรมความปลอดภัยก่อนเข้าพื้นที่" oninput="state.mf.f.n=this.value"></div>'
      + '<div class="field"><label class="field-label">กลุ่มผู้รับผิดชอบ</label><select class="select" onchange="setMFF(\'g\',this.value)">'
      + ['HR','IT','ธุรการ','การเงิน','หัวหน้า','พนักงาน'].map(function (g) { return '<option value="' + g + '"' + (state.mf.f.g === g ? ' selected' : '') + '>' + g + '</option>'; }).join('') + '</select></div>'
      + '<div class="field"><label class="field-label">ผู้รับผิดชอบ</label>' + searchSelectHTML('md-as', { placeholder:'เลือกผู้รับผิดชอบ' }) + '</div>'
      + '<div class="field"><label class="field-label">กำหนดเสร็จ</label><input class="input" type="date" value="' + state.mf.f.due + '" onchange="setMFF(\'due\',this.value)"></div>'
      + '<div class="field"><label class="sw' + (state.mf.f.m ? ' on' : '') + '" onclick="setMFF(\'m\',' + (!state.mf.f.m) + ')"><span class="sw-box"></span><span>เป็นงานบังคับ — ปิดรอบไม่ได้ถ้ายังไม่เสร็จ</span></label></div>'
      + reasonField('เหตุผลที่เพิ่มงาน', 'task') + '</div>'
      + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>' + busyBtn('เพิ่มงาน', 'plus', 'doAddTask()') + '</div>';
  }

  if (ty === 'grantreq' && c) {
    const items = accOf(c.id).filter(function (a) { return a.g === 'none'; });
    return mHead('send', 'ส่งคำขอเปิดสิทธิ์', empOf(c.emp).n + ' · ' + items.length + ' รายการ')
      + '<div class="modal-body"><div class="mini-wrap"><table class="mini-tbl"><thead><tr><th>ชนิดสิทธิ์</th><th>รายการที่จะขอ</th></tr></thead><tbody>'
      + items.map(function (a) { return '<tr><td>' + kindOf(a.k).n + '</td><td>' + a.l + '<br><span class="cell-sub tnum">' + a.a + '</span></td></tr>'; }).join('')
      + '</tbody></table></div>'
      + '<div class="hint-inline mtop">ตรวจรายการให้ครบก่อนส่ง ' + tipI('คำขอจะถูกส่งไปยัง สิทธิ์ผู้ใช้งาน แล้วรอผลตอบกลับ รายการจะปิดเองเมื่อได้ผลตอบกลับว่าเปิดแล้ว') + '</div></div>'
      + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>' + busyBtn('ส่งคำขอ ' + items.length + ' รายการ', 'send', 'doGrantReq()') + '</div>';
  }

  if (ty === 'revokeall' && c) {
    const items = accOf(c.id).filter(function (a) { return a.r === 'none'; });
    return mHead('shield-x', 'เพิกถอนสิทธิ์ทั้งหมด', empOf(c.emp).n + ' · ' + items.length + ' รายการ', 'is-danger')
      + '<div class="modal-body"><div class="kv">'
      + KV('มีผลเมื่อ', c.revDue ? dtTH(c.revDue) : '—')
      + KV('เหตุที่ถึงเวลาแล้ว', c.imm ? 'มีธงออกทันที เพิกถอนทันทีที่อนุมัติครบสาย' : 'สิ้นวันทำงานวันสุดท้าย')
      + '</div>'
      + '<div class="mini-wrap mtop"><table class="mini-tbl"><thead><tr><th>ชนิดสิทธิ์</th><th>รายการ</th><th>ที่มา</th></tr></thead><tbody>'
      + items.map(function (a) { return '<tr><td>' + kindOf(a.k).n + '</td><td>' + a.l + '</td><td>' + SRC[a.src] + '</td></tr>'; }).join('')
      + '</tbody></table></div>'
      + '<div class="hint-inline mtop">ส่งคำขอทุกรายการ ไม่มีชั้นอนุมัติคั่น ' + tipI('รายการจะปิดได้ก็ต่อเมื่อมีผลตอบกลับพร้อมผู้ทำ เวลา และรหัสอ้างอิงจาก สิทธิ์ผู้ใช้งาน') + '</div></div>'
      + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>' + busyBtn('ส่งคำขอเพิกถอน ' + items.length + ' รายการ', 'shield-x', 'doRevokeAll()', 'btn-danger') + '</div>';
  }

  if (ty === 'addaccess' && c) {
    return mHead('plus', 'เพิ่มรายการสิทธิ์ที่พบภายหลัง', c.id + ' · รอบนี้จะปิดไม่ได้จนกว่าจะเพิกถอนรายการนี้ด้วย')
      + '<div class="modal-body">'
      + '<div class="field"><label class="field-label">ชนิดสิทธิ์</label><select class="select" onchange="setMFF(\'k\',this.value)">'
      + KINDS.map(function (k) { return '<option value="' + k.k + '"' + (state.mf.f.k === k.k ? ' selected' : '') + '>' + k.n + '</option>'; }).join('') + '</select></div>'
      + '<div class="field"><label class="field-label">ชื่อรายการ <span class="text-danger">*</span></label><input class="input" value="' + state.mf.f.l + '" placeholder="เช่น กุญแจ API อ่านบันทึกระบบ" oninput="state.mf.f.l=this.value"></div>'
      + '<div class="field"><label class="field-label">รหัสอ้างอิงของต้นทาง</label><input class="input" value="' + state.mf.f.a + '" placeholder="เช่น api-log-reader" oninput="state.mf.f.a=this.value"></div>'
      + reasonField('เหตุผลที่เพิ่มรายการ', 'access') + '</div>'
      + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>' + busyBtn('เพิ่มเข้าทะเบียน', 'plus', 'doAddAccess()') + '</div>';
  }

  if (ty === 'tempaccess' && c) {
    COMBOS.push({ key:'md-tmp', cfg:{ options:empOptions(), value:state.mf.f.to, placeholder:'เลือกผู้รับมอบข้อมูล', onSelect:function (v) { state.mf.f.to = v || ''; render(); } } });
    return mHead('key-round', 'ขอสิทธิ์ชั่วคราวให้ผู้รับมอบ', 'แทนการเลื่อนเวลาเพิกถอนของผู้ที่ออก')
      + '<div class="modal-body">'
      + '<div class="field"><label class="field-label">ผู้รับมอบข้อมูล <span class="text-danger">*</span></label>' + searchSelectHTML('md-tmp', { placeholder:'เลือกผู้รับมอบข้อมูล' }) + '</div>'
      + '<div class="field"><label class="field-label">ให้สิทธิ์ถึงวันที่</label><input class="input" type="date" value="' + state.mf.f.until + '" onchange="setMFF(\'until\',this.value)"></div>'
      + '<div class="hint-inline">เวลาเพิกถอนของผู้ที่ออกไม่ถูกเลื่อน ' + tipI('คำขอนี้ส่งไปยัง สิทธิ์ผู้ใช้งาน เช่นเดียวกับคำขออื่น และถูกบันทึกเป็นเหตุการณ์ด้านความปลอดภัย') + '</div></div>'
      + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>' + busyBtn('ส่งคำขอสิทธิ์ชั่วคราว', 'send', 'doTempAccess()') + '</div>';
  }

  if (ty === 'asset') {
    const a = assetById((state.modal.data || {}).aid);
    if (!a) return '';
    const cc = caseOf(a.case), on = cc.type === 'onboarding';
    const opts = on ? [['wait','รอส่งมอบ'],['handed','ส่งมอบแล้ว']] : [['wait','รอคืน'],['returned','คืนแล้ว'],['cant','คืนไม่ได้']];
    return mHead('package', a.l, cc.id + ' · จำนวน ' + a.q)
      + '<div class="modal-body">'
      + '<div class="field"><label class="field-label">สถานะ</label><div class="chips">'
      + opts.map(function (o) { return '<button class="chip-btn' + (state.mf.f.st === o[0] ? ' is-on' : '') + '" onclick="setMFF(\'st\',\'' + o[0] + '\')">' + o[1] + '</button>'; }).join('') + '</div></div>'
      + (state.mf.f.st === 'cant' ? '<div class="field"><label class="field-label">เหตุผลที่คืนไม่ได้ <span class="text-danger">*</span></label><textarea class="input ta-auto" rows="2" oninput="setMQuiet(\'rs\',this.value)">' + (state.mf.rs || '') + '</textarea></div>' : '')
      + '<div class="hint-inline">การคืนไม่ครบทำให้ปิดรอบไม่ได้ แต่ไม่บล็อกการเพิกถอนสิทธิ์</div></div>'
      + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>' + busyBtn('บันทึก', 'save', 'doAsset()') + '</div>';
  }

  if (ty === 'addasset' && c) {
    return mHead('plus', 'เพิ่มรายการทรัพย์สินของรอบ', c.id)
      + '<div class="modal-body">'
      + '<div class="field"><label class="field-label">ชื่อรายการ <span class="text-danger">*</span></label><input class="input" value="' + state.mf.f.l + '" placeholder="เช่น โน้ตบุ๊กและอะแดปเตอร์" oninput="state.mf.f.l=this.value"></div>'
      + '<div class="field"><label class="field-label">จำนวน</label><input class="input" type="number" min="1" value="' + state.mf.f.q + '" oninput="state.mf.f.q=this.value"></div>'
      + '<div class="hint-inline">เป็นรายการของรอบนี้เท่านั้น ' + tipI('ทะเบียนทรัพย์สินกลางยังไม่มีในระบบ จึงเก็บช่องอ้างอิงไว้ก่อน') + '</div></div>'
      + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>' + busyBtn('เพิ่มรายการ', 'plus', 'doAddAsset()') + '</div>';
  }
  return '';
}
</script>
<script>
/* ============================================================
   ACTIONS — ทุก transition ลงประวัติแบบเพิ่มอย่างเดียว
   จุดยิงเหตุการณ์ถึงระบบแจ้งเตือนและระบบผลกระทบเขียนไว้เป็นคอมเมนต์ตรงจุดเกิดจริง
   ============================================================ */
function guardBusy() { if (state.mf.busy) return true; state.mf.busy = true; render(); return false; }
function endBusy(msg, variant, reopenTab) {
  state.mf.busy = false;
  closeModal();
  setTimeout(function () {
    buildTasks();
    if (reopenTab && state.dw) state.dw.tab = reopenTab;
    render();
    if (msg) showToast(msg, variant || 'success');
  }, 240);
}
function needReason() {
  if (!(state.mf.rs || '').trim()) { state.mf.err = 'ต้องกรอกเหตุผล'; render(); showToast('ต้องกรอกเหตุผลก่อน', 'warning'); return true; }
  return false;
}

/* ---- ส่งอนุมัติ (T-7) ---- */
function doSubmit() {
  const c = mCase(); if (!c) return;
  if (state.mf.slots.some(function (s) { return !s.as; })) { showToast('เลือกผู้อนุมัติให้ครบทุกขั้นก่อน', 'warning'); return; }
  if (guardBusy()) return;
  setTimeout(function () {
    const entry = doaEntryOf(c);
    /* [DOA-HOOK] สายที่ resolve มาถูก freeze ลง approval_chain — ชั้นเลือกจากประเภทการออก ไม่ใช่จำนวนเงิน */
    c.chain = state.mf.slots.map(function (s) { return { as:s.as, role:s.roles[0], roleName:s.roleName, st:'wait', at:'', note:'' }; });
    c.entry = entry.doa_entry_ref; c.action = entry.action;
    c.st = 'pending'; c.appStatus = 'pending_approval';
    pushAudit(c.id, 'submit', 'ส่งอนุมัติ', 'สายอนุมัติ ' + c.chain.length + ' ขั้น · ' + entry.doa_entry_ref);
    endBusy('ส่งอนุมัติแล้ว — รอ ' + empOf(c.chain[0].as).n + ' ลงนามเป็นขั้นแรก', 'success', 'overview');
  }, 700);
}
/* ---- อนุมัติ (T-8) ---- */
function doApprove() {
  const c = mCase(); if (!c) return;
  if (guardBusy()) return;
  setTimeout(function () {
    const i = chainStepNow(c);
    if (i >= 0) { c.chain[i].st = 'ok'; c.chain[i].at = nowStr(); c.chain[i].note = (state.mf.rs || ''); }
    const left = chainStepNow(c);
    if (left < 0) {
      c.st = 'approved'; c.appStatus = 'approved';
      c.revDue = c.imm ? nowStr() : (c.lwd + ' 23:59');
      c.leaver = { on:true, at:c.lwd };
      /* [NTF-HOOK] ofb_case_approved → HR · หัวหน้า · ผู้รับผิดชอบงานในชุด · ผู้ดูแลสิทธิ์ (ปิดไม่ได้) */
      pushAudit(c.id, 'approve', 'อนุมัติครบสาย', 'เผยแพร่วันทำงานวันสุดท้าย ' + dTH(c.lwd) + ' · ตั้งเวลาเพิกถอน ' + dtTH(c.revDue) + (c.imm ? ' (ออกทันที)' : ''));
      endBusy('อนุมัติครบสายแล้ว — ชุดงานปิดสิทธิ์เดินได้ และตั้งเวลาเพิกถอนเป็น ' + dtTH(c.revDue), 'success', 'overview');
    } else {
      pushAudit(c.id, 'approve', 'อนุมัติขั้นที่ ' + (i+1), 'ส่งต่อให้ ' + empOf(c.chain[left].as).n);
