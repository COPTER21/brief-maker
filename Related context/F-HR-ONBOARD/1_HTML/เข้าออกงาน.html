<!-- ============================================================
     Lucide Icons Loader (multi-CDN fallback, pinned version)
     ------------------------------------------------------------
     ทำไมไม่ใช้ <script src="..."> ตรง ๆ:
       - Single CDN = single point of failure (corp proxy/firewall block)
       - @latest = breaking changes โดยไม่บอก (GitHub issue #2962)
       - <script> ใน <head> โดยไม่มี defer ชน DOMContentLoaded
     กลยุทธ์:
       1) Pin version 0.469.0 (stable, ทดสอบแล้ว)
       2) ลอง CDN 3 ตัวเรียงตามความน่าเชื่อถือ: unpkg → jsdelivr → cdnjs
       3) ถ้าทุก CDN fail → log warning + ไม่ block render
            (UI ยังใช้งานได้ แค่ไม่มี icons)
     ============================================================ -->
<script>
(function loadLucide() {
  var version = '0.469.0';
  var cdns = [
    'https://unpkg.com/lucide@' + version + '/dist/umd/lucide.min.js',
    'https://cdn.jsdelivr.net/npm/lucide@' + version + '/dist/umd/lucide.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/lucide/' + version + '/lucide.min.js'
  ];
  var i = 0;
  function tryNext() {
    if (i >= cdns.length) {
      console.warn('[Lucide] All CDNs failed. Icons จะไม่แสดง but UI ยังใช้งานได้');
      window.lucide = window.lucide || { createIcons: function() {} }; // no-op fallback
      window.dispatchEvent(new Event('lucide:ready'));
      return;
    }
    var s = document.createElement('script');
    s.src = cdns[i++];
    s.onload = function() {
      window.dispatchEvent(new Event('lucide:ready'));
    };
    s.onerror = tryNext;
    document.head.appendChild(s);
  }
  tryNext();
})();
</script>

<script>
// ============================================
// STATE
// ============================================
const state = {
  currentRoute: 'home',
  drawer: { open: false, mode: null, recordId: null, step: 1 },
  modal: { open: false, type: null, data: null },
  toast: { visible: false, message: '', variant: 'info' },
  filters: { search: '', status: 'all' },
  pagination: { page: 1, pageSize: 20 },
  sort: { col: null, dir: 'asc' },
  selectedIds: new Set(),
  records: [],
};

// ============================================
// SIDEBAR — Module collapse/expand (Iron Rule #27)
// Module header is non-navigable; click toggles children visibility.
// State persists in DOM (data-expanded) — future: persist per user.
// ============================================
function toggleModule(headerEl) {
  const mod = headerEl.closest('.sb-module');
  if (!mod) return;
  const isExpanded = mod.getAttribute('data-expanded') !== 'false';
  mod.setAttribute('data-expanded', isExpanded ? 'false' : 'true');
}

// ============================================
// ROUTER (Hash-based, refresh-safe)
// ============================================
function getRoute() {
  const hash = location.hash;
  if (!hash || hash === '#' || hash === '#/') return 'home';
  return hash.replace(/^#\//, '');
}
function navigate(route) {
  location.hash = '#/' + route;
}

// ============================================
// DRAWER / MODAL TOGGLES
// ============================================
function openDrawer(mode, recordId) {
  state.drawer = { open: true, mode, recordId, step: 1 };
  render();
  // Trigger CSS animation
  requestAnimationFrame(() => {
    document.getElementById('drawerBackdrop').classList.add('is-open');
    document.getElementById('drawer').classList.add('is-open');
  });
}
function closeDrawer() {
  document.getElementById('drawerBackdrop').classList.remove('is-open');
  document.getElementById('drawer').classList.remove('is-open');
  setTimeout(() => {
    state.drawer = { open: false, mode: null, recordId: null, step: 1 };
  }, 280);
}
function openModal(type, data) {
  state.modal = { open: true, type, data };
  render();
  requestAnimationFrame(() => {
    document.getElementById('modalBackdrop').classList.add('is-open');
  });
}
function closeModal() {
  document.getElementById('modalBackdrop').classList.remove('is-open');
  setTimeout(() => {
    state.modal = { open: false, type: null, data: null };
  }, 200);
}

// ============================================
// TOAST
// ============================================
function showToast(message, variant = 'info', durationMs = 2800) {
  const el = document.getElementById('toast');
  const iconMap = { success: 'check-circle-2', info: 'info', warning: 'alert-triangle', error: 'x-circle' };
  el.className = 'toast is-' + variant;
  el.innerHTML = `<i data-lucide="${iconMap[variant] || 'info'}" class="w-4 h-4"></i><span>${message}</span>`;
  renderIcons();
  requestAnimationFrame(() => el.classList.add('is-visible'));
  setTimeout(() => el.classList.remove('is-visible'), durationMs);
}

// ============================================
// ESC key handler (close drawer/modal)
// ============================================
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state.modal.open) closeModal();
    else if (state.drawer.open) closeDrawer();
  }
});

// ============================================
// RENDER (placeholder — replace per feature)
// ============================================
function render() {
  // Specific feature should override this function.
  //
  // ⚠️ Iron Rule #29 — Render Preservation:
  // If your render() does innerHTML rebuild (typical pattern), wrap with
  // withRenderPreservation() OR use preserveRenderState()/restoreRenderState()
  // to keep scroll position + focus across re-renders.
  //
  // Example:
  //   function render() {
  //     const snap = preserveRenderState();
  //     document.getElementById('page-content').innerHTML = renderPage();
  //     drawer.innerHTML = state.drawer.open ? renderDrawer() : '';
  //     renderIcons();
  //     restoreRenderState(snap);
  //   }
  //
  // After every DOM update, call renderIcons() — safe wrapper ที่ทน race เมื่อ Lucide ยังไม่ load.
  renderIcons();
}

// ============================================
// INIT
// ============================================
// Helper: safe icon render — กัน race ก่อน lucide load เสร็จ
function renderIcons() {
  if (window.lucide && typeof window.lucide.createIcons === 'function') {
    window.lucide.createIcons();
  }
}

// ============================================
// SEARCH-SELECT (Iron Rule #34) — generic searchable dropdown
// ------------------------------------------------
// ใช้แทน <select> เมื่อ options เยอะ (>8) หรือเป็น lookup จาก master อื่น.
// list = position:absolute overlay → ไม่ดันเนื้อหา. แก้เฉพาะ list ตอนพิมพ์ →
// ไม่ rebuild ทั้งหน้า (ไม่ชน Rule #29). decoupled — เรียก onSelect callback ไม่ผูก render().
//
// วิธีใช้ 2 ขั้น:
//   1) ใส่ markup:  ${searchSelectHTML('country', { placeholder: 'เลือกประเทศ' })}
//   2) หลัง markup อยู่ใน DOM แล้ว (เช่นท้าย render()):
//        initSearchSelect('country', {
//          options: countries.map(c => ({ value:c.code, label:c.name, sub:c.code, icon:'flag', right:'' })),
//          value: state.form.country,
//          onSelect: (val, opt) => { state.form.country = val; }
//        });
// option fields: { value, label, sub?, icon?, right? }
// ============================================
window.__ss = window.__ss || {};
function ssGet(key){ return window.__ss[key]; }
function ssEscapeReg(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function searchSelectHTML(key, opt){
  opt = opt || {};
  var ph = opt.placeholder || 'ค้นหา...';
  return ''
    + '<div class="search-select" id="ss-' + key + '">'
    +   '<i data-lucide="search" class="ss-lead w-4 h-4"></i>'
    +   '<input type="text" class="input ss-input" id="ss-input-' + key + '" autocomplete="off" placeholder="' + ph + '"'
    +     ' oninput="ssOnInput(\'' + key + '\', this.value)" onfocus="ssOpen(\'' + key + '\')" onkeydown="ssOnKey(\'' + key + '\', event)">'
    +   '<button type="button" class="ss-clear hidden" id="ss-clear-' + key + '" tabindex="-1" onclick="ssClear(\'' + key + '\')"><i data-lucide="x" class="w-4 h-4"></i></button>'
    +   '<i data-lucide="chevron-down" class="ss-caret" id="ss-caret-' + key + '"></i>'
    +   '<div class="ss-list hidden" id="ss-list-' + key + '"></div>'
    + '</div>';
}
function initSearchSelect(key, cfg){
  cfg = cfg || {};
  window.__ss[key] = {
    options: cfg.options || [], value: (cfg.value != null ? cfg.value : null),
    onSelect: cfg.onSelect || function(){}, emptyText: cfg.emptyText || 'ไม่พบรายการ',
    query: '', open: false, hi: 0
  };
  ssSetText(key); ssSyncChrome(key); renderIcons();
}
function ssFiltered(key){
  var s = ssGet(key); if(!s) return [];
  var q = (s.query || '').toLowerCase().trim();
  if(!q) return s.options;
  return s.options.filter(function(o){
    return String(o.label).toLowerCase().includes(q)
      || String(o.value).toLowerCase().includes(q)
      || String(o.sub || '').toLowerCase().includes(q);
  });
}
function ssSyncChrome(key){
  var s = ssGet(key); if(!s) return;
  var sel = s.options.find(function(o){ return o.value === s.value; });
  var c = document.getElementById('ss-clear-' + key); if(c) c.classList.toggle('hidden', !sel);
  var k = document.getElementById('ss-caret-' + key); if(k) k.classList.toggle('hidden', !!sel);
}
function ssSetText(key){
  var s = ssGet(key); if(!s) return;
  var input = document.getElementById('ss-input-' + key); if(!input) return;
  var sel = s.options.find(function(o){ return o.value === s.value; });
  input.value = s.open ? s.query : (sel ? sel.label : '');
}
function ssRenderList(key){
  var s = ssGet(key); if(!s) return;
  var list = document.getElementById('ss-list-' + key); if(!list) return;
  var items = ssFiltered(key);
  if(items.length === 0){
    list.innerHTML = '<div class="ss-empty">' + s.emptyText + '</div>';
  } else {
    var q = (s.query || '').toLowerCase().trim();
    var hl = function(t){ return q ? String(t).replace(new RegExp('(' + ssEscapeReg(q) + ')', 'gi'), '<mark>$1</mark>') : String(t); };
    list.innerHTML = items.map(function(o, i){
      return '<button type="button" class="ss-opt ' + (i === s.hi ? 'is-active' : '') + '" onmousedown="event.preventDefault()" onclick="ssPick(\'' + key + '\', ' + i + ')">'
        + (o.icon ? '<i data-lucide="' + o.icon + '" class="ss-opt-ic w-4 h-4"></i>' : '')
        + '<span class="ss-opt-main"><span class="ss-opt-label">' + hl(o.label) + '</span>'
        + (o.sub ? '<span class="ss-opt-sub">' + hl(o.sub) + '</span>' : '') + '</span>'
        + (o.right ? '<span class="ss-opt-right">' + o.right + '</span>' : '')
        + '</button>';
    }).join('');
  }
  list.classList.toggle('hidden', !s.open);
  renderIcons();
}
function ssOpen(key){ var s = ssGet(key); if(!s) return; s.open = true; s.query = ''; s.hi = 0; ssSetText(key); ssSyncChrome(key); ssRenderList(key); }
function ssOnInput(key, val){ var s = ssGet(key); if(!s) return; s.query = val; s.open = true; s.hi = 0; s.value = null; ssSyncChrome(key); ssRenderList(key); }
function ssPick(key, i){ var s = ssGet(key); if(!s) return; var o = ssFiltered(key)[i]; if(!o) return; s.value = o.value; s.query = ''; s.open = false; ssSetText(key); ssSyncChrome(key); ssRenderList(key); s.onSelect(o.value, o); }
function ssClear(key){ var s = ssGet(key); if(!s) return; s.value = null; s.query = ''; s.open = true; ssSetText(key); ssSyncChrome(key); ssRenderList(key); var inp = document.getElementById('ss-input-' + key); if(inp) inp.focus(); s.onSelect(null, null); }
function ssOnKey(key, e){
  var s = ssGet(key); if(!s) return; var items = ssFiltered(key);
  if(e.key === 'ArrowDown'){ e.preventDefault(); s.open = true; s.hi = Math.min(items.length - 1, s.hi + 1); ssRenderList(key); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); s.hi = Math.max(0, s.hi - 1); ssRenderList(key); }
  else if(e.key === 'Enter'){ e.preventDefault(); if(items[s.hi]) ssPick(key, s.hi); }
  else if(e.key === 'Escape'){ s.open = false; ssSetText(key); ssSyncChrome(key); ssRenderList(key); }
}
document.addEventListener('click', function(e){
  Object.keys(window.__ss || {}).forEach(function(key){
    var wrap = document.getElementById('ss-' + key); var s = ssGet(key);
    if(wrap && s && s.open && !wrap.contains(e.target)){ s.open = false; ssSetText(key); ssSyncChrome(key); ssRenderList(key); }
  });
});

// ============================================
// FORMAT HELPERS (Iron Rule #43) — Thai locale, consistent ทุก feature
// ใช้ตัวเหล่านี้เสมอ ห้าม format ตัวเลข/วันที่เองรายจุด
// ============================================
function fmtNumber(n, dp){ if(n==null||n==='')return '—'; var x=Number(n); if(isNaN(x))return String(n);
  return x.toLocaleString('th-TH', {minimumFractionDigits: dp||0, maximumFractionDigits: dp!=null?dp:2}); }
function fmtMoney(n, dp){ if(n==null||n==='')return '—'; var x=Number(n); if(isNaN(x))return String(n);
  return '฿' + x.toLocaleString('th-TH', {minimumFractionDigits: dp!=null?dp:2, maximumFractionDigits: dp!=null?dp:2}); }
function fmtDate(iso, buddhist){ if(!iso)return '—'; var d=new Date(iso); if(isNaN(d))return String(iso);
  var s=d.toLocaleDateString('th-TH', {year:'numeric', month:'short', day:'numeric'});
  return buddhist===false ? d.toLocaleDateString('en-GB',{year:'numeric',month:'short',day:'numeric'}) : s; }
function fmtDateTime(iso){ if(!iso)return '—'; var d=new Date(iso); if(isNaN(d))return String(iso);
  return d.toLocaleString('th-TH', {year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }

// ============================================
// INLINE VALIDATION (Iron Rule #43) — validate ตอน blur, ไม่ใช่รอ submit อย่างเดียว
// markup: <div class="field"><input class="input" onblur="validateField(this, v => v.trim()? '' : 'จำเป็นต้องกรอก')">
//          <div class="field-error"></div></div>
// validator คืน '' = ผ่าน / ข้อความ = error
// ============================================
function validateField(el, validator){
  var field = el.closest('.field'); if(!field) return true;
  var msg = '';
  try { msg = validator ? validator(el.value, el) : ''; } catch(e){ msg=''; }
  var errEl = field.querySelector('.field-error');
  if(msg){ field.classList.add('is-invalid'); if(errEl) errEl.textContent = msg; return false; }
  field.classList.remove('is-invalid'); return true;
}
function clearFieldError(el){ var f=el.closest('.field'); if(f) f.classList.remove('is-invalid'); }

// ============================================
// EMPTY STATE (Iron Rule #39) — list/section ว่าง ต้องมี icon + title + desc + (action)
// ============================================
function emptyStateHTML(cfg){
  cfg = cfg || {};
  var act = cfg.actionLabel ? '<button class="btn btn-primary" onclick="' + (cfg.onAction||'') + '">' +
    (cfg.actionIcon ? '<i data-lucide="' + cfg.actionIcon + '" class="w-4 h-4"></i>' : '') +
    '<span>' + cfg.actionLabel + '</span></button>' : '';
  return '<div class="empty">'
    + '<div class="empty-icon"><i data-lucide="' + (cfg.icon||'inbox') + '"></i></div>'
    + '<div class="empty-title">' + (cfg.title||'ยังไม่มีข้อมูล') + '</div>'
    + '<div class="empty-desc">' + (cfg.desc||'') + '</div>'
    + act + '</div>';
}

// ============================================
// RENDER PRESERVATION (Iron Rule #29)
// ------------------------------------------------
// ทุกครั้งที่ render() ทำ innerHTML = ... full DOM rebuild
// scroll position + focus + cursor selection จะหาย —
// user รู้สึก "เด้งกลับบน" ทุกครั้งที่ toggle/click.
//
// withRenderPreservation(renderFn) wraps a render function
// to save state before innerHTML rebuild, then restore after.
//
// Preserves:
//   - scrollTop ของ .drawer-body
//   - scrollTop ของ .modal-body
//   - window.scrollY (page-level scroll)
//   - document.activeElement focus + selection range (input/textarea ที่กำลังพิมพ์)
//
// Usage:
//   const render = withRenderPreservation(function actualRender() {
//     content.innerHTML = ...
//   });
//
// หรือเรียกตรง ๆ ใน render() ที่มีอยู่แล้ว:
//   function render() {
//     const snapshot = preserveRenderState();
//     // ... innerHTML rebuilds ...
//     restoreRenderState(snapshot);
//   }
// ============================================
function preserveRenderState() {
  const drawerBody = document.querySelector('.drawer-body');
  const modalBody = document.querySelector('.modal-body');
  const activeEl = document.activeElement;
  const isInput = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA');
  return {
    drawerScroll: drawerBody ? drawerBody.scrollTop : 0,
    modalScroll: modalBody ? modalBody.scrollTop : 0,
    pageScroll: window.scrollY,
    focusKey: isInput ? {
      placeholder: activeEl.placeholder || '',
      type: activeEl.type || '',
      name: activeEl.name || '',
      selStart: activeEl.selectionStart,
      selEnd: activeEl.selectionEnd,
    } : null,
  };
}
function restoreRenderState(snap) {
  if (!snap) return;
  requestAnimationFrame(function() {
    const dBody = document.querySelector('.drawer-body');
    if (dBody && snap.drawerScroll > 0) dBody.scrollTop = snap.drawerScroll;
    const mBody = document.querySelector('.modal-body');
    if (mBody && snap.modalScroll > 0) mBody.scrollTop = snap.modalScroll;
    if (snap.pageScroll > 0) window.scrollTo(0, snap.pageScroll);

    if (snap.focusKey) {
      const candidates = document.querySelectorAll('input, textarea');
      for (let i = 0; i < candidates.length; i++) {
        const c = candidates[i];
        if ((c.placeholder || '') === snap.focusKey.placeholder
            && (c.type || '') === snap.focusKey.type
            && (c.name || '') === snap.focusKey.name) {
          c.focus();
          if (snap.focusKey.selStart != null && typeof c.setSelectionRange === 'function') {
            try { c.setSelectionRange(snap.focusKey.selStart, snap.focusKey.selEnd); } catch(e) {}
          }
          break;
        }
      }
    }
  });
}
function withRenderPreservation(renderFn) {
  return function preservedRender() {
    const snap = preserveRenderState();
    const result = renderFn.apply(this, arguments);
    restoreRenderState(snap);
    return result;
  };
}

window.addEventListener('hashchange', function () { render(); });  // v6.1 late-binding — ให้ชี้ render() ตัวที่ feature override (ผูกตรง ๆ จะ capture placeholder เดิม)

// รอ DOM + Lucide ทั้งคู่ก่อน first render
// (Lucide loader จะ dispatch 'lucide:ready' เมื่อ load สำเร็จ
//  หรือเมื่อทุก CDN fail แล้ว fallback เป็น no-op)
var domReady = false;
var lucideReady = false;
function bootIfReady() {
  if (domReady && lucideReady) {
    render();
    renderIcons();
  }
}
if (document.readyState === 'loading') {
  window.addEventListener('DOMContentLoaded', function() { domReady = true; bootIfReady(); });
} else {
  domReady = true;
}
// Listen for ready event AND check ว่า lucide load ไปแล้วหรือยัง
// (script ตัวนี้รันหลัง loader — ถ้า loader sync เสร็จก่อน, event อาจหายไปแล้ว)
window.addEventListener('lucide:ready', function() { lucideReady = true; bootIfReady(); });
if (window.lucide && typeof window.lucide.createIcons === 'function') {
  lucideReady = true;
}
bootIfReady();
// Safety net: ถ้า lucide:ready ไม่มาภายใน 5s ให้ render ไปก่อน (UI ยังใช้งานได้)
setTimeout(function() {
  if (!lucideReady) {
    console.warn('[Lucide] Timeout — rendering without icons');
    lucideReady = true;
    bootIfReady();
  }
}, 5000);
</script>


<script>
/* ===== BASE-KIT UTILS (#66/#68/#95) — DO NOT EDIT ===== */
/* #95: เมนูใน scroll container (.table-wrap / drawer body / B2 line grid)
   ต้อง portal ด้วย util นี้ — z-index อย่างเดียวช่วยไม่ได้เพราะโดน ancestor overflow clip */
function portalMenu(trigger, menu){
  let host = document.getElementById('overlay-root');
  if(!host){ host = document.createElement('div'); host.id='overlay-root'; document.body.appendChild(host); }
  if(menu.parentElement !== host) host.appendChild(menu);
  menu.classList.add('menu-fixed');
  const r = trigger.getBoundingClientRect();
  const below = window.innerHeight - r.bottom - 12, above = r.top - 12;
  const h = Math.min(menu.scrollHeight || 320, 320);
  menu.style.left = r.left + 'px';
  menu.style.width = r.width + 'px';
  if(below < h && above > below){ menu.style.top='auto'; menu.style.bottom=(window.innerHeight-r.top+4)+'px';
    menu.style.maxHeight = Math.min(h, above)+'px'; }
  else { menu.style.bottom='auto'; menu.style.top=(r.bottom+4)+'px';
    menu.style.maxHeight = Math.min(h, Math.max(below,120))+'px'; }
  menu._trigger = trigger;
  const reposition = ()=>{ if(menu.classList.contains('open')) portalMenu(trigger, menu); };
  if(!menu._portalBound){ menu._portalBound = true;
    window.addEventListener('scroll', reposition, true);
    window.addEventListener('resize', reposition); }
}
function positionMenu(trigger,menu){const r=trigger.getBoundingClientRect();
  const below=window.innerHeight-r.bottom-12, above=r.top-12, h=Math.min(menu.scrollHeight,320);
  if(below<h && above>below){menu.classList.add('drop-up');menu.style.maxHeight=Math.min(h,above)+'px';}
  else{menu.classList.remove('drop-up');menu.style.maxHeight=Math.min(h,Math.max(below,120))+'px';}}
function openOverlay(menu,trigger){document.querySelectorAll('[data-overlay].open').forEach(m=>{if(m!==menu)closeOverlay(m);});
  menu.classList.add('open');menu._trigger=trigger;if(trigger)positionMenu(trigger,menu);}
function closeOverlay(menu){menu.classList.remove('open');if(menu._trigger)menu._trigger.focus();}
document.addEventListener('click',e=>{document.querySelectorAll('[data-overlay].open').forEach(m=>{
  if(!m.contains(e.target)&&!(m._trigger&&m._trigger.contains(e.target)))closeOverlay(m);});});

<script>
/* ============================================================
   ENGINE — วันที่ · งาน checklist · ทะเบียนสิทธิ์ · สายอนุมัติ · เงื่อนไขปิดรอบ
   ทุกค่าที่เป็นกฎหมาย (ระยะทดลองงาน · ระยะบอกกล่าว) = null จากต้นทาง → ห้ามคิดแทน (BR-11)
   ============================================================ */
function dOf(s) { const p = String(s||'').slice(0,10).split('-'); return new Date(+p[0], (+p[1]||1)-1, +p[2]||1); }
function iso(d) { const p = function (x) { return String(x).padStart(2,'0'); }; return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
const THM = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function dTH(s) { if (!s) return '—'; const d = dOf(s); return d.getDate()+' '+THM[d.getMonth()]+' '+(d.getFullYear()+543); }
function dtTH(s) { if (!s) return '—'; return dTH(s.slice(0,10)) + ' ' + s.slice(11,16) + ' น.'; }
function daysBetween(a, b) { return Math.round((dOf(b) - dOf(a)) / 86400000); }
/* วันหยุดมาจาก ตั้งค่า HR (holiday_calendar + วันหยุดประจำสัปดาห์ในเวอร์ชันเดียวกัน) — ไม่คิดปฏิทินเอง (BR-01) */
function isOff(s) { const d = dOf(s); return HOLIDAY[s] != null || d.getDay() === 0 || d.getDay() === 6; }
function shiftWorkDays(base, off) {
  if (off == null) return '';
  let d = dOf(base), step = off < 0 ? -1 : 1, left = Math.abs(off);
  while (left > 0) { d = new Date(d.getTime() + step*86400000); if (!isOff(iso(d))) left--; }
  let s = iso(d);
  while (isOff(s)) { d = new Date(d.getTime() + (off < 0 ? -86400000 : 86400000)); s = iso(d); }
  return s;
}
function periodOf(s) { const c = String(s||'').slice(0,7); for (let i=0;i<PERIODS.length;i++) if (PERIODS[i].code===c) return PERIODS[i]; return null; }
function inClosedPeriod(s) { const p = periodOf(s); return !!(p && p.st === 'closed'); }

/* ---- งาน checklist — แต่ละแถว = 1 SOW ของ Operation Process (BR-02) ---- */
let TASKS = [];
let SOW_SEQ = 4100;
function buildTasks() {
  TASKS = [];
  CASES.forEach(function (c) {
    const stt = TASK_STATE[c.id] || { done:[], doing:[], due:{}, ev:{} };
    let rows = TPL_TASKS[c.type].slice();
    if (c.type === 'offboarding' && (c.subord > 0 || c.pendApp > 0)) rows = rows.concat([TPL_TASK_DELEGATE]);
    TASK_ADD.forEach(function (a) { if (a.case === c.id) rows = rows.concat([a]); });
    const dropped = {};
    TASK_DROP.forEach(function (d) { if (d.case === c.id) dropped[d.c] = d; });
    const base = c.type === 'onboarding' ? c.start : c.lwd;
    rows.forEach(function (t) {
      const due = (stt.due && stt.due[t.c]) ? stt.due[t.c] : shiftWorkDays(base, t.off);
      let st = 'todo';
      if (stt.done.indexOf(t.c) >= 0) st = 'done';
      else if (stt.doing.indexOf(t.c) >= 0) st = 'doing';

function empOptions(list) {
  return (list || EMP_ALL).map(function (c) {
    const e = empOf(c);
    return { value:e.c, label:e.n, sub:e.p + ' · ' + e.d, icon:'user', right:'<span class="tnum">' + e.c + '</span>' };
  });
}
function tplOptions(dir) {
  return TEMPLATES.filter(function (t) { return t.dir === dir && t.st === 'active'; }).map(function (t) {
    return { value:t.id, label:t.n, sub:t.scope, icon:'layout-template', right:'<span class="tnum">' + t.ref + '</span>' };
  });
}
let COMBOS = [];
function initCombos() { COMBOS.forEach(function (c) { if (document.getElementById('ss-input-' + c.key)) initSearchSelect(c.key, c.cfg); }); }

/* ============================================================
   RENDER
   ============================================================ */
function curTab() { const r = getRoute(); for (let i=0;i<TABS.length;i++) if (r === TABS[i].r) return TABS[i].k; return 'on'; }
function goTab(k) { location.hash = TAB_HASH[k] || TAB_HASH.on; }
function alarmCases() { return CASES.filter(function (c) { return inScope(c) && isOverdue(c); }); }
function lateTaskCases() {
  return CASES.filter(function (c) {
    if (!inScope(c) || c.st === 'closed' || c.st === 'cancelled') return false;
    return tasksOf(c.id).some(taskOverdue);
  });
}
function failGrantCases() {
  return CASES.filter(function (c) { return inScope(c) && c.type === 'onboarding' && grantProgress(c.id).fail > 0; });
}
function watchCount() {
  const s = {};
  alarmCases().forEach(function (c) { s[c.id] = 1; });
  lateTaskCases().forEach(function (c) { s[c.id] = 1; });
  failGrantCases().forEach(function (c) { s[c.id] = 1; });
  return Object.keys(s).length;
}

function pageHeader(tab) {
  const nOn = CASES.filter(function (c) { return c.type === 'onboarding' && inScope(c); }).length;
  const nOff = CASES.filter(function (c) { return c.type === 'offboarding' && inScope(c); }).length;
  const acts = {
    on:  P().create ? '<button class="btn btn-primary" onclick="openCreate(\'onboarding\')"><i data-lucide="plus" class="w-4 h-4"></i>สร้างรอบเข้างาน</button>' : '',
    off: P().create ? '<button class="btn btn-primary" onclick="openCreate(\'offboarding\')"><i data-lucide="plus" class="w-4 h-4"></i>สร้างรอบออกงาน</button>' : '',
    watch: '', templates:'', downstream:''
  };
  return '<div class="ph"><div><div class="ph-title-row"><h1 class="ph-title">เข้าออกงาน</h1>'
    + '<span class="ph-count">' + nOn + ' รอบเข้างาน · ' + nOff + ' รอบออกงาน</span></div>'
    + '<p class="ph-sub">รอบเข้างานและรอบออกงานของพนักงานรายคน — ชุดงานทุกงานเป็นงานจริงในกระบวนการทำงาน การเปิดและเพิกถอนสิทธิ์เป็นคำขอไปยัง สิทธิ์ผู้ใช้งาน แล้วรอผลตอบกลับ</p></div>'
    + '<div class="ph-actions">' + (acts[tab] || '') + '</div></div>';
}
function tabsHTML(tab) {
  const nWatch = watchCount();
  return '<div class="tabs page-tabs">' + TABS.map(function (t) {
    const n = t.k === 'watch' ? nWatch : 0;
    return '<button class="tab ' + (t.k === tab ? 'is-active' : '') + '" onclick="goTab(\'' + t.k + '\')">'
      + '<i data-lucide="' + t.i + '" class="w-4 h-4"></i>' + t.n + (n ? '<span class="tab-badge">' + n + '</span>' : '') + '</button>';
  }).join('') + '</div>';
}
function render() {
  const snap = preserveRenderState();
  const tab = curTab();
  state.tabKey = tab;
  COMBOS = [];
  const body = tab === 'off' ? viewCases('offboarding')
    : tab === 'watch' ? viewWatch()
    : tab === 'templates' ? viewTemplates()
    : tab === 'downstream' ? viewDownstream()
    : viewCases('onboarding');
  document.getElementById('page-content').innerHTML = pageHeader(tab) + tabsHTML(tab) + body;
  const dw = document.getElementById('drawer');
  dw.className = 'drawer' + (state.dw && state.dw.wide ? '' : ' standard') + (dw.classList.contains('is-open') ? ' is-open' : '');
  dw.innerHTML = state.drawer.open && state.dw ? drawerHTML() : '';
  const mb = document.querySelector('#modalBackdrop .modal');
  mb.innerHTML = state.modal.open ? modalHTML() : '';
  renderIcons();
  initCombos();
  restoreRenderState(snap);
}
/* filter/ค้นหา render เฉพาะเนื้อหา — ไม่ทำให้ทั้งหน้ากระโดด (#35/#95/#103) */
function setF(k, v) { state.f[k] = v; render(); }
function resetF() { state.f = { q:'', dep:'all', st:'all', from:'', to:'', only:false }; render(); showToast('ล้างตัวกรองแล้ว', 'info'); }
function setWF(k, v) { state.wf[k] = v; render(); }

/* ---- drawer เปิด/ปิด + tab ภายใน drawer ---- */
function openCase(id, tab) {
  const c = caseOf(id); if (!c) return;
  if (!canSeeSensitive()) pushAudit(id, 'view', 'เปิดดูรอบแบบปิดบังข้อมูลอ่อนไหว', 'บทบาทนี้ไม่มีสิทธิ์เห็นเหตุผลการออก ผลทดลองงาน ธงจ้างกลับ และทะเบียนสิทธิ์');
  else pushAudit(id, 'view', 'เปิดดูข้อมูลอ่อนไหว', 'เหตุผลการออก · ทะเบียนสิทธิ์');
  state.drawer = { open:true, mode:'case', recordId:id, step:1 };
  state.dw = { mode:'case', id:id, tab:tab || 'overview', form:null, err:{}, wide:true };
  render();
  requestAnimationFrame(function () {
    document.getElementById('drawerBackdrop').classList.add('is-open');
    document.getElementById('drawer').classList.add('is-open');
  });
}
function openDW(mode, opt) {
  opt = opt || {};
  state.drawer = { open:true, mode:mode, recordId:opt.id || null, step:1 };
  state.dw = { mode:mode, id:opt.id || null, tab:opt.tab || 'overview', form:opt.form || null, err:{}, wide:!!opt.wide };
  render();
  requestAnimationFrame(function () {
    document.getElementById('drawerBackdrop').classList.add('is-open');
    document.getElementById('drawer').classList.add('is-open');
  });
}
function dwTab(t) { if (!state.dw) return; state.dw.tab = t; render(); }
function tabBtn(k, n, on, badge) {
  return '<button class="tab ' + (on ? 'is-active' : '') + '" onclick="dwTab(\'' + k + '\')">' + n
    + (badge ? '<span class="tab-badge">' + badge + '</span>' : '') + '</button>';
}
/* ตัวสร้างหัว drawer ตัวเดียวของทั้งไฟล์ — มี tabs เมื่อไร ใส่ has-tabs ให้เองเสมอ (#38.2) */
function dwHead(eyebrow, title, sub, actions, tabs) {
  const tabsBlock = tabs ? '<div class="tabs">' + tabs + '</div>' : '';
  const openRow = tabs ? '<div class="dw-head-row">' : '';
  const closeRow = tabs ? '</div>' : '';
  return '<div class="drawer-header' + (tabs ? ' has-tabs' : '') + '">' + openRow + '<div class="min0">'
    + '<div class="dw-eyebrow">' + eyebrow + '</div>'
    + '<div class="dw-title">' + title + '</div>'
    + (sub ? '<div class="drawer-subtitle">' + sub + '</div>' : '')
    + '</div><div class="drawer-header-actions mla">' + (actions || '')
    + '<span class="drawer-header-divider"></span>'
    + '<button class="icon-btn" onclick="closeDrawer()"><i data-lucide="x" class="w-4 h-4"></i></button></div>'
    + closeRow + tabsBlock + '</div>';
}
function dwFootClose(meta, right) {
  return '<div class="drawer-footer"><button class="btn btn-ghost" onclick="closeDrawer()">ปิด</button>'
    + '<span class="drawer-footer-meta">' + (meta || '') + '</span>'
    + '<span class="dw-footer-right">' + (right || '') + '</span></div>';
}
</script>
<script>
/* ============================================================
   VIEW — รายการรอบ (เข้างาน / ออกงาน) · งานที่ต้องจับตา · แม่แบบ · ปลายทาง
   1 ข้อมูล = 1 คอลัมน์ · แถว ≤52px ด้วย .tbl-person · filter แถวเดียว (#40.1 · #103)
   ============================================================ */
const DEPTS = ['ฝ่ายบัญชี','ฝ่ายผลิต','ฝ่ายจัดซื้อ','ฝ่ายคลังสินค้า','ฝ่ายการตลาด','ฝ่ายขาย','ฝ่ายเทคโนโลยีสารสนเทศ','ฝ่ายธุรการ','ฝ่ายบุคคล','ฝ่ายการเงิน','สำนักผู้บริหาร'];
const ST_ON  = ['draft','waiting','running','closed','cancelled'];
const ST_OFF = ['draft','pending','approved','rejected','revoking','revoked','closed','cancelled'];

function filtered(type) {
  const q = (state.f.q || '').toLowerCase();
  return CASES.filter(function (c) {
    if (c.type !== type) return false;
    if (!inScope(c)) return false;
    const e = empOf(c.emp);
    if (q && (e.n + ' ' + e.c + ' ' + e.p + ' ' + e.d + ' ' + c.id).toLowerCase().indexOf(q) < 0) return false;
    if (state.f.dep !== 'all' && e.d !== state.f.dep) return false;
    if (state.f.st !== 'all' && c.st !== state.f.st) return false;
    const key = type === 'onboarding' ? c.start : c.lwd;
    if (state.f.from && key && key < state.f.from) return false;
    if (state.f.to && key && key > state.f.to) return false;
    if (state.f.only) {
      const open = type === 'onboarding' ? grantProgress(c.id).open.length : revProgress(c.id).open.length;
      if (!open) return false;
    }
    return true;
  });
}
function filterRow(type) {
  const sts = type === 'onboarding' ? ST_ON : ST_OFF;
  return '<div class="filter-row">'
    + '<input class="input input-search" type="search" placeholder="ค้นหาชื่อ · รหัสพนักงาน · ตำแหน่ง · รหัสรอบ" value="' + (state.f.q||'') + '" oninput="setF(\'q\',this.value)">'
    + '<span class="fr-lb">แผนก</span><select class="select" onchange="setF(\'dep\',this.value)">'
    +   '<option value="all"' + (state.f.dep==='all'?' selected':'') + '>ทุกแผนก</option>'
    +   DEPTS.map(function (d) { return '<option value="' + d + '"' + (state.f.dep===d?' selected':'') + '>' + d + '</option>'; }).join('')
    + '</select>'
    + '<span class="fr-lb">สถานะ</span><select class="select" onchange="setF(\'st\',this.value)">'
    +   '<option value="all"' + (state.f.st==='all'?' selected':'') + '>ทุกสถานะ</option>'
    +   sts.map(function (s) { return '<option value="' + s + '"' + (state.f.st===s?' selected':'') + '>' + cName(s) + '</option>'; }).join('')
    + '</select>'
    + '<span class="fr-lb">' + (type === 'onboarding' ? 'วันเริ่มงาน' : 'วันทำงานวันสุดท้าย') + '</span>'
    + '<input class="input dt" type="date" value="' + (state.f.from||'') + '" onchange="setF(\'from\',this.value)">'
    + '<input class="input dt" type="date" value="' + (state.f.to||'') + '" onchange="setF(\'to\',this.value)">'
    + '<button class="chip-btn' + (state.f.only?' is-on':'') + '" onclick="setF(\'only\',' + (!state.f.only) + ')"><i data-lucide="shield-alert" class="w-3 h-3"></i>เฉพาะที่มีสิทธิ์ค้าง</button>'
    + '<span class="fr-sp"></span>'
    + '<button class="btn btn-ghost btn-sm" onclick="resetF()"><i data-lucide="rotate-ccw" class="w-4 h-4"></i>ล้างตัวกรอง</button>'
    + '</div>';
}
function chainCell(c) {
  const ch = c.chain || [];
  if (!ch.length) return '<span class="cell-main text-mute-2">ยังไม่ส่งอนุมัติ</span>';
  const ok = ch.filter(function (s) { return s.st === 'ok'; }).length;
  if (c.st === 'rejected') return '<span class="cell-main">ตีกลับที่ขั้น ' + (ch.length) + '</span><span class="cell-sub">' + empOf(ch[ch.length-1].as).n + '</span>';
  return '<span class="cell-main tnum">' + ok + '/' + ch.length + ' ขั้น</span><span class="cell-sub">' + (ok >= ch.length ? 'อนุมัติครบสายแล้ว' : 'รอ ' + empOf((ch[ok]||{}).as).n) + '</span>';
}
function viewCases(type) {
  const rows = filtered(type);
  const n = rows.length;
  const st = {
    total: CASES.filter(function (c) { return c.type === type && inScope(c); }).length,
    active: CASES.filter(function (c) { return c.type === type && inScope(c) && ['waiting','running','pending','approved','revoking'].indexOf(c.st) >= 0; }).length,
    alarm: alarmCases().filter(function (c) { return c.type === type; }).length,
    late: lateTaskCases().filter(function (c) { return c.type === type; }).length
  };
  const stats = '<div class="stats">'
    + '<button class="stat is-click' + (state.f.st==='all'&&!state.f.only?' is-on':'') + '" onclick="resetF()"><div class="stat-label">รอบทั้งหมดที่เห็นได้</div><div class="stat-value tnum">' + st.total + '</div><div class="stat-meta">ตามขอบเขตของบทบาทที่ใช้อยู่</div></button>'
    + '<button class="stat is-click" onclick="setF(\'st\',\'' + (type==='onboarding'?'running':'approved') + '\')"><div class="stat-label">' + (type==='onboarding'?'กำลังเดินอยู่':'อนุมัติแล้วและกำลังเดิน') + '</div><div class="stat-value tnum">' + st.active + '</div><div class="stat-meta">ยังปิดรอบไม่ได้</div></button>'
    + '<button class="stat is-click' + (state.f.only?' is-on':'') + '" onclick="setF(\'only\',' + (!state.f.only) + ')"><div class="stat-label">' + (type==='onboarding'?'ยังเปิดสิทธิ์ไม่ครบ':'ยังเพิกถอนสิทธิ์ไม่ครบ') + '</div><div class="stat-value tnum">' + rows.filter(function(c){ return (type==='onboarding'?grantProgress(c.id).open.length:revProgress(c.id).open.length) > 0; }).length + '</div><div class="stat-meta">กรองเฉพาะรายการนี้</div></button>'
    + '<button class="stat is-click" onclick="goTab(\'watch\')"><div class="stat-label">' + (type==='onboarding'?'คำขอเปิดสิทธิ์ล้มเหลว':'ติดธงเพิกถอนค้าง') + '</div><div class="stat-value tnum' + ((type==='onboarding'?failGrantCases().length:st.alarm)?' text-danger':'') + '">' + (type==='onboarding'? failGrantCases().length : st.alarm) + '</div><div class="stat-meta">ดูในแท็บ งานที่ต้องจับตา</div></button>'
    + '</div>';

  let head, body;
  if (type === 'onboarding') {
    head = '<tr><th>พนักงาน</th><th>รหัสรอบภายใน</th><th>วันเริ่มงาน</th><th>แม่แบบชุดงาน</th><th>สถานะรอบ</th><th>งานในชุด</th><th>สิทธิ์ที่เปิดแล้ว</th></tr>';
    body = rows.map(function (c) {
      const tp = taskProgress(c.id), gp = grantProgress(c.id), t = tplOf(c.tpl);
      return '<tr onclick="openCase(\'' + c.id + '\')">'
        + '<td>' + personCell(c.emp) + '</td>'
        + '<td><span class="cell-main tnum">' + c.id + '</span></td>'
        + '<td><span class="cell-main">' + dTH(c.start) + '</span></td>'
        + '<td><span class="cell-main">' + (t ? t.n : '—') + '</span></td>'
        + '<td>' + cPill(c.st) + '</td>'
        + '<td>' + progBar(tp.done, tp.all, tp.done===tp.all?'':'run') + '</td>'
        + '<td>' + progBar(gp.done, gp.all, gp.fail?'late':(gp.done===gp.all?'':'run')) + '</td>'
        + '</tr>';
    }).join('');
  } else {
    head = '<tr><th>พนักงาน</th><th>รหัสรอบภายใน</th><th>เหตุผลการออก</th><th>วันทำงานวันสุดท้าย</th><th>สถานะรอบ</th><th>การอนุมัติ</th><th>การเพิกถอนสิทธิ์</th><th>ธงความปลอดภัย</th></tr>';
    body = rows.map(function (c) {
      const rp = revProgress(c.id), od = isOverdue(c);
      return '<tr class="' + (od?'row-late':'') + '" onclick="openCase(\'' + c.id + '\')">'
        + '<td>' + personCell(c.emp) + '</td>'
        + '<td><span class="cell-main tnum">' + c.id + '</span></td>'
        + '<td><span class="cell-main">' + mask(reasonOf(c.reason).n) + '</span></td>'
        + '<td><span class="cell-main">' + dTH(c.lwd) + '</span></td>'
        + '<td>' + cPill(c.st) + '</td>'
        + '<td>' + chainCell(c) + '</td>'
        + '<td>' + progBar(rp.done, rp.all, od?'late':(rp.done===rp.all?'':'run')) + '</td>'
        + '<td>' + (od ? '<span class="pill pill-danger">เพิกถอนค้าง</span>' : (c.imm ? '<span class="pill pill-warning">ออกทันที</span>' : '<span class="text-mute-2">—</span>')) + '</td>'
        + '</tr>';
    }).join('');
  }
  const cols = type === 'onboarding' ? 7 : 8;
  if (!n) body = emptyRow(cols, 'ไม่พบรอบที่ตรงกับตัวกรอง', 'ลองล้างตัวกรอง หรือเปลี่ยนช่วงวันที่');
  return stats
    + '<div class="card list-card page-fill">' + filterRow(type)
    + '<div class="table-wrap"><table class="table ' + (type==='onboarding'?'tbl-min-sm':'tbl-min') + '"><thead>' + head + '</thead><tbody>' + body + '</tbody></table></div>'
    + '<div class="table-foot"><span>แสดง <b class="tnum">' + n + '</b> รอบ</span>'
    + '<span class="rowgap">' + cfgLink('holiday_calendar','เวอร์ชันปฏิทินวันหยุด ' + CFG_VER.holiday) + roleLink('จัดการที่ สิทธิ์ผู้ใช้งาน') + '</span></div></div>';
}

/* ---- แท็บ งานที่ต้องจับตา (S-24 · FN-35) ---- */
function viewWatch() {
  const al = alarmCases(), lt = lateTaskCases(), fg = failGrantCases();
  const pendItems = al.reduce(function (s, c) { return s + revProgress(c.id).open.length; }, 0);
  const lateTasks = lt.reduce(function (s, c) { return s + tasksOf(c.id).filter(taskOverdue).length; }, 0);
  const failItems = fg.reduce(function (s, c) { return s + grantProgress(c.id).fail; }, 0);
  const stats = '<div class="stats">'
    + '<div class="stat"><div class="stat-label">รอบที่ติดธงเพิกถอนค้าง</div><div class="stat-value tnum' + (al.length?' text-danger':'') + '">' + al.length + '</div><div class="stat-meta">ปิดรอบไม่ได้จนกว่าจะเพิกถอนครบ</div></div>'
    + '<div class="stat"><div class="stat-label">รายการสิทธิ์ที่ยังค้าง</div><div class="stat-value tnum' + (pendItems?' text-danger':'') + '">' + pendItems + '</div><div class="stat-meta">นับรายรายการจากทะเบียนสิทธิ์</div></div>'
    + '<div class="stat"><div class="stat-label">งานในชุดที่เลยกำหนดเสร็จ</div><div class="stat-value tnum">' + lateTasks + '</div><div class="stat-meta">สถานะจริงอยู่ที่ กระบวนการทำงาน</div></div>'
    + '<div class="stat"><div class="stat-label">คำขอเปิดสิทธิ์ที่ล้มเหลว</div><div class="stat-value tnum">' + failItems + '</div><div class="stat-meta">ส่งซ้ำได้ · ปิดเองไม่ได้</div></div>'
    + '</div>';

  const alRows = al.length ? al.map(function (c) {
    const rp = revProgress(c.id), h = overdueHours(c), sv = severityOf(c);
    return '<tr class="row-late" onclick="openCase(\'' + c.id + '\',\'access\')">'
      + '<td>' + personCell(c.emp) + '</td>'
      + '<td><span class="cell-main tnum">' + c.id + '</span></td>'
      + '<td><span class="cell-main">' + dTH(c.lwd) + '</span></td>'
      + '<td><span class="cell-main tnum">' + dtTH(c.revDue) + '</span></td>'
      + '<td><span class="cell-main tnum">' + h + ' ชม.</span></td>'
      + '<td><span class="sev s-' + sv + '"><i data-lucide="siren" class="w-3 h-3"></i>' + SEVN[sv] + '</span></td>'
      + '<td>' + progBar(rp.done, rp.all, 'late') + '</td>'
      + '<td><span class="cell-main">' + rp.open.map(function (a) { return kindOf(a.k).n; }).join(' · ') + '</span></td>'
      + '</tr>';
  }).join('') : emptyRow(8, 'ไม่มีรอบที่ติดธงเพิกถอนค้าง', 'ทุกรอบที่ถึงกำหนดเพิกถอนแล้วมีผลตอบกลับครบทุกรายการ');

  const ltRows = [];
  lt.forEach(function (c) {
    tasksOf(c.id).filter(taskOverdue).forEach(function (t) {
      ltRows.push('<tr onclick="openCase(\'' + c.id + '\',\'tasks\')">'
        + '<td>' + personCell(c.emp) + '</td>'
        + '<td><span class="tk-nm">' + t.n + '</span></td>'
        + '<td><span class="grp">' + t.g + '</span></td>'
        + '<td>' + personCell(t.as, empOf(t.as).p) + '</td>'

        + '<td><span class="cell-main tnum">' + Math.abs(daysBetween(t.due, TODAY)) + ' วัน</span></td>'
        + '<td><span class="cell-main">' + (t.m ? 'งานบังคับ' : 'งานเสริม') + '</span></td>'
        + '</tr>');

  const fgRows = [];
  fg.forEach(function (c) {

  return stats
    + SEC('siren', 'รอบที่ติดธงเพิกถอนค้าง — เลยเวลาที่กำหนดแล้วยังมีสิทธิ์ค้าง', al.length + ' รอบ',
        '<div class="mini-wrap"><table class="table tbl-min"><thead><tr><th>พนักงาน</th><th>รหัสรอบภายใน</th><th>วันทำงานวันสุดท้าย</th><th>กำหนดเพิกถอน</th><th>เลยมาแล้ว</th><th>ระดับความรุนแรง</th><th>ความคืบหน้า</th><th>ชนิดสิทธิ์ที่ค้าง</th></tr></thead><tbody>' + alRows + '</tbody></table></div>')
    + SEC('clock-alert', 'งานในชุดที่เลยกำหนดเสร็จ', ltRows.length + ' งาน',
        '<div class="mini-wrap"><table class="table tbl-min-sm"><thead><tr><th>พนักงานเจ้าของรอบ</th><th>งาน</th><th>กลุ่ม</th><th>ผู้รับผิดชอบ</th><th>กำหนดเสร็จ</th><th>เลยมาแล้ว</th><th>ความจำเป็น</th></tr></thead><tbody>' + ltBody + '</tbody></table></div>')
    + SEC('badge-alert', 'คำขอเปิดสิทธิ์ที่ล้มเหลว', fgRows.length + ' รายการ',
        '<div class="mini-wrap"><table class="table tbl-min-sm"><thead><tr><th>พนักงานเจ้าของรอบ</th><th>ชนิดสิทธิ์</th><th>รายการ</th><th>เหตุผลที่ไม่สำเร็จ</th><th>จำนวนครั้งที่ลอง</th><th>สถานะ</th></tr></thead><tbody>' + fgBody + '</tbody></table></div>');

  + SEC('list-checks', 'งานในชุดของแม่แบบที่เลือกใช้ตอนสร้างรอบ', '',

      + TPL_TASKS.onboarding.map(function (t) { return '<tr><td>' + t.n + '</td><td><span class="grp">' + t.g + '</span></td><td class="tnum">' + (t.off == null ? 'ผู้ใช้ตั้งวันเอง' : (t.off < 0 ? t.off : '+' + t.off) + ' วันทำงาน') + '</td><td>' + (t.m ? 'ใช่' : '—') + '</td></tr>'; }).join('')
      + '</tbody></table></div></div>'
      + '<div><div class="kv-k mb-2">รอบออกงาน</div><div class="mini-wrap"><table class="mini-tbl"><thead><tr><th>งาน</th><th>กลุ่ม</th><th>กำหนดเสร็จ</th><th>บังคับ</th></tr></thead><tbody>'
      + TPL_TASKS.offboarding.concat([TPL_TASK_DELEGATE]).map(function (t) { return '<tr><td>' + t.n + '</td><td><span class="grp">' + t.g + '</span></td><td class="tnum">' + (t.off < 0 ? t.off : '+' + t.off) + ' วันทำงาน</td><td>' + (t.m ? 'ใช่' : '—') + '</td></tr>'; }).join('')
      + '</tbody></table></div></div></div>'

/* ---- แท็บ ปลายทางและขอบเขตวันที่ (S-40 · S-42 · S-43 · FN-53 · FN-54 · FN-57 · FN-58) ---- */
function toggleLink(k) {
  state.link[k] = !state.link[k];
  render();
  showToast((state.link[k] ? 'ทำเครื่องหมายว่าเชื่อมแล้ว: ' : 'ทำเครื่องหมายว่ายังไม่เชื่อม: ') + k, state.link[k] ? 'success' : 'warning');
}
function viewDownstream() {
  const pub = CASES.filter(function (c) { return inScope(c) && ((c.type === 'onboarding' && ['running','closed'].indexOf(c.st) >= 0) || (c.type === 'offboarding' && ['approved','revoking','revoked','closed'].indexOf(c.st) >= 0)); });
  const rows = pub.length ? pub.map(function (c) {

                 : (c.leaver.on ? '<span class="lnk-st is-on"><i data-lucide="check" class="w-3 h-3"></i>ส่งสัญญาณสิ้นสุดสิทธิ์แล้ว</span>' : '<span class="lnk-st is-off"><i data-lucide="minus" class="w-3 h-3"></i>ยังไม่ส่ง</span>')) + '</td>'
      + '<td>' + cPill(c.st) + '</td>'

  const readers = READERS.map(function (r) {
    return '<div class="lk-row"><div class="pick-ic"><i data-lucide="' + r.i + '" class="w-4 h-4"></i></div>'
      + '<div class="min0"><div class="cfg-k">' + r.n + '</div><div class="cfg-m">อ่าน: ' + r.reads + ' · ' + r.note + '</div></div>'
      + '<span class="mla rowgap">' + (state.link[r.k] ? '<span class="lnk-st is-on"><i data-lucide="plug" class="w-3 h-3"></i>เชื่อมแล้ว</span>' : '<span class="lnk-st is-off"><i data-lucide="unplug" class="w-3 h-3"></i>ยังไม่เชื่อม</span>')
      + '<button class="chip-btn" onclick="toggleLink(\'' + r.k + '\')">' + (state.link[r.k] ? 'ทำเครื่องหมายว่ายังไม่เชื่อม' : 'ทำเครื่องหมายว่าเชื่อมแล้ว') + '</button></span></div>';
  }).join('');

  return SEC('calendar-range', 'ขอบเขตวันที่ที่เผยแพร่ให้ปลายทางอ่าน', 'อ่านอย่างเดียว · เป็นสำเนา ณ เวลาที่เผยแพร่',
      '<div class="mini-wrap"><table class="table tbl-min-sm"><thead><tr><th>พนักงาน</th><th>รหัสรอบภายใน</th><th>วันเริ่มงาน</th><th>วันทำงานวันสุดท้าย</th><th>สัญญาณถึงสวัสดิการ</th><th>สถานะรอบ</th><th>เวอร์ชันค่าที่ใช้</th></tr></thead><tbody>' + rows + '</tbody></table></div>')
  + SEC('unplug', 'ปลายทางที่อ่านค่าเหล่านี้', READERS.filter(function (r) { return state.link[r.k]; }).length + '/' + READERS.length + ' เชื่อมแล้ว', readers)
  + SEC('shield-off', 'สิ่งที่ทำไม่ได้จากหน้านี้', 'ขอบเขตที่ประกาศไว้',
      '<div class="rev-dl">'
      + '<dt>เวลาเข้างาน · การลา · เงินเดือน · ทะเบียนพนักงาน</dt><dd>อ่านอย่างเดียว — ไม่มีปุ่มหรือช่องใดที่เขียนกลับไปยังต้นทางเหล่านี้</dd>'
      + '<dt>ตัวเลขเงินทุกชนิด</dt><dd>ไม่มีในทุกหน้าจอของ เข้าออกงาน — ค่าชดเชยและเงินได้ครั้งสุดท้ายอยู่ที่ เงินเดือน</dd>'
      + '<dt>เอกสารที่มีเลขที่</dt><dd>คำสั่งเปลี่ยนแปลงพนักงานและหนังสือรับรองออกที่ feature ของตัวเอง — ที่นี่มีเพียงลิงก์ไปขอ</dd>'
      + '<dt>รายงานกวาดหาบัญชีตกค้างทั้งระบบ</dt><dd>ไม่มีที่นี่ — เห็นได้เฉพาะรอบของ เข้าออกงาน เองที่ยังมีสิทธิ์ค้าง</dd>'
      + '<dt>แบบฟอร์มสัมภาษณ์พนักงานลาออก</dt><dd>ไม่มีในระบบ — มีเพียงงานในชุดให้จัดสัมภาษณ์นอกระบบแล้วแนบผลกลับมาผ่าน คลังเอกสาร</dd>'
      + '<dt>การสร้างหรือดำเนินการรอบออกงานเป็นชุดหลายคน</dt><dd>ไม่มีปุ่มทำเป็นชุด — ทำได้ทีละคน เพราะการเพิกถอนต้องพิสูจน์เป็นรายรายการ</dd>'
      + '<dt>รอบของผู้รับเหมา ที่ปรึกษา หรือบุคคลภายนอก</dt><dd>ช่องเลือกคนอ่านจากทะเบียนพนักงานเท่านั้น ยังไม่มีทะเบียนบุคคลภายนอกในระบบ</dd>'
      + '<dt>การลงลายเซ็นอิเล็กทรอนิกส์</dt><dd>ไม่มีในทุกหน้าของ เข้าออกงาน — หลักฐานใช้การแนบไฟล์ผ่าน คลังเอกสาร แทน</dd>'
      + '<dt>ช่วงพักงานระหว่างบอกกล่าว</dt><dd>ไม่มีในระบบนี้ — กระทบเวลาเข้างานและเงินเดือนโดยตรง ต้องให้ผู้กำหนดนโยบายเคาะก่อน</dd>'
      + '<dt>การลบหรือทำให้ข้อมูลบุคคลไม่ระบุตัวตน</dt><dd>ไม่มีที่นี่ — ประวัติเป็นแบบเพิ่มอย่างเดียวและยังอ่านได้เสมอ</dd>'
      + '</div>'
      + '<div class="rowgap mtop">' + roleLink('จัดการที่ สิทธิ์ผู้ใช้งาน') + cfgLink('employment_term','จัดการที่ ตั้งค่า HR') + '<button class="lkout" onclick="openMovement()"><i data-lucide="external-link" class="w-3 h-3"></i>ออกคำสั่งที่ คำสั่งเปลี่ยนแปลงพนักงาน</button><button class="lkout" onclick="openCert()"><i data-lucide="external-link" class="w-3 h-3"></i>ขอหนังสือรับรองที่ หนังสือรับรอง</button></div>');
}
</script>
<script>
/* ============================================================
   สร้างรอบ (create drawer · archetype master — ไม่ใช่ตัวช่วยสร้าง 5 ขั้นของเอกสาร)
   เลือกคนจาก combobox พนักงานเท่านั้น · ทีละคน · ไม่มีการสร้างเป็นชุด (FN-80 · FN-81)
   ============================================================ */
function openCreate(type) {
  openDW('create', { wide:true, form:{
    type:type, emp:'', start:'', notice:'', lwd:'', reason:'resign', imm:false,
    tpl:type === 'onboarding' ? 'TPL-ON-OFFICE' : 'TPL-OFF-OFFICE', cand:'', err:{}
  } });
}
function cf() { return state.dw.form; }
function setCF(k, v) { cf()[k] = v; if (k === 'reason') { const r = reasonOf(v); if (r.kind === 'involuntary') cf().imm = cf().imm; } render(); }
function toggleImm() { cf().imm = !cf().imm; render(); }

function createChainPreview() {
  const f = cf();
  if (f.type !== 'offboarding' || !f.emp) return '';
  /* จำนวนขั้นมาจากผลของ resolve — ไม่ใช่ตัวเลขที่เขียนไว้ในหน้าจอ (FN-24 · FN-29) */
  const fake = { emp:f.emp, reason:f.reason, imm:f.imm };
  const steps = resolveDoa(fake, P().emp);
  const why = f.imm ? 'มีธงออกทันที' : (reasonOf(f.reason).kind === 'involuntary' ? 'เหตุผลการออกเป็นชนิดไม่สมัครใจ' : 'เหตุผลการออกเป็นชนิดสมัครใจ');
  return '<div class="rowgap mtop"><span class="fl f-ok"><i data-lucide="git-branch" class="w-3 h-3"></i>สายอนุมัติจะมี ' + steps.length + ' ขั้น</span>'
    + '<span class="hint-inline">' + why + ' · จำนวนขั้นมาจากระบบสายอนุมัติ ณ เวลากดส่ง</span></div>';
}
function createPreviewRows() {
  const f = cf();
  const base = f.type === 'onboarding' ? f.start : f.lwd;
  if (!f.emp || !base || !f.tpl) return '<div class="hint-inline">กรอกให้ครบเพื่อดูงานที่จะถูกสร้าง ' + tipI('ต้องมีพนักงาน วันที่ และแม่แบบชุดงาน จึงจะคำนวณกำหนดเสร็จของแต่ละงานได้') + '</div>';
  let rows = TPL_TASKS[f.type].slice();
  if (f.type === 'offboarding') {
    const sub = subordinatesOf(f.emp).length;
    if (sub > 0) rows = rows.concat([TPL_TASK_DELEGATE]);
  }
  const body = rows.map(function (t) {
    const due = t.off == null ? '' : shiftWorkDays(base, t.off);
    const as = t.as || (t.at === 'หัวหน้าของเจ้าของรอบ' ? empOf(f.emp).sup : '');
    return '<tr><td>' + t.n + '</td><td><span class="grp">' + t.g + '</span></td>'
      + '<td>' + (as ? empOf(as).n : '<span class="text-mute-2">ตามตำแหน่ง</span>') + '</td>'
      + '<td class="tnum">' + (due ? dTH(due) : '<span class="nv"><i data-lucide="minus-circle" class="w-3 h-3"></i>ผู้ใช้ตั้งวันเอง</span>') + '</td>'
      + '<td>' + (t.m ? 'บังคับ' : '—') + '</td></tr>';
  }).join('');
  return '<div class="pv-wrap"><table class="mini-tbl"><thead><tr><th>งานที่จะถูกสร้าง</th><th>กลุ่ม</th><th>ผู้รับผิดชอบ</th><th>กำหนดเสร็จ</th><th>ความจำเป็น</th></tr></thead><tbody>' + body + '</tbody></table></div>'
    + '<div class="hint-inline mtop">คำนวณจาก' + (f.type === 'onboarding' ? 'วันเริ่มงาน' : 'วันทำงานวันสุดท้าย') + ' ตัดวันหยุด ' + CFG_VER.holiday + ' ' + tipI('บวกลบระยะที่แม่แบบกำหนด แล้วเลื่อนพ้นวันหยุดตามปฏิทินที่อ่านมาจาก ตั้งค่า HR') + '</div>';
}
function createErrors() {
  const f = cf(), e = {};
  if (!f.emp) e.emp = 'เลือกพนักงานจากทะเบียนพนักงาน';
  if (!f.tpl) e.tpl = 'เลือกแม่แบบชุดงาน';
  if (f.type === 'onboarding') {
    if (!f.start) e.start = 'ระบุวันเริ่มงาน';
    else if (inClosedPeriod(f.start)) e.start = 'วันเริ่มงานตกในงวดที่ปิดแล้ว — วันที่เร็วที่สุดที่ตั้งได้คือ ' + dTH(FIRST_OPEN_DAY);
  } else {
    if (!f.notice) e.notice = 'ระบุวันแจ้ง';

          'ระบบไม่คำนวณวันครบทดลองงานให้ และไม่มีตัวเลขวันเดาไว้ที่ใด งานทบทวนผลทดลองงานให้ผู้ใช้ตั้งวันเอง') + '</div>'

          '<span class="rowgap"><span class="lnk-st is-off"><i data-lucide="unplug" class="w-3 h-3"></i>ยังไม่เชื่อม</span><button class="lkout" onclick="openRecruit()"><i data-lucide="external-link" class="w-3 h-3"></i>การสรรหายังไม่มีในระบบ</button></span>') + '</div>'

          + REASONS.map(function (r) { return '<option value="' + r.k + '"' + (f.reason===r.k?' selected':'') + '>' + r.n + '</option>'; }).join('') + '</select>', '',
          'เป็นข้อมูลอ่อนไหว บทบาทที่ไม่มีสิทธิ์จะเห็นเป็นจุด') + '</div>'

      + '<div>' + fld('วันแจ้ง', '<input class="input" type="date" value="' + f.notice + '" onchange="setCF(\'notice\',this.value)">', err.notice) + '</div>'

      + '<div class="span2">' + fld('แม่แบบชุดงานปิดสิทธิ์', searchSelectHTML('cr-tpl', { placeholder:'ค้นหาแม่แบบชุดงาน' }), err.tpl) + '</div>'
      + '</div>' + createChainPreview());

    }

  body += SEC('list-checks', 'รายการงานที่จะถูกสร้าง', 'ทุกงานจะกลายเป็นงานจริงใน กระบวนการทำงาน', createPreviewRows());

  const foot = '<div class="drawer-footer"><button class="btn btn-ghost" onclick="closeDrawer()">ยกเลิก</button>'

    + '<span class="dw-footer-right"><button class="btn btn-primary' + (state.busy ? ' is-disabled' : '') + '"' + (state.busy ? ' disabled' : '') + ' onclick="submitCreate()">'

function submitCreate() {
  const f = cf();
  f.showErr = true;
  const e = createErrors();
  if (Object.keys(e).length) { render(); showToast('ยังกรอกไม่ครบ — ดูช่องที่ขึ้นสีแดง', 'warning'); return; }
  if (state.busy) return;
  state.busy = true; render();
  setTimeout(function () {
    const on = f.type === 'onboarding';
    const seq = CASES.filter(function (c) { return c.type === f.type; }).length + 1;
    const id = (on ? 'ONB-' : 'OFB-') + String(seq).padStart(4, '0');
    const rec = {
      id:id, type:f.type, emp:f.emp, st:on ? 'draft' : 'draft', tpl:f.tpl,
      start:f.start, cand:f.cand, candLink:false, created:nowStr(), by:P().emp,
      reason:f.reason, imm:f.imm, notice:f.notice, lwd:f.lwd, revDue:'',
      appStatus:'draft', chain:[], entry:'', action:'',
      joiner:{ on:false, at:'' }, leaver:{ on:false, at:'' },
      closedAt:'', closedBy:'', rehire:null, rehireNote:'',
      subord:on ? 0 : subordinatesOf(f.emp).length, pendApp:0,
      probResult:'', probBy:'', probAt:''
    };
    CASES.push(rec);
    TASK_STATE[id] = { done:[], doing:[], due:{}, ev:{} };
    ACCESS.push({ id:'AC-' + id, case:id, k:'iam', a:'sso-' + f.emp.toLowerCase(), l:'บัญชีผู้ใช้องค์กร (SSO)', src:on ? 'onb' : 'cur', g:on ? 'none' : 'done', r:'none', ack:null, fr:'', rt:0 });
    buildTasks();
    /* [NTF-HOOK] onb_case_started → ผู้รับผิดชอบทุกงานในชุด + หัวหน้าของผู้เข้าใหม่ (ดู NTF_BRIEF.md) */
    pushAudit(id, 'create', on ? 'สร้างรอบเข้างาน' : 'สร้างรอบออกงาน', (tplOf(f.tpl) ? 'แม่แบบ ' + tplOf(f.tpl).n : '') + ' · ' + (on ? 'วันเริ่มงาน ' + dTH(f.start) : 'วันทำงานวันสุดท้าย ' + dTH(f.lwd)));
    state.busy = false;
    closeDrawer();
    setTimeout(function () { render(); showToast('สร้าง ' + id + ' เป็นร่างแล้ว · งานในชุดถูกประกาศเป็นงานจริงใน กระบวนการทำงาน', 'success'); openCase(id); }, 300);
  }, 700);
}
