/* ---- helpers ---- */
function curRole(){ return PERF.roles.find(r => r.id === state.role) || PERF.roles[0]; }
function cyc(id){ return PERF.cycles.find(c => c.id === id) || {}; }
function appr(id){ return PERF.apprs.find(a => a.id === id) || null; }
function wsum(a){ return a.kpis.reduce((s,k) => s + (+k.w || 0), 0); }
function rawScore(a){ let s=0,w=0; a.kpis.forEach(k => { if(k.mgr!=null){ s+=k.mgr*k.w; w+=k.w; } }); return w ? (s/w) : null; }
function scoreText(a){ const s = rawScore(a); return s==null ? '—' : s.toFixed(2); }
/* FIX-08 · เกรดเสนอจากคะแนนถ่วงน้ำหนัก (ใช้ในมุม Calibration ระดับทีม · mock) */
function gradeOf(a){ const s=rawScore(a); if(s==null) return '—'; if(s>4.5) return 'A'; if(s>=4) return 'B'; if(s>=3) return 'C'; return 'D'; }
function mask(v){ return curRole().mask ? '<span class="masked">•••</span>' : v; }
function isOverdue(a){ return a.status!=='published' && a.due < TODAY; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* FIX-03 · role guard (สิทธิ์) — ใช้ทั้งชั้น function guard และชั้น UI (ไม่ render ปุ่ม mutation ให้ role ที่ไม่ผ่านเงื่อนไขเดียวกัน) */
const sec = {
  can(action){
    const r = curRole();
    if(action==='saveMgr') return r.id==='mgr' || !!r.manage;   // บันทึกผลหัวหน้า = หัวหน้าสายงาน หรือ HR (manage)
    return !!r.manage;   // doCalib · doPip · doCloseCycle · sendMovement · sendTraining · sendSuccession = ต้องมีสิทธิ์จัดการ (HR)
  }
};
/* FIX-05 · lock รอบที่ปิด — mutation ทุกตัวของแบบประเมินเช็คก่อนเสมอ */
function cycleClosed(a){ return !!(a && cyc(a.cycle).status==='closed'); }
/* FIX-04 · scope SELF (staff) · OQ-PERF-03 · scope DEPT (mgr เห็นเฉพาะแผนกตัวเอง) · HR (manage) = ALL
   staff(mask=true · staff.name===emp) เห็นเฉพาะของตน · mgr เห็นเฉพาะ dept ตัวเอง · คนนอก scope ไม่อยู่ใน DOM (ไม่ใช่แค่ mask) */
function scopeSelf(list){ const r = curRole();
  if(r.mask) return list.filter(a => a.emp===r.name);        // staff = SELF
  if(r.id==='mgr') return list.filter(a => a.dept===r.dept);  // OQ-PERF-03 · mgr = เฉพาะแผนกตัวเอง (เฉพาะแผนกตัวเอง)
  return list;                                                // HR (manage) = ALL
}

const CST = { open:['เปิดกรอก','pill-success'], calibration:['สอบทาน','pill-warning'], closed:['ปิดรอบ','pill-muted'] };
const AST = { goal:['ตั้งเป้า','pill-muted'], self:['ประเมินตนเอง','pill-info'], mgr:['หัวหน้าประเมิน','pill-info'], calibration:['รอสอบทาน','pill-warning'], published:['เผยแพร่ผล','pill-success'] };
function pill(map, s){ const m = map[s] || [s,'pill-muted']; return '<span class="pill '+m[1]+'">'+esc(m[0])+'</span>'; }
function personCell(name, sub){ return '<span class="tbl-person"><span class="av">'+esc((name||'').slice(0,1))+'</span><span class="pp"><b>'+esc(name||'—')+'</b><span>'+esc(sub||'')+'</span></span></span>'; }

        + '</div></div>';
      /* ส่งต่อผล — ปรับตำแหน่ง/เงินเดือนส่งได้ทุกผลที่เผยแพร่ (FN-07 decouple จาก gap: top performer ไม่มี gap ก็ต้องส่งเรื่องเลื่อนขั้นได้) · อบรมเฉพาะเมื่อมี gap · Succession เมื่อผ่าน/top (FIX-09) · ปุ่ม mutation เฉพาะผู้มีสิทธิ์ (FIX-03) */
      if(canReview && !closed){
        box += '<div class="hookbox mt-3"><div class="hb-body">'
          + (a.gap ? 'Gap ที่พบ: <b>'+esc(a.gap)+'</b> — ส่งต่อได้:' : 'ส่งต่อผลไปโมดูลอื่น:')

          + (a.gap ? '<button class="btn btn-sm btn-secondary" onclick="sendTraining(\''+a.id+'\')"><i data-lucide="graduation-cap" class="w-3.5 h-3.5"></i><span>ส่งไปอบรม</span></button>' : '')
          + '<button class="btn btn-sm btn-secondary" onclick="sendMovement(\''+a.id+'\')"><i data-lucide="arrow-left-right" class="w-3.5 h-3.5"></i><span>ส่งเรื่องปรับตำแหน่ง/เงินเดือน</span></button>'
          + (topPerf ? '<button class="btn btn-sm btn-secondary" onclick="sendSuccession(\''+a.id+'\')"><i data-lucide="users-round" class="w-3.5 h-3.5"></i><span>ส่งเข้า Succession Planning</span></button>' : '')
          + '</div></div>';
      }
      return '<div class="sec m0">'+box+'</div>';
    }).join('') + '</div>';
  } else h += '<div class="hookbox"><span class="hb-body">ยังไม่มีผลที่เผยแพร่</span></div>';
  h += '</div>';
  return h;
}

/* ---- Tab 4 · รายงาน (FN-13) ---- */
function reportView(){
  const inCycle = PERF.apprs.filter(a => state.f.repCycle==='all' || a.cycle===state.f.repCycle);
  const buckets = { 'ต่ำ (<3.0)':0, 'ปานกลาง (3.0–3.9)':0, 'ดี (4.0–4.5)':0, 'ดีเยี่ยม (>4.5)':0 };
  inCycle.forEach(a => { const s=rawScore(a); if(s!=null){ if(s<3)buckets['ต่ำ (<3.0)']++; else if(s<4)buckets['ปานกลาง (3.0–3.9)']++; else if(s<=4.5)buckets['ดี (4.0–4.5)']++; else buckets['ดีเยี่ยม (>4.5)']++; } });
  const max = Math.max(1, ...Object.values(buckets));
  const opts = [['all','ทุกรอบ']].concat(PERF.cycles.map(c=>[c.id, c.name+' '+c.year]));
  return '<div class="stats">'
    + '<div class="stat"><div class="stat-label"><i data-lucide="clipboard-list" class="w-3 h-3"></i>แบบประเมินในรอบ</div><div class="stat-value">'+inCycle.length+'</div></div>'
    + '<div class="stat"><div class="stat-label"><i data-lucide="check-circle-2" class="w-3 h-3"></i>เผยแพร่ผลแล้ว</div><div class="stat-value">'+inCycle.filter(a=>a.status==='published').length+'</div></div>'
    + '<div class="stat"><div class="stat-label"><i data-lucide="alert-triangle" class="w-3 h-3"></i>ทบทวน (PIP)</div><div class="stat-value">'+inCycle.filter(a=>(a.decision||'').includes('ทบทวน')).length+'</div></div>'
    + '</div>'
    + '<div class="card"><div class="filter-row"><b class="h3t">การกระจายคะแนน</b><div class="fr-spacer"></div>'
    + '<select class="select w220" onchange="state.f.repCycle=this.value;refreshView()">' + opts.map(o=>'<option value="'+o[0]+'"'+(state.f.repCycle===o[0]?' selected':'')+'>'+esc(o[1])+'</option>').join('') + '</select></div>'
    + '<div class="pad-lr">' + Object.entries(buckets).map(([k,v]) =>
        '<div class="funnel-row"><span class="funnel-label">'+esc(k)+'</span><div class="funnel-track"><div class="funnel-bar" style="--fw:'+(v/max*100)+'%"></div></div><span class="funnel-val">'+v+'</span></div>'
      ).join('') + '</div></div>';
}

function renderKpiEditorShell(a){

function delKpi(i){ state.edit.splice(i,1); const c=document.getElementById('kpiEditor'); const a=appr(state.drawer.recordId); if(c){ c.outerHTML=renderKpiEditorShell(a); renderIcons(); } }
function saveKpi(id){
  if(state._busy) return; const a=appr(id); if(!a) return;
  if(cycleClosed(a)){ showToast('รอบนี้ปิดแล้ว — แก้ไขไม่ได้','warning'); return; }   // FIX-05
  if(a.status!=='goal'){ showToast('บันทึกเป้า/KPI ได้เฉพาะขั้นตั้งเป้า','warning'); return; }   // FIX-02
  const rows=state.edit || [];
  if(rows.some(k=>!k.n.trim())){ showToast('กรุณากรอกชื่อ KPI ให้ครบ','warning'); return; }
  const sum = rows.reduce((s,k)=>s+(+k.w||0),0);
  if(sum!==100){ showToast('น้ำหนัก KPI รวมต้องเท่ากับ 100% (ตอนนี้ '+sum+'%)','warning'); return; }
  const btn=document.getElementById('btnKpi'); state._busy=true; if(btn){ btn.classList.add('is-disabled'); btn.innerHTML='<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>'; renderIcons(); }
  setTimeout(()=>{ a.kpis=JSON.parse(JSON.stringify(rows)); pushAudit(id,'ตั้งเป้า/KPI'); a.status='self'; state.edit=null; state._busy=false; render(); showToast('บันทึกเป้า/KPI แล้ว · เปิดให้พนักงานประเมินตนเอง','success'); }, 450);
}
function onScoreInput(){ /* live weighted score for mgr edit */
  const a=appr(state.drawer.recordId); if(!a) return;
  document.querySelectorAll('#kpiScoreBody input.in').forEach(inp=>{ const i=+inp.dataset.i; const v=inp.value===''?null:+inp.value; if(a.status==='self') a.kpis[i].self=v; else a.kpis[i].mgr=v; });
  const ls=document.getElementById('liveScore'); if(ls) ls.textContent=scoreText(a)+' / 5';
}
function saveSelf(id){
  if(state._busy) return; const a=appr(id); if(!a) return;
  if(cycleClosed(a)){ showToast('รอบนี้ปิดแล้ว — แก้ไขไม่ได้','warning'); return; }   // FIX-05
  if(a.status!=='self'){ showToast('ประเมินตนเองได้เฉพาะขั้นประเมินตนเอง','warning'); return; }   // FIX-02
  if(a.kpis.some(k=>k.self==null||k.self<1||k.self>5)){ showToast('กรุณาให้คะแนนตนเองครบทุก KPI (1–5)','warning'); return; }
  a.selfNote=(document.getElementById('selfNote')||{}).value||'';
  const btn=document.getElementById('btnSelf'); state._busy=true; if(btn){ btn.classList.add('is-disabled'); btn.innerHTML='<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>'; renderIcons(); }
  setTimeout(()=>{ pushAudit(id,'พนักงานประเมินตนเอง'); a.status='mgr'; state._busy=false; render(); showToast('บันทึกประเมินตนเองแล้ว · ส่งต่อหัวหน้าประเมิน','success'); }, 450);
}
function saveMgr(id){
  if(state._busy) return; const a=appr(id); if(!a) return;
  if(cycleClosed(a)){ showToast('รอบนี้ปิดแล้ว — แก้ไขไม่ได้','warning'); return; }   // FIX-05
  if(!sec.can('saveMgr')){ showToast('สิทธิ์ไม่พอ','warning'); return; }   // FIX-03
  if(a.status!=='mgr'){ showToast('บันทึกผลหัวหน้าได้เฉพาะขั้นหัวหน้าประเมิน','warning'); return; }   // FIX-02
  if(a.kpis.some(k=>k.mgr==null||k.mgr<1||k.mgr>5)){ showToast('กรุณาให้คะแนน (หัวหน้า) ครบทุก KPI (1–5)','warning'); return; }
  a.mgrNote=(document.getElementById('mgrNote')||{}).value||'';
  const btn=document.getElementById('btnMgr'); state._busy=true; if(btn){ btn.classList.add('is-disabled'); btn.innerHTML='<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>'; renderIcons(); }
  setTimeout(()=>{ pushAudit(id,'หัวหน้าประเมิน + คะแนน'); a.status='calibration'; state._busy=false; render(); showToast('บันทึกผลหัวหน้าแล้ว · ส่งเข้าสอบทาน (DOA)','success'); }, 450);
}

  const reviewed = a.status==='published';
  return '<div class="sec"><h4><i data-lucide="git-branch" class="w-4 h-4"></i>สอบทานผล (DOA · role-based)</h4>'
    + '<p class="sub-note mb-3">ผู้สอบทาน resolve ตามตำแหน่ง (มติ 17 ส.ค.) — ไม่ hardcode สายอนุมัติในหน้านี้</p>'
    + '<ul class="tl">'
    + '<li class="'+(a.kpis.every(k=>k.mgr!=null)?'on':'wait')+'"><b>ขั้น 1 · หัวหน้าสายงาน</b><small>'+(a.kpis.every(k=>k.mgr!=null)?'ประเมินครบแล้ว':'รอหัวหน้าประเมิน')+'</small></li>'
    + '<li class="'+(reviewed?'on':(a.status==='calibration'?'wait':''))+'"><b>ขั้น 2 · ผู้สอบทาน (HRBP/ผู้บริหารตามตำแหน่ง)</b><small>'+(reviewed?'สอบทานแล้ว · decision: '+esc(a.decision):'รอสอบทาน (DOA)')+'</small></li>'
    + '</ul>'

}
function tabHistory(a){
  const log = PERF.audit[a.id] || [{ act:'ตั้งเป้า/KPI', who:'HR', at:cyc(a.cycle).period }];
  return '<div class="sec"><h4><i data-lucide="history" class="w-4 h-4"></i>ประวัติ (audit · append-only)</h4><ul class="tl">'

}
function pushAudit(id, act){ PERF.audit[id]=PERF.audit[id]||[]; PERF.audit[id].unshift({ act, who:curRole().name, at:TODAY+' '+new Date().toTimeString().slice(0,5) }); }

/* FIX-06 · จังหวะ 1 — ส่งสอบทาน: freeze รายชื่อผู้สอบทาน 2 ขั้น (approvals current/pending) · สถานะคำขอคง calibration
   FIX-01 precondition (calibration + คะแนนหัวหน้าครบ) · FIX-03 role (manage) · FIX-05 closed lock */
function doCalibSend(id){
  if(state._busy) return;
  const a=appr(id); if(!a) return;
  if(cycleClosed(a)){ showToast('รอบนี้ปิดแล้ว — แก้ไขไม่ได้','warning'); return; }   // FIX-05
  if(!sec.can('doCalib')){ showToast('สิทธิ์ไม่พอ','warning'); return; }   // FIX-03
  if(a.status!=='calibration' || rawScore(a)==null){ showToast('สอบทานได้เฉพาะแบบประเมินที่ให้คะแนนหัวหน้าครบและรอสอบทาน','warning'); return; }   // FIX-01
  const s0=ssGet('doa0'), s1=ssGet('doa1');
  if(!s0||!s0.value||!s1||!s1.value){ showToast('กรุณาเลือกผู้สอบทานให้ครบทุกขั้น','warning'); return; }   // FIX-06 · validation บังคับเลือกครบ
  const nm = pid => (PERF.people.find(p=>p.id===pid)||{}).name || pid;
  const btn=document.getElementById('btnCalib'); state._busy=true; if(btn){ btn.classList.add('is-disabled'); btn.innerHTML='<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังส่ง…</span>'; renderIcons(); }
  setTimeout(()=>{
    a.approvals = [
      { no:1, role:'หัวหน้าสายงาน', personId:s0.value, personName:nm(s0.value), status:'current', at:null, actor:null },
      { no:2, role:'ผู้สอบทาน (HRBP/ผู้บริหาร)', personId:s1.value, personName:nm(s1.value), status:'pending', at:null, actor:null }
    ];
    pushAudit(id,'ส่งสอบทาน · เลือกผู้สอบทาน 2 ขั้น (คง calibration)');
    state._busy=false; render();
    showToast('ส่งสอบทานแล้ว · รอผู้สอบทานขั้นที่ 1 บันทึกผล','info');
  }, 400);
}
/* FIX-06 · จังหวะ 2 — ผู้สอบทานขั้น current บันทึกผลของตน (stamp at/ผู้กระทำ) · เฉพาะขั้นสุดท้ายจึง published + decision + notif + CSQ (FIX-07) */
function doCalibStage(id){
  if(state._busy) return;
  const a=appr(id); if(!a || !a.approvals) return;
  if(cycleClosed(a)){ showToast('รอบนี้ปิดแล้ว — แก้ไขไม่ได้','warning'); return; }   // FIX-05
  if(!sec.can('doCalib')){ showToast('สิทธิ์ไม่พอ','warning'); return; }   // FIX-03
  if(a.status!=='calibration'){ showToast('บันทึกผลสอบทานได้เฉพาะแบบประเมินที่รอสอบทาน','warning'); return; }
  const cur=a.approvals.find(x=>x.status==='current'); if(!cur){ return; }
  const idx=a.approvals.indexOf(cur); const isLast = idx===a.approvals.length-1;
  const dec = isLast ? ((document.getElementById('p_dec')||{}).value||'ผ่าน') : null;
  const btn=document.getElementById('btnCalibStage'); state._busy=true; if(btn){ btn.classList.add('is-disabled'); btn.innerHTML='<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>'; renderIcons(); }
  setTimeout(()=>{
    cur.status='done'; cur.at=TODAY+' '+new Date().toTimeString().slice(0,5); cur.actor=curRole().name;
    pushAudit(id,'สอบทานขั้น '+cur.no+' ('+cur.role+') · '+cur.personName);
    if(!isLast){
      a.approvals[idx+1].status='current';
      state._busy=false; render();
      showToast('บันทึกผลสอบทานขั้น '+cur.no+' แล้ว · รอผู้สอบทานขั้นถัดไป','info');
    } else {
      a.status='published'; a.decision=dec;
      if(dec.includes('ทบทวน')) a.gap = a.gap || 'ต้องพัฒนาเพิ่มเติม';
      pushAudit(id,'เผยแพร่ผล · decision: '+dec);
      pushAudit(id,'บันทึกผลประเมินเข้า 7C');   // FIX-07 · CSQ hook per-person publish (ref ภายในถอดออกจากจอ · มติ OQ-PERF-02 RESOLVED — ยิงท่อ 7C ตอนเผยแพร่ผลรายคน · ไม่ประกาศ OC/DC ซ้ำ)
      PERF.notifs.unshift({ ic:'megaphone', b:'ผลประเมินเผยแพร่แล้ว', m:esc(a.emp)+' · decision: '+dec });
      state._busy=false; closeModal(); render();
      showToast('เผยแพร่ผล · บันทึกผลเข้า 7C · RESTRICTED · แจ้งเตือนพนักงานแล้ว','success');
    }
  }, 450);
}
function doCloseCycle(id){
  if(state._busy) return;
  if(!sec.can('doCloseCycle')){ showToast('สิทธิ์ไม่พอ','warning'); return; }   // FIX-03
  const c=cyc(id); const btn=document.getElementById('btnClose'); state._busy=true;
  if(btn){ btn.classList.add('is-disabled'); btn.innerHTML='<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังปิด…</span>'; renderIcons(); }
  setTimeout(()=>{ c.status='closed'; state._busy=false; closeModal(); closeDrawer(); render(); showToast('ปิดรอบแล้ว · ล็อกการแก้ไข (soft archive)','info'); }, 400);
}
function doPip(id){
  if(state._busy) return; const a=appr(id); if(!a) return;
  if(cycleClosed(a)){ showToast('รอบนี้ปิดแล้ว — แก้ไขไม่ได้','warning'); return; }   // FIX-05
  if(!sec.can('doPip')){ showToast('สิทธิ์ไม่พอ','warning'); return; }   // FIX-03
  const gap=(document.getElementById('pip_gap')||{}).value||a.gap;
  if(!gap || !gap.trim()){ showToast('กรุณาระบุประเด็นที่ต้องพัฒนา','warning'); return; }
  const btn=document.getElementById('btnPip'); state._busy=true; if(btn){ btn.classList.add('is-disabled'); btn.innerHTML='<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>'; renderIcons(); }
  setTimeout(()=>{ a.gap=gap; pushAudit(id,'เปิดแผน PIP · '+(document.getElementById('pip_dur')||{}).value); state._busy=false; closeModal(); render(); showToast('เปิดแผน PIP แล้ว','success'); }, 450);
}
/* OQ-PERF-01 · เปิดแก้ไขผลหลังเผยแพร่ — authorized (manage) + open cycle + published เท่านั้น · append-only audit (ใครแก้)
   ส่งกลับขั้นหัวหน้าประเมิน (mgr) → แก้คะแนน → สอบทาน (DOA) → เผยแพร่ใหม่ (staged DOA เดิม · CSQ 7C ยิงซ้ำ per-person · มติ OQ-PERF-02)
   ไม่อ่อน guard เดิม: FIX-05 closed lock · FIX-03 role · saveMgr/doCalib ยัง stage/role/closed-guarded ครบ */
function doReopen(id){
  if(state._busy) return; const a=appr(id); if(!a) return;
  if(cycleClosed(a)){ showToast('รอบนี้ปิดแล้ว — แก้ไขไม่ได้','warning'); return; }   // FIX-05 · open cycle only
  if(!sec.can('reopen')){ showToast('สิทธิ์ไม่พอ','warning'); return; }   // OQ-PERF-01 · authorized (manage · HR) เท่านั้น
  if(a.status!=='published'){ showToast('เปิดแก้ไขได้เฉพาะผลที่เผยแพร่แล้ว','warning'); return; }   // published only (explicit transition)
  const ta=document.getElementById('reopenReason'); const reason=ta?ta.value.trim():'';
  if(!reason){ const f=document.getElementById('reopenErr'); if(f) f.closest('.field').classList.add('is-invalid'); return; }   // เหตุผลบังคับ (non-empty)
  const btn=document.getElementById('btnReopen'); state._busy=true; if(btn){ btn.classList.add('is-disabled'); btn.innerHTML='<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังเปิดแก้ไข…</span>'; renderIcons(); }
  setTimeout(()=>{
    pushAudit(id,'เปิดแก้ไขผลหลังเผยแพร่ · เหตุผล: '+reason);   // OQ-PERF-01 · pushAudit stamp who(=curRole().name)+at → บันทึก "ใครแก้" + เมื่อไหร่ + เหตุผล
    a.status='mgr'; a.decision=''; delete a.approvals;   // กลับขั้นหัวหน้าประเมิน · เคลียร์ผลตัดสิน+ผู้สอบทานเดิม (คงคะแนน/gap ไว้อ้างอิง) → re-publishable clean ผ่าน flow เดิม
    state._busy=false; closeModal(); render();
    showToast('เปิดแก้ไขผลแล้ว · ส่งกลับขั้นหัวหน้าประเมิน · บันทึกผู้แก้ไว้ในประวัติ','success');
  }, 450);
}
