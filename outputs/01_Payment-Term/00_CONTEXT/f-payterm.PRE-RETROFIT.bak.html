// render แล้วคง scroll ของ drawer-body (ใช้ค่าที่เก็บไว้ตอนเปิด dropdown — เลี่ยงอ่านค่าเพี้ยน)
function renderFormKeepScroll(){
  const cur=(document.querySelector('.drawer-body')||{}).scrollTop;
  const s = (state._formScroll!=null) ? state._formScroll : (cur||0);
  state._formScroll=null;   // ใช้ครั้งเดียว — กันค่าค้างทำ scroll เด้ง (Iron Rule #29)
  render();
  const nb=document.querySelector('.drawer-body');
  if(nb){ nb.scrollTop=s; requestAnimationFrame(()=>{ nb.scrollTop=s; }); }
}
function onFormPick(name,value){ state.form[name]=value; renderFormKeepScroll(); }
function onTypeChange(_n,v){
  const k=PT_TYPES[v];
  const keep={ type:v, code:state.form.code, name:state.form.name, name_en:state.form.name_en, due_basis:state.form.due_basis||'invoice_date', use_in:state.form.use_in||[], is_default:state.form.is_default||false, trigger:k.trigDefault };
  if(v==='full_prepay'){ /* trigger only */ }
  else if(v==='full_postpay'){ keep.net_days=0; }
  else if(v==='credit'){ keep.net_days=30; }
  else if(v==='deposit'){ keep.deposit_method='percent'; keep.deposit_value=50; keep.net_days=30; keep.remaining_timing='after_receipt'; }
  else if(v==='installment') keep.installments=[{pct:50,days:0,due_type:'on_doc',desc:''},{pct:50,days:30,due_type:'days_after_delivery',desc:''}];
  else if(v==='partial_delivery'){ keep.due_basis='delivery'; }
  else if(v==='direct_payment'){ keep.expense_category='utility'; keep.trigger=null; keep.use_in=(keep.use_in||[]).filter(d=>!DP_DISABLED_DOCS.includes(d)); }
  state.form=keep; render();
}
function onTriggerPick(_n,v){ state.form.trigger=v; renderFormKeepScroll(); }
function onDepMethodPick(_n,v){ state.form.deposit_method=v; if(v==='manual') state.form.deposit_value=''; renderFormKeepScroll(); }
function onRemainPick(_n,v){ state.form.remaining_timing=v; renderFormKeepScroll(); }
function onExpensePick(_n,v){ state.form.expense_category=v; renderFormKeepScroll(); }
function onInstDuePick(name,v){ const i=parseInt(name.split('__')[1]); if(state.form.installments[i]) state.form.installments[i].due_type=v; renderFormKeepScroll(); }
function onInstDesc(i,v){ if(state.form.installments[i]) state.form.installments[i].desc=v; }
function toggleUseIn(d){ const arr=state.form.use_in||[]; state.form.use_in = arr.includes(d)?arr.filter(x=>x!==d):arr.concat([d]); renderFormKeepScroll(); }
function toggleDefault(){ state.form.is_default=!state.form.is_default; renderFormKeepScroll(); }

// installment row ops
function addInst(){ state.form.installments=(state.form.installments||[]).concat([{pct:0,days:0,due_type:'days_after_delivery',desc:''}]); renderFormKeepScroll(); }
function removeInst(i){ state.form.installments=(state.form.installments||[]).filter((_,idx)=>idx!==i); renderFormKeepScroll(); }
function onInstPct(i,v){ state.form.installments[i].pct=Math.max(0,Math.min(100,parseInt(v)||0)); const t=(state.form.installments||[]).reduce((s,x)=>s+(+x.pct||0),0); const el=document.querySelector('.inst-total'); if(el){ el.textContent='รวม '+t+'% '+(t===100?'✓':'(ต้องเป็น 100%)'); el.className='inst-total '+(t===100?'is-ok':'is-warn'); } }
function onInstDays(i,v){ state.form.installments[i].days=Math.max(0,parseInt(v)||0); }

function archiveSummaryFields(t){ return {type:t.type,code:t.code,name:t.name,name_en:t.name_en,due_basis:t.due_basis}; }

// ============================================ SUBMIT
function submitTerm(){
  const f=state.form; let ok=true;
  ['fld-code','fld-name','fld-type','fld-inst','fld-usein','fld-deposit_value'].forEach(id=>document.getElementById(id)?.classList.remove('is-invalid'));
  if(!f.code||!f.code.trim()){ document.getElementById('fld-code')?.classList.add('is-invalid'); ok=false; }
  if(!f.name||!f.name.trim()){ document.getElementById('fld-name')?.classList.add('is-invalid'); ok=false; }
  const dup=state.terms.find(t=>t.code===(f.code||'').trim() && t.id!==state.drawer.recordId);
  if(dup){ document.getElementById('fld-code')?.classList.add('is-invalid'); ok=false; }
  // installment total = 100 (BR-ENH-02/03)
  if(f.type==='installment'){
    if((f.installments||[]).length<2){ document.getElementById('fld-inst')?.classList.add('is-invalid'); ok=false; showToast('ต้องมีอย่างน้อย 2 งวด','error'); }
    const total=(f.installments||[]).reduce((s,i)=>s+(+i.pct||0),0);
    if(total!==100){ document.getElementById('fld-inst')?.classList.add('is-invalid'); ok=false; showToast('สัดส่วนงวดต้องรวมเป็น 100% (ตอนนี้ '+total+'%)','error'); }
  }
  // deposit_value ≤ 100 ถ้า percent (BR-ENH-05)
  if(f.type==='deposit' && f.deposit_method==='percent' && (+f.deposit_value)>100){ document.getElementById('fld-deposit_value')?.classList.add('is-invalid'); ok=false; showToast('มัดจำแบบ % ต้องไม่เกิน 100','error'); }
  // credit_days > 0 (BR-ENH-10)
  if(f.type==='credit' && (!f.net_days||+f.net_days<=0)){ document.getElementById('fld-net_days')?.classList.add('is-invalid'); ok=false; showToast('จำนวนวันเครดิตต้องมากกว่า 0','error'); }
  // use_in ≥ 1 (BR-ENH-08)
  if(!(f.use_in||[]).length){ document.getElementById('fld-usein')?.classList.add('is-invalid'); ok=false; showToast('เลือกเอกสารที่ใช้อย่างน้อย 1 รายการ','error'); }
  // ส่วนลดจ่ายเร็ว: วันลดต้องน้อยกว่าวันเครดิต (standard 2/10 Net 30)
  if(f.type==='credit' && (+f.discount_pct||0)>0){
    if(!(+f.discount_days>0) || (+f.discount_days)>=(+f.net_days||0)){ document.getElementById('fld-discount_days')?.classList.add('is-invalid'); ok=false; showToast('วันชำระเพื่อรับส่วนลดต้องมากกว่า 0 และน้อยกว่าวันเครดิต','error'); }
  }
  // มัดจำ % ต้องมากกว่า 0
  if(f.type==='deposit' && f.deposit_method==='percent' && !((+f.deposit_value)>0)){ document.getElementById('fld-deposit_value')?.classList.add('is-invalid'); ok=false; showToast('มัดจำแบบ % ต้องมากกว่า 0','error'); }
  if(!ok){ if(dup) showToast('รหัสเงื่อนไขนี้มีอยู่แล้ว','error'); return; }
  // default unique ต่อ type (BR-ENH-02) + default ต้องสถานะใช้งาน (standard)
  if(f.is_default && (f.status||'active')!=='active'){ ok=false; showToast('ตั้งเป็นค่า Default ได้เฉพาะเงื่อนไขสถานะ "ใช้งาน"','error'); return; }
  if(f.is_default){ state.terms.forEach(t=>{ if(t.type===f.type && t.id!==state.drawer.recordId && t.is_default){ t.is_default=false; } }); }
  if(state.drawer.mode==='edit'){
    Object.assign(gById(state.drawer.recordId), f, {code:f.code.trim(), name:f.name.trim()});
    closeDrawer(); renderPageOnly(); showToast('บันทึกการแก้ไขแล้ว','success');
  } else {
    state.terms.push({ id:'t'+(++state.seq), ...f, code:f.code.trim(), name:f.name.trim(), status:f.status||'active', used:0, approver_role:null, approved_by:null, approved_at:null, approval_chain:null });
    closeDrawer(); renderPageOnly(); showToast('สร้างเงื่อนไขชำระเงินแล้ว','success');
  }
}

// ============================================ ARCHIVE
function askArchive(id){ openModal('confirm-archive', id); }
function doArchive(id){ const t=gById(id); if(t) t.status='archived'; closeModal(); if(state.drawer.open) closeDrawer(); renderPageOnly(); showToast('เลิกใช้งานเงื่อนไขแล้ว','info'); }
function reactivate(id){ const t=gById(id); if(t) t.status='active'; if(state.drawer.open&&state.drawer.mode==='view'){ render(); } else { renderPageOnly(); } showToast('เปิดใช้งานเงื่อนไขอีกครั้งแล้ว','success'); }

// ============================================ DRAWER
function renderDrawer(){
  if(!state.drawer.open) return '';
  const m=state.drawer.mode;
  let inner='';
  if(m==='view'){ inner=renderView(gById(state.drawer.recordId)); }
  else { inner=renderForm(m==='edit'?gById(state.drawer.recordId):null); }
  return `<div class="drawer-backdrop" onclick="closeDrawer()"></div><aside class="drawer" onclick="event.stopPropagation()">${inner}</aside>`;
}

function renderForm(t){
  const isEdit=!!t; const f=state.form; const type=f.type||'credit'; const k=PT_TYPES[type];
  const typeOpts=Object.entries(PT_TYPES).map(([kk,v])=>({value:kk,label:v.label}));
  const basisOpts=Object.entries(DUE_BASIS).map(([kk,v])=>({value:kk,label:v}));
  // trigger options — after_deposit เฉพาะ deposit (D05/BR-ENH-05)
  const trigOpts=Object.entries(TRIGGERS).filter(([kk,v])=>!v.depositOnly||type==='deposit').map(([kk,v])=>({value:kk,label:v.label}));

  // Warehouse/GRN/Ship Trigger field (ทุก type ยกเว้น direct_payment + credit lock)
  let triggerField='';
  if(k.noTrigger){ triggerField=''; }
  else if(k.trigLock){
    triggerField=`<div class="grn-trigger"><i data-lucide="lock" ></i><span>Warehouse/GRN trigger: <strong>${esc((TRIGGERS[k.trigDefault]||{}).label||'ทันที')}</strong> (ล็อกตามประเภท)</span></div>`;
  } else {
    triggerField=fieldBlock('Warehouse / GRN / Ship Trigger', searchDropdown('trigger', f.trigger||k.trigDefault, trigOpts, '— เลือก —', 'onTriggerPick'), 'จุดที่ระบบ unlock ให้คลังดำเนินการ (Pick/Pack/Ship หรือ GRN)', true);
  }

  let typeFields='';
  const discountFields = `
      ${fieldBlock('ส่วนลดจ่ายเร็ว (%)', numInput('discount_pct', f.discount_pct, 'เช่น 2 (เว้นว่าง = ไม่มี)'), 'ลดกี่ % ถ้าชำระเร็ว (optional)', false)}
      ${fieldBlock('ภายในกี่วัน (Discount days)', numInput('discount_days', f.discount_days, 'เช่น 10'), 'ได้ส่วนลดถ้าชำระภายในวันนี้ (optional)', false)}`;
  if(type==='full_prepay'){
    typeFields = triggerField;
  } else if(type==='full_postpay'){
    typeFields = `
      ${fieldBlock('ชำระภายใน (วันหลังรับของ)', numInput('net_days', f.net_days, 'เช่น 0 = ทันที, 7, 15'), 'รับของแล้วชำระเต็มภายในกี่วัน (0 = ทันที)', true)}
      ${discountFields}
      ${triggerField}`;
  } else if(type==='credit'){
    typeFields = `
      ${fieldBlock('จำนวนวันเครดิต (credit_days)', numInput('net_days', f.net_days, 'เช่น 30'), 'ชำระเต็มภายในกี่วันตาม due date · integer > 0', true)}
      ${discountFields}
      ${triggerField}`;
  } else if(type==='deposit'){
    const methodOpts=Object.entries(DEPOSIT_METHOD).map(([kk,v])=>({value:kk,label:v}));
    const remainOpts=Object.entries(REMAINING_TIMING).map(([kk,v])=>({value:kk,label:v}));
    const dm=f.deposit_method||'percent';
    const valField = dm==='manual' ? '' :
      fieldBlock('มูลค่ามัดจำ', `<div class="input-suffix"><input class="input field-input" name="deposit_value" type="number" min="0" ${dm==='percent'?'max="100"':''} placeholder="${dm==='percent'?'เช่น 50':'เช่น 5000'}" value="${f.deposit_value===0||f.deposit_value?f.deposit_value:''}" oninput="onFormNum('deposit_value',this.value)"><span class="input-suffix-unit">${dm==='percent'?'%':'บาท'}</span></div>`, dm==='percent'?'มัดจำกี่ % ของยอดรวม (≤100)':'มัดจำเป็นจำนวนเงินคงที่', true);
    typeFields = `
      ${fieldBlock('วิธีระบุมัดจำ', searchDropdown('deposit_method', dm, methodOpts, '— เลือก —', 'onDepMethodPick'), 'inherit ได้ที่ PO/SO (D08)', true)}
      ${valField}
      ${fieldBlock('ชำระส่วนที่เหลือ (remaining)', searchDropdown('remaining_timing', f.remaining_timing||'after_receipt', remainOpts, '— เลือก —', 'onRemainPick'), 'ส่วนที่เหลือชำระเมื่อใด', true)}
      ${fieldBlock('ส่วนที่เหลือ ครบกำหนด (วัน)', numInput('net_days', f.net_days, 'เช่น 30'), 'ยอดที่เหลือชำระภายในกี่วัน', true)}
      ${triggerField}`;
  } else if(type==='partial_delivery'){
    typeFields = `${fieldBlock('เครดิตต่อรอบ (วัน, optional)', numInput('net_days', f.net_days, 'เช่น 0 = จ่ายทันทีแต่ละรอบ'), 'ระยะเครดิตของแต่ละรอบที่รับ (เว้นว่าง = จ่ายทันที)', false)}
      ${triggerField}`;
  } else if(type==='direct_payment'){
    const expOpts=Object.entries(EXPENSE_CAT).map(([kk,v])=>({value:kk,label:v}));
    typeFields = `
      ${fieldBlock('หมวดหมู่ค่าใช้จ่าย', searchDropdown('expense_category', f.expense_category||'utility', expOpts, '— เลือก —', 'onExpensePick'), 'ประเภทค่าใช้จ่ายสำหรับลงบัญชี', true)}
      <div class="note is-warn"><i data-lucide="alert-triangle" ></i><span>ประเภทนี้<strong>ไม่ผ่าน PR/PO/QUO→SO</strong> — บันทึกตรงเข้า GL ที่ AP/AR Invoice · ไม่มี Warehouse Trigger · ไม่มี 3-Way Match</span></div>`;
  } else if(type==='installment'){
    const dueOpts=Object.entries(DUE_TYPE).map(([kk,v])=>({value:kk,label:v}));
    const rows=(f.installments||[]).map((ins,i)=>`
      <div class="inst-card">
        <div class="inst-card-head">
          <span class="inst-no">งวด ${i+1}</span>
          <button class="icon-btn" onclick="removeInst(${i})" ${(f.installments||[]).length<=2?'disabled style=\"opacity:.3;cursor:not-allowed;\"':''}><i data-lucide="trash-2" ></i></button>
        </div>
        <input class="input inst-desc" type="text" value="${esc(ins.desc||'')}" oninput="onInstDesc(${i},this.value)" placeholder="รายละเอียดงวด (เช่น มัดจำ / งวดที่ ${i+1})">
        <div class="inst-grid2">
          <div class="inst-input"><input class="input" type="number" min="0" max="100" value="${ins.pct}" oninput="onInstPct(${i},this.value)" placeholder="%"><span class="inst-unit">%</span></div>
          <div>${searchDropdown('instdue__'+i, ins.due_type||'on_doc', dueOpts, 'ครบกำหนด', 'onInstDuePick')}</div>
        </div>
      </div>`).join('');
    const total=(f.installments||[]).reduce((s,i)=>s+(+i.pct||0),0);
    typeFields = `
      <div class="field" id="fld-inst">
        <label class="field-label">ตารางงวดการชำระเงิน (Schedule) <span class="req">*</span></label>
        ${rows}
        <button class="btn btn-ghost btn-sm" onclick="addInst()" style="margin-top:4px;"><i data-lucide="plus" ></i><span>เพิ่มงวด</span></button>
        <div class="inst-total ${total===100?'is-ok':'is-warn'}">รวม ${total}% ${total===100?'✓':'(ต้องเป็น 100%)'}</div>
        <div class="field-error">สัดส่วนงวดต้องรวมเป็น 100%</div>
      </div>
      ${triggerField}`;
  }

  // use_in checkboxes — direct_payment disable PR/PO/QUOT/SO
  const useIn=f.use_in||[]; const dpDisabled=type==='direct_payment';
  // group เอกสารตามฝั่ง (ซื้อ/ขาย)
  const groups={};
  Object.entries(USE_IN_DOCS).forEach(([kk,v])=>{ (groups[v.group]=groups[v.group]||[]).push([kk,v]); });
  const useInChecks=Object.entries(groups).map(([gname,items])=>{
    const rows=items.map(([kk,v])=>{
      const dis=dpDisabled&&DP_DISABLED_DOCS.includes(kk);
      const on=useIn.includes(kk)&&!dis;
      return `<label class="chk-row${dis?' is-disabled':''}${on?' is-on':''}" ${dis?'':`onclick="toggleUseIn('${kk}')"`}>
        <span class="chk-box${on?' is-on':''}">${on?'<i data-lucide="check" ></i>':''}</span>
        <span class="chk-text"><span class="chk-name">${esc(v.label)}</span><span class="chk-desc">${esc(v.sub)}</span></span>
        ${dis?'<span class="chk-na">ไม่รองรับ</span>':''}
      </label>`;
    }).join('');
    return `<div class="chk-group"><div class="chk-group-title">${esc(gname)}</div><div class="chk-list">${rows}</div></div>`;
  }).join('');

  return `
  <div class="drawer-header">
    <div class="drawer-avatar">${isEdit?`<i data-lucide="${k.icon}" ></i>`:'<i data-lucide="plus" ></i>'}</div>
    <div style="flex:1; min-width:0;">
      <h2 class="drawer-title">${isEdit?'แก้ไขเงื่อนไขชำระเงิน':'เพิ่มเงื่อนไขชำระเงิน'}</h2>
      <div class="drawer-subtitle">${isEdit?`<span class="acct-code">${esc(t.code)}</span>`:'กำหนดเงื่อนไขการชำระเงินใหม่ (ใช้ได้ทั้งซื้อ-ขาย)'}</div>
    </div>
    <div class="drawer-header-actions"><button class="icon-btn" onclick="closeDrawer()"><i data-lucide="x" ></i></button></div>
  </div>
  <div class="drawer-body">
    <div class="drawer-section">
      <div class="drawer-section-title">ข้อมูลทั่วไป</div>
      ${fieldBlock('รหัส (Code)', `<input class="input field-input" name="code" type="text" placeholder="เช่น NET30" value="${esc(f.code||'')}" oninput="onFormInput('code',this.value.toUpperCase())">`, 'ตัวพิมพ์ใหญ่ ไม่ซ้ำ', true)}
      ${fieldBlock('ชื่อเงื่อนไข (TH)', `<input class="input field-input" name="name" type="text" placeholder="เช่น เครดิต 30 วัน" value="${esc(f.name||'')}" oninput="onFormInput('name',this.value)">`, '', true)}
      ${fieldBlock('ชื่อเงื่อนไข (EN)', `<input class="input field-input" name="name_en" type="text" placeholder="e.g. Net 30" value="${esc(f.name_en||'')}" oninput="onFormInput('name_en',this.value)">`, '', false)}
      <div class="field" id="fld-type">
        <label class="field-label">ประเภทเงื่อนไข <span class="req">*</span></label>
        ${searchDropdown('type', type, typeOpts, '— เลือกประเภท —', 'onTypeChange')}
      </div>
    </div>
    <div class="drawer-section">
      <div class="drawer-section-title">การตั้งค่าเฉพาะประเภท</div>
      ${typeFields}
      ${k.noTrigger?'':fieldBlock('นับวันครบกำหนดจาก (Due basis)', searchDropdown('due_basis', f.due_basis||'invoice_date', basisOpts, '— เลือก —', 'onFormPick'), 'จุดเริ่มนับวันครบกำหนด', true)}
    </div>
    <div class="drawer-section">
      <div class="drawer-section-title">การใช้งานในเอกสาร <span class="chk-count">${useIn.length} เลือก</span></div>
      <div class="chk-groups" id="fld-usein">${useInChecks}</div>
      <div class="field-error" style="margin-top:6px;">เลือกอย่างน้อย 1 เอกสาร</div>
    </div>
    <div class="drawer-section">
      <div class="drawer-section-title">ตั้งค่าทั่วไป</div>
      <div class="field" style="margin-bottom:12px;">
        <label>สถานะ</label>
        <select class="select" onchange="onFormInput('status', this.value)">
          <option value="active" ${(f.status||'active')==='active'?'selected':''}>ใช้งาน</option>
          <option value="inactive" ${f.status==='inactive'?'selected':''}>ไม่ใช้งาน</option>
          <option value="draft" ${f.status==='draft'?'selected':''}>ร่าง</option>
        </select>
      </div>
      <label class="chk-row${f.is_default?' is-on':''}" onclick="toggleDefault()">
        <span class="chk-box${f.is_default?' is-on':''}">${f.is_default?'<i data-lucide="check" ></i>':''}</span>
        <span class="chk-text"><span class="chk-name">ตั้งเป็นค่า Default</span><span class="chk-desc">ระบบเลือกอัตโนมัติในเอกสารใหม่ · มีได้ 1 รายการต่อประเภท</span></span>
      </label>
    </div>
  </div>
  <div class="drawer-footer">
    <button class="btn btn-ghost" onclick="closeDrawer()">ยกเลิก</button>
    <div class="footer-spacer"></div>
    <button class="btn btn-primary" onclick="submitTerm()"><i data-lucide="check" ></i><span>${isEdit?'บันทึกการแก้ไข':'บันทึกและสร้าง'}</span></button>
  </div>`;
}

function numInput(name, val, ph){
  return `<input class="input field-input" name="${name}" type="number" min="0" placeholder="${ph}" value="${val===0||val?val:''}" oninput="onFormNum('${name}',this.value)">`;
}

function renderView(t){
  if(!t) return ''; const k=PT_TYPES[t.type];
  let detail=[];
  if(t.type==='full_prepay') detail=[['การชำระ','เต็มจำนวน 100% ก่อนส่ง']];
  else if(t.type==='full_postpay') detail=[['ชำระภายใน', t.net_days?`${t.net_days} วันหลังรับ`:'ทันทีหลังรับ']];
  else if(t.type==='credit') detail=[['ครบกำหนด', t.net_days===0?'จ่ายทันที':`${t.net_days} วัน`]];
  else if(t.type==='deposit'){ const v=t.deposit_method==='fixed'?`${(t.deposit_value||0).toLocaleString()} บาท`:(t.deposit_method==='manual'?'กำหนดเองตอนทำเอกสาร':`${t.deposit_value||0}%`); detail=[['มัดจำ', v],['วิธีระบุมัดจำ', DEPOSIT_METHOD[t.deposit_method]||'—'],['ชำระส่วนที่เหลือ', REMAINING_TIMING[t.remaining_timing]||'—'],['ส่วนที่เหลือครบ', `${t.net_days||0} วัน`]]; }
  else if(t.type==='installment') detail=(t.installments||[]).map((i,idx)=>[`งวด ${idx+1}${i.desc?' — '+i.desc:''}`, `${i.pct}% · ${(DUE_TYPE[i.due_type]||'').replace('N วัน','+'+(i.days||0)+' วัน')}`]);
  else if(t.type==='partial_delivery') detail=[['การชำระ','ตามจำนวนที่รับจริงแต่ละรอบ'],['เครดิตต่อรอบ', t.net_days?`${t.net_days} วัน`:'จ่ายทันที']];
  else if(t.type==='direct_payment') detail=[['การบันทึก','ตรงเข้า GL (ไม่ผ่าน PR/PO/SO)'],['หมวดค่าใช้จ่าย', EXPENSE_CAT[t.expense_category]||'—']];
  if(t.discount_pct&&t.discount_days) detail.push(['ส่วนลดจ่ายเร็ว', `${t.discount_pct}% ภายใน ${t.discount_days} วัน`]);
  return `
  <div class="drawer-header">
    <div class="drawer-avatar"><i data-lucide="${k.icon}" ></i></div>
    <div style="flex:1; min-width:0;">
      <h2 class="drawer-title">${esc(t.name)}</h2>
      <div class="drawer-subtitle"><span class="acct-code">${esc(t.code)}</span><span>·</span><span class="pill ${k.pill}">${k.label.split(' (')[0]}</span></div>
    </div>
    <div class="drawer-header-actions">
      <button class="btn btn-sm btn-secondary" onclick="openDrawer('edit','${t.id}')"><i data-lucide="pencil" ></i><span>แก้ไข</span></button>
      <div style="position:relative;">
        <button class="btn btn-sm btn-secondary" onclick="toggleStatusMenu(event)"><i data-lucide="refresh-ccw"></i><span>เปลี่ยนสถานะ</span><i data-lucide="chevron-down"></i></button>
        <div class="menu status-menu" id="statusMenu">
          ${Object.keys(STATUS_META).map(st=>`<button class="menu-item" ${t.status===st?'disabled':''} onclick="setStatusFromMenu('${t.id}','${st}')"><i data-lucide="${STATUS_META[st].icon}"></i>${STATUS_META[st].label}</button>`).join('')}
        </div>
      </div>
      <span class="drawer-header-divider"></span>
      <button class="icon-btn" onclick="closeDrawer()"><i data-lucide="x" ></i></button>
    </div>
  </div>
  <div class="drawer-body">
    <div class="bm-card">
      <div class="bm-card-title">สรุปเงื่อนไข</div>
      <div class="bm-summary">${esc(termSummary(t))}</div>
    </div>
    <div class="drawer-section">
      <div class="drawer-section-title">รายละเอียดการคำนวณ</div>
      ${detail.map(d=>`<div class="dv-row"><span class="dv-lbl">${esc(d[0])}</span><span class="dv-val">${esc(d[1])}</span></div>`).join('')}
      <div class="dv-row"><span class="dv-lbl">นับจาก</span><span class="dv-val">${esc(DUE_BASIS[t.due_basis]||'—')}</span></div>
      ${k.noTrigger?'':`<div class="dv-row"><span class="dv-lbl">WH/GRN/Ship trigger</span><span class="dv-val">${esc(triggerLabel(t))}</span></div>`}
    </div>
    <div class="drawer-section">
      <div class="drawer-section-title">การใช้งานในเอกสาร</div>
      <div class="use-tags">${(t.use_in||[]).map(d=>`<span class="use-tag">${esc((USE_IN_DOCS[d]||{}).label||d)}</span>`).join('')||'<span style="color:var(--c-mute-3);">—</span>'}</div>
      ${t.is_default?'<div class="dv-row" style="margin-top:10px;"><span class="dv-lbl">ค่า Default</span><span class="dv-val" style="color:var(--c-primary);">✓ เลือกอัตโนมัติในเอกสารใหม่</span></div>':''}
    </div>
    ${t.name_en?`<div class="drawer-section"><div class="dv-row"><span class="dv-lbl">ชื่อ (EN)</span><span class="dv-val">${esc(t.name_en)}</span></div></div>`:''}
  </div>
  <div class="drawer-footer"><div class="drawer-footer-meta">ใช้ใน PR / PO / SO / Invoice</div><div class="footer-spacer"></div><button class="btn btn-secondary" onclick="closeDrawer()">ปิด</button></div>`;
}

function fieldBlock(label, inner, help, req){
  const mm = inner.match(/name="([^"]+)"/) || inner.match(/data-sdd="([^"]+)"/);
  const id = 'fld-' + (mm ? mm[1] : 'x');
  return `<div class="field" id="${id}">
    <label class="field-label">${label}${req?' <span class="req">*</span>':''}</label>
    ${inner}
    ${help?``:''}
    <div class="field-error">กรุณากรอก/เลือกข้อมูลนี้</div>
  </div>`;
}

// ============================================ MODAL
function renderModal(){
  const m=state.modal; if(!m.open) return '';
  if(m.type==='bulk-delete'){
    const ids=Object.keys(state.bulkSel); const delN=ids.filter(id=>{const t=gById(id);return t&&!(t.used>0);}).length; const skipN=ids.length-delN;
    return `<div class="modal-backdrop" id="modalBackdrop" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header"><div class="modal-header-icon is-danger"><i data-lucide="trash-2"></i></div>
        <div style="flex:1;"><h3 class="modal-title">ลบเงื่อนไขชำระเงิน</h3><p class="modal-subtitle">เลือกไว้ ${ids.length} รายการ${skipN?` · ${skipN} รายการถูกใช้งานอยู่จะถูกข้าม`:''}</p></div>
        <button class="icon-btn" onclick="closeModal()"><i data-lucide="x"></i></button></div>
      <div class="modal-body"><p style="font-size:13px;">ยืนยันการลบออกจากทะเบียน — รายการที่ถูกใช้ในเอกสารแล้วจะไม่ถูกลบ</p></div>
      <div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">ยกเลิก</button>
        <button class="btn btn-danger" ${delN?'':'disabled'} onclick="bulkDoDelete()"><i data-lucide="trash-2"></i><span>ลบ ${delN} รายการ</span></button></div>
    </div></div>`;
  }
  if(m.type==='confirm-archive'){ const t=gById(m.data); return wrapModal(renderConfirmArchive(
    'เลิกใช้งานเงื่อนไขชำระเงิน', t?`เงื่อนไข "${esc(t.name)}" (${esc(t.code)})`:'',
    'เงื่อนไขนี้จะถูกปิดการใช้งาน — ไม่สามารถเลือกใน PO/Invoice/ผู้ขาย/ลูกค้า ใหม่ได้ แต่เอกสารเดิมที่ใช้ไปแล้วยังคงอยู่ (เปิดใช้ใหม่ได้ภายหลัง)',
    `doArchive('${m.data}')`)); }
  return '';
}
function wrapModal(inner){ return `<div class="modal-backdrop" id="modalBackdrop" onclick="closeModal()"><div class="modal" onclick="event.stopPropagation()">${inner}</div></div>`; }
function renderConfirmArchive(title, subject, desc, confirmFn){
  return `
  <div class="modal-header"><div class="modal-header-icon" style="background:#FEE2E2; color:var(--c-danger);"><i data-lucide="ban" ></i></div>
    <div style="flex:1;"><h3 class="modal-title">${title}</h3><p class="modal-subtitle">${subject}</p></div>
    <button class="icon-btn" onclick="closeModal()" style="margin:-4px -6px 0 0;"><i data-lucide="x" ></i></button></div>
  <div class="modal-body"><div class="note is-warn"><i data-lucide="alert-triangle" ></i><span>${desc}</span></div></div>
  <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>
    <button class="btn btn-danger" onclick="${confirmFn}"><i data-lucide="ban" ></i><span>ยืนยันเลิกใช้งาน</span></button></div>`;
}
function openModal(type,data){ state.modal={open:true,type,data}; render(); }
function closeModal(){ state.modal={open:false,type:null,data:null}; render(); }

/* [ถอดออก 2026-08-09] setImportMode — โหมด replace ถูกตัด (นำเข้าห้ามล้างทะเบียน) */



// ============================================ TOAST
function showToast(message, variant='info', durationMs=2800){
  let host=document.getElementById('toastHost'); if(!host){ host=document.createElement('div'); host.id='toastHost'; host.className='toast-host'; document.body.appendChild(host); }
  const el=document.createElement('div'); el.className='toast is-'+variant;
  const icon={success:'check-circle-2',error:'x-circle',warning:'alert-triangle',info:'info'}[variant]||'info';
  el.innerHTML='<i data-lucide="'+icon+'" ></i><span>'+esc(message)+'</span>';
  host.appendChild(el); renderIcons();
  setTimeout(()=>{ el.classList.add('is-leaving'); setTimeout(()=>el.remove(),200); }, durationMs);
}

// ============================================ RENDER ROOT
function _keepScroll(fn){    // Iron Rule #29 — Render Preservation: ห้ามเด้งขึ้นบนเมื่อ re-render
  const c=document.querySelector('.content'); const st=c?c.scrollTop:0;
  const ts=document.querySelector('.tbl-scroll'); const tst=ts?ts.scrollTop:0;
  const dwB=document.querySelector('aside.drawer .drawer-body, aside.drawer .dw-body'); const dst=dwB?dwB.scrollTop:0;
  fn();
  const c2=document.querySelector('.content'); if(c2) c2.scrollTop=st;
  const ts2=document.querySelector('.tbl-scroll'); if(ts2) ts2.scrollTop=tst;
  const dwB2=document.querySelector('aside.drawer .drawer-body, aside.drawer .dw-body'); if(dwB2) dwB2.scrollTop=dst;
}
function renderPageOnly(){ _keepScroll(function(){ document.getElementById('page-content').innerHTML=renderPage(); renderIcons(); }); }
function render(){ _keepScroll(_renderAll); }
function _renderAll(){
  document.getElementById('page-content').innerHTML=renderPage();
  let dl=document.getElementById('drawerLayer'); if(!dl){ dl=document.createElement('div'); dl.id='drawerLayer'; document.body.appendChild(dl); }
  dl.innerHTML=renderDrawer();
  let ml=document.getElementById('modalLayer'); if(!ml){ ml=document.createElement('div'); ml.id='modalLayer'; document.body.appendChild(ml); }
  ml.innerHTML=renderModal();
  renderIcons();
  // slide-in: เพิ่ม is-open ใน next frame เพื่อให้ browser เห็น transition จาก translateX(100%)
  if(state.drawer.open){
    const bd=dl.querySelector('.drawer-backdrop'), dw=dl.querySelector('.drawer');
    if(dw){
      if(state._drawerAnimated){ bd&&bd.classList.add('is-open'); dw&&dw.classList.add('is-open'); }
      else { requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ bd&&bd.classList.add('is-open'); dw&&dw.classList.add('is-open'); state._drawerAnimated=true; }); }); }
    }
  } else { state._drawerAnimated=false; }
  if(state.modal.open){
    const mb=ml.querySelector('.modal-backdrop');
    if(mb && !mb.classList.contains('is-open')){ requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ mb&&mb.classList.add('is-open'); }); }); }
  }
}
window.addEventListener('keydown',(e)=>{ if(e.key==='Escape'){
  if(state.sdd.open){ const el=document.querySelector(`.sdd[data-sdd="${state.sdd.open}"]`); if(el) el.classList.remove('is-open'); state.sdd={open:null,search:''}; }
  else if(state.modal.open) closeModal();
  else if(state.drawer.open) closeDrawer();
} });

// boot
let domReady=false, lucideReady=false;
function bootIfReady(){ if(domReady&&lucideReady){ render(); renderIcons(); } }
window.addEventListener('lucide:ready',()=>{ lucideReady=true; bootIfReady(); });
if(document.readyState!=='loading'){ domReady=true; } else { document.addEventListener('DOMContentLoaded',()=>{ domReady=true; bootIfReady(); }); }
domReady=true; bootIfReady();
</script>
<div id="overlay-root"></div>
