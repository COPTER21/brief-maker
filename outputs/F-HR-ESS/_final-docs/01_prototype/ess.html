      + '<div class="drawer-section"><div class="drawer-section-title">ข้อมูลทั่วไป</div><div class="def-grid">'
      +   '<span class="dl">รหัสพนักงาน</span><span class="dv">'+EMP.id+'</span>'
      +   '<span class="dl">แผนก / สาขา</span><span class="dv">'+EMP.dept+' · '+EMP.branch+'</span>'
      +   '<span class="dl">วันเริ่มงาน</span><span class="dv">'+EMP.startDate+'</span>'
      +   '<span class="dl">อีเมล</span><span class="dv">'+EMP.email+'</span>'
      +   '<span class="dl">โทรศัพท์</span><span class="dv">'+EMP.phone+'</span>'
      + '</div></div>'
      + '<div class="drawer-section"><div class="drawer-section-title">ข้อมูลจำกัดสิทธิ์ (RESTRICTED · ปิดบังตามตนเอง)</div><div class="def-grid">'
      +   '<span class="dl">เลขบัตร ปชช.</span><span class="dv masked">'+(rv?EMP.nationalIdFull:EMP.nationalId)+' <button class="reveal-btn" onclick="state.drawer.reveal=!state.drawer.reveal;render()">'+(rv?'ซ่อน':'แสดง')+'</button></span>'
      +   '<span class="dl">บัญชีธนาคาร</span><span class="dv masked">'+EMP.bank+' '+(rv?EMP.bankNoFull:EMP.bankNo)+'</span>'
      + '</div></div>'
      + '<div class="drawer-section"><div class="drawer-section-title">ประวัติการเข้าถึงข้อมูลของฉัน (append-only)</div>'
      +   DATA.accessAudit.map(function(a){ return '<div class="audit-row"><span class="a-time">'+a.time+'</span><span>'+a.what+'</span></div>'; }).join('')
      +   '<p style="font-size:11.5px;color:var(--c-mute-3);margin:10px 0 0">บันทึกการเข้าถึงถูกเพิ่มอัตโนมัติ (แก้/ลบไม่ได้)</p>'
      + '</div></div>';
    /* footer: ปิด + ขอแก้ข้อมูล (deep-link, opens action picker OVER the drawer → DSP-01) */
    return head + body
      + '<div class="dw-footer"><span class="ro-strip"><i data-lucide="lock" class="w-3.5 h-3.5"></i>อ่านอย่างเดียว · แก้ไขไม่ได้ในพอร์ทัล</span>'
      + '<div class="dw-footer-right"><button class="btn btn-secondary" onclick="closeDrawer()">ปิด</button>'
      + '<button class="btn btn-primary" onclick="openModal(\'actionPicker\')"><i data-lucide="external-link" class="w-4 h-4"></i><span>ยื่นคำขอ</span></button></div></div>';
  }
  if(m==='leave'){
    var l = DATA.leaveHistory.find(function(x){return x.id===id;}) || DATA.leaveHistory[0];
    head = drawerHead('รายละเอียดการลา '+CH_RO, l.type, l.id);
    body = '<div class="drawer-body"><div class="def-grid">'
      + '<span class="dl">ประเภท</span><span class="dv">'+l.type+'</span>'
      + '<span class="dl">ช่วงวันลา</span><span class="dv">'+l.range+'</span>'
      + '<span class="dl">จำนวน</span><span class="dv">'+l.days+' วัน</span>'
      + '<span class="dl">สถานะ</span><span class="dv">'+pill(l.status,l.variant)+'</span></div>'
      + '<p style="font-size:12px;color:var(--c-mute-2);margin-top:14px">อ่านจากระบบการลา (ต้นทาง) — หากต้องการยื่นลาใหม่ ใช้ปุ่ม “ยื่นลา” เพื่อไปยังหน้าการลา</p></div>';
    return head + body + drawerFoot();
  }
  if(m==='expense'){
    var e = DATA.expenses.find(function(x){return x.id===id;}) || DATA.expenses[0];
    head = drawerHead('รายละเอียดใบเบิก '+CH_RO, e.title, e.id);
    body = '<div class="drawer-body"><div class="def-grid">'
      + '<span class="dl">เรื่อง</span><span class="dv">'+e.title+'</span>'
      + '<span class="dl">วันที่</span><span class="dv">'+e.date+'</span>'
      + '<span class="dl">จำนวนเงิน</span><span class="dv" style="color:var(--c-navy);font-weight:700">'+baht(e.amount)+'</span>'
      + '<span class="dl">สถานะ</span><span class="dv">'+pill(e.status,e.variant)+'</span></div>'
      + '<p style="font-size:12px;color:var(--c-mute-2);margin-top:14px">อ่านจากระบบเบิกค่าใช้จ่าย (ต้นทาง) — ยื่นเบิกใหม่ที่หน้าเบิกค่าใช้จ่าย</p></div>';
    return head + body + drawerFoot();
  }
  if(m==='cert'){
    var c = DATA.certs.find(function(x){return x.id===id;}) || DATA.certs[0];
    head = drawerHead('หนังสือรับรอง '+CH_RO, c.title, c.id);
    body = '<div class="drawer-body"><div class="def-grid">'
      + '<span class="dl">เอกสาร</span><span class="dv">'+c.title+'</span>'
      + '<span class="dl">วันที่ออก</span><span class="dv">'+c.issued+'</span>'
      + '<span class="dl">ผู้ออก</span><span class="dv">'+c.by+'</span>'
      + '<span class="dl">สถานะ</span><span class="dv">'+pill(c.status,'success')+'</span></div>'
      + '<p style="font-size:12px;color:var(--c-mute-2);margin-top:14px">ไฟล์ PDF ออกจากฝ่ายบุคคล (ต้นทาง) — ESS แสดงผลอ่านอย่างเดียว</p></div>';
    return head + body + drawerFoot();
  }
  if(m==='training'){
    var t = DATA.training.find(function(x){return x.id===id;}) || DATA.training[0];
    head = drawerHead('ประวัติอบรม '+CH_RO, t.course, t.id);
    body = '<div class="drawer-body"><div class="def-grid">'
      + '<span class="dl">หลักสูตร</span><span class="dv">'+t.course+'</span>'
      + '<span class="dl">วันที่</span><span class="dv">'+t.date+'</span>'
      + '<span class="dl">ชั่วโมง</span><span class="dv">'+t.hours+' ชม.</span>'
      + '<span class="dl">ใบรับรอง</span><span class="dv">'+t.cert+'</span>'
      + '<span class="dl">สถานะ</span><span class="dv">'+pill(t.status,t.variant)+'</span></div></div>';
    return head + body + drawerFoot();
  }
  if(m==='notif'){
    var n = DATA.notifications.find(function(x){return x.id===id;}) || DATA.notifications[0];
    head = drawerHead('แจ้งเตือน '+CH_RO, n.title, n.time);
    body = '<div class="drawer-body"><p style="font-size:13.5px;color:var(--c-ink);line-height:1.7">'+n.desc+'</p></div>';
    return head + body + drawerFoot();
  }
  return drawerHead('รายละเอียด', 'ไม่พบข้อมูล', '') + '<div class="drawer-body"></div>' + drawerFoot();
}

/* ============================================================
   MODALS — action-picker (LINK ONLY) + access-denied (403)
   ============================================================ */
function renderModal(){
  if(state.modal.type==='actionPicker'){
    return ''
      + '<div class="modal-header"><div class="modal-header-icon"><i data-lucide="send" class="w-4 h-4"></i></div>'
      + '<div><h3 class="modal-title">ยื่นคำขอ</h3><p class="modal-subtitle">เลือกประเภทคำขอ — ระบบจะพาไปยังหน้าฟีเจอร์เจ้าของเพื่อกรอกและส่ง</p></div></div>'
      + '<div class="modal-body"><div class="ap-list">'
      +   apRow('calendar-plus','ขอลา','ไปที่หน้า “การลา”','leave')
      +   apRow('clock','ขอทำงานล่วงเวลา (OT)','ไปที่หน้า “ขอ OT”','ot')
      +   apRow('receipt','ขอเบิกค่าใช้จ่าย','ไปที่หน้า “เบิกค่าใช้จ่าย”','expense')
      +   apRow('user-pen','ขอแก้ข้อมูลส่วนตัว','ไปที่หน้าขออนุมัติแก้ข้อมูล','profile')
      +   apRow('award','ขอหนังสือรับรอง','ไปที่หน้า “หนังสือรับรอง”','cert')
      + '</div><div class="modal-note"><i data-lucide="info"></i><span>ESS ไม่รับหรือบันทึกคำขอเอง — ทุกการยื่นทำที่หน้าฟีเจอร์เจ้าของ (deep-link) ตามมติ OQ-HR-04</span></div></div>'
      + '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">ปิด</button></div>';
  }
  if(state.modal.type==='accessDenied'){
    /* CSQ: ess.access_denied → ท่อ SecC ตาม CSQ_BRIEF_F059 (รอเคาะ OQ-ESS-01) */
    return ''
      + '<div class="modal-header"><div class="modal-header-icon is-danger"><i data-lucide="shield-x" class="w-4 h-4"></i></div>'
      + '<div><h3 class="modal-title">เข้าถึงถูกปฏิเสธ</h3><p class="modal-subtitle">พนักงานเห็นได้เฉพาะข้อมูลของตนเอง</p></div></div>'
      + '<div class="modal-body"><div class="deny-code">403</div>'
      + '<p style="text-align:center;color:var(--c-mute);margin:10px 0 0">คุณ ('+EMP.name+') ไม่มีสิทธิ์เข้าถึงข้อมูลของพนักงานคนอื่น ระบบปิดบังและไม่แสดงข้อมูลนอกขอบเขตของคุณ</p></div>'
      + '<div class="modal-footer"><button class="btn btn-primary" onclick="closeModal()">เข้าใจแล้ว</button></div>';
  }
  return '';
}
function apRow(icon,title,sub,key){
  return '<button class="ap-row" onclick="deepLink(\''+key+'\')">'
    + '<span class="ap-ic"><i data-lucide="'+icon+'"></i></span>'
    + '<span class="ap-main"><span class="ap-title">'+title+'</span><span class="ap-sub">'+sub+'</span></span>'
    + '<span class="ap-go"><i data-lucide="arrow-up-right"></i></span></button>';
}

/* deep-link OUT to owner feature — NO form/submit here. navigate-out stub. */
function deepLink(key){
  var t = LINKS[key]; if(!t) return;
  if(state.modal.open) closeModal();
  if(state.drawer.open) closeDrawer();
  /* prod: navigation จริงไปหน้าเจ้าของ · route=t.route ([ASSUMED contract] · OQ-ESS-02) — ไม่โชว์ route/contract ใน toast */
  showToast('กำลังนำทางไปหน้า “'+t.label+'”', 'info', 3200);
}

/* stopPropagation guards for overlay/menu triggers (Rule #68) */
document.addEventListener('click', function(e){
  var t = e.target.closest && e.target.closest('.ap-row, .qcard');
  if(t){ e.stopPropagation(); }
}, false);

render();
</script>
