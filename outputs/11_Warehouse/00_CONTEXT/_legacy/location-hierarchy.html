<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Location Hierarchy · CUBE NATIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--c-navy:#0B1D3A;--c-navy-2:#14284A;--c-primary:#0B5CFF;--c-primary-hover:#0847CC;--c-teal:#00A88E;--c-teal-light:#5EEAD4;--c-ink:#0F172A;--c-mute:#475569;--c-mute-2:#64748B;--c-mute-3:#94A3B8;--c-line:#CBD5E1;--c-line-2:#E2E8F0;--c-line-3:#F1F5F9;--c-bg-off:#F6F8FB;--c-success:#10B981;--c-warning:#D97706;--c-danger:#DC2626;--sidebar-w:232px;--shell-h:52px;}
*{box-sizing:border-box;}html,body{margin:0;padding:0;}
body{font-family:'Noto Sans Thai','Inter',system-ui,sans-serif;background:var(--c-bg-off);color:#1E293B;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-width:1180px;}
a{text-decoration:none;color:inherit;}button{font-family:inherit;cursor:pointer;}[data-lucide]{flex-shrink:0;}
input[type="number"]::-webkit-inner-spin-button,input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}input[type="number"]{-moz-appearance:textfield;}
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);background:linear-gradient(180deg,#0B1D3A 0%,#14284A 50%,#0B1D3A 100%);color:#E2E8F0;z-index:20;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,0.06);}
.sb-brand{padding:18px;display:flex;align-items:center;gap:11px;border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;}
.sb-logo{width:34px;height:34px;background:linear-gradient(135deg,#0B5CFF,#00A88E);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;box-shadow:0 4px 12px rgba(11,92,255,0.3);}
.sb-name{font-weight:700;font-size:14px;color:#fff;letter-spacing:-0.01em;line-height:1.2;}.sb-sub{font-size:10px;color:#94A3B8;letter-spacing:0.06em;font-weight:600;text-transform:uppercase;margin-top:2px;}
.sb-nav{flex:1;padding:12px 8px;overflow-y:auto;}.sb-module{margin-bottom:4px;}
.sb-module-header{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:6px;background:transparent;border:0;color:#94A3B8;font-family:inherit;font-size:10.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;transition:all 120ms;text-align:left;}
.sb-module-header:hover{background:rgba(255,255,255,0.04);color:#CBD5E1;}.sb-module-header .mod-icon{flex-shrink:0;opacity:0.7;}.sb-module-header .mod-label{flex:1;}
.sb-module-header .mod-chevron{flex-shrink:0;transition:transform 200ms;opacity:0.7;}.sb-module[data-expanded="false"] .mod-chevron{transform:rotate(-90deg);}.sb-module[data-expanded="false"] .sb-features{display:none;}
.sb-features{padding:2px 0 6px 0;}
.sb-item{display:flex;align-items:center;gap:10px;padding:7px 12px 7px 14px;border-radius:6px;color:#CBD5E1;font-size:13px;font-weight:500;cursor:pointer;transition:all 120ms;margin-bottom:1px;position:relative;user-select:none;}
.sb-item:hover{background:rgba(255,255,255,0.05);color:#fff;}.sb-item.is-active{background:#0B5CFF;color:#fff;font-weight:600;}
.sb-item.is-active::before{content:'';position:absolute;left:-10px;top:7px;bottom:7px;width:3px;background:#fff;border-radius:0 2px 2px 0;}
.sb-item [data-lucide]{width:16px;height:16px;opacity:0.85;}.sb-item.is-active [data-lucide]{opacity:1;}
.sb-item.is-disabled{opacity:0.4;cursor:not-allowed;}.sb-item.is-disabled:hover{background:transparent;color:#CBD5E1;}
.sb-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:8px;font-size:11.5px;color:#94A3B8;}
.pulse-dot{width:7px;height:7px;background:var(--c-teal);border-radius:50%;box-shadow:0 0 0 3px rgba(0,168,142,0.20);animation:pulse 2s infinite;}@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.6;}}
.main{margin-left:var(--sidebar-w);min-height:100vh;background:var(--c-bg-off);}
.shell-bar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--c-line-2);height:var(--shell-h);display:flex;align-items:center;padding:0 22px;z-index:19;gap:12px;}
.breadcrumb{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--c-mute);}.breadcrumb a{cursor:pointer;transition:color 120ms;}.breadcrumb a:hover{color:var(--c-primary);}
.breadcrumb .sep{color:var(--c-mute-3);}.breadcrumb-current{color:var(--c-ink);font-weight:500;}
.icon-btn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:0;color:var(--c-mute);border-radius:7px;position:relative;transition:all 120ms;}
.icon-btn:hover{background:var(--c-line-3);color:var(--c-ink);}.icon-btn [data-lucide]{width:17px;height:17px;}
.notif-dot{position:absolute;top:7px;right:8px;width:7px;height:7px;background:var(--c-danger);border-radius:50%;border:2px solid #fff;}
.user-chip{display:flex;align-items:center;gap:9px;padding:5px 10px 5px 12px;border-radius:8px;cursor:pointer;transition:background 120ms;}.user-chip:hover{background:var(--c-line-3);}
.user-text{line-height:1.2;text-align:right;}.user-name{font-size:12.5px;font-weight:500;color:var(--c-ink);white-space:nowrap;}.user-role{font-size:10.5px;color:var(--c-mute-2);white-space:nowrap;margin-top:1px;}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--c-primary),var(--c-teal));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;}
.user-menu{position:absolute;top:calc(var(--shell-h) - 4px);right:22px;background:#fff;border:1px solid var(--c-line-2);border-radius:10px;box-shadow:0 12px 32px rgba(11,29,58,0.12);width:240px;z-index:30;padding:6px;display:none;}.user-menu.is-open{display:block;}
.user-menu-item{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:6px;font-size:13px;color:var(--c-ink);cursor:pointer;transition:background 120ms;}.user-menu-item:hover{background:var(--c-bg-off);}
.user-menu-item [data-lucide]{width:15px;height:15px;color:var(--c-mute-2);}.user-menu-item.is-danger{color:var(--c-danger);}.user-menu-item.is-danger [data-lucide]{color:var(--c-danger);}.user-menu-divider{height:1px;background:var(--c-line-2);margin:5px 0;}
.content{padding:22px;}
.ph{margin-bottom:18px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:14px;}.ph>div:first-child{flex:1 1 auto;min-width:280px;}
.ph-title-row{display:flex;align-items:baseline;gap:10px;margin-bottom:5px;}.ph-title{font-family:'Noto Sans Thai',sans-serif;font-size:22px;font-weight:700;color:var(--c-navy);margin:0;letter-spacing:-0.01em;}
.ph-count{font-size:12.5px;font-weight:600;color:var(--c-mute-2);background:var(--c-line-3);padding:3px 9px;border-radius:999px;}.ph-sub{font-size:13px;color:var(--c-mute);margin:0;}.ph-actions{display:flex;gap:8px;flex-shrink:0;}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:8px;font-size:13px;font-weight:500;border:1px solid transparent;background:transparent;white-space:nowrap;transition:all 120ms;user-select:none;}.btn [data-lucide]{width:15px;height:15px;}
.btn-primary{background:var(--c-primary);color:#fff;}.btn-primary:hover{background:var(--c-primary-hover);box-shadow:0 2px 8px rgba(11,92,255,0.30);}
.btn-secondary{background:#fff;border-color:var(--c-line);color:var(--c-ink);}.btn-secondary:hover{background:var(--c-line-3);border-color:var(--c-mute-2);}
.btn-ghost{color:var(--c-mute);}.btn-ghost:hover{background:var(--c-line-3);color:var(--c-ink);}.btn-danger{background:var(--c-danger);color:#fff;border-color:var(--c-danger);}.btn-danger:hover{background:#b91c1c;}
.btn-sm{height:30px;padding:0 11px;font-size:12px;}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px;}
.stat{background:#fff;border:1px solid var(--c-line-2);border-radius:10px;padding:14px 16px;transition:all 150ms;}.stat:hover{border-color:var(--c-line);box-shadow:0 2px 8px rgba(11,29,58,0.05);}
.stat-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--c-mute);}.stat-label [data-lucide]{width:13px;height:13px;color:var(--c-primary);}
.stat-value{font-family:'Noto Sans Thai',sans-serif;font-size:26px;font-weight:700;color:var(--c-navy);margin-top:6px;letter-spacing:-0.01em;}.stat-meta{font-size:11.5px;color:var(--c-mute-2);margin-top:5px;display:flex;align-items:center;gap:4px;}.stat-meta.is-up{color:var(--c-success);}.stat-meta.is-down{color:var(--c-danger);}.stat-meta [data-lucide]{width:12px;height:12px;}
.card{background:#fff;border:1px solid var(--c-line-2);border-radius:10px;overflow:hidden;}
/* filter bar (Pattern A canonical) */
.filter-bar{padding:14px 18px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--c-line-2);background:#fff;flex-wrap:wrap;}
.input-search{position:relative;flex:1;max-width:320px;}.input-search input{padding-left:36px;}
.input-search .lead-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--c-mute-2);pointer-events:none;}
/* drill path (hierarchy navigation) */
.drill-path{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:14px;font-size:13px;}
.drill-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;background:#fff;border:1px solid var(--c-line-2);color:var(--c-mute);cursor:pointer;transition:all 120ms;}
.drill-chip:hover{border-color:var(--c-line);color:var(--c-ink);}
.drill-chip.is-current{background:var(--c-navy);border-color:var(--c-navy);color:#fff;cursor:default;}
.drill-chip [data-lucide]{width:13px;height:13px;}
.drill-sep{color:var(--c-mute-3);display:inline-flex;}.drill-sep [data-lucide]{width:13px;height:13px;}
/* card head (section title within a card) */
.card-head{padding:13px 18px;border-bottom:1px solid var(--c-line-2);display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;}
.card-head-title{font-size:13.5px;font-weight:700;color:var(--c-navy);display:flex;align-items:center;gap:8px;}
.card-head-title [data-lucide]{width:16px;height:16px;color:var(--c-primary);}
.card-head-title .ch-count{font-size:11.5px;font-weight:600;color:var(--c-mute-2);background:var(--c-line-3);padding:2px 8px;border-radius:999px;}
.card+.card{margin-top:16px;}
.seg{display:inline-flex;background:var(--c-line-3);border-radius:8px;padding:3px;gap:2px;}
.seg-btn{height:28px;padding:0 12px;border:0;background:transparent;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--c-mute);cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:inherit;}
.seg-btn.is-active{background:#fff;color:var(--c-primary);box-shadow:0 1px 2px rgba(11,29,58,0.08);}
.seg-btn .ch-count{font-size:10.5px;background:var(--c-line-3);padding:0 6px;border-radius:999px;line-height:15px;}
.seg-btn.is-active .ch-count{background:rgba(11,92,255,0.10);color:var(--c-primary);}
/* drill-chip level label */
.dc-lvl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;opacity:0.65;}
.drill-chip.is-current .dc-lvl{opacity:0.8;}
/* view switcher */
.view-switch{margin-bottom:16px;}
/* hierarchy view — tree explorer */
.explorer{display:grid;grid-template-columns:316px 1fr;gap:16px;align-items:start;}
.pane{background:#fff;border:1px solid var(--c-line-2);border-radius:10px;overflow:hidden;}
.pane-head{padding:12px 16px;border-bottom:1px solid var(--c-line-2);display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--c-bg-off);}
.pane-head-title{font-size:12.5px;font-weight:700;color:var(--c-navy);display:flex;align-items:center;gap:7px;}
.pane-head-title [data-lucide]{width:15px;height:15px;color:var(--c-primary);}
.tree-body{padding:8px;max-height:calc(100vh - 260px);overflow:auto;}
.tn{user-select:none;}
.tn-row{display:flex;align-items:center;gap:5px;padding:6px 8px;border-radius:7px;cursor:pointer;transition:background 120ms;}
.tn-row:hover{background:var(--c-line-3);}
.tn-row.is-sel{background:rgba(11,92,255,0.10);}
.tn-row.is-sel .tn-label{color:var(--c-primary);font-weight:600;}.tn-row.is-sel .tn-icon{color:var(--c-primary);}
.tn-toggle{width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;color:var(--c-mute-2);flex-shrink:0;border-radius:4px;}
.tn-toggle:hover{background:var(--c-line-2);}.tn-toggle [data-lucide]{width:13px;height:13px;transition:transform 180ms;}
.tn.is-collapsed > .tn-row .tn-toggle [data-lucide]{transform:rotate(-90deg);}
.tn.is-collapsed > .tn-children{display:none;}
.tn-spacer{width:18px;flex-shrink:0;}
.tn-icon{width:15px;height:15px;color:var(--c-mute);flex-shrink:0;}
.tn-lvl{font-size:8.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;color:var(--c-mute-3);flex-shrink:0;}
.tn-row.is-sel .tn-lvl{color:var(--c-primary);opacity:0.7;}
.tn-label{flex:1;font-size:12.5px;color:var(--c-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tn-count{font-size:10px;font-weight:600;color:var(--c-mute-2);background:var(--c-line-3);padding:0 6px;border-radius:999px;line-height:16px;flex-shrink:0;}
.tn-children{padding-left:13px;}
.tree-root-row{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:7px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--c-ink);margin-bottom:4px;}
.tree-root-row:hover{background:var(--c-line-3);}.tree-root-row.is-sel{background:rgba(11,92,255,0.10);color:var(--c-primary);}
.tree-root-row [data-lucide]{width:15px;height:15px;color:var(--c-primary);}
/* hierarchy view — node summary panel (no list table) */
.dh-root{background:rgba(11,92,255,0.10);color:var(--c-primary);}
.ds-head{padding:18px 20px;display:flex;align-items:flex-start;gap:14px;border-bottom:1px solid var(--c-line-2);flex-wrap:wrap;}
.ds-icon{width:48px;height:48px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.ds-icon [data-lucide]{width:22px;height:22px;}
.ds-title{font-size:18px;font-weight:700;color:var(--c-navy);margin:0;letter-spacing:-0.01em;}
.ds-sub{font-size:12.5px;color:var(--c-mute);margin-top:5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.ds-actions{margin-left:auto;display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap;}
.ds-body{padding:18px 20px;}
.ds-section{margin-bottom:20px;}.ds-section:last-child{margin-bottom:0;}
.ds-section-title{font-size:11px;font-weight:700;color:var(--c-mute);letter-spacing:0.08em;text-transform:uppercase;margin:0 0 10px;}
.ds-fields{display:grid;grid-template-columns:170px 1fr;gap:9px 16px;font-size:13px;}
.ds-fields .lbl{color:var(--c-mute);}.ds-fields .val{color:var(--c-ink);font-weight:500;}
.ds-childstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;}
.ds-cstat{border:1px solid var(--c-line-2);border-radius:10px;padding:12px 14px;transition:all 120ms;}
.ds-cstat.is-link{cursor:pointer;}.ds-cstat.is-link:hover{border-color:var(--c-primary);box-shadow:0 2px 8px rgba(11,29,58,0.06);}
.ds-cstat-label{font-size:11.5px;color:var(--c-mute);display:flex;align-items:center;gap:6px;}.ds-cstat-label [data-lucide]{width:13px;height:13px;color:var(--c-primary);}
.ds-cstat-value{font-size:24px;font-weight:700;color:var(--c-navy);margin-top:5px;letter-spacing:-0.01em;}
.ds-cstat-hint{font-size:10.5px;color:var(--c-mute-3);margin-top:3px;display:flex;align-items:center;gap:3px;}.ds-cstat-hint [data-lucide]{width:11px;height:11px;}
.ds-hint{font-size:12.5px;color:var(--c-mute);background:var(--c-bg-off);border-radius:8px;padding:12px 14px;display:flex;gap:8px;align-items:center;}.ds-hint [data-lucide]{width:16px;height:16px;color:var(--c-primary);flex-shrink:0;}
.lvl-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;padding:2px 7px;border-radius:5px;}
.lvl-warehouse{background:#E0E7FF;color:#3730A3;}.lvl-zone{background:#DBEAFE;color:#1E40AF;}.lvl-area{background:#CCFBF1;color:#0F766E;}.lvl-rack{background:#FEF3C7;color:#92400E;}.lvl-location{background:#F1F5F9;color:#475569;}
.input,.select{height:36px;padding:0 12px;border:1px solid var(--c-line);border-radius:8px;font-size:13px;background:#fff;color:var(--c-ink);font-family:inherit;transition:all 120ms;width:100%;}
.input:focus,.select:focus{outline:none;border-color:var(--c-primary);box-shadow:0 0 0 3px rgba(11,92,255,0.10);}
.select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2364748B' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:32px;appearance:none;}
.table-scroll{overflow-x:auto;}.table{width:100%;border-collapse:collapse;font-size:13px;}.table thead{background:var(--c-bg-off);}
.table th{padding:11px 18px;text-align:left;font-weight:600;color:var(--c-mute);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--c-line-2);white-space:nowrap;}
.table th.is-sortable{cursor:pointer;user-select:none;}.table th.is-sortable:hover{color:var(--c-ink);background:var(--c-line-3);}.table th .sort-arrow{display:inline-block;margin-left:4px;opacity:0.4;}.table th.is-sorted .sort-arrow{opacity:1;color:var(--c-primary);}
.table td{padding:12px 18px;border-bottom:1px solid var(--c-line-2);color:var(--c-ink);vertical-align:middle;}.table tbody tr{transition:background 120ms;cursor:pointer;}.table tbody tr:hover{background:var(--c-bg-off);}.table tbody tr:last-child td{border-bottom:0;}
.num{text-align:right;font-variant-numeric:tabular-nums;}
.user-cell{display:flex;align-items:center;gap:10px;}.uc-avatar{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--c-primary),var(--c-teal));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0;}
.uc-avatar.is-wh{background:linear-gradient(135deg,#6366F1,#3730A3);}.uc-avatar.is-zone{background:linear-gradient(135deg,#3B82F6,#1E40AF);}.uc-avatar.is-area{background:linear-gradient(135deg,#14B8A6,#0F766E);}.uc-avatar.is-rack{background:linear-gradient(135deg,#F59E0B,#92400E);}
.uc-name{font-weight:600;color:var(--c-ink);font-size:13px;line-height:1.3;}.uc-email{font-size:12px;color:var(--c-mute-2);margin-top:1px;line-height:1.3;}
.loc-cell{line-height:1.3;}.loc-main{font-weight:600;color:var(--c-ink);font-size:12.5px;}.loc-sub{font-size:11.5px;color:var(--c-mute-2);}
.parent-badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:4px;}.parent-rack{background:#FEF3C7;color:#92400E;}.parent-area{background:#CCFBF1;color:#0F766E;}
.flags-cell{display:inline-flex;gap:4px;color:var(--c-mute-2);}.flags-cell [data-lucide]{width:14px;height:14px;}.flags-cell .on{color:var(--c-teal);}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;}.pill [data-lucide]{width:11px;height:11px;}

// ====== LOOKUP HELPERS ======
const wh=id=>WAREHOUSES.find(x=>x.id===id);
const zn=id=>ZONES.find(x=>x.id===id);
const ar=id=>AREAS.find(x=>x.id===id);
const rk=id=>RACKS.find(x=>x.id===id);
const lc=id=>LOCATIONS.find(x=>x.id===id);
function entOf(level,id){return {warehouse:wh,zone:zn,area:ar,rack:rk,location:lc}[level]?.(id);}
function zonesOf(whId){return ZONES.filter(z=>z.warehouse_id===whId);}
function areasOf(znId){return AREAS.filter(a=>a.zone_id===znId);}
function racksOf(arId){return RACKS.filter(r=>r.area_id===arId);}
function locsOfRack(rId){return LOCATIONS.filter(l=>l.parent_type==='rack'&&l.rack_id===rId);}
function locsOfAreaDirect(aId){return LOCATIONS.filter(l=>l.parent_type==='area'&&l.area_id===aId);}
function areaOfRack(rId){return ar(rk(rId)?.area_id);}
function zoneOfArea(aId){return zn(ar(aId)?.zone_id);}
function whOfZone(zId){return wh(zn(zId)?.warehouse_id);}
function childCount(level,id){
  if(level==='warehouse')return zonesOf(id).length;
  if(level==='zone')return areasOf(id).length;
  if(level==='area')return racksOf(id).length+locsOfAreaDirect(id).length;
  if(level==='rack')return locsOfRack(id).length;
  return 0;
}

// ====== LABELS / FMT ======
const LEVEL_LABEL={root:'ทุก Warehouse',warehouse:'Warehouse',zone:'Zone',area:'Area',rack:'Rack',location:'Location'};
const LEVEL_ICON={warehouse:'warehouse',zone:'layout-grid',area:'square-dashed',rack:'rows-3',location:'map-pin'};
const CHILD_LABEL={root:'Warehouse',warehouse:'Zone',zone:'Area',area:'Rack',rack:'Location'};
function typeLabel(t){return {PICK_FACE:'Pick Face',RESERVE:'Reserve',HOLD:'Hold',DAMAGED:'Damaged',BULK:'Bulk',STAGING:'Staging',PACK:'Pack',RECEIVING_DOCK:'Receiving Dock',TRANSIT:'Transit',VIRTUAL:'Virtual'}[t]||t;}
function statusLabel(s){return {active:'ใช้งาน',inactive:'ปิดใช้',blocked:'บล็อก',maintenance:'ซ่อมบำรุง',full:'เต็ม',frozen:'แช่แข็ง',decommissioned:'ปลดระวาง'}[s]||s;}
function rotLabel(r){return {fifo:'FIFO',lifo:'LIFO',fefo:'FEFO',manual:'Manual'}[r]||r;}
function initials(s){return (s||'?').replace(/[^A-Za-z0-9]/g,'').slice(0,2).toUpperCase();}
function fmtNum(n){return (n||0).toLocaleString('th-TH');}
function fmtDateTime(iso){if(!iso)return '—';return new Date(iso).toLocaleString('th-TH',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function yesNo(b){return b?'ใช่':'ไม่';}
const TYPES=['PICK_FACE','RESERVE','HOLD','DAMAGED','BULK','STAGING','PACK','RECEIVING_DOCK','TRANSIT','VIRTUAL'];
function locParentLabel(l){return l.parent_type==='rack'?(rk(l.rack_id)?.name||l.rack_id):(ar(l.area_id)?.name||l.area_id);}
function locFullPath(l){
  if(l.parent_type==='rack'){const r=rk(l.rack_id),a=ar(r?.area_id),z=zn(a?.zone_id),w=wh(z?.warehouse_id);return [w?.code,z?.name,a?.name,r?.name,l.code].filter(Boolean).join(' › ');}
  const a=ar(l.area_id),z=zn(a?.zone_id),w=wh(z?.warehouse_id);return [w?.code,z?.name,a?.name,l.code].filter(Boolean).join(' › ');
}

// ====== DRILL NAVIGATION ======
function setView(v){state.view=v;render();}
function selectNode(level,id){state.sel={level,id};state.page=1;state.pageD=1;state.areaTab='racks';state.filters={search:'',type:'all',status:'all'};render();}
function resetFilters(){state.filters={search:'',type:'all',status:'all'};state.page=1;state.pageD=1;render();}
function setAreaTab(t){state.areaTab=t;state.page=1;state.filters={search:'',type:'all',status:'all'};render();}
function setFilter(k,v){state.filters[k]=v;state.page=1;state.pageD=1;render();}
function goPage(n,which){const key=which==='D'?'pageD':'page';state[key]=n;render();}
function paginate(rows,page){const total=rows.length;const totalPages=Math.max(1,Math.ceil(total/PAGE_SIZE));const p=Math.min(Math.max(1,page),totalPages);const start=total===0?0:(p-1)*PAGE_SIZE;return{slice:rows.slice(start,start+PAGE_SIZE),total,page:p,totalPages,start:total===0?0:start+1,end:Math.min(start+PAGE_SIZE,total)};}

// ====== HIERARCHY VIEW — TREE ======
function isCollapsed(k){return state.collapsed.has(k);}
function toggleNode(k){state.collapsed.has(k)?state.collapsed.delete(k):state.collapsed.add(k);render();}
function nodeRow(level,id,name){
  const key=level+':'+id;const kids=childCount(level,id);const sel=state.sel.level===level&&state.sel.id===id;const hasKids=kids>0;
  return `<div class="tn-row ${sel?'is-sel':''}" onclick="selectNode('${level}','${id}')">
    ${hasKids?`<span class="tn-toggle" onclick="event.stopPropagation();toggleNode('${key}')"><i data-lucide="chevron-down" class="w-3 h-3"></i></span>`:`<span class="tn-spacer"></span>`}
    <i data-lucide="${LEVEL_ICON[level]}" class="tn-icon"></i>
    <span class="tn-lvl">${LEVEL_LABEL[level]}</span>
    <span class="tn-label" title="${name}">${name}</span>
    ${hasKids?`<span class="tn-count">${kids}</span>`:''}
  </div>`;
}
function renderTree(){
  const rootSel=state.sel.level==='root';
  let html=`<div class="tree-root-row ${rootSel?'is-sel':''}" onclick="selectNode('root',null)"><i data-lucide="building-2" class="w-4 h-4"></i><span style="flex:1;">ทุก Warehouse</span><span class="tn-count">${WAREHOUSES.length}</span></div>`;
  WAREHOUSES.forEach(w=>{
    const wColl=isCollapsed('warehouse:'+w.id);
    html+=`<div class="tn ${wColl?'is-collapsed':''}">${nodeRow('warehouse',w.id,w.name)}<div class="tn-children">`;
    zonesOf(w.id).forEach(z=>{
      const zColl=isCollapsed('zone:'+z.id);
      html+=`<div class="tn ${zColl?'is-collapsed':''}">${nodeRow('zone',z.id,z.name)}<div class="tn-children">`;
      areasOf(z.id).forEach(a=>{
        const aColl=isCollapsed('area:'+a.id);
        html+=`<div class="tn ${aColl?'is-collapsed':''}">${nodeRow('area',a.id,a.name)}<div class="tn-children">`;
        racksOf(a.id).forEach(r=>{html+=`<div class="tn">${nodeRow('rack',r.id,r.name)}</div>`;});
        html+=`</div></div>`;
      });
      html+=`</div></div>`;
    });
    html+=`</div></div>`;
  });
  return html;
}

// ====== DETAIL PANE PATH ======
function selPath(){
  const {level,id}=state.sel;const out=[{level:'root',id:null,name:'ทุก Warehouse'}];
  if(level==='root')return out;
  if(level==='warehouse'){out.push({level,id,name:wh(id).code});return out;}
  if(level==='zone'){const z=zn(id);out.push({level:'warehouse',id:z.warehouse_id,name:wh(z.warehouse_id).code});out.push({level,id,name:z.name});return out;}
  if(level==='area'){const a=ar(id),z=zn(a.zone_id);out.push({level:'warehouse',id:z.warehouse_id,name:wh(z.warehouse_id).code});out.push({level:'zone',id:z.id,name:z.name});out.push({level,id,name:a.name});return out;}
  if(level==='rack'){const r=rk(id),a=ar(r.area_id),z=zn(a.zone_id);out.push({level:'warehouse',id:z.warehouse_id,name:wh(z.warehouse_id).code});out.push({level:'zone',id:z.id,name:z.name});out.push({level:'area',id:a.id,name:a.name});out.push({level,id,name:r.name});return out;}
  return out;
}

function applySearch(rows){const q=(state.filters.search||'').toLowerCase();if(!q)return rows;return rows.filter(r=>(r.code||'').toLowerCase().includes(q)||(r.name||'').toLowerCase().includes(q));}

function listCard(opts){

  const filtered=opts.locFilter?applyLocFilter(opts.rows):applySearch(opts.rows);

  const filterBar=`<div class="filter-bar">
    <div class="input-search"><i data-lucide="search" class="lead-icon"></i><input id="flt-search" class="input" type="text" placeholder="${opts.searchPh}" value="${state.filters.search}" oninput="setFilter('search',this.value)"></div>

    <select class="select" style="max-width:150px;" onchange="setFilter('status',this.value)"><option value="all"${state.filters.status==='all'?' selected':''}>ทุกสถานะ</option>${['active','inactive','blocked','full','frozen','decommissioned'].map(s=>`<option value="${s}"${state.filters.status===s?' selected':''}>${statusLabel(s)}</option>`).join('')}</select>`:''}
    <button class="btn btn-ghost btn-sm" onclick="resetFilters()"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i><span>รีเซ็ต</span></button>
  </div>`;
  let tbody;

    tbody=`<tr><td colspan="${opts.cols.length+1}"><div class="empty"><div class="empty-icon"><i data-lucide="inbox" class="w-5 h-5"></i></div><div class="empty-title">ไม่พบรายการ</div><div class="empty-desc">${state.filters.search||state.filters.type!=='all'||state.filters.status!=='all'?'ลองปรับตัวกรอง หรือกดรีเซ็ต':'กดปุ่มเพิ่มด้านบนเพื่อสร้างรายการแรก'}</div></div></td></tr>`;
  }else{tbody=pg.slice.map(opts.rowFn).join('');}
  const footer=`<div class="table-footer"><div>แสดง ${fmtNum(pg.start)}–${fmtNum(pg.end)} จาก ${fmtNum(pg.total)} รายการ</div>
    ${pg.totalPages>1?`<div class="pagination">
      <button class="pg-btn ${pg.page===1?'is-disabled':''}" onclick="goPage(${pg.page-1},'${opts.which}')"><i data-lucide="chevron-left" class="w-3 h-3"></i></button>
      ${Array.from({length:pg.totalPages},(_,i)=>i+1).map(n=>`<button class="pg-btn ${n===pg.page?'is-active':''}" onclick="goPage(${n},'${opts.which}')">${n}</button>`).join('')}
      <button class="pg-btn ${pg.page===pg.totalPages?'is-disabled':''}" onclick="goPage(${pg.page+1},'${opts.which}')"><i data-lucide="chevron-right" class="w-3 h-3"></i></button>
    </div>`:''}</div>`;
  const thead=`<thead><tr>${opts.cols.map(c=>`<th${c.r?' style="text-align:right;"':''}>${c.h}</th>`).join('')}<th style="width:108px;text-align:right;"></th></tr></thead>`;
  return `<div class="card">${headHtml}${filterBar}<div class="table-scroll"><table class="table">${thead}<tbody>${tbody}</tbody></table></div>${footer}</div>`;
}

function toggleModule(h){const m=h.closest('.sb-module');if(!m)return;const ex=m.getAttribute('data-expanded')!=='false';m.setAttribute('data-expanded',ex?'false':'true');}

// ====== DRAWER OPEN/CLOSE ======
function openView(level,id){openDrawer('view',level,id);}
function openDrawer(mode,level,id){
  if(!canManage&&mode!=='view'){showToast('ไม่มีสิทธิ์ดำเนินการ','error');return;}
  if(mode==='bulk'){
    // determine target area/rack from selection
    let area_id=null,rack_id=null,target='area';
    if(state.sel.level==='rack'){rack_id=state.sel.id;area_id=rk(rack_id).area_id;target='rack';}
    else if(state.sel.level==='area'){area_id=state.sel.id;target='area';}
    state.bulk={target,area_id:area_id||AREAS[0].id,rack_id:rack_id||'',rackPat:'A-{n}',rackQty:5,rows:4,cols:12,levels:4,locPat:'{rack}-R{r}-C{c}-L{l}',type:'RESERVE',cap_uom:'pallet',cap_val:1,rotation:'fifo'};
    state.drawer={open:true,mode:'bulk',level:'location',id:null,step:1,tab:'overview'};
    return openDrawerFx();
  }
  let form={};
  const parent=parentContext(level);
  if(mode==='create'){
    if(level==='warehouse')form={code:'',name:'',addr_line:'',province:'',district:'',subdistrict:'',postcode:'',status:'active'};
    if(level==='zone')form={code:'',name:'',warehouse_id:parent.warehouse_id||WAREHOUSES[0].id,temp_controlled:false,temp_min:'',temp_max:'',status:'active'};
    if(level==='area')form={code:'',name:'',zone_id:parent.zone_id||ZONES[0].id,allows_direct:false,status:'active'};
    if(level==='rack')form={code:'',name:'',area_id:parent.area_id||AREAS[0].id,rows:4,cols:12,levels:4,status:'active'};
    if(level==='location')form={parent_type:parent.parent_type||'rack',rack_id:parent.rack_id||'',area_id:parent.area_id||'',code:'',name:'',type:'RESERVE',cap_uom:'pallet',cap_val:'',rotation:'fifo',row:'',col:'',level:'',position:'',pickable:true,putawayable:true,replenishable:false,mixed_lot:false,mixed_item:false,neg_stock:false,barcode:''};
  } else if(mode==='edit'){
    const e=entOf(level,id);form=JSON.parse(JSON.stringify(e));
    if(level==='zone'){form.temp_min=e.temp_min??'';form.temp_max=e.temp_max??'';}
  }
  state.drawer={open:true,mode,level,id,step:1,tab:'overview'};state.form=form;openDrawerFx();
}
function parentContext(level){
  const {level:sl,id}=state.sel;
  if(level==='zone'){if(sl==='warehouse')return {warehouse_id:id};return {};}
  if(level==='area'){if(sl==='zone')return {zone_id:id};if(sl==='warehouse')return {};return {};}
  if(level==='rack'){if(sl==='area')return {area_id:id};return {};}
  if(level==='location'){
    if(sl==='rack')return {parent_type:'rack',rack_id:id};
    if(sl==='area'&&ar(id).allows_direct)return {parent_type:'area',area_id:id};
    return {};
  }
  return {};
}
function openDrawerFx(){render();requestAnimationFrame(()=>{document.getElementById('drawerBackdrop').classList.add('is-open');document.getElementById('drawer').classList.add('is-open');});}
function closeDrawer(){document.getElementById('drawerBackdrop').classList.remove('is-open');document.getElementById('drawer').classList.remove('is-open');setTimeout(()=>{state.drawer={open:false,mode:null,level:null,id:null,step:1,tab:'overview'};render();},280);}
function setTab(t){state.drawer.tab=t;render();}
function toggleFormFlag(k){captureForm();state.form[k]=!state.form[k];render();}
function setFormVal(k,v){captureForm();state.form[k]=v;render();}
function setLocParentType(t){captureForm();state.form.parent_type=t;render();}

// ====== CAPTURE FORM ======
function captureForm(){const g=id=>document.getElementById(id);const f=state.form;const lv=state.drawer.level;
  const set=(id,key)=>{if(g(id))f[key]=g(id).value;};
  set('f-code','code');set('f-name','name');set('f-addr-line','addr_line');set('f-province','province');set('f-district','district');set('f-subdistrict','subdistrict');set('f-postcode','postcode');
  set('f-wh','warehouse_id');set('f-zone','zone_id');set('f-area','area_id');set('f-rack','rack_id');
  set('f-temp-min','temp_min');set('f-temp-max','temp_max');
  set('f-rows','rows');set('f-cols','cols');set('f-levels','levels');
  set('f-type','type');set('f-cap-uom','cap_uom');set('f-cap-val','cap_val');set('f-rotation','rotation');
  set('f-row','row');set('f-col','col');set('f-level','level');set('f-position','position');set('f-barcode','barcode');

// ====== SUBMIT PER LEVEL ======
function genId(p){return p+'-'+Date.now().toString().slice(-6);}
function submitForm(){captureForm();const f=state.form;const lv=state.drawer.level;const isEdit=state.drawer.mode==='edit';
  if(!f.code||!String(f.code).trim()){showToast('กรุณากรอกรหัส','warning');return;}
  if(!f.name||!String(f.name).trim()){showToast('กรุณากรอกชื่อ','warning');return;}
  if(lv==='warehouse'){
    if(isEdit){Object.assign(wh(state.drawer.id),{code:f.code,name:f.name,addr_line:f.addr_line,province:f.province,district:f.district,subdistrict:f.subdistrict,postcode:f.postcode,status:f.status||wh(state.drawer.id).status});}
    else{const id=genId('WH');WAREHOUSES.push({id,code:f.code,name:f.name,addr_line:f.addr_line,province:f.province,district:f.district,subdistrict:f.subdistrict,postcode:f.postcode,status:'active',created:new Date().toISOString()});state.sel={level:'warehouse',id};}
    done(lv,isEdit,f.code);return;
  }
  if(lv==='zone'){
    if(f.temp_controlled&&(f.temp_min===''||f.temp_max==='')){showToast('กรุณากรอกช่วงอุณหภูมิ','warning');return;}
    const data={code:f.code,name:f.name,warehouse_id:f.warehouse_id,temp_controlled:!!f.temp_controlled,temp_min:f.temp_controlled?+f.temp_min:null,temp_max:f.temp_controlled?+f.temp_max:null};
    if(isEdit)Object.assign(zn(state.drawer.id),data);
    else{const id=genId('Z');ZONES.push(Object.assign({id,status:'active',created:new Date().toISOString()},data));state.sel={level:'zone',id};}
    done(lv,isEdit,f.code);return;
  }
  if(lv==='area'){
    const data={code:f.code,name:f.name,zone_id:f.zone_id,allows_direct:!!f.allows_direct};
    if(isEdit)Object.assign(ar(state.drawer.id),data);
    else{const id=genId('A');AREAS.push(Object.assign({id,status:'active',created:new Date().toISOString()},data));state.sel={level:'area',id};}
    done(lv,isEdit,f.code);return;
  }
  if(lv==='rack'){
    const data={code:f.code,name:f.name,area_id:f.area_id,rows:+f.rows||0,cols:+f.cols||0,levels:+f.levels||0};
    if(isEdit)Object.assign(rk(state.drawer.id),data);
    else{const id=genId('R');RACKS.push(Object.assign({id,status:'active',created:new Date().toISOString()},data));state.sel={level:'rack',id};}
    done(lv,isEdit,f.code);return;

function done(lv,isEdit,code){showToast((isEdit?'บันทึกการแก้ไข ':'สร้าง ')+LEVEL_LABEL[lv]+' "'+code+'" '+(isEdit?'แล้ว':'สำเร็จ'),'success');closeDrawer();}

function submitLoc(){captureForm();const f=state.form;const isEdit=state.drawer.mode==='edit';

// ====== BULK ======
function captureBulk(){const g=id=>document.getElementById(id);const b=state.bulk;const set=(id,key,num)=>{if(g(id))b[key]=num?+g(id).value:g(id).value;};
  set('b-area','area_id');set('b-rackPat','rackPat');set('b-rackQty','rackQty',1);set('b-rows','rows',1);set('b-cols','cols',1);set('b-levels','levels',1);set('b-locPat','locPat');set('b-type','type');set('b-rotation','rotation');set('b-cap-uom','cap_uom');set('b-cap-val','cap_val',1);}
function refreshBulk(){captureBulk();render();}
function sampleCode(b){return (b.locPat||'').replace('{rack}',(b.rackPat||'').replace('{n}','1')).replace('{r}','1').replace('{c}','1').replace('{l}','1');}
function submitBulk(){captureBulk();const b=state.bulk;const perRack=(b.rows||0)*(b.cols||0)*(b.levels||0);const n=(b.rackQty||0)*perRack;
  if(n<=0){showToast('template ไม่ถูกต้อง','warning');return;}if(!b.cap_val||b.cap_val<=0){showToast('ความจุต้องมากกว่า 0','warning');return;}
  LOCATIONS.unshift(mkLoc({id:'L'+Date.now().toString().slice(-6),code:sampleCode(b),name:'(ตัวอย่างจาก bulk-gen)',parent_type:'area',area_id:b.area_id,rack_id:null,type:b.type,cap_uom:b.cap_uom,cap_val:b.cap_val,rotation:b.rotation,status:'active',created:new Date().toISOString()}));
  closeDrawer();showToast('สร้าง '+fmtNum(b.rackQty)+' rack × '+fmtNum(n)+' ตำแหน่งสำเร็จ (atomic)','success');
}

// ====== MODAL (delete/deactivate with empty check) ======
function openModal(level,id){state.modal={open:true,level,id};render();requestAnimationFrame(()=>document.getElementById('modalBackdrop').classList.add('is-open'));}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('is-open');setTimeout(()=>{state.modal={open:false,level:null,id:null};render();},200);}
function blockReason(level,id){
  if(level==='warehouse'&&zonesOf(id).length)return 'ยังมี Zone อยู่ภายใต้คลังนี้ — ต้องลบ/ย้าย Zone ก่อน';
  if(level==='zone'&&areasOf(id).length)return 'ยังมี Area อยู่ภายใต้ Zone นี้ — ต้องลบ/ย้าย Area ก่อน';
  if(level==='area'&&(racksOf(id).length||locsOfAreaDirect(id).length))return 'ยังมี Rack หรือ Location อยู่ภายใต้ Area นี้ — ต้องลบก่อน';
  if(level==='rack'&&locsOfRack(id).length)return 'ยังมี Location อยู่ภายใต้ Rack นี้ — ต้องลบก่อน';
  if(level==='location'&&lc(id).hasStock)return 'ตำแหน่งนี้ยังมีสต็อกอยู่ — ต้องย้ายสต็อกออก (stock=0) ก่อนปลดระวาง';
  return '';
}
function confirmModal(){const {level,id}=state.modal;const reason=blockReason(level,id);
  if(reason){showToast(reason,'error');return;}
  if(level==='warehouse')WAREHOUSES=WAREHOUSES.filter(x=>x.id!==id);
  else if(level==='zone')ZONES=ZONES.filter(x=>x.id!==id);
  else if(level==='area')AREAS=AREAS.filter(x=>x.id!==id);
  else if(level==='rack')RACKS=RACKS.filter(x=>x.id!==id);
  else if(level==='location'){lc(id).status='decommissioned';}
  // reset selection if removed node was selected
  if(state.sel.level===level&&state.sel.id===id&&level!=='location'){const p=selPath();state.sel=p.length>1?p[p.length-2]:{level:'root',id:null};}
  closeModal();if(state.drawer.open)closeDrawer();
  showToast(level==='location'?'ปลดระวางตำแหน่งแล้ว':'ลบ '+LEVEL_LABEL[level]+' แล้ว','success');
}

// ====== TOAST + RENDER + BOOT ======
function showToast(msg,variant='info',ms=2600){const el=document.getElementById('toast');const map={success:'check-circle-2',info:'info',warning:'alert-triangle',error:'x-circle'};el.className='toast is-'+variant;el.innerHTML=`<i data-lucide="${map[variant]||'info'}" class="w-4 h-4"></i><span>${msg}</span>`;renderIcons();requestAnimationFrame(()=>el.classList.add('is-visible'));setTimeout(()=>el.classList.remove('is-visible'),ms);}
function render(){const snap=preserveRenderState();document.getElementById('page-content').innerHTML=renderPage();document.getElementById('drawer').innerHTML=renderDrawer();document.getElementById('modalEl').innerHTML=renderModal();renderIcons();restoreRenderState(snap);}
function renderIcons(){if(window.lucide&&typeof window.lucide.createIcons==='function')window.lucide.createIcons();}
function preserveRenderState(){const db=document.querySelector('.drawer-body');const mb=document.querySelector('.modal-body');const tb=document.querySelector('.tree-body');const a=document.activeElement;const isI=a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA');return{ds:db?db.scrollTop:0,ms:mb?mb.scrollTop:0,ts:tb?tb.scrollTop:0,ps:window.scrollY,fk:isI?{id:a.id||'',ss:a.selectionStart,se:a.selectionEnd}:null};}
function restoreRenderState(s){if(!s)return;requestAnimationFrame(()=>{const db=document.querySelector('.drawer-body');if(db&&s.ds>0)db.scrollTop=s.ds;const mb=document.querySelector('.modal-body');if(mb&&s.ms>0)mb.scrollTop=s.ms;const tb=document.querySelector('.tree-body');if(tb&&s.ts>0)tb.scrollTop=s.ts;if(s.ps>0)window.scrollTo(0,s.ps);if(s.fk&&s.fk.id){const c=document.getElementById(s.fk.id);if(c){c.focus();if(s.fk.ss!=null&&c.setSelectionRange){try{c.setSelectionRange(s.fk.ss,s.fk.se);}catch(e){}}}}});}
window.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.modal.open)closeModal();else if(state.drawer.open)closeDrawer();}});
var domReady=false,lucideReady=false;function bootIfReady(){if(domReady&&lucideReady){render();renderIcons();}}
if(document.readyState==='loading'){window.addEventListener('DOMContentLoaded',function(){domReady=true;bootIfReady();});}else{domReady=true;}
window.addEventListener('lucide:ready',function(){lucideReady=true;bootIfReady();});
if(window.lucide&&typeof window.lucide.createIcons==='function'){lucideReady=true;}
bootIfReady();setTimeout(function(){if(!lucideReady){lucideReady=true;bootIfReady();}},5000);

  <div class="stepper-band"><div class="stepper-row"><div class="step-dot ${step>=1?'is-active':''}">${step>1?'<i data-lucide="check" class="w-3 h-3"></i>':'1'}</div><div class="step-line ${step>1?'is-done':''}"></div><div class="step-dot ${step>=2?'is-active':''}">2</div></div></div>`;
  let body;
  if(step===1){
    body=`<div class="drawer-section"><h3 class="drawer-section-title">Parent (flexible) <span class="req">*</span></h3>
      <div class="radio-row">
        <div class="radio-card ${f.parent_type==='rack'?'is-sel':''}" onclick="setLocParentType('rack')"><div class="rc-title">ใต้ Rack</div><div class="rc-sub">bin ในชั้นวาง</div></div>
        <div class="radio-card ${f.parent_type==='area'?'is-sel':''}" onclick="setLocParentType('area')"><div class="rc-title">ใต้ Area</div><div class="rc-sub">วางบนพื้นโดยตรง</div></div>
      </div>
      ${f.parent_type==='rack'?`<div class="field" style="margin-top:12px;"><label class="field-label">เลือก Rack <span class="req">*</span></label><select class="select" id="f-rack"><option value="">— เลือก —</option>${rackOpts}</select></div>`:
        `<div class="field" style="margin-top:12px;"><label class="field-label">เลือก Area <span class="req">*</span></label><select class="select" id="f-area" onchange="captureForm();render();"><option value="">— เลือก —</option>${areaOpts}</select>
        ${f.area_id&&!ar(f.area_id).allows_direct?`<div class="field-error">Area นี้ allows_direct = false — เลือก Area อื่น หรือเพิ่ม Rack ก่อน</div>`:`<div class="field-help">Location จะวางตรงใต้ Area นี้ (ไม่ผ่าน Rack)</div>`}</div>`}
    </div>
    <div class="drawer-section"><h3 class="drawer-section-title">ข้อมูลหลัก</h3>
      <div class="field"><label class="field-label">รหัสตำแหน่ง <span class="req">*</span></label><input class="input" id="f-code" value="${f.code||''}" placeholder="เช่น A-01-R1-C2-L3"><div class="field-help">ต้องไม่ซ้ำภายใน parent เดียวกัน</div></div>
      <div class="field"><label class="field-label">ชื่อ (ไม่บังคับ)</label><input class="input" id="f-name" value="${f.name||''}"></div>
      <div class="field"><label class="field-label">ประเภทตำแหน่ง <span class="req">*</span></label><select class="select" id="f-type">${TYPES.map(t=>`<option value="${t}"${f.type===t?' selected':''}>${typeLabel(t)}</option>`).join('')}</select></div>
    </div>`;
  }else{
    body=`<div class="drawer-section"><h3 class="drawer-section-title">ความจุ &amp; การหมุนเวียน</h3>
      <div class="field-row"><div class="field"><label class="field-label">หน่วยความจุ <span class="req">*</span></label><select class="select" id="f-cap-uom">${['pallet','box','piece','cbm','kg'].map(u=>`<option value="${u}"${f.cap_uom===u?' selected':''}>${u}</option>`).join('')}</select></div>
      <div class="field"><label class="field-label">ความจุ <span class="req">*</span></label><input class="input" type="number" id="f-cap-val" value="${f.cap_val||''}" placeholder="> 0"><div class="field-help">ต้องมากกว่า 0</div></div></div>
      <div class="field"><label class="field-label">กลยุทธ์หมุนเวียน <span class="req">*</span></label><select class="select" id="f-rotation">${['fifo','lifo','fefo','manual'].map(r=>`<option value="${r}"${f.rotation===r?' selected':''}>${rotLabel(r)}</option>`).join('')}</select></div>
      <div class="field-row"><div class="field"><label class="field-label">Row</label><input class="input" id="f-row" value="${f.row||''}"></div><div class="field"><label class="field-label">Column</label><input class="input" id="f-col" value="${f.col||''}"></div><div class="field"><label class="field-label">Level</label><input class="input" type="number" id="f-level" value="${f.level||''}"></div><div class="field"><label class="field-label">Position</label><input class="input" id="f-position" value="${f.position||''}"></div></div>
    </div>
    <div class="drawer-section"><h3 class="drawer-section-title">พฤติกรรม (behavior flags)</h3>
      <div class="toggle-field"><div class="tf-label">หยิบได้ (pickable)</div><div class="toggle-track ${f.pickable?'is-on':''}" onclick="toggleFormFlag('pickable')"><div class="toggle-knob"></div></div></div>
      <div class="toggle-field"><div class="tf-label">วางได้ (putawayable)</div><div class="toggle-track ${f.putawayable?'is-on':''}" onclick="toggleFormFlag('putawayable')"><div class="toggle-knob"></div></div></div>
      <div class="toggle-field"><div class="tf-label">เติมเต็มได้ (replenishable)</div><div class="toggle-track ${f.replenishable?'is-on':''}" onclick="toggleFormFlag('replenishable')"><div class="toggle-knob"></div></div></div>
    </div>
    <div class="drawer-section"><h3 class="drawer-section-title">การปนกัน (mixing)</h3>
      <div class="toggle-field"><div class="tf-label">ปน lot ได้ (allow mixed lot)</div><div class="toggle-track ${f.mixed_lot?'is-on':''}" onclick="toggleFormFlag('mixed_lot')"><div class="toggle-knob"></div></div></div>
      <div class="toggle-field"><div class="tf-label">ปน item ได้ (allow mixed item)</div><div class="toggle-track ${f.mixed_item?'is-on':''}" onclick="toggleFormFlag('mixed_item')"><div class="toggle-knob"></div></div></div>
      <div class="toggle-field"><div class="tf-label">สต็อกติดลบได้ (allow negative stock)</div><div class="toggle-track ${f.neg_stock?'is-on':''}" onclick="toggleFormFlag('neg_stock')"><div class="toggle-knob"></div></div></div>
    </div>
    <div class="drawer-section"><div class="field"><label class="field-label">บาร์โค้ด / QR ${isEdit?'':'<span class="field-help" style="display:inline;">(ต้องระบุก่อน activate)</span>'}</label><input class="input" id="f-barcode" value="${f.barcode||''}" placeholder="สแกนหรือพิมพ์"></div></div>`;
  }
  const footer=`<div class="drawer-footer">
    ${step>1?`<button class="btn btn-secondary" onclick="locPrev()"><i data-lucide="arrow-left" class="w-4 h-4"></i><span>กลับ</span></button>`:`<button class="btn btn-ghost" onclick="closeDrawer()">ยกเลิก</button>`}
    <div class="footer-spacer"></div>
    ${step<2?`<button class="btn btn-primary" onclick="locNext()"><span>ถัดไป</span><i data-lucide="arrow-right" class="w-4 h-4"></i></button>`:`<button class="btn btn-primary" onclick="submitLoc()"><i data-lucide="check" class="w-4 h-4"></i><span>${isEdit?'บันทึกการแก้ไข':'ยืนยันสร้าง'}</span></button>`}
  </div>`;
  return head+`<div class="drawer-body">${body}</div>`+footer;
}

// ---- BULK ----

    <div style="flex:1;"><h2 class="drawer-title">สร้าง Location จำนวนมาก</h2><div class="drawer-subtitle">สร้าง rack + location จาก template (atomic)</div></div>

    <div class="drawer-section"><h3 class="drawer-section-title">เป้าหมาย</h3>
      <div class="field"><label class="field-label">Area</label><select class="select" id="b-area" onchange="refreshBulk()">${AREAS.map(a=>`<option value="${a.id}"${b.area_id===a.id?' selected':''}>${a.name} · ${zoneOfArea(a.id)?.name}</option>`).join('')}</select></div></div>
    <div class="drawer-section"><h3 class="drawer-section-title">Rack template</h3>
      <div class="field"><label class="field-label">รูปแบบรหัส Rack</label><input class="input" id="b-rackPat" value="${b.rackPat||''}" oninput="refreshBulk()" placeholder="เช่น A-{n}"><div class="field-help">ใช้ {n} แทนลำดับ rack</div></div>
      <div class="field-row"><div class="field"><label class="field-label">จำนวน Rack</label><input class="input" type="number" id="b-rackQty" value="${b.rackQty}" oninput="refreshBulk()"></div>
      <div class="field"><label class="field-label">Rows</label><input class="input" type="number" id="b-rows" value="${b.rows}" oninput="refreshBulk()"></div>
      <div class="field"><label class="field-label">Columns</label><input class="input" type="number" id="b-cols" value="${b.cols}" oninput="refreshBulk()"></div>
      <div class="field"><label class="field-label">Levels</label><input class="input" type="number" id="b-levels" value="${b.levels}" oninput="refreshBulk()"></div></div></div>
    <div class="drawer-section"><h3 class="drawer-section-title">Location template</h3>
      <div class="field"><label class="field-label">รูปแบบรหัส Location</label><input class="input" id="b-locPat" value="${b.locPat||''}" oninput="refreshBulk()" placeholder="{rack}-R{r}-C{c}-L{l}"><div class="field-help">ใช้ {rack} {r} {c} {l} แทนค่าจริง</div></div>
      <div class="field-row">
        <div class="field"><label class="field-label">ประเภท</label><select class="select" id="b-type" onchange="refreshBulk()">${TYPES.map(t=>`<option value="${t}"${b.type===t?' selected':''}>${typeLabel(t)}</option>`).join('')}</select></div>
        <div class="field"><label class="field-label">กลยุทธ์หมุนเวียน</label><select class="select" id="b-rotation" onchange="refreshBulk()">${['fifo','lifo','fefo','manual'].map(r=>`<option value="${r}"${b.rotation===r?' selected':''}>${rotLabel(r)}</option>`).join('')}</select></div>
      </div>
      <div class="field-row">
        <div class="field"><label class="field-label">หน่วยความจุ</label><select class="select" id="b-cap-uom" onchange="refreshBulk()">${['pallet','box','piece','cbm','kg'].map(u=>`<option value="${u}"${b.cap_uom===u?' selected':''}>${u}</option>`).join('')}</select></div>
        <div class="field"><label class="field-label">ความจุ</label><input class="input" type="number" id="b-cap-val" value="${b.cap_val}" oninput="refreshBulk()"></div>
      </div>
      <div class="code-sample">ตัวอย่างรหัสแรก: ${sampleCode(b)||'—'}</div>

    </div>
  </div>

    <button class="btn btn-primary" onclick="submitBulk()"><i data-lucide="check" class="w-4 h-4"></i><span>สร้าง ${fmtNum(total)} ตำแหน่ง</span></button></div>`;
}

// ---- VIEW (per level) ----
function renderViewDrawer(){
  const lv=state.drawer.level;const id=state.drawer.id;const e=entOf(lv,id);if(!e)return '';
  const canDelete=canManage&&(lv!=='location'||e.status!=='decommissioned');
  const delLabel=lv==='location'?'ปลดระวาง':'ลบ';
  const header=`<div class="drawer-header"><div class="drawer-avatar">${initials(e.code)}</div>
    <div style="flex:1;min-width:0;"><h2 class="drawer-title" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${e.name}</h2>
    <div class="drawer-subtitle"><span class="lvl-badge lvl-${lv}">${LEVEL_LABEL[lv]}</span><span>${e.code}</span>${e.status?`<span>·</span>${statPill(e.status)}`:''}</div></div>
    <div class="drawer-header-actions">
      ${canManage?`<button class="btn btn-sm btn-secondary" onclick="openDrawer('edit','${lv}','${id}')"><i data-lucide="pencil" class="w-3.5 h-3.5"></i><span>แก้ไข</span></button>`:''}
      ${canDelete?`<button class="btn btn-sm btn-danger" onclick="openModal('${lv}','${id}')"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i><span>${delLabel}</span></button>`:''}
      <span class="drawer-header-divider"></span>
      <button class="icon-btn" onclick="closeDrawer()"><i data-lucide="x" class="w-4 h-4"></i></button>
    </div></div>`;
  if(lv==='location')return header+renderLocViewTabsBody(e);
  // simple levels: overview + children summary
  let fields='';
  if(lv==='warehouse')fields=`<div class="lbl">รหัส</div><div class="val">${e.code}</div><div class="lbl">ชื่อ</div><div class="val">${e.name}</div><div class="lbl">ที่อยู่</div><div class="val">${waddr(e)}</div><div class="lbl">จำนวน Zone</div><div class="val">${fmtNum(zonesOf(id).length)}</div>`;
  if(lv==='zone')fields=`<div class="lbl">รหัส</div><div class="val">${e.code}</div><div class="lbl">ชื่อ</div><div class="val">${e.name}</div><div class="lbl">Warehouse</div><div class="val">${wh(e.warehouse_id)?.name}</div><div class="lbl">ควบคุมอุณหภูมิ</div><div class="val">${e.temp_controlled?`ใช่ (${e.temp_min}–${e.temp_max}°C)`:'ไม่'}</div><div class="lbl">จำนวน Area</div><div class="val">${fmtNum(areasOf(id).length)}</div>`;
  if(lv==='area')fields=`<div class="lbl">รหัส</div><div class="val">${e.code}</div><div class="lbl">ชื่อ</div><div class="val">${e.name}</div><div class="lbl">Zone</div><div class="val">${zn(e.zone_id)?.name}</div><div class="lbl">วาง Location ตรง</div><div class="val">${e.allows_direct?'ได้ (flexible parent)':'ไม่ได้ (ต้องผ่าน Rack)'}</div><div class="lbl">จำนวน Rack</div><div class="val">${fmtNum(racksOf(id).length)}</div><div class="lbl">Location ตรง</div><div class="val">${fmtNum(locsOfAreaDirect(id).length)}</div>`;
  if(lv==='rack')fields=`<div class="lbl">รหัส</div><div class="val">${e.code}</div><div class="lbl">ชื่อ</div><div class="val">${e.name}</div><div class="lbl">Area</div><div class="val">${ar(e.area_id)?.name}</div><div class="lbl">ขนาด (R×C×L)</div><div class="val">${e.rows}×${e.cols}×${e.levels}</div><div class="lbl">จำนวน Location</div><div class="val">${fmtNum(locsOfRack(id).length)}</div>`;
  const pathStr=selViewPathStr(lv,id);
  const body=`<div class="drawer-body">
    <div class="drawer-section"><h3 class="drawer-section-title">ลำดับชั้น (full path)</h3><div style="font-size:12.5px;color:var(--c-mute);background:var(--c-bg-off);padding:10px 12px;border-radius:8px;line-height:1.6;">${pathStr}</div></div>
    <div class="drawer-section"><h3 class="drawer-section-title">ข้อมูล${LEVEL_LABEL[lv]}</h3><div class="drawer-fields">${fields}</div></div>
    <div class="drawer-section"><button class="btn btn-secondary" style="width:100%;justify-content:center;" onclick="closeDrawer();selectNode('${lv}','${id}')"><i data-lucide="corner-down-right" class="w-4 h-4"></i><span>ดูรายการลูก (เจาะลงระดับถัดไป)</span></button></div>
  </div>`;
  const footer=`<div class="drawer-footer"><div class="drawer-footer-meta">สร้างเมื่อ ${fmtDateTime(e.created)}</div><div class="footer-spacer"></div><button class="btn btn-secondary" onclick="closeDrawer()">ปิด</button></div>`;
  return header+body+footer;
}
function selViewPathStr(lv,id){
  if(lv==='warehouse')return wh(id).code;
  if(lv==='zone'){const z=zn(id);return [wh(z.warehouse_id)?.code,z.name].join(' › ');}
  if(lv==='area'){const a=ar(id),z=zn(a.zone_id);return [wh(z.warehouse_id)?.code,z.name,a.name].join(' › ');}
  if(lv==='rack'){const r=rk(id),a=ar(r.area_id),z=zn(a.zone_id);return [wh(z.warehouse_id)?.code,z.name,a.name,r.name].join(' › ');}
  return '';
}
function renderLocViewTabsBody(r){
  const tab=state.drawer.tab;
  return `<div class="drawer-tabs"><button class="drawer-tab ${tab==='overview'?'is-active':''}" onclick="setTab('overview')">ภาพรวม</button><button class="drawer-tab ${tab==='cap'?'is-active':''}" onclick="setTab('cap')">ความจุ &amp; flags</button><button class="drawer-tab ${tab==='history'?'is-active':''}" onclick="setTab('history')">ประวัติ</button></div>
  <div class="drawer-body">
    ${tab==='overview'?`<div class="drawer-section"><h3 class="drawer-section-title">ลำดับชั้น (full path)</h3><div style="font-size:12.5px;color:var(--c-mute);background:var(--c-bg-off);padding:10px 12px;border-radius:8px;line-height:1.6;">${locFullPath(r)}</div></div>
      <div class="drawer-section"><h3 class="drawer-section-title">ข้อมูลตำแหน่ง</h3><div class="drawer-fields">
      <div class="lbl">รหัส</div><div class="val">${r.code}</div><div class="lbl">ชื่อ</div><div class="val">${r.name||'—'}</div>
      <div class="lbl">Parent</div><div class="val"><span class="parent-badge parent-${r.parent_type}">${r.parent_type==='rack'?'Rack':'Area'}</span> ${locParentLabel(r)}</div>
      <div class="lbl">ประเภท</div><div class="val"><span class="pill pill-${r.type.toLowerCase()}">${typeLabel(r.type)}</span></div>
      ${(r.row||r.col||r.level||r.position)?`<div class="lbl">พิกัด (R/C/L)</div><div class="val">${[r.row||'-',r.col||'-',r.level||'-'].join(' / ')}${r.position?(' · '+r.position):''}</div>`:''}
      <div class="lbl">สถานะ</div><div class="val">${statPill(r.status)}</div>
      ${r.block_reason?`<div class="lbl">เหตุผลที่บล็อก</div><div class="val">${r.block_reason}</div>`:''}</div></div>`:''}
    ${tab==='cap'?`<div class="drawer-section"><h3 class="drawer-section-title">ความจุ &amp; การหมุนเวียน</h3><div class="drawer-fields">
      <div class="lbl">ความจุ</div><div class="val">${fmtNum(r.cap_val)} ${r.cap_uom}</div><div class="lbl">กลยุทธ์หมุนเวียน</div><div class="val">${rotLabel(r.rotation)}</div><div class="lbl">บาร์โค้ด / QR</div><div class="val">${r.barcode||'—'}</div></div></div>
      <div class="drawer-section"><h3 class="drawer-section-title">พฤติกรรม (behavior flags)</h3><div class="drawer-fields">
      <div class="lbl">หยิบได้ (pickable)</div><div class="val">${yesNo(r.pickable)}</div><div class="lbl">วางได้ (putawayable)</div><div class="val">${yesNo(r.putawayable)}</div><div class="lbl">เติมเต็มได้</div><div class="val">${yesNo(r.replenishable)}</div></div></div>
      <div class="drawer-section"><h3 class="drawer-section-title">การปนกัน (mixing)</h3><div class="drawer-fields">
      <div class="lbl">ปน lot ได้</div><div class="val">${yesNo(r.mixed_lot)}</div><div class="lbl">ปน item ได้</div><div class="val">${yesNo(r.mixed_item)}</div><div class="lbl">สต็อกติดลบได้</div><div class="val">${yesNo(r.neg_stock)}</div></div></div>`:''}
    ${tab==='history'?`<div class="drawer-section"><h3 class="drawer-section-title">ประวัติการเปลี่ยนแปลง (WORM)</h3><div class="timeline">${auditOf(r.id).map(a=>`<div class="tl-item"><div class="tl-dot ${a.v?'is-'+a.v:''}"></div><div class="tl-title">${a.t}</div><div class="tl-meta">${fmtDateTime(a.at)} · ${a.by}</div></div>`).join('')}</div></div>`:''}
  </div>
  <div class="drawer-footer"><div class="drawer-footer-meta">สร้างเมื่อ ${fmtDateTime(r.created)}</div><div class="footer-spacer"></div><button class="btn btn-secondary" onclick="closeDrawer()">ปิด</button></div>`;
}

// ---- MODAL ----
function renderModal(){
  if(!state.modal.open)return '';
  const {level,id}=state.modal;const e=entOf(level,id);if(!e)return '';
  const reason=blockReason(level,id);const isLoc=level==='location';
  const title=isLoc?'ปลดระวางตำแหน่ง':'ลบ '+LEVEL_LABEL[level];
  const okLabel=isLoc?'ปลดระวาง':'ลบ';
  return `<div class="modal-header"><div class="modal-header-icon is-danger"><i data-lucide="trash-2" class="w-5 h-5"></i></div>
    <div style="flex:1;"><h3 class="modal-title">${title}</h3><p class="modal-subtitle">คุณกำลัง${isLoc?'ปลดระวาง':'ลบ'} <strong>${e.name}</strong> (${e.code})</p></div>
    <button class="icon-btn" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button></div>
  <div class="modal-body">${reason?`<div class="warn-box"><strong>ไม่สามารถดำเนินการ:</strong> ${reason}</div>`:`<div style="padding:12px;background:#FEF3C7;border-radius:8px;font-size:12.5px;color:#92400E;">${isLoc?'ตำแหน่งจะถูกตั้งเป็น decommissioned และเก็บประวัติไว้ (ไม่ลบถาวร)':'รายการนี้จะถูกลบออกจากระบบ — การกระทำนี้ถูกบันทึกใน audit log'}</div>`}</div>
  <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>
    <button class="btn btn-danger" onclick="confirmModal()" ${reason?'style="opacity:.5;pointer-events:none;"':''}><i data-lucide="trash-2" class="w-4 h-4"></i><span>${okLabel}</span></button></div>`;
}

</script>
</body>
</html>
