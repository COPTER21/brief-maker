function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* branch scope for a warehouse subtree (branch filter at root) */
function whInScope(w){ return !state.branchFilter || w.branch_id===state.branchFilter; }
function scopedWarehouses(){ return WAREHOUSES.filter(whInScope); }

/* ---------- full path helpers (branch › WH › Zone › Area › [Rack] › node) ---------- */
function pathChips(kind, id){
  // returns array of {lvl, code, node:{kind,id} | null}
  var out=[];
  var w,z,a,r,l;
  if(kind==='warehouse'){ w=wh(id); }
  else if(kind==='zone'){ z=zone(id); w=wh(z.warehouse_id); }
  else if(kind==='area'){ a=area(id); z=zone(a.zone_id); w=wh(z.warehouse_id); }
  else if(kind==='rack'){ r=rack(id); a=area(r.area_id); z=zone(a.zone_id); w=wh(z.warehouse_id); }
  else if(kind==='location'){ l=loc(id); a=area(locParentAreaId(l)); z=zone(a.zone_id); w=wh(z.warehouse_id); if(l.parent_type==='rack') r=rack(l.rack_id); }
  if(w) out.push({lvl:'คลัง', code:w.code});            // WH คง code (ตรงกับ breadcrumb) · branch ตัดออก (D15)
  if(z) out.push({lvl:'โซน', code:z.name});
  if(a) out.push({lvl:'พื้นที่', code:a.name});
  if(r) out.push({lvl:'ชั้นวาง', code:r.name});
  if(l) out.push({lvl:'ตำแหน่ง', code:l.code});         // location คง code (name มักว่าง)
  return out;
}
function fullPathStr(kind, id){
  return pathChips(kind,id).map(function(c){ return (c.branch?'<b>'+esc(c.code)+'</b>':esc(c.code)); }).join(' › ');
}

/* =====================================================================
   RENDER (master)
   ===================================================================== */
function render(){
  state.sel = selFromDrill();   // shared selection stays in sync with drill (tree <-> list)
  var snap = preserveRenderState();
  var pc = document.getElementById('page-content'); if(pc) pc.innerHTML = renderPage();
  var d  = document.getElementById('drawer');       if(d)  d.innerHTML  = state.drawer.open ? renderDrawer() : '';
  var m  = document.querySelector('#modalBackdrop .modal'); if(m) m.innerHTML = state.modal.open ? renderModal() : '';
  syncRoleChip();
  renderIcons();
  restoreRenderState(snap);
  initComboboxes();
}
function syncRoleChip(){
  var r = ROLES[state.role];
  var n=document.getElementById('uc-name'), ro=document.getElementById('uc-role'), av=document.getElementById('uc-avatar');
  if(n) n.textContent=r.name; if(ro) ro.textContent=r.en+' · Warm Light'; if(av) av.textContent=r.init;
}

/* ---------- current drill level + validity ---------- */
function curLevel(){ var d=state.drill; if(d.rack) return 'rack'; if(d.area) return 'area'; if(d.zone) return 'zone'; if(d.wh) return 'warehouse'; return 'root'; }
function drillValid(){
  var d=state.drill;
  if(d.wh && !wh(d.wh)) return false;
  if(d.zone && !zone(d.zone)) return false;
  if(d.area && !area(d.area)) return false;
  if(d.rack && !rack(d.rack)) return false;
  return true;
}

/* =====================================================================
   PAGE
   ===================================================================== */
function renderPage(){
  if(state.loading) return renderLoading();
  if(!drillValid()) return renderErrorState();
  var body = state.view==='tree' ? renderTreeView() : renderCard();
  return renderHeader() + renderViewSwitcher() + renderKpi() + body;
}
/* ---------- view switcher (segmented: List / Hierarchy) — D12 ---------- */
function renderViewSwitcher(){
  return '<div class="view-switch"><div class="seg-control" role="tablist">'
    +'<button class="seg-item'+(state.view==='list'?' is-active':'')+'" role="tab" aria-selected="'+(state.view==='list')+'" onclick="setView(\'list\')"><i data-lucide="list"></i>มุมมองรายการ</button>'
    +'<button class="seg-item'+(state.view==='tree'?' is-active':'')+'" role="tab" aria-selected="'+(state.view==='tree')+'" onclick="setView(\'tree\')"><i data-lucide="git-fork"></i>มุมมองลำดับชั้น</button>'
    +'</div></div>';
}
function setView(v){
  if(v===state.view) return;
  if(v==='tree') expandToSel();   // reveal current selection's ancestors so context is visible
  state.view=v; render();
}

/* =====================================================================
   HIERARCHY TREE VIEW (NON-STANDARD · approved deviation per DECISION_LOG D12)
   tree pane (WH>Zone>Area>Rack) + node summary panel · shares state.sel with List
   ===================================================================== */
var LEVEL_META = {
  warehouse:{ic:'warehouse',lbl:'คลัง',childLbl:'โซน'},
  zone:{ic:'layout-grid',lbl:'โซน',childLbl:'พื้นที่'},
  area:{ic:'square-dashed',lbl:'พื้นที่',childLbl:'ชั้นวาง'},
  rack:{ic:'rows-3',lbl:'ชั้นวาง',childLbl:'ตำแหน่ง'}
};
function lookupNode(kind,id){ return kind==='warehouse'?wh(id): kind==='zone'?zone(id): kind==='area'?area(id): kind==='rack'?rack(id):null; }
/* selection <-> drill mapping (single shared source of truth) */
function selFromDrill(){ var d=state.drill; if(d.rack) return {level:'rack',id:d.rack}; if(d.area) return {level:'area',id:d.area}; if(d.zone) return {level:'zone',id:d.zone}; if(d.wh) return {level:'warehouse',id:d.wh}; return {level:'root',id:null}; }
function drillForSel(kind,id){
  if(kind==='root'||!id) return {wh:null,zone:null,area:null,rack:null};
  if(kind==='warehouse') return {wh:id,zone:null,area:null,rack:null};
  if(kind==='zone'){ var z=zone(id); return {wh:z?z.warehouse_id:null,zone:id,area:null,rack:null}; }
  if(kind==='area') return drillToAreaContext(id);
  if(kind==='rack'){ var r=rack(id); var d=drillToAreaContext(r.area_id); d.rack=id; return d; }
  return {wh:null,zone:null,area:null,rack:null};
}
function nodeKey(k,id){ return k+':'+id; }
function toggleTreeNode(k,id){ var key=nodeKey(k,id); state.treeOpen[key]=!state.treeOpen[key]; render(); }
function treeSelect(kind,id){ state.drill=drillForSel(kind,id); expandToSel(); state.treeOpen[nodeKey(kind,id)]=true; state.filters={search:'',type:'all',status:'all'}; state.pagination.page=1; render(); }
function expandToSel(){ var d=state.drill; if(d.wh) state.treeOpen[nodeKey('warehouse',d.wh)]=true; if(d.zone) state.treeOpen[nodeKey('zone',d.zone)]=true; if(d.area) state.treeOpen[nodeKey('area',d.area)]=true; }
function treeChildrenOf(kind,id){
  var f=function(x){return x.status!=='archived';};
  if(kind==='warehouse') return zonesOf(id).filter(f).map(function(z){return {kind:'zone',rec:z};});
  if(kind==='zone') return areasOf(id).filter(f).map(function(a){return {kind:'area',rec:a};});
  if(kind==='area') return racksOf(id).filter(f).map(function(r){return {kind:'rack',rec:r};});
  return []; // rack: Locations are leaves — shown in the summary panel / List, not as tree nodes (mirrors legacy)
}
function renderTreeView(){
  return '<div class="tree-layout">'
    +'<div class="tree-pane">'+renderTree()+'</div>'
    +'<div>'+renderNodeSummary()+'</div>'
    +'</div>';
}
function renderTree(){
  var whs=scopedWarehouses().filter(function(w){return w.status!=='archived';});
  if(!whs.length) return emptyStateHTML({icon:'inbox',title:'ยังไม่มีคลัง',desc:'เริ่มต้นด้วยการสร้างคลังแรกของคุณ'});
  return '<div class="tree" role="tree">'+whs.map(function(w){return treeNode('warehouse',w);}).join('')+'</div>';
}
function treeNode(kind,rec){
  var id=rec.id, meta=LEVEL_META[kind];
  var kids=treeChildrenOf(kind,id), hasKids=kids.length>0;
  var key=nodeKey(kind,id), open=!!state.treeOpen[key];
  var isSel=state.sel.level===kind && state.sel.id===id;
  var cnt=childCount(kind,id);
  var chev = hasKids
    ? '<button class="tree-toggle" title="ย่อ/ขยาย" onclick="event.stopPropagation();toggleTreeNode(\''+kind+'\',\''+id+'\')"><i data-lucide="'+(open?'chevron-down':'chevron-right')+'" class="w-3.5 h-3.5"></i></button>'
    : '<span class="tree-toggle-sp"></span>';
  var row='<div class="tree-row'+(isSel?' is-sel':'')+'" onclick="treeSelect(\''+kind+'\',\''+id+'\')">'
    +chev
    +'<i data-lucide="'+meta.ic+'" class="tree-ico w-4 h-4"></i>'
    +'<span class="tree-code mono">'+esc(rec.code)+'</span>'
    +'<span class="tree-name">'+esc(rec.name||'')+'</span>'
    +'<span class="tree-badge">'+meta.lbl+'</span>'
    +(cnt>0?'<span class="tree-count" title="'+cnt+' '+meta.childLbl+'">'+fmtNumber(cnt)+'</span>':'')
    +'</div>';
  var kidsHtml = (hasKids&&open) ? '<div class="tree-children">'+kids.map(function(c){return treeNode(c.kind,c.rec);}).join('')+'</div>' : '';
  return '<div class="tree-node">'+row+kidsHtml+'</div>';
}
function renderNodeSummary(){
  var sel=state.sel;
  if(sel.level==='root'||!sel.id){
    return '<div class="node-summary"><div class="empty empty-compact">'
      +'<div class="empty-icon"><i data-lucide="git-fork"></i></div>'
      +'<div class="empty-title">เลือกโหนดจากผังด้านซ้าย</div>'
      +'<div class="empty-desc">คลิกคลัง โซน พื้นที่ หรือชั้นวาง เพื่อดูรายละเอียดและรายการลูก</div></div></div>';
  }
  var kind=sel.level, id=sel.id, p=perms();
  var rec=lookupNode(kind,id);
  if(!rec){ return '<div class="node-summary"><div class="empty empty-compact"><div class="empty-icon"><i data-lucide="alert-triangle"></i></div><div class="empty-title">ไม่พบข้อมูลโหนดที่เลือก</div></div></div>'; }
  var meta=LEVEL_META[kind];
  var fields='';
  if(kind==='warehouse') fields=defRow('สาขา',esc(branchName(rec.branch_id)))+defRow('ที่อยู่',esc(waddr(rec)))+defRow('รหัสไปรษณีย์',esc(rec.postcode||'—'));
  else if(kind==='zone') fields=defRow('คลัง',esc(whCode(rec.warehouse_id)))+defRow('ควบคุมอุณหภูมิ',rec.temp_controlled?('ใช่ ('+rec.temp_min+'–'+rec.temp_max+'°C)'):'ไม่');
  else if(kind==='area') fields=defRow('โซน',esc(zoneCode(rec.zone_id)))+defRow('วางตำแหน่งตรง',rec.allows_direct?'อนุญาต':'ไม่อนุญาต (ต้องผ่านชั้นวาง)');
  else fields=defRow('พื้นที่',esc(areaCode(rec.area_id)))+defRow('ขนาดกริด',rec.rows+' × '+rec.cols+' × '+rec.levels+' (R×C×L)');
  var chips='';
  if(kind==='warehouse') chips=chipStat('โซน',zonesOf(id).length,kind,id,null);
  else if(kind==='zone') chips=chipStat('พื้นที่',areasOf(id).length,kind,id,null);
  else if(kind==='area') chips=chipStat('ชั้นวาง',racksOf(id).length,kind,id,'racks')+chipStat('ตำแหน่งตรง',locsOfAreaDirect(id).length,kind,id,'locs');
  else chips=chipStat('ตำแหน่ง',locsOfRack(id).length,kind,id,null);
  var archived=rec.status==='archived';
  var actions='<div class="ns-actions">'
    +((p.create&&!archived)?'<button class="btn btn-sm btn-secondary" onclick="addChildFromSummary(\''+kind+'\',\''+id+'\')"><i data-lucide="plus" class="w-3.5 h-3.5"></i><span>เพิ่มลูก</span></button>':'')
    +((p.create&&!archived)?'<button class="btn btn-sm btn-secondary" onclick="openNodeEdit(\''+kind+'\',\''+id+'\')"><i data-lucide="pencil" class="w-3.5 h-3.5"></i><span>แก้ไข</span></button>':'')
    +((p.del&&!archived)?'<button class="btn btn-sm btn-danger" onclick="askDeleteNode(\''+kind+'\',\''+id+'\')"><i data-lucide="archive" class="w-3.5 h-3.5"></i><span>จัดเก็บ</span></button>':'')
    +'</div>';
  return '<div class="node-summary">'
    +'<div class="ns-head"><div class="ns-icon"><i data-lucide="'+meta.ic+'"></i></div>'
    +'<div><div class="ns-eyebrow">'+meta.lbl+'</div>'
    +'<div class="ns-title-row"><span class="ns-title mono">'+esc(rec.code)+'</span>'+pillHtml(rec.status)+'</div>'
    +'<div class="ns-sub">'+esc(rec.name||'—')+'</div></div>'+actions+'</div>'
    +'<div class="ns-section"><div class="ns-section-title">Full Path</div><div class="path-str">'+fullPathStr(kind,id)+'</div></div>'
    +'<div class="ns-section"><div class="ns-section-title">ข้อมูล</div><div class="def-grid">'+defRow('ชื่อ',esc(rec.name||'—'))+fields+defRow('สถานะ',pillHtml(rec.status))+'</div></div>'
    +'<div class="ns-section"><div class="ns-section-title">รายการลูก (คลิกชิปเพื่อดูใน List)</div><div class="child-stats">'+chips+'</div></div>'
    +'</div>';
}
function chipStat(lbl,val,kind,id,tab){
  return '<div class="child-stat is-clickable" onclick="chipToList(\''+kind+'\',\''+id+'\','+(tab?('\''+tab+'\''):'null')+')">'

function chipToList(kind,id,tab){
  state.drill=drillForSel(kind,id);

function addChildFromSummary(kind,id){
  state.drill=drillForSel(kind,id);

/* ---------- KPI ---------- */
function renderKpi(){
  var whs=scopedWarehouses(); var whIds=whs.map(function(w){return w.id;});
  var zs=ZONES.filter(function(z){return whIds.indexOf(z.warehouse_id)>=0;});
  var zIds=zs.map(function(z){return z.id;});

  return '<div class="stats">'
    +stat('warehouse','คลัง (Warehouse)',whs.length)
    +stat('layout-grid','โซน (Zone)',zs.length)
    +stat('square-dashed','พื้นที่ (Area)',as.length)

    +'</div>';
}

/* ---------- drill breadcrumb ---------- */
function renderDrill(){
  var d=state.drill; var chips=[];
  chips.push('<span class="drill-chip'+(curLevel()==='root'?' is-current':'')+'" onclick="drillTo(\'root\')"><i data-lucide="warehouse" class="w-3.5 h-3.5"></i>ทุกคลัง</span>');
  if(d.wh){
    var w=wh(d.wh);
    chips.push('<span class="drill-chip'+(curLevel()==='warehouse'?' is-current':'')+'" onclick="drillTo(\'warehouse\')"><span class="lvl">คลัง</span>'+esc(w.code)+'</span>');
  }
  if(d.zone){ var z=zone(d.zone); chips.push('<span class="drill-chip'+(curLevel()==='zone'?' is-current':'')+'" onclick="drillTo(\'zone\')"><span class="lvl">โซน</span>'+esc(z.name)+'</span>'); }
  if(d.area){ var a=area(d.area); chips.push('<span class="drill-chip'+(curLevel()==='area'?' is-current':'')+'" onclick="drillTo(\'area\')"><span class="lvl">พื้นที่</span>'+esc(a.name)+'</span>'); }
  if(d.rack){ var r=rack(d.rack); chips.push('<span class="drill-chip is-current"><span class="lvl">ชั้นวาง</span>'+esc(r.name)+'</span>'); }
  return '<div class="drill-bc">'+chips.join('<span class="drill-sep"><i data-lucide="chevron-right"></i></span>')+'</div>';
}

/* ---------- list rows for current level (filtered) ---------- */
function listRows(){
  var lvl=curLevel(), q=(state.filters.search||'').toLowerCase().trim(), arr=[];
  function matchQ(o){ return !q || String(o.code).toLowerCase().indexOf(q)>=0 || String(o.name||'').toLowerCase().indexOf(q)>=0; }
  if(lvl==='root') arr=scopedWarehouses().filter(matchQ);
  else if(lvl==='warehouse') arr=zonesOf(state.drill.wh).filter(matchQ);
  else if(lvl==='zone') arr=areasOf(state.drill.zone).filter(matchQ);
  else if(lvl==='area'){
    if(state.areaTab==='locs') arr=locsOfAreaDirect(state.drill.area).filter(matchQ);
    else arr=racksOf(state.drill.area).filter(matchQ);
  }
  else if(lvl==='rack') arr=locsOfRack(state.drill.rack).filter(matchQ);
  // location-level filters (type/status)
  var isLoc = (lvl==='rack') || (lvl==='area'&&state.areaTab==='locs');
  if(isLoc){
    if(state.filters.type!=='all') arr=arr.filter(function(l){return l.type===state.filters.type;});
    if(state.filters.status!=='all') arr=arr.filter(function(l){return l.status===state.filters.status;});
  }
  return arr;
}

/* ---------- card ---------- */
function renderCard(){
  var lvl=curLevel();
  var isLoc = (lvl==='rack') || (lvl==='area'&&state.areaTab==='locs');
  // filter bar
  var searchPh = {root:'ค้นหาคลัง...',warehouse:'ค้นหาโซน...',zone:'ค้นหาพื้นที่...',area:(state.areaTab==='locs'?'ค้นหาตำแหน่ง...':'ค้นหาชั้นวาง...'),rack:'ค้นหาตำแหน่ง...'}[lvl];
  var branchFilter = (lvl==='root') ? '<div class="branch-filter-wrap">'+searchSelectHTML('branchf',{placeholder:'ทุกสาขา'})+'</div>' : '';
  var typeSel = isLoc ? '<select class="select filter-select-type" onchange="setFilter(\'type\',this.value)"><option value="all">ทุกประเภท</option>'
      +TYPES.map(function(t){return '<option value="'+t+'"'+(state.filters.type===t?' selected':'')+'>'+typeLabel(t)+'</option>';}).join('')+'</select>' : '';
  var statusSel = isLoc ? '<select class="select filter-select-status" onchange="setFilter(\'status\',this.value)"><option value="all">ทุกสถานะ</option>'
      +['active','inactive','blocked','maintenance','full','frozen','decommissioned'].map(function(s){return '<option value="'+s+'"'+(state.filters.status===s?' selected':'')+'>'+statusLabel(s)+'</option>';}).join('')+'</select>' : '';
  var filterBar = '<div class="filter-bar">'+branchFilter
    +'<div class="input-search"><i data-lucide="search" class="lead-icon"></i><input class="input" type="text" placeholder="'+searchPh+'" value="'+esc(state.filters.search)+'" oninput="setSearch(this.value)"></div>'
    +typeSel+statusSel
    +'<button class="btn btn-ghost btn-sm ml-auto" onclick="resetFilters()"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i><span>รีเซ็ต</span></button></div>';

  // area segmented head
  var head='';
  if(lvl==='area'){
    var a=area(state.drill.area);
    var seg='';
    if(a && a.allows_direct){
      seg='<div class="seg-control"><button class="seg-item'+(state.areaTab==='racks'?' is-active':'')+'" onclick="setAreaTab(\'racks\')">ชั้นวาง</button>'
        +'<button class="seg-item'+(state.areaTab==='locs'?' is-active':'')+'" onclick="setAreaTab(\'locs\')">ตำแหน่งตรง</button></div>';
    }
    var htitle = state.areaTab==='locs' ? '<i data-lucide="map-pin"></i>ตำแหน่งใต้พื้นที่โดยตรง <span class="tag is-on"><i data-lucide="git-branch"></i>flexible parent</span>' : '<i data-lucide="rows-3"></i>ชั้นวางในพื้นที่';
    head='<div class="card-head"><div class="card-head-title">'+htitle+'</div>'+seg+'</div>';
  }

  return renderDrill()
    +'<div class="card">'+head+filterBar
    +'<div class="table-scroll is-sticky">'+renderTable()+'</div>'
    +renderFooter()+'</div>';
}

/* ---------- table per level ---------- */
function paginate(arr){
  var ps=state.pagination.pageSize, pg=state.pagination.page;
  var total=arr.length, totalPages=Math.max(1,Math.ceil(total/ps));
  if(pg>totalPages) pg=totalPages;
  var start=(pg-1)*ps;
  return {rows:arr.slice(start,start+ps), total:total, page:pg, totalPages:totalPages, start: total===0?0:start+1, end:Math.min(start+ps,total)};
}
function actionCell(inner){ return '<td onclick="event.stopPropagation()" style="text-align:right;white-space:nowrap">'+inner+'</td>'; }
function rowActionsNode(kind,id){
  var p=perms();
  return '<div class="row-actions">'
    +'<button class="ra-btn" onclick="openViewNode(\''+kind+'\',\''+id+'\')" title="รายละเอียด"><i data-lucide="panel-right-open" class="w-4 h-4"></i></button>'
    +'<button class="ra-btn'+(p.create?'':' is-disabled')+'" '+(p.create?'onclick="openNodeEdit(\''+kind+'\',\''+id+'\')"':'title="ไม่มีสิทธิ์แก้ไข" disabled')+' title="แก้ไข"><i data-lucide="pencil" class="w-4 h-4"></i></button>'
    +'<button class="ra-btn is-danger'+(p.del?'':' is-disabled')+'" '+(p.del?'onclick="askDeleteNode(\''+kind+'\',\''+id+'\')"':'title="จัดเก็บได้เฉพาะผู้จัดการ/ผู้ดูแลระบบ" disabled')+' title="จัดเก็บ"><i data-lucide="archive" class="w-4 h-4"></i></button>'
    +'</div>';
}
function rowActionsLoc(id){
  var p=perms();
  return '<div class="row-actions">'
    +'<button class="ra-btn'+(p.create?'':' is-disabled')+'" '+(p.create?'onclick="openLocEdit(\''+id+'\')"':'title="ไม่มีสิทธิ์แก้ไข" disabled')+' title="แก้ไข"><i data-lucide="pencil" class="w-4 h-4"></i></button>'
    +'<button class="ra-btn is-danger'+(p.del?'':' is-disabled')+'" '+(p.del?'onclick="askDecommission(\''+id+'\')"':'title="ปลดระวางได้เฉพาะผู้จัดการ/ผู้ดูแลระบบ" disabled')+' title="ปลดระวาง"><i data-lucide="archive-x" class="w-4 h-4"></i></button>'
    +'</div>';
}
function typePillHtml(t){ return '<span class="type-pill"><i data-lucide="'+(TYPE_ICON[t]||'box')+'" class="w-3 h-3"></i>'+typeLabel(t)+'</span>'; }
function pillHtml(s){ return '<span class="pill '+statusPill(s)+'">'+statusLabel(s)+'</span>'; }
function locFlagsHtml(l){
  function chip(on,ic,lb){ return '<span class="flag-chip'+(on?' on':'')+'" title="'+lb+'"><i data-lucide="'+ic+'" class="w-3 h-3"></i></span>'; }
  return '<span class="flags-row">'+chip(l.pickable,'hand','หยิบได้')+chip(l.putawayable,'package-plus','วางได้')+chip(l.replenishable,'refresh-cw','เติมเต็มได้')+'</span>';
}

function renderTable(){
  var lvl=curLevel();
  var pg=paginate(listRows());
  var rows=pg.rows;
  if(rows.length===0) return renderTableHead(lvl)+'</table>'+renderEmpty();

  var body='';
  if(lvl==='root'){
    body=rows.map(function(w){
      return '<tr class="is-clickable" onclick="drillInto(\'warehouse\',\''+w.id+'\')">'
        +'<td class="mono">'+esc(w.code)+'</td>'
        +'<td>'+esc(w.name)+'</td>'
        +'<td>'+esc(branchName(w.branch_id))+'</td>'
        +'<td><span class="cell-truncate" title="'+esc(waddr(w))+'">'+esc(waddr(w))+'</span></td>'
        +'<td class="col-num"><span class="num">'+zonesOf(w.id).length+'</span></td>'
        +'<td>'+pillHtml(w.status)+'</td>'
        +actionCell(rowActionsNode('warehouse',w.id))+'</tr>';
    }).join('');
  } else if(lvl==='warehouse'){
    body=rows.map(function(z){
      var temp = z.temp_controlled ? '<span class="temp-badge"><i data-lucide="snowflake"></i>'+z.temp_min+'–'+z.temp_max+'°C</span>' : '<span class="text-mute-2">ปกติ</span>';
      return '<tr class="is-clickable" onclick="drillInto(\'zone\',\''+z.id+'\')">'
        +'<td class="mono">'+esc(z.code)+'</td><td>'+esc(z.name)+'</td>'
        +'<td>'+temp+'</td>'
        +'<td class="col-num"><span class="num">'+areasOf(z.id).length+'</span></td>'
        +'<td>'+pillHtml(z.status)+'</td>'
        +actionCell(rowActionsNode('zone',z.id))+'</tr>';
    }).join('');
  } else if(lvl==='zone'){
    body=rows.map(function(a){
      var d = a.allows_direct ? '<span class="tag is-yes"><i data-lucide="check"></i>วางตำแหน่งตรงได้</span>' : '<span class="tag is-no">ต้องผ่าน Rack</span>';
      return '<tr class="is-clickable" onclick="drillInto(\'area\',\''+a.id+'\')">'
        +'<td class="mono">'+esc(a.code)+'</td><td>'+esc(a.name)+'</td>'
        +'<td>'+d+'</td>'
        +'<td class="col-num"><span class="num">'+racksOf(a.id).length+'</span></td>'
        +'<td class="col-num"><span class="num">'+locsOfAreaDirect(a.id).length+'</span></td>'
        +'<td>'+pillHtml(a.status)+'</td>'
        +actionCell(rowActionsNode('area',a.id))+'</tr>';
    }).join('');
  } else if(lvl==='area' && state.areaTab==='racks'){
    body=rows.map(function(r){
      return '<tr class="is-clickable" onclick="drillInto(\'rack\',\''+r.id+'\')">'
        +'<td class="mono">'+esc(r.code)+'</td><td>'+esc(r.name)+'</td>'
        +'<td class="num">'+r.rows+' × '+r.cols+' × '+r.levels+'</td>'
        +'<td class="col-num"><span class="num">'+locsOfRack(r.id).length+'</span></td>'
        +'<td>'+pillHtml(r.status)+'</td>'
        +actionCell(rowActionsNode('rack',r.id))+'</tr>';
    }).join('');
  } else { // locations (rack level or area direct)
    body=rows.map(function(l){
      var parentBadge = l.parent_type==='rack' ? ('Rack '+esc(rack(l.rack_id)?rack(l.rack_id).code:'—')) : ('Area '+esc(area(l.area_id)?area(l.area_id).code:'—'));
      return '<tr class="is-clickable" onclick="openViewLoc(\''+l.id+'\')">'
        +'<td class="mono">'+esc(l.code)+'</td>'
        +'<td>'+(l.name?esc(l.name):'<span class="text-mute-2">—</span>')+'</td>'
        +'<td>'+typePillHtml(l.type)+'</td>'
        +'<td class="num">'+fmtNumber(l.cap_val)+' '+esc(l.cap_uom)+'</td>'
        +'<td>'+rotLabel(l.rotation)+'</td>'
        +'<td>'+pillHtml(l.status)+'</td>'
        +actionCell(rowActionsLoc(l.id))+'</tr>';
    }).join('');
  }
  return renderTableHead(lvl)+'<tbody>'+body+'</tbody></table>';
}
function renderTableHead(lvl){
  var cols;
  if(lvl==='root') cols=['รหัส','ชื่อคลัง','สาขา','ที่อยู่','<span class="col-num" style="display:block;text-align:right">โซน</span>','สถานะ',''];
  else if(lvl==='warehouse') cols=['รหัส','ชื่อโซน','อุณหภูมิ','<span style="display:block;text-align:right">พื้นที่</span>','สถานะ',''];
  else if(lvl==='zone') cols=['รหัส','ชื่อพื้นที่','วางตำแหน่งตรง?','<span style="display:block;text-align:right">ชั้นวาง</span>','<span style="display:block;text-align:right">ตำแหน่งตรง</span>','สถานะ',''];
  else if(lvl==='area'&&state.areaTab==='racks') cols=['รหัส','ชื่อชั้นวาง','ขนาด (R×C×L)','<span style="display:block;text-align:right">ตำแหน่ง</span>','สถานะ',''];
  else cols=['รหัส','ชื่อ','ประเภท','ความจุ','หมุนเวียน','สถานะ',''];
  var isNum=function(h){ return h.indexOf('text-align:right')>=0; };
  return '<table class="table"><thead><tr>'+cols.map(function(c){ return '<th'+(isNum(c)?' class="col-num"':'')+'>'+c+'</th>'; }).join('')+'</tr></thead>';
}
function renderEmpty(){
  var filtered = state.filters.search || state.filters.type!=='all' || state.filters.status!=='all' || (curLevel()==='root'&&state.branchFilter);
  if(filtered) return emptyStateHTML({icon:'search-x',title:'ไม่พบรายการที่ค้นหา',desc:'ลองปรับคำค้นหรือล้างตัวกรอง',actionLabel:'ล้างตัวกรอง',actionIcon:'rotate-ccw',onAction:'resetFilters()'});
  var p=perms();
  var lbl=levelChildLabel();
  return emptyStateHTML({icon:'inbox',title:'ยังไม่มี'+lbl,desc:p.create?('เริ่มต้นด้วยการสร้าง'+lbl+'แรกของคุณ'):('ยังไม่มีข้อมูลในระดับนี้'),actionLabel:p.create?createLabel():'',actionIcon:'plus',onAction:'onCreate()'});
}
function renderFooter(){
  var pg=paginate(listRows());
  var nums=[]; for(var i=1;i<=pg.totalPages;i++) nums.push(i);
  return '<div class="table-footer"><div><select class="select pagesize-select" onchange="setPageSize(this.value)">'
    +[10,20,50].map(function(n){return '<option value="'+n+'"'+(state.pagination.pageSize===n?' selected':'')+'>'+n+' / หน้า</option>';}).join('')
    +'</select></div><div style="display:flex;align-items:center;gap:16px"><span>'+pg.start+' – '+pg.end+' จาก '+fmtNumber(pg.total)+' รายการ</span>'
    +'<div class="pagination"><button class="pg-btn'+(pg.page<=1?' is-disabled':'')+'" onclick="goToPage('+(pg.page-1)+')"><i data-lucide="chevron-left" class="w-3 h-3"></i></button>'
    +nums.map(function(n){return '<button class="pg-btn'+(n===pg.page?' is-active':'')+'" onclick="goToPage('+n+')">'+n+'</button>';}).join('')
    +'<button class="pg-btn'+(pg.page>=pg.totalPages?' is-disabled':'')+'" onclick="goToPage('+(pg.page+1)+')"><i data-lucide="chevron-right" class="w-3 h-3"></i></button></div></div></div>';
}

/* =====================================================================
   LIST INTERACTIONS
   ===================================================================== */
function setRole(r){ state.role=r; render(); }
function setSearch(v){ state.filters.search=v; state.pagination.page=1; render(); }
function setFilter(k,v){ state.filters[k]=v; state.pagination.page=1; render(); }
function resetFilters(){ state.filters={search:'',type:'all',status:'all'}; if(curLevel()==='root') state.branchFilter=null; state.pagination.page=1; render(); }
function setPageSize(v){ state.pagination.pageSize=+v; state.pagination.page=1; render(); }
function goToPage(n){ var pg=paginate(listRows()); if(n<1||n>pg.totalPages) return; state.pagination.page=n; render(); }
function setAreaTab(t){ state.areaTab=t; state.filters={search:'',type:'all',status:'all'}; state.pagination.page=1; render(); }
function resetDrill(){ state.drill={wh:null,zone:null,area:null,rack:null}; state.areaTab='racks'; resetFilters(); }
function drillInto(kind,id){
  if(kind==='warehouse'){ state.drill={wh:id,zone:null,area:null,rack:null}; }
  else if(kind==='zone'){ state.drill.zone=id; state.drill.area=null; state.drill.rack=null; }
  else if(kind==='area'){ state.drill.area=id; state.drill.rack=null; state.areaTab='racks'; }
  else if(kind==='rack'){ state.drill.rack=id; }
  state.filters={search:'',type:'all',status:'all'}; state.pagination.page=1; render();
}
function drillTo(target){
  if(target==='root') return resetDrill();
  if(target==='warehouse'){ state.drill.zone=null; state.drill.area=null; state.drill.rack=null; }
  else if(target==='zone'){ state.drill.area=null; state.drill.rack=null; }
  else if(target==='area'){ state.drill.rack=null; state.areaTab='racks'; }
  state.filters={search:'',type:'all',status:'all'}; state.pagination.page=1; render();
}
function onCreate(){
  var lvl=curLevel();
  if(lvl==='root') openNodeCreate('warehouse');
  else if(lvl==='warehouse') openNodeCreate('zone');
  else if(lvl==='zone') openNodeCreate('area');
  else if(lvl==='area') { if(state.areaTab==='locs') openLocCreate('area',state.drill.area); else openNodeCreate('rack'); }
  else if(lvl==='rack') openLocCreate('rack',state.drill.rack);
}

/* =====================================================================
   DRAWER (open/close + router)
   ===================================================================== */
function setDrawerWidth(standard){ var d=document.getElementById('drawer'); d.className='drawer'+(standard?' standard':''); }
function openDrawerView(cfg, standard){
  state.errors={};
  state.drawer = Object.assign({open:true,view:null,mode:null,level:null,id:null,step:1,tab:'overview'}, cfg);
  setDrawerWidth(standard);
  render();
  requestAnimationFrame(function(){
    document.getElementById('drawerBackdrop').classList.add('is-open');
    document.getElementById('drawer').classList.add('is-open');
  });
}
function closeDrawer(){
  document.getElementById('drawerBackdrop').classList.remove('is-open');
  document.getElementById('drawer').classList.remove('is-open');
  setTimeout(function(){ state.drawer={open:false,view:null,mode:null,level:null,id:null,step:1,tab:'overview'}; render(); },280);
}
function openModal(type,data){ state.modal={open:true,type:type,data:data||{}}; render(); requestAnimationFrame(function(){ document.getElementById('modalBackdrop').classList.add('is-open'); }); }
function closeModal(){ document.getElementById('modalBackdrop').classList.remove('is-open'); setTimeout(function(){ state.modal={open:false,type:null,data:null}; render(); },200); }

/* node create/edit openers */
function openNodeCreate(level){
  var f={code:'',name:'',status:'active'};
  if(level==='warehouse') Object.assign(f,{branch_id:null,addr_line:'',province:'',district:'',subdistrict:'',postcode:''});
  if(level==='zone') Object.assign(f,{warehouse_id:state.drill.wh||null,temp_controlled:false,temp_min:'',temp_max:''});
  if(level==='area') Object.assign(f,{zone_id:state.drill.zone||null,allows_direct:false});
  if(level==='rack') Object.assign(f,{area_id:state.drill.area||null,rows:4,cols:12,levels:4});
  state.form=f;
  openDrawerView({view:'node-form',mode:'create',level:level}, true);
}
function openNodeEdit(level,id){
  var rec = level==='warehouse'?wh(id): level==='zone'?zone(id): level==='area'?area(id):rack(id);
  state.form=JSON.parse(JSON.stringify(rec));
  if(level==='zone'){ state.form.temp_min=rec.temp_min==null?'':rec.temp_min; state.form.temp_max=rec.temp_max==null?'':rec.temp_max; }
  openDrawerView({view:'node-form',mode:'edit',level:level,id:id}, true);
}
function openLocCreate(parentType,parentId){
  state.form=mkLoc({id:null,code:'',parent_type:parentType, rack_id:parentType==='rack'?parentId:null, area_id:parentType==='area'?parentId:null});
  openDrawerView({view:'loc-form',mode:'create',step:1}, false);
}
function openLocEdit(id){ state.form=JSON.parse(JSON.stringify(loc(id))); openDrawerView({view:'loc-form',mode:'edit',id:id,step:1}, false); }
function openViewNode(kind,id){ openDrawerView({view:'view-node',level:kind,id:id}, true); }
function openViewLoc(id){ openDrawerView({view:'view-loc',id:id,tab:'overview'}, false); }
function openBulk(){
  state.form={ target_area:state.drill.area||null, rackPat:'R-{n}', rackQty:5, rows:4, cols:12, levels:4, locPat:'{rack}-R{r}-C{c}-L{l}', type:'RESERVE', cap_uom:'pallet', cap_val:1, rotation:'fifo' };
  openDrawerView({view:'bulk'}, false);
}

function renderDrawer(){
  switch(state.drawer.view){
    case 'node-form': return renderNodeForm();
    case 'loc-form':  return renderLocForm();
    case 'view-node': return renderViewNode();

function renderViewNode(){

  var meta={warehouse:{ic:'warehouse',lbl:'คลัง'},zone:{ic:'layout-grid',lbl:'โซน'},area:{ic:'square-dashed',lbl:'พื้นที่'},rack:{ic:'rows-3',lbl:'ชั้นวาง'}}[kind];

  var fields='';
  if(kind==='warehouse') fields=defRow('สาขา',esc(branchName(rec.branch_id)))+defRow('ที่อยู่',esc(waddr(rec)))+defRow('รหัสไปรษณีย์',esc(rec.postcode||'—'));
  else if(kind==='zone') fields=defRow('คลัง',esc(whCode(rec.warehouse_id)))+defRow('ควบคุมอุณหภูมิ',rec.temp_controlled?('ใช่ ('+rec.temp_min+'–'+rec.temp_max+'°C)'):'ไม่');
  else if(kind==='area') fields=defRow('โซน',esc(zoneCode(rec.zone_id)))+defRow('วางตำแหน่งตรง',rec.allows_direct?'อนุญาต':'ไม่อนุญาต (ต้องผ่านชั้นวาง)');
  else fields=defRow('พื้นที่',esc(areaCode(rec.area_id)))+defRow('ขนาดกริด',rec.rows+' × '+rec.cols+' × '+rec.levels+' (R×C×L)');

  // child stats
  var cs='';
  if(kind==='warehouse') cs=childStat('โซน',zonesOf(id).length);
  else if(kind==='zone') cs=childStat('พื้นที่',areasOf(id).length);
  else if(kind==='area') cs=childStat('ชั้นวาง',racksOf(id).length)+childStat('ตำแหน่งตรง',locsOfAreaDirect(id).length);
  else cs=childStat('ตำแหน่ง',locsOfRack(id).length);

  var archived = rec.status==='archived';
  var actions='<div class="drawer-header-actions">'
    +((p.create&&!archived)?'<button class="btn btn-sm btn-secondary" onclick="openNodeEdit(\''+kind+'\',\''+id+'\')"><i data-lucide="pencil" class="w-3.5 h-3.5"></i><span>แก้ไข</span></button>':'')
    +((p.del&&!archived)?'<button class="btn btn-sm btn-danger" onclick="askDeleteNode(\''+kind+'\',\''+id+'\')"><i data-lucide="archive" class="w-3.5 h-3.5"></i><span>จัดเก็บ</span></button>':'')
    +'<span class="drawer-header-divider"></span><button class="icon-btn" onclick="closeDrawer()"><i data-lucide="x" class="w-4 h-4"></i></button></div>';

  var head='<div class="dw-head"><div class="dw-head-row"><div>'
    +'<div class="dw-eyebrow"><i data-lucide="'+meta.ic+'" class="w-3.5 h-3.5"></i>'+meta.lbl+'</div>'
    +'<div style="display:flex;align-items:center;gap:8px"><h2 class="dw-title mono">'+esc(rec.code)+'</h2>'+pillHtml(rec.status)+'</div>'
    +'<div class="dw-sub">'+esc(rec.name)+'</div></div>'+actions+'</div></div>';

  var drill = '<button class="btn btn-secondary drill-child-btn" onclick="drillFromView(\''+kind+'\',\''+id+'\')"><i data-lucide="corner-down-right" class="w-4 h-4"></i><span>ดูรายการลูก (เจาะลงระดับถัดไป)</span></button>';

  var body='<div class="drawer-body">'
    +'<div class="drawer-section"><div class="drawer-section-title">Full Path</div><div class="path-str">'+fullPathStr(kind,id)+'</div></div>'
    +'<div class="drawer-section"><div class="drawer-section-title">ข้อมูล</div><div class="def-grid">'+defRow('รหัส','<span class="mono">'+esc(rec.code)+'</span>')+defRow('ชื่อ',esc(rec.name))+fields+defRow('สถานะ',pillHtml(rec.status))+'</div></div>'
    +'<div class="drawer-section"><div class="drawer-section-title">จำนวนรายการลูก</div><div class="child-stats">'+cs+'</div>'+drill+'</div>'
    +'</div>';
  var footer='<div class="drawer-footer"><div class="drawer-footer-meta">สร้างเมื่อ '+fmtDate(rec.created)+'</div><div class="footer-spacer"></div><button class="btn btn-secondary" onclick="closeDrawer()">ปิด</button></div>';
  return head+body+footer;
}

function viewLocCapacity(l,p){

      +(LOC_REQUIRE_BARCODE&&!l.barcode?'<div class="inline-warn"><i data-lucide="alert-triangle"></i><div>ตำแหน่งนี้ยังไม่มีบาร์โค้ด จึงยังเปิดใช้งานไม่ได้ — เพิ่มบาร์โค้ดก่อน แล้วปุ่มเปิดใช้งานจะกดได้</div></div>':'')

    +defRow('ความจุ','<span class="num">'+fmtNumber(l.cap_val)+'</span> '+esc(l.cap_uom))

/* =====================================================================
   BULK GENERATE DRAWER
   ===================================================================== */
function bulkCalc(){
  var f=state.form;
  var per = (parseInt(f.rows,10)||0)*(parseInt(f.cols,10)||0)*(parseInt(f.levels,10)||0);
  var qty = parseInt(f.rackQty,10)||0;
  return { per:per, qty:qty, total:qty*per };
}
function bulkSampleCode(f){ return String(f.locPat||'').replace(/\{rack\}/g,(f.rackPat||'').replace(/\{n\}/g,'1')).replace(/\{r\}/g,'1').replace(/\{c\}/g,'1').replace(/\{l\}/g,'1'); }
function bulkCollisions(){
  var f=state.form; if(!f.target_area) return [];
  var c=bulkCalc(); if(c.total<=0) return [];
  var existing={}; racksOf(f.target_area).forEach(function(r){ locsOfRack(r.id).forEach(function(l){ existing[l.code]=true; }); });
  var gen={}, collide=[];
  for(var rk=1;rk<=c.qty;rk++){
    var rcode=(f.rackPat||'').replace(/\{n\}/g,rk);
    for(var rr=1;rr<=(parseInt(f.rows,10)||0);rr++) for(var cc=1;cc<=(parseInt(f.cols,10)||0);cc++) for(var ll=1;ll<=(parseInt(f.levels,10)||0);ll++){
      var code=(f.locPat||'').replace(/\{rack\}/g,rcode).replace(/\{r\}/g,rr).replace(/\{c\}/g,cc).replace(/\{l\}/g,ll);
      if(existing[code]||gen[code]) collide.push(code); gen[code]=true;
    }
  }
  return collide.slice(0,20);
}
function renderBulk(){
  var f=state.form, c=bulkCalc(), collide=bulkCollisions();
  var blockZero = c.total<=0;
  var blockCollide = collide.length>0;
  var canConfirm = perms().create && !blockZero && !blockCollide && f.target_area;
  var body='<div class="form-section"><div class="form-section-title">เป้าหมาย</div>'
    +fld('target_area','พื้นที่ปลายทาง (Area)',true, searchSelectHTML('btarget',{placeholder:'เลือกพื้นที่ที่จะสร้างชั้นวาง'}))
    +'</div>'
    +'<div class="form-section"><div class="form-section-title">แม่แบบชั้นวาง (Rack)</div>'
    +'<div class="field-row">'+fld('rackPat','รูปแบบรหัสชั้นวาง',true,txt('rackPat','เช่น R-{n}'),'{n} = ลำดับชั้นวาง')+fld('rackQty','จำนวนชั้นวาง',true,numI('rackQty'))+'</div>'
    +'<div class="field-row">'+fld('rows','แถว (Rows)',true,numI('rows'))+fld('cols','คอลัมน์ (Cols)',true,numI('cols'))+fld('levels','ชั้น (Levels)',true,numI('levels'))+'</div>'
    +'</div>'
    +'<div class="form-section"><div class="form-section-title">แม่แบบตำแหน่ง</div>'
    +fld('locPat','รูปแบบรหัสตำแหน่ง',true,txt('locPat','เช่น {rack}-R{r}-C{c}-L{l}'),'{rack} {r} {c} {l} = โทเคน')
    +'<div class="field-row">'
    +fld('type','ประเภท',true,'<select class="select" id="f-type">'+TYPES.map(function(t){return '<option value="'+t+'"'+(f.type===t?' selected':'')+'>'+typeLabel(t)+'</option>';}).join('')+'</select>')
    +fld('cap_uom','หน่วยความจุ',true,'<select class="select" id="f-cap_uom">'+UOMS.map(function(u){return '<option value="'+u+'"'+(f.cap_uom===u?' selected':'')+'>'+u+'</option>';}).join('')+'</select>')
    +fld('cap_val','ความจุ',true,numI('cap_val','> 0'))
    +fld('rotation','หมุนเวียน',true,'<select class="select" id="f-rotation">'+ROTATIONS.map(function(r){return '<option value="'+r[0]+'"'+(f.rotation===r[0]?' selected':'')+'>'+r[1]+'</option>';}).join('')+'</select>')
    +'</div></div>'
    +'<div class="form-section"><div class="form-section-title">ตัวอย่างก่อนสร้าง (Preview)</div>'
    +'<div class="bulk-sample">ตัวอย่างรหัสแรก: <span class="code-sample">'+esc(bulkSampleCode(f)||'—')+'</span></div>'
    +'<div class="preview-box"><div><div class="preview-lbl">จะสร้างทั้งหมด</div><div class="preview-num">'+fmtNumber(c.qty)+' ชั้นวาง × '+fmtNumber(c.per)+' = '+fmtNumber(c.total)+'</div></div><div style="text-align:right"><div class="preview-lbl">ตำแหน่ง</div><i data-lucide="layers" class="w-5 h-5"></i></div></div>'
    +(blockZero?'<div class="inline-warn"><i data-lucide="alert-triangle"></i><div>แม่แบบไม่ถูกต้อง — จำนวนที่จะสร้างต้องมากกว่า 0 (ตรวจ rows/cols/levels/จำนวนชั้นวาง)</div></div>':'')
    +(blockCollide?'<div class="collision-box collision-mt"><b>พบรหัสชน '+collide.length+' รายการ</b> — การสร้างถูกบล็อก (atomic ไม่มี partial commit):<br>'+collide.map(esc).join(', ')+'</div>':'')
    +'</div>';
  var footer='<div class="dw-footer"><div></div><div class="dw-footer-right">'
    +'<button class="btn btn-ghost" onclick="closeDrawer()">ยกเลิก</button>'
    +'<button class="btn btn-primary'+(canConfirm?'':' is-disabled')+'" id="btn-submit" '+(canConfirm?'onclick="submitBulk()"':'disabled')+'><i data-lucide="layers" class="w-4 h-4"></i><span>สร้าง '+fmtNumber(c.total)+' ตำแหน่ง</span></button>'
    +'</div></div>';
  return drawerHead('layers','สร้างจำนวนมาก (Bulk Generate)','สร้างชั้นวาง + ตำแหน่งจากแม่แบบ')
    +'<div class="drawer-body" onchange="captureBulkAndRender(event)">'+body+'</div>'+footer;
}
function captureBulkAndRender(e){
  // recompute preview when any input changes (onchange = on blur, safe for focus)
  if(e && e.target && (e.target.tagName==='INPUT'||e.target.tagName==='SELECT')){ captureForm(); render(); }
}

function submitBtnLoading(){ var b=document.getElementById('btn-submit'); if(b){ b.disabled=true; b.innerHTML='<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>'; renderIcons(); } }
function genId(prefix){ return prefix+'-'+Date.now().toString().slice(-6); }

function submitNode(){
  captureForm(); var f=state.form, lvl=state.drawer.level, mode=state.drawer.mode, id=state.drawer.id; var err={};
  if(!f.code||!f.code.trim()) err.code='กรุณากรอกรหัส';
  if(!f.name||!f.name.trim()) err.name='กรุณากรอกชื่อ';
  // uniqueness within parent
  function dup(arr,parentKey,parentVal){ return arr.some(function(x){ return x.id!==id && x.code.toLowerCase()===(f.code||'').toLowerCase() && (parentKey?x[parentKey]===parentVal:true); }); }
  if(lvl==='warehouse'){ if(!f.branch_id) err.branch_id='กรุณาเลือกสาขา'; if(!err.code&&dup(WAREHOUSES,null,null)) err.code='รหัสซ้ำในระบบ'; }
  if(lvl==='zone'){ if(!f.warehouse_id) err.warehouse_id='กรุณาเลือกคลัง'; if(!err.code&&dup(ZONES,'warehouse_id',f.warehouse_id)) err.code='รหัสซ้ำภายในคลังเดียวกัน';
    if(f.temp_controlled){ if(f.temp_min===''||f.temp_max==='') err.temp_min='กรุณากรอกช่วงอุณหภูมิ'; else if(Number(f.temp_min)>Number(f.temp_max)) err.temp_min='อุณหภูมิต่ำสุดต้องไม่เกินสูงสุด'; } }
  if(lvl==='area'){ if(!f.zone_id) err.zone_id='กรุณาเลือกโซน'; if(!err.code&&dup(AREAS,'zone_id',f.zone_id)) err.code='รหัสซ้ำภายในโซนเดียวกัน';
    // BR-007: cannot turn off allows_direct while direct locations exist
    if(mode==='edit'&&!f.allows_direct){ var orig=area(id); if(orig&&orig.allows_direct&&locsOfAreaDirect(id).length>0) err.allows_direct='ปิด allows_direct ไม่ได้ — ยังมีตำแหน่งวางตรงอยู่ '+locsOfAreaDirect(id).length+' รายการ'; } }
  if(lvl==='rack'){ if(!f.area_id) err.area_id='กรุณาเลือกพื้นที่'; if(!err.code&&dup(RACKS,'area_id',f.area_id)) err.code='รหัสซ้ำภายในพื้นที่เดียวกัน'; }
  state.errors=err;
  if(Object.keys(err).length){ render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน','warning'); return; }
  submitBtnLoading();
  setTimeout(function(){
    if(mode==='create'){
      var nid=genId(lvl.toUpperCase());
      if(lvl==='warehouse'){ WAREHOUSES.push({id:nid,code:f.code,name:f.name,branch_id:f.branch_id,addr_line:f.addr_line,province:f.province,district:f.district,subdistrict:f.subdistrict,postcode:f.postcode,status:'active',created:new Date().toISOString()}); }
      else if(lvl==='zone'){ ZONES.push({id:nid,code:f.code,name:f.name,warehouse_id:f.warehouse_id,temp_controlled:!!f.temp_controlled,temp_min:f.temp_controlled?Number(f.temp_min):null,temp_max:f.temp_controlled?Number(f.temp_max):null,status:'active',created:new Date().toISOString()}); }
      else if(lvl==='area'){ AREAS.push({id:nid,code:f.code,name:f.name,zone_id:f.zone_id,allows_direct:!!f.allows_direct,status:'active',created:new Date().toISOString()}); }
      else { RACKS.push({id:nid,code:f.code,name:f.name,area_id:f.area_id,rows:parseInt(f.rows,10)||0,cols:parseInt(f.cols,10)||0,levels:parseInt(f.levels,10)||0,status:'active',created:new Date().toISOString()}); }
      logAudit(nid,'สร้าง'+lvl,'สร้าง '+f.code);
      closeDrawer(); showToast('สร้าง'+({warehouse:'คลัง',zone:'โซน',area:'พื้นที่',rack:'ชั้นวาง'}[lvl])+' "'+f.code+'" สำเร็จ','success');
    } else {
      var rec = lvl==='warehouse'?wh(id): lvl==='zone'?zone(id): lvl==='area'?area(id):rack(id);
      Object.assign(rec,{code:f.code,name:f.name});
      if(lvl==='warehouse') Object.assign(rec,{branch_id:f.branch_id,addr_line:f.addr_line,province:f.province,district:f.district,subdistrict:f.subdistrict,postcode:f.postcode});
      if(lvl==='zone') Object.assign(rec,{warehouse_id:f.warehouse_id,temp_controlled:!!f.temp_controlled,temp_min:f.temp_controlled?Number(f.temp_min):null,temp_max:f.temp_controlled?Number(f.temp_max):null});
      if(lvl==='area') Object.assign(rec,{zone_id:f.zone_id,allows_direct:!!f.allows_direct});
      if(lvl==='rack') Object.assign(rec,{area_id:f.area_id,rows:parseInt(f.rows,10)||0,cols:parseInt(f.cols,10)||0,levels:parseInt(f.levels,10)||0});
      logAudit(id,'แก้ไข'+lvl,'แก้ไข '+f.code);
      closeDrawer(); showToast('บันทึกการแก้ไขแล้ว','success');
    }
    render();
  },500);
}

function locStep(n){
  captureForm(); var f=state.form;
  if(n===2){
    var err={};
    if(f.parent_type==='rack'){ if(!f.rack_id) err.rack='กรุณาเลือกชั้นวาง'; }
    else { if(!f.area_id) err.area='กรุณาเลือกพื้นที่'; else { var a=area(f.area_id); if(a&&!a.allows_direct) err.area='พื้นที่นี้ allows_direct = false — เลือกพื้นที่อื่น หรือเพิ่มชั้นวางก่อน'; } }
    if(!f.code||!f.code.trim()) err.code='กรุณากรอกรหัสตำแหน่ง';
    state.errors=err;
    if(Object.keys(err).length){ render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน','warning'); return; }
  }
  state.errors={}; state.drawer.step=n; render();
}
function submitLoc(){
  captureForm(); var f=state.form, mode=state.drawer.mode, id=state.drawer.id; var err={};
  if(!(Number(f.cap_val)>0)) err.cap_val='ความจุต้องมากกว่า 0';
  // dup code within parent
  var siblings = f.parent_type==='rack'?locsOfRack(f.rack_id):locsOfAreaDirect(f.area_id);
  if(siblings.some(function(x){ return x.id!==id && x.code.toLowerCase()===(f.code||'').toLowerCase(); })) err.cap_val=err.cap_val||''; // ensure step2 shows
  var dupCode = siblings.some(function(x){ return x.id!==id && x.code.toLowerCase()===(f.code||'').toLowerCase(); });
  state.errors=err;
  if(Object.keys(err).length && err.cap_val){ render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน','warning'); return; }
  if(dupCode){ state.drawer.step=1; state.errors={code:'รหัสซ้ำภายใน parent เดียวกัน'}; render(); showToast('รหัสซ้ำภายใน parent เดียวกัน','warning'); return; }
  // AD-5 / FN-19: reparent guard — block moving a location that still holds stock (mirror decommission "must be empty" gate)
  if(mode==='edit'){
    var cur=loc(id);
    if(cur){
      var parentChanged = (cur.parent_type!==f.parent_type) || (f.parent_type==='rack' ? cur.rack_id!==f.rack_id : cur.area_id!==f.area_id);
      if(parentChanged && cur.hasStock){
        state.drawer.step=1;
        state.errors = (f.parent_type==='rack') ? {rack:'ต้องย้ายสต็อกออกก่อนย้ายตำแหน่ง (stock = 0)'} : {area:'ต้องย้ายสต็อกออกก่อนย้ายตำแหน่ง (stock = 0)'};
        render(); showToast('ต้องย้ายสต็อกออกก่อนย้ายตำแหน่ง (stock = 0)','warning'); return;
      }
    }
  }
  submitBtnLoading();
  setTimeout(function(){
    // barcode-before-activate gate (BR-014): no barcode -> created inactive
    var finalStatus = f.status || 'active';
    if(mode==='create'){ finalStatus = (LOC_REQUIRE_BARCODE && !(f.barcode||'').trim()) ? 'inactive' : 'active'; }
    if(mode==='create'){
      var nid=genId('LOC');
      var rec=mkLoc({id:nid,code:f.code,name:f.name,parent_type:f.parent_type,rack_id:f.parent_type==='rack'?f.rack_id:null,area_id:f.parent_type==='area'?f.area_id:null,type:f.type,cap_uom:f.cap_uom,cap_val:Number(f.cap_val),rotation:f.rotation,row:f.row,col:f.col,level:f.level,position:f.position,pickable:!!f.pickable,putawayable:!!f.putawayable,replenishable:!!f.replenishable,mixed_lot:!!f.mixed_lot,mixed_item:!!f.mixed_item,neg_stock:!!f.neg_stock,barcode:f.barcode,qr:f.qr,status:finalStatus,created:new Date().toISOString()});
      LOCATIONS.push(rec); logAudit(nid,'สร้างตำแหน่ง','สร้าง '+f.code+' ('+typeLabel(f.type)+')'+(finalStatus==='inactive'?' — ยังไม่มีบาร์โค้ด → ปิดใช้':''));
      closeDrawer(); showToast('สร้างตำแหน่ง "'+f.code+'" สำเร็จ'+(finalStatus==='inactive'?' (ปิดใช้ — ต้องเพิ่มบาร์โค้ดก่อนเปิดใช้งาน)':''),'success');
    } else {
      var r0=loc(id);
      Object.assign(r0,{code:f.code,name:f.name,parent_type:f.parent_type,rack_id:f.parent_type==='rack'?f.rack_id:null,area_id:f.parent_type==='area'?f.area_id:null,type:f.type,cap_uom:f.cap_uom,cap_val:Number(f.cap_val),rotation:f.rotation,row:f.row,col:f.col,level:f.level,position:f.position,pickable:!!f.pickable,putawayable:!!f.putawayable,replenishable:!!f.replenishable,mixed_lot:!!f.mixed_lot,mixed_item:!!f.mixed_item,neg_stock:!!f.neg_stock,barcode:f.barcode,qr:f.qr});
      logAudit(id,'แก้ไขตำแหน่ง','แก้ไข '+f.code);
      closeDrawer(); showToast('บันทึกการแก้ไขแล้ว','success');
    }
    render();
  },500);
}

function submitBulk(){
  captureForm(); var f=state.form, c=bulkCalc(); if(!f.target_area||c.total<=0||bulkCollisions().length>0){ showToast('ไม่สามารถสร้างได้ — ตรวจแม่แบบ/รหัสชน','warning'); return; }
  if(!(Number(f.cap_val)>0)){ showToast('ความจุต้องมากกว่า 0','warning'); return; }
  submitBtnLoading();
  setTimeout(function(){
    var newRacks=0,newLocs=0;
    for(var rk=1;rk<=c.qty;rk++){
      var rcode=(f.rackPat||'').replace(/\{n\}/g,rk);
      var rid=genId('RACK');
      RACKS.push({id:rid,code:rcode,name:rcode,area_id:f.target_area,rows:parseInt(f.rows,10)||0,cols:parseInt(f.cols,10)||0,levels:parseInt(f.levels,10)||0,status:'active',created:new Date().toISOString()});
      newRacks++;
      for(var rr=1;rr<=(parseInt(f.rows,10)||0);rr++) for(var cc=1;cc<=(parseInt(f.cols,10)||0);cc++) for(var ll=1;ll<=(parseInt(f.levels,10)||0);ll++){
        var code=(f.locPat||'').replace(/\{rack\}/g,rcode).replace(/\{r\}/g,rr).replace(/\{c\}/g,cc).replace(/\{l\}/g,ll);
        LOCATIONS.push(mkLoc({id:genId('LOC')+'-'+newLocs,code:code,parent_type:'rack',rack_id:rid,type:f.type,cap_uom:f.cap_uom,cap_val:Number(f.cap_val),rotation:f.rotation,row:String(rr),col:String(cc),level:String(ll),status:(LOC_REQUIRE_BARCODE?'inactive':'active'),created:new Date().toISOString()}));
        newLocs++;
      }
    }
    logAudit(f.target_area,'สร้างจำนวนมาก','สร้าง '+newRacks+' ชั้นวาง × '+c.per+' = '+newLocs+' ตำแหน่ง (atomic)');
    closeDrawer(); showToast('สร้าง '+newRacks+' ชั้นวาง × '+c.per+' ตำแหน่งสำเร็จ (atomic)','success');
    render();
  },600);
}

/* =====================================================================

   ===================================================================== */
function setLocStatus(id,ns){
  var l=loc(id); if(!l) return;
  if(ns==='active' && LOC_REQUIRE_BARCODE && !(l.barcode||'').trim()){ showToast('ต้องเพิ่มบาร์โค้ดก่อนถึงจะเปิดใช้งานตำแหน่งได้','warning'); return; }
  var old=l.status; l.status=ns; logAudit(id,'เปลี่ยนสถานะ',statusLabel(old)+' → '+statusLabel(ns),ns==='active'?'success':'warning');
  render(); showToast('เปลี่ยนสถานะเป็น "'+statusLabel(ns)+'" แล้ว','success');
}
function askBlock(id){ openModal('block',{id:id}); }
function askDeleteNode(kind,id){ openModal('delete-node',{kind:kind,id:id}); }
function askDecommission(id){ openModal('decommission',{id:id}); }

function childCount(kind,id){
  // referential-safe guard counts ACTIVE children only — archived nodes / decommissioned locations do not block (GC#7/D11)
  if(kind==='warehouse') return zonesOf(id).filter(function(z){return z.status!=='archived';}).length;
  if(kind==='zone') return areasOf(id).filter(function(a){return a.status!=='archived';}).length;
  if(kind==='area') return racksOf(id).filter(function(r){return r.status!=='archived';}).length + locsOfAreaDirect(id).filter(function(l){return l.status!=='decommissioned';}).length;
  if(kind==='rack') return locsOfRack(id).filter(function(l){return l.status!=='decommissioned';}).length;
  return 0;
}
function renderModal(){
  var t=state.modal.type, d=state.modal.data;
  if(t==='delete-node'){
    var rec = d.kind==='warehouse'?wh(d.id): d.kind==='zone'?zone(d.id): d.kind==='area'?area(d.id):rack(d.id);
    if(!rec) return '';
    var kids=childCount(d.kind,d.id);
    var lbl={warehouse:'คลัง',zone:'โซน',area:'พื้นที่',rack:'ชั้นวาง'}[d.kind];
    var blockMsg={warehouse:'ยังมีโซนใช้งานอยู่ภายใต้คลังนี้ — ต้องจัดเก็บ/ย้ายโซนก่อน',zone:'ยังมีพื้นที่ใช้งานอยู่ภายใต้โซนนี้ — ต้องจัดเก็บ/ย้ายพื้นที่ก่อน',area:'ยังมีชั้นวางหรือตำแหน่งใช้งานอยู่ภายใต้พื้นที่นี้ — ต้องจัดเก็บก่อน',rack:'ยังมีตำแหน่งใช้งานอยู่ภายใต้ชั้นวางนี้ — ต้องจัดเก็บก่อน'}[d.kind];
    if(kids>0){
      return modalShell('is-danger','shield-alert','จัดเก็บ'+lbl+'ไม่ได้','ไม่สามารถจัดเก็บ "'+esc(rec.code)+'" ได้',
        '<div class="collision-box"><b>จัดเก็บไม่ได้ — ยังมีรายการลูกใช้งานอยู่ '+kids+' รายการ</b><br>'+blockMsg+' (referential-safe · BR-005)</div>',
        '<button class="btn btn-secondary" onclick="closeModal()">เข้าใจแล้ว</button>');
    }
    return modalShell('is-warning','archive','จัดเก็บ'+lbl,'คุณกำลังจะจัดเก็บ '+esc(rec.name)+' ('+esc(rec.code)+') — เก็บประวัติไว้ (soft — ไม่ลบถาวร) การกระทำนี้ถูกบันทึกใน audit log',
      '<div class="decomm-note">'+lbl+'จะถูกตั้งเป็น <b>จัดเก็บแล้ว</b> และเก็บประวัติไว้ (soft — ไม่ลบถาวร)</div>','<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="btn-submit" onclick="confirmDeleteNode(\''+d.kind+'\',\''+d.id+'\')"><i data-lucide="archive" class="w-4 h-4"></i><span>จัดเก็บ</span></button>');
  }
  if(t==='decommission'){
    var l=loc(d.id); if(!l) return '';
    if(l.hasStock){
      return modalShell('is-danger','shield-alert','ปลดระวางไม่ได้','ไม่สามารถปลดระวาง "'+esc(l.code)+'" ได้',
        '<div class="collision-box"><b>ต้องย้ายสต็อกออกก่อน</b><br>ตำแหน่งนี้ยังมีสต็อกอยู่ — ต้องย้ายสต็อกออก (stock = 0) ก่อนปลดระวาง (BR-010)</div>',
        '<button class="btn btn-secondary" onclick="closeModal()">เข้าใจแล้ว</button>');
    }
    return modalShell('is-warning','archive-x','ปลดระวางตำแหน่ง','คุณกำลังปลดระวาง '+esc(l.code),
      '<div class="decomm-note">ตำแหน่งจะถูกตั้งเป็น <b>decommissioned</b> และเก็บประวัติไว้ (soft — ไม่ลบถาวร)</div>',
      '<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="btn-submit" onclick="confirmDecommission(\''+d.id+'\')"><i data-lucide="archive-x" class="w-4 h-4"></i><span>ปลดระวาง</span></button>');
  }
  if(t==='block'){
    var lb=loc(d.id); if(!lb) return '';
    return modalShell('is-warning','ban','บล็อกตำแหน่ง','บล็อก '+esc(lb.code)+' — ต้องระบุเหตุผล',
      '<div class="field"><label class="field-label">เหตุผลที่บล็อก <span class="req">*</span></label><input class="input" id="blk-reason" placeholder="เช่น รอซ่อมคานชั้นวาง" value="'+esc(lb.block_reason||'')+'"></div>',
      '<button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" id="btn-submit" onclick="confirmBlock(\''+d.id+'\')"><i data-lucide="ban" class="w-4 h-4"></i><span>บล็อก</span></button>');
  }
  return '';
}
function modalShell(iconMod,icon,title,sub,body,footer){
  return '<div class="modal-header"><div class="modal-header-icon '+iconMod+'"><i data-lucide="'+icon+'" class="w-5 h-5"></i></div>'
    +'<div style="flex:1"><h3 class="modal-title">'+title+'</h3><p class="modal-subtitle">'+sub+'</p></div>'
    +'<button class="icon-btn" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button></div>'
    +(body?'<div class="modal-body">'+body+'</div>':'')
    +'<div class="modal-footer">'+footer+'</div>';
}
function confirmDeleteNode(kind,id){
  // GC#7/D11: SOFT ARCHIVE — keep the record (no hard delete), set status='archived' + WORM audit
  submitBtnLoading();
  setTimeout(function(){
    var lbl={warehouse:'คลัง',zone:'โซน',area:'พื้นที่',rack:'ชั้นวาง'}[kind];
    var rec = kind==='warehouse'?wh(id): kind==='zone'?zone(id): kind==='area'?area(id):rack(id);
    if(rec){ rec.status='archived'; rec.archivedAt=new Date().toISOString(); }
    logAudit(id,'จัดเก็บ'+lbl,statusLabel('active')+' → จัดเก็บแล้ว (archived · soft, เก็บประวัติ)','warning');
    closeModal(); closeDrawer(); showToast('จัดเก็บ'+lbl+'แล้ว','success');
  },500);
}
function confirmDecommission(id){
  submitBtnLoading();
  setTimeout(function(){ var l=loc(id); if(l){ l.status='decommissioned'; logAudit(id,'ปลดระวางตำแหน่ง','active → decommissioned (soft, เก็บประวัติ)','warning'); } closeModal(); closeDrawer(); showToast('ปลดระวางตำแหน่งแล้ว','success'); },500);
}
function confirmBlock(id){
  var reasonEl=document.getElementById('blk-reason'); var reason=reasonEl?reasonEl.value.trim():'';
  if(!reason){ showToast('ระบุเหตุผลที่บล็อก','warning'); return; }
  submitBtnLoading();
  setTimeout(function(){ var l=loc(id); if(l){ l.status='blocked'; l.block_reason=reason; logAudit(id,'บล็อกตำแหน่ง',statusLabel('active')+' → blocked · เหตุผล: '+reason,'warning'); } closeModal(); showToast('บล็อกตำแหน่งแล้ว','success'); },500);
}

function initComboboxes(){
  if(document.getElementById('ss-branchf')){
    initSearchSelect('branchf',{ options:[{value:'',label:'ทุกสาขา',icon:'building-2'}].concat(BRANCHES.map(function(b){return {value:b.id,label:b.name,sub:b.id,icon:'building-2'};})), value:state.branchFilter||'', onSelect:function(v){ state.branchFilter=v||null; state.pagination.page=1; render(); } });
  }
  if(!state.drawer.open) return;
  var v=state.drawer.view, f=state.form;
  if(v==='node-form'){
    if(state.drawer.level==='warehouse'){
      if(document.getElementById('ss-branch')) initSearchSelect('branch',{ options:BRANCHES.map(function(b){return {value:b.id,label:b.name,sub:b.id,icon:'building-2'};}), value:f.branch_id||null, onSelect:function(val){ captureForm(); f.branch_id=val; } });
      if(document.getElementById('ss-prov')) initSearchSelect('prov',{ options:geoProvinces().map(function(p){return {value:p,label:p,icon:'map-pin'};}), value:f.province||null, onSelect:function(val){ captureForm(); f.province=val; f.district='';f.subdistrict='';f.postcode=''; render(); } });
      if(document.getElementById('ss-dist')) initSearchSelect('dist',{ options:geoDistricts(f.province).map(function(x){return {value:x,label:x};}), value:f.district||null, emptyText:'เลือกจังหวัดก่อน', onSelect:function(val){ captureForm(); f.district=val; f.subdistrict='';f.postcode=''; render(); } });
      if(document.getElementById('ss-subd')) initSearchSelect('subd',{ options:geoSubs(f.province,f.district).map(function(x){return {value:x,label:x,right:geoPostcode(f.province,f.district,x)};}), value:f.subdistrict||null, emptyText:'เลือกอำเภอก่อน', onSelect:function(val){ captureForm(); f.subdistrict=val; f.postcode=geoPostcode(f.province,f.district,val); render(); } });
    } else if(state.drawer.level==='zone'){
      if(document.getElementById('ss-wh')) initSearchSelect('wh',{ options:WAREHOUSES.filter(function(w){return w.status==='active';}).map(function(w){return {value:w.id,label:w.code+' — '+w.name,sub:branchName(w.branch_id),icon:'warehouse'};}), value:f.warehouse_id||null, onSelect:function(val){ captureForm(); f.warehouse_id=val; } });
    } else if(state.drawer.level==='area'){
      if(document.getElementById('ss-zone')) initSearchSelect('zone',{ options:ZONES.filter(function(z){return z.status==='active';}).map(function(z){return {value:z.id,label:z.code+' — '+z.name,sub:whCode(z.warehouse_id),icon:'layout-grid'};}), value:f.zone_id||null, onSelect:function(val){ captureForm(); f.zone_id=val; } });
    } else if(state.drawer.level==='rack'){
      if(document.getElementById('ss-area')) initSearchSelect('area',{ options:AREAS.filter(function(a){return a.status==='active';}).map(function(a){return {value:a.id,label:a.code+' — '+a.name,sub:zoneCode(a.zone_id),icon:'square-dashed'};}), value:f.area_id||null, onSelect:function(val){ captureForm(); f.area_id=val; } });
    }
  } else if(v==='loc-form' && state.drawer.step===1){
    if(f.parent_type==='rack' && document.getElementById('ss-rack')) initSearchSelect('rack',{ options:RACKS.filter(function(r){return r.status==='active';}).map(function(r){return {value:r.id,label:r.code+' — '+r.name,sub:'พื้นที่ '+areaCode(r.area_id),icon:'rows-3'};}), value:f.rack_id||null, onSelect:function(val){ captureForm(); f.rack_id=val; f.area_id=null; } });
    if(f.parent_type==='area' && document.getElementById('ss-area')) initSearchSelect('area',{ options:AREAS.filter(function(a){return a.status==='active';}).map(function(a){return {value:a.id,label:a.code+' — '+a.name+(a.allows_direct?'':' (ไม่อนุญาตวางตรง)'),sub:'โซน '+zoneCode(a.zone_id),icon:'square-dashed'};}), value:f.area_id||null, onSelect:function(val){ captureForm(); f.area_id=val; f.rack_id=null; render(); } });
  } else if(v==='bulk'){
    if(document.getElementById('ss-btarget')) initSearchSelect('btarget',{ options:AREAS.filter(function(a){return a.status==='active';}).map(function(a){return {value:a.id,label:a.code+' — '+a.name,sub:'โซน '+zoneCode(a.zone_id),icon:'square-dashed'};}), value:f.target_area||null, onSelect:function(val){ captureForm(); f.target_area=val; render(); } });
  }
}

document.addEventListener('click', function(e){ if(!e.target.closest('.user-chip') && !e.target.closest('.user-menu')){ var m=document.getElementById('userMenu'); if(m) m.classList.remove('is-open'); } });

/* ---------- Esc chain: close open combobox list first, keep drawer open (Rule #94 #3) ---------- */
window.addEventListener('keydown', function(e){
  if(e.key!=='Escape') return;
  var keys=Object.keys(window.__ss||{}).filter(function(k){ return window.__ss[k] && window.__ss[k].open; });
  if(keys.length){ e.stopImmediatePropagation(); keys.forEach(function(k){ window.__ss[k].open=false; ssSetText(k); ssSyncChrome(k); ssRenderList(k); }); }
}, true);

/* ---------- boot: simulate initial loading ---------- */
setTimeout(function(){ state.loading=false; render(); }, 550);
