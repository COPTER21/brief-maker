  if(m==='req-create') return reqCreateDrawer();
  if(m==='req-view') return reqViewDrawer();
  if(m==='pur-create') return purCreateDrawer();
  if(m==='pur-view') return purViewDrawer();
  if(m==='consent-view') return consentViewDrawer();
  if(m==='c360') return c360Drawer();
  return '';
}

/* ---- create request (FN-05) — single-screen (no wizard, Part C #10) ---- */
function openReqCreate(pre){ state.reqForm={subject:pre.subject||null, channel:pre.channel||null, purposes:(pre.purposes||[]).slice(), refOld:pre.refOld||null, purQ:''};
  window.__cbSuppress=true; setTimeout(function(){window.__cbSuppress=false;},400); openDrawer('req-create',null); }
function reqCreateDrawer(){ var fm=state.reqForm;
  var pickable=state.purposes.filter(function(p){return p.status==='active';});
  var purBlock = pickable.length
    ? '<div class="input-search" style="margin-bottom:10px"><i data-lucide="search" class="lead-icon"></i>'
        + '<input class="input" id="reqPurSearch" placeholder="ค้นหาวัตถุประสงค์ตามชื่อ" value="'+esc(fm.purQ)+'" oninput="state.reqForm.purQ=this.value; renderReqPurRows()"></div>'
        + '<div id="reqPurRows">'+reqPurRowsHTML()+'</div>'
    : '<p class="field-help">ยังไม่มีวัตถุประสงค์ที่ใช้งาน</p>';
  var refBanner = fm.refOld ? '<div class="warn-banner"><i data-lucide="refresh-cw"></i>คำขอนี้เป็น<b>การต่ออายุ</b> อ้างรายการเดิม '+fm.refOld+' (สร้างเป็นคำขอใหม่ ไม่แก้วันหมดอายุของเดิม — BR-13)</div>':'';
  var body='<div class="drawer-body">'+refBanner
    + sec('เจ้าของข้อมูล', '<div class="field">'+comboHTML('reqSubject','ค้นหาชื่อหรือรหัสลูกค้า')+'</div>')
    + sec('ช่องทางที่ขอความยินยอม', '<div class="field">'+comboHTML('reqChannel','เลือกช่องทาง (BR-03 จำกัดตามวัตถุประสงค์)')+'</div>')
    + sec('วัตถุประสงค์ (เลือกได้หลายข้อ)', purBlock)
    + '</div>';
  var foot=dwFoot('<button class="btn btn-ghost" onclick="closeDrawer()">ยกเลิก</button>',
    '<button class="btn btn-primary" onclick="submitReqCreate(event)"><i data-lucide="link" class="w-4 h-4"></i>สร้างคำขอ + ลิงก์/QR</button>');
  return dwHead('<i data-lucide="file-plus" class="w-3.5 h-3.5"></i>สร้างคำขอความยินยอม', 'คำขอความยินยอมใหม่','เลือกเจ้าของข้อมูล ช่องทาง และวัตถุประสงค์')+body+foot;

function reqPurRowsHTML(){ var fm=state.reqForm;
  var pickable=state.purposes.filter(function(p){return p.status==='active';});
  var total=pickable.length;
  var q=(fm.purQ||'').toLowerCase().trim();
  var shown=q ? pickable.filter(function(p){return p.name.toLowerCase().indexOf(q)>=0;}) : pickable;
  var count='<div class="field-help" style="margin-bottom:8px">แสดง '+shown.length+' จาก '+total+'</div>';
  if(!shown.length) return count+emptyStateHTML({icon:'search-x',title:'ไม่พบวัตถุประสงค์',desc:'ลองค้นด้วยคำอื่น'});
  var rows=shown.map(function(p){ var on=fm.purposes.indexOf(p.code)>=0;
    var ok = !fm.channel || p.channels.indexOf(fm.channel)>=0; var cd=curDoc(p);
    return '<div class="opt-row'+(on?' is-on':'')+(ok?'':' is-disabled')+'" onclick="'+(ok?'toggleReqPurpose(\''+p.code+'\')':'')+'">'
      + '<span class="cb"'+(on?' style="background:var(--c-primary);border-color:var(--c-primary)"':'')+'>'+(on?'<span style="position:absolute;left:4px;top:1px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)"></span>':'')+'</span>'
      + '<div class="opt-main"><div class="opt-t">'+esc(p.name)+' <span class="ver-tag">v'+p.currentVer+'</span></div>'
      + '<div class="opt-d">'+(cd?'<button class="doc-link" onclick="event.stopPropagation(); viewPolicy(\''+p.code+'\')"><i data-lucide="'+docIcon(cd.docType)+'"></i>'+esc(cd.docName)+'</button>':'<span class="text-mute-2">— ยังไม่มีเอกสาร</span>')+' · รองรับ: '+p.channels.map(chLabel).join(' · ')+(ok?'':' — ไม่รองรับช่องทางที่เลือก')+'</div></div></div>';
  }).join('');

function renderReqPurRows(){ var el=document.getElementById('reqPurRows'); if(el){ el.innerHTML=reqPurRowsHTML(); renderIcons(); } }
function toggleReqPurpose(code){ var a=state.reqForm.purposes, i=a.indexOf(code); if(i>=0)a.splice(i,1); else a.push(code); render(); }
function submitReqCreate(ev){ var fm=state.reqForm;
  if(!PERM().reqCreate){ showToast('สิทธิ์ไม่พอสำหรับบทบาทนี้','warning'); return; }   /* FIX-02 · SEC: บทบาทจริงจากล็อกอิน · prototype mirror sec.can() */
  if(!fm.subject){ showToast('เลือกเจ้าของข้อมูลก่อน','warning'); return; }
  if(!fm.channel){ showToast('เลือกช่องทางก่อน','warning'); return; }
  var pur=fm.purposes.filter(function(code){ return purpose(code).channels.indexOf(fm.channel)>=0; });
  if(!pur.length){ showToast('เลือกวัตถุประสงค์ที่รองรับช่องทางนี้อย่างน้อย 1 ข้อ','warning'); return; }
  if(!guardBusy(ev)) return;   /* FIX-04 · กัน double submit */
  var r=createRequestRecord(fm.subject, pur, fm.channel, fm.refOld);
  if(fm.refOld) emitConsequence('consent.renew_requested', r.id, {subject:fm.subject, refOld:fm.refOld});
  closeDrawer(); showToast('สร้างคำขอ '+r.id+' พร้อมลิงก์และ QR แล้ว','success');
  setTimeout(function(){ navigate('consent/requests'); }, 60);
}
function createRequestRecord(subject, purposes, channel, refOld){
  var r={ id:'REQ-'+(_req++), subject:subject, purposes:purposes.slice(), channel:channel, status:'draft',
    createdAt:new Date().toISOString(), link:'https://consent.cube.co.th/r/REQ-'+(_req-1), sends:[], refOld:refOld||null };
  state.requests.push(r); return r;
}

    + '<div class="qr-actions">'
    + '<button class="btn btn-secondary" onclick="downloadQR(\''+r.id+'\')"><i data-lucide="qr-code" class="w-4 h-4"></i>ดาวน์โหลด QR</button>'
    + '<button class="btn btn-secondary" onclick="downloadPdfForm(\''+r.id+'\')"><i data-lucide="file-down" class="w-4 h-4"></i>ดาวน์โหลดเอกสาร</button>'
    + '</div>'
    + '<p class="field-help" style="margin-top:6px">นำลิงก์/QR ไปใช้ช่องทางอื่นได้ — ระบบบันทึกเวลาที่นำออก (S-08)</p></div></div>');
  var sendLog = r.sends.length ? r.sends.map(function(x,i){return '<div class="send-log"><span class="sl-n">'+(i+1)+'</span><i data-lucide="'+chIcon(x.ch)+'" class="w-4 h-4"></i><b>'+chLabel(x.ch)+'</b><span class="text-mute-2">'+fmtDT(x.at)+'</span></div>';}).join('') : '<p class="field-help">ยังไม่มีการส่ง</p>';
  var sendBtns='';

function snapshotVers(r){ var o={}; r.purposes.forEach(function(c){ o[c]=currentVer(c); }); return o; }   /* FIX-03 · เวอร์ชันนโยบายต่อ purpose ณ เวลาส่ง (ES5) */
function sendVia(id, ch){ var r=request(id); if(!r) return;
  if(!PERM().send){ showToast('สิทธิ์ไม่พอสำหรับบทบาทนี้','warning'); return; }   /* FIX-02 · SEC: บทบาทจริงจากล็อกอิน · prototype mirror sec.can() */
  if(!['draft','pending'].includes(r.status)){ showToast('คำขอนี้ปิดแล้ว','warning'); return; }   /* FIX-05 · ส่ง/ส่งซ้ำได้เฉพาะ draft/pending */
  r.sends.push({ch:ch, at:new Date().toISOString(), vers:snapshotVers(r)}); if(r.status==='draft') r.status='pending';   /* FIX-03 · snapshot ver */
  render(); showToast('บันทึกการส่งทาง'+chLabel(ch)+SIM_NOTE,'success'); }
function resendOther(id){ var v=CB['resendCh']?CB['resendCh'].value:null; if(!v){ showToast('เลือกช่องทางก่อน','warning'); return; } sendVia(id, v); }

/* answer / sign (FN-10 grant · FN-11 partial · S-11)
   answerRequest(id,mode) = wrapper เดิม (mode all/partial/decline) · applyAnswers = engine กลาง
   หน้าผู้รับ (openRecipientView) เรียก applyAnswers ด้วย decision รายวัตถุประสงค์จากที่ผู้ใช้เลือก */
function answerRequest(id, mode){ var r=request(id); if(!r) return;
  applyAnswers(r, function(code, idx){ return mode==='all' || (mode==='partial' && idx%2===0); });   // partial = สลับข้อ
}
function applyAnswers(r, decide){
  if(!PERM().sign){ showToast('สิทธิ์ไม่พอสำหรับบทบาทนี้','warning'); return; }   /* FIX-02 · SEC: บทบาทจริงจากล็อกอิน · prototype mirror sec.can() */
  if(!['draft','pending'].includes(r.status)){ showToast('คำขอนี้ปิดแล้ว — ตอบซ้ำไม่ได้','warning'); return; }   /* FIX-01 · ตอบได้ครั้งเดียว — กัน evidence chain ถูกเขียนทับ */
  var codes=r.purposes; var granted=0, declined=0;
  codes.forEach(function(code, idx){
    var p=purpose(code); if(!p) return;
    var doGrant = !!decide(code, idx);
    var ver=p.currentVer, id2='CNS-'+(_cns++);
    supersede(r.subject, code, r.channel);
    if(doGrant){
      var c={ id:id2, subject:r.subject, purpose:code, channel:r.channel, status:'granted', policyVersion:ver,
        grantedAt:new Date().toISOString(), updated:new Date().toISOString(), expiresAt:dISO(p.lifespan*30),
        evidence:{answeredAt:new Date().toISOString(), requestChannel:r.channel, idMethod:'ลิงก์ที่ส่งถึงเจ้าตัว', policyVersion:ver, ipDevice:'203.0.113.77 · Chrome 128 / Android'},
        grantEvent:'F-MKT-CONSENT:'+id2+':consent.granted',
        history:[{at:r.createdAt,action:'requested',label:'ส่งคำขอทาง'+chLabel(r.channel)},{at:new Date().toISOString(),action:'granted',label:'เจ้าของข้อมูลยินยอม (นโยบาย v'+ver+')'}]};
      state.consents.push(c); emitConsequence('consent.granted', id2, {subject:r.subject,purpose:code,channel:r.channel,policy_version:ver}); granted++;
    } else {
      var c2={ id:id2, subject:r.subject, purpose:code, channel:r.channel, status:'declined', policyVersion:ver,
        grantedAt:null, updated:new Date().toISOString(), expiresAt:null, evidence:null, grantEvent:null,
        history:[{at:r.createdAt,action:'requested',label:'ส่งคำขอทาง'+chLabel(r.channel)},{at:new Date().toISOString(),action:'declined',label:'เจ้าของข้อมูลปฏิเสธวัตถุประสงค์นี้'}]};
      state.consents.push(c2); emitConsequence('consent.declined', id2, {subject:r.subject,purpose:code,channel:r.channel}); declined++;
    }
  });
  r.status='answered'; r.answeredAt=new Date().toISOString();   /* FIX-01 · ปิดคำขอเมื่อตอบแล้ว */
  render();
  showToast('บันทึกคำตอบแล้ว · ยินยอม '+granted+' · ปฏิเสธ '+declined+' (เก็บหลักฐานครบ 5 อย่าง)','success');
}
function supersede(subject, code, channel){       // BR-01 คู่ไม่ซ้ำที่ยังมีผล — active เดิมถูกแทน
  state.consents.forEach(function(c){ if(c.subject===subject && c.purpose===code && c.channel===channel && isActive(c)){ c.status='withdrawn'; c.updated=new Date().toISOString();
    c.history.push({at:new Date().toISOString(),action:'withdrawn',label:'ถูกแทนที่ด้วยความยินยอมใหม่ในคู่เดียวกัน'}); } });
}

/* =====================================================================
   RECIPIENT read+sign view — mock ของลิงก์ภายนอกที่ส่งให้เจ้าของข้อมูล (S-10/S-11)
   surface แยก (ไม่มี ERP sidebar/shellbar) · z-index เหนือ drawer/modal
   ไม่ใช่การส่งจริง ไม่มี approval chain · ใช้ applyAnswers เป็น engine เดิม (Part C)
   ===================================================================== */
function openRecipientView(reqId){ var r=request(reqId); if(!r) return;
  var choices={}; r.purposes.forEach(function(code){ choices[code]=null; });
  state.recipient={open:true, reqId:reqId, choices:choices, verified:false, expanded:{}};
  render();
  requestAnimationFrame(function(){ var el=document.getElementById('recipientRoot'); if(el) el.classList.add('is-open'); });
}
function closeRecipientView(){ var el=document.getElementById('recipientRoot'); if(el) el.classList.remove('is-open');
  setTimeout(function(){ state.recipient={open:false,reqId:null,choices:{},verified:false,expanded:{}}; render(); }, 240); }
function renderRecipient(){ var el=document.getElementById('recipientRoot');
  if(el){ el.innerHTML = (state.recipient && state.recipient.open) ? recipientViewHTML() : ''; renderIcons(); } }
function setRecipientChoice(code, val){ state.recipient.choices[code]=val; renderRecipient(); }
function toggleRecipientVerify(){ state.recipient.verified=!state.recipient.verified; renderRecipient(); }
function toggleRecipientDoc(code){ state.recipient.expanded[code]=!state.recipient.expanded[code]; renderRecipient(); }
function submitRecipient(ev){ var st=state.recipient; var r=request(st.reqId); if(!r) return;
  if(!st.verified){ showToast('กรุณายืนยันตัวตนก่อนส่งคำตอบ','warning'); return; }
  var missing=r.purposes.filter(function(code){ return st.choices[code]!=='grant' && st.choices[code]!=='decline'; });
  if(missing.length){ showToast('กรุณาเลือกยินยอม/ไม่ยินยอมให้ครบทุกวัตถุประสงค์','warning'); return; }
  if(!guardBusy(ev)) return;   /* FIX-04 · กัน double submit */
  var choices={}; r.purposes.forEach(function(code){ choices[code]=st.choices[code]; });   // snapshot ก่อนปิด
  closeRecipientView();
  setTimeout(function(){ applyAnswers(r, function(code){ return choices[code]==='grant'; }); }, 60);   // engine เดิม → ทะเบียน+หลักฐาน 5+ประวัติ
}
function recipientViewHTML(){ var st=state.recipient; var r=request(st.reqId); if(!r) return '';
  var s=subj(r.subject);
  var simbar='<div class="rcp-simbar demo-only"><!-- DEMO-ONLY: ห้าม render ใน production build (หน้าจริงเปิดจากลิงก์ที่ส่งให้เจ้าของข้อมูล) --><i data-lucide="flask-conical" class="w-4 h-4"></i>'

function submitPurCreate(){ var name=(document.getElementById('pfName').value||'').trim();

/* ---- mock upload helpers (เนื้อหา = เอกสารอัปโหลด) ---- */
function uploadBlockHTML(inputId, doc, onChange, onRemove){
  if(doc){
    return '<div class="up-file"><span class="uf-ic"><i data-lucide="'+docIcon(doc.type)+'" class="w-4 h-4"></i></span>'
      + '<div class="uf-main"><div class="uf-name">'+esc(doc.name)+'</div><div class="uf-meta">'+esc((doc.type||'ไฟล์')+(doc.size!=null?(' · '+fmtBytes(doc.size)):''))+'</div></div>'
      + '<button class="btn btn-sm btn-ghost" onclick="'+onRemove+'"><i data-lucide="repeat-2" class="w-3.5 h-3.5"></i>เปลี่ยนไฟล์</button></div>';
  }
  return '<label class="up-zone" for="'+inputId+'"><span class="up-ic"><i data-lucide="upload-cloud" class="w-4 h-4"></i></span>'
    + '<div class="up-t">อัปโหลดเอกสาร PDPA</div><div class="up-s">รองรับ .pdf .doc .docx .txt — คลิกเพื่อเลือกไฟล์ (ต้นแบบ)</div>'
    + '<input type="file" id="'+inputId+'" accept=".pdf,.doc,.docx,.txt" style="display:none" onchange="'+onChange+'"></label>';
}
function handleDocUpload(inputEl, ctx){
  var f=inputEl.files && inputEl.files[0]; if(!f) return;
  var doc={name:f.name, type:f.type||'application/octet-stream', size:f.size, body:''};
  function apply(){ if(ctx==='purForm'){ state.dd.purForm.doc=doc; renderPurDoc(); }
    else if(ctx==='nv'){ state.nvDoc=doc; renderNvDoc(); } }
  if((f.type||'').indexOf('text')===0){
    try{ var rd=new FileReader();
      rd.onload=function(){ doc.body=String(rd.result||''); apply(); };
      rd.onerror=function(){ doc.body='(เอกสาร '+f.name+' — เปิดดูไฟล์จริงในระบบจริง)'; apply(); };
      rd.readAsText(f);
    }catch(e){ doc.body='(เอกสาร '+f.name+' — เปิดดูไฟล์จริงในระบบจริง)'; apply(); }
  } else { doc.body='(เอกสาร '+f.name+' — เปิดดูไฟล์จริงในระบบจริง)'; apply(); }
}

  }).join('') : '<p class="field-help">ลูกค้ารายนี้ยังไม่มีรายการความยินยอมในทะเบียน (ค่าเริ่มต้น = ส่งไม่ได้ ทุกคู่)</p>';
  var body='<div class="drawer-body">'
    + '<div class="subject-cell" style="margin-bottom:16px"><span class="sc-av" style="width:44px;height:44px;font-size:14px">'+esc(initials(s.name))+'</span><div><div class="sc-name" style="font-size:16px">'+esc(s.name)+'</div><div class="sc-org">'+esc(s.org+' · '+s.id)+'</div></div></div>'
    + grpHTML + '</div>';
  return dwHead('<i data-lucide="user-search" class="w-3.5 h-3.5"></i>มุมมองรายคน','ความยินยอมทั้งหมดของ '+s.name,'ทุกวัตถุประสงค์ × ช่องทาง ในที่เดียว (S-14)')
    + body + dwFoot('','<button class="btn btn-secondary" onclick="closeDrawer()">ปิด</button>');
}

/* =====================================================================
   MODALS (withdraw / new-version / close-purpose)
   ===================================================================== */
function modalHTML(){ var t=state.modal.type, d=state.modal.data||{};
  if(t==='withdraw') return withdrawModal(d);
  if(t==='new-version') return newVersionModal(d);
  if(t==='close-purpose') return closePurposeModal(d);
  if(t==='policy') return policyModal(d);
  return '';
}
function viewPolicy(code, ver){ openModal('policy',{code:code, ver:(ver!=null?ver:null)}); }
function policyModal(d){ var p=purpose(d.code); if(!p) return '';
  var doc = (d.ver!=null ? p.versions.filter(function(v){return v.v===d.ver;})[0] : null) || curDoc(p);
  var isCur = doc.v===p.currentVer;
  return '<div class="modal-header"><div class="modal-header-icon"><i data-lucide="file-text"></i></div><div><h3 class="modal-title">'+esc(p.name)+'</h3>'
    + '<p class="modal-subtitle">เอกสารเวอร์ชัน'+(isCur?'ปัจจุบัน':'')+' v'+doc.v+' · '+fmtD(doc.date)+' · '+esc(doc.docName||'—')+'</p></div></div>'
    + '<div class="modal-body"><div class="warn-banner" style="background:#EAF2FF;border-color:#BBD3FF;color:#1A4F9E"><i data-lucide="info"></i>นี่คือเอกสารที่เจ้าของข้อมูลเห็นตอนเซ็น (BR-06)</div>'
    + '<div class="doc-meta"><span class="dm-ic"><i data-lucide="'+docIcon(doc.docType)+'" class="w-4 h-4"></i></span><span>'+esc(doc.docName||'—')+'</span></div>'
    + '<div class="doc-frame">'+esc(doc.body||'')+'</div></div>'
    + '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">ปิด</button></div>';
}
function withdrawModal(d){ var c=state.consents.find(function(x){return x.id===d.id;}); if(!c) return '';
  return '<div class="modal-header"><div class="modal-header-icon is-danger"><i data-lucide="undo-2"></i></div><div><h3 class="modal-title">ถอนความยินยอมแทนลูกค้า</h3><p class="modal-subtitle">มีผลทันที ไม่ต้องผ่านการอนุมัติ (BR-09) · '+esc(subj(c.subject).name)+'</p></div></div>'
    + '<div class="modal-body"><div class="field"><label class="field-label">เหตุผล <span class="req">*</span></label><textarea class="notes-area" id="wdReason" style="min-height:80px" placeholder="เช่น ลูกค้าไม่ประสงค์รับข้อความส่งเสริมการขาย"></textarea></div>'
    + '<div class="field"><label class="field-label">ลูกค้าแจ้งมาทางช่องทางใด <span class="req">*</span></label>'+comboHTML('wdVia','เลือกช่องทาง')+'</div></div>'
    + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-danger" onclick="doWithdraw(\''+c.id+'\',event)"><i data-lucide="undo-2" class="w-4 h-4"></i>ยืนยันถอน</button></div>';
}
function doWithdraw(id, ev){ var c=state.consents.find(function(x){return x.id===id;}); if(!c) return;
  if(!PERM().withdraw){ showToast('สิทธิ์ไม่พอสำหรับบทบาทนี้','warning'); return; }   /* FIX-02 · SEC: บทบาทจริงจากล็อกอิน · prototype mirror sec.can() */
  if(effStatus(c)!=='granted'){ showToast('รายการนี้ไม่อยู่ในสถานะยินยอม','warning'); return; }   /* FIX-05 · ถอนได้เฉพาะ granted — กัน history/CSQ ซ้ำ */
  var reason=(document.getElementById('wdReason').value||'').trim(); var via=CB['wdVia']?CB['wdVia'].value:null;
  if(!reason){ showToast('กรอกเหตุผล','warning'); return; }
  if(!via){ showToast('เลือกช่องทางที่ลูกค้าแจ้งมา','warning'); return; }
  if(!guardBusy(ev)) return;   /* FIX-04 · กัน double submit */
  c.status='withdrawn'; c.updated=new Date().toISOString();
  c.history.push({at:c.updated,action:'withdrawn',label:'ถอนความยินยอม',reason:reason,via:via});
  emitConsequence('consent.withdrawn', c.id, {subject:c.subject,purpose:c.purpose,channel:c.channel, reversal_of:c.grantEvent});  // BR-CSQ-04
  closeModal(); render(); showToast('ถอนความยินยอมแล้ว — มีผลทันทีในคำขอถัดไป','success');
}
function openNewVersion(code){ state.nvDoc=null; openModal('new-version',{code:code}); }
function renderNvDoc(){ var el=document.getElementById('nvDocBlock');
  if(el){ el.innerHTML=uploadBlockHTML('nvDocInput', state.nvDoc, "handleDocUpload(this,'nv')", "removeNvDoc()"); renderIcons(); } }
function removeNvDoc(){ state.nvDoc=null; renderNvDoc(); }
function newVersionModal(d){ var p=purpose(d.code); if(!p) return ''; var affected=state.consents.filter(function(c){return c.purpose===p.code && isActive(c) && c.policyVersion===p.currentVer;}).length;
  return '<div class="modal-header"><div class="modal-header-icon is-warning"><i data-lucide="file-plus"></i></div><div><h3 class="modal-title">ออกเอกสารเวอร์ชันใหม่ (v'+(p.currentVer+1)+')</h3><p class="modal-subtitle">'+esc(p.name)+' · เวอร์ชันเดิมแก้ไม่ได้ (BR-05)</p></div></div>'
    + '<div class="modal-body"><div class="warn-banner"><i data-lucide="alert-triangle"></i><div><b>ความยินยอม '+affected+' รายการจะไม่ครอบคลุมเวอร์ชันใหม่</b><div style="margin-top:3px">ที่ยินยอมไว้กับนโยบาย v'+p.currentVer+' — ต้องขอความยินยอมใหม่ (S-02 · BR-06)</div></div></div>'
    + '<div class="field"><label class="field-label">แนบเอกสารเวอร์ชันใหม่ <span class="req">*</span></label><div id="nvDocBlock">'+uploadBlockHTML('nvDocInput', state.nvDoc, "handleDocUpload(this,'nv')", "removeNvDoc()")+'</div></div></div>'
    + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" onclick="doPublishVersion(\''+p.code+'\',event)"><i data-lucide="check" class="w-4 h-4"></i>ออกเวอร์ชัน v'+(p.currentVer+1)+'</button></div>';
}
function doPublishVersion(code, ev){ var p=purpose(code); if(!p) return;
  if(!PERM().purpose){ showToast('สิทธิ์ไม่พอสำหรับบทบาทนี้','warning'); return; }   /* FIX-02 · SEC: จัดการวัตถุประสงค์ = DPO เท่านั้น · mirror sec.can() */
  var doc=state.nvDoc;
  if(!doc){ showToast('ต้องแนบเอกสาร PDPA','warning'); return; }
  if(!guardBusy(ev)) return;   /* FIX-04 · กัน double submit */
  var nv=p.currentVer+1; p.versions.push({v:nv,date:new Date().toISOString(),docName:doc.name,docType:doc.type,body:doc.body}); p.currentVer=nv;
  state.nvDoc=null;
  var stale=staleCount(code);
  emitConsequence('policy.version_published', code, {purpose:code, version:nv});
  closeModal(); render(); showToast('ออกเอกสาร v'+nv+' แล้ว · '+stale+' รายการต้องขอความยินยอมใหม่','success');
}
function closePurposeModal(d){ var p=purpose(d.code); if(!p) return '';
  return '<div class="modal-header"><div class="modal-header-icon is-danger"><i data-lucide="archive"></i></div><div><h3 class="modal-title">ปิดวัตถุประสงค์</h3><p class="modal-subtitle">'+esc(p.name)+'</p></div></div>'
    + '<div class="modal-body">ปิดแล้วจะ<b>สร้างคำขอใหม่ไม่ได้</b> แต่ความยินยอมเดิมยังอยู่ในทะเบียนเป็นหลักฐาน (BR-14) · ไม่มีการลบถาวร (BR-17)</div>'
    + '<div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-danger" onclick="doClosePurpose(\''+p.code+'\',event)"><i data-lucide="archive" class="w-4 h-4"></i>ยืนยันปิด</button></div>';
}
function doClosePurpose(code, ev){ var p=purpose(code); if(!p) return;
  if(!PERM().purpose){ showToast('สิทธิ์ไม่พอสำหรับบทบาทนี้','warning'); return; }   /* FIX-02 · SEC: จัดการวัตถุประสงค์ = DPO เท่านั้น · mirror sec.can() */
  if(!guardBusy(ev)) return;   /* FIX-04 · กัน double submit */
  p.status='closed';
  emitConsequence('purpose.closed', code, {purpose:code});
  closeModal(); render(); showToast('ปิดวัตถุประสงค์ '+code+' แล้ว','success');
}

/* =====================================================================
   DEMO-STRIP (#105) — sim + persona
   ===================================================================== */
function simAnswer(mode){ var target=null;
  if(state.drawer.open && state.drawer.mode==='req-view') target=state.drawer.recordId;
  if(!target){ var cand=state.requests.filter(function(r){return r.status==='pending'||r.status==='draft';}); target=cand.length?cand[cand.length-1].id:null; }
  if(!target){ showToast('ไม่มีคำขอที่รอตอบ — สร้างคำขอก่อน','warning'); return; }
  if(!(state.drawer.open && state.drawer.recordId===target)) openReqView(target);
  setTimeout(function(){ answerRequest(target, mode); }, 40);
}
function setPersona(p){ state.persona=p; render(); }
function syncPersonaUI(){ var seg=document.getElementById('dsPersona');
  if(seg){ var b=seg.querySelectorAll('button'); for(var i=0;i<b.length;i++) b[i].classList.toggle('is-on', b[i].getAttribute('data-persona')===state.persona); }
  var roleMap={officer:'เจ้าหน้าที่การตลาด',dpo:'ผู้ดูแลข้อมูล (DPO)',auditor:'ผู้ตรวจสอบ (อ่านอย่างเดียว)'};
  var el=document.getElementById('userRole'); if(el) el.textContent=roleMap[state.persona];
}
function decorativeNav(){ showToast('เมนูนี้เป็นบริบทของโมดูลอื่น (เดโมไม่รวมขอบเขต)','info'); }

/* =====================================================================
   UTIL — combos per view · QR · downloads · clipboard
   ===================================================================== */
function initPageCombos(){
  window.__cbSuppress=true;
  if(state.tab==='resolve' && !state.drawer.open){
    initCombo('rzSubject',{options:subjectOpts(), value:state.rz.subject, onSelect:function(v){state.rz.subject=v;}});
    initCombo('rzPurpose',{options:purposeOpts(false), value:state.rz.purpose, onSelect:function(v){state.rz.purpose=v;}});
    initCombo('rzChannel',{options:channelOpts(), value:state.rz.channel, onSelect:function(v){state.rz.channel=v;}});
  }
  var m=drawerMode();
  if(m==='req-create'){
    initCombo('reqSubject',{options:subjectOpts(), value:state.reqForm.subject, onSelect:function(v){state.reqForm.subject=v;}});
    initCombo('reqChannel',{options:channelOpts(), value:state.reqForm.channel, onSelect:function(v){state.reqForm.channel=v; render();}});
  }
  if(m==='req-view'){ initCombo('resendCh',{options:channelOpts(), value:null, onSelect:function(){}}); }
  if(state.modal.open && state.modal.type==='withdraw'){ initCombo('wdVia',{options:channelOpts(), value:null, onSelect:function(){}}); }
  setTimeout(function(){ window.__cbSuppress=false; }, 350);
}
function qrSVG(seed){ var h=0; for(var i=0;i<seed.length;i++){ h=(h*31+seed.charCodeAt(i))>>>0; }
  var n=21, cells=''; function rng(){ h^=h<<13; h^=h>>>17; h^=h<<5; h>>>=0; return h/4294967296; }
  function finder(x,y){ var out=''; for(var a=0;a<7;a++)for(var b=0;b<7;b++){ var edge=a===0||a===6||b===0||b===6, core=a>=2&&a<=4&&b>=2&&b<=4; if(edge||core) out+='<rect x="'+(x+b)+'" y="'+(y+a)+'" width="1" height="1"/>'; } return out; }
  for(var y=0;y<n;y++)for(var x=0;x<n;x++){ if((x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9)) continue; if(rng()>0.55) cells+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>'; }
  return '<svg viewBox="0 0 '+n+' '+n+'" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg" fill="#111111"><rect width="'+n+'" height="'+n+'" fill="#fff"/>'+cells+finder(0,0)+finder(n-7,0)+finder(0,n-7)+'</svg>'; }
function downloadBlob(name, mime, content){ try{ var blob=new Blob([content],{type:mime}); var url=URL.createObjectURL(blob);
  var a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(function(){URL.revokeObjectURL(url);},1000);
  }catch(e){ showToast('ดาวน์โหลดไม่สำเร็จในสภาพแวดล้อมนี้','error'); } }
function downloadQR(id){ var r=request(id); if(!r) return; var svg='<?xml version="1.0"?>'+qrSVG(id).replace('width="100%" height="100%"','width="300" height="300"');
  downloadBlob('QR-'+id+'.svg','image/svg+xml', svg); r.sends.push({ch:'export-qr', at:new Date().toISOString()});
  showToast('ดาวน์โหลด QR ของ '+id+' แล้ว (บันทึกการนำลิงก์ออก)','success'); }
function downloadPdfForm(id){ var r=request(id); if(!r) return;   // ต้นแบบ: จำลองดาวน์โหลดเอกสารเวอร์ชันปัจจุบันของทุกวัตถุประสงค์ในคำขอ
  var names=r.purposes.map(function(code){ var p=purpose(code); var cd=curDoc(p); return cd?cd.docName:(p?p.name:code); });
  showToast('ดาวน์โหลดเอกสาร (ต้นแบบ): '+names.join(' · '),'success'); }
function copyLink(text){ try{ if(navigator.clipboard){ navigator.clipboard.writeText(text); } else { var t=document.createElement('textarea'); t.value=text; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t); } showToast('คัดลอกลิงก์แล้ว','success'); }catch(e){ showToast('คัดลอกไม่สำเร็จ','error'); } }

/* ---------- override close* เพื่อเก็บกวาด innerHTML + combos ---------- */
function closeDrawer(){ var dw=document.getElementById('drawer'), bd=document.getElementById('drawerBackdrop');
  if(dw) dw.classList.remove('is-open'); if(bd) bd.classList.remove('is-open'); teardownCombos();
  setTimeout(function(){ state.drawer={open:false,mode:null,recordId:null,step:1}; state.dd={}; render(); }, 280); }
function closeModal(){ var mb=document.getElementById('modalBackdrop'); if(mb) mb.classList.remove('is-open'); teardownCombos();
  setTimeout(function(){ state.modal={open:false,type:null,data:null}; render(); }, 200); }

/* ---------- boot: ensure default hash (refresh-safe) ---------- */
if(!location.hash || location.hash==='#' || location.hash==='#/'){ location.replace('#/consent/registry'); }
