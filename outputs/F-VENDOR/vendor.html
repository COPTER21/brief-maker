function kycLabel(k){return {pending:'รอตรวจ',passed:'ผ่าน',failed:'ไม่ผ่าน',expired:'หมดอายุ'}[k]||k;}
function purposeLabel(p){return {standard:'ทั่วไป',refund:'คืนเงิน',payroll:'เงินเดือน'}[p]||p;}
function tierOf(r){return {decisionRef:(r.policyDecision||{}).decision_ref||'รอ Policy Center'};}
// FN-02 maskSensitive — bank account_no (Restricted), tax_id (Confidential)
function maskAcct(a){if(!a)return '—';const s=String(a);return canSeeBankNo()?s:s.slice(0,3)+'•••••'+s.slice(-2);}
function maskTax(t){if(!t)return '—';return canSeeTax()?t:String(t).slice(0,4)+'•••••'+String(t).slice(-2);}
function initials(s){return (s||'?').replace(/[^A-Za-z0-9]/g,'').slice(0,2).toUpperCase()||'V';}
function codeBadge(code){const m=String(code||'').match(/(\d+)\s*$/);if(m){return m[1].slice(-2);}return initials(code);}
function fmtNum(n){return (n==null||n==='')?'—':Number(n).toLocaleString('th-TH');}
function fmtMoney(n){return (n==null||n==='')?'—':Number(n).toLocaleString('th-TH')+' ฿';}
function fmtDate(iso){if(!iso)return '—';return new Date(iso).toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'});}
function fmtDateTime(iso){if(!iso)return '—';return new Date(iso).toLocaleString('th-TH',{year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}
function bankVerified(r){return (r.banks||[]).some(b=>(b.verification_status||'unverified')==='verified'||b.verified);}
function paidVendorNeedsBank(r){return r.type!=='OT';} // one-time may pay cash
function hasValidContact(r){return (r.contacts||[]).some(c=>c.email&&c.phone);}
function isImmutableTax(r){return r&&r.kyc==='passed';} // IR-01
// BACKEND: GET /api/v1/vendors/{id}/transaction-eligibility
function transactionEligibility(r){
  const reasons=[];
  if(r.status!=='active')reasons.push('VENDOR_NOT_ACTIVE');
  if(r.kyc!=='passed')reasons.push('KYC_NOT_PASSED');
  if(paidVendorNeedsBank(r)&&!bankVerified(r))reasons.push('BANK_NOT_VERIFIED');
  return{eligible_for_po:r.status==='active'&&r.kyc==='passed',eligible_for_payment:reasons.length===0,reason_codes:reasons};
}

// vendor code generator: V-CC-TT-NNNNN (running per Country+Type)
function genVendorCode(country,type){if(!country||!type)return '';const pre='V-'+country+'-'+type+'-';let mx=0;RAW.forEach(v=>{if((v.code||'').indexOf(pre)===0){const n=parseInt(String(v.code).slice(pre.length),10);if(!isNaN(n)&&n>mx)mx=n;}});return pre+String(mx+1).padStart(5,'0');}

/* ====== QUERY (FN-01 buildVendorQuery) ====== */
function getFiltered(){let a=RAW.slice();const f=state.filters;
  if(f.type!=='all')a=a.filter(r=>r.type===f.type);
  if(f.status!=='all')a=a.filter(r=>r.status===f.status);
  if(f.search){const q=f.search.toLowerCase();a=a.filter(r=>r.code.toLowerCase().includes(q)||r.name.toLowerCase().includes(q)||(r.tax||'').includes(q));}
  const c=state.sort.col,dir=state.sort.dir==='asc'?1:-1;
  a.sort((x,y)=>String(x[c]||'').localeCompare(String(y[c]||''),'th')*dir);
  return a;}
function getPaginated(){const all=getFiltered();const{page,pageSize}=state.pagination;const s=(page-1)*pageSize;
  return{records:all.slice(s,s+pageSize),total:all.length,page,totalPages:Math.max(1,Math.ceil(all.length/pageSize)),start:all.length===0?0:s+1,end:Math.min(s+pageSize,all.length)};}

/* ====== NAV / CHROME ====== */
function applyFilter(k,v){state.filters[k]=v;state.pagination.page=1;render();}
function resetFilters(){state.filters={search:'',type:'all',status:'all'};state.pagination.page=1;render();showToast('รีเซ็ตตัวกรองแล้ว','info');}
function sortBy(c){if(state.sort.col===c)state.sort.dir=state.sort.dir==='asc'?'desc':'asc';else{state.sort.col=c;state.sort.dir='asc';}render();}
function goToPage(n){const{totalPages}=getPaginated();if(n<1||n>totalPages)return;state.pagination.page=n;render();}
function setPageSize(v){state.pagination.pageSize=+v;state.pagination.page=1;render();}
function toggleModule(h){const m=h.closest('.sb-module');if(!m)return;const ex=m.getAttribute('data-expanded')!=='false';m.setAttribute('data-expanded',ex?'false':'true');}
function currentRoute(){return (location.hash||'#/vendors').replace(/^#\/?/,'/');}
function navTo(route){location.hash='#'+(route.startsWith('/')?route:'/'+route);}
function toggleUserMenu(){document.getElementById('userMenu').classList.toggle('is-open');}
document.addEventListener('click',e=>{if(!e.target.closest('.user-chip')&&!e.target.closest('.user-menu'))document.getElementById('userMenu')?.classList.remove('is-open');});
function toggleNotif(){const pk=RAW.filter(r=>r.status==='pending_kyc').length;const pa=RAW.filter(r=>r.status==='pending_approval').length;showToast('มี '+pk+' คู่ค้ารอ KYC และ '+pa+' รออนุมัติ','info');}
function switchRole(r){ROLE=r;document.getElementById('userMenu').classList.remove('is-open');
  if(state.drawer.open||state.modal.open){closeModal();closeDrawer();}
  render();showToast('สลับบทบาทเป็น '+ROLES[r].label,'info');}

function renderView(){
  const r=RAW.find(x=>x.id===state.drawer.id);if(!r)return '';const tab=state.drawer.tab;const t=tierOf(r);
  // status-conditional header actions (FRD §1.6)
  let actions='';
  if(canEdit()&&['draft','pending_kyc','active'].includes(r.status))actions+=`<button class="btn btn-sm btn-secondary" onclick="openDrawer('edit','${r.id}')"><i data-lucide="pencil" class="w-3.5 h-3.5"></i><span>แก้ไข</span></button>`;
  if(canSubmit()&&['draft','pending_kyc'].includes(r.status))actions+=`<button class="btn btn-sm btn-primary" onclick="submitFromView('${r.id}')"><i data-lucide="send" class="w-3.5 h-3.5"></i><span>${r.status==='draft'?'ส่ง KYC':'ส่งอนุมัติ'}</span></button>`;
  if(isCompliance()&&['draft','pending_kyc'].includes(r.status))actions+=`<button class="btn btn-sm btn-secondary" onclick="openModal('kyc','${r.id}')"><i data-lucide="shield-check" class="w-3.5 h-3.5"></i><span>ตรวจ KYC</span></button>`;
  if(r.status==='pending_approval'){
    const cs=currentStep(r);
    if(canApproveCurrent(r))actions+=`<button class="btn btn-sm btn-secondary" onclick="openModal('reject','${r.id}')"><i data-lucide="corner-up-left" class="w-3.5 h-3.5"></i><span>ตีกลับ</span></button><button class="btn btn-sm btn-primary" onclick="openModal('approve','${r.id}')"><i data-lucide="check" class="w-3.5 h-3.5"></i><span>อนุมัติ (ขั้น ${cs?cs.seq:''})</span></button>`;
  }
  if(canBlock()&&r.status==='active')actions+=`<button class="btn btn-sm btn-secondary" onclick="openModal('block','${r.id}')"><i data-lucide="ban" class="w-3.5 h-3.5"></i><span>บล็อก</span></button>`;
  if(canBlock()&&r.status==='active')actions+=`<button class="btn btn-sm btn-secondary" onclick="openModal('inactive','${r.id}')"><i data-lucide="archive" class="w-3.5 h-3.5"></i><span>ปิดใช้งาน</span></button>`;
  if(canBlock()&&r.status==='blocked')actions+=`<button class="btn btn-sm btn-secondary" onclick="openModal('unblock','${r.id}')"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i><span>ปลดบล็อก</span></button>`;
  if(canBlacklist()&&r.status!=='blacklisted')actions+=`<button class="btn btn-sm btn-danger" onclick="openModal('blacklist','${r.id}')"><i data-lucide="shield-x" class="w-3.5 h-3.5"></i><span>แบล็คลิสต์</span></button>`;

  return `<div class="drawer-header"><div class="drawer-avatar">${codeBadge(r.code)}</div>
    <div  class="vl-3"><h2 class="drawer-title" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${r.name}</h2>
    <div class="drawer-subtitle"><span>${r.code}</span><span>·</span><span class="pill pill-${r.status}"><span class="dot dot-${r.status}"></span>${statusLabel(r.status)}</span><span class="pill pill-${r.kyc}">KYC: ${kycLabel(r.kyc)}</span></div></div>
    <button class="icon-btn" onclick="closeDrawer()"><i data-lucide="x" class="w-4 h-4"></i></button></div>
  ${actions?`<div  class="vl-28">${actions}</div>`:''}
  <div class="drawer-tabs">
    <button class="drawer-tab ${tab==='overview'?'is-active':''}" onclick="setTab('overview')">ภาพรวม</button>
    <button class="drawer-tab ${tab==='bank'?'is-active':''}" onclick="setTab('bank')">ธนาคาร & ติดต่อ</button>
    <button class="drawer-tab ${tab==='attach'?'is-active':''}" onclick="setTab('attach')">เอกสารแนบ</button>
    <button class="drawer-tab ${tab==='approval'?'is-active':''}" onclick="setTab('approval')">การอนุมัติ</button>
    <button class="drawer-tab ${tab==='pricelist'?'is-active':''}" onclick="setTab('pricelist')">สินค้า/บริการ</button>
  </div>
  <div class="drawer-body">
    ${tab==='overview'?viewOverview(r,t):''}
    ${tab==='bank'?viewBank(r):''}
    ${tab==='attach'?viewAttachments(r):''}
    ${tab==='approval'?viewApproval(r):''}

}

function openDrawer(mode,id){
  if(mode!=='view'&&!canEdit()){showToast('ไม่มีสิทธิ์ดำเนินการ (โหมดปัจจุบัน: '+U().label+')','error');return;}
  let form=null;
  if(mode==='create'){
    form={code:'',name:'',display:'',type:'TR',tax:'',vat:'',companyReg:'',branchType:'head_office',branchCode:'00000',vatRegistered:true,country:'TH',currency:'THB',term:'NET30',wht:3,creditLimit:'',
      contacts:[{id:nid('c_'),role:'primary',name:'',email:'',phone:''}],
      addresses:[{id:nid('a_'),label:'ที่อยู่หลัก',line:'',province_code:'',district_code:'',subdistrict_code:'',postal:'',is_billing:true,is_primary_shipping:true,_persisted:false}],
      archivedAddresses:[],banks:[],attachments:[],
      _immutableTax:false,_version:1};
  }else if(mode==='edit'){
    const r=RAW.find(x=>x.id===id);
    form=JSON.parse(JSON.stringify({code:r.code,name:r.name,display:r.display,type:r.type,tax:r.tax,vat:r.vat,companyReg:r.companyReg,branchType:r.branchType||'head_office',branchCode:r.branchCode||'00000',vatRegistered:r.vatRegistered!==false,country:r.country,currency:r.currency,term:r.term,wht:r.wht,creditLimit:r.creditLimit}));
    form.attachments=(r.attachments||[]).map(a=>({id:nid('f_'),name:a.name,size:a.size,document_type:a.document_type||'other',issued_at:a.issued_at||'',valid_until:a.valid_until||'',verification_status:a.verification_status||'unverified',verified_by:a.verified_by||null}));
    form.contacts=(r.contacts||[]).map(c=>({id:nid('c_'),role:c.role||'primary',name:c.name||'',email:c.email||'',phone:c.phone||''}));
    if(form.contacts.length===0)form.contacts=[{id:nid('c_'),role:'primary',name:'',email:'',phone:''}];
    const activeAddresses=(r.addresses||[]).filter(a=>a.is_active!==false);
    form.addresses=activeAddresses.map((a,i)=>{const pc=a.province_code||(thaiProvinces.find(p=>p.name_th===a.province||(a.province&&p.name_th.indexOf(a.province)===0))||{}).code||'';return {id:nid('a_'),label:a.label||('ที่อยู่'+(i===0?'หลัก':' #'+(i+1))),line:a.line||a.address_line||'',province_code:pc,district_code:a.district_code||'',subdistrict_code:a.subdistrict_code||'',postal:a.postal||a.postal_code||'',province:a.province||'',district:a.district||'',subdistrict:a.subdistrict||'',is_billing:a.is_billing!=null?a.is_billing:i===0,is_primary_shipping:a.is_primary_shipping!=null?a.is_primary_shipping:i===0,_persisted:true};});
    form.archivedAddresses=(r.addresses||[]).filter(a=>a.is_active===false).map(a=>Object.assign({},a,{is_billing:false,is_primary_shipping:false,is_active:false}));
    form.banks=(r.banks||[]).map((b,i)=>({id:nid('b_'),bank:b.bank||'',bank_code:b.bank_code||(thaiBanks.find(x=>x.name_th===b.bank)||{}).code||'',acct:b.acct||'',name:b.name||'',purpose:b.purpose||'standard',currency:b.currency||r.currency||'THB',is_primary:b.primary!=null?b.primary:i===0,verification_status:b.verification_status||(b.verified?'verified':'unverified'),verified:!!b.verified,verified_at:b.verified_at||null}));
    form._immutableTax=isImmutableTax(r);form._version=r.version;
  }
  state.drawer={open:true,mode,id,tab:'overview',step:1};state.form=form;render();
  requestAnimationFrame(()=>{document.getElementById('drawerBackdrop').classList.add('is-open');document.getElementById('drawer').classList.add('is-open');});
}

// capture all scalar + sub-table inputs into state.form
function captureForm(){const f=state.form;if(!f)return;const g=id=>document.getElementById(id);
  ['name','display','tax','vat'].forEach(k=>{const e=g('f-'+k);if(e&&!e.disabled)f[k]=e.value;});
  if(g('f-creg'))f.companyReg=g('f-creg').value;
  if(g('f-type'))f.type=g('f-type').value;
  if(g('f-country'))f.country=g('f-country').value;
  if(g('f-currency'))f.currency=g('f-currency').value;
  if(g('f-branch-type'))f.branchType=g('f-branch-type').value;
  f.branchCode=f.branchType==='branch'?(g('f-branch-code')?.value||f.branchCode||''):'00000';
  if(g('f-vat-registered'))f.vatRegistered=g('f-vat-registered').value==='true';
  if(g('f-term'))f.term=g('f-term').value;
  if(g('f-wht'))f.wht=g('f-wht').value;
  if(g('f-credit'))f.creditLimit=g('f-credit').value;
  // docs sub-table rows (id-based groups handled by dedicated handlers)
}
function setType(t){captureForm();state.form.type=t;render();}
function setCountry(v){captureForm();state.form.country=v;render();}
function addAttachments(input){const fs=Array.from(input.files||[]);if(!fs.length)return;state.form.attachments=state.form.attachments||[];fs.forEach(file=>state.form.attachments.push({id:nid('f_'),name:file.name,size:file.size,document_type:'other',issued_at:'',valid_until:'',verification_status:'unverified',verified_by:null}));render();}
function removeAttachment(id){state.form.attachments=(state.form.attachments||[]).filter(a=>a.id!==id);render();}
function setAttachment(id,f,v){const a=(state.form.attachments||[]).find(x=>x.id===id);if(a)a[f]=v;}
function addRow(grp){captureForm();const blank={contacts:{role:'sales',name:'',email:'',phone:''},addresses:{type:'shipping',line:'',province:'',postal:''},banks:{bank:BANKS[0],acct:'',name:'',purpose:'standard',primary:false},docs:{type:'vat_certificate',name:'',valid_until:''}}[grp];state.form[grp].push({...blank});render();}
function delRow(grp,i){captureForm();const min=(grp==='contacts'||grp==='addresses')?1:0;if(state.form[grp].length<=min){showToast('ต้องมีอย่างน้อย '+min+' รายการ','warning');return;}state.form[grp].splice(i,1);render();}

/* ====== VALIDATION (FN-04 validateVendor + step gates) ====== */
function validateStep(s){const f=state.form;const isOne=f.type==='OT';const id=state.drawer.id;
  if(s===1){
    if(!(f.name||'').trim()){showToast('กรุณากรอกชื่อตามกฎหมาย','warning');return false;}
    if(!isOne){
      if(!(f.tax||'').trim()){showToast('กรุณากรอกเลขประจำตัวผู้เสียภาษี','warning');return false;}
      if(!/^\d{13}$/.test(f.tax)){showToast('INVALID_TAX · เลขภาษีต้องเป็นตัวเลข 13 หลัก','error');return false;}
      if(!f._immutableTax&&RAW.some(r=>r.tax===f.tax&&r.country===f.country&&r.id!==id)){showToast('TAX_DUPLICATE · เลขภาษีซ้ำ — แนะนำ merge','error');return false;}
    }
  }
  if(s===2){
    const okContact=f.contacts.some(c=>(c.name||'').trim()&&(c.email||'').trim());
    if(!okContact){showToast('ต้องมีผู้ติดต่ออย่างน้อย 1 ราย (ชื่อ + อีเมล)','warning');return false;}
    const okAddr=f.addresses.some(a=>(a.line||'').trim()&&a.province_code&&a.subdistrict_code);
    if(!okAddr){showToast('ต้องมีที่อยู่อย่างน้อย 1 รายการ (ที่อยู่ + จังหวัด + ตำบล)','warning');return false;}
    if(!f.addresses.some(a=>a.is_billing)){showToast('กรุณากำหนดที่อยู่ใบกำกับ','warning');return false;}
    if(!f.addresses.some(a=>a.is_primary_shipping)){showToast('กรุณากำหนดที่อยู่จัดส่งหลัก','warning');return false;}
  }
  return true;
}
function nextStep(){captureForm();if(!validateStep(state.drawer.step))return;state.drawer.step=Math.min(3,state.drawer.step+1);render();}
function prevStep(){captureForm();state.drawer.step=Math.max(1,state.drawer.step-1);render();}

/* ====== PERSIST (FN-06 createVendor / FN-08 amendVendor) ====== */
function serializeAddress(a,isActive){return {label:a.label||'ที่อยู่',line:a.line||a.address_line||'',province:(lookupProvince(a.province_code)||{}).name_th||a.province||'',district:(lookupDistrict(a.district_code)||{}).name_th||a.district||'',subdistrict:(lookupSubdistrict(a.subdistrict_code)||{}).name_th||a.subdistrict||'',postal:a.postal||a.postal_code||'',is_billing:isActive&&!!a.is_billing,is_primary_shipping:isActive&&!!a.is_primary_shipping,is_active:!!isActive};}
function buildPayload(){const f=state.form;return{
  code:state.drawer.mode==='create'?genVendorCode(f.country,f.type):f.code,name:f.name,display:f.display,type:f.type,tax:f.type==='OT'?(f.tax||''):f.tax,vat:f.vat,companyReg:f.companyReg,branchType:f.branchType||'head_office',branchCode:f.branchType==='branch'?(f.branchCode||''):'00000',vatRegistered:f.vatRegistered!==false,country:f.country,currency:f.currency,
  term:f.term,wht:+f.wht||0,creditLimit:f.creditLimit===''?'':(+f.creditLimit||0),
  contacts:f.contacts.filter(c=>(c.name||'').trim()).map(c=>({role:c.role,name:c.name,email:c.email,phone:c.phone})),
  addresses:f.addresses.filter(a=>(a.line||'').trim()).map(a=>serializeAddress(a,true)).concat((f.archivedAddresses||[]).map(a=>serializeAddress(a,false))),
  banks:f.banks.filter(b=>(b.acct||'').trim()).map(b=>({bank:(lookupBank(b.bank_code)||{}).name_th||b.bank||'',bank_code:b.bank_code||'',acct:b.acct,name:b.name,purpose:b.purpose||'standard',currency:b.currency||f.currency||'THB',primary:!!b.is_primary,verification_status:b.verification_status||'unverified',verified:(b.verification_status||'unverified')==='verified'||!!b.verified,verified_at:b.verified_at||null})),
  attachments:(f.attachments||[]).map(a=>({id:a.id,name:a.name,size:a.size,document_type:a.document_type||'other',issued_at:a.issued_at||'',valid_until:a.valid_until||'',verification_status:a.verification_status||'unverified',verified_by:a.verified_by||null}))};}
function persist(targetStatus){const f=state.form;const p=buildPayload();
  if(state.drawer.mode==='create'){
    const nv=seedAudit(vendor(Object.assign({id:'V'+Date.now(),kyc:'pending',status:targetStatus,createdBy:U().uid,created:new Date().toISOString()},p)));
    RAW.unshift(nv);
  }else{
    const r=RAW.find(x=>x.id===state.drawer.id);
    Object.assign(r,p);
    if(r.kyc==='passed')r.tax=r.tax; // immutable already guarded in UI
    r.version+=1;
    r.audit.push({t:'แก้ไขข้อมูล (amend) · v'+r.version,by:U().name,at:new Date().toISOString(),v:''});
  }
}
function saveDraft(){captureForm();if(!(state.form.name||'').trim()){showToast('กรุณากรอกชื่อคู่ค้าก่อนบันทึกร่าง','warning');return;}
  const current=state.drawer.mode==='edit'?RAW.find(x=>x.id===state.drawer.id):null;if(current?.status==='active'&&!validateStep(2))return;
  persist(state.drawer.mode==='edit'?undefined:'draft');showToast('บันทึกร่างแล้ว','info');closeDrawer();}
function submitForm(){if(state.submitting)return;captureForm();
  if(!validateStep(1))return;if(!validateStep(2))return;
  state.submitting=true;render();setTimeout(()=>{if(state.drawer.mode==='edit'){persist();state.submitting=false;showToast('บันทึกการแก้ไขแล้ว (version +1)','success');closeDrawer();return;}
  persist('pending_kyc');state.submitting=false;showToast('สร้างคู่ค้าแล้ว — ส่งเข้ากระบวนการ KYC','success');closeDrawer();},450);}

/* ====== LIFECYCLE TRANSITIONS ====== */
// submit from view: draft→pending_kyc ; pending_kyc(+kyc passed)→pending_approval (Policy Center decides every type)
function submitFromView(id){const r=RAW.find(x=>x.id===id);if(!canSubmit()){showToast('ไม่มีสิทธิ์ส่ง','error');return;}
  if(r.status==='draft'){r.status='pending_kyc';r.audit.push({t:'ส่งเข้ากระบวนการ KYC',by:U().name,at:new Date().toISOString(),v:''});render();showToast('ส่งเข้ากระบวนการ KYC','info');return;}
  if(r.status==='pending_kyc'){
    // FN-09 enforceKycGate
    if(r.kyc!=='passed'){showToast('KYC_NOT_PASSED · ต้องผ่าน KYC ก่อนส่งอนุมัติ','error');return;}
    // NOT_READY: ≥1 contact (email+phone) + ≥1 verified bank (paid vendor)
    if(!hasValidContact(r)){showToast('NOT_READY · ต้องมีผู้ติดต่อ (อีเมล+โทร) อย่างน้อย 1 ราย','warning');return;}
    if(paidVendorNeedsBank(r)&&!bankVerified(r)){showToast('NOT_READY · ต้องมีบัญชีธนาคารที่ยืนยันแล้วอย่างน้อย 1 บัญชี','warning');return;}
    const chain=newChain(r);if(!chain.length){showToast('ยังไม่พบสายอนุมัติ กรุณาลองใหม่อีกครั้ง','error');return;}r.approvalChain=chain;r.status='pending_approval';const fst=currentStep(r);r.audit.push({t:'ส่งอนุมัติ — DOA chain '+(r.approvalChain.length)+' ขั้น',by:U().name,at:new Date().toISOString(),v:''});render();showToast('ส่งอนุมัติ — รอ '+fst.label,'success');return;
  }
}
function verifyBank(id,idx){const r=RAW.find(x=>x.id===id);
  if(!isFinance()){showToast('FORBIDDEN · ยืนยันบัญชีได้เฉพาะฝ่ายการเงิน','error');return;}
  if((r.banks[idx].verification_status||'unverified')==='unverified'){r.banks[idx].verification_status='pending_verification';r.audit.push({t:'ส่งบัญชีธนาคารเข้าคิวตรวจสอบ',by:U().name,at:new Date().toISOString(),v:''});showToast('ส่งบัญชีเข้าคิวตรวจสอบแล้ว','info');render();return;}
  r.banks[idx].verification_status='verified';r.banks[idx].verified=true;r.banks[idx].verified_at=new Date().toISOString();
  r.audit.push({t:'ยืนยันบัญชีธนาคาร ('+maskAcct(r.banks[idx].acct)+')',by:U().name,at:new Date().toISOString(),v:'warning'});
  showToast('ยืนยันบัญชีธนาคารแล้ว — PV gate ปลดล็อก','success');render();}
function disableBank(id,idx){if(!isFinance()){showToast('ปิดใช้บัญชีได้เฉพาะฝ่ายการเงิน','error');return;}const r=RAW.find(x=>x.id===id),bank=r?.banks?.[idx];if(!bank){showToast('ไม่พบบัญชีธนาคารที่เลือก','error');return;}
  state.modal={open:true,type:'bank_disable',id,bankIndex:idx};render();requestAnimationFrame(()=>document.getElementById('modalBackdrop').classList.add('is-open'));}
function modalBankDisable(r){const b=r.banks?.[state.modal.bankIndex];if(!b)return '';return `<div class="modal-header"><div class="modal-header-icon is-warning"><i data-lucide="archive" class="w-5 h-5"></i></div><div style="flex:1;"><h3 class="modal-title">ปิดใช้บัญชีธนาคาร</h3><p class="modal-subtitle">${esc(b.bank||'บัญชีธนาคาร')} · ${maskAcct(b.acct)}</p></div><button class="icon-btn" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button></div><div class="modal-body"><div class="message-box info-amber"><i data-lucide="info" class="w-3.5 h-3.5"></i><div>บัญชีนี้จะไม่ถูกใช้สำหรับการจ่ายเงินใหม่ แต่ประวัติเดิมยังคงอยู่</div></div><div class="field vl-18"><label class="field-label">เหตุผลที่ปิดใช้บัญชี <span class="req">*</span></label><textarea class="input vl-11" id="bank-disable-reason" placeholder="ระบุเหตุผลที่ปิดใช้บัญชี..."></textarea></div></div><div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-danger" onclick="confirmBankDisable()"><i data-lucide="archive" class="w-4 h-4"></i><span>ยืนยันปิดใช้บัญชี</span></button></div>`;}
function confirmBankDisable(){if(!isFinance()){showToast('ปิดใช้บัญชีได้เฉพาะฝ่ายการเงิน','error');return;}const r=RAW.find(x=>x.id===state.modal.id),b=r?.banks?.[state.modal.bankIndex],reason=(document.getElementById('bank-disable-reason')?.value||'').trim();if(!b){showToast('ไม่พบบัญชีธนาคารที่เลือก','error');return;}if(!reason){showToast('กรุณาระบุเหตุผลที่ปิดใช้บัญชี','warning');return;}b.verification_status='disabled';b.verified=false;b.primary=false;b.is_primary=false;b.disabled_at=new Date().toISOString();b.disabled_reason=reason;r.audit.push({t:'ปิดใช้บัญชีธนาคาร ('+maskAcct(b.acct)+') — '+reason,by:U().name,at:b.disabled_at,v:'warning'});closeModal();showToast('ปิดใช้บัญชีแล้ว — ประวัติยังคงอยู่','warning');}
function modalUnblock(r){const kycOk=r.kyc==='passed',policyOk=(r.policyDecision||{}).is_valid!==false,ok=canBlock()&&kycOk&&policyOk,paymentOk=!paidVendorNeedsBank(r)||bankVerified(r);return `<div class="modal-header"><div class="modal-header-icon" style="background:rgba(0,168,142,0.12);color:var(--c-teal);"><i data-lucide="rotate-ccw" class="w-5 h-5"></i></div>
  <div style="flex:1;"><h3 class="modal-title">ปลดบล็อกคู่ค้า</h3><p class="modal-subtitle">${r.code} · ${r.name}</p></div>

  <div class="modal-body">
    <div class="message-box ${kycOk&&policyOk?'info-green':'info-amber'}"><i data-lucide="${kycOk&&policyOk?'check-circle-2':'alert-triangle'}" class="w-3.5 h-3.5"></i><div>${kycOk&&policyOk?'คู่ค้าผ่านเงื่อนไขสำหรับกลับมาใช้งาน':'ยังปลดบล็อกไม่ได้ กรุณาดำเนินการตามเงื่อนไขที่แสดง'}</div></div>
    <div class="summary-grid vl-18"><div><span>KYC</span><strong>${kycOk?'ผ่าน':'ต้องตรวจและให้ผ่านก่อน'}</strong></div><div><span>นโยบายอนุมัติ</span><strong>${policyOk?'พร้อมใช้งาน':'ต้องตรวจสอบใหม่'}</strong></div><div><span>การจ่ายเงิน</span><strong>${paymentOk?'พร้อม':'ต้องยืนยันบัญชีธนาคารก่อนทำ PV'}</strong></div></div>
    ${r.block?`<div class="field vl-18" ><label class="field-label">เหตุผลที่ถูกบล็อกเดิม</label><div  class="vl-29">${esc(r.block)}</div></div>`:''}
    <div class="field vl-18" ><label class="field-label">เหตุผลที่ปลดบล็อก <span class="req">*</span></label><textarea class="input vl-11" id="ublk-reason"  placeholder="ระบุเหตุผล..."></textarea></div>
  </div>
  <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>
    <button class="btn btn-primary" onclick="confirmUnblock()" ${ok?'':'style="opacity:.45;pointer-events:none;"'}><i data-lucide="rotate-ccw" class="w-4 h-4"></i><span>ปลดบล็อก</span></button></div>`;}
function confirmUnblock(){const r=RAW.find(x=>x.id===state.modal.id);if(!canBlock()){showToast('ไม่มีสิทธิ์','error');return;}
  if(r.kyc!=='passed'){showToast('ต้องผ่าน KYC ก่อนปลดบล็อก','error');return;}if((r.policyDecision||{}).is_valid===false){showToast('นโยบายการอนุมัติของคู่ค้านี้ยังไม่พร้อมใช้งาน','error');return;}
  const reason=(document.getElementById('ublk-reason')?.value||'').trim();if(!reason){showToast('REASON_REQUIRED · กรุณาระบุเหตุผล','warning');return;}
  r.status='active';r.block='';r.audit.push({t:'ปลดบล็อก → ใช้งาน — '+reason,by:U().name,at:new Date().toISOString(),v:'success'});
  closeModal();closeDrawer();showToast('ปลดบล็อกแล้ว → ใช้งาน','success');}

/* ====== MODALS (P-05 approve/reject · P-06 block/blacklist · API-10 KYC) ====== */
function openModal(type,id){state.modal={open:true,type,id};if(type==='kyc')Object.assign(state.modal,{sanctionHit:false,kycSource:'',kycNote:''});render();requestAnimationFrame(()=>document.getElementById('modalBackdrop').classList.add('is-open'));}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('is-open');setTimeout(()=>{state.modal={open:false,type:null,id:null,addressId:null,addressMode:null,bankIndex:null};render();},200);}

function renderModal(){
  if(!state.modal.open)return '';if(state.modal.type==='address_remove')return modalAddressRemove();const r=RAW.find(x=>x.id===state.modal.id);if(!r)return '';const t=tierOf(r);const ty=state.modal.type;
  if(ty==='approve')return modalApprove(r,t);
  if(ty==='reject')return modalReject(r);
  if(ty==='kyc')return modalKyc(r);
  if(ty==='bank_disable')return modalBankDisable(r);
  if(ty==='unblock')return modalUnblock(r);
  if(ty==='inactive')return modalInactive(r);
  return modalBlock(r,ty==='blacklist');
}
function modalAddressRemove(){const a=findA(state.modal.addressId);if(!a)return '';const disable=state.modal.addressMode==='disable';const roles=[a.is_billing?'ที่อยู่ใบกำกับ':'',a.is_primary_shipping?'ที่อยู่จัดส่งหลัก':''].filter(Boolean);
  return `<div class="modal-header"><div class="modal-header-icon is-warning"><i data-lucide="${disable?'archive':'trash-2'}" class="w-5 h-5"></i></div>
    <div style="flex:1;"><h3 class="modal-title">${disable?'ปิดใช้ที่อยู่นี้?':'ลบที่อยู่นี้?'}</h3><p class="modal-subtitle">${esc(a.label||'ที่อยู่')} · ${esc(a.line||'ยังไม่ได้กรอกรายละเอียด')}</p></div>
    <button class="icon-btn" onclick="closeModal()"><i data-lucide="x" class="w-4 h-4"></i></button></div>

function showToast(msg,variant='info',ms=2800){const el=document.getElementById('toast');const map={success:'check-circle-2',info:'info',warning:'alert-triangle',error:'x-circle'};el.className='toast is-'+variant;el.innerHTML=`<i data-lucide="${map[variant]||'info'}" class="w-4 h-4"></i><span>${msg}</span>`;renderIcons();requestAnimationFrame(()=>el.classList.add('is-visible'));clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('is-visible'),ms);}
function render(){const snap=preserveRenderState();
  document.getElementById('page-content').innerHTML=renderList();
  document.getElementById('drawer').innerHTML=renderDrawer();
  document.getElementById('modalEl').innerHTML=renderModal();
  renderUserChip();
  renderIcons();restoreRenderState(snap);}
function renderIcons(){if(window.lucide&&typeof window.lucide.createIcons==='function')window.lucide.createIcons();}
function preserveRenderState(){const db=document.querySelector('.drawer-body');const mb=document.querySelector('.modal-body');const a=document.activeElement;const isI=a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA');
  return{ds:db?db.scrollTop:0,ms:mb?mb.scrollTop:0,ps:window.scrollY,fk:isI?{grp:a.getAttribute('data-grp'),i:a.getAttribute('data-i'),fld:a.getAttribute('data-fld'),id:a.id||'',ss:a.selectionStart,se:a.selectionEnd}:null};}
function restoreRenderState(s){if(!s)return;requestAnimationFrame(()=>{
  const db=document.querySelector('.drawer-body');if(db&&s.ds>0)db.scrollTop=s.ds;
  const mb=document.querySelector('.modal-body');if(mb&&s.ms>0)mb.scrollTop=s.ms;
  if(s.ps>0)window.scrollTo(0,s.ps);
  if(s.fk){let c=null;
    if(s.fk.grp)c=document.querySelector(`[data-grp="${s.fk.grp}"][data-i="${s.fk.i}"][data-fld="${s.fk.fld}"]`);
    else if(s.fk.id)c=document.getElementById(s.fk.id);
    if(c){c.focus();if(s.fk.ss!=null&&c.setSelectionRange){try{c.setSelectionRange(s.fk.ss,s.fk.se);}catch(e){}}}}
});}
