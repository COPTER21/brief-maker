/* #95: เมนูใน scroll container (.table-wrap / drawer body / B2 line grid)
   ต้อง portal ด้วย util นี้ — z-index อย่างเดียวช่วยไม่ได้เพราะโดน ancestor overflow clip */
function portalMenu(trigger, menu){
  let host = document.getElementById('overlay-root');
  if(!host){ host = document.createElement('div'); host.id='overlay-root'; document.body.appendChild(host); }
  if(menu.parentElement !== host) host.appendChild(menu);
  menu.classList.add('menu-fixed');
  const r = trigger.getBoundingClientRect();
  const below = window.innerHeight - r.bottom - 12, above = r.top - 12;
  const h = Math.min(menu.scrollHeight || 320, 320);
  menu.style.left = r.left + 'px';
  menu.style.width = r.width + 'px';
  if(below < h && above > below){ menu.style.top='auto'; menu.style.bottom=(window.innerHeight-r.top+4)+'px';
    menu.style.maxHeight = Math.min(h, above)+'px'; }
  else { menu.style.bottom='auto'; menu.style.top=(r.bottom+4)+'px';
    menu.style.maxHeight = Math.min(h, Math.max(below,120))+'px'; }
  menu._trigger = trigger;
  const reposition = ()=>{ if(menu.classList.contains('open')) portalMenu(trigger, menu); };
  if(!menu._portalBound){ menu._portalBound = true;
    window.addEventListener('scroll', reposition, true);
    window.addEventListener('resize', reposition); }
}
function positionMenu(trigger,menu){const r=trigger.getBoundingClientRect();
  const below=window.innerHeight-r.bottom-12, above=r.top-12, h=Math.min(menu.scrollHeight,320);
  if(below<h && above>below){menu.classList.add('drop-up');menu.style.maxHeight=Math.min(h,above)+'px';}
  else{menu.classList.remove('drop-up');menu.style.maxHeight=Math.min(h,Math.max(below,120))+'px';}}
function openOverlay(menu,trigger){document.querySelectorAll('[data-overlay].open').forEach(m=>{if(m!==menu)closeOverlay(m);});
  menu.classList.add('open');menu._trigger=trigger;if(trigger)positionMenu(trigger,menu);}
function closeOverlay(menu){menu.classList.remove('open');if(menu._trigger)menu._trigger.focus();}
document.addEventListener('click',e=>{document.querySelectorAll('[data-overlay].open').forEach(m=>{
  if(!m.contains(e.target)&&!(m._trigger&&m._trigger.contains(e.target)))closeOverlay(m);});});

/* --- scroll lock + focus trap (#a11y · เพิ่ม 2026-08-04) ---
   lockScroll: กันพื้นหลังเลื่อนตอน overlay เปิด · นับชั้นได้ (modal ซ้อน drawer)
   trapFocus : กัน Tab หลุดออกไปพื้นหลัง + โฟกัสตัวแรกในกล่อง + คืนโฟกัสเดิมตอนปิด */
function lockScroll(on){ document.body.classList.toggle('is-overlay-open', !!on); }
var __focusStack = [];
function trapFocus(box){
  if(!box) return;
  var prev = document.activeElement;
  var sel = 'a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
  function onKey(e){
    if(e.key !== 'Tab') return;
    var f = [].slice.call(box.querySelectorAll(sel)).filter(function(el){ var r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; });
    if(!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
  box.__trap = onKey; box.__prevFocus = prev;
  document.addEventListener('keydown', onKey);
  requestAnimationFrame(function(){
    var f = box.querySelector(sel);
    if(f) f.focus();
  });
}
function releaseFocus(box){
  if(!box || !box.__trap) return;
  document.removeEventListener('keydown', box.__trap);
  var prev = box.__prevFocus;
  box.__trap = null; box.__prevFocus = null;
  if(prev && typeof prev.focus === 'function') prev.focus();
}
/* ===== END BASE-KIT UTILS ===== */
</script>

/* ============================================================ RENDER ============================================================ */
function render(){
  const snap=preserveRenderState();
  const rt=getRoute();
  RC.tab=(rt.indexOf('recruit/')===0)?rt.split('/')[1]:'req';
  if(['req','pool','board','report'].indexOf(RC.tab)<0)RC.tab='req';
  document.getElementById('page-content').innerHTML=renderPage();
  document.getElementById('drawer').innerHTML=(state.drawer.open&&RC.dctx)?renderDrawer():'';
  const mh=document.querySelector('#modalBackdrop .modal');
  if(mh)mh.innerHTML=(state.modal.open&&RC.mctx)?renderModal():'';
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.toggle('is-active',el.dataset.feature==='recruit'));
  syncPersonaChip();
  renderIcons();
  mountCombos();
  restoreRenderState(snap);
}

function renderPage(){
  const tabs=[
    {id:'req',name:'ตำแหน่งที่เปิด',icon:'clipboard-list',ct:DB.reqs.length},
    {id:'pool',name:'คลังผู้สมัคร',icon:'users',ct:DB.cands.length},
    {id:'board',name:'บอร์ดสรรหา',icon:'columns-3',ct:DB.cands.filter(inPipeline).length},
    {id:'report',name:'รายงาน',icon:'bar-chart-3',ct:null},
  ];
  const titleMap={req:'ตำแหน่งที่เปิด (Requisition)',pool:'คลังผู้สมัคร (Candidate Pool)',board:'บอร์ดสรรหา (Pipeline)',report:'รายงานการสรรหา (Funnel)'};
  const subMap={req:'เปิดอัตรา · ส่งอนุมัติ (DOA) · ประกาศ · ปิดอัตรา',pool:'ทะเบียนผู้สมัคร · ความยินยอม PDPA · ข้อมูล RESTRICTED',board:'ลากสถานะผู้สมัคร: คัดกรอง → สัมภาษณ์ → ข้อเสนอ → รับเข้าทำงาน',report:'Funnel · time-to-hire · ผลการคัดเลือก'};
  let actions='';
  if(RC.tab==='req'&&RC.persona!=='viewer')actions=`<button class="btn btn-primary" onclick="openReqCreate()"><i data-lucide="plus" class="w-4 h-4"></i><span>เปิดอัตราใหม่</span></button>`;
  else if(RC.tab==='pool'&&RC.persona!=='viewer')actions=`<button class="btn btn-primary" onclick="openCandCreate()"><i data-lucide="user-plus" class="w-4 h-4"></i><span>เพิ่มผู้สมัคร</span></button>`;
  else if(RC.tab==='report')actions=`<button class="btn btn-secondary" onclick="showToast('ส่งออกรายงาน (CSV) — ต่อ dev','info')"><i data-lucide="download" class="w-4 h-4"></i><span>Export CSV</span></button>`;
  const ph=`<div class="ph"><div><div class="ph-title-row"><h1 class="ph-title">${titleMap[RC.tab]}</h1></div><p class="ph-sub">${subMap[RC.tab]}</p></div><div class="ph-actions">${actions}</div></div>`;
  const tabbar=`<div class="tabs">${tabs.map(t=>`<button class="tab ${RC.tab===t.id?'is-active':''}" onclick="go('recruit/${t.id}')"><i data-lucide="${t.icon}" class="w-4 h-4"></i><span>${t.name}</span>${t.ct!=null?`<span class="tab-ct">${t.ct}</span>`:''}</button>`).join('')}</div>`;
  let body='';
  if(RC.tab==='req')body=renderReqTab();
  else if(RC.tab==='pool')body=renderPoolTab();
  else if(RC.tab==='board')body=renderBoardTab();
  else body=renderReportTab();
  return ph+tabbar+body;
}

    approvalHook=`<div class="note is-info mb-3"><i data-lucide="inbox"></i><div><b>งานรออนุมัติของฉัน · ${pendingMine.length} รายการ</b> — เปิดรายการสถานะ “รออนุมัติเปิด” เพื่ออนุมัติ/ไม่อนุมัติ (My Approval)</div></div>`;
  }
  const q=RC.f.req.q.toLowerCase(),fs=RC.f.req.status;
  const rows=DB.reqs.filter(r=>(fs==='all'||r.status===fs)&&(!q||(r.position+r.code+r.dept).toLowerCase().includes(q)));
  const filterBar=`<div class="filter-bar">
    <div class="input-search"><i data-lucide="search" class="lead-icon"></i><input class="input" placeholder="ค้นหาตำแหน่ง / เลขที่ / แผนก" value="${esc(RC.f.req.q)}" oninput="RC.f.req.q=this.value;renderPageOnly()"></div>

      <option value="all"${fs==='all'?' selected':''}>ทุกสถานะ</option>
      ${Object.keys(REQ_STATUS).map(k=>`<option value="${k}"${fs===k?' selected':''}>${REQ_STATUS[k].label}</option>`).join('')}
    </select>
    <button class="btn btn-ghost" style="margin-left:auto" onclick="RC.f.req={q:'',status:'all'};renderPageOnly()"><i data-lucide="rotate-ccw" class="w-4 h-4"></i><span>ล้างตัวกรอง</span></button>
  </div>`;
  let inner;
  if(!rows.length){inner=emptyStateHTML({icon:'clipboard-list',title:'ไม่พบอัตราที่เปิด',desc:'ลองปรับคำค้นหรือล้างตัวกรอง แล้วลองอีกครั้ง',actionLabel:'ล้างตัวกรอง',actionIcon:'rotate-ccw',onAction:"RC.f.req={q:'',status:'all'};renderPageOnly()"});}
  else{
    inner=`<div class="table-wrap"><table class="table"><thead><tr>
      <th>เลขที่ / ตำแหน่ง</th><th>แผนก</th><th>ระดับ (band)</th><th class="col-num">อัตรา</th><th>ผู้จัดการสายงาน</th><th>Manpower</th><th>สถานะ</th>
    </tr></thead><tbody>${rows.map(r=>{
      const b=BANDS.find(x=>x.grade_code===r.grade)||{};
      return `<tr class="is-clickable" onclick="openReqView('${r.id}')">
        <td><div style="font-weight:600">${esc(r.position)}</div><div style="font-size:12px;color:var(--c-mute-2)" class="num">${esc(r.code)}</div></td>
        <td>${esc(r.dept)}</td>
        <td>${esc(r.grade)} · ${esc(b.grade_name||'')}</td>
        <td class="col-num">${r.filled}/${r.count}</td>
        <td>${esc(empName(r.hiring_manager_id))}</td>
        <td>${r.manpower_ref?`<span class="num" style="font-size:12px">${esc(r.manpower_ref)}</span>`:`<span class="chip-soft is-dup"><i data-lucide="alert-triangle"></i>ไม่มีแผน</span>`}</td>
        <td>${reqStatusPill(r.status)}</td>
      </tr>`;}).join('')}</tbody></table></div>
      <div class="table-footer"><span></span><span>${rows.length} รายการ</span></div>`;

function reqStatusPill(s){const m=REQ_STATUS[s];return `<span class="pill ${m.pill}">${m.label}</span>`;}

    </tr></thead><tbody>${rows.map(c=>{
      const r=reqOfCand(c);

function personInitials(name){const p=String(name).trim().split(/\s+/);return((p[0]||'').slice(0,1)+((p[1]||'').slice(0,1)))||'?';}
function stagePill(c){if(TERMINAL[c.stage])return `<span class="pill ${TERMINAL[c.stage].pill}">${TERMINAL[c.stage].label}</span>`;const s=stageOf(c.stage);return `<span class="pill" style="background:${s.color}1f;color:${s.color}">${s.name}</span>`;}
function consentChip(c){return c.consent.ok?`<span class="chip-soft is-consent"><i data-lucide="shield-check"></i>ยินยอมแล้ว</span>`:`<span class="chip-soft is-noconsent"><i data-lucide="shield-alert"></i>รอความยินยอม</span>`;}
function maskEmail(e){if(PERSONAS[RC.persona].unmask)return e;const parts=String(e).split('@');return parts[0].slice(0,1)+'•••@'+(parts[1]||'');}
function maskPhone(p){if(PERSONAS[RC.persona].unmask)return p;const s=String(p).replace(/\D/g,'');return '•••-•••-'+s.slice(-4);}
function contactCell(c){
  if(!c.consent.ok)return '<span class="masked"><i data-lucide="lock"></i>ต้องได้รับความยินยอมก่อน</span>';
  const um=PERSONAS[RC.persona].unmask;
  const mailIc=um?'':'<i data-lucide="lock"></i>';
  return `<div style="font-size:12.5px"><span class="masked">${mailIc}${esc(maskEmail(c.email))}</span></div><div style="font-size:12px;color:var(--c-mute-2)">${esc(maskPhone(c.phone))}</div>`;
}

/* -------- TAB 3 : Pipeline board (kanban · FN-06) -------- */
function renderBoardTab(){
  const cols=STAGES.map(s=>{
    const list=DB.cands.filter(c=>c.stage===s.id);
    const cards=list.length?list.map(c=>kbCard(c)).join(''):`<div class="kb-empty">— ว่าง —</div>`;
    return `<div class="kb-col"><div class="kb-col-head"><span class="dotk" style="background:${s.color}"></span><span class="nm">${s.name}</span><span class="kb-count">${list.length}</span></div><div class="kb-body">${cards}</div></div>`;
  }).join('');
  const terminals=DB.cands.filter(c=>TERMINAL[c.stage]);
  const term=terminals.length?`<div class="note is-info mt-4"><i data-lucide="archive"></i><div><b>นอกไปป์ไลน์ · ${terminals.length} รายการ</b> — ${terminals.map(c=>esc(c.name)+' ('+TERMINAL[c.stage].label+')').join(' · ')}</div></div>`:'';
  return `<div class="card" style="padding:14px;background:transparent;border:0"><div class="kanban">${cols}</div></div>${term}`;
}
function kbCard(c){
  const r=reqOfCand(c);
  const idxC=stageIdx(c.stage);
  const canFwd=idxC>=0&&idxC<STAGES.length-1&&c.consent.ok&&RC.persona!=='viewer';
  const canBack=idxC>0&&RC.persona!=='viewer';
  const move=`<div class="kc-move">
    <button class="btn btn-sm btn-secondary" ${canBack?'':'disabled'} onclick="event.stopPropagation();candMoveStage('${c.id}',-1)"><i data-lucide="arrow-left" class="w-3.5 h-3.5"></i></button>
    <button class="btn btn-sm btn-primary" ${canFwd?'':'disabled'} style="flex:1" onclick="event.stopPropagation();candMoveStage('${c.id}',1)"><span>ถัดไป</span><i data-lucide="arrow-right" class="w-3.5 h-3.5"></i></button>
  </div>`;
  return `<div class="kb-card" onclick="openCandView('${c.id}')">
    <div class="kc-top"><div class="uc-avatar" style="width:28px;height:28px;font-size:11px">${esc(personInitials(c.name))}</div>
      <div style="min-width:0"><div class="kc-name">${esc(c.name)}</div><div class="kc-sub">${r?esc(r.position):'—'}</div></div></div>
    <div class="kc-meta">${consentChip(c)}${c.dup?'<span class="chip-soft is-dup"><i data-lucide="copy"></i>เคยสมัคร</span>':''}${c.score?`<span class="kb-score"><i data-lucide="star"></i>${c.score}/5</span>`:''}</div>
    ${idxC<STAGES.length-1?move:'<div class="kc-move"><span style="font-size:11px;color:var(--c-success);font-weight:700">✓ รับเข้าทำงานแล้ว</span></div>'}
  </div>`;
}

/* -------- TAB 4 : Report funnel (FN-15) -------- */
function renderReportTab(){
  const scope=RC.f.report.req;
  const pool=DB.cands.filter(c=>scope==='all'||c.reqId===scope);
  const reached=STAGES.map(s=>({s,n:pool.filter(c=>{const i=stageIdx(c.stage);return i>=0&&i>=stageIdx(s.id);}).length}));
  const maxN=Math.max(1,...reached.map(x=>x.n));
  const hired=pool.filter(c=>c.stage==='hired').length;
  const rejected=pool.filter(c=>c.stage==='rejected'||c.stage==='talent_pool').length;
  const withdrawn=pool.filter(c=>c.stage==='withdrawn').length;
  const stats=[
    {ic:'users',l:'ผู้สมัครทั้งหมด',v:pool.length},
    {ic:'messages-square',l:'กำลังสัมภาษณ์',v:pool.filter(c=>c.stage==='interview').length},
    {ic:'file-signature',l:'ข้อเสนอ',v:pool.filter(c=>c.stage==='offer').length},
    {ic:'user-check',l:'รับเข้าทำงาน',v:hired},
    {ic:'timer',l:'Time-to-hire เฉลี่ย',v:'23 วัน'},
  ];
  return `<div class="filter-bar" style="border-radius:10px 10px 0 0;border:1px solid var(--c-line-2)">
      <span style="font-size:12.5px;color:var(--c-mute)">กรองตามอัตรา</span>
      <select class="select" style="max-width:280px" onchange="RC.f.report.req=this.value;renderPageOnly()">
        <option value="all"${scope==='all'?' selected':''}>ทุกอัตรา</option>
        ${DB.reqs.map(r=>`<option value="${r.id}"${scope===r.id?' selected':''}>${esc(r.code)} · ${esc(r.position)}</option>`).join('')}
      </select></div>
    <div class="stats" style="margin-top:14px">${stats.map(s=>`<div class="stat"><div class="stat-label"><i data-lucide="${s.ic}" class="w-3 h-3"></i>${s.l}</div><div class="stat-value">${s.v}</div></div>`).join('')}</div>
    <div class="card" style="padding:18px"><div class="sec-h"><i data-lucide="filter"></i>Funnel การสรรหา</div>
      <div class="funnel">${reached.map(x=>`<div class="funnel-row"><span class="fl">${x.s.name}</span><div class="funnel-track"><div class="funnel-fill" style="width:${Math.round(x.n/maxN*100)}%"></div></div><span class="fn">${x.n} คน</span></div>`).join('')}</div>
      <div class="note is-info" style="margin-top:16px"><i data-lucide="info"></i><div>ผลการคัดเลือก: รับเข้าทำงาน <b>${hired}</b> · ไม่ผ่าน/เก็บ Talent Pool <b>${rejected}</b> · ถอนตัว <b>${withdrawn}</b></div></div>
    </div>`;
}

function submitReq(asDraft){
  if(viewerRO())return;
  if(RC.busy)return;
  const d=RC.draft;
  const badR=[];
  if(!String(d.position).trim())badR.push('f-position');
  if(!String(d.dept).trim())badR.push('f-dept');
  if(!(Number(d.count)>=1))badR.push('f-count');
  if(badR.length||!d.hiring_manager_id){markInvalidFields(badR);showToast(!badR.length&&!d.hiring_manager_id?'กรุณาเลือกผู้จัดการสายงาน':'กรุณากรอกข้อมูลที่ไฮไลต์ให้ครบ','warning');return;}
  RC.busy=true;
  if(RC.dctx.mode==='edit'){const r=getReq(RC.dctx.id);Object.assign(r,{position:d.position,dept:d.dept,count:Number(d.count),grade:d.grade,hiring_manager_id:d.hiring_manager_id,manpower_ref:d.manpower_ref||null,desc:d.desc});audit(r,'แก้ไขข้อมูลอัตรา','');closeDrawer();setTimeout(()=>{RC.busy=false;render();showToast('บันทึกการแก้ไขแล้ว','success');},300);return;}
  const seq=String(DB.reqs.length+1).padStart(4,'0');
  const nr={id:'REQ-'+Date.now(),code:'REQ-2569-'+seq,position:d.position,dept:d.dept,count:Number(d.count),filled:0,grade:d.grade,hiring_manager_id:d.hiring_manager_id,manpower_ref:d.manpower_ref||null,status:asDraft?'draft':'draft',createdAt:new Date().toISOString().slice(0,10),desc:d.desc,approval:null,history:[]};
  audit(nr,asDraft?'บันทึกร่างอัตรา':'สร้างอัตรา (ร่าง)',d.manpower_ref?'':'ไม่มีแผน Manpower',d.manpower_ref?'ok':'warn');
  DB.reqs.push(nr);closeDrawer();
  setTimeout(()=>{RC.busy=false;render();showToast(asDraft?'บันทึกร่างแล้ว':'สร้างอัตราแล้ว (ร่าง) — ส่งอนุมัติเปิดได้จากหน้ารายละเอียด','success');},300);
}

function findDuplicate(email,phone,exceptId){email=String(email||'').trim().toLowerCase();phone=String(phone||'').replace(/\D/g,'');if(!email&&!phone)return null;return DB.cands.find(c=>c.id!==exceptId&&((email&&c.email.toLowerCase()===email)||(phone&&c.phone.replace(/\D/g,'')===phone)))||null;}
function submitCand(){
  if(viewerRO())return;
  if(RC.busy)return;const d=RC.draft;
  const badC=[];
  if(!String(d.name).trim())badC.push('c-name');
  if(!String(d.email).trim())badC.push('c-email');
  if(!String(d.phone).trim())badC.push('c-phone');
  if(badC.length){markInvalidFields(badC);showToast('กรุณากรอกข้อมูลที่ไฮไลต์ให้ครบ','warning');return;}
  RC.busy=true;
  const dup=findDuplicate(d.email,d.phone,null);
  const seq=String(DB.cands.length+11).padStart(4,'0');
  const nc={id:'C'+Date.now(),code:'APP-2569-'+seq,name:d.name,email:d.email,phone:d.phone,resume:d.resume||'',reqId:d.reqId||null,stage:'applied',score:null,consent:{ok:!!d.consent,date:d.consent?new Date().toISOString().slice(0,10):null},dup:!!dup,dupNote:dup?('ตรงกับ '+dup.code):'',offer:null,interviews:[],onboardSent:false,appliedAt:new Date().toISOString().slice(0,10),history:[]};
  audit(nc,'เพิ่มผู้สมัครเข้าคลัง',(dup?'พบซ้ำ/เคยสมัคร · ':'')+(d.consent?'':'ยังไม่ได้รับความยินยอม PDPA'),d.consent?'ok':'warn');
  DB.cands.push(nc);closeDrawer();
  setTimeout(()=>{RC.busy=false;render();showToast('สร้างผู้สมัครสำเร็จ','success');},300);
}

    <div class="band-card mb-3"><div style="font-size:12px;color:var(--c-mute-2)">ช่วงเงินเดือน ${esc(b.grade_code)} · เวอร์ชัน <span class="num">${esc(b.version_id)}</span> ${d.start?'· ณ '+fmtDate(d.start):''}</div>
      <div class="band-scale"><div class="band-seg"><div class="bl">ต่ำสุด</div><div class="bv">${fmtNumber(b.min)}</div></div><div class="band-seg is-mid"><div class="bl">กลาง</div><div class="bv">${fmtNumber(b.mid)}</div></div><div class="band-seg"><div class="bl">สูงสุด</div><div class="bv">${fmtNumber(b.max)}</div></div></div></div>
    <div class="field"><label class="field-label">เงินเดือนที่เสนอ <span class="req">*</span></label><input type="number" class="input" value="${esc(d.salary)}" oninput="RC.draft.offer.salary=this.value" onblur="render()" placeholder="เช่น 62000"></div>
    ${out?`<div class="note is-warn mb-3"><i data-lucide="alert-triangle"></i><div>เงินนอกช่วง band (${fmtNumber(b.min)}–${fmtNumber(b.max)}) — เตือนไม่บล็อก แต่<b>ต้องระบุเหตุผล</b></div></div>
      <div class="field"><label class="field-label">เหตุผลนอกช่วง (out_of_range_reason) <span class="req">*</span></label><textarea class="notes-area" oninput="RC.draft.offer.reason=this.value" style="min-height:64px" placeholder="เหตุผลที่เสนอเกิน/ต่ำกว่าช่วง band">${esc(d.reason)}</textarea></div>`:''}
    <div style="display:flex;justify-content:flex-end;gap:8px"><button class="btn btn-primary" onclick="submitOffer('${c.id}')"><i data-lucide="send" class="w-4 h-4"></i><span>สร้างข้อเสนอ + ส่งอนุมัติ</span></button></div>
    </div>`;
}
function submitOffer(cid){
  if(viewerRO())return;
  const c=getCand(cid),d=RC.draft.offer;const b=bandResolve(d.grade,d.start);const sal=Number(d.salary)||0;
  if(!d.start||!(sal>0)){showToast('กรุณากรอกวันเริ่มงานและเงินเดือน','warning');return;}
  const out=sal<b.min||sal>b.max;
  if(out&&!String(d.reason).trim()){showToast('เงินนอกช่วง band — กรุณาระบุเหตุผล','warning');return;}
  c.offer={position:(reqOfCand(c)||{}).position||'',grade:d.grade,salary:sal,start:d.start,status:'pending',out_of_range_reason:out?d.reason:null,
    band:{grade_code:b.grade_code,grade_name:b.grade_name,min:b.min,mid:b.mid,max:b.max,currency:b.currency,version_id:b.version_id},approval:null};
  c.stage='offer';RC.draft.offer=null;
  audit(c,'สร้างข้อเสนอจ้าง + ส่งอนุมัติ','snapshot band '+b.version_id+(out?' · นอกช่วง (มีเหตุผล)':''));
  // ส่งอนุมัติ (DOA)
  openDoaModal('offer',cid);
}

/* ============================================================ ACTIONS ============================================================ */
function candMoveStage(id,dir){
  if(viewerRO())return;
  const c=getCand(id),i=stageIdx(c.stage);if(i<0)return;
  if(dir>0&&!c.consent.ok){showToast('ยังไม่ได้รับความยินยอม PDPA — เลื่อนสถานะไม่ได้','warning');return;}
  const ni=i+dir;if(ni<0||ni>=STAGES.length)return;
  if(STAGES[ni].id==='offer'&&dir>0&&!c.offer){showToast('ไปขั้น “ข้อเสนอ” ให้สร้างข้อเสนอในลิ้นชักผู้สมัคร','info');openCandView(id);RC.dctx.tab='offer';render();return;}
  // FIX-01: ห้ามข้ามไป hired ตรง ๆ — ต้องตอบรับ offer ก่อน แล้ว route ผ่าน candHireHandoff() เส้นเดียวทั้งระบบ
  if(STAGES[ni].id==='hired'&&dir>0){
    if(!c.offer||c.offer.status!=='accepted'){showToast('ต้องให้ผู้สมัครตอบรับข้อเสนอก่อน','info');openCandView(id);RC.dctx.tab='offer';render();return;}
    candHireHandoff(id);return;
  }
  c.stage=STAGES[ni].id;audit(c,'เลื่อนสถานะ → '+STAGES[ni].name,'');ntf('แจ้งเตือน: '+esc(c.name)+' → '+STAGES[ni].name);render();
}
function candSetConsent(id){if(viewerRO())return;const c=getCand(id);c.consent={ok:true,date:new Date().toISOString().slice(0,10)};audit(c,'บันทึกความยินยอม PDPA','');render();showToast('บันทึกความยินยอมแล้ว','success');}
function candTerminate(id){
  if(viewerRO())return;
  openReasonModal({title:'ไม่ผ่าน / ถอนตัว',label:'เลือกผลและระบุเหตุผล',cid:id,withKind:true,confirmLabel:'บันทึก',onConfirm:(reason,kind)=>{
    const c=getCand(id);c.stage=kind;c.reason=reason;
    audit(c,kind==='talent_pool'?'ไม่ผ่าน → เก็บ Talent Pool':(kind==='withdrawn'?'ผู้สมัครถอนตัว':'ไม่ผ่าน'),reason,'warn');
    ntf('แจ้งเตือน: อัปเดตผลผู้สมัคร '+esc(c.name));render();showToast('บันทึกแล้ว','success');
  }});
}
function candHireHandoff(id){
  if(viewerRO())return;
  openConfirm({title:'รับเข้าทำงาน + ส่งเข้า On/Offboard?',body:'ระบบจะยิง event ส่งผู้สมัครเข้ากระบวนการ onboarding (soft-linkage) และตั้งสถานะ “ส่งเข้า onboarding แล้ว” — ไม่สร้าง employee และไม่เชื่อมจริงในรอบนี้',confirmLabel:'ยืนยันรับเข้าทำงาน',danger:false,onConfirm:()=>{
    const c=getCand(id);c.stage='hired';c.onboardSent=true;const r=reqOfCand(c);if(r&&r.filled<r.count){r.filled++;if(r.filled>=r.count&&r.status==='open')r.status='closed';}
    // [OQ-15 · PENDING] inbound handoff ยังไม่ออกแบบ · ยิง event ออก · ไม่สร้าง employee · ไม่ mock หน้าจอ On/Offboard
    audit(c,'รับเข้าทำงาน → ส่งเข้า On/Offboard','ยิง event เริ่ม onboarding (soft-linkage)');
    ntf('แจ้งเตือน: ส่ง '+esc(c.name)+' เข้ากระบวนการ onboarding');render();showToast('ส่งเข้า onboarding แล้ว','success');
  }});
}
/* req approval flow */
function reqSubmitApproval(id){openDoaModal('req',id);}
function reqApprove(id){const r=getReq(id);if(!r.approval)return;const st=r.approval.steps.find(s=>s.result==='pending');if(st){st.result='approved';st.at=new Date().toISOString().slice(0,10);}
  r.approval.current=r.approval.steps.filter(s=>s.result==='approved').length;
  if(r.approval.steps.every(s=>s.result==='approved')){r.approval.done=true;r.status='approved';audit(r,'อนุมัติเปิดอัตรา (ครบทุกขั้น)','');ntf('แจ้งเตือน: อนุมัติเปิดอัตรา '+esc(r.code));}
  else audit(r,'อนุมัติ (ขั้น '+r.approval.current+'/'+r.approval.steps.length+')','');
  render();showToast('อนุมัติแล้ว','success');
}
function reqReject(id){openReasonModal({title:'ไม่อนุมัติเปิดอัตรา',label:'เหตุผลที่ไม่อนุมัติ',confirmLabel:'ไม่อนุมัติ',danger:true,onConfirm:(reason)=>{const r=getReq(id);r.status='draft';if(r.approval){const st=r.approval.steps.find(s=>s.result==='pending');if(st)st.result='rejected';}audit(r,'ไม่อนุมัติเปิดอัตรา',reason,'bad');render();showToast('ไม่อนุมัติแล้ว','info');}});}
function reqAnnounce(id){const r=getReq(id);r.status='open';audit(r,'ประกาศรับอัตรา','สถานะ → เปิดรับ');ntf('แจ้งเตือน: ประกาศรับ '+esc(r.position));render();showToast('ประกาศรับแล้ว','success');}
function reqClose(id){if(viewerRO())return;openConfirm({title:'ปิดอัตรานี้?',body:'อัตราจะถูกปิด (รับครบ/ยกเลิก) และเก็บถาวรแบบ soft archive — ประวัติยังอยู่ครบ',confirmLabel:'ปิดอัตรา',danger:true,onConfirm:()=>{const r=getReq(id);r.status='closed';audit(r,'ปิดอัตรา','สถานะ → ปิดแล้ว');render();showToast('ปิดอัตราแล้ว','success');}});}
/* offer flow */
function offerApprove(id){if(viewerRO())return;const c=getCand(id),o=c.offer;if(!o.approval)return;o.approval.steps.forEach(s=>{if(s.result==='pending'){s.result='approved';s.at=new Date().toISOString().slice(0,10);}});o.approval.done=true;o.approval.current=o.approval.steps.length;o.status='approved';audit(c,'อนุมัติข้อเสนอ (ครบทุกขั้น)','');ntf('แจ้งเตือน: อนุมัติข้อเสนอ '+esc(c.name));render();showToast('อนุมัติแล้ว','success');}
function offerReject(id){if(viewerRO())return;openReasonModal({title:'ไม่อนุมัติข้อเสนอ',label:'เหตุผล',confirmLabel:'ไม่อนุมัติ',danger:true,onConfirm:(reason)=>{const c=getCand(id);c.offer.status='draft';if(c.offer.approval){const st=c.offer.approval.steps.find(s=>s.result==='pending');if(st)st.result='rejected';}audit(c,'ไม่อนุมัติข้อเสนอ',reason,'bad');render();showToast('ไม่อนุมัติแล้ว','info');}});}
function offerSend(id){if(viewerRO())return;const c=getCand(id);c.offer.status='sent';audit(c,'ส่งข้อเสนอให้ผู้สมัคร + แจ้งเตือน','เงินเดือน '+fmtNumber(c.offer.salary));ntf('แจ้งเตือน: ส่งข้อเสนอให้ '+esc(c.name));render();showToast('ส่งข้อเสนอแล้ว','success');}
function offerResult(id,res){if(viewerRO())return;const c=getCand(id);c.offer.status=res;audit(c,res==='accepted'?'ผู้สมัครตอบรับข้อเสนอ':'ผู้สมัครปฏิเสธข้อเสนอ','','ok');ntf('แจ้งเตือน: ผลข้อเสนอ '+esc(c.name)+' — '+(res==='accepted'?'ตอบรับ':'ปฏิเสธ'));if(res==='declined')c.stage='withdrawn';render();showToast('บันทึกผลข้อเสนอแล้ว','success');}

/* ============================================================ MODALS ============================================================ */
function openConfirm(cfg){RC.mctx={type:'confirm',data:cfg};rcOpenModal();}
function openReasonModal(cfg){RC.draft.reason='';RC.draft.reasonKind=cfg.withKind?'talent_pool':null;RC.mctx={type:'reason',data:cfg};rcOpenModal();}
function openInterviewModal(cid){RC.draft.iv={date:'',time:'',interviewer_id:null,loc:''};RC.mctx={type:'interview',data:{cid}};rcOpenModal();}
function openDoaModal(kind,entId){const r=doaResolve(kind);RC.draft.slots={};RC.mctx={type:'doa',data:{kind,entId,entry:r.entry,steps:r.steps}};rcOpenModal();}
function rcOpenModal(){state.modal={open:true,type:RC.mctx.type,data:RC.mctx.data};render();requestAnimationFrame(()=>{document.getElementById('modalBackdrop').classList.add('is-open');lockScroll(true);});}

function renderModal(){
  const t=RC.mctx.type,d=RC.mctx.data;
  if(t==='confirm')return `<div class="modal-header"><div class="modal-header-icon ${d.danger?'is-danger':''}"><i data-lucide="${d.danger?'alert-triangle':'help-circle'}" class="w-4 h-4"></i></div><div><h3 class="modal-title">${esc(d.title)}</h3><p class="modal-subtitle">${esc(d.body)}</p></div></div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn ${d.danger?'btn-danger':'btn-primary'}" onclick="rcConfirmYes()">${esc(d.confirmLabel||'ยืนยัน')}</button></div>`;
  if(t==='reason')return `<div class="modal-header"><div class="modal-header-icon ${d.danger?'is-danger':'is-warning'}"><i data-lucide="message-square-warning" class="w-4 h-4"></i></div><div><h3 class="modal-title">${esc(d.title)}</h3><p class="modal-subtitle">${esc(d.label||'ระบุเหตุผล')}</p></div></div>
    <div class="modal-body">${d.withKind?`<div class="field"><label class="field-label">ผลลัพธ์</label><select class="select" onchange="RC.draft.reasonKind=this.value"><option value="talent_pool">ไม่ผ่าน → เก็บ Talent Pool</option><option value="rejected">ไม่ผ่าน (ปฏิเสธ)</option><option value="withdrawn">ผู้สมัครถอนตัว</option></select></div>`:''}
      <div class="field"><label class="field-label">เหตุผล <span class="req">*</span></label><textarea class="notes-area" oninput="RC.draft.reason=this.value" placeholder="ระบุเหตุผล" style="min-height:80px">${esc(RC.draft.reason||'')}</textarea></div></div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn ${d.danger?'btn-danger':'btn-primary'}" onclick="rcReasonYes()">${esc(d.confirmLabel||'ยืนยัน')}</button></div>`;
  if(t==='interview')return `<div class="modal-header"><div class="modal-header-icon"><i data-lucide="calendar-plus" class="w-4 h-4"></i></div><div><h3 class="modal-title">นัดสัมภาษณ์</h3><p class="modal-subtitle">ระบบจะแจ้งเตือนผู้สัมภาษณ์และผู้สมัคร (NTF)</p></div></div>
    <div class="modal-body"><div class="field-row"><div class="field"><label class="field-label">วันที่ <span class="req">*</span></label><input type="date" class="input" onchange="RC.draft.iv.date=this.value"></div><div class="field"><label class="field-label">เวลา <span class="req">*</span></label><input type="time" class="input" onchange="RC.draft.iv.time=this.value"></div></div>
      <div class="field"><label class="field-label">ผู้สัมภาษณ์ <span class="req">*</span></label>${searchSelectHTML('iv_emp',{placeholder:'ค้นหาพนักงาน...'})}<div class="field-help">เก็บ snapshot ชื่อ+ตำแหน่งผู้สัมภาษณ์คู่บันทึก</div></div>
      <div class="field"><label class="field-label">สถานที่ / ช่องทาง</label><input class="input" oninput="RC.draft.iv.loc=this.value" placeholder="เช่น ห้องประชุม 3 · Google Meet"></div></div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" onclick="saveInterview()"><i data-lucide="check" class="w-4 h-4"></i><span>นัดสัมภาษณ์</span></button></div>`;
  if(t==='doa'){
    return `<div class="modal-header"><div class="modal-header-icon"><i data-lucide="git-branch-plus" class="w-4 h-4"></i></div><div><h3 class="modal-title">ส่งอนุมัติ (DOA)</h3><p class="modal-subtitle">เลือกผู้อนุมัติแต่ละขั้น · DOA entry <span class="num">${esc(d.entry)}</span> · ไม่มีวงเงิน</p></div></div>
      <div class="modal-body"><div class="note is-info mb-3"><i data-lucide="info"></i><div>สายอนุมัติมาจากระบบ DOA กลาง (F-DLG-001) — เลือก “คน” ในแต่ละ slot ที่ระบบ resolve มาให้</div></div>
        ${d.steps.map((s,i)=>`<div class="slot"><div class="slot-h"><span class="sn">${i+1}</span><span class="st">${esc(s.slotName)}</span><span class="sr">${esc(s.slot)}</span></div>${searchSelectHTML('slot_'+(i+1),{placeholder:'เลือกผู้อนุมัติ...'})}</div>`).join('')}</div>
      <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" onclick="submitDoa()"><i data-lucide="send" class="w-4 h-4"></i><span>ส่งอนุมัติ</span></button></div>`;
  }
  return '';
}
function rcConfirmYes(){const fn=RC.mctx.data.onConfirm;closeModal();setTimeout(()=>{if(fn)fn();},180);}
function rcReasonYes(){const r=String(RC.draft.reason||'').trim();if(!r){showToast('กรุณาระบุเหตุผล','warning');return;}const d=RC.mctx.data,kind=RC.draft.reasonKind;closeModal();setTimeout(()=>{if(d.onConfirm)d.onConfirm(r,kind);},180);}
function saveInterview(){if(viewerRO())return;const iv=RC.draft.iv,cid=RC.mctx.data.cid,c=getCand(cid);if(!iv.date||!iv.time||!iv.interviewer_id){showToast('กรุณากรอกข้อมูลให้ครบถ้วน','warning');return;}const e=emp(iv.interviewer_id);c.interviews=c.interviews||[];c.interviews.push({id:'IV'+Date.now(),date:iv.date,time:iv.time,interviewer_id:e.id,interviewer_name:e.name,interviewer_position:e.position,location:iv.loc||'',scorecard:null});if(c.stage==='screening'||c.stage==='applied')c.stage='interview';audit(c,'นัดสัมภาษณ์ + แจ้งเตือน',fmtDate(iv.date)+' '+iv.time+' · '+e.name);closeModal();setTimeout(()=>{ntf('แจ้งเตือน: นัดสัมภาษณ์ '+esc(c.name));render();showToast('นัดสัมภาษณ์แล้ว','success');},180);}
function submitDoa(){
  const d=RC.mctx.data;const chosen=d.steps.map((s,i)=>RC.draft.slots['slot_'+(i+1)]);
  if(chosen.some(x=>!x)){showToast('กรุณาเลือกผู้อนุมัติให้ครบทุกขั้น','warning');return;}
  const steps=d.steps.map((s,i)=>({order:s.order,slotName:s.slotName,approver_id:chosen[i],result:'pending',at:null}));
  const approval={entry:d.entry,current:0,done:false,steps};
  if(d.kind==='req'){const r=getReq(d.entId);r.approval=approval;r.status='pending';audit(r,'ส่งอนุมัติเปิดอัตรา',d.entry);ntf('แจ้งเตือน: ส่งอนุมัติเปิดอัตรา '+esc(r.code));}
  else{const c=getCand(d.entId);c.offer.approval=approval;c.offer.status='pending';audit(c,'ส่งอนุมัติข้อเสนอ',d.entry);ntf('แจ้งเตือน: ส่งอนุมัติข้อเสนอ '+esc(c.name));}
  closeModal();setTimeout(()=>{render();showToast('ส่งอนุมัติแล้ว','success');},180);
}

/* ============================================================ COMBOBOX MOUNTING ============================================================ */
function mountCombos(){
  if(state.drawer.open&&RC.dctx){
    if(RC.dctx.kind==='req'&&(RC.dctx.mode==='create'||RC.dctx.mode==='edit')&&document.getElementById(ssId('ss-','req_hm')))
      initSearchSelect('req_hm',{options:empOpts(),value:RC.draft.hiring_manager_id||null,emptyText:'ไม่พบพนักงาน',onSelect:v=>{RC.draft.hiring_manager_id=v;}});
    if(RC.dctx.kind==='cand'&&RC.dctx.mode==='create'&&document.getElementById(ssId('ss-','cand_req')))
      initSearchSelect('cand_req',{options:reqOpts(),value:RC.draft.reqId||null,emptyText:'ไม่พบอัตราที่เปิด',onSelect:v=>{RC.draft.reqId=v;}});
  }
  if(state.modal.open&&RC.mctx){
    if(RC.mctx.type==='interview'&&document.getElementById(ssId('ss-','iv_emp')))
      initSearchSelect('iv_emp',{options:empOpts(),value:(RC.draft.iv||{}).interviewer_id||null,emptyText:'ไม่พบพนักงาน',onSelect:v=>{RC.draft.iv.interviewer_id=v;}});
    if(RC.mctx.type==='doa'){RC.draft.slots=RC.draft.slots||{};RC.mctx.data.steps.forEach((s,i)=>{const k='slot_'+(i+1);if(document.getElementById(ssId('ss-',k)))initSearchSelect(k,{options:empOpts(),value:RC.draft.slots[k]||null,emptyText:'ไม่พบพนักงาน',onSelect:v=>{RC.draft.slots[k]=v;}});});}
  }
}

const __origCloseDrawer=closeDrawer;closeDrawer=function(){__origCloseDrawer();setTimeout(()=>{RC.dctx=null;},300);};
const __origCloseModal=closeModal;closeModal=function(){__origCloseModal();setTimeout(()=>{RC.mctx=null;},220);};
</script>
