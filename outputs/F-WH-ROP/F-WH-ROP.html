function ropCheckPair(){let item=document.querySelector('#ropItem').value.split(' ')[0],wh=document.querySelector('#ropWarehouse').value.split(' ')[0],e=ropEvaluatePair(item,wh),el=document.getElementById('ropCheckResult');if(e.ok)el.innerHTML=`<div class="check-card is-found"><div class="check-copy"><div class="check-kicker">ผลการตรวจ</div><strong class="check-title">พบนโยบายเติมสินค้า</strong><p class="check-detail">ATP ${e.atp} · On-Order ${e.onOrder} · ADU ${e.adu}/วัน · แนะนำ ${e.qty}</p></div></div>`;else if(e.code==='NO_POLICY')el.innerHTML=`<div class="check-card"><div class="check-copy"><div class="check-kicker">ต้องตั้งค่าก่อนใช้งาน</div><strong class="check-title">ยังไม่มีนโยบายเติมสินค้า</strong><p class="check-detail">${esc(item)} · ${esc(ropItemName(item))} ที่ ${esc(wh)} · ${esc(ropWarehouseName(wh))}</p></div><button class="btn btn-primary btn-sm" onclick="ropCreatePolicyFromCheck('${esc(item)}','${esc(wh)}')">เพิ่มนโยบาย</button></div>`;else el.innerHTML=`<div class="check-card"><div class="check-copy"><div class="check-kicker">ตรวจสอบข้อมูล</div><strong class="check-title">ไม่มีข้อมูลคงเหลือ</strong><p class="check-detail">ไม่พบยอดของสินค้าและคลังที่เลือก</p></div></div>`;ropSelected=e.ok?e:null}

function openView(id){let x=ropDisplay[id-1];if(!x)return;if(state.active==='records'){showDrawer('นโยบาย '+x.id,`<div class="kv"><div><label>สินค้า</label><strong>${esc(x.item)} · ${esc(ropItemName(x.item))}</strong></div><div><label>คลัง</label><strong>${esc(x.warehouse)} · ${esc(ropWarehouseName(x.warehouse))}</strong></div><div><label>ขั้นต่ำ/สูงสุด/ปลอดภัย</label><strong>${x.min} / ${x.max} / ${x.safety}</strong></div><div><label>ผู้ขายหลัก</label><strong>${x.preferredVendor?esc(x.preferredVendor+' · '+ropVendorName(x.preferredVendor)):'ไม่ระบุ'}</strong></div><div><label>รุ่น/เริ่มใช้</label><strong>${x.version} / ${x.effectiveDate}</strong></div></div>`,'<button class="btn btn-ghost" onclick="closeDrawer()">ปิด</button><span class="spacer"></span><button class="btn btn-primary" onclick="ropEditSelected()">แก้ไขนโยบาย</button>','view');ropSelected=x;return}if(state.active==='history'){ropSelected=x;showDrawer('คำแนะนำ '+x.item+' · '+x.warehouse,`<div class="kv"><div><label>ATP จาก F009</label><strong>${x.atp}</strong></div><div><label>จุดสั่งเติม</label><strong>${x.rop}</strong></div><div><label>ที่มาของจุดสั่งเติม</label><strong>${esc(x.reason)}</strong></div><div><label>On-Order (PO เปิด + PR Draft)</label><strong>${x.onOrder}</strong></div><div><label>ADU / Lead Time</label><strong>${x.adu} ต่อวัน / ${x.policy.leadTime} วัน</strong></div><div><label>เป้าหมาย Max + Safety</label><strong>${x.policy.max} + ${x.policy.safety}</strong></div><div><label>สูตรก่อนปัด / Pack Size</label><strong>${x.raw} / ${x.pack}</strong></div><div><label>จำนวนแนะนำ</label><strong>${x.qty}</strong></div><div><label>สถานะ</label><strong>${x.status}</strong></div></div><div id="ropActionResult"></div>`,`<button class="btn btn-ghost" onclick="closeDrawer()">ปิด</button><span class="spacer"></span>${x.triggered?'<button class="btn" onclick="ropSendNC(this)">ส่งแจ้งเตือน</button>':''}${x.triggered&&x.qty>0?'<button class="btn btn-primary" onclick="ropSendPR(this)">สร้าง PR Draft ของคลังนี้</button>':''}`,'view');return}showDrawer('รายละเอียดประวัติ',`<div class="kv"><div><label>รายการ</label><strong>${esc(ropEventLabel(x.kind))}</strong></div><div><label>รายละเอียด</label><strong>${esc(ropEventDetail(x))}</strong></div><div><label>สินค้า</label><strong>${esc(ropEventItems(x))}</strong></div><div><label>คลัง</label><strong>${esc(x.warehouse+' · '+ropWarehouseName(x.warehouse))}</strong></div><div><label>เวลา</label><strong>${esc(ropEventTime(x.at))}</strong></div><div><label>สถานะ</label><strong>${esc(ropEventStatus(x.kind))}</strong></div>${x.kind==='policy.saved'?`<div><label>เวอร์ชัน / วันที่เริ่มใช้</label><strong>${x.version} / ${esc(ropPolicies.find(p=>p.id===x.ref)?.effectiveDate||'—')}</strong></div>`:''}${x.kind==='pr.draft.created'?`<div><label>เลขที่ PR Draft</label><strong>${esc(x.ack?.prId||'—')}</strong></div><div><label>ขั้นตอนถัดไป</label><strong>รอตรวจสอบและส่งอนุมัติ</strong></div>`:''}</div>`,'<button class="btn btn-ghost" onclick="closeDrawer()">ปิด</button>','view')}
function ropEditSelected(){let p=ropSelected;closeDrawer();ropOpenPolicy(p)}
function ropSendPR(button){if(state._busy)return;state._busy=true;if(button){button.disabled=true;button.textContent='กำลังสร้าง…'}setTimeout(()=>{let r=ropPreparePR(ropSelected),el=document.getElementById('ropActionResult');state._busy=false;if(button){button.disabled=false;button.textContent='สร้าง PR Draft ของคลังนี้'}if(!r.ok){el.dataset.kind='pr';el.textContent=r.error;return}if(el.dataset.kind==='pr'){el.textContent='';delete el.dataset.kind}stats();toast(r.replay?'คลังนี้มี PR Draft ของรอบนี้แล้ว':'สร้าง PR Draft แล้ว · '+r.ack.payload.lines.length+' รายการ')},500)}
function ropSendNC(button){if(state._busy)return;state._busy=true;if(button){button.disabled=true;button.textContent='กำลังส่ง…'}setTimeout(()=>{let r=ropNcCandidate(ropSelected),el=document.getElementById('ropActionResult');state._busy=false;if(button){button.disabled=false;button.textContent='ส่งแจ้งเตือน'}if(!r.ok){el.dataset.kind='notification';el.textContent=r.error;return}if(el.dataset.kind==='notification'){el.textContent='';delete el.dataset.kind}stats();toast(r.replay?'รายการนี้แจ้งเตือนไปแล้ว':'ส่งแจ้งเตือนแล้ว')},500)}
document.addEventListener('click',event=>{for(const id of ['ropItemMenu','ropWarehouseMenu','ropVendorMenu']){let menu=document.getElementById(id);if(menu&&!event.target.closest('#'+id)&&event.target.id!==id.replace('Menu',''))menu.hidden=true}})

window.addEventListener('hashchange',route);route();
