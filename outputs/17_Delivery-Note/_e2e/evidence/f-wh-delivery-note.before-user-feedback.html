    @keyframes popIn { from { opacity: 0; transform: translateY(6px) scale(.985); } to { opacity: 1; transform: none; } }
    @keyframes rowIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }

    .pop-in { animation: popIn 220ms cubic-bezier(.2,.8,.3,1) both; }
    .row-in { animation: rowIn 200ms cubic-bezier(.2,.8,.3,1) both; }

    /* ===== เอกสารพิมพ์: ป้ายกล่อง 100×150 + ใบแพ็ค A4 (มาตรฐาน thai-doc-pdf-generator) ===== */

  <!-- PREFLIGHT v8: F-WH-DN v1 · UX = SO/PICK/PACK reference (Warm Light v8) · source = ใบแพ็ค packed (รวมหลายใบแพ็คของลูกค้าเดียวกันเป็น 1 DN) · ship info (carrier own/3PL/pickup · vehicle+capacity check · driver · tracking · date/slot) · draft → ready → in_transit → delivered/partial/returned · POD (ผู้รับ · ปฏิเสธรายรายการ+เหตุผล · ลายเซ็น/รูป) → ตัดสต๊อกจริง (movement issue) + SO shipped/returned · ยกเลิกก่อนออกรถคืนใบแพ็คเข้าคิว · responsible assignee (search dropdown+workload) · deadline vs scheduled ship date (late flag) · trip/stop seq · freight · Goods Issue on dispatch + reverse GI on cancel · carrier tracking timeline (3PL mock update + notify) · delivery attempts + reschedule (max 3) + return-all · POD partial → return-in stock + backorder/close-short decision · confirm modal ก่อนสร้าง DN (สรุปใบแพ็ค/กล่อง/น้ำหนัก + assign ผู้รับผิดชอบ/ขนส่ง/รถ/วันนัด · เตือนพิกัดรถ/ช้ากว่ากำหนด/ต่างลูกค้า) · stepper แบบ Packing (chip เขียว/แดง + เวลาใต้ป้าย) จัดกึ่งกลาง 4 ขั้น + สถานะยกเลิก/ตีกลับเป็น bad state · document flow section อัพเดตกลับ SO (สั่ง/ส่งสะสม/คืน/ค้างส่ง + สถานะ SO auto-sync) · search dropdown (ผู้รับผิดชอบ/ผู้ขนส่ง/รถ/คนขับ · avatar+ตำแหน่ง+รายละเอียด) · required * + inline error validation · read-only view หลังยืนยันพร้อมส่ง (ไม่มี textbox) · POD แนบลายเซ็น+รูปหลักฐาน (ไม่บังคับ) · confirm modal ก่อนออกรถ (เตือนตัดสต๊อก) · ใบส่งของ A4 (thai-doc pattern) · lucide inline -->
  <style>
    /* ============================================================
       CUBE NATIVE Admin CI v2 — Design Tokens
       ============================================================ */
    :root {
      --c-navy:        #111111;
      --c-navy-d:      #111111;
      --c-primary:     #FF3B30;
      --c-primary-h:   #E62E24;
      --c-teal:        #1F9D55;
      --c-slate:       #73757B;
      --c-off-white:   #FAF8F5;
      --c-white:       #FFFFFF;
      --c-border:      #DEDAD4;
      --c-border-soft: #EFEBE6;
      --c-text:        #111111;
      --c-text-mute:   #73757B;
      --c-text-soft:   #9A9CA2;
      --c-warning:     #E8870F;
      --c-danger:      #E62E24;
      --c-purple:      #FF9A1F;
      --c-primary-08:  rgba(255, 59, 48, 0.08);
      --c-primary-12:  rgba(255, 59, 48, 0.12);
      --c-primary-18:  rgba(255, 59, 48, 0.18);
      --c-teal-08:     rgba(31, 157, 85, 0.10);
      --c-warning-08:  rgba(232, 135, 15, 0.12);
      --c-danger-08:   rgba(230, 46, 36, 0.10);
      --r-sm: 6px;
      --r:    10px;
      --r-lg: 14px;
      --sh-sm: 0 1px 2px rgba(17, 17, 17, 0.04), 0 1px 3px rgba(17, 17, 17, 0.06);
      --sh-md: 0 4px 8px rgba(17, 17, 17, 0.04), 0 2px 4px rgba(17, 17, 17, 0.06);
      --sh-lg: 0 10px 30px rgba(17, 17, 17, 0.08), 0 4px 10px rgba(17, 17, 17, 0.04);
      --sh-xl: 0 24px 60px rgba(17, 17, 17, 0.10), 0 8px 24px rgba(17, 17, 17, 0.06);
      --sw: 224px;
      --hh: 52px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans Thai', 'Satoshi', -apple-system, sans-serif;
      font-size: 13px;
      line-height: 1.55;
      background: var(--c-off-white);

    h1, h2, h3, h4, .display { font-family: 'Noto Sans Thai', 'Satoshi', sans-serif; letter-spacing: -0.015em; font-weight: 700; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }
    input, select, textarea { font-family: inherit; }
    .num { font-variant-numeric: tabular-nums; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    html { scrollbar-gutter: stable; scrollbar-width: thin; }

    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

    /* ============================================================
       SHELL — Sidebar (224px flat) + Main + Topbar (52px white)
       ============================================================ */
    .shell { display: grid; grid-template-columns: var(--sw) 1fr; min-height: 100vh; }

    .sb {
      background: var(--c-navy-d);
      color: white;

      display: flex; flex-direction: column;
      border-right: 1px solid rgba(255,255,255,0.05);

    }
    .sb-logo {

      width: 30px; height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--c-primary), var(--c-teal));
      color: white;
      font-size: 12px; font-weight: 600;
      display: grid; place-items: center;
      flex-shrink: 0;
    }

    /* Icon button (used in drawer headers — printer/download/close) */
    .top-icon-btn {
      width: 32px; height: 32px;
      background: var(--c-off-white);
      border: 1px solid var(--c-border);
      border-radius: var(--r);
      cursor: pointer;
      display: grid; place-items: center;
      color: var(--c-text-mute);
      position: relative;
      transition: all 120ms;
    }
    .top-icon-btn:hover { color: var(--c-text); border-color: var(--c-text-soft); background: var(--c-white); }

    /* PAGE */
    .page { flex: 1; padding: 22px 24px 40px; overflow-y: auto; }

    /* PAGE HEAD */
    .ph {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-bottom: 18px;
      gap: 16px; flex-wrap: wrap;
    }
    .ph-left { min-width: 0; }
    .ph-title { font-size: 22px; font-weight: 700; color: var(--c-navy); line-height: 1.2; }
    .ph-sub { font-size: 13px; color: var(--c-text-mute); margin-top: 4px; }
    .ph-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    /* ============================================================
       BUTTON SYSTEM
       ============================================================ */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px;
      padding: 0 14px;
      height: 34px;
      border-radius: var(--r);
      font-size: 12.5px;
      font-weight: 600;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      background: transparent;
      color: var(--c-text);
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
    }
    .btn:focus-visible { outline: 2px solid var(--c-primary); outline-offset: 2px; }
    .btn:disabled { cursor: not-allowed; opacity: 0.6; }
    .btn.lg { height: 38px; padding: 0 18px; font-size: 13px; }
    .btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
    .btn-primary    { background: var(--c-primary); color: white; border-color: var(--c-primary); }
    .btn-primary:hover:not(:disabled) { background: var(--c-primary-h); border-color: var(--c-primary-h); }
    .btn-secondary  { background: var(--c-white); color: var(--c-navy); border-color: var(--c-border); }
    .btn-secondary:hover:not(:disabled) { border-color: var(--c-text-soft); }
    .btn-ghost      { background: transparent; color: var(--c-text-mute); }
    .btn-ghost:hover:not(:disabled) { background: var(--c-off-white); color: var(--c-text); }
    .btn-success    { background: var(--c-teal); color: white; border-color: var(--c-teal); }
    .btn-success:hover:not(:disabled) { background: #00876F; border-color: #00876F; }
    .btn-danger     { background: var(--c-danger); color: white; border-color: var(--c-danger); }
    .btn-danger:hover:not(:disabled) { background: #C9271E; }
    .btn-link       { background: transparent; border: 0; color: var(--c-primary); padding: 0; height: auto; font-weight: 600; }
    .btn-link:hover { text-decoration: underline; }

    /* ============================================================
       PILL / BADGE
       ============================================================ */
    .pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.02em; line-height: 1.6;
      white-space: nowrap;
    }
    .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .pill.draft     { background: rgba(115,117,123,0.12); color: var(--c-slate); }
    .pill.pending   { background: var(--c-warning-08);    color: #8A5200; }
    .pill.approved  { background: var(--c-teal-08);       color: var(--c-teal); }
    .pill.sent      { background: rgba(255,154,31,0.10);  color: var(--c-purple); }
    .pill.rejected  { background: var(--c-danger-08);     color: var(--c-danger); }
    .pill.cancelled { background: rgba(115,117,123,0.12); color: var(--c-slate); }

    /* ============================================================
       CARD
       ============================================================ */
    .card {
      background: var(--c-white);
      border: 1px solid var(--c-border);
      border-radius: var(--r-lg);
      overflow: hidden;
    }
    .card-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--c-border-soft);
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .card-title { font-size: 14px; font-weight: 700; color: var(--c-navy); }
    .card-body { padding: 16px 18px; }
    .card-body.flush { padding: 0; }

    /* ============================================================
       INPUT / SELECT
       ============================================================ */
    .input, .select {
      height: 34px;
      background: var(--c-white);
      border: 1px solid var(--c-border);
      border-radius: var(--r);
      padding: 0 12px;
      font-size: 13px;
      color: var(--c-text);
      transition: all 0.15s;
      width: 100%;
    }
    .input::placeholder { color: var(--c-text-soft); }
    .input:focus, .select:focus {
      outline: none;
      border-color: var(--c-primary);
      box-shadow: 0 0 0 3px var(--c-primary-12);
    }
    label.required::after { content: ' *'; color: var(--c-danger); }

    /* ============================================================
       FORM GRID + FIELD (used in wizard + view drawer)
       ============================================================ */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
    .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    .lbl { font-size: 12px; font-weight: 500; color: var(--c-navy); display: block; }

    /* Read-only field display (in view drawer summary) */
    .field-readonly { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .lbl-readonly { font-size: 11px; color: var(--c-text-mute); font-weight: 500; }
    .val-readonly { font-size: 13px; color: var(--c-navy); font-weight: 500; line-height: 1.35; word-break: break-word; }

    /* Combobox dropdown */
    .suggest-list {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: white; border: 1px solid var(--c-border); border-radius: var(--r);
      box-shadow: var(--sh-md);
      max-height: 320px; overflow-y: auto; z-index: 60;
    }
    .suggest-list.hidden { display: none; }
    .combo-option { padding: 8px 14px; cursor: pointer; border-bottom: 1px solid var(--c-border-soft); transition: background 100ms; }
    .combo-option:last-child { border-bottom: none; }
    .combo-option:hover { background: var(--c-primary-04); }
    .combo-option .opt-primary { font-size: 13px; font-weight: 600; color: var(--c-navy); }
    .combo-option .opt-secondary { font-size: 11.5px; color: var(--c-text-mute); }
    .combo-option mark { background: rgba(255,59,48,0.15); color: var(--c-primary); padding: 0; font-weight: 700; }

    /* ============================================================
       TABS
       ============================================================ */
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--c-border); margin-bottom: 16px; }
    .tab {
      background: transparent; border: none;
      border-bottom: 2px solid transparent;
      padding: 8px 14px;
      font-size: 13px; font-weight: 500; color: var(--c-text-mute);
      cursor: pointer; margin-bottom: -1px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .tab:hover { color: var(--c-text); }
    .tab.on { color: var(--c-primary); border-bottom-color: var(--c-primary); font-weight: 600; }

    /* ============================================================
       TABLE
       ============================================================ */
    .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tbl th {
      text-align: left; padding: 10px 14px;
      font-size: 10.5px; font-weight: 700;
      color: var(--c-text-mute);
      background: var(--c-off-white);
      border-bottom: 1px solid var(--c-border);
      text-transform: uppercase; letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .tbl td {
      padding: 7px 12px;
      border-bottom: 1px solid var(--c-border-soft);
      color: var(--c-text);
      vertical-align: middle;
    }
    .tbl tbody tr { transition: background 0.1s; cursor: pointer; }
    .tbl tbody tr:hover { background: var(--c-off-white); }
    .tbl tbody tr:last-child td { border-bottom: none; }
    .tbl-name { font-weight: 600; color: var(--c-navy); }
    .tbl-meta { font-size: 11px; color: var(--c-text-mute); margin-top: 1px; }
    .tbl-mono { font-family: ui-monospace, monospace; font-size: 12px; }
    .tbl-num { font-variant-numeric: tabular-nums; text-align: right; }
    .tbl-th-sortable { cursor: pointer; user-select: none; }
    .tbl-th-sortable:hover { color: var(--c-text); }

    /* Progress bar */
    .progress-bar {
      width: 64px; height: 6px;
      background: var(--c-border-soft);
      border-radius: 999px;
      overflow: hidden;
      display: inline-block;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--c-teal);
      border-radius: 999px;
      transition: width 200ms;
    }
    .progress-bar-fill.pending { background: var(--c-warning); }
    .progress-bar-fill.zero { background: var(--c-border); }

    /* ============================================================
       STEPPER
       ============================================================ */
    .stepper { display: flex; align-items: flex-start; gap: 0; width: 100%; }
    .stepper-item {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      position: relative; min-width: 0;
    }
    .stepper-circle {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600;
      background: var(--c-white); color: var(--c-text-soft);
      border: 2px solid var(--c-border);
      transition: all 200ms; z-index: 2;
    }
    .stepper-item.active .stepper-circle {
      background: var(--c-primary); color: white; border-color: var(--c-primary);
      box-shadow: 0 0 0 4px var(--c-primary-12);
    }
    .stepper-item.done .stepper-circle {
      background: var(--c-primary); color: white; border-color: var(--c-primary);
    }
    .stepper-label {
      margin-top: 8px; font-size: 12px; font-weight: 500;
      color: var(--c-text-soft); text-align: center; line-height: 1.3;
      transition: color 200ms;
    }
    .stepper-item.active .stepper-label { color: var(--c-navy); font-weight: 600; }
    .stepper-item.done .stepper-label { color: var(--c-text-mute); }
    .stepper-item:not(:last-child)::after {
      content: ''; position: absolute;
      top: 15px; left: 50%; right: -50%; height: 2px;
      background: var(--c-border); z-index: 1;
    }
    .stepper-item.done:not(:last-child)::after { background: var(--c-primary); }
    .stepper-item.bad .stepper-circle { background: var(--c-danger); color:#fff; border-color: var(--c-danger); }
    .stepper-item.bad .stepper-label { color: var(--c-danger); font-weight:600; }
    .stepper-sub { margin-top:2px; font-size:11px; color: var(--c-text-soft); text-align:center; line-height:1.35; }
    .stepper-band { padding:14px 18px 12px; background: var(--c-off-white); border:1px solid var(--c-border-soft); border-radius: var(--r-lg); }
    .stepper-band .stepper { max-width: 860px; margin: 0 auto; }
    .stepper-hint { max-width: 860px; margin: 10px auto 0; text-align:center; font-size:11.5px; color: var(--c-text-mute); }

    /* ============================================================
       DRAWER + MODAL — Self-contained CSS (don't depend on Tailwind utilities)
       ============================================================ */
    .overlay-wrap { position: fixed; inset: 0; z-index: 50; }
    .backdrop { position: absolute; inset: 0; background-color: rgba(0,0,0,0.45); cursor: pointer; }
    .drawer-panel {
      position: absolute; right: 0; top: 0;
      height: 100%; width: 100%;
      max-width: 920px;
      background: white;
      box-shadow: var(--sh-xl);
      display: flex; flex-direction: column;
    }
    .drawer-panel.standard { max-width: 680px; }
    .modal-overlay {
      position: fixed; inset: 0; z-index: 60;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .hidden { display: none !important; }

    .drawer-enter { transform: translateX(100%); }
    .drawer-active { transform: translateX(0); transition: transform 250ms ease-out; }

    @keyframes slide-in { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .animate-slide-in { animation: slide-in 200ms ease-out; }

    /* Slide-down animation for expandable line panel (Pattern E) */
    @keyframes line-expand-slide {
      from {
        opacity: 0;
        transform: translateY(-8px);
        max-height: 0;
      }
      to {
        opacity: 1;
        transform: translateY(0);
        max-height: 600px;
      }
    }
    @keyframes line-collapse-slide {
      from {
        opacity: 1;
        transform: translateY(0);
        max-height: 600px;
      }
      to {
        opacity: 0;
        transform: translateY(-8px);
        max-height: 0;
      }
    }
    .line-expand-panel {
      animation: line-expand-slide 220ms cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: top;
      overflow: hidden;
    }
    .line-collapse-panel {
      animation: line-collapse-slide 200ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
      transform-origin: top;
      overflow: hidden;
    }

    /* ============================================================
       UPLOAD ZONE
       ============================================================ */
    .upload-zone {
      border: 2px dashed var(--c-border);
      border-radius: var(--r-lg);
      padding: 32px 16px;
      text-align: center;
      background: #FDFBF8;
      cursor: pointer;
      transition: all 150ms;
    }
    .upload-zone:hover { border-color: var(--c-primary); background: var(--c-primary-08); }
    .upload-zone.has-files { padding: 16px; }

    /* ============================================================
       FORM GRID
       ============================================================ */
    .form-grp {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 14px 18px;
    }
    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-field label {
      font-size: 12.5px; font-weight: 500; color: var(--c-navy);
      display: flex; align-items: center; gap: 4px;
    }
    .form-field-help {
      font-size: 11px; color: var(--c-text-soft);
      display: flex; align-items: center; gap: 4px;
    }

    /* Toggle */
    .toggle {
      position: relative; display: inline-block;
      width: 36px; height: 20px;
      flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--c-border);
      border-radius: 20px;
      transition: 200ms;
    }
    .toggle-slider::before {
      position: absolute; content: '';
      height: 14px; width: 14px;
      left: 3px; bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 200ms;
    }
    .toggle input:checked + .toggle-slider { background-color: var(--c-primary); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(16px); }

    /* Section divider for wizard step 2 */
    .section-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px;
      background: var(--c-off-white);
      border: 1px solid var(--c-border);
      border-radius: var(--r);
      margin-bottom: 10px;
    }
    .section-label { font-size: 13px; font-weight: 500; color: var(--c-navy); display: flex; align-items: center; gap: 8px; }

    mark { background: #FFF1DC; color: var(--c-navy); border-radius: 2px; padding: 0 2px; }
  
    /* ===== SO additions (PO idiom) ===== */
    .drawer-panel.wide { max-width: 1290px; }

    .emp-chip.is-empty .emp-av{background:var(--c-off-white);color:var(--c-text-soft);border:1px dashed var(--c-border);}
    .emp-t{display:flex;flex-direction:column;line-height:1.25;min-width:0;}

    .emp-chip.sm .emp-av{width:22px;height:22px;font-size:9.5px;} .emp-chip.sm .emp-n{font-size:12px;}
    .slot-row{display:grid;grid-template-columns:34px 200px 1fr;gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--c-border);border-radius:var(--r);background:#fff;}
    .slot-row+.slot-row{margin-top:10px;} .slot-row.is-err{border-color:var(--c-danger);}
    .slot-no{width:26px;height:26px;border-radius:50%;background:var(--c-navy);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;margin-top:2px;}
    .slot-role{font-size:12px;font-weight:700;color:var(--c-navy);padding-top:6px;}
    .hard-warn{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;margin-bottom:10px;border-radius:var(--r);background:rgba(230,46,36,0.08);border:1px solid rgba(230,46,36,0.25);font-size:12px;color:var(--c-danger);line-height:1.5;}
    .note{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:var(--r);background:var(--c-off-white);border:1px solid var(--c-border-soft);font-size:12.5px;color:var(--c-text);line-height:1.55;}
    .note.warn{background:var(--c-warning-08);border-color:rgba(232,135,15,.35);} .note.danger{background:var(--c-danger-08);border-color:rgba(230,46,36,.35);color:var(--c-danger);} .note.ok{background:var(--c-teal-08);border-color:rgba(31,157,85,.35);}
    .combo-pop{position:fixed;background:#fff;border:1px solid var(--c-border);border-radius:var(--r);box-shadow:var(--sh-lg);z-index:90;max-height:280px;overflow-y:auto;}
    .combo-pop button{width:100%;text-align:left;padding:8px 12px;background:transparent;border:0;cursor:pointer;border-bottom:1px solid var(--c-border-soft);display:flex;align-items:center;gap:10px;font-family:inherit;}
    .combo-pop button:hover,.combo-pop button.hi{background:var(--c-primary-08);}
    .combo-pop button:last-child{border-bottom:0;}
    .tl{display:flex;flex-direction:column;gap:0;}
    .tl-i{position:relative;padding:0 0 16px 22px;} .tl-i::before{content:'';position:absolute;left:5px;top:6px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--c-border);} .tl-i::after{content:'';position:absolute;left:9px;top:18px;bottom:0;width:1px;background:var(--c-border-soft);} .tl-i:last-child::after{display:none;}
    .tl-i.ok::before{background:var(--c-teal);border-color:var(--c-teal);} .tl-i.warn::before{background:var(--c-warning);border-color:var(--c-warning);} .tl-i.bad::before{background:var(--c-danger);border-color:var(--c-danger);}
    .tl-t{font-size:13px;font-weight:600;color:var(--c-navy);} .tl-s{font-size:11.5px;color:var(--c-text-mute);margin-top:2px;} .tl-q{font-size:12px;color:var(--c-text);background:var(--c-off-white);border-left:3px solid var(--c-border);padding:6px 10px;border-radius:0 6px 6px 0;margin-top:6px;}
    .kbd{font-family:ui-monospace,monospace;font-size:11px;background:var(--c-off-white);border:1px solid var(--c-border);border-radius:4px;padding:1px 6px;}
    .a4{background:#fff;box-shadow:var(--sh-lg);width:100%;max-width:720px;min-height:900px;padding:36px 40px;font-size:11px;color:#111;margin:0 auto;} .a4 table{width:100%;border-collapse:collapse;font-size:11px;} .a4 th{background:#f3f4f6;border:1px solid #d1d5db;padding:5px 6px;text-align:left;font-weight:700;} .a4 td{border:1px solid #d1d5db;padding:5px 6px;} .a4 .r{text-align:right;font-variant-numeric:tabular-nums;}
    .pgline{width:64px;height:6px;background:var(--c-border-soft);border-radius:999px;overflow:hidden;display:inline-block;} .pgline>div{height:100%;background:var(--c-teal);border-radius:999px;} .pgline>div.pending{background:var(--c-warning);}
    .req{color:var(--c-danger);}
    .field.is-error .input,.field.is-error .select,.field.is-error textarea{border-color:var(--c-danger);}
    .field-error{font-size:11px;color:var(--c-danger);display:none;} .field.is-error .field-error{display:block;}
    .field-help{font-size:11px;color:var(--c-text-soft);}
    .persona{height:32px;border:1px solid var(--c-border);border-radius:var(--r);padding:0 28px 0 10px;font-size:12px;background:#fff;color:var(--c-navy);}
    .free-row td{background:var(--c-teal-08)!important;}
  </style>
</head>

function soProgress(ref) { const so = SO_BY[ref]; if (!so) return null; const gl = so.lines.filter(l => !isService(l.item_code)); const ordered = gl.reduce((s2, l) => s2 + l.base, 0); const shipped = gl.reduce((s2, l) => s2 + (l.shipped || 0), 0); const returned = gl.reduce((s2, l) => s2 + (l.returned || 0), 0); const issued = gl.reduce((s2, l) => s2 + (l.issued || 0), 0); const remain = Math.max(0, ordered - shipped); return { so, ordered, shipped, returned, issued, remain, pct: ordered ? Math.round(shipped / ordered * 100) : 0 }; }

  <div style="font-size:11.5px;color:var(--c-text-mute);margin-top:8px;"><i data-lucide="info" class="w-3 h-3 inline"></i> ระบบอัพเดตกลับใบสั่งขายอัตโนมัติ: <strong>ออกรถ</strong> → จ่ายสต๊อก (issued) · <strong>POD รับ</strong> → ยอดส่งสะสม (shipped) · <strong>ปฏิเสธ/ตีกลับ</strong> → คืนสต๊อก + ยอดคืน (returned) และ SO กลับไปค้างส่ง · <strong>ยกเลิกใบส่งของ</strong> → คืนค่าทั้งหมด ใบแพ็คกลับคิว</div>`); }

function shipTab(d, t) { const edit = ['draft'].includes(d.status) && canManage(); const car = CARRIER_BY[d.carrier] || {}; const veh = VEHICLES.find(v => v.code === d.vehicle) || {}; const drv = DRIVERS.find(x => x.code === d.driver) || {}; const late = dnLate(d); const nextStage = nextTrackStage(d); const over = car.kind === 'own' && veh.cap && t.weight > veh.cap;
  const shipDesc = car.kind === 'own' ? `${veh.plate} · ${veh.type} · คนขับ ${drv.name} (${drv.tel})` : car.kind === '3pl' ? `เลขติดตาม ${d.tracking || '—'}${d.dropPoint ? ' · ส่งมอบที่ ' + d.dropPoint : ''}` : `รับที่ ${WAREHOUSES[d.wh].name}`;

// ---- combos: ผู้ขนส่ง / รถ / คนขับ ----
function genCombo(key, valueHtml, placeholder, clearFn) { return `<div style="position:relative;">${valueHtml ? `<div style="display:flex;align-items:center;gap:10px;min-height:38px;padding:5px 10px;border:1px solid var(--c-border);border-radius:var(--r);background:#fff;">${valueHtml}<button class="btn btn-ghost sm" style="height:26px;padding:0 6px;margin-left:auto;" onclick="${clearFn}"><i data-lucide="chevrons-up-down" class="w-3.5 h-3.5"></i></button></div>` : `<i data-lucide="search" class="w-3.5 h-3.5" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--c-text-soft);"></i><input type="text" id="cbi-${key}" autocomplete="off" placeholder="${placeholder}" class="input" style="padding-left:30px;" onfocus="gcOpen('${key}','')" oninput="gcOpen('${key}', this.value)" onkeydown="gcKey(event,'${key}')">`}</div>`; }
const gcState = { key: null, list: [], hi: 0, src: {} };
function gcOpen(key, q) { document.querySelectorAll('.combo-pop').forEach(n => n.remove()); const input = document.getElementById('cbi-' + key); if (!input) return; q = (q || '').toLowerCase().trim(); gcState.key = key; gcState.list = (gcState.src[key] || []).filter(x => !q || x.search.toLowerCase().includes(q)); gcState.hi = 0; const r = input.getBoundingClientRect(); const pop = document.createElement('div'); pop.className = 'combo-pop'; pop.id = 'combo-pop'; const up = window.innerHeight - r.bottom < 280; pop.style.cssText = `left:${r.left}px;width:${Math.max(r.width, 340)}px;${up ? 'bottom:' + (window.innerHeight - r.top + 2) + 'px;' : 'top:' + (r.bottom + 2) + 'px;'}`; document.body.appendChild(pop); gcPaint(); const close = ev => { if (!pop.contains(ev.target) && ev.target !== input) { pop.remove(); document.removeEventListener('click', close); } }; setTimeout(() => document.addEventListener('click', close), 0); }
function gcPaint() { const pop = document.getElementById('combo-pop'); if (!pop) return; pop.innerHTML = gcState.list.length ? gcState.list.map((it, k) => `<button type="button" class="${k === gcState.hi ? 'hi' : ''}" onmousedown="event.preventDefault()" onclick="gcPick('${gcState.key}','${it.code}')">${it.html}</button>`).join('') : '<div style="padding:10px 12px;font-size:12px;color:var(--c-text-soft);">ไม่พบรายการ</div>'; renderIcons(); }
function gcKey(e, key) { if (!document.getElementById('combo-pop')) return; if (e.key === 'ArrowDown') { gcState.hi = Math.min(gcState.hi + 1, gcState.list.length - 1); gcPaint(); e.preventDefault(); } else if (e.key === 'ArrowUp') { gcState.hi = Math.max(gcState.hi - 1, 0); gcPaint(); e.preventDefault(); } else if (e.key === 'Enter') { const it = gcState.list[gcState.hi]; if (it) gcPick(key, it.code); e.preventDefault(); } else if (e.key === 'Escape') { document.querySelectorAll('.combo-pop').forEach(n => n.remove()); e.stopPropagation(); } }
function gcPick(key, code) { document.querySelectorAll('.combo-pop').forEach(n => n.remove()); const fn = (window.__gcPick || {})[key]; if (fn) fn(code); }
function carrierCombo(d) { const ico = { own: 'truck', '3pl': 'package', pickup: 'user' }; gcState.src.carrier = CARRIERS.map(c => ({ code: c.code, search: c.name + ' ' + c.code, html: `<span style="width:30px;height:30px;border-radius:8px;background:var(--c-off-white);display:grid;place-items:center;flex-shrink:0;"><i data-lucide="${ico[c.kind]}" class="w-4 h-4" style="color:var(--c-text-mute);"></i></span><div style="flex:1;min-width:0;text-align:left;"><div style="font-size:13px;font-weight:600;color:var(--c-navy);">${c.name}</div><div style="font-size:11px;color:var(--c-text-mute);">${c.kind === 'own' ? 'รถบริษัท · คุมรอบเอง' : c.kind === '3pl' ? 'ขนส่งเอกชน · ต้องมีเลขติดตาม' : 'ลูกค้ามารับที่คลัง'}</div></div>` }));
  window.__gcPick = Object.assign(window.__gcPick || {}, { carrier: function (code) { setCarrier(d.id, code); } });
  const c = CARRIER_BY[d.carrier]; return genCombo('carrier', c ? `<span style="width:26px;height:26px;border-radius:7px;background:var(--c-off-white);display:grid;place-items:center;"><i data-lucide="${ico[c.kind]}" class="w-3.5 h-3.5" style="color:var(--c-text-mute);"></i></span><div style="min-width:0;"><div style="font-size:13px;font-weight:600;color:var(--c-navy);">${c.name}</div><div style="font-size:11px;color:var(--c-text-mute);">${c.kind === 'own' ? 'รถบริษัท' : c.kind === '3pl' ? 'ขนส่งเอกชน' : 'ลูกค้ามารับเอง'}</div></div>` : '', 'ค้นหาผู้ขนส่ง…', `findDN('${d.id}').carrier=''; renderViewDrawer();`); }
function vehicleCombo(d, t) { gcState.src.vehicle = VEHICLES.map(v => { const ov = t && t.weight > v.cap; return { code: v.code, search: v.plate + ' ' + v.type + ' ' + v.code, html: `<span style="width:30px;height:30px;border-radius:8px;background:var(--c-off-white);display:grid;place-items:center;flex-shrink:0;"><i data-lucide="truck" class="w-4 h-4" style="color:var(--c-text-mute);"></i></span><div style="flex:1;min-width:0;text-align:left;"><div style="font-size:13px;font-weight:600;color:var(--c-navy);">${v.plate}</div><div style="font-size:11px;color:${ov ? 'var(--c-warning)' : 'var(--c-text-mute)'};">${v.type} · รับได้ ${fmi(v.cap)} กก.${ov ? ' · น้ำหนักเกิน' : ''}</div></div>` }; });
  window.__gcPick = Object.assign(window.__gcPick || {}, { vehicle: function (code) { findDN(d.id).vehicle = code; renderViewDrawer(); } });
  const v = VEHICLES.find(x => x.code === d.vehicle); const ov = v && t && t.weight > v.cap; return genCombo('vehicle', v ? `<span style="width:26px;height:26px;border-radius:7px;background:var(--c-off-white);display:grid;place-items:center;"><i data-lucide="truck" class="w-3.5 h-3.5" style="color:var(--c-text-mute);"></i></span><div style="min-width:0;"><div style="font-size:13px;font-weight:600;color:var(--c-navy);">${v.plate}</div><div style="font-size:11px;color:${ov ? 'var(--c-warning)' : 'var(--c-text-mute)'};">${v.type} · รับได้ ${fmi(v.cap)} กก.${ov ? ' · เกินพิกัด' : ''}</div></div>` : '', 'ค้นหาทะเบียน / ประเภทรถ…', `findDN('${d.id}').vehicle=''; renderViewDrawer();`); }
function driverCombo(d) { gcState.src.driver = DRIVERS.map(x => ({ code: x.code, search: x.name + ' ' + x.tel + ' ' + x.code, html: `<span class="emp-av" style="width:30px;height:30px;font-size:11px;">${x.name.slice(0, 2)}</span><div style="flex:1;min-width:0;text-align:left;"><div style="font-size:13px;font-weight:600;color:var(--c-navy);">${x.name}</div><div style="font-size:11px;color:var(--c-text-mute);">พนักงานขับรถ · ${x.tel}</div></div>` }));
  window.__gcPick = Object.assign(window.__gcPick || {}, { driver: function (code) { findDN(d.id).driver = code; renderViewDrawer(); } });
  const x = DRIVERS.find(y => y.code === d.driver); return genCombo('driver', x ? `<span class="emp-av" style="width:26px;height:26px;font-size:10px;">${x.name.slice(0, 2)}</span><div style="min-width:0;"><div style="font-size:13px;font-weight:600;color:var(--c-navy);">${x.name}</div><div style="font-size:11px;color:var(--c-text-mute);">พนักงานขับรถ · ${x.tel}</div></div>` : '', 'ค้นหาชื่อ / เบอร์คนขับ…', `findDN('${d.id}').driver=''; renderViewDrawer();`); }
function markErr(id, bad) { const el = document.getElementById(id); if (el) el.classList.toggle('is-error', !!bad); }

    const productOptions = PRODUCTS.slice(0, 8).map(p => `<option value="${p.code}">${p.code} · ${p.name}</option>`).join('');
    modalShell(`<div id="manual-create-modal" class="card" style="position:relative;max-width:760px;width:100%;box-shadow:var(--sh-xl);">
      <div style="padding:18px;border-bottom:1px solid var(--c-border-soft);display:flex;gap:12px;align-items:flex-start;"><div style="width:40px;height:40px;border-radius:50%;background:var(--c-primary-08);display:grid;place-items:center;flex-shrink:0;"><i data-lucide="file-plus-2" class="w-5 h-5" style="color:var(--c-primary);"></i></div><div style="flex:1;"><h3 style="font-size:14px;font-weight:700;color:var(--c-navy);">สร้างใบส่งของแบบ Manual</h3><p style="font-size:12.5px;margin-top:3px;color:var(--c-text-mute);">เลขที่: <strong class="tbl-mono">${nextDnCode()}</strong> · ไม่ผูกใบแพ็ค / SO / Stock Transfer</p></div><button onclick="closeModal()" class="top-icon-btn" title="ปิด"><i data-lucide="x" class="w-4 h-4"></i></button></div>
      <div style="padding:18px;display:grid;gap:14px;max-height:70vh;overflow-y:auto;">
        <div class="note warn"><i data-lucide="triangle-alert" class="w-4 h-4"></i><div>เอกสารนี้อัปเดตสถานะด้วยคนทั้งหมด จึงไม่สร้าง Goods Issue และไม่อัปเดตสถานะเอกสารต้นทางอัตโนมัติ</div></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;"><div><label class="lbl">เลขอ้างอิงภายนอก <span style="color:var(--c-danger);">*</span></label><input id="manual-ref" class="input" placeholder="เช่น EXT-DN-0001"></div><div><label class="lbl">คลัง <span style="color:var(--c-danger);">*</span></label><select id="manual-wh" class="select"><option value="WH-01">WH-01</option><option value="WH-02">WH-02</option></select></div></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;"><div><label class="lbl">ผู้รับ / ปลายทาง <span style="color:var(--c-danger);">*</span></label><input id="manual-customer" class="input" placeholder="ชื่อผู้รับหรือหน่วยงาน"></div><div><label class="lbl">วันที่ส่ง <span style="color:var(--c-danger);">*</span></label><input id="manual-date" type="date" class="input" value="${TODAY_ISO}"></div></div>
        <div><label class="lbl">ที่อยู่จัดส่ง <span style="color:var(--c-danger);">*</span></label><textarea id="manual-address" class="input" rows="2" style="height:auto;resize:vertical;" placeholder="ที่อยู่ปลายทาง"></textarea></div>
        <div style="display:grid;grid-template-columns:1.5fr .6fr .6fr .6fr;gap:12px;"><div><label class="lbl">สินค้า</label><select id="manual-product" class="select">${productOptions}</select></div><div><label class="lbl">จำนวน</label><input id="manual-qty" type="number" min="1" value="1" class="input num"></div><div><label class="lbl">กล่อง</label><input id="manual-boxes" type="number" min="0" value="1" class="input num"></div><div><label class="lbl">น้ำหนัก (กก.)</label><input id="manual-weight" type="number" min="0" step="0.1" value="1" class="input num"></div></div>
        <div><label class="lbl">หมายเหตุ</label><textarea id="manual-note" class="input" rows="2" style="height:auto;resize:vertical;" placeholder="เหตุผลที่สร้างแบบ Manual / รายละเอียดเพิ่มเติม"></textarea></div>
      </div>
      <div style="padding:12px 18px;background:var(--c-off-white);border-top:1px solid var(--c-border-soft);display:flex;justify-content:flex-end;gap:8px;border-radius:0 0 var(--r-lg) var(--r-lg);"><button onclick="closeModal()" class="btn btn-ghost">ยกเลิก</button><button id="manual-create-confirm" onclick="confirmManualCreate()" class="btn btn-primary"><i data-lucide="check" class="w-4 h-4"></i><span>สร้างเอกสาร Manual</span></button></div>
    </div>`);
  }

  function confirmManualCreate() {
    const ref = (document.getElementById('manual-ref').value || '').trim();
    const customer = (document.getElementById('manual-customer').value || '').trim();
    const shipTo = (document.getElementById('manual-address').value || '').trim();
    if (!ref || !customer || !shipTo) return showToast('กรอกเลขอ้างอิง ผู้รับ และที่อยู่จัดส่งให้ครบ', 'warning');
    const pid = document.getElementById('manual-product').value; const p = PROD_BY[pid]; const qty = Math.max(1, +document.getElementById('manual-qty').value || 1);
    const d = mkDN({ code: nextDnCode(), sourceMode: 'manual', wh: document.getElementById('manual-wh').value, packs: [], ref, customer, shipTo, shipDate: document.getElementById('manual-date').value || TODAY_ISO, slot: 'Manual', note: (document.getElementById('manual-note').value || '').trim(), boxes: Math.max(0, +document.getElementById('manual-boxes').value || 0), weight: Math.max(0, +document.getElementById('manual-weight').value || 0), status: 'draft', createdAt: nowIso(), updatedAt: nowIso() });
    d.lines = [{ pid, name: p.name, unit: p.uom, factor: 1, lot: null, exp: null, loc: null, is_free: false, soLine: null, ref, qty, boxes: [], accepted: null, rejected: 0, reason: '' }];
    d.audit = [{ act: 'สร้างใบส่งของแบบ Manual', by: ME.name, at: nowIso(), note: ref + (d.note ? ' · ' + d.note : '') }];
    DNS.unshift(d); closeModal(); state.view = 'dns'; showToast('สร้าง ' + d.code + ' แบบ Manual แล้ว', 'success'); navigate('view/' + d.id);
  }

  function openManualStatusModal(id) {
    const d = findDN(id); if (!d || d.sourceMode !== 'manual') return;
    const options = Object.keys(DNST).map(k => `<option value="${k}" ${d.status === k ? 'selected' : ''}>${DNST[k][0]}</option>`).join('');
    closeModal(); modalShell(`<div id="manual-status-modal" class="card" style="position:relative;max-width:520px;width:100%;box-shadow:var(--sh-xl);"><div style="padding:18px;border-bottom:1px solid var(--c-border-soft);"><h3 style="font-size:14px;font-weight:700;color:var(--c-navy);">อัปเดตสถานะ Manual · ${d.code}</h3><p style="font-size:12.5px;margin-top:4px;color:var(--c-text-mute);">เลือกได้ทุกสถานะ การเปลี่ยนแปลงจะบันทึกผู้ทำ เวลา และเหตุผล</p></div><div style="padding:18px;display:grid;gap:12px;"><div><label class="lbl">สถานะใหม่</label><select id="manual-new-status" class="select">${options}</select></div><div><label class="lbl">เหตุผล / หมายเหตุ <span style="color:var(--c-danger);">*</span></label><textarea id="manual-status-reason" class="input" rows="3" style="height:auto;resize:vertical;"></textarea></div></div><div style="padding:12px 18px;background:var(--c-off-white);border-top:1px solid var(--c-border-soft);display:flex;justify-content:flex-end;gap:8px;"><button onclick="closeModal()" class="btn btn-ghost">ยกเลิก</button><button id="manual-status-confirm" onclick="confirmManualStatus('${id}')" class="btn btn-primary">บันทึกสถานะ</button></div></div>`);
  }

  function confirmManualStatus(id) {
    const d = findDN(id); const next = document.getElementById('manual-new-status').value; const reason = (document.getElementById('manual-status-reason').value || '').trim();
    if (!reason) return showToast('กรุณาระบุเหตุผล', 'warning');
    const before = d.status; d.status = next; if (next === 'in_transit' && !d.dispatchedAt) d.dispatchedAt = nowIso(); if (['delivered', 'partial', 'returned'].includes(next)) d.deliveredAt = nowIso();
    pushAuditD(d, `อัปเดตสถานะ Manual: ${DNST[before][0]} → ${DNST[next][0]}`, reason); closeModal(); showToast('อัปเดตสถานะ Manual แล้ว', 'success'); renderViewDrawer();
  }
  </script>
</body>
</html>
