function getCourse(id){return DB.courses.find(c=>c.id===id);}
function getSession(id){return DB.sessions.find(s=>s.id===id);}
function getEnroll(id){return DB.enrolls.find(e=>e.id===id);}
function courseOf(sess){return getCourse(sess.courseId)||{};}
function courseOfEnroll(e){const s=getSession(e.sessionId);return s?courseOf(s):{};}
/* FIX-04: parse ชั่วโมงอบรมจาก duration ของหลักสูตร (เช่น "2 วัน (12 ชม.)" → 12) */
function courseHours(c){const m=String(c&&c.duration||'').match(/(\d+)\s*ชม/);return m?Number(m[1]):0;}
/* FIX-01: ผลอบรมนับได้เฉพาะรายการจากรอบที่ปิดแล้ว (closed) */
function isClosedResult(e){const s=getSession(e.sessionId);return !!(e.result&&s&&s.status==='closed');}
function enrollsOfSession(sid){return DB.enrolls.filter(e=>e.sessionId===sid);}
function activeEnrolls(sid){return enrollsOfSession(sid).filter(e=>e.status!=='cancelled');}
function courseOpts(open){return DB.courses.filter(c=>c.status==='published').map(c=>({value:c.id,label:c.name,sub:c.code+' · '+catLabel(c.category)+(c.has_cost?' · มีค่าใช้จ่าย':' · ฟรี'),icon:'book-open'}));}

/* ---- audit (FN-93 append-only) + notify (FN-12 · NTF_BRIEF) ---- */
function audit(entity,action,detail,kind){entity.history=entity.history||[];entity.history.unshift({at:new Date().toISOString(),by:PERSONAS[TC.persona].name,action,detail:detail||'',kind:kind||'ok'});}
/* NTF: 3 จุด — เปิดรับ (รอบอบรม) · ยืนยันลงทะเบียน · ประกาศผล — wire ENG-NOTIFY ตอน dev */
function ntf(msg){showToast('แจ้งเตือน (NTF): '+msg,'info');}

/* ---- money masking (FN-94 · งบ/มูลค่าอบรม = RESTRICTED บางบทบาท) ---- */
function maskMoney(n){return PERSONAS[TC.persona].unmask?fmtMoney(n,0):'••••••';}

function syncPersonaChip(){
  const pr=PERSONAS[TC.persona];

/* ============================================================ RENDER ============================================================ */
function render(){
  const snap=preserveRenderState();
  const rt=getRoute();
  TC.tab=(rt.indexOf('train/')===0)?rt.split('/')[1]:'course';
  if(['course','plan','result','report'].indexOf(TC.tab)<0)TC.tab='course';
  document.getElementById('page-content').innerHTML=renderPage();
  document.getElementById('drawer').innerHTML=(state.drawer.open&&TC.dctx)?renderDrawer():'';
  const mh=document.querySelector('#modalBackdrop .modal');
  if(mh)mh.innerHTML=(state.modal.open&&TC.mctx)?renderModal():'';
  document.querySelectorAll('.sb-item').forEach(el=>el.classList.toggle('is-active',el.dataset.feature==='train'));
  syncPersonaChip();
  renderIcons();
  mountCombos();
  restoreRenderState(snap);
}
function renderPageOnly(){const snap=preserveRenderState();document.getElementById('page-content').innerHTML=renderPage();renderIcons();restoreRenderState(snap);}

function renderPage(){
  const recordable=DB.enrolls.filter(e=>e.status!=='cancelled').length;
  const tabs=[
    {id:'course',name:'หลักสูตร',icon:'book-open',ct:DB.courses.length},
    {id:'plan',name:'แผน / ลงทะเบียน',icon:'calendar-days',ct:DB.sessions.length},
    {id:'result',name:'ผล / ใบรับรอง',icon:'award',ct:recordable},
    {id:'report',name:'รายงาน',icon:'bar-chart-3',ct:null},
  ];
  const titleMap={course:'หลักสูตร (Course Catalog)',plan:'แผน / ลงทะเบียน (Session & Enrollment)',result:'ผล / ใบรับรอง (Results & Certificates)',report:'รายงานการอบรม (Completion)'};
  const subMap={course:'สร้างหลักสูตร · ระบุค่าใช้จ่าย/งบ · เผยแพร่ · ปิดหลักสูตร',plan:'สร้างรอบอบรม · เปิดรับ · ลงทะเบียน (จาก gap หรือเลือกเอง) · อนุมัติ DOA เมื่อมีค่าใช้จ่าย',result:'บันทึกผล (ผ่าน/ไม่ผ่าน) · ออกใบรับรอง (soft ref)',report:'อัตราการอบรมสำเร็จ (completion rate) · ขอบเขตที่ไม่รองรับ'};
  let actions='';
  if(TC.tab==='course'&&TC.persona!=='viewer')actions=`<button class="btn btn-primary" onclick="openCourseCreate()"><i data-lucide="plus" class="w-4 h-4"></i><span>สร้างหลักสูตร</span></button>`;
  else if(TC.tab==='plan'&&TC.persona!=='viewer')actions=`<button class="btn btn-primary" onclick="openSessionCreate()"><i data-lucide="calendar-plus" class="w-4 h-4"></i><span>สร้างรอบอบรม</span></button>`;
  else if(TC.tab==='report')actions=`<button class="btn btn-secondary" onclick="showToast('ส่งออกรายงาน (CSV) — ต่อ dev','info')"><i data-lucide="download" class="w-4 h-4"></i><span>Export CSV</span></button>`;
  const ph=`<div class="ph"><div><div class="ph-title-row"><h1 class="ph-title">${titleMap[TC.tab]}</h1></div><p class="ph-sub">${subMap[TC.tab]}</p></div><div class="ph-actions">${actions}</div></div>`;
  const tabbar=`<div class="tabs">${tabs.map(t=>`<button class="tab ${TC.tab===t.id?'is-active':''}" onclick="go('train/${t.id}')"><i data-lucide="${t.icon}" class="w-4 h-4"></i><span>${t.name}</span>${t.ct!=null?`<span class="tab-ct">${t.ct}</span>`:''}</button>`).join('')}</div>`;
  let body='';
  if(TC.tab==='course')body=renderCourseTab();
  else if(TC.tab==='plan')body=renderPlanTab();
  else if(TC.tab==='result')body=renderResultTab();
  else body=renderReportTab();
  return ph+tabbar+body;
}

/* -------- pills / chips -------- */
function courseStatusPill(s){const m=COURSE_STATUS[s];return `<span class="pill ${m.pill}">${m.label}</span>`;}
function sessionStatusPill(s){const m=SESSION_STATUS[s];return `<span class="pill ${m.pill}">${m.label}</span>`;}
function enrollStatusPill(s){const m=ENROLL_STATUS[s];return `<span class="pill ${m.pill}">${m.label}</span>`;}
function costChip(has){return has?`<span class="chip-soft is-cost"><i data-lucide="badge-dollar-sign"></i>มีค่าใช้จ่าย</span>`:`<span class="chip-soft is-free"><i data-lucide="gift"></i>ไม่มีค่าใช้จ่าย</span>`;}
function resultChip(e){if(e.result==='pass')return `<span class="chip-soft is-free"><i data-lucide="check"></i>ผ่าน</span>`;if(e.result==='fail')return `<span class="chip-soft is-fail"><i data-lucide="x"></i>ไม่ผ่าน</span>`;return '<span style="color:var(--c-mute-3)">—</span>';}
function certChip(e){return e.cert?`<span class="chip-soft is-cert"><i data-lucide="award"></i>ออกใบรับรองแล้ว</span>`:'<span style="color:var(--c-mute-3)">—</span>';}
/* FIX-03: แสดงคะแนนประเมินหลังอบรม (1-5) */
function evalChip(e){return e.evalScore?` <span class="chip-soft is-cert" title="${esc(e.evalComment||'')}"><i data-lucide="star"></i>ประเมิน ${e.evalScore}/5</span>`:'';}
function attChip(e){return e.attended===true?'<span class="chip-soft is-free"><i data-lucide="user-check"></i>เข้าอบรม</span>':e.attended===false?'<span class="chip-soft is-fail"><i data-lucide="user-x"></i>ขาดอบรม</span>':'';}
function capBar(sid){const s=getSession(sid),n=activeEnrolls(sid).length,pct=Math.min(100,Math.round(n/Math.max(1,s.capacity)*100)),full=n>=s.capacity;
  return `<div style="display:flex;align-items:center;gap:8px"><div class="cap-bar"><div class="cap-fill ${full?'is-full':''}" style="width:${pct}%"></div></div><span class="num" style="font-size:12px;color:var(--c-mute-2)">${n}/${s.capacity}</span></div>`;}

/* -------- TAB 1 : Courses (FN-01 · FN-90 · FN-91) -------- */

    <div class="input-search"><i data-lucide="search" class="lead-icon"></i><input class="input" placeholder="ค้นหาชื่อหลักสูตร / รหัส / ผู้สอน" value="${esc(TC.f.course.q)}" oninput="TC.f.course.q=this.value;renderPageOnly()"></div>

      <option value="all"${fs==='all'?' selected':''}>ทุกสถานะ</option>${Object.keys(COURSE_STATUS).map(k=>`<option value="${k}"${fs===k?' selected':''}>${COURSE_STATUS[k].label}</option>`).join('')}
    </select>
    <button class="btn btn-ghost" style="margin-left:auto" onclick="TC.f.course={q:'',cat:'all',status:'all'};renderPageOnly()"><i data-lucide="rotate-ccw" class="w-4 h-4"></i><span>ล้างตัวกรอง</span></button>
  </div>`;
  let inner;
  if(!rows.length){inner=emptyStateHTML({icon:'book-open',title:'ไม่พบหลักสูตร',desc:'ลองปรับคำค้นหรือล้างตัวกรอง แล้วลองอีกครั้ง',actionLabel:'ล้างตัวกรอง',actionIcon:'rotate-ccw',onAction:"TC.f.course={q:'',cat:'all',status:'all'};renderPageOnly()"});}
  else{
    inner=`<div class="table-wrap"><table class="table"><thead><tr>
      <th>หลักสูตร / รหัส</th><th>หมวด</th><th>ผู้สอน</th><th>ระยะเวลา</th><th>ค่าใช้จ่าย</th><th class="col-num">งบ</th><th>สถานะ</th>
    </tr></thead><tbody>${rows.map(c=>`<tr class="is-clickable" onclick="openCourseView('${c.id}')">
        <td><div style="font-weight:600">${esc(c.name)}</div><div class="num" style="font-size:12px;color:var(--c-mute-2)">${esc(c.code)}</div></td>
        <td>${esc(catLabel(c.category))}</td>
        <td>${esc(c.instructor)}</td>
        <td>${esc(c.duration)}</td>
        <td>${costChip(c.has_cost)}</td>
        <td class="col-num">${c.has_cost?'<span class="num">'+maskMoney(c.budget)+'</span>':'<span style="color:var(--c-mute-3)">—</span>'}</td>
        <td>${courseStatusPill(c.status)}</td>
      </tr>`).join('')}</tbody></table></div>
      <div class="table-footer"><span></span><span>${rows.length} รายการ</span></div>`;
  }

  else{
    inner=`<div class="table-wrap"><table class="table"><thead><tr>

    </tr></thead><tbody>${rows.map(s=>{const c=courseOf(s);return `<tr class="is-clickable" onclick="openSessionView('${s.id}')">

        <td>${costChip(c.has_cost)}</td>
        <td>${fmtDate(s.start)}${s.end&&s.end!==s.start?' – '+fmtDate(s.end):''}<div style="font-size:12px;color:var(--c-mute-2)">${esc(s.time)}</div></td>
        <td><span class="cell-truncate" title="${esc(s.location)}">${esc(s.location)}</span></td>
        <td>${capBar(s.id)}</td>
        <td>${sessionStatusPill(s.status)}</td>

        if(e.status==='confirmed'){
          if(s.status!=='closed')act=`<span class="tt-wrap" title="บันทึกผลได้หลังปิดรอบ" style="display:inline-block"><button class="btn btn-sm btn-primary is-disabled" disabled title="บันทึกผลได้หลังปิดรอบ"><i data-lucide="clipboard-check" class="w-3.5 h-3.5"></i><span>บันทึกผล</span></button></span>`;
          else if(e.attended!==true)act=`<span class="tt-wrap" title="ต้องเช็คชื่อเข้าอบรมก่อน (แท็บผู้เรียน)" style="display:inline-block"><button class="btn btn-sm btn-primary is-disabled" disabled title="ต้องเช็คชื่อเข้าอบรมก่อน (แท็บผู้เรียน)"><i data-lucide="clipboard-check" class="w-3.5 h-3.5"></i><span>บันทึกผล</span></button></span>`;
          else act=`<button class="btn btn-sm btn-primary" onclick="event.stopPropagation();openResultModal('${e.id}')"><i data-lucide="clipboard-check" class="w-3.5 h-3.5"></i><span>บันทึกผล</span></button>`;

        else if(e.status==='pending_doa')act='<span class="chip-soft is-cost"><i data-lucide="clock"></i>รออนุมัติ</span>';

/* -------- TAB 4 : Report (FN-13) + ขอบเขตที่ไม่รองรับ (unsupported 5) -------- */
function renderReportTab(){
  const scope=TC.f.report.course;
  const pool=DB.enrolls.filter(e=>e.status!=='cancelled'&&(scope==='all'||courseOfEnroll(e).id===scope));
  /* FIX-01: completion rate นับเฉพาะผลจากรอบที่ปิดแล้ว (closed) */
  const passed=pool.filter(e=>isClosedResult(e)&&e.result==='pass').length;
  const failed=pool.filter(e=>isClosedResult(e)&&e.result==='fail').length;
  const recorded=passed+failed;
  const inProgress=pool.filter(e=>e.status==='confirmed').length;
  const pendingDoa=pool.filter(e=>e.status==='pending_doa').length;
  const rate=recorded?Math.round(passed/recorded*100):0;
  const stats=[
    {ic:'book-open',l:'หลักสูตร',v:DB.courses.length},
    {ic:'calendar-days',l:'รอบอบรม',v:DB.sessions.length},
    {ic:'users',l:'ลงทะเบียนทั้งหมด',v:pool.length},
    {ic:'award',l:'ผ่าน',v:passed},
    {ic:'trending-up',l:'อัตราผ่าน (completion)',v:rate+'%'},
  ];
  const perCourse=DB.courses.map(c=>{const list=DB.enrolls.filter(e=>e.status!=='cancelled'&&courseOfEnroll(e).id===c.id);const p=list.filter(e=>isClosedResult(e)&&e.result==='pass').length;const rec=list.filter(e=>isClosedResult(e)).length;const rt=rec?Math.round(p/rec*100):0;return {c,p,rec,rt,total:list.length};}).filter(x=>scope==='all'||x.c.id===scope);
  /* FIX-05: ต้นทุนต่อหัว (มุม EC) ต่อหลักสูตรมีค่าใช้จ่าย */
  const costCourses=DB.courses.filter(c=>c.has_cost&&(scope==='all'||c.id===scope)).map(c=>{const list=DB.enrolls.filter(e=>e.status!=='cancelled'&&courseOfEnroll(e).id===c.id);const pass=list.filter(e=>isClosedResult(e)&&e.result==='pass').length;return {c,budget:c.budget,pass};});
  const oos=[
    {t:'จ่ายเงินค่าอบรมจริง / ลงบัญชี',w:'[OB-1] ส่ง hook Expense Claim เท่านั้น'},
    {t:'ประเมินผลงาน / สร้าง gap เอง',w:'[OB-2] อ่านจาก Performance (hook)'},
    {t:'eLearning content / SCORM · competency mapping',w:'[OQ NICE] ไม่รองรับรอบนี้'},
    {t:'ใบรับรองเลขรัน / PDF ทางการ',w:'[ASSUMED] soft ref (ไม่ doccfg/pdfdoc)'},
    {t:'สร้าง / แก้ config หมวดหลักสูตรกลาง',w:'[#107] อ่านจาก HR Configuration'},
  ];
  return `<div class="filter-bar" style="border-radius:10px 10px 0 0;border:1px solid var(--c-line-2)">
      <span style="font-size:12.5px;color:var(--c-mute)">กรองตามหลักสูตร</span>
      <select class="select" style="max-width:320px" onchange="TC.f.report.course=this.value;renderPageOnly()">
        <option value="all"${scope==='all'?' selected':''}>ทุกหลักสูตร</option>
        ${DB.courses.map(c=>`<option value="${c.id}"${scope===c.id?' selected':''}>${esc(c.name)}</option>`).join('')}
      </select></div>
    <div class="stats" style="margin-top:14px">${stats.map(s=>`<div class="stat"><div class="stat-label"><i data-lucide="${s.ic}" class="w-3 h-3"></i>${s.l}</div><div class="stat-value">${s.v}</div></div>`).join('')}</div>
    <div class="card" style="padding:18px;margin-bottom:16px"><div class="sec-h"><i data-lucide="bar-chart-3"></i>อัตราการอบรมสำเร็จ (completion rate) ต่อหลักสูตร</div>
      <div class="funnel">${perCourse.map(x=>`<div class="funnel-row"><span class="fl">${esc(x.c.name)}</span><div class="funnel-track"><div class="funnel-fill" style="width:${x.rt}%"></div></div><span class="fn">${x.rt}% <span style="font-weight:500;color:var(--c-mute-2)">(${x.p}/${x.rec||0})</span></span></div>`).join('')}</div>
      <div class="note is-info" style="margin-top:16px"><i data-lucide="info"></i><div>ผลรวม: ผ่าน <b>${passed}</b> · ไม่ผ่าน <b>${failed}</b> · กำลังดำเนินการ <b>${inProgress}</b> · รออนุมัติ (DOA) <b>${pendingDoa}</b> · <span style="color:var(--c-mute-2)">นับเฉพาะผลจากรอบที่ปิดแล้ว</span></div></div>
    </div>
    <div class="card" style="padding:18px;margin-bottom:16px"><div class="sec-h"><i data-lucide="wallet"></i>ต้นทุนต่อหัว (มุม EC) — หลักสูตรมีค่าใช้จ่าย</div>
      ${costCourses.length?`<div class="cph-grid">${costCourses.map(x=>{const per=(x.budget>0&&x.pass>0)?(PERSONAS[TC.persona].unmask?fmtMoney(Math.round(x.budget/x.pass),0):'••••••'):'—';return `<div class="cph-card"><div class="cph-name">${esc(x.c.name)}</div>
        <div class="cph-row"><span class="cph-l">งบหลักสูตร</span><span class="cph-v num">${maskMoney(x.budget)}</span></div>
        <div class="cph-row"><span class="cph-l">ผู้ผ่าน</span><span class="cph-v num">${x.pass}</span></div>
        <div class="cph-row cph-total"><span class="cph-l">ต้นทุนต่อหัว</span><span class="cph-v num">${per}</span></div></div>`;}).join('')}</div>
      <div class="note is-info" style="margin-top:12px"><i data-lucide="info"></i><div>อัตรากลางจริงอ่านจาก Rate Card เมื่อพร้อม — ไม่ hardcode · EC ไม่ลงบัญชี · ต้นทุนต่อหัว = งบ ÷ ผู้ผ่าน (ผู้ผ่าน = 0 หรือหลักสูตรฟรี → “—” กันหารศูนย์)</div></div>`:'<div class="rc-list-intro">ไม่มีหลักสูตรที่มีค่าใช้จ่ายในขอบเขตที่เลือก</div>'}
    </div>
    <div class="card" style="padding:18px"><div class="sec-h"><i data-lucide="shield-x"></i>ขอบเขตที่ไม่รองรับ — ตัดสินแล้ว (อย่าเผลอทำ)</div>
      <p class="rc-list-intro" style="margin:0 0 12px">รายการนี้ถูกตัดออกจาก scope โดยมติ — ระบบไม่มีปุ่ม/ทางลัดให้ทำสิ่งเหล่านี้</p>
      <div class="oos">${oos.map(o=>`<div class="oos-item"><span class="x">✕</span><span>${esc(o.t)}</span><span class="why">${esc(o.w)}</span></div>`).join('')}</div>
    </div>`;
}

function submitCourse(asDraft){
  if(viewerRO())return; if(TC.busy)return;
  const d=TC.draft,bad=[];
  if(!String(d.name).trim())bad.push('f-name');
  if(!String(d.duration).trim())bad.push('f-dur');
  if(!String(d.instructor).trim())bad.push('f-inst');
  if(d.has_cost&&!(Number(d.budget)>=0&&String(d.budget).trim()!==''))bad.push('f-budget');
  if(bad.length||!d.category){markInvalidFields(bad);showToast(!bad.length&&!d.category?'กรุณาเลือกหมวดหลักสูตร':'กรุณากรอกข้อมูลที่ไฮไลต์ให้ครบ','warning');return;}
  TC.busy=true;
  if(TC.dctx.mode==='edit'){const c=getCourse(TC.dctx.id);Object.assign(c,{name:d.name,category:d.category,instructor:d.instructor,duration:d.duration,has_cost:d.has_cost,budget:d.has_cost?Number(d.budget):0});audit(c,'แก้ไขข้อมูลหลักสูตร','');closeDrawer();setTimeout(()=>{TC.busy=false;render();showToast('บันทึกการแก้ไขแล้ว','success');},300);return;}
  const seq=String(DB.courses.length+1).padStart(3,'0');
  const nc={id:'CO'+Date.now(),code:'CRS-2569-'+seq,name:d.name,category:d.category,instructor:d.instructor,duration:d.duration,has_cost:d.has_cost,budget:d.has_cost?Number(d.budget):0,status:asDraft?'draft':'published',createdAt:new Date().toISOString().slice(0,10),desc:d.desc,history:[]};
  audit(nc,asDraft?'บันทึกร่างหลักสูตร':'สร้างหลักสูตร + เผยแพร่',d.has_cost?'มีค่าใช้จ่าย · งบ '+fmtNumber(d.budget):'ไม่มีค่าใช้จ่าย');
  DB.courses.push(nc);closeDrawer();
  setTimeout(()=>{TC.busy=false;render();showToast(asDraft?'บันทึกร่างแล้ว':'สร้างหลักสูตรแล้ว','success');},300);
}

function submitSession(){
  if(viewerRO())return; if(TC.busy)return;
  const d=TC.draft,bad=[];
  if(!String(d.start).trim())bad.push('f-start');
  if(!(Number(d.capacity)>=1))bad.push('f-cap');
  if(!String(d.location).trim())bad.push('f-loc');
  if(bad.length||!d.courseId){markInvalidFields(bad);showToast(!bad.length&&!d.courseId?'กรุณาเลือกหลักสูตร':'กรุณากรอกข้อมูลที่ไฮไลต์ให้ครบ','warning');return;}
  /* FIX-02: สร้างรอบได้เฉพาะหลักสูตรที่เผยแพร่ (กันสร้างรอบให้หลักสูตร closed/draft) */
  const _c=getCourse(d.courseId); if(!_c||_c.status!=='published'){showToast('สร้างรอบได้เฉพาะหลักสูตรที่เผยแพร่','warning');return;}
  TC.busy=true;
  if(TC.dctx.mode==='edit'){const s=getSession(TC.dctx.id);Object.assign(s,{courseId:d.courseId,start:d.start,end:d.end||d.start,time:d.time,location:d.location,capacity:Number(d.capacity)});audit(s,'แก้ไขข้อมูลรอบอบรม','');closeDrawer();setTimeout(()=>{TC.busy=false;render();showToast('บันทึกการแก้ไขแล้ว','success');},300);return;}
  const seq=String(DB.sessions.length+1).padStart(3,'0');
  const ns={id:'SE'+Date.now(),code:'SES-2569-'+seq,courseId:d.courseId,start:d.start,end:d.end||d.start,time:d.time||'09:00–16:00',location:d.location,capacity:Number(d.capacity),status:'draft',createdAt:new Date().toISOString().slice(0,10),history:[]};
  audit(ns,'สร้างรอบอบรม (ร่าง)','จำนวนรับ '+ns.capacity);
  DB.sessions.push(ns);closeDrawer();
  setTimeout(()=>{TC.busy=false;render();showToast('สร้างรอบอบรมแล้ว (ร่าง) — กด “เปิดรับสมัคร” จากหน้ารายละเอียด','success');},300);
}

          const resBtn=e.attended===true

            : `<span class="tt-wrap" title="ต้องเช็คชื่อเข้าอบรมก่อน" style="display:inline-block"><button class="btn btn-sm btn-primary is-disabled" disabled title="ต้องเช็คชื่อเข้าอบรมก่อน"><i data-lucide="clipboard-check" class="w-3.5 h-3.5"></i><span>บันทึกผล</span></button></span>`;
          ra=att+resBtn+cancelBtn;
        } else {
          /* FIX-01: รอบยังไม่ปิด → บันทึกผลไม่ได้ */
          ra=`<span class="tt-wrap" title="บันทึกผลได้หลังปิดรอบ" style="display:inline-block"><button class="btn btn-sm btn-primary is-disabled" disabled title="บันทึกผลได้หลังปิดรอบ"><i data-lucide="clipboard-check" class="w-3.5 h-3.5"></i><span>บันทึกผล</span></button></span>`+cancelBtn;
        }
      } else if(e.status==='passed'&&!e.cert){
        ra=`<button class="btn btn-sm btn-secondary" onclick="issueCert('${e.id}')"><i data-lucide="award" class="w-3.5 h-3.5"></i><span>ออกใบรับรอง</span></button>`;
      }
    }
    return `<div class="lrn"><div class="uc-avatar">${esc(personInitials(e.emp.name))}</div>
      <div class="lrn-main"><div class="lrn-name"><span class="lnk-name" onclick="openEmpHistory('${e.emp.id}')" title="ดูประวัติอบรม">${esc(e.emp.name)}</span>${e.source==='gap'?' <span class="chip-soft is-gap"><i data-lucide="target"></i>จาก gap</span>':''}${e.cert?' <span class="chip-soft is-cert"><i data-lucide="award"></i>มีใบรับรอง</span>':''}</div>
        <div class="lrn-sub">${esc(e.emp.position)} · ${esc(e.emp.dept)} · ${enrollStatusPill(e.status)} ${attChip(e)} ${e.result?resultChip(e):''}${evalChip(e)}</div></div>
      <div class="lrn-act">${ra}</div></div>`;
  }).join(''):'<div class="rc-list-intro" style="margin-bottom:12px">ยังไม่มีผู้เรียนในรอบนี้</div>';
  const gapNote=canEnroll&&!full?`<div class="note is-info mb-3"><i data-lucide="target"></i><div>ลงทะเบียนได้จาก <b>ผลประเมิน (gap)</b> หรือเลือกพนักงานเอง · ${c.has_cost?'หลักสูตรนี้<b>มีค่าใช้จ่าย</b> → ต้องอนุมัติ (DOA) ก่อนยืนยัน':'หลักสูตรนี้<b>ไม่มีค่าใช้จ่าย</b> → ยืนยันลงทะเบียนได้เลย'}</div></div>`:'';
  return capNote+gapNote+addBtn+`<div style="margin-top:2px">${rows}</div>`;
}
function sessionApproval(s,c){
  const list=enrollsOfSession(s.id).filter(e=>e.status!=='cancelled');
  const paid=c.has_cost;
  let ecBlock=`<div class="secwrap"><div class="sec-h"><i data-lucide="badge-dollar-sign"></i>ค่าใช้จ่าย & มูลค่าอบรม (EC)</div>`;
  if(paid){
    ecBlock+=`<div class="ec-ref"><div class="ec-h"><i data-lucide="link"></i>มูลค่าอบรม (EC) — อ้างอิงอัตรากลาง</div>
      <div class="ec-row"><span class="chip-soft is-cost"><i data-lucide="plug"></i>อ้างอิง Rate Card · เชื่อมเมื่อ Rate Card พร้อม</span></div>
      <div class="ec-src" style="margin-top:6px">งบภายในหลักสูตร: <b>${maskMoney(c.budget)}</b> บาท · มูลค่าอบรม (EC) ยังไม่ผูกตัวเลข (Rate Card ยังไม่สร้าง) — display-only</div></div>
      <div class="note is-info" style="margin-top:12px"><i data-lucide="receipt"></i><div><b>ค่าอบรม → ส่ง Expense Claim</b> (hook · display-only) — ไม่จ่ายเงินจริง / ไม่ลงบัญชีในหน้านี้ · ยิงมูลค่า EC เข้าโครงสร้างต้นทุน (CSQ) เมื่อยืนยันลงทะเบียน</div></div>`;
  } else {
    ecBlock+=`<div class="note is-info"><i data-lucide="gift"></i><div>หลักสูตรนี้<b>ไม่มีค่าใช้จ่าย</b> — ข้ามการอนุมัติ (DOA) และไม่มีการส่ง Expense Claim</div></div>`;
  }
  ecBlock+=`</div>`;
  const approvals=list.filter(e=>e.approval).map(e=>`<div class="secwrap"><div class="sec-h"><i data-lucide="user"></i>${esc(e.emp.name)} · ${enrollStatusPill(e.status)}</div>
    ${approvalSection(e.approval,'ลงทะเบียน',true)}
    ${e.status==='confirmed'&&paid?`<div style="margin-top:10px;display:flex;justify-content:flex-end">${e.expenseSent?'<span class="chip-soft is-free"><i data-lucide="check"></i>ส่ง Expense Claim แล้ว</span>':(TC.persona!=='viewer'?`<button class="btn btn-sm btn-secondary" onclick="sendExpense('${e.id}')"><i data-lucide="receipt" class="w-3.5 h-3.5"></i><span>ส่ง Expense Claim (มูลค่า EC)</span></button>`:'')}</div>`:''}
    </div>`).join('');
  const none=paid&&!approvals?'<div class="rc-list-intro">ยังไม่มีการลงทะเบียนที่เข้าสายอนุมัติ</div>':'';
  return ecBlock+approvals+none;
}

/* ============================================================ ENROLL / RESULT / CERT / APPROVE (FN-03..09,11) ============================================================ */
function openEnrollModal(sid){if(viewerRO())return;const s=getSession(sid),c=courseOf(s);if(activeEnrolls(sid).length>=s.capacity){showToast('จำนวนรับเต็มแล้ว — ลงทะเบียนเพิ่มไม่ได้','warning');return;}TC.draft.enr={sid,emp_id:null,source:'manual',gap_ref:null};TC.mctx={type:'enroll',data:{sid}};tcOpenModal();}
function pickGap(empId,gapRef){const s=TC.draft.enr;s.emp_id=empId;s.source='gap';s.gap_ref=gapRef;
  if(document.getElementById(ssId('ss-','enr_emp')))initSearchSelect('enr_emp',{options:empOpts(),value:empId,emptyText:'ไม่พบพนักงาน',portal:true,onSelect:v=>{TC.draft.enr.emp_id=v;TC.draft.enr.source='manual';TC.draft.enr.gap_ref=null;}});
  showToast('เลือกผู้เรียนจาก gap แล้ว','info');}
function submitEnroll(){
  if(viewerRO())return;
  const en=TC.draft.enr,s=getSession(en.sid),c=courseOf(s);
  if(!en.emp_id){showToast('กรุณาเลือกผู้เรียน','warning');return;}
  if(activeEnrolls(en.sid).filter(e=>e.emp.id===en.emp_id).length){showToast('ผู้เรียนคนนี้ลงทะเบียนรอบนี้แล้ว','warning');return;}
  if(activeEnrolls(en.sid).length>=s.capacity){showToast('จำนวนรับเต็มแล้ว','warning');return;}
  const ne={id:'EN'+Date.now(),sessionId:en.sid,emp:empSnap(en.emp_id),source:en.source,gap_ref:en.gap_ref,status:c.has_cost?'pending_doa':'confirmed',result:null,cert:null,expenseSent:false,attended:null,evalScore:null,evalComment:'',enrolledAt:new Date().toISOString().slice(0,10),approval:null,history:[]};
  DB.enrolls.push(ne);
  if(c.has_cost){
    audit(ne,'ลงทะเบียนผู้เรียน + ส่งอนุมัติ (DOA)','หลักสูตรมีค่าใช้จ่าย → ต้องอนุมัติก่อนยืนยัน'+(en.source==='gap'?' · มาจาก gap':''),'warn');
    closeModal();
    setTimeout(()=>{openDoaModal(ne.id);},240);
  } else {
    audit(ne,'ลงทะเบียนผู้เรียน (ยืนยันทันที)','หลักสูตรไม่มีค่าใช้จ่าย → ข้าม DOA'+(en.source==='gap'?' · มาจาก gap':''));
    closeModal();
    setTimeout(()=>{ntf('ยืนยันลงทะเบียน '+esc(ne.emp.name));render();showToast('ลงทะเบียนสำเร็จ (ยืนยันแล้ว)','success');},200);
  }
}
function openResultModal(eid){if(viewerRO())return;const e=getEnroll(eid);
  /* FIX-01: บันทึกผลได้เฉพาะเมื่อรอบอบรมปิดแล้ว (จบการอบรม) */
  if(getSession(e.sessionId).status!=='closed'){showToast('บันทึกผลได้หลังปิดรอบอบรม (จบการอบรม)','warning');return;}
  if(e.status!=='confirmed'){showToast('บันทึกผลได้เฉพาะผู้เรียนที่ยืนยันลงทะเบียนแล้ว','warning');return;}
  /* FIX-03: ต้องเช็คชื่อเข้าอบรมก่อนจึงบันทึกผลได้ */
  if(e.attended!==true){showToast('ต้องเช็คชื่อเข้าอบรมก่อน','warning');return;}
  TC.draft.res={eid,result:null,comment:'',evalScore:null};TC.mctx={type:'result',data:{eid}};tcOpenModal();}
function pickResult(v){TC.draft.res.result=v;document.querySelectorAll('.rf-pick button').forEach(b=>{b.classList.remove('on-pass','on-fail');if(b.dataset.v===v)b.classList.add(v==='pass'?'on-pass':'on-fail');});}
/* FIX-03: เลือกคะแนนประเมินหลังอบรม 1-5 */
function pickEval(n){TC.draft.res.evalScore=n;document.querySelectorAll('.ev-pick button').forEach(b=>b.classList.toggle('on',Number(b.dataset.n)===n));}
function submitResult(){
  if(viewerRO())return;
  const r=TC.draft.res,e=getEnroll(r.eid);
  /* FIX-01/03: กันบันทึกผลถ้ารอบยังไม่ปิด หรือยังไม่เช็คชื่อเข้า (defense-in-depth) */
  if(getSession(e.sessionId).status!=='closed'){showToast('บันทึกผลได้หลังปิดรอบอบรม (จบการอบรม)','warning');return;}
  if(e.attended!==true){showToast('ต้องเช็คชื่อเข้าอบรมก่อน','warning');return;}
  if(!r.result){showToast('กรุณาเลือกผล (ผ่าน/ไม่ผ่าน)','warning');return;}
  e.result=r.result;e.status=r.result==='pass'?'passed':'failed';
  e.evalScore=r.evalScore||null;e.evalComment=r.comment||'';
  audit(e,'บันทึกผล: '+(r.result==='pass'?'ผ่าน':'ไม่ผ่าน')+' + ประกาศผล',(r.evalScore?'ประเมิน '+r.evalScore+'/5':'')+(r.comment?(r.evalScore?' · ':'')+r.comment:''),'ok');
  closeModal();
  setTimeout(()=>{ntf('ประกาศผลอบรม '+esc(e.emp.name)+' — '+(r.result==='pass'?'ผ่าน':'ไม่ผ่าน'));render();showToast('บันทึกผลและประกาศผลแล้ว','success');},200);
}
function issueCert(eid){
  if(viewerRO())return;const e=getEnroll(eid);
  if(e.status!=='passed'){showToast('ออกใบรับรองได้เฉพาะผู้ผ่านการอบรม','warning');return;}
  openConfirm({title:'ออกใบรับรองผู้ผ่าน (soft ref)?',body:'ใบรับรองนี้เป็นการอ้างอิงแบบ soft ref — ไม่มีเลขรันเอกสาร และไม่ออก PDF ทางการในรอบนี้ (ตามมติ)',confirmLabel:'ออกใบรับรอง',danger:false,onConfirm:()=>{
    e.cert={id:'CERT-REF-'+Date.now(),issuedAt:new Date().toISOString().slice(0,10),note:'ใบรับรองอ้างอิง (soft ref)'};
    audit(e,'ออกใบรับรองผู้ผ่าน (soft ref)','ไม่มีเลขรัน / ไม่ออก PDF ทางการ');
    render();showToast('ออกใบรับรอง (soft ref) แล้ว','success');
  }});
}
function cancelEnroll(eid){
  if(viewerRO())return;const e=getEnroll(eid);
  openConfirm({title:'ยกเลิกการลงทะเบียน?',body:'การลงทะเบียนของ '+e.emp.name+' จะถูกยกเลิก (soft archive) และคืนที่ว่างให้รอบอบรม — ประวัติยังอยู่ครบ',confirmLabel:'ยกเลิกการลงทะเบียน',danger:true,onConfirm:()=>{
    e.status='cancelled';audit(e,'ยกเลิกการลงทะเบียน','คืนที่ว่างให้รอบอบรม','warn');
    render();showToast('ยกเลิกการลงทะเบียนแล้ว','success');
  }});
}
function enrollApprove(eid){
  if(viewerRO())return;
  if(!PERSONAS[TC.persona].canApprove){showToast('เฉพาะผู้อนุมัติ (DOA) เท่านั้น','warning');return;}
  const e=getEnroll(eid);if(!e.approval)return;
  const st=e.approval.steps.find(s=>s.result==='pending');if(st){st.result='approved';st.at=new Date().toISOString().slice(0,10);}
  e.approval.current=e.approval.steps.filter(s=>s.result==='approved').length;
  if(e.approval.steps.every(s=>s.result==='approved')){e.approval.done=true;e.status='confirmed';
    audit(e,'อนุมัติลงทะเบียน (DOA ครบ '+e.approval.current+'/'+e.approval.steps.length+') → ยืนยัน','แจ้งเตือนผู้เรียน (NTF)');
    ntf('ยืนยันลงทะเบียน '+esc(e.emp.name));
    render();showToast('อนุมัติและยืนยันลงทะเบียนแล้ว','success');return;}
  audit(e,'อนุมัติ (ขั้น '+e.approval.current+'/'+e.approval.steps.length+')','');
  render();showToast('อนุมัติขั้นนี้แล้ว','success');
}
function enrollReject(eid){
  if(viewerRO())return;
  if(!PERSONAS[TC.persona].canApprove){showToast('เฉพาะผู้อนุมัติ (DOA) เท่านั้น','warning');return;}
  openReasonModal({title:'ไม่อนุมัติการลงทะเบียน',label:'เหตุผลที่ไม่อนุมัติ',confirmLabel:'ไม่อนุมัติ',danger:true,onConfirm:(reason)=>{
    const e=getEnroll(eid);if(e.approval){const st=e.approval.steps.find(s=>s.result==='pending');if(st)st.result='rejected';}
    e.status='cancelled';audit(e,'ไม่อนุมัติการลงทะเบียน',reason,'bad');
    render();showToast('ไม่อนุมัติแล้ว','info');
  }});
}
function sendExpense(eid){
  if(viewerRO())return;const e=getEnroll(eid);
  /* FIX-02: ส่งได้หลังลงทะเบียนได้รับอนุมัติ + กันส่งซ้ำ */
  if(!['confirmed','passed','failed'].includes(e.status)){showToast('ส่งได้หลังการลงทะเบียนได้รับอนุมัติ','warning');return;}

  render();showToast('ส่งไปยัง Expense Claim (hook) แล้ว — ไม่จ่าย/ไม่ post','info');
}

function sessionClose(id){if(viewerRO())return;openConfirm({title:'ปิดรอบอบรมนี้?',body:'รอบอบรมจะถูกปิด (soft archive) — ไม่รับลงทะเบียนเพิ่ม · ผู้เรียนและผลยังอยู่ครบ',confirmLabel:'ปิดรอบ',danger:true,onConfirm:()=>{const s=getSession(id);s.status='closed';audit(s,'ปิดรอบ (จบการอบรม)','สถานะ → ปิดรอบ');render();showToast('ปิดรอบแล้ว','success');}});}

/* ============================================================ MODALS ============================================================ */
function openConfirm(cfg){TC.mctx={type:'confirm',data:cfg};tcOpenModal();}
function openReasonModal(cfg){TC.draft.reason='';TC.mctx={type:'reason',data:cfg};tcOpenModal();}
function openDoaModal(eid){const r=doaResolve();TC.draft.slots={};TC.mctx={type:'doa',data:{eid,entry:r.entry,steps:r.steps}};tcOpenModal();}
function tcOpenModal(){state.modal={open:true,type:TC.mctx.type,data:TC.mctx.data};render();requestAnimationFrame(()=>{const mb=document.getElementById('modalBackdrop');mb.classList.add('is-open');lockScroll(true);/* FIX-06: เรนเดอร์ไอคอน/avatar ครอบ modal ทุกครั้งหลังเปิด กันกล่องว่าง */renderIcons();const box=mb.querySelector('.modal');if(box)trapFocus(box);/* BUG-04: trapFocus auto-focus ช่องแรก ถ้าเป็น search-select จะเผลอเปิด dropdown เอง → ปิดคืนหลัง focus (ไม่แตะ base-kit) */requestAnimationFrame(()=>{const ae=document.activeElement;if(ae&&ae.classList&&ae.classList.contains('ss-input')){const key=ae.id.replace('ss-input-','');const s=window.__ss&&window.__ss[key];if(s)s.open=false;const l=document.getElementById('ss-list-'+key);if(l)l.classList.add('hidden');ae.blur();}});});}

function renderModal(){
  const t=TC.mctx.type,d=TC.mctx.data;
  if(t==='confirm')return `<div class="modal-header"><div class="modal-header-icon ${d.danger?'is-danger':''}"><i data-lucide="${d.danger?'alert-triangle':'help-circle'}" class="w-4 h-4"></i></div><div><h3 class="modal-title">${esc(d.title)}</h3><p class="modal-subtitle">${esc(d.body)}</p></div></div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn ${d.danger?'btn-danger':'btn-primary'}" onclick="tcConfirmYes()">${esc(d.confirmLabel||'ยืนยัน')}</button></div>`;
  if(t==='reason')return `<div class="modal-header"><div class="modal-header-icon ${d.danger?'is-danger':'is-warning'}"><i data-lucide="message-square-warning" class="w-4 h-4"></i></div><div><h3 class="modal-title">${esc(d.title)}</h3><p class="modal-subtitle">${esc(d.label||'ระบุเหตุผล')}</p></div></div>
    <div class="modal-body"><div class="field"><label class="field-label">เหตุผล <span class="req">*</span></label><textarea class="notes-area" oninput="TC.draft.reason=this.value" placeholder="ระบุเหตุผล" style="min-height:80px">${esc(TC.draft.reason||'')}</textarea></div></div>
    <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn ${d.danger?'btn-danger':'btn-primary'}" onclick="tcReasonYes()">${esc(d.confirmLabel||'ยืนยัน')}</button></div>`;
  if(t==='enroll'){
    const s=getSession(d.sid),c=courseOf(s),gaps=gapsForCourse(c.id);
    return `<div class="modal-header"><div class="modal-header-icon"><i data-lucide="user-plus" class="w-4 h-4"></i></div><div><h3 class="modal-title">ลงทะเบียนผู้เรียน</h3><p class="modal-subtitle">${esc(c.name)} · ${fmtDate(s.start)} · ที่ว่าง ${s.capacity-activeEnrolls(s.id).length}/${s.capacity}</p></div></div>
      <div class="modal-body">
        <div class="note ${c.has_cost?'is-warn':'is-info'} mb-3"><i data-lucide="${c.has_cost?'badge-dollar-sign':'gift'}"></i><div>${c.has_cost?'หลักสูตร<b>มีค่าใช้จ่าย</b> — เมื่อลงทะเบียนจะต้อง<b>ขออนุมัติ (DOA)</b> ก่อนยืนยัน':'หลักสูตร<b>ไม่มีค่าใช้จ่าย</b> — ลงทะเบียนแล้ว<b>ยืนยันได้เลย</b> (ข้าม DOA)'}</div></div>
        ${gaps.length?`<div class="secwrap" style="margin-bottom:14px"><div class="sec-h"><i data-lucide="target"></i>แนะนำจากผลประเมิน (gap · Performance)</div>
          <p class="rc-list-intro" style="margin:0 0 10px">อ่านจากระบบประเมินผลงาน (hook display-only) — คลิกเพื่อเลือกผู้เรียน</p>
          ${gaps.map(g=>`<div class="bm-card" onclick="pickGap('${g.emp_id}','${g.perf_ref}')"><div class="bm-icon"><i data-lucide="user"></i></div><div style="flex:1"><div style="font-weight:600;font-size:13px">${esc(g.e.name)} <span class="chip-soft is-gap"><i data-lucide="target"></i>gap</span></div><div style="font-size:12px;color:var(--c-mute-2)">${esc(g.gap)} · <span class="num">${esc(g.perf_ref)}</span></div></div><i data-lucide="plus" class="w-4 h-4"></i></div>`).join('')}</div>`:''}
        <div class="field"><label class="field-label">เลือกผู้เรียน <span class="req">*</span></label>${searchSelectHTML('enr_emp',{placeholder:'ค้นหาพนักงาน...'})}<div class="field-help">เลือกจาก gap ด้านบน หรือค้นหาพนักงานเอง</div></div>
      </div>
      <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" onclick="submitEnroll()"><i data-lucide="${c.has_cost?'send':'check'}" class="w-4 h-4"></i><span>${c.has_cost?'ลงทะเบียน + ส่งอนุมัติ':'ลงทะเบียน (ยืนยัน)'}</span></button></div>`;
  }
  if(t==='result'){
    const e=getEnroll(d.eid),c=courseOfEnroll(e);
    return `<div class="modal-header"><div class="modal-header-icon"><i data-lucide="clipboard-check" class="w-4 h-4"></i></div><div><h3 class="modal-title">บันทึกผลการอบรม</h3><p class="modal-subtitle">${esc(e.emp.name)} · ${esc(c.name)}</p></div></div>
      <div class="modal-body">
        <div class="note is-info mb-3"><i data-lucide="user-check"></i><div>เช็คชื่อแล้ว: <b>เข้าอบรม</b> — บันทึกผลได้</div></div>
        <div class="field"><label class="field-label">ผลการอบรม <span class="req">*</span></label>
          <div class="rf-pick"><button data-v="pass" onclick="pickResult('pass')"><i data-lucide="check"></i>ผ่าน</button><button data-v="fail" onclick="pickResult('fail')"><i data-lucide="x"></i>ไม่ผ่าน</button></div></div>
        <div class="field"><label class="field-label">ประเมินหลังอบรม (คะแนน 1-5)</label>
          <div class="ev-pick">${[1,2,3,4,5].map(n=>`<button type="button" data-n="${n}" onclick="pickEval(${n})">${n}</button>`).join('')}</div>
          <div class="field-help">ให้คะแนนผลหลังอบรม (ไม่บังคับ) — เก็บลงประวัติผู้เรียน</div></div>
        <div class="field"><label class="field-label">ความเห็น / บันทึกการประเมิน</label><textarea class="notes-area" oninput="TC.draft.res.comment=this.value" placeholder="ความเห็นหลังอบรม (ถ้ามี)" style="min-height:70px">${esc(TC.draft.res&&TC.draft.res.comment||'')}</textarea></div>
        <div class="note is-info"><i data-lucide="bell"></i><div>เมื่อบันทึกผล ระบบจะ<b>ประกาศผล</b>และแจ้งเตือนผู้เรียน (NTF) · ผู้ผ่านสามารถออกใบรับรอง (soft ref) ได้</div></div>
      </div>
      <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" onclick="submitResult()"><i data-lucide="check" class="w-4 h-4"></i><span>บันทึก + ประกาศผล</span></button></div>`;
  }
  if(t==='emphist')return empHistoryHTML(d.empId);
  if(t==='doa'){
    const e=getEnroll(d.eid);
    return `<div class="modal-header"><div class="modal-header-icon"><i data-lucide="git-branch-plus" class="w-4 h-4"></i></div><div><h3 class="modal-title">ส่งอนุมัติลงทะเบียน (DOA)</h3><p class="modal-subtitle">${esc(e.emp.name)} · DOA entry <span class="num">${esc(d.entry)}</span> · ไม่มีวงเงิน</p></div></div>
      <div class="modal-body"><div class="note is-info mb-3"><i data-lucide="info"></i><div>หลักสูตรมีค่าใช้จ่าย — สายอนุมัติมาจากระบบ DOA กลาง (F-DLG-001) · เลือก “คน” ตามตำแหน่งในแต่ละขั้น (ไม่ hardcode สาย)</div></div>
        ${d.steps.map((s,i)=>`<div class="slot"><div class="slot-h"><span class="sn">${i+1}</span><span class="st">${esc(s.slotName)}</span><span class="sr">${esc(s.slot)}</span></div>${searchSelectHTML('slot_'+(i+1),{placeholder:'เลือกผู้อนุมัติ...'})}</div>`).join('')}</div>
      <div class="modal-footer"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" onclick="submitDoa()"><i data-lucide="send" class="w-4 h-4"></i><span>ส่งอนุมัติ</span></button></div>`;
  }
  return '';
}
function tcConfirmYes(){const fn=TC.mctx.data.onConfirm;closeModal();setTimeout(()=>{if(fn)fn();},180);}
function tcReasonYes(){const r=String(TC.draft.reason||'').trim();if(!r){showToast('กรุณาระบุเหตุผล','warning');return;}const d=TC.mctx.data;closeModal();setTimeout(()=>{if(d.onConfirm)d.onConfirm(r);},180);}
function submitDoa(){
  const d=TC.mctx.data;const chosen=d.steps.map((s,i)=>TC.draft.slots['slot_'+(i+1)]);
  if(chosen.some(x=>!x)){showToast('กรุณาเลือกผู้อนุมัติให้ครบทุกขั้น','warning');return;}
  const steps=d.steps.map((s,i)=>({order:s.order,slotName:s.slotName,approver_id:chosen[i],result:'pending',at:null}));
  const e=getEnroll(d.eid);e.approval={entry:d.entry,current:0,done:false,steps};e.status='pending_doa';
  audit(e,'ส่งอนุมัติลงทะเบียน (DOA)',d.entry);ntf('ส่งอนุมัติลงทะเบียน '+esc(e.emp.name));
  closeModal();setTimeout(()=>{render();showToast('ส่งอนุมัติแล้ว — รอผู้อนุมัติ (DOA)','success');},180);
}

function mountCombos(){
  if(state.drawer.open&&TC.dctx){
    if(TC.dctx.kind==='course'&&(TC.dctx.mode==='create'||TC.dctx.mode==='edit')&&document.getElementById(ssId('ss-','crs_cat')))
      initSearchSelect('crs_cat',{options:CATEGORIES.map(c=>({value:c.value,label:c.label,icon:'folder'})),value:TC.draft.category||null,emptyText:'ไม่พบหมวด',onSelect:v=>{TC.draft.category=v;}});
    if(TC.dctx.kind==='session'&&(TC.dctx.mode==='create'||TC.dctx.mode==='edit')&&document.getElementById(ssId('ss-','ses_course')))
      initSearchSelect('ses_course',{options:courseOpts(),value:TC.draft.courseId||null,emptyText:'ไม่พบหลักสูตร',onSelect:v=>{TC.draft.courseId=v;if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();render();}});
  }
  if(state.modal.open&&TC.mctx){
    if(TC.mctx.type==='enroll'&&document.getElementById(ssId('ss-','enr_emp')))
      initSearchSelect('enr_emp',{options:empOpts(),value:(TC.draft.enr||{}).emp_id||null,emptyText:'ไม่พบพนักงาน',portal:true,onSelect:v=>{TC.draft.enr.emp_id=v;TC.draft.enr.source='manual';TC.draft.enr.gap_ref=null;}});
    if(TC.mctx.type==='doa'){TC.draft.slots=TC.draft.slots||{};TC.mctx.data.steps.forEach((s,i)=>{const k='slot_'+(i+1);if(document.getElementById(ssId('ss-',k)))initSearchSelect(k,{options:empOpts(),value:TC.draft.slots[k]||null,emptyText:'ไม่พบพนักงาน',onSelect:v=>{TC.draft.slots[k]=v;}});});}
  }
}
