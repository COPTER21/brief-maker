<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>อบรม (Training) · CUBE NATIVE</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">

<!-- Lucide Icons: loader ที่ท้าย body (ดู section "Lucide loader" ก่อน main <script>) -->
<!-- เหตุผล:
     1) ย้ายมาท้าย body หลีกเลี่ยง race กับ DOMContentLoaded
     2) Multi-CDN fallback (unpkg → jsdelivr → cdnjs)
     3) Pin version (เลิกใช้ @latest ที่ flaky — GitHub issue #2962)
-->

<style>
/* ===== BASE-KIT v6.4 — DO NOT EDIT (Rule #69) — page CSS ต่อท้ายหลัง END marker ===== */
/* ============== CSS VARIABLES (CUBE CI — v2.0 Warm Light rebrand) ============== */
:root {
  --c-navy: #111111;
  --c-navy-2: #111111;
  --c-primary: #FF3B30;
  --c-primary-hover: #E62E24;
  --c-teal: #FF9A1F;
  --c-teal-light: #FFB763;
  --c-ink: #111111;
  --c-mute: #54565C;
  --c-mute-2: #73757B;
  --c-mute-3: #9A9CA2;
  --c-line: #DEDAD4;
  --c-line-2: #E9E5E0;
  --c-line-3: #F1EEEA;
  --c-bg-off: #FAF8F5;
  --c-success: #1F9D55;
  --c-warning: #E8870F;
  --c-danger: #E62E24;
  --sidebar-w: 232px;
  --shell-h: 52px;
  /* ============== Z-INDEX SCALE (ลำดับชั้นการซ้อน) ==============
     BASE-KIT อ้าง var ชุดนี้ทุก overlay — ขาดไปแล้ว computed เป็น auto ทั้งหมด
     ผลคือหัวตาราง sticky วาดทับลิ้นชัก · เจอจริง 2026-08-04 (F-COA-001) */
  --z-shell: 20;      /* sidebar */
  --z-sticky: 30;     /* shell-bar · thead sticky */
  --z-dropdown: 40;   /* user menu · tooltip */
  --z-backdrop: 50;   /* ฉากหลัง drawer/modal · search list */
  --z-drawer: 55;     /* ตัวลิ้นชัก/หน้าต่าง */
  --z-portal: 60;     /* เมนูที่ portal ออกไป #overlay-root (Rule #95) — ต้องเหนือลิ้นชัก */
  --z-toast: 90;      /* สูงสุด — ต้องเห็นเหนือทุกอย่าง */
  /* v3.13 — Fixed type scale (Iron Rule locked values) */
  --fs-h1: 22px;        /* page title */
  --fs-h2: 17px;        /* section title */
  --fs-h3: 15px;        /* card / drawer title */
  --fs-body: 14px;      /* body default */
  --fs-sub: 13px;       /* secondary body / table cell */
  --fs-meta: 12px;      /* meta / label */
  --fs-cap: 11px;       /* uppercase section caption */
  --fs-kpi: 28px;       /* stat value */
  /* v3.13 — Fixed spacing scale */
  --sp-xs: 4px; --sp-sm: 8px; --sp-md: 12px; --sp-lg: 20px; --sp-xl: 28px;
  /* v3.13 — Fixed radius scale */
  --r-xs: 4px; --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-full: 999px;
}

/* ============== RESET ============== */
* { box-sizing: border-box; }
html, body { margin:0; padding:0; }
/* Rule #35 — Layout Stability: จองพื้นที่ scrollbar ไว้เสมอ → เปิด modal/drawer หรือ
   content โตขึ้นแล้ว scrollbar โผล่/หาย จะไม่ทำให้หน้าจอขยับซ้าย-ขวา (jank) */
html { scrollbar-gutter: stable; }
/* scroll lock — เปิด overlay แล้วพื้นหลังต้องไม่ scroll ตาม (ทำงานคู่กับ lockScroll ใน UTILS) */
body.is-overlay-open { overflow: hidden; }

/* ============== SCROLLBAR (Iron Rule #49 — minimal, ห้าม default) ============== */
/* เส้นบางมาก 5px · track โปร่งใส · พื้นเข้ม (sidebar/panel) = ขาวโปร่ง · พื้นสว่าง = charcoal จาง */
* { scrollbar-width: thin; scrollbar-color: rgba(17,17,17,.16) transparent; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(17,17,17,.14); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: rgba(17,17,17,.26); }
.sidebar, .slide { scrollbar-color: rgba(255,255,255,.28) transparent; }
.sidebar ::-webkit-scrollbar-thumb, .slide ::-webkit-scrollbar-thumb,
.sidebar::-webkit-scrollbar-thumb, .slide::-webkit-scrollbar-thumb { background: rgba(255,255,255,.28); }
.sidebar ::-webkit-scrollbar-thumb:hover, .slide ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.42); }
body {
  font-family: 'Satoshi', 'Noto Sans Thai', system-ui, sans-serif;
  background: var(--c-bg-off);
  color: var(--c-ink);
  font-size:14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  /* v7.1 Rule #97: desktop-base + adaptive — 768-1180 ปรับ layout ผ่าน media query,
     <768 = horizontal scroll (ไม่ guarantee) */
  min-width: 768px;
}
a { text-decoration: none; color: inherit; }
button { font-family: inherit; cursor: pointer; }
[data-lucide] { flex-shrink: 0; }

/* Hide number input spinner globally (Iron Rule #19) */
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin:0; }
input[type="number"] { -moz-appearance: textfield; }

/* ============== SIDEBAR ============== */
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: var(--sidebar-w);
  background: #111111;
  color: #E9E5E0;
  z-index:var(--z-shell);
  display: flex;
  flex-direction: column;
  border-right: 1px solid rgba(255,255,255,0.06);
}
.sb-brand {
  padding:18px;
  display: flex;
  align-items: center;
  gap:12px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  flex-shrink: 0;
}
.sb-logo {
  width: 34px; height: 34px;
  background: linear-gradient(135deg, #FF3B30, #FF9A1F);
  border-radius: 9px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(255,59,48,0.3);
}
.sb-name { font-weight: 700; font-size:14px; color: #fff; letter-spacing: -0.01em; line-height: 1.2; }
.sb-sub { font-size:11px; color: #9A9CA2; letter-spacing: 0.06em; font-weight: 600; text-transform: uppercase; margin-top:2px; }
.sb-nav { flex: 1; padding:12px 8px; overflow-y: auto; }

/* Module = collapsible group (Iron Rule #27).
   Header toggles expand/collapse only — NOT navigable.
   Children = .sb-features (clickable feature items). */
.sb-module { margin-bottom:4px; }
.sb-module-header {
  display: flex; align-items: center; gap:8px;
  width: 100%;
  padding:8px 10px;
  border-radius: 6px;
  background: transparent; border: 0;
  color: #9A9CA2;
  font-family: inherit;
  font-size:11px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
  cursor: pointer; transition: all 120ms;
  text-align: left;
}
.sb-module-header:hover { background: rgba(255,255,255,0.04); color: #DEDAD4; }
.sb-module-header .mod-icon { flex-shrink: 0; opacity: 0.7; }
.sb-module-header .mod-label { flex: 1; }
.sb-module-header .mod-chevron {
  flex-shrink: 0;
  transition: transform 200ms;
  opacity: 0.7;
}
.sb-module[data-expanded="false"] .mod-chevron { transform: rotate(-90deg); }
.sb-module[data-expanded="false"] .sb-features { display: none; }

.sb-features { padding:2px 0 6px 0; }

.sb-item {
  display: flex; align-items: center; gap:10px;
  padding:8px 12px 8px 16px;
  border-radius: 6px;
  color: #DEDAD4;
  font-size:13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 120ms;
  margin-bottom:1px;
  position: relative;
  user-select: none;
}
.sb-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.sb-item.is-active {
  background: #FF3B30;
  color: #fff;
  font-weight: 600;
}
.sb-item.is-active::before {
  content: '';
  position: absolute;
  left: -10px; top: 7px; bottom: 7px;
  width: 3px;
  background: #fff;
  border-radius: 0 2px 2px 0;
}
.sb-item [data-lucide] { width: 16px; height: 16px; opacity: 0.85; }
.sb-item.is-active [data-lucide] { opacity: 1; }
.sb-badge {
  margin-left:auto;
  font-size:11px;
  font-weight: 600;
  background: rgba(255,255,255,0.10);
  color: #9A9CA2;
  padding:2px 8px;
  border-radius: 999px;
}
.sb-item.is-active .sb-badge { background: rgba(255,255,255,0.18); color: #fff; }
.sb-item.is-disabled { opacity: 0.4; cursor: not-allowed; }
.sb-item.is-disabled:hover { background: transparent; color: #DEDAD4; }
.sb-footer {
  padding:12px 16px;
  border-top: 1px solid rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  gap:8px;
  font-size:12px;
  color: #9A9CA2;
}
.pulse-dot {
  width: 7px; height: 7px;
  background: var(--c-teal);
  border-radius: 50%;
  box-shadow: 0 0 0 3px rgba(255,154,31,0.20);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

/* ============== MAIN ============== */
.main {
  margin-left:var(--sidebar-w);
  min-height: 100vh;
  background: var(--c-bg-off);
}

/* ============== SHELL BAR ============== */
.shell-bar {
  position: sticky;
  top: 0;
  background: #fff;
  border-bottom: 1px solid var(--c-line-2);
  height: var(--shell-h);
  display: flex;
  align-items: center;
  padding:0 24px;
  z-index:var(--z-sticky);
  gap:12px;
}
.breadcrumb {
  display: flex;
  align-items: center;
  gap:8px;
  font-size:13px;
  color: var(--c-mute);
}
.breadcrumb a { cursor: pointer; transition: color 120ms; }
.breadcrumb a:hover { color: var(--c-primary); }
.breadcrumb .sep { color: var(--c-mute-3); font-size:11px; }
.breadcrumb-current { color: var(--c-ink); font-weight: 500; }
.icon-btn {
  width: 34px; height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 0;
  color: var(--c-mute);
  border-radius: 7px;
  position: relative;
  transition: all 120ms;
}
.icon-btn:hover { background: var(--c-line-3); color: var(--c-ink); }
.icon-btn [data-lucide] { width: 17px; height: 17px; }
.notif-dot {
  position: absolute;
  top: 7px; right: 8px;
  width: 7px; height: 7px;
  background: var(--c-danger);
  border-radius: 50%;
  border: 2px solid #fff;
}
.user-chip {
  display: flex;
  align-items: center;
  gap:10px;
  padding:6px 10px 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 120ms;
}
.user-chip:hover { background: var(--c-line-3); }
.user-text { line-height: 1.2; text-align: right; }
.user-name { font-size:12.5px; font-weight: 500; color: var(--c-ink); white-space: nowrap; }
.user-role { font-size:11px; color: var(--c-mute-2); white-space: nowrap; margin-top:1px; }
.avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--c-primary), var(--c-teal));
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size:12px;
  font-weight: 600;
  flex-shrink: 0;
}

/* User dropdown menu */
.user-menu {
  position: absolute;
  top: calc(var(--shell-h) - 4px);
  right: 22px;
  background: #fff;
  border: 1px solid var(--c-line-2);
  border-radius: 10px;
  box-shadow: 0 12px 32px rgba(17,17,17,0.12);
  width: 240px;
  z-index:var(--z-dropdown);
  padding:6px;
  display: none;
}
.user-menu.is-open { display: block; }
.user-menu-item {
  display: flex;
  align-items: center;
  gap:10px;
  padding:8px 12px;
  border-radius: 6px;
  font-size:13px;
  color: var(--c-ink);
  cursor: pointer;
  transition: background 120ms;
}
.user-menu-item:hover { background: var(--c-bg-off); }
.user-menu-item [data-lucide] { width: 15px; height: 15px; color: var(--c-mute-2); }
.user-menu-item.is-danger { color: var(--c-danger); }
.user-menu-item.is-danger [data-lucide] { color: var(--c-danger); }
.user-menu-divider { height: 1px; background: var(--c-line-2); margin:6px 0; }

/* ============== CONTENT ============== */
/* Fluid full-width — content stretches to fill viewport (Iron Rule #30).
   Do NOT add max-width here; component-level constraints (modal/toast/wizard
   internal cards) are responsible for their own readability bounds. */
.content {
  padding:24px;
}

/* ============== v7.1 RESPONSIVE — Rule #97 (desktop-base adaptive) ============== */
.nav-toggle { display:none; }
@media (max-width: 1180px){
  .content { padding:16px; }
  .drawer { width: min(920px, 100vw); }
  .drawer.standard { width: min(680px, 100vw); }
  .drawer.wide, .drawer-panel.wide { width: min(1290px, 100vw); }
  /* generic shell: sidebar เป็น off-canvas — Pattern N shell ใช้ icon rail ของตัวเองแทน */
  .main { margin-left: 0; }
  .sidebar { transform: translateX(-100%); transition: transform .18s ease; }
  .sidebar.open { transform: translateX(0); box-shadow: 0 8px 32px rgba(0,0,0,.24); }
  .nav-toggle { display:inline-flex; align-items:center; justify-content:center;
    width:32px; height:32px; border:none; background:transparent; border-radius:8px;
    color:var(--c-ink); }
  .nav-toggle:hover { background: rgba(17,17,17,.06); }
}

/* ============== v7.1 LIST FULL-HEIGHT — Rule #96 ============== */
/* หน้า list หลัก: ตารางยืดเต็มพื้นที่เหลือ ติดขอบล่างเสมอ ทุกขนาดจอ */
.page-fill { display:flex; flex-direction:column;
  min-height: calc(100dvh - var(--shellbar-h, 52px) - 48px); } /* 48 = ระยะขอบบน+ล่างของ .content */
@media (max-width:1180px){ .page-fill { min-height: calc(100dvh - var(--shellbar-h, 52px) - 32px); } }
.page-fill > .card-list, .page-fill > .list-card { flex:1 1 auto; min-height:0;
  display:flex; flex-direction:column; }
.table-wrap { flex:1 1 auto; min-height:0; overflow:auto; }
.table-wrap thead th { position:sticky; top:0; background:#fff; z-index:var(--z-sticky); }
.table-foot { flex:0 0 auto; } /* pagination/count ติดล่างของ card เสมอ */

/* ============== v7.1 OVERLAY PORTAL — Rule #95 ============== */
/* เมนูที่ portal ออกจาก scroll container (ใช้คู่ portalMenu util) */
.menu-fixed { position:fixed !important; z-index:var(--z-portal);
  background:#fff; border:1px solid var(--c-line, #DEDAD4); border-radius:10px;
  box-shadow:0 12px 32px rgba(17,17,17,.14); overflow-y:auto; }

/* ============== PAGE HEADER ============== */
.ph {
  margin-bottom:18px;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: flex-start;
  gap:16px;
}
.ph > div:first-child { flex: 1 1 auto; min-width: 280px; }
.ph-title-row {
  display: flex;
  align-items: baseline;
  gap:10px;
  margin-bottom:6px;
}
.ph-title {
  font-family: 'Noto Sans Thai', sans-serif;
  font-size:20px;
  font-weight: 700;
  color: var(--c-navy);
  margin:0;
  letter-spacing: -0.01em;
}
.ph-count {
  font-size:12.5px;
  font-weight: 600;
  color: var(--c-mute-2);
  background: var(--c-line-3);
  padding:3px 10px;
  border-radius: 999px;
}
.ph-sub { font-size:13px; color: var(--c-mute); margin:0; }
.ph-actions { display: flex;align-items:center; gap:8px; flex-shrink: 0; }

/* ============== BUTTONS ============== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;   /* Rule #36 — content กึ่งกลางแนวนอน */
  gap:6px;
  height: 36px;
  /* Rule #36 — padding-top 2px = optical centering สำหรับฟอนต์ไทย (Noto Sans Thai):
     baseline ของไทยลอยสูงเมื่อ flex-center เพราะ font เผื่อที่สระล่าง → นัดจ์ลง 2px ให้เข้ากลางจริง.
     ✅ verified ด้วยการ render จริง — ทนทุกเบราว์เซอร์ (ต่างจาก text-box-trim ที่รองรับเฉพาะ Chrome 133+). */
  padding:2px 16px 0;
  border-radius: 8px;
  font-size:13px;
  font-weight: 500;
  /* ⚠️ Rule #36 — ห้ามใส่ line-height:1 / overflow:hidden กับตัวปุ่มที่มีข้อความไทย
     เพราะจะ "ตัดสระบน-วรรณยุกต์-สระล่าง" ทำให้ตัวอักษรเบี้ยว. ปล่อย line-height ตาม body (1.5). */
  border: 1px solid transparent;
  background: transparent;
  white-space: nowrap;       /* label ไม่ตัดบรรทัด → ปุ่มในแถวเดียวสูงเท่ากัน */
  transition: all 120ms;
  user-select: none;
  cursor: pointer;
}
.btn [data-lucide] { width: 15px; height: 15px; flex-shrink: 0; }  /* Rule #36 — icon ไม่ถูกบีบ */
.btn:disabled, .btn.is-disabled { opacity: .55; cursor: not-allowed; pointer-events: none; }
.btn-eq { min-width: 104px; }  /* Rule #36 — ปุ่มคู่ที่ควรสมมาตร → กว้างเท่ากัน */
/* Rule #36 — label ยาวที่ "ต้อง" จำกัดความกว้าง: truncate ที่ span (.lbl) ไม่ใช่ที่ตัวปุ่ม.
   line-height (1.5) สูงพอ → overflow:hidden ตัดเฉพาะแนวนอน (ไม่ตัดสระไทย). ปกติปล่อยปุ่มโตตาม label ดีกว่า. */
.btn-truncate { max-width: 220px; }
.btn-truncate .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn-primary { background: var(--c-primary); color: #fff; }
.btn-primary:hover { background: var(--c-primary-hover); box-shadow: 0 2px 8px rgba(255,59,48,0.30); }
.btn-secondary { background: #fff; border-color: var(--c-line); color: var(--c-ink); }
.btn-secondary:hover { background: var(--c-line-3); border-color: var(--c-mute-2); }
.btn-ghost { color: var(--c-mute); }
.btn-ghost:hover { background: var(--c-line-3); color: var(--c-ink); }
.btn-danger { background: #fff; border-color: var(--c-line); color: var(--c-danger); }
.btn-danger:hover { background: #FFE9E7; border-color: var(--c-danger); }
.btn-link { background: transparent; border: 0; padding:0 4px; height: auto; color: var(--c-primary); font-weight: 500; }
.btn-link:hover { text-decoration: underline; }
.btn-sm { height: 30px; padding:2px 12px 0; font-size:12px; }

/* ============== STATS (KPI Cards) ============== */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap:12px;
  margin-bottom:18px;
}
.stat {
  background: #fff;
  border: 1px solid var(--c-line-2);
  border-radius: 10px;
  padding:16px 16px;
  transition: all 150ms;
}
.stat:hover { border-color: var(--c-line); box-shadow: 0 2px 8px rgba(17,17,17,0.05); }
.stat-label {
  display: flex;
  align-items: center;
  gap:6px;
  font-size:12px;
  font-weight: 500;
  color: var(--c-mute);
}
.stat-label [data-lucide] { width: 13px; height: 13px; color: var(--c-primary); }
.stat-value {
  font-family: 'Noto Sans Thai', sans-serif;
  font-size:26px;
  font-weight: 700;
  color: var(--c-navy);
  margin-top:6px;
  letter-spacing: -0.01em;
}
.stat-meta {
  font-size:12px;
  color: var(--c-mute-2);
  margin-top:6px;
  display: flex;
  align-items: center;
  gap:4px;
}
.stat-meta.is-up { color: var(--c-success); }
.stat-meta.is-down { color: var(--c-danger); }
.stat-meta [data-lucide] { width: 12px; height: 12px; }

/* ============== CARD ============== */
.card {
  background: #fff;
  border: 1px solid var(--c-line-2);
  border-radius: 10px;
  overflow: hidden;
}

/* ============== FILTER BAR ============== */
.filter-bar {
  padding:16px 18px;
  display: flex;
  gap:10px;
  align-items: center;
  border-bottom: 1px solid var(--c-line-2);
  background: #fff;
  flex-wrap: wrap;
}

/* ============== INPUTS ============== */
.input, .select {
  height: 36px;
  padding:0 12px;
  border: 1px solid var(--c-line);
  border-radius: 8px;
  font-size:13px;
  background: #fff;
  color: var(--c-ink);
  font-family: inherit;
  transition: all 120ms;
  width: 100%;
}
.input:focus, .select:focus {
  outline: none;
  border-color: var(--c-primary);
  box-shadow: 0 0 0 3px rgba(255,59,48,0.10);
}
.select {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2364748B' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat;
  background-position: right 10px center;
  padding-right:32px;
  appearance: none;
}
.input-search { position: relative; flex: 1; max-width: 320px; }
.input-search input { padding-left:36px; }
.input-search .lead-icon {
  position: absolute;
  left: 11px; top: 50%;
  transform: translateY(-50%);
  width: 15px; height: 15px;
  color: var(--c-mute-2);
  pointer-events: none;
}

/* ===== SEARCH-SELECT (Iron Rule #34) — searchable dropdown แทน select ธรรมดา เมื่อ options เยอะ/lookup master =====
   list = position:absolute overlay → ไม่ดันเนื้อหา (สอดคล้อง Rule #35) */
.search-select { position: relative; width: 100%; }
.search-select .ss-input { padding-left:32px; padding-right:32px; }
.search-select .ss-lead {
  position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px;   /* ⬅ ขนาดตายตัว — ไม่พึ่ง .w-4 (กัน Lucide เรนเดอร์ 24px default → placeholder ดูห่าง) */
  color: var(--c-mute-3); pointer-events: none;
}
.search-select .ss-caret {
  position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
  width: 15px; height: 15px; color: var(--c-mute-3); pointer-events: none;
}
.search-select .ss-clear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  display: inline-flex; padding:3px; border: 0; background: transparent;
  color: var(--c-mute-2); cursor: pointer; border-radius: 6px;
}
.search-select .ss-clear:hover { background: var(--c-line-3); color: var(--c-ink); }
.ss-list {
  position: absolute; z-index:var(--z-backdrop); left: 0; right: 0; margin-top:4px;
  max-height: 280px; overflow-y: auto; background: #fff;
  border: 1px solid var(--c-line); border-radius: 8px;
  box-shadow: 0 10px 30px rgba(17,17,17,0.10), 0 4px 10px rgba(17,17,17,0.05);
}
.ss-opt {
  width: 100%; display: flex; align-items: center; gap:10px; padding:10px 12px;
  border: 0; border-bottom: 1px solid var(--c-line-3); background: transparent;
  cursor: pointer; text-align: left; font-family: inherit;
}
.ss-opt:last-child { border-bottom: 0; }
.ss-opt:hover, .ss-opt.is-active { background: rgba(255,59,48,0.06); }
.ss-opt-ic { width: 16px; height: 16px; color: var(--c-primary); flex-shrink: 0; }  /* ขนาดตายตัวเช่นกัน */
.ss-opt-main { flex: 1; min-width: 0; }
.ss-opt-label { display: block; font-size:13px; color: var(--c-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ss-opt-sub { display: block; font-size:12px; color: var(--c-mute-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ss-opt-right { flex-shrink: 0; font-size:12px; color: var(--c-mute); }
.ss-opt mark { background: rgba(255,59,48,0.16); color: inherit; padding:0 1px; border-radius: 2px; }
.ss-empty { padding:20px 16px; text-align: center; font-size:13px; color: var(--c-mute-2); }

/* ============== TABLE ============== */
.table-scroll { overflow-x: auto; }
.table {
  width: 100%;
  border-collapse: collapse;
  font-size:13px;
}
.table thead { background: var(--c-bg-off); }
.table th {
  padding:12px 16px;
  text-align: left;
  font-weight: 600;
  color: var(--c-mute);
  font-size:12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border-bottom: 1px solid var(--c-line-2);
  white-space: nowrap;
}
.table th.col-check { width: 40px; padding-right:0; }
.table th.is-sortable { cursor: pointer; user-select: none; }
.table th.is-sortable:hover { color: var(--c-ink); background: var(--c-line-3); }
.table th .sort-arrow { display: inline-block; margin-left:4px; opacity: 0.4; }
.table th.is-sorted .sort-arrow { opacity: 1; color: var(--c-primary); }
.table td {
  padding:12px 16px 12px;  /* Rule #38 — optical centering ไทย: pad-top มากกว่า bottom 2px */
  border-bottom: 1px solid var(--c-line-2);
  color: var(--c-ink);
  vertical-align: middle;
}
.table tbody tr { transition: background 120ms; }
.table tbody tr:hover { background: var(--c-bg-off); }
.table tbody tr.is-selected { background: rgba(255,59,48,0.04); }
.table tbody tr.is-selected:hover { background: rgba(255,59,48,0.07); }
.table tbody tr:last-child td { border-bottom: 0; }
/* Rule #41 — แถวกดได้ = เปิด view (ไม่มีไอคอนดวงตา). row ที่ clickable ต้องสื่อด้วย cursor */
.table tbody tr.is-clickable { cursor: pointer; }
/* Rule #42 — Long-list UX: sticky header (opt-in .is-sticky) — ตารางยาว scroll หัวค้าง */
.table-scroll.is-sticky { max-height: 560px; overflow-y: auto; scrollbar-gutter: stable; }
.table-scroll.is-sticky thead th {
  position: sticky; top: 0; z-index: var(--z-sticky);
  background: var(--c-bg-off);            /* ⚠️ ต้องทึบที่ตัว th (ไม่ใช่แค่ thead) — ไม่งั้น row เลื่อนทะลุซ้อนหัว */
  box-shadow: inset 0 -1px 0 var(--c-line-2);  /* border-bottom สำหรับ sticky (border ปกติหายตอน sticky) */
}
/* Rule #42 — Thai-safe cell truncation: ตัดเฉพาะแนวนอน (… ) line-height พอ ไม่ตัดสระ. ใส่ title=ค่าเต็มเพื่อ hover ดู */
.cell-truncate { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
/* Rule #43 — ตัวเลข tabular + คอลัมน์ตัวเลขชิดขวา */
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
th.col-num, td.col-num { text-align: right; }
td.col-num .num, td.col-num { font-variant-numeric: tabular-nums; }

/* ============== CHECKBOX ============== */
.cb {
  width: 16px; height: 16px;
  border: 1.5px solid var(--c-line);
  border-radius: 4px;
  background: #fff;
  cursor: pointer;
  display: inline-block;
  position: relative;
  transition: all 120ms;
  flex-shrink: 0;
}
.cb.is-checked, .cb.is-partial {
  background: var(--c-primary);
  border-color: var(--c-primary);
}
.cb.is-checked::after {
  content: '';
  position: absolute;
  left: 4px; top: 1px;
  width: 5px; height: 9px;
  border: solid #fff;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
.cb.is-partial::after {
  content: '';
  position: absolute;
  left: 3px; top: 6px;
  width: 8px; height: 2px;
  background: #fff;
}
.cb:hover { border-color: var(--c-primary); }

/* ============== USER CELL ============== */
.user-cell { display: flex; align-items: center; gap:10px; }
.uc-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--c-primary), var(--c-teal));
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size:12px;
  font-weight: 600;
  flex-shrink: 0;
}
.uc-name { font-weight: 600; color: var(--c-ink); font-size:13px; line-height: 1.3; }
.uc-email { font-size:12px; color: var(--c-mute-2); margin-top:1px; line-height: 1.3; }

/* ============== PILLS ============== */
.pill {
  display: inline-flex;
  align-items: center;
  gap:4px;
  padding:4px 10px 3px;  /* Rule #38 — optical centering ไทย: pad-top มากกว่า bottom 1px กัน text ลอยสูง (verified) */
  border-radius: 999px;
  font-size:12px;
  font-weight: 600;
  white-space: nowrap;
}
.pill [data-lucide] { width: 11px; height: 11px; }
.pill-registered { background: #E6F0FF; color: #1A5FCC; }
.pill-active { background: #E6F0FF; color: #1A5FCC; }
.pill-converted { background: #E4F4EB; color: #157A41; }
.pill-suspended { background: #FFF1DD; color: #B8690B; }
.pill-archived { background: var(--c-line-3); color: var(--c-mute-2); }
/* v3.13 — Semantic pill aliases (ใช้ชุดนี้เป็นหลัก — mapping ดู knowledge/microcopy.md) */
.pill-info    { background: #E6F0FF; color: #1A5FCC; }   /* กำลังดำเนินการ/ใช้งาน */
.pill-success { background: #E4F4EB; color: #157A41; }   /* อนุมัติแล้ว/เสร็จสิ้น */
.pill-warning { background: #FFF1DD; color: #B8690B; }   /* รอดำเนินการ/รออนุมัติ */
.pill-danger  { background: #FFE9E7; color: #E62E24; }   /* ปฏิเสธ/ยกเลิก */
.pill-muted   { background: var(--c-line-3); color: var(--c-mute-2); } /* ร่าง/ปิดใช้งาน/เก็บถาวร */

/* v3.13 — Loading spinner (Iron Rule #44) */
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 0.8s linear infinite; }

/* v3.13 — Form Section Grouping (Iron Rule #45) */
.form-section { margin-top:var(--sp-xl); }
.form-section:first-child { margin-top:0; }
.form-section-title {
  font-size: var(--fs-cap); font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--c-mute);
  padding-bottom:var(--sp-sm); border-bottom: 1px solid var(--c-line-2);
  margin-bottom:var(--sp-md);
}

/* v3.13 — Segmented control (ช่วงเวลา dashboard ฯลฯ — Pattern J) */
.seg-control { display:inline-flex; background: var(--c-line-3); border-radius: var(--r-md); padding:2px; gap:2px; }
.seg-item {
  padding:6px 12px 3px; border-radius: var(--r-sm); border: none; background: transparent;
  font-size: var(--fs-meta); font-weight: 500; color: var(--c-mute-2); cursor: pointer;
  font-family: inherit; white-space: nowrap;
}
.seg-item.is-active { background: #fff; color: var(--c-ink); font-weight: 600; box-shadow: 0 1px 3px rgba(17,17,17,0.08); }
.pill-danger { background: #FFE9E7; color: var(--c-danger); }

.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  display: inline-block;
}
.dot.is-active { background: #1A5FCC; box-shadow: 0 0 0 2.5px rgba(37,99,235,0.18); }
.dot.is-converted { background: #157A41; box-shadow: 0 0 0 2.5px rgba(6,95,70,0.20); }
.dot.is-suspended { background: var(--c-warning); }
.dot.is-archived { background: var(--c-mute-3); }

/* Mini-link cell (e.g. tenant link) */
.tenant-link {
  display: inline-flex;
  align-items: center;
  gap:4px;
  color: var(--c-primary);
  font-size:12.5px;
  font-weight: 500;
  cursor: pointer;
}
.tenant-link:hover { text-decoration: underline; }
.tenant-link [data-lucide] { width: 12px; height: 12px; }

/* ============== ROW ACTIONS ============== */
.row-actions { display: inline-flex; gap:2px; }
.ra-btn {
  width: 28px; height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 0;
  color: var(--c-mute-2);
  border-radius: 6px;
  transition: all 120ms;
}
.ra-btn:hover { background: var(--c-line-3); color: var(--c-primary); }
.ra-btn.is-danger:hover { background: #FFE9E7; color: var(--c-danger); }
.ra-btn.is-success:hover { background: rgba(255,154,31,0.12); color: var(--c-teal); }
.ra-btn [data-lucide] { width: 15px; height: 15px; }

/* ============== TABLE FOOTER ============== */
.table-footer {
  padding:12px 18px;
  background: var(--c-bg-off);
  border-top: 1px solid var(--c-line-2);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size:12.5px;
  color: var(--c-mute);
  flex-wrap: wrap;
  gap:10px;
}
.pagination { display: inline-flex; gap:4px; align-items: center; }
.pg-btn {
  min-width: 30px; height: 30px;
  padding:0 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #fff;
  border: 1px solid var(--c-line-2);
  border-radius: 6px;
  color: var(--c-mute);
  font-size:12.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all 120ms;
}
.pg-btn:hover { border-color: var(--c-line); background: var(--c-bg-off); }
.pg-btn.is-active { background: var(--c-primary); border-color: var(--c-primary); color: #fff; }
.pg-btn.is-disabled { opacity: 0.4; cursor: not-allowed; }
.pg-btn [data-lucide] { width: 13px; height: 13px; }

/* ============== BULK BAR ============== */
.bulk-bar {
  background: var(--c-navy);
  color: #fff;
  padding:12px 18px;
  border-radius: 8px 8px 0 0;
  display: flex;
  align-items: center;
  gap:12px;
  border-bottom: 1px solid var(--c-line-2);
  margin:-1px -1px 0;
  font-size:13px;
}
.bulk-bar .btn { height: 30px; padding:2px 12px 0; font-size:12px; }
.bulk-bar .btn-secondary {
  background: rgba(255,255,255,0.10);
  border-color: rgba(255,255,255,0.18);
  color: #fff;
}
.bulk-bar .btn-secondary:hover { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.30); }

/* ============== DRAWER ============== */
/* ---- v6.1 Pattern B drawer chrome (locked to references/drawer-standard/pr.html) ----
   create/edit drawer ให้ใช้ชุดนี้: .dw-head (eyebrow + h2 20px + .top-icon-btn ปิด)
   + .d-stepper (.stepper-item/.stepper-circle 32px — ไม่ใช่ .stepper กลางของ page wizard)
   + .dw-footer (ย้อนกลับ secondary ซ้าย · ยกเลิก ghost + primary ชิดขวา) */
.top-icon-btn { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border:0; background:transparent; border-radius: var(--r-sm); color: var(--c-mute-2); cursor:pointer; transition: all 120ms; flex-shrink:0; }
.top-icon-btn:hover { background: var(--c-line-3); color: var(--c-ink); }
.dw-head { padding:18px 24px 16px; border-bottom: 1px solid var(--c-line-2); flex-shrink: 0; }
.dw-head-row { display: flex; align-items: flex-start; justify-content: space-between; gap:16px; }
.dw-eyebrow { display: flex; align-items: center; gap:6px; font-size:11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--c-mute-2); margin-bottom:4px; font-weight: 600; }
.dw-title { font-size:20px; font-weight: 700; color: var(--c-navy); margin:0; letter-spacing: -0.01em; }
.dw-sub { font-size: var(--fs-meta); color: var(--c-mute-2); margin-top:4px; }
.d-stepper { display: flex; align-items: flex-start; gap:0; width: 100%; margin-top:18px; }
.stepper-item { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; min-width: 0; }
.stepper-circle { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size:13px; font-weight: 600; background: #fff; color: var(--c-mute-3); border: 2px solid var(--c-line); transition: all 200ms; z-index: 2; }
.stepper-item.active .stepper-circle { background: var(--c-primary); color: #fff; border-color: var(--c-primary); box-shadow: 0 0 0 4px rgba(255,59,48,0.12); }
.stepper-item.done .stepper-circle { background: var(--c-primary); color: #fff; border-color: var(--c-primary); }
.stepper-label { margin-top:8px; font-size:12px; font-weight: 500; color: var(--c-mute-3); text-align: center; line-height: 1.3; transition: color 200ms; }
.stepper-item.active .stepper-label { color: var(--c-navy); font-weight: 600; }
.stepper-item.done .stepper-label { color: var(--c-mute); }
.stepper-item:not(:last-child)::after { content: ''; position: absolute; top: 15px; left: 50%; right: -50%; height: 2px; background: var(--c-line-2); z-index: 1; }
.stepper-item.done:not(:last-child)::after { background: var(--c-primary); }
.dw-footer { padding:16px 24px; border-top: 1px solid var(--c-line-2); background: var(--c-bg-off); flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap:8px; }
.dw-footer-right { display: flex; align-items: center; gap:8px; }

.drawer-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(17,17,17,0.40);
  z-index:var(--z-backdrop);
  opacity: 0;
  pointer-events: none;
  transition: opacity 220ms;
}
.drawer-backdrop.is-open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 920px;           /* v2 standard (Iron Rule #11) — wide drawer */
  max-width: 96vw;
  background: #fff;
  z-index:var(--z-drawer);
  transform: translateX(100%);
  transition: transform 280ms cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  box-shadow: -16px 0 40px rgba(17,17,17,0.18);
}
.drawer.is-open { transform: translateX(0); }
.drawer.standard { width: 680px; }   /* simple forms / short view (Iron Rule #11) */

/* ========== STEPPER STANDARD (Iron Rule #47) — ใช้ตัวเดียวทุก wizard ========== */
.stepper { display:flex; align-items:center; gap:var(--sp-sm); }
.step { display:flex; align-items:center; gap:var(--sp-sm); }
.step-dot {
  width:26px; height:26px; border-radius: var(--r-full);
  display:flex; align-items:center; justify-content:center;
  font-size: var(--fs-meta); font-weight:600; padding-top:1px; /* Thai rhythm */
  border:1.5px solid var(--c-line); background:#fff; color: var(--c-mute-2);
}
.step-label { font-size: var(--fs-sub); color: var(--c-mute-2); font-weight:500; white-space:nowrap; }
.step-connector { width:28px; height:1.5px; background: var(--c-line-2); flex:0 0 auto; }
.step.is-current .step-dot { border-color: var(--c-primary); background: var(--c-primary); color:#fff; }
.step.is-current .step-label { color: var(--c-ink); font-weight:600; }
.step.is-done .step-dot { border-color: var(--c-teal); background:#fff; color: var(--c-teal); }
.step.is-done .step-connector, .step.is-current ~ * {}
.step.is-done + .step-connector { background: var(--c-teal); }
/* placement: drawer wizard → .drawer-stepper-band (ใต้ header) / page wizard → .wizard-stepper-band */
.drawer-stepper-band { padding:10px 24px; border-bottom: 1px solid var(--c-line-2); background: var(--c-bg-off); }

.drawer-header {
  display: flex;
  align-items: center;
  gap:16px;
  padding:18px 24px;
  border-bottom: 1px solid var(--c-line-2);
}
.drawer-avatar {
  width: 44px; height: 44px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--c-primary), var(--c-teal));
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size:14px;
  font-weight: 600;
  flex-shrink: 0;
}
.drawer-title {
  font-family: 'Noto Sans Thai', sans-serif;
  font-size:20px;
  font-weight: 600;
  color: var(--c-navy);
  margin:0;
  letter-spacing: -0.01em;
}
.drawer-subtitle {
  font-size:12px;
  color: var(--c-mute);
  margin-top:4px;
  display: flex;
  align-items: center;
  gap:8px;
  flex-wrap: wrap;
}
.drawer-tabs {
  display: flex;align-items:center;
  padding:0 24px;
  border-bottom: 1px solid var(--c-line-2);
}
.drawer-tab {
  padding:10px 16px;
  font-size:13px;
  font-weight: 500;
  color: var(--c-mute);
  border-bottom: 2px solid transparent;
  transition: all 120ms;
  margin-bottom:-1px;
  cursor: pointer;
  user-select: none;
  background: transparent;
  border-left: 0;
  border-right: 0;
  border-top: 0;
}
.drawer-tab:hover { color: var(--c-ink); }
.drawer-tab.is-active { color: var(--c-primary); border-bottom-color: var(--c-primary); }
.drawer-body { flex: 1; overflow-y: auto; padding:24px; scrollbar-gutter: stable; }
.drawer-section { margin-bottom:24px; }
.drawer-section-title {
  font-size:11px;
  font-weight: 700;
  color: var(--c-mute);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin:0 0 10px;
}
.drawer-fields {
  display: grid;
  grid-template-columns: 130px 1fr;
  gap:10px 16px;
  font-size:13px;
}
.drawer-fields .lbl { color: var(--c-mute); }
.drawer-fields .val { color: var(--c-ink); font-weight: 500; }
.drawer-footer {
  padding:12px 24px;
  border-top: 1px solid var(--c-line-2);
  display: flex;
  gap:8px;
  align-items: center;
  background: var(--c-bg-off);
}
/* Drawer Button Contract (Iron Rule #31) helpers */
.footer-spacer { flex: 1; }
.drawer-footer-meta { font-size:12px; color: var(--c-mute-2); }
.drawer-header-actions { display: flex; gap:6px; align-items: center; }
.drawer-header-divider { width: 1px; height: 22px; background: var(--c-line-2); margin:0 4px; flex-shrink: 0; }

/* ============== TIMELINE ============== */
.timeline { position: relative; padding-left:24px; }
.timeline::before {
  content: '';
  position: absolute;
  left: 8px;
  top: 4px;
  bottom: 4px;
  width: 2px;
  background: var(--c-line-2);
}
.tl-item { position: relative; margin-bottom:16px; }
.tl-item:last-child { margin-bottom:0; }
.tl-dot {
  position: absolute;
  left: -20px;
  top: 3px;
  width: 12px; height: 12px;
  border-radius: 50%;
  background: #fff;
  border: 2px solid var(--c-primary);
}
.tl-dot.is-success { border-color: var(--c-success); }
.tl-dot.is-warning { border-color: var(--c-warning); }
.tl-title { font-size:13px; font-weight: 600; color: var(--c-ink); }
.tl-meta { font-size:12px; color: var(--c-mute-2); margin-top:2px; }

/* ============== BOOKMARK / RELATED CARDS ============== */
.bm-card {
  display: flex;
  gap:12px;
  padding:12px 12px;
  border: 1px solid var(--c-line-2);
  border-radius: 8px;
  margin-bottom:8px;
  cursor: pointer;
  transition: all 120ms;
  align-items: center;
}
.bm-card:hover { border-color: var(--c-line); }
.bm-icon {
  width: 28px; height: 28px;
  background: rgba(255,59,48,0.10);
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--c-primary);
  flex-shrink: 0;
}
.bm-card [data-lucide] { width: 15px; height: 15px; }

/* ============== NOTES ============== */
.notes-area {
  width: 100%;
  min-height: 130px;
  padding:12px 16px;
  background: #fff;
  border: 1px solid var(--c-line);
  border-radius: 8px;
  resize: vertical;
  font-family: inherit;
  font-size:13px;
  line-height: 1.55;
}
.notes-area:focus { outline: none; border-color: var(--c-primary); box-shadow: 0 0 0 3px rgba(255,59,48,0.10); }

/* ============== EMPTY STATE ============== */
.empty {
  padding:56px 24px;
  text-align: center;
  color: var(--c-mute);
}
.empty-icon {
  width: 52px; height: 52px;
  margin:0 auto 16px;
  border-radius: 50%;
  background: var(--c-line-3);
  color: var(--c-mute-2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.empty-icon [data-lucide] { width: 22px; height: 22px; }
.empty-title {
  font-size:16px;
  font-weight: 600;
  color: var(--c-ink);
  margin-bottom:6px;
  font-family: 'Noto Sans Thai', sans-serif;
}
.empty-desc { font-size:13px; color: var(--c-mute); max-width: 320px; margin:0 auto; }
.empty .btn { margin-top:16px; }  /* Rule #39 — empty state ควรมีปุ่ม action หลัก */

/* ============== MODAL ============== */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(17,17,17,0.50);
  z-index:var(--z-portal); /* modal ต้องเหนือ drawer(55) · =portal(60) เพื่อให้ combobox portal menu ใน modal โผล่เหนือ modal ได้ตาม DOM order — ห้ามตั้ง > portal ไม่งั้น dropdown ใน modal จะจม */
  opacity: 0;
  pointer-events: none;
  transition: opacity 200ms;
  display: flex;
  align-items: center;
  justify-content: center;
}
.modal-backdrop.is-open { opacity: 1; pointer-events: auto; }
.modal {
  background: #fff;
  border-radius: 12px;
  width: 440px;
  max-width: 92vw;
  max-height: 90vh;
  display: flex;
  flex-direction: column;
  transform: scale(0.96);
  transition: transform 200ms cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: 0 24px 64px rgba(17,17,17,0.28);
  overflow: hidden;
}
.modal-backdrop.is-open .modal { transform: scale(1); }
.modal-header {
  padding:18px 24px 12px;
  display: flex;
  align-items: flex-start;
  gap:12px;
}
.modal-header-icon {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: rgba(255,59,48,0.10);
  color: var(--c-primary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.modal-header-icon.is-danger { background: #FFE9E7; color: var(--c-danger); }
.modal-header-icon.is-warning { background: #FFF1DD; color: var(--c-warning); }
.modal-header-icon [data-lucide] { width: 18px; height: 18px; }
.modal-title {
  font-family: 'Noto Sans Thai', sans-serif;
  font-size:16px;
  font-weight: 600;
  color: var(--c-navy);
  margin:0 0 4px;
}
.modal-subtitle { font-size:13px; color: var(--c-mute); margin:0; line-height: 1.5; }
.modal-body {
  padding:6px 24px 18px;
  font-size:13px;
  color: var(--c-ink);
  overflow-y: auto;
  scrollbar-gutter: stable;
}
.modal-footer {
  padding:12px 24px;
  background: var(--c-bg-off);
  border-top: 1px solid var(--c-line-2);
  display: flex;align-items:center;
  justify-content: flex-end;
  gap:8px;
}

/* ============== FIELDS ============== */
.field { margin-bottom:16px; }
.field-label { display: block; font-size:12.5px; font-weight: 500; color: var(--c-mute); margin-bottom:6px; }
.field-label .req { color: var(--c-danger); margin-left:2px; }
.field-input { width: 100%; }
.field-help { font-size:12px; color: var(--c-mute-2); margin-top:4px; }
/* Rule #43 — จองพื้นที่ error ไว้ (visibility แทน display) → error โผล่แล้วฟอร์มไม่กระตุก.
   ถ้า field ไหนไม่ใส่ <div class="field-error"> ก็ไม่จองพื้นที่ (author เลือกเองรายตัว) */
.field-error { font-size:12px; color: var(--c-danger); margin-top:4px; min-height: 15px; visibility: hidden; }
.field.is-invalid .input,
.field.is-invalid .select { border-color: var(--c-danger); }
.field.is-invalid .field-error { visibility: visible; }

/* Responsive form grid (Iron Rule #17) */
.field-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap:12px;
}

/* ============== TOAST ============== */
.toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: var(--c-navy);
  color: #fff;
  padding:12px 18px;
  border-radius: 10px;
  font-size:13px;
  font-weight: 500;
  z-index:var(--z-toast);
  display: flex;
  align-items: center;
  gap:10px;
  box-shadow: 0 12px 32px rgba(17,17,17,0.30);
  transform: translateY(100px);
  opacity: 0;
  transition: all 250ms cubic-bezier(0.4, 0, 0.2, 1);
  max-width: 380px;
}
.toast.is-visible { transform: translateY(0); opacity: 1; }
.toast.is-success { background: var(--c-success); }
.toast.is-info { background: var(--c-primary); }
.toast.is-warning { background: var(--c-warning); }
.toast.is-error { background: var(--c-danger); }
.toast [data-lucide] { width: 17px; height: 17px; }

/* ============== LINE EXPAND ANIMATION (Pattern E) ============== */
.line-expanded {
  animation: lineExpand 220ms cubic-bezier(0.4, 0, 0.2, 1);
  overflow: hidden;
}
@keyframes lineExpand {
  from { max-height: 0; opacity: 0; transform: translateY(-8px); }
  to { max-height: 600px; opacity: 1; transform: translateY(0); }
}

/* ============== WIZARD LAYOUT (Iron Rule #22) ============== */
.page-content-host.has-wizard { display: flex; flex-direction: column; height: 100%; }
.wizard-shell { display: flex; flex-direction: column; flex: 1 1 auto; min-height: 100%; }
.wizard-stepper-band {
  flex: 0 0 auto; background: white;
  padding:18px 32px;
  border-bottom: 1px solid var(--c-line-2);
}
.wizard-body { flex: 1 1 auto; padding:24px 32px 28px; min-height: 0; background: var(--c-bg-off); }
.wizard-card {
  padding:28px 32px;
  width: 100%;
  max-width: 960px;
  margin:0 auto;
  background: #fff;
  border: 1px solid var(--c-line-2);
  border-radius: 10px;
}
.wizard-footer {
  flex: 0 0 auto;
  position: sticky;
  bottom: 0;
  background: white;
  padding:12px 32px;
  display: flex;align-items:center;
  justify-content: space-between;
  border-top: 1px solid var(--c-line-2);
  box-shadow: 0 -2px 8px rgba(17,17,17,0.04);
  z-index:var(--z-sticky);
}
.stepper-row {
  display: flex;
  align-items: center;
  flex-wrap: nowrap;
  width: 100%;
  max-width: 640px;
  margin:0 auto;
  gap:0;
}
.stepper-row .step-line {
  flex: 1 1 auto;
  min-width: 28px;
  max-width: 80px;
  height: 2px;
  background: var(--c-line-2);
}
.stepper-row .step-line.is-done { background: var(--c-primary); }
.step-dot {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: var(--c-line-2);
  color: var(--c-mute-2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size:12.5px;
  font-weight: 600;
  flex-shrink: 0;
}
.step-dot.is-active { background: var(--c-primary); color: #fff; }
.step-dot.is-done { background: var(--c-primary); color: #fff; }

/* ============== UTILITIES ============== */
.hidden { display: none !important; }  /* v6.1 — search-select/overlay พึ่ง class นี้ (เดิมหายไป ทำให้ ss-list เปิดค้าง + ปุ่ม X โผล่) */
.text-mute { color: var(--c-mute); }
.text-mute-2 { color: var(--c-mute-2); }
.text-primary { color: var(--c-primary); }
.text-success { color: var(--c-success); }
.text-danger { color: var(--c-danger); }
.flex { display: flex; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.gap-2 { gap:8px; }
.gap-3 { gap:12px; }
.gap-4 { gap:16px; }
.mb-2 { margin-bottom:8px; }
.mb-3 { margin-bottom:12px; }
.mb-4 { margin-bottom:16px; }
.mt-2 { margin-top:8px; }
.mt-3 { margin-top:12px; }
.mt-4 { margin-top:16px; }

/* Icon utility classes (CSS-defined so no Tailwind dependency for these) */
.w-2\.5 { width: 10px; }   .h-2\.5 { height: 10px; }
.w-3   { width: 12px; }    .h-3   { height: 12px; }
.w-3\.5 { width: 14px; }   .h-3\.5 { height: 14px; }
.w-4   { width: 16px; }    .h-4   { height: 16px; }
.w-5   { width: 20px; }    .h-5   { height: 20px; }

/* ============================================================
   Lucide SVG sizing fix
   ------------------------------------------------------------
   Lucide replaces <i data-lucide="..."> with <svg class="lucide ...">
   ที่มี width="24" height="24" attributes ติดมาด้วย — attributes
   เหล่านี้ override CSS class .w-N ทำให้ icons เด้งเป็น 24×24
   ดัน pill/button สูงเกินขนาด design.

   วิธีแก้: บังคับ svg.lucide ทุกตัวให้ width/height = 1em แล้ว
   ปรับขนาดผ่าน font-size บน parent. Plus override สำหรับเคสที่
   ใช้ .w-N/.h-N โดยตรงบน <i> (Lucide จะ copy class ไปยัง svg)
   ============================================================ */
svg.lucide {
  width: 1em;
  height: 1em;
  display: inline-block;
  vertical-align: -0.125em;
  flex-shrink: 0;
}
/* เมื่อ .w-N / .h-N ถูก copy ไปบน svg.lucide ให้บังคับ override
   width/height attributes ที่ Lucide ใส่มา (specificity ชนะ attribute) */
svg.lucide.w-2\.5 { width: 10px; }   svg.lucide.h-2\.5 { height: 10px; }
svg.lucide.w-3    { width: 12px; }   svg.lucide.h-3    { height: 12px; }
svg.lucide.w-3\.5 { width: 14px; }   svg.lucide.h-3\.5 { height: 14px; }
svg.lucide.w-4    { width: 16px; }   svg.lucide.h-4    { height: 16px; }
svg.lucide.w-5    { width: 20px; }   svg.lucide.h-5    { height: 20px; }

/* ===== Tooltip (#33/#67 — hint เข้า ⓘ hover) ===== */
.info-tip{display:inline-flex;align-items:center;margin-left:6px;color:var(--c-mute-2);cursor:help;position:relative}
.info-tip svg,.info-tip i{width:14px;height:14px}
.info-tip::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);
  background:var(--c-navy);color:#fff;font-size:12px;line-height:1.5;padding:8px 12px;border-radius:8px;
  max-width:340px;width:max-content;white-space:normal;opacity:0;pointer-events:none;transition:opacity .12s;z-index:var(--z-dropdown)}
.info-tip:hover::after{opacity:1}
/* ===== Drop-up (#66) ===== */
.drop-up{bottom:100%!important;top:auto!important;margin-bottom:4px}

/* ===== END BASE-KIT — เขียน page-specific CSS ใต้บรรทัดนี้เท่านั้น ===== */

/* ===== F-HR-TRAIN · page CSS (vibe) ===== */
/* Feature tabs under page header (Iron Rule #104 — 1 feature = 1 menu, ส่วนย่อยเป็น tabs) */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--c-line-2);margin-bottom:18px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:7px;padding:9px 15px 8px;font-size:13.5px;font-weight:500;color:var(--c-mute);
  border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;background:transparent;border-top:0;border-left:0;border-right:0;transition:all 120ms;white-space:nowrap}
.tab:hover{color:var(--c-ink)}
.tab.is-active{color:var(--c-primary);border-bottom-color:var(--c-primary);font-weight:600}
.tab [data-lucide]{width:15px;height:15px}
.tab .tab-ct{font-size:11px;font-weight:600;color:var(--c-mute-2);background:var(--c-line-3);border-radius:999px;padding:1px 7px}
.tab.is-active .tab-ct{background:rgba(255,59,48,.12);color:var(--c-primary)}

/* Note / banner (คำเตือนของ action จริง — ไม่ใช่ hint, ดู #33 exception) */
.note{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:9px;font-size:12.5px;line-height:1.6;border:1px solid var(--c-line-2);background:#fff;color:var(--c-mute)}
.note [data-lucide]{width:16px;height:16px;flex-shrink:0;margin-top:1px}
.note.is-warn{background:#FFF1DD;border-color:#FFB763;color:#B8690B}
.note.is-warn [data-lucide]{color:var(--c-warning)}
.note.is-danger{background:#FFE9E7;border-color:#FFE9E7;color:#E62E24}
.note.is-danger [data-lucide]{color:var(--c-danger)}
.note.is-info{background:#E6F0FF;border-color:#E6F0FF;color:#1A5FCC}
.note.is-info [data-lucide]{color:#1A5FCC}
.note b{color:inherit;font-weight:700}
.note-act{margin-left:auto;flex-shrink:0}

/* KV grid (lean summary — #103) */
.kv{display:grid;grid-template-columns:150px 1fr;gap:9px 16px;font-size:13px}
.kv .k{color:var(--c-mute-2);font-size:12px}
.kv .v{color:var(--c-ink);font-weight:500}
.kv .v.mono{font-family:'Satoshi',monospace;font-variant-numeric:tabular-nums}

/* Soft chips */
.chip-soft{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:600;
  background:var(--c-line-3);color:var(--c-mute);white-space:nowrap}
.chip-soft [data-lucide]{width:11px;height:11px}
.chip-soft.is-cost{background:#FFF1DD;color:#B8690B}
.chip-soft.is-free{background:#E4F4EB;color:#157A41}
.chip-soft.is-cert{background:#E6F0FF;color:#1A5FCC}
.chip-soft.is-gap{background:rgba(255,154,31,.14);color:#B8690B}
.chip-soft.is-fail{background:#FFE9E7;color:#E62E24}

/* Masked (RESTRICTED — FN-94) */
.masked{display:inline-flex;align-items:center;gap:5px;color:var(--c-mute-2);font-variant-numeric:tabular-nums}
.masked [data-lucide]{width:12px;height:12px;color:var(--c-mute-3)}

/* Capacity bar (session จำนวนรับ) */
.cap-bar{height:8px;background:var(--c-line-3);border-radius:99px;overflow:hidden;min-width:80px}
.cap-fill{height:100%;background:linear-gradient(90deg,var(--c-primary),var(--c-teal));border-radius:99px;transition:width .4s}
.cap-fill.is-full{background:var(--c-warning)}

/* EC / Rate Card reference card (display-only — ห้าม hardcode ตัวเลข Rate Card) */
.ec-ref{border:1px dashed var(--c-line);background:var(--c-bg-off);border-radius:10px;padding:13px 15px}
.ec-ref .ec-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--c-mute);text-transform:uppercase;letter-spacing:.05em}
.ec-ref .ec-h [data-lucide]{width:14px;height:14px;color:var(--c-teal)}
.ec-ref .ec-row{display:flex;align-items:baseline;gap:8px;margin-top:9px;flex-wrap:wrap}
.ec-ref .ec-val{font-size:20px;font-weight:700;color:var(--c-navy);font-variant-numeric:tabular-nums}
.ec-ref .ec-src{font-size:11.5px;color:var(--c-mute-2)}

/* Certificate soft-ref card */
.cert-card{border:1px solid var(--c-line-2);background:#E6F0FF;border-radius:10px;padding:13px 15px;display:flex;gap:12px;align-items:flex-start}
.cert-card .ci{width:34px;height:34px;border-radius:8px;background:#E6F0FF;color:#1A5FCC;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.cert-card .ci [data-lucide]{width:18px;height:18px}
.cert-card .ct-name{font-size:13px;font-weight:700;color:#1A5FCC}
.cert-card .ct-meta{font-size:11.5px;color:var(--c-mute-2);margin-top:2px}

/* Slot picker (DOA) */
.slot{border:1px solid var(--c-line-2);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff}
.slot-h{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.slot-h .sn{width:22px;height:22px;border-radius:50%;background:var(--c-navy);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.slot-h .st{font-size:12.5px;font-weight:600;color:var(--c-ink)}
.slot-h .sr{margin-left:auto;font-size:11px;color:var(--c-mute-2);font-family:monospace}

/* Employee chip (approval timeline) */
.emp-chip{display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 5px;border:1px solid var(--c-line-2);border-radius:999px;background:#fff;font-size:12px}
.emp-chip .uc-avatar{width:22px;height:22px;font-size:10px}
.emp-chip .ec-pos{color:var(--c-mute-2);font-size:11px}

/* Learner row (session ผู้เรียน tab) */
.lrn{display:flex;align-items:center;gap:11px;padding:11px 12px;border:1px solid var(--c-line-2);border-radius:10px;margin-bottom:9px}
.lrn .lrn-main{flex:1;min-width:0}
.lrn .lrn-name{font-size:13px;font-weight:600;color:var(--c-ink)}
.lrn .lrn-sub{font-size:11.5px;color:var(--c-mute-2);margin-top:1px}
.lrn .lrn-act{display:flex;gap:6px;flex-shrink:0}

/* Report funnel / bars */
.funnel{display:flex;flex-direction:column;gap:9px}
.funnel-row{display:grid;grid-template-columns:200px 1fr 110px;gap:12px;align-items:center}
.funnel-row .fl{font-size:12.5px;font-weight:600;color:var(--c-ink)}
.funnel-track{height:30px;background:var(--c-line-3);border-radius:7px;overflow:hidden;position:relative}
.funnel-fill{height:100%;background:linear-gradient(90deg,var(--c-primary),var(--c-teal));border-radius:7px;min-width:2px;transition:width .4s}
.funnel-row .fn{text-align:right;font-size:12.5px;font-weight:700;color:var(--c-navy);font-variant-numeric:tabular-nums}

/* Pass/fail picker */
.rf-pick{display:inline-flex;gap:8px}
.rf-pick button{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px 0 12px;border:1px solid var(--c-line);background:#fff;border-radius:8px;font-size:13px;font-weight:600;color:var(--c-mute-2);cursor:pointer;transition:all 120ms}
.rf-pick button [data-lucide]{width:15px;height:15px}
.rf-pick button.on-pass{background:var(--c-success);border-color:var(--c-success);color:#fff}
.rf-pick button.on-fail{background:var(--c-danger);border-color:var(--c-danger);color:#fff}

/* File pill (soft attach) */
.file-pill{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--c-line-2);border-radius:8px;background:#fff;font-size:12.5px;color:var(--c-ink)}

.oos-item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px dashed var(--c-line);border-radius:8px;background:var(--c-bg-off);font-size:12.5px}
.oos-item .x{font-weight:700;color:var(--c-danger);flex:none;font-family:'Satoshi'}
.oos-item .why{color:var(--c-mute-2);font-size:11.5px;margin-left:auto;white-space:nowrap}

/* Demo strip (Iron Rule #105 — persona/masking switch = prototype, ห้ามใน page header) */
.demo-strip{position:fixed;left:16px;bottom:16px;z-index:var(--z-dropdown);background:var(--c-navy);color:#fff;border-radius:12px;
  padding:9px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(17,17,17,.28);font-size:11.5px}
.demo-strip .ds-tag{font-weight:700;letter-spacing:.03em;color:#fff;display:flex;align-items:center;gap:6px}
.demo-strip .ds-tag [data-lucide]{width:13px;height:13px;color:var(--c-teal)}
.demo-strip .ds-sep{width:1px;height:20px;background:rgba(255,255,255,.18)}
.demo-strip .ds-lbl{color:#B4B6BB}
.demo-strip .ds-seg{display:inline-flex;background:rgba(255,255,255,.08);border-radius:8px;padding:2px;gap:2px}
.demo-strip .ds-seg button{border:0;background:transparent;color:#C7C9CE;font:600 11.5px inherit;padding:4px 9px 3px;border-radius:6px;cursor:pointer}

.rc-list-intro{font-size:12.5px;color:var(--c-mute)}

<!-- ============================================================
     Lucide Icons Loader (multi-CDN fallback, pinned version)
     ------------------------------------------------------------
     ทำไมไม่ใช้ <script src="..."> ตรง ๆ:
       - Single CDN = single point of failure (corp proxy/firewall block)
       - @latest = breaking changes โดยไม่บอก (GitHub issue #2962)
       - <script> ใน <head> โดยไม่มี defer ชน DOMContentLoaded
     กลยุทธ์:
       1) Pin version 0.469.0 (stable, ทดสอบแล้ว)
       2) ลอง CDN 3 ตัวเรียงตามความน่าเชื่อถือ: unpkg → jsdelivr → cdnjs
       3) ถ้าทุก CDN fail → log warning + ไม่ block render
            (UI ยังใช้งานได้ แค่ไม่มี icons)
     ============================================================ -->
<script>
(function loadLucide() {
  var version = '0.469.0';
  var cdns = [
    'https://unpkg.com/lucide@' + version + '/dist/umd/lucide.min.js',
    'https://cdn.jsdelivr.net/npm/lucide@' + version + '/dist/umd/lucide.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/lucide/' + version + '/lucide.min.js'
  ];
  var i = 0;
  function tryNext() {
    if (i >= cdns.length) {
      console.warn('[Lucide] All CDNs failed. Icons จะไม่แสดง but UI ยังใช้งานได้');
      window.lucide = window.lucide || { createIcons: function() {} }; // no-op fallback
      window.dispatchEvent(new Event('lucide:ready'));
      return;
    }
    var s = document.createElement('script');
    s.src = cdns[i++];
    s.onload = function() {
      window.dispatchEvent(new Event('lucide:ready'));
    };
    s.onerror = tryNext;
    document.head.appendChild(s);
  }
  tryNext();
})();
</script>

<script>
// ============================================
// STATE
// ============================================
const state = {
  currentRoute: 'home',
  drawer: { open: false, mode: null, recordId: null, step: 1 },
  modal: { open: false, type: null, data: null },
  toast: { visible: false, message: '', variant: 'info' },
  filters: { search: '', status: 'all' },
  pagination: { page: 1, pageSize: 20 },
  sort: { col: null, dir: 'asc' },
  selectedIds: new Set(),
  records: [],
};

// ============================================
// SIDEBAR — Module collapse/expand (Iron Rule #27)
// Module header is non-navigable; click toggles children visibility.
// State persists in DOM (data-expanded) — future: persist per user.
// ============================================
function toggleModule(headerEl) {
  const mod = headerEl.closest('.sb-module');
  if (!mod) return;
  const isExpanded = mod.getAttribute('data-expanded') !== 'false';
  mod.setAttribute('data-expanded', isExpanded ? 'false' : 'true');
}

// ============================================
// ROUTER (Hash-based, refresh-safe)
// ============================================
function getRoute() {
  const hash = location.hash;
  if (!hash || hash === '#' || hash === '#/') return 'home';
  return hash.replace(/^#\//, '');
}
function navigate(route) {
  location.hash = '#/' + route;
}

// ============================================
// DRAWER / MODAL TOGGLES
// ============================================
function openDrawer(mode, recordId) {
  state.drawer = { open: true, mode, recordId, step: 1 };
  render();
  // Trigger CSS animation
  requestAnimationFrame(() => {
    document.getElementById('drawerBackdrop').classList.add('is-open');
    const dw = document.getElementById('drawer');
    dw.classList.add('is-open');
    dw.setAttribute('aria-hidden', 'false');
    lockScroll(true);
    trapFocus(dw);
  });
}
function closeDrawer() {
  document.getElementById('drawerBackdrop').classList.remove('is-open');
  const dw = document.getElementById('drawer');
  dw.classList.remove('is-open');
  dw.setAttribute('aria-hidden', 'true');
  releaseFocus(dw);
  lockScroll(false);
  setTimeout(() => {
    state.drawer = { open: false, mode: null, recordId: null, step: 1 };
  }, 280);
}
function openModal(type, data) {
  state.modal = { open: true, type, data };
  render();
  requestAnimationFrame(() => {
    const mb = document.getElementById('modalBackdrop');
    mb.classList.add('is-open');
    lockScroll(true);
    trapFocus(mb.querySelector('.modal') || mb);
  });
}
function closeModal() {
  const mb = document.getElementById('modalBackdrop');
  mb.classList.remove('is-open');
  releaseFocus(mb.querySelector('.modal') || mb);
  /* ลิ้นชักอาจยังเปิดอยู่ข้างหลัง — ปลดล็อกเฉพาะตอนไม่มี overlay เหลือแล้ว */
  lockScroll(!!(window.state && state.drawer && state.drawer.open));
  setTimeout(() => {
    state.modal = { open: false, type: null, data: null };
  }, 200);
}

// ============================================
// TOAST
// ============================================
function showToast(message, variant = 'info', durationMs = 2800) {
  const el = document.getElementById('toast');
  const iconMap = { success: 'check-circle-2', info: 'info', warning: 'alert-triangle', error: 'x-circle' };
  el.className = 'toast is-' + variant;
  el.innerHTML = `<i data-lucide="${iconMap[variant] || 'info'}" class="w-4 h-4"></i><span>${message}</span>`;
  renderIcons();
  requestAnimationFrame(() => el.classList.add('is-visible'));
  setTimeout(() => el.classList.remove('is-visible'), durationMs);
}

// ============================================
// ESC key handler (close drawer/modal)
// ============================================
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state.modal.open) closeModal();
    else if (state.drawer.open) closeDrawer();
  }
});

// ============================================
// RENDER (placeholder — replace per feature)
// ============================================
function render() {
  // Specific feature should override this function.
  //
  // ⚠️ Iron Rule #29 — Render Preservation:
  // If your render() does innerHTML rebuild (typical pattern), wrap with
  // withRenderPreservation() OR use preserveRenderState()/restoreRenderState()
  // to keep scroll position + focus across re-renders.
  //
  // Example:
  //   function render() {
  //     const snap = preserveRenderState();
  //     document.getElementById('page-content').innerHTML = renderPage();
  //     drawer.innerHTML = state.drawer.open ? renderDrawer() : '';
  //     renderIcons();
  //     restoreRenderState(snap);
  //   }
  //
  // After every DOM update, call renderIcons() — safe wrapper ที่ทน race เมื่อ Lucide ยังไม่ load.
  renderIcons();
}

// ============================================
// INIT
// ============================================
// Helper: safe icon render — กัน race ก่อน lucide load เสร็จ
function renderIcons() {
  if (window.lucide && typeof window.lucide.createIcons === 'function') {
    window.lucide.createIcons();
  }
}

// ============================================
// SEARCH-SELECT (Iron Rule #34) — generic searchable dropdown
// ------------------------------------------------
// ใช้แทน select ธรรมดา เมื่อ options เยอะ (>8) หรือเป็น lookup จาก master อื่น.
// list = position:absolute overlay → ไม่ดันเนื้อหา. แก้เฉพาะ list ตอนพิมพ์ →
// ไม่ rebuild ทั้งหน้า (ไม่ชน Rule #29). decoupled — เรียก onSelect callback ไม่ผูก render().
//
// วิธีใช้ 2 ขั้น:
//   1) ใส่ markup:  ${searchSelectHTML('country', { placeholder: 'เลือกประเทศ' })}
//   2) หลัง markup อยู่ใน DOM แล้ว (เช่นท้าย render()):
//        initSearchSelect('country', {
//          options: countries.map(c => ({ value:c.code, label:c.name, sub:c.code, icon:'flag', right:'' })),
//          value: state.form.country,
//          onSelect: (val, opt) => { state.form.country = val; }
//        });
// option fields: { value, label, sub?, icon?, right? }
// ============================================
window.__ss = window.__ss || {};
function ssId(p, k){ return p + k; }
function ssGet(key){ return window.__ss[key]; }
function ssEscapeReg(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function searchSelectHTML(key, opt){
  opt = opt || {};
  var ph = opt.placeholder || 'ค้นหา...';
  return ''
    + '<div class="search-select" id="ss-' + key + '">'
    +   '<i data-lucide="search" class="ss-lead w-4 h-4"></i>'
    +   '<input type="text" class="input ss-input" id="ss-input-' + key + '" autocomplete="off" placeholder="' + ph + '"'
    +     ' oninput="ssOnInput(\'' + key + '\', this.value)" onfocus="ssOpen(\'' + key + '\')" onkeydown="ssOnKey(\'' + key + '\', event)">'
    +   '<button type="button" class="ss-clear hidden" id="ss-clear-' + key + '" tabindex="-1" onclick="ssClear(\'' + key + '\')"><i data-lucide="x" class="w-4 h-4"></i></button>'
    +   '<i data-lucide="chevron-down" class="ss-caret" id="ss-caret-' + key + '"></i>'
    +   '<div class="ss-list hidden" id="ss-list-' + key + '"></div>'
    + '</div>';
}
function initSearchSelect(key, cfg){
  cfg = cfg || {};
  window.__ss[key] = {
    options: cfg.options || [], value: (cfg.value != null ? cfg.value : null),
    onSelect: cfg.onSelect || function(){}, emptyText: cfg.emptyText || 'ไม่พบรายการ',
    query: '', open: false, hi: 0, portal: !!cfg.portal
  };
  ssSetText(key); ssSyncChrome(key); renderIcons();
}
function ssFiltered(key){
  var s = ssGet(key); if(!s) return [];
  var q = (s.query || '').toLowerCase().trim();
  if(!q) return s.options;
  return s.options.filter(function(o){
    return String(o.label).toLowerCase().includes(q)
      || String(o.value).toLowerCase().includes(q)
      || String(o.sub || '').toLowerCase().includes(q);
  });
}
function ssSyncChrome(key){
  var s = ssGet(key); if(!s) return;
  var sel = s.options.find(function(o){ return o.value === s.value; });
  var c = document.getElementById(ssId('ss-clear-', key)); if(c) c.classList.toggle('hidden', !sel);
  var k = document.getElementById(ssId('ss-caret-', key)); if(k) k.classList.toggle('hidden', !!sel);
}
function ssSetText(key){
  var s = ssGet(key); if(!s) return;
  var input = document.getElementById(ssId('ss-input-', key)); if(!input) return;
  var sel = s.options.find(function(o){ return o.value === s.value; });
  input.value = s.open ? s.query : (sel ? sel.label : '');
}
function ssRenderList(key){
  var s = ssGet(key); if(!s) return;
  var list = document.getElementById(ssId('ss-list-', key)); if(!list) return;
  var items = ssFiltered(key);
  if(items.length === 0){
    list.innerHTML = '<div class="ss-empty">' + s.emptyText + '</div>';
  } else {
    var q = (s.query || '').toLowerCase().trim();
    var hl = function(t){ return q ? String(t).replace(new RegExp('(' + ssEscapeReg(q) + ')', 'gi'), '<mark>$1</mark>') : String(t); };
    list.innerHTML = items.map(function(o, i){
      return '<button type="button" class="ss-opt ' + (i === s.hi ? 'is-active' : '') + '" onmousedown="event.preventDefault()" onclick="ssPick(\'' + key + '\', ' + i + ')">'
        + (o.avatar ? '<span class="uc-avatar ss-opt-av">' + o.avatar + '</span>' : (o.icon ? '<i data-lucide="' + o.icon + '" class="ss-opt-ic w-4 h-4"></i>' : ''))
        + '<span class="ss-opt-main"><span class="ss-opt-label">' + hl(o.label) + '</span>'
        + (o.sub ? '<span class="ss-opt-sub">' + hl(o.sub) + '</span>' : '') + '</span>'
        + (o.right ? '<span class="ss-opt-right">' + o.right + '</span>' : '')
        + '</button>';
    }).join('');
  }
  list.classList.toggle('hidden', !s.open);
  if(s.portal)ssPortal(key, list, s.open);   /* FIX-07: ยก list เป็น portal ไม่ให้โดนขอบ modal clip (#95) */
  renderIcons();
}
/* FIX-07 · Overlay Portal (#95) — ย้าย ss-list ไป #overlay-root ตอนเปิด · คืนที่เดิมตอนปิด
   ต้องยก z-index ให้เท่า --z-portal (60) ไม่งั้น .ss-list (z=50) จม modal-backdrop (z=60) */
function ssPortal(key, list, open){
  var wrap = document.getElementById(ssId('ss-', key));
  if(open){
    list.classList.add('open');
    portalMenu(wrap || list, list);
    list.style.zIndex = 'var(--z-portal)';
  } else {
    list.classList.remove('menu-fixed','open');
    list.style.cssText = '';
    if(wrap && list.parentElement !== wrap) wrap.appendChild(list);
  }
}
function ssOpen(key){ var s = ssGet(key); if(!s) return; s.open = true; s.query = ''; s.hi = 0; ssSetText(key); ssSyncChrome(key); ssRenderList(key); }
function ssOnInput(key, val){ var s = ssGet(key); if(!s) return; s.query = val; s.open = true; s.hi = 0; s.value = null; ssSyncChrome(key); ssRenderList(key); }
function ssPick(key, i){ var s = ssGet(key); if(!s) return; var o = ssFiltered(key)[i]; if(!o) return; s.value = o.value; s.query = ''; s.open = false; ssSetText(key); ssSyncChrome(key); ssRenderList(key); s.onSelect(o.value, o); }
function ssClear(key){ var s = ssGet(key); if(!s) return; s.value = null; s.query = ''; s.open = true; ssSetText(key); ssSyncChrome(key); ssRenderList(key); var inp = document.getElementById(ssId('ss-input-', key)); if(inp) inp.focus(); s.onSelect(null, null); }
function ssOnKey(key, e){
  var s = ssGet(key); if(!s) return; var items = ssFiltered(key);
  if(e.key === 'ArrowDown'){ e.preventDefault(); s.open = true; s.hi = Math.min(items.length - 1, s.hi + 1); ssRenderList(key); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); s.hi = Math.max(0, s.hi - 1); ssRenderList(key); }
  else if(e.key === 'Enter'){ e.preventDefault(); if(items[s.hi]) ssPick(key, s.hi); }

// markup: <div class="field"><input class="input" onblur="validateField(this, v => v.trim()? '' : 'จำเป็นต้องกรอก')">
//          <div class="field-error"></div></div>

// ============================================
function validateField(el, validator){
  var field = el.closest('.field'); if(!field) return true;
  var msg = '';
  try { msg = validator ? validator(el.value, el) : ''; } catch(e){ msg=''; }
  var errEl = field.querySelector('.field-error');
  if(msg){ field.classList.add('is-invalid'); if(errEl) errEl.textContent = msg; return false; }
  field.classList.remove('is-invalid'); return true;
}

// ============================================
// RENDER PRESERVATION (Iron Rule #29)
// ------------------------------------------------
// ทุกครั้งที่ render() ทำ innerHTML = ... full DOM rebuild
// scroll position + focus + cursor selection จะหาย —
// user รู้สึก "เด้งกลับบน" ทุกครั้งที่ toggle/click.
//
// withRenderPreservation(renderFn) wraps a render function
// to save state before innerHTML rebuild, then restore after.
//
// Preserves:
//   - scrollTop ของ .drawer-body
//   - scrollTop ของ .modal-body
//   - window.scrollY (page-level scroll)
//   - document.activeElement focus + selection range (input/textarea ที่กำลังพิมพ์)
//
// Usage:
//   const render = withRenderPreservation(function actualRender() {
//     content.innerHTML = ...
//   });
//
// หรือเรียกตรง ๆ ใน render() ที่มีอยู่แล้ว:
//   function render() {
//     const snapshot = preserveRenderState();
//     // ... innerHTML rebuilds ...
//     restoreRenderState(snapshot);
//   }
// ============================================
function preserveRenderState() {
  const drawerBody = document.querySelector('.drawer-body');
  const modalBody = document.querySelector('.modal-body');
  const activeEl = document.activeElement;
  const isInput = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA');
  return {
    drawerScroll: drawerBody ? drawerBody.scrollTop : 0,
    modalScroll: modalBody ? modalBody.scrollTop : 0,
    pageScroll: window.scrollY,
    focusKey: isInput ? {
      placeholder: activeEl.placeholder || '',
      type: activeEl.type || '',
      name: activeEl.name || '',
      selStart: activeEl.selectionStart,
      selEnd: activeEl.selectionEnd,
    } : null,
  };
}
function restoreRenderState(snap) {
  if (!snap) return;
  requestAnimationFrame(function() {
    const dBody = document.querySelector('.drawer-body');
    if (dBody && snap.drawerScroll > 0) dBody.scrollTop = snap.drawerScroll;
    const mBody = document.querySelector('.modal-body');
    if (mBody && snap.modalScroll > 0) mBody.scrollTop = snap.modalScroll;
    if (snap.pageScroll > 0) window.scrollTo(0, snap.pageScroll);

    if (snap.focusKey) {
      const candidates = document.querySelectorAll('input, textarea');
      for (let i = 0; i < candidates.length; i++) {
        const c = candidates[i];
        if ((c.placeholder || '') === snap.focusKey.placeholder
            && (c.type || '') === snap.focusKey.type
            && (c.name || '') === snap.focusKey.name) {
          c.focus();
          if (snap.focusKey.selStart != null && typeof c.setSelectionRange === 'function') {
            try { c.setSelectionRange(snap.focusKey.selStart, snap.focusKey.selEnd); } catch(e) {}
          }
          break;
        }
      }
    }
  });
}
function withRenderPreservation(renderFn) {
  return function preservedRender() {
    const snap = preserveRenderState();
    const result = renderFn.apply(this, arguments);
    restoreRenderState(snap);
    return result;
  };
}

window.addEventListener('hashchange', function () { render(); });  // v6.1 late-binding — ให้ชี้ render() ตัวที่ feature override (ผูกตรง ๆ จะ capture placeholder เดิม)

// รอ DOM + Lucide ทั้งคู่ก่อน first render
// (Lucide loader จะ dispatch 'lucide:ready' เมื่อ load สำเร็จ
//  หรือเมื่อทุก CDN fail แล้ว fallback เป็น no-op)
var domReady = false;
var lucideReady = false;
function bootIfReady() {
  if (domReady && lucideReady) {
    render();
    renderIcons();
  }
}
if (document.readyState === 'loading') {
  window.addEventListener('DOMContentLoaded', function() { domReady = true; bootIfReady(); });
} else {
  domReady = true;
}
// Listen for ready event AND check ว่า lucide load ไปแล้วหรือยัง
// (script ตัวนี้รันหลัง loader — ถ้า loader sync เสร็จก่อน, event อาจหายไปแล้ว)
window.addEventListener('lucide:ready', function() { lucideReady = true; bootIfReady(); });
if (window.lucide && typeof window.lucide.createIcons === 'function') {
  lucideReady = true;
}
bootIfReady();
// Safety net: ถ้า lucide:ready ไม่มาภายใน 5s ให้ render ไปก่อน (UI ยังใช้งานได้)
setTimeout(function() {
  if (!lucideReady) {
    console.warn('[Lucide] Timeout — rendering without icons');
    lucideReady = true;
    bootIfReady();
  }
}, 5000);

function portalMenu(trigger, menu){
  let host = document.getElementById('overlay-root');
  if(!host){ host = document.createElement('div'); host.id='overlay-root'; document.body.appendChild(host); }
  if(menu.parentElement !== host) host.appendChild(menu);
  menu.classList.add('menu-fixed');

  const h = Math.min(menu.scrollHeight || 320, 320);
  menu.style.left = r.left + 'px';
  menu.style.width = r.width + 'px';
  if(below < h && above > below){ menu.style.top='auto'; menu.style.bottom=(window.innerHeight-r.top+4)+'px';
    menu.style.maxHeight = Math.min(h, above)+'px'; }
  else { menu.style.bottom='auto'; menu.style.top=(r.bottom+4)+'px';
    menu.style.maxHeight = Math.min(h, Math.max(below,120))+'px'; }
  menu._trigger = trigger;
  const reposition = ()=>{ if(menu.classList.contains('open')) portalMenu(trigger, menu); };
  if(!menu._portalBound){ menu._portalBound = true;
    window.addEventListener('scroll', reposition, true);
    window.addEventListener('resize', reposition); }
}
function positionMenu(trigger,menu){const r=trigger.getBoundingClientRect();
  const below=window.innerHeight-r.bottom-12, above=r.top-12, h=Math.min(menu.scrollHeight,320);
  if(below<h && above>below){menu.classList.add('drop-up');menu.style.maxHeight=Math.min(h,above)+'px';}
  else{menu.classList.remove('drop-up');menu.style.maxHeight=Math.min(h,Math.max(below,120))+'px';}}
function openOverlay(menu,trigger){document.querySelectorAll('[data-overlay].open').forEach(m=>{if(m!==menu)closeOverlay(m);});
  menu.classList.add('open');menu._trigger=trigger;if(trigger)positionMenu(trigger,menu);}

/* --- scroll lock + focus trap (#a11y · เพิ่ม 2026-08-04) ---
   lockScroll: กันพื้นหลังเลื่อนตอน overlay เปิด · นับชั้นได้ (modal ซ้อน drawer)
   trapFocus : กัน Tab หลุดออกไปพื้นหลัง + โฟกัสตัวแรกในกล่อง + คืนโฟกัสเดิมตอนปิด */
function lockScroll(on){ document.body.classList.toggle('is-overlay-open', !!on); }
var __focusStack = [];
function trapFocus(box){
  if(!box) return;
  var prev = document.activeElement;
  var sel = 'a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
  function onKey(e){
    if(e.key !== 'Tab') return;
    var f = [].slice.call(box.querySelectorAll(sel)).filter(function(el){ var r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; });
    if(!f.length) return;
    var first = f[0], last = f[f.length - 1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
  box.__trap = onKey; box.__prevFocus = prev;
  document.addEventListener('keydown', onKey);
  requestAnimationFrame(function(){
    var f = box.querySelector(sel);
    if(f) f.focus();
  });
}
function releaseFocus(box){
  if(!box || !box.__trap) return;
  document.removeEventListener('keydown', box.__trap);
  var prev = box.__prevFocus;
  box.__trap = null; box.__prevFocus = null;
  if(prev && typeof prev.focus === 'function') prev.focus();
}
/* ===== END BASE-KIT UTILS ===== */
</script>
