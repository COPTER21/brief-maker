function renderSheets(r){if(!r)return '<div class="empty">ยังไม่มีรอบนับ</div>';let second=r.status==='recount',assigned=second?r.recountAssignee:r.assignee,values=second?r.recounts:r.counts,canSubmit=['counting','recount'].includes(r.status)&&currentPersonId===assigned;return `<section class="card page-fill"><div class="section-pad"><h2>${esc(r.name)} ${pill(r.status)} ${isLocked(r)?'<span class="pill frozen">พื้นที่ถูกล็อก</span>':''}</h2><p>พื้นที่นับ ${esc(LOCATIONS.find(x=>x.id===r.scope)?.name)} · เก็บยอดตั้งต้นเมื่อ ${esc(r.freezeAt||'ยังไม่เริ่ม')} · ผู้นับ ${person(assigned)}</p>${r.status==='draft'&&role==='supervisor'?`<button class="btn btn-primary" onclick="freezeRound('${r.id}',this)">ล็อกพื้นที่และเก็บยอดตั้งต้น</button>`:''}${r.status==='frozen'&&role==='supervisor'?`<button class="btn btn-primary" onclick="openAssign('${r.id}',false)">มอบหมายใบนับ</button>`:''}${r.status==='recount'&&!assigned&&role==='supervisor'?`<button class="btn btn-primary" onclick="openAssign('${r.id}',true)">มอบหมายนับซ้ำ</button>`:''}</div><div class="table-wrap"><table class="tbl"><thead><tr><th>สินค้า</th><th>ตำแหน่ง</th><th>หน่วย</th>${canSeeSystem()?'<th class="num">ยอดตั้งต้น</th>':''}<th class="num">ผลนับ${second?' ครั้งที่ 2':''}</th><th>สถานะ</th></tr></thead><tbody>${r.snapshot.map(s=>{let it=ITEMS.find(i=>i.id===s.item),v=values[s.item];return `<tr><td>${esc(it?.id)} · ${esc(it?.name)}</td><td>${esc(r.scope)}</td><td>${esc(it?.unit)}</td>${canSeeSystem()?`<td class="num">${s.qty}</td>`:''}<td class="num">${canSubmit?`<input class="input num" type="number" min="0" value="${v??''}" aria-label="ผลนับ ${it?.id}" oninput="recordCount('${r.id}','${s.item}',this.value)">`:v??'—'}</td><td>${v===undefined?'รอนับ':'บันทึกแล้ว'}</td></tr>`}).join('')}</tbody></table></div><div class="table-foot"><span>${r.snapshot.length} รายการ</span><span class="table-actions">${canSubmit?`<button class="btn btn-secondary" onclick="toast('โหมดสแกนจะรับข้อมูลจาก F089 · ต้นแบบนี้ใช้การคีย์มื function recordCount(id,item,val){let r=rounds.find(x=>x.id===id),out=r.status==='recount'?r.recounts:r.counts;if(val===''){delete out[item];return}out[item]=Number(val)}async function submitCount(id,btn){let r=rounds.find(x=>x.id===id),assigned=r.status==='recount'?r.recountAssignee:r.assignee;if(!['counting','recount'].includes(r.status)||currentPersonId!==assigned){toast('ไม่ใช่ผู้ได้รับมอบหมายให้นับในขั้นนี้');return}let vals=r.status==='recount'?r.recounts:r.counts;if(r.snapshot.some(s=>!Number.isFinite(vals[s.item])||vals[s.item]<0)){toast('กรุณากรอกผลนับทุกสินค้าเป็นศูนย์หรือมากกว่า');return}beginSubmit(btn,'กำลังส่ง');await delay();let needs=r.snapshot.some(s=>Math.abs(vals[s.item]-s.qty)>inventoryConfig.varianceThreshold);if(r.status==='counting'&&needs){r.status='recount';r.recountAssignee='';eventLog(r,'ผลนับครั้งที่ 1 เกินเกณฑ์ · รอนับซ้ำ');toast('ผลต่างเกินเกณฑ์ ต้องมอบหมายคนอื่นนับซ้ำ')}else{r.status='review';eventLog(r,r.recountAssignee?'ส่งผลนับซ้ำแล้ว':'ส่งผลนับแล้ว');toast('ส่งผลนับแล้ว')}setTab('variance')}
function renderVariance(r){if(!r)return '<div class="empty">ยังไม่มีรอบนับ</div>';if(!canSeeSystem())return `<div class="card empty">ไม่มีสิทธิ์ดูผลต่าง</div>`;let lines=varianceLines(r),total=varianceTotal(r),step=activeApproval(r);return `<section class="card page-fill"><div class="section-pad"><h2>ผลต่าง · ${esc(r.id)} ${pill(r.status)} ${isLocked(r)?'<span class="pill frozen">พื้นที่ถูกล็อก</span>':''}</h2><dl><dt>เกณฑ์นับซ้ำ</dt><dd>${inventoryConfig.varianceThreshold} หน่วย · มีผล ${inventoryConfig.effectiveDate}</dd><dt>ฐานอนุมัติ</dt><dd>มูลค่าส่วนต่างสัมบูรณ์รวม ${total.toLocaleString('th-TH')} บาท</dd></dl>${r.status==='pending'&&step?`<p>ขั้นที่ ${step.level} จาก ${r.approvalSteps.length} · รอ ${person(step.person)}</p>`:''}</div><div class="table-wrap"><table class="tbl"><thead><tr><th>สินค้า</th><th class="num">ยอดตั้งต้น</th><th class="num">นับครั้งที่ 1</th><th class="num">นับซ้ำ</th><th class="num">ผลต่างสุดท้าย</th><th class="num">มูลค่าส่วนต่าง</th><th>ตรวจ</th></tr></thead><tbody>${lines.map(x=>{let exceed=Math.abs(x.diff)>inventoryConfig.varianceThreshold;return `<tr><td>${esc(x.item)}</td><td class="num">${x.system_qty}</td><td class="num">${r.counts[x.item]??'—'}</td><td class="num">${r.recounts[x.item]??'—'}</td><td class="num">${x.diff}</td><td class="num">${x.value.toLocaleString('th-TH')} บาท</td><td>${exceed?'เกินเกณฑ์':'ปกติ'}</td></tr>`}).join('')}</tbody></table></div><div class="table-foot"><span>${r.adjustmentRef?'สร้างร่างใบปรับยอด '+r.adjustmentRef+' แล้ว':'ยังไม่ได้สร้างร่างใบปรับยอด'} · หน้านี้ไม่เปลี่ยนยอดคงคลัง</span><span class="ph-actions">${r.status==='review'&&role==='supervisor'?`<button class="btn btn-primary" onclick="openDoa('${r.id}')">ส่งอนุมัติ</button>`:''}${r.status==='pending'&&step&&currentPersonId===step.person?`<button class="btn btn-secondary" onclick="openReject('${r.id}')">ไม่อนุมัติ</button><button class="btn btn-primary" onclick="openApprove('${r.id}')">อนุมัติขั้นนี้</button>`:''}${r.status==='approved'&&r function renderHistory(r){if(!r)return '<div class="empty">ยังไม่มีรอบนับ</div>';return `<section class="card section-pad"><h2>ประวัติ · ${esc(r.id)}</h2>${r.audit.map(e=>`<div class="timeline">${esc(e.at)} · ${esc(e.act)}</div>`).join('')}${r.handoff?`<div class="history-handoff"><h3>ส่งต่อใบปรับยอด</h3><p>ตอบรับ: ${esc(r.handoff.ack.adjId)} · สถานะ ${esc(r.handoff.ack.status)}</p><p>อ้างอิงรอบนับ ${esc(r.handoff.payload.ref_count_doc)} · ${r.handoff.payload.lines.length} รายการ · มูลค่าส่วนต่างสัมบูรณ์ ${varianceTotal(r).toLocaleString('th-TH')} บาท</p></div>`:''}</section>`}
function combo(field,items,value){let v=items.find(x=>x.id===value),label=field.startsWith('ผู้อนุมัติ:')?'บุคคล':field;return `<div class="combo"><input class="input full-width" role="combobox" aria-autocomplete="list" aria-expanded="false" placeholder="ค้นหา${label}" value="${esc(v?.name||'')}" onfocus="suggest(this,'${field}')" oninput="suggest(this,'${field}')"><div class="combo-pop hidden" role="listbox"></div></div>`}function suggest(el,field){let arr=field==='คลัง/ตำแหน่ง'?LOCATIONS:PEOPLE,q=el.value.toLowerCase(),pop=el.nextElementSibling;pop.innerHTML=arr.filter(x=>x.name.toLowerCase().includes(q)||x.id.toLowerCase().includes(q)).map(x=>`<div class="combo-option" role="option" onclick="choose('${field}','${x.id}')">${field==='คลัง/ตำแหน่ง'?esc(x.name):person(x.id)}</div>`).join('')||'<div class="combo-option">ไม่พบรายการ</div>';pop.classList.remove('hidden');el.setAttribute('aria-expanded','true')}function choose(field,id){if(field==='คลัง/ตำแหน่ง'){drawer.scope=id;renderDrawer()}else if(modal&&field.startsWith('ผู้อนุมัติ:')){modal.slots[Number(field.split(':')[1])].person=id;renderModal()}else if(modal){modal.person=id;renderModal()}}
function openCreate(){drawer={type:'create',name:'',scope:''};location.hash='#/create';renderDrawer()}function closeDrawer(){drawer=null;document.getElementById('drawer').classList.remove('is-open');document.getElementById('drawer-backdrop').classList.remove('is-open');if(location.hash==='#/create')location.hash='#/rounds'}function renderDrawer(){if(!drawer)return;document.getElementById('drawer-backdrop').classList.add('is-open');let e=document.getElementById('drawer');e.classList.add('is-open');e.innerHTML=`<div class="dw-head"><h2>สร้างรอบนับใหญ่</h2><button class="btn btn-ghost" aria-label="ปิด" onclick="closeDrawer()">${icon('x')}</button></div><div class="dw-body"><div class="form-grid"><div class="field"><label class="field-label">ชื่อรอบนับ</label><input class="input" value="${esc(drawer.name)}" oninput="drawer.name=this.value"></div><div class="field"><label class="field-label">คลัง/ตำแหน่ง</label>${combo('คลัง/ตำแหน่ง',LOCATIONS,drawer.scope)}</div></div></div><div class="dw-footer"><button class="btn btn-ghost" onclick="closeDrawer()">ยกเลิก</button><button class="btn btn-primary" onclick="createRound(this)">ยืนยันสร้าง</button></div>`;renderIcons()}async function createRound(btn){if(!drawer.name.trim()||!drawer.scope){toast('กรุณาระบุชื่อรอบนับและพื้นที่นับ');return}beginSubmit(btn,'กำลังสร้าง');await delay();let d={id:'ST-2026-'+String(rounds.length+1).padStart(3,'0'),name:drawer.name,scope:drawer.scope,status:'draft',freezeAt:'',snapshot:[],assignee:'',recountAssignee:'',counts:{},recounts:{},audit:[],adjustmentRef:'',approvalSteps:[],handoff:null};rounds.unshift(d);selected=d.id;closeDrawer();setTab('sheets');toast('สร้างรอบนับแล้ว')}
function scopesOverlap(a,b){return a===b||a.startsWith(b+'-')||b.startsWith(a+'-')}async function freezeRound(id,btn){let r=rounds.find(x=>x.id===id);if(!r)return;if(role!=='supervisor'){toast('ไม่ใช่ผู้มีสิทธิ์ในขั้นนี้');return}if(r.status!=='draft'){toast('ล็อกได้เฉพาะรอบที่ยังเป็นแบบร่าง');return}if(r.snapshot.length){toast('ยอดตั้งต้นถูกเก็บแล้วและแก้ย้อนหลังไม่ได้');return}if(rounds.some(x=>x.id!==id&&scopesOverlap(x.scope,r.scope)&&!['closed','rejected'].includes(x.status))){toast('พื้นที่นี้ทับซ้อนกับรอบนับที่กำลังใช้งาน');return}let snapshot=ITEMS.filter(i=>r.scope==='WH-01'||i.location===r.scope).map(i=>({item:i.id,qty:i.qty}));if(!snapshot.length){toast('ไม่พบสินค้าในพื้นที่นับ');return}beginSubmit(btn,'กำลังล็อก');await delay();r.freezeAt=new Date().toISOString().slice(0,16).replace('T',' ');r.snapshot=snapshot;r.status='frozen';STOCKTAKE_LOCKS.push({scope:r.scope,roundId:r.id,from:r.freezeAt});eventLog(r,'ล็อกการเคลื่อนไหวเฉพาะ '+r.scope+' และเก็บยอดตั้งต้น');render();toast('ล็อกพื้นที่และเก็บยอดตั้งต้นแล้ว')}function openAssign(id,recount){modal={type:'assign',id,recount,person:''};renderModal()}function openDoa(id){let r=rounds.find(x=>x.id===id),def=doaDefinition(r);modal={type:'doa',id,slots:def.steps.map((label,i)=>({level:i+1,label,person:''}))};renderModal()}function openApprove(id){modal={type:'approve',id};renderModal()}function openReject(id){modal={type:'reject',id};renderModal()}function closeModal(){modal=null;document.getElementById('overlay-root').innerHTML=''}function modalBackdrop(e,el){if(e.target===el)closeModal()}function renderModal(){if(!modal)return;let r=rounds.find(x=>x.id===modal.id),step=activeApproval(r),title={assign:modal.recount?'มอบหมายนับซ้ำ':'มอบหมายใบนับ',doa:'เลือกผู้อนุมัติตามวงเงิน',approve:'ยืนยันการอนุมัติ',reject:'ไม่อนุมัติ'}[modal.type],body=modal.type==='assign'?`<div class="slot-row"><span>1</span><span>ผู้นับ</span>${combo('บุคคล',PEOPLE,modal.person)}</div>${modal.person?person(modal.person):''}`:modal.type==='doa'?`<p>มูลค่าส่วนต่างสัมบูรณ์ ${varianceTotal(r).toLocaleString('th-TH')} บาท · ${modal.slots.length} ขั้น</p>${modal.slots.map((s,i)=>`<div class="field"><label class="field-label">ขั้นที่ ${s.level} · ${esc(s.label)}</label>${combo('ผู้อนุมัติ:'+i,PEOPLE,s.person)}${s.person?person(s.person):''}</div>`).join('')}`:modal.type==='approve'?`<p>อนุมัติผลต่างของ ${esc(r.id)} · ขั้นที่ ${step?.level||'—'} จาก ${r.approvalSteps.length}</p>${person(step?.person)}`:'<textarea id="reject-reason" class="input full-width" placeholder="เหตุผลที่ไม่อนุมัติ"></textarea>';document.getElementById('overlay-root').innerHTML=`<div class="modal-backdrop" onclick="modalBackdrop(event,this)"><div class="modal" role="dialog" aria-modal="true"><h3>${title}</h3>${body}<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" onclick="confirmModal(this)">ยืนยัน</button></div></div></div>`;renderIcons()}async function confirmModal(btn){let r=rounds.find(x=>x.id===modal.id),kind=modal.type,step=activeApproval(r),reason='';if(kind==='assign'){let expected=modal.recount?'recount':'frozen';if(role!=='supervisor'){toast('ไม่ใช่ผู้มีสิทธิ์ในขั้นนี้');return}if(r.status!==expected){toast('สถานะไม่ถูกต้อง');return}if(!modal.person){toast('กรุณาเลือกบุคคล');return}if(modal.recount&&modal.person===r.assignee){toast('ผู้นับซ้ำต้องเป็นคนละคนกับผู้นับครั้งแรก');return}}else if(kind==='doa'){if(role!=='supervisor'){toast('ไม่ใช่ผู้มีสิทธิ์ในขั้นนี้');return}if(r.status!=='review'){toast('สถานะไม่ถูกต้อง');return}let people=modal.slots.map(x=>x.person);if(people.some(x=>!x)){toast('กรุณาเลือกผู้อนุมัติทุกขั้น');return}if(people.some(x=>[r.assignee,r.recountAssignee].includes(x))){toast('ผู้อนุมัติต้องไม่ใช่ผู้นับ');return}if(new Set(people).size!==people.length){toast('ผู้อนุมัติแต่ละขั้นต้องเป็นคนละคน');return}}else if(['approve','reject'].includes(kind)){if(role!=='supervisor'||r.status!=='pending'||!step||currentPersonId!==step.person||[r.assignee,r.recountAssignee].includes(currentPersonId)){toast('ไม่ใช่ผู้มีสิทธิ์ในขั้นนี้');return}if(kind==='reject'){reason=document.getElementById('reject-reason').value.trim();if(!reason){toast('กรุณาระบุเหตุผล');return}}}beginSubmit(btn);await delay();if(kind==='assign'){if(modal.recount)r.recountAssignee=modal.person;else{r.assignee=modal.person;r.status='counting'}eventLog(r,'มอบหมาย '+PEOPLE.find(x=>x.id===modal.person).name)}else if(kind==='doa'){r.approvalSteps=modal.slots.map(x=>({...x,by:'',at:''}));r.approver=r.approvalSteps[0].person;r.status='pending';eventLog(r,'ส่งอนุมัติ '+r.approvalSteps.length+' ขั้น · เริ่มที่ '+PEOPLE.find(x=>x.id===r.approver).name)}else if(kind==='approve'){step.by=currentPersonId;step.at=new Date().toISOString();let next=activeApproval(r);eventLog(r,'อนุมัติขั้นที่ '+step.level+' โดย '+PEOPLE.find(x=>x.id===currentPersonId).name);if(next){r.approver=next.person;toast('อนุมัติขั้นนี้แล้ว · ส่งต่อขั้นถัดไป')}else{r.status='approved';r.approver=currentPersonId;eventLog(r,'อนุมัติผลต่างครบทุกขั้น · ส่ง CSQ stocktake.variance_approved')}}else{r.status='rejected';unlockScope(r);eventLog(r,'ไม่อนุมัติ: '+reason);eventLog(r,'ปลดล็อกการเคลื่อนไหวเฉพาะ '+r.scope)}closeModal();render();if(kind!=='approve'||r.status==='approved')toast('บันทึกผลแล้ว')}
async function handoff(id,btn){let r=rounds.find(x=>x.id===id);if(!r)return;if(role!=='supervisor'){toast('ไม่ใช่ผู้มีสิทธิ์ในขั้นนี้');return}if(r.status!=='approved'||r.adjustmentRef){toast('ต้องอนุมัติผลต่างก่อน และสร้างใบปรับได้ครั้งเดียว');return}beginSubmit(btn,'กำลังสร้าง');await delay();let payload={ref_count_doc:r.id,scope:r.scope,freezeAt:r.freezeAt,approvedBy:r.approver,lines:varianceLines(r).map(x=>({item:x.item,system_qty:x.system_qty,counted_qty:x.counted_qty,diff:x.diff,cost:x.cost}))},ack={adjId:'ADJ-DRAFT-'+r.id.slice(-3),status:'draft'};r.handoff={payload,ack};r.adjustmentRef=ack.adjId;eventLog(r,'สร้างร่างใบปรับยอด '+ack.adjId+' จากผลตรวจนับ · F082 ตอบรับ '+ack.status);r.status='closed';unlockScope(r);eventLog(r,'ปลดล็อกการเคลื่อนไหวเฉพาะ '+r.scope);eventLog(r,'ส่ง CSQ stocktake.handoff');render();toast('สร้างร่างใบปรับยอดและปิดรอบนับแล้ว')}function route(){let h=location.hash.slice(2);if(['rounds','sheets','variance','history'].includes(h))tab=h;render();if(h==='create'&&drawer)renderDrawer()}window.addEventListener('hashchange',function(){route()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modal)closeModal();else if(document.querySelector('.combo-pop:not(.hidden)'))document.querySelectorAll('.combo-pop').forEach(x=>{x.classList.add('hidden');x.previousElementSibling?.setAttribute('aria-expanded','false')});else if(drawer)closeDrawer()}});document.querySelector('.sb-module-header')?.firstChild?.remove();route();
</script></body></html>
