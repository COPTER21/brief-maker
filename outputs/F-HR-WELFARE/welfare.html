/* ---------- eligibility + balance ---------- */
function usedByPerson(empId, benefitId){
  const b = benById(benefitId);
  return REQUESTS.filter(r=>r.empId===empId && r.benefitId===benefitId && r.status==='approved')
    .reduce((s,r)=> s + (b && b.unit==='money' ? r.amount : r.amount), 0);
}
function remaining(empId, benefitId){
  const b = benById(benefitId); if(!b || b.quota==null) return null;
  return b.quota - usedByPerson(empId, benefitId); // FIX-02: คืนค่าจริง (อาจติดลบ) — จุด display format 0/badge เอง
}
function eligibility(emp, ben, isoDate){
  if(!emp || !ben) return {ok:false, reason:'ยังเลือกข้อมูลไม่ครบ'};
  if(ben.status!=='active') return {ok:false, reason:'ประเภทสวัสดิการนี้ไม่อยู่ในเวอร์ชันที่มีผล'};
  if(emp.ended) return {ok:false, reason:'พนักงานพ้นสภาพแล้ว (leaver) — สิทธิ์สิ้นสุด ยื่นคำขอไม่ได้'};
  if(!ben.groups.includes(emp.group)) return {ok:false, reason:'กลุ่มพนักงาน "'+gName(emp.group)+'" ไม่มีสิทธิ์ในประเภทนี้'};
  const d = isoDate ? new Date(isoDate) : new Date();
  if(ben.effFrom && d < new Date(ben.effFrom)) return {ok:false, reason:'วันที่ใช้สิทธิ์ก่อนวันมีผลของสวัสดิการ ('+fmtDate(ben.effFrom)+')'};
  if(ben.effTo && d > new Date(ben.effTo)) return {ok:false, reason:'วันที่ใช้สิทธิ์เกินช่วงมีผลของสวัสดิการ'};
  return {ok:true, reason:''};
}

/* ---------- status pills ---------- */
function reqPill(s){
  const m={ draft:['ร่าง','pill-muted'], pending:['รออนุมัติ','pill-warning'], approved:['อนุมัติแล้ว','pill-success'],
    rejected:['ไม่อนุมัติ','pill-danger'], cancelled:['ยกเลิก','pill-muted'], revoked:['ระงับ (พ้นสภาพ)','pill-muted'],
    reversed:['กลับรายการแล้ว','pill-danger'] };  /* OQ-WEL-01: post-approval correction (append-only reversal) */
  const x=m[s]||['—','pill-muted']; return '<span class="pill '+x[1]+'">'+x[0]+'</span>';
}
function payPill(p, status){
  if(status!=='approved') return '<span class="text-mute-2">—</span>';
  const m={ none:['—','pill-muted'], pending:['รอจ่าย','pill-warning'], sent:['ส่งจ่ายแล้ว','pill-info'] };
  const x=m[p]||['—','pill-muted']; return '<span class="pill '+x[1]+'">'+x[0]+'</span>';
}
function benPill(s){ return s==='active' ? '<span class="pill pill-success">มีผล</span>'
  : s==='draft' ? '<span class="pill pill-muted">ร่าง</span>' : '<span class="pill pill-muted">เก็บถาวร</span>'; }

    + searchSelectHTML('balEmp', {placeholder:'พิมพ์ชื่อ/ตำแหน่งพนักงาน'})
    + '</div></div>';

  if(!emp){
    return pick + emptyStateHTML({icon:'user-search', title:'เลือกพนักงานเพื่อดูสิทธิ์คงเหลือ',
      desc:'ค้นหาแล้วเลือกพนักงาน 1 คน เพื่อดูสิทธิ์ · โควตา · ยอดใช้ · คงเหลือ ต่อประเภท และรายชื่อผู้ติดตาม'});
  }

  // benefits eligible for this employee's group
  const bens = BENEFITS.filter(b=>b.status==='active' && b.groups.includes(emp.group));
  let benRows;
  if(emp.ended){
    benRows = '<tr><td colspan="5"><div class="note is-warn" style="margin:6px 0"><i data-lucide="user-x"></i><div>พนักงานพ้นสภาพ (last day '+fmtDate(emp.lastDay)+') — <b>สิทธิ์สวัสดิการสิ้นสุด</b> คงเหลือหยุดคำนวณ (leaver signal)</div></div></td></tr>';
  } else if(bens.length===0){
    benRows = '<tr><td colspan="5"><div class="empty-desc" style="padding:12px">กลุ่ม “'+gName(emp.group)+'” ไม่มีสิทธิ์ในสวัสดิการที่มีผลขณะนี้</div></td></tr>';
  } else {
    benRows = bens.map(b=>{
      if(b.unit==='percent') return '<tr><td>'+esc(b.name)+'</td><td>สมัคร %</td><td class="col-num">—</td><td class="col-num">—</td><td>—</td></tr>';
      const used=usedByPerson(emp.id,b.id), rem=remaining(emp.id,b.id), pct=b.quota?Math.round(used/b.quota*100):0;
      const cls = pct>=100?'full':(pct>=80?'near':'');
      const near = pct>=80 && pct<100 ? ' <span class="near-tag"><i data-lucide="alert-triangle"></i>ใกล้เต็มโควตา</span>' : '';
      const q = b.unit==='money'? fmtNumber(b.quota)+' บาท' : fmtNumber(b.quota)+' ครั้ง';
      const u = b.unit==='money'? money(used) : (canSeeValue()?fmtNumber(used)+' ครั้ง':maskEl('RESTRICTED'));
      const remShown=Math.max(0,rem); // FIX-02: display clamp — logic เห็นค่าจริง หน้าจอโชว์ไม่ต่ำกว่า 0
      const rr= b.unit==='money'? money(remShown)  : (canSeeValue()?fmtNumber(remShown)+' ครั้ง':maskEl('RESTRICTED'));
      return '<tr><td>'+esc(b.name)+near+'</td><td>'+q+'</td><td class="col-num num">'+u+'</td><td class="col-num num">'+rr+'</td>'
        + '<td><span class="qwrap"><span class="qbar '+cls+'"><i style="width:'+Math.min(100,pct)+'%"></i></span><span class="text-mute-2" style="font-size:12px">'+pct+'%</span></span></td></tr>';
    }).join('');
  }

  const joinerNote = emp.joiner ? '<div class="note is-success" style="margin-bottom:16px"><i data-lucide="user-plus"></i><div>พนักงานเข้าใหม่ '+fmtDate(emp.joinDate)+' → เข้ากลุ่ม “'+gName(emp.group)+'” · <b>สิทธิ์เปิดอัตโนมัติ</b> ตาม joiner signal</div></div>' : '';

  // dependents (FN-05) — masked unless HR admin
  let depBody;
  if(!canSeeDependent()){
    depBody = '<tr><td colspan="5">'+maskEl('ข้อมูลผู้ติดตามถูกปิดบัง (RESTRICTED) — เห็นได้เฉพาะ HR สวัสดิการ')+'</td></tr>';
  } else if((emp.dependents||[]).length===0){
    depBody = '<tr><td colspan="5"><div class="empty-desc" style="padding:12px">ยังไม่มีผู้ติดตาม</div></td></tr>';
  } else {
    depBody = emp.dependents.map(d=>'<tr><td>'+esc(d.name)+'</td><td>'+esc(d.rel)+'</td><td>'+fmtDate(d.dob)+'</td>'
      + '<td>'+(d.eligible?'<span class="pill pill-success">ใช้สิทธิ์ได้</span>':'<span class="pill pill-muted">ไม่ใช้สิทธิ์</span>')+'</td>'
      + '<td onclick="event.stopPropagation()"><button class="ra-btn is-danger" title="ลบผู้ติดตาม" onclick="openModal(\'removeDep\',{emp:\''+emp.id+'\',dep:\''+d.id+'\'})"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button></td></tr>').join('');
  }

  // FIX-07: c[4] จ่ายประจำผ่านเงินเดือน — surface display-only (runtime จริงที่ Payroll F065 อ่านค่าจากที่นี่)
  let payrollCard='';
  const pctBens = BENEFITS.filter(b=>b.status==='active' && b.unit==='percent' && b.groups.includes(emp.group));
  if(pctBens.length && !emp.ended){
    const prows = pctBens.map(b=>{
      const pct = payrollPctOf(emp.id, b.id);
      return '<tr><td>'+esc(b.name)+'</td>'
        + '<td class="col-num"><input type="number" class="input pct-input" min="0" max="100" step="0.5" value="'+pct+'" onchange="setPayrollPct(\''+emp.id+'\',\''+b.id+'\',this.value)" title="สัดส่วน % ของเงินเดือน (mock · display-only)"> %</td>'
        + '<td><span class="pill pill-info">ส่งเข้ารอบเงินเดือนถัดไป</span></td></tr>';
    }).join('');
    payrollCard = '<div class="card" style="padding:16px 18px; margin-bottom:16px"><div class="vsec-t"><i data-lucide="banknote"></i>จ่ายประจำผ่านเงินเดือน (สมทบ/หักอัตโนมัติ)</div>'
      + '<table class="mini"><thead><tr><th>ประเภทสวัสดิการ</th><th class="col-num">สัดส่วน %</th><th>สถานะรอบจ่าย</th></tr></thead><tbody>'+prows+'</tbody></table>'
      + '<div class="note is-info" style="margin-top:12px"><i data-lucide="info"></i><div>สัดส่วนนี้คือ <b>ค่าตั้งต้นฝั่งสวัสดิการ (display-only)</b> — การสมทบ/หักจริงทำงานที่ <b>Payroll (F065)</b> ซึ่งอ่านค่าจากที่นี่ตอนปิดงวด · หน้านี้ไม่จ่ายเอง</div></div></div>';
  }

  return pick
    + joinerNote
    + '<div class="person-hero"><span class="pav">'+esc(initials(emp.name))+'</span><div style="flex:1">'
    +   '<div class="ph-name">'+(canSeePerson()?esc(emp.name):'•••••')+'</div>'
    +   '<div class="ph-meta">'+(canSeePerson()?esc(emp.position+' · '+emp.dept):maskEl('RESTRICTED'))+' · กลุ่ม '+gName(emp.group)+' · เข้างาน '+fmtDate(emp.joinDate)+'</div></div>'
    +   '<button class="btn btn-secondary" onclick="state.balance.empId=null; render()"><i data-lucide="x" class="w-4 h-4"></i><span>เปลี่ยนพนักงาน</span></button></div>'
    + '<div class="card" style="padding:16px 18px; margin-bottom:16px"><div class="vsec-t"><i data-lucide="gauge"></i>สิทธิ์ · โควตา · คงเหลือ (ปีสิทธิ์ 2569)</div>'
    +   '<table class="mini"><thead><tr><th>ประเภทสวัสดิการ</th><th>โควตา/ปี</th><th class="col-num">ใช้ไป</th><th class="col-num">คงเหลือ</th><th>ความคืบหน้า</th></tr></thead><tbody>'+benRows+'</tbody></table></div>'
    + payrollCard
    + '<div class="card" style="padding:16px 18px"><div class="vsec-t" style="justify-content:space-between"><span style="display:inline-flex;align-items:center;gap:6px"><i data-lucide="users"></i>ผู้ติดตาม (คู่สมรส/บุตร)</span>'
    +   (canSeeDependent()?'<button class="btn btn-sm btn-secondary" onclick="openDrawer(\'dependent-create\',\''+emp.id+'\')"><i data-lucide="user-plus" class="w-3.5 h-3.5"></i><span>เพิ่มผู้ติดตาม</span></button>':'')+'</div>'
    +   '<table class="mini"><thead><tr><th>ชื่อ</th><th>ความสัมพันธ์</th><th>วันเกิด</th><th>สถานะใช้สิทธิ์</th><th style="width:60px"></th></tr></thead><tbody>'+depBody+'</tbody></table></div>';
}

/* ============================================================
   TAB 4 — รายงาน (FN-19)
   ============================================================ */
function renderReport(){
  const f=state.repFilter;
  let rs = REQUESTS.filter(r=>r.status==='approved');
  if(f.type!=='all') rs=rs.filter(r=>r.benefitId===f.type);
  if(f.group!=='all') rs=rs.filter(r=>{const e=empById(r.empId); return e && e.group===f.group;});
  if(f.from) rs=rs.filter(r=>r.useDate>=f.from);   // FN-19/S-16 ช่วงเวลา (จากวันที่)
  if(f.to)   rs=rs.filter(r=>r.useDate<=f.to);     // FN-19/S-16 ช่วงเวลา (ถึงวันที่)

  const totalReq=REQUESTS.length, approved=REQUESTS.filter(r=>r.status==='approved').length, pending=REQUESTS.filter(r=>r.status==='pending').length;
  const totalVal=rs.reduce((s,r)=>s+r.value,0);

  const typeOpts=[['all','ทุกประเภท']].concat(BENEFITS.filter(b=>b.claimable).map(b=>[b.id,b.name]))
    .map(o=>'<option value="'+o[0]+'"'+(f.type===o[0]?' selected':'')+'>'+o[1]+'</option>').join('');
  const grpOpts=[['all','ทุกกลุ่มพนักงาน']].concat(GROUPS.map(g=>[g.id,g.name]))
    .map(o=>'<option value="'+o[0]+'"'+(f.group===o[0]?' selected':'')+'>'+o[1]+'</option>').join('');

  // aggregate by benefit type
  const agg={};
  rs.forEach(r=>{ agg[r.benefitId]=agg[r.benefitId]||{n:0,v:0}; agg[r.benefitId].n++; agg[r.benefitId].v+=r.value; });
  const keys=Object.keys(agg);
  let body;
  if(keys.length===0){
    body='<tr><td colspan="4">'+emptyStateHTML({icon:'bar-chart-3', title:'ไม่พบข้อมูลตามตัวกรอง', desc:'ยังไม่มีคำขอที่อนุมัติแล้วตรงกับเงื่อนไข',
      actionLabel:'ล้างตัวกรอง', actionIcon:'rotate-ccw', onAction:'resetRep()'})+'</td></tr>';
  } else {
    body=keys.map(k=>{const b=benById(k); return '<tr><td>'+esc(b?b.name:k)+'</td><td>'+esc(b?b.cat:'—')+'</td>'
      +'<td class="col-num num">'+agg[k].n+'</td><td class="col-num num">'+money(agg[k].v)+'</td></tr>';}).join('');
  }

  return ''
    + '<div class="stats">'
    +   '<div class="stat"><div class="stat-label"><i data-lucide="files" class="w-3 h-3"></i>คำขอทั้งหมด</div><div class="stat-value">'+totalReq+'</div><div class="stat-meta">ปีสิทธิ์ 2569</div></div>'
    +   '<div class="stat"><div class="stat-label"><i data-lucide="check-circle-2" class="w-3 h-3"></i>อนุมัติแล้ว</div><div class="stat-value">'+approved+'</div><div class="stat-meta">รออนุมัติ '+pending+'</div></div>'
    +   '<div class="stat"><div class="stat-label"><i data-lucide="banknote" class="w-3 h-3"></i>มูลค่าสวัสดิการรวม</div><div class="stat-value" style="font-size:22px">'+ (canSeeValue()?fmtMoney(totalVal):'•••') +'</div><div class="stat-meta">บันทึกเข้า 7C · EC</div></div>'
    +   '<div class="stat"><div class="stat-label"><i data-lucide="alert-triangle" class="w-3 h-3"></i>ใกล้เต็มโควตา</div><div class="stat-value">'+nearLimitCount()+'</div><div class="stat-meta">สิทธิ์ที่ใช้ ≥ 80%</div></div>'
    + '</div>'
    + '<div class="card list-card">'
    + '<div class="filter-bar"><span class="text-mute-2" style="font-size:12.5px;font-weight:600">ตัวกรอง:</span>'
    +   '<select class="select" style="max-width:200px" onchange="state.repFilter.type=this.value; render()">'+typeOpts+'</select>'
    +   '<span class="text-mute-2" style="font-size:12.5px">กลุ่มพนักงาน:</span>'
    +   '<select class="select" style="max-width:200px" onchange="state.repFilter.group=this.value; render()" title="กรองตามกลุ่มพนักงาน">'+grpOpts+'</select>'
    +   '<span class="text-mute-2" style="font-size:12.5px">ช่วงเวลา:</span>'
    +   '<input type="date" class="input" style="max-width:150px" value="'+esc(f.from)+'" onchange="state.repFilter.from=this.value; render()" title="ตั้งแต่วันที่ใช้สิทธิ์">'
    +   '<span class="text-mute-2">–</span>'
    +   '<input type="date" class="input" style="max-width:150px" value="'+esc(f.to)+'" onchange="state.repFilter.to=this.value; render()" title="ถึงวันที่ใช้สิทธิ์">'
    +   '<button class="btn btn-ghost" style="margin-left:auto" onclick="resetRep()"><i data-lucide="rotate-ccw" class="w-4 h-4"></i><span>ล้างตัวกรอง</span></button></div>'
    + '<div class="table-wrap"><table class="table"><thead><tr><th>ประเภทสวัสดิการ</th><th>หมวด</th><th class="col-num">จำนวนคำขออนุมัติ</th><th class="col-num">มูลค่ารวม</th></tr></thead><tbody>'+body+'</tbody></table></div>'
    + '<div class="table-foot table-footer"><span>'+keys.length+' ประเภท</span><span class="rep-hint">ตัวเลข = เฉพาะคำขอสถานะ “อนุมัติแล้ว”</span></div>'
    + '</div>';
}
function resetRep(){ state.repFilter={type:'all',group:'all',from:'',to:''}; render(); }
/* FIX-07: mock สัดส่วน % จ่ายประจำต่อคน (display-only hook → F065 Payroll) */
function payrollPctOf(empId, benId){ const k=empId+'|'+benId; if(state.payrollPct[k]==null) state.payrollPct[k]=(benId==='B-PVD'?5:3); return state.payrollPct[k]; }
function setPayrollPct(empId, benId, v){ const n=Math.max(0,Math.min(100,Number(v)||0)); state.payrollPct[empId+'|'+benId]=n; render(); showToast('บันทึกสัดส่วน % (mock · display-only) — ส่งเข้ารอบเงินเดือนถัดไป','info'); }
function nearLimitCount(){ let n=0; EMPLOYEES.forEach(e=>{ if(e.ended)return; BENEFITS.filter(b=>b.status==='active'&&b.quota&&b.groups.includes(e.group)).forEach(b=>{ const p=usedByPerson(e.id,b.id)/b.quota; if(p>=0.8) n++; }); }); return n; }

function renderDrawer(){
  const m=state.drawer.mode, id=state.drawer.recordId;
  if(m==='benefit-create'||m==='benefit-edit') return drawerBenefitForm(m==='benefit-edit'?benById(id):null);
  if(m==='benefit-view')  return drawerBenefitView(benById(id));
  if(m==='request-create')return drawerRequestForm();
  if(m==='request-view')  return drawerRequestView(reqById(id));
  if(m==='dependent-create') return drawerDependentForm(id);
  return '';
}

/* ---- benefit create/edit (FN-01,02,04) ---- */
function drawerBenefitForm(rec){

    state.form = { _k:'benefit', name:rec?rec.name:'', cat:rec?rec.cat:'สุขภาพ', unit:rec?rec.unit:'money',
      quota:rec?rec.quota:'', coversDep:rec?rec.coversDep:false, groups:rec?rec.groups.slice():[], effFrom:rec?'2027-01-01':'', scope:'ทั้งบริษัท', err:{} };
  }
  const fm=state.form, err=fm.err||{};
  const grpChk = GROUPS.map(g=>'<label style="display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 0;cursor:pointer">'

    : '<div class="note is-info" style="margin-bottom:16px"><i data-lucide="git-branch"></i><div>การแก้ไข = <b>ออกเวอร์ชันใหม่</b> ที่มีวันมีผลใหม่ · เวอร์ชันเดิม (v'+rec.version+') ยังอ้างอิงได้กับคำขอเก่า</div></div>') : '';

  return ''
  + head(isEdit?'แก้ไขประเภทสวัสดิการ':'สร้างประเภทสวัสดิการ', isEdit?('WEL · '+esc(rec.code)):'ทะเบียนสวัสดิการ')
  + '<div class="drawer-body">'+editNote
  + '<div class="form-section"><div class="form-section-title">ข้อมูลทั่วไป</div>'
  +   fld('ชื่อสวัสดิการ', true, '<input class="input" placeholder="เช่น ประกันสุขภาพกลุ่ม" value="'+esc(fm.name)+'" oninput="state.form.name=this.value">', err.name)
  +   '<div class="field-row">'
  +     fld('หมวด', false, selEnum(['สุขภาพ','ครอบครัว','การเงิน','อื่น ๆ'], fm.cat, 'state.form.cat=this.value'))
  +     fld('หน่วยนับ', true, selUnit(fm.unit))
  +   '</div>'
  + '</div>'
  + '<div class="form-section"><div class="form-section-title">โควตา / วงเงิน · สิทธิ์</div>'
  +   '<div class="field-row">'
  +     fld((fm.unit==='money'?'วงเงินต่อปี (บาท)':fm.unit==='times'?'จำนวนครั้งต่อปี':'อัตราสมทบ (%)'), fm.unit!=='percent', '<input type="number" class="input" placeholder="0" value="'+esc(fm.quota)+'" oninput="state.form.quota=this.value" '+(fm.unit==='percent'?'disabled':'')+'>', err.quota, fm.unit==='percent'?'กองทุน %: กำหนดอัตราตอนพนักงานสมัคร':'')
  +     fld('วันมีผล (effective)', true, '<input type="date" class="input" value="'+isoToDate(fm.effFrom)+'" onchange="state.form.effFrom=this.value">', err.effFrom, 'ช่วงมีผลของเวอร์ชันต้องไม่ทับกัน')
  +   '</div>'
  +   fld('กลุ่มพนักงานที่มีสิทธิ์', true, '<div>'+grpChk+'</div>', err.groups)
  +   '<div class="field" style="margin-bottom:0"><label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:13px">'

  + '</div>'
  + '</div>'
  + footCreate(isEdit)
  ;
}
function selUnit(v){ return '<select class="select" onchange="state.form.unit=this.value; render()">'
  + ['money|วงเงิน (บาท/ปี)','times|จำนวนครั้ง/ปี','percent|% ของเงินเดือน'].map(o=>{const[val,lb]=o.split('|');
    return '<option value="'+val+'"'+(v===val?' selected':'')+'>'+lb+'</option>';}).join('')+'</select>'; }
function toggleGrp(g){ const a=state.form.groups; const i=a.indexOf(g); if(i<0)a.push(g); else a.splice(i,1); render(); }

/* ---- benefit view (FN-01..03) ---- */
function drawerBenefitView(b){

  const verRows = versions.map(v=>'<tr><td>เวอร์ชัน '+v.version+'</td><td>'+fmtDate(v.effFrom)+(v.effTo?(' – '+fmtDate(v.effTo)):' – ปัจจุบัน')+'</td><td>'+(v.unit==='money'?fmtNumber(v.quota)+' บาท':v.unit==='times'?fmtNumber(v.quota)+' ครั้ง':'%')+'</td><td>'+benPill(v.status)+'</td></tr>').join('');
  const acts = (b.status!=='archived'
    ? '<button class="btn btn-sm btn-secondary" onclick="openDrawer(\'benefit-edit\',\''+b.id+'\')"><i data-lucide="pencil" class="w-3.5 h-3.5"></i><span>แก้ไข</span></button>'
      + '<button class="btn btn-sm btn-danger" onclick="openModal(\'archiveBenefit\',\''+b.id+'\')"><i data-lucide="power-off" class="w-3.5 h-3.5"></i><span>ปิดใช้</span></button>'
    : '');
  return ''

function reqCalcHtml(){
  const fm=state.form; const emp=empById(fm.empId), ben=benById(fm.benefitId);
  if(!emp||!ben) return '';
  const elig=eligibility(emp, ben, fm.useDate||null);
  if(!elig.ok) return '<div class="note is-danger" style="margin:6px 0"><i data-lucide="shield-x"></i><div><b>ยื่นไม่ได้:</b> '+esc(elig.reason)+'</div></div>';
  const rem=remaining(emp.id, ben.id);
  const want= ben.unit==='money'? Number(fm.value||0) : Number(fm.amount||0);
  if(rem!=null && want>rem){
    const remTxt = ben.unit==='money'? fmtNumber(rem)+' บาท' : fmtNumber(rem)+' ครั้ง';
    return '<div class="note is-danger" style="margin:6px 0"><i data-lucide="alert-octagon"></i><div><b>เกินคงเหลือ:</b> คงเหลือ '+remTxt+' — ขอใช้เกินสิทธิ์ ตัดคงเหลือไม่ได้</div></div>';
  }
  const remTxt = rem==null?'ไม่จำกัด': (ben.unit==='money'? fmtNumber(rem)+' บาท' : fmtNumber(rem)+' ครั้ง');
  return '<div class="note is-success" style="margin:6px 0"><i data-lucide="shield-check"></i><div>มีสิทธิ์ · คงเหลือ <b>'+remTxt+'</b> (ปีสิทธิ์ 2569) — ตัดคงเหลือเมื่ออนุมัติเท่านั้น</div></div>';
}

function reqHistoryTab(r){
  const audit=buildAudit(r);
  return sec('history','ประวัติ (append-only)', '<div class="timeline">'+audit.map(a=>'<div class="tl-item"><div class="tl-dot '+(a.t==='ok'?'is-success':a.t==='bad'?'is-warning':'')+'"></div><div class="tl-title">'+esc(a.title)+'</div><div class="tl-meta">'+esc(a.meta)+'</div></div>').join('')+'</div>');
}
function buildAudit(r){
  const a=[{t:'ok',title:'สร้างคำขอ '+r.id, meta:'โดยผู้ยื่น · '+fmtDate(r.createdAt)}];
  (r.approvals||[]).forEach(x=>{ if(x.status==='approved') a.push({t:'ok',title:'อนุมัติขั้น '+x.step+' ('+x.role+')', meta:(x.person?x.person.name:'')+' · '+fmtDate(x.at)});
    if(x.status==='rejected') a.push({t:'bad',title:'ไม่อนุมัติขั้น '+x.step, meta:(x.person?x.person.name:'')+' · '+fmtDate(x.at)}); });
  if(r.status==='approved'||r.status==='reversed') a.push({t:'ok',title:'ตัดคงเหลือ + บันทึกมูลค่าเข้า 7C EC + ส่งสถานะจ่าย', meta:'ระบบ (เชื่อม Payroll)'}); // append-only: การอนุมัติเคยเกิดขึ้นจริง ยังคงในประวัติแม้กลับรายการ
  if(r.status==='reversed'){ // OQ-WEL-01: reversal = negative offsetting entry (append-only)
    a.push({t:'bad',title:'กลับรายการ · คืนมูลค่าเข้าเงินได้ (7C · EC)', meta:(r.reverseReason||'')+' · '+fmtDate(r.reversedAt)});
    if(r.payrollClawback) a.push({t:'bad',title:'แจ้ง Payroll ตั้งเบิกคืน', meta:'ปลายทาง Payroll/Expense · display-only (Welfare ไม่จ่ายเอง)'});
  }
  if(r.status==='cancelled') a.push({t:'bad',title:'ยกเลิกคำขอ', meta:'ก่อนอนุมัติ · ไม่กระทบคงเหลือ'});
  if(r.status==='revoked') a.push({t:'bad',title:'ระงับคำขอ (พ้นสภาพ)', meta:r.revokeReason||''});
  return a;
}

function renderModal(){
  const t=state.modal.type, d=state.modal.data;

    const pend=REQUESTS.filter(r=>r.benefitId===d && ['draft','pending'].includes(r.status)).length; // FIX-06
    const warn = pend>0 ? ' — มีคำขอรอดำเนินการ '+pend+' ใบที่อ้างสวัสดิการนี้ ต้องจัดการก่อน' : '';
    return modalConfirm('power-off','is-warning','ปิดใช้ประเภทสวัสดิการ?',
    '“'+esc(b?b.name:'')+'” จะถูกเก็บถาวร (soft archive) — คำขอเก่ายังอ่านได้ ไม่มีการลบข้อมูล'+warn, 'ปิดใช้', 'btn-danger', 'doArchiveBenefit(\''+d+'\')'); }

/* benefit */
function validateBenefit(){
  const fm=state.form; const err={};
  if(!fm.name.trim()) err.name='กรุณากรอกชื่อสวัสดิการ';
  if(fm.unit!=='percent' && (!(Number(fm.quota)>0))) err.quota='โควตา/วงเงินต้องมากกว่า 0';
  if(!fm.effFrom) err.effFrom='กรุณาระบุวันมีผล';
  else if(state.drawer.mode==='benefit-edit'){
    // BR-03 / FN-04 / S-04: ช่วงมีผลของเวอร์ชันใหม่ต้องไม่ทับเวอร์ชันเดิมที่ยังใช้อยู่
    // (ร่างยังไม่ publish → แก้ในที่ ไม่ออกเวอร์ชัน → ไม่ต้องเช็คทับกับตัวเอง)
    const rec=benById(state.drawer.recordId);
    if(rec && rec.status!=='draft'){
      const maxEff=BENEFITS.filter(x=>x.code===rec.code && x.status!=='archived')
        .reduce((m,x)=>x.effFrom>m?x.effFrom:m,'');
      if(maxEff && fm.effFrom<=maxEff)
        err.effFrom='วันมีผลของเวอร์ชันใหม่ต้องหลัง '+fmtDate(maxEff)+' — ช่วงมีผลทับกันไม่ได้';
    }
  }
  if(fm.groups.length===0) err.groups='เลือกอย่างน้อย 1 กลุ่ม';
  fm.err=err; return Object.keys(err).length===0;
}
function benDayBefore(iso){ if(!iso)return null; var d=new Date(iso); if(isNaN(d))return null; d.setDate(d.getDate()-1); return d.toISOString().slice(0,10); }
function benGenId(){ return 'B-'+Math.random().toString(36).slice(2,8).toUpperCase(); }
function benCodeFromName(nm){ var base=String(nm||'').replace(/[^฀-๿a-zA-Z0-9]+/g,'').slice(0,6).toUpperCase(); return 'WEL-'+(base||('NEW'+Math.random().toString(36).slice(2,5).toUpperCase())); }
function submitBenefit(){
  if(!canApprove()) return showToast('สิทธิ์ไม่พอ','warning');   // FIX-04 persona guard
  if(!validateBenefit()){ render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน','warning'); return; }
  const btn=document.getElementById('btn-submit'); lockBtn(btn,'กำลังบันทึก…');
  const isEdit=state.drawer.mode==='benefit-edit'; const fm=Object.assign({},state.form); const recId=state.drawer.recordId;
  const qv = fm.unit==='percent' ? null : Number(fm.quota);
  setTimeout(()=>{
    var wasDraftEdit=false;
    if(isEdit){
      const rec=benById(recId);
      if(rec){
        if(rec.status==='draft'){
          // แก้ร่างแล้วกด "บันทึก" (primary) = เผยแพร่ ร่าง→มีผล (state machine §5) + อัปเดตข้อมูล
          wasDraftEdit=true;
          Object.assign(rec, { name:fm.name, cat:fm.cat, unit:fm.unit, quota:qv,
            coversDep:!!fm.coversDep, groups:(fm.groups||[]).slice(), effFrom:fm.effFrom,
            claimable:fm.unit!=='percent', status:'active' });
        } else {
          // FN-02 / BR-03 · แก้ active = ออกเวอร์ชันใหม่: เวอร์ชัน active เดิม → archived + ปิดช่วงมีผลวันก่อนวันมีผลใหม่
          const same=BENEFITS.filter(x=>x.code===rec.code);
          const maxV=same.reduce((m,x)=>Math.max(m,x.version||1),0);
          same.filter(x=>x.status==='active').forEach(o=>{ o.status='archived'; o.effTo=benDayBefore(fm.effFrom); o.claimable=false; });
          BENEFITS.push({ id:benGenId(), code:rec.code, name:fm.name, cat:fm.cat, unit:fm.unit, quota:qv,
            coversDep:!!fm.coversDep, groups:(fm.groups||[]).slice(), effFrom:fm.effFrom, effTo:null,
            version:maxV+1, status:'active', claimable:fm.unit!=='percent' });
        }
      }
    } else {
      BENEFITS.unshift({ id:benGenId(), code:benCodeFromName(fm.name), name:fm.name, cat:fm.cat, unit:fm.unit, quota:qv,
        coversDep:!!fm.coversDep, groups:(fm.groups||[]).slice(), effFrom:fm.effFrom, effTo:null,
        version:1, status:'active', claimable:fm.unit!=='percent' });
    }
    state.form={}; closeDrawer(); render();
    showToast(isEdit?(wasDraftEdit?'เผยแพร่ประเภทสวัสดิการแล้ว (ร่าง → มีผล)':'บันทึกการแก้ไข (ออกเวอร์ชันใหม่) แล้ว'):'สร้างประเภทสวัสดิการสำเร็จ','success'); }, 500);
}
function saveBenefitDraft(){
  // ร่าง = บันทึกแบบไม่ validate เต็ม (ตั้งใจให้ partial) — push status:'draft' เพื่อให้เห็นในทะเบียน (draft pill)
  const fm=Object.assign({},state.form);
  const qv = fm.unit==='percent' ? null : (fm.quota!=null && fm.quota!=='' ? Number(fm.quota) : null);
  const rec = state.drawer.mode==='benefit-edit' ? benById(state.drawer.recordId) : null;
  if(rec && rec.status==='draft'){
    // แก้ร่างเดิมแล้วกด "บันทึกร่าง" = อัปเดตในที่ · ยังเป็นร่าง (ไม่สร้างร่างซ้ำ)
    Object.assign(rec, { name:fm.name||rec.name, cat:fm.cat||rec.cat, unit:fm.unit||rec.unit, quota:qv,
      coversDep:!!fm.coversDep, groups:(fm.groups||[]).slice(), effFrom:fm.effFrom||rec.effFrom });
  } else {
    BENEFITS.unshift({ id:benGenId(), code:benCodeFromName(fm.name||'ร่าง'), name:fm.name||'(ร่าง) ยังไม่ตั้งชื่อ',
      cat:fm.cat||'—', unit:fm.unit||'money', quota:qv, coversDep:!!fm.coversDep, groups:(fm.groups||[]).slice(),
      effFrom:fm.effFrom||null, effTo:null, version:1, status:'draft', claimable:false });
  }
  state.form={}; closeDrawer(); render(); showToast('บันทึกร่างแล้ว','info');
}
function doArchiveBenefit(id){ if(!canApprove()) return showToast('สิทธิ์ไม่พอ','warning'); /* FIX-04/FIX-06 */ const b=benById(id); if(b)b.status='archived'; closeModal(); if(state.drawer.open)closeDrawer(); render(); showToast('ปิดใช้ (เก็บถาวร) แล้ว','success'); }

/* request */
function validateRequest(){
  const fm=state.form; const err={}; const emp=empById(fm.empId), ben=benById(fm.benefitId);
  if(!fm.empId) err.empId='เลือกพนักงานผู้ยื่น';
  if(fm.useForType==='dependent' && !fm.depId) err.depId='เลือกผู้ติดตาม';
  if(!fm.benefitId) err.benefitId='เลือกประเภทสวัสดิการ';
  if(!fm.useDate) err.useDate='ระบุวันที่ใช้สิทธิ์';
  if(!(Number(fm.value)>0)) err.value='ระบุมูลค่ามากกว่า 0';
  if(ben && ben.unit==='times' && !(Number(fm.amount)>0)) err.amount='ระบุจำนวนครั้ง';
  fm.err=err;
  if(Object.keys(err).length) return {ok:false};
  const elig=eligibility(emp,ben,fm.useDate); if(!elig.ok) return {ok:false, block:elig.reason};
  const rem=remaining(emp.id,ben.id); const want=ben.unit==='money'?Number(fm.value):Number(fm.amount);
  if(rem!=null && want>rem) return {ok:false, block:'เกินคงเหลือ'};
  return {ok:true};
}
function submitRequestForm(){
  const v=validateRequest();
  if(!v.ok){ render(); showToast(v.block?('ยื่นไม่ได้: '+v.block):'กรุณากรอกข้อมูลให้ครบถ้วน','warning'); return; }
  const r=makeRequest('pending'); REQUESTS.unshift(r); const rid=r.id;
  state.form={}; closeDrawer();
  setTimeout(()=>{ openModal('doa', rid); }, 320); // ส่งอนุมัติ → DOA slot picker
}
function saveRequestDraft(){ if(!state.form.empId){ showToast('เลือกพนักงานก่อนบันทึกร่าง','warning'); return; }
  const r=makeRequest('draft'); REQUESTS.unshift(r); state.form={}; closeDrawer(); showToast('บันทึกร่างแล้ว','info'); }
function makeRequest(status){
  const fm=state.form; const ben=benById(fm.benefitId);
  const seq=String(12+REQUESTS.length+16).padStart(4,'0');
  return { id:'REQ-2569-'+seq, empId:fm.empId, useFor:{type:fm.useForType, depId:fm.depId||undefined}, benefitId:fm.benefitId,
    amount: ben&&ben.unit==='times'?Number(fm.amount||1):Number(fm.value||0), value:Number(fm.value||0),
    useDate:fm.useDate, reason:fm.reason, status, pay:'none', files:fm.files.slice(), approvals:[], createdAt: new Date().toISOString().slice(0,10) };
}
function submitDraftDoa(id){ closeDrawer(); setTimeout(()=>openModal('doa',id),300); }
function confirmDoa(id){
  const r=reqById(id); const dd=state.doaDraft;
  const missing=DOA_SLOTS.some(s=>!dd.picks[s.step]);
  if(missing){ showToast('เลือกผู้อนุมัติให้ครบทุกขั้น','warning'); return; }
  r.status='pending';
  r.approvals=DOA_SLOTS.map(s=>{ const p=APPROVERS[s.pool].find(x=>x.key===dd.picks[s.step]);
    return {step:s.step, role:s.role, person:{name:p.name,position:p.position}, status:s.step===1?'current':'pending', at:null}; });
  state.doaDraft=null; closeModal();
  showToast('ส่งอนุมัติแล้ว · แจ้งเตือน HR อัตโนมัติ','success');
  setTimeout(render, 60);
}
function doApprove(id){
  if(!canApprove()) return showToast('สิทธิ์ไม่พอ','warning');                                   // FIX-04 persona guard
  const r=reqById(id);
  if(!r || r.status!=='pending') return showToast('อนุมัติได้เฉพาะคำขอสถานะรออนุมัติ','warning'); // FIX-01 precondition
  const cur=(r.approvals||[]).find(a=>a.status==='current');
  const isLast = cur ? !(r.approvals||[]).some(a=>a.step>cur.step) : true; // ขั้นสุดท้ายเมื่อไม่มีขั้นถัดจาก current
  // FIX-02: re-check eligibility + เพดาน เฉพาะก่อน finalize ขั้นสุดท้าย (EC stamp/ตัดคงเหลือครั้งเดียว)
  if(isLast){
    const emp=empById(r.empId), ben=benById(r.benefitId);
    const elig=eligibility(emp,ben,r.useDate);
    if(!elig.ok) return showToast('อนุมัติไม่ได้: '+elig.reason,'warning');
    const rem=remaining(r.empId,r.benefitId);
    const want=(ben&&ben.unit==='money')?Number(r.value):Number(r.amount);
    if(rem!=null && want>rem) return showToast('คงเหลือไม่พอ ณ วันอนุมัติ','warning');
  }
  const btn=document.getElementById('btn-modal-ok'); lockBtn(btn,'กำลังอนุมัติ…');
  setTimeout(()=>{
    const today=new Date().toISOString().slice(0,10);
    if(cur){ cur.status='approved'; cur.at=today; }                          // FIX-03: advance เฉพาะขั้น current
    if(isLast){
      r.status='approved'; r.pay='pending';                                 // ขั้นสุดท้าย: ตัดคงเหลือ + EC stamp ครั้งเดียว
      closeModal(); if(state.drawer.open)closeDrawer(); render();
      showToast('อนุมัติแล้ว · ตัดคงเหลือ + บันทึกมูลค่าเข้า 7C EC','success');
    } else {
      const next=(r.approvals||[]).filter(a=>a.step>(cur?cur.step:0)).sort((a,b)=>a.step-b.step)[0];
      if(next) next.status='current';                                       // ส่งต่อขั้นถัดไป · r.status คงเป็น pending
      closeModal(); if(state.drawer.open)closeDrawer(); render();
      showToast('อนุมัติขั้น '+(cur?cur.step:'')+' แล้ว · ส่งต่อขั้นถัดไป','success');
    }
  }, 500);
}
function doReject(id){
  if(!canApprove()) return showToast('สิทธิ์ไม่พอ','warning');   // FIX-04 persona guard
  const ta=document.getElementById('rejectReason'); const reason=ta?ta.value.trim():'';
  if(!reason){ const f=document.getElementById('rejectErr'); if(f)f.style.visibility='visible'; return; }
  const r=reqById(id); const btn=document.getElementById('btn-modal-ok'); lockBtn(btn,'กำลังบันทึก…');
  setTimeout(()=>{ r.status='rejected'; r.rejectReason=reason; (r.approvals||[]).forEach(a=>{ if(a.status==='current')a.status='rejected'; });
    closeModal(); if(state.drawer.open)closeDrawer(); render();
    showToast('บันทึกไม่อนุมัติ · แจ้งเตือนผู้ยื่น','success'); }, 400);
}
function doReverse(id){
  if(!canApprove()) return showToast('สิทธิ์ไม่พอ','warning');                                    // FIX-04 persona guard (admin/manager เท่านั้น)
  const r=reqById(id);
  if(!r || r.status!=='approved') return showToast('กลับรายการได้เฉพาะคำขอที่อนุมัติแล้ว','warning'); // OQ-WEL-01: post-approval only · ไม่แตะ FIX-05 (draft/pending = cancel)
  const ta=document.getElementById('reverseReason'); const reason=ta?ta.value.trim():'';
  if(!reason){ const f=document.getElementById('reverseErr'); if(f)f.style.visibility='visible'; return; } // reason required (mirror doReject)
  const btn=document.getElementById('btn-modal-ok'); lockBtn(btn,'กำลังกลับรายการ…');
  setTimeout(()=>{
    const today=new Date().toISOString().slice(0,10); const wasSent=r.pay==='sent';
    // append-only: คงข้อมูลเดิมทั้งหมด เพิ่มเฉพาะสถานะ+เหตุ+เวลา · usedByPerson นับเฉพาะ approved → reversed คืนคงเหลืออัตโนมัติ (ไม่ปรับซ้ำ)
    r.status='reversed'; r.reverseReason=reason; r.reversedAt=today;
    if(wasSent) r.payrollClawback=true;                                                            // display-only flag → แจ้ง Payroll ตั้งเบิกคืน (ไม่จำลองจอ payroll)
    closeModal(); if(state.drawer.open)closeDrawer(); render();
    showToast('กลับรายการแล้ว · คืนสิทธิ์และมูลค่าให้พนักงาน · แจ้งเตือนผู้ยื่น','success');            // NTF-style generic (ไม่มี event id ดิบ #81)
  }, 450);
}
function doCancelRequest(id){
  if(!canApprove()) return showToast('สิทธิ์ไม่พอ','warning');                                              // FIX-04 persona guard
  const r=reqById(id);
  if(!r || !['draft','pending'].includes(r.status)) return showToast('ยกเลิกได้เฉพาะร่าง/รออนุมัติ','warning'); // FIX-05 status guard (reversal หลังอนุมัติ = OQ-WEL-01)
  r.status='cancelled'; closeModal(); if(state.drawer.open)closeDrawer(); render(); showToast('ยกเลิกคำขอแล้ว','success');
}

/* dependent */
function submitDependent(){
  const fm=state.form; const err={};
  if(!fm.name.trim()) err.name='กรุณากรอกชื่อ';
  if(!fm.dob) err.dob='ระบุวันเกิด';
  // FN-06: บุตรอายุเกิน 20 ปี → บล็อก
  if(!err.dob && fm.rel==='บุตร'){ const age=(Date.now()-new Date(fm.dob))/(365.25*864e5); if(age>20) err.dob='บุตรอายุเกิน 20 ปี — เกินเกณฑ์กลุ่ม'; }
  fm.err=err;
  if(Object.keys(err).length){ render(); showToast('ตรวจสอบข้อมูลผู้ติดตาม','warning'); return; }
  const emp=empById(fm.empId); emp.dependents=emp.dependents||[];
  emp.dependents.push({id:'DEP-'+Date.now(), name:fm.name, rel:fm.rel, dob:fm.dob, eligible:fm.eligible});
  state.form={}; closeDrawer(); render(); showToast('เพิ่มผู้ติดตามแล้ว','success');
}
function doRemoveDep(){ const d=state.modal.data; const emp=empById(d.emp); if(emp)emp.dependents=emp.dependents.filter(x=>x.id!==d.dep); closeModal(); render(); showToast('ลบผู้ติดตามแล้ว','success'); }

/* misc */
function lockBtn(btn,label){ if(!btn)return; btn.classList.add('is-disabled'); btn.innerHTML='<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>'+label+'</span>'; renderIcons(); }
function setRole(r){ state.role=r; render(); }
function stubNav(name){ showToast('“'+name+'” เป็น feature ข้างเคียง (context) — อยู่นอกขอบเขตรอบนี้','info'); }
function toggleUserMenu(){ const m=document.getElementById('userMenu'); if(m)m.classList.toggle('is-open'); }
document.addEventListener('click',e=>{ if(!e.target.closest('.user-chip')&&!e.target.closest('.user-menu')){ const m=document.getElementById('userMenu'); if(m)m.classList.remove('is-open'); } });

   COMBOBOX init (Rule #34/#94/#102 · BASE-KIT search-select)

function empOptions(list){ return list.map(e=>({value:e.id, label:e.name, sub:e.position+' · '+e.dept, avatar:initials(e.name)})); } /* FIX-08: avatar #102 */
/* DSP-02 (a): blur ก่อน render — กัน focus-restore (#29) เด้งโฟกัสกลับเข้า ss-input → onfocus=ssOpen เปิด dropdown ซ้ำ (mirror F-HR-TRAIN L2956) */
function ssBlurActive(){ if(document.activeElement&&document.activeElement.blur)document.activeElement.blur(); }
function initCombos(){
  // balance tab
  if(document.getElementById('ss-balEmp')) initSearchSelect('balEmp',{options:empOptions(EMPLOYEES), value:state.balance.empId,
    onSelect:(v)=>{ ssBlurActive(); state.balance.empId=v; render(); }});
  // request drawer
  if(document.getElementById('ss-reqEmp')) initSearchSelect('reqEmp',{options:empOptions(EMPLOYEES), value:state.form.empId,
    onSelect:(v)=>{ ssBlurActive(); state.form.empId=v; state.form.depId=null; render(); }});
  if(document.getElementById('ss-reqDep')){ const e=empById(state.form.empId);
    initSearchSelect('reqDep',{options:(e&&e.dependents||[]).map(d=>({value:d.id,label:d.name,sub:d.rel+' · '+fmtDate(d.dob),avatar:initials(d.name)})), value:state.form.depId, /* FIX-08 */
      onSelect:(v)=>{ ssBlurActive(); state.form.depId=v; render(); }}); }
  if(document.getElementById('ss-reqType')){ const e=empById(state.form.empId);
    const opts=BENEFITS.filter(b=>b.claimable).map(b=>{ const el=e?eligibility(e,b,state.form.useDate||null):{ok:true};
      return {value:b.id, label:b.name, sub:(el.ok?'มีสิทธิ์':'ไม่มีสิทธิ์')+' · '+benUnitLabel(b), icon:'heart-pulse', right: el.ok?'':'✕'}; });
    initSearchSelect('reqType',{options:opts, value:state.form.benefitId,
      onSelect:(v)=>{ ssBlurActive(); state.form.benefitId=v; render(); }}); }
  // DOA slots
  if(state.modal.open && state.modal.type==='doa' && state.doaDraft){
    DOA_SLOTS.forEach(s=>{ if(document.getElementById('ss-doaSlot'+s.step))
      initSearchSelect('doaSlot'+s.step,{options:APPROVERS[s.pool].map(p=>({value:p.key,label:p.name,sub:p.position+' · '+p.dept,avatar:initials(p.name)})), value:state.doaDraft.picks[s.step]||null, /* FIX-08 */
        onSelect:(v)=>{ ssBlurActive(); state.doaDraft.picks[s.step]=v; render(); }}); });
  }
}
