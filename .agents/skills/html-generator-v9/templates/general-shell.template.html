<!-- ============================================ -->
<!-- GENERAL SHELL (No Sidebar — public/standalone) -->
<!-- ============================================ -->
<!-- Use for: marketing pages, public apps, standalone features.
     For ERP features (with sidebar menu), use erp-shell.template.html instead. -->

<style>
/* General shell overrides (no sidebar) */
.main-general {
  min-height: 100vh;
  background: var(--c-bg-off);
}
.shell-bar-general {
  position: sticky;
  top: 0;
  background: #fff;
  border-bottom: 1px solid var(--c-line-2);
  height: 64px;
  display: flex;
  align-items: center;
  padding: 0 32px;
  z-index: 19;
  gap: 12px;
}
.shell-bar-general .brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-weight: 700;
  font-size: 15px;
  color: var(--c-navy);
}
.shell-bar-general .brand-logo {
  width: 34px; height: 34px;
  background: linear-gradient(135deg, #FF3B30, #FF9A1F);
  border-radius: 9px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  box-shadow: 0 4px 12px rgba(255,59,48,0.3);
}
.content-general {
  padding: 32px;
  max-width: 1200px;
  margin: 0 auto;
}
</style>

<!-- ===== MAIN (no sidebar) ===== -->
<main class="main-general">

  <!-- ===== SHELL BAR (lighter — brand + actions) ===== -->
  <header class="shell-bar-general">
    <!-- Left: Brand -->
    <div class="brand">
      <div class="brand-logo">
        <i data-lucide="box" class="w-4 h-4"></i>
      </div>
      <span>{{BRAND_NAME}}</span>
    </div>

    <!-- Right: Actions -->
    <div style="display: flex; align-items: center; gap: 6px; margin-left: auto;">
      <button class="btn btn-ghost">Sign in</button>
      <button class="btn btn-primary">Get started</button>
    </div>
  </header>

  <!-- ===== CONTENT ===== -->
  <div class="content-general" id="page-content">
    <!-- Page Header -->
    <div class="ph">
      <div>
        <div class="ph-title-row">
          <h1 class="ph-title">{{PAGE_TITLE}}</h1>
        </div>
        <p class="ph-sub">{{PAGE_SUBTITLE}}</p>
      </div>
      <div class="ph-actions">
        <button class="btn btn-primary">{{PRIMARY_ACTION_LABEL}}</button>
      </div>
    </div>

    <!-- Content area -->
    <div class="card">
      <!-- Content placeholder — replace with pattern HTML -->
    </div>
  </div>
</main>
