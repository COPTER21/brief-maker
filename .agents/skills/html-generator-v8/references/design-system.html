<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2BSimple Design System · CUBE NATIVE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ============== CSS VARIABLES (CUBE NATIVE CI) ============== */
:root {
  --c-navy: #111111;
  --c-navy-2: #111111;
  --c-primary: #FF3B30;
  --c-primary-hover: #E62E24;
  --c-teal: #FF9A1F;
  --c-teal-light: #FFB763;
  --c-ink: #111111;
  --c-mute: #54565C;
  --c-mute-2: #73757B;
  --c-mute-3: #9A9CA2;
  --c-line: #DEDAD4;
  --c-line-2: #E9E5E0;
  --c-line-3: #F1EEEA;
  --c-bg-off: #FAF8F5;
  --c-success: #1F9D55;
  --c-warning: #E8870F;
  --c-danger: #E62E24;
  --sidebar-w: 232px;
  --shell-h: 52px;
}

/* ============== RESET ============== */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Satoshi', 'Noto Sans Thai', system-ui, sans-serif;
  background: var(--c-bg-off);
  color: #2A2B2F;
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-width: 1180px;
}
a { text-decoration: none; color: inherit; }
button { font-family: inherit; cursor: pointer; }
[data-lucide] { flex-shrink: 0; }
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type="number"] { -moz-appearance: textfield; }

/* ============== SIDEBAR ============== */
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: var(--sidebar-w);
  background: #111111;
  color: #E9E5E0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  border-right: 1px solid rgba(255,255,255,0.06);
}
.sb-brand {
  padding: 18px;
  display: flex;
  align-items: center;
  gap: 11px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  flex-shrink: 0;
}
.sb-logo {
  width: 34px; height: 34px;
  background: linear-gradient(135deg, #FF3B30, #FF9A1F);
  border-radius: 9px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(255,59,48,0.3);
}
.sb-name { font-weight: 700; font-size: 14px; color: #fff; letter-spacing: -0.01em; line-height: 1.2; }
.sb-sub { font-size: 10px; color: #9A9CA2; letter-spacing: 0.06em; font-weight: 600; text-transform: uppercase; margin-top: 2px; }
.sb-nav { flex: 1; padding: 12px 8px; overflow-y: auto; }

.sb-module { margin-bottom: 4px; }
.sb-module-header {
  display: flex; align-items: center; gap: 8px;
  width: 100%;
  padding: 8px 10px;
  border-radius: 6px;
  background: transparent; border: 0;
  color: #9A9CA2;
  font-family: inherit;
  font-size: 10.5px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
  cursor: pointer; transition: all 120ms;
  text-align: left;
}
.sb-module-header:hover { background: rgba(255,255,255,0.04); color: #DEDAD4; }
.sb-module-header .mod-icon { flex-shrink: 0; opacity: 0.7; }
.sb-module-header .mod-label { flex: 1; }
.sb-module-header .mod-chevron {
  flex-shrink: 0;
  transition: transform 200ms;
  opacity: 0.7;
}
.sb-module[data-expanded="false"] .mod-chevron { transform: rotate(-90deg); }
.sb-module[data-expanded="false"] .sb-features { display: none; }
.sb-features { padding: 2px 0 6px 0; }
.sb-item {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 12px 7px 14px;
  border-radius: 6px;
  color: #DEDAD4;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 120ms;
  margin-bottom: 1px;
  position: relative;
  user-select: none;
}
.sb-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.sb-item.is-active {
  background: #FF3B30;
  color: #fff;
  font-weight: 600;
}
.sb-item [data-lucide] { width: 15px; height: 15px; opacity: 0.85; }
.sb-footer {
  padding: 12px 16px;
  border-top: 1px solid rgba(255,255,255,0.06);
  font-size: 10.5px;
  color: #73757B;
  letter-spacing: 0.04em;
}
.sb-footer-ver { color: #9A9CA2; font-weight: 600; }

/* ============== APP LAYOUT ============== */
.app {
  margin-left: var(--sidebar-w);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ============== SHELL BAR ============== */
.shell-bar {
  position: sticky;
  top: 0;
  height: var(--shell-h);
  background: #fff;
  border-bottom: 1px solid var(--c-line-2);
  z-index: 19;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  gap: 16px;
}
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--c-mute);
}
.breadcrumb a { color: var(--c-mute); transition: color 120ms; cursor: pointer; }
.breadcrumb a:hover { color: var(--c-primary); }
.breadcrumb [data-lucide] { width: 14px; height: 14px; color: var(--c-mute-3); }
.breadcrumb-current { color: var(--c-ink); font-weight: 600; }
.shell-right { display: flex; align-items: center; gap: 8px; position: relative; }
.icon-btn {
  width: 36px; height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 0;
  border-radius: 8px;
  color: var(--c-mute);
  transition: all 120ms;
  position: relative;
}
.icon-btn:hover { background: var(--c-line-3); color: var(--c-ink); }
.icon-btn [data-lucide] { width: 18px; height: 18px; }
.icon-btn .dot-notif {
  position: absolute;
  top: 8px; right: 9px;
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--c-danger);
  border: 2px solid #fff;
}
.user-chip {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 4px 11px 4px 4px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 120ms;
}
.user-chip:hover { background: var(--c-line-3); }
.user-avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--c-primary), var(--c-teal));
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 600;
  flex-shrink: 0;
}
.user-chip-text { line-height: 1.2; }
.user-chip-name { font-size: 12.5px; font-weight: 600; color: var(--c-ink); }
.user-chip-role { font-size: 10.5px; color: var(--c-mute-2); margin-top: 1px; }

/* ============== CONTENT ============== */
.content {
  padding: 22px;
  flex: 1;
}

/* ============== PAGE HEADER ============== */
.ph {
  margin-bottom: 18px;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: flex-start;
  gap: 14px;
}
.ph > div:first-child { flex: 1 1 auto; min-width: 280px; }
.ph-title-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 5px;
}
.ph-title {
  font-family: 'Noto Sans Thai', sans-serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--c-navy);
  margin: 0;
  letter-spacing: -0.01em;
}
.ph-count {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--c-mute-2);
  background: var(--c-line-3);
  padding: 3px 9px;
  border-radius: 999px;
}
.ph-sub { font-size: 13px; color: var(--c-mute); margin: 0; }
.ph-actions { display: flex; gap: 8px; flex-shrink: 0; }

/* ============== BUTTONS ============== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 36px;
  padding: 0 14px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 500;
  border: 1px solid transparent;
  background: transparent;
  white-space: nowrap;
  transition: all 120ms;
  user-select: none;
}
.btn [data-lucide] { width: 15px; height: 15px; }
.btn-primary { background: var(--c-primary); color: #fff; }
.btn-primary:hover { background: var(--c-primary-hover); box-shadow: 0 2px 8px rgba(255,59,48,0.30); }
.btn-secondary { background: #fff; border-color: var(--c-line); color: var(--c-ink); }
.btn-secondary:hover { background: var(--c-line-3); border-color: var(--c-mute-2); }
.btn-ghost { color: var(--c-mute); }
.btn-ghost:hover { background: var(--c-line-3); color: var(--c-ink); }
.btn-danger { background: #fff; border-color: var(--c-line); color: var(--c-danger); }
.btn-danger:hover { background: #FFE9E7; border-color: var(--c-danger); }
.btn-link { background: transparent; border: 0; padding: 0 4px; height: auto; color: var(--c-primary); font-weight: 500; }
.btn-link:hover { text-decoration: underline; }
.btn-sm { height: 30px; padding: 0 11px; font-size: 12px; }
.btn-teal { background: var(--c-teal); color: #fff; }
.btn-teal:hover { background: #008F78; box-shadow: 0 2px 8px rgba(255,154,31,0.30); }

/* ============== STATS ============== */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}
.stat {
  background: #fff;
  border: 1px solid var(--c-line-2);
  border-radius: 10px;
  padding: 14px 16px;
  transition: all 150ms;
}
.stat:hover { border-color: var(--c-line); box-shadow: 0 2px 8px rgba(17,17,17,0.05); }
.stat-label {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 500; color: var(--c-mute);
}
.stat-label [data-lucide] { width: 13px; height: 13px; color: var(--c-primary); }
.stat-value {
  font-size: 26px; font-weight: 700;
  color: var(--c-navy);
  margin-top: 6px;
  letter-spacing: -0.01em;
}
.stat-meta {
  font-size: 11.5px; color: var(--c-mute-2);
  margin-top: 5px;
  display: flex; align-items: center; gap: 4px;
}
.stat-meta.is-up { color: var(--c-success); }
.stat-meta.is-down { color: var(--c-danger); }
.stat-meta [data-lucide] { width: 12px; height: 12px; }

/* ============== CARD ============== */
.card {
  background: #fff;
  border: 1px solid var(--c-line-2);
  border-radius: 10px;
  overflow: hidden;
}

/* ============== VARIANT TABS (Design system specific) ============== */
.variant-bar {
  background: #fff;
  border: 1px solid var(--c-line-2);
  border-radius: 10px;
  margin-bottom: 16px;
  padding: 14px 18px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
}
.variant-bar-label {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--c-mute);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  flex-shrink: 0;
}
.variant-tabs {
  display: inline-flex;
  background: var(--c-bg-off);
  border: 1px solid var(--c-line-2);
  border-radius: 8px;
  padding: 3px;
  gap: 2px;
  flex-wrap: wrap;
}
.variant-tab {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: 6px;
  background: transparent;
  border: 0;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--c-mute);
  transition: all 120ms;
  white-space: nowrap;
}
.variant-tab:hover { color: var(--c-ink); }
.variant-tab.is-active {
  background: #fff;
  color: var(--c-primary);
  font-weight: 600;
  box-shadow: 0 1px 3px rgba(17,17,17,0.08);
}
.variant-tab [data-lucide] { width: 13px; height: 13px; }

.variant-meta {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 12px;
  color: var(--c-mute);
}
.variant-meta-item { display: inline-flex; align-items: center; gap: 5px; }
.variant-meta-item [data-lucide] { width: 13px; height: 13px; color: var(--c-mute-2); }

.variant-spec {
  background: #fff;
  border: 1px solid var(--c-line-2);
  border-radius: 10px;
  margin-bottom: 16px;
  padding: 14px 18px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
}
.vs-item { display: flex; flex-direction: column; gap: 3px; }
.vs-label {
  font-size: 11px;
  font-weight: 700;
  color: var(--c-mute);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.vs-value {
  font-size: 13px;
  color: var(--c-ink);
  font-weight: 500;
}
.vs-value code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  background: var(--c-line-3);
  padding: 1px 6px;
  border-radius: 4px;
  color: var(--c-navy);
}

/* ============== SHOWCASE FRAME ============== */
.showcase {
  background: var(--c-bg-off);
  border: 1px dashed var(--c-line);
  border-radius: 12px;
  padding: 24px;
  position: relative;
  min-height: 280px;
}
.showcase-tag {
  position: absolute;
  top: 10px; right: 12px;
  background: var(--c-navy);
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 4px;
}

/* ============== FILTER BAR ============== */
.filter-bar {
  padding: 14px 18px;
  display: flex;
  gap: 10px;
  align-items: center;
  border-bottom: 1px solid var(--c-line-2);
  background: #fff;
  flex-wrap: wrap;
}

/* ============== INPUTS ============== */
.input, .select {
  height: 36px;
  padding: 0 12px;
  border: 1px solid var(--c-line);
  border-radius: 8px;
  font-size: 13px;
  background: #fff;
  color: var(--c-ink);
  font-family: inherit;
  transition: all 120ms;
  width: 100%;
}
.input:focus, .select:focus {
  outline: none;
  border-color: var(--c-primary);
  box-shadow: 0 0 0 3px rgba(255,59,48,0.10);
}
.select {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2364748B' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat;
  background-position: right 10px center;
  padding-right: 32px;
  appearance: none;
}
.input-search { position: relative; flex: 1; max-width: 320px; }
.input-search input { padding-left: 36px; }
.input-search .lead-icon {
  position: absolute;
  left: 11px; top: 50%;
  transform: translateY(-50%);
  width: 15px; height: 15px;
  color: var(--c-mute-2);
  pointer-events: none;
}
textarea.input {
  height: auto;
  min-height: 88px;
  padding: 10px 12px;
  resize: vertical;
}

/* ============== TABLE ============== */
.table-scroll { overflow-x: auto; }
.table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.table thead { background: var(--c-bg-off); }
.table th {
  padding: 11px 14px;
  text-align: left;
  font-weight: 600;
  color: var(--c-mute);
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border-bottom: 1px solid var(--c-line-2);
  white-space: nowrap;
}
.table th.col-check { width: 40px; padding-right: 0; }
.table th.is-sortable { cursor: pointer; user-select: none; }
.table th.is-sortable:hover { color: var(--c-ink); background: var(--c-line-3); }
.table th .sort-arrow { display: inline-block; margin-left: 4px; opacity: 0.4; }
.table th.is-sorted .sort-arrow { opacity: 1; color: var(--c-primary); }
.table td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--c-line-2);
  color: var(--c-ink);
  vertical-align: middle;
}
.table tbody tr { transition: background 120ms; }
.table tbody tr:hover { background: var(--c-bg-off); }
.table tbody tr:last-child td { border-bottom: 0; }

/* ============== CHECKBOX ============== */
.cb {
  width: 16px; height: 16px;
  border: 1.5px solid var(--c-line);
  border-radius: 4px;
  background: #fff;
  cursor: pointer;
  display: inline-block;
  position: relative;
  transition: all 120ms;
  flex-shrink: 0;
}
.cb.is-checked { background: var(--c-primary); border-color: var(--c-primary); }
.cb.is-checked::after {
  content: '';
  position: absolute;
  left: 4px; top: 1px;
  width: 5px; height: 9px;
  border: solid #fff;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

/* ============== USER CELL ============== */
.user-cell { display: flex; align-items: center; gap: 10px; }
.uc-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--c-primary), var(--c-teal));
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 11.5px;
  font-weight: 600;
  flex-shrink: 0;
}
.uc-name { font-weight: 600; color: var(--c-ink); font-size: 13px; line-height: 1.3; }
.uc-email { font-size: 12px; color: var(--c-mute-2); margin-top: 1px; line-height: 1.3; }

/* ============== PILLS ============== */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 9px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 600;
  white-space: nowrap;
}
.pill [data-lucide] { width: 11px; height: 11px; }
.pill-registered { background: #E6F0FF; color: #1A5FCC; }
.pill-active { background: #E6F0FF; color: #1A5FCC; }
.pill-converted { background: #E4F4EB; color: #157A41; }
.pill-suspended { background: #FFF1DD; color: #B8690B; }
.pill-archived { background: var(--c-line-3); color: var(--c-mute-2); }
.pill-danger { background: #FFE9E7; color: var(--c-danger); }

.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  display: inline-block;
}
.dot.is-active { background: #2B7FFF; box-shadow: 0 0 0 2.5px rgba(37,99,235,0.18); }
.dot.is-converted { background: #157A41; box-shadow: 0 0 0 2.5px rgba(6,95,70,0.20); }
.dot.is-suspended { background: var(--c-warning); }
.dot.is-archived { background: var(--c-mute-3); }

/* ============== ROW ACTIONS ============== */
.row-actions { display: inline-flex; gap: 2px; }
.ra-btn {
  width: 28px; height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 0;
  color: var(--c-mute-2);
  border-radius: 6px;
  transition: all 120ms;
}
.ra-btn:hover { background: var(--c-line-3); color: var(--c-primary); }
.ra-btn.is-danger:hover { background: #FFE9E7; color: var(--c-danger); }
.ra-btn [data-lucide] { width: 15px; height: 15px; }

/* ============== TABLE FOOTER ============== */
.table-footer {
  padding: 12px 18px;
  background: var(--c-bg-off);
  border-top: 1px solid var(--c-line-2);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12.5px;
  color: var(--c-mute);
  flex-wrap: wrap;
  gap: 10px;
}
.pagination { display: inline-flex; gap: 4px; align-items: center; }
.pg-btn {
  min-width: 30px; height: 30px;
  padding: 0 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #fff;
  border: 1px solid var(--c-line-2);
  border-radius: 6px;
  color: var(--c-mute);
  font-size: 12.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all 120ms;
}
.pg-btn:hover { border-color: var(--c-line); background: var(--c-bg-off); }
.pg-btn.is-active { background: var(--c-primary); border-color: var(--c-primary); color: #fff; }
.pg-btn [data-lucide] { width: 13px; height: 13px; }

/* ============== DRAWER ============== */
.drawer-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(17,17,17,0.40);
  z-index: 50;
  opacity: 0;
  pointer-events: none;
  transition: opacity 220ms;
}
.drawer-backdrop.is-open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 540px;
  background: #fff;
  z-index: 51;
  transform: translateX(100%);
  transition: transform 280ms cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;

<script>
(function loadLucide() {
  var version = '0.469.0';
  var cdns = [
    'https://unpkg.com/lucide@' + version + '/dist/umd/lucide.min.js',
    'https://cdn.jsdelivr.net/npm/lucide@' + version + '/dist/umd/lucide.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/lucide/' + version + '/lucide.min.js'
  ];
  var i = 0;
  function tryNext() {
    if (i >= cdns.length) {
      console.warn('[Lucide] All CDNs failed.');
      window.lucide = window.lucide || { createIcons: function() {} };
      window.dispatchEvent(new Event('lucide:ready'));
      return;
    }
    var s = document.createElement('script');
    s.src = cdns[i++];
    s.onload = function() { window.dispatchEvent(new Event('lucide:ready')); };
    s.onerror = tryNext;
    document.head.appendChild(s);
  }
  tryNext();
})();
</script>

// ============================================
// RENDER PRESERVATION (Iron Rule #29)
// ============================================
function preserveRenderState() {
  const drawerBody = document.querySelector('.drawer-body');
  const modalBody = document.querySelector('.modal-body');
  const activeEl = document.activeElement;
  const isInput = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA');
  return {
    drawerScroll: drawerBody ? drawerBody.scrollTop : 0,
    modalScroll: modalBody ? modalBody.scrollTop : 0,
    pageScroll: window.scrollY,
    focusKey: isInput ? {
      placeholder: activeEl.placeholder || '',
      type: activeEl.type || '',
      name: activeEl.name || '',
      selStart: activeEl.selectionStart,
      selEnd: activeEl.selectionEnd,
    } : null,
  };
}
function restoreRenderState(snap) {
  if (!snap) return;
  requestAnimationFrame(function() {
    const dBody = document.querySelector('.drawer-body');
    if (dBody && snap.drawerScroll > 0) dBody.scrollTop = snap.drawerScroll;
    const mBody = document.querySelector('.modal-body');
    if (mBody && snap.modalScroll > 0) mBody.scrollTop = snap.modalScroll;
    if (snap.pageScroll > 0) window.scrollTo(0, snap.pageScroll);
    if (snap.focusKey) {
      const candidates = document.querySelectorAll('input, textarea');
      for (let i = 0; i < candidates.length; i++) {
        const c = candidates[i];
        if ((c.placeholder || '') === snap.focusKey.placeholder
            && (c.type || '') === snap.focusKey.type
            && (c.name || '') === snap.focusKey.name) {
          c.focus();
          if (snap.focusKey.selStart != null && typeof c.setSelectionRange === 'function') {
            try { c.setSelectionRange(snap.focusKey.selStart, snap.focusKey.selEnd); } catch(e) {}
          }
          break;
        }
      }
    }
  });
}

    forms:      'Form patterns — Create flows (Drawer), Edit, และ Field library',

function countVariants(modId) {
  let n = 0;
  NAV.find(m => m.id === modId).features.forEach(f => {
    const c = CONTENT[f.id];
    if (c && c.variants) n += c.variants.length;
  });
  return n;
}

// ---------- CHARTS (SVG inline) ----------
function renderInlineBarChart() {
  const data = [42, 65, 28, 88, 54, 73, 36, 95, 60, 47, 82, 68];
  const labels = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const max = 100;
  const w = 700, h = 240, p = 30;
  const bw = (w - p*2) / data.length;
  return `<svg viewBox="0 0 ${w} ${h}" class="chart-svg">
    ${[0,25,50,75,100].map(v => `
      <line x1="${p}" y1="${h-p - (v/max)*(h-p*2)}" x2="${w-p}" y2="${h-p - (v/max)*(h-p*2)}" stroke="#E9E5E0" stroke-dasharray="3,3"/>
      <text x="${p-6}" y="${h-p - (v/max)*(h-p*2) + 3}" text-anchor="end" font-size="10" fill="#9A9CA2" font-family="Satoshi">${v}</text>
    `).join('')}
    ${data.map((v,i) => `
      <rect x="${p + i*bw + bw*0.18}" y="${h-p - (v/max)*(h-p*2)}" width="${bw*0.64}" height="${(v/max)*(h-p*2)}" fill="#FF3B30" rx="2"/>
      <text x="${p + i*bw + bw/2}" y="${h-p+14}" text-anchor="middle" font-size="10" fill="#73757B" font-family="Satoshi">${labels[i]}</text>
    `).join('')}
  </svg>`;
}

function renderInlineLineChart() {
  const data = [40, 52, 48, 65, 72, 68, 80, 76, 88, 92, 85, 98];
  const max = 100;
  const w = 500, h = 240, p = 30;
  const sx = (w - p*2) / (data.length - 1);
  const points = data.map((v,i) => `${p + i*sx},${h-p - (v/max)*(h-p*2)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" class="chart-svg">
    ${[0,25,50,75,100].map(v => `
      <line x1="${p}" y1="${h-p - (v/max)*(h-p*2)}" x2="${w-p}" y2="${h-p - (v/max)*(h-p*2)}" stroke="#E9E5E0" stroke-dasharray="3,3"/>
    `).join('')}
    <polyline points="${points}" fill="none" stroke="#FF3B30" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${data.map((v,i) => `<circle cx="${p + i*sx}" cy="${h-p - (v/max)*(h-p*2)}" r="3.5" fill="#fff" stroke="#FF3B30" stroke-width="2"/>`).join('')}
  </svg>`;
}

function renderInlinePieChart() {
  const data = [
    { l:'Solo', v:42, c:'#FF3B30' },
    { l:'Team', v:34, c:'#FF9A1F' },
    { l:'Enterprise', v:24, c:'#FFB763' },
  ];
  const total = data.reduce((a,b) => a+b.v, 0);
  let cum = 0;
  const cx=180, cy=120, r=80;
  return `<svg viewBox="0 0 360 240" class="chart-svg" style="height:240px;">
    ${data.map(d => {
      const start = cum / total * 2 * Math.PI;
      cum += d.v;
      const end = cum / total * 2 * Math.PI;
      const x1 = cx + r * Math.sin(start);
      const y1 = cy - r * Math.cos(start);
      const x2 = cx + r * Math.sin(end);
      const y2 = cy - r * Math.cos(end);
      const large = (end - start) > Math.PI ? 1 : 0;
      return `<path d="M ${cx} ${cy} L ${x1} ${y1} A ${r} ${r} 0 ${large} 1 ${x2} ${y2} Z" fill="${d.c}" stroke="#fff" stroke-width="2"/>`;
    }).join('')}
    <circle cx="${cx}" cy="${cy}" r="40" fill="#fff"/>
    <text x="${cx}" y="${cy-2}" text-anchor="middle" font-size="18" font-weight="700" fill="#111111" font-family="Satoshi">${total}</text>
    <text x="${cx}" y="${cy+14}" text-anchor="middle" font-size="11" fill="#73757B" font-family="Satoshi">Total</text>
  </svg>
  <div class="legend">
    ${data.map(d => `<div class="legend-item"><span class="legend-dot" style="background:${d.c};"></span>${d.l} (${d.v}%)</div>`).join('')}
  </div>`;
}

function renderInlineAreaChart() {
  const data = [22, 28, 35, 42, 38, 48, 56, 62, 68, 64, 72, 80, 78, 84, 92, 88, 80, 72, 64, 58, 50, 42, 36, 28];
  const max = 100;
  const w = 700, h = 240, p = 30;
  const sx = (w - p*2) / (data.length - 1);
  const points = data.map((v,i) => `${p + i*sx},${h-p - (v/max)*(h-p*2)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" class="chart-svg">
    <defs>
      <linearGradient id="areaG" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#FF3B30" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#FF3B30" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${[0,25,50,75,100].map(v => `
      <line x1="${p}" y1="${h-p - (v/max)*(h-p*2)}" x2="${w-p}" y2="${h-p - (v/max)*(h-p*2)}" stroke="#E9E5E0" stroke-dasharray="3,3"/>
    `).join('')}
    <polygon points="${p},${h-p} ${points} ${w-p},${h-p}" fill="url(#areaG)"/>
    <polyline points="${points}" fill="none" stroke="#FF3B30" stroke-width="2.5"/>
  </svg>`;
}

function renderInlineSparkline(seed) {
  const datasets = [
    [40,42,38,48,52,55,60,58,65,72,68,80],
    [25,30,28,35,40,45,42,50,55,58,62,68],
    [10,15,20,28,35,40,38,50,62,75,82,95],
  ];
  const data = datasets[seed % 3];
  const max = 100;
  const w = 240, h = 60;
  const sx = w / (data.length - 1);
  const points = data.map((v,i) => `${i*sx},${h - (v/max)*h}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:60px;">
    <polyline points="${points}" fill="none" stroke="#FF9A1F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>`;
}

// ============================================
// MODAL RENDERER
// ============================================
function renderModal() {
  if (!state.modal.open) {
    document.getElementById('modal').innerHTML = '';
    return;
  }
  const k = state.modal.kind;
  let html = '';

  if (k === 'confirm') {
    html = `
      <div class="modal-header">
        <div class="modal-header-icon"><i data-lucide="info" class="w-3.5 h-3.5"></i></div>
        <div>
          <h3 class="modal-title">ยืนยันการดำเนินการ</h3>
          <p class="modal-subtitle">คุณต้องการบันทึกการเปลี่ยนแปลงนี้หรือไม่? ระบบจะอัพเดทข้อมูลทันที</p>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">ยกเลิก</button>
        <button class="btn btn-primary" onclick="closeModal();showToast('บันทึกสำเร็จ','success');">ยืนยัน</button>
      </div>
    `;
  }
  else if (k === 'delete') {
    html = `
      <div class="modal-header">
        <div class="modal-header-icon is-danger"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></div>
        <div>
          <h3 class="modal-title">ลบรายการนี้?</h3>
          <p class="modal-subtitle">การลบนี้ <strong>ไม่สามารถยกเลิกได้</strong> ข้อมูลทั้งหมดจะหายถาวร</p>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">ยกเลิก</button>
        <button class="btn btn-primary" style="background:var(--c-danger);" onclick="closeModal();showToast('ลบแล้ว','error');"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i>ลบ</button>
      </div>
    `;
  }
  else if (k === 'warning') {
    html = `
      <div class="modal-header">
        <div class="modal-header-icon is-warning"><i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i></div>

          <h3 class="modal-title">ระวัง: ข้อมูลอาจสูญหาย</h3>
          <p class="modal-subtitle">มีการแก้ไขที่ยังไม่บันทึก ต้องการออกจากหน้านี้หรือไม่?</p>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">อยู่ต่อ</button>
        <button class="btn btn-danger" onclick="closeModal();showToast('ออกจากหน้านี้แล้ว','warning');">ออกโดยไม่บันทึก</button>
      </div>
    `;
  }
  else if (k === 'success') {
    html = `
      <div class="modal-header">
        <div class="modal-header-icon is-success"><i data-lucide="check-circle-2" class="w-3.5 h-3.5"></i></div>
        <div>
          <h3 class="modal-title">ทำสำเร็จ!</h3>
          <p class="modal-subtitle">บันทึกข้อมูลและส่ง notification ให้ผู้เกี่ยวข้องเรียบร้อยแล้ว</p>
        </div>
      </div>
      <div class="modal-body">
        <div class="card" style="padding:14px; background:var(--c-bg-off);">
          <div style="font-size:12px;color:var(--c-mute);">รหัสรายการ</div>
          <div style="font-size:15px;font-weight:700;color:var(--c-navy);font-family:'JetBrains Mono';">REQ-2026-00892</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-primary" onclick="closeModal()">ตกลง</button>
      </div>
    `;
  }
  else if (k === 'quickadd') {
    html = `
      <div class="modal-header">
        <div class="modal-header-icon"><i data-lucide="plus-square" class="w-3.5 h-3.5"></i></div>
        <div>
          <h3 class="modal-title">เพิ่ม Tag ใหม่</h3>
          <p class="modal-subtitle">Tag จะใช้ได้ทั่วระบบ — ไม่สามารถลบได้ภายหลัง</p>
        </div>

      <div class="modal-body">
        <div class="field"><label class="field-label">ชื่อ Tag <span class="req">*</span></label><input class="input" placeholder="เช่น VIP, Premium"></div>
        <div class="field" style="margin-bottom:0;"><label class="field-label">สี</label>
          <div style="display:flex;gap:6px;">
            ${['#FF3B30','#FF9A1F','#E8870F','#E62E24','#7C3AED','#54565C'].map(c => `
              <div style="width:30px;height:30px;border-radius:6px;background:${c};cursor:pointer;border:2px solid ${c==='#FF3B30'?'var(--c-navy)':'transparent'};"></div>
            `).join('')}
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">ยกเลิก</button>
        <button class="btn btn-primary" onclick="closeModal();showToast('เพิ่ม Tag แล้ว','success');"><i data-lucide="check" class="w-3.5 h-3.5"></i>บันทึก</button>

        <div class="field" style="margin-bottom:0;"><input class="input" value="ชื่อปัจจุบัน" placeholder="กรอกชื่อใหม่"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal()">ยกเลิก</button>
        <button class="btn btn-primary" onclick="closeModal();showToast('เปลี่ยนชื่อแล้ว','success');">บันทึก</button>
      </div>

  document.getElementById('modal').innerHTML = html;
  renderIcons();

// ============================================
// MAIN RENDER
// ============================================
function render() {
  const snap = preserveRenderState();

  renderSidebar();
  renderBreadcrumb();

  const route = state.route;
  const feature = CONTENT[route];

  let html = '';

  if (feature && feature.custom) {
    // Special pages (home overview)
    html = `
      <div class="ph">
        <div>
          <div class="ph-title-row">
            <h1 class="ph-title">${feature.title}</h1>
          </div>
          <p class="ph-sub">${feature.sub}</p>
        </div>
      </div>
      ${feature.custom()}
    `;
  } else if (feature && feature.variants) {
    const v = feature.variants[state.variant] || feature.variants[0];
    const bodyHtml = typeof v.body === 'function' ? v.body() : (v.body || '');

    // Variant bar
    const variantBar = `
      <div class="variant-bar">
        <div class="variant-bar-label">Variants</div>
        <div class="variant-tabs">
          ${feature.variants.map((vv, i) => `
            <button class="variant-tab ${i===state.variant?'is-active':''}" onclick="setVariant(${i})">
              <i data-lucide="${vv.icon}" class="w-3.5 h-3.5"></i>${vv.label}
            </button>
          `).join('')}
        </div>
        <div class="variant-meta">
          <span class="variant-meta-item"><i data-lucide="hash" class="w-3.5 h-3.5"></i>${state.variant+1} / ${feature.variants.length}</span>
        </div>
      </div>
    `;

    // Spec card
    const specEntries = Object.entries(v.spec || {});
    const specCard = specEntries.length ? `
      <div class="variant-spec">
        ${specEntries.map(([k, val]) => `
          <div class="vs-item">
            <div class="vs-label">${k}</div>
            <div class="vs-value">${val.startsWith('var(') || val.startsWith('#') || val.includes('px') || val.includes('ms') ? `<code>${val}</code>` : val}</div>
          </div>
        `).join('')}
      </div>
    ` : '';

    html = `
      <div class="ph">
        <div>
          <div class="ph-title-row">
            <h1 class="ph-title">${feature.title}</h1>
          </div>
          <p class="ph-sub">${feature.sub}</p>
        </div>
      </div>
      ${variantBar}
      ${specCard}
      ${bodyHtml}
    `;
  } else {
    html = `<div class="empty"><div class="empty-icon"><i data-lucide="alert-circle" class="w-3.5 h-3.5"></i></div><div class="empty-title">ไม่พบ feature: ${route}</div></div>`;
  }

  document.getElementById('pageContent').innerHTML = html;

  // Re-render drawer/modal if open
  if (state.drawer.open) renderDrawer();
  if (state.modal.open) renderModal();

  renderIcons();
  restoreRenderState(snap);
}

// ============================================
// INIT
// ============================================
var domReady = false;
var lucideReady = false;
function bootIfReady() {
  if (domReady && lucideReady) {
    state.route = getRoute();
    render();
    renderIcons();
  }
}
if (document.readyState === 'loading') {
  window.addEventListener('DOMContentLoaded', function() { domReady = true; bootIfReady(); });
} else {
  domReady = true;
}
window.addEventListener('lucide:ready', function() { lucideReady = true; bootIfReady(); });
if (window.lucide && typeof window.lucide.createIcons === 'function') {
  lucideReady = true;
}
bootIfReady();
setTimeout(function() {
  if (!lucideReady) {
    console.warn('[Lucide] Timeout — rendering without icons');
    lucideReady = true;
    bootIfReady();
  }
}, 5000);

</script>

</body>
</html>
