<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operation Process — งานทั้งหมด</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">
<style>
:root{--z-sticky:10;--z-shell:20;--z-dropdown:30;--z-backdrop:50;--z-drawer:51;--z-modal:60;--z-toast:80;
  --c-navy:#111111; --c-navy-2:#111111; --c-primary:#FF3B30; --c-primary-hover:#E62E24;
  --c-teal:#FF9A1F; --c-teal-light:#FFB763; --c-purple:#7C3AED;
  --c-ink:#111111; --c-mute:#54565C; --c-mute-2:#73757B; --c-mute-3:#9A9CA2;
  --c-line:#DEDAD4; --c-line-2:#E9E5E0; --c-line-3:#F1EEEA; --c-bg-off:#FAF8F5;
  --c-success:#1F9D55; --c-warning:#E8870F; --c-danger:#E62E24;
  --sidebar-w:232px; --shell-h:52px;
}
/* Iron Rule #49 — Minimal Scrollbar */
*{scrollbar-width:thin;scrollbar-color:rgba(17,17,17,.16) transparent;}
::-webkit-scrollbar{width:5px;height:5px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-corner{background:transparent;}
::-webkit-scrollbar-thumb{background:rgba(17,17,17,.14);border-radius:99px;}
::-webkit-scrollbar-thumb:hover{background:rgba(17,17,17,.26);}
.sidebar{scrollbar-color:rgba(255,255,255,.28) transparent;}
.sidebar ::-webkit-scrollbar-thumb,.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.28);}
.sidebar ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.42);}

*{box-sizing:border-box;} html,body{margin:0;padding:0;}
body{font-family:'Noto Sans Thai','Satoshi',system-ui,sans-serif;background:var(--c-bg-off);color:#111111;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-width:1180px;}
a{text-decoration:none;color:inherit;} button{font-family:inherit;cursor:pointer;} [data-lucide]{flex-shrink:0;}
input[type="number"]::-webkit-inner-spin-button,input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0;}
input[type="number"]{-moz-appearance:textfield;}

/* sidebar */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);background:#111111;color:rgba(255,255,255,0.62);z-index:20;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,0.06);}
.sb-brand{padding:18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0;}
.sb-logo{width:34px;height:34px;background:linear-gradient(135deg,#FF3B30,#FF9A1F);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;box-shadow:0 4px 12px rgba(255,59,48,0.25);}
.sb-name{font-weight:700;font-size:14px;color:#fff;letter-spacing:-0.01em;line-height:1.2;}
.sb-sub{font-size:11px;color:#9A9CA2;letter-spacing:0.06em;font-weight:600;text-transform:uppercase;margin-top:2px;}
.sb-nav{flex:1;padding:12px 8px;overflow-y:auto;}
.sb-module{margin-bottom:4px;}
.sb-module-header{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:6px;background:transparent;border:0;color:#9A9CA2;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;transition:all 120ms;text-align:left;}
.sb-module-header:hover{background:rgba(255,255,255,0.04);color:#DEDAD4;}
.sb-module-header .mod-icon{flex-shrink:0;opacity:0.7;} .sb-module-header .mod-label{flex:1;}
.sb-module-header .mod-chevron{flex-shrink:0;transition:transform 200ms;opacity:0.7;}
.sb-module[data-expanded="false"] .mod-chevron{transform:rotate(-90deg);}
.sb-module[data-expanded="false"] .sb-features{display:none;}
.sb-features{padding:2px 0 6px 0;}
.sb-item{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 16px;border-radius:6px;color:#DEDAD4;font-size:13px;font-weight:500;cursor:pointer;transition:all 120ms;margin-bottom:1px;position:relative;user-select:none;}
.sb-item:hover{background:rgba(255,255,255,0.05);color:#fff;}
.sb-item.is-active{background:rgba(255,255,255,0.08);color:#fff;font-weight:600;}
.sb-item.is-active::before{content:'';position:absolute;left:-10px;top:7px;bottom:7px;width:3px;background:var(--c-primary);border-radius:0 2px 2px 0;}
.sb-item [data-lucide]{width:16px;height:16px;opacity:0.85;} .sb-item.is-active [data-lucide]{opacity:1;color:var(--c-primary);}
.sb-badge{margin-left:auto;font-size:11px;font-weight:600;background:rgba(255,255,255,0.10);color:#9A9CA2;padding:2px 8px;border-radius:999px;}
.sb-item.is-active .sb-badge{background:rgba(255,255,255,0.18);color:#fff;}
.sb-item.is-disabled{opacity:0.4;cursor:not-allowed;} .sb-item.is-disabled:hover{background:transparent;color:#DEDAD4;}
.sb-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:8px;font-size:12px;color:#9A9CA2;}
.pulse-dot{width:7px;height:7px;background:var(--c-teal);border-radius:50%;box-shadow:0 0 0 3px rgba(255,154,31,0.20);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.6;}}

/* main + shell */
.main{margin-left:var(--sidebar-w);min-height:100vh;background:var(--c-bg-off);}
.shell-bar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--c-line-2);height:var(--shell-h);display:flex;align-items:center;padding:0 24px;z-index:19;gap:12px;}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--c-mute);}
.breadcrumb a{cursor:pointer;transition:color 120ms;} .breadcrumb a:hover{color:var(--c-primary);}
.breadcrumb .sep{color:var(--c-mute-3);font-size:11px;} .breadcrumb-current{color:var(--c-ink);font-weight:500;}
.icon-btn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:0;color:var(--c-mute);border-radius:7px;position:relative;transition:all 120ms;}
.icon-btn:hover{background:var(--c-line-3);color:var(--c-ink);} .icon-btn [data-lucide]{width:17px;height:17px;}
.notif-dot{position:absolute;top:7px;right:8px;width:7px;height:7px;background:var(--c-danger);border-radius:50%;border:2px solid #fff;}
.user-chip{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 12px;border-radius:8px;cursor:pointer;transition:background 120ms;}
.user-chip:hover{background:var(--c-line-3);}
.user-text{line-height:1.2;text-align:right;} .user-name{font-size:12.5px;font-weight:500;color:var(--c-ink);white-space:nowrap;}
.user-role{font-size:11px;color:var(--c-mute-2);white-space:nowrap;margin-top:1px;}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--c-primary),var(--c-teal));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;}
.user-menu{position:absolute;top:calc(var(--shell-h) - 4px);right:22px;background:#fff;border:1px solid var(--c-line-2);border-radius:10px;box-shadow:0 12px 32px rgba(11,29,58,0.12);width:240px;z-index:30;padding:6px;display:none;}
.user-menu.is-open{display:block;}
.user-menu-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;font-size:13px;color:var(--c-ink);cursor:pointer;transition:background 120ms;}
.user-menu-item:hover{background:var(--c-bg-off);} .user-menu-item [data-lucide]{width:15px;height:15px;color:var(--c-mute-2);}
.user-menu-item.is-danger{color:var(--c-danger);} .user-menu-item.is-danger [data-lucide]{color:var(--c-danger);}
.user-menu-divider{height:1px;background:var(--c-line-2);margin:6px 0;}

.content{padding:24px;}
.ph{margin-bottom:18px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:16px;}
.ph > div:first-child{flex:1 1 auto;min-width:280px;}
.ph-title-row{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;}
.ph-title{font-family:'Noto Sans Thai',sans-serif;font-size:20px;font-weight:700;color:var(--c-navy);margin:0;letter-spacing:-0.01em;}
.ph-count{font-size:12.5px;font-weight:600;color:var(--c-mute-2);background:var(--c-line-3);padding:3px 10px;border-radius:999px;}
.ph-sub{font-size:13px;color:var(--c-mute);margin:0;} .ph-actions{display:flex;gap:8px;flex-shrink:0;}

.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 16px;border-radius:8px;font-size:13px;font-weight:500;border:1px solid transparent;background:transparent;white-space:nowrap;transition:all 120ms;user-select:none;}
.btn [data-lucide]{width:15px;height:15px;}
.btn-primary{background:var(--c-primary);color:#fff;} .btn-primary:hover{background:var(--c-primary-hover);box-shadow:0 2px 8px rgba(255,59,48,0.30);}
.btn-secondary{background:#fff;border-color:var(--c-line);color:var(--c-ink);} .btn-secondary:hover{background:var(--c-line-3);border-color:var(--c-mute-2);}
.btn-ghost{color:var(--c-mute);} .btn-ghost:hover{background:var(--c-line-3);color:var(--c-ink);}
.btn-danger{background:#fff;border-color:var(--c-line);color:var(--c-danger);} .btn-danger:hover{background:#FFE9E7;border-color:var(--c-danger);}
.btn-success{background:var(--c-teal);color:#fff;border-color:var(--c-teal);} .btn-success:hover{filter:brightness(.94);box-shadow:0 2px 8px rgba(255,154,31,.28);}
.mention{color:var(--c-primary);font-weight:600;background:rgba(255,59,48,.09);padding:0 3px;border-radius:4px;}
.watchers{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.wch{display:inline-flex;align-items:center;gap:6px;background:var(--c-line-3);border-radius:999px;padding:3px 10px 3px 4px;font-size:12px;color:var(--c-ink);}
.wch .x{cursor:pointer;color:var(--c-mute-3);display:inline-flex;} .wch .x:hover{color:var(--c-danger);} .wch .x [data-lucide]{width:12px;height:12px;}
.mention-chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.mention-chip{font-size:12px;font-weight:600;color:var(--c-primary);background:rgba(255,59,48,.07);border:1px solid rgba(255,59,48,.18);border-radius:999px;padding:2px 10px;cursor:pointer;}
.mention-chip:hover{background:rgba(255,59,48,.14);}
.log-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--c-line-3);align-items:flex-start;display:flex;gap:12px;padding:10px 2px;border-bottom:1px solid var(--c-line-3);}
.log-item:last-child{border-bottom:0;}
.log-ico{width:24px;height:24px;border-radius:50%;background:var(--c-line-3);color:var(--c-mute);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.log-ico [data-lucide]{width:13px;height:13px;}
.log-text{font-size:12.5px;color:var(--c-ink);font-size:13px;color:var(--c-ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap;} .log-meta{font-size:11px;color:var(--c-mute-3);margin-top:2px;}
.mt-search{position:relative;flex:1;min-width:180px;max-width:340px;}
.mt-search [data-lucide]{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--c-mute-3);}
.mt-search input{width:100%;height:34px;padding:0 12px 0 33px;border:1px solid var(--c-line);border-radius:8px;font-family:inherit;font-size:13px;color:var(--c-ink);background:#fff;}
.mt-search input:focus{outline:none;border-color:var(--c-primary);box-shadow:0 0 0 3px rgba(255,59,48,.10);}
.pager{display:flex;align-items:center;gap:12px;padding:12px 20px;border-top:1px solid var(--c-line-2);flex-wrap:wrap;}
.pager-info{font-size:12.5px;color:var(--c-mute-2);}
.pager-size{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--c-mute-2);}
.pager-size select{height:30px;border:1px solid var(--c-line);border-radius:7px;font-family:inherit;font-size:12.5px;padding:0 6px;color:var(--c-ink);background:#fff;}
.pager-nav{display:flex;align-items:center;gap:4px;}
.pg-btn{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--c-line);border-radius:7px;background:#fff;color:var(--c-ink);cursor:pointer;}
.pg-btn:hover:not(:disabled){border-color:var(--c-primary);color:var(--c-primary);} .pg-btn:disabled{opacity:.4;cursor:not-allowed;}
.pg-btn [data-lucide]{width:15px;height:15px;}
.pg-cur{font-size:12.5px;color:var(--c-ink);font-weight:600;padding:0 6px;}
.btn-sm{height:30px;padding:0 12px;font-size:12px;}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:18px;}
.stat{background:#fff;border:1px solid var(--c-line-2);border-radius:10px;padding:16px 16px;transition:all 150ms;}
.stat:hover{border-color:var(--c-line);box-shadow:0 2px 8px rgba(11,29,58,0.05);}
.stat-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--c-mute);}
.stat-label [data-lucide]{width:13px;height:13px;color:var(--c-primary);}
.stat-value{font-family:'Noto Sans Thai',sans-serif;font-size:26px;font-weight:700;color:var(--c-navy);margin-top:6px;letter-spacing:-0.01em;}
.stat-meta{font-size:12px;color:var(--c-mute-2);margin-top:6px;display:flex;align-items:center;gap:4px;}
.stat-meta [data-lucide]{width:12px;height:12px;}

.card{background:#fff;border:1px solid var(--c-line-2);border-radius:10px;overflow:hidden;}
.filter-bar{padding:16px 18px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--c-line-2);background:#fff;flex-wrap:wrap;}
.input,.select{height:36px;padding:0 12px;border:1px solid var(--c-line);border-radius:8px;font-size:13px;background:#fff;color:var(--c-ink);font-family:inherit;transition:all 120ms;width:100%;}
.input:focus,.select:focus{outline:none;border-color:var(--c-primary);box-shadow:0 0 0 3px rgba(255,59,48,0.10);}
.select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2364748B' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:32px;appearance:none;width:auto;min-width:150px;}
.input-search{position:relative;flex:1;max-width:320px;} .input-search input{padding-left:36px;}
.input-search .lead-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--c-mute-2);pointer-events:none;}

.table-scroll{overflow-x:auto;}
.table{width:100%;border-collapse:collapse;font-size:13px;}
.table thead{background:var(--c-bg-off);}
.table th{padding:10px 16px;text-align:left;font-weight:600;color:var(--c-mute);font-size:11px;text-transform:uppercase;letter-spacing:0.05em;border-bottom:1px solid var(--c-line-2);white-space:nowrap;}
.table td{padding:12px 16px;border-bottom:1px solid var(--c-line-2);color:var(--c-ink);vertical-align:middle;}
.table tbody tr{transition:background 120ms;} .table tbody tr:hover{background:var(--c-bg-off);}
.table tbody tr:last-child td{border-bottom:0;}

.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;padding:2px 8px;font-size:11px;}
.pill [data-lucide]{width:11px;height:11px;}
.pill-converted{background:#E4F4EB;color:#157A41;}
.pill-inprogress{background:#E6F0FF;color:#1A5FCC;}
.pill-review{background:#EDE9FE;color:#6D28D9;}
.pill-queued{background:#F1EEEA;color:#73757B;}
.pill-pending{background:#FFF1DD;color:#B8690B;}

.empty{padding:56px 24px;text-align:center;color:var(--c-mute);}
.empty-icon{width:52px;height:52px;margin:0 auto 16px;border-radius:50%;background:var(--c-line-3);color:var(--c-mute-2);display:inline-flex;align-items:center;justify-content:center;}
.empty-icon [data-lucide]{width:22px;height:22px;}
.empty-title{font-size:16px;font-weight:600;color:var(--c-ink);margin-bottom:6px;}
.empty-desc{font-size:13px;color:var(--c-mute);max-width:320px;margin:0 auto;}

.toast{position:fixed;bottom:24px;right:24px;background:var(--c-navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;z-index:80;display:flex;align-items:center;gap:10px;box-shadow:0 12px 32px rgba(11,29,58,0.30);transform:translateY(100px);opacity:0;transition:all 250ms cubic-bezier(0.4,0,0.2,1);max-width:380px;}
.toast.is-visible{transform:translateY(0);opacity:1;}
.toast.is-success{background:var(--c-success);} .toast.is-info{background:var(--c-primary);} .toast.is-warning{background:var(--c-warning);} .toast.is-error{background:var(--c-danger);}
.toast [data-lucide]{width:17px;height:17px;}

.text-mute{color:var(--c-mute);} .text-mute-2{color:var(--c-mute-2);} .text-primary{color:var(--c-primary);}
.flex{display:flex;} .items-center{align-items:center;} .justify-between{justify-content:space-between;}
.gap-2{gap:8px;} .gap-3{gap:12px;} .gap-4{gap:16px;}
.mb-2{margin-bottom:8px;} .mb-3{margin-bottom:12px;} .mb-4{margin-bottom:16px;} .mt-2{margin-top:8px;} .mt-3{margin-top:12px;}
.w-2\.5{width:10px;}.h-2\.5{height:10px;}.w-3{width:12px;}.h-3{height:12px;}.w-3\.5{width:14px;}.h-3\.5{height:14px;}.w-4{width:16px;}.h-4{height:16px;}.w-5{width:20px;}.h-5{height:20px;}
svg.lucide{width:1em;height:1em;display:inline-block;vertical-align:-0.125em;flex-shrink:0;}
svg.lucide.w-2\.5{width:10px;}svg.lucide.h-2\.5{height:10px;}svg.lucide.w-3{width:12px;}svg.lucide.h-3{height:12px;}svg.lucide.w-3\.5{width:14px;}svg.lucide.h-3\.5{height:14px;}svg.lucide.w-4{width:16px;}svg.lucide.h-4{height:16px;}svg.lucide.w-5{width:20px;}svg.lucide.h-5{height:20px;}

/* ===== feature-specific (Operation Process) ===== */
.kind-badge{display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;padding:1px 6px;border-radius:4px;letter-spacing:.02em;flex-shrink:0;}
.kind-CL{background:rgba(124,58,237,.12);color:#6D28D9;}
.kind-SOP{background:rgba(255,154,31,.14);color:#157A41;}
.type-tag{display:inline-flex;font-size:11px;font-weight:600;padding:1px 6px;border-radius:5px;}
.type-Normal{background:var(--c-line-3);color:var(--c-mute-2);}
.type-Review{background:#EDE9FE;color:#6D28D9;}
.type-Approve{background:#FFF1DD;color:#B8690B;}
.prog-mini{height:5px;width:80px;background:var(--c-line-2);border-radius:999px;overflow:hidden;display:inline-block;vertical-align:middle;flex-shrink:0;}
.prog-mini > span{display:block;height:100%;background:var(--c-teal);border-radius:999px;}
.seg{display:inline-flex;background:var(--c-line-3);border-radius:7px;padding:2px;gap:2px;}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:5px;font-size:12px;font-weight:600;color:var(--c-mute-2);display:inline-flex;align-items:center;gap:6px;}
.seg button.is-active{background:#fff;color:var(--c-primary);box-shadow:0 1px 3px rgba(11,29,58,.12);}
.seg button [data-lucide]{width:13px;height:13px;}
/* operation group — lean */
.op-count{font-size:11px;color:var(--c-mute-2);font-weight:500;min-width:70px;text-align:right;font-variant-numeric:tabular-nums;}
/* sop subheader — slim */
.sop-head{display:flex;align-items:center;gap:6px;padding:4px 12px 4px 28px;background:var(--c-bg-off);border-bottom:1px solid var(--c-line-2);font-size:11px;font-weight:600;color:var(--c-navy);}
.sop-dot{width:6px;height:6px;border-radius:50%;background:var(--c-primary);flex-shrink:0;}
.sop-wait{font-size:11px;color:var(--c-mute-2);font-weight:500;display:inline-flex;align-items:center;gap:3px;}
.sop-wait [data-lucide]{width:11px;height:11px;}
.sop-count{margin-left:auto;color:var(--c-mute-2);font-weight:500;font-variant-numeric:tabular-nums;}
/* dense task table */
.optable{width:100%;border-collapse:collapse;font-size:12px;}
.optable th{padding:4px 12px;text-align:left;font-weight:600;color:var(--c-mute-2);font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--c-line-2);white-space:nowrap;}
.optable td{padding:6px 12px;border-bottom:1px solid var(--c-line-3);color:var(--c-ink);vertical-align:middle;white-space:nowrap;}
.optable tbody tr:last-child td{border-bottom:0;}
.optable th:first-child,.optable td:first-child{padding-left:20px;}
.optable th:last-child,.optable td:last-child{padding-right:18px;}
.optable tbody tr:hover{background:var(--c-bg-off);}
.optable .col-name{width:44%;white-space:normal;}
.optable-rel .col-name{width:28%;}
.optable-rel th,.optable-rel td{white-space:nowrap;}
.optable-rel .tag-cell{max-width:200px;}
.optable .col-r{text-align:right;}
.tdot{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;border:1.5px solid var(--c-line);background:#fff;}
.tdot.is-done{background:var(--c-success);border-color:var(--c-success);}
.tdot.is-review{border-color:var(--c-warning);} .tdot.is-doing{border-color:var(--c-primary);} .tdot.is-queued{border-color:var(--c-line);}
.first-cell{display:flex;align-items:center;gap:8px;min-width:0;display:flex;align-items:center;gap:12px;}
/* signal flags + pulse strip + task drawer */
.fl{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;margin-left:6px;white-space:nowrap;}
.fl [data-lucide]{width:10px;height:10px;}
.fl-danger{background:#FFE9E7;color:#E62E24;} .fl-warn{background:#FFF1DD;color:#B8690B;} .fl-info{background:#E6F0FF;color:#1A5FCC;}
.scorecard{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px;}
.sc-card{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--c-line-2);border-radius:12px;padding:16px 16px;box-shadow:0 1px 3px rgba(11,29,58,.05);}
.sc-ico{width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.sc-ico [data-lucide]{color:#fff;}
.sc-navy{background:var(--c-navy);} .sc-blue{background:var(--c-primary);} .sc-green{background:#1F9D55;} .sc-teal{background:var(--c-teal);}
.sc-num{font-size:20px;font-weight:800;color:var(--c-navy);line-height:1.1;font-variant-numeric:tabular-nums;}
.sc-lbl{font-size:12px;color:var(--c-mute-2);font-weight:500;margin-top:2px;}
@media(max-width:820px){.scorecard{grid-template-columns:repeat(2,1fr);}}
.pulse-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px;}
.pulse-chip{display:flex;align-items:center;gap:12px;padding:16px 16px;border:1px solid var(--c-line-2);border-radius:12px;background:#fff;cursor:pointer;transition:all 120ms;box-shadow:0 1px 3px rgba(11,29,58,.05);}
.pulse-chip:hover{border-color:var(--c-primary);}
.pulse-chip.is-on{border-color:var(--c-primary);box-shadow:0 0 0 2px rgba(255,59,48,.15);}
.pulse-ico{width:38px;height:38px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.pulse-ico [data-lucide]{width:18px;height:18px;}
.ico-danger{background:#FFE9E7;color:#E62E24;} .ico-warn{background:#FFF1DD;color:#B8690B;} .ico-info{background:#E6F0FF;color:#1A5FCC;} .ico-ok{background:#E4F4EB;color:#157A41;}
.pulse-num{font-size:20px;font-weight:800;color:var(--c-navy);line-height:1.1;font-variant-numeric:tabular-nums;}
.pulse-lbl{font-size:12px;color:var(--c-mute-2);font-weight:500;margin-top:2px;}
.pulse-sub{font-size:11px;color:var(--c-mute-3);margin-top:1px;}
@media(max-width:820px){.pulse-strip{grid-template-columns:repeat(2,1fr);}}
.footer-spacer{flex:1;}
.workload{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--c-line-3);color:var(--c-mute-2);margin-left:4px;}
.workload.over{background:#FFE9E7;color:#E62E24;}
.tdrawer-backdrop{position:fixed;inset:0;background:rgba(11,29,58,.40);z-index:50;opacity:0;pointer-events:none;transition:opacity 200ms;}
.tdrawer-backdrop.is-open{opacity:1;pointer-events:auto;}
.tdrawer{position:fixed;top:0;right:0;bottom:0;width:680px;max-width:96vw;background:#fff;z-index:51;transform:translateX(100%);transition:transform 240ms cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;box-shadow:-16px 0 40px rgba(11,29,58,.18);}
.tdrawer.is-open{transform:translateX(0);}
.newmodal-wrap{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;padding:28px;opacity:0;pointer-events:none;transition:opacity 180ms;}
.newmodal-wrap.is-open{opacity:1;pointer-events:auto;}
.newmodal{width:560px;max-width:96vw;max-height:86vh;background:#fff;border-radius:14px;box-shadow:0 24px 60px rgba(11,29,58,.28);display:flex;flex-direction:column;overflow:hidden;transform:translateY(12px) scale(.99);transition:transform 200ms cubic-bezier(.4,0,.2,1);}
.newmodal-lg{width:1540px;max-width:97vw;height:88vh;max-height:88vh;}
.newmodal-wrap.is-open .newmodal{transform:none;}
.nm-head-c{display:flex;align-items:center;gap:8px;min-width:0;flex:1;justify-content:flex-start;text-align:left;}
.nm-head-name{font-size:14px;font-weight:700;color:var(--c-navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.nm-two{flex:1;display:grid;grid-template-columns:9fr 16fr;min-height:0;overflow:hidden;}
.nm-formpane{overflow-y:auto;padding:18px 20px;border-right:1px solid var(--c-line-2);}
.nm-detailpane{overflow:hidden;padding:18px 24px;background:var(--c-bg-off);display:flex;flex-direction:column;min-width:0;}
.nm-pane-title{font-size:13px;font-weight:700;color:var(--c-navy);margin-bottom:10px;}
.nm-meta-row{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:var(--c-mute-2);}
.nm-meta-row span{display:inline-flex;align-items:center;gap:6px;}
.nm-meta-row [data-lucide]{color:var(--c-mute-3);}
.nm-vbar{display:flex;align-items:center;justify-content:space-between;margin:16px 0 10px;gap:10px;}
.nm-vlabel{font-size:11px;font-weight:700;color:var(--c-mute-2);text-transform:uppercase;letter-spacing:.04em;}
.nm-vtoggle{display:inline-flex;background:var(--c-line-3);border-radius:8px;padding:2px;gap:2px;}
.nm-vtoggle button{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--c-mute-2);background:none;border:0;border-radius:6px;padding:6px 12px;cursor:pointer;font-family:inherit;transition:all 120ms;}
.nm-vtoggle button.is-on{background:#fff;color:var(--c-primary);box-shadow:0 1px 3px rgba(11,29,58,.12);}
.nm-flow{flex:1;overflow:auto;background:#fff;border:1px solid var(--c-line-2);border-radius:10px;padding:16px;}
.nm-flow-list .task-name{white-space:nowrap;}
.nm-flow-list .table-scroll{overflow-x:visible;}
.nm-flow-list .optable .col-name{width:34%;}
.nm-canvas-box{flex:1;position:relative;overflow:hidden;background:#fff;border:1px solid var(--c-line-2);border-radius:10px;background-image:radial-gradient(var(--c-line-2) 1px,transparent 1px);background-size:22px 22px;}
.nm-canvas{position:absolute;inset:0;overflow:hidden;cursor:grab;}
.nm-canvas.is-grabbing{cursor:grabbing;}
.nm-canvas-inner{position:absolute;top:0;left:0;transform-origin:0 0;padding:24px;will-change:transform;}
.nm-canvas-inner .flow-wrap{overflow:visible!important;}
.nm-zoom{position:absolute;right:12px;bottom:12px;z-index:3;display:inline-flex;align-items:center;gap:2px;background:#fff;border:1px solid var(--c-line-2);border-radius:9px;box-shadow:0 2px 8px rgba(11,29,58,.12);padding:3px;}
.nm-zoom button{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:28px;background:none;border:0;border-radius:6px;color:var(--c-mute);cursor:pointer;font-family:inherit;font-size:12px;font-weight:700;}
.nm-zoom button:hover{background:var(--c-line-3);color:var(--c-ink);}
.nm-zoom-val{min-width:46px!important;color:var(--c-ink)!important;}
.nm-canvas-hint{position:absolute;left:12px;bottom:12px;z-index:3;display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--c-mute-2);background:rgba(255,255,255,.86);border-radius:7px;padding:4px 10px;pointer-events:none;}
.nm-foot{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:12px 20px;border-top:1px solid var(--c-line-2);background:#fff;flex-shrink:0;}
.nm-sub{font-size:12.5px;color:var(--c-mute-2);margin-top:3px;font-weight:400;}
.nm-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:16px 24px;border-bottom:1px solid var(--c-line-2);flex-shrink:0;}
.nm-head-row{align-items:center;}
.nm-head-main{min-width:0;flex:1;text-align:left;}
.nm-crumb{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--c-primary);margin-bottom:4px;}
.nm-crumb [data-lucide]{color:var(--c-primary);}
.nm-h-title{font-size:20px;font-weight:700;color:var(--c-navy);line-height:1.25;margin:0;}
.nm-back{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;color:var(--c-mute);background:none;border:1px solid var(--c-line-2);cursor:pointer;padding:0;border-radius:50%;transition:all 120ms;flex-shrink:0;}
.nm-back span{display:none;}
.nm-back:hover{background:var(--c-line-3);}
.nm-browse-body{display:flex;flex-direction:column;padding:16px 20px;}
/* ===== ENH-CLU picker: cluster rail + card gallery ===== */
.nm-browse-grid{flex:1;display:flex;gap:16px;min-height:0;}
.nm-clurail{width:198px;flex-shrink:0;background:#fff;border:1px solid var(--c-line-2);border-radius:10px;padding:8px;overflow-y:auto;}
.nm-clurail-title{font-size:11px;font-weight:700;color:var(--c-mute-2);text-transform:uppercase;letter-spacing:.4px;padding:2px 8px 8px;}
.nm-clu-item{display:flex;align-items:center;gap:8px;padding:8px 8px;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--c-ink);transition:background 120ms,color 120ms;position:relative;padding-right:32px;}
.nm-clu-item:hover{background:var(--c-bg-off);}
.nm-clu-item.is-active{background:rgba(255,59,48,0.08);color:var(--c-primary);font-weight:600;}
.nm-clu-item .nm-clu-txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nm-clu-item .nm-clu-n{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--c-mute-3);}
.nm-clu-item.is-active .nm-clu-n{color:var(--c-primary);}
.nm-clu-divider{height:1px;background:var(--c-line-2);margin:8px 4px;}
.nm-clu-note{font-size:11px;color:var(--c-mute-3);padding:8px 8px 2px;line-height:1.5;}
.nm-clumain{flex:1;min-width:0;display:flex;flex-direction:column;}
.nm-cards{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-content:start;padding:2px;}
.nm-card{background:#fff;border:1px solid var(--c-line-2);border-radius:12px;padding:16px 16px;cursor:pointer;transition:border-color 120ms,box-shadow 120ms,transform 120ms;display:flex;flex-direction:column;gap:8px;min-height:118px;}
.nm-card:hover{border-color:var(--c-primary);box-shadow:0 6px 18px rgba(17,17,17,.08);transform:translateY(-1px);}
.nm-card-top{display:flex;align-items:center;gap:8px;}
.nm-card-name{font-size:13.5px;font-weight:700;color:var(--c-ink);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.nm-card-clus{display:flex;gap:4px;flex-wrap:wrap;min-height:20px;}
.nm-card-meta{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--c-mute-2);margin-top:auto;}
.nm-card-meta span{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;}
.nm-card-go{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--c-primary);opacity:0;transition:opacity 120ms;margin-left:auto;}
.nm-card:hover .nm-card-go{opacity:1;}
.clu-pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:rgba(255,154,31,0.09);color:var(--c-teal);border:1px solid rgba(255,154,31,0.28);white-space:nowrap;}
.nm-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
.nm-search{flex:1;min-width:220px;margin:0;}
.nm-count{font-size:12px;color:var(--c-mute-2);margin-bottom:8px;}
.nm-table-wrap{flex:1;overflow-y:auto;border:1px solid var(--c-line-2);border-radius:10px;}
.nm-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.nm-table th{position:sticky;top:0;background:#FBF9F6;text-align:left;font-size:11px;font-weight:600;color:var(--c-mute-2);text-transform:uppercase;letter-spacing:.04em;padding:8px 16px;border-bottom:1px solid var(--c-line-2);white-space:nowrap;z-index:1;}
.nm-table td{padding:8px 16px;border-bottom:1px solid var(--c-line-3);vertical-align:middle;white-space:nowrap;}
.nm-table tbody tr:last-child td{border-bottom:0;}
.nm-row{cursor:pointer;transition:background 120ms;}
.nm-row:hover{background:rgba(255,59,48,.04);}
.nm-tname{font-size:13px;font-weight:600;color:var(--c-ink);white-space:nowrap;}
.nm-struct{color:var(--c-mute);white-space:nowrap;}
.nm-fork{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--c-primary);background:rgba(255,59,48,.08);padding:1px 8px;border-radius:999px;}
.nm-go{white-space:nowrap;color:var(--c-mute-3);font-size:12px;text-align:right;width:96px;}
.nm-row:hover .nm-go{color:var(--c-primary);}
.nm-go [data-lucide]{vertical-align:-2px;margin-right:3px;}
.nm-prev{overflow-y:auto;padding:20px 24px;border-right:1px solid var(--c-line-2);background:var(--c-bg-off);}
.nm-prev-top{display:flex;align-items:center;gap:10px;}
.nm-prev-name{font-size:21px;font-weight:700;color:var(--c-navy);margin:0;line-height:1.25;}
.nm-prev-meta{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;font-size:12px;color:var(--c-mute-2);}
.nm-prev-meta span{display:inline-flex;align-items:center;gap:6px;}
.nm-prev-meta [data-lucide]{color:var(--c-mute-3);}
.nm-prev-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
.nm-prev-label{font-size:11px;font-weight:700;color:var(--c-mute-2);text-transform:uppercase;letter-spacing:.04em;margin:20px 0 10px;}
.nm-struct-box{display:flex;flex-direction:column;gap:10px;}
.nm-sop{background:#fff;border:1px solid var(--c-line-2);border-radius:9px;padding:10px 12px;}
.nm-sop-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.nm-sop-n{font-size:11px;font-weight:700;color:#fff;background:var(--c-primary);border-radius:5px;padding:1px 8px;letter-spacing:.03em;}
.nm-sop-name{font-size:13px;font-weight:600;color:var(--c-ink);}
.nm-sop-dept{font-size:11px;color:var(--c-mute-2);margin-left:auto;}
.nm-sows{margin:8px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px;}
.nm-sows li{font-size:12px;color:var(--c-mute);line-height:1.5;}
.nm-branch{background:rgba(255,154,31,.05);border:1px dashed var(--c-teal);border-radius:9px;padding:10px 12px;}
.nm-branch-h{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--c-teal);}
.nm-lane{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--c-mute);margin-top:6px;padding-left:4px;}
.nm-side{overflow-y:auto;padding:18px 20px;}
.nm-side-title{font-size:13px;font-weight:700;color:var(--c-navy);margin-bottom:6px;}
.req{color:var(--c-danger);font-weight:700;}
.cc-av{border-radius:50%;background:var(--c-navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0;}
.nf-2col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.cc-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.cc-chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,59,48,.08);border:1px solid rgba(255,59,48,.18);border-radius:999px;padding:2px 4px 2px 4px;font-size:12px;}
.cc-chip .cc-av{width:22px;height:22px;font-size:11px;}
.cc-chip-nm{color:var(--c-ink);font-weight:500;}
.cc-chip-x{cursor:pointer;display:inline-flex;color:var(--c-mute-2);padding:0 3px;}
.cc-chip-x:hover{color:var(--c-danger);}
.cc-search{display:flex;align-items:center;gap:8px;border:1px solid var(--c-line-2);border-radius:8px;padding:8px 12px;background:#fff;}
.cc-search [data-lucide]{color:var(--c-mute-3);}
.cc-search input{flex:1;border:0;outline:none;font-size:13px;font-family:inherit;color:var(--c-ink);background:none;}
.cc-dropdown{margin-top:6px;border:1px solid var(--c-line-2);border-radius:9px;overflow:hidden;background:#fff;box-shadow:0 6px 18px rgba(11,29,58,.10);}
.cc-opt{display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--c-line-3);transition:background 120ms;}
.cc-opt:last-child{border-bottom:0;}
.cc-opt:hover{background:rgba(255,59,48,.05);}
.cc-opt .cc-av{width:28px;height:28px;font-size:11px;}
.cc-opt-info{flex:1;min-width:0;}
.cc-opt-nm{font-size:13px;font-weight:600;color:var(--c-ink);}
.cc-opt-sub{font-size:11px;color:var(--c-mute-2);}
.cc-opt [data-lucide]{color:var(--c-primary);}
.cc-empty{padding:12px;text-align:center;color:var(--c-mute-2);font-size:12px;}
.td-head{padding:16px 20px;border-bottom:1px solid var(--c-line-2);flex-shrink:0;}
.td-bc{font-size:12px;color:var(--c-mute-2);display:flex;align-items:center;gap:6px;margin-bottom:10px;}
.td-bc [data-lucide]{width:11px;height:11px;color:var(--c-mute-3);}
.td-title{font-size:18px;font-weight:700;color:var(--c-navy);line-height:1.3;margin:0;}
.td-title-ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
.td-flags-inline{display:flex;gap:6px;align-items:center;flex-shrink:0;}
.asgn{display:flex;align-items:center;gap:8px;}
.asgn-nm{font-size:13px;color:var(--c-ink);font-weight:500;}
.asgn-sub{display:flex;align-items:center;gap:10px;margin-top:6px;}
.lnk-btn{background:none;border:0;color:var(--c-danger);font-size:12px;font-weight:600;cursor:pointer;padding:0;text-decoration:underline;}
.lnk-btn:hover{opacity:.8;}
/* notes = chat box */
.td-body.is-chat{display:flex;flex-direction:column;padding:0;overflow:hidden;}
.note-thread{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:2px;}
.note-thread-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--c-mute-3);font-size:13px;}
.note-msg{display:flex;gap:8px;margin:8px 0;align-items:center;}
.note-msg.me{flex-direction:row-reverse;}
.note-av{width:28px;height:28px;flex:0 0 28px;border-radius:50%;background:var(--c-primary);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;}
.note-msg.me .note-av{background:var(--c-navy);}
.note-wrap{max-width:80%;display:flex;flex-direction:column;}
.note-msg.me .note-wrap{align-items:flex-end;}
.note-by{font-size:11px;font-weight:600;color:var(--c-mute-2);margin:0 4px 3px;}
.note-bubble{background:var(--c-line-3);border-radius:13px;padding:8px 12px;font-size:12.5px;color:var(--c-ink);line-height:1.5;white-space:pre-wrap;word-break:break-word;}
.note-msg.me .note-bubble{background:rgba(255,59,48,.10);}
.note-time{font-size:11px;color:var(--c-mute-3);margin:3px 6px 0;}
.note-composer{border-top:1px solid var(--c-line-2);padding:12px 16px;background:#fff;flex-shrink:0;}
.note-composer .notes-area{min-height:46px;}
.composer-row{display:flex;align-items:center;gap:8px;margin-top:8px;}
.composer-row .mention-chips{margin-top:0;flex:1;overflow-x:auto;flex-wrap:nowrap;}
.composer-locked{padding:12px 18px;text-align:center;color:var(--c-mute-3);font-size:12.5px;border-top:1px solid var(--c-line-2);}

.submit-area{margin-top:12px;padding-top:12px;border-top:1px dashed var(--c-line);}

.ra-btn:hover{background:#FFE9E7;color:var(--c-danger);} .ra-btn [data-lucide]{width:14px;height:14px;}

/* flow chart (vertical, branch-aware) — ported จาก opproc-module */
.flow-wrap{overflow-x:auto;padding:8px 2px 6px;}
.flow-canvas{display:flex;flex-direction:column;align-items:center;min-width:min-content;}
.flow-conn{position:relative;width:2px;height:26px;background:var(--c-line);flex-shrink:0;}
.flow-conn::after{content:"";position:absolute;left:50%;bottom:-1px;transform:translateX(-50%);width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:5px solid var(--c-line);}
.flow-conn.xs{height:16px;}
.flow-conn.xs::after{display:none;}
.flow-start,.flow-end{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:20px;font-size:12px;font-weight:700;}
.flow-start{background:var(--c-navy);color:#fff;} .flow-end{background:var(--c-teal);color:#fff;}
.flow-start [data-lucide],.flow-end [data-lucide]{width:14px;height:14px;}
.flow-group{width:320px;background:#fff;border:1px solid var(--c-line-2);border-radius:11px;box-shadow:0 1px 3px rgba(11,29,58,0.05);overflow:hidden;}
.flow-group-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--c-navy);color:#fff;}
.fg-ico{width:26px;height:26px;border-radius:7px;background:rgba(255,255,255,0.14);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.fg-ico [data-lucide]{width:15px;height:15px;}
.fg-name{font-size:12.5px;font-weight:700;line-height:1.3;}
.fg-sub{font-size:11px;color:rgba(255,255,255,0.72);margin-top:2px;}
.flow-tasks{padding:10px;display:flex;flex-direction:column;align-items:stretch;}
.flow-task{border:1px solid var(--c-line-2);border-radius:8px;padding:8px 10px;background:#fff;cursor:pointer;transition:all 120ms;}
.flow-task:hover{border-color:var(--c-primary);box-shadow:0 1px 4px rgba(255,59,48,.08);}
.ft-top{display:flex;align-items:center;gap:8px;}
.ft-seq{width:18px;height:18px;border-radius:50%;background:var(--c-line-2);color:var(--c-mute);font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.ft-name{flex:1;font-size:12px;font-weight:600;color:var(--c-ink);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ft-sub{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--c-mute-2);margin-top:4px;padding-left:24px;}
.ft-sub [data-lucide]{width:11px;height:11px;}
.flow-dot{width:3px;height:3px;border-radius:50%;background:var(--c-mute-3);display:inline-block;}
.flow-empty{font-size:11px;color:var(--c-mute-3);text-align:center;padding:8px;}
.flow-split,.flow-merge{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:10px;font-size:12px;font-weight:700;}
.flow-split [data-lucide],.flow-merge [data-lucide]{width:14px;height:14px;}
.flow-split{background:rgba(255,59,48,0.10);color:var(--c-primary);border:1px dashed var(--c-primary);}
.flow-split em{font-style:normal;font-weight:500;font-size:11px;color:var(--c-mute-2);}
.flow-merge{background:rgba(255,154,31,0.10);color:var(--c-teal);border:1px dashed var(--c-teal);}
.flow-branch{display:flex;flex-direction:row;align-items:flex-start;justify-content:center;gap:16px;width:auto;}
.flow-lane{flex:0 0 auto;min-width:320px;border:1px solid var(--c-line-2);border-left:3px solid var(--c-primary);border-radius:11px;background:rgba(255,59,48,0.035);padding:12px 12px 12px;display:flex;flex-direction:column;align-items:center;}
.flow-lane.is-active-lane{border-color:var(--c-teal);border-left-color:var(--c-teal);background:rgba(255,154,31,0.06);box-shadow:0 0 0 1px rgba(255,154,31,.16);}
.flow-lane.is-parked{border-style:dashed;border-color:var(--c-line);border-left-color:var(--c-mute-3);background:var(--c-bg-off);}

.lane-state{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;border-radius:999px;padding:2px 10px;margin-bottom:10px;}
.lane-on{color:var(--c-teal);background:rgba(255,154,31,.12);} .lane-off{color:var(--c-mute-2);background:var(--c-line-3);}
.flow-legend{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:0 2px 10px;border-bottom:1px solid var(--c-line-2);margin-bottom:10px;}

.tpl-sel{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--c-bg-off);border:1px solid var(--c-line-2);border-radius:10px;margin-bottom:16px;}

.nf-label{display:block;font-size:12px;font-weight:600;color:var(--c-mute-2);margin:12px 0 6px;}

.ntags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:24px;}
.ntag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;color:var(--c-primary);background:rgba(255,59,48,.10);border-radius:999px;padding:2px 4px 2px 10px;}
.ntag-x{cursor:pointer;display:inline-flex;color:var(--c-primary);opacity:.7;} .ntag-x:hover{opacity:1;}
.ntag-input-row{margin-top:8px;}
.ntag-pool{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}

.cc-grid{display:grid;grid-template-columns:1fr;gap:8px;}
.cc-pick{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--c-line-2);border-radius:9px;background:#fff;cursor:pointer;font-size:12.5px;color:var(--c-ink);font-family:inherit;text-align:left;}

.op-tag [data-lucide]{width:10px;height:10px;color:var(--c-mute-3);}

.lane-body{display:flex;flex-direction:column;align-items:center;width:100%;}

.desc-tags{margin-top:12px;display:flex;flex-wrap:wrap;}
.muted-sm{font-size:12.5px;color:var(--c-mute-3);margin-bottom:10px;}
.side-thread{max-height:240px;overflow-y:auto;padding:2px 2px 8px;margin-bottom:10px;border-bottom:1px solid var(--c-line-2);}
.op-composer{display:flex;flex-direction:column;gap:8px;}
.op-composer .notes-area{width:100%;min-height:60px;resize:vertical;border:1px solid var(--c-line-2);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;}
.op-composer .notes-area:focus{outline:none;border-color:var(--c-primary);}
.op-composer .btn{align-self:flex-end;}
.td-sub{font-size:12px;color:var(--c-mute-2);margin-top:4px;}
.side-btn-badge{margin-left:auto;background:var(--c-line-3);color:var(--c-mute-2);font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;}
/* related expand */
.rel-chev{width:22px;height:22px;border-radius:6px;border:none;background:transparent;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--c-mute-2);flex-shrink:0;transition:transform 150ms,background 120ms;}
.rel-chev:hover{background:var(--c-line-3);}
.rel-chev.is-open{transform:rotate(90deg);color:var(--c-primary);}
.rel-main.is-open{background:#fff;}
.rel-main.is-open td{border-bottom:1px solid var(--c-line-2);font-weight:600;}
.rel-main.is-open td:first-child{box-shadow:inset 3px 0 0 var(--c-primary);}
.rel-sub > td{padding:0 !important;background:#F1EEEA;box-shadow:inset 3px 0 0 var(--c-primary);border-bottom:2px solid var(--c-line);}
.rel-sub-wrap{padding:10px 16px 16px 32px;}
.rel-sub-box{border:1px solid var(--c-line);border-radius:9px;overflow:hidden;background:#fff;box-shadow:0 2px 8px rgba(17,17,17,.06);}
.rel-sub-box .sop-head{padding:8px 12px;background:#EAE5DE;border-top:1px solid var(--c-line-2);border-bottom:1px solid var(--c-line-2);font-size:11px;}
.rel-sub-box .sop-head:first-child{border-top:0;}
.rel-sub-box .sop-dot{width:7px;height:7px;}
.rel-sub-box .table-scroll{background:#fff;}
.rel-sub-box .optable thead th{padding:3px 12px;background:#FBF9F6;color:var(--c-mute-3);border-bottom:1px solid var(--c-line-2);font-size:9px;}
.rel-sub-box .optable td{padding:3px 12px;}
.rel-sub-box .optable th:first-child,.rel-sub-box .optable td:first-child{padding-left:16px;}
.rel-sub-box .optable tbody tr:hover{background:rgba(255,59,48,.04);}
/* branch-aware list view — compact row */
.fork-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:2px 8px;margin:2px 0 8px;border:0;border-left:2px dashed var(--c-line);border-radius:0;background:none;}
.fork-row > [data-lucide]{color:var(--c-mute-3);width:12px;height:12px;flex-shrink:0;}
.fork-label{font-weight:600;color:var(--c-mute-2);font-size:11px;}
.fork-pills{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;}
.fork-pill{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--c-line-2);background:#fff;border-radius:999px;padding:1px 8px;font-size:11px;font-weight:500;color:var(--c-mute);cursor:pointer;transition:all 120ms;}
.fork-pill b{font-weight:700;color:var(--c-mute-2);font-size:11px;background:var(--c-line-3);border-radius:999px;padding:0 6px;line-height:1.7;}
.fork-pill:hover{border-color:var(--c-primary);}
.fork-pill.is-sel{border-color:var(--c-primary);background:var(--c-primary);color:#fff;}
.fork-pill.is-sel b{background:rgba(255,255,255,.25);color:#fff;}
.fork-clear{margin-left:2px;}
.lane-cont{border-left:2px dashed var(--c-line);padding-left:10px;margin:0 0 10px 4px;}
.fork-pill.has-active{border-color:var(--c-teal);}
.fork-pill.has-active.is-sel{border-color:var(--c-teal);background:var(--c-teal);}
.fork-live{font-size:11px;font-weight:700;color:var(--c-teal);background:rgba(255,154,31,.12);padding:1px 6px;border-radius:999px;margin-left:2px;}
.fork-pill.is-sel .fork-live{background:rgba(255,255,255,.25);color:#fff;}
.lane-live{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:500;color:var(--c-teal);margin:0 0 6px;}
.lane-live .live-dot{width:7px;height:7px;border-radius:50%;background:var(--c-teal);box-shadow:0 0 0 3px rgba(255,154,31,.18);animation:pulse 1.6s ease-in-out infinite;}
.flow-sop{background:#fff;border:1px solid var(--c-line-2);border-radius:11px;box-shadow:0 1px 3px rgba(11,29,58,.05);overflow:hidden;margin-bottom:16px;}
.rel-sub-box .flow-sop{border:0;border-radius:0;box-shadow:none;margin:0;}
.rel-sub-box .fork-row{margin:10px 12px;}
.rel-sub-box .lane-cont{margin:0 12px 0 16px;}
/* flow active */
.flow-task.is-current{border-color:var(--c-primary);box-shadow:0 0 0 2px rgba(255,59,48,.16);background:rgba(255,59,48,.03);}
.ft-now{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--c-primary);margin-bottom:6px;}
.ft-now-dot{width:7px;height:7px;border-radius:50%;background:var(--c-primary);box-shadow:0 0 0 3px rgba(255,59,48,.18);animation:pulseDot 1.4s ease-in-out infinite;}
@keyframes pulseDot{0%,100%{opacity:1;}50%{opacity:.35;}}
.flow-group.has-active{border-color:var(--c-primary);box-shadow:0 0 0 2px rgba(255,59,48,.10),0 1px 3px rgba(11,29,58,.05);}
.flow-group.has-active .flow-group-head{background:var(--c-primary);}
.fg-active-badge{font-size:11px;font-weight:700;letter-spacing:.04em;background:rgba(255,255,255,.2);color:#fff;border-radius:5px;padding:2px 8px;flex-shrink:0;}
/* tabpane (files/logs) */
.tabpane{padding:16px 16px 16px;}
.tabpane-head{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;}
.tabpane-title{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;color:var(--c-navy);}
.tabpane-title [data-lucide]{color:var(--c-primary);}
.tabpane-sub{font-size:12px;font-weight:500;color:var(--c-mute-2);margin-left:4px;}
.file-list-wrap{display:flex;flex-direction:column;}
.file-src{display:inline-flex;align-items:center;gap:3px;background:var(--c-line-3);color:var(--c-mute-2);font-size:11px;font-weight:600;border-radius:5px;padding:1px 8px;margin-left:2px;}
.file-src [data-lucide]{width:10px;height:10px;}
.file-src-op{background:rgba(255,154,31,.12);color:#157A41;}

/* logs */
.log-list{display:flex;flex-direction:column;}

.log-item:last-child{border-bottom:none;}
.log-ic{width:26px;height:26px;border-radius:50%;background:var(--c-line-3);display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.log-ic [data-lucide]{color:var(--c-mute);width:14px;height:14px;}
.log-body{flex:1;min-width:0;}

.log-src{font-size:11px;font-weight:600;color:var(--c-mute-2);background:var(--c-line-3);border-radius:5px;padding:1px 8px;}
.log-meta{font-size:11px;color:var(--c-mute-3);margin-top:3px;}
.log-view .log-ic{background:rgba(255,59,48,.10);}
.log-view .log-ic [data-lucide]{color:var(--c-primary);}
.tabpane-sub2{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--c-mute);margin:16px 0 10px;}
.tabpane-sub2 [data-lucide]{color:var(--c-primary);width:14px;height:14px;}
.view-strip{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
.view-chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--c-line-2);border-radius:999px;padding:4px 12px 4px 6px;background:#fff;}
.view-chip .mini-av{width:21px;height:21px;font-size:11px;}
.vc-name{font-size:12px;font-weight:600;color:var(--c-ink);}
.vc-st{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:999px;padding:1px 8px;}
.vc-st.ok{background:rgba(255,154,31,.12);color:#157A41;}
.vc-st.no{background:var(--c-line-3);color:var(--c-mute-3);}
.vc-st [data-lucide]{width:11px;height:11px;}
.people-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-bottom:4px;}
.person-card{display:flex;align-items:center;gap:12px;border:1px solid var(--c-line-2);border-radius:10px;padding:12px 12px;background:#fff;}
.person-av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--c-primary),var(--c-teal));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
.person-info{min-width:0;flex:1;}
.person-nm{font-size:13.5px;font-weight:600;color:var(--c-ink);display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.person-sub{font-size:12px;color:var(--c-mute-2);margin-top:3px;display:flex;align-items:center;gap:6px;}
.role-tag{font-size:11px;font-weight:700;letter-spacing:.03em;border-radius:5px;padding:1px 8px;background:var(--c-line-3);color:var(--c-mute-2);}
.role-tag.rt-owner{background:rgba(255,59,48,.12);color:var(--c-primary);}
.seen-ok{display:inline-flex;align-items:center;gap:4px;color:#157A41;font-weight:600;}
.seen-no{display:inline-flex;align-items:center;gap:4px;color:var(--c-mute-3);font-weight:600;}
.seen-ok [data-lucide],.seen-no [data-lucide]{width:12px;height:12px;}
.side-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:1px solid var(--c-line-2);border-radius:8px;background:#fff;font-size:13px;color:var(--c-ink);font-weight:500;margin-bottom:8px;transition:all 120ms;}
.side-btn:hover{border-color:var(--c-line);background:var(--c-bg-off);} .side-btn [data-lucide]{width:15px;height:15px;color:var(--c-primary);}
.tagchip{display:inline-flex;align-items:center;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--c-line-3);color:var(--c-mute);margin:0 6px 6px 0;}
.reason-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:2px 10px;border-radius:999px;background:rgba(255,59,48,.10);color:var(--c-primary);margin:0 6px 4px 0;font-size:11px;padding:1px 8px;}
.reason-chip [data-lucide]{width:11px;height:11px;}
.reason-own{background:rgba(255,154,31,.14);color:#157A41;} .reason-cc{background:var(--c-line-3);color:var(--c-mute-2);}
.reason-mine{background:rgba(255,59,48,.10);color:var(--c-primary);}
.reason-overdue{background:#FFE9E7;color:#E62E24;} .reason-unassigned{background:#E6F0FF;color:#1A5FCC;} .reason-due{background:#FFF1DD;color:#B8690B;}
.th-sort{cursor:pointer;user-select:none;white-space:nowrap;} .th-sort:hover{color:var(--c-primary);} .th-sort.is-sort{color:var(--c-primary);}
.th-ar{font-size:9px;margin-left:3px;display:inline-block;width:8px;}
.oq-stub{opacity:.75;cursor:not-allowed;}
.oq-tag{font-size:9px;font-weight:700;background:#FFF1DD;color:#B8690B;padding:1px 6px;border-radius:999px;margin-left:4px;}

.rel-reasons{display:inline-flex;flex-wrap:wrap;gap:0;margin-left:2px;}
.prog-cell{display:flex;align-items:center;gap:8px;}
.prog-cell .op-count{min-width:38px;text-align:left;}
.timeline{position:relative;padding-left:24px;}
.timeline::before{content:'';position:absolute;left:7px;top:4px;bottom:4px;width:2px;background:var(--c-line-2);}
.tl-item{position:relative;margin-bottom:16px;} .tl-item:last-child{margin-bottom:0;}
.tl-dot{position:absolute;left:-19px;top:3px;width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid var(--c-primary);}
.tl-dot.is-success{border-color:var(--c-success);}
.tl-title{font-size:12.5px;font-weight:600;color:var(--c-ink);} .tl-meta{font-size:11px;color:var(--c-mute-2);margin-top:2px;}



/* ============ v2: New Op wizard + branch decision ============ */
.nm-step-tag{display:inline-flex;align-items:center;font-size:11px;font-weight:600;color:var(--c-primary);background:#F6F1EA;border:1px solid #EFD9C4;border-radius:999px;padding:2px 10px;margin-left:8px;vertical-align:middle;}
.nfc-box{border:1px solid #EFD9C4;background:#FBF6EF;border-radius:10px;padding:10px 12px;margin:10px 0 4px;display:flex;flex-direction:column;gap:8px;}
.nfc-row{display:flex;align-items:flex-start;gap:8px;color:var(--c-ink);}
.nfc-row i{color:var(--c-primary);margin-top:1px;}
.nfc-title{font-size:12.5px;font-weight:700;}
.nfc-sub{font-size:11px;color:var(--c-mute-2);margin-top:1px;line-height:1.5;}
.nfc-due{font-size:12px;align-items:center;justify-content:space-between;border-top:1px dashed #EFD9C4;padding-top:8px;}
.nfc-due b{color:var(--c-primary);}
.nfc-warn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--c-warning);background:#FFF4E5;border:1px solid #FFDDB0;border-radius:8px;padding:6px 8px;}
.na-body{padding:16px 18px;display:flex;flex-direction:column;gap:12px;overflow:auto;}
.na-sop{border:1px solid var(--c-line-2);border-radius:10px;overflow:visible;}
.na-sop-head{display:flex;align-items:center;gap:8px;background:var(--c-bg-off);padding:8px 12px;font-size:12.5px;border-bottom:1px solid var(--c-line-2);border-radius:9px 9px 0 0;}
.na-sop-head i{color:var(--c-primary);}
.na-dept{font-size:11px;color:var(--c-mute-2);background:#fff;border:1px solid var(--c-line-2);border-radius:999px;padding:1px 8px;}
.na-row{display:grid;grid-template-columns:64px 1fr 90px 280px;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--c-line-3);}
.na-row:last-child{border-bottom:0;}
.na-type{font-size:11px;font-weight:600;text-align:center;border-radius:6px;padding:2px 0;background:#F6F1EA;color:var(--c-primary);border:1px solid #EFD9C4;}
.na-type.t-review{background:#FFF1DD;color:#B8690B;border-color:#FFE1BF;}
.na-type.t-approve{background:#F3E8FF;color:var(--c-purple);border-color:#E9D5FF;}
.na-name{font-size:12.5px;font-weight:500;color:var(--c-ink);}
.na-sla{font-size:11px;color:var(--c-mute-2);}
.na-sel{width:100%;font-size:12px;}
.na-fork{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:var(--c-mute);padding:2px 2px 0;}
.na-fork i{color:var(--c-warning);}
.na-lane{border:1px dashed var(--c-line);border-radius:10px;padding:10px;margin:4px 0 4px 16px;display:flex;flex-direction:column;gap:8px;background:#FDFBF8;}
.na-lane-tag{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--c-mute);}
.na-lane-tag em{font-weight:400;font-style:normal;color:var(--c-mute-3);font-size:11px;}
.na-sum{font-size:12px;color:var(--c-mute-2);}
.ld-modal{max-width:560px;width:92vw;}
.ld-sub{font-size:12.5px;color:var(--c-mute);line-height:1.6;padding:2px 16px 12px;}
.ld-lanes{display:flex;flex-direction:column;gap:8px;padding:0 16px 16px;}
.ld-lane{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--c-line-2);background:#fff;border-radius:10px;padding:12px 16px;cursor:pointer;transition:all .12s;font-family:inherit;}
.ld-lane:hover{border-color:var(--c-primary);background:#FBF6EF;box-shadow:0 2px 8px rgba(255,59,48,.08);}
.ld-l-top{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--c-ink);}
.ld-l-top i{color:var(--c-primary);}
.ld-l-sub{font-size:12px;color:var(--c-mute-2);padding-left:24px;}
.ld-later{border:0;background:none;color:var(--c-mute-2);font-size:12px;cursor:pointer;padding:8px 16px 16px;font-family:inherit;text-decoration:underline;text-underline-offset:3px;}
.pill-skipped{background:#F1EEEA;color:#9A9CA2;border:1px solid #E9E5E0;}
.lane-skip{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--c-mute-3);background:#F1EEEA;border-radius:999px;padding:2px 8px;}
.fork-decide-btn{display:inline-flex;align-items:center;gap:4px;border:1px solid #FFDDB0;color:var(--c-warning);background:none;border-radius:999px;padding:1px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;}
.fork-decide-btn:hover{background:#FFEBD1;}



/* ============ v3: view btn / tabs / dt-canvas / na-picker / responsive ============ */
.col-view{width:70px;text-align:right;}
.row-view-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--c-line-2);background:#fff;color:var(--c-mute);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 120ms;}
.row-view-btn:hover{border-color:var(--c-primary);color:var(--c-primary);background:#FBF6EF;}
.ov-tabs{display:inline-flex;gap:4px;background:#fff;border:1px solid var(--c-line-2);border-radius:10px;padding:4px;margin:0 0 12px;}
.ov-tab{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--c-mute);border-radius:7px;padding:6px 16px;font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 120ms;}
.ov-tab.is-active{background:var(--c-navy);color:#fff;}
.ov-tab.is-active [data-lucide]{color:#fff;}
.dt-canvas{position:relative;height:calc(100vh - 340px);min-height:560px;overflow:hidden;border:1px solid var(--c-line-2);border-radius:10px;background:radial-gradient(circle,#EAE5DE 1px,transparent 1px);background-size:22px 22px;cursor:grab;}
.dt-canvas.is-panning{cursor:grabbing;}
.dt-inner{transform-origin:0 0;width:max-content;min-width:100%;padding:18px;}
.dt-zoom{position:absolute;right:12px;bottom:12px;display:inline-flex;align-items:center;gap:2px;background:#fff;border:1px solid var(--c-line-2);border-radius:9px;padding:3px;box-shadow:0 2px 8px rgba(17,17,17,.08);}
.dt-zoom button{border:0;background:none;cursor:pointer;padding:6px 8px;border-radius:6px;color:var(--c-mute);display:inline-flex;align-items:center;font-family:inherit;}
.dt-zoom button:hover{background:var(--c-line-3);}
.dt-zoom-val{font-size:11px;font-weight:600;min-width:40px;justify-content:center;}
.dt-hint{position:absolute;left:12px;bottom:12px;display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--c-mute-2);background:rgba(255,255,255,.92);border:1px solid var(--c-line-2);border-radius:999px;padding:3px 10px;}
.na-pick{position:relative;width:280px;max-width:100%;justify-self:end;}
.na-pick.is-open{z-index:70;}
.na-pick-btn{display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--c-line-2);background:#fff;border-radius:9px;padding:6px 10px;cursor:pointer;font-family:inherit;text-align:left;transition:all 120ms;}
.na-pick-btn:hover{border-color:var(--c-primary);}
.na-pick-btn.is-set{border-color:#F3C9C5;background:#FDFBF8;}
.na-pick-btn>[data-lucide]{margin-left:auto;color:var(--c-mute-3);flex-shrink:0;}
.na-av{width:26px;height:26px;border-radius:50%;background:var(--c-navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0;}
.na-av-empty{background:var(--c-line-3);color:var(--c-mute-3);border:1px dashed var(--c-line);}
.na-av-empty [data-lucide]{color:var(--c-mute-3);}
.na-pb-main{display:flex;flex-direction:column;min-width:0;line-height:1.25;}
.na-pb-name{font-size:12px;font-weight:600;color:var(--c-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.na-pb-name.na-pb-ph{color:var(--c-mute-3);font-weight:500;}
.na-pb-role{font-size:11px;color:var(--c-mute-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.na-backdrop{position:fixed;inset:0;z-index:60;}
.na-drop{position:absolute;right:0;top:calc(100% + 4px);width:320px;max-width:82vw;background:#fff;border:1px solid var(--c-line-2);border-radius:11px;box-shadow:0 10px 28px rgba(17,17,17,.14);z-index:61;overflow:hidden;}
.na-srch{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--c-line-3);padding:8px 12px;}
.na-srch [data-lucide]{color:var(--c-mute-3);flex-shrink:0;}
.na-srch input{border:0;outline:0;flex:1;font-size:12.5px;font-family:inherit;background:none;min-width:0;}
.na-list{max-height:250px;overflow:auto;padding:6px;}
.na-opt{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer;transition:background 100ms;}
.na-opt:hover{background:var(--c-bg-off);}
.na-opt.is-sel{background:#F6F1EA;}
.na-o-main{display:flex;flex-direction:column;min-width:0;line-height:1.3;flex:1;}
.na-o-name{font-size:12.5px;font-weight:600;color:var(--c-ink);display:inline-flex;align-items:center;gap:4px;}
.na-star{color:#E8870F;}
.na-o-role{font-size:11px;color:var(--c-mute-2);}
.na-over{font-size:11px;font-weight:700;color:var(--c-danger);background:#FFF3F2;border:1px solid #F6C6C2;border-radius:999px;padding:1px 8px;flex-shrink:0;}
.na-empty{padding:18px;text-align:center;font-size:12px;color:var(--c-mute-3);}
.na-clear{display:flex;align-items:center;gap:6px;width:100%;border:0;border-top:1px solid var(--c-line-3);background:none;color:var(--c-danger);font-size:12px;font-weight:600;padding:8px 12px;cursor:pointer;font-family:inherit;}
.na-clear:hover{background:#FFF3F2;}
.na-row{grid-template-columns:64px 1fr 80px 280px;}
/* responsive landing */
.rel-sub-wrap{overflow-x:auto;}
@media(max-width:1024px){
  .stat-strip{flex-direction:row;flex-wrap:wrap;}
  .stat-cell{flex:1 1 33%;}
  .ptabs{overflow-x:auto;white-space:nowrap;}
  .na-row{grid-template-columns:56px 1fr 240px;}
  .na-pick{width:240px;}
  .na-sla{display:none;}
}
@media(max-width:760px){
  .detail-grid{grid-template-columns:1fr;}
  .dt-canvas{min-height:420px;height:60vh;}
  .stat-cell{flex:1 1 50%;}
  .ph-row{flex-wrap:wrap;gap:10px;}
  .filter-bar{flex-wrap:wrap;}
  .filter-bar .select{flex:1 1 45%;min-width:120px;}
  .dt-canvas{height:420px;}
  .na-row{grid-template-columns:1fr;gap:6px;}
  .na-type{width:64px;}
}



/* ============ v5: flat list view (single table) ============ */
.flv{width:100%;border-collapse:collapse;background:#fff;}
.flv thead th{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;color:var(--c-mute-2);text-align:left;padding:8px 12px;border-bottom:1px solid var(--c-line-2);white-space:nowrap;background:#fff;}
.flv-sop td{background:var(--c-bg-off);padding:0;border-top:1px solid var(--c-line-2);border-bottom:1px solid var(--c-line-2);}
.flv-sop-in{display:flex;align-items:center;gap:8px;padding:6px 12px;font-size:12px;color:var(--c-ink);}
.flv-dept{font-size:11px;color:var(--c-mute-2);background:#fff;border:1px solid var(--c-line-2);border-radius:999px;padding:0 8px;}
.flv-count{margin-left:auto;font-size:11px;font-weight:600;color:var(--c-mute-2);}
.flv-lane-chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:#B8690B;background:#FFF1DD;border-radius:999px;padding:1px 8px;}
.flv-lane-chip [data-lucide]{color:#B8690B;}
.flv-task td{padding:8px 12px;border-bottom:1px solid var(--c-line-3);font-size:12.5px;color:var(--c-ink);vertical-align:middle;}
.flv-task{cursor:pointer;transition:background 100ms;}
.flv-task:hover td{background:var(--c-line-3);}
.flv-name-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.flv-tname{font-weight:500;}
.flv-tname.is-done{text-decoration:line-through;color:var(--c-mute-3);font-weight:400;}
.flv-sow{font-size:11px;color:var(--c-mute-3);}
.flv-flags{display:inline-flex;gap:4px;flex-wrap:wrap;}
.flv-asg{display:flex;align-items:center;gap:6px;}
.flv-aname{font-size:12px;}
.flv-unasg{color:var(--c-mute-3);font-style:italic;font-size:12px;}
.flv-due{font-size:12px;color:var(--c-mute);white-space:nowrap;}
.flv-dash{color:var(--c-mute-3);}
.flv-type{padding:1px 8px;font-size:11px;}
.flv-fork td{padding:4px 12px;border-bottom:1px solid var(--c-line-3);background:#fff;}
.flv-fork-in{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:1px 0 1px 2px;border-left:2px dashed var(--c-line);padding-left:8px;}
.flv-fork-in [data-lucide]{color:var(--c-mute-3);}
.flv-in-lane td:first-child{box-shadow:inset 2px 0 0 var(--c-teal);}
.fork-pill.is-skip{opacity:0.55;text-decoration:line-through;}
.fork-skip-tag{font-size:9px;color:var(--c-mute-3);}
.rel-sub-box .flv thead th{background:var(--c-bg-off);}



/* v5.1: landing list card + sticky head */
.flv-card{box-shadow:0 2px 8px rgba(17,17,17,.05);}
.flv-card .flv thead th{position:sticky;top:0;z-index:2;background:#fff;box-shadow:0 1px 0 var(--c-line-2);}



/* ============ v7 ============ */
.composer-hint{font-size:11px;color:var(--c-mute-3);}
.note-composer{position:relative;}
.mention-sug{position:absolute;left:16px;bottom:calc(100% - 6px);width:290px;background:#fff;border:1px solid var(--c-line-2);border-radius:11px;box-shadow:0 10px 28px rgba(17,17,17,.14);z-index:80;overflow:hidden;}
.msug-cap{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c-mute-3);padding:8px 12px 4px;}
.msug-row{display:flex;align-items:center;gap:10px;padding:6px 10px;cursor:pointer;}
.msug-row:hover{background:var(--c-bg-off);}
.msug-main{display:flex;flex-direction:column;line-height:1.3;min-width:0;}
.msug-name{font-size:12.5px;font-weight:600;color:var(--c-ink);}
.msug-role{font-size:11px;color:var(--c-mute-2);}
.fork-by{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#157A41;background:#E4F4EB;border-radius:999px;padding:1px 8px;}
.fork-by [data-lucide]{color:#157A41;}
.qa-wrap{position:relative;display:inline-flex;}
.qa-wrap.is-open{z-index:70;}
.qa-btn{display:inline-flex;align-items:center;gap:6px;border:1px dashed var(--c-line);background:none;color:var(--c-mute-2);border-radius:999px;padding:2px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 120ms;}
.qa-btn:hover{border-color:var(--c-primary);color:var(--c-primary);border-style:solid;background:#FFF3F2;}
.qa-drop{left:0;right:auto;top:calc(100% + 4px);}
.sow-quick{display:flex;gap:8px;padding:12px 18px 0;}
.sq-chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--c-line-2);background:#fff;color:var(--c-mute);border-radius:999px;padding:4px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 120ms;}
.sq-chip:hover{border-color:var(--c-mute-3);}
.sq-chip.is-on{background:var(--c-navy);border-color:var(--c-navy);color:#fff;}
.sq-chip.is-on [data-lucide]{color:#fff;}
.sow-orig{display:flex;align-items:center;gap:6px;min-width:0;font-size:12px;color:var(--c-ink);white-space:nowrap;}
.sow-orig-name{overflow:hidden;text-overflow:ellipsis;max-width:220px;}
.sow-orig-sep{color:var(--c-mute-3);flex-shrink:0;}
.sow-orig-sop{color:var(--c-mute-2);overflow:hidden;text-overflow:ellipsis;}
.mk-hint{font-size:9px;font-weight:700;color:#B8690B;background:#FFF1DD;border-radius:999px;padding:1px 6px;margin-left:4px;vertical-align:1px;}
.due-input{border:1px solid var(--c-line);border-radius:7px;padding:3px 8px;font-size:12px;font-family:inherit;color:var(--c-ink);background:#fff;max-width:140px;}
.due-input:focus{outline:none;border-color:var(--c-primary);}



/* v8 */
.qa-drop{position:fixed;left:auto;right:auto;top:auto;width:320px;}
.qa-x{display:none;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:0;background:var(--c-line-3);color:var(--c-mute-2);cursor:pointer;padding:0;flex-shrink:0;}
.flv-asg:hover .qa-x{display:inline-flex;}
.qa-x:hover{background:#FFE9E7;color:var(--c-danger);}



/* v11: review card */
.flv-revof{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:#B8690B;background:#FFF6EA;border:1px solid #FFE1BF;border-radius:999px;padding:0 8px;}
.flv-revof [data-lucide]{color:#B8690B;}
.rv-block .td-block-t [data-lucide]{color:var(--c-primary);}
.rv-target{border:1px solid var(--c-line-2);border-radius:10px;padding:10px 12px;background:var(--c-bg-off);display:flex;flex-direction:column;gap:8px;}
.rv-line{display:flex;align-items:center;gap:8px;font-size:12.5px;flex-wrap:wrap;}
.rv-who{color:var(--c-mute);}
.rv-tname{color:var(--c-ink);}
.rv-msg{display:flex;gap:6px;font-size:12.5px;color:var(--c-ink);background:#fff;border:1px solid var(--c-line-3);border-radius:8px;padding:8px 10px;line-height:1.55;}
.rv-msg [data-lucide]{color:var(--c-mute-3);flex-shrink:0;margin-top:3px;}
.rv-files{display:flex;flex-direction:column;gap:4px;}
.rv-file{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--c-line-3);border-radius:8px;padding:6px 10px;font-size:12px;}
.rv-file [data-lucide]{color:var(--c-mute-2);}
.rv-fname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rv-fsize{font-size:11px;color:var(--c-mute-3);}
.rv-none{font-size:12px;color:var(--c-mute-3);font-style:italic;}
.rv-hint{margin-top:10px;font-size:12px;color:var(--c-mute-2);line-height:1.6;border-top:1px dashed var(--c-line-2);padding-top:8px;}



/* v15: modal container (หายไปตอน rebrand) + reject panel */
.wm-modal{background:#fff;border:1px solid var(--c-line-2);border-radius:14px;box-shadow:0 18px 48px rgba(17,17,17,.22);width:520px;max-width:94vw;max-height:86vh;overflow:auto;display:flex;flex-direction:column;}
.wm-sub{font-size:12px;color:var(--c-mute-2);margin-top:2px;line-height:1.5;}
.wm-foot{display:flex;justify-content:flex-end;gap:8px;padding:10px 16px 16px;}
.reject-row{display:flex;gap:8px;align-items:center;}
.reject-panel{flex-direction:column;align-items:stretch;gap:8px;}
.reject-other{height:34px;font-size:12.5px;}

</style>
