:root{--z-sticky:10;--z-shell:20;--z-dropdown:30;--z-backdrop:50;--z-drawer:51;--z-modal:60;--z-toast:80;--c-navy:#111111;--c-navy-2:#111111;--c-primary:#FF3B30;--c-primary-hover:#E62E24;--c-teal:#FF9A1F;--c-teal-light:#FFB763;--c-ink:#111111;--c-mute:#54565C;--c-mute-2:#73757B;--c-mute-3:#9A9CA2;--c-line:#DEDAD4;--c-line-2:#E9E5E0;--c-line-3:#F1EEEA;--c-bg-off:#FAF8F5;--c-success:#1F9D55;--c-warning:#E8870F;--c-danger:#E62E24;--sidebar-w:232px;--shell-h:52px;--fs-h1:22px;--fs-h2:17px;--fs-h3:15px;--fs-body:14px;--fs-sub:13px;--fs-meta:12px;--fs-cap:11px;--fs-kpi:28px;--sp-xs:4px;--sp-sm:8px;--sp-md:12px;--sp-lg:20px;--sp-xl:28px;--r-xs:4px;--r-sm:6px;--r-md:8px;--r-lg:12px;--r-full:999px;}

.content{padding:24px;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:2px 16px 0;border-radius:8px;font-size:13px;font-weight:500;border:1px solid transparent;background:transparent;white-space:nowrap;transition:all 120ms;user-select:none;}.btn [data-lucide]{width:15px;height:15px;}

@keyframes spin{to{transform:rotate(360deg);}}.spin{animation:spin .8s linear infinite;}

.select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2373757B' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:32px;appearance:none;}
.input-search{position:relative;flex:1;max-width:300px;}.input-search input{padding-left:36px;}.input-search .lead-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--c-mute-2);pointer-events:none;}
.table-scroll{overflow-x:auto;}
.table-scroll.is-sticky{max-height:620px;overflow-y:auto;scrollbar-gutter:stable;}
.table-scroll.is-sticky thead th{position:sticky;top:0;z-index:3;background:var(--c-bg-off);box-shadow:inset 0 -1px 0 var(--c-line-2);}.table{width:100%;border-collapse:collapse;font-size:13px;}.table thead{background:var(--c-bg-off);}

.table th.is-sortable{cursor:pointer;user-select:none;}.table th.is-sortable:hover{color:var(--c-ink);background:var(--c-line-3);}.table th .sort-arrow{display:inline-block;margin-left:4px;opacity:0.4;}.table th.is-sorted .sort-arrow{opacity:1;color:var(--c-primary);}

.uc-name{font-weight:600;color:var(--c-ink);font-size:13px;line-height:1.3;}

.row-actions{display:inline-flex;gap:2px;}.ra-btn{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:0;color:var(--c-mute-2);border-radius:6px;transition:all 120ms;}.ra-btn:hover{background:var(--c-line-3);color:var(--c-primary);}.ra-btn.is-danger:hover{background:#FFE9E7;color:var(--c-danger);}.ra-btn [data-lucide]{width:15px;height:15px;}
.table-footer{padding:12px 18px;background:var(--c-bg-off);border-top:1px solid var(--c-line-2);display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--c-mute);flex-wrap:wrap;gap:10px;}

/* ===== v6.1 Pattern B drawer chrome (dw-head + d-stepper + dw-footer — locked to pr.html) ===== */
.top-icon-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:0;background:transparent;border-radius:var(--r-sm);color:var(--c-mute-2);cursor:pointer;transition:all 120ms;flex-shrink:0;}
.top-icon-btn:hover{background:var(--c-line-3);color:var(--c-ink);}

.dw-sub{font-size:var(--fs-meta);color:var(--c-mute-2);margin-top:4px;}

.stepper-item.active .stepper-circle{background:var(--c-primary);color:#fff;border-color:var(--c-primary);box-shadow:0 0 0 4px rgba(255,59,48,0.12);}

.hidden{display:none !important;}
