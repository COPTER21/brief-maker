<!-- BLOCK: toolbar-filter — ลอกทั้งก้อนแล้ว bind data · ห้ามออกแบบใหม่ (#78)
     กติกา: ทุก control อยู่แถวเดียว · select กว้างตามเนื้อหา (160-240px) ห้ามเต็มแถวเดี่ยว
     counts แสดงที่เดียว: มี stat row แล้ว → ไม่ต้องมี chip row ซ้ำ (คลิก stat card = filter) -->
<div class="toolbar" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
  <div class="search-box" style="flex:1;min-width:220px;max-width:420px">
    <i data-lucide="search"></i>
    <input class="input" placeholder="ค้นหาชื่อ / รหัสสินค้า / รหัสเก่า…">
  </div>
  <select class="select" style="width:200px"><option>ทุกประเภท</option></select>
  <select class="select" style="width:180px"><option>ทุกสถานะ</option></select>
  <button class="btn btn-ghost btn-sm" onclick="clearFilters()">
    <i data-lucide="rotate-ccw"></i> ล้างตัวกรอง</button>
</div>
