<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Core Shell Ultimate · CUBE NATIVE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">

<style>
:root {
  --c-navy: #111111; --c-navy-2: #111111;
  --c-primary: #FF3B30; --c-primary-hover: #E62E24;
  --c-teal: #FF9A1F; --c-teal-light: #FFB763;
  --c-ink: #111111; --c-mute: #54565C; --c-mute-2: #73757B; --c-mute-3: #9A9CA2;
  --c-line: #DEDAD4; --c-line-2: #E9E5E0; --c-line-3: #F1EEEA; --c-bg-off: #FAF8F5;
  --c-success: #1F9D55; --c-warning: #E8870F; --c-danger: #E62E24;
  --sidebar-w: 244px; --rail-w: 58px; --shell-h: 52px;
  --fs-h1: 22px; --fs-h2: 17px; --fs-h3: 15px; --fs-body: 14px;
  --fs-sub: 13px; --fs-meta: 12px; --fs-cap: 11px; --fs-kpi: 28px;
  --sp-xs: 4px; --sp-sm: 8px; --sp-md: 12px; --sp-lg: 20px; --sp-xl: 28px;
  --r-xs: 4px; --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-full: 999px;
  --nav-l1: 13px; --nav-l2: 12.5px; --nav-l3: 12px; --nav-cap: 10px;
  --ease: cubic-bezier(.4, 0, .2, 1);
  --rail: rgba(255,255,255,.12);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { scrollbar-gutter: stable; }
/* Iron Rule #49 — minimal scrollbar */
* { scrollbar-width: thin; scrollbar-color: rgba(17,17,17,.16) transparent; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(17,17,17,.14); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: rgba(17,17,17,.26); }
.sidebar, .slide { scrollbar-color: rgba(255,255,255,.28) transparent; }
body {
  font-family: 'Satoshi', 'Noto Sans Thai', system-ui, sans-serif;
  background: var(--c-bg-off); color: #2A2B2F;
  font-size: var(--fs-body); line-height: 1.5;
  -webkit-font-smoothing: antialiased; min-width: 1180px;
}
a { text-decoration: none; color: inherit; }
button { font-family: inherit; cursor: pointer; }
[data-lucide] { flex-shrink: 0; }
:focus-visible { outline: 2px solid var(--c-primary); outline-offset: 2px; border-radius: var(--r-xs); }
svg.lucide { width: 1em; height: 1em; display: inline-block; vertical-align: -0.125em; flex-shrink: 0; }
svg.lucide.w-3 { width: 12px; } svg.lucide.h-3 { height: 12px; }
svg.lucide.w-3\.5 { width: 14px; } svg.lucide.h-3\.5 { height: 14px; }
svg.lucide.w-4 { width: 16px; } svg.lucide.h-4 { height: 16px; }
svg.lucide.w-5 { width: 20px; } svg.lucide.h-5 { height: 20px; }
@media (prefers-reduced-motion: reduce) { * { transition-duration: 1ms !important; animation-duration: 1ms !important; } }

/* ===================== SIDEBAR ===================== */
.sidebar {
  position: fixed; inset: 0 auto 0 0;
  width: var(--sidebar-w);
  background: #111111;
  color: #E9E5E0; z-index: 35;   /* เหนือ scrim(30) — กดไอคอนเดิมซ้ำเพื่อปิด flyout ได้ */
  display: flex; flex-direction: column;
  border-right: 1px solid rgba(255,255,255,.06);
  transition: width 260ms var(--ease);
  overflow: hidden;
}
body.icon-mode .sidebar { width: var(--rail-w); }

.sb-brand {
  display: flex; align-items: center; gap: 11px;
  padding: 15px 12px; min-height: 62px; flex-shrink: 0;
  border-bottom: 1px solid rgba(255,255,255,.06);
}
body.icon-mode .sb-brand { flex-direction: column; align-items: center; gap: 9px; padding: 14px 0 12px; }
.sb-logo {
  width: 34px; height: 34px; border-radius: 9px;
  background: linear-gradient(135deg, #FF3B30, #FF9A1F);
  display: inline-flex; align-items: center; justify-content: center;
  color: #fff; flex-shrink: 0; box-shadow: 0 4px 12px rgba(255,59,48,.3);
}
.sb-btext { min-width: 0; opacity: 1; transition: opacity 160ms var(--ease); }
body.icon-mode .sb-btext { display: none; }
.sb-name { font-weight: 700; font-size: 13px; color: #fff; letter-spacing: -.01em; line-height: 1.2; white-space: nowrap; }
.sb-sub { font-size: 9.5px; color: #9A9CA2; letter-spacing: .06em; font-weight: 600; text-transform: uppercase; margin-top: 2px; white-space: nowrap; }

.sb-toggle {
  margin-left: auto; flex-shrink: 0;
  width: 30px; height: 30px;
  display: inline-flex; align-items: center; justify-content: center;
  border: 0; background: rgba(255,255,255,.06); color: #93A6BF;
  border-radius: var(--r-sm);
  transition: background 130ms var(--ease), color 130ms var(--ease);
  position: relative;
}
.sb-toggle:hover { background: rgba(255,255,255,.15); color: #fff; }
body.icon-mode .sb-toggle { margin-left: 0; }
.sb-toggle .tip { margin-left: 8px; }
.sb-toggle:hover .tip, .sb-toggle:focus-visible .tip { opacity: 1; transition-delay: 240ms; }
body:not(.icon-mode) .sb-toggle .tip { display: block; left: auto; right: 100%; margin-right: 8px; margin-left: 0; }

.sb-nav { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 2px 8px 14px; }
body.icon-mode .sb-nav { padding: 2px 4px 14px; }
.sb-nav::-webkit-scrollbar { width: 5px; }
.sb-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,.28); border-radius: 99px; }
.sb-cap { font-size: var(--nav-cap); font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: #85878D; padding: 8px 10px 5px; white-space: nowrap; }
body.icon-mode .sb-cap { display: none; }

/* ---------- L1 : Module ---------- */
.mod { margin-bottom: 3px; border-radius: var(--r-md); }
.mod[data-open="true"] { background: rgba(0,0,0,.20); padding-bottom: 5px; margin-bottom: 7px; box-shadow: inset 0 1px 0 rgba(255,255,255,.05); }
body.icon-mode .mod { background: none; padding: 0; margin: 0 0 3px; }

.mod-h {
  width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 9px 10px; border: 0; background: transparent; border-radius: var(--r-md);
  color: #C3CEDC; font-size: var(--nav-l1); font-weight: 500; text-align: left;
  transition: background 130ms var(--ease), color 130ms var(--ease);
  position: relative;
}
.mod-h:hover { background: rgba(255,255,255,.07); color: #fff; }
.mod-h .lbl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mod-h .chev { opacity: .42; transition: transform 200ms var(--ease); }
.mod[data-open="false"] .chev { transform: rotate(-90deg); }
.mod[data-open="false"] .feats { display: none; }
.mod.has-active > .mod-h { color: #fff; font-weight: 600; }
.mod.has-active > .mod-h [data-lucide]:first-child { color: var(--c-teal-light); }

/* icon mode: module = ปุ่มไอคอน */
body.icon-mode .mod-h { justify-content: center; padding: 0; width: 40px; height: 40px; margin: 0 auto; border-radius: var(--r-md); }
body.icon-mode .mod-h .lbl, body.icon-mode .mod-h .chev { display: none; }
body.icon-mode .mod .feats { display: none; }
body.icon-mode .mod-h[aria-expanded="true"] { background: rgba(255,255,255,.14); color: #fff; }
body.icon-mode .mod.has-active > .mod-h::before {
  content: ''; position: absolute; left: -8px; top: 9px; bottom: 9px;
  width: 3px; background: var(--c-teal-light); border-radius: 0 2px 2px 0;
}
.tip {
  position: absolute; left: 100%; margin-left: 10px; top: 50%; transform: translateY(-50%);
  background: var(--c-ink); color: #fff; font-size: 11px; font-weight: 500;
  padding: 5px 9px 6px; border-radius: var(--r-sm); white-space: nowrap;
  opacity: 0; pointer-events: none; transition: opacity 120ms; z-index: 26; display: none;
}
body.icon-mode .tip { display: block; }
body.icon-mode .mod-h:hover .tip, body.icon-mode .mod-h:focus-visible .tip { opacity: 1; transition-delay: 240ms; }

/* ---------- L2 : Feature / Group ---------- */
.feats { padding: 2px 6px 2px; }
.item {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px; border-radius: var(--r-sm);
  color: #BCC9D9; font-size: var(--nav-l2); font-weight: 500;
  cursor: pointer; transition: all 120ms; margin-bottom: 1px; position: relative;
  white-space: nowrap;
}
.item:hover { background: rgba(255,255,255,.07); color: #fff; }
.item.is-active { background: var(--c-primary); color: #fff; font-weight: 600; box-shadow: 0 2px 10px rgba(255,59,48,.32); }
.item.is-active::before { content: ''; position: absolute; left: -6px; top: 7px; bottom: 7px; width: 3px; background: #fff; border-radius: 0 2px 2px 0; }
.item [data-lucide] { opacity: .8; }
.item.is-active [data-lucide] { opacity: 1; }

.grp { margin: 5px 0 2px; border-radius: var(--r-sm); }
.grp[data-open="true"] { background: rgba(0,0,0,.16); padding-bottom: 3px; }
.grp-h {
  width: 100%; display: flex; align-items: center; gap: 9px;
  padding: 7px 10px; border: 0; background: transparent; border-radius: var(--r-sm);
  color: #8FA1B8; font-size: var(--nav-l3); font-weight: 600; letter-spacing: .03em;
  text-align: left; transition: all 120ms; white-space: nowrap;
}
.grp-h:hover { background: rgba(255,255,255,.06); color: #DEDAD4; }
.grp.has-active > .grp-h { color: #E9E5E0; }
.grp-h .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.grp-h .chev { opacity: .45; transition: transform 200ms var(--ease); }
.grp[data-open="false"] .chev { transform: rotate(-90deg); }
.grp[data-open="false"] .subs { display: none; }

/* ---------- L3 : Sub-feature ---------- */
.subs { margin: 1px 4px 2px 20px; padding-left: 10px; border-left: 1px solid var(--rail); }
.sub {
  display: flex; align-items: center; gap: 9px; padding: 6px 9px;
  border-radius: var(--r-sm); color: #9FB0C4; font-size: var(--nav-l3); font-weight: 500;
  cursor: pointer; transition: all 120ms; margin-bottom: 1px; position: relative; white-space: nowrap;
}
.sub::before { content: ''; position: absolute; left: -10px; top: 50%; width: 6px; height: 1px; background: var(--rail); }
.sub:hover { background: rgba(255,255,255,.07); color: #fff; }
.sub.is-active { background: var(--c-primary); color: #fff; font-weight: 600; }
.sub.is-active::before { background: #fff; width: 8px; left: -11px; }
.sub [data-lucide] { opacity: .72; }
.sub.is-active [data-lucide] { opacity: 1; }

.sb-footer { padding: 11px 14px; border-top: 1px solid rgba(255,255,255,.06); display: flex; align-items: center; gap: 8px; font-size: 11px; color: #9A9CA2; flex-shrink: 0; white-space: nowrap; }
body.icon-mode .sb-footer { justify-content: center; padding: 11px 0; }
body.icon-mode .sb-footer span:not(.pulse-dot) { display: none; }
.pulse-dot { width: 7px; height: 7px; background: var(--c-teal); border-radius: 50%; box-shadow: 0 0 0 3px rgba(255,154,31,.20); animation: pulse 2s infinite; flex-shrink: 0; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .6; } }

/* ===================== SLIDE PANEL (icon mode · L2+L3) ===================== */
.fly-scrim { position: fixed; inset: 0; z-index: 30; display: none; }
.fly-scrim.on { display: block; }

.slide {
  position: fixed; top: 0; bottom: 0; left: var(--rail-w); width: 216px; z-index: 34;
  background: var(--c-navy); border-right: 1px solid rgba(255,255,255,.07);
  box-shadow: 12px 0 32px rgba(17,17,17,.34);
  display: flex; flex-direction: column;
  transform: translateX(-102%); opacity: 0; pointer-events: none;
  transition: transform 260ms var(--ease), opacity 180ms var(--ease);
}
.slide.on { transform: translateX(0); opacity: 1; pointer-events: auto; }
body:not(.icon-mode) .slide { display: none; }

.slide-head { padding: 15px 14px 13px; border-bottom: 1px solid rgba(255,255,255,.08); flex-shrink: 0; }
.slide-kick { font-size: 9px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #9A9CA2; }
.slide-title { display: flex; align-items: center; gap: 9px; margin-top: 3px; }
.slide-title [data-lucide] { color: var(--c-teal-light); }
.slide-title span { font-size: var(--fs-h3); font-weight: 700; color: #fff; line-height: 1.25; }

.slide-nav { flex: 1; overflow-y: auto; padding: 8px 8px 12px; }
.slide-nav::-webkit-scrollbar { width: 5px; }
.slide-nav::-webkit-scrollbar-thumb { background: rgba(255,255,255,.28); border-radius: 99px; }
.slide-nav.anim .item, .slide-nav.anim .sub { animation: fadeUp 240ms var(--ease) backwards; }
.slide-nav .item.cur:not(.is-active), .slide-nav .sub.cur:not(.is-active) { background: rgba(255,255,255,.11); color: #fff; }
@keyframes fadeUp { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: translateX(0); } }

.slide-foot { padding: 11px 14px; border-top: 1px solid rgba(255,255,255,.07); display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: #9A9CA2; flex-shrink: 0; white-space: nowrap; }
.slide-hint { padding: 8px 14px 0; font-size: 10px; color: #85878D; display: flex; align-items: center; gap: 6px; }

/* ===================== MAIN ===================== */
.main { margin-left: var(--sidebar-w); min-height: 100vh; background: var(--c-bg-off); transition: margin-left 260ms var(--ease); }
body.icon-mode .main { margin-left: var(--rail-w); }
.shell-bar {
  position: sticky; top: 0; background: #fff;
  border-bottom: 1px solid var(--c-line-2); height: var(--shell-h);
  display: flex; align-items: center; padding: 0 22px; z-index: 19; gap: 12px;
}
.breadcrumb { display: flex; align-items: center; gap: 7px; font-size: var(--fs-sub); color: var(--c-mute); }
.breadcrumb a { cursor: pointer; transition: color 120ms; }
.breadcrumb a:hover { color: var(--c-primary); }
.breadcrumb .sep { color: var(--c-mute-3); }
.breadcrumb-current { color: var(--c-ink); font-weight: 500; }
.search-trigger {
  display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 8px 0 11px; margin-left: auto;
  background: var(--c-bg-off); border: 1px solid var(--c-line-2); border-radius: var(--r-md);
  color: var(--c-mute-2); font-size: var(--fs-sub); font-weight: 500; min-width: 210px; transition: all 120ms; padding-top: 1px;
}
.search-trigger:hover { border-color: var(--c-line); background: #fff; color: var(--c-mute); }
.search-trigger .st-lbl { flex: 1; text-align: left; }
.kbd { font-family: 'Inter', system-ui, sans-serif; font-size: 10.5px; font-weight: 600; background: #fff; color: var(--c-mute-2); border: 1px solid var(--c-line-2); border-radius: var(--r-xs); padding: 2px 6px; line-height: 1.4; }
.icon-btn { width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; background: transparent; border: 0; color: var(--c-mute); border-radius: 7px; position: relative; transition: all 120ms; }
.icon-btn:hover { background: var(--c-line-3); color: var(--c-ink); }
.notif-dot { position: absolute; top: 7px; right: 8px; width: 7px; height: 7px; background: var(--c-danger); border-radius: 50%; border: 2px solid #fff; }
.user-chip { display: flex; align-items: center; gap: 9px; padding: 5px 10px 5px 12px; border-radius: var(--r-md); cursor: pointer; transition: background 120ms; }
.user-chip:hover { background: var(--c-line-3); }
.user-text { line-height: 1.2; text-align: right; }
.user-name { font-size: 12.5px; font-weight: 500; color: var(--c-ink); white-space: nowrap; }
.user-role { font-size: 10.5px; color: var(--c-mute-2); white-space: nowrap; margin-top: 1px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, var(--c-primary), var(--c-teal)); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: var(--fs-meta); font-weight: 600; flex-shrink: 0; }

/* ===================== CONTENT (placeholder — นอก scope) ===================== */
.content { padding: 22px; }
.placeholder {
  min-height: calc(100vh - var(--shell-h) - 44px);
  border: 2px dashed var(--c-line); border-radius: var(--r-lg);
  background: #fff;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  text-align: center; padding: 40px 20px;
}
.ph-ico { width: 52px; height: 52px; border-radius: var(--r-lg); background: var(--c-line-3); color: var(--c-mute-3); display: inline-flex; align-items: center; justify-content: center; }
.ph-ico [data-lucide] { width: 24px; height: 24px; }
.ph-h { font-size: var(--fs-h2); font-weight: 700; color: var(--c-navy); margin: 4px 0 0; }
.ph-p { font-size: var(--fs-sub); color: var(--c-mute-2); margin: 0; max-width: 460px; line-height: 1.7; }
.ph-route { font-family: 'Inter', monospace; font-size: var(--fs-meta); font-weight: 600; color: var(--c-mute); background: var(--c-bg-off); border: 1px solid var(--c-line-2); border-radius: var(--r-full); padding: 4px 12px; margin-top: 6px; }

/* ===================== COMMAND PALETTE ===================== */
.cp-backdrop { position: fixed; inset: 0; background: rgba(17,17,17,.50); z-index: 60; opacity: 0; pointer-events: none; transition: opacity 180ms; display: flex; align-items: flex-start; justify-content: center; padding-top: 12vh; }
.cp-backdrop.on { opacity: 1; pointer-events: auto; }
.cp { width: 560px; max-width: 92vw; background: #fff; border-radius: var(--r-lg); box-shadow: 0 24px 64px rgba(17,17,17,.28); overflow: hidden; transform: scale(.97) translateY(-6px); transition: transform 180ms; display: flex; flex-direction: column; max-height: 66vh; }
.cp-backdrop.on .cp { transform: scale(1) translateY(0); }
.cp-input-row { display: flex; align-items: center; gap: 11px; padding: 14px 16px; border-bottom: 1px solid var(--c-line-2); flex-shrink: 0; }
.cp-input-row [data-lucide] { color: var(--c-mute-3); }
.cp-input { flex: 1; border: 0; outline: 0; font-family: inherit; font-size: var(--fs-h3); color: var(--c-ink); background: transparent; padding: 2px 0 0; }
.cp-input::placeholder { color: var(--c-mute-3); font-weight: 400; }
.cp-list { overflow-y: auto; padding: 8px; }
.cp-sec { font-size: 9.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--c-mute-3); padding: 9px 10px 5px; }
.cp-row { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: var(--r-sm); cursor: pointer; transition: background 100ms; }
.cp-row.cur { background: #EAF1FF; }
.cp-ico { width: 28px; height: 28px; border-radius: var(--r-sm); background: var(--c-line-3); color: var(--c-navy); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.cp-row.cur .cp-ico { background: var(--c-primary); color: #fff; }
.cp-txt { min-width: 0; flex: 1; }
.cp-lbl { font-size: var(--fs-sub); font-weight: 600; color: var(--c-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cp-path { font-size: 11px; color: var(--c-mute-2); margin-top: 1px; }
.cp-row .cp-enter { opacity: 0; }
.cp-row.cur .cp-enter { opacity: 1; }
.cp-empty { padding: 34px 16px; text-align: center; color: var(--c-mute-2); font-size: var(--fs-sub); }
.cp-empty [data-lucide] { width: 22px; height: 22px; color: var(--c-mute-3); margin-bottom: 8px; }
.cp-foot { border-top: 1px solid var(--c-line-2); padding: 9px 14px; display: flex; align-items: center; gap: 14px; font-size: 10.5px; color: var(--c-mute-2); flex-shrink: 0; background: var(--c-bg-off); }
.cp-foot span { display: inline-flex; align-items: center; gap: 5px; }

.toast { position: fixed; right: 20px; bottom: 20px; background: var(--c-navy); color: #fff; padding: 12px 16px; border-radius: var(--r-md); font-size: var(--fs-sub); font-weight: 500; display: flex; align-items: center; gap: 9px; box-shadow: 0 12px 32px rgba(17,17,17,.28); opacity: 0; transform: translateY(8px); pointer-events: none; transition: all 200ms; z-index: 80; }
.toast.on { opacity: 1; transform: translateY(0); }
.toast [data-lucide] { width: 17px; height: 17px; color: var(--c-teal-light); }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sb-brand">
    <div class="sb-logo"><i data-lucide="box" class="w-4 h-4"></i></div>
    <div class="sb-btext">
      <div class="sb-name">Cube 4.0 · Core</div>
      <div class="sb-sub">Cube ERP</div>
    </div>
    <button class="sb-toggle" type="button" id="sbToggle" aria-pressed="false" aria-label="สลับโหมดเมนู" title="สลับโหมดเมนู (Ctrl+B)" onclick="toggleMode()">
      <i data-lucide="panel-left-close" class="w-4 h-4" id="sbToggleIco"></i>
      <span class="tip" id="sbToggleTxt">ย่อเป็นไอคอน</span>
    </button>
  </div>

  <nav class="sb-nav" id="sbNav" aria-label="เมนูหลัก"></nav>

  <div class="sb-footer">
    <span class="pulse-dot"></span>
    <span>All systems operational</span>
  </div>
</aside>

<div class="fly-scrim" id="flyScrim"></div>

    'https://cdnjs.cloudflare.com/ajax/libs/lucide/' + version + '/lucide.min.js'
  ];
  var i = 0;
  function tryNext() {
    if (i >= cdns.length) { window.lucide = window.lucide || { createIcons: function() {} }; window.dispatchEvent(new Event('lucide:ready')); return; }
    var s = document.createElement('script');
    s.src = cdns[i++];
    s.onload = function() { window.dispatchEvent(new Event('lucide:ready')); };
    s.onerror = tryNext;
    document.head.appendChild(s);

})();

const FLAT = [];
MENU.forEach(m => m.children.forEach(c => {
  if (c.group) c.children.forEach(f => FLAT.push({ mod: m, grp: c, feat: f }));
  else FLAT.push({ mod: m, grp: null, feat: c });
}));

const DEF = 'op-sop';
const isMac = /Mac|iPhone|iPad/.test(navigator.platform || '');

const state = {
  route: DEF,
  mode: 'full',                       // 'full' | 'icon'
  openMods: new Set(['opproc']),      // full mode accordion
  openGrps: new Set(['op-manage']),
  flyMod: null,                       // icon mode
  flyGrps: new Set(['op-manage']),
  flyAnim: false,               // true เฉพาะตอน panel เพิ่งเปิด — กันรีอนิเมตตอนกางกลุ่ม
  flyCur: -1,
  cp: { open: false, q: '', cur: 0, results: [] }
};

function renderIcons() { if (window.lucide && typeof window.lucide.createIcons === 'function') window.lucide.createIcons(); }
window.addEventListener('lucide:ready', renderIcons);
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function trailOf(fid) { return FLAT.find(x => x.feat.id === fid) || FLAT[0]; }

/* ===================== MODE TOGGLE ===================== */
function revealActive() {          // กางให้เห็นหน้าปัจจุบัน — เรียกเฉพาะตอนเปลี่ยน route / สลับโหมด
  const t = trailOf(getRoute());
  state.openMods.add(t.mod.id);
  if (t.grp) state.openGrps.add(t.grp.id);
}
function toggleMode() {
  state.mode = state.mode === 'full' ? 'icon' : 'full';
  state.flyMod = null;
  state.flyCur = -1;
  if (state.mode === 'full') revealActive();
  render();
}

/* ===================== SIDEBAR ===================== */
function sidebarHTML() {
  const t = trailOf(state.route);
  const icon = state.mode === 'icon';
  return `<div class="sb-cap">โมดูล</div>` + MENU.map(m => {
    const open = icon ? (state.flyMod === m.id) : state.openMods.has(m.id);
    const hasActive = m.id === t.mod.id;

    const kids = m.children.map(c => {
      if (c.group) {
        const gOpen = state.openGrps.has(c.id);
        const gActive = t.grp && t.grp.id === c.id;
        const subs = c.children.map(f => `
          <a class="sub${f.id === t.feat.id ? ' is-active' : ''}" data-feature="${f.id}" onclick="go('${f.id}')">
            <i data-lucide="${f.icon}" class="w-3.5 h-3.5"></i><span>${esc(f.label)}</span></a>`).join('');
        return `<div class="grp${gActive ? ' has-active' : ''}" data-group="${c.id}" data-open="${gOpen}">
          <button class="grp-h" type="button" aria-expanded="${gOpen}" onclick="toggleGrp('${c.id}')">
            <i data-lucide="${c.icon}" class="w-3.5 h-3.5"></i><span class="lbl">${esc(c.label)}</span>
            <i data-lucide="chevron-down" class="chev w-3 h-3"></i></button>
          <div class="subs">${subs}</div></div>`;
      }
      return `<a class="item${c.id === t.feat.id ? ' is-active' : ''}" data-feature="${c.id}" onclick="go('${c.id}')">
        <i data-lucide="${c.icon}" class="w-4 h-4"></i><span>${esc(c.label)}</span></a>`;
    }).join('');

    return `<div class="mod${hasActive ? ' has-active' : ''}" data-module="${m.id}" data-open="${open && !icon}">
      <button class="mod-h" type="button" id="mod-${m.id}" aria-expanded="${open}"
        ${icon ? `aria-haspopup="menu" aria-label="${esc(m.label)}" title="${esc(m.label)}"` : ''}
        onclick="clickMod('${m.id}', event)">
        <i data-lucide="${m.icon}" class="w-4 h-4"></i>
        <span class="lbl">${esc(m.label)}</span>
        <i data-lucide="chevron-down" class="chev w-3 h-3"></i>
        <span class="tip">${esc(m.label)}</span>
      </button>
      <div class="feats">${kids}</div>
    </div>`;
  }).join('');
}

function clickMod(mid, ev) {
  if (ev) ev.stopPropagation();
  if (state.mode === 'icon') {                 // ไอคอน → เปิด/ปิด flyout
    const opening = state.flyMod !== mid;
    state.flyMod = opening ? mid : null;
    state.flyCur = -1;
    state.flyAnim = opening;     // อนิเมตเฉพาะตอนเปิดโมดูลใหม่
    render();
    return;
  }
  if (state.openMods.has(mid)) state.openMods.delete(mid); else state.openMods.add(mid);
  render();
}
function toggleGrp(gid) {
  if (state.openGrps.has(gid)) state.openGrps.delete(gid); else state.openGrps.add(gid);
  render();
}

/* ===================== SLIDE PANEL (icon mode) ===================== */
function slideHTML() {
  const m = MENU.find(x => x.id === state.flyMod);
  if (!m) return '';
  const t = trailOf(state.route);
  const anim = state.flyAnim;
  let n = 0, idx = -1;
  const delay = () => anim ? ` style="animation-delay:${(n++) * 24}ms"` : '';

  const body = m.children.map(c => {
    if (c.group) {
      const gOpen = state.flyGrps.has(c.id);
      const gActive = t.grp && t.grp.id === c.id;
      const subs = c.children.map(f => {
        idx++;
        return `<a class="sub${f.id === t.feat.id ? ' is-active' : ''}${idx === state.flyCur ? ' cur' : ''}"
          role="menuitem" tabindex="-1" data-feature="${f.id}" data-idx="${idx}"${delay()} onclick="go('${f.id}')">
          <i data-lucide="${f.icon}" class="w-3.5 h-3.5"></i><span>${esc(f.label)}</span></a>`;
      }).join('');
      return `<div class="grp${gActive ? ' has-active' : ''}" data-group="${c.id}" data-open="${gOpen}">
        <button class="grp-h" type="button" aria-expanded="${gOpen}" onclick="toggleFlyGrp('${c.id}', event)">
          <i data-lucide="${c.icon}" class="w-3.5 h-3.5"></i><span class="lbl">${esc(c.label)}</span>
          <i data-lucide="chevron-down" class="chev w-3 h-3"></i></button>
        <div class="subs">${subs}</div></div>`;
    }
    idx++;
    return `<a class="item${c.id === t.feat.id ? ' is-active' : ''}${idx === state.flyCur ? ' cur' : ''}"
      role="menuitem" tabindex="-1" data-feature="${c.id}" data-idx="${idx}"${delay()} onclick="go('${c.id}')">
      <i data-lucide="${c.icon}" class="w-4 h-4"></i><span>${esc(c.label)}</span></a>`;
  }).join('');

  return `<div class="slide-head">
      <div class="slide-kick">Module</div>
      <div class="slide-title"><i data-lucide="${m.icon}" class="w-4 h-4"></i><span>${esc(m.label)}</span></div>
    </div>
    <nav class="slide-nav${anim ? ' anim' : ''}" id="slideNav">${body}</nav>
    <div class="slide-hint"><i data-lucide="corner-down-left" class="w-3 h-3"></i><span>↑ ↓ เลื่อน · Enter เปิด · Esc ปิด</span></div>
    <div class="slide-foot"><span class="pulse-dot"></span><span>All systems operational</span></div>`;
}
function toggleFlyGrp(gid, ev) {
  if (ev) ev.stopPropagation();
  if (state.flyGrps.has(gid)) state.flyGrps.delete(gid); else state.flyGrps.add(gid);
  state.flyCur = -1;
  state.flyAnim = false;        // กางกลุ่ม = ไม่รีอนิเมตทั้ง panel
  render();
}
function closeFly(refocus) {
  const prev = state.flyMod;
  state.flyMod = null; state.flyCur = -1;
  render();
  if (refocus && prev) { const b = document.getElementById('mod-' + prev); if (b) b.focus(); }
}
function flyItems() { return Array.from(document.querySelectorAll('#slide .item, #slide .sub')); }
function moveFly(d) {
  const it = flyItems();
  if (!it.length) return;
  let n = state.flyCur + d;
  if (n < 0) n = it.length - 1;
  if (n >= it.length) n = 0;
  state.flyCur = n;
  it.forEach((el, i) => el.classList.toggle('cur', i === n));
  it[n].scrollIntoView({ block: 'nearest' });
}

/* ===================== NAV ===================== */
function go(fid) {
  location.hash = '#/' + fid;
  state.flyMod = null; state.flyCur = -1;
  closeCP();
}

function breadcrumbHTML() {
  const t = trailOf(state.route);
  const parts = [`<a>Core</a>`, `<i data-lucide="chevron-right" class="w-3 h-3 sep"></i>`, `<a onclick="clickMod('${t.mod.id}', event)">${esc(t.mod.label)}</a>`];
  if (t.grp) parts.push(`<i data-lucide="chevron-right" class="w-3 h-3 sep"></i>`, `<span>${esc(t.grp.label)}</span>`);
  parts.push(`<i data-lucide="chevron-right" class="w-3 h-3 sep"></i>`, `<span class="breadcrumb-current">${esc(t.feat.label)}</span>`);
  return parts.join('');
}

function contentHTML() {
  const t = trailOf(state.route);
  return `<div class="placeholder">
    <span class="ph-ico"><i data-lucide="layout-panel-left" class="w-5 h-5"></i></span>
    <h1 class="ph-h">Feature Section</h1>
    <p class="ph-p">พื้นที่เนื้อหาของ feature — <strong>อยู่นอก scope ของเอกสารชุดนี้</strong><br>
    Shell นี้ส่งมอบเฉพาะ <strong>เมนูฝั่งซ้าย (sidebar navigation)</strong> เท่านั้น</p>
    <span class="ph-route">#/${t.feat.id}</span>
  </div>`;
}

/* ===================== COMMAND PALETTE ===================== */
function openCP() {
  state.cp.open = true; state.cp.q = ''; state.cp.cur = 0;
  state.flyMod = null;
  render();
  const inp = document.getElementById('cpInput');
  inp.value = '';
  setTimeout(() => inp.focus(), 30);
}
function closeCP() {
  if (!state.cp.open) return;
  state.cp.open = false;
  render();
}
function cpSearch(q) {
  const s = q.trim().toLowerCase();
  if (!s) return FLAT.slice(0, 7);
  return FLAT.filter(x =>
    x.feat.label.toLowerCase().includes(s) ||
    x.mod.label.toLowerCase().includes(s) ||
    (x.grp && x.grp.label.toLowerCase().includes(s)) ||
    x.feat.id.includes(s)
  ).slice(0, 12);
}
function cpListHTML() {
  const rs = state.cp.results;
  if (!rs.length) return `<div class="cp-empty"><i data-lucide="search-x"></i><div>ไม่พบเมนูที่ตรงกับ "${esc(state.cp.q)}"</div></div>`;
  const head = state.cp.q.trim() ? 'ผลการค้นหา' : 'เมนูที่ใช้บ่อย';
  return `<div class="cp-sec">${head}</div>` + rs.map((x, i) => `
    <div class="cp-row${i === state.cp.cur ? ' cur' : ''}" data-idx="${i}" onclick="go('${x.feat.id}')">
      <span class="cp-ico"><i data-lucide="${x.feat.icon}" class="w-4 h-4"></i></span>
      <div class="cp-txt">
        <div class="cp-lbl">${esc(x.feat.label)}</div>
        <div class="cp-path">${esc(x.mod.label)}${x.grp ? ' › ' + esc(x.grp.label) : ''}</div>
      </div>
      <i data-lucide="corner-down-left" class="cp-enter w-3.5 h-3.5"></i>
    </div>`).join('');
}
function renderCPList() { document.getElementById('cpList').innerHTML = cpListHTML(); renderIcons(); }
function moveCP(d) {
  const n = state.cp.results.length;
  if (!n) return;
  state.cp.cur = (state.cp.cur + d + n) % n;
  renderCPList();
  const el = document.querySelector('.cp-row.cur');
  if (el) el.scrollIntoView({ block: 'nearest' });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  document.getElementById('toastMsg').textContent = msg;
  t.classList.add('on'); renderIcons();
  clearTimeout(window.__tt);
  window.__tt = setTimeout(() => t.classList.remove('on'), 3500);
}

/* ===================== KEYBOARD ===================== */
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if ((e.metaKey || e.ctrlKey) && k === 'k') { e.preventDefault(); state.cp.open ? closeCP() : openCP(); return; }
  if ((e.metaKey || e.ctrlKey) && k === 'b') { e.preventDefault(); toggleMode(); return; }

  if (state.cp.open) {
    if (e.key === 'Escape') { e.preventDefault(); closeCP(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); moveCP(1); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); moveCP(-1); return; }
    if (e.key === 'Enter') { e.preventDefault(); const x = state.cp.results[state.cp.cur]; if (x) go(x.feat.id); return; }
    return;
  }
  if (state.flyMod) {
    if (e.key === 'Escape') { e.preventDefault(); closeFly(true); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); moveFly(1); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); moveFly(-1); return; }
    if (e.key === 'Enter' && state.flyCur >= 0) {
      e.preventDefault();
      const el = flyItems()[state.flyCur];
      if (el) go(el.getAttribute('data-feature'));
    }
  }
});
document.getElementById('cpTrigger').addEventListener('click', openCP);
document.getElementById('cpBackdrop').addEventListener('click', e => { if (e.target.id === 'cpBackdrop') closeCP(); });
document.getElementById('flyScrim').addEventListener('click', () => closeFly(false));
document.getElementById('cpInput').addEventListener('input', e => {
  state.cp.q = e.target.value;
  state.cp.results = cpSearch(state.cp.q);
  state.cp.cur = 0;
  renderCPList();
});

/* ===================== ROUTER ===================== */
function getRoute() {
  const h = location.hash;
  if (!h || h === '#' || h === '#/') return DEF;
  const id = h.replace(/^#\//, '');
  return FLAT.some(x => x.feat.id === id) ? id : DEF;
}

function render() {
  const nav = document.getElementById('sbNav');
  const keep = nav ? nav.scrollTop : 0;

  state.route = getRoute();
  const icon = state.mode === 'icon';
  document.body.classList.toggle('icon-mode', icon);

  const tg = document.getElementById('sbToggle');
  tg.setAttribute('aria-pressed', String(icon));
  document.getElementById('sbToggleIco').setAttribute('data-lucide', icon ? 'panel-left-open' : 'panel-left-close');
  document.getElementById('sbToggleTxt').textContent = icon ? 'กางเมนูเต็ม' : 'ย่อเป็นไอคอน';
  tg.setAttribute('title', (icon ? 'กางเมนูเต็ม' : 'ย่อเป็นไอคอน') + ' (Ctrl+B)');

  nav.innerHTML = sidebarHTML();
  document.getElementById('breadcrumb').innerHTML = breadcrumbHTML();
  document.getElementById('content').innerHTML = contentHTML();

  const sl = document.getElementById('slide');
  const sn = document.getElementById('slideNav');
  const snKeep = sn ? sn.scrollTop : 0;
  sl.innerHTML = slideHTML();
  const sn2 = document.getElementById('slideNav');
  if (sn2) sn2.scrollTop = snKeep;
  sl.classList.toggle('on', !!state.flyMod);
  document.getElementById('flyScrim').classList.toggle('on', !!state.flyMod);

  document.getElementById('cpHotkey').textContent = isMac ? '⌘K' : 'Ctrl K';
  document.getElementById('cpBackdrop').classList.toggle('on', state.cp.open);
  if (state.cp.open) { state.cp.results = cpSearch(state.cp.q); renderCPList(); }

  nav.scrollTop = keep;
  renderIcons();
}

window.addEventListener('hashchange', () => {
  state.flyMod = null;
  if (state.mode === 'full') revealActive();   // route ใหม่ → กางให้เห็น (แต่ผู้ใช้พับเองได้เสมอ)
  render();
});
window.addEventListener('DOMContentLoaded', () => { if (state.mode === 'full') revealActive(); render(); });
</script>
</body>
</html>
