<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ใบย้ายสินค้า (Stock Transfer) · CUBE NATIVE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">
<style>
/* ===== BASE-KIT v6.4 (CUBE Warm Light) — DO NOT EDIT ===== */
:root{
  --c-navy:#111111; --c-navy-2:#111111;
  --c-primary:#FF3B30; --c-primary-hover:#E62E24;
  --c-teal:#00A88E; --c-teal-light:#4FD1BC;
  --c-orange:#FF9A1F;
  --c-ink:#111111; --c-mute:#54565C; --c-mute-2:#73757B; --c-mute-3:#9A9CA2;
  --c-line:#DEDAD4; --c-line-2:#E9E5E0; --c-line-3:#F1EEEA;
  --c-bg-off:#FAF8F5;
  --c-success:#1F9D55; --c-warning:#E8870F; --c-danger:#E62E24;
  --sidebar-w:232px; --shell-h:52px;
  --fs-h1:22px; --fs-h2:17px; --fs-h3:15px; --fs-body:14px; --fs-sub:13px; --fs-meta:12px; --fs-cap:11px; --fs-kpi:28px;
  --sp-xs:4px; --sp-sm:8px; --sp-md:12px; --sp-lg:20px; --sp-xl:28px;
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px; --r-full:999px;
  --z-shell:20; --z-sticky:15; --z-dropdown:70; --z-backdrop:80; --z-drawer:85; --z-toast:95;
  /* ---- Pattern Q / B2 v2 archetype token aliases (doc-archetype.css contract) ---- */
  --c-border:#DEDAD4; --c-border-soft:#E9E5E0;
  --c-text:#111111; --c-text-mute:#54565C; --c-text-soft:#9A9CA2;
  --c-off-white:#FAF8F5; --c-white:#FFFFFF; --c-slate:#73757B;
  --c-purple:#FF9A1F;
  --c-primary-08:rgba(255,59,48,0.08); --c-primary-12:rgba(255,59,48,0.12);
  --c-teal-08:rgba(0,168,142,0.10); --c-warning-08:rgba(232,135,15,0.10); --c-danger-08:rgba(230,46,36,0.08);
  --r:8px; --sh-md:0 6px 18px rgba(17,17,17,.08); --sh-lg:0 12px 32px rgba(17,17,17,.14); --sh-xl:0 24px 64px rgba(17,17,17,.24);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scrollbar-gutter:stable}
*{scrollbar-width:thin;scrollbar-color:rgba(17,17,17,.16) transparent}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(17,17,17,.14);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:rgba(17,17,17,.26)}
.sidebar ::-webkit-scrollbar-thumb,.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.28)}
.sidebar{scrollbar-color:rgba(255,255,255,.28) transparent}
body{font-family:'Satoshi','Noto Sans Thai',system-ui,sans-serif;background:var(--c-bg-off);color:var(--c-ink);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;min-width:768px}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer}
[data-lucide]{flex-shrink:0}
input[type="number"]::-webkit-inner-spin-button,input[type="number"]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type="number"]{-moz-appearance:textfield}
svg.lucide{width:1em;height:1em;display:inline-block;vertical-align:-0.125em;flex-shrink:0}
.w-3{width:12px}.h-3{height:12px}.w-3\.5{width:14px}.h-3\.5{height:14px}
.w-4{width:16px}.h-4{height:16px}.w-5{width:20px}.h-5{height:20px}.w-6{width:24px}.h-6{height:24px}
svg.lucide.w-3{width:12px}svg.lucide.h-3{height:12px}
svg.lucide.w-3\.5{width:14px}svg.lucide.h-3\.5{height:14px}
svg.lucide.w-4{width:16px}svg.lucide.h-4{height:16px}
svg.lucide.w-5{width:20px}svg.lucide.h-5{height:20px}
svg.lucide.w-6{width:24px}svg.lucide.h-6{height:24px}
.hidden{display:none!important}
/* ---- sidebar ---- */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar-w);background:#111111;color:#E9E5E0;z-index:var(--z-shell);display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,0.06)}
.sb-brand{padding:18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,0.06);flex-shrink:0}
.sb-logo{width:34px;height:34px;background:linear-gradient(135deg,#FF3B30,#FF9A1F);border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;box-shadow:0 4px 12px rgba(255,59,48,0.3)}
.sb-name{font-weight:700;font-size:14px;color:#fff;letter-spacing:-0.01em;line-height:1.2}
.sb-sub{font-size:11px;color:#9A9CA2;letter-spacing:0.06em;font-weight:600;text-transform:uppercase;margin-top:2px}
.sb-nav{flex:1;padding:12px 8px;overflow-y:auto}
.sb-module{margin-bottom:4px}
.sb-module-header{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;border-radius:6px;background:transparent;border:0;color:#9A9CA2;font-family:inherit;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;cursor:pointer;transition:all 120ms;text-align:left}
.sb-module-header:hover{background:rgba(255,255,255,0.04);color:#DEDAD4}
.sb-module-header .mod-icon{flex-shrink:0;opacity:.7}
.sb-module-header .mod-label{flex:1}
.sb-module-header .mod-chevron{flex-shrink:0;transition:transform 200ms;opacity:.7}
.sb-module[data-expanded="false"] .mod-chevron{transform:rotate(-90deg)}
.sb-module[data-expanded="false"] .sb-features{display:none}
.sb-features{padding:2px 0 6px 0}
.sb-item{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 16px;border-radius:6px;color:#DEDAD4;font-size:13px;font-weight:500;cursor:pointer;transition:all 120ms;margin-bottom:1px;position:relative;user-select:none}
.sb-item:hover{background:rgba(255,255,255,0.05);color:#fff}
.sb-item.is-active{background:#FF3B30;color:#fff;font-weight:600}
.sb-item.is-active::before{content:'';position:absolute;left:-10px;top:7px;bottom:7px;width:3px;background:#fff;border-radius:0 2px 2px 0}
.sb-item [data-lucide]{width:16px;height:16px;opacity:.85}
.sb-item.is-active [data-lucide]{opacity:1}
.sb-item.is-disabled{opacity:.4;cursor:not-allowed}
.sb-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:8px;font-size:12px;color:#9A9CA2}
.pulse-dot{width:7px;height:7px;background:var(--c-orange);border-radius:50%;box-shadow:0 0 0 3px rgba(255,154,31,0.20);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
/* ---- shell ---- */
.main{margin-left:var(--sidebar-w);min-height:100vh;background:var(--c-bg-off)}
.shell-bar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--c-line-2);height:var(--shell-h);display:flex;align-items:center;padding:0 24px;z-index:var(--z-sticky);gap:12px}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--c-mute)}
.breadcrumb a{cursor:pointer;transition:color 120ms}
.breadcrumb a:hover{color:var(--c-primary)}
.breadcrumb-current{color:var(--c-ink);font-weight:500}
.icon-btn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:0;color:var(--c-mute);border-radius:7px;position:relative;transition:all 120ms}
.icon-btn:hover{background:var(--c-line-3);color:var(--c-ink)}
.notif-dot{position:absolute;top:7px;right:8px;width:7px;height:7px;background:var(--c-danger);border-radius:50%;border:2px solid #fff}
.user-chip{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 12px;border-radius:8px;cursor:pointer;transition:background 120ms}
.user-chip:hover{background:var(--c-line-3)}
.user-text{line-height:1.2;text-align:right}
.user-name{font-size:12.5px;font-weight:500;color:var(--c-ink);white-space:nowrap}
.user-role{font-size:11px;color:var(--c-mute-2);white-space:nowrap;margin-top:1px}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--c-primary),var(--c-orange));color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0}
.content{padding:24px}
.nav-toggle{display:none}
@media (max-width:1180px){
  .content{padding:16px}
  .drawer-panel{max-width:min(920px,100vw)}
  .drawer-panel.wide{max-width:min(1290px,100vw)}
  .main{margin-left:0}
  .sidebar{transform:translateX(-100%);transition:transform .18s ease}
  .sidebar.open{transform:translateX(0);box-shadow:0 8px 32px rgba(0,0,0,.24)}
  .nav-toggle{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:none;background:transparent;border-radius:8px;color:var(--c-ink)}
  .nav-toggle:hover{background:rgba(17,17,17,.06)}
}
.page-fill{display:flex;flex-direction:column;min-height:calc(100dvh - 52px - 48px)}
@media (max-width:1180px){.page-fill{min-height:calc(100dvh - 52px - 32px)}}
.page-fill > .list-card{flex:1 1 auto;min-height:0;display:flex;flex-direction:column}
.table-wrap{flex:1 1 auto;min-height:0;overflow:auto}
.table-wrap thead th{position:sticky;top:0;background:var(--c-bg-off);z-index:3;box-shadow:inset 0 -1px 0 var(--c-line-2)}
.table-foot{flex:0 0 auto}
.menu-fixed{position:fixed!important;z-index:var(--z-dropdown);background:#fff;border:1px solid var(--c-line);border-radius:10px;box-shadow:0 12px 32px rgba(17,17,17,.14);overflow-y:auto}
/* ---- page header ---- */
.ph{margin-bottom:18px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-start;gap:16px}
.ph > div:first-child{flex:1 1 auto;min-width:280px}
.ph-title-row{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.ph-title{font-family:'Noto Sans Thai',sans-serif;font-size:20px;font-weight:700;color:var(--c-navy);margin:0;letter-spacing:-0.01em}
.ph-count{font-size:12.5px;font-weight:600;color:var(--c-mute-2);background:var(--c-line-3);padding:3px 10px;border-radius:999px}
.ph-sub{font-size:13px;color:var(--c-mute);margin:0}
.ph-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:2px 16px 0;border-radius:8px;font-size:13px;font-weight:500;border:1px solid transparent;background:transparent;white-space:nowrap;transition:all 120ms;user-select:none;cursor:pointer}
.btn [data-lucide]{width:15px;height:15px;flex-shrink:0}
.btn:disabled,.btn.is-disabled{opacity:.55;cursor:not-allowed;pointer-events:none}
.btn-eq{min-width:104px}
.btn-primary{background:var(--c-primary);color:#fff}
.btn-primary:hover{background:var(--c-primary-hover);box-shadow:0 2px 8px rgba(255,59,48,0.30)}
.btn-secondary{background:#fff;border-color:var(--c-line);color:var(--c-ink)}
.btn-secondary:hover{background:var(--c-line-3);border-color:var(--c-mute-2)}
.btn-ghost{color:var(--c-mute)}
.btn-ghost:hover{background:var(--c-line-3);color:var(--c-ink)}
.btn-danger{background:#fff;border-color:var(--c-line);color:var(--c-danger)}
.btn-danger:hover{background:#FFE9E7;border-color:var(--c-danger)}
.btn-success{background:var(--c-teal);color:#fff;border-color:var(--c-teal)}
.btn-success:hover{filter:brightness(.94)}
.btn.sm,.btn-sm{height:30px;padding:2px 12px 0;font-size:12px}
.btn.sm [data-lucide]{width:14px;height:14px}
.btn-link{background:transparent;border:0;padding:0 4px;height:auto;color:var(--c-primary);font-weight:600}
.btn-link:hover{text-decoration:underline}
.btn-link,.btn-link:focus,.btn-link:focus-visible{outline:none!important;box-shadow:none!important}
.btn-link.danger{color:var(--c-danger)}
.top-icon-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:0;background:transparent;border-radius:var(--r-sm);color:var(--c-mute-2);cursor:pointer;transition:all 120ms;flex-shrink:0}
.top-icon-btn:hover{background:var(--c-line-3);color:var(--c-ink)}
/* ---- stats ---- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:18px}
.stat{background:#fff;border:1px solid var(--c-line-2);border-radius:10px;padding:16px;transition:all 150ms;cursor:pointer;text-align:left;font-family:inherit}
.stat:hover{border-color:var(--c-line);box-shadow:0 2px 8px rgba(17,17,17,0.05)}
.stat.is-on{border-color:var(--c-primary);box-shadow:0 0 0 3px var(--c-primary-08)}
.stat-label{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--c-mute)}
.stat-label [data-lucide]{width:13px;height:13px;color:var(--c-primary)}
.stat-value{font-family:'Noto Sans Thai',sans-serif;font-size:26px;font-weight:700;color:var(--c-navy);margin-top:6px;letter-spacing:-0.01em;font-variant-numeric:tabular-nums}
.stat-meta{font-size:12px;color:var(--c-mute-2);margin-top:6px;display:flex;align-items:center;gap:4px}
/* ---- card / filter ---- */
.card{background:#fff;border:1px solid var(--c-line-2);border-radius:10px;overflow:hidden}
.card-head{padding:12px 18px;border-bottom:1px solid var(--c-line-2);display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-title{font-size:13px;font-weight:700;color:var(--c-navy)}
.card-body{padding:12px 18px}
.filter-bar{padding:14px 18px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--c-line-2);background:#fff;flex-wrap:wrap}
.tabbar{display:flex;align-items:center;gap:4px;padding:10px 18px 0;background:#fff;flex-wrap:wrap}
.tabbar .tb{background:transparent;border:none;border-bottom:2px solid transparent;padding:8px 12px;font-size:13px;font-weight:500;color:var(--c-text-mute);cursor:pointer;margin-bottom:-1px;display:inline-flex;align-items:center;gap:6px;font-family:inherit}
.tabbar .tb:hover{color:var(--c-ink)}
.tabbar .tb.on{color:var(--c-primary);border-bottom-color:var(--c-primary);font-weight:600}
/* ---- inputs ---- */
.input,.select{height:36px;padding:0 12px;border:1px solid var(--c-line);border-radius:8px;font-size:13px;background:#fff;color:var(--c-ink);font-family:inherit;transition:all 120ms;width:100%}
.input:focus,.select:focus{outline:none;border-color:var(--c-primary);box-shadow:0 0 0 3px rgba(255,59,48,0.10)}
.input:disabled,.input[readonly],.select:disabled{background:var(--c-line-3);color:var(--c-mute-2);cursor:not-allowed;border-color:var(--c-line-2)}
.select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2373757B' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 10px center;padding-right:32px;appearance:none}
.input-search{position:relative;flex:1 1 240px;min-width:240px;max-width:340px}
.input-search input{padding-left:36px}
.input-search .lead-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--c-mute-2);pointer-events:none}
/* ---- table ---- */
.table,.tbl{width:100%;border-collapse:collapse;font-size:13px}
.table thead,.tbl thead{background:var(--c-bg-off)}
.table th,.tbl th{padding:11px 14px;text-align:left;font-weight:600;color:var(--c-mute);font-size:12px;letter-spacing:0.03em;border-bottom:1px solid var(--c-line-2);white-space:nowrap}
.table th.is-sortable{cursor:pointer;user-select:none}
.table th.is-sortable:hover{color:var(--c-ink)}
.table td,.tbl td{padding:13px 14px 11px;border-bottom:1px solid var(--c-line-2);color:var(--c-ink);vertical-align:middle}
.table tbody tr,.tbl tbody tr{transition:background 120ms}
.table tbody tr:hover{background:var(--c-bg-off)}
.table tbody tr:last-child td,.tbl tbody tr:last-child td{border-bottom:0}
.table tbody tr.is-clickable{cursor:pointer}
.tbl-mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
.tbl-num,.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.tbl-num{text-align:right}
.tbl-meta{font-size:11px;color:var(--c-text-mute);margin-top:2px}
.cell-truncate{max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.table-footer{padding:12px 18px;background:var(--c-bg-off);border-top:1px solid var(--c-line-2);display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--c-mute);flex-wrap:wrap;gap:10px}
.pagination{display:inline-flex;gap:4px;align-items:center}
.pg-btn{min-width:30px;height:30px;padding:0 8px;display:inline-flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--c-line-2);border-radius:6px;color:var(--c-mute);font-size:12.5px;font-weight:500;cursor:pointer;transition:all 120ms}
.pg-btn:hover{border-color:var(--c-line);background:var(--c-bg-off)}
.pg-btn.is-active{background:var(--c-primary);border-color:var(--c-primary);color:#fff}
.pg-btn.is-disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.pg-btn [data-lucide]{width:13px;height:13px}
.ra-btn{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:0;color:var(--c-mute-2);border-radius:6px;transition:all 120ms}
.ra-btn:hover{background:var(--c-line-3);color:var(--c-primary)}
.ra-btn [data-lucide]{width:15px;height:15px}
/* ---- pills ---- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px 2px;border-radius:999px;font-size:11px;font-weight:600;letter-spacing:0.02em;line-height:1.6;white-space:nowrap}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.draft{background:rgba(115,117,123,0.12);color:var(--c-slate)}
.pill.pending{background:var(--c-warning-08);color:#8A5200}
.pill.approved{background:var(--c-teal-08);color:var(--c-teal)}
.pill.sent{background:rgba(255,154,31,0.14);color:#8A5200}
.pill.rejected{background:var(--c-danger-08);color:var(--c-danger)}
.pill.cancelled{background:rgba(115,117,123,0.12);color:var(--c-slate)}
.pill-muted{background:var(--c-line-3);color:var(--c-mute-2)}
/* ---- empty ---- */
.empty{padding:48px 24px;text-align:center;color:var(--c-mute)}
.empty-icon{width:52px;height:52px;margin:0 auto 16px;border-radius:50%;background:var(--c-line-3);color:var(--c-mute-2);display:inline-flex;align-items:center;justify-content:center}
.empty-icon [data-lucide]{width:22px;height:22px}
.empty-title{font-size:16px;font-weight:600;color:var(--c-ink);margin-bottom:6px;font-family:'Noto Sans Thai',sans-serif}
.empty-desc{font-size:13px;color:var(--c-mute);max-width:340px;margin:0 auto}
.empty .btn{margin-top:16px}
/* ---- toast ---- */
.toast{position:fixed;bottom:24px;right:24px;background:var(--c-navy);color:#fff;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;z-index:var(--z-toast);display:flex;align-items:center;gap:10px;box-shadow:0 12px 32px rgba(17,17,17,0.30);transform:translateY(100px);opacity:0;transition:all 250ms cubic-bezier(0.4,0,0.2,1);max-width:420px}
.toast.is-visible{transform:translateY(0);opacity:1}
.toast.is-success{background:var(--c-success)}
.toast.is-info{background:var(--c-primary)}
.toast.is-warning{background:var(--c-warning)}
.toast.is-error{background:var(--c-danger)}
.toast [data-lucide]{width:17px;height:17px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite}
/* ===== Pattern Q / B2 v2 archetype CSS (จาก references/document-archetype/doc-archetype.css.html) ===== */
.overlay-wrap{position:fixed;inset:0;z-index:var(--z-drawer)}
.backdrop{position:absolute;inset:0;background:rgba(17,17,17,0.40);opacity:1;transition:opacity 220ms}
.drawer-panel{position:absolute;right:0;top:0;height:100%;width:100%;max-width:920px;background:#fff;box-shadow:var(--sh-xl);display:flex;flex-direction:column;transform:translateX(0);transition:transform 280ms cubic-bezier(0.4,0,0.2,1)}
.drawer-panel.standard{max-width:680px}
.drawer-panel.wide{max-width:1290px}
.drawer-panel.drawer-enter{transform:translateX(100%)}

/* ============================================================
   B2 v2 — Line engine (locked: calcLineVat / migrateLine / totals / taxBadgeV)
   * ห้ามคำนวณมูลค่าที่อื่น — ทุกยอดในไฟล์นี้มาจาก totals() ตัวเดียว
   * ย้ายสินค้าภายในกิจการไม่ใช่รายการภาษี → ทุกบรรทัด vat_mode='none' (ส่วนลด/VAT คงไว้ตาม contract แต่ปิดใช้)
   ============================================================ */
function createBlankLine(){ return { id:'L'+Date.now()+Math.random().toString(36).slice(2,5), binFrom:'', item_code:'', item_name:'', qty:1, unit:'-', unit_price:0, discount_pct:0, vat_mode:'none', vat_pct:CFG.vatPct, note:'', binTo:'',
  received:0, writtenOff:0, returned:0, binActual:'', diffAction:'wait', diffReason:'', diffNote:'' }; }

function migrateLine(l){ if(l.vat_mode==null){ l.vat_mode = l.net_enabled ? 'included' : (l.vat_enabled===false ? 'none' : 'add'); } if(l.vat_pct==null) l.vat_pct=CFG.vatPct; if(l.received==null) l.received=0; if(l.writtenOff==null) l.writtenOff=0; if(l.returned==null) l.returned=0; return l; }

function calcLineVat(l){ migrateLine(l);
  var subtotal=(+l.qty||0)*(+l.unit_price||0);
  var discount=(l.discount_mode||'percent')==='amount' ? Math.min(subtotal, +l.discount_amt||0) : subtotal*((+l.discount_pct||0)/100);
  var netAmount=subtotal-discount; var vatAmount=0; var lineTotal=netAmount;
  if(l.vat_mode==='add'){ vatAmount=netAmount*(l.vat_pct/100); lineTotal=netAmount+vatAmount; }
  else if(l.vat_mode==='included'){ vatAmount=netAmount*(l.vat_pct/100)/(1+l.vat_pct/100); lineTotal=netAmount; }
  return { netAmount:netAmount, vatAmount:vatAmount, lineTotal:lineTotal }; }

function totals(doc){ var before=0, vat=0; (doc.lines||[]).forEach(function(l){ migrateLine(l);
    var r=calcLineVat(l); before += (l.vat_mode==='included' ? r.netAmount-r.vatAmount : r.netAmount); vat += r.vatAmount; });
  /* ส่วนลดท้ายบิล (endbill.mode ฿/%) เป็นส่วนหนึ่งของสัญญา B2 v2 แต่ปิดใช้กับใบย้าย — ย้ายภายในกิจการไม่มีส่วนลด */
  var after=before+vat; var eb=doc.endbill||{enabled:false,mode:'percent',value:0,src:''}; var ebAmt=0;
  if(eb.enabled) ebAmt = eb.mode==='amount' ? (+eb.value||0) : after*((+eb.value||0)/100);
  var cp=+doc.couponAmt||0;
  return { before:before, vat:vat, after:after, ebAmt:ebAmt, coupon:cp, grand:Math.max(0, after-ebAmt-cp), n:(doc.lines||[]).length }; }

function taxBadgeV(l){ migrateLine(l);
  if(l.vat_mode==='none') return '<span style="display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:3px 8px;border-radius:999px;background:rgba(115,117,123,0.10);color:var(--c-text-mute);font-weight:600;white-space:nowrap;" title="ย้ายสินค้าภายในกิจการ — ไม่ใช่รายการภาษี"><span style="width:4px;height:4px;border-radius:50%;background:var(--c-text-mute);"></span>ไม่คิด</span>';
  if(l.vat_mode==='included') return '<span style="display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:3px 8px;border-radius:999px;background:rgba(255,59,48,0.10);color:var(--c-primary);font-weight:600;white-space:nowrap;"><span style="width:4px;height:4px;border-radius:50%;background:var(--c-primary);"></span>NET '+l.vat_pct+'%</span>';
  return '<span style="display:inline-flex;align-items:center;gap:3px;font-size:11px;padding:3px 8px;border-radius:999px;background:rgba(255,154,31,0.10);color:var(--c-purple);font-weight:600;white-space:nowrap;"><span style="width:4px;height:4px;border-radius:50%;background:var(--c-purple);"></span>VAT '+l.vat_pct+'%</span>'; }

/* ---------- Transfer-specific computed (PREBRIEF §3.3) ---------- */
function lineRemaining(l){ return Math.max(0, (+l.qty||0) - (+l.received||0) - (+l.writtenOff||0) - (+l.returned||0)); }
function inTransitQty(doc){ return (doc.lines||[]).reduce(function(a,l){ return a+lineRemaining(l); },0); }
function inTransitAmount(doc){ return (doc.lines||[]).reduce(function(a,l){ return a+lineRemaining(l)*(+l.unit_price||0); },0); }
function shortageAmount(doc){ return (doc.lines||[]).reduce(function(a,l){ return a+(+l.pendingWriteOff||0)*(+l.unit_price||0); },0); }
function writtenOffAmount(doc){ return (doc.lines||[]).reduce(function(a,l){ return a+(+l.writtenOff||0)*(+l.unit_price||0); },0); }
function transitAging(doc){ return doc.shippedAt ? daysBetween(doc.shippedAt.slice(0,10), TODAY) : null; }
function isAging(doc){ var a=transitAging(doc); return (doc.status==='in_transit'||doc.status==='partial') && a!=null && a>CFG.transitAgingDays; }
function docMode(whFrom,whTo){ return (whFrom && whTo && whFrom===whTo) ? 'intra' : 'inter'; }

function chainOf(r){ return Array.isArray(r.approval_chain)?r.approval_chain:[]; }

  return '<div style="display:flex;flex-direction:column;align-items:center;gap:3px;"><span style="font-size:11px;font-weight:600;color:'+color+';">'+done+'/'+total+'</span><div style="width:46px;height:4px;border-radius:999px;background:var(--c-border-soft);overflow:hidden;"><div style="width:'+pct+'%;height:100%;background:'+color+';"></div></div></div>'; }
function empChip(name, roleId, small){ var e=EMP_BY_NAME[name]||null; var role=ROLE_LABEL[roleId||(e&&e.role)]||roleId||'';
  if(!name) return '<span class="emp-chip is-empty '+(small?'sm':'')+'"><span class="emp-av"><i data-lucide="user" class="w-3 h-3"></i></span><span class="emp-t"><span class="emp-r">'+role+'</span><span class="emp-n" style="color:var(--c-text-soft);">ยังไม่ระบุคน</span></span></span>';
  return '<span class="emp-chip '+(small?'sm':'')+'"><span class="emp-av">'+(e?e.initials:name.slice(0,2))+'</span><span class="emp-t"><span class="emp-r">'+role+(e?' · '+e.dept:'')+'</span><span class="emp-n">'+esc(name)+'</span></span></span>'; }
function pgl(pct){ return pct>0 ? '<div style="margin-top:6px;"><div class="pgline"><div class="'+(pct<100?'pending':'')+'" style="width:'+Math.min(100,pct)+'%;"></div></div></div>' : ''; }

var listState={ tab:'all', q:'', whFrom:'all', whTo:'all', mode:'all', status:'all', page:1, pageSize:10, sortCol:'docDate', sortDir:'desc' };

function getRoute(){ var h=(location.hash||'').replace(/^#\/?/,''); if(!h) return {name:'list'};
  var p=h.split('/'); if(p[0]==='view') return {name:'view', id:p[1]};
  if(p[0]==='create') return {name:'create', arg:p[1]||''};
  if(p[0]==='edit') return {name:'edit', id:p[1]};
  return {name:'list'}; }
function navigate(r){ location.hash='#/'+r; }

/* ============================================================
   SURFACE 1 — List page (Pattern A + Pattern Q spec)
   ============================================================ */
function visibleDocs(){
  return DOCS.filter(function(d){
    if(listState.tab==='inbox' && !(d.whTo===ME.wh && ['in_transit','partial'].indexOf(d.status)>-1)) return false;
    if(listState.tab==='pending' && d.status!=='pending_approval') return false;
    if(listState.tab==='transit' && ['in_transit','partial'].indexOf(d.status)===-1) return false;
    if(listState.whFrom!=='all' && d.whFrom!==listState.whFrom) return false;
    if(listState.whTo!=='all' && d.whTo!==listState.whTo) return false;
    if(listState.mode!=='all' && d.mode!==listState.mode) return false;
    if(listState.status!=='all' && d.status!==listState.status) return false;
    var q=listState.q.trim().toLowerCase();
    if(q){ var hay=[d.code, WH_BY[d.whFrom].name, WH_BY[d.whTo].name, d.createdBy, (REASON_MOVE.find(function(r){return r.code===d.reason;})||{}).name||'',
        d.lines.map(function(l){ return l.item_name+' '+l.item_code+' '+l.binFrom+' '+l.binTo; }).join(' ')].join(' ').toLowerCase();
      if(hay.indexOf(q)===-1) return false; }
    return true;
  }).sort(function(a,b){
    var c=listState.sortCol, dir=listState.sortDir==='asc'?1:-1;
    var av = c==='amount'?totals(a).grand:(c==='code'?(a.code||'zzz'):a.docDate);
    var bv = c==='amount'?totals(b).grand:(c==='code'?(b.code||'zzz'):b.docDate);
    return av>bv?dir:(av<bv?-dir:0);
  });
}
function kpi(){
  var transit=DOCS.filter(function(d){ return ['in_transit','partial'].indexOf(d.status)>-1; });
  var amt=transit.reduce(function(a,d){ return a+inTransitAmount(d); },0);
  var aging=transit.filter(isAging).length;
  var wo=DOCS.filter(function(d){ return d.status==='closed_diff' && (d.updatedAt||'').slice(0,7)===TODAY.slice(0,7); })
             .reduce(function(a,d){ return a+writtenOffAmount(d); },0);
  return { transitN:transit.length, transitAmt:amt, pending:DOCS.filter(function(d){return d.status==='pending_approval';}).length, aging:aging, wo:wo };
}
function sortBy(col){ if(listState.sortCol===col) listState.sortDir = listState.sortDir==='asc'?'desc':'asc'; else { listState.sortCol=col; listState.sortDir='asc'; } listState.page=1; renderTableOnly(); }
function setTab(t){ listState.tab=t; listState.page=1; render(); }
function resetFilters(){ listState.q=''; listState.whFrom='all'; listState.whTo='all'; listState.mode='all'; listState.status='all'; listState.page=1; render(); }
function goPage(p){ listState.page=p; renderTableOnly(); }

function statCard(icon,label,value,meta,tab){
  return '<button class="stat '+(listState.tab===tab?'is-on':'')+'" onclick="setTab(\''+tab+'\')">'
    + '<div class="stat-label"><i data-lucide="'+icon+'" class="w-3 h-3"></i>'+label+'</div>'
    + '<div class="stat-value">'+value+'</div><div class="stat-meta">'+meta+'</div></button>';
}
function tabBar(){
  var items=[['all','ทั้งหมด','layers'],['inbox','รอฉันรับ (ปลายทาง = คลังฉัน)','inbox'],['pending','รออนุมัติ','clock'],['transit','อยู่ระหว่างทาง','truck']];
  return '<div class="tabbar">'+items.map(function(x){
    return '<button class="tb '+(listState.tab===x[0]?'on':'')+'" onclick="setTab(\''+x[0]+'\')"><i data-lucide="'+x[2]+'" class="w-4 h-4"></i>'+x[1]+'</button>';

}

function openRowMenu(id,e){
  e.stopPropagation();
  document.querySelectorAll('#row-menu').forEach(function(n){ n.remove(); });
  var d=findDoc(id); var st=d.status;
  var items=[['เปิดดูรายละเอียด','file-text','navigate(\'view/'+id+'\')']];
  if(st==='draft') items.push(['แก้ไขร่าง','pencil','navigate(\'edit/'+id+'\')']);
  if(st==='draft') items.push(['ส่งอนุมัติ','send','openSubmitModal(\''+id+'\')']);
  if(st==='approved' && d.mode==='intra') items.push(['ย้ายสินค้า','arrow-right-left','doShip(\''+id+'\')']);
  if(st==='approved' && d.mode==='inter') items.push(['ส่งออกจากต้นทาง','truck','doShip(\''+id+'\')']);
  if(['in_transit','partial'].indexOf(st)>-1) items.push(['ยืนยันรับที่ปลายทาง','package-check','openReceiveModal(\''+id+'\')']);
  items.push(['ทำสำเนา','copy','dupDoc(\''+id+'\')']);
  items.push(['พิมพ์ / PDF','printer','openPdf(\''+id+'\')']);
  if(['draft','pending_approval','approved'].indexOf(st)>-1) items.push(['ยกเลิกใบย้าย','x-circle','openCancelModal(\''+id+'\')']);
  var rect=e.currentTarget.getBoundingClientRect();
  var menu=document.createElement('div'); menu.id='row-menu'; menu.className='menu-fixed';
  menu.style.cssText='padding:4px;min-width:210px;top:'+(rect.bottom+4)+'px;left:'+Math.min(rect.left-170, window.innerWidth-230)+'px;';
  menu.innerHTML=items.map(function(it){
    return '<button style="width:100%;display:flex;align-items:center;gap:10px;padding:8px 12px;border:0;background:transparent;border-radius:6px;font-size:13px;font-family:inherit;text-align:left;cursor:pointer" onmouseover="this.style.background=\'var(--c-bg-off)\'" onmouseout="this.style.background=\'transparent\'" onclick="document.getElementById(\'row-menu\').remove(); '+it[2]+'"><i data-lucide="'+it[1]+'" class="w-4 h-4"></i>'+it[0]+'</button>';
  }).join('');
  document.body.appendChild(menu); renderIcons();
  setTimeout(function(){ var close=function(ev){ if(!menu.contains(ev.target)){ menu.remove(); document.removeEventListener('click',close); } }; document.addEventListener('click',close); },0);
}

function openCreateDrawer(editId, from){
  createWizard.step=1; createWizard.expandedLineId=null; createWizard.editId=editId||null; createWizard._over=false; createWizard._overMsg='';
  if(editId){
    var s=findDoc(editId);

      reason:s.reason, reasonNote:s.reasonNote, costCenter:s.costCenter, note:s.note,
      lines:s.lines.map(function(l){ return Object.assign({},l); }), attachments:(s.attachments||[]).slice() });

/* ---------- Master combobox (Rule #94 / #102 — anatomy ล็อก) ---------- */
function combo(key, display, ph, width){
  return '<div style="position:relative;'+(width?'width:'+width+'px;':'')+'"><i data-lucide="search" class="w-3.5 h-3.5" style="position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--c-text-soft);"></i>'
   + '<input type="text" id="cbi-'+key+'" autocomplete="off" value="'+esc(display)+'" placeholder="'+esc(ph)+'" class="input" style="padding-left:30px;'+(width?'height:28px;font-size:11.5px;':'')+'" '
   + 'onfocus="comboOpen(\''+key+'\',\'\')" oninput="comboOpen(\''+key+'\',this.value)" onkeydown="comboKey(event,\''+key+'\')"></div>';
}
function binOptions(wh, forSourceType){
  return BINS.filter(function(b){
    if(b.wh!==wh) return false;
    if(b.type==='in-transit' || b.type==='damage' || b.type==='staging') return false;   /* BR-05 / BR-10 / BR-09b */
    if(forSourceType){ if(forSourceType==='quarantine') return b.type==='quarantine'; return b.type==='storage'; }
    return true;
  });
}
function comboItems(key,q){
  q=(q||'').toLowerCase().trim();
  if(key.indexOf('item-')===0){
    return ITEMS.filter(function(p){ return !q || (p.code+' '+p.name+' '+p.cat).toLowerCase().indexOf(q)>-1; }).slice(0,8)
      .map(function(p){ var u=p.units.find(function(x){return x.is_default;})||p.units[0];
        return { val:p.code, t:p.name, s:p.code+' · '+p.cat, right:'฿'+formatMoney(u.price)+'/'+u.uom, ico:'package', kind:'item' }; });
  }
  if(key.indexOf('binFrom-')===0 || key.indexOf('binTo-')===0 || key.indexOf('binAct-')===0){
    var lineId=key.split('-').slice(1).join('-');
    var d=createWizard.data;
    var isFrom=key.indexOf('binFrom-')===0;
    var line=(d?d.lines:receiveState.rows).find(function(l){ return l.id===lineId; });
    var wh, srcType=null;
    if(isFrom){ wh=d.whFrom; }
    else { wh = (key.indexOf('binAct-')===0) ? findDoc(receiveState.id).whTo : d.whTo;
           var fb = line && line.binFrom ? BIN_BY[line.binFrom] : null; srcType = fb ? fb.type : null; }
    var pool=BINS.filter(function(b){
      if(b.wh!==wh) return false;
      if(b.type==='in-transit' || b.type==='damage' || b.type==='staging') return false;
      if(!isFrom && srcType==='quarantine') return b.type==='quarantine';
      if(!isFrom && srcType && srcType!=='quarantine') return b.type==='storage';
      return true; });
    return pool.filter(function(b){ return !q || (b.code+' '+b.name+' '+b.zone).toLowerCase().indexOf(q)>-1; }).slice(0,10)
      .map(function(b){ var locked=b.status==='ล็อก';
        return { val:b.code, t:b.code, s:b.name+(locked?' · '+b.lockReason:''), right:locked?'ล็อก':'', ico:'map-pin', dis:locked, kind:'bin' }; });
  }
  if(key.indexOf('slot-')===0){
    var idx=+key.split('-')[1];
    var st=modalState.slots[idx]; if(!st) return [];
    return EMPLOYEES.filter(function(e){ return st.roles.indexOf(e.role)>-1 && e.name!==ME.name && (!q || (e.name+' '+e.dept+' '+e.code).toLowerCase().indexOf(q)>-1); })
      .map(function(e){ return { val:e.name, t:e.name, s:(ROLE_LABEL[e.role]||e.role)+' · '+e.dept+' · '+e.code, av:e.initials, kind:'person' }; });
  }
  return [];
}
function comboPick(key,val){
  if(key.indexOf('item-')===0){ pickItem(key.slice(5), val); }
  else if(key.indexOf('binFrom-')===0){ setLineBin(key.slice(8),'binFrom',val); }
  else if(key.indexOf('binTo-')===0){ setLineBin(key.slice(6),'binTo',val); }
  else if(key.indexOf('binAct-')===0){ var r=receiveState.rows.find(function(x){return x.id===key.slice(7);}); if(r) r.binActual=val; renderReceiveModal(); }
  else if(key.indexOf('slot-')===0){ modalState.slots[+key.split('-')[1]].assignee=val; renderSubmitModal(); }
  document.querySelectorAll('.combo-pop').forEach(function(n){ n.remove(); }); comboState.key=null;
}
function comboOpen(key,q){
  document.querySelectorAll('.combo-pop').forEach(function(n){ n.remove(); });
  var input=document.getElementById('cbi-'+key); if(!input) return;
  comboState.key=key; comboState.list=comboItems(key,q); comboState.hi=0;
  var rect=input.getBoundingClientRect();
  var pop=document.createElement('div'); pop.className='combo-pop'; pop.id='combo-pop';
  var up = window.innerHeight-rect.bottom < 280;
  pop.style.cssText='left:'+rect.left+'px;width:'+Math.max(rect.width,330)+'px;'+(up?'bottom:'+(window.innerHeight-rect.top+2)+'px;':'top:'+(rect.bottom+2)+'px;');
  document.body.appendChild(pop); paintCombo();
  setTimeout(function(){ var close=function(ev){ if(!pop.contains(ev.target) && ev.target!==input){ pop.remove(); document.removeEventListener('click',close); } }; document.addEventListener('click',close); },0);
}
function paintCombo(){
  var pop=document.getElementById('combo-pop'); if(!pop) return;
  pop.innerHTML = comboState.list.length ? comboState.list.map(function(it,k){
    var left = it.av ? '<span class="emp-av" style="width:26px;height:26px;font-size:10px;">'+it.av+'</span>'
                     : '<i data-lucide="'+it.ico+'" class="w-3.5 h-3.5" style="color:var(--c-text-soft);flex-shrink:0;"></i>';
    var l1 = it.kind==='item' ? '<div class="tbl-mono" style="font-size:11.5px;color:var(--c-text-mute);">'+esc(it.s)+'</div><div style="font-size:12.5px;font-weight:600;color:var(--c-navy);">'+esc(it.t)+'</div>'
                              : '<div style="font-size:12.5px;font-weight:600;color:var(--c-navy);">'+esc(it.t)+'</div><div style="font-size:11px;color:var(--c-text-mute);">'+esc(it.s)+'</div>';
    return '<button type="button" class="'+(k===comboState.hi?'hi':'')+'" '+(it.dis?'disabled style="opacity:.45;cursor:not-allowed"':'')+' onmousedown="event.preventDefault()" '
      + (it.dis?'':'onclick="comboPick(\''+comboState.key+'\',\''+it.val+'\')"')+'>'
      + left + '<div style="flex:1;min-width:0;">'+l1+'</div>'
      + (it.right?'<span style="font-size:10.5px;color:var(--c-text-soft);text-align:right;">'+esc(it.right)+'</span>':'') + '</button>';
  }).join('') : '<div style="padding:10px 12px;font-size:12px;color:var(--c-text-soft);">ไม่พบรายการ</div>';
  renderIcons();
}
function comboKey(e,key){
  if(comboState.key!==key || !document.getElementById('combo-pop')) return;
  if(e.key==='ArrowDown'){ comboState.hi=Math.min(comboState.hi+1, comboState.list.length-1); paintCombo(); e.preventDefault(); }
  else if(e.key==='ArrowUp'){ comboState.hi=Math.max(comboState.hi-1,0); paintCombo(); e.preventDefault(); }
  else if(e.key==='Enter'){ var it=comboState.list[comboState.hi]; if(it && !it.dis) comboPick(key,it.val); e.preventDefault(); }
  else if(e.key==='Escape'){ document.querySelectorAll('.combo-pop').forEach(function(n){ n.remove(); }); e.stopPropagation(); }
}

function updateLine(id,field,val){
  var line=createWizard.data.lines.find(function(l){ return l.id===id; }); if(!line) return;
  var focused=document.activeElement;
  var focusInfo = focused && focused.tagName==='INPUT' ? { oninput:focused.getAttribute('oninput'), selStart:focused.selectionStart } : null;
  if(field==='qty'){ line.qty=Math.max(0, parseInt(val)||0); }
  else if(field==='vat_pct'){ line.vat_pct=parseFloat(val)||0; }
  else if(field==='vat_mode'){ line.vat_mode=val; }
  else line[field]=val;
  renderCreateDrawer();

    for(var i=0;i<all.length;i++){ if(all[i].getAttribute('oninput')===focusInfo.oninput){ all[i].focus();

/* ---------- wizard navigation + validation ---------- */
function markErr(id,on){ var el=document.getElementById(id); if(el) el.classList.toggle('is-error', !!on); }
function wizardNext(){
  var s=createWizard.step; var d=createWizard.data; var bad=false;
  var err=function(id,cond){ markErr(id,cond); if(cond) bad=true; };
  if(s===1){ if(d.source_type==='copy' && !d.sourceDoc) return showToast('กรุณาเลือกใบย้ายต้นแบบ หรือเปลี่ยนเป็น "สร้างใหม่"','warning'); }
  if(s===2){
    err('f-whFrom', !d.whFrom); err('f-whTo', !d.whTo);
    err('f-docDate', !d.docDate || d.docDate>TODAY);
    err('f-reason', !d.reason);
    var rsn=REASON_MOVE.find(function(r){ return r.code===d.reason; });
    if(rsn && rsn.need) err('f-reasonNote', !(d.reasonNote||'').trim());
    if(d.mode==='inter' && d.etaDate) err('f-eta', d.etaDate<d.docDate);
    if(bad) return showToast('กรุณากรอกข้อมูลให้ครบถ้วน','warning');
    if(d.mode==='inter' && !transitBinFor(d.whFrom,d.whTo)) return showToast('คู่คลังนี้ยังไม่มีจุดพักระหว่างทาง — ติดต่อผู้ดูแลผังตำแหน่งให้ตั้งค่าก่อน','error');
  }
  if(s===3){
    var real=d.lines.filter(function(l){ return l.item_code; });
    if(!real.length) return showToast('กรุณาเพิ่มรายการสินค้าอย่างน้อย 1 รายการ','warning');
    if(d.lines.some(function(l){ return !l.item_code; })) return showToast('มีแถวที่ยังไม่ได้เลือกสินค้า — เลือกหรือลบแถวก่อน','warning');
    if(real.some(function(l){ return !l.binFrom || !l.binTo; })) return showToast('ทุกบรรทัดต้องระบุ bin ต้นทางและ bin ปลายทาง','warning');
    if(real.some(function(l){ return l.binFrom===l.binTo; })) return showToast('bin ต้นทางและปลายทางต้องต่างกัน','warning');
    if(real.some(function(l){ return (+l.qty||0)<=0; })) return showToast('จำนวนที่ย้ายต้องมากกว่า 0 ทุกบรรทัด','warning');
    var overLine=real.find(function(l){ return (+l.qty||0) > onHandOf(l.binFrom,l.item_code); });
    if(overLine) return showToast('จำนวนที่ย้ายเกินยอดคงเหลือของ '+overLine.binFrom+' ('+fmi(onHandOf(overLine.binFrom,overLine.item_code))+' '+overLine.unit+')','error');
    var dup={}; for(var i=0;i<real.length;i++){ var k=real[i].binFrom+'|'+real[i].item_code+'|'+real[i].binTo;
      if(dup[k]) return showToast('มีบรรทัดซ้ำ (bin ต้นทาง + สินค้า + bin ปลายทาง): '+real[i].item_name,'warning'); dup[k]=1; }
  }
  createWizard.step++; renderCreateDrawer();
}
function wizardBack(){ createWizard.step=Math.max(1, createWizard.step-1); renderCreateDrawer(); }
function buildRecord(){
  var d=createWizard.data;
  return { whFrom:d.whFrom, whTo:d.whTo, mode:docMode(d.whFrom,d.whTo),
    transitBin: docMode(d.whFrom,d.whTo)==='inter' ? transitBinFor(d.whFrom,d.whTo) : null,
    docDate:d.docDate, etaDate:d.etaDate, reason:d.reason, reasonNote:(d.reasonNote||'').trim(),
    costCenter:d.costCenter, note:(d.note||'').trim(),
    lines:d.lines.filter(function(l){ return l.item_code; }).map(function(l){ return Object.assign({},l); }),
    attachments:d.attachments.slice() };
}
function persist(){
  var data=buildRecord(); var s;
  if(createWizard.editId){ s=findDoc(createWizard.editId); Object.assign(s,data); pushAudit(s,'แก้ไขร่างใบย้ายสินค้า',''); }
  else { s=mkDoc(Object.assign({ id:'d'+Date.now(), code:'', status:'draft', createdBy:ME.name, createdAt:nowIso(), updatedBy:ME.name, updatedAt:nowIso() }, data));
    s.audit=[{act:'สร้างใบย้ายสินค้า (ร่าง — ยังไม่ออกเลขที่)', by:ME.name, at:nowIso(), note:createWizard.data.sourceDoc?('ทำสำเนาจาก '+createWizard.data.sourceDoc):''}];
    DOCS.unshift(s); }
  return s;
}

/* ---------- ส่งออก / ย้าย (จังหวะที่ 1) ---------- */
function doShip(id){
  var s=findDoc(id);
  if(s.status!=='approved') return showToast('ต้องอนุมัติครบสายก่อน','warning');
  /* ตรวจยอดต้นทางซ้ำก่อนของขยับ */
  var bad=s.lines.find(function(l){ return (+l.qty||0) > onHandOf(l.binFrom,l.item_code); });
  if(bad) return showToast('ยอดคงเหลือที่ '+bad.binFrom+' เปลี่ยนไป (เหลือ '+fmi(onHandOf(bad.binFrom,bad.item_code))+') — แก้จำนวนตามยอดล่าสุด หรือตีกลับไปแก้','error');
  var qty=s.lines.reduce(function(a,l){ return a+(+l.qty||0); },0);
  if(s.mode==='intra'){
    if(!window.confirm('ยืนยันย้ายสินค้าภายในคลัง '+fmi(qty)+' หน่วย?\nรายการเคลื่อนไหวจะถูกบันทึกถาวร แก้ไม่ได้ ลบไม่ได้')) return;
    s.lines.forEach(function(l){ l.received=l.qty; l.binActual=l.binTo; });
    s.status='moved'; s.shippedBy=ME.name; s.shippedAt=nowIso();
    pushAudit(s,'ย้ายภายในคลังสำเร็จ '+s.lines.map(function(l){ return l.binFrom+' → '+l.binTo; }).join(', ')+' ('+fmi(qty)+' หน่วย) — ปิดใบ','FWD-WIRE: JE posting');
    showToast('ย้ายสินค้าสำเร็จ — ปิดใบ '+s.code,'success');
  } else {
    if(!window.confirm('ยืนยันส่งออกจากต้นทาง '+fmi(qty)+' หน่วย?\nของจะออกจากช่องเก็บต้นทางไปพักที่ '+s.transitBin+' และยังไม่ถึงปลายทางจนกว่าคลังปลายทางจะกดยืนยันรับ')) return;
    s.status='in_transit'; s.shippedBy=ME.name; s.shippedAt=nowIso();
    pushAudit(s,'ส่งออกจากต้นทาง → ระหว่างทาง '+s.transitBin+' ('+fmi(qty)+' หน่วย)','FWD-WIRE: JE posting · แจ้งคลังปลายทาง — FWD-WIRE: ENG-NOTIFY');
    showToast('ส่งออกแล้ว — ของอยู่ระหว่างทาง รอ '+WH_BY[s.whTo].name+' ยืนยันรับ','success');
  }
  if(getRoute().name==='view') renderViewDrawer(); else renderTableOnly();
}

function setReceiveQty(id,val){ var r=receiveState.rows.find(function(x){ return x.id===id; }); if(!r) return;
  r.take=Math.max(0, parseInt(val)||0); renderReceiveModal(); }
function setDiffAction(id,val){ var r=receiveState.rows.find(function(x){ return x.id===id; }); if(!r) return; r.diffAction=val; r.diffReason=''; renderReceiveModal(); }
function setDiffReason(id,val){ var r=receiveState.rows.find(function(x){ return x.id===id; }); if(!r) return; r.diffReason=val; renderReceiveModal(); }
function confirmReceive(){
  var s=findDoc(receiveState.id);
  var over=receiveState.rows.find(function(r){ return r.take>r.rem; });
  if(over) return showToast('รับเกินจำนวนที่ส่งออกไม่ได้ — ถ้าของงอกจริงต้องใช้ใบปรับยอดสต๊อก','error');
  if(receiveState.rows.every(function(r){ return r.take===0 && r.rem>0 && r.diffAction==='wait'; })) return showToast('ยังไม่ได้ระบุจำนวนที่รับ','warning');
  var missBin=receiveState.rows.find(function(r){ return r.take>0 && !r.binActual; });
  if(missBin) return showToast('ระบุ bin ที่ลงจริงของทุกบรรทัดที่รับ','warning');
  var missRsn=receiveState.rows.find(function(r){ return (r.rem-r.take)>0 && r.diffAction!=='wait' && !r.diffReason; });
  if(missRsn) return showToast('เลือกเหตุผลของส่วนต่างให้ครบ','warning');
  var btn=document.getElementById('btn-receive');
  if(btn){ btn.disabled=true; btn.innerHTML='<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>'; renderIcons(); }
  setTimeout(function(){
    var totalTake=0, retQty=0, woRows=[];
    receiveState.rows.forEach(function(r){
      var l=r.ref; var diff=r.rem-r.take;
      if(r.take>0){ l.received=(+l.received||0)+r.take; l.binActual=r.binActual; totalTake+=r.take; }
      if(diff>0){ l.diffAction=r.diffAction; l.diffReason=r.diffReason; l.diffNote=r.diffNote;
        if(r.diffAction==='return'){ l.returned=(+l.returned||0)+diff; retQty+=diff; }
        else if(r.diffAction==='writeoff'){ l.pendingWriteOff=diff; woRows.push({line:l, qty:diff}); } }
    });
    s.receipts=(s.receipts||[]).concat([{ by:ME.name, at:nowIso(), qty:totalTake }]);
    pushAudit(s,'ปลายทางยืนยันรับ '+fmi(totalTake)+' หน่วย'+(retQty?' · ตีกลับคืนต้นทาง '+fmi(retQty):'')+(woRows.length?' · รอตัดส่วนต่าง '+fmi(woRows.reduce(function(a,x){return a+x.qty;},0)):''),
      'ลงที่ '+receiveState.rows.filter(function(r){return r.take>0;}).map(function(r){ return r.binActual; }).join(', '));
    closeModal();
    if(woRows.length){ showToast('บันทึกการรับแล้ว — ต่อไปคือขออนุมัติตัดส่วนต่างระหว่างทาง','info'); openShortageModal(s.id); }
    else {
      if(inTransitQty(s)===0) s.status = retQty>0 && totalTake===0 ? 'returned' : 'closed';
      else s.status='partial';
      pushAudit(s, s.status==='closed'?'รับครบ — ปิดใบ':(s.status==='returned'?'ตีกลับคืนต้นทางครบ — ปิดใบ':'ยังค้างระหว่างทาง '+fmi(inTransitQty(s))+' หน่วย (รอรับเพิ่ม)'),'FWD-WIRE: JE posting');
      showToast(s.status==='closed'?'รับครบแล้ว — ปิดใบ '+s.code : 'บันทึกการรับแล้ว — ยังค้างระหว่างทาง '+fmi(inTransitQty(s))+' หน่วย','success');
      if(getRoute().name==='view') renderViewDrawer(); else renderTableOnly();
    }
  },500);
}

var EVIDENCE_SAMPLES=[{name:'photo-damaged-carton.jpg',size:'1.2 MB'},{name:'transport-incident-report.pdf',size:'240 KB'},{name:'signed-shortage-note.pdf',size:'160 KB'}];
function addEvidence(){ modalState.evidence.push(EVIDENCE_SAMPLES[modalState.evidence.length % EVIDENCE_SAMPLES.length]); renderShortageModal(); }
function cancelShortage(){
  var s=findDoc(modalState.id);
  s.lines.forEach(function(l){ delete l.pendingWriteOff; if(l.diffAction==='writeoff'){ l.diffAction='wait'; l.diffReason=''; } });
  s.status = inTransitQty(s)===0 ? 'closed' : 'partial';
  pushAudit(s,'ยกเลิกการขอตัดส่วนต่าง — ส่วนต่างกลับไปเป็น “รอรับเพิ่ม”','');
  closeModal(); showToast('ยกเลิกการตัดส่วนต่าง — ส่วนต่างยังค้างระหว่างทาง','info'); renderViewDrawer();
}
function confirmShortage(){
  var s=findDoc(modalState.id);
  if(!modalState.evidence.length){ return showToast('แนบหลักฐานอย่างน้อย 1 ไฟล์ก่อนขออนุมัติ','warning'); }
  if(modalState.slots.some(function(st){ return !st.assignee; })){ modalState.err=true; renderShortageModal(); return showToast('เลือกผู้อนุมัติให้ครบทุกขั้น','warning'); }
  if(modalState.slots.some(function(st){ return st.assignee===s.shippedBy; })) return showToast('ผู้ที่กดส่งออกจากต้นทางเซ็นอนุมัติการตัดส่วนต่างไม่ได้','error');
  var btn=document.getElementById('btn-shortage');
  if(btn){ btn.disabled=true; btn.innerHTML='<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>'; renderIcons(); }
  setTimeout(function(){
    var amt=shortageAmount(s); var qty=0;
    s.shortage_chain=modalState.slots.map(function(st){ return { roles:st.roles.slice(), assignee:st.assignee, status:'approved', by:st.assignee, at:nowIso(), note:'' }; });
    s.shortage_status='approved'; s.shortage_evidence=modalState.evidence.slice();
    s.attachments=(s.attachments||[]).concat(modalState.evidence.slice());
    s.lines.forEach(function(l){ var w=+l.pendingWriteOff||0; if(w>0){ l.writtenOff=(+l.writtenOff||0)+w; qty+=w; s.shortage_reason=l.diffReason; delete l.pendingWriteOff; } });
    s.status = inTransitQty(s)===0 ? 'closed_diff' : 'partial';
    pushAudit(s,'อนุมัติและตัดส่วนต่างระหว่างทาง '+fmi(qty)+' หน่วย · มูลค่า ฿'+formatMoney(amt)+' — '+(s.status==='closed_diff'?'ปิดใบพร้อมส่วนต่าง':'ยังค้างระหว่างทาง'),
      'FWD-WIRE: JE posting — ผลขาดทุนสินค้าระหว่างขนส่ง');
    closeModal(); showToast('ตัดส่วนต่างแล้ว — '+(s.status==='closed_diff'?'ปิดใบพร้อมส่วนต่าง':'ยังค้างระหว่างทาง'),'success');
    if(getRoute().name==='view') renderViewDrawer(); else renderTableOnly();
  },500);
}
function openPdf(id){ navigate('view/'+id); setTimeout(function(){ viewState.tab='pdf'; renderViewDrawer(); },260); }

/* ============================================================
   RENDER + BOOT (render preservation · Esc chain · refresh-safe)
   ============================================================ */
function preserveRenderState(){
  var db=document.querySelector('.drawer-body'); var a=document.activeElement;
  var isInput = a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA');
  return { drawerScroll: db?db.scrollTop:0, pageScroll: window.scrollY,
    focusKey: isInput ? { id:a.id||'', placeholder:a.placeholder||'', selStart:a.selectionStart, selEnd:a.selectionEnd } : null }; }
function restoreRenderState(snap){
  if(!snap) return;
  requestAnimationFrame(function(){
    var db=document.querySelector('.drawer-body'); if(db && snap.drawerScroll>0) db.scrollTop=snap.drawerScroll;
    if(snap.pageScroll>0) window.scrollTo(0, snap.pageScroll);
    if(snap.focusKey){
      var el = snap.focusKey.id ? document.getElementById(snap.focusKey.id) : null;
      if(!el){ var cands=document.querySelectorAll('input, textarea');
        for(var i=0;i<cands.length;i++){ if((cands[i].placeholder||'')===snap.focusKey.placeholder){ el=cands[i]; break; } } }
      if(el){ el.focus(); try{ el.setSelectionRange(snap.focusKey.selStart, snap.focusKey.selEnd); }catch(e){} }
    }
  });
}
function render(){
  var snap=preserveRenderState();
  var r=getRoute();
  var host=document.getElementById('page-content');
  host.innerHTML=renderList();
  var ov=document.getElementById('overlay-root');
  if(r.name==='view'){ if(!document.getElementById('view-drawer') || viewState.recordId!==r.id) openViewDrawer(r.id); else renderViewDrawer(); }
  else if(r.name==='create'){ if(!document.getElementById('create-drawer')) openCreateDrawer(null, r.arg); }
  else if(r.name==='edit'){ if(!document.getElementById('create-drawer')) openCreateDrawer(r.id); }
  else { if(ov.innerHTML) ov.innerHTML=''; }
  renderIcons();
  restoreRenderState(snap);
}
window.addEventListener('keydown', function(e){
  if(e.key!=='Escape') return;
  if(document.getElementById('combo-pop')){ document.querySelectorAll('.combo-pop').forEach(function(n){ n.remove(); }); return; }
  if(document.getElementById('row-menu')){ document.getElementById('row-menu').remove(); return; }
  if(document.querySelector('.modal-overlay')){ closeModal(); return; }
  if(document.getElementById('create-drawer')){ closeCreateDrawer(); return; }
  if(document.getElementById('view-drawer')){ closeViewDrawer(); return; }
});
window.addEventListener('hashchange', function(){ render(); });
var domReady=false, lucideReady=false;
function bootIfReady(){ if(domReady && lucideReady){ render(); renderIcons(); } }
if(document.readyState==='loading'){ window.addEventListener('DOMContentLoaded', function(){ domReady=true; bootIfReady(); }); } else { domReady=true; }
window.addEventListener('lucide:ready', function(){ lucideReady=true; bootIfReady(); });
if(window.lucide && typeof window.lucide.createIcons==='function'){ lucideReady=true; }
bootIfReady();
setTimeout(function(){ if(!lucideReady){ lucideReady=true; bootIfReady(); } }, 5000);
