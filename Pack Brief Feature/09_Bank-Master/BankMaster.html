// FN-02 — default toggle with uniqueness
function toggleDefault(id, field){
  const a = accounts.find(x => x.id === id); if(!a) return;
  if(a.status !== 'active'){ showToast('บัญชีต้องอยู่สถานะใช้งานก่อนตั้งเป็นค่าเริ่มต้น', 'warning'); return; }
  a[field] = !a[field];
  if(a[field]) accounts.forEach(x => { if(x.company === a.company && x.id !== a.id) x[field] = false; });
  const label = field === 'defaultPay' ? 'จ่าย' : 'รับ';
  pushAudit(id, 'set-default', (a[field] ? 'ตั้งเป็นบัญชี' + label + 'เริ่มต้น' : 'ยกเลิกบัญชี' + label + 'เริ่มต้น'));
  render();
  showToast(a[field] ? 'ตั้งเป็นบัญชี' + label + 'เริ่มต้นแล้ว' : 'ยกเลิกค่าเริ่มต้นแล้ว', 'info');
}

// FN-04 — activate / deactivate
function activateAccount(id){
  const a = accounts.find(x => x.id === id); if(!a) return;
  a.status = 'active';
  pushAudit(id, 'activated', 'เปิดใช้งานบัญชี ' + bankOf(a.bankCode).abbr);
  render(); showToast('เปิดใช้งานบัญชีแล้ว', 'success');
}

// ============================================================
//  MODALS — mount into skeleton #modalBackdrop .modal
// ============================================================
function renderModalEl(){
  const wrap = document.querySelector('#modalBackdrop .modal');
  if(!wrap) return;
  if(!state.modal.open){ wrap.innerHTML = ''; return; }
  const t = state.modal.type;
  if(t === 'archive') wrap.innerHTML = archiveModalHTML();
  else if(t === 'deactivate') wrap.innerHTML = deactivateModalHTML();
  else if(t === 'docpicker') wrap.innerHTML = docPickerHTML();
}

function openArchive(id){ openModal('archive', { id }); }
function archiveModalHTML(){
  const a = accounts.find(x => x.id === state.modal.data.id); if(!a) return '';
  const b = bankOf(a.bankCode);
  const usedNote = a.usedInDoc
    ? `<div class="note is-warn" style="margin-top:12px;"><i data-lucide="lock" class="w-4 h-4"></i><span>บัญชีนี้ถูกใช้ในเอกสารแล้ว จึง<b>ลบถาวรไม่ได้</b> — ระบบจะเก็บถาวร (soft archive) เท่านั้น เอกสารเดิมยังอ้างอิงบัญชีนี้ได้ตามปกติ</span></div>`
    : `<div class="note is-info" style="margin-top:12px;"><i data-lucide="info" class="w-4 h-4"></i><span>การเก็บถาวรจะทำให้บัญชีนี้ไม่ปรากฏในตัวเลือกของเอกสารใหม่ และไม่สามารถตั้งเป็นค่าเริ่มต้นได้</span></div>`;
  return `
    <div class="modal-header">
      <div class="modal-header-icon is-danger"><i data-lucide="archive" class="w-4 h-4"></i></div>
      <div><div class="modal-title">เก็บถาวรบัญชีนี้?</div><div class="modal-subtitle">${esc(b.nameTh)} · ${maskAccNo(a.accNo)}</div></div>
    </div>
    <div class="modal-body">
      ต้องการเก็บถาวรบัญชี "${esc(a.accName)}" ใช่หรือไม่ บัญชีจะถูกย้ายไปสถานะเก็บถาวร
      ${usedNote}
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>
      <button class="btn btn-danger" onclick="confirmArchive()"><i data-lucide="archive" class="w-4 h-4"></i><span>เก็บถาวร</span></button>
    </div>`;
}
function confirmArchive(){
  const a = accounts.find(x => x.id === state.modal.data.id); if(!a) return;
  a.status = 'archived'; a.defaultPay = false; a.defaultReceive = false;
  pushAudit(a.id, 'archived', 'เก็บถาวรบัญชี ' + bankOf(a.bankCode).abbr);
  closeModal();
  if(state.drawer.open) closeDrawer();
  render();
  showToast('เก็บถาวรบัญชีแล้ว', 'success');
}

function openDeactivate(id){ openModal('deactivate', { id }); }
function deactivateModalHTML(){
  const a = accounts.find(x => x.id === state.modal.data.id); if(!a) return '';
  const b = bankOf(a.bankCode);
  return `
    <div class="modal-header">
      <div class="modal-header-icon is-warning"><i data-lucide="power-off" class="w-4 h-4"></i></div>
      <div><div class="modal-title">ปิดใช้งานบัญชีนี้?</div><div class="modal-subtitle">${esc(b.nameTh)} · ${maskAccNo(a.accNo)}</div></div>
    </div>
    <div class="modal-body">
      "${esc(a.accName)}" จะไม่ปรากฏในตัวเลือกบัญชีของเอกสารใหม่ (เช่น ใบสำคัญจ่าย/รับ)
      <div class="note is-info" style="margin-top:12px;"><i data-lucide="info" class="w-4 h-4"></i><span>เอกสารเดิมที่อ้างอิงบัญชีนี้ยังแสดงและใช้งานได้ตามปกติ — คุณเปิดใช้งานใหม่ได้ภายหลัง</span></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button>
      <button class="btn btn-danger" onclick="confirmDeactivate()"><i data-lucide="power-off" class="w-4 h-4"></i><span>ปิดใช้งาน</span></button>
    </div>`;
}
function confirmDeactivate(){
  const a = accounts.find(x => x.id === state.modal.data.id); if(!a) return;
  a.status = 'inactive'; a.defaultPay = false; a.defaultReceive = false;
  pushAudit(a.id, 'deactivated', 'ปิดใช้งานบัญชี ' + bankOf(a.bankCode).abbr);
  closeModal(); render();
  showToast('ปิดใช้งานบัญชีแล้ว', 'success');
}

// FN-04 — mock document picker
function openDocPicker(){ openModal('docpicker', {}); }
function docPickerHTML(){
  const cid = state.currentCompany;
  const active = companyAccounts(cid).filter(a => a.status === 'active');
  const inactiveEx = companyAccounts(cid).find(a => a.status !== 'active' && a.usedInDoc);
  const list = active.length
    ? active.map(a => { const b = bankOf(a.bankCode); return `
        <div class="pick-row">
          <span class="bank-logo" style="background:${b.color};">${esc(b.abbr.slice(0,4))}</span>
          <div class="pr-main"><div class="pr-name">${esc(b.nameTh)} · ${ACCT_TYPES[a.acctType]}</div><div class="pr-sub">${maskAccNo(a.accNo)}${a.defaultPay?' · ค่าเริ่มต้นจ่าย':''}${a.defaultReceive?' · ค่าเริ่มต้นรับ':''}</div></div>
          <button class="btn btn-sm btn-secondary" onclick="pickDocAccount('${a.id}')">เลือก</button>
        </div>`; }).join('')
    : '<div style="color:var(--c-mute-2); font-size:13px;">ไม่มีบัญชีที่ใช้งานอยู่</div>';
  const existingNote = inactiveEx
    ? `<div class="note is-info" style="margin-top:6px;"><i data-lucide="file-clock" class="w-4 h-4"></i><span>ตัวอย่างเอกสารเดิม <b>PV-2025-014</b> อ้างอิงบัญชี ${esc(bankOf(inactiveEx.bankCode).nameTh)} (${maskAccNo(inactiveEx.accNo)}) ซึ่งปัจจุบัน<b>ปิดใช้งาน</b> — เอกสารเดิมยังแสดงบัญชีนี้ตามปกติ แต่บัญชีดังกล่าวจะไม่อยู่ในรายการให้เลือกด้านบน</span></div>`
    : '';
  return `
    <div class="modal-header">
      <div class="modal-header-icon"><i data-lucide="file-check-2" class="w-4 h-4"></i></div>
      <div><div class="modal-title">จำลอง: เลือกบัญชีในเอกสาร</div><div class="modal-subtitle">แสดงเฉพาะบัญชี "ใช้งาน" ของ ${esc(companyOf(cid).name)}</div></div>
    </div>
    <div class="modal-body">
      ${list}
      ${existingNote}
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="closeModal()">ปิด</button>
    </div>`;
}
function pickDocAccount(id){
  const a = accounts.find(x => x.id === id); if(!a) return;
  closeModal();
  showToast('เลือกบัญชี ' + bankOf(a.bankCode).abbr + ' ' + maskAccNo(a.accNo) + ' แล้ว (จำลอง)', 'success');
}

// ============================================================
//  BANK create drawer (FN / S-05 — foreign bank + SWIFT)
// ============================================================
function openBankCreate(){ bankForm = blankBankForm(); openDrawer('bank-create'); }
function bfErr(name){ return bankForm.errors[name] ? `<div class="field-error" style="visibility:visible;">${bankForm.errors[name]}</div>` : ''; }
function bfInv(name){ return bankForm.errors[name] ? ' is-invalid' : ''; }

function bankFormHTML(){
  return `
    <div class="dw-head">
      <div class="dw-head-row">
        <div>
          <div class="dw-eyebrow"><i data-lucide="landmark" class="w-3.5 h-3.5"></i>เพิ่มธนาคาร</div>
          <h2 class="dw-title">ธนาคารใหม่ (นอก preset)</h2>
          <div class="dw-sub">สำหรับธนาคารต่างประเทศหรือธนาคารที่ยังไม่มีในรายการมาตรฐาน</div>
        </div>
        <button class="top-icon-btn" onclick="closeDrawer()"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
    </div>
    <div class="drawer-body">
      <div class="field${bfInv('nameTh')}">
        <label class="field-label">ชื่อธนาคาร <span class="req">*</span></label>
        <input class="input" id="bk-name" placeholder="เช่น ธนาคาร HSBC" value="${esc(bankForm.nameTh)}" oninput="bankForm.nameTh=this.value;">
        ${bfErr('nameTh')}
      </div>
      <div class="field-row">
        <div class="field${bfInv('abbr')}">
          <label class="field-label">ชื่อย่อ <span class="req">*</span></label>
          <input class="input" id="bk-abbr" placeholder="เช่น HSBC" value="${esc(bankForm.abbr)}" oninput="bankForm.abbr=this.value.toUpperCase(); this.value=bankForm.abbr;">
          ${bfErr('abbr')}
        </div>
        <div class="field${bfInv('code')}">
          <label class="field-label">รหัส ธปท. (ถ้ามี)</label>
          <input class="input" id="bk-code" inputmode="numeric" placeholder="3 หลัก" value="${esc(bankForm.code)}" oninput="bankForm.code=this.value.replace(/[^0-9]/g,'').slice(0,3); this.value=bankForm.code;">
          ${bfErr('code')}
        </div>
      </div>
      <div class="field${bfInv('swift')}">
        <label class="field-label">รหัส SWIFT / BIC <span class="req">*</span>
          <span class="info-tip" data-tip="รหัสสากล 8 หรือ 11 หลัก (ตัวอักษร/ตัวเลข) ใช้ระบุธนาคารในการโอนระหว่างประเทศ"><i data-lucide="info" class="w-3.5 h-3.5"></i></span>
        </label>
        <input class="input" id="bk-swift" placeholder="เช่น HSBCTHBK" value="${esc(bankForm.swift)}" oninput="bankForm.swift=this.value.toUpperCase().replace(/[^A-Z0-9]/g,''); this.value=bankForm.swift;">
        <div class="field-help">8 หรือ 11 หลัก — ตัวอักษรและตัวเลข</div>
        ${bfErr('swift')}
      </div>
      <div class="field">
        <label class="field-label">ประเภท</label>
        <select class="select" id="bk-type" onchange="bankForm.type=this.value;">
          <option value="foreign" ${bankForm.type==='foreign'?'selected':''}>ต่างประเทศ</option>
          <option value="local" ${bankForm.type==='local'?'selected':''}>ในประเทศ</option>
        </select>
      </div>
    </div>
    <div class="dw-footer">
      <div></div>
      <div class="dw-footer-right">
        <button class="btn btn-ghost" onclick="closeDrawer()">ยกเลิก</button>
        <button class="btn btn-primary" id="bk-submit" onclick="submitBank()"><i data-lucide="check" class="w-4 h-4"></i><span>ยืนยันสร้าง</span></button>
      </div>
    </div>`;
}

function submitBank(){
  const e = {};
  if(!bankForm.nameTh.trim()) e.nameTh = 'กรุณากรอกชื่อธนาคาร';
  if(!bankForm.abbr.trim()) e.abbr = 'กรุณากรอกชื่อย่อ';
  if(!bankForm.swift) e.swift = 'กรุณากรอกรหัส SWIFT';
  else if(!/^[A-Z0-9]{8}$|^[A-Z0-9]{11}$/.test(bankForm.swift)) e.swift = 'SWIFT ต้องมี 8 หรือ 11 หลัก';
  else if(banks.some(b => b.swift === bankForm.swift)) e.swift = 'รหัส SWIFT นี้มีอยู่แล้ว';
  if(bankForm.code && !/^[0-9]{3}$/.test(bankForm.code)) e.code = 'รหัส ธปท. ต้องเป็นตัวเลข 3 หลัก';
  bankForm.errors = e;
  if(Object.keys(e).length){ render(); showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
  const btn = document.getElementById('bk-submit');
  if(btn){ btn.classList.add('is-disabled'); btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>'; renderIcons(); }
  setTimeout(() => {
    const code = bankForm.code || ('X' + String(banks.length + 1).padStart(2, '0'));
    banks.push({ code, nameTh: bankForm.nameTh.trim(), abbr: bankForm.abbr.trim(), swift: bankForm.swift, type: bankForm.type, color: '#4b5563', custom: true });
    closeDrawer();
    state.tab = 'banks';
    showToast('เพิ่มธนาคารสำเร็จ', 'success');
  }, 650);
}
</script>
