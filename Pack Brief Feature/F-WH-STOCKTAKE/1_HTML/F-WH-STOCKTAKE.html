<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stocktake · CUBE</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script><style>
:root{--sidebar-w:232px;--z-backdrop:29;--z-pop:40;--z-toast:80;--c-navy:#111111;--c-primary:#FF3B30;--c-teal:#FF9A1F;--c-bg:#FAF8F5;--c-line:#E9E5E0;--c-mute:#73757B;--fs-sm:12px;--fs-md:14px;--r:10px;--sp-2:8px;--sp-4:16px;--z-sidebar:20;--z-drawer:30;--z-modal:50}*{box-sizing:border-box}body{margin:0;min-width:768px;background:var(--c-bg);font:14px 'Satoshi','Noto Sans Thai',system-ui;color:var(--c-navy);scrollbar-gutter:stable}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.w-4{width:16px}.h-4{height:16px}html{scrollbar-width:thin}::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:#DEDAD4;border-radius:8px}input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}input[type=number]{-moz-appearance:textfield}.sidebar{position:fixed;inset:0 auto 0 0;width:232px;background:var(--c-navy);color:white;padding:20px;z-index:var(--z-sidebar)}.brand{font-size:26px;font-weight:700;margin-bottom:32px}.sb-module{font-size:12px;color:#9A9CA2;margin-bottom:10px}.sb-link{display:block;color:white;text-decoration:none;padding:12px;border-radius:8px;background:var(--c-primary)}.main{margin-left:var(--sidebar-w);min-height:100vh;display:flex;flex-direction:column}.shell-bar{height:52px;background:white;border-bottom:1px solid var(--c-line);padding:0 24px;display:flex;align-items:center;gap:8px}.content{padding:24px;flex:1;display:flex;flex-direction:column}.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:16px}.ph h1{font-size:26px;margin:0}.ph-sub{color:var(--c-mute);margin:4px 0}.ph-actions{display:flex;align-items:center;gap:8px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--c-line);border-radius:8px;background:white;padding:8px 12px;white-space:nowrap}.btn-primary{color:white;background:var(--c-primary);border-color:var(--c-primary)}.btn-ghost{border-color:transparent;background:transparent}.btn-sm{font-size:12px;padding:6px 8px}.btn:disabled{opacity:.45;cursor:not-allowed}.tabs{display:flex;align-items:center;gap:4px;border-bottom:1px solid var(--c-line);margin-bottom:16px}.tab{padding:10px 16px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--c-mute)}.tab.is-active{color:var(--c-primary);border-color:var(--c-primary);font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.stat,.card{background:white;border:1px solid var(--c-line);border-radius:10px}.stat{padding:16px}.stat strong{display:block;font-size:20px}.stat small{color:var(--c-mute)}.page-fill{flex:1;display:flex;flex-direction:column;min-height:380px}.toolbar{padding:12px;border-bottom:1px solid var(--c-line)}.search-box{display:flex;align-items:center;gap:8px}.search-box .input{width:100%}.input,.select,textarea{padding:6px 10px;min-height:36px;border:1px solid #DEDAD4;border-radius:8px;background:white;color:var(--c-navy)}.table-wrap{overflow:auto;flex:1}.tbl{border-collapse:collapse;width:100%;white-space:nowrap}.tbl th,.tbl td{padding:8px 12px;border-bottom:1px solid #F1EEEA;text-align:left}.tbl th{background:#FAF8F5;position:sticky;top:0;font-size:12px;color:var(--c-mute)}.tbl tr:hover{background:#FAF8F5}.num{text-align:right!important;font-variant-numeric:tabular-nums}.mono{color:var(--c-primary);font-weight:700}.table-foot{display:flex;align-items:center;justify-content:space-between;padding:12px;background:#FAF8F5;border-top:1px solid var(--c-line)}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#F1EEEA;font-size:12px}.pill.frozen,.pill.counting{background:#FFF1DD;color:#B8690B}.pill.review,.pill.recount{background:#E6F0FF;color:#1A5FCC}.pill.approved,.pill.closed{background:#E4F4EB;color:#157A41}.pill.rejected{background:#FFE9E7;color:#E62E24}.demo{display:flex;align-items:center;gap:8px}.demo-badge{color:#B8690B;background:#FFF1DD;padding:4px 6px;border-radius:6px;font-size:11px;font-weight:700}.drawer-backdrop{position:fixed;inset:0;background:#11111166;z-index:var(--z-backdrop);opacity:0;pointer-events:none}.drawer-backdrop.is-open{opacity:1;pointer-events:auto}.drawer{position:fixed;inset:0 0 0 auto;width:min(920px,100vw);z-index:var(--z-drawer);background:white;display:flex;flex-direction:column;transform:translateX(100%);transition:transform 280ms cubic-bezier(.4,0,.2,1)}.drawer.is-open{transform:translateX(0)}.dw-head{padding:18px 24px;border-bottom:1px solid var(--c-line);display:flex;align-items:center;justify-content:space-between}.dw-body{flex:1;overflow:auto;padding:20px 24px;scrollbar-gutter:stable}.dw-footer{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:12px 24px;border-top:1px solid var(--c-line);background:#FAF8F5}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}.field-label{font-size:12px;font-weight:700}.combo{position:relative}.combo-pop{position:absolute;top:100%;left:0;right:0;z-index:var(--z-pop);background:white;border:1px solid var(--c-line);box-shadow:0 8px 20px #11111122;max-height:220px;overflow:auto}.combo-option{padding:10px;cursor:pointer}.combo-option:hover{background:#FAF8F5}.modal-backdrop{position:fixed;inset:0;z-index:var(--z-modal);background:#11111166;display:grid;gap:0;place-items:center}.modal{width:min(440px,92vw);background:white;border-radius:10px;padding:20px}.modal-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:16px}.slot-row{display:grid;grid-template-columns:32px 110px 1fr;gap:10px;align-items:center}.emp-chip{display:flex;align-items:center;gap:8px}.avatar{height:32px;width:32px;display:grid;gap:0;place-items:center;border-radius:50%;background:#FFE9E7;color:#E62E24;font-weight:700}.timeline{border-left:2px solid var(--c-line);padding:0 0 16px 16px}.empty{padding:56px;text-align:center;color:var(--c-mute)}#toast-root{position:fixed;bottom:16px;right:16px;z-index:var(--z-toast)}.toast{background:#111111;color:white;padding:10px 16px;border-radius:8px}@media(max-width:1024px){.sidebar{width:58px;padding:8px}.main{margin-left:56px}.content{padding:16px}.stats{grid-template-columns:repeat(2,1fr)}}
.section-pad{padding:16px}.full-width{width:100%}</style><!-- PREFLIGHT spacing_off=0 font_off=0 hex_off=0; mandatory toolbar inline widths excluded --></head><body><aside class="sidebar"><div class="brand">C</div><div class="sb-module">Warehouse</div><a class="sb-link" href="#/rounds">ตรวจนับใหญ่</a></aside><div class="main"><header class="shell-bar">Warehouse <i class="w-4 h-4" data-lucide="chevron-right"></i> สินค้าคงคลัง <i class="w-4 h-4" data-lucide="chevron-right"></i> ตรวจนับใหญ่</header><main id="app" class="content"></main></div><div id="drawer-backdrop" class="drawer-backdrop" onclick="closeDrawer()"></div><div id="drawer" class="drawer"></div><div id="overlay-root"></div><div id="toast-root"></div><script>
const LOCATIONS=[{id:'WH-01',name:'คลังหลัก / ทุกโซน'},{id:'WH-01-A',name:'คลังหลัก / โซน A'},{id:'WH-02',name:'คลังสาขาเหนือ / ทุกโซน'}],ITEMS=[{id:'ITM-001',name:'ปั๊มน้ำ',unit:'เครื่อง',location:'WH-01-A',qty:12},{id:'ITM-002',name:'วาล์ว',unit:'ชิ้น',location:'WH-01-A',qty:20}],PEOPLE=[{id:'P1',name:'กิตติพงษ์ ใจดี',position:'เจ้าหน้าที่คลัง',avatar:'กจ'},{id:'P2',name:'พิมพ์ดาว ศรีสุข',position:'ผู้ตรวจนับอิสระ',avatar:'พศ'},{id:'P3',name:'นลิน วัฒนา',position:'ผู้จัดการคลัง',avatar:'นว'}];const inventoryConfig={varianceThreshold:2,effectiveDate:'2026-09-01'};let rounds=[{id:'ST-2026-001',name:'ตรวจนับคลังหลัก กันยายน',scope:'WH-01-A',status:'counting',freezeAt:'2026-09-14 09:00',snapshot:[{item:'ITM-001',qty:12},{item:'ITM-002',qty:20}],assignee:'P1',recountAssignee:'',counts:{},recounts:{},audit:[{act:'freeze เฉพาะ WH-01-A และ snapshot',at:'2026-09-14 09:00'}],adjustmentRef:''}];let tab='rounds',role='counter',selected=rounds[0].id,modal=null,drawer=null,search='',statusFilter='all';
function icon(n){return `<i data-lucide="${n}" class="w-4 h-4"></i>`}function renderIcons(){if(window.lucide?.createIcons)window.lucide.createIcons()}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function person(id){let p=PEOPLE.find(x=>x.id===id);return p?`<span class="emp-chip"><span class="avatar">${p.avatar}</span><span><b>${p.name}</b><small>${p.position}</small></span></span>`:'—'}function pill(x){return `<span class="pill ${x}">${({draft:'แบบร่าง',frozen:'แช่ยอดแล้ว',counting:'กำลังนับ',recount:'รอนับซ้ำ',review:'ตรวจผลต่าง',pending:'รออนุมัติ',approved:'อนุมัติแล้ว',rejected:'ไม่อนุมัติ',closed:'ปิดรอบ'})[x]||x}</span>`}function current(){return rounds.find(x=>x.id===selected)}function eventLog(r,act){r.audit.push({act,at:new Date().toISOString().slice(0,16).replace('T',' ')})}function toast(t){document.getElementById('toast-root').innerHTML=`<div class="toast">${esc(t)}</div>`;setTimeout(()=>document.getElementById('toast-root').innerHTML='',3500)}function canSeeSystem(){return role==='supervisor'}function setRole(v){role=v;render()}function setTab(v){tab=v;location.hash='#/'+v;render()}function resetFilters(){search='';statusFilter='all';render()}
function header(){return `<div class="ph"><div><h1>ตรวจนับใหญ่ (Stocktake)</h1><p class="ph-sub">กำหนด scope · freeze และ snapshot · นับแบบ blind · ตรวจผลต่างก่อนส่งปรับยอด</p></div><div class="ph-actions"><div class="demo" data-demo="persona-switch"><span class="demo-badge">DEMO</span><select class="select" aria-label="สลับมุมมองเพื่อทดสอบ" onchange="setRole(this.value)"><option value="counter" ${role==='counter'?'selected':''}>ผู้นับ</option><option value="supervisor" ${role==='supervisor'?'selected':''}>หัวหน้างาน</option></select></div><button class="btn btn-primary" onclick="openCreate()">${icon('plus')} สร้างรอบนับ</button></div></div><div class="tabs"><button class="tab ${tab==='rounds'?'is-active':''}" onclick="setTab('rounds')">รอบนับ</button><button class="tab ${tab==='sheets'?'is-active':''}" onclick="setTab('sheets')">ใบนับ</button><button class="tab ${tab==='variance'?'is-active':''}" onclick="setTab('variance')">ผลต่าง</button><button class="tab ${tab==='history'?'is-active':''}" onclick="setTab('history')">ประวัติ</button></div>`}
function render(){let r=current(),active=rounds.filter(x=>!['closed','rejected'].includes(x.status)).length;document.getElementById('app').innerHTML=header()+`<div class="stats"><div class="stat"><small>รอบนับทั้งหมด</small><strong>${rounds.length}</strong></div><div class="stat"><small>รอบที่เปิดอยู่</small><strong>${active}</strong></div><div class="stat"><small>ใบนับรอส่ง</small><strong>${rounds.filter(x=>x.status==='counting').length}</strong></div><div class="stat"><small>รอตรวจผลต่าง</small><strong>${rounds.filter(x=>['review','recount','pending'].includes(x.status)).length}</strong></div></div>${tab==='rounds'?renderRounds():tab==='sheets'?renderSheets(r):tab==='variance'?renderVariance(r):renderHistory(r)}`;if(tab==='rounds')renderRows();renderIcons()}
function filterBar(){return `<div class="toolbar" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><div class="search-box" style="flex:1;min-width:220px;max-width:420px"><i data-lucide="search" class="w-4 h-4"></i><input class="input" placeholder="ค้นหาชื่อ / รหัสรอบนับ / คลัง…" value="${esc(search)}" oninput="search=this.value;renderRows()"></div><select class="select" style="width:200px"><option>ทุกประเภท</option><option>รอบนับใหญ่</option></select><select class="select" style="width:180px" onchange="statusFilter=this.value;renderRows()"><option value="all">ทุกสถานะ</option>${['draft','counting','recount','review','pending','approved','closed'].map(x=>`<option value="${x}" ${statusFilter===x?'selected':''}>${pill(x).replace(/<[^>]*>/g,'')}</option>`).join('')}</select><button class="btn btn-ghost btn-sm" onclick="resetFilters()"><i data-lucide="rotate-ccw" class="w-4 h-4"></i> ล้างตัวกรอง</button></div>`}function renderRounds(){return `<section class="card page-fill">${filterBar()}<div class="table-wrap" id="rows"></div><div class="table-foot"><span>แสดงต่อหน้า 20</span><span id="rowcount"></span></div></section>`}function renderRows(){let x=rounds.filter(r=>(statusFilter==='all'||r.status===statusFilter)&&(!search||[r.id,r.name,r.scope].join(' ').toLowerCase().includes(search.toLowerCase())));document.getElementById('rows').innerHTML=x.length?`<table class="tbl"><thead><tr><th>รหัสรอบ</th><th>ชื่อรอบนับ</th><th>scope</th><th>เวลา freeze / snapshot</th><th>ผู้รับผิดชอบ</th><th>สถานะ</th><th>เปิด</th></tr></thead><tbody>${x.map(r=>`<tr onclick="selected='${r.id}';setTab('sheets')"><td class="mono">${r.id}</td><td>${esc(r.name)}</td><td>${esc(LOCATIONS.find(x=>x.id===r.scope)?.name||r.scope)}</td><td>${esc(r.freezeAt||'—')}</td><td>${person(r.assignee)}</td><td>${pill(r.status)}</td><td>${icon('arrow-right')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">ไม่พบรอบนับที่ตรงกับตัวกรอง</div>';document.getElementById('rowcount').textContent=`${x.length} จาก ${rounds.length}`;renderIcons()}
function renderSheets(r){if(!r)return '<div class="empty">ยังไม่มีรอบนับ</div>';let second=r.status==='recount',assigned=second?r.recountAssignee:r.assignee,values=second?r.recounts:r.counts;return `<section class="card page-fill"><div class="section-pad"><h2>${esc(r.name)} ${pill(r.status)}</h2><p>scope ${esc(LOCATIONS.find(x=>x.id===r.scope)?.name)} · snapshot ${esc(r.freezeAt||'ยังไม่เริ่ม')} · ผู้นับ ${person(assigned)}</p>${r.status==='draft'?`<button class="btn btn-primary" onclick="freezeRound('${r.id}')">เริ่ม freeze และ snapshot</button>`:''}${r.status==='frozen'?`<button class="btn btn-primary" onclick="openAssign('${r.id}',false)">มอบหมายใบนับ</button>`:''}${r.status==='recount'&&!assigned?`<button class="btn btn-primary" onclick="openAssign('${r.id}',true)">มอบหมายนับซ้ำ</button>`:''}</div><div class="table-wrap"><table class="tbl"><thead><tr><th>สินค้า</th><th>ตำแหน่ง</th><th>หน่วย</th>${canSeeSystem()?'<th class="num">ยอด snapshot</th>':''}<th class="num">ผลนับ${second?' ครั้งที่ 2':''}</th><th>สถานะ</th></tr></thead><tbody>${r.snapshot.map(s=>{let it=ITEMS.find(i=>i.id===s.item),v=values[s.item];return `<tr><td>${esc(it?.id)} · ${esc(it?.name)}</td><td>${esc(r.scope)}</td><td>${esc(it?.unit)}</td>${canSeeSystem()?`<td class="num">${s.qty}</td>`:''}<td class="num">${['counting','recount'].includes(r.status)?`<input class="input num" type="number" min="0" value="${v??''}" aria-label="ผลนับ ${it?.id}" oninput="recordCount('${r.id}','${s.item}',this.value)">`:v??'—'}</td><td>${v===undefined?'รอนับ':'บันทึกแล้ว'}</td></tr>`}).join('')}</tbody></table></div><div class="table-foot"><span>${r.snapshot.length} รายการ</span>${['counting','recount'].includes(r.status)?`<button class="btn btn-primary" onclick="submitCount('${r.id}')">ส่งผลนับ</button>`:''}</div></section>`}
function recordCount(id,item,val){let r=rounds.find(x=>x.id===id),out=r.status==='recount'?r.recounts:r.counts;if(val===''){delete out[item];return}out[item]=Number(val)}function submitCount(id){let r=rounds.find(x=>x.id===id),vals=r.status==='recount'?r.recounts:r.counts;if(r.snapshot.some(s=>!Number.isFinite(vals[s.item])||vals[s.item]<0)){toast('กรุณากรอกผลนับทุกสินค้าเป็นศูนย์หรือมากกว่า');return}let needs=r.snapshot.some(s=>Math.abs(vals[s.item]-s.qty)>inventoryConfig.varianceThreshold);if(r.status==='counting'&&needs){r.status='recount';r.recountAssignee='';eventLog(r,'ผลนับครั้งที่ 1 เกิน threshold · รอนับซ้ำ');toast('ต้องนับซ้ำโดยคนอิสระ')}else{r.status='review';eventLog(r,r.recountAssignee?'ส่งผลนับซ้ำแล้ว':'ส่งผลนับแล้ว');toast('ส่งผลนับแล้ว')}setTab('variance')}
function renderVariance(r){if(!r)return '<div class="empty">ยังไม่มีรอบนับ</div>';if(!canSeeSystem())return `<div class="card empty">ไม่มีสิทธิ์ดูผลต่าง</div>`;let vals=r.recountAssignee&&Object.keys(r.recounts).length?r.recounts:r.counts;return `<section class="card page-fill"><div class="section-pad"><h2>ผลต่าง · ${esc(r.id)} ${pill(r.status)}</h2><dl><dt>เกณฑ์นับซ้ำ</dt><dd>${inventoryConfig.varianceThreshold} หน่วย · มีผล ${inventoryConfig.effectiveDate}</dd></dl></div><div class="table-wrap"><table class="tbl"><thead><tr><th>สินค้า</th><th class="num">ยอด snapshot</th><th class="num">นับครั้งที่ 1</th><th class="num">นับซ้ำ</th><th class="num">ผลต่างสุดท้าย</th><th>ตรวจ</th></tr></thead><tbody>${r.snapshot.map(s=>{let v=vals[s.item],diff=v===undefined?null:v-s.qty,exceed=diff!==null&&Math.abs(diff)>inventoryConfig.varianceThreshold;return `<tr><td>${esc(s.item)}</td><td class="num">${s.qty}</td><td class="num">${r.counts[s.item]??'—'}</td><td class="num">${r.recounts[s.item]??'—'}</td><td class="num">${diff??'—'}</td><td>${exceed?'เกินเกณฑ์':'ปกติ'}</td></tr>`}).join('')}</tbody></table></div><div class="table-foot"><span>Stock Adjustment W3-LITE · ${r.adjustmentRef||'mock ยังไม่ส่ง'} · ไม่มีการปรับยอดที่นี่</span>${r.status==='review'?`<button class="btn btn-primary" onclick="openDoa('${r.id}')">ส่งอนุมัติ DOA</button>`:''}${r.status==='pending'?`<button class="btn" onclick="openReject('${r.id}')">ไม่อนุมัติ</button><button class="btn btn-primary" onclick="openApprove('${r.id}')">อนุมัติ</button>`:''}${r.status==='approved'?`<button class="btn btn-primary" onclick="handoff('${r.id}')">ส่ง Stock Adjustment (mock)</button>`:''}</div></section>`}
function renderHistory(r){if(!r)return '<div class="empty">ยังไม่มีรอบนับ</div>';return `<section class="card" class="section-pad"><h2>ประวัติ · ${esc(r.id)}</h2>${r.audit.map(e=>`<div class="timeline">${esc(e.at)} · ${esc(e.act)}</div>`).join('')}</section>`}
function combo(field,items,value){let v=items.find(x=>x.id===value);return `<div class="combo"><input class="input" class="full-width" placeholder="ค้นหา${field}" value="${esc(v?.name||'')}" onfocus="suggest(this,'${field}')" oninput="suggest(this,'${field}')"><div class="combo-pop hidden"></div></div>`}function suggest(el,field){let arr=field==='คลัง/ตำแหน่ง'?LOCATIONS:PEOPLE,q=el.value.toLowerCase(),pop=el.nextElementSibling;pop.innerHTML=arr.filter(x=>x.name.toLowerCase().includes(q)||x.id.toLowerCase().includes(q)).map(x=>`<div class="combo-option" onclick="choose('${field}','${x.id}')">${field==='คลัง/ตำแหน่ง'?esc(x.name):person(x.id)}</div>`).join('')||'<div class="combo-option">ไม่พบรายการ</div>';pop.classList.remove('hidden')}function choose(field,id){if(field==='คลัง/ตำแหน่ง'){drawer.scope=id;renderDrawer()}else if(modal){modal.person=id;renderModal()}}
function openCreate(){drawer={type:'create',name:'',scope:''};location.hash='#/create';renderDrawer()}function closeDrawer(){drawer=null;document.getElementById('drawer').classList.remove('is-open');document.getElementById('drawer-backdrop').classList.remove('is-open');if(location.hash==='#/create')location.hash='#/rounds'}function renderDrawer(){if(!drawer)return;document.getElementById('drawer-backdrop').classList.add('is-open');let e=document.getElementById('drawer');e.classList.add('is-open');e.innerHTML=`<div class="dw-head"><h2>สร้างรอบนับใหญ่</h2><button class="btn btn-ghost" onclick="closeDrawer()">${icon('x')}</button></div><div class="dw-body"><div class="form-grid"><div class="field"><label class="field-label">ชื่อรอบนับ</label><input class="input" value="${esc(drawer.name)}" oninput="drawer.name=this.value"></div><div class="field"><label class="field-label">คลัง/ตำแหน่ง</label>${combo('คลัง/ตำแหน่ง',LOCATIONS,drawer.scope)}</div></div></div><div class="dw-footer"><button class="btn" onclick="closeDrawer()">ยกเลิก</button><button class="btn btn-primary" onclick="createRound()">บันทึกรอบนับ</button></div>`;renderIcons()}function createRound(){if(!drawer.name.trim()||!drawer.scope){toast('กรุณาระบุชื่อและ scope');return}let d={id:'ST-2026-'+String(rounds.length+1).padStart(3,'0'),name:drawer.name,scope:drawer.scope,status:'draft',freezeAt:'',snapshot:[],assignee:'',recountAssignee:'',counts:{},recounts:{},audit:[],adjustmentRef:''};rounds.unshift(d);selected=d.id;closeDrawer();setTab('sheets');toast('สร้างรอบนับแล้ว')}
function freezeRound(id){let r=rounds.find(x=>x.id===id);if(rounds.some(x=>x.id!==id&&x.scope===r.scope&&!['closed','rejected'].includes(x.status))){toast('scope นี้มีรอบนับที่ freeze อยู่');return}r.freezeAt=new Date().toISOString().slice(0,16).replace('T',' ');r.snapshot=ITEMS.filter(i=>r.scope==='WH-01'||i.location===r.scope).map(i=>({item:i.id,qty:i.qty}));if(!r.snapshot.length){toast('ไม่มีสินค้าใน scope');return}r.status='frozen';eventLog(r,'freeze movement เฉพาะ '+r.scope+' และ snapshot');render();toast('แช่ยอดและเก็บ snapshot แล้ว')}function openAssign(id,recount){modal={type:'assign',id,recount,person:''};renderModal()}function openDoa(id){modal={type:'doa',id,person:''};renderModal()}function openApprove(id){modal={type:'approve',id};renderModal()}function openReject(id){modal={type:'reject',id};renderModal()}function closeModal(){modal=null;document.getElementById('overlay-root').innerHTML=''}function modalBackdrop(e,el){if(e.target===el)closeModal()}function renderModal(){if(!modal)return;let r=rounds.find(x=>x.id===modal.id),title={assign:modal.recount?'มอบหมายนับซ้ำ':'มอบหมายใบนับ',doa:'เลือกผู้อนุมัติ DOA',approve:'ยืนยันการอนุมัติ',reject:'ไม่อนุมัติ'}[modal.type];document.getElementById('overlay-root').innerHTML=`<div class="modal-backdrop" onclick="modalBackdrop(event,this)"><div class="modal"><h3>${title}</h3>${['assign','doa'].includes(modal.type)?`<div class="slot-row"><span>1</span><span>${modal.type==='doa'?'ผู้อนุมัติ':'ผู้นับ'}</span>${combo('บุคคล',PEOPLE,modal.person)}</div>${modal.person?person(modal.person):''}`:modal.type==='approve'?`<p>อนุมัติผลต่างของ ${esc(r.id)} ก่อนส่ง Stock Adjustment</p>${person(r.approver)}`:'<textarea id="reject-reason" class="input" placeholder="เหตุผลที่ไม่อนุมัติ"></textarea>'}<div class="modal-actions"><button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" onclick="confirmModal()">ยืนยัน</button></div></div></div>`;renderIcons()}function confirmModal(){let r=rounds.find(x=>x.id===modal.id);if(['assign','doa'].includes(modal.type)&&!modal.person){toast('กรุณาเลือกคนจริง');return}if(modal.type==='assign'){if(modal.recount&&modal.person===r.assignee){toast('ผู้นับซ้ำต้องเป็นคนละคน');return}if(modal.recount)r.recountAssignee=modal.person;else{r.assignee=modal.person;r.status='counting'}eventLog(r,'มอบหมาย '+PEOPLE.find(x=>x.id===modal.person).name)}else if(modal.type==='doa'){r.approver=modal.person;r.status='pending';eventLog(r,'ส่งอนุมัติ DOA ให้ '+PEOPLE.find(x=>x.id===modal.person).name)}else if(modal.type==='approve'){r.status='approved';eventLog(r,'DOA อนุมัติโดย '+PEOPLE.find(x=>x.id===r.approver).name)}else{let reason=document.getElementById('reject-reason').value.trim();if(!reason){toast('กรุณาระบุเหตุผล');return}r.status='rejected';eventLog(r,'DOA ไม่อนุมัติ: '+reason)}closeModal();render();toast('บันทึกผลแล้ว')}
function handoff(id){let r=rounds.find(x=>x.id===id);r.adjustmentRef='mock: W3-LITE Stock Adjustment';eventLog(r,'ส่งผลต่างเข้า Stock Adjustment (mock [ASSUMED contract])');r.status='closed';eventLog(r,'ปลด freeze เฉพาะ '+r.scope);render();toast('ส่งต่อ mock แล้ว · ไม่ปรับยอดที่ Stocktake')}function route(){let h=location.hash.slice(2);if(['rounds','sheets','variance','history'].includes(h))tab=h;render();if(h==='create'&&drawer)renderDrawer()}window.addEventListener('hashchange',function(){route()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(modal)closeModal();else if(document.querySelector('.combo-pop:not(.hidden)'))document.querySelectorAll('.combo-pop').forEach(x=>x.classList.add('hidden'));else closeDrawer()}});route();
</script></body></html>
