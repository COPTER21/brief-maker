    '<select class="select" style="width:170px;" onchange="state.wh=this.value; state.page=1; renderTableOnly();">' +
      '<option value="all"' + (state.wh === 'all' ? ' selected' : '') + '>ทุกคลัง</option>' +
      WAREHOUSES.map(function (w) { return '<option value="' + w.code + '"' + (state.wh === w.code ? ' selected' : '') + '>' + w.name + '</option>'; }).join('') +
    '</select>' +
    (hasFilter() ? '<button class="btn btn-ghost btn-sm" type="button" onclick="resetFilters()"><i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i><span>ล้างตัวกรอง</span></button>' : '') +
  '</div>';
}
function th(label, col, align) {
  const on = state.sort.col === col;
  return '<th class="is-sortable ' + (on ? 'is-sorted' : '') + '"' + (align ? ' style="text-align:' + align + ';"' : '') + ' onclick="sortBy(\'' + col + '\')">' + label + ' <span class="sort-arrow">' + (on ? (state.sort.dir === 'asc' ? '↑' : '↓') : '↕') + '</span></th>';
}
function renderTable(rows) {
  if (!rows.length) {
    return '<table class="table"><thead><tr><th>เลขที่</th></tr></thead></table>' +
      (hasFilter()
        ? emptyStateHTML({ icon:'search-x', title:'ไม่พบรายการที่ค้นหา', desc:'ลองปรับคำค้นหรือล้างตัวกรอง', actionLabel:'ล้างตัวกรอง', actionIcon:'rotate-ccw', onAction:'resetFilters()' })
        : emptyStateHTML({ icon:'scale', title:'ยังไม่มีใบปรับยอด', desc:'เริ่มต้นด้วยการสร้างใบปรับยอดแรกของคุณ', actionLabel:'สร้างใบปรับยอด', actionIcon:'plus', onAction:"navigate('create')" }));
  }
  return '<table class="table"><thead><tr>' +
      th('เลขที่', 'code') +
      th('วันที่มีผล', 'effectiveDate') +
      '<th>คลัง</th>' +
      '<th>ประเภทการปรับ</th>' +
      '<th>สถานะเอกสาร</th>' +
      '<th style="text-align:center;">ลายเซ็น</th>' +
      th('มูลค่าที่ปรับ', 'amount', 'right') +
      '<th style="width:52px;"></th>' +
    '</tr></thead><tbody id="table-body">' + pageRows(rows).map(rowHtml).join('') + '</tbody></table>';
}
function rowHtml(d) {
  const abs = absTotal(d), net = netTotal(d);
  return '<tr class="is-clickable" onclick="navigate(\'view/' + d.id + '\')">' +
    '<td><span class="tbl-mono" style="color:var(--c-primary);font-weight:600;">' + (d.code || 'ร่าง — ยังไม่ออกเลขที่') + '</span></td>' +
    '<td>' + fdate(d.effectiveDate) + '</td>' +
    '<td><span class="cell-truncate" title="' + esc((WH_BY[d.warehouse] || {}).name || d.warehouse) + '">' + esc((WH_BY[d.warehouse] || {}).name || d.warehouse) + '</span></td>' +
    '<td>' + ADJ_TYPES[d.adjType].label + '</td>' +
    '<td>' + docPill(d.status) + '</td>' +
    '<td style="text-align:center;">' + renderSignProgress(d) + '</td>' +
    '<td class="col-num"><span class="num" style="font-weight:600;" title="สุทธิ ' + signedMoney(net) + '">' + formatMoney(abs) + '</span></td>' +
    '<td onclick="event.stopPropagation()" style="text-align:right;"><button class="ra-btn" type="button" title="ดำเนินการ" onclick="openRowMenu(\'' + d.id + '\', event)"><i data-lucide="more-vertical" class="w-4 h-4"></i></button></td>' +
  '</tr>';
}
function renderFoot(rows) {
  const tot = rows.length, from = tot ? (state.page - 1) * state.pageSize + 1 : 0, to = Math.min(state.page * state.pageSize, tot);
  const pages = Math.max(1, Math.ceil(tot / state.pageSize));
  let btns = '';
  for (let i = 1; i <= pages; i++) btns += '<button class="pg-btn ' + (i === state.page ? 'is-active' : '') + '" type="button" onclick="goToPage(' + i + ')">' + i + '</button>';
  return '<div style="display:flex;align-items:center;gap:8px;"><span>แสดงต่อหน้า</span>' +
      '<select class="select" style="width:78px;height:30px;" onchange="state.pageSize=+this.value; state.page=1; renderTableOnly();">' +
        [10, 20, 50].map(function (n) { return '<option value="' + n + '"' + (state.pageSize === n ? ' selected' : '') + '>' + n + '</option>'; }).join('') + '</select></div>' +
    '<div class="pagination">' +
      '<button class="pg-btn ' + (state.page === 1 ? 'is-disabled' : '') + '" type="button" onclick="goToPage(' + Math.max(1, state.page - 1) + ')"><i data-lucide="chevron-left" class="w-3 h-3"></i></button>' +
      btns +
      '<button class="pg-btn ' + (state.page === pages ? 'is-disabled' : '') + '" type="button" onclick="goToPage(' + Math.min(pages, state.page + 1) + ')"><i data-lucide="chevron-right" class="w-3 h-3"></i></button>' +
      '<span style="margin-left:10px;">' + from + ' – ' + to + ' จาก ' + tot + '</span>' +
    '</div>';
}
function renderTableOnly() {
  const rows = filtered();
  const w = document.getElementById('table-wrap'), f = document.getElementById('table-foot');
  if (w) w.innerHTML = renderTable(rows);
  if (f) f.innerHTML = renderFoot(rows);
  renderIcons();
}
function openRowMenu(id, e) {
  e.stopPropagation();
  closeRowMenu();
  const d = findDoc(id);
  const items = [['เปิดดูรายละเอียด', 'file-text', "navigate('view/" + id + "')", false]];
  if (d.status === 'draft') items.push(['แก้ไขร่าง', 'pencil', "navigate('edit/" + id + "')", false]);
  if (d.code) items.push(['พิมพ์เอกสาร', 'printer', "openViewTab('" + id + "','pdf')", false]);
  items.push(['ทำสำเนาเป็นใบใหม่', 'copy', "dupDoc('" + id + "')", false]);
  if (['draft', 'pending_approval', 'approved'].indexOf(d.status) >= 0) items.push(['ยกเลิกใบนี้', 'x-circle', "openCancelModal('" + id + "')", true]);
  if (d.status === 'posted' && !d.reversal) items.push(['กลับรายการ', 'undo-2', "openReverseModal('" + id + "')", true]);
  const r = e.currentTarget.getBoundingClientRect();
  const menu = document.createElement('div');
  menu.className = 'row-menu'; menu.id = 'row-menu';
  menu.style.top = (r.bottom + 4) + 'px';
  menu.style.left = Math.min(r.left - 160, window.innerWidth - 220) + 'px';
  menu.innerHTML = items.map(function (it) { return '<button type="button" class="' + (it[3] ? 'danger' : '') + '" onclick="closeRowMenu(); ' + it[2] + '"><i data-lucide="' + it[1] + '" class="w-4 h-4"></i><span>' + it[0] + '</span></button>'; }).join('');
  document.getElementById('overlay-root').appendChild(menu);
  renderIcons();
  setTimeout(function () { document.addEventListener('click', closeRowMenu, { once: true }); }, 0);
}
function closeRowMenu() { const m = document.getElementById('row-menu'); if (m) m.remove(); }
function exportCsv() {
  const rows = filtered();
  showToast('ส่งออก ' + rows.length + ' รายการเป็น CSV (mock)', 'success');
}
function toggleUserMenu(e) { e.stopPropagation(); const m = document.getElementById('user-menu'); m.classList.toggle('is-open'); setTimeout(function () { document.addEventListener('click', function () { m.classList.remove('is-open'); }, { once: true }); }, 0); }
</script>

<script>
/* ============================================================
   MASTER COMBOBOX (Rule #94 / #102) — portal ลอย · ↑↓/Enter/Esc · anatomy ล็อกต่อประเภท
   ============================================================ */
const comboState = { key: null, list: [], hi: 0 };
function combo(key, display, ph, compact) {
  const h = compact ? 'height:30px;font-size:12.5px;padding-left:26px;' : 'padding-left:30px;';
  const ic = compact ? 'left:8px;' : 'left:10px;';
  return `<div style="position:relative;"><i data-lucide="search" class="w-3.5 h-3.5" style="position:absolute;${ic}top:50%;transform:translateY(-50%);color:var(--c-mute-3);"></i>` +
    `<input type="text" id="cbi-${key}" autocomplete="off" value="${esc(display)}" placeholder="${esc(ph)}" class="input" style="${h}" ` +
    `onfocus="comboOpen('${key}','')" oninput="comboOpen('${key}', this.value)" onkeydown="comboKey(event,'${key}')"></div>`;
}
function comboItems(key, q) {
  q = (q || '').toLowerCase().trim();
  const hit = function (s) { return !q || String(s).toLowerCase().indexOf(q) >= 0; };
  if (key === 'wh') return WAREHOUSES.filter(function (w) { return hit(w.name + ' ' + w.code); })
    .map(function (w) { return { kind:'place', val:w.code, t:w.name, s:w.code + ' · คลังสินค้า', ico:'warehouse' }; });
  if (key === 'cc') return COST_CENTERS.filter(function (c) { return hit(c.name + ' ' + c.code); })
    .map(function (c) { return { kind:'org', val:c.code, t:c.name, s:c.code + ' · ศูนย์ต้นทุน', ico:'building-2' }; });
  if (key === 'reason' || key.indexOf('lreason:') === 0) {
    let list = REASONS;
    if (key.indexOf('lreason:') === 0) {
      const l = createWizard.data.lines.find(function (x) { return x.id === key.slice(8); });
      const dir = l && l.qty > 0 ? '+' : l && l.qty < 0 ? '-' : null;
      if (dir) list = REASONS.filter(function (r) { return r.dir === dir || r.dir === 'both'; });
    }
    return list.filter(function (r) { return hit(r.name + ' ' + r.code); })
      .map(function (r) { return { kind:'org', val:r.code, t:r.name, s:r.code + ' · ' + (r.dir === '+' ? 'ใช้กับปรับเพิ่ม' : r.dir === '-' ? 'ใช้กับปรับลด' : 'ใช้ได้ทั้งเพิ่มและลด'), ico:'list-checks' }; });
  }
  if (key.indexOf('slot-') === 0) {
    const st = modalState.slots[+key.slice(5)];
    return EMPLOYEES.filter(function (e) { return st.roles.indexOf(e.role) >= 0 && e.name !== ME.name && hit(e.name + ' ' + e.dept + ' ' + e.code); })
      .map(function (e) { return { kind:'person', val:e.name, t:e.name, s:(ROLE_LABEL[e.role] || e.role) + ' · ' + e.dept + ' · ' + e.code, av:e.initials }; });
  }
  if (key.indexOf('item:') === 0) return PRODUCTS.filter(function (p) { return hit(p.code + ' ' + p.name + ' ' + p.cat); })
    .map(function (p) { return { kind:'product', val:p.code, t:p.code + ' · ' + p.cat, s:p.name, right:formatMoney(p.cost) + '/' + p.uom, ico:'package' }; });
  if (key.indexOf('bin:') === 0) {
    const d = createWizard.data;
    const allow = ADJ_TYPES[d.adjType].bins;
    return BINS.filter(function (b) {
      if (b.wh !== d.warehouse) return false;
      if (b.type === 'in-transit') return false;              /* BR-13 — จองให้ Stock Transfer ห้ามโผล่ */
      if (allow.indexOf(b.type) < 0) return false;            /* BR-12 — ประเภทการปรับคุมประเภท bin */
      return hit(b.code + ' ' + b.zoneName);
    }).map(function (b) {
      return { kind:'place', val:b.code, t:b.code, s:'โซน ' + b.zone + ' · ' + b.zoneName + ' · ' + LOC_TYPE[b.type].label + (b.locked ? ' · ' + b.locked : ''), ico:'map-pin', disabled:!!b.locked };
    });
  }
  return [];
}
function comboPick(key, val) {
  if (key === 'wh') setWarehouse(val);
  else if (key === 'cc') { createWizard.data.costCenter = val; renderCreateDrawer(); }
  else if (key === 'reason') { createWizard.data.headerReason = val; createWizard.data.lines.forEach(function (l) { if (!l.reason_code) l.reason_code = val; }); renderCreateDrawer(); }
  else if (key.indexOf('lreason:') === 0) { const l = createWizard.data.lines.find(function (x) { return x.id === key.slice(8); }); if (l) l.reason_code = val; renderCreateDrawer(); }
  else if (key.indexOf('slot-') === 0) { modalState.slots[+key.slice(5)].assignee = val; renderSubmitModal(); }
  else if (key.indexOf('item:') === 0) { applyItemToLine(key.slice(5), val); }
  else if (key.indexOf('bin:') === 0) { applyBinToLine(key.slice(4), val); }
  killCombo();
}
function killCombo() { document.querySelectorAll('.combo-pop').forEach(function (n) { n.remove(); }); comboState.key = null; }
function comboOpen(key, q) {
  killCombo();
  const input = document.getElementById('cbi-' + key);
  if (!input) return;
  comboState.key = key; comboState.list = comboItems(key, q); comboState.hi = 0;
  const pop = document.createElement('div');
  pop.className = 'combo-pop'; pop.id = 'combo-pop';
  document.getElementById('overlay-root').appendChild(pop);
  paintCombo();
  portalMenu(input, pop);
  pop.classList.remove('menu-fixed');
  pop.style.position = 'fixed';
  pop.style.width = Math.max(input.getBoundingClientRect().width, 320) + 'px';
  const close = function (ev) {
    if (!pop.isConnected) { document.removeEventListener('click', close); return; }   /* pop ถูกแทนที่แล้ว — ปล่อยตัวใหม่ทำงาน (#68.1) */
    if (!pop.contains(ev.target) && ev.target !== input) { killCombo(); document.removeEventListener('click', close); }
  };
  setTimeout(function () { document.addEventListener('click', close); }, 0);
}
function paintCombo() {
  const pop = document.getElementById('combo-pop');
  if (!pop) return;
  pop.innerHTML = comboState.list.length ? comboState.list.map(function (it, k) {
    const lead = it.kind === 'person'
      ? `<span class="emp-av" style="width:26px;height:26px;font-size:11px;">${esc(it.av || '')}</span>`
      : `<i data-lucide="${it.ico || 'circle'}" class="w-3.5 h-3.5" style="color:var(--c-mute-3);"></i>`;
    const body = it.kind === 'product'
      ? `<div style="flex:1;min-width:0;"><div class="tbl-mono" style="font-size:11px;color:var(--c-text-mute);">${esc(it.t)}</div><div style="font-size:12.5px;font-weight:600;color:var(--c-navy);">${esc(it.s)}</div></div>`
      : `<div style="flex:1;min-width:0;"><div style="font-size:12.5px;font-weight:600;color:var(--c-navy);">${esc(it.t)}</div><div style="font-size:11px;color:var(--c-text-mute);">${esc(it.s)}</div></div>`;
    const right = it.right ? `<span style="font-size:11px;color:var(--c-text-soft);white-space:nowrap;">${esc(it.right)}</span>` : (it.disabled ? '<span class="pill cancelled">ล็อก</span>' : '');
    return `<button type="button" class="${k === comboState.hi ? 'hi' : ''}" ${it.disabled ? 'disabled' : ''} onmousedown="event.preventDefault()" onclick="comboPick('${comboState.key}','${esc(it.val)}')">${lead}${body}${right}</button>`;
  }).join('') : '<div class="combo-empty">ไม่พบรายการ</div>';
  renderIcons();
}
function comboKey(e, key) {
  if (comboState.key !== key || !document.getElementById('combo-pop')) return;
  if (e.key === 'ArrowDown') { comboState.hi = Math.min(comboState.hi + 1, comboState.list.length - 1); paintCombo(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { comboState.hi = Math.max(comboState.hi - 1, 0); paintCombo(); e.preventDefault(); }
  else if (e.key === 'Enter') { const it = comboState.list[comboState.hi]; if (it && !it.disabled) comboPick(key, it.val); e.preventDefault(); }
  else if (e.key === 'Escape') { killCombo(); e.stopPropagation(); }
}

/* ============================================================
   CREATE / EDIT WIZARD (Pattern Q — 5 steps ชื่อ+ลำดับล็อก)
   ============================================================ */
const createWizard = { step: 1, data: null, editId: null, expandedLineId: null, _over: false, _overMsg: '' };
function blankData() {
  /* ADJ ไม่มีส่วนลดท้ายบิล/คูปอง — โครง endbill.mode คงไว้ตาม B2 v2 contract (ปิดไว้เสมอ) */
  return { adjType: 'general', warehouse: 'WH-BKK-01', effectiveDate: CFG.today, costCenter: 'CC-WH-01',
           headerReason: '', note: '', lines: [], attachments: [], mode: 'correct',
           endbill: { enabled: false, mode: 'percent', value: 0, src: '' }, couponAmt: 0 };
}
function setWarehouse(v) {
  const d = createWizard.data;
  if (d.warehouse !== v && d.lines.some(function (l) { return l.item_code; })) {
    if (!window.confirm('เปลี่ยนคลังจะล้างรายการที่เลือกไว้ ' + d.lines.filter(function (l) { return l.item_code; }).length + ' รายการ — ดำเนินการต่อ?')) { renderCreateDrawer(); return; }
    d.lines = [createBlankLine()];
  }
  d.warehouse = v;
  d.costCenter = v === 'WH-CNX-01' ? 'CC-WH-02' : 'CC-WH-01';
  renderCreateDrawer();
}
function setAdjType(t) {
  const d = createWizard.data;
  if (d.adjType !== t && d.lines.some(function (l) { return l.bin; })) { d.lines = [createBlankLine()]; }
  d.adjType = t;
  renderCreateDrawer();
}
function openCreateDrawer(editId) {
  createWizard.step = 1; createWizard.expandedLineId = null; createWizard.editId = editId || null;
  if (editId) {
    const s = findDoc(editId);
    if (!s || s.status !== 'draft') { showToast('แก้ไขได้เฉพาะฉบับร่าง', 'warning'); navigate('view/' + editId); return; }
    createWizard.data = Object.assign(blankData(), {
      adjType: s.adjType, warehouse: s.warehouse, effectiveDate: s.effectiveDate, costCenter: s.costCenter,
      headerReason: s.headerReason, note: s.note,
      lines: s.lines.map(function (l) { return Object.assign({}, l); }),
      attachments: s.attachments.slice()
    });
    createWizard.step = 2;
  } else { createWizard.data = blankData(); }
  const overlay = document.getElementById('overlay-root');
  overlay.innerHTML = '<div class="overlay-wrap"><div class="backdrop" onclick="closeCreateDrawer()"></div>' +
    '<div id="create-drawer" class="drawer-panel wide drawer-enter"><div id="create-drawer-content" style="display:flex;flex-direction:column;height:100%;"></div></div></div>';
  requestAnimationFrame(function () { const el = document.getElementById('create-drawer'); if (el) { el.classList.remove('drawer-enter'); el.classList.add('drawer-active'); } });
  renderCreateDrawer();
}
function closeCreateDrawer() {
  killCombo();
  const d = document.getElementById('create-drawer');
  if (d) { d.classList.remove('drawer-active'); d.classList.add('drawer-enter'); }
  setTimeout(function () {
    document.getElementById('overlay-root').innerHTML = '';
    const r = getRoute();
    if (r.name === 'create') navigate('list');
    if (r.name === 'edit') navigate('view/' + r.id);
  }, 200);
}
function renderStepperItem(n, label) {
  const step = createWizard.step;
  const cls = step === n ? 'active' : step > n ? 'done' : '';
  return `<div class="stepper-item ${cls}" ${step > n ? `onclick="createWizard.step=${n}; renderCreateDrawer();" style="cursor:pointer;"` : ''}><div class="stepper-circle">${step > n ? '<i data-lucide="check" class="w-4 h-4"></i>' : n}</div><div class="stepper-label">${label}</div></div>`;
}
const STEPH = function (ico, title, hint) {
  return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:${hint ? '6px' : '16px'};"><i data-lucide="${ico}" class="w-4 h-4" style="color:var(--c-text-mute);"></i><div style="font-size:13px;font-weight:600;color:var(--c-navy);">${title}</div></div>` +
    (hint ? `<div style="font-size:12px;margin-bottom:16px;margin-left:24px;color:var(--c-text-mute);">${hint}</div>` : '');
};
function renderCreateDrawer() {
  const c = document.getElementById('create-drawer-content');
  if (!c) return;
  const step = createWizard.step, isEdit = !!createWizard.editId;
  c.innerHTML = `
    <div style="padding:18px 24px 16px;border-bottom:1px solid var(--c-border-soft);flex-shrink:0;">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;">
        <div>
          <div style="display:flex;align-items:center;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:var(--c-text-mute);margin-bottom:4px;"><i data-lucide="${isEdit ? 'pencil' : 'file-plus'}" class="w-3.5 h-3.5"></i> ${isEdit ? 'แก้ไขเอกสาร' : 'สร้างเอกสารใหม่'}</div>
          <h2 style="font-size:20px;font-weight:700;color:var(--c-navy);margin:0;">${isEdit ? 'แก้ไขใบปรับยอด ' + (findDoc(createWizard.editId).code || '(ร่าง)') : 'สร้างใบปรับยอดสต๊อกใหม่'}</h2>
        </div>
        <button type="button" onclick="closeCreateDrawer()" class="top-icon-btn"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="stepper" style="margin-top:18px;">${renderStepperItem(1, 'เลือกแหล่งที่มา')}${renderStepperItem(2, 'ข้อมูลหลักใบปรับยอด')}${renderStepperItem(3, 'รายการสินค้า')}${renderStepperItem(4, 'เอกสารแนบ')}${renderStepperItem(5, 'ตรวจสอบและยืนยัน')}</div>
    </div>
    <div style="flex:1;overflow-y:auto;padding:20px 24px;scrollbar-gutter:stable;" class="drawer-body">${step === 1 ? renderStep1() : ''}${step === 2 ? renderStep2() : ''}${step === 3 ? renderStep3() : ''}${step === 4 ? renderStep4() : ''}${step === 5 ? renderStep5() : ''}</div>
    <div style="padding:16px 24px;border-top:1px solid var(--c-border-soft);background:var(--c-off-white);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:8px;">
      <div>${step > 1 ? '<button type="button" onclick="wizardBack()" class="btn btn-secondary"><i data-lucide="arrow-left" class="w-4 h-4"></i><span>กลับ</span></button>' : ''}</div>
      <div style="display:flex;align-items:center;gap:8px;">

function renderSignTab(s) {

    (s.submittedBy ? `<div class="tl-i ok"><div class="tl-t">ส่งอนุมัติ</div><div class="tl-s">${esc(s.submittedBy)} · ${fdt(s.submittedAt)}</div></div>` : '') +
    steps.map(function (st, i) {
      const k = st.status === 'approved' ? 'ok' : st.status === 'rejected' ? 'bad' : st === cur ? 'warn' : '';
      const who = st.assignee || st.by;
      return `<div class="tl-i ${k}"><div class="tl-t">ขั้น ${i + 1} — ${st.roles.map(function (x) { return ROLE_LABEL[x] || x; }).join('/')}</div>
        <div class="tl-s" style="margin-top:6px;">${empChip(who, st.roles[0], true)}</div>
        <div class="tl-s">${st.status === 'approved' ? 'อนุมัติแล้ว · ' + fdt(st.at) : st.status === 'rejected' ? 'ไม่อนุมัติ · ' + fdt(st.at) : st.status === 'preview' ? 'ยังไม่ส่งอนุมัติ' : 'รอดำเนินการ'}</div>
        ${st.note ? `<div class="tl-q">${esc(st.note)}</div>` : ''}
        ${st === cur && act ? `<div style="margin-top:8px;display:flex;gap:8px;"><button type="button" class="btn btn-link danger sm" onclick="openRejectModal('${s.id}')">ไม่อนุมัติ</button><button type="button" class="btn btn-success sm" onclick="openApproveModal('${s.id}')"><i data-lucide="check" class="w-3.5 h-3.5"></i><span>อนุมัติ</span></button></div>` : ''}
      </div>`;
    }).join('') +
    (s.status === 'posted' || s.status === 'reversed' ? `<div class="tl-i ok"><div class="tl-t">ผ่านรายการ</div><div class="tl-s">${esc(s.postedBy)} · ${fdt(s.postedAt)}</div></div>` : '') +
    '</div>' +
    (s.approval_history.length ? SECWRAP(SEC('rotate-ccw', 'ประวัติการส่งอนุมัติรอบก่อน') + s.approval_history.map(function (h) { return `<div class="note" style="margin-bottom:8px;"><i data-lucide="undo-2" class="w-4 h-4"></i><div>ส่งโดย ${esc(h.submittedBy)} · ${fdt(h.submittedAt)} — ผล: ${h.result === 'rejected' ? 'ไม่อนุมัติ (ตีกลับเป็นร่าง)' : esc(h.result)}</div></div>`; }).join('')) : '');
}
function renderHistoryTab(s) {
  return SEC('history', 'ประวัติ (append-only)') + '<div class="tl">' + s.audit.map(function (a) {
    const k = /อนุมัติขั้น|ผ่านรายการ/.test(a.act) && !/ไม่อนุมัติ/.test(a.act) ? 'ok' : /ส่งอนุมัติ|แนบหลักฐาน/.test(a.act) ? 'warn' : /ไม่อนุมัติ|ยกเลิก|กลับรายการ/.test(a.act) ? 'bad' : '';
    return `<div class="tl-i ${k}"><div class="tl-t">${esc(a.act)}</div><div class="tl-s">${esc(a.by)} · ${fdt(a.at)}</div>${a.note ? `<div class="tl-q">${esc(a.note)}</div>` : ''}</div>`;
  }).join('') + '</div>' +
  '<div class="note" style="margin-top:12px;"><i data-lucide="lock" class="w-4 h-4"></i><div>ประวัติเป็นแบบ append-only — ลบหรือแก้ไม่ได้ทุกกรณี</div></div>';
}
</script>

<script>
/* ============================================================

const modalState = { id: null, slots: [], err: false };

        <p style="font-size:13px;margin:4px 0 0;color:var(--c-text-mute);">${esc((WH_BY[s.warehouse] || {}).name || '')} · ${ADJ_TYPES[s.adjType].label} · ${s.lines.length} รายการ · <strong>มูลค่าที่ปรับ ${formatMoney(abs)} บาท</strong> (สุทธิ ${signedMoney(net)})</p></div>
    </div>
    <div style="padding:18px;max-height:52vh;overflow-y:auto;">
      <div style="font-size:12.5px;font-weight:700;color:var(--c-navy);margin-bottom:4px;">สายอนุมัติ (${MOCK_DOA_ENTRY.doa_entry_ref} · ผูกมูลค่า) — เลือกผู้อนุมัติแต่ละขั้น <span class="req">*</span></div>
      <div style="font-size:12px;color:var(--c-text-mute);margin-bottom:12px;">DOA กำหนด “ตำแหน่ง” ต่อขั้นจาก${esc(resolveDoa(s).why[0])} · ผู้ส่งเลือก “คน” ที่ถือตำแหน่งนั้น · อนุมัติตามลำดับ 1 → ${sl.length}</div>

          <div>${st.assignee

            : combo('slot-' + i, '', 'ค้นหาชื่อคนในตำแหน่ง ' + st.roles.map(function (x) { return ROLE_LABEL[x] || x; }).join('/') + '…')}
            ${modalState.err && !st.assignee ? '<div style="font-size:11px;color:var(--c-danger);margin-top:4px;">เลือกผู้อนุมัติขั้นนี้</div>' : ''}</div></div>`;
      }).join('')}
      <div class="note" style="margin-top:12px;"><i data-lucide="info" class="w-4 h-4"></i><div>เมื่ออนุมัติครบทุกขั้น ใบจะพร้อม <strong>ผ่านรายการ</strong> — สต๊อกยังไม่ขยับจนกว่าจะกดผ่านรายการ · แจ้งผู้อนุมัติผ่าน ENG-NOTIFY</div></div>

function confirmSubmit() {

  pushAudit(s, 'ส่งอนุมัติ · ' + s.approval_chain.map(function (st, i) { return (i + 1) + ') ' + st.assignee + ' (' + (ROLE_LABEL[st.roles[0]] || st.roles[0]) + ')'; }).join(' → '), res.why.join(' · '));

  }, 400);
}
function openApproveModal(id) {
  const s = findDoc(id), cur = currentStep(s), chain = chainOf(s);
  const last = chain.filter(function (st) { return st.status === 'pending'; }).length <= 1;
  modalShell(`<div class="card" style="position:relative;max-width:640px;width:100%;box-shadow:var(--sh-xl);">
    <div style="padding:18px;border-bottom:1px solid var(--c-border-soft);display:flex;align-items:flex-start;gap:12px;">
      <div style="width:40px;height:40px;border-radius:50%;background:var(--c-success-08);display:grid;place-items:center;flex-shrink:0;"><i data-lucide="check" class="w-5 h-5" style="color:var(--c-success);"></i></div>
      <div><h3 style="font-size:14px;font-weight:700;color:var(--c-navy);margin:0;">อนุมัติ ${esc(s.code)} — ขั้น ${chain.indexOf(cur) + 1}/${chain.length}</h3>
      <p style="font-size:13px;margin:4px 0 0;color:var(--c-text-mute);">${esc((WH_BY[s.warehouse] || {}).name || '')} · ${s.lines.length} รายการ · มูลค่าที่ปรับ <strong>${formatMoney(absTotal(s))} บาท</strong> (สุทธิ ${signedMoney(netTotal(s))})</p></div>
    </div>
    <div style="padding:18px;">
      <div style="display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px;">${chain.map(function (st) { return `<div style="opacity:${st === cur ? 1 : .55};">${empChip(st.by || st.assignee, st.roles[0], true)}</div>`; }).join('')}</div>
      <label class="lbl" style="margin-bottom:6px;">หมายเหตุ (ไม่บังคับ)</label><input id="md-note" class="input" placeholder="เช่น ตรวจกับหลักฐานแนบแล้วตรง">
      <div class="note ok" style="margin-top:12px;"><i data-lucide="check-circle-2" class="w-4 h-4"></i><div>${last ? 'ขั้นสุดท้าย — อนุมัติแล้วใบจะพร้อมผ่านรายการ (สต๊อกยังไม่ขยับ)' : 'ยังมีขั้นถัดไป — ส่งต่อผ่านกล่องรออนุมัติ'}</div></div>
    </div>
    <div style="padding:12px 18px;background:var(--c-off-white);border-top:1px solid var(--c-border-soft);display:flex;align-items:center;justify-content:flex-end;gap:8px;border-radius:0 0 var(--r-lg) var(--r-lg);">
      <button type="button" onclick="closeModal()" class="btn btn-ghost">ยกเลิก</button>

}
function confirmApprove(id) {
  const s = findDoc(id), cur = currentStep(s);
  if (!canActStep(s)) return showToast('ไม่ใช่ผู้มีสิทธิ์ในขั้นปัจจุบัน', 'warning');

function reasonModal(title, icon, iconColor, iconBg, desc, extra, submitLabel, submitCls, onOk) {
  modalShell(`<div class="card" style="position:relative;max-width:560px;width:100%;box-shadow:var(--sh-xl);">
    <div style="padding:18px;border-bottom:1px solid var(--c-border-soft);display:flex;align-items:flex-start;gap:12px;">
      <div style="width:40px;height:40px;border-radius:50%;background:${iconBg};display:grid;place-items:center;flex-shrink:0;"><i data-lucide="${icon}" class="w-5 h-5" style="color:${iconColor};"></i></div>
      <div><h3 style="font-size:14px;font-weight:700;color:var(--c-navy);margin:0;">${title}</h3><p style="font-size:13px;margin:4px 0 0;color:var(--c-text-mute);">${desc}</p></div></div>
    <div style="padding:18px;">${extra || ''}<label class="lbl" style="margin-bottom:6px;">เหตุผล <span class="req">*</span></label>

      <button type="button" onclick="closeModal()" class="btn btn-ghost">ปิด</button>

  document.getElementById('md-ok').onclick = function () {

function selectHtml(id, list) { return `<label class="lbl" style="margin-bottom:6px;">ประเภทเหตุผล</label><select id="${id}" class="select" style="margin-bottom:12px;">${list.map(function (x) { return '<option>' + x + '</option>'; }).join('')}</select>`; }
function openRejectModal(id) {
  const s = findDoc(id);
  reasonModal('ไม่อนุมัติ ' + esc(s.code) + ' — ตีกลับเป็นร่าง', 'undo-2', 'var(--c-danger)', 'var(--c-danger-08)',
    'เอกสารจะกลับเป็นฉบับร่างให้ผู้ส่งแก้ไขแล้วส่งใหม่ · ประวัติเก็บแบบ append-only', '', 'ไม่อนุมัติ', 'btn-danger', function (r) {

      if (getRoute().name === 'view') renderViewDrawer(); else render();

function openPostModal(id) {

  if (s.status !== 'approved') return showToast('ผ่านรายการได้เฉพาะใบที่อนุมัติครบแล้ว', 'warning');
  const drift = qtyDrift(s);
  const driftHtml = drift.length
    ? `<div class="note warn" style="margin-bottom:12px;"><i data-lucide="refresh-cw" class="w-4 h-4"></i><div><strong>ยอดระบบเปลี่ยนหลังสร้างรายการ ${drift.length} บรรทัด</strong><div style="margin-top:4px;">${drift.map(function (x) { return esc(x.item_name) + ' ที่ ' + esc(x.bin) + ': ' + fmi(x.snap) + ' → <strong>' + fmi(x.now) + '</strong>'; }).join('<br>')}</div><div style="margin-top:6px;">เลือก “คิดจากยอดล่าสุด” เพื่อคำนวณผลต่างใหม่ หรือกลับไปตีกลับให้ผู้ทำแก้</div></div></div>
       <label class="lbl" style="margin-bottom:6px;">ฐานที่ใช้ผ่านรายการ</label><select id="md-base" class="select" style="margin-bottom:12px;"><option value="snap">คิดจากยอดที่บันทึกไว้ตอนสร้าง</option><option value="latest">คิดจากยอดล่าสุด (คำนวณผลต่างใหม่)</option></select>`
    : '';
  modalShell(`<div class="card" style="position:relative;max-width:640px;width:100%;box-shadow:var(--sh-xl);">
    <div style="padding:18px;border-bottom:1px solid var(--c-border-soft);display:flex;align-items:flex-start;gap:12px;">
      <div style="width:40px;height:40px;border-radius:50%;background:var(--c-blue-08);display:grid;place-items:center;flex-shrink:0;"><i data-lucide="check-circle-2" class="w-5 h-5" style="color:var(--c-blue);"></i></div>
      <div><h3 style="font-size:14px;font-weight:700;color:var(--c-navy);margin:0;">ผ่านรายการ ${esc(s.code)}</h3><p style="font-size:13px;margin:4px 0 0;color:var(--c-text-mute);">สร้างรายการเคลื่อนไหว ${s.lines.length} รายการ · มูลค่าที่ปรับ ${formatMoney(absTotal(s))} บาท — ทำแล้วย้อนกลับได้ด้วยการกลับรายการเท่านั้น</p></div></div>
    <div style="padding:18px;max-height:50vh;overflow-y:auto;">${driftHtml}${previewBalance(s)}
      <div class="note" style="margin-top:12px;"><i data-lucide="info" class="w-4 h-4"></i><div>รายการเคลื่อนไหวเป็น append-only · การลงบัญชีจริงจะทำโดยระบบบัญชี (FWD-WIRE: JE posting)</div></div></div>
    <div style="padding:12px 18px;background:var(--c-off-white);border-top:1px solid var(--c-border-soft);display:flex;align-items:center;justify-content:flex-end;gap:8px;border-radius:0 0 var(--r-lg) var(--r-lg);">
      <button type="button" onclick="closeModal()" class="btn btn-ghost">ยกเลิก</button>
      <button type="button" id="btn-post" onclick="confirmPost('${id}')" class="btn btn-primary"><i data-lucide="check-circle-2" class="w-4 h-4"></i><span>ยืนยันผ่านรายการ</span></button></div></div>`);
}
function confirmPost(id) {
  const s = findDoc(id);
  const base = (document.getElementById('md-base') || {}).value || 'snap';
  const btn = document.getElementById('btn-post');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i data-lucide="loader-2" class="w-4 h-4 spin"></i><span>กำลังบันทึก…</span>'; renderIcons(); }
  if (base === 'latest') {
    s.lines.forEach(function (l) { if (l.item_code && l.bin) { l.system_qty = stockOf(l.bin, l.item_code); migrateLine(l); } });
    pushAudit(s, 'คิดผลต่างใหม่จากยอดล่าสุดก่อนผ่านรายการ');
  }
  s.movements = s.lines.filter(function (l) { return l.item_code; }).map(function (l, i) { return mkMovement(s, l, i, false); });
  s.lines.forEach(function (l) { if (l.item_code && l.bin) { STOCK[l.bin + '|' + l.item_code] = stockOf(l.bin, l.item_code) + l.qty; } });
  s.status = 'posted'; s.postedBy = ME.name; s.postedAt = nowIso();
  /* FWD-WIRE: ENG-CSQ emit (adj_posted_increase / adj_posted_decrease) · FWD-WIRE: ENG-NOTIFY emit (adj_posted) */
  pushAudit(s, 'ผ่านรายการ · สร้างรายการเคลื่อนไหว ' + s.movements.length + ' รายการ (append-only) · รอลงบัญชี');
  setTimeout(function () {
    closeModal();
    showToast('ผ่านรายการ ' + s.code + ' แล้ว — สต๊อกขยับ ' + s.movements.length + ' รายการ · รอลงบัญชี', 'success');
    if (getRoute().name === 'view') { viewState.tab = 'stock'; renderViewDrawer(); } else render();
  }, 500);
}
function openReverseModal(id) {
  const s = findDoc(id);
  if (s.status !== 'posted' || s.reversal) return showToast('กลับรายการได้เฉพาะใบที่ผ่านรายการและยังไม่เคยกลับรายการ', 'warning');
  reasonModal('กลับรายการ ' + esc(s.code), 'undo-2', 'var(--c-danger)', 'var(--c-danger-08)',
    'ระบบจะสร้างใบกลับรายการใบใหม่ที่มีรายการเคลื่อนไหวทิศตรงข้าม — รายการเดิมยังอยู่ ลบไม่ได้ (append-only)', selectHtml('md-rsel', REVERSE_REASONS), 'ยืนยันกลับรายการ', 'btn-danger', function (r) {
      const rs = (document.getElementById('md-rsel') || {}).value || '';
      const code = nextCode();
      const rev = mkDoc({
        code: code, id: code, status: 'posted', adjType: s.adjType, warehouse: s.warehouse, effectiveDate: CFG.today,
        costCenter: s.costCenter, headerReason: s.headerReason, note: 'ใบกลับรายการของ ' + s.code + ' — ' + rs,
        lines: s.lines.filter(function (l) { return l.item_code; }).map(function (l) {
          const nl = Object.assign({}, l, { id: 'L' + Date.now() + Math.random().toString(36).slice(2, 5) });
          nl.system_qty = stockOf(l.bin, l.item_code);
          nl.correct_qty = nl.system_qty - l.qty;
          migrateLine(nl);
          return nl;
        }),
        reversalOf: s.code, submittedBy: ME.name, submittedAt: nowIso(),
        approval_chain: null, approval_status: 'approved', doa_entry_ref: MOCK_DOA_ENTRY.doa_entry_ref,
        approvedBy: ME.name, approvedAt: nowIso(), postedBy: ME.name, postedAt: nowIso(),
        createdBy: ME.name, createdAt: nowIso(), updatedBy: ME.name, updatedAt: nowIso()
      });
      rev.audit = [aud('สร้างใบกลับรายการจาก ' + s.code, ME.name, nowIso(), rs + ' — ' + r), aud('ผ่านรายการ (กลับรายการ)', ME.name, nowIso())];
      rev.movements = rev.lines.map(function (l, i) { return mkMovement(rev, l, i, false); });
      rev.lines.forEach(function (l) { STOCK[l.bin + '|' + l.item_code] = stockOf(l.bin, l.item_code) + l.qty; });
      DOCS.unshift(rev);
      s.status = 'reversed';
      s.reversal = { by: ME.name, at: nowIso(), reason: rs, note: r, doc: code };
      pushAudit(s, 'กลับรายการ → ' + code, rs + ' — ' + r);
      closeModal();
      showToast('กลับรายการแล้ว — ใบใหม่ ' + code + ' (รายการเคลื่อนไหวทิศตรงข้าม)', 'success');
      navigate('view/' + code);
    });
}

/* ============================================================
   ROUTER + BOOT
   ============================================================ */
function getRoute() {
  const h = location.hash.replace(/^#\/?/, '');
  if (!h) return { name: 'list' };
  const p = h.split('/');
  if (p[0] === 'view' && p[1]) return { name: 'view', id: decodeURIComponent(p[1]) };
  if (p[0] === 'edit' && p[1]) return { name: 'edit', id: decodeURIComponent(p[1]) };
  if (p[0] === 'create') return { name: 'create' };
  return { name: 'list' };
}
function navigate(r) { location.hash = '#/' + r; }
function syncOverlay() {
  const r = getRoute(), root = document.getElementById('overlay-root');
  if (r.name === 'view') {
    if (!findDoc(r.id)) { showToast('ไม่พบเอกสาร ' + r.id, 'warning'); navigate('list'); return; }
    if (viewState.recordId !== r.id || !document.getElementById('view-drawer')) openViewDrawer(r.id);
  } else if (r.name === 'create') {
    if (!document.getElementById('create-drawer')) openCreateDrawer(null);
  } else if (r.name === 'edit') {
    if (!document.getElementById('create-drawer')) openCreateDrawer(r.id);
  } else if (root && !document.getElementById('row-menu')) {
    root.innerHTML = '';
    viewState.recordId = null;
  }
}
function render() {
  const snap = preserveRenderState();
  const el = document.getElementById('page');
  if (el) el.innerHTML = renderListPage();
  const me = document.getElementById('me-name'), mr = document.getElementById('me-role'), ma = document.getElementById('me-avatar');
  if (me) me.textContent = ME.name;
  if (mr) mr.textContent = (ROLE_LABEL[ME.role] || '') + ' · CUBE NATIVE';
  if (ma) ma.textContent = ME.initials;
  renderIcons();
  restoreRenderState(snap);
  syncOverlay();
}
/* Esc chain: combobox → modal → drawer (Rule #15 / #68) */
window.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (document.getElementById('combo-pop')) { killCombo(); return; }
  if (document.querySelector('.modal-overlay')) { closeModal(); return; }
  if (document.getElementById('create-drawer')) { closeCreateDrawer(); return; }
  if (document.getElementById('view-drawer')) { closeViewDrawer(); return; }
});
</script>
