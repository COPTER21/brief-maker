<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เบิกค่าใช้จ่าย (Expense Claim) · CUBE NATIVE</title>

<!-- Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@300,400,500,700,900&display=swap" rel="stylesheet">

<!-- Lucide Icons: loader ที่ท้าย body (ดู section "Lucide loader" ก่อน main <script>) -->
<!-- เหตุผล:
     1) ย้ายมาท้าย body หลีกเลี่ยง race กับ DOMContentLoaded
     2) Multi-CDN fallback (unpkg → jsdelivr → cdnjs)
     3) Pin version (เลิกใช้ @latest ที่ flaky — GitHub issue #2962)
-->

<style>
/* ===== BASE-KIT v6.4 — DO NOT EDIT (Rule #69) — page CSS ต่อท้ายหลัง END marker ===== */
/* ============== CSS VARIABLES (CUBE CI — v2.0 Warm Light rebrand) ============== */
:root {
  --c-navy: #111111;
  --c-navy-2: #111111;
  --c-primary: #FF3B30;
  --c-primary-hover: #E62E24;
  --c-teal: #FF9A1F;
  --c-teal-light: #FFB763;
  --c-ink: #111111;
  --c-mute: #54565C;
  --c-mute-2: #73757B;
  --c-mute-3: #9A9CA2;
  --c-line: #DEDAD4;
  --c-line-2: #E9E5E0;
  --c-line-3: #F1EEEA;
  --c-bg-off: #FAF8F5;
  --c-success: #1F9D55;
  --c-warning: #E8870F;
  --c-danger: #E62E24;
  --sidebar-w: 232px;
  --shell-h: 52px;
  /* v3.13 — Fixed type scale (Iron Rule locked values) */
  --fs-h1: 22px;        /* page title */
  --fs-h2: 17px;        /* section title */
  --fs-h3: 15px;        /* card / drawer title */
  --fs-body: 14px;      /* body default */
  --fs-sub: 13px;       /* secondary body / table cell */
  --fs-meta: 12px;      /* meta / label */
  --fs-cap: 11px;       /* uppercase section caption */
  --fs-kpi: 28px;       /* stat value */
  /* v3.13 — Fixed spacing scale */
  --sp-xs: 4px; --sp-sm: 8px; --sp-md: 12px; --sp-lg: 20px; --sp-xl: 28px;
  /* v3.13 — Fixed radius scale */
  --r-xs: 4px; --r-sm: 6px; --r-md: 8px; --r-lg: 12px; --r-full: 999px;
}

/* ============== RESET ============== */
* { box-sizing: border-box; }
html, body { margin:0; padding:0; }
/* Rule #35 — Layout Stability: จองพื้นที่ scrollbar ไว้เสมอ → เปิด modal/drawer หรือ
   content โตขึ้นแล้ว scrollbar โผล่/หาย จะไม่ทำให้หน้าจอขยับซ้าย-ขวา (jank) */
html { scrollbar-gutter: stable; }

/* ============== SCROLLBAR (Iron Rule #49 — minimal, ห้าม default) ============== */
/* เส้นบางมาก 5px · track โปร่งใส · พื้นเข้ม (sidebar/panel) = ขาวโปร่ง · พื้นสว่าง = charcoal จาง */
* { scrollbar-width: thin; scrollbar-color: rgba(17,17,17,.16) transparent; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-corner { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(17,17,17,.14); border-radius: 99px; }
::-webkit-scrollbar-thumb:hover { background: rgba(17,17,17,.26); }
.sidebar, .slide { scrollbar-color: rgba(255,255,255,.28) transparent; }
.sidebar ::-webkit-scrollbar-thumb, .slide ::-webkit-scrollbar-thumb,
.sidebar::-webkit-scrollbar-thumb, .slide::-webkit-scrollbar-thumb { background: rgba(255,255,255,.28); }
.sidebar ::-webkit-scrollbar-thumb:hover, .slide ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.42); }
body {
  font-family: 'Satoshi', 'Noto Sans Thai', system-ui, sans-serif;
  background: var(--c-bg-off);
  color: var(--c-ink);
  font-size:14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  /* v7.1 Rule #97: desktop-base + adaptive — 768-1180 ปรับ layout ผ่าน media query,
     <768 = horizontal scroll (ไม่ guarantee) */
  min-width: 768px;
}
a { text-decoration: none; color: inherit; }
button { font-family: inherit; cursor: pointer; }
[data-lucide] { flex-shrink: 0; }

/* Hide number input spinner globally (Iron Rule #19) */
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin:0; }
input[type="number"] { -moz-appearance: textfield; }

/* ============== SIDEBAR ============== */
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: var(--sidebar-w);
  background: #111111;
  color: #E9E5E0;
  z-index:var(--z-shell);
  display: flex;
  flex-direction: column;
  border-right: 1px solid rgba(255,255,255,0.06);
}
.sb-brand {
  padding:18px;
  display: flex;
  align-items: center;
  gap:12px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  flex-shrink: 0;
}
.sb-logo {
  width: 34px; height: 34px;
  background: linear-gradient(135deg, #FF3B30, #FF9A1F);
  border-radius: 9px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  flex-shrink: 0;
  box-shadow: 0 4px 12px rgba(255,59,48,0.3);
}
.sb-name { font-weight: 700; font-size:14px; color: #fff; letter-spacing: -0.01em; line-height: 1.2; }
.sb-sub { font-size:11px; color: #9A9CA2; letter-spacing: 0.06em; font-weight: 600; text-transform: uppercase; margin-top:2px; }
.sb-nav { flex: 1; padding:12px 8px; overflow-y: auto; }

/* Module = collapsible group (Iron Rule #27).
   Header toggles expand/collapse only — NOT navigable.
   Children = .sb-features (clickable feature items). */
.sb-module { margin-bottom:4px; }
.sb-module-header {
  display: flex; align-items: center; gap:8px;
  width: 100%;
  padding:8px 10px;
  border-radius: 6px;
  background: transparent; border: 0;
  color: #9A9CA2;
  font-family: inherit;
  font-size:11px; font-weight: 700;
  letter-spacing: 0.08em; text-transform: uppercase;
  cursor: pointer; transition: all 120ms;
  text-align: left;
}
.sb-module-header:hover { background: rgba(255,255,255,0.04); color: #DEDAD4; }
.sb-module-header .mod-icon { flex-shrink: 0; opacity: 0.7; }
.sb-module-header .mod-label { flex: 1; }
.sb-module-header .mod-chevron {
  flex-shrink: 0;
  transition: transform 200ms;
  opacity: 0.7;
}
.sb-module[data-expanded="false"] .mod-chevron { transform: rotate(-90deg); }
.sb-module[data-expanded="false"] .sb-features { display: none; }

.sb-features { padding:2px 0 6px 0; }

.sb-item {
  display: flex; align-items: center; gap:10px;
  padding:8px 12px 8px 16px;
  border-radius: 6px;
  color: #DEDAD4;
  font-size:13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 120ms;
  margin-bottom:1px;
  position: relative;
  user-select: none;
}
.sb-item:hover { background: rgba(255,255,255,0.05); color: #fff; }
.sb-item.is-active {
  background: #FF3B30;
  color: #fff;
  font-weight: 600;
}
.sb-item.is-active::before {
  content: '';
  position: absolute;
  left: -10px; top: 7px; bottom: 7px;
  width: 3px;
  background: #fff;
  border-radius: 0 2px 2px 0;
}
.sb-item [data-lucide] { width: 16px; height: 16px; opacity: 0.85; }
.sb-item.is-active [data-lucide] { opacity: 1; }
.sb-badge {
  margin-left:auto;
  font-size:11px;
  font-weight: 600;
  background: rgba(255,255,255,0.10);
  color: #9A9CA2;
  padding:2px 8px;
  border-radius: 999px;
}
.sb-item.is-active .sb-badge { background: rgba(255,255,255,0.18); color: #fff; }
.sb-item.is-disabled { opacity: 0.4; cursor: not-allowed; }
.sb-item.is-disabled:hover { background: transparent; color: #DEDAD4; }
.sb-footer {
  padding:12px 16px;
  border-top: 1px solid rgba(255,255,255,0.06);
  display: flex;
  align-items: center;
  gap:8px;
  font-size:12px;
  color: #9A9CA2;
}
.pulse-dot {
  width: 7px; height: 7px;
  background: var(--c-teal);
  border-radius: 50%;
  box-shadow: 0 0 0 3px rgba(255,154,31,0.20);
  animation: pulse 2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.6; }
}

/* ============== MAIN ============== */
.main {
  margin-left:var(--sidebar-w);
  min-height: 100vh;
  background: var(--c-bg-off);
}

/* ============== SHELL BAR ============== */
.shell-bar {
  position: sticky;
  top: 0;
  background: #fff;
  border-bottom: 1px solid var(--c-line-2);
  height: var(--shell-h);
  display: flex;
  align-items: center;
  padding:0 24px;
  z-index:var(--z-sticky);
  gap:12px;
}
.breadcrumb {
  display: flex;
  align-items: center;
  gap:8px;
  font-size:13px;
  color: var(--c-mute);
}
.breadcrumb a { cursor: pointer; transition: color 120ms; }
.breadcrumb a:hover { color: var(--c-primary); }
.breadcrumb .sep { color: var(--c-mute-3); font-size:11px; }
.breadcrumb-current { color: var(--c-ink); font-weight: 500; }
.icon-btn {
  width: 34px; height: 34px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 0;
  color: var(--c-mute);
  border-radius: 7px;
  position: relative;
  transition: all 120ms;
}
.icon-btn:hover { background: var(--c-line-3); color: var(--c-ink); }
.icon-btn [data-lucide] { width: 17px; height: 17px; }
.notif-dot {
  position: absolute;
  top: 7px; right: 8px;
  width: 7px; height: 7px;
  background: var(--c-danger);
  border-radius: 50%;
  border: 2px solid #fff;
}
.user-chip {
  display: flex;
  align-items: center;
  gap:10px;
  padding:6px 10px 6px 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 120ms;
}
.user-chip:hover { background: var(--c-line-3); }
.user-text { line-height: 1.2; text-align: right; }
.user-name { font-size:12.5px; font-weight: 500; color: var(--c-ink); white-space: nowrap; }
.user-role { font-size:11px; color: var(--c-mute-2); white-space: nowrap; margin-top:1px; }
.avatar {
  width: 30px; height: 30px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--c-primary), var(--c-teal));
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size:12px;
  font-weight: 600;
  flex-shrink: 0;
}

/* User dropdown menu */
.user-menu {
  position: absolute;
  top: calc(var(--shell-h) - 4px);
  right: 22px;
  background: #fff;
  border: 1px solid var(--c-line-2);
  border-radius: 10px;
  box-shadow: 0 12px 32px rgba(17,17,17,0.12);
  width: 240px;
  z-index:var(--z-dropdown);
  padding:6px;
  display: none;
}
.user-menu.is-open { display: block; }
.user-menu-item {
  display: flex;
  align-items: center;
  gap:10px;
  padding:8px 12px;
  border-radius: 6px;
  font-size:13px;
  color: var(--c-ink);
  cursor: pointer;
  transition: background 120ms;
}
.user-menu-item:hover { background: var(--c-bg-off); }
.user-menu-item [data-lucide] { width: 15px; height: 15px; color: var(--c-mute-2); }
.user-menu-item.is-danger { color: var(--c-danger); }
.user-menu-item.is-danger [data-lucide] { color: var(--c-danger); }
.user-menu-divider { height: 1px; background: var(--c-line-2); margin:6px 0; }

/* ============== CONTENT ============== */
/* Fluid full-width — content stretches to fill viewport (Iron Rule #30).
   Do NOT add max-width here; component-level constraints (modal/toast/wizard
   internal cards) are responsible for their own readability bounds. */
.content {
  padding:24px;
}

/* ============== v7.1 RESPONSIVE — Rule #97 (desktop-base adaptive) ============== */
.nav-toggle { display:none; }
@media (max-width: 1180px){
  .content { padding:16px; }
  .drawer { width: min(920px, 100vw); }
  .drawer.standard { width: min(680px, 100vw); }
  .drawer.wide, .drawer-panel.wide { width: min(1290px, 100vw); }
  /* generic shell: sidebar เป็น off-canvas — Pattern N shell ใช้ icon rail ของตัวเองแทน */
  .main { margin-left: 0; }
  .sidebar { transform: translateX(-100%); transition: transform .18s ease; }
  .sidebar.open { transform: translateX(0); box-shadow: 0 8px 32px rgba(0,0,0,.24); }
  .nav-toggle { display:inline-flex; align-items:center; justify-content:center;
    width:32px; height:32px; border:none; background:transparent; border-radius:8px;
    color:var(--c-ink); }
  .nav-toggle:hover { background: rgba(17,17,17,.06); }
}

/* ============== v7.1 LIST FULL-HEIGHT — Rule #96 ============== */
/* หน้า list หลัก: ตารางยืดเต็มพื้นที่เหลือ ติดขอบล่างเสมอ ทุกขนาดจอ */
.page-fill { display:flex; flex-direction:column;
  min-height: calc(100dvh - var(--shellbar-h, 52px) - 48px); } /* 48 = content padding บน+ล่าง */
@media (max-width:1180px){ .page-fill { min-height: calc(100dvh - var(--shellbar-h, 52px) - 32px); } }
.page-fill > .card-list, .page-fill > .list-card { flex:1 1 auto; min-height:0;
  display:flex; flex-direction:column; }
.table-wrap { flex:1 1 auto; min-height:0; overflow:auto; }
.table-wrap thead th { position:sticky; top:0; background:#fff; z-index:var(--z-sticky); }
.table-foot { flex:0 0 auto; } /* pagination/count ติดล่างของ card เสมอ */

/* ============== v7.1 OVERLAY PORTAL — Rule #95 ============== */
/* เมนูที่ portal ออกจาก scroll container (ใช้คู่ portalMenu util) */
.menu-fixed { position:fixed !important; z-index:var(--z-dropdown);
  background:#fff; border:1px solid var(--c-line, #E7E2DB); border-radius:10px;
  box-shadow:0 12px 32px rgba(17,17,17,.14); overflow-y:auto; }

/* ============== PAGE HEADER ============== */
.ph {
  margin-bottom:18px;
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: flex-start;
  gap:16px;
}
.ph > div:first-child { flex: 1 1 auto; min-width: 280px; }
.ph-title-row {
  display: flex;
  align-items: baseline;
  gap:10px;
  margin-bottom:6px;
}
.ph-title {
  font-family: 'Noto Sans Thai', sans-serif;
  font-size:20px;
  font-weight: 700;
  color: var(--c-navy);
  margin:0;
  letter-spacing: -0.01em;
}
.ph-count {
  font-size:12.5px;
  font-weight: 600;
  color: var(--c-mute-2);
  background: var(--c-line-3);
  padding:3px 10px;
  border-radius: 999px;
}
.ph-sub { font-size:13px; color: var(--c-mute); margin:0; }
.ph-actions { display: flex;align-items:center; gap:8px; flex-shrink: 0; }

/* ============== BUTTONS ============== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;   /* Rule #36 — content กึ่งกลางแนวนอน */
  gap:6px;
  height: 36px;
  /* Rule #36 — padding-top 2px = optical centering สำหรับฟอนต์ไทย (Noto Sans Thai):
     baseline ของไทยลอยสูงเมื่อ flex-center เพราะ font เผื่อที่สระล่าง → นัดจ์ลง 2px ให้เข้ากลางจริง.
     ✅ verified ด้วยการ render จริง — ทนทุกเบราว์เซอร์ (ต่างจาก text-box-trim ที่รองรับเฉพาะ Chrome 133+). */
  padding:2px 16px 0;
  border-radius: 8px;
  font-size:13px;
  font-weight: 500;
  /* ⚠️ Rule #36 — ห้ามใส่ line-height:1 / overflow:hidden กับตัวปุ่มที่มีข้อความไทย
     เพราะจะ "ตัดสระบน-วรรณยุกต์-สระล่าง" ทำให้ตัวอักษรเบี้ยว. ปล่อย line-height ตาม body (1.5). */
  border: 1px solid transparent;
  background: transparent;
  white-space: nowrap;       /* label ไม่ตัดบรรทัด → ปุ่มในแถวเดียวสูงเท่ากัน */
  transition: all 120ms;
  user-select: none;
  cursor: pointer;
}
.btn [data-lucide] { width: 15px; height: 15px; flex-shrink: 0; }  /* Rule #36 — icon ไม่ถูกบีบ */
.btn:disabled, .btn.is-disabled { opacity: .55; cursor: not-allowed; pointer-events: none; }
.btn-eq { min-width: 104px; }  /* Rule #36 — ปุ่มคู่ที่ควรสมมาตร → กว้างเท่ากัน */
/* Rule #36 — label ยาวที่ "ต้อง" จำกัดความกว้าง: truncate ที่ span (.lbl) ไม่ใช่ที่ตัวปุ่ม.
   line-height (1.5) สูงพอ → overflow:hidden ตัดเฉพาะแนวนอน (ไม่ตัดสระไทย). ปกติปล่อยปุ่มโตตาม label ดีกว่า. */
.btn-truncate { max-width: 220px; }
.btn-truncate .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn-primary { background: var(--c-primary); color: #fff; }
.btn-primary:hover { background: var(--c-primary-hover); box-shadow: 0 2px 8px rgba(255,59,48,0.30); }
.btn-secondary { background: #fff; border-color: var(--c-line); color: var(--c-ink); }
.btn-secondary:hover { background: var(--c-line-3); border-color: var(--c-mute-2); }
.btn-ghost { color: var(--c-mute); }
.btn-ghost:hover { background: var(--c-line-3); color: var(--c-ink); }
.btn-danger { background: #fff; border-color: var(--c-line); color: var(--c-danger); }
.btn-danger:hover { background: #FFE9E7; border-color: var(--c-danger); }
.btn-link { background: transparent; border: 0; padding:0 4px; height: auto; color: var(--c-primary); font-weight: 500; }
.btn-link:hover { text-decoration: underline; }
.btn-sm { height: 30px; padding:2px 12px 0; font-size:12px; }

/* ============== STATS (KPI Cards) ============== */
.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap:12px;
  margin-bottom:18px;
}
.stat {
  background: #fff;
  border: 1px solid var(--c-line-2);
  border-radius: 10px;
  padding:16px 16px;
  transition: all 150ms;
}
.stat:hover { border-color: var(--c-line); box-shadow: 0 2px 8px rgba(17,17,17,0.05); }
.stat-label {
  display: flex;
  align-items: center;
  gap:6px;
  font-size:12px;
  font-weight: 500;
  color: var(--c-mute);
}
.stat-label [data-lucide] { width: 13px; height: 13px; color: var(--c-primary); }
.stat-value {
  font-family: 'Noto Sans Thai', sans-serif;
  font-size:26px;
  font-weight: 700;
  color: var(--c-navy);
  margin-top:6px;
  letter-spacing: -0.01em;
}
.stat-meta {
  font-size:12px;
  color: var(--c-mute-2);
  margin-top:6px;
  display: flex;
  align-items: center;
  gap:4px;
}
.stat-meta.is-up { color: var(--c-success); }
.stat-meta.is-down { color: var(--c-danger); }
.stat-meta [data-lucide] { width: 12px; height: 12px; }

/* ============== CARD ============== */
.card {
  background: #fff;
  border: 1px solid var(--c-line-2);
  border-radius: 10px;
  overflow: hidden;
}

/* ============== FILTER BAR ============== */
.filter-bar {
  padding:16px 18px;
  display: flex;
  gap:10px;
  align-items: center;
  border-bottom: 1px solid var(--c-line-2);
  background: #fff;
  flex-wrap: wrap;
}

/* ============== INPUTS ============== */
.input, .select {
  height: 36px;
  padding:0 12px;
  border: 1px solid var(--c-line);
  border-radius: 8px;
  font-size:13px;
  background: #fff;
  color: var(--c-ink);
  font-family: inherit;
  transition: all 120ms;
  width: 100%;
}
.input:focus, .select:focus {
  outline: none;
  border-color: var(--c-primary);
  box-shadow: 0 0 0 3px rgba(255,59,48,0.10);
}
.select {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2364748B' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
  background-repeat: no-repeat;
  background-position: right 10px center;
  padding-right:32px;
  appearance: none;
}
.input-search { position: relative; flex: 1; max-width: 320px; }
.input-search input { padding-left:36px; }
.input-search .lead-icon {
  position: absolute;
  left: 11px; top: 50%;
  transform: translateY(-50%);
  width: 15px; height: 15px;
  color: var(--c-mute-2);
  pointer-events: none;
}

/* ===== SEARCH-SELECT (Iron Rule #34) — searchable dropdown แทน <select> เมื่อ options เยอะ/lookup master =====
   list = position:absolute overlay → ไม่ดันเนื้อหา (สอดคล้อง Rule #35) */
.search-select { position: relative; width: 100%; }
.search-select .ss-input { padding-left:32px; padding-right:32px; }
.search-select .ss-lead {
  position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
  width: 16px; height: 16px;   /* ⬅ ขนาดตายตัว — ไม่พึ่ง .w-4 (กัน Lucide เรนเดอร์ 24px default → placeholder ดูห่าง) */
  color: var(--c-mute-3); pointer-events: none;
}
.search-select .ss-caret {
  position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
  width: 15px; height: 15px; color: var(--c-mute-3); pointer-events: none;
}
.search-select .ss-clear {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  display: inline-flex; padding:3px; border: 0; background: transparent;
  color: var(--c-mute-2); cursor: pointer; border-radius: 6px;
}
.search-select .ss-clear:hover { background: var(--c-line-3); color: var(--c-ink); }
.ss-list {
  position: absolute; z-index:var(--z-backdrop); left: 0; right: 0; margin-top:4px;
  max-height: 280px; overflow-y: auto; background: #fff;
  border: 1px solid var(--c-line); border-radius: 8px;
  box-shadow: 0 10px 30px rgba(17,17,17,0.10), 0 4px 10px rgba(17,17,17,0.05);
}
.ss-opt {
  width: 100%; display: flex; align-items: center; gap:10px; padding:10px 12px;
  border: 0; border-bottom: 1px solid var(--c-line-3); background: transparent;
  cursor: pointer; text-align: left; font-family: inherit;
}
.ss-opt:last-child { border-bottom: 0; }
.ss-opt:hover, .ss-opt.is-active { background: rgba(255,59,48,0.06); }
.ss-opt-ic { width: 16px; height: 16px; color: var(--c-primary); flex-shrink: 0; }  /* ขนาดตายตัวเช่นกัน */
.ss-opt-main { flex: 1; min-width: 0; }
.ss-opt-label { display: block; font-size:13px; color: var(--c-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ss-opt-sub { display: block; font-size:12px; color: var(--c-mute-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ss-opt-right { flex-shrink: 0; font-size:12px; color: var(--c-mute); }
.ss-opt mark { background: rgba(255,59,48,0.16); color: inherit; padding:0 1px; border-radius: 2px; }
.ss-empty { padding:20px 16px; text-align: center; font-size:13px; color: var(--c-mute-2); }

/* ============== TABLE ============== */
.table-scroll { overflow-x: auto; }
.table {
  width: 100%;
  border-collapse: collapse;
  font-size:13px;
}
.table thead { background: var(--c-bg-off); }
.table th {
  padding:12px 16px;
  text-align: left;
  font-weight: 600;
  color: var(--c-mute);
  font-size:12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  border-bottom: 1px solid var(--c-line-2);
  white-space: nowrap;
}
.table th.col-check { width: 40px; padding-right:0; }
.table th.is-sortable { cursor: pointer; user-select: none; }
.table th.is-sortable:hover { color: var(--c-ink); background: var(--c-line-3); }
.table th .sort-arrow { display: inline-block; margin-left:4px; opacity: 0.4; }
.table th.is-sorted .sort-arrow { opacity: 1; color: var(--c-primary); }
.table td {
  padding:12px 16px 12px;  /* Rule #38 — optical centering ไทย: pad-top มากกว่า bottom 2px */
  border-bottom: 1px solid var(--c-line-2);
  color: var(--c-ink);
  vertical-align: middle;
}
.table tbody tr { transition: background 120ms; }
.table tbody tr:hover { background: var(--c-bg-off); }
.table tbody tr.is-selected { background: rgba(255,59,48,0.04); }
.table tbody tr.is-selected:hover { background: rgba(255,59,48,0.07); }
.table tbody tr:last-child td { border-bottom: 0; }
/* Rule #41 — แถวกดได้ = เปิด view (ไม่มีไอคอนดวงตา). row ที่ clickable ต้องสื่อด้วย cursor */
.table tbody tr.is-clickable { cursor: pointer; }
/* Rule #42 — Long-list UX: sticky header (opt-in .is-sticky) — ตารางยาว scroll หัวค้าง */
.table-scroll.is-sticky { max-height: 560px; overflow-y: auto; scrollbar-gutter: stable; }
.table-scroll.is-sticky thead th {
  position: sticky; top: 0; z-index: 3;
  background: var(--c-bg-off);            /* ⚠️ ต้องทึบที่ตัว th (ไม่ใช่แค่ thead) — ไม่งั้น row เลื่อนทะลุซ้อนหัว */
  box-shadow: inset 0 -1px 0 var(--c-line-2);  /* border-bottom สำหรับ sticky (border ปกติหายตอน sticky) */
}
/* Rule #42 — Thai-safe cell truncation: ตัดเฉพาะแนวนอน (… ) line-height พอ ไม่ตัดสระ. ใส่ title=ค่าเต็มเพื่อ hover ดู */
.cell-truncate { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: block; }
/* Rule #43 — ตัวเลข tabular + คอลัมน์ตัวเลขชิดขวา */
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
th.col-num, td.col-num { text-align: right; }
td.col-num .num, td.col-num { font-variant-numeric: tabular-nums; }

/* ============== CHECKBOX ============== */
.cb {
  width: 16px; height: 16px;
  border: 1.5px solid var(--c-line);
  border-radius: 4px;
  background: #fff;
  cursor: pointer;
  display: inline-block;
  position: relative;
  transition: all 120ms;
  flex-shrink: 0;
}
.cb.is-checked, .cb.is-partial {
  background: var(--c-primary);
  border-color: var(--c-primary);
}
.cb.is-checked::after {
  content: '';
  position: absolute;
  left: 4px; top: 1px;
  width: 5px; height: 9px;
  border: solid #fff;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}
.cb.is-partial::after {
  content: '';
  position: absolute;
  left: 3px; top: 6px;
  width: 8px; height: 2px;
  background: #fff;
}
.cb:hover { border-color: var(--c-primary); }

/* ============== USER CELL ============== */
.user-cell { display: flex; align-items: center; gap:10px; }
.uc-avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--c-primary), var(--c-teal));
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size:12px;
  font-weight: 600;
  flex-shrink: 0;
}
.uc-name { font-weight: 600; color: var(--c-ink); font-size:13px; line-height: 1.3; }
.uc-email { font-size:12px; color: var(--c-mute-2); margin-top:1px; line-height: 1.3; }

/* ============== PILLS ============== */
.pill {
  display: inline-flex;
  align-items: center;
  gap:5px;
  height: 22px;            /* Rule #38.1 — ทุก pill สูงเท่ากันเป๊ะ · ห้ามใช้ padding ตั้งความสูง */
  line-height: 1;
  padding:1px 10px 0;      /* optical centering ไทย (บน 1px) */
  border-radius: 999px;
  font-size:11.5px;
  vertical-align: middle;
  box-sizing: border-box;
  font-weight: 600;
  white-space: nowrap;
}
.pill [data-lucide] { width: 11px; height: 11px; }
.pill-registered { background: #E6F0FF; color: #1A5FCC; }
.pill-active { background: #E6F0FF; color: #1A5FCC; }
.pill-converted { background: #E4F4EB; color: #157A41; }
.pill-suspended { background: #FFF1DD; color: #B8690B; }
.pill-archived { background: var(--c-line-3); color: var(--c-mute-2); }
/* v3.13 — Semantic pill aliases (ใช้ชุดนี้เป็นหลัก — mapping ดู knowledge/microcopy.md) */
.pill-info    { background: #E6F0FF; color: #1A5FCC; }   /* กำลังดำเนินการ/ใช้งาน */
.pill-success { background: #E4F4EB; color: #157A41; }   /* อนุมัติแล้ว/เสร็จสิ้น */
.pill-warning { background: #FFF1DD; color: #B8690B; }   /* รอดำเนินการ/รออนุมัติ */
.pill-danger  { background: #FFE9E7; color: #E62E24; }   /* ปฏิเสธ/ยกเลิก */
.pill-muted   { background: var(--c-line-3); color: var(--c-mute-2); } /* ร่าง/ปิดใช้งาน/เก็บถาวร */

/* v3.13 — Loading spinner (Iron Rule #44) */
@keyframes spin { to { transform: rotate(360deg); } }
.spin { animation: spin 0.8s linear infinite; }

/* v3.13 — Form Section Grouping (Iron Rule #45) */
.form-section { margin-top:var(--sp-xl); }
.form-section:first-child { margin-top:0; }
.form-section-title {
  font-size: var(--fs-cap); font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.08em; color: var(--c-mute);
  padding-bottom:var(--sp-sm); border-bottom: 1px solid var(--c-line-2);
  margin-bottom:var(--sp-md);
}

/* v3.13 — Segmented control (ช่วงเวลา dashboard ฯลฯ — Pattern J) */
.seg-control { display:inline-flex; background: var(--c-line-3); border-radius: var(--r-md); padding:2px; gap:2px; }
.seg-item {
  padding:6px 12px 3px; border-radius: var(--r-sm); border: none; background: transparent;
  font-size: var(--fs-meta); font-weight: 500; color: var(--c-mute-2); cursor: pointer;
  font-family: inherit; white-space: nowrap;
}
.seg-item.is-active { background: #fff; color: var(--c-ink); font-weight: 600; box-shadow: 0 1px 3px rgba(17,17,17,0.08); }
.pill-danger { background: #FFE9E7; color: var(--c-danger); }

.dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  display: inline-block;
}
.dot.is-active { background: #1A5FCC; box-shadow: 0 0 0 2.5px rgba(37,99,235,0.18); }
.dot.is-converted { background: #157A41; box-shadow: 0 0 0 2.5px rgba(6,95,70,0.20); }
.dot.is-suspended { background: var(--c-warning); }
.dot.is-archived { background: var(--c-mute-3); }

/* Mini-link cell (e.g. tenant link) */
.tenant-link {
  display: inline-flex;
  align-items: center;
  gap:4px;
  color: var(--c-primary);
  font-size:12.5px;
  font-weight: 500;
  cursor: pointer;
}
.tenant-link:hover { text-decoration: underline; }
.tenant-link [data-lucide] { width: 12px; height: 12px; }

/* ============== ROW ACTIONS ============== */
.row-actions { display: inline-flex; gap:2px; }
.ra-btn {
  width: 28px; height: 28px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 0;
  color: var(--c-mute-2);
  border-radius: 6px;
  transition: all 120ms;
}
.ra-btn:hover { background: var(--c-line-3); color: var(--c-primary); }
.ra-btn.is-danger:hover { background: #FFE9E7; color: var(--c-danger); }
.ra-btn.is-success:hover { background: rgba(255,154,31,0.12); color: var(--c-teal); }
.ra-btn [data-lucide] { width: 15px; height: 15px; }

/* ============== TABLE FOOTER ============== */
.table-footer {
  padding:12px 18px;
  background: var(--c-bg-off);
  border-top: 1px solid var(--c-line-2);
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size:12.5px;
  color: var(--c-mute);
  flex-wrap: wrap;
  gap:10px;
}
.pagination { display: inline-flex; gap:4px; align-items: center; }
.pg-btn {
  min-width: 30px; height: 30px;
  padding:0 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: #fff;
  border: 1px solid var(--c-line-2);
  border-radius: 6px;
  color: var(--c-mute);
  font-size:12.5px;
  font-weight: 500;
  cursor: pointer;
  transition: all 120ms;
}
.pg-btn:hover { border-color: var(--c-line); background: var(--c-bg-off); }
.pg-btn.is-active { background: var(--c-primary); border-color: var(--c-primary); color: #fff; }
.pg-btn.is-disabled { opacity: 0.4; cursor: not-allowed; }
.pg-btn [data-lucide] { width: 13px; height: 13px; }

/* ============== BULK BAR ============== */
.bulk-bar {
  background: var(--c-navy);
  color: #fff;
  padding:12px 18px;
  border-radius: 8px 8px 0 0;
  display: flex;
  align-items: center;
  gap:12px;
  border-bottom: 1px solid var(--c-line-2);
  margin:-1px -1px 0;
  font-size:13px;
}
.bulk-bar .btn { height: 30px; padding:2px 12px 0; font-size:12px; }
.bulk-bar .btn-secondary {
  background: rgba(255,255,255,0.10);
  border-color: rgba(255,255,255,0.18);
  color: #fff;
}
.bulk-bar .btn-secondary:hover { background: rgba(255,255,255,0.16); border-color: rgba(255,255,255,0.30); }

/* ============== DRAWER ============== */
/* ---- v6.1 Pattern B drawer chrome (locked to references/drawer-standard/pr.html) ----
   create/edit drawer ให้ใช้ชุดนี้: .dw-head (eyebrow + h2 20px + .top-icon-btn ปิด)
   + .d-stepper (.stepper-item/.stepper-circle 32px — ไม่ใช่ .stepper กลางของ page wizard)
   + .dw-footer (ย้อนกลับ secondary ซ้าย · ยกเลิก ghost + primary ชิดขวา) */
.top-icon-btn { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border:0; background:transparent; border-radius: var(--r-sm); color: var(--c-mute-2); cursor:pointer; transition: all 120ms; flex-shrink:0; }
.top-icon-btn:hover { background: var(--c-line-3); color: var(--c-ink); }
.dw-head { padding:18px 24px 16px; border-bottom: 1px solid var(--c-line-2); flex-shrink: 0; }
.dw-head-row { display: flex; align-items: flex-start; justify-content: space-between; gap:16px; }
.dw-eyebrow { display: flex; align-items: center; gap:6px; font-size:11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--c-mute-2); margin-bottom:4px; font-weight: 600; }
.dw-title { font-size:20px; font-weight: 700; color: var(--c-navy); margin:0; letter-spacing: -0.01em; }
.dw-sub { font-size: var(--fs-meta); color: var(--c-mute-2); margin-top:4px; }
.d-stepper { display: flex; align-items: flex-start; gap:0; width: 100%; margin-top:18px; }
.stepper-item { flex: 1; display: flex; flex-direction: column; align-items: center; position: relative; min-width: 0; }
.stepper-circle { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size:13px; font-weight: 600; background: #fff; color: var(--c-mute-3); border: 2px solid var(--c-line); transition: all 200ms; z-index: 2; }
.stepper-item.active .stepper-circle { background: var(--c-primary); color: #fff; border-color: var(--c-primary); box-shadow: 0 0 0 4px rgba(255,59,48,0.12); }
.stepper-item.done .stepper-circle { background: var(--c-primary); color: #fff; border-color: var(--c-primary); }
.stepper-label { margin-top:8px; font-size:12px; font-weight: 500; color: var(--c-mute-3); text-align: center; line-height: 1.3; transition: color 200ms; }
.stepper-item.active .stepper-label { color: var(--c-navy); font-weight: 600; }
.stepper-item.done .stepper-label { color: var(--c-mute); }
.stepper-item:not(:last-child)::after { content: ''; position: absolute; top: 15px; left: 50%; right: -50%; height: 2px; background: var(--c-line-2); z-index: 1; }
.stepper-item.done:not(:last-child)::after { background: var(--c-primary); }
.dw-footer { padding:16px 24px; border-top: 1px solid var(--c-line-2); background: var(--c-bg-off); flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap:8px; }
.dw-footer-right { display: flex; align-items: center; gap:8px; }

.drawer-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(17,17,17,0.40);
  z-index:var(--z-backdrop);
  opacity: 0;
  pointer-events: none;
  transition: opacity 220ms;
}
.drawer-backdrop.is-open { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed;
  top: 0; right: 0; bottom: 0;
  width: 920px;           /* v2 standard (Iron Rule #11) — wide drawer */
  max-width: 96vw;
  background: #fff;
  z-index:var(--z-drawer);
  transform: translateX(100%);
  transition: transform 280ms cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  flex-direction: column;
  box-shadow: -16px 0 40px rgba(17,17,17,0.18);
}
.drawer.is-open { transform: translateX(0); }
.drawer.standard { width: 680px; }   /* simple forms / short view (Iron Rule #11) */

/* ========== STEPPER STANDARD (Iron Rule #47) — ใช้ตัวเดียวทุก wizard ========== */
.stepper { display:flex; align-items:center; gap:var(--sp-sm); }
.step { display:flex; align-items:center; gap:var(--sp-sm); }
.step-dot {
  width:26px; height:26px; border-radius: var(--r-full);
  display:flex; align-items:center; justify-content:center;
  font-size: var(--fs-meta); font-weight:600; padding-top:1px; /* Thai rhythm */
  border:1.5px solid var(--c-line); background:#fff; color: var(--c-mute-2);
}
.step-label { font-size: var(--fs-sub); color: var(--c-mute-2); font-weight:500; white-space:nowrap; }
.step-connector { width:28px; height:1.5px; background: var(--c-line-2); flex:0 0 auto; }
.step.is-current .step-dot { border-color: var(--c-primary); background: var(--c-primary); color:#fff; }
.step.is-current .step-label { color: var(--c-ink); font-weight:600; }
.step.is-done .step-dot { border-color: var(--c-teal); background:#fff; color: var(--c-teal); }
.step.is-done .step-connector, .step.is-current ~ * {}
.step.is-done + .step-connector { background: var(--c-teal); }
/* placement: drawer wizard → .drawer-stepper-band (ใต้ header) / page wizard → .wizard-stepper-band */
.drawer-stepper-band { padding:10px 24px; border-bottom: 1px solid var(--c-line-2); background: var(--c-bg-off); }

.drawer-header {
  display: flex;
  align-items: center;
  gap:16px;
  padding:18px 24px;
  border-bottom: 1px solid var(--c-line-2);
}
/* ---- Rule #38.2 TABS (kit เดียว · ห้ามเขียน .drawer-tab/.seg เองแทน) ---- */
.tabs { display:flex; gap:0; border-bottom:1px solid var(--c-line-2); margin:0 0 var(--sp-lg); flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
.tabs::-webkit-scrollbar { display:none; }
.tab { display:inline-flex; align-items:center; gap:6px; height:40px; padding:0 14px; margin-bottom:-1px; border:0; border-bottom:2px solid transparent; background:transparent; font:inherit; font-size:13px; font-weight:500; color:var(--c-mute); cursor:pointer; white-space:nowrap; flex:0 0 auto; }
.tab [data-lucide] { width:14px; height:14px; }
.tab:hover { color:var(--c-ink); }
.tab.is-active, .tab.on { color:var(--c-primary); border-bottom-color:var(--c-primary); font-weight:600; }
.tab .tab-badge { font-size:10.5px; font-weight:700; background:var(--c-line-2); color:var(--c-mute); border-radius:999px; height:18px; line-height:18px; padding:0 7px; }
.tab.is-active .tab-badge { background:rgba(255,59,48,.12); color:var(--c-primary); }
/* drawer header ที่มี tabs — header เป็น column · tabs bleed เต็มกว้าง · เส้นเดียว (ของ header) · body ไม่มี border-top */
.drawer-header.has-tabs { flex-direction:column; align-items:stretch; gap:0; padding-bottom:0; }
.drawer-header.has-tabs .dw-head-row { display:flex; align-items:flex-start; gap:16px; padding-bottom:14px; }
.drawer-header.has-tabs .tabs { margin:0 -24px -1px; padding:0 24px; border-bottom:0; }
.drawer-header.has-tabs + .drawer-body { border-top:0; }
.dw-eyebrow { font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--c-mute-2); display:flex; align-items:center; gap:6px; margin-bottom:4px; }
.dw-title { font-size:18px; font-weight:700; color:var(--c-ink); line-height:1.25; }
/* page-level tabs ใต้ page header (Rule #104) */
.ph + .tabs, .page-tabs { margin:-4px 0 var(--sp-lg); }
/* ---- Rule #106 info tooltip แทน hint banner ---- */
.tip { position:relative; display:inline-flex; align-items:center; color:var(--c-mute-2); cursor:help; }
.tip [data-lucide] { width:13px; height:13px; }

.step-dot{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;font-size:11px;color:var(--c-mute-2);text-align:center}
.step-dot::before{content:"";position:absolute;top:11px;left:calc(-50% + 12px);width:calc(100% - 24px);height:2px;background:var(--c-line-2)}
.step-dot:first-child::before{display:none}
.step-dot .d{width:24px;height:24px;border-radius:99px;background:#fff;border:2px solid var(--c-line);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:var(--c-mute-2);z-index:1}
.step-dot.on .d{background:var(--c-primary);border-color:var(--c-primary);color:#fff}
.step-dot.done .d{background:var(--c-success);border-color:var(--c-success);color:#fff}
.step-dot.on{color:var(--c-ink);font-weight:600}
.step-head{display:flex;align-items:center;gap:10px;margin:0 0 var(--sp-md)}
.step-head .ic{width:34px;height:34px;border-radius:var(--r-md);background:var(--c-line-3);display:inline-flex;align-items:center;justify-content:center;color:var(--c-primary)}
.step-head h3{margin:0;font-size:var(--fs-h3)}.step-head p{margin:2px 0 0;font-size:var(--fs-meta);color:var(--c-mute-2)}
/* ---- line editor B2 ---- */
.line-tbl{width:100%;border-collapse:collapse;font-size:var(--fs-sub)}
.line-tbl thead th{text-align:left;font-size:var(--fs-cap);text-transform:uppercase;letter-spacing:.05em;color:var(--c-mute-2);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--c-line-2);white-space:nowrap}
.line-tbl td{padding:5px 8px;border-bottom:1px solid var(--c-line-3);vertical-align:middle}
.line-tbl td.num{text-align:right;font-variant-numeric:tabular-nums}
.line-tbl .input{height:32px;padding:4px 8px}
.line-expand-panel-anchor{background:var(--c-line-3)}
.seg-vat{display:inline-flex;border:1px solid var(--c-line-2);border-radius:var(--r-sm);overflow:hidden}
.seg-vat button{border:0;background:#fff;font:inherit;font-size:11px;padding:4px 8px;cursor:pointer;color:var(--c-mute)}
.seg-vat button.on{background:var(--c-primary);color:#fff}
.totbox{display:grid;grid-template-columns:1fr auto;gap:4px 24px;font-size:var(--fs-sub);max-width:320px;margin-left:auto}
.totbox .g{font-weight:700;font-size:var(--fs-h3);color:var(--c-navy)}
/* ---- a4 pdf preview ---- */
.a4{width:210mm;max-width:100%;min-height:250mm;margin:0 auto;background:#fff;border:1px solid var(--c-line-2);box-shadow:0 2px 12px rgba(17,17,17,.08);padding:18mm 16mm;font-size:12px;color:#111}
.a4 .a4-hd{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid #111;padding-bottom:8px}
.a4 table{width:100%;border-collapse:collapse;margin-top:8px;font-size:11px}
.a4 th,.a4 td{border:1px solid #999;padding:4px 6px}
.a4 .sign{display:flex;justify-content:space-around;text-align:center;margin-top:48px;font-size:11px}
.signprog{display:flex;flex-direction:column;align-items:center;gap:3px}
.signprog b{font-size:11px;font-weight:700}
.signprog .bar{width:46px;height:4px;border-radius:99px;background:var(--c-line-2);overflow:hidden}
.signprog .bar>i{display:block;height:100%;background:var(--c-success)}
.w26{width:26px}.w30{width:30px}.w80{width:80px}.w90{width:90px}

<!-- ============================================================
     Lucide Icons Loader (multi-CDN fallback, pinned version)
     ------------------------------------------------------------
     ทำไมไม่ใช้ <script src="..."> ตรง ๆ:
       - Single CDN = single point of failure (corp proxy/firewall block)
       - @latest = breaking changes โดยไม่บอก (GitHub issue #2962)
       - <script> ใน <head> โดยไม่มี defer ชน DOMContentLoaded
     กลยุทธ์:
       1) Pin version 0.469.0 (stable, ทดสอบแล้ว)
       2) ลอง CDN 3 ตัวเรียงตามความน่าเชื่อถือ: unpkg → jsdelivr → cdnjs
       3) ถ้าทุก CDN fail → log warning + ไม่ block render
            (UI ยังใช้งานได้ แค่ไม่มี icons)
     ============================================================ -->
<script>
(function loadLucide() {
  var version = '0.469.0';
  var cdns = [
    'https://unpkg.com/lucide@' + version + '/dist/umd/lucide.min.js',
    'https://cdn.jsdelivr.net/npm/lucide@' + version + '/dist/umd/lucide.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/lucide/' + version + '/lucide.min.js'
  ];
  var i = 0;
  function tryNext() {
    if (i >= cdns.length) {
      console.warn('[Lucide] All CDNs failed. Icons จะไม่แสดง but UI ยังใช้งานได้');
      window.lucide = window.lucide || { createIcons: function() {} }; // no-op fallback
      window.dispatchEvent(new Event('lucide:ready'));
      return;
    }
    var s = document.createElement('script');
    s.src = cdns[i++];
    s.onload = function() {
      window.dispatchEvent(new Event('lucide:ready'));
    };
    s.onerror = tryNext;
    document.head.appendChild(s);
  }
  tryNext();
})();
</script>

<script>
// ============================================
// STATE
// ============================================
const state = {
  currentRoute: 'home',
  drawer: { open: false, mode: null, recordId: null, step: 1 },
  modal: { open: false, type: null, data: null },
  toast: { visible: false, message: '', variant: 'info' },
  filters: { search: '', status: 'all' },
  pagination: { page: 1, pageSize: 20 },
  sort: { col: null, dir: 'asc' },
  selectedIds: new Set(),
  records: [],
};

// ============================================
// SIDEBAR — Module collapse/expand (Iron Rule #27)
// Module header is non-navigable; click toggles children visibility.
// State persists in DOM (data-expanded) — future: persist per user.
// ============================================
function toggleModule(headerEl) {
  const mod = headerEl.closest('.sb-module');
  if (!mod) return;
  const isExpanded = mod.getAttribute('data-expanded') !== 'false';
  mod.setAttribute('data-expanded', isExpanded ? 'false' : 'true');
}

// ============================================
// ROUTER (Hash-based, refresh-safe)
// ============================================
function getRoute() {
  const hash = location.hash;
  if (!hash || hash === '#' || hash === '#/') return 'home';
  return hash.replace(/^#\//, '');
}
function navigate(route) {
  location.hash = '#/' + route;
}

// ============================================
// DRAWER / MODAL TOGGLES
// ============================================
function openDrawer(mode, recordId) {
  state.drawer = { open: true, mode, recordId, step: 1 };
  render();
  // Trigger CSS animation
  requestAnimationFrame(() => {
    document.getElementById('drawerBackdrop').classList.add('is-open');
    document.getElementById('drawer').classList.add('is-open');
  });
}
function closeDrawer() {
  document.getElementById('drawerBackdrop').classList.remove('is-open');
  document.getElementById('drawer').classList.remove('is-open');
  setTimeout(() => {
    state.drawer = { open: false, mode: null, recordId: null, step: 1 };
  }, 280);
}
function openModal(type, data) {
  state.modal = { open: true, type, data };
  render();
  requestAnimationFrame(() => {
    document.getElementById('modalBackdrop').classList.add('is-open');
  });
}
function closeModal() {
  document.getElementById('modalBackdrop').classList.remove('is-open');
  setTimeout(() => {
    state.modal = { open: false, type: null, data: null };
  }, 200);
}

// ============================================
// TOAST
// ============================================
function showToast(message, variant = 'info', durationMs = 2800) {
  const el = document.getElementById('toast');
  const iconMap = { success: 'check-circle-2', info: 'info', warning: 'alert-triangle', error: 'x-circle' };
  el.className = 'toast is-' + variant;
  el.innerHTML = `<i data-lucide="${iconMap[variant] || 'info'}" class="w-4 h-4"></i><span>${message}</span>`;
  renderIcons();
  requestAnimationFrame(() => el.classList.add('is-visible'));
  setTimeout(() => el.classList.remove('is-visible'), durationMs);
}

// ============================================
// ESC key handler (close drawer/modal)
// ============================================
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (state.modal.open) closeModal();
    else if (state.drawer.open) closeDrawer();
  }
});

// ============================================
// RENDER (placeholder — replace per feature)
// ============================================
function render() {
  // Specific feature should override this function.
  //
  // ⚠️ Iron Rule #29 — Render Preservation:
  // If your render() does innerHTML rebuild (typical pattern), wrap with
  // withRenderPreservation() OR use preserveRenderState()/restoreRenderState()
  // to keep scroll position + focus across re-renders.
  //
  // Example:
  //   function render() {
  //     const snap = preserveRenderState();
  //     document.getElementById('page-content').innerHTML = renderPage();
  //     drawer.innerHTML = state.drawer.open ? renderDrawer() : '';
  //     renderIcons();
  //     restoreRenderState(snap);
  //   }
  //
  // After every DOM update, call renderIcons() — safe wrapper ที่ทน race เมื่อ Lucide ยังไม่ load.
  renderIcons();
}

// ============================================
// INIT
// ============================================
// Helper: safe icon render — กัน race ก่อน lucide load เสร็จ
function renderIcons() {
  if (window.lucide && typeof window.lucide.createIcons === 'function') {
    window.lucide.createIcons();
  }
}

// ============================================
// SEARCH-SELECT (Iron Rule #34) — generic searchable dropdown
// ------------------------------------------------
// ใช้แทน <select> เมื่อ options เยอะ (>8) หรือเป็น lookup จาก master อื่น.
// list = position:absolute overlay → ไม่ดันเนื้อหา. แก้เฉพาะ list ตอนพิมพ์ →
// ไม่ rebuild ทั้งหน้า (ไม่ชน Rule #29). decoupled — เรียก onSelect callback ไม่ผูก render().
//
// วิธีใช้ 2 ขั้น:
//   1) ใส่ markup:  ${searchSelectHTML('country', { placeholder: 'เลือกประเทศ' })}
//   2) หลัง markup อยู่ใน DOM แล้ว (เช่นท้าย render()):
//        initSearchSelect('country', {
//          options: countries.map(c => ({ value:c.code, label:c.name, sub:c.code, icon:'flag', right:'' })),
//          value: state.form.country,
//          onSelect: (val, opt) => { state.form.country = val; }
//        });
// option fields: { value, label, sub?, icon?, right? }
// ============================================
window.__ss = window.__ss || {};
function ssGet(key){ return window.__ss[key]; }
function ssEscapeReg(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }

function searchSelectHTML(key, opt){
  opt = opt || {};
  var ph = opt.placeholder || 'ค้นหา...';
  return ''
    + '<div class="search-select" id="ss-' + key + '">'
    +   '<i data-lucide="search" class="ss-lead w-4 h-4"></i>'
    +   '<input type="text" class="input ss-input" id="ss-input-' + key + '" autocomplete="off" placeholder="' + ph + '"'
    +     ' oninput="ssOnInput(\'' + key + '\', this.value)" onfocus="ssOpen(\'' + key + '\')" onkeydown="ssOnKey(\'' + key + '\', event)">'
    +   '<button type="button" class="ss-clear hidden" id="ss-clear-' + key + '" tabindex="-1" onclick="ssClear(\'' + key + '\')"><i data-lucide="x" class="w-4 h-4"></i></button>'
    +   '<i data-lucide="chevron-down" class="ss-caret" id="ss-caret-' + key + '"></i>'
    +   '<div class="ss-list hidden" id="ss-list-' + key + '"></div>'
    + '</div>';
}
function initSearchSelect(key, cfg){
  cfg = cfg || {};
  window.__ss[key] = {
    options: cfg.options || [], value: (cfg.value != null ? cfg.value : null),
    onSelect: cfg.onSelect || function(){}, emptyText: cfg.emptyText || 'ไม่พบรายการ',
    query: '', open: false, hi: 0
  };
  ssSetText(key); ssSyncChrome(key); renderIcons();
}
function ssFiltered(key){
  var s = ssGet(key); if(!s) return [];
  var q = (s.query || '').toLowerCase().trim();
  if(!q) return s.options;
  return s.options.filter(function(o){
    return String(o.label).toLowerCase().includes(q)
      || String(o.value).toLowerCase().includes(q)
      || String(o.sub || '').toLowerCase().includes(q);
  });
}
function ssSyncChrome(key){
  var s = ssGet(key); if(!s) return;
  var sel = s.options.find(function(o){ return o.value === s.value; });
  var c = document.getElementById('ss-clear-' + key); if(c) c.classList.toggle('hidden', !sel);
  var k = document.getElementById('ss-caret-' + key); if(k) k.classList.toggle('hidden', !!sel);
}
function ssSetText(key){
  var s = ssGet(key); if(!s) return;
  var input = document.getElementById('ss-input-' + key); if(!input) return;
  var sel = s.options.find(function(o){ return o.value === s.value; });
  input.value = s.open ? s.query : (sel ? sel.label : '');
}
function ssRenderList(key){
  var s = ssGet(key); if(!s) return;
  var list = document.getElementById('ss-list-' + key); if(!list) return;
  var items = ssFiltered(key);
  if(items.length === 0){
    list.innerHTML = '<div class="ss-empty">' + s.emptyText + '</div>';
  } else {
    var q = (s.query || '').toLowerCase().trim();
    var hl = function(t){ return q ? String(t).replace(new RegExp('(' + ssEscapeReg(q) + ')', 'gi'), '<mark>$1</mark>') : String(t); };
    list.innerHTML = items.map(function(o, i){
      return '<button type="button" class="ss-opt ' + (i === s.hi ? 'is-active' : '') + '" onmousedown="event.preventDefault()" onclick="ssPick(\'' + key + '\', ' + i + ')">'
        + (o.icon ? '<i data-lucide="' + o.icon + '" class="ss-opt-ic w-4 h-4"></i>' : '')
        + '<span class="ss-opt-main"><span class="ss-opt-label">' + hl(o.label) + '</span>'
        + (o.sub ? '<span class="ss-opt-sub">' + hl(o.sub) + '</span>' : '') + '</span>'
        + (o.right ? '<span class="ss-opt-right">' + o.right + '</span>' : '')
        + '</button>';
    }).join('');
  }
  list.classList.toggle('hidden', !s.open);
  renderIcons();
}
function ssOpen(key){ var s = ssGet(key); if(!s) return; s.open = true; s.query = ''; s.hi = 0; ssSetText(key); ssSyncChrome(key); ssRenderList(key); }
function ssOnInput(key, val){ var s = ssGet(key); if(!s) return; s.query = val; s.open = true; s.hi = 0; s.value = null; ssSyncChrome(key); ssRenderList(key); }
function ssPick(key, i){ var s = ssGet(key); if(!s) return; var o = ssFiltered(key)[i]; if(!o) return; s.value = o.value; s.query = ''; s.open = false; ssSetText(key); ssSyncChrome(key); ssRenderList(key); s.onSelect(o.value, o); }
function ssClear(key){ var s = ssGet(key); if(!s) return; s.value = null; s.query = ''; s.open = true; ssSetText(key); ssSyncChrome(key); ssRenderList(key); var inp = document.getElementById('ss-input-' + key); if(inp) inp.focus(); s.onSelect(null, null); }
function ssOnKey(key, e){
  var s = ssGet(key); if(!s) return; var items = ssFiltered(key);
  if(e.key === 'ArrowDown'){ e.preventDefault(); s.open = true; s.hi = Math.min(items.length - 1, s.hi + 1); ssRenderList(key); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); s.hi = Math.max(0, s.hi - 1); ssRenderList(key); }
  else if(e.key === 'Enter'){ e.preventDefault(); if(items[s.hi]) ssPick(key, s.hi); }
  else if(e.key === 'Escape'){ s.open = false; ssSetText(key); ssSyncChrome(key); ssRenderList(key); }
}
document.addEventListener('click', function(e){
  Object.keys(window.__ss || {}).forEach(function(key){
    var wrap = document.getElementById('ss-' + key); var s = ssGet(key);
    if(wrap && s && s.open && !wrap.contains(e.target)){ s.open = false; ssSetText(key); ssSyncChrome(key); ssRenderList(key); }
  });
});

// ============================================
// FORMAT HELPERS (Iron Rule #43) — Thai locale, consistent ทุก feature
// ใช้ตัวเหล่านี้เสมอ ห้าม format ตัวเลข/วันที่เองรายจุด
// ============================================
function fmtNumber(n, dp){ if(n==null||n==='')return '—'; var x=Number(n); if(isNaN(x))return String(n);
  return x.toLocaleString('th-TH', {minimumFractionDigits: dp||0, maximumFractionDigits: dp!=null?dp:2}); }
function fmtMoney(n, dp){ if(n==null||n==='')return '—'; var x=Number(n); if(isNaN(x))return String(n);
  return '฿' + x.toLocaleString('th-TH', {minimumFractionDigits: dp!=null?dp:2, maximumFractionDigits: dp!=null?dp:2}); }
function fmtDate(iso, buddhist){ if(!iso)return '—'; var d=new Date(iso); if(isNaN(d))return String(iso);
  var s=d.toLocaleDateString('th-TH', {year:'numeric', month:'short', day:'numeric'});
  return buddhist===false ? d.toLocaleDateString('en-GB',{year:'numeric',month:'short',day:'numeric'}) : s; }
function fmtDateTime(iso){ if(!iso)return '—'; var d=new Date(iso); if(isNaN(d))return String(iso);
  return d.toLocaleString('th-TH', {year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}); }

// ============================================
// INLINE VALIDATION (Iron Rule #43) — validate ตอน blur, ไม่ใช่รอ submit อย่างเดียว
// markup: <div class="field"><input class="input" onblur="validateField(this, v => v.trim()? '' : 'จำเป็นต้องกรอก')">
//          <div class="field-error"></div></div>
// validator คืน '' = ผ่าน / ข้อความ = error
// ============================================
function validateField(el, validator){
  var field = el.closest('.field'); if(!field) return true;
  var msg = '';
  try { msg = validator ? validator(el.value, el) : ''; } catch(e){ msg=''; }
  var errEl = field.querySelector('.field-error');
  if(msg){ field.classList.add('is-invalid'); if(errEl) errEl.textContent = msg; return false; }
  field.classList.remove('is-invalid'); return true;
}
function clearFieldError(el){ var f=el.closest('.field'); if(f) f.classList.remove('is-invalid'); }

// ============================================
// EMPTY STATE (Iron Rule #39) — list/section ว่าง ต้องมี icon + title + desc + (action)
// ============================================
function emptyStateHTML(cfg){
  cfg = cfg || {};
  var act = cfg.actionLabel ? '<button class="btn btn-primary" onclick="' + (cfg.onAction||'') + '">' +
    (cfg.actionIcon ? '<i data-lucide="' + cfg.actionIcon + '" class="w-4 h-4"></i>' : '') +

// ============================================
// RENDER PRESERVATION (Iron Rule #29)
// ------------------------------------------------
// ทุกครั้งที่ render() ทำ innerHTML = ... full DOM rebuild
// scroll position + focus + cursor selection จะหาย —
// user รู้สึก "เด้งกลับบน" ทุกครั้งที่ toggle/click.
//
// withRenderPreservation(renderFn) wraps a render function
// to save state before innerHTML rebuild, then restore after.
//
// Preserves:
//   - scrollTop ของ .drawer-body
//   - scrollTop ของ .modal-body
//   - window.scrollY (page-level scroll)
//   - document.activeElement focus + selection range (input/textarea ที่กำลังพิมพ์)
//
// Usage:
//   const render = withRenderPreservation(function actualRender() {
//     content.innerHTML = ...
//   });
//
// หรือเรียกตรง ๆ ใน render() ที่มีอยู่แล้ว:
//   function render() {
//     const snapshot = preserveRenderState();
//     // ... innerHTML rebuilds ...
//     restoreRenderState(snapshot);
//   }
// ============================================
function preserveRenderState() {
  const drawerBody = document.querySelector('.drawer-body');
  const modalBody = document.querySelector('.modal-body');
  const activeEl = document.activeElement;
  const isInput = activeEl && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA');
  return {
    drawerScroll: drawerBody ? drawerBody.scrollTop : 0,
    modalScroll: modalBody ? modalBody.scrollTop : 0,
    pageScroll: window.scrollY,
    focusKey: isInput ? {
      placeholder: activeEl.placeholder || '',
      type: activeEl.type || '',
      name: activeEl.name || '',
      selStart: activeEl.selectionStart,
      selEnd: activeEl.selectionEnd,
    } : null,
  };
}
function restoreRenderState(snap) {
  if (!snap) return;
  requestAnimationFrame(function() {
    const dBody = document.querySelector('.drawer-body');
    if (dBody && snap.drawerScroll > 0) dBody.scrollTop = snap.drawerScroll;
    const mBody = document.querySelector('.modal-body');
    if (mBody && snap.modalScroll > 0) mBody.scrollTop = snap.modalScroll;
    if (snap.pageScroll > 0) window.scrollTo(0, snap.pageScroll);

    if (snap.focusKey) {
      const candidates = document.querySelectorAll('input, textarea');
      for (let i = 0; i < candidates.length; i++) {
        const c = candidates[i];
        if ((c.placeholder || '') === snap.focusKey.placeholder
            && (c.type || '') === snap.focusKey.type
            && (c.name || '') === snap.focusKey.name) {
          c.focus();
          if (snap.focusKey.selStart != null && typeof c.setSelectionRange === 'function') {
            try { c.setSelectionRange(snap.focusKey.selStart, snap.focusKey.selEnd); } catch(e) {}
          }
          break;
        }
      }
    }
  });
}
function withRenderPreservation(renderFn) {
  return function preservedRender() {
    const snap = preserveRenderState();
    const result = renderFn.apply(this, arguments);
    restoreRenderState(snap);
    return result;
  };
}

window.addEventListener('hashchange', function () { render(); });  // v6.1 late-binding — ให้ชี้ render() ตัวที่ feature override (ผูกตรง ๆ จะ capture placeholder เดิม)

// รอ DOM + Lucide ทั้งคู่ก่อน first render
// (Lucide loader จะ dispatch 'lucide:ready' เมื่อ load สำเร็จ
//  หรือเมื่อทุก CDN fail แล้ว fallback เป็น no-op)
var domReady = false;
var lucideReady = false;
function bootIfReady() {
  if (domReady && lucideReady) {
    render();
    renderIcons();
  }
}
if (document.readyState === 'loading') {
  window.addEventListener('DOMContentLoaded', function() { domReady = true; bootIfReady(); });
} else {
  domReady = true;
}
// Listen for ready event AND check ว่า lucide load ไปแล้วหรือยัง
// (script ตัวนี้รันหลัง loader — ถ้า loader sync เสร็จก่อน, event อาจหายไปแล้ว)
window.addEventListener('lucide:ready', function() { lucideReady = true; bootIfReady(); });
if (window.lucide && typeof window.lucide.createIcons === 'function') {
  lucideReady = true;
}
bootIfReady();
// Safety net: ถ้า lucide:ready ไม่มาภายใน 5s ให้ render ไปก่อน (UI ยังใช้งานได้)
setTimeout(function() {
  if (!lucideReady) {
    console.warn('[Lucide] Timeout — rendering without icons');
    lucideReady = true;
    bootIfReady();
  }
}, 5000);
</script>

function portalMenu(trigger, menu){
  let host = document.getElementById('overlay-root');
  if(!host){ host = document.createElement('div'); host.id='overlay-root'; document.body.appendChild(host); }
  if(menu.parentElement !== host) host.appendChild(menu);
  menu.classList.add('menu-fixed');
  const r = trigger.getBoundingClientRect();
  const below = window.innerHeight - r.bottom - 12, above = r.top - 12;
  const h = Math.min(menu.scrollHeight || 320, 320);
  menu.style.left = r.left + 'px';
  menu.style.width = r.width + 'px';
  if(below < h && above > below){ menu.style.top='auto'; menu.style.bottom=(window.innerHeight-r.top+4)+'px';
    menu.style.maxHeight = Math.min(h, above)+'px'; }
  else { menu.style.bottom='auto'; menu.style.top=(r.bottom+4)+'px';
    menu.style.maxHeight = Math.min(h, Math.max(below,120))+'px'; }
  menu._trigger = trigger;
  const reposition = ()=>{ if(menu.classList.contains('open')) portalMenu(trigger, menu); };
  if(!menu._portalBound){ menu._portalBound = true;
    window.addEventListener('scroll', reposition, true);
    window.addEventListener('resize', reposition); }
}
function positionMenu(trigger,menu){const r=trigger.getBoundingClientRect();
  const below=window.innerHeight-r.bottom-12, above=r.top-12, h=Math.min(menu.scrollHeight,320);

const STEP_KEYS = ['เลือกแหล่งที่มา', 'ข้อมูลหลัก', 'รายการสินค้า', 'เอกสารแนบ', 'ตรวจสอบและยืนยัน'];
const VATOPT = [['none', 'ไม่คิด'], ['add', 'VAT'], ['included', 'รวมแล้ว (NET)']];
function openCreate(){ state.wizard={ step:1, doc:{ emp:'', date:'2569-08-31', pay:'payroll', lines:[], endbill:{enabled:false,mode:'amount',value:0} } }; openDrawer('wizard'); }
function STEPH(icon, title, sub){ return '<div class="step-head"><span class="ic"><i data-lucide="'+icon+'" class="w-4 h-4"></i></span><div><h3>'+title+'</h3>'+(sub?'<p>'+sub+'</p>':'')+'</div></div>'; }
function stepper(){ const s=state.wizard.step; return '<div class="stepper">'+STEP_KEYS.map((k,i)=>{const n=i+1;const cls=n<s?'done':n===s?'on':'';return '<div class="step-dot '+cls+'"><span class="d">'+(n<s?'✓':n)+'</span><span>'+k+'</span></div>';}).join('')+'</div>'; }
function wizStepBody(){
  const w=state.wizard, d=w.doc;
  if(w.step===1) return STEPH('git-branch','เลือกแหล่งที่มาของใบเบิก','สร้างใบเบิกใหม่จากค่าใช้จ่ายที่สำรองจ่ายไป')
    +'<div class="sec"><div class="chips"><label class="chip-tag" class="pad812"><input type="radio" name="src" checked> สร้างใหม่ (สำรองจ่ายเอง)</label><label class="chip-tag" class="pad812"><input type="radio" name="src" disabled> จากใบขออนุมัติเดินทาง <span class="muted-sm">(ไม่รองรับรอบนี้)</span></label></div></div>';
  if(w.step===2){ const e=emp(d.emp); return STEPH('clipboard-list','ข้อมูลหลักใบเบิก')
    +'<div class="sec"><div class="field"><label>ผู้เบิก *</label>'+searchSelectHTML('wizemp',{placeholder:'ค้นหาพนักงาน…'})+'</div>'
    + (e.id?'<div class="hookbox">ตำแหน่ง <b>'+e.pos+'</b> · แผนก '+e.dept+' · ศูนย์ต้นทุน <b>'+e.cc+'</b> <span class="muted-sm">(ดึงจากตำแหน่ง ณ วันเบิก · Movement)</span></div>':'')
    +'<div class="field" class="mt14"><label>วันที่เอกสาร (พ.ศ.)</label><input class="input" value="'+d.date+'" onchange="state.wizard.doc.date=this.value"></div>'
    +'<div class="field"><label>ช่องทางจ่าย</label><select class="input" onchange="state.wizard.doc.pay=this.value"><option value="payroll" '+(d.pay==='payroll'?'selected':'')+'>ผ่านรอบเงินเดือน</option><option value="transfer" '+(d.pay==='transfer'?'selected':'')+'>โอนตรง</option></select></div></div>'; }
  if(w.step===3) return STEPH('list','รายการค่าใช้จ่าย','เพิ่มรายการ · เลือกหมวด (ตรวจเพดานอัตโนมัติ) · VAT ต่อบรรทัด')+lineEditor();
  if(w.step===4) return STEPH('paperclip','เอกสารแนบ','แนบใบเสร็จ/หลักฐานรวมของใบเบิก (หมวดที่บังคับต้องแนบก่อนส่ง)')
    +'<div class="sec"><div class="upload-zone"><i data-lucide="upload-cloud" class="w-5 h-5"></i><div>ลากไฟล์ใบเสร็จมาวาง หรือคลิกเพื่อเลือก</div></div></div>';
  const t=totals(d), tier=doaTier(t.grand);
  return STEPH('check-circle-2','ตรวจสอบและยืนยัน','ตรวจข้อมูลก่อนกด "บันทึกและส่งอนุมัติ"')
    +'<div class="sec"><dl class="kv"><dt>ผู้เบิก</dt><dd>'+(emp(d.emp).name||'—')+'</dd><dt>วันที่</dt><dd>'+d.date+'</dd><dt>ช่องทางจ่าย</dt><dd>'+(d.pay==='payroll'?'ผ่านรอบเงินเดือน':'โอนตรง')+'</dd><dt>จำนวนรายการ</dt><dd>'+t.n+'</dd><dt>ยอดรวมทั้งสิ้น</dt><dd><b>'+fmtM(t.grand)+'</b></dd></dl></div>'
    +'<div class="sec"><h4><i data-lucide="git-branch" class="w-4 h-4"></i>สายอนุมัติ (DOA · ตามวงเงิน — resolve ตอนส่ง)</h4><div class="hookbox">ยอด '+fmtM(t.grand)+' → tier '+tier.tier+' · '+tier.steps.map(s=>s.role).join(' → ')+' <span class="muted-sm">(ไม่ hardcode · ตั้งที่ DOA กลาง)</span></div></div>';
}
function lineEditor(){
  const d=state.wizard.doc, t=totals(d);
  const rows=d.lines.length? d.lines.map((l,i)=>{ const cap=catCap(l.cat); const over=cap!=null&&(+l.unit_price||0)>cap; const cv=calcLineVat(l);
    return '<tr><td>'+(i+1)+'</td><td><input class="input" class="w110" value="'+l.date+'" onchange="setLine('+i+',\'date\',this.value)"></td>'
    +'<td><select class="input" class="w130" onchange="setLine('+i+',\'cat\',this.value)">'+EXP.cats.map(c=>'<option value="'+c.code+'" '+(l.cat===c.code?'selected':'')+'>'+c.name+'</option>').join('')+'</select></td>'
    +'<td><input class="input" value="'+(l.desc||'')+'" onchange="setLine('+i+',\'desc\',this.value)"></td>'
    +'<td><input class="input w100 taR" type="number" value="'+(l.unit_price||'')+'" onchange="setLine('+i+',\'unit_price\',this.value)"></td>'
    +'<td>'+vatSeg(i,l)+'</td>'
    +'<td class="num">'+fmtM(cv.lineTotal)+'</td>'
    +'<td><button class="btn btn-sm btn-ghost" onclick="delLine('+i+')"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i></button></td></tr>'
    + (over?'<tr class="line-expand-panel-anchor"><td colspan="8"><div class="hookbox" style="color:var(--c-warning)"><i data-lucide="alert-triangle" class="w-3.5 h-3.5"></i> เกินเพดานหมวด '+catName(l.cat)+' ('+fmtM(cap)+') — ต้องระบุเหตุผล: <input class="input" class="input inl240" placeholder="เหตุผลการเบิกเกินเพดาน"></div></td></tr>':'');
  }).join('') : '<tr><td colspan="8"><div class="hookbox">ยังไม่มีรายการ — กด "เพิ่มรายการ"</div></td></tr>';
  return '<div class="sec"><table class="tbl line-tbl"><thead><tr><th class="w30">#</th><th>วันที่</th><th>หมวด</th><th>รายละเอียด</th><th class="thR">จำนวนเงิน</th><th>VAT</th><th class="thR">รวม</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'
    +'<button class="btn btn-secondary btn-sm" class="mt10" onclick="addLine()"><i data-lucide="plus" class="w-3.5 h-3.5"></i>เพิ่มรายการ</button>'
    +'<div class="totbox" class="mt14"><div>รวมเป็นเงิน</div><div class="num">'+fmtM(t.before)+'</div><div>ภาษีมูลค่าเพิ่ม</div><div class="num">'+fmtM(t.vat)+'</div><div class="g">รวมทั้งสิ้น</div><div class="num g">'+fmtM(t.grand)+'</div></div>'
    +'<div class="muted-sm" class="mt6">'+renderLineSummary(d)+'</div></div>';
}
function vatSeg(i,l){ migrateLine(l); return '<span class="seg-vat">'+VATOPT.map(o=>'<button class="'+(l.vat_mode===o[0]?'on':'')+'" onclick="setLine('+i+',\'vat_mode\',\''+o[0]+'\')">'+o[1]+'</button>').join('')+'</span>'; }
function renderLineSummary(d){ const t=totals(d); return t.n+' รายการ · สุทธิ '+fmtM(t.before)+' · VAT '+fmtM(t.vat)+' · รวม '+fmtM(t.grand); }
function setLine(i,k,v){ const l=state.wizard.doc.lines[i]; if(!l)return; l[k]=(k==='unit_price')?(+v||0):v; renderDrawerOnly(); }
function addLine(){ state.wizard.doc.lines.push({date:'2569-08-31',cat:'travel',desc:'',qty:1,unit_price:0,vat_mode:'add'}); renderDrawerOnly(); }
function delLine(i){ state.wizard.doc.lines.splice(i,1); renderDrawerOnly(); }
function renderDrawerOnly(){ const dw=document.getElementById('drawer'); if(dw){ const s=preserveRenderState(); dw.innerHTML=drawerHTML(); initSelects(); renderIcons(); restoreRenderState(s);} }
function wizNext(){ if(state.wizard.step<5){ state.wizard.step++; renderDrawerOnly(); } }
function wizBack(){ if(state.wizard.step>1){ state.wizard.step--; renderDrawerOnly(); } }
function dwWizard(){
  const w=state.wizard, t=totals(w.doc); const last=w.step===5;
  const canNext = w.step!==2 || w.doc.emp; const canSubmit = t.grand>0 && t.n>0;
  return '<div class="drawer-panel wide"><div class="drawer-header"><div class="fx1"><div class="dw-eyebrow">ใบเบิกค่าใช้จ่าย</div><div class="dw-title">สร้างใบเบิก</div></div><button class="icon-btn" onclick="closeDrawer()"><i data-lucide="x" class="w-4 h-4"></i></button></div>'
    +'<div class="drawer-body">'+stepper()+wizStepBody()+'</div>'
    +'<div class="drawer-footer">'+(w.step>1?'<button class="btn btn-ghost" onclick="wizBack()">ย้อนกลับ</button>':'<button class="btn btn-ghost" onclick="closeDrawer()">ยกเลิก</button>')
    + (last? '<button class="btn btn-primary" '+(canSubmit?'':'disabled title="ต้องมีรายการและยอด > 0"')+' onclick="openSubmit()"><i data-lucide="send" class="w-4 h-4"></i>บันทึกและส่งอนุมัติ</button>'
           : '<button class="btn btn-primary" '+(canNext?'':'disabled')+' onclick="wizNext()">ถัดไป</button>')
    +'</div></div>';
}
</script>
<script>
/* ---- VIEW DRAWER (4 tabs) ---- */
function findDoc(id){ return EXP.docs.find(d=>d.id===id); }
function openView(id){ state.view={tab:'detail',id}; openDrawer('view',id); }
function tabBtn(key,label){ const on=state.view.tab===key; return '<button class="tab '+(on?'is-active':'')+'" onclick="setVtab(\''+key+'\')">'+label+'</button>'; }
function setVtab(k){ state.view.tab=k; renderDrawerOnly(); }
function SEC(icon, inner){ return '<div class="sec"><h4><i data-lucide="'+icon+'" class="w-4 h-4"></i>'+inner+'</div>'; }
function dwView(){
  const d=findDoc(state.drawer.recordId)||{}; const e=emp(d.emp), t=totals(d); const tab=state.view.tab;
  const tabs='<div class="tabs">'+tabBtn('detail','รายละเอียด')+tabBtn('pdf','PDF Preview')+tabBtn('sign','ลายเซ็น / อนุมัติ')+tabBtn('history','ประวัติ')+'</div>';
  let body='';
  if(tab==='detail'){
    body='<div class="sec"><dl class="kv"><dt>เลขที่</dt><dd><b>'+d.code+'</b></dd><dt>ผู้เบิก</dt><dd>'+e.name+' · '+e.pos+'</dd><dt>ศูนย์ต้นทุน</dt><dd>'+e.cc+' <span class="muted-sm">(ณ วันเบิก)</span></dd><dt>วันที่</dt><dd>'+d.date+'</dd><dt>ช่องทางจ่าย</dt><dd>'+(d.pay==='payroll'?'ผ่านรอบเงินเดือน':'โอนตรง')+'</dd><dt>สถานะ</dt><dd>'+docPill(d.status)+(d.reason?' · '+d.reason:'')+'</dd></dl></div>'
    +'<div class="sec"><h4><i data-lucide="list" class="w-4 h-4"></i>รายการ</h4><table class="tbl line-tbl"><thead><tr><th>วันที่</th><th>หมวด</th><th>รายละเอียด</th><th>VAT</th><th class="thR">รวม</th></tr></thead><tbody>'
    + d.lines.map(l=>{const cv=calcLineVat(l);return '<tr><td>'+l.date+'</td><td>'+catName(l.cat)+'</td><td>'+l.desc+'</td><td>'+taxBadgeV(l)+'</td><td class="num">'+maskM(cv.lineTotal)+'</td></tr>';}).join('')
    + '</tbody></table><div class="totbox" class="mt12"><div>รวมเป็นเงิน</div><div class="num">'+maskM(t.before)+'</div><div>VAT</div><div class="num">'+maskM(t.vat)+'</div><div class="g">รวมทั้งสิ้น</div><div class="num g">'+maskM(t.grand)+'</div></div></div>'
    + SEC('paperclip', `เอกสารแนบ</h4><div class="hookbox">receipt_`+d.code+`.pdf · 3 ไฟล์ · 620 KB</div></div>`)
    + '<div class="sec"><h4><i data-lucide="banknote" class="w-4 h-4"></i>สถานะการจ่าย</h4><div class="hookbox"><i data-lucide="link" class="w-3.5 h-3.5"></i> '+(d.payHook||'—')+'<br><span class="muted-sm">อ่านจากปลายทาง (เงินเดือน/การเงิน) display-only — Expense ไม่จ่าย/ไม่ลงบัญชีเอง</span></div></div>';
  } else if(tab==='pdf'){
    body='<div class="ovauto">'+a4Doc(d)+'</div>';
  } else if(tab==='sign'){
    const tier=doaTier(t.grand);
    body='<div class="sec"><h4><i data-lucide="git-branch" class="w-4 h-4"></i>สายอนุมัติ (DOA · ตามวงเงิน '+fmtM(t.grand)+' → tier '+tier.tier+')</h4><ul class="tl">'
      + chainOf(d).map(s=>'<li class="'+(s.status==='approved'?'on':s.status==='rejected'?'no':'')+'"><b>'+s.role+' — '+s.name+'</b><small>'+(s.status==='approved'?'อนุมัติแล้ว':s.status==='rejected'?'ไม่อนุมัติ':'รอพิจารณา')+'</small></li>').join('')
      + '</ul><div class="muted-sm">resolve ตอนส่ง แล้ว freeze · แก้ยอดข้ามช่วง = re-resolve (มติ 17 ส.ค.)</div></div>';
  } else {
    body='<div class="sec"><h4><i data-lucide="history" class="w-4 h-4"></i>ประวัติ (audit · append-only)</h4><ul class="tl">'+((EXP.audit[d.id]||[{act:'สร้างใบเบิก',who:e.name,at:d.date}]).map(a=>'<li class="on"><b>'+a.act+'</b><small>'+a.who+' · '+a.at+'</small></li>').join(''))+'</ul></div>';
  }
  let foot='<div class="drawer-footer"><button class="btn btn-ghost" onclick="closeDrawer()">ปิด</button>';
  if(d.status==='pending_approval') foot+='<button class="btn btn-danger" onclick="openModal(\'reject\',{id:\''+d.id+'\'})">ไม่อนุมัติ</button><button class="btn btn-primary" onclick="openModal(\'approve\',{id:\''+d.id+'\'})"><i data-lucide="check" class="w-4 h-4"></i>อนุมัติ</button>';
  else if(d.status==='draft') foot+='<button class="btn btn-secondary" onclick="openModal(\'cancel\',{id:\''+d.id+'\'})">ยกเลิก</button><button class="btn btn-primary" onclick="openSubmit()"><i data-lucide="send" class="w-4 h-4"></i>ส่งอนุมัติ</button>';
  foot+='</div>';
  return '<div class="drawer-panel"><div class="drawer-header has-tabs"><div class="dw-head-row"><div class="fx1"><div class="dw-eyebrow">ใบเบิกค่าใช้จ่าย</div><div class="dw-title">'+d.code+' '+docPill(d.status)+'</div></div><button class="icon-btn" onclick="closeDrawer()"><i data-lucide="x" class="w-4 h-4"></i></button></div>'+tabs+'</div><div class="drawer-body">'+body+'</div>'+foot+'</div>';
}
function a4Doc(d){ const e=emp(d.emp), t=totals(d);
  return '<div class="a4"><div class="a4-hd"><div><div style="font-weight:700;font-size:15px">บริษัท ทูบีซิมเปิล จำกัด</div><div style="font-size:10px;color:#333">เลขประจำตัวผู้เสียภาษี 0-1055-xxxxx-xx-x (สำนักงานใหญ่)</div></div><div style="text-align:right"><div style="font-weight:700;font-size:14px">ใบเบิกค่าใช้จ่าย</div><div>เลขที่ <b>'+d.code+'</b></div><div style="font-size:10px">วันที่ '+d.date+'</div></div></div>'
  +'<div class="a4-row"><div>ผู้เบิก: <b>'+e.name+'</b> ('+e.code+')<br>'+e.pos+' · '+e.dept+'</div><div>ศูนย์ต้นทุน: '+e.cc+'<br>ช่องทางจ่าย: '+(d.pay==='payroll'?'ผ่านรอบเงินเดือน':'โอนตรง')+'</div></div>'
  +'<table><thead><tr><th class="w26">#</th><th class="w80">วันที่</th><th>หมวด</th><th>รายละเอียด</th><th class="thR" class="w90">จำนวนเงิน</th></tr></thead><tbody>'
  + d.lines.map((l,i)=>'<tr><td>'+(i+1)+'</td><td>'+l.date+'</td><td>'+catName(l.cat)+'</td><td>'+l.desc+'</td><td style="text-align:right">'+Number(l.unit_price).toLocaleString('th-TH',{minimumFractionDigits:2})+'</td></tr>').join('')
  +'</tbody></table><div class="a4-tot"><table><tr><td>รวมเป็นเงิน</td><td>'+t.before.toLocaleString('th-TH',{minimumFractionDigits:2})+'</td></tr><tr><td>ภาษีมูลค่าเพิ่ม</td><td>'+t.vat.toLocaleString('th-TH',{minimumFractionDigits:2})+'</td></tr><tr><td><b>รวมทั้งสิ้น</b></td><td><b>'+t.grand.toLocaleString('th-TH',{minimumFractionDigits:2})+'</b></td></tr></table></div>'
  +'<div class="sign"><div>......................<br>ผู้เบิก<br>('+e.name+')</div><div>......................<br>ผู้อนุมัติ (DOA)<br>(............)</div><div>......................<br>การเงิน<br>(............)</div></div></div>';
}
/* ---- MODALS + ACTIONS ---- */
function drawerHTML(){ const m=state.drawer.mode; return ({wizard:dwWizard,view:dwView}[m]||(()=>''))(); }
function openSubmit(){ openModal('submit',{}); }
function modalHTML(){ const m=state.modal; if(!m.type)return '';
  if(m.type==='submit'){ const t=state.wizard.doc?totals(state.wizard.doc):null; const tier=t?doaTier(t.grand):doaTier(0);
    return '<div class="modal-head"><h3>ส่งอนุมัติ — เลือกผู้อนุมัติตามตำแหน่ง</h3></div><div class="modal-body"><p class="mnote">สายอนุมัติ resolve ตามวงเงิน '+(t?fmtM(t.grand):'')+' (tier '+tier.tier+') · ไม่ hardcode · เลือกคนจริง (มติ 17 ส.ค.)</p>'
    + tier.steps.map((s,i)=>'<div class="slot-row"><span class="slot-no">'+(i+1)+'</span><span class="tbl-person"><span class="av">'+s.name.slice(0,1)+'</span><span class="pp"><b>'+s.name+'</b><span>'+s.role+'</span></span></span></div>').join('')
    +'</div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-primary" onclick="doSubmit()"><i data-lucide="send" class="w-4 h-4"></i>ส่งอนุมัติ</button></div>'; }
  if(m.type==='approve') return modShell('check-circle-2','อนุมัติใบเบิก?','อนุมัติแล้วระบบจะออกเลข EXP-YYYY-NNNN + PDF + ยิง 7C (FC/EC) + ส่งสถานะจ่ายให้ปลายทาง','btn-primary','อนุมัติ',"doApprove('"+m.data.id+"')");
  if(m.type==='reject') return '<div class="modal-head"><h3>ไม่อนุมัติ (ตีกลับ)</h3></div><div class="modal-body"><p class="mdesc">ระบุเหตุผล (บันทึก + แจ้งผู้เบิกให้แก้แล้วยื่นใหม่)</p><textarea class="input" id="m_reason" rows="3"></textarea></div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn btn-danger" onclick="doReject(\''+m.data.id+'\')">ยืนยันตีกลับ</button></div>';
  if(m.type==='cancel') return modShell('x-circle','ยกเลิกใบเบิก?','ใบเบิกจะถูกยกเลิก (soft archive)','btn-danger','ยกเลิกใบเบิก',"doCancel('"+m.data.id+"')");
  return '';
}
function modShell(icon,title,desc,cls,label,onok){ return '<div class="modal-head"><div class="modal-icon '+(cls==='btn-danger'?'is-danger':'')+'"><i data-lucide="'+icon+'" class="w-5 h-5"></i></div><div><h3>'+title+'</h3></div></div><div class="modal-body"><p class="mdesc">'+desc+'</p></div><div class="modal-foot"><button class="btn btn-ghost" onclick="closeModal()">ยกเลิก</button><button class="btn '+cls+'" onclick="'+onok+'">'+label+'</button></div>'; }
function doSubmit(){ closeModal(); closeDrawer(); showToast('ส่งคำขออนุมัติแล้ว — แจ้งผู้อนุมัติ','success'); }
function doApprove(id){ const d=findDoc(id); if(d){d.status='approved';d.code='EXP-2569-00'+(3+EXP.docs.filter(x=>x.status==='approved').length);d.chain.forEach(s=>s.status='approved');} closeModal(); render(); showToast('อนุมัติ · ออกเลข '+ (d?d.code:'') +' · ยิง 7C FC/EC · ส่งสถานะจ่าย','success'); }
function doReject(id){ const d=findDoc(id); if(d){d.status='rejected';d.reason=(document.getElementById('m_reason')||{}).value||'ไม่ระบุ';} closeModal(); render(); showToast('ตีกลับ + แจ้งผู้เบิกแล้ว','info'); }
function doCancel(id){ const d=findDoc(id); if(d)d.status='cancelled'; closeModal(); render(); showToast('ยกเลิกใบเบิกแล้ว','info'); }
/* ---- select init + render ---- */
function initSelects(){
  if(state.drawer.open && state.drawer.mode==='wizard' && state.wizard.step===2 && document.getElementById('ss-wizemp')){
    initSearchSelect('wizemp',{options:EXP.emps.map(e=>({value:e.id,label:e.name,sub:e.pos+' · '+e.dept+' · '+e.code,icon:'user'})),value:state.wizard.doc.emp||null,
      onSelect:(v)=>{state.wizard.doc.emp=v; renderDrawerOnly();}});
  }
}
function render(){
  const snap=preserveRenderState(); applyRole();
  const pc=document.getElementById('page-content'); if(pc) pc.innerHTML=pageHTML();
  const dw=document.getElementById('drawer'); if(dw){ dw.className='drawer'+(state.drawer.open&&state.drawer.mode==='wizard'?' wide':''); dw.innerHTML=state.drawer.open?drawerHTML():''; }
  const mb=document.querySelector('#modalBackdrop .modal'); if(mb) mb.innerHTML=state.modal.open?modalHTML():'';
  initSelects(); renderIcons(); restoreRenderState(snap);
}
</script>
