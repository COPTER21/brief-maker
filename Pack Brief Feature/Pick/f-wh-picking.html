<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ใบหยิบสินค้า (Picking) · CUBE 4.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@500,600,700&display=swap" rel="stylesheet">
  <style>
    /* self-contained utility shim (replaces Tailwind CDN — icon sizing + inline) */
    .w-3{width:.75rem}.h-3{height:.75rem}
    .w-3\.5{width:.875rem}.h-3\.5{height:.875rem}
    .w-4{width:1rem}.h-4{height:1rem}
    .w-5{width:1.25rem}.h-5{height:1.25rem}
    .w-6{width:1.5rem}.h-6{height:1.5rem}
    .w-10{width:2.5rem}.h-10{height:2.5rem}
    .inline{display:inline-block}
    svg{vertical-align:middle}
    button:focus { outline: none; }
    button:focus-visible { outline: 2px solid var(--c-primary, #0B5CFF); outline-offset: 1px; }
    .btn-link, .btn-link:focus, .btn-link:focus-visible { outline: none !important; box-shadow: none !important; }
    .hint { position: relative; display: inline-flex; align-items: center; cursor: help; }
    .hint::after { content: attr(data-tip); position: absolute; left: 0; top: 150%; white-space: pre-line; width: 290px; background: var(--c-navy, #0B1D3A); color: #fff; font-size: 11px; font-weight: 400; line-height: 1.6; padding: 9px 11px; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,0.18); opacity: 0; visibility: hidden; transform: translateY(-2px); transition: opacity 120ms, transform 120ms; z-index: 60; pointer-events: none; }
    .hint:hover::after { opacity: 1; visibility: visible; transform: translateY(0); }
    .line-tbl th, .line-tbl td { padding-left: 6px; padding-right: 6px; }
    .line-tbl th:first-child, .line-tbl td:first-child { padding-left: 6px; }
    .prog{height:6px;border-radius:999px;background:var(--c-border-soft);overflow:hidden;} .prog>div{height:100%;background:var(--c-teal);} .prog>div.warn{background:var(--c-warning);} .prog>div.bad{background:var(--c-danger);}
    .route-no{width:24px;height:24px;border-radius:50%;background:var(--c-navy);color:#fff;font-size:11px;font-weight:700;display:inline-grid;place-items:center;}
    .chk{width:16px;height:16px;accent-color:var(--c-primary);cursor:pointer;}
  </style>
  <!-- PREFLIGHT v8: F-WH-PICK v1 · UX = SO/PO reference (Warm Light v8) · Warehouse structure per f-loc.html (WH→Zone→Area→Rack→Location · type) · balances per f-inv.html (product×location×lot · on_hand/alloc · FEFO) · source = SO confirmed+reserved + payment trigger gate (immediate/after_deposit/after_full — Finance/AR releases) + not hold · queue tab + pick tab · wave multi-SO · allocation AUTO from master (item lot=FEFO / else FIFO · pick-face-first · route-sorted · per-line override w/ audit — no per-doc strategy) · assignee search-dropdown (avatar·role·workload·เกิน) · pick-line modal standard (scan tiles · qty stepper · shortage reason chips · action short/reloc) · no-location handling (หาใหม่ refresh · manual pick incl. Hold/Staging · ขอเติม/โอน · จัดสรรใหม่) · srcType SO/TRANSFER/REPLENISH/RETURN (อ้างอิง ไม่ผูก SO) · short close · start · record pick per line (scan mock · short → SO backorder) · reloc · finish → to Packing (per SO) · hold/cancel releases loc alloc · services excluded · lucide inline -->
  <style>
    /* ============================================================
       CUBE NATIVE Admin CI v2 — Design Tokens
       ============================================================ */
    :root {
      --c-navy:        #111111;
      --c-navy-d:      #111111;
      --c-primary:     #FF3B30;
      --c-primary-h:   #E62E24;
      --c-teal:        #1F9D55;
      --c-slate:       #73757B;
      --c-off-white:   #FAF8F5;
      --c-white:       #FFFFFF;
      --c-border:      #DEDAD4;
      --c-border-soft: #EFEBE6;
      --c-text:        #111111;
      --c-text-mute:   #73757B;
      --c-text-soft:   #9A9CA2;
      --c-warning:     #E8870F;
      --c-danger:      #E62E24;
      --c-purple:      #FF9A1F;
      --c-primary-08:  rgba(255, 59, 48, 0.08);
      --c-primary-12:  rgba(255, 59, 48, 0.12);
      --c-primary-18:  rgba(255, 59, 48, 0.18);
      --c-teal-08:     rgba(31, 157, 85, 0.10);
      --c-warning-08:  rgba(232, 135, 15, 0.12);
      --c-danger-08:   rgba(230, 46, 36, 0.10);
      --r-sm: 6px;
      --r:    10px;
      --r-lg: 14px;
      --sh-sm: 0 1px 2px rgba(17, 17, 17, 0.04), 0 1px 3px rgba(17, 17, 17, 0.06);
      --sh-md: 0 4px 8px rgba(17, 17, 17, 0.04), 0 2px 4px rgba(17, 17, 17, 0.06);
      --sh-lg: 0 10px 30px rgba(17, 17, 17, 0.08), 0 4px 10px rgba(17, 17, 17, 0.04);
      --sh-xl: 0 24px 60px rgba(17, 17, 17, 0.10), 0 8px 24px rgba(17, 17, 17, 0.06);
      --sw: 224px;
      --hh: 52px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans Thai', 'Satoshi', -apple-system, sans-serif;
      font-size: 13px;
      line-height: 1.55;
      background: var(--c-off-white);
      color: var(--c-text);
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, h4, .display { font-family: 'Noto Sans Thai', 'Satoshi', sans-serif; letter-spacing: -0.015em; font-weight: 700; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; cursor: pointer; }
    input, select, textarea { font-family: inherit; }
    .num { font-variant-numeric: tabular-nums; }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    html { scrollbar-gutter: stable; scrollbar-width: thin; }
    ::-webkit-scrollbar-thumb { background: var(--c-border); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--c-text-soft); }

    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    input[type="number"] { -moz-appearance: textfield; appearance: textfield; }

    /* ============================================================
       SHELL — Sidebar (224px flat) + Main + Topbar (52px white)
       ============================================================ */
    .shell { display: grid; grid-template-columns: var(--sw) 1fr; min-height: 100vh; }

    .sb {
      background: var(--c-navy-d);
      color: white;
      height: 100vh;
      position: sticky; top: 0;
      display: flex; flex-direction: column;
      border-right: 1px solid rgba(255,255,255,0.05);
      overflow: hidden;
    }
    .sb-logo {
      padding: 16px 18px;
      display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
    }
    .sb-logo-mark {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, var(--c-primary), #FF9A1F);
      border-radius: var(--r-sm);
      display: grid; place-items: center;
      flex-shrink: 0;
      color: white;
    }
    .sb-logo-text { line-height: 1.2; min-width: 0; }
    .sb-logo-title { font-size: 13px; font-weight: 700; color: white; }
    .sb-logo-sub {
      font-size: 10px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 1px;
    }

    .sb-menu { flex: 1; overflow-y: auto; padding: 10px 0; }
    .sb-menu::-webkit-scrollbar { width: 4px; }
    .sb-menu::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); }

    .sb-grp { padding: 6px 0; }
    .sb-grp-label {
      padding: 6px 18px 4px;
      font-size: 10px; font-weight: 700; letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
    }

    .sb-item {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 18px;
      color: rgba(255,255,255,0.72);
      font-size: 13px;
      cursor: pointer;
      border-left: 3px solid transparent;
      transition: all 0.12s;
      text-decoration: none;
    }
    .sb-item:hover { background: rgba(255,255,255,0.05); color: white; }
    .sb-item.active {
      background: var(--c-primary-18);
      border-left-color: var(--c-primary);
      color: white;
      font-weight: 600;
    }
    .sb-icon { flex-shrink: 0; opacity: 0.8; display: grid; place-items: center; }
    .sb-item.active .sb-icon { opacity: 1; color: var(--c-primary); }

    .sb-badge {
      margin-left: auto;
      background: var(--c-danger);
      color: white;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 999px;
      line-height: 1.4;
    }
    .sb-badge.muted { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.7); }

    .sb-foot {
      padding: 12px 18px;
      border-top: 1px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
      font-size: 10px;
      color: rgba(255,255,255,0.4);
    }
    .sb-foot div + div { margin-top: 2px; }

    /* MAIN */
    .main { display: flex; flex-direction: column; min-width: 0; background: var(--c-off-white); }

    /* TOPBAR — White */
    .top {
      height: var(--hh);
      background: var(--c-white);
      border-bottom: 1px solid var(--c-border-soft);
      padding: 0 22px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 16px;
      position: sticky; top: 0; z-index: 50;
    }
    .top-left { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .top-bc { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--c-text); }
    .bc-root { color: var(--c-text-mute); cursor: pointer; transition: color 120ms; }
    .bc-root:hover { color: var(--c-primary); }
    .bc-sep { color: var(--c-text-soft); margin: 0 2px; }
    .bc-leaf { font-weight: 600; }

    .top-right { display: flex; align-items: center; gap: 12px; }
    .top-user {
      display: flex; align-items: center; gap: 9px;
      padding: 4px 11px 4px 4px;
      border-radius: 8px;
      border: 0; background: transparent;
      cursor: pointer;
      transition: background 120ms;
    }
    .top-user:hover { background: var(--c-off-white); }
    .top-user:focus, .top-user:focus-visible { outline: none; }
    .top-user-info {
      display: flex; flex-direction: column;
      align-items: flex-end;
      line-height: 1.2;
    }
    .top-user-name { font-size: 12.5px; font-weight: 600; color: var(--c-navy); }
    .top-user-role { font-size: 10.5px; color: var(--c-text-mute); margin-top: 2px; }
    .top-avatar {
      width: 30px; height: 30px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--c-primary), var(--c-teal));
      color: white;
      font-size: 12px; font-weight: 600;
      display: grid; place-items: center;
      flex-shrink: 0;
    }

    /* Icon button (used in drawer headers — printer/download/close) */
    .top-icon-btn {
      width: 32px; height: 32px;
      background: var(--c-off-white);
      border: 1px solid var(--c-border);
      border-radius: var(--r);
      cursor: pointer;
      display: grid; place-items: center;
      color: var(--c-text-mute);
      position: relative;
      transition: all 120ms;
    }
    .top-icon-btn:hover { color: var(--c-text); border-color: var(--c-text-soft); background: var(--c-white); }

    /* PAGE */
    .page { flex: 1; padding: 22px 24px 40px; overflow-y: auto; }

    /* PAGE HEAD */
    .ph {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-bottom: 18px;
      gap: 16px; flex-wrap: wrap;
    }
    .ph-left { min-width: 0; }
    .ph-title { font-size: 22px; font-weight: 700; color: var(--c-navy); line-height: 1.2; }
    .ph-sub { font-size: 13px; color: var(--c-text-mute); margin-top: 4px; }
    .ph-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    /* ============================================================
       BUTTON SYSTEM
       ============================================================ */
    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      gap: 6px;
      padding: 0 14px;
      height: 34px;
      border-radius: var(--r);
      font-size: 12.5px;
      font-weight: 600;
      border: 1px solid transparent;
      transition: all 0.15s ease;
      background: transparent;
      color: var(--c-text);
      line-height: 1;
      white-space: nowrap;
      cursor: pointer;
    }
    .btn:focus-visible { outline: 2px solid var(--c-primary); outline-offset: 2px; }
    .btn:disabled { cursor: not-allowed; opacity: 0.6; }
    .btn.lg { height: 38px; padding: 0 18px; font-size: 13px; }
    .btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
    .btn-primary    { background: var(--c-primary); color: white; border-color: var(--c-primary); }
    .btn-primary:hover:not(:disabled) { background: var(--c-primary-h); border-color: var(--c-primary-h); }
    .btn-secondary  { background: var(--c-white); color: var(--c-navy); border-color: var(--c-border); }
    .btn-secondary:hover:not(:disabled) { border-color: var(--c-text-soft); }
    .btn-ghost      { background: transparent; color: var(--c-text-mute); }
    .btn-ghost:hover:not(:disabled) { background: var(--c-off-white); color: var(--c-text); }
    .btn-success    { background: var(--c-teal); color: white; border-color: var(--c-teal); }
    .btn-success:hover:not(:disabled) { background: #00876F; border-color: #00876F; }
    .btn-danger     { background: var(--c-danger); color: white; border-color: var(--c-danger); }
    .btn-danger:hover:not(:disabled) { background: #C9271E; }
    .btn-link       { background: transparent; border: 0; color: var(--c-primary); padding: 0; height: auto; font-weight: 600; }
    .btn-link:hover { text-decoration: underline; }

    /* ============================================================
       PILL / BADGE
       ============================================================ */
    .pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 2px 9px;
      border-radius: 999px;
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.02em; line-height: 1.6;
      white-space: nowrap;
    }
    .pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .pill.draft     { background: rgba(115,117,123,0.12); color: var(--c-slate); }
    .pill.pending   { background: var(--c-warning-08);    color: #8A5200; }
    .pill.approved  { background: var(--c-teal-08);       color: var(--c-teal); }
    .pill.sent      { background: rgba(255,154,31,0.10);  color: var(--c-purple); }
    .pill.rejected  { background: var(--c-danger-08);     color: var(--c-danger); }
    .pill.cancelled { background: rgba(115,117,123,0.12); color: var(--c-slate); }

    /* ============================================================
       CARD
       ============================================================ */
    .card {
      background: var(--c-white);
      border: 1px solid var(--c-border);
      border-radius: var(--r-lg);
      overflow: hidden;
    }
    .card-head {
      padding: 14px 18px;
      border-bottom: 1px solid var(--c-border-soft);
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .card-title { font-size: 14px; font-weight: 700; color: var(--c-navy); }
    .card-body { padding: 16px 18px; }
    .card-body.flush { padding: 0; }

    /* ============================================================
       INPUT / SELECT
       ============================================================ */
    .input, .select {
      height: 34px;
      background: var(--c-white);
      border: 1px solid var(--c-border);
      border-radius: var(--r);
      padding: 0 12px;
      font-size: 13px;
      color: var(--c-text);
      transition: all 0.15s;
      width: 100%;
    }
    .input::placeholder { color: var(--c-text-soft); }
    .input:focus, .select:focus {
      outline: none;
      border-color: var(--c-primary);
      box-shadow: 0 0 0 3px var(--c-primary-12);
    }
    label.required::after { content: ' *'; color: var(--c-danger); }

    /* ============================================================
       FORM GRID + FIELD (used in wizard + view drawer)
       ============================================================ */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
    .field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
    .field.full { grid-column: 1 / -1; }
    .lbl { font-size: 12px; font-weight: 500; color: var(--c-navy); display: block; }

    /* Read-only field display (in view drawer summary) */
    .field-readonly { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
    .lbl-readonly { font-size: 11px; color: var(--c-text-mute); font-weight: 500; }
    .val-readonly { font-size: 13px; color: var(--c-navy); font-weight: 500; line-height: 1.35; word-break: break-word; }

    /* Combobox dropdown */
    .suggest-list {
      position: absolute; top: calc(100% + 4px); left: 0; right: 0;
      background: white; border: 1px solid var(--c-border); border-radius: var(--r);
      box-shadow: var(--sh-md);
      max-height: 320px; overflow-y: auto; z-index: 60;
    }
    .suggest-list.hidden { display: none; }
    .combo-option { padding: 8px 14px; cursor: pointer; border-bottom: 1px solid var(--c-border-soft); transition: background 100ms; }
    .combo-option:last-child { border-bottom: none; }
    .combo-option:hover { background: var(--c-primary-04); }
    .combo-option .opt-primary { font-size: 13px; font-weight: 600; color: var(--c-navy); }
    .combo-option .opt-secondary { font-size: 11.5px; color: var(--c-text-mute); }
    .combo-option mark { background: rgba(255,59,48,0.15); color: var(--c-primary); padding: 0; font-weight: 700; }

    /* ============================================================
       TABS
       ============================================================ */
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--c-border); margin-bottom: 16px; }
    .tab {
      background: transparent; border: none;
      border-bottom: 2px solid transparent;
      padding: 8px 14px;
      font-size: 13px; font-weight: 500; color: var(--c-text-mute);
      cursor: pointer; margin-bottom: -1px;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .tab:hover { color: var(--c-text); }
    .tab.on { color: var(--c-primary); border-bottom-color: var(--c-primary); font-weight: 600; }

    /* ============================================================
       TABLE
       ============================================================ */
    .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
    .tbl th {
      text-align: left; padding: 10px 14px;
      font-size: 10.5px; font-weight: 700;
      color: var(--c-text-mute);
      background: var(--c-off-white);
      border-bottom: 1px solid var(--c-border);
      text-transform: uppercase; letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .tbl td {
      padding: 7px 12px;
      border-bottom: 1px solid var(--c-border-soft);
      color: var(--c-text);
      vertical-align: middle;
    }
    .tbl tbody tr { transition: background 0.1s; cursor: pointer; }
    .tbl tbody tr:hover { background: var(--c-off-white); }
    .tbl tbody tr:last-child td { border-bottom: none; }
    .tbl-name { font-weight: 600; color: var(--c-navy); }
    .tbl-meta { font-size: 11px; color: var(--c-text-mute); margin-top: 1px; }
    .tbl-mono { font-family: ui-monospace, monospace; font-size: 12px; }
    .tbl-num { font-variant-numeric: tabular-nums; text-align: right; }
    .tbl-th-sortable { cursor: pointer; user-select: none; }
    .tbl-th-sortable:hover { color: var(--c-text); }

    /* Progress bar */
    .progress-bar {
      width: 64px; height: 6px;
      background: var(--c-border-soft);
      border-radius: 999px;
      overflow: hidden;
      display: inline-block;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--c-teal);
      border-radius: 999px;
      transition: width 200ms;
    }
    .progress-bar-fill.pending { background: var(--c-warning); }
    .progress-bar-fill.zero { background: var(--c-border); }

    /* ============================================================
       STEPPER
       ============================================================ */
    .stepper { display: flex; align-items: flex-start; gap: 0; width: 100%; }
    .stepper-item {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      position: relative; min-width: 0;
    }
    .stepper-circle {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600;
      background: var(--c-white); color: var(--c-text-soft);
      border: 2px solid var(--c-border);
      transition: all 200ms; z-index: 2;
    }
    .stepper-item.active .stepper-circle {
      background: var(--c-primary); color: white; border-color: var(--c-primary);
      box-shadow: 0 0 0 4px var(--c-primary-12);
    }
    .stepper-item.done .stepper-circle {
      background: var(--c-primary); color: white; border-color: var(--c-primary);
    }
    .stepper-label {
      margin-top: 8px; font-size: 12px; font-weight: 500;
      color: var(--c-text-soft); text-align: center; line-height: 1.3;
      transition: color 200ms;
    }
    .stepper-item.active .stepper-label { color: var(--c-navy); font-weight: 600; }
    .stepper-item.done .stepper-label { color: var(--c-text-mute); }
    .stepper-item:not(:last-child)::after {
      content: ''; position: absolute;
      top: 15px; left: 50%; right: -50%; height: 2px;
      background: var(--c-border); z-index: 1;
    }
    .stepper-item.done:not(:last-child)::after { background: var(--c-primary); }

    /* ============================================================
       DRAWER + MODAL — Self-contained CSS (don't depend on Tailwind utilities)
       ============================================================ */
    .overlay-wrap { position: fixed; inset: 0; z-index: 50; }
    .backdrop { position: absolute; inset: 0; background-color: rgba(0,0,0,0.45); cursor: pointer; }
    .drawer-panel {
      position: absolute; right: 0; top: 0;
      height: 100%; width: 100%;
      max-width: 920px;
      background: white;
      box-shadow: var(--sh-xl);
      display: flex; flex-direction: column;
    }
    .drawer-panel.standard { max-width: 680px; }
    .modal-overlay {
      position: fixed; inset: 0; z-index: 60;
      display: flex; align-items: center; justify-content: center;
      padding: 16px;
    }
    .hidden { display: none !important; }

    .drawer-enter { transform: translateX(100%); }
    .drawer-active { transform: translateX(0); transition: transform 250ms ease-out; }

    @keyframes slide-in { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .animate-slide-in { animation: slide-in 200ms ease-out; }

    /* Slide-down animation for expandable line panel (Pattern E) */
    @keyframes line-expand-slide {
      from {
        opacity: 0;
        transform: translateY(-8px);
        max-height: 0;
      }
      to {
        opacity: 1;
        transform: translateY(0);
        max-height: 600px;
      }
    }
    @keyframes line-collapse-slide {
      from {
        opacity: 1;
        transform: translateY(0);
        max-height: 600px;
      }
      to {
        opacity: 0;
        transform: translateY(-8px);
        max-height: 0;
      }
    }
    .line-expand-panel {
      animation: line-expand-slide 220ms cubic-bezier(0.4, 0, 0.2, 1);
      transform-origin: top;
      overflow: hidden;
    }
    .line-collapse-panel {
      animation: line-collapse-slide 200ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
      transform-origin: top;
      overflow: hidden;
    }

    /* ============================================================
       UPLOAD ZONE
       ============================================================ */
    .upload-zone {
      border: 2px dashed var(--c-border);
      border-radius: var(--r-lg);
      padding: 32px 16px;
      text-align: center;
      background: #FDFBF8;
      cursor: pointer;
      transition: all 150ms;
    }
    .upload-zone:hover { border-color: var(--c-primary); background: var(--c-primary-08); }
    .upload-zone.has-files { padding: 16px; }

    /* ============================================================
       FORM GRID
       ============================================================ */
    .form-grp {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 14px 18px;
    }
    .form-field { display: flex; flex-direction: column; gap: 6px; }
    .form-field label {
      font-size: 12.5px; font-weight: 500; color: var(--c-navy);
      display: flex; align-items: center; gap: 4px;
    }
    .form-field-help {
      font-size: 11px; color: var(--c-text-soft);
      display: flex; align-items: center; gap: 4px;
    }

    /* Toggle */
    .toggle {
      position: relative; display: inline-block;
      width: 36px; height: 20px;
      flex-shrink: 0;
    }
    .toggle input { opacity: 0; width: 0; height: 0; }
    .toggle-slider {
      position: absolute; cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--c-border);
      border-radius: 20px;
      transition: 200ms;
    }
    .toggle-slider::before {
      position: absolute; content: '';
      height: 14px; width: 14px;
      left: 3px; bottom: 3px;
      background-color: white;
      border-radius: 50%;
      transition: 200ms;
    }
    .toggle input:checked + .toggle-slider { background-color: var(--c-primary); }
    .toggle input:checked + .toggle-slider::before { transform: translateX(16px); }

    /* Section divider for wizard step 2 */
    .section-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px;
      background: var(--c-off-white);
      border: 1px solid var(--c-border);
      border-radius: var(--r);
      margin-bottom: 10px;
    }
    .section-label { font-size: 13px; font-weight: 500; color: var(--c-navy); display: flex; align-items: center; gap: 8px; }

    mark { background: #FFF1DC; color: var(--c-navy); border-radius: 2px; padding: 0 2px; }
  
    /* ===== SO additions (PO idiom) ===== */
    .drawer-panel.wide { max-width: 1290px; }
    .emp-chip{display:inline-flex;align-items:center;gap:8px;min-width:0;}
    .emp-av{width:28px;height:28px;border-radius:50%;background:var(--c-navy);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;flex-shrink:0;}
    .emp-chip.is-empty .emp-av{background:var(--c-off-white);color:var(--c-text-soft);border:1px dashed var(--c-border);}
    .emp-t{display:flex;flex-direction:column;line-height:1.25;min-width:0;}
    .emp-r{font-size:10.5px;color:var(--c-text-mute);font-weight:600;white-space:nowrap;}
    .emp-n{font-size:12.8px;font-weight:600;color:var(--c-navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .emp-chip.sm .emp-av{width:22px;height:22px;font-size:9.5px;} .emp-chip.sm .emp-n{font-size:12px;}
    .slot-row{display:grid;grid-template-columns:34px 200px 1fr;gap:12px;align-items:start;padding:12px 14px;border:1px solid var(--c-border);border-radius:var(--r);background:#fff;}
    .slot-row+.slot-row{margin-top:10px;} .slot-row.is-err{border-color:var(--c-danger);}
    .slot-no{width:26px;height:26px;border-radius:50%;background:var(--c-navy);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center;margin-top:2px;}
    .slot-role{font-size:12px;font-weight:700;color:var(--c-navy);padding-top:6px;}
    .hard-warn{display:flex;align-items:flex-start;gap:8px;padding:10px 12px;margin-bottom:10px;border-radius:var(--r);background:rgba(230,46,36,0.08);border:1px solid rgba(230,46,36,0.25);font-size:12px;color:var(--c-danger);line-height:1.5;}
    .note{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:var(--r);background:var(--c-off-white);border:1px solid var(--c-border-soft);font-size:12.5px;color:var(--c-text);line-height:1.55;}
    .note.warn{background:var(--c-warning-08);border-color:rgba(232,135,15,.35);} .note.danger{background:var(--c-danger-08);border-color:rgba(230,46,36,.35);color:var(--c-danger);} .note.ok{background:var(--c-teal-08);border-color:rgba(31,157,85,.35);}
    .combo-pop{position:fixed;background:#fff;border:1px solid var(--c-border);border-radius:var(--r);box-shadow:var(--sh-lg);z-index:90;max-height:280px;overflow-y:auto;}
    .combo-pop button{width:100%;text-align:left;padding:8px 12px;background:transparent;border:0;cursor:pointer;border-bottom:1px solid var(--c-border-soft);display:flex;align-items:center;gap:10px;font-family:inherit;}
    .combo-pop button:hover,.combo-pop button.hi{background:var(--c-primary-08);}
    .combo-pop button:last-child{border-bottom:0;}
    .tl{display:flex;flex-direction:column;gap:0;}
    .tl-i{position:relative;padding:0 0 16px 22px;} .tl-i::before{content:'';position:absolute;left:5px;top:6px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--c-border);} .tl-i::after{content:'';position:absolute;left:9px;top:18px;bottom:0;width:1px;background:var(--c-border-soft);} .tl-i:last-child::after{display:none;}
    .tl-i.ok::before{background:var(--c-teal);border-color:var(--c-teal);} .tl-i.warn::before{background:var(--c-warning);border-color:var(--c-warning);} .tl-i.bad::before{background:var(--c-danger);border-color:var(--c-danger);}
    .tl-t{font-size:13px;font-weight:600;color:var(--c-navy);} .tl-s{font-size:11.5px;color:var(--c-text-mute);margin-top:2px;} .tl-q{font-size:12px;color:var(--c-text);background:var(--c-off-white);border-left:3px solid var(--c-border);padding:6px 10px;border-radius:0 6px 6px 0;margin-top:6px;}
    .kbd{font-family:ui-monospace,monospace;font-size:11px;background:var(--c-off-white);border:1px solid var(--c-border);border-radius:4px;padding:1px 6px;}
    .a4{background:#fff;box-shadow:var(--sh-lg);width:100%;max-width:720px;min-height:900px;padding:36px 40px;font-size:11px;color:#111;margin:0 auto;} .a4 table{width:100%;border-collapse:collapse;font-size:11px;} .a4 th{background:#f3f4f6;border:1px solid #d1d5db;padding:5px 6px;text-align:left;font-weight:700;} .a4 td{border:1px solid #d1d5db;padding:5px 6px;} .a4 .r{text-align:right;font-variant-numeric:tabular-nums;}

    .req{color:var(--c-danger);}
    .field.is-error .input,.field.is-error .select,.field.is-error textarea{border-color:var(--c-danger);}
    .field-error{font-size:11px;color:var(--c-danger);display:none;} .field.is-error .field-error{display:block;}
    .field-help{font-size:11px;color:var(--c-text-soft);}
    .persona{height:32px;border:1px solid var(--c-border);border-radius:var(--r);padding:0 28px 0 10px;font-size:12px;background:#fff;color:var(--c-navy);}
    .free-row td{background:var(--c-teal-08)!important;}

function openSoModal(code) { const so = SO_BY[code]; const g = gate(so); const st = soPickStatus(so); const picks = PICKS.filter(p => p.sos.includes(code)); closeModal(); modalShell(`<div class="card" style="position: relative; max-width: 760px; width: 100%; box-shadow: var(--sh-xl);"><div style="padding: 18px; border-bottom: 1px solid var(--c-border-soft); display: flex; align-items: flex-start; gap: 12px;"><div style="width: 40px; height: 40px; border-radius: 50%; background: var(--c-primary-08); display: grid; place-items: center; flex-shrink: 0;"><i data-lucide="shopping-cart" class="w-5 h-5" style="color: var(--c-primary);"></i></div><div style="flex:1;"><h3 style="font-size: 14px; font-weight: 700; color: var(--c-navy);">${so.code} · ${CUSTS[so.customer]} ${gatePill(so)}</h3><p style="font-size: 13px; margin-top: 4px; color: var(--c-text-mute);">ส่ง ${formatThaiDate(so.deliveryDate)} · ${so.method === 'pickup' ? 'ลูกค้ามารับเอง' : so.shipTo} · คลัง ${so.wh} · เงื่อนไข ${so.term} (Warehouse: ${{ immediate: 'ทันที', after_deposit: 'หลังมัดจำ', after_full: 'หลังชำระเต็ม' }[so.trigger]})${!g.ok ? ' · <span style="color:var(--c-danger);font-weight:600;">' + g.why + '</span>' : ''}</p></div><button onclick="closeModal()" class="top-icon-btn"><i data-lucide="x" class="w-4 h-4"></i></button></div>

// ---- ผู้หยิบ: search dropdown (avatar · ชื่อ · ตำแหน่ง · งานค้าง · badge เกิน) ----
const WORKLOAD_MAX = 4;
function workload(name) { return PICKS.filter(x => x.assignee === name && ['assigned', 'in_progress'].includes(x.status)).length; }
function assigneeCombo(key, value, onPick) { const e = value ? EMP_BY_NAME[value] : null; window.__cbPick = window.__cbPick || {}; window.__cbPick[key] = onPick; return `<div style="position: relative;">${e ? `<div style="display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border:1px solid var(--c-border);border-radius:var(--r);background:#fff;"><span class="emp-av" style="width:26px;height:26px;font-size:10px;">${e.initials}</span><div style="flex:1;min-width:0;"><div style="font-size:13px;font-weight:600;color:var(--c-navy);">${e.name}</div><div style="font-size:11px;color:var(--c-text-mute);">${e.role} · งานค้าง ${workload(e.name)}</div></div>${workload(e.name) >= WORKLOAD_MAX ? '<span class="pill rejected">เกิน</span>' : ''}<button class="btn btn-ghost sm" style="height:26px;padding:0 6px;" onclick="__cbPick['${key}']('')"><i data-lucide="x" class="w-3.5 h-3.5"></i></button></div>` : `<i data-lucide="search" class="w-3.5 h-3.5" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--c-text-soft);"></i><input type="text" id="cbi-${key}" autocomplete="off" placeholder="ค้นหาชื่อ / ตำแหน่ง / แผนก…" class="input" style="padding-left: 30px;" onfocus="cbOpen('${key}', '')" oninput="cbOpen('${key}', this.value)" onkeydown="cbKey(event, '${key}')">`}</div>`; }
const cbState = { key: null, list: [], hi: 0 };
function cbOpen(key, q) { document.querySelectorAll('.combo-pop').forEach(n => n.remove()); const input = document.getElementById('cbi-' + key); if (!input) return; q = (q || '').toLowerCase().trim(); cbState.key = key; cbState.list = PEOPLE.filter(p => p.role !== 'หัวหน้าคลัง' && (!q || (p.name + ' ' + p.role + ' ' + p.code).toLowerCase().includes(q))).map(p => ({ p, wl: workload(p.name) })).sort((a, b) => a.wl - b.wl); cbState.hi = 0; const rect = input.getBoundingClientRect(); const pop = document.createElement('div'); pop.className = 'combo-pop'; pop.id = 'combo-pop'; const up = window.innerHeight - rect.bottom < 300; pop.style.cssText = `left:${rect.left}px;width:${Math.max(rect.width, 340)}px;${up ? 'bottom:' + (window.innerHeight - rect.top + 2) + 'px;' : 'top:' + (rect.bottom + 2) + 'px;'}`; document.body.appendChild(pop); cbPaint(); const close = ev => { if (!pop.contains(ev.target) && ev.target !== input) { pop.remove(); document.removeEventListener('click', close); } }; setTimeout(() => document.addEventListener('click', close), 0); }
function cbPaint() { const pop = document.getElementById('combo-pop'); if (!pop) return; pop.innerHTML = cbState.list.length ? cbState.list.map((it, k) => `<button type="button" class="${k === cbState.hi ? 'hi' : ''}" onmousedown="event.preventDefault()" onclick="cbPick('${cbState.key}','${it.p.name}')"><span class="emp-av" style="width:32px;height:32px;font-size:11px;">${it.p.initials}</span><div style="flex:1;min-width:0;"><div style="font-size:13px;font-weight:600;color:var(--c-navy);display:flex;align-items:center;gap:6px;">${it.p.name}${it.wl === 0 ? ' <i data-lucide="star" class="w-3 h-3" style="color:var(--c-warning);"></i>' : ''}</div><div style="font-size:11px;color:var(--c-text-mute);">${it.p.role} · คลัง${WAREHOUSES['WH-01'].name.replace('คลัง', '')} · ${it.wl} งานค้าง</div></div>${it.wl >= WORKLOAD_MAX ? '<span class="pill rejected">เกิน</span>' : ''}</button>`).join('') : '<div style="padding:10px 12px;font-size:12px;color:var(--c-text-soft);">ไม่พบพนักงาน</div>'; renderIcons(); }
function cbKey(e, key) { if (cbState.key !== key || !document.getElementById('combo-pop')) return; if (e.key === 'ArrowDown') { cbState.hi = Math.min(cbState.hi + 1, cbState.list.length - 1); cbPaint(); e.preventDefault(); } else if (e.key === 'ArrowUp') { cbState.hi = Math.max(cbState.hi - 1, 0); cbPaint(); e.preventDefault(); } else if (e.key === 'Enter') { const it = cbState.list[cbState.hi]; if (it) cbPick(key, it.p.name); e.preventDefault(); } else if (e.key === 'Escape') { document.querySelectorAll('.combo-pop').forEach(n => n.remove()); e.stopPropagation(); } }
function cbPick(key, name) { document.querySelectorAll('.combo-pop').forEach(n => n.remove()); const fn = (window.__cbPick || {})[key]; if (fn) fn(name); }

function openCreateDrawer(from) { const codes = (from || '').split(',').filter(Boolean).filter(c => SO_BY[c] && gate(SO_BY[c]).ok && soRemaining(SO_BY[c]) > 0); if (!canManage()) { showToast('เฉพาะหัวหน้าคลังสร้างใบหยิบ', 'warning'); navigate('list'); return; } wiz.step = codes.length ? 2 : 1; wiz.data = { sos: codes, wh: codes.length ? SO_BY[codes[0]].wh : 'WH-01', strategy: 'AUTO', split: 'wave', assignee: '', equipment: EQUIPMENT[0], priority: codes.some(c => SO_BY[c].priority === 'high') ? 'high' : 'normal', note: '', lines: [] }; if (codes.length) recompute(); const overlay = document.getElementById('overlay-root'); overlay.innerHTML = `<div class="overlay-wrap"><div class="backdrop" onclick="closeCreateDrawer()"></div><div id="create-drawer" class="drawer-panel wide drawer-enter"><div id="create-drawer-content" style="display: flex; flex-direction: column; height: 100%;"></div></div></div>`; requestAnimationFrame(() => document.getElementById('create-drawer').classList.add('drawer-active')); renderCreateDrawer(); }
function closeCreateDrawer() { const d = document.getElementById('create-drawer'); if (d) { d.classList.remove('drawer-active'); d.classList.add('drawer-enter'); } setTimeout(() => { document.getElementById('overlay-root').innerHTML = ''; if (getRoute().name === 'create') navigate('list'); }, 200); }
function recompute() { const d = wiz.data; let acc = []; d.sos.forEach(c => { acc = acc.concat(allocateSO(SO_BY[c], 'AUTO', acc)); }); d.lines = routeSort(acc); }
function stepItem(n, label) { const s = wiz.step; const cls = s === n ? 'active' : s > n ? 'done' : ''; return `<div class="stepper-item ${cls}" ${s > n ? `onclick="wiz.step=${n}; renderCreateDrawer();" style="cursor:pointer;"` : ''}><div class="stepper-circle">${s > n ? '<i data-lucide="check" class="w-4 h-4"></i>' : n}</div><div class="stepper-label">${label}</div></div>`; }
const STEPH = (ico, title, hint) => `<div style="display: flex; align-items: center; gap: 8px; margin-bottom: ${hint ? '6px' : '14px'};"><i data-lucide="${ico}" class="w-4 h-4" style="color: var(--c-text-mute);"></i><div style="font-size: 13px; font-weight: 600; color: var(--c-navy);">${title}</div></div>${hint ? `<div style="font-size: 11.5px; margin-bottom: 18px; margin-left: 24px; color: var(--c-text-mute);"><i data-lucide="info" class="w-3 h-3 inline"></i> ${hint}</div>` : ''}`;
function renderCreateDrawer() { const c = document.getElementById('create-drawer-content'); if (!c) return; const s = wiz.step; const d = wiz.data;
  c.innerHTML = `<div style="padding: 18px 24px 16px; border-bottom: 1px solid var(--c-border-soft); flex-shrink: 0;"><div style="display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;"><div><div style="display: flex; align-items: center; gap: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--c-text-mute); margin-bottom: 4px;"><i data-lucide="file-plus" class="w-3.5 h-3.5"></i> สร้างเอกสารใหม่</div><h2 style="font-size: 20px; font-weight: 700; color: var(--c-navy);">สร้างใบหยิบสินค้า${d.sos.length > 1 ? ' (wave ' + d.sos.length + ' SO)' : d.sos.length ? ' — ' + d.sos[0] : ''}</h2></div><button onclick="closeCreateDrawer()" class="top-icon-btn"><i data-lucide="x" class="w-5 h-5"></i></button></div><div class="stepper" style="margin-top: 18px;">${stepItem(1, 'เลือกใบสั่งขาย')}${stepItem(2, 'มอบหมายงาน')}${stepItem(3, 'ตรวจสอบรายการหยิบ')}</div></div>

function step1() { const d = wiz.data; const rows = SOS.filter(s => gate(s).ok && ['queue', 'partial'].includes(soPickStatus(s)) && soRemaining(s) > 0); return `${STEPH('shopping-cart', 'เลือกใบสั่งขายที่พร้อมหยิบ', 'เลือกได้หลายใบในคลังเดียวกัน = ใบหยิบรวม (wave) · SO ที่รอชำระ/พัก/หยิบครบแล้ว ไม่แสดง')}<div class="card"><table class="tbl" style="font-size:12.5px;"><thead><tr><th style="width:36px;"></th><th>SO</th><th>ลูกค้า</th><th>คลัง</th><th>กำหนดส่ง</th><th style="text-align:right;">รายการ</th><th style="text-align:right;">คงเหลือต้องหยิบ</th><th style="text-align:center;">Priority</th></tr></thead><tbody>${rows.map(so => `<tr onclick="toggleSO('${so.code}')" style="cursor:pointer;${d.sos.includes(so.code) ? 'background:var(--c-primary-08);' : ''}"><td style="text-align:center;"><input type="checkbox" class="chk" ${d.sos.includes(so.code) ? 'checked' : ''} ${d.sos.length && !d.sos.includes(so.code) && SO_BY[d.sos[0]].wh !== so.wh ? 'disabled' : ''} onclick="event.stopPropagation(); toggleSO('${so.code}')"></td><td class="tbl-mono" style="font-weight:600;color:var(--c-primary);">${so.code}</td><td>${CUSTS[so.customer]}</td><td class="tbl-mono">${so.wh}</td><td>${formatThaiDate(so.deliveryDate)}</td><td class="tbl-num">${soPickable(so).length}</td><td class="tbl-num">${fmi(soRemaining(so))}</td><td style="text-align:center;">${pill(PRIO[so.priority][0], PRIO[so.priority][1])}</td></tr>`).join('') || '<tr><td colspan="8" style="padding:24px;text-align:center;color:var(--c-text-soft);">ไม่มี SO พร้อมหยิบ</td></tr>'}</tbody></table></div>`; }
function toggleSO(code) { const d = wiz.data; if (d.sos.includes(code)) d.sos = d.sos.filter(c => c !== code); else { if (d.sos.length && SO_BY[d.sos[0]].wh !== SO_BY[code].wh) return showToast('รวม wave ได้เฉพาะ SO คลังเดียวกัน', 'warning'); if (d.sos.length >= CFG.waveMax) return showToast('wave สูงสุด ' + CFG.waveMax + ' SO', 'warning'); d.sos.push(code); } if (d.sos.length) d.wh = SO_BY[d.sos[0]].wh; recompute(); renderCreateDrawer(); }

    <div class="card" style="margin-bottom:14px;"><div class="card-body" style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px 24px;font-size:13px;"><div><div style="font-size:11px;color:var(--c-text-soft);">ใบสั่งขาย</div><div style="font-weight:600;">${d.sos.join(', ')}</div><div class="tbl-meta">${WAREHOUSES[d.wh].name}</div></div><div><div style="font-size:11px;color:var(--c-text-soft);">บรรทัดหยิบ · ตำแหน่ง</div><div style="font-weight:600;">${d.lines.length} บรรทัด · ${locs} ตำแหน่ง</div></div><div><div style="font-size:11px;color:var(--c-text-soft);">กำหนดส่งเร็วสุด</div><div style="font-weight:600;">${formatThaiDate(d.sos.map(c => SO_BY[c].deliveryDate).sort()[0])}</div></div><div><div style="font-size:11px;color:var(--c-text-soft);">สต๊อกที่หยิบได้</div><div style="font-weight:600;color:${shortN ? 'var(--c-danger)' : 'var(--c-teal)'};">${shortN ? 'ขาด ' + shortN + ' บรรทัด' : 'ครบ'}</div></div></div></div>
    <div class="form-grid">

function confirmPickLine(pid, lid) { const p = findPick(pid); const l = p.lines.find(x => x.id === lid); const st = window.__pl; const q = Math.max(0, Math.min(l.qty - (l.picked || 0), st.qty)); const b = BAL.find(x => x.id === l.bal); if (q > 0) { b.on_hand -= q; b.alloc = Math.max(0, b.alloc - q); l.picked = (l.picked || 0) + q; MOVEMENTS.push({ type: 'pick', pid: l.pid, loc: l.loc, lot: l.lot, qty: -q, ref: p.code, so: l.so, by: ME.name, at: nowIso() }); const so = SO_BY[l.so]; const sl = so ? so.lines.find(x => x.id === l.soLine) : null; if (sl) sl.picked += q; } const remain = l.qty - (l.picked || 0);

function pickAllRemaining(pid) { const p = findPick(pid); p.lines.forEach(l => { if (l.status === 'picked' || !l.loc) return; const q = l.qty - (l.picked || 0); const b = BAL.find(x => x.id === l.bal); if (b && q > 0) { b.on_hand -= q; b.alloc = Math.max(0, b.alloc - q); l.picked = l.qty; const sl = SO_BY[l.so].lines.find(x => x.id === l.soLine); if (sl) sl.picked += q; MOVEMENTS.push({ type: 'pick', pid: l.pid, loc: l.loc, lot: l.lot, qty: -q, ref: p.code, so: l.so, by: ME.name, at: nowIso() }); } l.status = 'picked'; l.by = ME.name; l.at = nowIso(); }); pushAudit(p, 'บันทึกหยิบครบทุกบรรทัด (mock scan)'); showToast('หยิบครบทุกบรรทัด', 'success'); renderViewDrawer(); }
function openRelocModal(pid, lid, manual) { const p = pid === 'WIZ' ? wiz.data : findPick(pid); const l = p.lines.find(x => x.id === lid); const cands = candidatesFor(l.pid, p.wh, !!manual, l.bal); const other = Object.keys(WAREHOUSES).filter(w => w !== p.wh).map(w => ({ w, q: whAvail(l.pid, w) })).filter(x => x.q > 0); closeModal(); modalShell(`<div class="card" style="position: relative; max-width: 620px; width: 100%; box-shadow: var(--sh-xl);"><div style="padding: 18px; border-bottom: 1px solid var(--c-border-soft);"><h3 style="font-size: 14px; font-weight: 700; color: var(--c-navy);">เปลี่ยนตำแหน่ง/ล็อต — ${l.name} (${fmi(l.qty - (l.picked || 0))} ${PROD_BY[l.pid].uom})</h3><p style="font-size:12.5px;color:var(--c-text-mute);margin-top:4px;">${manual ? 'เลือกตำแหน่งเอง — ทุกตำแหน่งในคลังที่มีของ (รวม Hold/Staging · ต้องมีเหตุผล/audit)' : 'ตำแหน่งอื่นในคลังที่มีของหยิบได้ (เรียง ' + itemStrategy(l.pid) + ')'}${other.length ? ' · คลังอื่นมี: ' + other.map(x => x.w + ' ' + fmi(x.q)).join(', ') + ' (ขอโอน)' : ''}</p></div><div style="padding:0;">${cands.length ? `<table class="tbl" style="font-size:12.5px;"><thead><tr><th>ตำแหน่ง</th><th>ประเภท</th><th>ล็อต · หมดอายุ</th><th style="text-align:right;">หยิบได้</th><th></th></tr></thead><tbody>${cands.map(b => `<tr><td class="tbl-mono" style="font-weight:600;">${LOCATIONS[b.loc].code}<div class="tbl-meta">${locPath(LOCATIONS[b.loc])}</div></td><td>${typeLabel(LOCATIONS[b.loc].type)}${['HOLD', 'STAGING', 'PACK'].includes(LOCATIONS[b.loc].type) ? ' <span class="pill pending">ไม่ใช่ตำแหน่งหยิบ</span>' : ''}</td><td>${b.lot || '-'}${b.exp ? '<div class="tbl-meta">' + formatThaiDate(b.exp) + '</div>' : ''}</td><td class="tbl-num">${fmi(avail(b))}</td><td style="text-align:right;"><button class="btn btn-secondary sm" onclick="confirmReloc('${pid}','${lid}','${b.id}')">ใช้ตำแหน่งนี้</button></td></tr>`).join('')}</tbody></table>` : `<div style="padding:24px;text-align:center;color:var(--c-text-soft);">ไม่มีตำแหน่งในคลังนี้ที่มีของ${!manual ? ' — ลอง <a href="#" onclick="event.preventDefault(); openRelocModal(\'${pid}\',\'${lid}\', true)" style="color:var(--c-primary);font-weight:600;">เลือกตำแหน่งเอง (รวม Hold/Staging)</a>' : ''} · ขอเติม Pick Face / โอนจากคลังอื่น / รอ GRN</div>`}</div><div style="padding: 12px 18px; background: var(--c-off-white); border-top: 1px solid var(--c-border-soft); display: flex; justify-content: flex-end; gap: 8px; border-radius: 0 0 var(--r-lg) var(--r-lg);"><button onclick="closeModal()" class="btn btn-ghost">ปิด</button></div></div>`); }
function confirmReloc(pid, lid, bid) { const isWiz = pid === 'WIZ'; const p = isWiz ? wiz.data : findPick(pid); const l = p.lines.find(x => x.id === lid); const nb = BAL.find(x => x.id === bid); const remain = l.qty - (l.picked || 0); const take = Math.min(remain, avail(nb)); const ob = l.bal && !isWiz ? BAL.find(x => x.id === l.bal) : null; if (ob) ob.alloc = Math.max(0, ob.alloc - remain); if (l.picked) { p.lines.push(Object.assign({}, l, { id: uid('PL'), qty: remain, picked: 0, status: 'pending', bal: nb.id, loc: nb.loc, lot: nb.lot, exp: nb.exp, note: 'ย้ายจาก ' + (ob ? LOCATIONS[ob.loc].code : '-') })); l.qty = l.picked; l.status = 'picked'; nb.alloc += take; } else { l.bal = nb.id; l.loc = nb.loc; l.lot = nb.lot; l.exp = nb.exp; l.status = 'pending'; l.note = 'เปลี่ยนตำแหน่ง'; nb.alloc += take; if (take < remain) { l.qty = take; p.lines.push(Object.assign({}, l, { id: uid('PL'), qty: remain - take, bal: null, loc: null, lot: null, exp: null, status: 'short', note: 'ยังขาด — รอเติม' })); } } p.lines = routeSort(p.lines); if (isWiz) { if (nb) nb.alloc -= take; closeModal(); showToast('เปลี่ยนตำแหน่งแล้ว (จองจริงเมื่อบันทึก)', 'success'); renderCreateDrawer(); return; } pushAudit(p, `เปลี่ยนตำแหน่ง ${l.name} → ${LOCATIONS[nb.loc].code}${nb.lot ? ' ล็อต ' + nb.lot : ''}`, 'override รายบรรทัด'); closeModal(); showToast('เปลี่ยนตำแหน่งแล้ว', 'success'); renderViewDrawer(); }
function finishPick(id) { const p = findPick(id); p.status = 'picked'; p.pickedAt = nowIso(); const pr = pickProgress(p); pushAudit(p, `หยิบครบ ${pr.doneLines}/${pr.lines} บรรทัด (${fmi(pr.done)} หน่วยฐาน)${pr.shortN ? ' · ขาด ' + pr.shortN + ' บรรทัด' : ''}`, 'ENG-NOTIFY pick.done'); showToast('หยิบครบ — พร้อมส่งต่อ Packing', 'success'); renderViewDrawer(); }
function toPack(id) { const p = findPick(id); p.status = 'to_pack'; p.packRef = 'PACK-2026-' + String(456 + PICKS.filter(x => x.packRef).length + Math.floor(Math.random() * 20)).padStart(4, '0'); p.sos.forEach(c => { const so = SO_BY[c]; if (so && soPickStatus(so) === 'done') so.status = 'picked'; }); pushAudit(p, `ส่งต่อ Packing ${p.packRef}${p.sos.length > 1 ? ' (แยกต่อ SO)' : ''}`, 'Packing → DN · SO สถานะจัดส่ง'); showToast(`ส่งต่อ Packing ${p.packRef} (mock)`, 'success'); renderViewDrawer(); }
function openHoldModal(id) { const p = findPick(id); reasonModal(`พักงานหยิบ ${p.code}`, 'pause', 'var(--c-warning)', 'var(--c-warning-08)', 'การจองตำแหน่งยังคงไว้ · หยิบต่อได้ภายหลัง', '', 'พัก', 'btn-primary', r => { p.status = 'on_hold'; p.holdReason = r; pushAudit(p, 'พักงานหยิบ', r); closeModal(); renderViewDrawer(); }); }
function resumePick(id) { const p = findPick(id); p.status = 'in_progress'; p.holdReason = ''; pushAudit(p, 'หยิบต่อ'); renderViewDrawer(); }
function openCancelModal(id) { const p = findPick(id); reasonModal(`ยกเลิกใบหยิบ ${p.code}?`, 'x-circle', 'var(--c-danger)', 'var(--c-danger-08)', 'ปล่อยการจองตำแหน่ง · SO กลับเข้าคิวหยิบ · ย้อนกลับไม่ได้', '', 'ยืนยันยกเลิก', 'btn-danger', r => { p.lines.forEach(l => { if (l.bal && l.status !== 'picked') { const b = BAL.find(x => x.id === l.bal); if (b) b.alloc = Math.max(0, b.alloc - (l.qty - (l.picked || 0))); } }); p.status = 'cancelled'; p.cancel = { by: ME.name, at: nowIso(), reason: r }; pushAudit(p, 'ยกเลิกใบหยิบ · ปล่อยจองตำแหน่ง · SO กลับเข้าคิว', r); closeModal(); showToast('ยกเลิกแล้ว', 'success'); renderViewDrawer(); }); }

function openShortCloseModal(id) { const p = findPick(id); const rem = p.lines.filter(l => l.status !== 'picked'); reasonModal(`ปิดงานแบบขาด ${p.code}`, 'scissors', 'var(--c-warning)', 'var(--c-warning-08)', `บรรทัดที่ยังไม่ครบ ${rem.length} บรรทัด จะถูกปิดเป็น "ขาด" · ปล่อยจองตำแหน่ง · SO backorder + แจ้ง Sales/เติมสต๊อก · ส่งต่อ Packing เฉพาะที่หยิบได้`, '', 'ปิดงานแบบขาด', 'btn-primary', r => { rem.forEach(l => { const remain = l.qty - (l.picked || 0); if (l.bal) { const b = BAL.find(x => x.id === l.bal); if (b) b.alloc = Math.max(0, b.alloc - remain); } const so = SO_BY[l.so]; const sl = so.lines.find(x => x.id === l.soLine); if (sl && remain > 0) { sl.reserved -= remain; sl.backorder += remain; } l.qty = l.picked || 0; l.status = l.picked ? 'picked' : 'short'; l.note = 'ปิดขาด ' + fmi(remain); }); p.status = 'picked'; p.pickedAt = nowIso(); pushAudit(p, `ปิดงานแบบขาด — ${rem.length} บรรทัด → SO backorder`, r + ' · ENG-NOTIFY pick.short_close'); closeModal(); showToast('ปิดงานแบบขาดแล้ว — พร้อมส่ง Packing', 'success'); renderViewDrawer(); }); }

function refreshOne(pid, lid) { const p = pid === 'WIZ' ? wiz.data : findPick(pid); const l = p.lines.find(x => x.id === lid); const ok = refreshLine(p, l); p.lines = routeSort(p.lines); if (pid !== 'WIZ') { if (ok) pushAudit(p, `หาตำแหน่งใหม่ ${l.name} → ${LOCATIONS[l.loc].code}${l.lot ? ' ล็อต ' + l.lot : ''} · จองระดับตำแหน่ง (allocated) ${fmi(l.qty - (l.picked || 0))}`, 'Inventory allocation · ' + l.so); renderViewDrawer(); } else renderCreateDrawer(); showToast(ok ? `พบสต๊อกแล้ว → จองที่ ${LOCATIONS[l.loc].code} (hard allocate)` : 'ยังไม่มีสต๊อกที่หยิบได้ — ขอเติม/โอน หรือรอ GRN แล้วกดหาใหม่', ok ? 'success' : 'warning'); }
function refreshAll(pid) { const p = pid === 'WIZ' ? wiz.data : findPick(pid); let n = 0; p.lines.filter(l => l.status === 'short' && !l.loc).forEach(l => { if (refreshLine(p, l)) n++; }); p.lines = routeSort(p.lines); if (pid !== 'WIZ') { if (n) pushAudit(p, `จัดสรรใหม่ — พบตำแหน่ง ${n} บรรทัด · จองระดับตำแหน่ง`, 'Inventory allocation'); renderViewDrawer(); } else renderCreateDrawer(); showToast(n ? `จัดสรรใหม่ได้ ${n} บรรทัด (hard allocate)` : 'ยังไม่มีสต๊อกที่หยิบได้', n ? 'success' : 'warning'); }
function requestReplenish(pid, lid) { const p = pid === 'WIZ' ? wiz.data : findPick(pid); const shorts = p.lines.filter(l => l.status === 'short' && !l.loc && (!lid || l.id === lid)); const items = Array.from(new Set(shorts.map(l => l.pid))).map(pid2 => ({ p: PROD_BY[pid2], need: shorts.filter(l => l.pid === pid2).reduce((s, l) => s + l.qty - (l.picked || 0), 0), other: Object.keys(WAREHOUSES).filter(w => w !== p.wh).map(w => ({ w, q: whAvail(pid2, w) })).filter(x => x.q > 0), reserve: BAL.filter(b => b.pid === pid2 && locWh(LOCATIONS[b.loc]) === p.wh && !['PICK_FACE'].includes(LOCATIONS[b.loc].type) && avail(b) > 0).reduce((s, b) => s + avail(b), 0) })); closeModal(); modalShell(`<div class="card" style="position: relative; max-width: 620px; width: 100%; box-shadow: var(--sh-xl);"><div style="padding: 18px; border-bottom: 1px solid var(--c-border-soft);"><h3 style="font-size: 14px; font-weight: 700; color: var(--c-navy);">ขอเติม Pick Face / โอนจากคลังอื่น</h3><p style="font-size:12.5px;color:var(--c-text-mute);margin-top:4px;">สร้างงานให้ Inventory (Replenishment / Transfer) — ใบหยิบนี้กด "หาใหม่" เมื่อของเข้าแล้ว</p></div><div style="padding:0;"><table class="tbl" style="font-size:12.5px;"><thead><tr><th>สินค้า</th><th style="text-align:right;">ขาด</th><th style="text-align:right;">Reserve/Bulk ในคลัง</th><th>คลังอื่น</th><th>งานที่จะสร้าง</th></tr></thead><tbody>${items.map(x => `<tr><td style="font-weight:600;">${x.p.name}<div class="tbl-meta">${x.p.code}</div></td><td class="tbl-num">${fmi(x.need)} ${x.p.uom}</td><td class="tbl-num">${fmi(x.reserve)}</td><td>${x.other.length ? x.other.map(o => o.w + ' ' + fmi(o.q)).join(', ') : '-'}</td><td>${x.reserve > 0 ? '<span class="pill pending">เติม Pick Face</span>' : x.other.length ? '<span class="pill sent">โอนระหว่างคลัง</span>' : '<span class="pill rejected">รอ GRN / แจ้ง Sales</span>'}</td></tr>`).join('')}</tbody></table></div><div style="padding: 12px 18px; background: var(--c-off-white); border-top: 1px solid var(--c-border-soft); display: flex; justify-content: flex-end; gap: 8px; border-radius: 0 0 var(--r-lg) var(--r-lg);"><button onclick="closeModal()" class="btn btn-ghost">ปิด</button><button onclick="closeModal(); showToast('สร้างงานเติม/โอนแล้ว (Inventory) — ENG-NOTIFY inv.replenish_request', 'success'); ${pid !== 'WIZ' ? `pushAudit(findPick('${pid}'), 'ขอเติม Pick Face / โอนจากคลังอื่น สำหรับบรรทัดที่ขาด', 'Inventory: replenishment/transfer task'); renderViewDrawer();` : ''}" class="btn btn-primary"><i data-lucide="arrow-down-to-line" class="w-4 h-4"></i><span>สร้างงานเติม/โอน</span></button></div>
    <div style="padding: 10px 18px; border-top: 1px dashed var(--c-border); background: #fff; display:flex; align-items:center; gap:10px; font-size:12px; color:var(--c-text-mute); border-radius: 0 0 var(--r-lg) var(--r-lg);"><i data-lucide="flask-conical" class="w-3.5 h-3.5"></i><span style="flex:1;">เดโม: จำลองว่า Inventory เติม/รับเข้าแล้ว (putaway เข้า Reserve) → กลับมากด <strong>หาใหม่</strong> ระบบจะจองตำแหน่งให้อัตโนมัติ</span><button class="btn btn-secondary sm" onclick="mockInbound('${pid}','${lid || ''}')"><i data-lucide="package-check" class="w-3.5 h-3.5"></i><span>จำลองของเข้า</span></button></div></div>`); }
function mockInbound(pid, lid) { const p = pid === 'WIZ' ? wiz.data : findPick(pid); const shorts = p.lines.filter(l => l.status === 'short' && !l.loc && (!lid || l.id === lid)); if (!shorts.length) return closeModal(); const added = []; Array.from(new Set(shorts.map(l => l.pid))).forEach(pid2 => { const need = shorts.filter(l => l.pid === pid2).reduce((s, l) => s + l.qty - (l.picked || 0), 0); const prod = PROD_BY[pid2]; const loc = prod.cold ? 'L013' : 'L013'; const lot = prod.lot ? 'LOT-2608N1' : null; const exp = prod.lot ? '2026-11-15' : null; const ex = BAL.find(b => b.pid === pid2 && b.loc === loc && b.lot === lot); if (ex) ex.on_hand += need; else bal(pid2, loc, need, lot, exp); MOVEMENTS.push({ type: 'putaway', pid: pid2, loc, lot, qty: need, ref: 'GRN-2026-0431', by: 'สมชาย ใจดี', at: nowIso() }); added.push(prod.name + ' +' + fmi(need) + ' → ' + LOCATIONS[loc].code); }); closeModal(); showToast('Inventory รับเข้า/เติมแล้ว: ' + added.join(', ') + ' — กด "หาใหม่" หรือ "จัดสรรใหม่"', 'info'); if (pid !== 'WIZ') { pushAudit(p, 'Inventory แจ้งของเข้า (GRN-2026-0431 · putaway) สำหรับสินค้าที่ขาด', 'ENG-NOTIFY inv.replenished · กดหาใหม่เพื่อจอง'); renderViewDrawer(); } else renderCreateDrawer(); }

  </script>
