// ============================================================
// DELETE / DEACTIVATE / PICKER (modals — Pattern D)
// ============================================================
function attemptDelete(id){
  const r = findRec(id);
  if(r.used>0) openModal('deleteBlock', { id:id });   // FN-06 — ใช้แล้วลบไม่ได้
  else openModal('deleteConfirm', { id:id });
}
function confirmDeactivate(id){ openModal('deactivate', { id:id }); }

function doDelete(id){
  state.records = state.records.filter(function(r){ return r.id!==id; });
  closeModal();
  if(state.drawer.open) closeDrawer();
  setTimeout(function(){ render(); showToast('ลบรหัสภาษีแล้ว','success'); }, 220);
}
function doArchive(id){
  const r = findRec(id);
  r.status = 'inactive';
  if(!r.effEnd) r.effEnd = TODAY;
  r.audit.unshift({ ts:TODAY+'T09:00', actor:'สุนิสา (บัญชี)', action:'ปิดใช้งาน (soft archive) — ไม่แสดงในเอกสารใหม่' });
  closeModal();
  if(state.drawer.open) closeDrawer();
  setTimeout(function(){ render(); showToast('ปิดใช้งานรหัสภาษีแล้ว','success'); }, 220);
}

function renderModal(){
  const t = state.modal.type;
  const d = state.modal.data || {};
  if(t==='deleteConfirm'){
    const r = findRec(d.id);
    return ''
    + '<div class="modal-header"><div class="modal-header-icon is-danger"><i data-lucide="trash-2" class="w-4 h-4"></i></div>'
    +   '<div><h3 class="modal-title">ลบรหัสภาษี?</h3><p class="modal-subtitle">ต้องการลบ "'+r.code+' · '+r.name+'" ใช่หรือไม่ การลบไม่สามารถย้อนกลับได้</p></div></div>'
    + '<div class="modal-body"><div class="tc-note is-info"><i data-lucide="info" class="w-3.5 h-3.5"></i><div>รหัสนี้ยังไม่ถูกใช้ในเอกสารใด จึงลบออกจากระบบได้</div></div></div>'
    + '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">ยกเลิก</button><button class="btn btn-danger" onclick="doDelete(\''+r.id+'\')"><i data-lucide="trash-2" class="w-4 h-4"></i><span>ลบ</span></button></div>';
  }
  if(t==='deleteBlock'){
    const r = findRec(d.id);
    return ''
    + '<div class="modal-header"><div class="modal-header-icon is-warning"><i data-lucide="shield-alert" class="w-4 h-4"></i></div>'
    +   '<div><h3 class="modal-title">ลบไม่ได้ — รหัสถูกใช้แล้ว</h3><p class="modal-subtitle">"'+r.code+'" ถูกอ้างอิงใน '+fmtNumber(r.used)+' เอกสาร จึงลบไม่ได้ (BR-05) เพื่อรักษาความถูกต้องของเอกสารและรายงานภาษีย้อนหลัง</p></div></div>'
    + '<div class="modal-body"><div class="tc-note"><i data-lucide="archive" class="w-4 h-4"></i><div>ทางเลือก: <strong>ปิดใช้งาน (soft archive)</strong> — รหัสจะหายจากตัวเลือกในเอกสารใหม่ แต่เอกสารเดิมยังคำนวณและออกรายงานได้ตามปกติ</div></div></div>'
    + '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">ปิด</button><button class="btn btn-danger" onclick="doArchive(\''+r.id+'\')"><i data-lucide="power" class="w-4 h-4"></i><span>ปิดใช้งานแทน</span></button></div>';
  }
  if(t==='deactivate'){
    const r = findRec(d.id);
    return ''
    + '<div class="modal-header"><div class="modal-header-icon is-warning"><i data-lucide="power" class="w-4 h-4"></i></div>'
    +   '<div><h3 class="modal-title">ปิดใช้งานรหัสภาษี?</h3><p class="modal-subtitle">"'+r.code+'" จะไม่แสดงในตัวเลือกของเอกสารใหม่ เอกสารเดิมที่อ้างอิงอยู่ยังใช้งานได้ตามปกติ</p></div></div>'
    + '<div class="modal-body"><div class="tc-note is-info"><i data-lucide="info" class="w-3.5 h-3.5"></i><div>สามารถเปิดใช้งานใหม่ได้ภายหลังจากหน้าแก้ไข</div></div></div>'
    + '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">ยกเลิก</button><button class="btn btn-danger" onclick="doArchive(\''+r.id+'\')"><i data-lucide="power" class="w-4 h-4"></i><span>ปิดใช้งาน</span></button></div>';
  }
  if(t==='picker'){
    const vat = state.records.filter(function(r){ return r.family==='VAT' && isPickable(r); });
    const wht = state.records.filter(function(r){ return r.family==='WHT' && isPickable(r); });
    const rowHtml = function(r){ return '<div class="pick-row"><div><span class="pick-code">'+r.code+'</span> · '+r.name+'</div><span class="pick-rate">'+rateLabel(r)+'</span></div>'; };
    const hidden = state.records.filter(function(r){ return !isPickable(r); }).length;
    return ''
    + '<div class="modal-header"><div class="modal-header-icon"><i data-lucide="list-checks" class="w-4 h-4"></i></div>'
    +   '<div><h3 class="modal-title">ตัวเลือกในเอกสารใหม่</h3><p class="modal-subtitle">เฉพาะรหัสสถานะ “ใช้งาน” และอยู่ในช่วงวันมีผล ณ '+fmtDate(TODAY)+'</p></div></div>'
    + '<div class="modal-body">'
    +   '<div class="pick-group-title">VAT</div>'+ (vat.length?vat.map(rowHtml).join(''):'<div class="used-none">— ไม่มี —</div>')
    +   '<div class="pick-group-title">WHT</div>'+ (wht.length?wht.map(rowHtml).join(''):'<div class="used-none">— ไม่มี —</div>')
    +   '<div class="tc-note is-info" style="margin-top:14px"><i data-lucide="eye-off" class="w-4 h-4"></i><div>ซ่อนจากตัวเลือก '+hidden+' รหัส (ร่าง / ปิดใช้งาน / พ้นวันมีผล) — ยังใช้กับเอกสารเดิมได้</div></div>'
    + '</div>'
    + '<div class="modal-footer"><button class="btn btn-secondary" onclick="closeModal()">ปิด</button></div>';
  }
  return '';
}
</script>
